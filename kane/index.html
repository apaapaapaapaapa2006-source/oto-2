<title>KANE ─ 撞いて、掌で止める</title>
<meta name="description" content="霧の中に吊られた五つの梵鐘。手を速く振り抜くと撞き、鳴っている鐘に掌をかざすと止まる。倍音は整数比ではなく本物の鐘の比で、二本ずつわずかにずらしてあるので唸りが立つ。その唸りがそのまま輪になって見える。">
<meta name="theme-color" content="#0b131c">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  ══════════════════════════════════════════════════════════════════════════
  KANE ─ 撞いて、掌で止める                       ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   夜   yoru      #0b131c  the air before dawn, never pure black
            緑青 rokusho   #4f8f7d  the bronze. old, wet, slightly green
            金泥 kindei    #d7a94b  the rim, the strike, the 撞座
            霧   kiri      #9fb3bd  fog, and every word on screen
            紫暁 shigyo    #6b5f8f  the damping halo — the only cool accent
            MOOD: a temple yard maybe twenty minutes before sunrise. Damp,
            still, low contrast. Nothing in this piece is bright except the
            instant of a strike; the rest is bronze against fog. This is the
            gallery's one dark piece tonight, and it earns it — the whole
            subject is a sound decaying in the dark.
  BACKGROUND  Four bands of drifting fog over a vertical night gradient,
            with a low moon disc behind them. No vignette, no orbs. The fog
            bands are sine-warped and move at different speeds so the depth
            reads without any blur filter. The camera is composited in
            'lighter' at 7% so the player appears as if lit by the moon.
  TYPE      Shippori Mincho throughout, and only that — 700 for the bell
            names set very small and widely tracked, 500 for everything
            else. A 明朝 serif is the opposite of the mono and gothic used
            elsewhere in the gallery, and it is the right voice for a bell.
  MOTION    Slow and heavy. Every transition is 600ms or longer with an
            ease-out; bells swing at about half a hertz and take ten seconds
            to still. Nothing in this piece snaps. The one fast thing is the
            strike flash, which is over in 90ms — and it reads as fast only
            because everything around it is so slow.
  SIGNATURE Real modal bell synthesis. Eight partials at a bell's actual
            inharmonic ratios (hum, prime, tierce, quint, nominal…), each
            one a PAIR of oscillators detuned by a fraction of a hertz —
            which is why a real cast bell throbs. Every partial therefore
            has its own beat frequency, and each is drawn as a ring whose
            radius breathes at exactly that rate. You watch the 唸り you are
            hearing. Damping with an open palm eats the high partials first,
            so the rings fall inward one by one and the tone darkens before
            it dies. Where you hit up the bell's profile sets the balance:
            at the 撞座 it speaks fully, near the shoulder it only hums.
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  DOM
// ═══════════════════════════════════════════════════════════════════════
var view    = document.getElementById('view');
var ctx     = view.getContext('2d');
var video   = document.getElementById('video');
var flipBtn = document.getElementById('flip');
var tuneBtn = document.getElementById('tune');
var errBox  = document.getElementById('err');
var veil    = document.getElementById('veil');
var startBtn= document.getElementById('startBtn');
var demoCv  = document.getElementById('demo');
var demoCtx = demoCv.getContext('2d');

var C = {
  night:'#0b131c', bronze:'#4f8f7d', gold:'#d7a94b',
  fog:'#9fb3bd', halo:'#6b5f8f'
};

function now(){
  return (window.performance && window.performance.now) ? window.performance.now() : Date.now();
}

// ═══════════════════════════════════════════════════════════════════════
//  SIZE
// ═══════════════════════════════════════════════════════════════════════
var W=1, H=1, DPR=1, U=1, portrait=false;
var bgCv=null, bgCtx=null;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth|0);
  H = Math.max(1, window.innerHeight|0);
  view.width  = Math.round(W*DPR);
  view.height = Math.round(H*DPR);
  view.style.width = W+'px';
  view.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  U = Math.min(W,H)/640;
  portrait = (W/H) < 0.85;
  layoutBells();
  buildBg();
}

function buildBg(){
  if (!bgCv){ bgCv = document.createElement('canvas'); bgCtx = bgCv.getContext('2d'); }
  if (!bgCtx) return;
  bgCv.width = Math.round(W*DPR); bgCv.height = Math.round(H*DPR);
  var p = bgCtx;
  p.setTransform(DPR,0,0,DPR,0,0);
  var g = p.createLinearGradient(0,0,0,H);
  g.addColorStop(0,   '#070d15');
  g.addColorStop(0.52,'#0d1722');
  g.addColorStop(1,   '#131d24');
  p.fillStyle = g; p.fillRect(0,0,W,H);
  // low moon, well off centre so it never reads as a vignette
  var mx = W*0.78, my = H*0.20, mr = Math.max(26, 46*U);
  var mg = p.createRadialGradient(mx,my,0, mx,my,mr*5);
  mg.addColorStop(0,   'rgba(200,214,222,0.16)');
  mg.addColorStop(0.14,'rgba(160,180,192,0.07)');
  mg.addColorStop(1,   'rgba(160,180,192,0)');
  p.fillStyle = mg; p.fillRect(0,0,W,H);
  p.fillStyle = 'rgba(214,224,230,0.20)';
  p.beginPath(); p.arc(mx,my,mr,0,Math.PI*2); p.fill();
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO — modal bell synthesis.
//
//  A cast bell is not harmonic.  Its partials sit at ratios that no series
//  of integers produces, the low ones ring for many seconds and the high
//  ones die in one, and — because no casting is perfectly round — each
//  partial is really TWO frequencies a fraction of a hertz apart.  That
//  fraction is the 唸り: the slow throb you hear in a temple bell.  Every
//  partial here is therefore a detuned pair, and every pair's beat rate is
//  handed to the renderer so the same throb can be drawn.
// ═══════════════════════════════════════════════════════════════════════
var AC = window.AudioContext || window.webkitAudioContext;
var ac=null, master=null, comp=null, wetIn=null, noiseBuf=null, airGain=null;

// ratio, relative gain, decay seconds at unit size, beat Hz at unit size
var PARTIALS = [
  { r:0.500, g:0.62, d:11.0, b:0.22 },   // hum
  { r:1.000, g:1.00, d: 8.5, b:0.34 },   // prime
  { r:1.190, g:0.68, d: 6.4, b:0.52 },   // tierce
  { r:1.505, g:0.48, d: 4.9, b:0.75 },   // quint
  { r:2.000, g:0.56, d: 3.6, b:1.05 },   // nominal
  { r:2.660, g:0.30, d: 2.4, b:1.45 },
  { r:3.350, g:0.20, d: 1.7, b:1.95 },
  { r:4.550, g:0.12, d: 1.1, b:2.60 }
];

function makeNoise(){
  if (!ac) return null;
  var len = Math.floor(ac.sampleRate*2);
  var b = ac.createBuffer(1, len, ac.sampleRate);
  var d = b.getChannelData(0);
  for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
  return b;
}

function initAudio(){
  if (ac || !AC) return;
  try { ac = new AC(); } catch(e){ ac = null; return; }

  comp = ac.createDynamicsCompressor();
  try {
    comp.threshold.value = -20; comp.knee.value = 26;
    comp.ratio.value = 8; comp.attack.value = 0.006; comp.release.value = 0.30;
  } catch(e){}
  master = ac.createGain(); master.gain.value = 0.72;
  master.connect(comp); comp.connect(ac.destination);

  // a cheap four-tap yard: enough space for a bell to sit in, no impulse
  wetIn = ac.createGain(); wetIn.gain.value = 0.34;
  var times = [0.113, 0.171, 0.233, 0.311], i;
  for (i=0;i<times.length;i++){
    var dl = ac.createDelay(1.0);
    dl.delayTime.value = times[i];
    var fb = ac.createGain(); fb.gain.value = 0.70;
    var lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2300;
    wetIn.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl);
    var out = ac.createGain(); out.gain.value = 0.42;
    lp.connect(out); out.connect(master);
  }

  // night air: a whisper of filtered noise, never above -46dB
  noiseBuf = makeNoise();
  if (noiseBuf){
    var src = ac.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    var bp = ac.createBiquadFilter();
    bp.type = 'lowpass'; bp.frequency.value = 430;
    airGain = ac.createGain(); airGain.gain.value = 0.010;
    src.connect(bp); bp.connect(airGain); airGain.connect(master);
    try { src.start(); } catch(e){}
  }
}
function resumeAudio(){ if (ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} } }

// one live voice per bell; striking a ringing bell layers a second and
// retires the first, which is what actually happens to a struck bell
function Voice(){ this.oscs=[]; this.g=null; this.lp=null; this.t0=0; this.dead=true; }

function stopVoice(v, fadeS){
  if (!v || v.dead || !ac) return;
  var t = ac.currentTime, i;
  try {
    if (v.g) {
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setValueAtTime(Math.max(0.0001, v.g.gain.value), t);
      v.g.gain.exponentialRampToValueAtTime(0.0001, t + fadeS);
    }
  } catch(e){}
  for (i=0;i<v.oscs.length;i++){
    try { v.oscs[i].stop(t + fadeS + 0.05); } catch(e){}
  }
  v.dead = true;
}

// hit: 0 at the shoulder, 1 at the mouth.  Low on the bell excites the
// nominal and above; high on it leaves little but the hum.
function strikeVoice(bell, vel, hit){
  if (!ac || !master) return null;
  var t = ac.currentTime;
  var v = new Voice();
  v.t0 = t;
  v.g  = ac.createGain();
  v.lp = ac.createBiquadFilter();
  v.lp.type = 'lowpass';
  v.lp.frequency.setValueAtTime(1200 + vel*9000, t);
  v.lp.frequency.exponentialRampToValueAtTime(Math.max(200, 700 + vel*1400), t + 1.4);
  v.lp.Q.value = 0.4;
  v.g.gain.value = 1;
  v.g.connect(v.lp);
  v.lp.connect(master);
  if (wetIn) v.lp.connect(wetIn);

  // Headroom: eight partials per bell, five bells, two hands.  All forty
  // partials in phase at once must still sit under unity before the
  // compressor, or the yard claps instead of rings.
  var amp = 0.05 + vel*0.13;
  var sizeK = bell.sizeK;
  var i, k;
  for (i=0;i<PARTIALS.length;i++){
    var P = PARTIALS[i];
    // how strongly this partial answers where the bell was struck
    var bias = (i <= 1) ? (1.25 - hit*0.35) : (0.45 + hit*0.95);
    var pg = P.g * bias * amp;
    if (pg < 0.0009) continue;
    var f0 = bell.freq * P.r;
    if (f0 > 14000) continue;
    var beat = P.b / sizeK;
    var dec  = P.d * sizeK;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(pg, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
    g.connect(v.g);
    for (k=0;k<2;k++){
      var o = ac.createOscillator();
      o.type = 'sine';
      var f = f0 + (k===0 ? -beat/2 : beat/2);
      if (!(f > 0) || !isFinite(f)) continue;
      o.frequency.setValueAtTime(f, t);
      o.connect(g);
      o.start(t);
      o.stop(t + dec + 0.2);
      v.oscs.push(o);
    }
  }
  // the wooden 撞木 itself: a short filtered knock, louder for a hard hit
  if (noiseBuf){
    var s = ac.createBufferSource(); s.buffer = noiseBuf;
    var bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = Math.min(6000, bell.freq*5.5);
    bp.Q.value = 0.7;
    var ng = ac.createGain();
    ng.gain.setValueAtTime(Math.max(0.0002, amp*0.55), t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
    s.connect(bp); bp.connect(ng); ng.connect(v.lp);
    s.start(t); s.stop(t+0.14);
  }
  v.dead = false;
  return v;
}

// Damping is not a fade-out.  A hand on a bell kills the short partials
// almost at once and the hum last, so the tone darkens as it dies — the
// lowpass does that, and the gain finishes it.
function applyDamp(v, damp){
  if (!v || v.dead || !ac) return;
  var t = ac.currentTime;
  var x = Math.max(0, Math.min(1, damp));
  if (!isFinite(x)) return;
  try {
    v.lp.frequency.setTargetAtTime(Math.max(90, 3200*Math.pow(1-x, 2.4) + 90), t, 0.10);
    v.g.gain.setTargetAtTime(Math.max(0.0008, 1 - x*0.985), t, 0.14);
  } catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  TUNINGS
// ═══════════════════════════════════════════════════════════════════════
var TUNINGS = [
  { name:'呂', label:'調べ・呂', f:[146.83, 164.81, 185.00, 220.00, 246.94] },
  { name:'律', label:'調べ・律', f:[146.83, 164.81, 196.00, 220.00, 261.63] },
  { name:'陰', label:'調べ・陰', f:[146.83, 155.56, 196.00, 220.00, 233.08] }
];
var tuneIx = 0;
var BELL_NAMES = ['一', '二', '三', '四', '五'];

// ═══════════════════════════════════════════════════════════════════════
//  BELLS
// ═══════════════════════════════════════════════════════════════════════
var bells = [];

function makeBells(){
  bells.length = 0;
  var i;
  for (i=0;i<5;i++){
    bells.push({
      i:i, name:BELL_NAMES[i],
      freq:TUNINGS[tuneIx].f[i],
      sizeK:1.28 - i*0.11,          // bigger bells ring longer and beat slower
      x:0, y:0, r:1, h:1,
      ang:0, angW:0,
      voice:null, ampBase:0, t0:-1e9, hit:0.5,
      damp:0, dampT:0, flash:0, lastStrike:-1e9,
      rings:[]
    });
  }
  layoutBells();
}

function layoutBells(){
  if (!bells.length) return;
  var i, n = bells.length;
  if (portrait){
    // three above, two below, so each bell keeps a usable size on a phone
    var rowsX = [[0.18,0.50,0.82],[0.34,0.66]];
    var rowsY = [0.31, 0.60];
    var idx = 0, ri, ci;
    for (ri=0; ri<rowsX.length; ri++){
      for (ci=0; ci<rowsX[ri].length; ci++){
        var b = bells[idx++];
        if (!b) break;
        b.x = W*rowsX[ri][ci];
        b.y = H*rowsY[ri];
        b.r = Math.min(W*0.135, H*0.088) * (1.10 - (idx-1)*0.05);
        b.h = b.r*2.35;
      }
    }
  } else {
    for (i=0;i<n;i++){
      var b2 = bells[i];
      b2.x = W*(0.13 + i*0.185);
      b2.y = H*0.34;
      b2.r = Math.min(W*0.072, H*0.108) * (1.14 - i*0.055);
      b2.h = b2.r*2.35;
    }
  }
}

function retune(){
  var i;
  for (i=0;i<bells.length;i++){
    bells[i].freq = TUNINGS[tuneIx].f[i];
  }
  tuneBtn.textContent = TUNINGS[tuneIx].label;
}

// analytic partial amplitude, so the drawing never needs an analyser
function partialAmp(b, i, t){
  if (b.t0 < -1e8) return 0;
  var age = (t - b.t0)/1000;
  if (age < 0) return 0;
  var P = PARTIALS[i];
  var dec = P.d * b.sizeK;
  var bias = (i <= 1) ? (1.25 - b.hit*0.35) : (0.45 + b.hit*0.95);
  var a = P.g * bias * b.ampBase * Math.exp(-age/(dec*0.36));
  // damping eats the short partials far faster than the hum
  var hiK = 1 - b.damp*(0.30 + 0.70*(i/(PARTIALS.length-1)));
  a *= Math.max(0, hiK);
  a *= Math.max(0, 1 - b.damp*0.985);
  return isFinite(a) ? a : 0;
}
function bellLoudness(b, t){
  var s = 0, i;
  for (i=0;i<PARTIALS.length;i++) s += partialAmp(b, i, t);
  return s;
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null, camOK=false;

function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display = 'block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:960 }, height:{ ideal:720 } },
    audio:false
  }).then(function(st){
    stream = st; video.srcObject = st; mirror = (facing === 'user'); camOK = true;
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing === 'user') ? 'environment' : 'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});
tuneBtn.addEventListener('click', function(){
  tuneIx = (tuneIx+1) % TUNINGS.length;
  retune();
  toast = { text: TUNINGS[tuneIx].label, t: now() };
});

// ═══════════════════════════════════════════════════════════════════════
//  HANDS — two of them.  Either hand can strike or damp; which one it is
//  doing is decided by speed and by whether the hand is open.
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var TRACK_GAP  = 0.14;    // s — a longer gap is a dropout, not motion
var TRACK_JUMP = 0.34;    // normalised — a longer step is a re-acquisition
var LOST_MS    = 360;

// A strike must be FAST and must actually cross the bell.  Hand-tracking
// jitter sits around 0.01–0.02 normalised units per frame, i.e. well under
// 1.0 units/s; the threshold is an order of magnitude above that, and the
// crossing test rejects the rest.
var STRIKE_V   = 1.35;    // normalised units / s
var DAMP_V     = 0.55;    // below this a hand is resting, not striking
var STRIKE_GAP = 260;     // ms per bell

var HANDS = [newHand(), newHand()];
function newHand(){
  return { live:false, t:-1e9, x:0.5, y:0.5, px:0.5, py:0.5,
           vx:0, vy:0, sp:0, open:0, lm:null, trail:[] };
}
function loseHand(h){
  h.live = false; h.lm = null;
  h.vx = 0; h.vy = 0; h.sp = 0;
  h.trail.length = 0;
}
function loseHands(){ loseHand(HANDS[0]); loseHand(HANDS[1]); }

function initHands(){
  if (typeof window.Hands !== 'function') return false;
  try {
    hands = new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady = true; return true;
  } catch(e){ return false; }
}
function startMpCamera(){
  if (!mpReady || !hands) return;
  if (mpCamera) return;
  if (typeof window.Camera !== 'function') return;
  try {
    mpCamera = new window.Camera(video, {
      onFrame: function(){
        if (!hands) return Promise.resolve();
        return hands.send({ image: video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  } catch(e){ mpCamera = null; }
}
function validLm(c){
  if (!c || c.length < 21) return null;
  for (var i=0;i<21;i++){
    var p = c[i];
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' ||
        !isFinite(p.x) || !isFinite(p.y)) return null;
  }
  return c;
}
var TIPS=[8,12,16,20], PIPS=[6,10,14,18];

function readHand(h, c, t){
  var ids=[0,5,9,13,17], cx=0, cy=0, i;
  for (i=0;i<ids.length;i++){
    var p = c[ids[i]];
    if (!p) return;
    cx += p.x; cy += p.y;
  }
  cx/=ids.length; cy/=ids.length;
  if (!isFinite(cx) || !isFinite(cy)) return;
  var x = mirror ? (1-cx) : cx, y = cy;
  if (!isFinite(x) || !isFinite(y)) return;

  var wr = c[0], ext = 0;
  for (i=0;i<4;i++){
    var a = c[TIPS[i]], b = c[PIPS[i]];
    if (!a || !b) continue;
    if (Math.hypot(a.x-wr.x, a.y-wr.y) > Math.hypot(b.x-wr.x, b.y-wr.y)*1.06) ext++;
  }

  var dt = h.live ? (t - h.t)/1000 : 0;
  var jump = h.live ? Math.hypot(x-h.x, y-h.y) : 0;
  // Differentiating across a dropout or a re-acquisition invents an enormous
  // velocity out of nothing, and here that would ring every bell it passed.
  var continuous = (h.live && dt > 0.004 && dt < TRACK_GAP && jump < TRACK_JUMP);
  h.px = h.live ? h.x : x;
  h.py = h.live ? h.y : y;
  if (continuous){
    var nvx = (x-h.x)/dt, nvy = (y-h.y)/dt;
    if (isFinite(nvx) && isFinite(nvy)){
      h.vx += (nvx-h.vx)*0.55;
      h.vy += (nvy-h.vy)*0.55;
    }
  } else {
    h.px = x; h.py = y;
    h.vx = 0; h.vy = 0;
  }
  h.sp = Math.hypot(h.vx, h.vy);
  if (!isFinite(h.sp)) h.sp = 0;
  h.x = x; h.y = y; h.t = t; h.live = true; h.lm = c;
  h.open += (ext/4 - h.open)*0.3;
  if (!isFinite(h.open)) h.open = 0;
  h.trail.unshift({ x:x, y:y });
  if (h.trail.length > 16) h.trail.pop();
}

function onHands(res){
  var t = now();
  var list = (res && res.multiHandLandmarks) ? res.multiHandLandmarks : null;
  var n = list ? Math.min(list.length, 2) : 0;
  var i;
  for (i=0;i<2;i++){
    var c = (i < n) ? validLm(list[i]) : null;
    if (c) readHand(HANDS[i], c, t);
    else if (HANDS[i].live && t - HANDS[i].t > LOST_MS) loseHand(HANDS[i]);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  INTERACTION
// ═══════════════════════════════════════════════════════════════════════
var toast = { text:'', t:-9 };
var started = false;

// distance from point p to segment ab, all in screen pixels
function segDist(px,py, ax,ay, bx,by){
  var dx = bx-ax, dy = by-ay;
  var L2 = dx*dx + dy*dy;
  var t = L2 > 1e-9 ? ((px-ax)*dx + (py-ay)*dy)/L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax+dx*t), py - (ay+dy*t));
}

function strike(b, vel, hit, t){
  if (t - b.lastStrike < STRIKE_GAP) return;
  b.lastStrike = t;
  var v = Math.max(0.08, Math.min(1, vel));
  b.hit = Math.max(0, Math.min(1, hit));
  b.damp = 0;
  b.ampBase = 0.05 + v*0.13;
  b.t0 = t;
  if (b.voice) stopVoice(b.voice, 0.25);
  b.voice = strikeVoice(b, v, b.hit);
  b.flash = 1;
  // the sideways shove comes from the hand's own direction, added by the
  // caller — a bell that is struck swings the way it was struck
  b.rings.push({ t0:t, v:v });
  if (b.rings.length > 4) b.rings.shift();
}

function stepInteraction(t, dt){
  var i, j;
  for (j=0;j<bells.length;j++){
    var b = bells[j];
    var wantDamp = 0;
    for (i=0;i<HANDS.length;i++){
      var h = HANDS[i];
      if (!h.live) continue;
      var hx = h.x*W, hy = h.y*H;
      var px = h.px*W, py = h.py*H;

      // ── strike: the hand's path this frame must cross the bell body
      if (h.sp > STRIKE_V){
        var d = segDist(b.x, b.y + b.h*0.42, px, py, hx, hy);
        // an ellipse-ish body: allow the full height, roughly the width
        var inside = (d < b.r*1.30) &&
                     (Math.abs(hx - b.x) < b.r*1.7 || Math.abs(px - b.x) < b.r*1.7);
        if (inside){
          // where up the profile the blow landed — 0 shoulder, 1 mouth
          var rel = (hy - (b.y - b.h*0.05)) / (b.h*1.05);
          var vel = Math.min(1, (h.sp - STRIKE_V)/2.4 + 0.30);
          strike(b, vel, Math.max(0, Math.min(1, rel)), t);
          b.angW += (h.vx > 0 ? 1 : -1) * vel * 1.5;
        }
      }

      // ── damp: an open, slow hand laid over a bell
      if (h.sp < DAMP_V && h.open > 0.55){
        var dd = Math.hypot(hx-b.x, hy-(b.y+b.h*0.45));
        if (dd < b.r*1.75){
          var near = 1 - dd/(b.r*1.75);
          wantDamp = Math.max(wantDamp, Math.min(1, near*1.5));
        }
      }
    }
    // damping ramps in over about a third of a second and releases slower
    var target = wantDamp;
    var k = (target > b.damp) ? (1 - Math.exp(-5.5*dt)) : (1 - Math.exp(-2.0*dt));
    b.damp += (target - b.damp)*k;
    if (!isFinite(b.damp)) b.damp = 0;
    if (b.damp > 0.002 && b.voice && !b.voice.dead) applyDamp(b.voice, b.damp);

    // swing: a heavy bell, about half a hertz, ten seconds to still
    var wn = 3.1;
    b.angW += -wn*wn*b.ang*dt;
    b.angW *= Math.exp(-0.42*dt);
    b.ang  += b.angW*dt;
    if (!isFinite(b.ang)){ b.ang = 0; b.angW = 0; }
    b.ang = Math.max(-0.30, Math.min(0.30, b.ang));

    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt*11);

    // retire a voice that has fallen below hearing
    if (b.voice && !b.voice.dead && bellLoudness(b, t) < 0.0016){
      stopVoice(b.voice, 0.4);
      b.voice = null;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAWING
// ═══════════════════════════════════════════════════════════════════════
function rgba(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  var al = Math.max(0, Math.min(1, a));
  if (!isFinite(al)) al = 0;
  return 'rgba(' + r + ',' + g + ',' + b + ',' + al.toFixed(3) + ')';
}

var fogT = 0;
function drawFog(dt){
  fogT += dt;
  var bands = 4, i;
  ctx.save();
  for (i=0;i<bands;i++){
    var yy = H*(0.30 + i*0.19);
    var amp = H*0.035*(1 + i*0.25);
    var sp  = 0.045 + i*0.028;
    var al  = 0.055 - i*0.006;
    var off = (fogT*sp*W*0.25) % (W*2);
    ctx.fillStyle = rgba(C.fog, al);
    ctx.beginPath();
    ctx.moveTo(-W, yy + amp*2);
    var x;
    for (x=-W; x<=W*2; x+=Math.max(12, 28*U)){
      var y2 = yy + Math.sin((x+off)*0.0042 + i*1.7)*amp
                  + Math.sin((x+off)*0.0011 + i*0.6)*amp*0.7;
      ctx.lineTo(x, y2);
    }
    ctx.lineTo(W*2, yy + amp*3.4);
    ctx.lineTo(-W, yy + amp*3.4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawGhost(){
  if (!camOK || !video || !video.videoWidth) return;
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.globalCompositeOperation = 'lighter';
  try { ctx.filter = 'grayscale(1) contrast(1.5) brightness(0.8)'; } catch(e){}
  var vw = video.videoWidth, vh = video.videoHeight;
  var s = Math.max(W/vw, H/vh);
  var dw = vw*s, dh = vh*s;
  if (mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
  try { ctx.drawImage(video, (W-dw)/2, (H-dh)/2, dw, dh); } catch(e){}
  try { ctx.filter = 'none'; } catch(e){}
  ctx.restore();
}

// half-profile of a 梵鐘, x out from the axis and y down from the crown,
// both as a fraction of (r, h)
var PROFILE = [
  [0.00,0.000],[0.30,0.020],[0.52,0.130],[0.63,0.330],
  [0.70,0.610],[0.78,0.870],[0.86,0.965],[0.90,1.000]
];

function bellPath(b, k){
  var i, p;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (i=1;i<PROFILE.length;i++){
    p = PROFILE[i];
    ctx.lineTo(p[0]*b.r*k, p[1]*b.h);
  }
  for (i=PROFILE.length-1;i>=0;i--){
    p = PROFILE[i];
    ctx.lineTo(-p[0]*b.r*k, p[1]*b.h);
  }
  ctx.closePath();
}

function drawBell(b, t){
  var loud = Math.min(1, bellLoudness(b, t)*2.6);
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.ang*0.5);

  // the beam and the hook it hangs from
  ctx.strokeStyle = rgba(C.fog, 0.16);
  ctx.lineWidth = Math.max(1, 1.4*U);
  ctx.beginPath(); ctx.moveTo(0, -b.h*0.30); ctx.lineTo(0, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -b.h*0.055, b.r*0.15, Math.PI, Math.PI*2); ctx.stroke();

  // body
  ctx.fillStyle = rgba('#122b2a', 0.72 + loud*0.10);
  bellPath(b, 1); ctx.fill();
  ctx.strokeStyle = rgba(C.bronze, 0.52 + loud*0.45);
  ctx.lineWidth = Math.max(1.1, 1.7*U);
  bellPath(b, 1); ctx.stroke();

  // 帯 — two horizontal bands
  ctx.strokeStyle = rgba(C.bronze, 0.30 + loud*0.30);
  ctx.lineWidth = Math.max(0.8, 1*U);
  var by1 = b.h*0.30, by2 = b.h*0.60, wx1 = b.r*0.62, wx2 = b.r*0.695;
  ctx.beginPath(); ctx.moveTo(-wx1, by1); ctx.lineTo(wx1, by1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-wx2, by2); ctx.lineTo(wx2, by2); ctx.stroke();

  // 乳 — the bosses in the upper band
  ctx.fillStyle = rgba(C.bronze, 0.34 + loud*0.30);
  var rows = 2, cols = 4, ri, ci;
  for (ri=0; ri<rows; ri++){
    for (ci=0; ci<cols; ci++){
      var bx = (-0.42 + ci*0.28)*b.r;
      var byy = (0.375 + ri*0.09)*b.h;
      ctx.beginPath(); ctx.arc(bx, byy, Math.max(0.9, b.r*0.035), 0, Math.PI*2); ctx.fill();
    }
  }

  // 撞座 — the lotus boss you are meant to hit
  var tzY = b.h*0.74;
  ctx.strokeStyle = rgba(C.gold, 0.30 + b.flash*0.7 + loud*0.25);
  ctx.lineWidth = Math.max(0.9, 1.2*U);
  ctx.beginPath(); ctx.arc(0, tzY, b.r*0.20, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, tzY, b.r*0.10, 0, Math.PI*2); ctx.stroke();

  // 駒の爪 — the gold rim
  ctx.strokeStyle = rgba(C.gold, 0.34 + loud*0.5);
  ctx.lineWidth = Math.max(1.2, 2*U);
  ctx.beginPath();
  ctx.moveTo(-b.r*0.90, b.h);
  ctx.quadraticCurveTo(0, b.h + b.h*0.035, b.r*0.90, b.h);
  ctx.stroke();

  // strike flash
  if (b.flash > 0.01){
    ctx.strokeStyle = rgba(C.gold, b.flash*0.85);
    ctx.lineWidth = Math.max(1.4, 3*U*b.flash);
    bellPath(b, 1 + b.flash*0.03); ctx.stroke();
  }

  // damping halo — a cool ring closing over the bell
  if (b.damp > 0.02){
    ctx.strokeStyle = rgba(C.halo, b.damp*0.55);
    ctx.lineWidth = Math.max(1, 2.2*U);
    ctx.beginPath();
    ctx.arc(0, b.h*0.45, b.r*(1.75 - b.damp*0.7), 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();

  // name
  ctx.save();
  ctx.fillStyle = rgba(C.fog, 0.30 + loud*0.35);
  ctx.font = '700 ' + Math.max(9, 11*U|0) + 'px "Shippori Mincho", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(b.name, b.x, b.y + b.h*1.12);
  ctx.restore();
}

// The rings ARE the partials.  Ring i sits at a radius set by that
// partial's frequency and breathes at that partial's beat rate, which is
// the same throb the ear is hearing.  As damping eats the high partials
// their rings fade and fall inward, one after another.
function drawRings(b, t){
  var i;
  var base = b.r*1.5;
  ctx.save();
  for (i=0;i<PARTIALS.length;i++){
    var a = partialAmp(b, i, t);
    if (a < 0.004) continue;
    var P = PARTIALS[i];
    var beat = P.b / b.sizeK;
    var age = (t - b.t0)/1000;
    var throb = Math.sin(age*beat*Math.PI*2 + i)*0.5 + 0.5;
    var rr = base + i*b.r*0.34 + throb*b.r*0.11;
    if (!isFinite(rr) || rr <= 0) continue;
    var al = Math.min(0.55, a*1.5) * (0.35 + throb*0.65);
    ctx.strokeStyle = rgba(i<2 ? C.gold : C.bronze, al);
    ctx.lineWidth = Math.max(0.7, (i<2 ? 1.6 : 1.0)*U);
    ctx.beginPath();
    ctx.arc(b.x, b.y + b.h*0.45, rr, 0, Math.PI*2);
    ctx.stroke();
  }
  // the outgoing shockwave of each recent strike
  for (i=0;i<b.rings.length;i++){
    var R = b.rings[i];
    var ag = (t - R.t0)/1000;
    if (ag > 1.7) continue;
    var k = ag/1.7;
    var rad = b.r*(1.2 + k*7.5);
    ctx.strokeStyle = rgba(C.gold, (1-k)*(1-k)*0.30*R.v);
    ctx.lineWidth = Math.max(0.8, 2.2*U*(1-k));
    ctx.beginPath(); ctx.arc(b.x, b.y + b.h*0.45, rad, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawHands(){
  var i, j;
  for (i=0;i<HANDS.length;i++){
    var h = HANDS[i];
    if (!h.live) continue;
    var hx = h.x*W, hy = h.y*H;
    // wake
    ctx.save();
    for (j=h.trail.length-1;j>=1;j--){
      var p0 = h.trail[j], p1 = h.trail[j-1];
      if (!p0 || !p1) continue;
      var a = (1 - j/h.trail.length)*0.30;
      ctx.strokeStyle = rgba(C.gold, a);
      ctx.lineWidth = Math.max(0.8, (1 - j/h.trail.length)*4.5*U);
      ctx.beginPath();
      ctx.moveTo(p0.x*W, p0.y*H); ctx.lineTo(p1.x*W, p1.y*H);
      ctx.stroke();
    }
    // the hand itself: a ring that opens as the fingers open
    var rr = (12 + h.open*13)*U;
    ctx.strokeStyle = rgba(h.open > 0.55 ? C.halo : C.gold, 0.55);
    ctx.lineWidth = Math.max(1, 1.6*U);
    ctx.beginPath(); ctx.arc(hx, hy, rr, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = rgba(C.gold, 0.30);
    ctx.beginPath(); ctx.arc(hx, hy, 2.4*U, 0, Math.PI*2); ctx.fill();
    // when it is moving fast enough to strike, the ring sharpens
    if (h.sp > STRIKE_V){
      ctx.strokeStyle = rgba(C.gold, 0.75);
      ctx.lineWidth = Math.max(1, 2.4*U);
      ctx.beginPath(); ctx.arc(hx, hy, rr*1.35, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawHud(t){
  var m = Math.max(12, 16*U);
  ctx.save();
  ctx.fillStyle = rgba(C.fog, 0.26);
  ctx.font = '500 ' + Math.max(10, 11*U|0) + 'px "Shippori Mincho", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  var live = HANDS[0].live || HANDS[1].live;
  var msg = live ? '振り抜けば撞ける　　掌をかざせば止まる'
                 : '手が見えていません';
  ctx.fillText(msg, W/2, H - m);

  var age = (t - toast.t)/1000;
  if (toast.text && age < 1.8){
    var a = age < 1.2 ? 1 : (1.8-age)/0.6;
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.fillStyle = rgba(C.gold, 0.8);
    ctx.font = '700 ' + Math.max(13, 16*U|0) + 'px "Shippori Mincho", serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(toast.text, W/2, H*0.90);
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  THE THREE-SECOND DIAGRAM
// ═══════════════════════════════════════════════════════════════════════
var demoT = 0;
function drawDemo(dt){
  if (!demoCtx) return;
  demoT = (demoT + dt) % 4.0;
  var d = demoCtx, w = demoCv.width, h = demoCv.height;
  d.setTransform(1,0,0,1,0,0);
  d.clearRect(0,0,w,h);
  var p = demoT/4.0;

  var bx = w*0.5, by = h*0.22, br = 46, bh = 108;

  // rings, alive from the strike until the palm arrives
  var struck = p > 0.30;
  var damping = p > 0.62;
  var age = struck ? (demoT - 1.20) : 0;
  var i;
  if (struck){
    for (i=0;i<6;i++){
      var damp = damping ? Math.min(1, (demoT-2.48)/0.9) : 0;
      var hiK = 1 - damp*(0.3 + 0.7*(i/5));
      var a = Math.exp(-age/(2.4 - i*0.3)) * hiK * (1 - damp*0.9);
      if (a < 0.02) continue;
      var throb = Math.sin(age*(0.4+i*0.35)*Math.PI*2 + i)*0.5+0.5;
      d.strokeStyle = 'rgba(' + (i<2?'215,169,75':'79,143,125') + ',' + (a*0.55*(0.4+throb*0.6)).toFixed(3) + ')';
      d.lineWidth = i<2 ? 2.2 : 1.4;
      d.beginPath(); d.arc(bx, by+bh*0.45, br*1.5 + i*br*0.34 + throb*br*0.11, 0, Math.PI*2); d.stroke();
    }
  }

  // bell
  d.strokeStyle = 'rgba(79,143,125,0.85)'; d.lineWidth = 2.4;
  d.beginPath();
  d.moveTo(bx, by);
  for (i=1;i<PROFILE.length;i++) d.lineTo(bx+PROFILE[i][0]*br, by+PROFILE[i][1]*bh);
  for (i=PROFILE.length-1;i>=0;i--) d.lineTo(bx-PROFILE[i][0]*br, by+PROFILE[i][1]*bh);
  d.closePath(); d.stroke();
  d.strokeStyle = 'rgba(215,169,75,0.7)'; d.lineWidth = 1.6;
  d.beginPath(); d.arc(bx, by+bh*0.74, br*0.20, 0, Math.PI*2); d.stroke();

  // the hand: sweeps through, then returns open and rests
  var hx, hy, open;
  if (p < 0.34){
    var q = p/0.34;
    hx = bx - 210 + q*250; hy = by + bh*0.74; open = 0;
  } else if (p < 0.56){
    var q2 = (p-0.34)/0.22;
    hx = bx + 40 + q2*180; hy = by + bh*0.74 - q2*30; open = 0;
  } else {
    var q3 = Math.min(1,(p-0.56)/0.16);
    hx = bx + 220 - q3*220; hy = by + bh*0.74 - 30 + q3*30; open = q3;
  }
  d.strokeStyle = open > 0.5 ? 'rgba(107,95,143,0.9)' : 'rgba(215,169,75,0.9)';
  d.lineWidth = 2.4;
  d.beginPath(); d.arc(hx, hy, 15 + open*15, 0, Math.PI*2); d.stroke();
  if (open < 0.5 && p < 0.40){
    d.strokeStyle = 'rgba(215,169,75,0.4)'; d.lineWidth = 6;
    d.beginPath(); d.moveTo(hx-70, hy); d.lineTo(hx-14, hy); d.stroke();
  }

  d.fillStyle = 'rgba(159,179,189,0.62)';
  d.font = '500 20px "Shippori Mincho", serif';
  d.textAlign = 'center';
  d.fillText(p < 0.50 ? '速く振り抜く' : '掌をかざして止める', bx, h - 14);
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var lastT = 0, running = false;

function frame(){
  var t = now();
  var dt = (t - lastT)/1000;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  lastT = t;

  if (!running){ drawDemo(dt); }
  else { stepInteraction(t, dt); }

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (bgCv) ctx.drawImage(bgCv, 0, 0, W, H);
  else { ctx.fillStyle = C.night; ctx.fillRect(0,0,W,H); }

  drawGhost();
  drawFog(dt);

  var i;
  for (i=0;i<bells.length;i++) drawRings(bells[i], t);
  for (i=0;i<bells.length;i++) drawBell(bells[i], t);
  drawHands();
  if (running) drawHud(t);

  requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════
window.addEventListener('resize', resize);
if (window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', resize);
}
makeBells();
resize();
retune();
lastT = now();
requestAnimationFrame(frame);

startBtn.addEventListener('click', function(){
  initAudio(); resumeAudio();
  veil.classList.add('hide');
  running = true;
  if (!started){
    started = true;
    if (initHands()) startStream().then(startMpCamera).catch(showError);
    else startStream().catch(showError);
  }
});

// exposed only so the offline harness can assert on the real state
window.__KANE__ = {
  s:function(){
    var out = [], i;
    for (i=0;i<bells.length;i++){
      var b = bells[i];
      out.push({ i:i, freq:b.freq, damp:b.damp, ang:b.ang,
                 loud:bellLoudness(b, now()), t0:b.t0, hit:b.hit,
                 voice: !!(b.voice && !b.voice.dead) });
    }
    return { running:running, tune:TUNINGS[tuneIx].name, bells:out,
             hands:[HANDS[0].live, HANDS[1].live] };
  },
  strikes:function(){ var i, n=0; for (i=0;i<bells.length;i++) if (bells[i].t0 > -1e8) n++; return n; },
  bellAt:function(i){ return bells[i]; },
  amps:function(i){
    var out = [], k, t = now();
    for (k=0;k<PARTIALS.length;k++) out.push(partialAmp(bells[i], k, t));
    return out;
  }
};

})();
