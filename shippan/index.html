<meta charset="UTF-8">
<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<title>SHIPPAN ─ 湿板の肖像</title>
<meta name="description" content="カメラが百五十年前の湿板写真機になる。黒い板に銀色の肖像が浮かび、まわりは渦を巻いてぼける。三秒じっとすると、現像液が流れて陰画が浮かび、定着液が流れると黒い板の上の陽画に変わる。">
<meta name="theme-color" content="#070605">
<!--
  ══════════════════════════════════════════════════════════════════════════
  SHIPPAN ─ 湿板の肖像                         ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  元ネタ    十九世紀の湿板写真（コロジオン湿板）の肖像 ── ジュリア・マーガレット・
            キャメロンのやわらかな肖像と、サリー・マンのアンブロタイプ（ふちで像が
            黒に沈み、薬品の流れた跡と彗星のような傷が残る）。いまの湿板写真館の一枚。

  最終の一枚  黒いビロードの上に一枚の黒い板。そこに銀色の肖像が浮かぶ。顔は
            窓の光でくっきり、背景の布は暗く渦を巻き、像は板のふちで黒に沈む。

  主役      カメラが湿板写真機になる。青にだけ感じる乳剤なので、肌は少し沈み、
            唇は濃く、目は澄む。人はいつでも肖像写真の被写体として美しく写る。

  層        ① 写真館：暗いまだらの背景布、頭のうしろにだけ淡い光、顔に窓の光
            ② ペッツバール・レンズ：中心と人はくっきり、まわりは渦を巻いてぼける
            ③ 長い露光：動くと銀がにじんで重なり、止まるとくっきり
            ④ 板：手で流した膜のふち、水切りの角の波、彗星、ほこり、ふちの曇り
            ⑤ 露光 → 現像 → 定着：三秒じっとすると、クリーム色の板に陰画が浮かび、
              定着液が上から流れると、クリーム色が溶けて黒地の陽画に変わる
            ⑥ 板は四種：鉄板・硝子板・紅硝子・銀板（楕円の真鍮の枠、傾けると陰画）
            ⑦ 暗室の音：レンズの蓋、メトロノーム、流れる薬品、像が出たときの鈴

  画面      板は画面いっぱいにしない。ビロードの上に置かれた「もの」として見せ、
            下に美術館の札のような小さな説明を添える。

  PALETTE   漆黒 #070605・銀 #d6cfbf・真鍮 #b8935a。色はほぼ無い。

  TYPE      IM Fell English SC（十九世紀の活字）と Zen Antique Soft（本文）。

  MOTION    すべてゆっくり。薬品は液体の速さで流れ、像は少しずつ浮かぶ。

  TECH      WebGL2。露光は板の大きさの浮動小数のバッファに映像を積み重ねる
            （ライブは指数移動平均、露光中は単純平均）。人の切り抜きは
            MediaPipe ImageSegmenter（selfie、動的 import）で、ピントと背景布と
            顔の光の位置にだけ使う。
  ══════════════════════════════════════════════════════════════════════════
-->

<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>

<script type="module">
/* =========================================================
   SHIPPAN — カメラが湿板写真機になる
   ========================================================= */

const NOISE = `
float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(h12(i),h12(i+vec2(1,0)),u.x),mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+17.1;a*=.5;}return s;}
`;
const VS_FULL = `#version 300 es
out vec2 vUv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;

/* ---- the studio, the lens and the emulsion, piled up over time (the exposure). One texel = one spot on the plate. ---- */
const FS_EXPO = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
${NOISE}
uniform sampler2D uVid, uMask, uPrev; uniform vec2 uVA, uVB;
uniform float uPA, uSwirl, uBlur, uK, uMaskOK, uLive, uBack;
uniform vec3 uFace;
vec3 vid(vec2 p,float lod){ return textureLod(uVid,vec2(p.x/uPA,p.y)*uVA+uVB,lod).rgb; }
float cloth(vec2 p){ return vn(p*2.1+3.)*.55+vn(p*5.3+11.)*.3+vn(p*13.+5.)*.15; }
void main(){
  vec2 u=vec2(vUv.x,1.-vUv.y), q=vec2(u.x*uPA,u.y);
  vec2 mu=u*uVA+uVB;
  float m=0.;
  if(uMaskOK>.5){ m=texture(uMask,mu).r*.4; for(int i=0;i<4;i++){ float a=float(i)*1.571+.4; m+=texture(uMask,mu+vec2(cos(a),sin(a))*.009).r*.15; } }
  float fig=smoothstep(.45,.9,m);   /* the matte is choked a little, so the bright room never fringes the hair */
  /* a Petzval portrait lens: the middle and the sitter are sharp, the rest swirls */
  /* focused on the eyes: the sitter softens away from the face, the rest swirls */
  vec2 c=vec2(.5*uPA,.45), d=q-c;
  float r=length(d)/(.5*length(vec2(uPA,1.)));
  vec2 fq=q-uFace.xy;
  float focus=mix(.25,1.,exp(-dot(fq,fq)/(uFace.z*uFace.z*2.)));
  float sharp=max(fig*focus*(1.-smoothstep(.95,1.3,r)),1.-smoothstep(.1,.32,r));
  float amt=1.-sharp;
  vec2 t=vec2(-d.y,d.x)/max(length(d),1e-4);
  float len=uSwirl*.1*r*r;
  float lod=uBlur*amt*2.6;
  vec3 col=vec3(0.);
  for(int i=-4;i<=4;i++){ col+=vid(q+(t*(float(i)/4.)*len+d*float(i)*.005*uSwirl)*amt,lod); }
  col/=9.;
  /* collodion sees blue: skin sinks a little, lips go dark, pale eyes go clear */
  float L=dot(col,vec3(.06,.32,.72))*1.28;
  /* one window light on the face; the body falls away into the dark */
  vec2 ff=q-uFace.xy;
  float key=exp(-dot(ff,ff)/(uFace.z*uFace.z*2.4));
  /* the studio: a dark mottled backdrop, a little light behind the head */
  float bd=0.;
  for(int i=-1;i<=1;i++) bd+=cloth(q+t*float(i)*len*.9);
  bd/=3.;
  vec2 fh=ff+vec2(0.,.03);
  float halo=exp(-dot(fh,fh)/(uFace.z*uFace.z*3.));
  float back=.035+.32*bd*bd+.28*halo;
  float Lbg=uMaskOK>.5?mix(L,mix(back,L*.35,.22),uBack):L*mix(.62,1.04,key);
  float Lp=L*mix(.5,.98,key);
  Lp=mix(min(Lp,Lbg+.1),Lp,smoothstep(.75,.98,m));   /* at the edge of the figure the bright room must not shine through the hair */
  L=mix(Lbg,Lp,fig);
  if(uLive<.5) L=.04;
  vec4 prev=texture(uPrev,vUv);
  o=mix(prev,vec4(L,m,0.,1.),uK);
}`;
const FS_COPY = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uSrc;
void main(){ o=texture(uSrc,vUv); }`;

/* ---- the plate on the velvet ---- */
const FS_PLATE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
${NOISE}
uniform sampler2D uImg; uniform vec2 uImgTx;
uniform float uAsp, uPx, uSeed, uArt, uDag, uStage, uDev, uFix, uWet;
uniform vec4 uPlate;
uniform vec2 uTilt;
uniform vec3 uSh, uMid, uHi, uEdge, uLac, uIod, uVel;
float tone(float L){ L=clamp((L-.03)*1.08,0.,1.); return mix(L,L*L*(3.-2.*L),.55)*.97; }
vec3 pal(float L){ return L<.5?mix(uSh,uMid,L*2.):mix(uMid,uHi,L*2.-1.); }
float seg(vec2 p,vec2 a,vec2 b){ vec2 ab=b-a; float t=clamp(dot(p-a,ab)/max(dot(ab,ab),1e-8),0.,1.); return length(p-a-ab*t); }
float box(vec2 p,vec2 b,float r){ vec2 d=abs(p)-b+r; return length(max(d,0.))+min(max(d.x,d.y),0.)-r; }
void main(){
  vec2 s=vec2(vUv.x,1.-vUv.y), q=vec2(s.x*uAsp,s.y);
  vec2 pc=uPlate.xy, ph=uPlate.zw; float PA=ph.x/ph.y;
  vec2 u=(q-(pc-ph))/(2.*ph);              /* 0..1 across the plate, top-left origin */
  vec2 p=vec2(u.x*PA,u.y);                 /* plate units: the plate is 1 tall */
  float px=uPx/(2.*ph.y);                  /* one device pixel, in plate units */
  vec2 sd=vec2(uSeed*13.1,uSeed*7.7);
  vec2 C=vec2(.5*PA,.5);

  /* the velvet of the case, lit from above, and the plate's shadow on it */
  vec2 sp=q-pc+vec2(0.,ph.y*.3);
  float spot=exp(-dot(sp,sp)/(ph.y*ph.y*3.2));
  vec3 col=uVel*(.4+1.*spot)*(.86+.28*vn(gl_FragCoord.xy*.8));
  float dsh=box(q-pc-vec2(.012,.026)*ph.y,ph,ph.y*.02);
  col*=mix(.2,1.,smoothstep(-ph.y*.02,ph.y*.1,dsh));

  /* the plate, cut with shears */
  float dP=box(p-C,vec2(.5*PA,.5),.012)+(vn(p*9.+sd)-.5)*.004;
  if(dP<px*2.){
    float inP=1.-smoothstep(-px,px,dP);
    vec2 iu=vec2(u.x,1.-u.y);
    float L=texture(uImg,iu).r, b1=0., b2=0.;
    for(int i=0;i<8;i++){ float a=float(i)*.785+.3; vec2 oo=vec2(cos(a),sin(a))*uImgTx; b1+=texture(uImg,iu+oo*2.).r; b2+=texture(uImg,iu+oo*10.).r; }
    b1/=8.; b2/=8.;
    float Ls=L+clamp(L-b1,-.05,.05)*1.3;        /* the crisp, etched detail of collodion (no haloes at big edges) */
    float hal=max(0.,b2-.62)*.4;                /* the silver glows into its shadows */
    float r=length(p-C+vec2(0.,.04))/(.5*length(vec2(PA,1.)));
    float vig=mix(.4,1.,smoothstep(1.2,.3,r));
    /* the coat was poured by hand, so its edge wanders */
    float dC=-box(p-C,vec2(.5*PA-.045,.455),.06);
    dC+=(fbm(p*4.+sd)-.5)*.04+(vn(p*22.+sd*2.)-.5)*.004;
    dC+=.03*exp(-length(p-vec2(PA,1.))*6.);     /* the drain corner runs thicker */
    float thin=smoothstep(0.,.035+.07*fbm(p*3.+sd*3.),dC);   /* where the coat is thin the image sinks into the black */
    if(uDag>.5){ dC=1.; thin=1.; }
    float coat=smoothstep(-px*1.5,px*1.5,dC);
    /* drain ripples, developer streaks, uneven silver */
    float dc=length(p-vec2(PA,1.));
    float rip=sin(dc*260.+fbm(p*6.+sd)*8.)*exp(-dc*8.)*.05;
    float streak=(vn(vec2(p.x*38.,p.y*1.5)+sd)-.5)*exp(-max(dC,0.)/.07)*.12;
    float mott=(fbm(p*2.+sd*5.)-.5)*.07;
    float Lt=tone((Ls+(rip+streak)*uArt+mott)*vig)+hal;
    Lt*=mix(.12,1.,thin);
    Lt+=exp(-max(dC,0.)/.025)*smoothstep(.5,.8,fbm(p*2.6+sd*7.))*.2*uArt;   /* a milky fog creeps in at the edge */
    /* comets: a dark seed with a pale tail; and dust. They keep off the sitter (the figure is kept in the green channel). */
    float comet=0.;
    for(int i=0;i<4;i++){
      float fi=float(i);
      vec2 c0=vec2((.1+.8*h12(sd+fi*3.1))*PA,.08+.84*h12(sd+fi*7.3+.4));
      float off=1.-smoothstep(.15,.5,texture(uImg,vec2(c0.x/PA,1.-c0.y)).g);
      vec2 dir=normalize(vec2(.35,1.)+(vec2(h12(sd+fi),h12(sd+fi+9.))-.5)*.7);
      float ln=.015+.03*h12(sd+fi*1.9);
      float tt=clamp(dot(p-c0,dir)/ln,0.,1.), w=.002*(1.-tt*.85);
      comet+=((1.-smoothstep(w*.45,w,seg(p,c0,c0+dir*ln)))*(.6-.45*tt)-(1.-smoothstep(.0012,.0024,length(p-c0)))*1.2)*off;
    }
    vec2 dg=p/.0075, di=floor(dg), df=fract(dg)-.5-(vec2(h12(di+1.7),h12(di+4.2))-.5)*.5;
    float hr=h12(di+sd*3.), spk=1.-smoothstep(.12,.26,length(df));
    float dust=(-step(.9965,hr)*spk+step(.9955,hr)*step(hr,.9965)*spk*.7)*(1.-.8*smoothstep(.3,.7,texture(uImg,iu).g));
    Lt+=(comet*.24+dust*.42)*uArt;
    vec3 img=pal(clamp(Lt,0.,1.));
    /* the daguerreotype is a mirror: tilt it and the silver turns negative */
    float flip=uDag*smoothstep(.35,.85,abs(uTilt.x)*.9+abs(uTilt.y)*.4);
    img=mix(img,pal(clamp(1.-Lt,0.,1.))*.92,flip);
    /* development: a pale negative comes up on the cream as the developer runs in from the top left;
       then the fixer runs down from the top, the cream clears, and the positive appears on the black */
    if(uStage>.5){
      float fd=(u.x*.55+u.y*.7)+(fbm(p*3.+sd)-.5)*.3, dv=uDev*1.5-.1;
      float dev=smoothstep(fd-.1,fd+.02,dv);
      vec3 cream=uIod*mix(.8,1.,fbm(p*7.+sd))*mix(.6,1.,thin);
      vec3 negc=cream*(1.-.55*clamp(Lt,0.,1.))+vec3(-.02,-.01,.01)*clamp(Lt,0.,1.);
      vec3 c1=mix(cream*.95,negc,dev);
      float ff=u.y+(fbm(p*2.2+sd*3.)-.5)*.4, fv=uFix*1.45-.2;
      float fx=smoothstep(ff-.1,ff+.02,fv);
      vec3 img2=mix(c1,img,fx);
      float front=exp(-abs(fd-dv)*30.)*step(uDev,.99)*step(uFix,.001)+exp(-abs(ff-fv)*26.)*step(.001,uFix)*step(uFix,.99);
      img2+=vec3(.95,.92,.85)*front*.16;
      img=mix(img,img2,smoothstep(0.,.08,uDev));
    }
    float band=exp(-pow((u.x*.8+u.y*.6-.75-uTilt.x*.45-uTilt.y*.3)*2.4,2.));
    vec3 pl;
    if(uDag<.5){
      /* the black japanned iron (or black-backed glass); the thick rim of the coat catches the light */
      vec3 lac=uLac*(1.+.5*vn(p*60.+sd));
      pl=mix(lac,img,coat);
      float ridge=exp(-max(dC,0.)/.003)*coat*smoothstep(.5,.85,vn(p*9.+sd));
      pl+=uEdge*ridge*.12*uArt;
    } else {
      /* an oval window in an engraved brass mat, with the blue-violet bloom of tarnish at its edge */
      vec2 cc=vec2(.5*PA,.48), rr=vec2(.5*PA-.085,.405);
      float e=length((p-cc)/rr), d=(1.-e)*min(rr.x,rr.y);
      float win=smoothstep(-px*1.2,px*1.2,d);
      float tarn=exp(-max(d,0.)/.035)*win*(.6+.4*fbm(p*4.+sd));
      vec3 iri=.5+.5*cos(6.28*(vec3(.55,.68,.85)+fbm(p*3.+sd)*.7+d*6.));
      img=mix(img,img*.55+iri*.32*uMid*1.6,tarn*.55*uArt);
      /* the mat: matte gilded brass with a brushed grain, a cut bevel, a row of stamped beads and one engraved line */
      float an=atan(p.y-cc.y,p.x-cc.x);
      float frost=h12(floor(p/max(px,.0006))+sd)*.08;
      float patina=fbm(p*3.5+sd*2.);
      vec3 brass=vec3(.47,.36,.21)*(.84+frost+.3*(patina-.5))*mix(.5,1.,smoothstep(-.24,0.,d))*(.9+.18*(1.-u.y));
      float ba=(fract(an*96./6.2832)-.5)*.022;
      float bead=1.-smoothstep(.0028,.0042,length(vec2(ba,d+.016)));
      brass*=1.+bead*(.22+.25*clamp(-(p.y-cc.y)*3.,-1.,1.))-exp(-abs(d+.034)/.0011)*.3;
      brass+=vec3(1.,.88,.66)*exp(-abs(d+.003)/.0016)*.22;
      brass+=vec3(.9,.72,.45)*band*.2;   /* gilding catches the window as the case is tilted */
      pl=mix(brass,img,win);
    }
    /* a soft window reflection across the glossy plate, moving as it tilts; the cut edge catches a little light */
    pl+=vec3(.85,.83,.8)*band*(.03+.05*uDag+.09*uWet*coat);   /* a wet plate shines, then dries */
    pl+=vec3(.6,.55,.48)*exp(-abs(dP)/(px*1.3))*.16;
    col=mix(col,pl,inP);
  }
  o=vec4(col,1.);
}`;

function mkProg(vsSrc, fsSrc) {
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSrc)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const f1 = (P, n, v) => { const l = P.u[n]; if (l) gl.uniform1f(l, v); };
const f2 = (P, n, a, b) => { const l = P.u[n]; if (l) gl.uniform2f(l, a, b); };
const f3 = (P, n, c) => { const l = P.u[n]; if (l) gl.uniform3f(l, c[0], c[1], c[2]); };
const f4 = (P, n, a, b, c, d) => { const l = P.u[n]; if (l) gl.uniform4f(l, a, b, c, d); };
const i1 = (P, n, v) => { const l = P.u[n]; if (l) gl.uniform1i(l, v); };

let PR = null, VAO = null, texVid = null, texMask = null, accA = null, accB = null, latent = null, accW = 0, accH = 0, accFlip = false;
function mkTarget(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (useFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.viewport(0, 0, w, h); gl.clearColor(0.04, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { t, f, w, h };
}

function initGL() {

  VAO = gl.createVertexArray();

  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([10, 9, 8, 255]));

/* ---------- layout: the plate rests on the velvet, with a small label under it ---------- */
let PL = { x: 0, y: 0, w: 1, h: 1, PA: 0.75 };
let VA_ = [1, 1], VB_ = [0, 0];
function layout() {
  const cs = getComputedStyle($('probe')), st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
  const side = W < 600 ? 14 : 40, top = 48 + st, bot = 100 + sb;
  const aw = Math.max(80, W - 2 * side), ah = Math.max(80, H - top - bot);
  const PA = clamp(aw / ah, 0.58, 0.8);
  let h = ah, w = h * PA; if (w > aw) { w = aw; h = w / PA; }
  PL = { x: (W - w) / 2, y: top + (ah - h) / 2, w, h, PA };
  if (!maskOK) face.x = face.tx = 0.5 * PA;
  const cap = $('cap'); cap.style.left = PL.x + 'px'; cap.style.width = PL.w + 'px'; cap.style.top = (PL.y + PL.h + 12) + 'px';
}
function resize() {
  W = innerWidth; H = innerHeight; ASP = W / H;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  if (W * H * DPR * DPR > 2.4e6) DPR = Math.sqrt(2.4e6 / (W * H));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
