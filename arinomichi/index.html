<title>ARINOMICHI ─ 蜜へ伸びる道が弦を弾く</title>
<meta name="description" content="紙の上に千匹の蟻が放たれている。指先から落ちる蜜へ向かって蟻が歩き、帰り道に朱のフェロモンを置いていくので、あなたが手を動かしたところに光る道が自分で育つ。紙には十三本の糸が張ってあり、道を渡る蟻が糸をまたぐたびに一音が弾かれる。道は二十秒ほどで消えていくので、同じ調べは二度と鳴らない。両手を握れば一斉。">
<meta name="theme-color" content="#f3ece0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  ══════════════════════════════════════════════════════════════════════════
  ARINOMICHI 蟻の道 ─ 蜜へ伸びる道が弦を弾く      ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      A sheet of warm paper laid flat under a lamp, with a colony
            living on it. Nothing glows in the dark here — this is the
            opposite of a night piece. The light is daylight, the ink is
            wet, and the spectacle is that seven hundred small creatures
            are visibly deciding where to walk. You do not play the notes.
            You put the honey down, and the colony works out the tune.

  PALETTE   生成  kinari   #f3ece0  the paper. Everything sits on it, and
                                    it is never fully covered, so the
                                    piece reads bright at every moment.
            墨    sumi     #241f1c  the ants and the type. Flat black-
                                    brown, no glow, no blur — insects are
                                    crisp and the roads are soft, and the
                                    contrast between those two textures is
                                    the whole look.
            蜜    mitsu    #f0a821  honey. The one warm light in the piece
                                    and the only thing that is allowed to
                                    bloom.
            朱    shu      #d8492c  fresh pheromone. Roads are laid in
                                    this, wet and bright.
            蘇芳  suou     #7d2a1e  old pheromone, trodden a hundred times.
                                    Heavy roads darken toward this, so the
                                    age of a road is legible as its colour.
            藍    ai       #2f4858  the thirteen threads and every rule,
                                    number and label. Cool, so it never
                                    competes with the ink.

  BACKGROUND  Paper. A generated 256px grain tile — long fibres, flecks,
              a faint warm blotch — repeated across the screen and never
              redrawn. No vignette, no gradient, no darkness anywhere.

  TYPE      Yuji Syuku for the title and the 調子 name: a brush-cut mincho
            that looks written rather than set, which is what a sheet of
            paper wants. Manrope 200/400/700 for every number and label,
            wide-tracked and small, so the measurements stay out of the
            way of the drawing.

  MOTION    QUICK CREATURES, SLOW PAPER. The ants are fast and jittery and
            turn on a hard 3.4 rad/s limit — real insect motion, never
            eased. Everything the page itself does (panels, key changes,
            the honey fading in) takes half a second on an ease-out, like
            ink soaking. That split is the motion language: the living
            things snap, the paper never hurries.

  SIGNATURE 道が勝手に育つ。 The roads are not drawn by you and not drawn
            by the program — they are laid down one ant at a time by a
            colony that is reinforcing whatever already worked, and they
            evaporate in about twenty seconds. So the picture on the paper
            is a slowly forgetting map of where your hand has been, and
            because the thirteen threads are sounded by whatever crosses
            them, that map is also the score. Hold still and a road
            thickens into a trill; sweep upward and the colony follows you
            up the scale in a glissando that lasts as long as the road.
  ══════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  ARINOMICHI 蟻の道 ─ 蜜へ伸びる道が弦を弾く
//
//  A colony of up to 1100 ants lives on a sheet of paper. Each ant walks
//  a three-sensor pheromone gradient (the classic Physarum/ant rule), so
//  the ants reinforce whatever path already works and ROADS EMERGE — they
//  are not drawn by the player and not drawn by the program.
//
//  Your index fingertip is a drop of honey. Searching ants that come near
//  it pick it up and turn for home, depositing five times as much
//  pheromone on the way back, so a road grows from the nest to wherever
//  your hand is. Close your hand and the honey stops; the road evaporates
//  over about twenty seconds.
//
//  Thirteen threads are stretched across the paper. Whenever ANY ant
//  crosses one, that thread is plucked — a Karplus-Strong string, tuned
//  to a hirajoshi pentatonic, high at the top of the screen and low at
//  the bottom. So the road IS the score: hold your hand still and one
//  thread trills; sweep upward and the colony follows you up the scale.
//
//  Both hands closed into fists for half a second: 一斉. A ring runs out
//  from the nest, flings every ant it passes, and rings all thirteen
//  threads from bottom to top.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number' && isFinite(v); }
function chase(cur,tgt,rate,dt){ var k=1-Math.exp(-rate*clamp(dt,0,0.2)); return cur+(tgt-cur)*k; }
function angWrap(a){ while(a>Math.PI)a-=TAU; while(a<-Math.PI)a+=TAU; return a; }
function rgba(r,g,b,a){
  r=fin(r)?clamp(r|0,0,255):0; g=fin(g)?clamp(g|0,0,255):0; b=fin(b)?clamp(b|0,0,255):0;
  a=fin(a)?clamp(a,0,1):0;
  return 'rgba('+r+','+g+','+b+','+a.toFixed(3)+')';
}

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var densEl=document.getElementById('densEl');
var tenEl=document.getElementById('tenEl');
var sndBtn=document.getElementById('snd');
var keyN=document.getElementById('keyN');
var keyS=document.getElementById('keyS');
var rA=document.getElementById('rA');
var rR=document.getElementById('rR');
var rH=document.getElementById('rH');

var W=0,H=0,DPR=1,MN=1;
function mkCanvas(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  return c;
}

// ═══════════════════════════════════════════════════════════════════════
//  PAPER ─ one generated grain tile, made once, tiled forever
// ═══════════════════════════════════════════════════════════════════════
var paperPat=null;
function makePaper(){
  var S=256, c=mkCanvas(S,S), g=c.getContext('2d');
  if (!g) return;
  g.fillStyle='#f3ece0'; g.fillRect(0,0,S,S);
  // warm blotches
  var i,n;
  for (i=0;i<26;i++){
    var bx=Math.random()*S, by=Math.random()*S, br=14+Math.random()*46;
    g.fillStyle=rgba(214,198,172,0.055+Math.random()*0.05);
    g.beginPath(); g.arc(bx,by,br,0,TAU); g.fill();
  }
  // long fibres
  g.lineWidth=1;
  for (i=0;i<190;i++){
    var fx=Math.random()*S, fy=Math.random()*S, fa=Math.random()*TAU, fl=6+Math.random()*26;
    g.strokeStyle=rgba(Math.random()<0.5?196:226, Math.random()<0.5?182:214, 160, 0.10+Math.random()*0.14);
    g.beginPath(); g.moveTo(fx,fy); g.lineTo(fx+Math.cos(fa)*fl,fy+Math.sin(fa)*fl); g.stroke();
  }
  // flecks
  for (i=0;i<130;i++){
    g.fillStyle=rgba(150,132,106,0.06+Math.random()*0.12);
    g.fillRect(Math.random()*S,Math.random()*S,1,1);
  }
  try{ paperPat=ctx.createPattern(c,'repeat'); }catch(e){ paperPat=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  GRID ─ cell size is a constant fraction of the SHORT EDGE, so a road
//  is the same physical width and the ants walk at the same apparent
//  speed in portrait and in landscape.
// ═══════════════════════════════════════════════════════════════════════
var CELL=6, GW=0, GH=0, GN=0;
var TR=null, TB=null;
var fieldCv=null, fieldCtx=null, fieldImg=null, fieldData=null;

function allocGrid(){
  // Rotating the device must not erase what the colony has built. The old
  // field is resampled into the new grid by normalised position, so the
  // roads survive an orientation change (they are the piece's memory).
  var oTR=TR, oGW=GW, oGH=GH;
  CELL=Math.max(2.4, MN/110);
  GW=Math.max(24, Math.ceil(W/CELL)+1);
  GH=Math.max(24, Math.ceil(H/CELL)+1);
  GN=GW*GH;
  TR=new Float32Array(GN);
  TB=new Float32Array(GN);
  if (oTR&&oGW>0&&oGH>0){
    for (var yy=0;yy<GH;yy++){
      var syy=Math.min(oGH-1,Math.floor(yy*oGH/GH));
      for (var xx=0;xx<GW;xx++){
        var sxx=Math.min(oGW-1,Math.floor(xx*oGW/GW));
        TR[yy*GW+xx]=oTR[syy*oGW+sxx];
      }
    }
  }
  fieldCv=mkCanvas(GW,GH);
  fieldCtx=fieldCv.getContext('2d');
  fieldImg=fieldCtx?fieldCtx.createImageData(GW,GH):null;
  fieldData=fieldImg?fieldImg.data:null;
  if (fieldData){ for (var i=3;i<fieldData.length;i+=4) fieldData[i]=0; }
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
  makePaper();
  var pGW=GW, pGH=GH;
  allocGrid();
  layoutThreads();
  if (!colonyPlaced) placeColony();
  else rescaleColony(pGW,pGH);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  COVER MAPPING + ASPECT-CORRECTED CAMERA SPACE
//
//  MediaPipe normalises x by the FRAME width and y by the FRAME height.
//  sx()/sy() stretch that onto the screen with a cover fit — fine for
//  POSITIONS. Every RATIO (finger curl, hand span) is instead measured in
//  aspect-corrected camera space via cu()/cv(), where one unit is the
//  same physical distance horizontally and vertically, so a fist reads as
//  a fist whichever way the device is held.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect;
  if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX + (mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY + ny*(covS/camAspect); }
function cu(nx){ return nx*camAspect; }   // aspect-corrected camera space
function cv(ny){ return ny; }

// ═══════════════════════════════════════════════════════════════════════
//  HANDS
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.5;
var HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
        [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
var HAND=[
  {on:false,t:-9,fist:false,px:0,py:0,L:null},
  {on:false,t:-9,fist:false,px:0,py:0,L:null}
];
var fistBothT=0, fistArmed=true;
var seenN=0, seenT=-9;   // how many hands the LATEST result actually contained

function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  return fin(p.x)&&fin(p.y);
}
function handLive(k){ return HAND[k].on && (now()-HAND[k].t)<LOST_S; }
function loseHands(){
  for (var k=0;k<2;k++){ HAND[k].on=false; HAND[k].fist=false; HAND[k].L=null; HAND[k].t=-9; }
  fistBothT=0; fistArmed=true; seenN=0; seenT=-9;
}
function fingerCurled(L,tip,pip){
  if (!lmOK(L,0)||!lmOK(L,tip)||!lmOK(L,pip)) return false;
  var wu=cu(L[0].x), wv=cv(L[0].y);
  var tu=cu(L[tip].x), tv=cv(L[tip].y);
  var pu=cu(L[pip].x), pv=cv(L[pip].y);
  var dt2=(tu-wu)*(tu-wu)+(tv-wv)*(tv-wv);
  var dp2=(pu-wu)*(pu-wu)+(pv-wv)*(pv-wv);
  return dt2 < dp2*0.95;
}
function onHands(res){
  var t=now();
  var lists=(res&&res.multiHandLandmarks)?res.multiHandLandmarks:null;
  var n=(lists&&typeof lists.length==='number')?Math.min(2,lists.length):0;
  seenN=n; seenT=t;
  for (var k=0;k<2;k++){
    if (k<n){
      var L=lists[k];
      if (!lmOK(L,0)||!lmOK(L,8)||!lmOK(L,9)){ continue; }
      var c=0;
      if (fingerCurled(L,8,6)) c++;
      if (fingerCurled(L,12,10)) c++;
      if (fingerCurled(L,16,14)) c++;
      if (fingerCurled(L,20,18)) c++;
      HAND[k].on=true; HAND[k].t=t; HAND[k].L=L;
      HAND[k].fist=(c>=3);
      HAND[k].px=sx(L[8].x); HAND[k].py=sy(L[8].y);
    } else if (HAND[k].on && (t-HAND[k].t)>LOST_S){
      HAND[k].on=false; HAND[k].fist=false; HAND[k].L=null;
    }
  }
  if (n===0 && (t-Math.max(HAND[0].t,HAND[1].t))>LOST_S){ fistBothT=0; fistArmed=true; }
}
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0, selfieMode:false,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  THREADS ─ thirteen strings, hirajoshi, low at the nest and high at the
//  top of the sheet. The key steps around a four-station cycle so the
//  same road re-harmonises every thirty-eight seconds.
// ═══════════════════════════════════════════════════════════════════════
var NT=13;
var SCALE=[0,2,3,7,8];                   // 平調子
var ROOTS=[0,5,3,8];
var KEYNAME=['壱','弐','参','肆'];
var BASE=146.83;                          // D3
var KEYT=38, keyI=0, keyT=0, retune=0;
var thF=new Float32Array(NT), thGY=new Float32Array(NT);
var thAmp=new Float32Array(NT), thPh=new Float32Array(NT), thLast=new Float32Array(NT);
var thFX=new Float32Array(NT), thFl=new Float32Array(NT);
// traffic accumulators: how many ants crossed each thread since it last
// sounded, how many of them were carrying honey, and where they crossed.
var thCnt=new Float32Array(NT), thLad=new Float32Array(NT), thXs=new Float32Array(NT);
function layoutThreads(){
  for (var i=0;i<NT;i++){
    thF[i]=0.90-i*(0.80/(NT-1));
    thGY[i]=thF[i]*H/CELL;
  }
}
function freqOf(i){
  var semis=SCALE[i%5]+12*Math.floor(i/5)+ROOTS[keyI];
  return BASE*Math.pow(2,semis/12);
}
for (var _i=0;_i<NT;_i++) thLast[_i]=-9;

// ═══════════════════════════════════════════════════════════════════════
//  COLONY
// ═══════════════════════════════════════════════════════════════════════
var AMAX=1200, AN=760;
var ax=new Float32Array(AMAX), ay=new Float32Array(AMAX), aa=new Float32Array(AMAX);
var apy=new Float32Array(AMAX), abo=new Float32Array(AMAX);
var alad=new Uint8Array(AMAX), aflg=new Uint8Array(AMAX);
var nestGX=0, nestGY=0, nestPulse=0, harvest=0, delivered=0;

var SD=4.4, SA=0.62, TURN=3.4, WOB=1.7, SPD=20;
var PULL_HOME=3.2, PULL_FOOD=2.3, NEAR_R=30, CAPT=6.2;
var DEP_H=0.72, DEP_S=0, DECAY_T=7.5;   // only LADEN ants lay trail

var colonyPlaced=false;
function rescaleColony(oGW,oGH){
  nestGX=(W*0.5)/CELL; nestGY=(H*0.955)/CELL;
  if (!(oGW>0&&oGH>0)) return;
  var fx=GW/oGW, fy=GH/oGH;
  for (var i=0;i<AMAX;i++){
    ax[i]=clamp(ax[i]*fx,1,GW-2);
    ay[i]=clamp(ay[i]*fy,1,GH-2);
    apy[i]=ay[i];
  }
}
function placeColony(){
  colonyPlaced=true;
  nestGX=(W*0.5)/CELL; nestGY=(H*0.955)/CELL;
  for (var i=0;i<AMAX;i++){
    var a=Math.random()*TAU, r=Math.random()*8+1;
    ax[i]=clamp(nestGX+Math.cos(a)*r,1,GW-2);
    ay[i]=clamp(nestGY+Math.sin(a)*r,1,GH-2);
    aa[i]=-Math.PI*0.5+(Math.random()-0.5)*2.4;
    apy[i]=ay[i]; alad[i]=0; abo[i]=0; aflg[i]=0;
  }
}
function senseAt(gx,gy){
  var ix=gx|0, iy=gy|0;
  if (ix<0||iy<0||ix>=GW||iy>=GH) return -1;
  return TR[iy*GW+ix];
}
// A searching ant smells only trail that lies FURTHER OUT than it is.
//
// Every homeward road ends at the nest, so the nest mouth is always the
// global maximum of the pheromone field. Without this gate a searcher
// walks up that gradient, arrives home, is sent out, smells the same
// gradient and turns straight back — and within about twenty seconds the
// whole colony is orbiting the doorway and foraging stops dead. Refusing
// samples that are nearer home than the ant already is turns the same one
// field into an outbound road, which is what a real trail pheromone is.
function senseOut(gx,gy,nx,ny,minD2){
  if (minD2>0){
    var dx=gx-nx, dy=gy-ny;
    if (dx*dx+dy*dy<minD2) return -1;
  }
  var ix=gx|0, iy=gy|0;
  if (ix<0||iy<0||ix>=GW||iy>=GH) return -1;
  return TR[iy*GW+ix];
}

// honey sources: two fingertips plus one wild drop that never stops
var SRC=[{on:false,gx:0,gy:0},{on:false,gx:0,gy:0},{on:true,gx:0,gy:0}];
var wildA=0, wildB=0, wildAmt=1;

// ═══════════════════════════════════════════════════════════════════════
//  SPECKS ─ ink flecks thrown off a plucked thread
// ═══════════════════════════════════════════════════════════════════════
var SMAX=420, sN=0;
var spx=new Float32Array(SMAX), spy=new Float32Array(SMAX);
var svx=new Float32Array(SMAX), svy=new Float32Array(SMAX);
var slf=new Float32Array(SMAX), sgl=new Uint8Array(SMAX);
function speck(x,y,vx,vy,gold){
  if (sN>=SMAX) return;
  var i=sN++;
  spx[i]=x; spy[i]=y; svx[i]=vx; svy[i]=vy; slf[i]=1; sgl[i]=gold?1:0;
}
function killSpeck(i){
  var j=--sN;
  spx[i]=spx[j]; spy[i]=spy[j]; svx[i]=svx[j]; svy[i]=svy[j]; slf[i]=slf[j]; sgl[i]=sgl[j];
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ KARPLUS-STRONG. Each of the thirteen threads is a real plucked
//  string: a noise burst rung round a delay line of length sr/f with a
//  two-point averaging filter in the loop. The whole ring-down is
//  rendered into a buffer once per key, so a pluck at play time costs one
//  BufferSource and nothing else — which is what lets a hundred crossings
//  a second stay real-time.
// ═══════════════════════════════════════════════════════════════════════
var ac=null, master=null, comp=null, dryBus=null, wetBus=null;
var droneA=null, droneB=null, droneG=null, droneF=null;
var ksBuf=[], noiseBuf=null, sndOn=true;
var voiceTok=6, VOICE_RATE=16, VOICE_CAP=9;
var canPan=false;

function makeNoise(){
  if (!ac) return null;
  var n=Math.max(1,Math.floor(ac.sampleRate*0.6));
  var b=ac.createBuffer(1,n,ac.sampleRate);
  var d=b.getChannelData(0);
  for (var i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function ksRender(freq,bright,dur){
  if (!ac||!fin(freq)||freq<=20) return null;
  var sr=ac.sampleRate;
  var n=Math.max(4,Math.round(sr/freq));
  var len=Math.max(64,Math.round(sr*dur));
  var ring=new Float32Array(n);
  var lp=0, i;
  for (i=0;i<n;i++){
    var w=Math.random()*2-1;
    lp=lp+(w-lp)*bright;
    ring[i]=lp;
  }
  var mean=0; for (i=0;i<n;i++) mean+=ring[i]; mean/=n;
  var peak=0;
  for (i=0;i<n;i++){ ring[i]-=mean; if (Math.abs(ring[i])>peak) peak=Math.abs(ring[i]); }
  if (peak>0){ for (i=0;i<n;i++) ring[i]/=peak; }
  var b=ac.createBuffer(1,len,sr);
  var out=b.getChannelData(0);
  var damp=Math.exp(-5.4/(freq*dur));
  var idx=0, prev=ring[n-1];
  for (i=0;i<len;i++){
    var cur=ring[idx];
    out[i]=cur;
    ring[idx]=damp*0.5*(cur+prev);
    prev=cur;
    idx++; if (idx>=n) idx=0;
  }
  // soft attack so the very first sample is not a click, and a tail fade
  var at=Math.min(48,Math.floor(len*0.05));
  for (i=0;i<at;i++) out[i]*=i/at;
  var tl=Math.min(len,Math.floor(sr*0.05));
  for (i=0;i<tl;i++) out[len-1-i]*=i/tl;
  return b;
}
function buildStrings(){
  if (!ac) return;
  ksBuf=[];
  for (var i=0;i<NT;i++){
    var f=freqOf(i);
    var dur=clamp(1.7-i*0.07,0.5,1.7);
    ksBuf.push([ ksRender(f,0.34,dur), ksRender(f,0.72,dur) ]);
  }
}
function initAudio(){
  if (ac) return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return;
  try{ ac=new AC(); }catch(e){ ac=null; return; }
  comp=ac.createDynamicsCompressor();
  try{
    comp.threshold.value=-17; comp.knee.value=26; comp.ratio.value=4.2;
    comp.attack.value=0.004; comp.release.value=0.22;
  }catch(e){}
  master=ac.createGain(); master.gain.value=0.95;
  master.connect(comp); comp.connect(ac.destination);

  dryBus=ac.createGain(); dryBus.gain.value=1; dryBus.connect(master);
  wetBus=ac.createGain(); wetBus.gain.value=0.3; wetBus.connect(master);
  var d1=ac.createDelay(1), d2=ac.createDelay(1);
  d1.delayTime.value=0.061; d2.delayTime.value=0.097;
  var lp1=ac.createBiquadFilter(); lp1.type='lowpass'; lp1.frequency.value=2500;
  var lp2=ac.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=1900;
  var fb1=ac.createGain(); fb1.gain.value=0.33;
  var fb2=ac.createGain(); fb2.gain.value=0.28;
  dryBus.connect(d1); dryBus.connect(d2);
  d1.connect(lp1); lp1.connect(fb1); fb1.connect(d1); lp1.connect(wetBus);
  d2.connect(lp2); lp2.connect(fb2); fb2.connect(d2); lp2.connect(wetBus);

  noiseBuf=makeNoise();
  canPan=(typeof ac.createStereoPanner==='function');

  droneF=ac.createBiquadFilter(); droneF.type='lowpass';
  droneF.frequency.value=250; droneF.Q.value=0.7;
  droneG=ac.createGain(); droneG.gain.value=0.0;
  droneF.connect(droneG); droneG.connect(master);
  droneA=ac.createOscillator(); droneA.type='triangle';
  droneB=ac.createOscillator(); droneB.type='triangle';
  droneA.connect(droneF); droneB.connect(droneF);
  tuneDrone(0);
  try{ droneA.start(); droneB.start(); }catch(e){}
  droneG.gain.setTargetAtTime(sndOn?0.034:0, ac.currentTime, 1.4);

  buildStrings();
}
function tuneDrone(glide){
  if (!ac||!droneA||!droneB) return;
  var f=BASE*Math.pow(2,ROOTS[keyI]/12)*0.5;
  if (!fin(f)||f<=0) f=73;
  var t=ac.currentTime;
  if (glide>0){
    droneA.frequency.setTargetAtTime(f,t,glide);
    droneB.frequency.setTargetAtTime(f*1.4983,t,glide);
  } else {
    droneA.frequency.value=f; droneB.frequency.value=f*1.4983;
  }
}
function setSound(on){
  sndOn=!!on;
  if (sndBtn){ sndBtn.className=sndOn?'on':''; sndBtn.textContent=sndOn?'音 ON':'音 OFF'; }
  if (ac&&droneG) droneG.gain.setTargetAtTime(sndOn?0.034:0, ac.currentTime, 0.4);
}
if (sndBtn) sndBtn.addEventListener('click',function(){ setSound(!sndOn); });

function pluckSound(i,xFrac,vel){
  if (!sndOn||!ac||!dryBus) return;
  if (i<0||i>=ksBuf.length) return;
  var pair=ksBuf[i]; if (!pair) return;
  var b=pair[vel>0.55?1:0]; if (!b) return;
  if (voiceTok<1) return;
  voiceTok-=1;
  var v=fin(vel)?clamp(vel,0,1):0.4;
  var xf=fin(xFrac)?clamp(xFrac,0,1):0.5;
  try{
    var s=ac.createBufferSource();
    s.buffer=b;
    s.playbackRate.value=1+(Math.random()-0.5)*0.008;
    var g=ac.createGain();
    g.gain.value=clamp(0.05+v*0.17,0.01,0.3);
    s.connect(g);
    if (canPan){
      var p=ac.createStereoPanner();
      p.pan.value=clamp((xf-0.5)*1.4,-1,1);
      g.connect(p); p.connect(dryBus);
    } else {
      g.connect(dryBus);
    }
    s.start();
    if (s.stop) s.stop(ac.currentTime+b.duration+0.03);
  }catch(e){}
}
function thumpSound(){
  if (!sndOn||!ac||!master) return;
  try{
    var t=ac.currentTime;
    var o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(168,t);
    o.frequency.exponentialRampToValueAtTime(44,t+0.42);
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.32,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0002,t+0.75);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+0.8);
    if (noiseBuf){
      var ns=ac.createBufferSource(); ns.buffer=noiseBuf;
      var bp=ac.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value=1250; bp.Q.value=0.8;
      var ng=ac.createGain();
      ng.gain.setValueAtTime(0.16,t);
      ng.gain.exponentialRampToValueAtTime(0.0002,t+0.34);
      ns.connect(bp); bp.connect(ng); ng.connect(master);
      ns.start(t); ns.stop(t+0.4);
    }
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  一斉 ISSEI ─ the single big event. Both hands closed for half a second
//  sends a ring out from the nest; every ant it passes is flung outward,
//  and the thirteen threads ring bottom to top behind it.
// ═══════════════════════════════════════════════════════════════════════
var issT=-99, issR=0, issFlash=0, issNext=0, ISS_COOL=7;
function fireIssei(t){
  if (t-issT<ISS_COOL) return;
  issT=t; issR=0; issFlash=1; issNext=0;
  for (var i=0;i<AMAX;i++){ aflg[i]=0; }
  thumpSound();
}
function isseiActive(t){ return (t-issT)<1.4; }

// ═══════════════════════════════════════════════════════════════════════
//  SIMULATION
// ═══════════════════════════════════════════════════════════════════════
var started=false, last=0, qual=1, costS=8, hudT=0;
var roadPix=0;

function density(){ return densEl?clamp((+densEl.value||0)/100,0.2,1):0.66; }
function tension(){ return tenEl?clamp((+tenEl.value||0)/100,0,1):0.58; }
function coolOf(){ return lerp(0.75,0.20,tension()); }

function updateSources(t,dt){
  var anyHand=false;
  for (var k=0;k<2;k++){
    var h=HAND[k];
    var live=h.on&&(t-h.t)<LOST_S;
    if (live) anyHand=true;
    if (live&&!h.fist&&fin(h.px)&&fin(h.py)){
      SRC[k].on=true;
      SRC[k].gx=clamp(h.px/CELL,1,GW-2);
      SRC[k].gy=clamp(h.py/CELL,1,GH-2);
    } else {
      SRC[k].on=false;
    }
  }
  // the wild drop keeps the colony alive when nobody is there
  wildA+=dt*0.105; wildB+=dt*0.072;   // slow enough that a real road forms unattended
  var wx=0.5+0.31*Math.sin(wildA)+0.12*Math.sin(wildB*2.3);
  var wy=0.42+0.24*Math.sin(wildB)+0.09*Math.cos(wildA*1.7);
  SRC[2].gx=clamp(wx*W/CELL,1,GW-2);
  SRC[2].gy=clamp(wy*H/CELL,1,GH-2);
  wildAmt=chase(wildAmt,(SRC[0].on||SRC[1].on)?0:1,anyHand?0.7:0.4,dt);
  SRC[2].on=wildAmt>0.12;

  // 一斉 gate. The half-second grace that keeps the honey drop from
  // flickering must NOT apply here: a hold that ended because tracking
  // was lost would otherwise keep counting and the big event would fire
  // with nobody's hands in frame. So the hold only accrues on results
  // that actually contained two hands, and it bleeds away two and a half
  // times as fast as it fills — a one-frame dropout costs a little
  // progress, a real release cancels it.
  var haveTwo=(seenN>=2)&&((t-seenT)<0.2);
  var bothFist=haveTwo&&HAND[0].fist&&HAND[1].fist;
  if (bothFist) fistBothT+=dt;
  else { fistBothT=Math.max(0,fistBothT-dt*2.5); if (fistBothT<=0) fistArmed=true; }
  if (fistArmed&&fistBothT>0.45){ fireIssei(t); fistBothT=0; fistArmed=false; }
}

function pluck(i,xpx,vel,t){
  if (i<0||i>=NT) return;
  if (t-thLast[i]<0.03) return;
  thLast[i]=t;
  var v=clamp(vel,0.08,1);
  thAmp[i]=clamp(thAmp[i]*0.35+v,0,1.25);
  thPh[i]=0;
  thFX[i]=fin(xpx)?clamp(xpx,0,W):W*0.5;
  thFl[i]=1;
  pluckSound(i,W>0?thFX[i]/W:0.5,v);
  var nsp=v>0.55?3:2;
  for (var s=0;s<nsp;s++){
    var a=(-Math.PI*0.5)+(Math.random()-0.5)*2.2;
    var sp=MN*(0.03+Math.random()*0.05);
    speck(thFX[i],thF[i]*H,Math.cos(a)*sp,Math.sin(a)*sp,v>0.55);
  }
}

function stepColony(dt,t){
  var n=Math.max(160,Math.round(AN*qual));
  var dt60=dt*60;
  var decay=Math.exp(-dt/DECAY_T);
  var i,idx;
  // decay + diffuse
  for (i=0;i<GN;i++) TR[i]*=decay;
  var x,y;
  for (y=0;y<GH;y++){
    var ro=y*GW;
    for (x=0;x<GW;x++){
      var c=TR[ro+x];
      var l=x>0?TR[ro+x-1]:c;
      var r=x<GW-1?TR[ro+x+1]:c;
      TB[ro+x]=(l+c*2+r)*0.25;
    }
  }
  for (x=0;x<GW;x++){
    for (y=0;y<GH;y++){
      var o=y*GW+x;
      var cc=TB[o];
      var u=y>0?TB[o-GW]:cc;
      var d=y<GH-1?TB[o+GW]:cc;
      TR[o]=lerp(TR[o],(u+cc*2+d)*0.25,0.55);
    }
  }
  var iss=isseiActive(t);
  var issAge=t-issT;
  if (iss){ issR+=dt*MN*1.55; }
  var issGR=issR/CELL;
  var nx=nestGX, ny=nestGY;

  for (i=0;i<n;i++){
    var px=ax[i], py=ay[i], a=aa[i];
    var dxn=px-nx, dyn=py-ny;
    var aR=Math.sqrt(dxn*dxn+dyn*dyn);
    var minD2=0;
    if (!alad[i]&&aR>2){ var m=aR-1.4; minD2=m*m; }
    // three-sensor pheromone steering
    var fA=senseOut(px+Math.cos(a)*SD, py+Math.sin(a)*SD, nx,ny,minD2);
    var fL=senseOut(px+Math.cos(a-SA)*SD, py+Math.sin(a-SA)*SD, nx,ny,minD2);
    var fR=senseOut(px+Math.cos(a+SA)*SD, py+Math.sin(a+SA)*SD, nx,ny,minD2);
    if (fA>=fL&&fA>=fR){ /* keep heading */ }
    else if (fL>fR) a-=TURN*dt;
    else if (fR>fL) a+=TURN*dt;
    else a+=(Math.random()<0.5?-1:1)*TURN*dt;
    a+=(Math.random()-0.5)*WOB*dt;

    // goal pull
    var tx=0, ty=0, pull=0;
    if (alad[i]){
      tx=nx; ty=ny; pull=PULL_HOME;
    } else {
      // Honey can be smelled from anywhere, faintly — otherwise a colony
      // with no road yet has no gradient to follow and never leaves home.
      // Close up the pull is five times stronger, which is what turns a
      // wandering crowd into a lane.
      var bd=1e9, bx=0, by=0;
      for (var s=0;s<3;s++){
        if (!SRC[s].on) continue;
        var ddx=SRC[s].gx-px, ddy=SRC[s].gy-py;
        var dd=Math.sqrt(ddx*ddx+ddy*ddy);
        if (dd<bd){ bd=dd; bx=SRC[s].gx; by=SRC[s].gy; }
      }
      if (bd<1e8){
        tx=bx; ty=by;
        pull=PULL_FOOD*(0.20+0.80*(1-clamp(bd/NEAR_R,0,1)));
        if (bd<3.0){
          alad[i]=1; a+=Math.PI+(Math.random()-0.5)*0.8; pull=0; harvest++;
        }
      }
    }
    if (pull>0){
      var da=angWrap(Math.atan2(ty-py,tx-px)-a);
      a+=clamp(da,-1.2,1.2)*pull*dt;
    }
    // A searching ant is pushed out of the doorway, or the crowd at the
    // nest mouth would never disperse.
    if (!alad[i]&&aR<11&&aR>0.001){
      var oa=angWrap(Math.atan2(dyn,dxn)-a);
      a+=clamp(oa,-1.2,1.2)*2.2*(1-aR/11)*dt;
    }

    // 一斉 shockwave
    if (iss&&!aflg[i]){
      var rdx=px-nx, rdy=py-ny;
      var rd=Math.sqrt(rdx*rdx+rdy*rdy);
      if (rd<issGR){
        aflg[i]=1; abo[i]=1; alad[i]=0;
        a=Math.atan2(rdy,rdx)+(Math.random()-0.5)*0.5;
      }
    }
    abo[i]*=Math.exp(-dt*2.1);

    var spd=SPD*(1+2.4*abo[i]);
    var nxp=px+Math.cos(a)*spd*dt;
    var nyp=py+Math.sin(a)*spd*dt;
    if (nxp<1){ nxp=1; a=Math.PI-a; }
    else if (nxp>GW-2){ nxp=GW-2; a=Math.PI-a; }
    if (nyp<1){ nyp=1; a=-a; }
    else if (nyp>GH-2){ nyp=GH-2; a=-a; }

    // home arrival
    if (alad[i]){
      var hdx=nxp-nx, hdy=nyp-ny;
      if (hdx*hdx+hdy*hdy<9){
        alad[i]=0; delivered++; nestPulse=1;
        a=-Math.PI*0.5+(Math.random()-0.5)*2.6;
      }
    }

    // deposit
    // Trail is laid on the way HOME only, and never inside the nest
    // mouth — a hot blob there is a local maximum that traps the colony.
    if (alad[i]){
      var ndx=nxp-nx, ndy=nyp-ny;
      if (ndx*ndx+ndy*ndy>16){
        idx=(nyp|0)*GW+(nxp|0);
        if (idx>=0&&idx<GN){
          var v=TR[idx]+DEP_H*dt60;
          TR[idx]=v>CAPT?CAPT:v;
        }
      }
    }

    // Thread crossings are only COUNTED here. A thread sounds once per
    // cooldown, at a volume set by how much traffic it has taken since —
    // so a thread the road runs over sings out and a thread only brushed
    // by a stray ant whispers. That is what makes the road audible as a
    // road rather than as an even rain.
    var opy=apy[i];
    if (opy!==nyp){
      for (var q=0;q<NT;q++){
        var gy=thGY[q];
        if ((opy-gy)*(nyp-gy)<=0){
          if (thCnt[q]<48){
            thCnt[q]+=1;
            if (alad[i]) thLad[q]+=1;
            thXs[q]+=nxp*CELL;
          }
          break;
        }
      }
    }

    ax[i]=nxp; ay[i]=nyp; aa[i]=a; apy[i]=nyp;
  }
}

var LOG13=Math.log(13);
function stepThreads(dt,t){
  var cool=coolOf();
  for (var i=0;i<NT;i++){
    thAmp[i]*=Math.exp(-dt*2.6);
    thPh[i]+=dt*38*(0.7+i*0.05);
    thFl[i]*=Math.exp(-dt*5.5);
    if (thCnt[i]>0&&(t-thLast[i])>=cool){
      var c=thCnt[i];
      var ladf=c>0?thLad[i]/c:0;
      var xm=c>0?thXs[i]/c:W*0.5;
      var vel=clamp(0.10+0.44*(Math.log(1+c)/LOG13)+0.32*ladf,0.1,1);
      thCnt[i]=0; thLad[i]=0; thXs[i]=0;
      pluck(i,xm,vel,t);
    }
  }
  if (isseiActive(t)){
    var age=t-issT;
    while (issNext<NT && age>0.06+issNext*0.052){
      pluck(issNext,W*(0.18+0.64*Math.random()),1,t-9);
      thLast[issNext]=t;
      issNext++;
    }
  }
  issFlash*=Math.exp(-dt*4.2);
}

function stepSpecks(dt){
  for (var i=sN-1;i>=0;i--){
    slf[i]-=dt*1.5;
    if (slf[i]<=0){ killSpeck(i); continue; }
    svy[i]+=MN*0.55*dt;
    svx[i]*=Math.exp(-dt*1.6); svy[i]*=Math.exp(-dt*0.9);
    spx[i]+=svx[i]*dt; spy[i]+=svy[i]*dt;
  }
}

function step(dt,t){
  AN=Math.round(260+density()*(AMAX-320));
  updateCover();
  updateSources(t,dt);
  keyT+=dt;
  if (keyT>=KEYT){
    keyT=0; keyI=(keyI+1)%ROOTS.length;
    buildStrings(); tuneDrone(1.6); retune=1;
    if (keyN) keyN.textContent='平調子';
    if (keyS) keyS.textContent=KEYNAME[keyI];
  }
  retune*=Math.exp(-dt*1.1);
  voiceTok=Math.min(VOICE_CAP,voiceTok+VOICE_RATE*dt);
  nestPulse*=Math.exp(-dt*3.4);
  stepColony(dt,t);
  stepThreads(dt,t);
  stepSpecks(dt);
  if (t-hudT>0.18){ hudT=t; updateHud(); }
}

function updateHud(){
  var n=Math.max(160,Math.round(AN*qual));
  if (rA) rA.textContent=String(n);
  var road=0;
  for (var i=0;i<GN;i+=7) if (TR[i]>0.55) road++;
  roadPix=Math.round(road*7*CELL*CELL/1000);
  if (rR) rR.textContent=String(roadPix);
  if (rH) rH.textContent=String(delivered);
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAW
//
//  Two textures, deliberately opposed: the pheromone field is painted
//  from a low-resolution grid and drawn up with smoothing, so roads are
//  soft wet ink; the ants are single crisp marks on top. Everything sits
//  on paper that is never cleared to black.
// ═══════════════════════════════════════════════════════════════════════
var C_HONEY=[240,168,33], C_SHU=[216,73,44], C_SUOU=[125,42,30];

function drawField(){
  if (!fieldData||!fieldCtx) return;
  var d=fieldData;
  for (var i=0,p=0;i<GN;i++,p+=4){
    var v=TR[i]/CAPT;
    if (v<=0.018){ d[p+3]=0; continue; }
    if (v>1) v=1;
    var t1=v/0.34; if (t1>1) t1=1;
    var r=C_HONEY[0]+(C_SHU[0]-C_HONEY[0])*t1;
    var g=C_HONEY[1]+(C_SHU[1]-C_HONEY[1])*t1;
    var b=C_HONEY[2]+(C_SHU[2]-C_HONEY[2])*t1;
    if (v>0.34){
      var t2=(v-0.34)/0.66;
      r+=(C_SUOU[0]-r)*t2; g+=(C_SUOU[1]-g)*t2; b+=(C_SUOU[2]-b)*t2;
    }
    d[p]=r|0; d[p+1]=g|0; d[p+2]=b|0;
    d[p+3]=(Math.pow(v,0.62)*246)|0;
  }
  fieldCtx.putImageData(fieldImg,0,0);
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  if (ctx.imageSmoothingQuality!==undefined) ctx.imageSmoothingQuality='high';
  ctx.globalAlpha=0.94;
  ctx.drawImage(fieldCv,0,0,GW*CELL,GH*CELL);
  ctx.restore();
}

function drawThreads(t){
  var shim=retune;
  for (var i=0;i<NT;i++){
    var y=thF[i]*H;
    var amp=thAmp[i]*MN*0.019;
    var base=0.20+0.13*(i/(NT-1));
    ctx.strokeStyle=rgba(47,72,88,base+thFl[i]*0.5+shim*0.25);
    ctx.lineWidth=Math.max(0.7,MN*0.0016)*(1+thAmp[i]*1.4);
    ctx.beginPath();
    if (amp<0.4){
      ctx.moveTo(0,y); ctx.lineTo(W,y);
    } else {
      var seg=30, mode=1+(i%3);
      for (var s=0;s<=seg;s++){
        var u=s/seg, xx=u*W;
        var env=Math.sin(u*Math.PI);
        var yy=y+Math.sin(u*Math.PI*mode+thPh[i])*amp*env;
        if (s===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
      }
    }
    ctx.stroke();
    if (thFl[i]>0.04){
      var fr=MN*0.02*(1+(1-thFl[i])*5);
      ctx.strokeStyle=rgba(216,73,44,thFl[i]*0.75);
      ctx.lineWidth=Math.max(1,MN*0.0022);
      ctx.beginPath(); ctx.arc(thFX[i],y,fr,0,TAU); ctx.stroke();
    }
  }
}

function drawNest(){
  var x=nestGX*CELL, y=nestGY*CELL;
  var r=MN*0.038;
  ctx.fillStyle=rgba(125,42,30,0.20);
  ctx.beginPath(); ctx.ellipse(x,y,r*1.5,r*0.62,0,0,TAU); ctx.fill();
  ctx.fillStyle='#241f1c';
  ctx.beginPath(); ctx.ellipse(x,y,r*0.56,r*0.3,0,0,TAU); ctx.fill();
  if (nestPulse>0.02){
    ctx.strokeStyle=rgba(240,168,33,nestPulse*0.8);
    ctx.lineWidth=Math.max(1,MN*0.002);
    ctx.beginPath();
    ctx.ellipse(x,y,r*(0.6+(1-nestPulse)*1.5),r*(0.32+(1-nestPulse)*0.8),0,0,TAU);
    ctx.stroke();
  }
}

function drawAnts(){
  var n=Math.max(160,Math.round(AN*qual));
  var s=Math.max(1.3,MN*0.0040);
  var h=s*0.5;
  var i;
  ctx.fillStyle='#241f1c';
  for (i=0;i<n;i++){
    if (alad[i]) continue;
    ctx.fillRect(ax[i]*CELL-h,ay[i]*CELL-h,s,s);
  }
  ctx.fillStyle='#8a3d12';
  for (i=0;i<n;i++){
    if (!alad[i]) continue;
    ctx.fillRect(ax[i]*CELL-h,ay[i]*CELL-h,s*1.15,s*1.15);
  }
  ctx.fillStyle=rgba(240,168,33,0.9);
  var hs=Math.max(0.9,s*0.5);
  for (i=0;i<n;i++){
    if (!alad[i]) continue;
    ctx.fillRect(ax[i]*CELL-hs*0.5,ay[i]*CELL-hs*0.5-s*0.5,hs,hs);
  }
}

function drawSpecks(){
  for (var i=0;i<sN;i++){
    var a=clamp(slf[i],0,1);
    ctx.fillStyle=sgl[i]?rgba(240,168,33,a*0.85):rgba(36,31,28,a*0.6);
    var s=Math.max(1,MN*0.0026*a+0.6);
    ctx.fillRect(spx[i]-s*0.5,spy[i]-s*0.5,s,s);
  }
}

function drawHands(t){
  for (var k=0;k<2;k++){
    var h=HAND[k];
    if (!h.on||(t-h.t)>=LOST_S||!h.L) continue;
    var L=h.L;
    ctx.strokeStyle=rgba(47,72,88,h.fist?0.5:0.33);
    ctx.lineWidth=Math.max(1,MN*0.0022);
    ctx.beginPath();
    for (var c=0;c<HC.length;c++){
      var a=HC[c][0], b=HC[c][1];
      if (!lmOK(L,a)||!lmOK(L,b)) continue;
      ctx.moveTo(sx(L[a].x),sy(L[a].y));
      ctx.lineTo(sx(L[b].x),sy(L[b].y));
    }
    ctx.stroke();
    if (h.fist){
      if (!lmOK(L,9)) continue;
      var fx=sx(L[9].x), fy=sy(L[9].y);
      var pr=MN*0.03*(1+0.06*Math.sin(t*9));
      ctx.strokeStyle=rgba(47,72,88,0.45);
      ctx.lineWidth=Math.max(1,MN*0.0026);
      ctx.beginPath(); ctx.arc(fx,fy,pr,0,TAU); ctx.stroke();
      continue;
    }
    // the honey drop
    var dx=h.px, dy=h.py;
    if (!fin(dx)||!fin(dy)) continue;
    var puls=0.5+0.5*Math.sin(t*3.1+k*2);
    var rr=MN*0.028;
    var gr=null;
    try{ gr=ctx.createRadialGradient(dx,dy,0,dx,dy,rr*2.6); }catch(e){ gr=null; }
    if (gr){
      gr.addColorStop(0,rgba(240,168,33,0.55));
      gr.addColorStop(0.45,rgba(240,168,33,0.16));
      gr.addColorStop(1,rgba(240,168,33,0));
      ctx.fillStyle=gr;
      ctx.beginPath(); ctx.arc(dx,dy,rr*2.6,0,TAU); ctx.fill();
    }
    ctx.fillStyle=rgba(240,168,33,0.95);
    ctx.beginPath(); ctx.arc(dx,dy,rr*(0.36+0.05*puls),0,TAU); ctx.fill();
    ctx.strokeStyle=rgba(125,42,30,0.5);
    ctx.lineWidth=Math.max(0.8,MN*0.0016);
    ctx.beginPath(); ctx.arc(dx,dy,rr*(0.8+0.22*puls),0,TAU); ctx.stroke();
  }
}

function drawIssei(t){
  if (isseiActive(t)){
    var x=nestGX*CELL, y=nestGY*CELL;
    var a=clamp(1-(t-issT)/1.4,0,1);
    ctx.strokeStyle=rgba(240,168,33,a*0.8);
    ctx.lineWidth=Math.max(1.5,MN*0.006*a+1);
    ctx.beginPath(); ctx.arc(x,y,Math.max(1,issR),0,TAU); ctx.stroke();
    ctx.strokeStyle=rgba(125,42,30,a*0.35);
    ctx.lineWidth=Math.max(1,MN*0.002);
    ctx.beginPath(); ctx.arc(x,y,Math.max(1,issR*0.82),0,TAU); ctx.stroke();
  }
  if (issFlash>0.01){
    ctx.fillStyle=rgba(255,241,205,issFlash*0.55);
    ctx.fillRect(0,0,W,H);
  }
}

function drawHint(t){
  if (handLive(0)||handLive(1)) return;
  var a=0.30+0.16*Math.sin(t*1.8);
  ctx.fillStyle=rgba(47,72,88,a);
  ctx.font=Math.round(clamp(MN*0.036,13,21))+'px "Yuji Syuku", serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('人差し指を立てて、画面に近づけてください',W/2,H*0.38);
  ctx.font='200 '+Math.round(clamp(MN*0.026,11,15))+'px Manrope, sans-serif';
  ctx.fillStyle=rgba(47,72,88,a*0.66);
  ctx.fillText('指先が蜜になります',W/2,H*0.38+MN*0.058);
}

function draw(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (paperPat){ ctx.fillStyle=paperPat; } else { ctx.fillStyle='#f3ece0'; }
  ctx.fillRect(0,0,W,H);
  drawField();
  drawThreads(t);
  drawNest();
  drawAnts();
  drawSpecks();
  drawHands(t);
  drawIssei(t);
  if (started) drawHint(t);
}

function frame(){
  var t=now();
  var dt=clamp(t-last,0,0.1);
  last=t;
  var t0=now();
  if (started) step(dt,t);
  draw(t);
  if (started){
    var cost=(now()-t0)*1000;
    costS=costS+(cost-costS)*0.07;
    if (costS>26&&qual>0.32) qual=Math.max(0.32,qual-0.05);
    else if (costS<14&&qual<1) qual=Math.min(1,qual+0.02);
  }
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM ─ honey moves, a road grows behind it, a thread
//  is crossed and rings. Three beats, six seconds, no reading required.
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoT=0, demoRoad=[];
function demoFrame(){
  if (!demoCtx){ return; }
  var g=demoCtx, DW=demoCv.width, DH=demoCv.height;
  demoT+=1/60;
  var cyc=demoT%7;
  g.fillStyle='#f3ece0'; g.fillRect(0,0,DW,DH);
  var nx=DW*0.5, ny=DH*0.88;
  // threads
  var ti;
  for (ti=0;ti<5;ti++){
    var ty=DH*(0.78-ti*0.16);
    var ring=(cyc>1.4&&cyc<4.6)?Math.max(0,1-Math.abs((cyc-1.4)/0.62-ti)*1.5):0;
    if (cyc>5.2) ring=Math.max(0,1-Math.abs((cyc-5.2)/0.2-ti)*1.2);
    g.strokeStyle='rgba(47,72,88,'+(0.22+ring*0.6).toFixed(3)+')';
    g.lineWidth=1+ring*1.6;
    g.beginPath();
    if (ring>0.05){
      for (var s=0;s<=24;s++){
        var u=s/24, xx=u*DW;
        var yy=ty+Math.sin(u*Math.PI*2+demoT*22)*ring*7*Math.sin(u*Math.PI);
        if (s===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);
      }
    } else { g.moveTo(0,ty); g.lineTo(DW,ty); }
    g.stroke();
  }
  // honey path
  var ph=clamp((cyc-0.4)/3.4,0,1);
  var hx=nx+Math.sin(ph*Math.PI*1.15)*DW*0.30;
  var hy=ny-ph*DH*0.66;
  if (cyc<0.4){ hx=nx; hy=ny-DH*0.02; }
  if (cyc>3.8){ hx=nx+Math.sin(Math.PI*1.15)*DW*0.30; hy=ny-DH*0.66; }
  if (cyc<0.05) demoRoad=[];
  if (cyc>0.4&&cyc<3.8&&demoRoad.length<260) demoRoad.push([hx,hy]);
  // the road
  g.lineCap='round';
  for (var i=1;i<demoRoad.length;i++){
    var age=1-i/Math.max(1,demoRoad.length);
    g.strokeStyle='rgba('+(216-70*age)+','+(73-25*age)+','+(44-12*age)+','+(0.55-age*0.22).toFixed(3)+')';
    g.lineWidth=11-age*5;
    g.beginPath(); g.moveTo(demoRoad[i-1][0],demoRoad[i-1][1]); g.lineTo(demoRoad[i][0],demoRoad[i][1]); g.stroke();
  }
  // ants along the road
  var fist=(cyc>5.0);
  var na=46;
  for (var k=0;k<na;k++){
    var u2=((k/na)+demoT*0.22)%1;
    var ii=Math.floor(u2*Math.max(1,demoRoad.length-1));
    var p=demoRoad[ii];
    if (!p) continue;
    var jx=((k*37)%13-6)*0.7, jy=((k*17)%11-5)*0.7;
    g.fillStyle=(k%3===0)?'#8a3d12':'#241f1c';
    var sz=k%3===0?3.4:2.8;
    g.fillRect(p[0]+jx-sz/2,p[1]+jy-sz/2,sz,sz);
  }
  // nest
  g.fillStyle='rgba(125,42,30,.2)';
  g.beginPath(); g.ellipse(nx,ny,26,11,0,0,TAU); g.fill();
  g.fillStyle='#241f1c';
  g.beginPath(); g.ellipse(nx,ny,10,5,0,0,TAU); g.fill();
  // the hand token
  if (!fist){
    var gr2=null;
    try{ gr2=g.createRadialGradient(hx,hy,0,hx,hy,34); }catch(e){ gr2=null; }
    if (gr2){
      gr2.addColorStop(0,'rgba(240,168,33,.55)');
      gr2.addColorStop(1,'rgba(240,168,33,0)');
      g.fillStyle=gr2; g.beginPath(); g.arc(hx,hy,34,0,TAU); g.fill();
    }
    g.fillStyle='#f0a821'; g.beginPath(); g.arc(hx,hy,7,0,TAU); g.fill();
    g.strokeStyle='rgba(125,42,30,.5)'; g.lineWidth=1.4;
    g.beginPath(); g.arc(hx,hy,13,0,TAU); g.stroke();
  } else {
    g.strokeStyle='rgba(47,72,88,.55)'; g.lineWidth=2.2;
    g.beginPath(); g.arc(hx,hy,12,0,TAU); g.stroke();
    g.beginPath(); g.arc(nx,ny,(cyc-5.0)*260,0,TAU);
    g.strokeStyle='rgba(240,168,33,'+clamp(1-(cyc-5.0)/1.6,0,1).toFixed(3)+')';
    g.lineWidth=3; g.stroke();
  }
  var label;
  if (cyc<1.4) label='指先が蜜になる';
  else if (cyc<3.8) label='蟻が通った跡が、道になる';
  else if (cyc<5.0) label='道が糸をまたぐたび、一音';
  else label='両手を握れば ── 一斉';
  g.fillStyle='rgba(36,31,28,.78)';
  g.font='15px "Yuji Syuku", serif'; g.textAlign='center';
  g.fillText(label,DW/2,22);
  if (demoRun && typeof requestAnimationFrame==='function') requestAnimationFrame(demoFrame);
}
if (demoCtx) demoFrame();

// ═══════════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════════
