<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HIROI ─ 部屋の音を拾う</title>
<meta name="description" content="マイクが直前の六秒間をずっと録りつづけ、その六秒が地層になって横たわる。両手はその上の採取針で、触れた場所の音が粒になって舞い上がる。手の高さが音程、手の開きが粒の密度、手の速さが粒の長さ。握れば地層が凍り、その一瞬をいつまでも弾いていられる。">
<meta name="theme-color" content="#0d0e12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;500&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  HIROI ─ 部屋の音を拾う                           ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   墨    sumi      #0d0e12  the ground. near-black, faintly blue
            鉛    namari    #23262e  every frame, rule and gutter
            琥珀  kohaku    #e8a33d  the recorded strata, and ONLY the strata
            白緑  byakuroku #7fd6b5  the live write head and the hands
            灰    hai       #8d8f99  every label, never brighter than this
            MOOD: a core sample of the last six seconds, laid on a bench in
            a dark room under one warm lamp. Exactly ONE warm colour in the
            whole piece; everything else is grey so the amber reads as
            material rather than as glow. This is the collection's dark
            piece for tonight — the other two are daylight.
  BACKGROUND  Near-black, with the fine horizontal ruling of chart-recorder
            paper drawn once to an offscreen canvas, and a single soft
            elliptical pool of lamplight behind the strata band. The camera
            is composited over the whole field at very low alpha so the room
            you are recording is faintly visible behind its own sediment.
  TYPE      IBM Plex Mono 200 for every number and unit — times, ratios,
            grain counts — tracked +0.22em and kept small and grey. Zen Old
            Mincho 700 for the few Japanese words that are allowed to be
            large (凍, 音階 names). Nothing shouts here; this is an
            instrument, not a game, so the type never competes with the band.
  MOTION    Floaty and slow, the exact opposite of a game. Every value the
            eye tracks is an exponential approach with a long constant
            (0.10–0.25s), never a linear tween. Grains drift upward out of
            the band and fade over ~1.1s. The freeze latch fills over 300ms.
            Nothing snaps except the moment the strata stop scrolling.
  SIGNATURE THE STRATA. The last six seconds of the room are laid out as a
            band of sediment: one column per rendered frame, its height the
            RMS of that instant and its colour temperature the spectral
            centroid, so a hiss is pale and a thump is deep amber. It
            scrolls continuously, oldest at the left, now at the right —
            and your hands are picking grains OUT of it, each one drawn
            flying from the moment it was taken to the hand that took it.
            You can see sound being picked up.
  AUDIO     Real granular synthesis over a live 6-second ring buffer. Every
            grain is a Hann-windowed slice copied out of the buffer at play
            time, so the source is genuinely the room and not a synthesised
            imitation of it. Rate is quantised to one of three Japanese
            modes (陰旋 / 律 / 琉球) across four octaves so the cloud has
            real voice-leading. Grain length rides hand SPEED — still hands
            make long smeared drones, fast hands make short scrub — and
            density rides hand openness. A filtered feedback delay turns
            sparse grains into a cloud. One compressor at the end.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d0e12;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{font-family:'IBM Plex Mono',ui-monospace,monospace;color:#8d8f99}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #video{position:fixed;width:2px;height:2px;opacity:.001;pointer-events:none;left:0;top:0}

  #flip{
    position:fixed;right:calc(env(safe-area-inset-right,0px) + .8rem);
    top:calc(env(safe-area-inset-top,0px) + .8rem);z-index:30;
    background:rgba(20,22,28,.8);color:#8d8f99;border:1px solid #2c3038;border-radius:1px;
    padding:.42rem .7rem;font:400 .62rem/1 'IBM Plex Mono',monospace;letter-spacing:.2em;
    cursor:pointer;backdrop-filter:blur(6px)
  }
  #flip:active{border-color:#e8a33d;color:#e8a33d}
  #bar{
    position:fixed;left:50%;transform:translateX(-50%);z-index:30;
    bottom:calc(env(safe-area-inset-bottom,0px) + .9rem);
    display:flex;gap:1px;background:#1a1d24;border:1px solid #2c3038;border-radius:1px;padding:1px
  }
  #bar button{
    background:transparent;border:none;color:#6f7280;cursor:pointer;
    font:400 .66rem/1 'Zen Old Mincho',serif;letter-spacing:.24em;
    padding:.5rem .95rem;transition:color .25s ease,background .25s ease
  }
  #bar button.on{background:#e8a33d;color:#0d0e12}
  #note{
    position:fixed;left:50%;transform:translateX(-50%);z-index:30;
    top:calc(env(safe-area-inset-top,0px) + .85rem);display:none;
    font:400 .62rem/1.6 'IBM Plex Mono',monospace;letter-spacing:.08em;
    color:#c98a3a;background:rgba(20,16,10,.8);border:1px solid #4a3a20;
    padding:.4rem .7rem;border-radius:1px;text-align:center;max-width:80vw
  }
  #err{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;
    display:none;max-width:22rem;white-space:pre-wrap;text-align:center;
    background:#16181e;border:1px solid #7a4028;border-radius:2px;padding:1rem 1.1rem;
    font:400 .76rem/1.85 'Zen Old Mincho',serif;color:#d8b9a0
  }

  .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#0d0e12;padding:1.2rem;overflow:auto}
  .sheet.hide{display:none}
  .panel{width:min(30rem,100%);position:relative;border:1px solid #23262e;background:#101218;padding:1.7rem 1.5rem 1.6rem}
  .kicker{display:flex;justify-content:space-between;font:200 .58rem/1 'IBM Plex Mono',monospace;
    letter-spacing:.3em;color:#5b5e6a;margin-bottom:1.3rem}
  .panel h1{font-family:'Zen Old Mincho',serif;font-weight:700;font-size:clamp(2.2rem,10vw,2.9rem);
    line-height:1;color:#e8e4dc;letter-spacing:.02em}
  .panel h1 b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:200;
    font-size:.26em;letter-spacing:.46em;color:#e8a33d;margin-top:.9rem}
  #demo{display:block;width:100%;height:auto;margin:1.3rem 0 1.1rem;background:#0a0b0f;border:1px solid #23262e}
  .lead{font:400 .82rem/2 'Zen Old Mincho',serif;color:#a5a7b0}
  .lead em{font-style:normal;color:#e8a33d}
  .rules{list-style:none;margin:1rem 0 1.4rem;border-top:1px solid #23262e}
  .rules li{font:400 .7rem/1.7 'Zen Old Mincho',serif;color:#71747f;padding:.5rem 0 .5rem .95rem;
    border-bottom:1px solid #1b1e25;position:relative}
  .rules li::before{content:'';position:absolute;left:0;top:1.05em;width:4px;height:4px;background:#e8a33d}
  .go{display:block;width:100%;padding:.85rem;background:#e8a33d;color:#0d0e12;border:none;
    font:500 .76rem/1 'IBM Plex Mono',monospace;letter-spacing:.44em;text-indent:.44em;cursor:pointer;
    transition:transform .16s ease,background .16s ease}
  .go:active{transform:scale(.985);background:#c98a3a}
</style>
</head>
<body>

<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="note"></div>
<div id="bar">
  <button id="mIn"  class="on">陰</button>
  <button id="mRi">律</button>
  <button id="mOk">琉球</button>
</div>
<div id="err"></div>

<div class="sheet" id="startSheet">
  <div class="panel">
    <div class="kicker"><span>OTO-II / HIROI</span><span>GRANULAR</span></div>
    <h1>拾い<b>HIROI</b></h1>
    <canvas id="demo" width="600" height="290"></canvas>
    <p class="lead">マイクは<em>直前の六秒</em>をずっと録っている。その六秒が地層になって横たわり、両手は<em>採取針</em>になる。触れた場所の音が粒になって舞い上がる。</p>
    <ul class="rules">
      <li>手の高さが音程、手の開きが粒の密度、手の速さが粒の長さ</li>
      <li>握ると地層が凍る。その一瞬をいつまでも弾いていられる</li>
      <li>鳴っているのは合成音ではなく、いまの部屋そのもの</li>
    </ul>
    <button class="go" id="startBtn">START</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  HIROI ─ 部屋の音を拾う
//  A live 6-second ring buffer of the room, and two hands picking
//  Hann-windowed grains out of it.  Nothing here is synthesised: every
//  sample that reaches the speakers came in through the microphone.
// ═══════════════════════════════════════════════════════════════════════
var view = document.getElementById('view');
var g    = view.getContext('2d');
var video= document.getElementById('video');
var errBox   = document.getElementById('err');
var noteBox  = document.getElementById('note');
var flipBtn  = document.getElementById('flip');
var startSheet = document.getElementById('startSheet');
var startBtn   = document.getElementById('startBtn');
var demoCv     = document.getElementById('demo');
var mInBtn = document.getElementById('mIn');
var mRiBtn = document.getElementById('mRi');
var mOkBtn = document.getElementById('mOk');

var now = (typeof performance !== 'undefined' && performance.now)
  ? function(){ return performance.now()/1000; }
  : function(){ return Date.now()/1000; };

function num(v,d){ return (typeof v==='number' && isFinite(v)) ? v : d; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function approach(cur, tgt, tau, dt){
  var k = 1 - Math.exp(-dt/Math.max(1e-4, tau));
  return cur + (tgt-cur)*k;
}

var C_SUMI='#0d0e12', C_NAMARI='#23262e', C_KOHAKU='#e8a33d',
    C_BYAKU='#7fd6b5', C_HAI='#8d8f99';

// ═══════════════════════════════════════════════════════════════════════
//  LAYOUT
// ═══════════════════════════════════════════════════════════════════════
var W=1,H=1,DPR=1;
var bandX=0, bandY=0, bandW=1, bandH=1;
var paperCv=null, paperG=null;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth|0);
  H = Math.max(1, window.innerHeight|0);
  view.width = Math.max(1,(W*DPR)|0); view.height = Math.max(1,(H*DPR)|0);
  view.style.width=W+'px'; view.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
  var m = Math.min(46, W*0.07);
  bandX = m; bandW = Math.max(40, W - m*2);
  bandH = clamp(H*0.24, 90, 260);
  bandY = H*0.60 - bandH/2;
  if (H > W*1.4) bandY = H*0.62 - bandH/2;
  buildPaper();
}
function buildPaper(){
  if (!paperCv) paperCv = document.createElement('canvas');
  paperCv.width=Math.max(1,(W*DPR)|0); paperCv.height=Math.max(1,(H*DPR)|0);
  paperG = paperCv.getContext('2d');
  if (!paperG) return;
  paperG.setTransform(DPR,0,0,DPR,0,0);
  paperG.fillStyle=C_SUMI; paperG.fillRect(0,0,W,H);
  // chart-recorder ruling
  paperG.lineWidth=1;
  var y;
  for (y=0;y<H;y+=6){
    paperG.strokeStyle = (((y/6)|0)%5===0) ? 'rgba(255,255,255,.026)' : 'rgba(255,255,255,.012)';
    paperG.beginPath(); paperG.moveTo(0,y+0.5); paperG.lineTo(W,y+0.5); paperG.stroke();
  }
  // one lamp, behind the band
  var lg = paperG.createRadialGradient(W/2, bandY+bandH/2, 4, W/2, bandY+bandH/2, Math.max(W,H)*0.55);
  lg.addColorStop(0,'rgba(232,163,61,.075)');
  lg.addColorStop(0.45,'rgba(232,163,61,.022)');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  paperG.fillStyle=lg; paperG.fillRect(0,0,W,H);
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ the ring buffer and the grain engine
// ═══════════════════════════════════════════════════════════════════════
var A=null, comp=null, master=null, grainBus=null, dly=null, dlyG=null, dlyF=null;
var micSrc=null, proc=null, sinkG=null, ana=null, anaData=null;
var audioOn=false, micOK=false;

var BUFSEC = 6.0;
var ring=null, ringN=0, ringW=0, ringFilled=0, SR=48000;
var frozen=false, freezeAt=0;

var COLS = 384;
var colRms=new Float32Array(COLS), colCen=new Float32Array(COLS), colW=0, colFilled=0;
var colAccT=0, COL_DT=1/60;

function initAudio(){
  if (audioOn) return true;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  try{ A = new AC(); }catch(e){ A=null; return false; }
  SR = num(A.sampleRate, 48000);
  ringN = Math.max(1024, Math.round(BUFSEC*SR));
  ring = new Float32Array(ringN);
  ringW = 0; ringFilled = 0;

  comp = A.createDynamicsCompressor();
  try{
    comp.threshold.value=-20; comp.knee.value=26; comp.ratio.value=6;
    comp.attack.value=0.006; comp.release.value=0.24;
  }catch(e){}
  master = A.createGain(); master.gain.value=0.95;
  comp.connect(master); master.connect(A.destination);

  grainBus = A.createGain(); grainBus.gain.value=1.0;
  grainBus.connect(comp);
  // a filtered feedback delay turns sparse grains into a cloud
  dly = A.createDelay(1.2); dly.delayTime.value=0.285;
  dlyF = A.createBiquadFilter(); dlyF.type='lowpass'; dlyF.frequency.value=2600; dlyF.Q.value=0.7;
  dlyG = A.createGain(); dlyG.gain.value=0.34;
  grainBus.connect(dly); dly.connect(dlyF); dlyF.connect(dlyG);
  dlyG.connect(dly); dlyF.connect(comp);

  audioOn = true;
  return true;
}
function attachMic(stream){
  if (!audioOn || !A || !stream) return false;
  try{
    micSrc = A.createMediaStreamSource(stream);
  }catch(e){ return false; }
  ana = A.createAnalyser();
  try{ ana.fftSize=1024; ana.smoothingTimeConstant=0.55; }catch(e){}
  anaData = new Uint8Array(num(ana.frequencyBinCount, 512));
  micSrc.connect(ana);

  if (typeof A.createScriptProcessor === 'function'){
    try{ proc = A.createScriptProcessor(2048, 1, 1); }catch(e){ proc=null; }
  }
  if (proc){
    proc.onaudioprocess = function(ev){
      if (frozen) return;
      var inp;
      try{ inp = ev.inputBuffer.getChannelData(0); }catch(e){ return; }
      var n = inp.length, i;
      for (i=0;i<n;i++){
        var s = inp[i];
        ring[ringW] = (typeof s==='number' && isFinite(s)) ? s : 0;
        ringW++; if (ringW >= ringN) ringW = 0;
      }
      if (ringFilled < ringN) ringFilled = Math.min(ringN, ringFilled + n);
    };
    micSrc.connect(proc);
    // some engines will not run a ScriptProcessor unless its output is routed
    sinkG = A.createGain(); sinkG.gain.value = 0;
    proc.connect(sinkG); sinkG.connect(A.destination);
  }
  micOK = true;
  return true;
}

// ── the modes.  Real Japanese scales, four octaves of them. ────────────
var MODES = {
  'in':  [0,1,5,7,8],      // 陰旋法
  'ri':  [0,2,5,7,9],      // 律旋法
  'ok':  [0,4,5,7,11]      // 琉球音階
};
var modeKey='in', pitchTable=[];
function buildPitches(){
  var deg = MODES[modeKey] || MODES['in'];
  pitchTable = [];
  var o,i;
  for (o=-2;o<=1;o++) for (i=0;i<deg.length;i++) pitchTable.push(o*12 + deg[i]);
  pitchTable.sort(function(a,b){ return a-b; });
}
buildPitches();

function setMode(k, btn){
  if (!MODES[k]) return;
  modeKey = k; buildPitches();
  [mInBtn,mRiBtn,mOkBtn].forEach(function(b){ if (b) b.classList.remove('on'); });
  if (btn) btn.classList.add('on');
}
if (mInBtn) mInBtn.addEventListener('click', function(){ setMode('in', mInBtn); });
if (mRiBtn) mRiBtn.addEventListener('click', function(){ setMode('ri', mRiBtn); });
if (mOkBtn) mOkBtn.addEventListener('click', function(){ setMode('ok', mOkBtn); });

// ── a grain ────────────────────────────────────────────────────────────
// `at` is 0..1 across the buffer, 1 being the newest sample.
// outLen is the duration you will HEAR; the slice taken from the buffer is
// scaled by the rate so pitch does not change how long a grain lasts.
var grainsThisSec=0, grainSecT=0, grainCount=0;

function emitGrain(at, rate, outLen, pan, level){
  if (!audioOn || !A || !ring || ringFilled < SR*0.12) return false;
  at = clamp(num(at,0.5),0,1);
  rate = clamp(num(rate,1), 0.2, 3.0);
  outLen = clamp(num(outLen,0.09), 0.02, 0.42);
  pan = clamp(num(pan,0), -1, 1);
  level = clamp(num(level,0.12), 0, 0.5);

  var srcLen = Math.round(outLen*rate*SR);
  if (srcLen < 32) srcLen = 32;
  var avail = Math.min(ringFilled, ringN) - 8;
  if (avail < 64) return false;
  if (srcLen > avail) srcLen = avail;

  // ringW is the next slot to be written, so ringW-1 is "now".
  var back = Math.round((1-at) * (avail - srcLen));   // samples further into the past
  var startIdx = ringW - 1 - back - srcLen;
  while (startIdx < 0) startIdx += ringN;

  var buf;
  try{ buf = A.createBuffer(1, srcLen, SR); }catch(e){ return false; }
  var d;
  try{ d = buf.getChannelData(0); }catch(e){ return false; }
  var i, idx = startIdx, twoPiOverN = 6.283185307/(srcLen-1);
  var peak = 0;
  for (i=0;i<srcLen;i++){
    var w = 0.5 - 0.5*Math.cos(twoPiOverN*i);       // Hann, so no clicks ever
    var v = ring[idx] * w;
    d[i] = v;
    if (v > peak) peak = v; else if (-v > peak) peak = -v;
    idx++; if (idx >= ringN) idx = 0;
  }
  if (peak < 1e-5) return false;                     // silence is not worth a node

  var src;
  try{ src = A.createBufferSource(); }catch(e){ return false; }
  src.buffer = buf;
  try{ src.playbackRate.value = rate; }catch(e){}
  var gn = A.createGain();
  try{ gn.gain.value = level; }catch(e){}
  var out = gn;
  if (typeof A.createStereoPanner === 'function'){
    var pn = A.createStereoPanner();
    try{ pn.pan.value = pan; }catch(e){}
    gn.connect(pn); out = pn;
  }
  src.connect(gn); out.connect(grainBus);
  var t = A.currentTime;
  try{ src.start(t); src.stop(t + outLen + 0.04); }catch(e){ return false; }
  grainCount++;
  return true;
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA + MIC
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null, camOK=false;

function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display='block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function showNote(txt){
  if (!noteBox) return;
  noteBox.style.display='block';
  noteBox.textContent = txt;
}
function stopStream(){
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  stream = null;
}
// One prompt for both if we can get it; fall back to video alone and say so.
function startStream(wantAudio){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  stopStream();
  var vc = { facingMode:{ ideal:facing }, width:{ ideal:960 }, height:{ ideal:720 } };
  var first = wantAudio
    ? md.getUserMedia({ video:vc, audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } })
    : md.getUserMedia({ video:vc, audio:false });
  return first.catch(function(e){
    if (!wantAudio) throw e;
    return md.getUserMedia({ video:vc, audio:false }).then(function(st){
      showNote('マイクを使えませんでした。地層は流れますが、音は拾えません。');
      return st;
    });
  }).then(function(st){
    stream = st; video.srcObject = st; mirror = (facing==='user'); camOK = true;
    var at = st.getAudioTracks ? st.getAudioTracks() : [];
    if (at && at.length && !micOK) attachMic(st);
    if ((!at || !at.length) && !micOK) showNote('マイクを使えませんでした。地層は流れますが、音は拾えません。');
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing==='user') ? 'environment' : 'user';
  loseHands();
  // keep the microphone we already have; only the camera is being swapped
  startStream(!micOK).then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  HANDS ─ two picking needles
//    openness  : mean fingertip distance from the palm centre, divided by
//                the wrist→middle-MCP length, so it survives depth changes
//    speed     : normalised units per second, smoothed
//  The freeze latch needs hysteresis or a hand hovering at the threshold
//  toggles every frame: close below FIST_IN for HOLD seconds to fire, then
//  the hand must re-open past FIST_OUT before it can fire again.  A
//  tracking dropout clears the latch so nothing fires on reacquisition.
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST = 0.32;
var JUMP = 0.34;   // normalised. A bigger step than this is a new hand, not motion.
var FIST_IN = 0.46, FIST_OUT = 0.66, HOLD = 0.30;

function Hand(){
  this.live=false; this.t=-1e9;
  this.x=0.5; this.y=0.5; this.px=0.5; this.py=0.5;
  this.open=1; this.openS=1; this.speed=0; this.speedS=0;
  this.lm=null; this.holdT=0; this.armed=true; this.next=0;
}
var HS = [new Hand(), new Hand()];

function loseHands(){
  for (var i=0;i<HS.length;i++){
    var h=HS[i];
    h.live=false; h.lm=null; h.speed=0; h.speedS=0;
    h.holdT=0; h.armed=true; h.next=0;
  }
}
function loseHand(h){
  h.live=false; h.lm=null; h.speed=0; h.speedS=0; h.holdT=0; h.armed=true; h.next=0;
}
function initHands(){
  if (typeof window.Hands !== 'function') return false;
  try{
    hands = new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ return false; }
}
function startMpCamera(){
  if (!mpReady || !hands || mpCamera) return;
  if (typeof window.Camera !== 'function') return;
  try{
    mpCamera = new window.Camera(video, {
      onFrame:function(){
        if (!hands) return Promise.resolve();
        return hands.send({ image: video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}
function validLm(c){
  if (!c || c.length < 21) return null;
  for (var i=0;i<21;i++){
    var p=c[i];
    if (!p || typeof p.x!=='number' || typeof p.y!=='number' ||
        !isFinite(p.x) || !isFinite(p.y)) return null;
  }
  return c;
}
function measureHand(c){
  var ids=[0,5,9,13,17], cx=0, cy=0, i, p;
  for (i=0;i<ids.length;i++){
    p=c[ids[i]]; if (!p) return null;
    cx+=p.x; cy+=p.y;
  }
  cx/=ids.length; cy/=ids.length;
  var wr=c[0], mid=c[9];
  if (!wr || !mid) return null;
  var sx=mid.x-wr.x, sy=mid.y-wr.y;
  var scale=Math.sqrt(sx*sx+sy*sy);
  if (!isFinite(scale) || scale < 1e-4) return null;
  var tips=[4,8,12,16,20], sum=0, k;
  for (k=0;k<tips.length;k++){
    p=c[tips[k]]; if (!p) return null;
    var dx=p.x-cx, dy=p.y-cy;
    sum += Math.sqrt(dx*dx+dy*dy);
  }
  var open = (sum/tips.length)/scale;
  if (!isFinite(open)) return null;
  // a flat open hand sits near 1.6, a fist near 0.75 — remap to roughly 0..1
  open = clamp((open - 0.72)/0.95, 0, 1.35);
  if (!isFinite(cx) || !isFinite(cy)) return null;
  return { x:cx, y:cy, open:open, lm:c };
}
function onHands(res){
  var t = now();
  var list = (res && res.multiHandLandmarks) ? res.multiHandLandmarks : null;
  var got = [];
  if (list){
    for (var i=0;i<list.length && got.length<2;i++){
      var c = validLm(list[i]);
      if (!c) continue;
      var m = measureHand(c);
      if (m) got.push(m);
    }
  }
  // Stable assignment: leftmost ON SCREEN to slot 0.  Ordering by the raw
  // landmark x instead would reverse the slots under the mirror, so
  // flipping the camera would hand each hand the other one's latch state.
  var q;
  for (q=0;q<got.length;q++) got[q].sx = mirror ? (1-got[q].x) : got[q].x;
  got.sort(function(a,b){ return a.sx - b.sx; });
  var j;
  for (j=0;j<HS.length;j++){
    var h = HS[j], m2 = got[j];
    if (!m2){ if (h.live && t - h.t > LOST) loseHand(h); continue; }
    var x = mirror ? (1-m2.x) : m2.x, y = m2.y;
    x = clamp(x,0,1); y = clamp(y,0,1);
    var gap = t - h.t;
    var jdx = x - h.px, jdy = y - h.py;
    var jumped = h.live && (jdx*jdx + jdy*jdy) > JUMP*JUMP;
    if (!h.live || gap > LOST || jumped){
      // a fresh acquisition must not read as a huge velocity
      h.px = x; h.py = y; h.speed = 0; h.speedS = 0;
      h.holdT = 0; h.armed = true; h.openS = m2.open;
    } else if (gap > 1e-4){
      var dx=x-h.px, dy=y-h.py;
      var v = Math.sqrt(dx*dx+dy*dy)/gap;
      h.speed = isFinite(v) ? Math.min(v, 6) : 0;
      h.px = x; h.py = y;
    }
    h.live=true; h.t=t; h.x=x; h.y=y; h.open=m2.open; h.lm=c2lm(m2.lm, x, y);
  }
}
// landmark positions, already mirrored, for drawing
function c2lm(c, hx, hy){
  if (!c) return null;
  var out=[], i, p;
  for (i=0;i<21;i++){
    p=c[i];
    if (!p) return null;
    out.push({ x: mirror ? (1-p.x) : p.x, y: p.y });
  }
  return out;
}

// ═══════════════════════════════════════════════════════════════════════
//  FREEZE
// ═══════════════════════════════════════════════════════════════════════
var freezeFlash=0;
function toggleFreeze(){
  frozen = !frozen;
  freezeFlash = 1;
  if (frozen) freezeAt = colW;
}
var FRESH = 0.12;   // s.  Older than this and the pose is a memory, not an observation.
function gestureStep(dt, t){
  var i;
  for (i=0;i<HS.length;i++){
    var h=HS[i];
    if (!h.live){ h.holdT=0; h.armed=true; continue; }
    // Stale landmarks must not advance the latch.  Without this the hand
    // vanishing mid-close still fires a freeze ~0.3s later.
    if (t - h.t > FRESH){ h.holdT = 0; continue; }
    h.openS  = approach(h.openS, h.open, 0.07, dt);
    h.speedS = approach(h.speedS, h.speed, 0.09, dt);
    if (h.openS < FIST_IN){
      if (h.armed){
        h.holdT += dt;
        if (h.holdT >= HOLD){ toggleFreeze(); h.armed=false; h.holdT=0; }
      }
    } else {
      h.holdT = 0;
      if (h.openS > FIST_OUT) h.armed = true;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  STRATA ─ one column per rendered frame
// ═══════════════════════════════════════════════════════════════════════
function pushColumn(){
  var rms=0, cen=0.35;
  if (ana && anaData){
    try{ ana.getByteFrequencyData(anaData); }catch(e){}
    var n=anaData.length, i, sum=0, wsum=0;
    for (i=0;i<n;i++){
      var v=anaData[i]/255;
      sum += v; wsum += v*i;
    }
    if (sum > 1e-6){ cen = clamp((wsum/sum)/n, 0, 1); rms = clamp(sum/n*2.4, 0, 1); }
    else { rms = 0; cen = 0.35; }
  }
  if (!isFinite(rms)) rms=0;
  if (!isFinite(cen)) cen=0.35;
  colRms[colW]=rms; colCen[colW]=cen;
  colW = (colW+1) % COLS;
  if (colFilled < COLS) colFilled++;
}

// ═══════════════════════════════════════════════════════════════════════
//  MOTES ─ the grains, drawn flying from the band to the hand
// ═══════════════════════════════════════════════════════════════════════
var motes=[];
function addMote(bx,by,hx,hy,warm){
  if (motes.length > 260) return;
  motes.push({ x:bx, y:by, tx:hx, ty:hy, age:0, life:0.85+Math.random()*0.5,
               drift:(Math.random()-0.5)*26, warm:warm });
}
function stepMotes(dt){
  var i,m;
  for (i=motes.length-1;i>=0;i--){
    m=motes[i]; m.age+=dt;
    if (m.age>=m.life){ motes.splice(i,1); continue; }
    var k = clamp(m.age/m.life,0,1);
    m.x = m.x + (m.tx - m.x)*Math.min(1, dt*2.2) + m.drift*dt*(1-k);
    m.y = m.y + (m.ty - m.y)*Math.min(1, dt*2.2) - 26*dt*k;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  PLAY
// ═══════════════════════════════════════════════════════════════════════
var running=false, gps=0, gpsAcc=0, gpsT=0;

function pitchFor(y){
  var n = pitchTable.length;
  if (!n) return 1;
  // screen top is the top of the range
  var idx = Math.round((1-clamp(y,0,1))*(n-1));
  idx = clamp(idx, 0, n-1);
  var st = pitchTable[idx];
  return Math.pow(2, st/12);
}
function playStep(dt){
  if (!running || !audioOn || !micOK) return;
  var t = now(), i, emitted=0;
  for (i=0;i<HS.length;i++){
    var h = HS[i];
    if (!h.live) { h.next = 0; continue; }
    if (h.openS < FIST_IN) continue;              // a closed hand is not picking
    var dens = 7 + clamp(h.openS,0,1.2)*30;       // grains per second
    var per = 1/dens;
    if (!h.next || h.next < t - 0.4) h.next = t;
    var guard = 0;
    while (h.next <= t && guard < 5){
      var at = clamp(h.x, 0, 1);
      var jit = (Math.random()-0.5)*0.035;
      var rate = pitchFor(h.y);
      var outLen = 0.035 + (1 - clamp(h.speedS/0.85,0,1))*0.185;
      var pan = clamp((h.x-0.5)*1.7, -0.85, 0.85);
      var level = 0.155/Math.sqrt(Math.max(1, dens/9));
      if (emitGrain(clamp(at+jit,0,1), rate, outLen, pan, level)){
        emitted++;
        var mx = bandX + clamp(at+jit,0,1)*bandW;
        var my = bandY + bandH*(0.35 + Math.random()*0.4);
        addMote(mx, my, h.x*W, h.y*H, clamp(rate/2,0,1));
      }
      h.next += per;
      guard++;
    }
    if (guard >= 5) h.next = t + per;
  }
  gpsAcc += emitted;
  gpsT += dt;
  if (gpsT >= 0.5){ gps = gpsAcc/gpsT; gpsAcc=0; gpsT=0; }
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════════════════════
function amber(cen, a){
  // spectral centroid → colour temperature.  low = deep amber, high = pale.
  var k = clamp(num(cen,0.35),0,1);
  var r = Math.round(214 + k*40);
  var gg = Math.round(126 + k*104);
  var b  = Math.round(48 + k*150);
  return 'rgba('+r+','+gg+','+b+','+clamp(num(a,1),0,1).toFixed(3)+')';
}
var HAND_EDGES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function drawBand(){
  var mid = bandY + bandH/2;
  // frame
  g.save();
  g.strokeStyle = frozen ? C_KOHAKU : C_NAMARI;
  g.lineWidth = 1;
  g.strokeRect(bandX+0.5, bandY+0.5, bandW-1, bandH-1);
  // centre rule
  g.strokeStyle='rgba(255,255,255,.05)';
  g.beginPath(); g.moveTo(bandX, mid+0.5); g.lineTo(bandX+bandW, mid+0.5); g.stroke();
  g.restore();

  if (colFilled < 2) return;
  var n = colFilled, i;
  var cw = bandW/COLS;
  var half = bandH*0.46;
  g.save();
  g.beginPath(); g.rect(bandX, bandY, bandW, bandH); g.clip();
  var startDisplay = COLS - n;    // when not yet full, sediment fills from the right
  for (i=0;i<n;i++){
    var di = startDisplay + i;
    var idx = (colW - n + i + COLS*2) % COLS;
    var r = colRms[idx], c = colCen[idx];
    if (!(r>0.0015)) continue;
    var hgt = Math.max(0.7, r*half);
    var x = bandX + di*cw;
    g.fillStyle = amber(c, frozen ? 0.62 : 0.80);
    g.fillRect(x, mid-hgt, Math.max(0.7, cw+0.5), hgt*2);
  }
  g.restore();

  // the write head: where "now" is being laid down
  if (!frozen){
    var hx = bandX + bandW;
    g.save();
    g.strokeStyle=C_BYAKU; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(hx-0.5, bandY); g.lineTo(hx-0.5, bandY+bandH); g.stroke();
    g.restore();
  }
  // labels
  g.save();
  g.font='200 9.5px "IBM Plex Mono", monospace';
  g.fillStyle='rgba(141,143,153,.62)';
  g.fillText('-6.0s', bandX, bandY-8);
  g.textAlign='right';
  g.fillText(frozen? 'FROZEN' : 'NOW', bandX+bandW, bandY-8);
  g.textAlign='left';
  g.restore();

  if (frozen){
    g.save();
    g.globalAlpha = 0.85;
    g.font='700 '+Math.round(clamp(bandH*0.34,16,44))+'px "Zen Old Mincho", serif';
    g.fillStyle='rgba(232,163,61,.16)';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('凍', bandX+bandW/2, mid);
    g.restore();
    g.textAlign='left'; g.textBaseline='alphabetic';
  }
}

function drawHands(){
  var i,k;
  for (i=0;i<HS.length;i++){
    var h=HS[i];
    if (!h.live) continue;
    var hx=h.x*W, hy=h.y*H;
    var op = clamp(h.openS,0,1.3);
    var picking = op >= FIST_IN;

    // the plumb line down to the moment this hand is touching
    g.save();
    g.strokeStyle = picking ? 'rgba(127,214,181,.30)' : 'rgba(232,163,61,.34)';
    g.lineWidth=1; g.setLineDash([2,5]);
    var bx = bandX + clamp(h.x,0,1)*bandW;
    g.beginPath(); g.moveTo(bx, bandY); g.lineTo(bx, bandY+bandH); g.stroke();
    g.setLineDash([]);
    g.beginPath(); g.moveTo(hx, hy); g.lineTo(bx, bandY + bandH*0.5); g.stroke();
    g.restore();

    // skeleton
    if (h.lm){
      g.save();
      g.strokeStyle = picking ? 'rgba(127,214,181,.55)' : 'rgba(232,163,61,.62)';
      g.lineWidth=1.4;
      for (k=0;k<HAND_EDGES.length;k++){
        var a=h.lm[HAND_EDGES[k][0]], b=h.lm[HAND_EDGES[k][1]];
        if (!a || !b) continue;
        g.beginPath(); g.moveTo(a.x*W, a.y*H); g.lineTo(b.x*W, b.y*H); g.stroke();
      }
      g.fillStyle = picking ? 'rgba(127,214,181,.9)' : 'rgba(232,163,61,.9)';
      for (k=0;k<h.lm.length;k++){
        var p=h.lm[k];
        if (!p) continue;
        g.beginPath(); g.arc(p.x*W, p.y*H, k%4===0?2.4:1.4, 0, 6.2832); g.fill();
      }
      g.restore();
    }

    // the needle: a ring whose radius is openness, i.e. grain density
    g.save();
    var rr = 14 + op*26;
    g.strokeStyle = picking ? 'rgba(127,214,181,.5)' : 'rgba(232,163,61,.7)';
    g.lineWidth=1.2;
    g.beginPath(); g.arc(hx,hy,rr,0,6.2832); g.stroke();
    // the freeze latch, filling
    if (h.holdT > 0.001){
      g.strokeStyle=C_KOHAKU; g.lineWidth=3;
      g.beginPath(); g.arc(hx,hy,rr+6,-1.5708,-1.5708+clamp(h.holdT/HOLD,0,1)*6.2832); g.stroke();
    }
    g.restore();

    // pitch read-out, small and grey
    g.save();
    g.font='200 9px "IBM Plex Mono", monospace';
    g.fillStyle='rgba(141,143,153,.55)';
    var st = Math.round(Math.log(pitchFor(h.y))/Math.LN2*12);
    g.fillText((st>=0?'+':'')+st+'st', hx+rr+8, hy+3);
    g.restore();
  }
}

function drawMotes(){
  var i,m;
  g.save();
  for (i=0;i<motes.length;i++){
    m=motes[i];
    var k = clamp(m.age/m.life,0,1);
    var a = (1-k)*(1-k)*0.85;
    g.fillStyle = amber(0.25 + m.warm*0.6, a);
    var s = 1.4 + (1-k)*2.2;
    g.beginPath(); g.arc(m.x, m.y, s, 0, 6.2832); g.fill();
  }
  g.restore();
}

function drawHud(){
  var pad=16, top=14;
  g.save();
  g.font='200 9.5px "IBM Plex Mono", monospace';
  g.fillStyle='rgba(141,143,153,.5)';
  g.fillText('HIROI / 部屋の音を拾う', pad, top+9);
  var live = (HS[0].live?1:0)+(HS[1].live?1:0);
  var lines = [
    'GRAIN  ' + (gps<10?' ':'') + gps.toFixed(0) + ' /s',
    'HAND   ' + live + ' / 2',
    'BUF    ' + (ringN? (Math.min(ringFilled,ringN)/Math.max(1,SR)).toFixed(1) : '0.0') + ' s'
  ];
  g.textAlign='right';
  var i;
  for (i=0;i<lines.length;i++){
    g.fillStyle = 'rgba(141,143,153,'+(i===1 && !live ? 0.32 : 0.5)+')';
    g.fillText(lines[i], W-pad, top+9+i*13);
  }
  g.textAlign='left';
  if (!live){
    g.fillStyle='rgba(141,143,153,.4)';
    g.fillText('手が見えません', pad, top+24);
  }
  if (!micOK){
    g.fillStyle='rgba(201,138,58,.7)';
    g.fillText('マイクなし', pad, top+37);
  }
  g.restore();
}

function drawFrame(){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,W,H);
  if (paperCv) g.drawImage(paperCv, 0,0,W,H);

  // the room, faintly, behind its own sediment
  if (camOK && video.readyState>=2 && video.videoWidth>0){
    g.save();
    g.globalAlpha = 0.13;
    var vw=video.videoWidth, vh=video.videoHeight, sc=Math.max(W/vw,H/vh);
    var dw=vw*sc, dh=vh*sc;
    if (mirror){ g.translate(W,0); g.scale(-1,1); }
    g.drawImage(video, (W-dw)/2, (H-dh)/2, dw, dh);
    g.restore();
    g.save();
    g.fillStyle='rgba(13,14,18,.55)'; g.fillRect(0,0,W,H);
    g.restore();
  }

  drawBand();
  drawMotes();
  drawHands();
  drawHud();

  if (freezeFlash > 0.01){
    g.save();
    g.fillStyle='rgba(232,163,61,'+(freezeFlash*0.10).toFixed(3)+')';
    g.fillRect(0,0,W,H);
    g.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var last=now();
function loop(){
  requestAnimationFrame(loop);
  var t=now(), dt=t-last; last=t;
  if (!(dt>0)) dt=0.016;
  if (dt>0.05) dt=0.05;

  var i;
  for (i=0;i<HS.length;i++){ if (HS[i].live && t-HS[i].t > LOST) loseHand(HS[i]); }

  colAccT += dt;
  while (colAccT >= COL_DT){ colAccT -= COL_DT; if (!frozen) pushColumn(); }

  gestureStep(dt, t);
  playStep(dt);
  stepMotes(dt);
  freezeFlash = Math.max(0, freezeFlash - dt*2.6);
  drawFrame();
}

// ═══════════════════════════════════════════════════════════════════════
//  TEACHING DIAGRAM
// ═══════════════════════════════════════════════════════════════════════
var dgc = demoCv ? demoCv.getContext('2d') : null;
var dT=0, dRaf=0, dSeed=[];
(function(){ for (var i=0;i<120;i++) dSeed.push(Math.random()); })();
function drawDemo(){
  if (!dgc) return;
  var w=600,h=290;
  dT += 1/60;
  var loopT=4.2, tt=(dT%loopT)/loopT;
  dgc.clearRect(0,0,w,h);
  dgc.fillStyle='#0a0b0f'; dgc.fillRect(0,0,w,h);
  var bx=60, bw=480, by=150, bh=76, mid=by+bh/2;
  dgc.strokeStyle= tt>0.72 ? '#e8a33d' : '#23262e';
  dgc.lineWidth=1; dgc.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
  // sediment
  var i;
  for (i=0;i<120;i++){
    var ph = tt>0.72 ? 0 : dT*0.5;
    var v = 0.18 + Math.abs(Math.sin(i*0.31 + ph*3))*0.55*dSeed[i];
    var c = 0.2 + dSeed[(i*7)%120]*0.7;
    var hh = v*bh*0.44;
    dgc.fillStyle='rgba('+Math.round(214+c*40)+','+Math.round(126+c*104)+','+Math.round(48+c*150)+',.8)';
    dgc.fillRect(bx+i*(bw/120), mid-hh, bw/120+0.5, hh*2);
  }
  if (tt<=0.72){
    dgc.strokeStyle='#7fd6b5'; dgc.lineWidth=1.5;
    dgc.beginPath(); dgc.moveTo(bx+bw-0.5,by); dgc.lineTo(bx+bw-0.5,by+bh); dgc.stroke();
  } else {
    dgc.fillStyle='rgba(232,163,61,.16)';
    dgc.font='700 30px "Zen Old Mincho", serif'; dgc.textAlign='center'; dgc.textBaseline='middle';
    dgc.fillText('凍', bx+bw/2, mid); dgc.textAlign='left'; dgc.textBaseline='alphabetic';
  }
  // the hand, sweeping then closing
  var hx, hy, open;
  if (tt<0.62){ var q=tt/0.62; hx=bx+40+q*(bw-80); hy=88+Math.sin(q*7)*30; open=1; }
  else if (tt<0.72){ var q2=(tt-0.62)/0.10; hx=bx+bw-40; hy=88; open=1-q2; }
  else { hx=bx+bw-40; hy=88; open=0.12; }
  var rr=13+open*24;
  dgc.strokeStyle= open>0.46 ? 'rgba(127,214,181,.6)' : 'rgba(232,163,61,.85)';
  dgc.lineWidth=1.4;
  dgc.beginPath(); dgc.arc(hx,hy,rr,0,6.2832); dgc.stroke();
  for (i=0;i<5;i++){
    var a=-2.2+i*0.62;
    dgc.beginPath(); dgc.moveTo(hx,hy);
    dgc.lineTo(hx+Math.cos(a)*rr*(0.4+open*0.9), hy+Math.sin(a)*rr*(0.4+open*0.9));
    dgc.stroke();
  }
  dgc.strokeStyle='rgba(232,163,61,.28)'; dgc.setLineDash([2,5]); dgc.lineWidth=1;
  dgc.beginPath(); dgc.moveTo(hx,by); dgc.lineTo(hx,by+bh); dgc.stroke(); dgc.setLineDash([]);
  // motes rising
  if (open>0.46){
    for (i=0;i<9;i++){
      var k=((dT*1.6+i*0.31)%1);
      var mx=hx+(dSeed[i]-0.5)*40, my=mid-k*(mid-hy-6);
      dgc.fillStyle='rgba(232,163,61,'+((1-k)*0.75).toFixed(3)+')';
      dgc.beginPath(); dgc.arc(mx,my,1.6+(1-k)*1.8,0,6.2832); dgc.fill();
    }
  }
  dgc.fillStyle='rgba(141,143,153,.55)';
  dgc.font='200 11px "IBM Plex Mono", monospace';
  dgc.fillText('-6.0s', bx, by-9);
  dgc.textAlign='right'; dgc.fillText(tt>0.72?'FROZEN':'NOW', bx+bw, by-9); dgc.textAlign='left';
  dgc.fillText(tt>0.72? '握る = 凍る' : '触れた場所の音が鳴る', bx, 262);
  dRaf = requestAnimationFrame(drawDemo);
}

// ═══════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════
function begin(){
  initAudio();
  if (A && A.state === 'suspended'){ try{ A.resume(); }catch(e){} }
  startSheet.classList.add('hide');
  if (dRaf){ cancelAnimationFrame(dRaf); dRaf=0; }
  running = true;
  if (!camOK){
    startStream(true).then(function(){
      if (initHands()) startMpCamera();
    }).catch(showError);
  }
}
startBtn.addEventListener('click', begin);
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
if (dgc) drawDemo();
last = now();
loop();
</script>
