<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSYCHE MIRROR ─ みつめると、ほどける</title>
<meta name="description" content="カメラをじっと見つめると、顔がポスターの色面になり、髪が70年代サイケのリボンになって画面いっぱいにほどけていく。口をあけると花がさき、目を長めにとじると配色がかわる。目をそらすと元にもどる。">
<meta name="theme-color" content="#2b0826">
<!--
  ══════════════════════════════════════════════════════════════════════════
  PSYCHE MIRROR ─ みつめると、ほどける          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  出自      オーナーが持ち込んだ完成品（psyche_mirror.html、作者表記
            「アパート / APARTMENT」）。機構と絵はオーナーの設計のまま。
            ギャラリーの決まりに合わせる最小限の手直しだけを入れてある。

  MOOD      60〜70年代のサイケデリック・ポスター。イエロー・サブマリンや
            ピーター・マックスの、うねる帯と花。見つめることが引き金で、
            目をそらすと夢がさめるように元の映像へ戻る。

  PALETTE   配色は4つ（目を長めにとじるか「色をかえる」で切り替え）。
            マゼンタ・ドリーム / フラワー・パワー / サンセット・ファズ /
            モノクローム。UI は plum #2b0826・paper #fff4e8・pink #ff6b8e・
            teal #19c3c0・gold #ffc23d・violet #8b5cff。

  TYPE      Shrikhand（題字の太いレトロ体）と Zen Maru Gothic（本文）。

  MOTION    ほどける。帯は根元から先へ伸び、ノイズでうねり、先で巻く。
            顔は毎フレーム映像を3階調にポスタリゼーションして塗る。

  SIGNATURE 見つめること自体が合図。頭の向きと黒目の位置で「カメラを
            見ている」を判定し、2.5秒で全面がほどける。口で花、目で配色。

  手直し    ・⟲ カメラ（前面/背面の切り替え。鏡像は前面のときだけ）
            ・カメラ失敗時の文言をギャラリー共通の定型文に
            ・ランドマーク配列の長さと値のガード
            ・タイトルと説明の形式、このヘッダー
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

}

<canvas id="stage"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="intro">

<script type="module">
/* =========================================================
   Psyche Mirror — カメラを見つめると顔のまわりがサイケにほどける
   ========================================================= */
const TAU = Math.PI * 2, HALF_PI = Math.PI / 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function angDiff(b, a) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

/* ---------- value noise 3D ---------- */
const PERM = new Uint8Array(512);
(() => { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; })();
const h3 = (x, y, z) => PERM[(PERM[(PERM[x & 255] + (y & 255)) & 255] + (z & 255)) & 255] / 255;
const fade = t => t * t * (3 - 2 * t);
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const u = fade(x - xi), v = fade(y - yi), w = fade(z - zi);
  const a = h3(xi, yi, zi), b = h3(xi + 1, yi, zi), c = h3(xi, yi + 1, zi), d = h3(xi + 1, yi + 1, zi);
  const e = h3(xi, yi, zi + 1), f = h3(xi + 1, yi, zi + 1), g = h3(xi, yi + 1, zi + 1), k = h3(xi + 1, yi + 1, zi + 1);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (k - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return (y1 + (y2 - y1) * w) * 2 - 1;
}

/* ---------- palettes ---------- */
const PALS = [
  { name: 'マゼンタ・ドリーム', mono: false, bg: '#4a0b3b', base: '#ff6f91',
    accents: ['#ffb13b', '#19c3c0', '#8b5cff', '#ff3fa4', '#3b9dff', '#ffe45c', '#2fd47a', '#e8323c', '#ff8fd8'],
    face: { l: '#caaee8', m: '#9c7cc6', d: '#4a0b3b', lips: '#19b7b0', neck: null },
    ring: '#ffe45c', petal: ['#ff6f91', '#ffb13b', '#8b5cff', '#19c3c0'], core: '#ffe45c' },
  { name: 'フラワー・パワー', mono: false, bg: '#1d0f36', base: null,
    accents: ['#ff3d6e', '#ff8a1f', '#ffd21f', '#35d07f', '#18b8e8', '#5b5bff', '#b44cff', '#ff5fd2'],
    face: { l: '#aef0f2', m: '#6ccad8', d: '#1d0f36', lips: '#f0263f', neck: 'm' },
    ring: '#ff8a1f', petal: ['#ff5fd2', '#ff8a1f', '#b44cff', '#ffd21f'], core: '#ff3d6e' },
  { name: 'サンセット・ファズ', mono: false, bg: '#2a0c10', base: '#ff9a3c',
    accents: ['#ff4d4d', '#ffd23f', '#3ec1a8', '#c13cff', '#ff6fb5', '#7bd389', '#fff1c9'],
    face: { l: '#ffe0c2', m: '#f2a27a', d: '#2a0c10', lips: '#c1121f', neck: 'm' },
    ring: '#ffd23f', petal: ['#ff4d4d', '#ffd23f', '#ff6fb5', '#3ec1a8'], core: '#c13cff' },
  { name: 'モノクローム', mono: true, bg: '#ffffff', ink: '#170f16',
    face: { l: '#ffffff', m: '#ffffff', d: '#170f16', lips: '#170f16', neck: 'l' },
    ring: '#ffffff', petal: [], core: '#170f16' },
];
for (const p of PALS) p.face._rgb = { l: hexRGB(p.face.l), m: hexRGB(p.face.m), d: hexRGB(p.face.d) };

/* ---------- MediaPipe landmark indices ---------- */
const OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
const LIPS_O = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146];
const LIPS_I = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];
const MP_VER = '0.10.14';
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
const cv = $('#stage'), ctx = cv.getContext('2d');
const video = $('#cam');
const statusEl = $('#status'), toastEl = $('#toast'), msgEl = $('#msg');

/* ---------- state ---------- */
let W = 0, H = 0, DPR = 1, SMALL = false;
let vw = 0, vh = 0, vs = 1, vox = 0, voy = 0;
let started = false, loading = false, demo = false, demoAway = false, keyBloom = false;
let landmarker = null, lastVT = -1, lastSeen = -1e9, hasFace = false;
let palIdx = 0, faceMode = 'poster', quality = 1;
let facing = 'user', mirror = true, stream = null;
let tipUntil = 0, motion = 0, holdOff = 0;
const HOLD = 2.5;
const S = { mode: 'idle', charge: 0, G: 0, away: 0, flash: 0, bloom: 0, bloomSounded: false, blinkT: 0, blinkFired: false };
const det = { look: false, lookLoose: false, gazeOK: true, jaw: 0, eyesClosed: false };
const SM = new Float32Array(478 * 2); let smInit = false;
const FG = {
  ox: new Float32Array(36), oy: new Float32Array(36),
  lox: new Float32Array(20), loy: new Float32Array(20), lix: new Float32Array(20), liy: new Float32Array(20),
  C: { x: 0, y: 0 }, F: 100, Hf: 130, roll: 0, nose: { x: 0, y: 0 },
  jawL: { x: 0, y: 0 }, jawR: { x: 0, y: 0 }, chin: { x: 0, y: 0 }, mouth: 0,
};
const lagP = { x: 0, y: 0 }, LAG = { x: 0, y: 0 }; let lagInit = false; const prevC = { x: 0, y: 0 };

/* ---------- strands ---------- */
const MAXP = 128;
const PX = new Float32Array(MAXP), PY = new Float32Array(MAXP), NX = new Float32Array(MAXP), NY = new Float32Array(MAXP), WW = new Float32Array(MAXP);
const ROOTS = [], FRINGE = [], FIELD = [];
let fieldCell = 60, fieldStep = 12;
const FIELD_SWIRL = 0.32;

function pickPattern() { const r = Math.random(); return r < 0.34 ? 'stripes' : r < 0.64 ? 'lines' : r < 0.86 ? 'dots' : 'plain'; }
function makeStrand() {
  return {
    seed: rand(0, 500), bend: rand(-0.35, 0.35), waveA: rand(0.12, 0.42), waveK: rand(3, 9), phase: rand(0, TAU),
    speed: rand(0.35, 1.0) * (Math.random() < 0.5 ? -1 : 1), noiseA: rand(0.25, 0.65),
    curlStart: Math.random() < 0.5 ? rand(0.58, 0.8) : 9, curlSign: Math.random() < 0.5 ? -1 : 1,
    ci: (Math.random() * 16) | 0, cs: 1 + ((Math.random() * 3) | 0), par: (Math.random() * 2) | 0, pattern: pickPattern(),
    fall: 0, d: 0, N: 6,
  };
}
function addRoot(u) {
  const s = makeStrand(); s.u = u;
  const c = Math.cos(u * TAU); // 1 = top, -1 = chin
  s.fall = clamp((0.04 + 0.52 * (1 - (c + 1) / 2)) * rand(0.6, 1.4), 0, 0.85);
  s.len = rand(2.2, 4.0); s.w = rand(0.15, 0.3); s.N = 4 + ((Math.random() * 5) | 0); s.d = rand(0, 0.16);
  ROOTS.push(s);
}
function buildRoots() {
  ROOTS.length = 0;
  const n = SMALL ? 46 : 66;
  for (let i = 0; i < n; i++) { const u = (i + rand(0.1, 0.9)) / n; if (Math.abs(u - 0.5) < 0.11) continue; addRoot(u); }
  for (let i = 0; i < (SMALL ? 10 : 16); i++) addRoot((rand(-0.16, 0.16) + 1) % 1);
  ROOTS.sort((a, b) => Math.abs(a.u - 0.5) - Math.abs(b.u - 0.5)); // chin side first, crown last
  FRINGE.length = 0;
  for (const u of [0.9, 0.86, 0.94, 0.1, 0.14, 0.06]) {
    const s = makeStrand(); s.u = u; s.len = rand(1.3, 1.9); s.w = rand(0.13, 0.2); s.N = 4 + ((Math.random() * 3) | 0);
    s.d = rand(0.3, 0.42); s.fall = 0.45; s.curlStart = rand(0.6, 0.75); s.bend = 0; FRINGE.push(s);
  }
}
function buildField() {
  FIELD.length = 0;
  const cell = clamp(Math.min(W, H) * (SMALL ? 0.15 : 0.105), 40, 115);
  fieldCell = cell; fieldStep = cell * 0.2;
  for (let gy = -1; gy * cell < H + cell; gy++) for (let gx = -1; gx * cell < W + cell; gx++) {
    const s = makeStrand();
    s.x = (gx + rand(0.1, 0.9)) * cell; s.y = (gy + rand(0.1, 0.9)) * cell;
    s.W0 = cell * rand(0.78, 1.12); s.n = clamp(Math.round(rand(2.4, 3.8) * cell / fieldStep), 6, MAXP);
    s.N = 4 + ((Math.random() * 4) | 0); s.fall = rand(0, 0.3); s.dist = 0;
    FIELD.push(s);
  }
}

/* integrate one strand centerline into PX/PY */
function trace(s, x, y, baseA, step, n, ns, t, lagK) {
  let a = baseA + s.bend;
  const inv = 1 / (n - 1);
  for (let i = 0; i < n; i++) {
    const q = i * inv, k = Math.pow(q, 1.5) * lagK;
    PX[i] = x + LAG.x * k; PY[i] = y + LAG.y * k;
    let target = baseA + s.bend * (1 - q * 0.6);
    if (s.fall > 0) target += angDiff(HALF_PI, target) * s.fall * Math.min(1, q * 1.5);
    target += s.waveA * Math.sin(q * s.waveK + s.phase + t * s.speed) + noise3(x * ns, y * ns, t * 0.11 + s.seed) * s.noiseA;
    if (q < s.curlStart) a += angDiff(target, a) * 0.24;
    else { const c = (q - s.curlStart) / (1 - s.curlStart); a += s.curlSign * (0.08 + 0.62 * c * c); }
    x += Math.cos(a) * step; y += Math.sin(a) * step;
  }
}
function prep(n, vis, W0) {
  for (let i = 0; i < vis; i++) {
    const i0 = i > 0 ? i - 1 : 0, i1 = i < n - 1 ? i + 1 : n - 1;
    const dx = PX[i1] - PX[i0], dy = PY[i1] - PY[i0], l = Math.hypot(dx, dy) || 1;
    NX[i] = -dy / l; NY[i] = dx / l;
    const q = i / (n - 1);
    const w = q < 0.22 ? 0.6 + 0.4 * (q / 0.22) : 1 - 0.8 * Math.pow((q - 0.22) / 0.78, 1.25);
    const tip = Math.min(1, (vis - 1 - i) * 0.22 + 0.35);
    WW[i] = W0 * w * tip;
  }
}
function ribbonPath(vis, sc) {
  ctx.beginPath();
  for (let i = 0; i < vis; i++) { const h = WW[i] * 0.5 * sc, x = PX[i] + NX[i] * h, y = PY[i] + NY[i] * h; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  for (let i = vis - 1; i >= 0; i--) { const h = WW[i] * 0.5 * sc; ctx.lineTo(PX[i] - NX[i] * h, PY[i] - NY[i] * h); }
  ctx.closePath();
}
function colorOf(s, j, pal) {
  if (pal.base && (j + s.par) % 2 === 0) return pal.base;
  const A = pal.accents; return A[(s.ci + j * s.cs) % A.length];
}
function subline(vis, o) {
  ctx.beginPath();
  for (let i = 0; i < vis; i++) { const x = PX[i] + NX[i] * WW[i] * o, y = PY[i] + NY[i] * WW[i] * o; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
}
function colorRibbon(s, vis, W0, pal) {

async function initFace() {
  loading = true;
  try {
    let vision;
    try { vision = await import(`${MP_BASE}/vision_bundle.mjs`); }
    catch (e) { vision = await import(MP_BASE); }
    const { FaceLandmarker, FilesetResolver } = vision;
    const fs = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const opts = {
      baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' }, runningMode: 'VIDEO', numFaces: 1,
      outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true,
    };
    try { landmarker = await FaceLandmarker.createFromOptions(fs, opts); }
    catch (e) { opts.baseOptions.delegate = 'CPU'; landmarker = await FaceLandmarker.createFromOptions(fs, opts); }
  } catch (e) {
    console.warn('face model failed', e);
    demo = true; toast('デモモード');
  }
  loading = false;
}
function fillFG() {
  const gx = i => SM[2 * i], gy = i => SM[2 * i + 1];
  let cx = 0, cy = 0;
  for (let k = 0; k < 36; k++) { FG.ox[k] = gx(OVAL[k]); FG.oy[k] = gy(OVAL[k]); cx += FG.ox[k]; cy += FG.oy[k]; }
  FG.C.x = cx / 36; FG.C.y = cy / 36;
  for (let k = 0; k < 20; k++) { FG.lox[k] = gx(LIPS_O[k]); FG.loy[k] = gy(LIPS_O[k]); FG.lix[k] = gx(LIPS_I[k]); FG.liy[k] = gy(LIPS_I[k]); }
  FG.F = Math.max(20, Math.hypot(gx(454) - gx(234), gy(454) - gy(234)));
  FG.Hf = Math.max(26, Math.hypot(gx(152) - gx(10), gy(152) - gy(10)));
  let dx = gx(454) - gx(234), dy = gy(454) - gy(234); if (dx < 0) { dx = -dx; dy = -dy; }
  FG.roll = Math.atan2(dy, dx);
  FG.nose.x = gx(4); FG.nose.y = gy(4);
  FG.jawL.x = gx(172); FG.jawL.y = gy(172); FG.jawR.x = gx(397); FG.jawR.y = gy(397); FG.chin.x = gx(152); FG.chin.y = gy(152);
  FG.mouth = Math.hypot(gx(14) - gx(13), gy(14) - gy(13)) / FG.Hf;
}
function applyLandmarks(lm) {
  const n = Math.min(lm.length, 478), a = smInit ? 0.55 : 1;
  for (let i = 0; i < n; i++) {
    const p = lm[i]; if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) continue;
    const px = p.x * vw * vs + vox, sx = mirror ? W - px : px, sy = p.y * vh * vs + voy;
    SM[2 * i] += (sx - SM[2 * i]) * a; SM[2 * i + 1] += (sy - SM[2 * i + 1]) * a;
  }
  smInit = true; fillFG();
}
function demoFace() {
  const cx = W / 2, cy = H * 0.47, F = Math.min(W, H) * 0.27, Hf = F * 1.32;
  for (let k = 0; k < 36; k++) { const a = -HALF_PI + k / 36 * TAU; FG.ox[k] = cx + Math.cos(a) * F * 0.5; FG.oy[k] = cy + Math.sin(a) * Hf * 0.5; }
  for (let k = 0; k < 20; k++) { const a = Math.PI + k / 20 * TAU; FG.lox[k] = cx + Math.cos(a) * F * 0.17; FG.loy[k] = cy + Hf * 0.3 + Math.sin(a) * Hf * 0.035; FG.lix[k] = cx; FG.liy[k] = cy + Hf * 0.3; }
  FG.C.x = cx; FG.C.y = cy; FG.F = F; FG.Hf = Hf; FG.roll = 0; FG.nose.x = cx; FG.nose.y = cy + Hf * 0.05;
  FG.jawL.x = FG.ox[24]; FG.jawL.y = FG.oy[24]; FG.jawR.x = FG.ox[12]; FG.jawR.y = FG.oy[12]; FG.chin.x = FG.ox[18]; FG.chin.y = FG.oy[18]; FG.mouth = 0;
}
function detect(now) {
  if (demo) {
    demoFace(); hasFace = true; lastSeen = now;
    det.look = det.lookLoose = !demoAway; det.jaw = keyBloom ? 1 : 0; det.eyesClosed = false; return;
  }
  if (keyBloom) det.jaw = 1;
  if (!landmarker || video.readyState < 2 || !vw) return;
  if (video.currentTime === lastVT) return;
  lastVT = video.currentTime;
  let r; try { r = landmarker.detectForVideo(video, now); } catch (e) { return; }
  if (!r || !r.faceLandmarks || !r.faceLandmarks.length) return;
  const lm = r.faceLandmarks[0];
  const ok = i => lm[i] && Number.isFinite(lm[i].x) && Number.isFinite(lm[i].y);
  if (!lm || lm.length < 468 || ![4, 10, 13, 14, 33, 133, 152, 234, 263, 362, 454].every(ok)) return;
  applyLandmarks(lm); hasFace = true; lastSeen = now;
  // head yaw (landmarks) + pitch (transform matrix)
  const mid = (lm[234].x + lm[454].x) / 2, span = Math.abs(lm[454].x - lm[234].x) || 1e-3;
  const yaw = (lm[4].x - mid) / (span / 2);
  let pitch = 0;
  const M = r.facialTransformationMatrixes && r.facialTransformationMatrixes[0];
  if (M && M.data) { const m = M.data; pitch = Math.atan2(-m[9], Math.hypot(m[8], m[10])); }
  const bs = {};
  const cats = r.faceBlendshapes && r.faceBlendshapes[0] && r.faceBlendshapes[0].categories;
  if (cats) for (const c of cats) bs[c.categoryName] = c.score;
  det.jaw = keyBloom ? 1 : (bs.jawOpen || 0);
  det.eyesClosed = (bs.eyeBlinkLeft || 0) > 0.5 && (bs.eyeBlinkRight || 0) > 0.5;
  if (!det.eyesClosed && lm.length > 473 && ok(468) && ok(473)) {
    const rr = (lm[468].x - lm[33].x) / ((lm[133].x - lm[33].x) || 1e-6);
    const rl = (lm[473].x - lm[362].x) / ((lm[263].x - lm[362].x) || 1e-6);
    det.gazeOK = rr > 0.26 && rr < 0.74 && rl > 0.26 && rl < 0.74;
  }
  det.look = Math.abs(yaw) < 0.26 && Math.abs(pitch) < 0.35 && det.gazeOK;
  det.lookLoose = Math.abs(yaw) < 0.6 && Math.abs(pitch) < 0.6;
}

/* ---------- state machine ---------- */
function activate() { S.mode = 'active'; S.flash = 1; S.away = 0; S.charge = HOLD; AE.whoosh(); tipUntil = performance.now() + 6000; }
function deactivate() { S.mode = 'idle'; S.charge = 0; S.away = 0; }
function updateState(dt, now) {
  const lost = (now - lastSeen) / 1000, present = hasFace && lost < 0.6;
  if (S.mode === 'idle') {
    if (now < holdOff) S.charge = 0;
    else if (present && det.look) { S.charge += dt; if (S.charge >= HOLD) activate(); }
    else S.charge = Math.max(0, S.charge - dt * 1.6);
  } else {
    S.away = present && det.lookLoose ? 0 : S.away + dt;
    if (S.away > 1.3 || lost > 1.8) deactivate();
  }
  S.G = S.mode === 'active' ? Math.min(1, S.G + dt / 2.4) : Math.max(0, S.G - dt / 1.3);
  if (S.mode === 'active' && S.G > 0.6 && det.jaw > 0.32) {
    S.bloom = Math.min(1, S.bloom + dt * 2.2);
    if (!S.bloomSounded) { AE.bell(); S.bloomSounded = true; }
  } else {
    S.bloom = Math.max(0, S.bloom - dt * (S.mode === 'active' ? 0.22 : 1.2));
    if (det.jaw < 0.15) S.bloomSounded = false;
  }
  if (present && det.eyesClosed) { S.blinkT += dt; if (S.blinkT > 0.7 && !S.blinkFired) { S.blinkFired = true; nextPalette(); } }
  else { S.blinkT = 0; S.blinkFired = false; }
  S.flash = Math.max(0, S.flash - dt * 2.5);
  if (hasFace) {
    if (!lagInit) { lagP.x = prevC.x = FG.C.x; lagP.y = prevC.y = FG.C.y; lagInit = true; }
    const k = 1 - Math.exp(-dt * 3.2);
    lagP.x += (FG.C.x - lagP.x) * k; lagP.y += (FG.C.y - lagP.y) * k;
    LAG.x = clamp(lagP.x - FG.C.x, -FG.F, FG.F); LAG.y = clamp(lagP.y - FG.C.y, -FG.F, FG.F);
    const v = Math.hypot(FG.C.x - prevC.x, FG.C.y - prevC.y) / Math.max(dt, 1e-3) / FG.F;
    motion = lerp(motion, Math.min(3, v), 0.08);
    prevC.x = FG.C.x; prevC.y = FG.C.y;
  }
  AE.level(S.G); AE.tick(S.mode === 'active' && S.G > 0.35);
  updateStatus(present, now);
}
let lastStatus = null;
function updateStatus(present, now) {
  let s = '';
  if (loading) s = '顔検出を準備中…';
  else if (demo) s = S.mode === 'active' ? 'デモモード：クリックでもどす' : 'デモモード：クリックで開始';
  else if (!present) s = S.mode === 'active' ? '' : 'カメラに顔をうつしてください';
  else if (S.mode === 'idle') s = S.charge > 0.05 ? 'そのまま…' : 'カメラをじっと見つめて';
  else if (tipUntil > now) s = '口をあけると花、目を長くとじると色がかわる';
  if (s !== lastStatus) { lastStatus = s; if (s) statusEl.textContent = s; statusEl.classList.toggle('off', !s); }
}

/* ---------- render ---------- */
function drawRing(pal) {
  const r = FG.Hf * 0.7, f = clamp(S.charge / HOLD, 0, 1);
  ctx.lineWidth = Math.max(3, FG.F * 0.022); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.beginPath(); ctx.arc(FG.C.x, FG.C.y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = pal.ring; ctx.beginPath(); ctx.arc(FG.C.x, FG.C.y, r, -HALF_PI, -HALF_PI + TAU * f); ctx.stroke();
}
function render(t) {
  const pal = PALS[palIdx];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const Ge = easeIO(S.G), bgA = smooth(0, 0.38, Ge);
  if (bgA < 1 && vw) drawVideo();
  if (!vw) { ctx.fillStyle = '#16051a'; ctx.fillRect(0, 0, W, H); }
  if (bgA > 0) { ctx.globalAlpha = bgA; ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (!hasFace) return;
  const preview = S.mode === 'idle' ? (S.charge / HOLD) * 0.14 : 0;
  const Gs = Math.max(Ge, preview), fa = smooth(0.04, 0.42, Ge);
  if (Ge > 0.001) drawField(t, Ge, pal);
  if (fa > 0) drawNeck(pal, fa);
  if (Gs > 0.001) drawRoots(t, Gs, pal);
  if (fa > 0) drawFace(pal, fa);
  if (Ge > 0.25) drawFringe(t, Ge, pal);
  if (S.bloom > 0.01) drawFlowers(t, pal);
  if (S.mode === 'idle' && S.charge > 0.03 && Ge < 0.05) drawRing(pal);
  if (S.flash > 0) { ctx.globalAlpha = S.flash * 0.55; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ---------- loop ---------- */
let last = performance.now(), ftAcc = 0, ftN = 0;
function perf(dt) {
  if (S.G < 0.9) return;
  ftAcc += dt; ftN++;
  if (ftN >= 60) { const avg = ftAcc / ftN; if (avg > 0.036 && quality > 0.5) quality -= 0.12; else if (avg < 0.02 && quality < 1) quality = Math.min(1, quality + 0.05); ftAcc = 0; ftN = 0; }
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05;
  if (!started) return;
  perf(dt);
  updateVideoMap();
  detect(now);
  updateState(dt, now);
  render(now / 1000);
}

/* ---------- UI ---------- */
let toastTimer = 0;
function toast(s) { toastEl.textContent = s; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1300); }
function nextPalette() { palIdx = (palIdx + 1) % PALS.length; toast(PALS[palIdx].name); }
function toggleFace() { faceMode = faceMode === 'poster' ? 'photo' : 'poster'; $('#bFace').textContent = faceMode === 'poster' ? '顔：ポスター' : '顔：そのまま'; }
function toggleSound() { AE.on = !AE.on; if (AE.on && AE.ac) AE.ac.resume(); $('#bSnd').textContent = AE.on ? '音：オン' : '音：オフ'; AE.level(S.G); }
function snapshot() {
  cv.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `psyche-mirror-${Date.now()}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }, 'image/png');
  toast('保存しました');
}
function resetAll() {
  S.mode = 'idle'; S.charge = 0; S.G = 0; S.away = 0; S.bloom = 0; S.flash = 0; S.bloomSounded = false;
  ROOTS.length = 0; buildRoots(); buildField();          // 髪の形を新しく引き直す
  lagInit = false; motion = 0; demoAway = false; tipUntil = 0;
  holdOff = performance.now() + 900;                      // 押した直後はすぐ溜まらないように少し待つ
  if (AE.ready) { AE.dG.gain.cancelScheduledValues(AE.ac.currentTime); AE.dG.gain.setValueAtTime(0, AE.ac.currentTime); }
  toast('再撮影');
}
function forceToggle() { if (S.mode === 'active') deactivate(); else activate(); }

$('#bReset').onclick = resetAll;
$('#bPal').onclick = nextPalette;
$('#bFace').onclick = toggleFace;
$('#bSnd').onclick = toggleSound;
$('#bSnap').onclick = snapshot;
const fsBtn = $('#bFs');
if (!document.documentElement.requestFullscreen) fsBtn.style.display = 'none';
else fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
cv.addEventListener('click', () => { if (demo) { demoAway = !demoAway; if (demoAway && S.mode === 'active') S.away = 99; } });
addEventListener('keydown', e => {
  if (!started) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); forceToggle(); }
  else if (k === 'r') resetAll();
  else if (k === 'c') nextPalette();
  else if (k === 'f') toggleFace();
  else if (k === 'm') toggleSound();
  else if (k === 's') snapshot();
  else if (k === 'b') keyBloom = true;
});
addEventListener('keyup', e => { if (e.key.toLowerCase() === 'b') keyBloom = false; });
addEventListener('resize', resize);

function camError(e) {
  const reason = (e && e.message) ? e.message : String(e || 'unknown');
  return 'カメラを起動できませんでした：' + reason + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
async function openCamera() {
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await md.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  mirror = facing === 'user';
  video.srcObject = stream; try { await video.play(); } catch (e) {}
  smInit = false; lastVT = -1; hasFace = false; lagInit = false;
}
$('#bFlip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  try { await openCamera(); toast(facing === 'user' ? '前のカメラ' : '後ろのカメラ'); }
  catch (e) { facing = facing === 'user' ? 'environment' : 'user'; toast('切り替えられませんでした'); }
};
$('#go').onclick = async () => {
  const btn = $('#go'); btn.disabled = true; msgEl.textContent = 'カメラを起動しています…';
  AE.init(); if (AE.ac) AE.ac.resume();
  try { await openCamera(); }
  catch (e) { msgEl.textContent = camError(e); btn.disabled = false; return; }
  $('#intro').classList.add('hide'); $('#hud').classList.add('show');
  started = true;
  initFace();
};

resize();
requestAnimationFrame(frame);
// 検証用のフック（外から顔モデルの代わりを差し込める）
window.__psyche = { setLandmarker: l => { landmarker = l; demo = false; loading = false; }, state: () => ({ S, hasFace, demo, mirror, palIdx }) };
</script>
</body>
