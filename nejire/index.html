<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="フランシス・ベーコンの肖像画になる。平らな色の部屋と白い檻の中で、首を振れば顔がねじれ、動いたぶんだけ絵の具が引きずられる。口を大きく開けると絵ごと叫ぶ。タップで三連画。">
<meta name="theme-color" content="#141011">
<title>NEJIRE ─ ねじれる肖像</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  NEJIRE 捩れ ─ ねじれる肖像                           ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  SOURCE     フランシス・ベーコン。《磔刑図下部の人物のための三習作》1944 の橙の地、
             《ベラスケスによるインノケンティウス十世像の習作》1953 の縦に降る筆と叫ぶ口、
             《ルシアン・フロイドの三習作》1969 の黄土の部屋と白い檻。
             平らな色面の部屋、透明な檻の線、ぼろ布で拭ったようにねじれた顔、三連画。
  MOOD       美術館の一室。動かなければ静かな肖像。首を振れば顔が渦にねじれ、
             腕を振れば絵の具がその向きに引きずられて色面に跡を残し、やがて乾いて消える。
  PALETTE    ORANGE  地 #d8642a ／ 床 #a9441d ／ 肉 骨白 #ece4d8 → 灰桃 #b9a9a4 → 灰 #6f6a6c → #1f1a19 ／ 檻 #f1e6d3
             VIOLET  地 #1a1220（縦の筆）／ 肉 #f2e8dc → #b98d86 → 法衣の紫 #4b2a5c → #120c16 ／ 檻 金 #c9a65a
             OCHRE   地 #cf9a36 ／ 床 #6e4b2e ／ 肉 #f3e2c8 → #c98f74 → 緑灰 #5f6650 → #24201b ／ 檻 #f6f1e6
  TYPE       Bodoni Moda italic（題字）・Azeret Mono 300（UI）。
  MOTION     止まれば絵の具は落ち着き、動けば流れの向きに長く引きずられる。首の回転は顔の
             まわりの渦になる。切り替えは画面を横切る一本の太い刷毛。
  SIGNATURE  ねじれた顔と、色面に残る引きずりの跡、その手前の細い檻の線。
  LAYERS     ①平らな色面の部屋（床の弧・足元の影・刷毛むら）と、肉・灰・紫の筆致で塗られた人物
             ②実際の動き（ブロック照合のオプティカルフロー）で絵の具を移流する引きずり
             ③首を振る速さで顔のまわりが渦にねじれる・顔を斜めに拭う一筋のぼろ布
             ④人物をかこむ透明な檻（顔の向きで回る、奥の辺は人物の後ろ）
             ⑤口を大きく開けると叫ぶ：縦の筆が降りて絵の具が下へ流れる
             ⑥タップで習作を一枚ずつ残し、二連画・三連画（金の額）に組む
  TECH       ImageSegmenter の人物マスクと FaceLandmarker（輪郭・目・鼻・唇）。
             WebGL2：絵の具バッファを往復させる移流パス → 合成パス → 額装パス。
             フローは 96px の縮小グレーでブロック照合。素のカメラ ⇄ 絵 を刷毛で切り替える。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

<canvas id="gl"></canvas>

</div>

<div id="start">
  <div class="t">STUDY FOR A PORTRAIT · 捩れ</div>
  <h1>NEJIRE</h1>
  <p>あなたが、ベーコンの肖像画になる。<br>首を振れば顔がねじれ、動けば絵の具が引きずられる。<br>口を大きく開けると、絵ごと叫ぶ。</p>
  <button id="go">はじめる</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   NEJIRE — a Francis Bacon portrait. The painting lives in a ping-pong
   paint buffer: every frame the old paint is advected along the real
   optical flow (block matching on a 96px grey copy) and swirled around
   the face by the head's turning speed, and fresh paint is laid where
   things are still. A compose pass adds the canvas, the cage and the
   scream curtain; a layout pass frames studies into a triptych.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');
const STYLES = ['ORANGE', 'VIOLET', 'OCHRE'];
const CAGE_COL = ['#f1e6d3', '#c9a65a', '#f6f1e6'];
const S = { style:0, twist:1, drag:.6, dry:.5, brush:.6, cage:.85, grain:.35 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const COMMON = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
float lum(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + 1.), f.x), f.y); }
float fbm(vec2 p){ return .5*vn(p) + .3*vn(p*2.13 + 3.1) + .2*vn(p*4.37 + 7.7); }
`;
/* pass 1: paint (advect old paint, lay fresh paint) */
const FS_PAINT = COMMON + `
uniform sampler2D uVid, uMask, uFlow, uPaint;
uniform vec2 uScale, uAsp, uLvl, uMTex;
uniform vec3 uFace;          // face centre (su) and size (short-edge units); size 0 = none
uniform vec4 uSwipe;         // rag swipe: dir.xy, offset, amplitude
uniform vec4 uShadow;        // floor shadow: x, y (su), radius (short-edge), alpha
uniform float uMirror, uHas, uT, uDt, uDrag, uDry, uBrush, uScream, uSpin, uReset, uHz;
uniform int uSt;
const vec3 FIELD[3] = vec3[3](vec3(.847,.392,.165), vec3(.102,.071,.125), vec3(.812,.604,.212));
const vec3 FLOOR[3] = vec3[3](vec3(.663,.267,.114), vec3(.075,.05,.09), vec3(.431,.294,.18));
const vec3 R0[3] = vec3[3](vec3(.122,.102,.098), vec3(.07,.047,.086), vec3(.141,.125,.106));
const vec3 R1[3] = vec3[3](vec3(.435,.416,.424), vec3(.294,.165,.361), vec3(.373,.4,.314));
const vec3 R2[3] = vec3[3](vec3(.725,.663,.643), vec3(.725,.553,.525), vec3(.788,.561,.455));
const vec3 R3[3] = vec3[3](vec3(.925,.894,.847), vec3(.949,.91,.863), vec3(.953,.886,.784));
vec2 vuv(vec2 su){ vec2 v = (su - .5)*uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
// the mask is low-res: blur it a little so its edge is a soft curve, not a staircase
float maskAt(vec2 v){
  vec2 e = 1.2/uMTex;
  float m = texture(uMask, v).r*.36;
  m += (texture(uMask, v + vec2(e.x, 0.)).r + texture(uMask, v - vec2(e.x, 0.)).r + texture(uMask, v + vec2(0., e.y)).r + texture(uMask, v - vec2(0., e.y)).r)*.1;
  m += (texture(uMask, v + e).r + texture(uMask, v - e).r + texture(uMask, v + vec2(e.x, -e.y)).r + texture(uMask, v - vec2(e.x, -e.y)).r)*.06;
  return m;
}
vec2 flowS(vec2 su){
  vec2 f = (texture(uFlow, vuv(su)).rg*255. - 128.)/127.*3.;
  return vec2(f.x*(uMirror > .5 ? -1. : 1.)/uScale.x, f.y/uScale.y);
}
vec3 ramp(float x){
  x = clamp(x, 0., 1.);
  vec3 a = mix(R0[uSt], R1[uSt], smoothstep(0., .36, x));
  a = mix(a, R2[uSt], smoothstep(.36, .7, x));
  return mix(a, R3[uSt], smoothstep(.7, 1., x));
}
vec3 fresh(vec2 su){
  vec2 Q = (su - .5)*uAsp;
  // the rag: one diagonal wipe dragged across the face
  vec2 w = vec2(0.);
  if (uFace.z > 0.){
    vec2 d = (su - uFace.xy)*uAsp;
    vec2 n = vec2(-uSwipe.y, uSwipe.x);
    float across = dot(d, n) - uSwipe.z*uFace.z;
    float fall = exp(-dot(d, d)/(uFace.z*uFace.z*.5));
    w = uSwipe.xy*uSwipe.w*uFace.z*exp(-across*across/(uFace.z*uFace.z*.02))*fall;
    w /= uAsp;
  }
  vec2 v = vuv(su + w);
  float px = 1.5/360.;
  vec3 cam = texture(uVid, v).rgb;
  vec3 cb = (cam*2. + texture(uVid, v + vec2(px, 0.)).rgb + texture(uVid, v - vec2(px, 0.)).rgb
                    + texture(uVid, v + vec2(0., px)).rgb + texture(uVid, v - vec2(0., px)).rgb)/6.;
  if (dot(w, w) > 1e-8){   // the rag drags the paint along its path
    vec3 r1 = texture(uVid, vuv(su + w*.5)).rgb, r2 = texture(uVid, vuv(su + w*1.5)).rgb, r3 = texture(uVid, vuv(su + w*2.2)).rgb;
    cb = (cb*2. + r1 + r2 + r3)/5.;
  }
  float m = uHas > .5 ? smoothstep(.3, .7, maskAt(v)) : 1.;
  // the room: a flat field, a floor with a curved front edge, brush mottling
  float hz = uHz + .06*pow(abs(Q.x)/max(uAsp.x*.5, .01), 2.);
  float onFloor = uSt == 1 ? 0. : smoothstep(hz - .002, hz + .002, su.y);
  float mott = fbm(Q*vec2(2.2, 9.) + float(uSt)*3.) - .5;
  vec3 bg = mix(FIELD[uSt], FLOOR[uSt], onFloor)*(1. + mott*.09*uBrush);
  bg *= 1. - .35*(1. - smoothstep(0., .035, abs(su.y - hz)))*onFloor*step(hz, su.y);
  if (uSt == 1){  // the pope's curtain: vertical strokes of violet and old gold
    float s = vn(vec2(Q.x*46., Q.y*1.2)), s2 = vn(vec2(Q.x*13. + 4., Q.y*.6));
    bg = mix(bg, vec3(.23,.17,.24), smoothstep(.55, .9, s)*.65);
    bg = mix(bg, vec3(.55,.42,.2), smoothstep(.8, .98, s2)*.35);
  }
  vec2 sd = (su - uShadow.xy)*uAsp; sd.y *= 3.2;
  bg *= 1. - uShadow.w*.55*(1. - smoothstep(uShadow.z*.4, uShadow.z, length(sd)))*onFloor;
  // the figure: patches of strokes, each patch with its own direction (two offset grids, blended)
  float stroke = 0., dry = 0.;
  for (int g = 0; g < 2; g++){
    vec2 G = Q*7. + float(g)*.5;
    vec2 id = floor(G), f = fract(G) - .5;
    float a = h21(id + float(g)*13.)*3.1416;
    vec2 d = vec2(cos(a), sin(a));
    vec2 sq = vec2(dot(Q, d), dot(Q, vec2(-d.y, d.x)));
    float wgt = g == 0 ? 1. - smoothstep(.15, .5, max(abs(f.x), abs(f.y))) : smoothstep(.15, .5, max(abs(fract(Q.x*7.) - .5), abs(fract(Q.y*7.) - .5)));
    stroke += (vn(sq*vec2(9., 60.) + id*7.) - .5)*wgt;
    dry += (vn(sq*vec2(16., 190.) + id*3.) - .5)*wgt;
  }
  float l = clamp((lum(cb) - uLvl.x)/max(.08, uLvl.y - uLvl.x), 0., 1.);
  l = pow(l, .9) + stroke*.14*uBrush;
  float q = l*4.;
  float lp = (floor(q) + smoothstep(.25, .75, fract(q)))/4.;
  float lt = mix(l, lp, .4);
  vec3 fig = ramp(lt);
  vec3 chroma = cb - lum(cb);
  fig += chroma*.2;
  // warm planes lean pink, cool planes lean violet / green-grey
  float warm = clamp((cb.r - cb.b)*3., -1., 1.);
  fig += mix(vec3(-.03,.0,.05), vec3(.07,.0,-.02), warm*.5 + .5)*smoothstep(.2, .7, lt)*uBrush;
  fig += vec3(-.03,.02,-.02)*smoothstep(.2, .5, stroke + .25)*(1. - smoothstep(.3, .7, lt))*uBrush;
  fig *= 1. + dry*.22*uBrush;
  // impasto highlight scumbles on the brightest planes
  fig = mix(fig, R3[uSt]*1.04, smoothstep(.84, .99, l + dry*.3)*.6*uBrush);
  // a dark contour where the figure meets the room
  float edge = smoothstep(.12, .45, m)*(1. - smoothstep(.45, .85, m));
  fig = mix(fig, R0[uSt], edge*.75);
  return mix(bg, fig, m);
}
void main(){
  vec2 su = vec2(uv.x, 1. - uv.y);
  vec3 fr = fresh(su);
  if (uReset > .5){ o = vec4(fr, 0.); return; }
  vec2 vel = flowS(su);
  // scream: the paint runs down in vertical strokes
  vec2 Q = (su - .5)*uAsp;
  float cn = vn(vec2(Q.x*34., uT*.25));
  vel.y += uScream*(.15 + .85*cn*cn)*.55;
  // swirl around the face with the head's turning speed
  vec2 src = su;
  float spinA = 0.;
  if (uFace.z > 0.){
    vec2 d = (su - uFace.xy)*uAsp;
    float R = uFace.z*.8;
    spinA = uSpin*uDt*exp(-dot(d, d)/(R*R));
    float c = cos(-spinA), s = sin(-spinA);
    src = uFace.xy + vec2(c*d.x - s*d.y, s*d.x + c*d.y)/uAsp;
  }
  vec2 disp = vel*uDt*(.8 + 2.2*uDrag);
  // bristles: across the stroke, each hair carries the paint a different distance
  vec2 dv = disp*uAsp; float dl = length(dv);
  vec2 nrm = dl > 1e-5 ? vec2(-dv.y, dv.x)/dl : vec2(0.);
  float across = dot(Q, nrm);
  float bn = vn(vec2(across*260., 1.3))*.65 + vn(vec2(across*45., 7.1))*.35;
  vec2 dispB = disp*(.35 + 1.3*bn);
  src -= dispB;
  vec4 prev = vec4(0.);
  for (int k = 0; k < 3; k++){
    vec2 s = src - dispB*float(k)*.3;

function drawCage(dt){
  ocx.setTransform(1, 0, 0, 1, 0, 0);
  ocx.fillStyle = '#000'; ocx.fillRect(0, 0, OW, OH);
  const sh = Math.min(OW, OH), ax = OW/sh, ay = OH/sh;     // su -> short-edge units
  let cx = .5, top = .14, hw = .42*Math.min(1, ax*.9), bot = 1.08;
  const faceLive = FC.ok;
  if (faceLive){
    cx = FC.x; top = FC.y - FC.size*1.05/ay; hw = FC.size*1.45; bot = Math.max(FC.y + FC.size*2.2/ay, M.present ? M.y1 + .02 : 0);
  } else if (M.present){
    cx = (M.x0 + M.x1)/2; top = M.y0 - .05; hw = Math.max(.15, (M.x1 - M.x0)*ax*.55); bot = M.y1 + .03;
  }
  hw = Math.min(hw, ax*.48); top = Math.max(.04, top); bot = Math.max(bot, top + .3);
  const k = CG.ok ? 1 - Math.exp(-dt*3.5) : 1;
  CG.cx += (cx - CG.cx)*k; CG.top += (top - CG.top)*k; CG.hw += (hw - CG.hw)*k; CG.bot += (bot - CG.bot)*k;
  CG.yaw += ((faceLive ? FC.yaw : 0) - CG.yaw)*(1 - Math.exp(-dt*3)); CG.ok = true;
  if (S.cage < .01) return;
  // front rectangle, back rectangle shrunk toward a vanishing point that swings with the head
  const X = u => u*OW, Y = v => v*OH;
  const fx0 = CG.cx - CG.hw/ax, fx1 = CG.cx + CG.hw/ax, fy0 = CG.top, fy1 = CG.bot;
  const vpx = .5 + CG.yaw*.5, vpy = HZ - .12, s = .72;
  const bx0 = vpx + (fx0 - vpx)*s, bx1 = vpx + (fx1 - vpx)*s, by0 = vpy + (fy0 - vpy)*s, by1 = vpy + (fy1 - vpy)*s;
  const lw = Math.max(1.1, sh*.0042);
  ocx.lineCap = 'round'; ocx.lineJoin = 'round';
  const line = (x0, y0, x1, y1) => { ocx.beginPath(); ocx.moveTo(X(x0), Y(y0)); ocx.lineTo(X(x1), Y(y1)); ocx.stroke(); };
  ocx.strokeStyle = '#f00'; ocx.lineWidth = lw*.85;
  line(bx0, by0, bx1, by0); line(bx0, by0, bx0, by1); line(bx1, by0, bx1, by1); line(bx0, by1, bx1, by1);
  line(fx0, fy0, bx0, by0); line(fx1, fy0, bx1, by0); line(fx0, fy1, bx0, by1); line(fx1, fy1, bx1, by1);
  ocx.strokeStyle = '#0f0'; ocx.lineWidth = lw;
  line(fx0, fy0, fx1, fy0); line(fx0, fy0, fx0, fy1); line(fx1, fy0, fx1, fy1); line(fx0, fy1, fx1, fy1);
  // a second, fainter pass of the front top bar: Bacon's lines are drawn twice
  ocx.globalAlpha = .45; ocx.lineWidth = lw*.6; line(fx0 + .004, fy0 + .006, fx1 - .01, fy0 + .004); ocx.globalAlpha = 1;
}

/* ---------- MediaPipe (dynamic import; the camera still runs without it) ---------- */
let segmenter = null, facer = null, lastTs = 0, lastVT = -1, modelState = 'loading';
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const mk = async (Cls, o) => { try { return await Cls.createFromOptions(fs, { ...o, baseOptions:{ ...o.baseOptions, delegate:'GPU' } }); }
                                   catch(e){ return await Cls.createFromOptions(fs, { ...o, baseOptions:{ ...o.baseOptions, delegate:'CPU' } }); } };
    segmenter = await mk(vision.ImageSegmenter, { baseOptions:{ modelAssetPath:SEG_MODEL }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    facer = await mk(vision.FaceLandmarker, { baseOptions:{ modelAssetPath:FACE_MODEL }, runningMode:'VIDEO', numFaces:1,
      minFaceDetectionConfidence:.5, minFacePresenceConfidence:.5, minTrackingConfidence:.5 });
    modelState = 'ok';
  }catch(e){
    if (EXT) return;
    modelState = segmenter ? 'ok' : 'fail';
  }
}
function track(now){
  if (video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastVT) return; lastVT = vt;
  const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
  if (segmenter){
    try{
      segmenter.segmentForVideo(video, ts, res => {
        const ms = res && res.confidenceMasks;
        if (!ms || !ms.length) return;
        const mk = ms[ms.length - 1];
        ingestMask(mk.getAsFloat32Array(), mk.width, mk.height, ts);
      });
    }catch(e){}
  }
  if (facer){
    try{ const r = facer.detectForVideo(video, ts); onFace(r && r.faceLandmarks && r.faceLandmarks[0], ts); }catch(e){}
  }
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', started = false, EXT = false;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  M.lastT = -1e9; loseFace(); resetFlow(); needReset = true;
}

/* ---------- audio: a low string drone that thickens with motion, the scream, the shutter ---------- */
let actx = null, bus = null, recDest = null, drone = null, cry = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .5; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  // drone: two detuned saws through a lowpass
  const g = actx.createGain(); g.gain.value = 0;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180; lp.Q.value = 3;
  [55, 55.35, 82.6].forEach(f => { const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); });
  lp.connect(g); g.connect(bus); drone = { g, lp };
  // scream: a cluster of close strings through a bandpass
  const cg = actx.createGain(); cg.gain.value = 0;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 1.4;
  [233.1, 246.9, 261.6, 277.2].forEach((f, i) => { const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = (i - 1.5)*7; o.connect(bp); o.start(); });
  bp.connect(cg); cg.connect(bus); cry = { g:cg, bp };
  actx.resume().catch(()=>{});
}
function noiseHit(dur, freq, q, vol, sweep){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, len = Math.max(1, actx.sampleRate*dur | 0), b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/len, 1.5);
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
  const g = actx.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(bus); s.start(t);
}
function thud(){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(42, t + .4);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + .6);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + .65);
}
function audioTick(motion, scream, fxOn){
  if (!actx || !drone) return;
  const t = actx.currentTime;
  drone.g.gain.setTargetAtTime(fxOn ? .02 + Math.min(.09, motion*.07) : 0, t, .25);
  drone.lp.frequency.setTargetAtTime(150 + Math.min(900, motion*500), t, .3);
  cry.g.gain.setTargetAtTime(fxOn ? scream*.05 : 0, t, scream > .05 ? .15 : .5);
  cry.bp.frequency.setTargetAtTime(500 + scream*1400, t, .4);
}

/* ---------- studies: up to three panels (two frozen + the live one) ---------- */
const STUDY = []; // { t:target, cx, cy, w, goal }
let liveW = 1;
function snapStudy(){
  if (!scene) return false;
  const alive = STUDY.filter(s => s.goal > 0);
  if (alive.length >= 2) alive[0].goal = 0;                  // the oldest slides out
  const r = target(scene.w, scene.h);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, scene.f); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, r.f);
  gl.blitFramebuffer(0, 0, scene.w, scene.h, 0, 0, scene.w, scene.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  // the frozen study takes the live panel's place; a new live panel grows in after it
  STUDY.push({ t:r, cx:LV.cx, cy:LV.cy, w:liveW, goal:1 });
  liveW = 0;
  $('clear').classList.add('show');
  return true;
}
function clearStudies(){ STUDY.forEach(s => { s.goal = 0; }); }
function dropStudies(){ while (STUDY.length) freeTarget(STUDY.pop().t); liveW = 1; $('clear').classList.remove('show'); }

/* ---------- mode: plain camera ⇄ painting (one wide brush stroke) ---------- */
const MODE = { on:false, t0:-1e9, from:0, reveal:0, fxOn:false };
function setMode(on){
  MODE.from = MODE.reveal; MODE.on = on; MODE.t0 = performance.now();
  $('mode').textContent = on ? 'カメラにもどる' : '絵にする';
  noiseHit(1.1, on ? 500 : 1400, .8, .5, on ? 2600 : 300);
  if (on){ newSwipe(); setTimeout(thud, 900); }
  else clearStudies();
}
const SW = { dx:.8, dy:.6, off:0, amp:.22 };
function newSwipe(){
  const a = (Math.random() < .5 ? -1 : 1)*(.35 + Math.random()*.6);
  SW.dx = Math.cos(a); SW.dy = Math.sin(a); SW.off = (Math.random() - .5)*.35; SW.amp = .16 + Math.random()*.12;
}
function setStyle(i){
  i = ((i % 3) + 3) % 3; S.style = i;
  [...$('styles').children].forEach(x => x.classList.toggle('on', +x.dataset.s === i));
  $('panel').style.setProperty('--acc', CAGE_COL[i]);
}
function tapStudy(){
  if (!MODE.on || MODE.reveal < .99) return false;
  const ok = snapStudy();
  if (ok){ noiseHit(.06, 3000, 1, .9); thud(); newSwipe(); }
  return ok;
}

$('go').onclick = async () => {

  $('start').style.display = 'none';

};

  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('mode').onclick = () => { ensureAudio(); setMode(!MODE.on); };
$('clear').onclick = () => { clearStudies(); noiseHit(.5, 900, .7, .3, 300); };
canvas.addEventListener('pointerdown', () => {

$('styles').onclick = e => { const b = e.target.closest('button'); if (b){ setStyle(+b.dataset.s); noiseHit(.7, 700, .8, .3, 2000); } };
[['sTwist','twist'],['sDrag','drag'],['sDry','dry'],['sBrush','brush'],['sCage','cage'],['sGrain','grain']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

$('shoot').onclick = () => {
  noiseHit(.06, 3000, 1, .9);
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'nejire-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'nejire.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
let lastT = 0, hudT = 0, HZ = .64;
const LV = { cx:.5, cy:.5 };
const FX = { spin:0, scream:0, motion:0 };
function bindTex(unit, t){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); }
function panelCrop(cx, cy, pw, ph, out){
  // cover-fit a panel of aspect pw:ph into the full frame, centred on the figure
  const pa = pw/ph, sa = CW/CH;
  let w = 1, h = 1;
  if (pa < sa) w = pa/sa; else h = sa/pa;
  out[0] = Math.max(0, Math.min(1 - w, cx - w/2)); out[1] = Math.max(0, Math.min(1 - h, cy - h/2)); out[2] = w; out[3] = h;
  return out;
}
const CROP = [0,0,1,1];
function loop(now){
  requestAnimationFrame(loop);
  // real elapsed time (bounded): low frame rates must not slow the easing or the drying of the paint
  const dt = lastT ? Math.min(.25, Math.max(0, (now - lastT)/1000)) : 1/60; lastT = now;
  const t = now/1000;
  if (video.videoWidth){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const kk = Math.min(1, 1400/Math.max(W, H)); W = Math.round(W*kk); H = Math.round(H*kk);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  if (!scene || scene.w !== W || scene.h !== H){
    freeTarget(scene); scene = target(W, H); dropStudies();
    const pw = Math.max(64, Math.round(W*.6)), ph = Math.max(64, Math.round(H*.6));
    freeTarget(paintA); freeTarget(paintB); paintA = target(pw, ph); paintB = target(pw, ph); needReset = true;
  }
  CW = W; CH = H;
  const ow = Math.max(64, Math.round(W*.5)), oh = Math.max(64, Math.round(H*.5));
  if (ow !== OW || oh !== OH){ OW = over.width = ow; OH = over.height = oh; }
  const sa = W/H, va = vidW/vidH; scX = sa < va ? sa/va : 1; scY = sa < va ? 1 : va/sa;
  const sh = Math.min(W, H), asx = W/sh, asy = H/sh;
  HZ = sa < 1 ? .7 : .64;
  if (!EXT) track(now);
  grabFlow(now);
  if (video.readyState < 2) return;

  // painting progress (the brush crosses in 1.5 s, lifts in 0.9 s)
  const dur = MODE.on ? 1500 : 900;
  const k = Math.min(1, (now - MODE.t0)/dur), ke = k*k*(3 - 2*k);
  MODE.reveal = MODE.from + ((MODE.on ? 1 : 0) - MODE.from)*ke;
  MODE.fxOn = MODE.reveal > .02;

  // tracking: a face that stops reporting is dropped after 1.5 s of real time
  if (FC.ok && now - FC.lastSeen > 1500 && !EXT) loseFace();
  if (FC.ok && EXT && performance.now() - FC.lastSeen > 1500) loseFace();
  const spinT = FC.ok ? Math.max(-4.5, Math.min(4.5, -FC.yawV*1.3 + FC.rollV*1.0))*S.twist : 0;
  FX.spin += (spinT - FX.spin)*(1 - Math.exp(-dt*8));
  const screamT = FC.ok && FC.openMs > 150 ? 1 : 0;
  FX.scream += (screamT - FX.scream)*(1 - Math.exp(-dt*(screamT ? 3 : 1.1)));
  FX.motion += (FG.E + Math.abs(FX.spin)*.15 - FX.motion)*(1 - Math.exp(-dt*4));
  audioTick(FX.motion, FX.scream, MODE.fxOn);
  if (M.present){ LV.cx += (M.cx - LV.cx)*(1 - Math.exp(-dt*3)); LV.cy += (M.cy - LV.cy)*(1 - Math.exp(-dt*3)); }
  if (FC.ok){ const kf = 1 - Math.exp(-dt*3); LV.cx += (FC.x - LV.cx)*kf; LV.cy += (FC.y + FC.size*sh/H*.45 - LV.cy)*kf; }

  drawCage(dt);

  // uploads
  bindTex(0, texVid);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; }
  bindTex(1, texMask); bindTex(2, texFlow);
  bindTex(4, texOver); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, over);

  // pass 1: paint
  const hasM = M.has && M.present ? 1 : 0;
  gl.useProgram(PP.p); let U = PP.U;
  bindTex(3, paintA.t);
  gl.bindFramebuffer(gl.FRAMEBUFFER, paintB.f); gl.viewport(0, 0, paintB.w, paintB.h);
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uFlow, 2); gl.uniform1i(U.uPaint, 3);
  gl.uniform2f(U.uScale, scX, scY); gl.uniform2f(U.uAsp, asx, asy); gl.uniform2f(U.uLvl, FG.lo, FG.hi); gl.uniform2f(U.uMTex, Math.max(1, M.w), Math.max(1, M.h));
  if (FC.ok) gl.uniform3f(U.uFace, FC.x, FC.y, FC.size); else gl.uniform3f(U.uFace, 0, 0, 0);
  gl.uniform4f(U.uSwipe, SW.dx, SW.dy, SW.off, SW.amp*S.twist);
  if (M.present && M.y1 < .93){
    gl.uniform4f(U.uShadow, (M.x0 + M.x1)/2, Math.max(HZ + .03, M.y1), Math.max(.12, (M.x1 - M.x0)*asx*.6), 1);
  } else gl.uniform4f(U.uShadow, .5, 2, .1, 0);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uHas, hasM); gl.uniform1f(U.uT, t); gl.uniform1f(U.uDt, dt);
  gl.uniform1f(U.uDrag, S.drag); gl.uniform1f(U.uDry, S.dry); gl.uniform1f(U.uBrush, S.brush);
  gl.uniform1f(U.uScream, FX.scream); gl.uniform1f(U.uSpin, FX.spin); gl.uniform1f(U.uReset, needReset ? 1 : 0); gl.uniform1f(U.uHz, HZ);
  gl.uniform1i(U.uSt, S.style);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  needReset = false;
  const tmp = paintA; paintA = paintB; paintB = tmp;

  // pass 2: compose into the scene
  gl.useProgram(PC.p); U = PC.U;
  bindTex(3, paintA.t);
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.f); gl.viewport(0, 0, W, H);
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uPaint, 3); gl.uniform1i(U.uOver, 4);
  gl.uniform2f(U.uScale, scX, scY); gl.uniform2f(U.uAsp, asx, asy); gl.uniform2f(U.uRes, W, H);
  const cc = CAGE_COL[S.style];
  gl.uniform3f(U.uCage, parseInt(cc.slice(1,3),16)/255, parseInt(cc.slice(3,5),16)/255, parseInt(cc.slice(5,7),16)/255);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uHas, hasM); gl.uniform1f(U.uT, t); gl.uniform1f(U.uReveal, MODE.reveal);
  gl.uniform1f(U.uScream, FX.scream); gl.uniform1f(U.uCageA, S.cage*.9); gl.uniform1f(U.uGrain, S.grain); gl.uniform1f(U.uBrush, S.brush);
  gl.uniform1i(U.uSt, S.style);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // pass 3: layout — panel widths ease toward their goals
  const ke2 = 1 - Math.exp(-dt*6);
  for (const s of STUDY) s.w += (s.goal - s.w)*ke2;
  liveW += (1 - liveW)*ke2;
  for (let i = STUDY.length - 1; i >= 0; i--) if (STUDY[i].goal === 0 && STUDY[i].w < .01){ freeTarget(STUDY[i].t); STUDY.splice(i, 1); }
  if (!STUDY.length) $('clear').classList.remove('show');
  gl.useProgram(PL.p); U = PL.U;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.uniform1i(U.uSrc, 5);
  if (!STUDY.length){
    bindTex(5, scene.t);
    gl.uniform4f(U.uCrop, 0, 0, 1, 1); gl.uniform4f(U.uRect, 0, 0, W, H); gl.uniform1f(U.uFrame, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else {
    gl.clearColor(.075, .063, .063, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.SCISSOR_TEST);
    const vert = H > W*1.05;                                   // portrait: studies stack top to bottom
    const gap = Math.round(sh*.028), pad = Math.round(sh*.04), padB = Math.max(pad, Math.round(74*dpr*kk));
    const panels = STUDY.map(s => ({ tex:s.t.t, cx:s.cx, cy:s.cy, w:s.w })).concat([{ tex:scene.t, cx:LV.cx, cy:LV.cy, w:liveW }]);
    const tw = panels.reduce((a, p) => a + p.w, 0);
    const span = (vert ? H - pad - padB : W - pad*2) - gap*(tw - 1), cross = vert ? W - pad*2 : H - pad - padB;
    let pos = pad;
    for (const p of panels){
      const len = span*p.w/Math.max(1e-3, tw);
      if (len >= 2){
        const x = vert ? pad : Math.round(pos), y = vert ? Math.round(H - pos - len) : padB;
        const pw = vert ? cross : Math.round(len), ph = vert ? Math.round(len) : cross;
        gl.viewport(x, y, pw, ph); gl.scissor(x, y, pw, ph);
        bindTex(5, p.tex);
        panelCrop(p.cx, p.cy, pw, ph, CROP);
        gl.uniform4f(U.uCrop, CROP[0], CROP[1], CROP[2], CROP[3]); gl.uniform4f(U.uRect, x, y, pw, ph);
        gl.uniform1f(U.uFrame, Math.max(3, sh*.012));
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      pos += len + gap*p.w;
    }
    gl.disable(gl.SCISSOR_TEST); gl.viewport(0, 0, W, H);
  }

  hudT += dt;
  if (hudT > .25){ hudT = 0;
    $('hud').innerHTML = '<b>Nejire</b>\n' + (MODE.fxOn ? STYLES[S.style] + (STUDY.length ? ' · ' + ['', 'DIPTYCH', 'TRIPTYCH'][Math.min(2, STUDY.filter(s => s.goal > 0).length)] : '') : 'CAMERA');
    let st = '';
    if (modelState === 'fail' && !EXT) st = '人物検出モデルを読み込めませんでした（ネット接続を確認）。';
    else if (MODE.fxOn && M.has && !M.present) st = '体が映るように、すこし離れてください。';
    if ($('status').textContent !== st && !$('status').textContent.startsWith('カメラを起動')) setStatus(st);
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__NEJIRE = {
  external(){ EXT = true; },
  ingestMask(d, w, h, tMs){ EXT = true; ingestMask(d, w, h, tMs); },
  face(lms, tMs){ EXT = true; onFace(lms, tMs); },
  mode(on){ setMode(!!on); },
  style(i){ setStyle(i); },
  tap(){ return tapStudy(); },
  clear(){ clearStudies(); },
  set(k, v){ if (k in S) S[k] = v; },
  state: () => ({ present:M.present, cover:M.cover, cx:M.cx, cy:M.cy, box:[M.x0, M.y0, M.x1, M.y1], obs:M.obs,
                  face:FC.ok, fx:FC.x, fy:FC.y, size:FC.size, yaw:FC.yaw, yawV:FC.yawV, mouth:FC.mouth, openMs:FC.openMs,
                  spin:FX.spin, scream:FX.scream, flowE:FG.E, lvl:[FG.lo, FG.hi], reveal:MODE.reveal, style:S.style,
                  studies:STUDY.filter(s => s.goal > 0).length, panels:STUDY.length, cage:[CG.cx, CG.top, CG.hw, CG.bot] }),
  flowAt(gxF, gyF){ if (!FG.vx) return null; const i = Math.min(FG.gy - 1, gyF*FG.gy | 0)*FG.gx + Math.min(FG.gx - 1, gxF*FG.gx | 0); return [FG.vx[i], FG.vy[i]]; },
};
