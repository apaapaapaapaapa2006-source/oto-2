<meta name="description" content="東雲の空を六百羽の千鳥が飛んでいる。手のひらを見せれば群れが寄り、握れば散り、手の高さがそのまま群れの高さになる。声を出しているのは一羽ではなく群れの統計で、群れが締まれば十二の声が一つに揃い、広がれば和音にほどける。飛んだ跡は空に薄墨の筋として残り、ゆっくり消える。両手を打ち合わせれば一斉に飛び立つ。">

<!--
  ══════════════════════════════════════════════════════════════════════════
  CHIDORI 千鳥 ─ 千の鳥が声をそろえる              ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      The half hour before sunrise over a calm sea, seen from the
            shore — the sky already pale, the water still dark, and a
            flock of plovers turning over it as one animal. High-key,
            washed, cold at the top and warm at the horizon. Nothing in
            this piece glows; the birds are ink and the light is daylight.

  PALETTE   東雲  shinonome #f3d3bd  the zenith at dawn, a peach-grey.
            白藍  shiraai   #dbe7ee  the middle sky.
            生成  kinari    #fbf1e3  the band of light on the horizon.
            藍    ai        #274a6d  the sea, the 青海波 pattern in it, and
                                     every bird's trail.
            墨    sumi      #1c2430  the birds themselves. Ink marks, hard-
                                     edged, no blur, no glow.
            朱    shu       #c8402f  RESERVED for the one moment of the
                                     piece — the 一斉 — and the numbers in
                                     the HUD that describe the flock.

  BACKGROUND  A vertical dawn gradient with a hard horizon line, a pale
              sun low on the left, and below the horizon a sea drawn as a
              generated 青海波 tile — the classical wave pattern that
              千鳥 have been printed over for four hundred years. No
              vignette. No darkness anywhere.

  TYPE      Shippori Antique for the title and every label: an upright
            antique gothic with the slightly hand-cut feel of old shop
            signage, which suits a motif this traditional without going
            calligraphic. DM Mono 300/400/500 for the flock's numbers —
            this piece is a census of a flock, and a census is set in
            mono.

  MOTION    BANKING. Birds turn on real steering forces with limited
            acceleration, so every change of direction is a bank, never a
            snap. The flock as a whole moves slower than any bird in it.
            Page elements ease over 0.5 s. The 一斉 is the one hard cut:
            80 ms, and the whole flock is thrown.

  SIGNATURE 群れの形が、和音になる。 No bird sings. Twelve voices each
            follow the average height of fifty birds, so when the flock
            is tight all twelve land on the same note and you hear a
            unison, and when it spreads they fan out across the scale
            into a cluster. The harmony is the flock's shape, sliding
            between notes the way a whistle slides — and the trails the
            birds leave in the sky are the score of where the shape has
            been.
  ══════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  CHIDORI 千鳥 ─ 千の鳥が声をそろえる
//
//  Up to 900 plovers fly a classic three-rule flock (separation,
//  alignment, cohesion) with limited acceleration, so every turn is a
//  bank. An open palm is an attractor; a fist is a repeller; with no
//  hands a wandering attractor keeps the flock alive.
//
//  NO BIRD SINGS. Twelve voices each follow the mean height and mean
//  speed of one twelfth of the flock. Tight flock → all twelve means
//  coincide → unison. Spread flock → the means fan across the scale →
//  a cluster. The harmony IS the flock's shape, and the whistle-like
//  portamento between notes is what a shape sounds like while it moves.
//
//  Clap: 一斉 — every bird is thrown outward from the centroid and every
//  voice leaps an octave and settles back.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number' && isFinite(v); }
function chase(cur,tgt,rate,dt){ var k=1-Math.exp(-rate*clamp(dt,0,0.2)); return cur+(tgt-cur)*k; }
function rgba(r,g,b,a){
  r=fin(r)?clamp(r|0,0,255):0; g=fin(g)?clamp(g|0,0,255):0; b=fin(b)?clamp(b|0,0,255):0;
  a=fin(a)?clamp(a,0,1):0;
  return 'rgba('+r+','+g+','+b+','+a.toFixed(3)+')';
}

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var densEl=document.getElementById('densEl');
var cohEl=document.getElementById('cohEl');
var sndBtn=document.getElementById('snd');
var rB=document.getElementById('rB');
var rV=document.getElementById('rV');
var rH=document.getElementById('rH');

var W=0,H=0,DPR=1,MN=1,HORIZ=0;
function mkCanvas(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  return c;
}

// ═══════════════════════════════════════════════════════════════════════
//  SKY, SEA, TRAILS, SPRITES
// ═══════════════════════════════════════════════════════════════════════
var skyGrad=null, seaPat=null;
var trail=null, tctx=null, TS=0.5;          // trail layer at half res
var SPR=32, sprCv=null, sprCtx=null, SPS=24;  // bird sprites: 32 headings × 2 flap phases

function buildSky(){
  try{
    skyGrad=ctx.createLinearGradient(0,0,0,H);
    skyGrad.addColorStop(0,'#f3d3bd');
    skyGrad.addColorStop(0.34,'#e6dfd8');
    skyGrad.addColorStop(0.60,'#dbe7ee');
    skyGrad.addColorStop(0.715,'#fbf1e3');
    skyGrad.addColorStop(0.72,'#9fb8c8');
    skyGrad.addColorStop(1,'#5f7f95');
  }catch(e){ skyGrad=null; }
  // 青海波: a generated tile of overlapping scalloped arcs
  var S=Math.max(24,Math.round(MN*0.09)), c=mkCanvas(S*2,S), g=c.getContext('2d');
  if (g){
    g.clearRect(0,0,S*2,S);
    var r=S*0.55;
    for (var row=0;row<3;row++){
      for (var col=-1;col<4;col++){
        var cx=col*S+(row%2?S*0.5:0), cy=row*S*0.5;
        for (var k=0;k<4;k++){
          g.strokeStyle=rgba(39,74,109,0.22-k*0.04);
          g.lineWidth=Math.max(0.8,S*0.03);
          g.beginPath(); g.arc(cx,cy,r*(1-k*0.22),Math.PI,TAU); g.stroke();
        }
        g.fillStyle=rgba(159,184,200,1);
        g.beginPath(); g.arc(cx,cy,r*0.12,0,TAU); g.fill();
      }
    }
    try{ seaPat=ctx.createPattern(c,'repeat'); }catch(e){ seaPat=null; }
  }
}
function buildSprites(){
  SPS=Math.max(10,Math.round(MN*0.028));
  sprCv=mkCanvas(SPS*SPR,SPS*2);
  sprCtx=sprCv.getContext('2d');
  if (!sprCtx) return;
  var g=sprCtx;
  g.clearRect(0,0,sprCv.width,sprCv.height);
  for (var f=0;f<2;f++){
    for (var i=0;i<SPR;i++){
      var a=i/SPR*TAU;
      g.save();
      g.translate(i*SPS+SPS/2, f*SPS+SPS/2);
      g.rotate(a);
      var s=SPS*0.42, dip=f?0.18:0.42;
      g.strokeStyle='#1c2430';
      g.lineWidth=Math.max(1,SPS*0.09);
      g.lineCap='round';
      // the 千鳥 mark: two wings meeting at a body, pointing along +x
      g.beginPath();
      g.moveTo(-s*0.7,-s*dip); g.quadraticCurveTo(-s*0.2,-s*0.05,0,s*0.05);
      g.quadraticCurveTo(-s*0.2,-s*0.05,-s*0.7,-s*dip);
      g.moveTo(0,s*0.05); g.quadraticCurveTo(s*0.2,-s*0.05,s*0.7,-s*dip);
      g.stroke();
      g.fillStyle='#1c2430';
      g.beginPath(); g.ellipse(0.05*s,0,s*0.28,s*0.13,0,0,TAU); g.fill();
      g.restore();
    }
  }
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
  HORIZ=H*0.72;
  buildSky();
  buildSprites();
  var nt=mkCanvas(W*TS,H*TS), ntc=nt.getContext('2d');
  if (trail&&ntc){ try{ ntc.drawImage(trail,0,0,nt.width,nt.height); }catch(e){} }
  trail=nt; tctx=ntc;
  rescaleFlock();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  COVER MAPPING + ASPECT-CORRECTED CAMERA SPACE
//  Positions go through the cover map. Every RATIO — the fist test, the
//  clap distance normalised by hand span — is measured in cu()/cv()
//  space where a unit is the same physical length both ways.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect;
  if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX + (mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY + ny*(covS/camAspect); }
function cu(nx){ return nx*camAspect; }
function cv(ny){ return ny; }

// ═══════════════════════════════════════════════════════════════════════
//  HANDS
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.5;
var HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
        [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
var HAND=[{on:false,t:-9,fist:false,px:0,py:0,span:0.1,L:null},
          {on:false,t:-9,fist:false,px:0,py:0,span:0.1,L:null}];
var seenN=0, seenT=-9;
var clapArmed=true, clapT=0;

function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  return fin(p.x)&&fin(p.y);
}
function handLive(k){ return HAND[k].on && (now()-HAND[k].t)<LOST_S; }
function loseHands(){
  for (var k=0;k<2;k++){ HAND[k].on=false; HAND[k].fist=false; HAND[k].L=null; HAND[k].t=-9; }
  seenN=0; seenT=-9; clapArmed=true; clapT=0;
}
function fingerCurled(L,tip,pip){
  if (!lmOK(L,0)||!lmOK(L,tip)||!lmOK(L,pip)) return false;
  var wu=cu(L[0].x), wv=cv(L[0].y);
  var tu=cu(L[tip].x), tv=cv(L[tip].y);
  var pu=cu(L[pip].x), pv=cv(L[pip].y);
  return ((tu-wu)*(tu-wu)+(tv-wv)*(tv-wv)) < ((pu-wu)*(pu-wu)+(pv-wv)*(pv-wv))*0.95;
}
function onHands(res){
  var t=now();
  var lists=(res&&res.multiHandLandmarks)?res.multiHandLandmarks:null;
  var n=(lists&&typeof lists.length==='number')?Math.min(2,lists.length):0;
  seenN=0; seenT=t;
  for (var k=0;k<2;k++){
    if (k<n){
      var L=lists[k];
      if (!lmOK(L,0)||!lmOK(L,9)){ continue; }
      var c=0;
      if (fingerCurled(L,8,6)) c++;
      if (fingerCurled(L,12,10)) c++;
      if (fingerCurled(L,16,14)) c++;
      if (fingerCurled(L,20,18)) c++;
      var du=cu(L[9].x)-cu(L[0].x), dv=cv(L[9].y)-cv(L[0].y);
      HAND[k].span=Math.max(0.02,Math.sqrt(du*du+dv*dv));
      HAND[k].on=true; HAND[k].t=t; HAND[k].L=L;
      HAND[k].fist=(c>=3);
      HAND[k].px=sx(L[9].x); HAND[k].py=sy(L[9].y);
      seenN++;
    } else if (HAND[k].on && (t-HAND[k].t)>LOST_S){
      HAND[k].on=false; HAND[k].fist=false; HAND[k].L=null;
    }
  }
}
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0, selfieMode:false,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  FLOCK
// ═══════════════════════════════════════════════════════════════════════
var BMAX=900, BN=600;
var bx=new Float32Array(BMAX), by=new Float32Array(BMAX);
var bvx=new Float32Array(BMAX), bvy=new Float32Array(BMAX);
var bph=new Float32Array(BMAX), bturn=new Float32Array(BMAX), bspd=new Float32Array(BMAX);
var hist=new Int32Array(64);
var NV=12;
var vY=new Float32Array(NV), vSpd=new Float32Array(NV), vTurn=new Float32Array(NV), vN=new Int32Array(NV);
var vX=new Float32Array(NV);
var cenX=0, cenY=0, spread=0;
// neighbour grid
var GC=0, GW=0, GH=0, gHead=null, gNext=new Int32Array(BMAX);
var wanderA=0.7, wanderB=1.9;
var ATT=[{on:false,x:0,y:0,rep:false},{on:false,x:0,y:0,rep:false},{on:true,x:0,y:0,rep:false}];
var wildAmt=1;

function placeFlock(){
  for (var i=0;i<BMAX;i++){
    var a=Math.random()*TAU, r=Math.random()*MN*0.2;
    bx[i]=W*0.5+Math.cos(a)*r; by[i]=H*0.4+Math.sin(a)*r*0.6;
    bvx[i]=Math.cos(a)*MN*0.1; bvy[i]=Math.sin(a)*MN*0.1;
    bph[i]=Math.random()*TAU; bturn[i]=0;
  }
}
var flockPlaced=false, pW=0, pH=0;
function rescaleFlock(){
  if (!flockPlaced){ placeFlock(); flockPlaced=true; pW=W; pH=H; return; }
  if (pW>0&&pH>0){
    var fx=W/pW, fy=H/pH;
    for (var i=0;i<BMAX;i++){ bx[i]*=fx; by[i]*=fy; }
  }
  pW=W; pH=H;
}
function density(){ return densEl?clamp((+densEl.value||0)/100,0.1,1):0.64; }
function cohesion(){ return cohEl?clamp((+cohEl.value||0)/100,0,1):0.55; }

function stepFlock(dt,t){
  BN=Math.round(90+density()*(BMAX-90));
  var n=Math.max(60,Math.round(BN*qual));
  var R=MN*0.06, RS=MN*0.022, R2=R*R, RS2=RS*RS;
  var VMAX=MN*0.34, VMIN=MN*0.12, AMAX=MN*1.9;
  var coh=cohesion();
  // grid
  GC=Math.max(8,R);
  var gw=Math.max(1,Math.ceil(W/GC)), gh=Math.max(1,Math.ceil(H/GC));
  if (gw!==GW||gh!==GH||!gHead){ GW=gw; GH=gh; gHead=new Int32Array(GW*GH); }
  gHead.fill(-1);
  var i,cx,cy;
  for (i=0;i<n;i++){
    cx=clamp((bx[i]/GC)|0,0,GW-1); cy=clamp((by[i]/GC)|0,0,GH-1);
    var h=cy*GW+cx;
    gNext[i]=gHead[h]; gHead[h]=i;
  }
  // attractors
  var wildOn=!(ATT[0].on||ATT[1].on);
  wildAmt=chase(wildAmt,wildOn?1:0,0.6,dt);
  wanderA+=dt*0.11; wanderB+=dt*0.073;
  ATT[2].x=W*(0.5+0.32*Math.sin(wanderA)+0.1*Math.sin(wanderB*2.7));
  ATT[2].y=H*(0.36+0.2*Math.sin(wanderB)+0.08*Math.cos(wanderA*1.6));
  ATT[2].on=wildAmt>0.1;

  for (var v=0;v<NV;v++){ vY[v]=0; vSpd[v]=0; vTurn[v]=0; vN[v]=0; vX[v]=0; }
  var sxs=0, sys=0;
  var iss=isseiActive(t);
  for (i=0;i<n;i++){
    var px=bx[i], py=by[i], vx=bvx[i], vy=bvy[i];
    var sepx=0, sepy=0, alx=0, aly=0, cohx=0, cohy=0, cnt=0;
    cx=clamp((px/GC)|0,0,GW-1); cy=clamp((py/GC)|0,0,GH-1);
    for (var oy=-1;oy<=1;oy++){
      var yy=cy+oy; if (yy<0||yy>=GH) continue;
      for (var ox=-1;ox<=1;ox++){
        var xx=cx+ox; if (xx<0||xx>=GW) continue;
        var j=gHead[yy*GW+xx];
        var guard=0;
        while (j>=0&&guard<80){
          guard++;
          if (j!==i){
            var dx=bx[j]-px, dy=by[j]-py, d2=dx*dx+dy*dy;
            if (d2<R2&&d2>1e-6){
              cnt++;
              alx+=bvx[j]; aly+=bvy[j];
              cohx+=dx; cohy+=dy;
              if (d2<RS2){ var w=(RS2-d2)/RS2; sepx-=dx*w; sepy-=dy*w; }
            }
          }
          j=gNext[j];
        }
      }
    }
    var ax=0, ay=0;
    if (cnt>0){
      var inv=1/cnt;
      ax+=(alx*inv-vx)*2.2;
      ay+=(aly*inv-vy)*2.2;
      ax+=cohx*inv*(1.6+coh*6.0);
      ay+=cohy*inv*(1.6+coh*6.0);
    }
    ax+=sepx*14; ay+=sepy*14;
    // attractors / repellers
    for (var s=0;s<3;s++){
      var A=ATT[s]; if (!A.on) continue;
      var tx=A.x-px, ty=A.y-py;
      var td=Math.sqrt(tx*tx+ty*ty)+1e-6;
      var str=(s===2)?0.9*wildAmt:1.6;
      if (A.rep){
        var rr=MN*0.38;
        if (td<rr){ var f=(1-td/rr)*11; ax-=tx/td*f*MN; ay-=ty/td*f*MN; }
      } else {
        var fa=clamp(td/(MN*0.5),0.25,1.2)*str;
        ax+=tx/td*fa*MN*1.3; ay+=ty/td*fa*MN*1.3;
      }
    }
    // stay in the sky: soft walls, and never below the horizon
    var m=MN*0.06;
    if (px<m) ax+=(m-px)*9; else if (px>W-m) ax-=(px-(W-m))*9;
    if (py<m) ay+=(m-py)*9; else if (py>HORIZ-m) ay-=(py-(HORIZ-m))*12;
    // limit acceleration (this is what makes turns banks)
    var am=Math.sqrt(ax*ax+ay*ay);
    if (am>AMAX){ ax*=AMAX/am; ay*=AMAX/am; }
    var ovx=vx, ovy=vy;
    vx+=ax*dt; vy+=ay*dt;
    var sp=Math.sqrt(vx*vx+vy*vy);
    if (sp>VMAX){ vx*=VMAX/sp; vy*=VMAX/sp; sp=VMAX; }
    else if (sp<VMIN&&sp>1e-6){ vx*=VMIN/sp; vy*=VMIN/sp; sp=VMIN; }
    // turn rate = angle between old and new heading
    var cr=ovx*vy-ovy*vx, dd=ovx*vx+ovy*vy;
    var turn=Math.abs(Math.atan2(cr,dd));
    bturn[i]=turn;
    px+=vx*dt; py+=vy*dt;
    var lim=HORIZ-MN*0.02;
    if (py>lim){ py=lim; if (vy>0) vy=-vy*0.5; }
    bx[i]=clamp(px,0,W); by[i]=clamp(py,0,lim); bvx[i]=vx; bvy[i]=vy;
    bph[i]+=dt*(9+sp/MN*14);
    sxs+=px; sys+=py;
    bspd[i]=sp;
  }
  // Voices follow HEIGHT BANDS of the flock, not interleaved index groups —
  // fifty birds picked by index all average to the centroid, which would
  // make every voice sing the same note however the flock was shaped.
  // Sorting into twelve quantile bands by height is what makes a spread
  // flock a chord and a tight flock a unison.
  var NB=64; for (i=0;i<NB;i++) hist[i]=0;
  for (i=0;i<n;i++){ var bi=clamp((by[i]/Math.max(1,HORIZ)*NB)|0,0,NB-1); hist[bi]++; }
  var acc=0;
  for (i=0;i<NB;i++){ var c0=hist[i]; hist[i]=acc; acc+=c0; }   // hist[bin] = birds above this bin
  for (i=0;i<n;i++){
    var bb=clamp((by[i]/Math.max(1,HORIZ)*NB)|0,0,NB-1);
    var g=clamp(((hist[bb]+0.5)*NV/Math.max(1,n))|0,0,NV-1);
    vY[g]+=by[i]; vX[g]+=bx[i]; vSpd[g]+=bspd[i]; vTurn[g]+=bturn[i]; vN[g]++;
  }
  cenX=sxs/Math.max(1,n); cenY=sys/Math.max(1,n);
  var sp2=0;
  for (i=0;i<n;i++){ var ex=bx[i]-cenX, ey=by[i]-cenY; sp2+=ex*ex+ey*ey; }
  spread=Math.sqrt(sp2/Math.max(1,n))/MN;
  for (v=0;v<NV;v++){
    if (vN[v]>0){ vY[v]/=vN[v]; vX[v]/=vN[v]; vSpd[v]/=vN[v]; vTurn[v]/=vN[v]; }
    else { vY[v]=cenY; vX[v]=cenX; }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ twelve whistle voices with portamento, breath by speed
// ═══════════════════════════════════════════════════════════════════════
var ac=null, master=null, comp=null, wet=null, sndOn=true, canPan=false;
var VO=[], noiseSrc=null, noiseBuf=null, flutterTok=4;
var SCALE=[0,2,5,7,9], BASE=261.63;
var vLastF=new Float32Array(NV), vLastG=new Float32Array(NV), vIdx=new Int32Array(NV);

function makeNoise(){
  var n=Math.max(1,Math.floor(ac.sampleRate*1.2));
  var b=ac.createBuffer(1,n,ac.sampleRate);
  var d=b.getChannelData(0);
  var lp=0;
  for (var i=0;i<n;i++){ var w=Math.random()*2-1; lp=lp+(w-lp)*0.35; d[i]=lp*1.8; }
  return b;
}
function initAudio(){
  if (ac) return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return;
  try{ ac=new AC(); }catch(e){ ac=null; return; }
  comp=ac.createDynamicsCompressor();
  try{ comp.threshold.value=-16; comp.knee.value=24; comp.ratio.value=4; comp.attack.value=0.005; comp.release.value=0.25; }catch(e){}
  master=ac.createGain(); master.gain.value=0.9;
  master.connect(comp); comp.connect(ac.destination);
  wet=ac.createGain(); wet.gain.value=0.24; wet.connect(master);
  var dl=ac.createDelay(1); dl.delayTime.value=0.13;
  var lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2800;
  var fb=ac.createGain(); fb.gain.value=0.32;
  dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet);
  canPan=(typeof ac.createStereoPanner==='function');
  noiseBuf=makeNoise();
  noiseSrc=ac.createBufferSource(); noiseSrc.buffer=noiseBuf; noiseSrc.loop=true;
  try{ noiseSrc.start(); }catch(e){}
  VO=[];
  for (var v=0;v<NV;v++){
    var o1=ac.createOscillator(); o1.type='sine';
    var o2=ac.createOscillator(); o2.type='triangle';
    var g2=ac.createGain(); g2.gain.value=0.22;
    var f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2200; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=0;
    var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=880; bp.Q.value=9;
    var bg=ac.createGain(); bg.gain.value=0;
    var out=ac.createGain(); out.gain.value=1;
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(out);
    noiseSrc.connect(bp); bp.connect(bg); bg.connect(out);
    if (canPan){ var p=ac.createStereoPanner(); out.connect(p); p.connect(master); p.connect(dl); VO.push({o1:o1,o2:o2,f:f,g:g,bp:bp,bg:bg,p:p}); }
    else { out.connect(master); out.connect(dl); VO.push({o1:o1,o2:o2,f:f,g:g,bp:bp,bg:bg,p:null}); }
    o1.frequency.value=BASE; o2.frequency.value=BASE;
    try{ o1.start(); o2.start(); }catch(e){}
    vLastF[v]=BASE; vLastG[v]=0; vIdx[v]=-1;
  }
}
function setSound(on){
  sndOn=!!on;
  if (sndBtn){ sndBtn.className=sndOn?'on':''; sndBtn.textContent=sndOn?'音 ON':'音 OFF'; }
}
if (sndBtn) sndBtn.addEventListener('click',function(){ setSound(!sndOn); });

function freqOfIdx(idx){
  idx=clamp(idx|0,0,12);
  var semis=SCALE[idx%5]+12*Math.floor(idx/5);
  return BASE*Math.pow(2,semis/12);
}
var voicesSounding=0, regIdx=0;
function stepAudio(dt,t){
  if (!ac||!VO.length) return;
  var at=ac.currentTime;
  var leap=isseiActive(t)?clamp(1-(t-issT)/0.7,0,1):0;
  var used={}; voicesSounding=0; var sumIdx=0;
  for (var v=0;v<NV;v++){
    var yf=clamp(1-vY[v]/Math.max(1,HORIZ),0,1);
    var idx=clamp(Math.round(yf*12),0,12);
    // hysteresis so a group sitting on a boundary does not chatter
    if (vIdx[v]>=0 && Math.abs(yf*12-vIdx[v])<0.62) idx=vIdx[v];
    vIdx[v]=idx; sumIdx+=idx;
    var f=freqOfIdx(idx)*(1+leap);
    var spf=clamp(vSpd[v]/(MN*0.34),0,1);
    var gain=sndOn?(0.028+spf*0.05):0;
    var breath=sndOn?(0.004+spf*0.03+clamp(vTurn[v]*6,0,1)*0.01):0;
    if (!fin(f)||f<20) f=BASE;
    var V=VO[v];
    try{
      if (Math.abs(f-vLastF[v])>0.5){
        V.o1.frequency.setTargetAtTime(f,at,leap>0?0.03:0.09);
        V.o2.frequency.setTargetAtTime(f,at,leap>0?0.03:0.09);
        V.bp.frequency.setTargetAtTime(clamp(f*2,80,12000),at,0.1);
        vLastF[v]=f;
      }
      if (Math.abs(gain-vLastG[v])>0.001){
        V.g.gain.setTargetAtTime(gain,at,0.12);
        vLastG[v]=gain;
      }
      V.bg.gain.setTargetAtTime(breath,at,0.15);
      V.f.frequency.setTargetAtTime(clamp(900+spf*3200,200,12000),at,0.15);
      if (V.p) V.p.pan.setTargetAtTime(clamp((vX[v]/Math.max(1,W)-0.5)*1.4,-1,1),at,0.2);
    }catch(e){}
    if (gain>0.001){ if (!used[idx]){ used[idx]=1; voicesSounding++; } }
  }
  regIdx=Math.round(sumIdx/NV);
  // wingbeat flutter: a tiny filtered click per sharp turn, rate-limited
  flutterTok=Math.min(4,flutterTok+7*dt);
  if (sndOn&&flutterTok>=1&&noiseBuf){
    var turns=0; for (v=0;v<NV;v++) if (vTurn[v]>0.09) turns++;
    if (turns>0&&Math.random()<0.5){
      flutterTok-=1;
      try{
        var s=ac.createBufferSource(); s.buffer=noiseBuf;
        var b=ac.createBiquadFilter(); b.type='bandpass'; b.frequency.value=3200+Math.random()*2500; b.Q.value=4;
        var gg=ac.createGain();
        gg.gain.setValueAtTime(0.0001,at);
        gg.gain.exponentialRampToValueAtTime(0.05,at+0.004);
        gg.gain.exponentialRampToValueAtTime(0.0001,at+0.03);
        s.connect(b); b.connect(gg); gg.connect(master);
        s.start(at,Math.random()*0.8); s.stop(at+0.05);
      }catch(e){}
    }
  }
}
function isseiSound(){
  if (!sndOn||!ac||!master||!noiseBuf) return;
  try{
    var t=ac.currentTime;
    var s=ac.createBufferSource(); s.buffer=noiseBuf;
    var b=ac.createBiquadFilter(); b.type='bandpass';
    b.frequency.setValueAtTime(600,t); b.frequency.exponentialRampToValueAtTime(5200,t+0.5);
    b.Q.value=1.4;
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.28,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0002,t+0.9);
    s.connect(b); b.connect(g); g.connect(master);
    s.start(t); s.stop(t+1);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  一斉 ISSEI ─ the clap
// ═══════════════════════════════════════════════════════════════════════
var issT=-99, issFlash=0, ISS_COOL=6;
function fireIssei(t){
  if (t-issT<ISS_COOL) return;
  issT=t; issFlash=1;
  var n=Math.max(60,Math.round(BN*qual));
  for (var i=0;i<n;i++){
    var dx=bx[i]-cenX, dy=by[i]-cenY;
    var d=Math.sqrt(dx*dx+dy*dy)+1e-6;
    var sp=MN*(0.55+Math.random()*0.35);
    bvx[i]=dx/d*sp; bvy[i]=dy/d*sp-MN*0.15;
  }
  isseiSound();
}
function isseiActive(t){ return (t-issT)<1.2; }

// ═══════════════════════════════════════════════════════════════════════
//  SIMULATION
// ═══════════════════════════════════════════════════════════════════════
var started=false, last=0, qual=1, costS=8, hudT=0;

function updateHandsToAttractors(t,dt){
  for (var k=0;k<2;k++){
    var h=HAND[k];
    var live=h.on&&(t-h.t)<LOST_S;
    if (live&&fin(h.px)&&fin(h.py)){
      ATT[k].on=true; ATT[k].x=h.px; ATT[k].y=Math.min(h.py,HORIZ-MN*0.03); ATT[k].rep=h.fist;
    } else ATT[k].on=false;
  }
  // clap: both hands FRESHLY seen, palms closer than 0.9 hand-spans,
  // armed only after they were further than 1.8 spans apart
  var fresh=(seenN>=2)&&((t-seenT)<0.2);
  if (fresh&&lmOK(HAND[0].L,9)&&lmOK(HAND[1].L,9)){
    var du=cu(HAND[0].L[9].x)-cu(HAND[1].L[9].x), dv=cv(HAND[0].L[9].y)-cv(HAND[1].L[9].y);
    var d=Math.sqrt(du*du+dv*dv)/Math.max(0.02,(HAND[0].span+HAND[1].span)*0.5);
    if (d>1.8) clapArmed=true;
    if (clapArmed&&d<0.9){ clapT+=dt; if (clapT>0.12){ fireIssei(t); clapArmed=false; clapT=0; } }
    else clapT=Math.max(0,clapT-dt*3);
  } else { clapT=Math.max(0,clapT-dt*3); }
}
function step(dt,t){
  updateCover();
  updateHandsToAttractors(t,dt);
  stepFlock(dt,t);
  stepAudio(dt,t);
  issFlash*=Math.exp(-dt*4);
  if (t-hudT>0.2){ hudT=t; updateHud(); }
}
function updateHud(){
  if (rB) rB.textContent=String(Math.max(60,Math.round(BN*qual)));
  if (rV) rV.textContent=String(voicesSounding);
  if (rH) rH.textContent=['宮','商','角','徴','羽','宮','商','角','徴','羽','宮','商','角'][clamp(regIdx,0,12)]+(regIdx>=10?'‴':regIdx>=5?'″':'′');
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════════════════════
function drawSky(t){
  ctx.fillStyle=skyGrad?skyGrad:'#dbe7ee';
  ctx.fillRect(0,0,W,H);
  // the low sun
  var sunx=W*0.22, suny=HORIZ-MN*0.11, sr=MN*0.07;
  var gr=null;
  try{ gr=ctx.createRadialGradient(sunx,suny,0,sunx,suny,sr*3.2); }catch(e){ gr=null; }
  if (gr){
    gr.addColorStop(0,'rgba(255,236,214,0.9)');
    gr.addColorStop(0.28,'rgba(255,236,214,0.35)');
    gr.addColorStop(1,'rgba(255,236,214,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(sunx,suny,sr*3.2,0,TAU); ctx.fill();
  }
  ctx.fillStyle='rgba(255,246,232,0.85)';
  ctx.beginPath(); ctx.arc(sunx,suny,sr,0,TAU); ctx.fill();
  // sea
  if (seaPat){
    ctx.save();
    ctx.globalAlpha=0.85;
    ctx.fillStyle=seaPat;
    ctx.translate(Math.sin(t*0.3)*MN*0.01,0);
    ctx.fillRect(-MN*0.02,HORIZ,W+MN*0.04,H-HORIZ);
    ctx.restore();
  }
  ctx.fillStyle='rgba(251,241,227,0.7)';
  ctx.fillRect(0,HORIZ-1,W,Math.max(1,MN*0.002));
}
function drawTrails(){
  if (!tctx||!trail) return;
  // fade the ink slowly toward the sky, then stamp every bird
  tctx.setTransform(1,0,0,1,0,0);
  tctx.globalCompositeOperation='destination-out';
  tctx.fillStyle='rgba(0,0,0,0.022)';
  tctx.fillRect(0,0,trail.width,trail.height);
  tctx.globalCompositeOperation='source-over';
  tctx.fillStyle='rgba(39,74,109,0.16)';
  var n=Math.max(60,Math.round(BN*qual));
  var s=Math.max(1,MN*0.0022*TS);
  for (var i=0;i<n;i++){ tctx.fillRect(bx[i]*TS-s*0.5,by[i]*TS-s*0.5,s,s); }
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(trail,0,0,W,H);
  ctx.restore();
}
function drawBirds(){
  if (!sprCv) return;
  var n=Math.max(60,Math.round(BN*qual));
  var half=SPS*0.5;
  for (var i=0;i<n;i++){
    var a=Math.atan2(bvy[i],bvx[i]); if (a<0) a+=TAU;
    var k=Math.round(a/TAU*SPR)%SPR;
    var f=(Math.sin(bph[i])>0)?1:0;
    ctx.drawImage(sprCv,k*SPS,f*SPS,SPS,SPS,bx[i]-half,by[i]-half,SPS,SPS);
  }
}
function drawHands(t){
  for (var k=0;k<2;k++){
    var h=HAND[k];
    if (!h.on||(t-h.t)>=LOST_S||!h.L) continue;
    var L=h.L;
    ctx.strokeStyle=rgba(39,74,109,0.32);
    ctx.lineWidth=Math.max(1,MN*0.002);
    ctx.beginPath();
    for (var c=0;c<HC.length;c++){
      var a=HC[c][0], b=HC[c][1];
      if (!lmOK(L,a)||!lmOK(L,b)) continue;
      ctx.moveTo(sx(L[a].x),sy(L[a].y)); ctx.lineTo(sx(L[b].x),sy(L[b].y));
    }
    ctx.stroke();
    if (!fin(h.px)||!fin(h.py)) continue;
    var r=MN*0.034*(1+0.06*Math.sin(t*4+k));
    if (h.fist){
      ctx.fillStyle=rgba(28,36,48,0.55);
      ctx.beginPath(); ctx.arc(h.px,h.py,r*0.5,0,TAU); ctx.fill();
    } else {
      ctx.strokeStyle=rgba(200,64,47,0.75);
      ctx.lineWidth=Math.max(1.2,MN*0.003);
      ctx.beginPath(); ctx.arc(h.px,h.py,r,0,TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(h.px,h.py,r*1.7,0,TAU); ctx.strokeStyle=rgba(200,64,47,0.25); ctx.stroke();
    }
  }
}
function drawIssei(t){
  if (isseiActive(t)){
    var age=t-issT, a=clamp(1-age/1.2,0,1);
    ctx.strokeStyle=rgba(200,64,47,a*0.8);
    ctx.lineWidth=Math.max(1.5,MN*0.006*a+1);
    ctx.beginPath(); ctx.arc(cenX,cenY,Math.max(1,age*MN*1.4),0,TAU); ctx.stroke();
  }
  if (issFlash>0.01){
    ctx.fillStyle=rgba(255,232,214,issFlash*0.6);
    ctx.fillRect(0,0,W,H);
  }
}
function drawHint(t){
  if (handLive(0)||handLive(1)) return;
  var a=0.34+0.16*Math.sin(t*1.8);
  ctx.fillStyle=rgba(39,74,109,a);
  ctx.font=Math.round(clamp(MN*0.036,13,21))+'px "Shippori Antique", sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('手のひらをカメラに見せてください',W/2,H*0.85);
  ctx.font='300 '+Math.round(clamp(MN*0.026,11,15))+'px "DM Mono", monospace';
  ctx.fillStyle=rgba(39,74,109,a*0.7);
  ctx.fillText('群れが寄ってきます',W/2,H*0.85+MN*0.056);
}
function draw(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky(t);
  drawTrails();
  drawBirds();
  drawHands(t);
  drawIssei(t);
  if (started) drawHint(t);
}
function frame(){
  var t=now();
  var dt=clamp(t-last,0,0.1);
  last=t;
  var t0=now();
  if (started) step(dt,t);
  draw(t);
  if (started){
    var cost=(now()-t0)*1000;
    costS=costS+(cost-costS)*0.07;
    if (costS>26&&qual>0.3) qual=Math.max(0.3,qual-0.04);
    else if (costS<14&&qual<1) qual=Math.min(1,qual+0.02);
  }
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoT=0, dB=[];
function demoFrame(){
  if (!demoCtx) return;
  var g=demoCtx, DW=demoCv.width, DH=demoCv.height;
  demoT+=1/60;
  var cyc=demoT%8;
  var sg=null;
  try{ sg=g.createLinearGradient(0,0,0,DH); sg.addColorStop(0,'#f3d3bd'); sg.addColorStop(0.6,'#dbe7ee'); sg.addColorStop(0.75,'#fbf1e3'); sg.addColorStop(0.76,'#9fb8c8'); sg.addColorStop(1,'#5f7f95'); }catch(e){}
  g.fillStyle=sg?sg:'#dbe7ee'; g.fillRect(0,0,DW,DH);
  if (dB.length===0){ for (var i=0;i<70;i++) dB.push({x:DW*0.5+(Math.random()-0.5)*160,y:DH*0.4+(Math.random()-0.5)*80,vx:0,vy:0}); }
  var fist=(cyc>2.8&&cyc<5.0), clap=(cyc>6.2);
  var hx=DW*(0.3+0.4*(0.5+0.5*Math.sin(demoT*0.7))), hy=DH*(0.35+0.15*Math.sin(demoT*0.5));
  var cx=0,cy=0;
  for (i=0;i<dB.length;i++){ cx+=dB[i].x; cy+=dB[i].y; }
  cx/=dB.length; cy/=dB.length;
  for (i=0;i<dB.length;i++){
    var b=dB[i];
    var tx=hx-b.x, ty=hy-b.y, d=Math.hypot(tx,ty)+1;
    var ax=tx/d*(fist?-90:60), ay=ty/d*(fist?-90:60);
    ax+=(cx-b.x)*0.4; ay+=(cy-b.y)*0.4;
    for (var j=0;j<dB.length;j++){ if (j===i) continue; var ddx=b.x-dB[j].x, ddy=b.y-dB[j].y, dd=ddx*ddx+ddy*ddy; if (dd<120&&dd>0.01){ ax+=ddx*2; ay+=ddy*2; } }
    if (clap&&cyc<6.3){ var ex=b.x-cx, ey=b.y-cy, ed=Math.hypot(ex,ey)+1; b.vx=ex/ed*260; b.vy=ey/ed*260-60; }
    b.vx=(b.vx+ax/60)*0.96; b.vy=(b.vy+ay/60)*0.96;
    var sp=Math.hypot(b.vx,b.vy); if (sp>110){ b.vx*=110/sp; b.vy*=110/sp; }
    b.x+=b.vx/60; b.y+=b.vy/60;
    if (b.y>DH*0.7) b.y=DH*0.7;
    g.strokeStyle='#1c2430'; g.lineWidth=1.6; g.lineCap='round';
    var a=Math.atan2(b.vy,b.vx), s=5;
    g.save(); g.translate(b.x,b.y); g.rotate(a);
    g.beginPath(); g.moveTo(-s,-s*0.5); g.quadraticCurveTo(-s*0.3,0,0,0); g.quadraticCurveTo(s*0.3,0,s,-s*0.5); g.stroke();
    g.restore();
  }
  if (!clap){
    g.strokeStyle=fist?'rgba(28,36,48,.7)':'rgba(200,64,47,.8)'; g.lineWidth=2.2;
    g.beginPath(); g.arc(hx,hy,fist?7:13,0,TAU); g.stroke();
    if (fist){ g.fillStyle='rgba(28,36,48,.6)'; g.fill(); }
  } else {
    g.strokeStyle='rgba(200,64,47,'+clamp(1-(cyc-6.2)/1.4,0,1).toFixed(3)+')'; g.lineWidth=3;
    g.beginPath(); g.arc(cx,cy,(cyc-6.2)*300,0,TAU); g.stroke();
  }
  var label=cyc<2.8?'手のひらを見せれば、群れが寄る':(cyc<5.0?'握れば、散って和音になる':(cyc<6.2?'締まれば、十二の声が一つに揃う':'両手を打てば ── 一斉'));
  g.fillStyle='rgba(28,36,48,.8)'; g.font='15px "Shippori Antique", sans-serif'; g.textAlign='center';
  g.fillText(label,DW/2,24);
  if (demoRun && typeof requestAnimationFrame==='function') requestAnimationFrame(demoFrame);
}
if (demoCtx) demoFrame();

startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  initHands();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
updateCover();
setSound(true);
last=now();
frame();
</script>
