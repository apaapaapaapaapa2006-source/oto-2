<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOROI ─ 九十六の振り子がいつか揃う</title>
<meta name="description" content="長さの違う九十六の振り子が、それぞれの周期で揺れつづける楽器。手で薙げばそこから鳴りはじめ、散らばった位相の模様は百二十秒でひとまわりして同じ形へ帰る。両手を高く掲げれば、待たずに揃う。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  SOROI 揃い ─ 九十六の振り子がいつか揃う           ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      A dark hall with one machine in it. Ninety-six brass bobs on
            invisible wires, lit from directly above, swinging over a row
            of glowing strings. Nothing here is a filter or a texture —
            it is a KINETIC SCULPTURE, and the thing you are watching is
            TIME. Every pendulum has a different period, so the row is a
            rope that braids and unbraids itself forever. Tonight's other
            piece (BIROUDO) is warm cloth in a bright room; this one is
            cold metal in the dark, and they must not look related.

  PALETTE   墨    sumi     #07080d  the hall. Blue-black, never neutral,
                                    so the brass reads warm against it.
            鉄紺  tetsukon #151d2c  the beam, the rules, the architecture.
                                    Structure is drawn, never implied.
            真鍮  shinchu  #e8b25a  the bobs and every number on screen.
                                    The only solid colour in the piece.
            白群  byakugun #7fd9ee  the strings. They are dark until they
                                    are struck, then they are LIGHT —
                                    additive, bloomed, and the brighter a
                                    string is the harder it was hit.
            朱    shu      #ff5537  RESERVED for 揃い. One event, one
                                    colour. If you see vermilion, all
                                    ninety-six are in phase.

  BACKGROUND  Flat 墨 with a single soft pool of light falling from the
              beam — no vignette, no gradient mesh. Below the strings, a
              faint 鉄紺 rule marks the floor. Additive bloom over
              everything: the glow layer is redrawn at a third of the
              resolution and composited twice with 'lighter'.

  TYPE      Sora for numerals and Latin — a geometric grotesque with a
              mechanical, instrument-panel feel, at ExtraLight for large
              sizes and SemiBold only inside the HUD. Zen Kaku Gothic New
              for Japanese, wide-tracked. No serifs anywhere: this is a
              machine, not a scroll.

  MOTION    Sinusoidal, and literally so — every moving thing in the
            piece is a harmonic oscillator advanced by an EXACT rotation
            (cos/sin of ω·dt), so there is no integration drift and the
            alignment at t=120s really lands. UI easing is a matched
            ease-out with no bounce: nothing in a machine overshoots.

  SIGNATURE 位相が音になる。 The pitch belongs to the string, not to the
            pendulum — the pendulum only decides WHEN. Because the
            periods run 95:96:97:…:190 against a 120-second cycle, the
            row passes through every polyrhythm on its way back to
            unison: one wave, then two, then three, then a scatter, then
            unison again. You never play a rhythm here. You start one,
            and it keeps re-composing itself for two minutes.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#07080d}

  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  #ttl{

    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;

  #panel{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 16px;
    background:rgba(13,17,26,.78);border:1px solid rgba(127,217,238,.18);

  .sheet{

    background:radial-gradient(120% 90% at 50% 12%,rgba(21,29,44,.94),rgba(7,8,13,.985));
    padding:16px;transition:opacity .55s cubic-bezier(.2,.7,.3,1);

  .sheet .card{

    box-shadow:0 30px 90px rgba(0,0,0,.72);
  }
  .cap{
    display:flex;justify-content:space-between;align-items:center;

    color:rgba(127,217,238,.45);
  }
  .cap b{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;color:#e8b25a;letter-spacing:.2em}
  .bodyw{padding:20px 22px 22px}
  .ttl2{
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;
    font-size:clamp(19px,5vw,26px);letter-spacing:.12em;color:#e8b25a;line-height:1.45;
  }

  .go{

    .bodyw{padding:16px 15px 18px}

<body>
<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="err"></div>

<div id="ttl">
  <div class="k">揃い</div>
  <div class="s">SOROI</div>
</div>

<div id="read">
  揺 <b id="rN">0</b>　音 <b id="rV">0</b>　揃 <b id="rC">—</b>
</div>

<div id="panel">
  <div class="grp"><label>撞</label><input type="range" id="hitEl" min="10" max="100" value="58"></div>

  </div>

</div>

<div class="sheet" id="startSheet">
  <div class="card">
    <div class="cap"><span>OTO-II / SOROI</span><span>九十六の <b>周期</b></span></div>
    <div class="bodyw">
      <div class="ttl2">ばらばらの振り子が、<br>同じ形へ帰ってくる</div>
      <p class="lead">
        長さの違う九十六の振り子が吊るされています。<br>
        一番左は一・二六秒、一番右はその半分ちょうど。<br>
        手で薙げば、触れたところから揺れて弦を弾きます。<br>
        音の高さを決めるのは弦で、振り子が決めるのは<em>いつ鳴るか</em>だけ。
      </p>
      <canvas id="demo" width="660" height="230"></canvas>
      <div class="spec">
        <span>手で薙ぐ</span>通った振り子が揺れだします。速く薙ぐほど大きく<br>
        <span>余韻</span>揺れの減りかた。長くすればいつまでも鳴っています<br>
        <span>周期</span>模様は百二十秒でひとまわりし、同じ形へ帰ってきます<br>
        <span>両手を上へ</span><em>揃い</em>。待たずに九十六本が一度に揃います
      </div>
      <button class="go" id="startBtn">吊る</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  BASICS
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function fin(v){ return typeof v==='number' && isFinite(v); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function now(){
  return (typeof performance!=='undefined'&&performance&&performance.now)
    ? performance.now()/1000 : Date.now()/1000;
}
function raf(fn){
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(fn);
  else setTimeout(function(){ fn(now()*1000); },16);
}
function mkCanvas(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  return c;
}

var view=document.getElementById('view');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var hitEl=document.getElementById('hitEl');
var dampEl=document.getElementById('dampEl');
var sndBtn=document.getElementById('snd');
var scBtns=[document.getElementById('sc0'),document.getElementById('sc1'),document.getElementById('sc2')];
var rN=document.getElementById('rN'), rV=document.getElementById('rV'), rC=document.getElementById('rC');
var demoCv=document.getElementById('demo');
var g=view.getContext('2d');

var DPR=1, W=960, H=600, SHORT=600;
var started=false, last=now();

// ═══════════════════════════════════════════════════════════════════════
//  THE MACHINE
//  N pendulums. Pendulum n completes (C0+n) oscillations in T0 seconds,
//  so every period divides T0 exactly and the whole row returns to
//  unison at t = T0. Length ∝ T², which is what draws the wing shape.
// ═══════════════════════════════════════════════════════════════════════
var N=96, C0=N-1;                 // 95 … 190 oscillations
var T0=1.26*C0;                   // ≈ 119.7 s — the alignment cycle
var per=new Float32Array(N), omg=new Float32Array(N), rel=new Float32Array(N);
var th=new Float32Array(N), tv=new Float32Array(N);
var deg=new Int16Array(N), det=new Float32Array(N);
var px=new Float32Array(N), pyv=new Float32Array(N), plen=new Float32Array(N);
var lit=new Float32Array(N), litV=new Float32Array(N), wobT=new Float32Array(N);
var prevTh=new Float32Array(N);
var alignClock=0, thMax=0.30;

var NDEG=20;
function buildMachine(){
  var i, Tmax=T0/C0;
  for (i=0;i<N;i++){
    per[i]=T0/(C0+i);
    omg[i]=TAU/per[i];
    rel[i]=(per[i]*per[i])/(Tmax*Tmax);   // 1.0 → 0.25
    deg[i]=Math.round(i*(NDEG-1)/(N-1));
    det[i]=1+((i%7)-3)*0.0016;
    th[i]=0; tv[i]=0; prevTh[i]=0; lit[i]=0; litV[i]=0; wobT[i]=-9;
  }
}
buildMachine();

// ═══════════════════════════════════════════════════════════════════════
//  LAYOUT
// ═══════════════════════════════════════════════════════════════════════
var beamY=0, padX=0, Lmax=0, bobR=3;
var trace=null, tctx=null, glow=null, gctx=null, GS=3;

function layout(){
  var topM=Math.max(72,H*0.145);
  var botM=Math.max(96,H*0.175);
  beamY=topM;
  var avail=Math.max(60,H-topM-botM);
  Lmax=avail*0.98;
  padX=Math.max(10,W*0.045);
  var span=Math.max(20,W-padX*2);
  var i;
  for (i=0;i<N;i++){
    px[i]=padX+(i+0.5)*span/N;
    plen[i]=Lmax*rel[i];
    pyv[i]=beamY+plen[i];
  }
  bobR=clamp(span/N*0.40,1.6,5.2);
  thMax=Math.min(0.30,(span*0.20)/Math.max(1,Lmax));
  if (!fin(thMax)||thMax<=0.02) thMax=0.02;
}

function resize(){
  DPR=Math.min(2,(window.devicePixelRatio||1));
  var cw=Math.max(240,window.innerWidth||320);
  var ch=Math.max(240,window.innerHeight||480);
  view.width=Math.round(cw*DPR); view.height=Math.round(ch*DPR);
  view.style.width=cw+'px'; view.style.height=ch+'px';
  W=view.width; H=view.height; SHORT=Math.min(W,H);
  layout();
  trace=mkCanvas(W,H); tctx=trace.getContext('2d');
  glow=mkCanvas(Math.max(1,Math.round(W/GS)),Math.max(1,Math.round(H/GS)));
  gctx=glow.getContext('2d');
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  COVER MAPPING + ASPECT-CORRECTED CAMERA SPACE
//  Landmark x is normalised by FRAME width and y by FRAME height, so any
//  ratio (hand span, the raise test) is measured in cu()/cv() where one
//  unit is the same physical length in both directions.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect;
  if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX+(mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY+ny*(covS/camAspect); }
function cu(nx){ return nx*camAspect; }
function cv(ny){ return ny; }

// ═══════════════════════════════════════════════════════════════════════
//  HANDS
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.42;
var HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
        [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
var TIPS=[4,8,12,16,20,9];
function mkHand(){
  return { on:false,t:-9,L:null,span:0.1,
           cx:new Float32Array(6),cy:new Float32Array(6),
           ox:new Float32Array(6),oy:new Float32Array(6),
           fresh:false, raised:false };
}
var HAND=[mkHand(),mkHand()];
var raiseT=0, aligned=0, alignCool=-99, seenN=0;

function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  return fin(p.x)&&fin(p.y);
}
function handLive(k){ return HAND[k].on && (now()-HAND[k].t)<LOST_S; }
function loseHands(){
  for (var k=0;k<2;k++){
    var h=HAND[k];
    h.on=false; h.L=null; h.t=-9; h.fresh=false; h.raised=false;
  }
  seenN=0; raiseT=0;
}
function onHands(res){
  var t=now();
  var lists=(res&&res.multiHandLandmarks)?res.multiHandLandmarks:null;
  var n=(lists&&typeof lists.length==='number')?Math.min(2,lists.length):0;
  seenN=0;
  for (var k=0;k<2;k++){
    var h=HAND[k];
    if (k<n){
      var L=lists[k];
      if (!lmOK(L,0)||!lmOK(L,9)){ continue; }
      var du=cu(L[9].x)-cu(L[0].x), dv=cv(L[9].y)-cv(L[0].y);
      h.span=Math.max(0.02,Math.sqrt(du*du+dv*dv));
      var wasLive=h.on&&(t-h.t)<LOST_S;
      var i,idx,ok=true;
      for (i=0;i<6;i++){
        idx=TIPS[i];
        if (!lmOK(L,idx)){ ok=false; break; }
      }
      if (!ok) continue;
      for (i=0;i<6;i++){
        idx=TIPS[i];
        var nx=sx(L[idx].x), ny=sy(L[idx].y);
        if (!fin(nx)||!fin(ny)){ ok=false; break; }
        if (wasLive){ h.ox[i]=h.cx[i]; h.oy[i]=h.cy[i]; }
        else { h.ox[i]=nx; h.oy[i]=ny; }
        h.cx[i]=nx; h.cy[i]=ny;
      }
      if (!ok) continue;
      h.fresh=!wasLive;
      h.on=true; h.t=t; h.L=L;
      // 揃い gesture: the whole hand high in the FRAME (aspect-free: y only)
      h.raised=(cv(L[0].y)<0.34 && cv(L[9].y)<0.30);
      seenN++;
    } else if (h.on&&(t-h.t)>LOST_S){
      h.on=false; h.L=null; h.fresh=false; h.raised=false;
    }
  }
}
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0, selfieMode:false,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO — struck bar (modal). Four inharmonic partials at the free-free
//  bar ratios, a felt-mallet noise transient, panned by position.
// ═══════════════════════════════════════════════════════════════════════
var ac=null, master=null, comp=null, wet=null, noiseBuf=null;
var soundOn=true, scaleIx=0;
var SCALES=[[0,2,4,7,9],[0,2,5,7,9],[0,4,5,7,11]];
var BASE=130.81;
var RAT=[1,2.756,5.404,8.933], RGN=[1,0.42,0.18,0.075], RDC=[1,0.56,0.33,0.2];
var VMAX=26, vUntil=new Float32Array(VMAX), vGain=new Float32Array(VMAX);
var tokens=18, TOKMAX=18, notesWin=0, notesShown=0, notesT=0;

function freqOf(i){
  var sc=SCALES[scaleIx]||SCALES[0];
  var d=deg[i]|0;
  var oc=Math.floor(d/5), st=sc[d%5];
  var f=BASE*Math.pow(2,(oc*12+st)/12)*det[i];
  return fin(f)?clamp(f,40,7000):440;
}
function makeNoise(){
  if (!ac) return null;
  var n=Math.floor(ac.sampleRate*0.35);
  if (!fin(n)||n<64) n=8192;
  var b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for (var i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function makeIR(){
  if (!ac) return null;
  var len=Math.floor(ac.sampleRate*1.9);
  if (!fin(len)||len<64) len=44100;
  var b=ac.createBuffer(2,len,ac.sampleRate);
  for (var c=0;c<2;c++){
    var d=b.getChannelData(c);
    for (var i=0;i<len;i++){
      var e=Math.pow(1-i/len,2.6);
      d[i]=(Math.random()*2-1)*e*0.55;
    }
  }
  return b;
}
function initAudio(){
  if (ac) return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return;
  try{ ac=new AC(); }catch(e){ ac=null; return; }
  master=ac.createGain(); master.gain.value=0.9;
  comp=ac.createDynamicsCompressor();
  try{
    comp.threshold.value=-20; comp.knee.value=26;
    comp.ratio.value=7; comp.attack.value=0.004; comp.release.value=0.22;
  }catch(e){}
  comp.connect(master); master.connect(ac.destination);
  noiseBuf=makeNoise();
  try{
    var cv2=ac.createConvolver(); var ir=makeIR();
    if (ir){ cv2.buffer=ir; wet=ac.createGain(); wet.gain.value=0.34; wet.connect(cv2); cv2.connect(comp); }
  }catch(e){ wet=null; }
  for (var i=0;i<VMAX;i++){ vUntil[i]=0; vGain[i]=0; }
}
function setSound(on){
  soundOn=!!on;
  sndBtn.textContent=soundOn?'音 ON':'音 OFF';
  if (soundOn) sndBtn.classList.add('on'); else sndBtn.classList.remove('on');
  if (master&&ac){
    try{ master.gain.setTargetAtTime(soundOn?0.9:0.0001,ac.currentTime,0.05); }catch(e){}
  }
}
function claimVoice(t,amp){
  var i,free=-1,worst=-1,wg=1e9;
  for (i=0;i<VMAX;i++){
    if (vUntil[i]<=t){ free=i; break; }
    if (vGain[i]<wg){ wg=vGain[i]; worst=i; }
  }
  if (free>=0) return free;
  if (worst>=0&&wg<amp*0.75) return worst;
  return -1;
}
function strike(i,amp,when){
  if (!ac||!soundOn||!comp) return;
  if (!fin(amp)||amp<=0) return;
  amp=clamp(amp,0,1);
  if (tokens<1) return;
  var t=(fin(when)&&when>ac.currentTime)?when:ac.currentTime+0.01;
  var slot=claimVoice(t,amp);
  if (slot<0) return;
  tokens-=1; notesWin++;
  var f=freqOf(i);
  var dec=clamp(2.6*Math.pow(220/f,0.45),0.42,2.9);
  vUntil[slot]=t+dec+0.05; vGain[slot]=amp;

  var vg=ac.createGain(); vg.gain.value=0.0001;
  var pan=null;
  if (ac.createStereoPanner){
    try{
      pan=ac.createStereoPanner();
      var pv=clamp((px[i]/Math.max(1,W))*2-1,-1,1);
      pan.pan.value=fin(pv)?pv*0.75:0;
      vg.connect(pan); pan.connect(comp);
      if (wet) pan.connect(wet);
    }catch(e){ pan=null; }
  }
  if (!pan){ vg.connect(comp); if (wet) vg.connect(wet); }

  var np=(f<620)?4:((f<1600)?3:2);
  var k,tot=0;
  for (k=0;k<np;k++) tot+=RGN[k];
  if (tot<=0) tot=1;
  var lvl=clamp(amp*0.30,0.0002,0.42);
  try{ vg.gain.setValueAtTime(lvl/tot,t); }catch(e){}
  for (k=0;k<np;k++){
    var pf=f*RAT[k];
    if (!fin(pf)||pf<=0||pf>18000) continue;
    var o=ac.createOscillator(); o.type='sine';
    try{ o.frequency.setValueAtTime(pf,t); }catch(e){}
    var pg=ac.createGain();
    var d=dec*RDC[k];
    try{
      pg.gain.setValueAtTime(0.0001,t);
      pg.gain.exponentialRampToValueAtTime(Math.max(0.0002,RGN[k]),t+0.004);
      pg.gain.exponentialRampToValueAtTime(0.0001,t+d);
    }catch(e){}
    o.connect(pg); pg.connect(vg);
    try{ o.start(t); o.stop(t+d+0.03); }catch(e){}
  }
  if (noiseBuf){
    try{
      var ns=ac.createBufferSource(); ns.buffer=noiseBuf;
      var nf=ac.createBiquadFilter(); nf.type='bandpass';
      nf.frequency.setValueAtTime(clamp(f*2.6,120,12000),t);
      nf.Q.setValueAtTime(1.1,t);
      var ng=ac.createGain();
      ng.gain.setValueAtTime(0.0001,t);
      ng.gain.exponentialRampToValueAtTime(Math.max(0.0002,0.26*amp),t+0.002);
      ng.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
      ns.connect(nf); nf.connect(ng); ng.connect(vg);
      ns.start(t); ns.stop(t+0.08);
    }catch(e){}
  }
  try{ vg.gain.setValueAtTime(lvl/tot,t+0.0001); }catch(e){}
}
function boom(){
  if (!ac||!soundOn||!comp) return;
  var t=ac.currentTime+0.01;
  try{
    var o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(96,t);
    o.frequency.exponentialRampToValueAtTime(34,t+1.3);
    var gg=ac.createGain();
    gg.gain.setValueAtTime(0.0001,t);
    gg.gain.exponentialRampToValueAtTime(0.32,t+0.03);
    gg.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
    o.connect(gg); gg.connect(comp);
    o.start(t); o.stop(t+1.55);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  PARTICLES — sparks thrown off a struck string
// ═══════════════════════════════════════════════════════════════════════
var PMAX=1400, pN=0;
var qx=new Float32Array(PMAX), qy=new Float32Array(PMAX);
var qvx=new Float32Array(PMAX), qvy=new Float32Array(PMAX);
var ql=new Float32Array(PMAX), qm=new Float32Array(PMAX), qk=new Uint8Array(PMAX);
function spark(x,y,v,kind){
  if (!fin(x)||!fin(y)) return;
  var n=Math.min(9,1+Math.round(v*9));
  for (var i=0;i<n;i++){
    var s=(pN<PMAX)?pN++:Math.floor(Math.random()*PMAX);
    var a=Math.random()*TAU, sp=(0.4+Math.random()*1.5)*v*SHORT*0.055;
    qx[s]=x; qy[s]=y;
    qvx[s]=Math.cos(a)*sp; qvy[s]=Math.sin(a)*sp-SHORT*0.012*v;
    ql[s]=0.5+Math.random()*0.7; qm[s]=ql[s]; qk[s]=kind|0;
  }
}
function stepParticles(dt){
  var w=0;
  for (var i=0;i<pN;i++){
    ql[i]-=dt;
    if (ql[i]<=0) continue;
    qvy[i]+=SHORT*0.42*dt;
    qvx[i]*=Math.pow(0.22,dt); qvy[i]*=Math.pow(0.5,dt);
    qx[i]+=qvx[i]*dt; qy[i]+=qvy[i]*dt;
    if (w!==i){
      qx[w]=qx[i]; qy[w]=qy[i]; qvx[w]=qvx[i]; qvy[w]=qvy[i];
      ql[w]=ql[i]; qm[w]=qm[i]; qk[w]=qk[i];
    }
    w++;
  }
  pN=w;
}

// ═══════════════════════════════════════════════════════════════════════
//  SIMULATION
// ═══════════════════════════════════════════════════════════════════════
var COUP=1.0, DAMP=0.020, breezeT=0, flash=0, ringT=-9;
function readControls(){
  var hv=parseFloat(hitEl&&hitEl.value);
  COUP=fin(hv)?(0.35+(hv/100)*1.95):1.0;
  var dv=parseFloat(dampEl&&dampEl.value);
  var half=fin(dv)?(3.5+(dv/100)*44):20;      // seconds to half amplitude
  DAMP=Math.log(2)/Math.max(0.5,half);
}
function segNear(ax,ay,bx,by,cx0,cy0){
  var dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  var t=(L2>1e-6)?clamp(((cx0-ax)*dx+(cy0-ay)*dy)/L2,0,1):0;
  var qxp=ax+dx*t, qyp=ay+dy*t;
  var ex=cx0-qxp, ey=cy0-qyp;
  return ex*ex+ey*ey;
}
function handSweep(dt){
  if (dt<=0) return;
  var R=clamp(SHORT*0.035,10,52), R2=R*R;
  for (var k=0;k<2;k++){
    var h=HAND[k];
    if (!handLive(k)||h.fresh) continue;
    for (var p=0;p<6;p++){
      var ax=h.ox[p], ay=h.oy[p], bx=h.cx[p], by=h.cy[p];
      if (!fin(ax)||!fin(ay)||!fin(bx)||!fin(by)) continue;
      var vx=(bx-ax)/dt;
      if (!fin(vx)) continue;
      var vn=clamp(vx/SHORT,-4,4);
      if (Math.abs(vn)<0.12) continue;
      for (var i=0;i<N;i++){
        var bxp=px[i]+Math.sin(th[i])*plen[i];
        var byp=beamY+Math.cos(th[i])*plen[i];
        if (Math.abs(bxp-bx)>R*3.2&&Math.abs(bxp-ax)>R*3.2) continue;
        if (segNear(ax,ay,bx,by,bxp,byp)>R2) continue;
        var add=vn*COUP*SHORT*0.42/Math.max(1,plen[i]);
        if (!fin(add)) continue;
        tv[i]+=clamp(add,-6,6)*dt*6;
        var amp=Math.sqrt(th[i]*th[i]+(tv[i]/omg[i])*(tv[i]/omg[i]));
        if (amp>thMax){
          var s=thMax/amp; th[i]*=s; tv[i]*=s;
        }
      }
    }
  }
}
function doAlign(){
  for (var i=0;i<N;i++){ th[i]=thMax; tv[i]=0; prevTh[i]=thMax; }
  alignClock=0;
  flash=1; ringT=now(); aligned=now(); alignCool=now();
  boom();
}
function checkAlign(t,dt){
  var both=handLive(0)&&handLive(1)&&HAND[0].raised&&HAND[1].raised;
  if (both&&(t-alignCool)>14){
    raiseT+=dt;
    if (raiseT>0.55){ raiseT=0; doAlign(); }
  } else {
    raiseT=Math.max(0,raiseT-dt*2);
  }
}
function stepPendulums(dt){
  var i, dmp=Math.exp(-DAMP*dt);
  var t=now();
  var swing=0;
  for (i=0;i<N;i++){
    prevTh[i]=th[i];
    var w=omg[i], c=Math.cos(w*dt), s=Math.sin(w*dt);
    var a=th[i], b=tv[i]/w;
    var na=a*c+b*s;
    var nb=-a*s+b*c;
    th[i]=na*dmp; tv[i]=nb*w*dmp;
    if (!fin(th[i])||!fin(tv[i])){ th[i]=0; tv[i]=0; }
    var amp=Math.sqrt(th[i]*th[i]+(tv[i]/w)*(tv[i]/w));
    if (amp>0.012) swing++;
    // the bob plucks the string every time it passes the bottom — both ways
    if ((prevTh[i]<0)!==(th[i]<0)){
      var den=(th[i]-prevTh[i]);
      var frac=(Math.abs(den)>1e-9)?clamp(-prevTh[i]/den,0,1):0;
      var v=clamp(amp/Math.max(1e-6,thMax),0,1);
      if (v>0.035){
        lit[i]=1; litV[i]=v; wobT[i]=t-(1-frac)*dt;
        if (ac&&soundOn) strike(i,v*v*0.78+v*0.22,ac.currentTime+0.012+frac*dt);
        if (v>0.2) spark(px[i],pyv[i],v,0);
      }
    }
    lit[i]*=Math.pow(0.02,dt);
  }
  return swing;
}
// The breeze never injects an arbitrary impulse, because that would break
// the one thing this machine promises: the whole row's phase pattern is
// periodic with T0. It either SCALES a pendulum (phase-preserving) or, for
// one that has died away entirely, re-seeds it at the phase it would have
// had if it were released with the others. So the hall keeps breathing and
// the pattern still comes back. Only your hand is allowed to break phase.
function breeze(dt){
  breezeT-=dt;
  if (breezeT>0) return;
  breezeT=0.7+Math.random()*1.3;
  var c=Math.floor(Math.random()*N), wdt=3+Math.floor(Math.random()*7);
  var floorA=thMax*0.030, cap=thMax*0.11;
  for (var j=-wdt;j<=wdt;j++){
    var i=c+j;
    if (i<0||i>=N) continue;
    var f=1-Math.abs(j)/(wdt+1);
    var w=omg[i];
    var b=tv[i]/w;
    var a=Math.sqrt(th[i]*th[i]+b*b);
    var target=Math.min(cap,a+floorA*f*(0.4+Math.random()*0.8));
    if (!fin(target)||target<=0) continue;
    if (a>1e-7){
      var sc=target/a;
      th[i]*=sc; tv[i]*=sc;
    } else {
      var ph=w*alignClock;
      th[i]=target*Math.cos(ph); tv[i]=-target*w*Math.sin(ph);
    }
    if (!fin(th[i])||!fin(tv[i])){ th[i]=0; tv[i]=0; }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════
var fadeTick=0;
function drawHand(k){
  var h=HAND[k];
  if (!handLive(k)||!h.L) return;
  var L=h.L, i, a, b;
  g.lineWidth=Math.max(1,SHORT*0.0022);
  g.strokeStyle='rgba(127,217,238,.5)';
  g.beginPath();
  for (i=0;i<HC.length;i++){
    a=HC[i][0]; b=HC[i][1];
    if (!lmOK(L,a)||!lmOK(L,b)) continue;
    g.moveTo(sx(L[a].x),sy(L[a].y));
    g.lineTo(sx(L[b].x),sy(L[b].y));
  }
  g.stroke();
  for (i=0;i<6;i++){
    var x=h.cx[i], y=h.cy[i];
    if (!fin(x)||!fin(y)) continue;
    var r=(i===5)?SHORT*0.011:SHORT*0.0068;
    g.fillStyle=h.raised?'rgba(255,85,55,.85)':'rgba(232,178,90,.8)';
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    if (gctx){
      gctx.fillStyle=h.raised?'rgba(255,85,55,.55)':'rgba(232,178,90,.5)';
      gctx.beginPath(); gctx.arc(x/GS,y/GS,r*2.2/GS,0,TAU); gctx.fill();
    }
  }
}

function render(dt){
  var t=now();
  // background
  g.fillStyle='#07080d'; g.fillRect(0,0,W,H);
  var pool=g.createRadialGradient(W*0.5,beamY,0,W*0.5,beamY,Math.max(W,H)*0.78);
  pool.addColorStop(0,'rgba(30,42,64,.55)');
  pool.addColorStop(1,'rgba(7,8,13,0)');
  g.fillStyle=pool; g.fillRect(0,0,W,H);

  // trace fade (every 12th frame so 8-bit alpha actually decrements)
  fadeTick++;
  if (tctx&&(fadeTick%12===0)){
    tctx.globalCompositeOperation='destination-out';
    tctx.fillStyle='rgba(0,0,0,.021)';
    tctx.fillRect(0,0,W,H);
    tctx.globalCompositeOperation='source-over';
  }

  // architecture
  g.strokeStyle='rgba(21,29,44,1)'; g.lineWidth=Math.max(2,SHORT*0.007);
  g.beginPath(); g.moveTo(0,beamY); g.lineTo(W,beamY); g.stroke();
  g.strokeStyle='rgba(127,217,238,.14)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,beamY+0.5); g.lineTo(W,beamY+0.5); g.stroke();

  if (gctx){ gctx.clearRect(0,0,glow.width,glow.height); }

  // trace layer under everything moving
  if (trace){
    g.globalCompositeOperation='lighter';
    g.globalAlpha=0.9;
    g.drawImage(trace,0,0,W,H);
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
  }

  var i;
  // suspension wires + bobs
  g.lineWidth=Math.max(0.6,SHORT*0.0011);
  g.strokeStyle='rgba(120,138,168,.30)';
  g.beginPath();
  for (i=0;i<N;i++){
    var bx=px[i]+Math.sin(th[i])*plen[i];
    var by=beamY+Math.cos(th[i])*plen[i];
    if (!fin(bx)||!fin(by)) continue;
    g.moveTo(px[i],beamY); g.lineTo(bx,by);
  }
  g.stroke();

  // the strings (pitch lives here)
  var sh=Math.max(4,SHORT*0.024);
  for (i=0;i<N;i++){
    var y0=pyv[i]-sh*0.5, y1=pyv[i]+sh*0.5;
    var l=lit[i];
    if (!fin(l)) l=0;
    if (l<0.02){
      g.strokeStyle='rgba(127,217,238,.17)'; g.lineWidth=Math.max(0.7,SHORT*0.0012);
      g.beginPath(); g.moveTo(px[i],y0); g.lineTo(px[i],y1); g.stroke();
    } else {
      var age=t-wobT[i];
      var wob=Math.sin(age*70)*l*sh*0.22;
      g.strokeStyle='rgba(190,242,255,'+clamp(0.25+l*0.75,0,1).toFixed(3)+')';
      g.lineWidth=Math.max(1,SHORT*0.0012*(1+l*2.4));
      g.beginPath();
      g.moveTo(px[i],y0);
      g.quadraticCurveTo(px[i]+wob,pyv[i],px[i],y1);
      g.stroke();
      if (gctx){
        gctx.fillStyle='rgba(127,217,238,'+clamp(l*0.55,0,1).toFixed(3)+')';
        gctx.beginPath();
        gctx.arc(px[i]/GS,pyv[i]/GS,(sh*0.9*(0.4+l))/GS,0,TAU);
        gctx.fill();
      }
      if (tctx&&l>0.5){
        tctx.fillStyle='rgba(232,178,90,'+clamp(litV[i]*0.10,0,1).toFixed(3)+')';
        tctx.beginPath(); tctx.arc(px[i],pyv[i],sh*0.38,0,TAU); tctx.fill();
      }
    }
  }

  // bobs
  for (i=0;i<N;i++){
    var bx2=px[i]+Math.sin(th[i])*plen[i];
    var by2=beamY+Math.cos(th[i])*plen[i];
    if (!fin(bx2)||!fin(by2)) continue;
    g.fillStyle='#e8b25a';
    g.beginPath(); g.arc(bx2,by2,bobR,0,TAU); g.fill();
    g.fillStyle='rgba(255,236,200,.8)';
    g.beginPath(); g.arc(bx2-bobR*0.3,by2-bobR*0.34,bobR*0.42,0,TAU); g.fill();
    if (tctx){
      tctx.fillStyle='rgba(232,178,90,.018)';
      tctx.beginPath(); tctx.arc(bx2,by2,bobR*0.9,0,TAU); tctx.fill();
    }
  }

  // particles live only in the glow layer
  if (gctx){
    for (i=0;i<pN;i++){
      var a2=clamp(ql[i]/Math.max(0.001,qm[i]),0,1);
      var gx=qx[i]/GS, gy=qy[i]/GS;
      if (!fin(gx)||!fin(gy)) continue;
      gctx.fillStyle='rgba(190,242,255,'+(a2*0.7).toFixed(3)+')';
      gctx.fillRect(gx-0.7,gy-0.7,1.6,1.6);
    }
  }

  drawHand(0); drawHand(1);

  // bloom
  if (glow){
    g.globalCompositeOperation='lighter';
    g.globalAlpha=0.85; g.drawImage(glow,0,0,W,H);
    g.globalAlpha=0.5; g.drawImage(glow,-W*0.012,-H*0.012,W*1.024,H*1.024);
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
  }

  // 揃い charge ring
  if (raiseT>0.02){
    var cr=clamp(raiseT/0.55,0,1);
    g.strokeStyle='rgba(255,85,55,'+(0.25+cr*0.55).toFixed(3)+')';
    g.lineWidth=Math.max(1.5,SHORT*0.004);
    g.beginPath(); g.arc(W*0.5,H*0.5,SHORT*0.30*(1.25-cr*0.45),0,TAU*cr); g.stroke();
  }
  // 一撃
  if (flash>0.002){
    g.fillStyle='rgba(255,183,120,'+(flash*0.5).toFixed(3)+')';
    g.fillRect(0,0,W,H);
  }
  var rt=t-ringT;
  if (rt>=0&&rt<1.5){
    g.strokeStyle='rgba(255,85,55,'+clamp(1-rt/1.5,0,1).toFixed(3)+')';
    g.lineWidth=Math.max(2,SHORT*0.008*(1-rt/1.5));
    g.beginPath(); g.arc(W*0.5,beamY,rt*SHORT*1.3,0,TAU); g.stroke();
  }
  if (t-aligned<2.4&&aligned>0){
    var af=clamp(1-(t-aligned)/2.4,0,1);
    g.fillStyle='rgba(255,85,55,'+af.toFixed(3)+')';
    g.font='600 '+Math.round(SHORT*0.05)+'px "Zen Kaku Gothic New", sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('揃',W*0.5,H*0.5);
    g.textBaseline='alphabetic';
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var hudT=0;
function frame(){
  var t=now();
  var dt=clamp(t-last,0.0005,0.05);
  last=t;
  updateCover();
  readControls();
  tokens=Math.min(TOKMAX,tokens+dt*58);
  if (started){
    checkAlign(t,dt);
    handSweep(dt);
    breeze(dt);
  }
  var swing=stepPendulums(dt);
  stepParticles(dt);
  alignClock=(alignClock+dt)%T0;
  flash*=Math.pow(0.02,dt);
  render(dt);

  hudT+=dt; notesT+=dt;
  if (notesT>=0.5){ notesShown=Math.round(notesWin/notesT); notesWin=0; notesT=0; }
  if (hudT>0.16){
    hudT=0;
    rN.textContent=String(swing);
    rV.textContent=String(notesShown);
    var left=T0-alignClock;
    rC.textContent=(fin(left)?left.toFixed(0):'—')+'s';
    if (left<6) rC.classList.add('hot'); else rC.classList.remove('hot');
  }
  raf(frame);
}

sndBtn.addEventListener('click',function(){ setSound(!soundOn); });
for (var si=0;si<3;si++){
  (function(k){
    if (!scBtns[k]) return;
    scBtns[k].addEventListener('click',function(){
      scaleIx=k;
      for (var j=0;j<3;j++){
        if (!scBtns[j]) continue;
        if (j===k) scBtns[j].classList.add('on'); else scBtns[j].classList.remove('on');
      }
    });
  })(si);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM — a hand sweeping a small row, then 揃い
// ═══════════════════════════════════════════════════════════════════════
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var demoRun=true, demoT0=now();
var DN=26, dth=new Float32Array(DN), dtv=new Float32Array(DN), dom=new Float32Array(DN), dlen=new Float32Array(DN);
(function(){
  for (var i=0;i<DN;i++){
    var p=1.0/(1+i/(DN*1.1));
    dom[i]=TAU/p; dlen[i]=120*p*p/1.0;
    dth[i]=0; dtv[i]=0;
  }
})();
function demoFrame(){
  if (!demoCtx||!demoRun) return;
  var DW=demoCv.width, DH=demoCv.height;
  var t=now()-demoT0, cyc=t%9.4;
  var dt=1/60;
  demoCtx.fillStyle='#07080d'; demoCtx.fillRect(0,0,DW,DH);
  var by=52, ox=(DW-(DN-1)*20)/2;
  demoCtx.strokeStyle='rgba(21,29,44,1)'; demoCtx.lineWidth=5;
  demoCtx.beginPath(); demoCtx.moveTo(0,by); demoCtx.lineTo(DW,by); demoCtx.stroke();

  var hx=-999, hy=by+90;
  if (cyc<3.6){ hx=ox-40+(cyc/3.6)*((DN-1)*20+80); }
  var i;
  if (cyc>=7.0&&cyc<7.1){ for (i=0;i<DN;i++){ dth[i]=0.30; dtv[i]=0; } }
  for (i=0;i<DN;i++){
    var bx=ox+i*20+Math.sin(dth[i])*dlen[i];
    var byy=by+Math.cos(dth[i])*dlen[i];
    if (hx>-500&&Math.abs(bx-hx)<26&&Math.abs(byy-hy)<34) dtv[i]+=2.4*dt*dom[i];
    var w=dom[i], c=Math.cos(w*dt), s=Math.sin(w*dt);
    var a=dth[i], b=dtv[i]/w;
    dth[i]=(a*c+b*s)*0.9975; dtv[i]=(-a*s+b*c)*w*0.9975;
    if (dth[i]>0.32){ dth[i]=0.32; }
    if (dth[i]<-0.32){ dth[i]=-0.32; }
  }
  demoCtx.strokeStyle='rgba(120,138,168,.34)'; demoCtx.lineWidth=1;
  demoCtx.beginPath();
  for (i=0;i<DN;i++){
    var bx2=ox+i*20+Math.sin(dth[i])*dlen[i];
    var by2=by+Math.cos(dth[i])*dlen[i];
    demoCtx.moveTo(ox+i*20,by); demoCtx.lineTo(bx2,by2);
  }
  demoCtx.stroke();
  for (i=0;i<DN;i++){
    var sy0=by+dlen[i];
    var amp=Math.abs(dth[i]);
    demoCtx.strokeStyle='rgba(127,217,238,'+(0.16+amp*2.2).toFixed(3)+')';
    demoCtx.lineWidth=1+amp*5;
    demoCtx.beginPath(); demoCtx.moveTo(ox+i*20,sy0-7); demoCtx.lineTo(ox+i*20,sy0+7); demoCtx.stroke();
    var bx3=ox+i*20+Math.sin(dth[i])*dlen[i];
    var by3=by+Math.cos(dth[i])*dlen[i];
    demoCtx.fillStyle=(cyc>=7.0&&cyc<8.6)?'#ff5537':'#e8b25a';
    demoCtx.beginPath(); demoCtx.arc(bx3,by3,3.2,0,TAU); demoCtx.fill();
  }
  if (hx>-500){
    demoCtx.strokeStyle='rgba(232,178,90,.9)'; demoCtx.lineWidth=2;
    demoCtx.beginPath(); demoCtx.arc(hx,hy,13,0,TAU); demoCtx.stroke();
    demoCtx.beginPath();
    for (i=0;i<4;i++){
      demoCtx.moveTo(hx-9+i*6,hy-11); demoCtx.lineTo(hx-9+i*6,hy-24);
    }
    demoCtx.stroke();
  }
  var label=cyc<3.6?'手で薙ぐと、通ったところが鳴りだす'
           :(cyc<7.0?'周期が違うので、模様がほどけていく'
           :'両手を上へ ── 揃い');
  demoCtx.fillStyle=(cyc<7.0)?'rgba(215,227,234,.8)':'rgba(255,85,55,.95)';
  demoCtx.font='15px "Zen Kaku Gothic New", sans-serif';
  demoCtx.textAlign='center';
  demoCtx.fillText(label,DW/2,24);
  raf(demoFrame);
}
if (demoCtx) demoFrame();

startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  initHands();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
updateCover();
readControls();
setSound(true);
last=now();
frame();
</script>
