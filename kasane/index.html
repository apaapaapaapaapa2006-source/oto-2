<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人が、何十枚もの板を重ねた等高線の彫刻になる。上の板ほど今のあなた、下の板ほど少し前のあなたで、動くと板がずれて体の軌跡が重なる。AUTO にすると動くほど色と枚数と切り口の太さが自動で変わる。">
<meta name="theme-color" content="#080706">
<title>KASANE ─ 重ねの体</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  KASANE 重ね ─ 重ねの体                                ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       切り絵を何十枚も重ねたシャドーボックス、あるいは地図の等高線
             模型。映った人が、下の広い一枚から上の小さな一枚まで、同じ形
             を少しずつ削った板の積み重ねになって浮かぶ。板と板のあいだに
             影が落ちるので、正面から見ても奥行きが読める。
  TIME       上の板ほど「いまのあなた」、下の板ほど「少し前のあなた」。
             じっとしていれば板はきれいに揃い、動くと過去の板が遅れて
             ずれ、体の軌跡が階段のように重なる。動くほど板の間隔も開く。
  PALETTE    固定しない。AUTO が四つの型から毎回つくる。
             墨  黒い地に墨から白への重ね　　紙  明るい地の紙の重ね
             双  二つの色相のあいだの重ね　　光  黒地に透ける蛍光の板
             背景・下の板・上の板・切り口・動いたところ の五色まで。
  TYPE       Cormorant 300/600（題字）と Zen Kaku Gothic New。
  MOTION     カメラは 22 秒周期で首を振る。ドラッグで回せる。大きく動くと
             積み直し（板が崩れて下から順に重なり直す）。
  SIGNATURE  板の切り口の細い線と、その下に落ちる影 ── 何枚重なっているか
             数えられること。
  TECH       WebGL2。高さ場（人物マスクのぼかし＋体の中の明るさ）を毎フレーム
             テクスチャ配列の輪に積み、N 枚の板を一回のインスタンス描画で奥から
             手前へ重ねる。板 k は輪から (N−1−k)×ずれ だけ前の時刻の一枚を読み、高さが
             しきい値 t_k を超えるところだけを塗る。切り口は fwidth で画素幅の
             距離にして引き、影は一枚上の板を光の方向にずらして読む。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

  font-family:"Zen Kaku Gothic New",ui-sans-serif,sans-serif;font-weight:400;transition:background .6s,color .6s}

<body>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ KASANE</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="auto" class="btn on">AUTO</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="kinds">
    <button data-k="0">墨</button>
    <button data-k="1">紙</button>
    <button data-k="2">双</button>
    <button data-k="3">光</button>
  </div>
  <label><span>切り口</span><input type="range" id="sThick" min="0" max="1" step="0.01" value="0.4"></label>
  <label><span>枚数</span><input type="range" id="sRows" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>高さ</span><input type="range" id="sDepth" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>ずれ</span><input type="range" id="sWob" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>首振り</span><input type="range" id="sOrbit" min="0" max="1" step="0.01" value="0.55"></label>
  <div class="note">AUTO：動くほど色・枚数・切り口・高さ・ずれが自動で変わる。大きく動くと積み直される。<br>色や数値に触ると AUTO は止まる。<br>ドラッグで回す／タップで見た目をひとつ引き直す。</div>
</div>

<div id="start">
  <div class="t">STACKED BODY</div>
  <h1>KASANE</h1>
  <div class="stack"><i></i><i></i><i></i><i></i><i></i></div>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、あなたが何十枚も重ねた板の彫刻になります。<br>上の板ほど今のあなた、下の板ほど少し前のあなた。<br>動くと板がずれて、AUTO のあいだは色と枚数が変わっていきます。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   KASANE — every camera frame the height field (blurred person mask + the
   light inside it) goes into a ring of 64 texture layers. N plates are drawn
   back to front in one instanced call; plate k keeps only where the height
   passes its own threshold, and reads the ring (N-1-k)*lag back in time, so
   the top plate is you now and the plates below are you a moment ago.
   Cut edges are drawn as a pixel-width distance, and each plate darkens
   where the plate above, shifted toward the light, covers it.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

/* ---------- looks ---------- */
function hsl(h, s, l){
  h = ((h % 360) + 360) % 360 / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
const KINDS = ['墨', '紙', '双', '光'];
function makeLook(kind){
  if (kind == null) kind = Math.random() * 4 | 0;
  let h, L;
  // lo = the bottom plate, hi = the top plate, rim = the cut edge, acc = where you move
  if (kind === 0){ h = 20 + Math.random() * 30; L = { bg:hsl(h, .2, .035), lo:hsl(h, .1, .09), hi:hsl(h, .12, .84), rim:hsl(h, .3, .94), acc:hsl(4 + Math.random() * 22, .85, .55), fill:1 }; }
  else if (kind === 1){ h = Math.random() * 360; L = { bg:hsl(h, .2, .82), lo:hsl(h, .28, .7), hi:hsl(h + 20, .4, .985), rim:hsl(h, .3, .42), acc:hsl(h + 180, .75, .5), fill:1 }; }
  else if (kind === 2){ h = Math.random() * 360; L = { bg:hsl(h, .45, .04), lo:hsl(h, .85, .2), hi:hsl(h + 70, .85, .72), rim:hsl(h + 70, .7, .92), acc:hsl(h + 200, 1, .62), fill:1 }; }
  else { h = Math.random() * 360; L = { bg:[0, 0, 0], lo:hsl(h, 1, .5), hi:hsl(h + 90, 1, .62), rim:hsl(h + 45, 1, .72), acc:hsl(h + 200, 1, .62), fill:.17 }; }
  Object.assign(L, { kind, hue:h | 0, thick:Math.random(), rows:.05 + Math.random() * .9,
                     depth:.25 + Math.random() * .75, wob:.15 + Math.random() * .85, seed:Math.random() * 100, light:kind === 1 ? 1 : 0 });
  return L;
}
const LOOK = makeLook(0), TGT = Object.assign({}, LOOK);
LOOK.thick = TGT.thick = .4; LOOK.rows = TGT.rows = .5; LOOK.depth = TGT.depth = .5; LOOK.wob = TGT.wob = .5;
const S = { auto:true, orbit:.55 };
const AUTO = { acc:0, lastJump:0, lastSoft:0, rate:1.2, Eslow:0, Eprev:0, changes:0, jumps:0 };
let recut = 1;
function lerp3(a, b, k){ for (let i = 0; i < 3; i++) a[i] += (b[i] - a[i]) * k; }
function setTarget(L, fast){
  Object.assign(TGT, L);
  AUTO.rate = fast ? 5.5 : 1.1;
  AUTO.changes++;
  if (fast){ AUTO.jumps++; recut = 0; }     // the plates fall away and are stacked again from the bottom
  syncUI();
}
function easeLook(dt){
  const k = 1 - Math.exp(-dt * AUTO.rate);
  for (const n of ['bg','lo','hi','rim','acc']) lerp3(LOOK[n], TGT[n], k);
  for (const n of ['thick','depth','wob','light','fill']) LOOK[n] += (TGT[n] - LOOK[n]) * k;
  LOOK.rows = TGT.rows; LOOK.kind = TGT.kind; LOOK.hue = TGT.hue;
}
function driveAuto(dt, now){
  if (!S.auto || !MODE.on || MODE.reveal < 1) return;
  const E = F.E, jump = E - AUTO.Eprev; AUTO.Eprev = AUTO.Eprev * .8 + E * .2;
  // 'sudden' is judged against your own recent level, near the camera or far from it
  const base = AUTO.Eslow; AUTO.Eslow += (E - AUTO.Eslow) * Math.min(1, dt * .6);
  if (E > .12 && E > base * 2.8 + .05 && jump > .07 && now - AUTO.lastJump > 1400){ AUTO.lastJump = now; AUTO.acc = 0; setTarget(makeLook(), true); riffle(true); return; }
  // square root: small movements still add up; big ones do not run away
  AUTO.acc += Math.sqrt(Math.min(E, .3)) * dt * 2.2;
  if (AUTO.acc > 1){ AUTO.acc = 0; AUTO.lastSoft = now; setTarget(makeLook(), false); riffle(false); return; }
  if (now - AUTO.lastSoft > 14000 && now - AUTO.lastJump > 14000){ AUTO.lastSoft = now; setTarget(makeLook(), false); }
}
const layers = () => Math.round(6 + LOOK.rows * 18);
// the time between one plate and the next, in 30 fps frames (so 1.5 = 50 ms)
const lagOf = N => Math.min(.4 + 2.2 * LOOK.wob, 60 / Math.max(1, N - 1));

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS_PL = `#version 300 es
precision highp float;
in vec2 aP;                        // a corner of the unit square
uniform vec4 uBox[24];             // where this plate can be at all, in uv (x0, y0, x1, y1)
uniform vec2 uSpan;
uniform float uYaw, uPitch, uN, uStack, uReveal, uRecut;
out vec2 vUV; flat out float vK; out float vGrow;
void main(){
  float k = float(gl_InstanceID);
  vec4 bx = uBox[gl_InstanceID];
  vec2 uv = mix(bx.xy, bx.zw, aP);
  // stacked from the bottom plate up, when it switches on and again after a big move
  float pr = k / uN * .85;
  float grow = smoothstep(pr, pr + .15, min(uReveal, uRecut));
  vec3 p = vec3((uv - .5) * uSpan, k / max(1., uN - 1.) * uStack * grow);
  float cy = cos(uYaw), sy = sin(uYaw), cp = cos(uPitch), sp = sin(uPitch);
  vec3 q = vec3(cy * p.x + sy * p.z, p.y, -sy * p.x + cy * p.z);
  q = vec3(q.x, cp * q.y - sp * q.z, sp * q.y + cp * q.z);
  float D = 2.2, zc = D - q.z;
  gl_Position = vec4(q.xy * D * 2. / uSpan * .9, 0., zc);
  vUV = uv; vK = k; vGrow = grow;
}`;
const FS_PL = `#version 300 es
precision highp float;
precision highp sampler2DArray;
in vec2 vUV; flat in float vK; in float vGrow;
uniform sampler2DArray uRing;
uniform float uSlice[24];          // which ring layer each plate reads (chosen on the CPU by time)
uniform float uN, uHasMask, uRimPx, uFill, uShadow;
uniform vec3 uLo, uHi, uRim, uAcc;
uniform vec2 uShOff;
out vec4 o;
// the top plate is you now; each plate below is you a moment earlier
float slice(float k){ return uSlice[int(k + .5)]; }
vec4 at(vec2 uv, float s){ return texture(uRing, vec3(uv.x, 1. - uv.y, s)); }
float hn(vec4 f){ return f.g; }        // folded on the CPU: distance inside you + a little of the light
float thr(float k){ return .03 + .9 * k / uN; }
void main(){
  vec4 f = at(vUV, slice(vK));
  // signed distance to the plate's cut edge, in pixels (inside > 0)
  float a = hn(f) - thr(vK);
  float d = a / max(fwidth(a), 1e-4);
  if (uHasMask > .5){ float b = f.r - .5; d = min(d, b / max(fwidth(b), 1e-4)); }
  float cover = clamp(d + .5, 0., 1.) * vGrow;
  if (cover <= 0.) discard;
  float t = vK / max(1., uN - 1.);
  vec3 c = mix(uLo, uHi, t);
  // each sheet a touch different, so the stack reads as separate sheets
  c *= .93 + .14 * fract(sin(vK * 12.9898 + 4.1) * 43758.5453);
  // the plate above throws its shadow down onto this one
  if (vK < uN - 1.){
    float k1 = vK + 1.;
    vec4 g = at(vUV + uShOff, slice(k1));
    float up = smoothstep(-.015, .03, hn(g) - thr(k1));
    if (uHasMask > .5) up *= smoothstep(.4, .6, g.r);
    c *= 1. - up * uShadow;
  }
  c = mix(c, uAcc, clamp(f.b * 1.3, 0., 1.) * .75);
  float rim = uRimPx > .05 ? 1. - smoothstep(uRimPx, uRimPx + 1., d) : 0.;
  float alpha = mix(uFill, 1., rim);
  c = mix(c, uRim, rim * .9);
  o = vec4(c * alpha * cover, alpha * cover);      // premultiplied
}`;
const VS_Q = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS_BG = `#version 300 es
precision mediump float;
uniform vec3 uBg; uniform vec2 uRes; uniform float uT, uLight; out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
void main(){
  vec2 q = gl_FragCoord.xy / uRes - .5; q.x *= uRes.x / uRes.y;
  float v = 1. - smoothstep(.3, 1.15, length(q));
  vec3 c = uBg * (mix(.55, .92, uLight) + v * mix(.45, .08, uLight));
  c += (h21(floor(gl_FragCoord.xy / 1.5) + fract(uT * 7.13) * 91.7) - .5) * .022;
  o = vec4(c, 1.);
}`;
const FS_CAM = `#version 300 es
precision mediump float;
uniform sampler2D uVid; uniform vec2 uRes, uScale; uniform float uMirror, uA; out vec4 o;
void main(){
  vec2 s = gl_FragCoord.xy / uRes; s.y = 1. - s.y;
  vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x;
  o = vec4(texture(uVid, v).rgb * uA, 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs, attrs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }

$('auto').onclick = () => { setAuto(!S.auto); if (S.auto){ AUTO.acc = 0; setTarget(makeLook(), true); riffle(true); } };
$('kinds').onclick = e => { const b = e.target.closest('button'); if (!b) return; setAuto(false);
  const L = makeLook(+b.dataset.k); for (const n of ['thick','rows','depth','wob','seed']) L[n] = TGT[n]; setTarget(L, false); riffle(false); };
const SL = [['sThick','thick'],['sRows','rows'],['sDepth','depth'],['sWob','wob']];
SL.forEach(([id, k]) => { $(id).oninput = e => { setAuto(false); TGT[k] = +e.target.value; AUTO.rate = 6; }; });
$('sOrbit').oninput = e => { S.orbit = +e.target.value; };
function syncUI(){
  SL.forEach(([id, k]) => { $(id).value = TGT[k]; });
  [...$('kinds').children].forEach(x => x.classList.toggle('on', +x.dataset.k === TGT.kind));
}
function cssColor(c, a){ return 'rgba(' + (c[0]*255|0) + ',' + (c[1]*255|0) + ',' + (c[2]*255|0) + (a == null ? ',1)' : ',' + a + ')'); }
function paintUI(){
  const r = document.documentElement.style, light = LOOK.light > .5;
  const fg = light ? [.08, .08, .1] : [.93, .93, .95];
  r.setProperty('--bg', cssColor(LOOK.bg)); r.setProperty('--fg', cssColor(fg));
  r.setProperty('--dim', cssColor(fg, .55)); r.setProperty('--line', cssColor(fg, .22)); r.setProperty('--acc', cssColor(LOOK.acc));
}

let drag = null, yawUser = 0, pitchUser = 0;
canvas.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, y0:yawUser, p0:pitchUser, moved:false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
  const s = Math.min(innerWidth, innerHeight);
  yawUser = Math.max(-1.2, Math.min(1.2, drag.y0 + dx / s * 2.4)); pitchUser = Math.max(-.7, Math.min(.7, drag.p0 + dy / s * 1.3));
});
const endDrag = () => {
  if (drag && !drag.moved && MODE.on && MODE.reveal >= 1){
    const L = makeLook(S.auto ? null : TGT.kind);
    if (!S.auto) for (const n of ['thick','rows','depth','wob']) L[n] = TGT[n];
    setTarget(L, true); riffle(true);
  }
  drag = null;
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', () => { drag = null; });

$('shoot').onclick = () => {
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'kasane-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'kasane.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};
/* ---------- render ---------- */
let lastT = 0, hudT = 0, uiT = 0, yaw = 0, pitch = 0, lastN = 0, Es = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  const t = now / 1000;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; F.have = false; F.idxKey = ''; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1800 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  ensureField(W, H);
  if (!M.external) segment(now);
  if (M.live && now - M.lastT > 1500) M.live = false;
  if (video.readyState < 2) return;

  const vt = video.currentTime, fresh = vt !== lastVT; lastVT = vt;
  const grabbed = fresh && grab();
  updateField(dt, grabbed);
  if (fresh) pushRing();
  if (fresh){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }

  MODE.X = MODE.on ? Math.min(1.6, MODE.X + dt) : Math.max(0, MODE.X - dt * 2.6);
  MODE.camA = 1 - Math.min(1, MODE.X / .28);
  MODE.reveal = Math.max(0, Math.min(1, (MODE.X - .3) / 1.2));
  driveAuto(dt, now);
  easeLook(dt);
  const N = layers(), lag = lagOf(N);
  // a new plate count re-stacks the upper half, instead of plates popping in and out
  if (N !== lastN){ if (lastN) recut = Math.min(recut, .45); lastN = N; }
  recut = Math.min(1, recut + dt * 1.6);
  // moving opens the stack up like a bellows; it closes again slowly
  Es += (Math.min(F.E, .4) - Es) * (1 - Math.exp(-dt * (F.E > Es ? 6 : 1.2)));
  const span = [W / H, 1];
  if (!drag){ yawUser *= Math.exp(-dt / 3); pitchUser *= Math.exp(-dt / 3); }
  const amp = .75 * S.orbit;
  yaw += (Math.max(-1.05, Math.min(1.05, Math.sin(t * .285) * amp + yawUser)) - yaw) * (1 - Math.exp(-dt * 4));
  pitch += ((Math.sin(t * .21) * .14 * S.orbit - .08 * S.orbit + pitchUser) - pitch) * (1 - Math.exp(-dt * 4));

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  if (MODE.reveal <= 0){
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    if (MODE.camA > 0){
      const sa0 = W/H, va0 = vidW/vidH;
      gl.useProgram(PC.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid); gl.uniform1i(PC.U.uVid, 0);
      gl.uniform2f(PC.U.uRes, W, H); gl.uniform2f(PC.U.uScale, sa0 < va0 ? sa0/va0 : 1, sa0 < va0 ? 1 : va0/sa0);
      gl.uniform1f(PC.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PC.U.uA, MODE.camA * MODE.camA);
      gl.bindVertexArray(vaoQ); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    return;
  }
  gl.useProgram(PB.p);
  gl.uniform3fv(PB.U.uBg, LOOK.bg); gl.uniform2f(PB.U.uRes, W, H); gl.uniform1f(PB.U.uT, t); gl.uniform1f(PB.U.uLight, LOOK.light);
  gl.bindVertexArray(vaoQ); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (texRing && RING.filled && plateBoxes(N, lag)){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PL.p);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texRing); gl.uniform1i(PL.U.uRing, 1);
    gl.uniform4fv(PL.U['uBox[0]'], BOXES);
    gl.uniform2f(PL.U.uSpan, span[0], span[1]);
    gl.uniform1f(PL.U.uYaw, yaw); gl.uniform1f(PL.U.uPitch, pitch);
    gl.uniform1f(PL.U.uN, N);
    gl.uniform1f(PL.U.uStack, (.12 + .5 * LOOK.depth) * (1 + 1.6 * Es) * Math.min(1, MODE.reveal * 1.4));
    gl.uniform1f(PL.U.uReveal, MODE.reveal); gl.uniform1f(PL.U.uRecut, recut);
    gl.uniform1fv(PL.U['uSlice[0]'], SLICES);
    gl.uniform1f(PL.U.uHasMask, M.has && M.live ? 1 : 0);
    gl.uniform1f(PL.U.uRimPx, LOOK.thick < .12 ? 0 : (.5 + 3 * LOOK.thick) * Math.min(W, H) / 900);
    gl.uniform1f(PL.U.uFill, LOOK.fill); gl.uniform1f(PL.U.uShadow, .38 * LOOK.fill + .08);
    // the light comes from the upper left, so each shadow falls down and to the right
    const so = .006 + .012 * LOOK.depth;
    gl.uniform2f(PL.U.uShOff, -so / span[0], so);
    gl.uniform3fv(PL.U.uLo, LOOK.lo); gl.uniform3fv(PL.U.uHi, LOOK.hi); gl.uniform3fv(PL.U.uRim, LOOK.rim); gl.uniform3fv(PL.U.uAcc, LOOK.acc);
    gl.bindVertexArray(vaoU); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);
    gl.disable(gl.BLEND);
  }

  if (++uiT > 6){ uiT = 0; paintUI(); }
  if (++hudT > 10){
    hudT = 0;
    $('hud').innerHTML = 'KASANE  ' + (S.auto ? '<b>AUTO</b>' : 'MANUAL') + '  ' + KINDS[LOOK.kind] + ' ' + String(LOOK.hue).padStart(3, '0') + '°' +
      '\nLAYERS ' + String(N).padStart(2, '0') + '   LAG ' + Math.round(lag / 30 * 1000) + 'MS   RIM ' + (LOOK.thick < .12 ? 'NONE' : (.5 + 3 * LOOK.thick).toFixed(1) + 'PX') +
      '\nYAW ' + (yaw * 57.3 >= 0 ? '+' : '−') + Math.abs(yaw * 57.3).toFixed(0).padStart(2, '0') + '°';
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__KASANE = {
  state: () => ({ on:MODE.on, reveal:MODE.reveal, auto:S.auto, kind:LOOK.kind, hue:LOOK.hue, layers:layers(), lag:+lagOf(layers()).toFixed(2),
                  thick:+LOOK.thick.toFixed(3), E:+F.E.toFixed(4), Es:+Es.toFixed(3), changes:AUTO.changes, jumps:AUTO.jumps, mask:M.live,
                  filled:RING.filled, fw:F.w, fh:F.h }),
  mode(m){ setMode(!!m); },
  auto(on){ setAuto(!!on); },
  feedMask(data, w, h){ M.external = true; return ingestMask(data, w, h); },
  look: () => JSON.parse(JSON.stringify(LOOK)),
};
</script>
</body>
</html>
