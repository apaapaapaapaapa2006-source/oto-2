<meta charset="utf-8">
<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="暗い部屋で、プロジェクターの光だけがあなたを照らす。顔には白い面・骸骨・墨の涙・網・隈取りがぴたりと映り、体には光の縞が曲面に沿って走る。速く動くと光が追いつかず、顔の絵が壁へこぼれる。首を横に振ると面が替わる。">
<meta name="theme-color" content="#000000">
<title>TOUEI ─ 顔に光を映す</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  TOUEI 投影 ─ 顔に光を映す                                  ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  REFERENCE  浅井宣通（WOW）のリアルタイム・フェイス・プロジェクションマッピング
             「INORI ─ 祈り ─」（2017、ダンサー AyaBambi、東京大学 石川・渡辺研の
             高速プロジェクター）と、その前作「OMOTE」（2014）。
             真っ暗な部屋で光は投影だけ。踊る二人の顔に白い面・骸骨・黒い涙・
             赤い線が貼りついたまま動き、顔以外は闇に沈む。
             （作品の映像・音・名前は借りない。「投影だけが光」という型を借りる）
             もうひとつ、3D スキャナの構造化光 ── グレイコードの縞が体の曲面で
             曲がって見える、あの較正の数秒間。
  MOOD       美術館の暗室で行われるパフォーマンスの記録写真。黒・白・紅。
             顔だけが白く、体には細い光の縞、壁にはあなたの影。
  PALETTE    闇 #000000 ／ 投影の白 #fff6eb（6500K のプロジェクター）／
             紅 #f20f1a（面の差し色はこれ一色だけ）／ 部屋の残り灯 冷たい灰 5%
  TYPE       Gloock（題字）・Geist Mono 300/500（計器・ラベル）・Shippori Antique（和文）。
             UI は小さく白く、画面は闇に譲る。
  MOTION     止まっているあいだ投影は顔と体にぴたりと合い、絵はゆっくり動くだけ
             （面の等高線が広がる、網を走査の帯が下りる、涙が少しずつ伸びる）。
             動いた瞬間にだけ、光が追いつかずに壁へこぼれる。
  SIGNATURE  首を振ると、振った側から次の面が顔に描き込まれていく。
  LAYERS     ① 主役：顔のメッシュ（MediaPipe の正準顔モデルの UV）に貼った面の投影。
                面は 5 種 ── 面（白い能面と眉、等高線）・骨（眼窩・鼻腔・歯・頬のくぼみ、
                口を開けると顎がひらく）・涙（目の下から墨の筋が伸びる）・網（顔の
                三角形の網と走査の帯）・隈（歌舞伎の筋隈の紅）。目には光を入れない
             ② 体：映った人の形にだけ構造化光の縞（格子・輪郭だけ・無しも）。体の
                ふくらみで縞が曲がり、動くほど縞が速く流れる
             ③ 遅れ：投影は実機のように少し遅れて追う。速く動くと顔の絵と体の縞が
                元いた場所に取り残され、あなたを外れた光は奥の壁に、ずれた位置で写る
             ④ 壁：プロジェクターは少し上から照らすので、あなたの影が壁に落ちる。
                壁にはかすかな縞が届き、影の形に欠ける
             ⑤ 素のカメラ ⇄ 投影：部屋の明かりが落ち、グレイコードの縞が十枚
                点滅して体と壁を較正し、顔に網が掛かってから面が描き込まれる。
                戻すときは白く一閃して蛍光灯がまたたいて点く
             ⑥ 二人で映ると、それぞれ別の面が掛かる
             ⑦ 音：プロジェクターのファンの低いうなり、較正のリレーの音、面が替わる
                ときの低い打音。動くほど追従のモーター音が上がる（録画に入る）
  TECH       WebGL2。FaceLandmarker（2 人）の 468 点を正準顔メッシュの 898 三角形
             （Apache-2.0、canonical_face_model.obj の三角形と UV）で張り、口の中を
             埋める三角形を足す。面は 1024² の UV 画像（R＝白い光・G＝紅・B＝描き込み
             の順番・A＝動く層の範囲）を起動時に Canvas2D で描き、動く部分はシェーダで。
             投影は時刻つきのリングバッファから「今より遅れた」点とマスクを補間して
             描く。最終合成は「反射率（カメラ）× 投影の光」で、人の画素は体の
             ふくらみ（ぼかしたマスク）で縞を曲げ、壁の画素は視差ぶんずらした
             投影を、今の人物マスクでさえぎって受ける。最後にブルームと粒子。
  ══════════════════════════════════════════════════════════════════════════
-->

<body>

  <button id="rec" class="btn">● 録画</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>

</div>

  </div>
  <label><span>光の遅れ</span><input type="range" id="sLag" min="0" max="0.6" step="0.01" value="0.14"></label>

function detect(now){

    try{

/* ---------- sound: the projector's fan, calibration relays, the program's low knock, the tracking motor ---------- */
let actx = null, master = null, recDest = null, noiseBuf = null, amb = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try{
    actx = new AC(); master = actx.createGain(); master.gain.value = S.vol;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    recDest = actx.createMediaStreamDestination(); comp.connect(recDest);
    const len = actx.sampleRate * 2 | 0; noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); let b = 0;
    for (let i = 0; i < len; i++){ b = b * .97 + (Math.random() * 2 - 1) * .03; d[i] = b * 6 + (Math.random() * 2 - 1) * .15; }
    actx.resume().catch(() => {});
  }catch(e){ actx = null; }
}
const live = () => actx && actx.state === 'running';
function ambInit(){
  if (amb || !actx) return;
  const t = actx.currentTime, out = actx.createGain(); out.gain.value = 0; out.connect(master);
  const fan = actx.createBufferSource(); fan.buffer = noiseBuf; fan.loop = true;
  const ff = actx.createBiquadFilter(); ff.type = 'bandpass'; ff.frequency.value = 280; ff.Q.value = .8;
  const fg = actx.createGain(); fg.gain.value = .5; fan.connect(ff); ff.connect(fg); fg.connect(out); fan.start(t);
  const hum = actx.createOscillator(); hum.type = 'sine'; hum.frequency.value = 100;
  const hg = actx.createGain(); hg.gain.value = .05; hum.connect(hg); hg.connect(out); hum.start(t);
  const hum2 = actx.createOscillator(); hum2.type = 'triangle'; hum2.frequency.value = 50.3;
  const hg2 = actx.createGain(); hg2.gain.value = .07; hum2.connect(hg2); hg2.connect(out); hum2.start(t);
  // the tracking motor: rises with how far the light has fallen behind you
  const mot = actx.createOscillator(); mot.type = 'sawtooth'; mot.frequency.value = 220;
  const mf = actx.createBiquadFilter(); mf.type = 'bandpass'; mf.frequency.value = 900; mf.Q.value = 6;
  const mg = actx.createGain(); mg.gain.value = 0; mot.connect(mf); mf.connect(mg); mg.connect(master); mot.start(t);
  amb = { out, mot, mf, mg };
}
function ambTick(on, strain){
  if (!live()) return; ambInit(); if (!amb) return;
  const t = actx.currentTime;
  amb.out.gain.setTargetAtTime(on ? .55 : 0, t, on ? .5 : .15);
  const s = on ? clamp(strain, 0, 1) : 0;
  amb.mg.gain.setTargetAtTime(s * .05, t, .06);
  amb.mot.frequency.setTargetAtTime(160 + s * 420, t, .08); amb.mf.frequency.setTargetAtTime(700 + s * 1800, t, .08);
}
function noise(t, dur, type, f0, f1, q, peak, pan){
  const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; s.loop = true; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl); fl.connect(g);

}

  const o = actx.createOscillator(), g = actx.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g);

function sfxSwitch(){ if (!live()) return; const t = actx.currentTime; tone(t, 'sine', 95, 42, .25, .3); noise(t, .06, 'highpass', 2500, 1200, .7, .25, 0); }
function sfxRelay(i){ if (!live()) return; const t = actx.currentTime; noise(t, .022, 'bandpass', 3200 + i * 300, 2600, 6, .14, 0); tone(t, 'square', 1200 + i * 90, 1150 + i * 90, .03, .02); }

  tone(t, 'sine', 72, 44, .9, .32, pan); noise(t, .12, 'lowpass', 900, 160, .7, .12, pan);
  tone(t + .05, 'sine', 1568, 1560, .7, .03, -pan); tone(t + .11, 'sine', 2349, 2340, .5, .015, -pan);

/* ---------- mode: plain camera ⇄ projection (lights out, Gray-code calibration, the mesh locks on) ---------- */
const MODE = { fx:false, t:9, g0:.5, gd:.13, gn:10, lockT:1.8 };
function setMode(on){
  if (on === MODE.fx) return;
  MODE.fx = on; MODE.t = 0;
  $('mode').textContent = on ? '明かりをつける' : '投影する';
  $('prog').style.visibility = on ? 'visible' : 'hidden';
  if (on) sfxSwitch(); else sfxShut();
}
function lockOn(f){ f.prog = slotProg(f); f.progP = -1; f.rev = 0; f.fadeP = 0; f.wipe = 0; f.age = 0; }
function setProg(k, dir = 0, src = null){
  S.prog = ((k % NP) + NP) % NP;

    f.progP = f.prog; f.prog = p; f.rev = 0; f.fadeP = f.progP >= 0 ? 1 : 0; f.wipe = dir; f.age = 0;
  }

// the timeline of the switch, as numbers the renderer reads
function timeline(){
  const t = MODE.t;
  const T = { amb:1, proj:0, body:0, gray:0, gi:0 };
  if (MODE.fx){
    T.amb = lerp(1, S.amb, smooth(t / .35));
    T.proj = smooth((t - .3) / .15);
    const k = (t - MODE.g0) / MODE.gd;
    if (k >= 0 && k < MODE.gn){ T.gi = Math.floor(k); T.gray = (k - T.gi) < .82 ? 1 : 0; }
    T.body = smooth((t - MODE.lockT) / .5);

    const fl = t < .3 ? 0 : t < .36 ? .9 : t < .47 ? .1 : smooth((t - .47) / .4);
    T.amb = lerp(S.amb, 1, fl);

  return T;
}

$('progs').onclick = e => { const b = e.target.closest('button'); if (b) setProg(+b.dataset.p, 0); };
$('bodys').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.body = +b.dataset.b; [...$('bodys').children].forEach(x => x.classList.toggle('on', x === b)); };
$('tTurn').onclick = e => { S.turn = !S.turn; e.target.classList.toggle('on', S.turn); };
[['sLag', 'lag'], ['sGain', 'gain'], ['sAmb', 'amb'], ['sSat', 'sat'], ['sWall', 'wall'], ['sWash', 'wash'], ['sVol', 'vol']]
  .forEach(([id, k]) => { $(id).oninput = e => { S[k] = +e.target.value; if (k === 'vol' && master) master.gain.value = S.vol; }; });
$('mode').onclick = () => setMode(!MODE.fx);
$('prog').onclick = () => setProg(S.prog + 1, 0);
$('gear').onclick = () => $('panel').classList.toggle('hide');
addEventListener('keydown', e => {
  if (!started || document.activeElement.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); setMode(!MODE.fx); }
  else if (e.key === 'ArrowRight' || e.key === 'n') setProg(S.prog + 1, 1);
  else if (e.key === 'ArrowLeft') setProg(S.prog - 1, -1);
});
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try { await startCam(); } catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear', 'flip', 'bar', 'rec', 'shoot', 'prog', 'mode', 'brand'].forEach(id => $(id).classList.add('show'));
  if (!MODE.fx) $('prog').style.visibility = 'hidden';
  if (!started){ started = true; if (!glOK) initGL(); if (glErr) setStatus(glErr); initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
let down = null;
view.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
view.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 12 && performance.now() - down.t < 600){
    if (!$('panel').classList.contains('hide')) $('panel').classList.add('hide');
    else if (MODE.fx) setProg(S.prog + 1, e.clientX < innerWidth / 2 ? -1 : 1);
  }
  down = null;
});
let wantShot = false;
$('shoot').onclick = () => { wantShot = true; };
function doShot(){
  try{
    view.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'touei-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
}
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...view.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● 録画';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'touei.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ 停止';
  }catch(e){ setStatus('録画を開始できませんでした。' + (e && e.message ? '\n' + e.message : '')); }
};
addEventListener('resize', () => { if (started) resize(); });
// in the dark the controls step back after a few seconds, so the frame is just the projection
let idleAt = performance.now();
const wake = () => { idleAt = performance.now(); document.body.classList.remove('idle'); };
['pointermove', 'pointerdown', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive:true }));

/* ---------- frame ---------- */
let lastT = 0, frameN = 0, clock = 0, strain = 0, phase = 0, wasLocked = false;
const TEARU = new Float32Array(12), TEARL = new Float32Array(6);
for (let i = 0; i < 6; i++){ TEARU[i * 2] = UV[TEAR_SRC[i] * 2] + (i % 3 - 1) * .006; TEARU[i * 2 + 1] = UV[TEAR_SRC[i] * 2 + 1] + .02; }
const TEAR_SPD = [.034, .05, .026, .044, .03, .056], TEAR_DLY = [0, 1.6, 3.2, .8, 2.5, 4.1];
const PROBE = { want:null, out:null };
function tex(loc, unit, t){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(loc, unit); }
function uploadMasks(){
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  if (MK.dirty){
    gl.bindTexture(gl.TEXTURE_2D, texMask); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, MK.w, MK.h, 0, gl.RED, gl.UNSIGNED_BYTE, MK.u8);
    gl.bindTexture(gl.TEXTURE_2D, texBulge); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, MK.w, MK.h, 0, gl.RED, gl.UNSIGNED_BYTE, MK.bul);
    MK.dirty = false;
  }
  if (MK.has){ gl.bindTexture(gl.TEXTURE_2D, texMaskL); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, MK.w, MK.h, 0, gl.RED, gl.UNSIGNED_BYTE, MK.lag); }
}
function drawFaces(T){
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.face.f); gl.viewport(0, 0, G.W, G.H);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  const locked = MODE.fx && MODE.t >= MODE.lockT;
  if (locked){
    const pr = PR.face; gl.useProgram(pr.p); gl.bindVertexArray(vaoFace);
    gl.uniform2f(pr.u.uRes, G.W, G.H); gl.uniform1f(pr.u.uTime, clock);
    gl.uniform2fv(pr.u.uTear, TEARU);
    for (const f of FS){
      if (!f.on || f.prog < 0) continue;
      for (let i = 0; i < NL; i++) toScreen(f.lagN[i * 2], f.lagN[i * 2 + 1], POS, i * 2);
      gl.bindBuffer(gl.ARRAY_BUFFER, bufPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, POS);
      tex(pr.u.uT, 0, texProg[f.prog]); tex(pr.u.uTp, 1, texProg[Math.max(0, f.progP)]);
      gl.uniform1f(pr.u.uProg, f.prog); gl.uniform1f(pr.u.uProgP, Math.max(0, f.progP));
      gl.uniform1f(pr.u.uRev, f.rev); gl.uniform1f(pr.u.uFadeP, f.progP >= 0 ? f.fadeP : 0); gl.uniform1f(pr.u.uWipe, f.wipe);
      gl.uniform1f(pr.u.uAge, f.age); gl.uniform1f(pr.u.uOn, 1);
      for (let i = 0; i < 6; i++) TEARL[i] = clamp((f.age - TEAR_DLY[i]) * TEAR_SPD[i], 0, .93 - TEARU[i * 2 + 1] - (i % 3) * .05);
      gl.uniform1fv(pr.u.uTearL, TEARL);
      gl.drawElements(gl.TRIANGLES, IDX.length, gl.UNSIGNED_SHORT, 0);
    }
    gl.bindVertexArray(null);
  }
  // current geometry (where the face really is now): UV and coverage
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.geo.f); gl.viewport(0, 0, G.W, G.H);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (T.proj > 0){
    const pr = PR.geo; gl.useProgram(pr.p); gl.bindVertexArray(vaoGeo); gl.uniform2f(pr.u.uRes, G.W, G.H);
    for (const f of FS){
      if (!f.on) continue;
      for (let i = 0; i < NL; i++){ toScreen(f.sm[i * 3], f.sm[i * 3 + 1], GEOV, i * 4); GEOV[i * 4 + 2] = UV[i * 2]; GEOV[i * 4 + 3] = UV[i * 2 + 1]; }
      gl.bindBuffer(gl.ARRAY_BUFFER, bufGeo); gl.bufferSubData(gl.ARRAY_BUFFER, 0, GEOV);
      gl.drawElements(gl.TRIANGLES, IDX.length, gl.UNSIGNED_SHORT, 0);
    }
    gl.bindVertexArray(null);
  }
}
function render(T){
  sizeFB();
  if (video.readyState >= 2){ gl.bindTexture(gl.TEXTURE_2D, texCam); try{ gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); }catch(e){} }
  uploadMasks();
  drawFaces(T);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.scene.f); gl.viewport(0, 0, G.W, G.H);
  let pr = PR.scene; gl.useProgram(pr.p);
  tex(pr.u.uCam, 0, texCam); tex(pr.u.uMask, 1, texMask); tex(pr.u.uMaskL, 2, texMaskL); tex(pr.u.uBulge, 3, texBulge);
  tex(pr.u.uFace, 4, FB.face.t); tex(pr.u.uGeo, 5, FB.geo.t);
  gl.uniform2f(pr.u.uRes, G.W, G.H); gl.uniform4f(pr.u.uMap, MAP.ox, MAP.oy, MAP.dw, MAP.dh); gl.uniform1f(pr.u.uMirror, mirror ? 1 : 0);
  gl.uniform2f(pr.u.uD, G.short * .028 * S.wall, G.short * .05 * S.wall);
  gl.uniform1f(pr.u.uAmb, T.amb); gl.uniform1f(pr.u.uProj, T.proj); gl.uniform1f(pr.u.uBodyOn, T.body); gl.uniform1f(pr.u.uGain, S.gain);
  gl.uniform1f(pr.u.uSat, S.sat); gl.uniform1f(pr.u.uShort, G.short); gl.uniform1f(pr.u.uPhase, phase); gl.uniform1f(pr.u.uBody, S.body);
  gl.uniform1f(pr.u.uWash, S.wash); gl.uniform1f(pr.u.uK, .075); gl.uniform1f(pr.u.uGrayIdx, T.gi); gl.uniform1f(pr.u.uGrayAmt, T.gray * T.proj);
  gl.uniform1f(pr.u.uHasMask, MK.has ? 1 : 0); gl.uniform1f(pr.u.uMaskPx, MK.w ? MAP.dw / MK.w : 4);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (PROBE.want){
    const px = new Uint8Array(4); PROBE.out = PROBE.want.map(([x, y]) => {
      gl.readPixels(Math.round(x), Math.round(G.H - 1 - y), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return [px[0], px[1], px[2]]; });
    PROBE.want = null;
  }
  const glow = T.proj > .01;
  if (glow){
    const chain = [FB.scene, FB.b1, FB.b2, FB.b3, FB.b4, FB.b5];
    pr = PR.down; gl.useProgram(pr.p);
    for (let i = 1; i < chain.length; i++){
      const s = chain[i - 1], d = chain[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER, d.f); gl.viewport(0, 0, d.w, d.h);
      tex(pr.u.uSrc, 0, s.t); gl.uniform2f(pr.u.uTx, 1 / s.w, 1 / s.h); gl.uniform2f(pr.u.uOut, d.w, d.h); gl.uniform1f(pr.u.uTh, i === 1 ? .5 : 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    pr = PR.up; gl.useProgram(pr.p);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = chain.length - 1; i > 1; i--){
      const s = chain[i], d = chain[i - 1];
      gl.bindFramebuffer(gl.FRAMEBUFFER, d.f); gl.viewport(0, 0, d.w, d.h);
      tex(pr.u.uSrc, 0, s.t); gl.uniform2f(pr.u.uTx, 1 / s.w, 1 / s.h); gl.uniform2f(pr.u.uOut, d.w, d.h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.BLEND);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, G.W, G.H);
  pr = PR.fin; gl.useProgram(pr.p);
  tex(pr.u.uScene, 0, FB.scene.t); tex(pr.u.uBloom, 1, FB.b1.t);
  gl.uniform2f(pr.u.uRes, G.W, G.H); gl.uniform1f(pr.u.uGlow, glow ? .55 * T.proj : 0); gl.uniform1f(pr.u.uTime, clock);
  gl.uniform1f(pr.u.uGrain, .05 * (1 - T.amb) * T.proj); gl.uniform1f(pr.u.uVig, T.proj * (1 - T.amb));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function step(now, rdt){
  for (const f of FS) if (f.on && now - f.seen > 450) lose(f);
  if (MK.has && now - MK.t > 1500){ MK.has = false; MK.rn = 0; }
  MODE.t += rdt;
  const locked = MODE.fx && MODE.t >= MODE.lockT;
  if (locked && !wasLocked) for (const f of FS) if (f.on) lockOn(f);
  wasLocked = locked;
  const tq = now - S.lag * 1000;
  let disp = 0;
  for (const f of FS){
    if (!f.on) continue;
    lagFace(f, tq);
    // how far the projected face trails the real one, in short-edge units
    const dx = (f.lagN[2] - f.sm[3]) * MAP.dw, dy = (f.lagN[3] - f.sm[4]) * MAP.dh;
    f.disp = Math.hypot(dx, dy) / G.short; disp = Math.max(disp, f.disp);
    f.rev = Math.min(1.4, f.rev + rdt / 1.5); f.age += rdt;
    if (f.rev >= 1.2){ f.fadeP = 0; f.progP = -1; }
  }
  const en = MK.has ? lagMask(tq) : 0;
  MK.en = lerp(MK.en, en, 1 - Math.exp(-rdt * 8));
  strain = lerp(strain, clamp(disp * 7 + MK.en * 2.2, 0, 1), 1 - Math.exp(-rdt * 10));
  phase += rdt * (.25 + strain * 3.2);
  const lagShow = locked && strain > .2;
  $('pLag').textContent = lagShow ? 'LAG ' + Math.round(S.lag * 1000) + 'ms' : '';
}
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  const rdt = lastT ? clamp((now - lastT) / 1000, 0, .25) : 0; lastT = now; clock += rdt; frameN++;
  detect(now);
  const g0 = MODE.fx ? Math.floor((MODE.t - MODE.g0) / MODE.gd) : -9;
  step(now, rdt);
  const g1 = MODE.fx ? Math.floor((MODE.t - MODE.g0) / MODE.gd) : -9;
  if (g1 !== g0 && g1 >= 0 && g1 < MODE.gn) sfxRelay(g1);
  const T = timeline();
  ambTick(MODE.fx, strain);
  if (MODE.fx && MODE.t > 3 && now - idleAt > 3500 && $('panel').classList.contains('hide') && !(rec && rec.state === 'recording')) document.body.classList.add('idle');
  if (!glOK) return;
  render(T);
  if (wantShot){ wantShot = false; doShot(); }
}

/* ---------- start ---------- */
try { buildPrograms(); drawEmblem(); } catch(e){ glErr = '面を描けませんでした：' + (e && e.message ? e.message : e); }
syncProgUI();

/* ---------- test hook ---------- */
window.__touei = {
  feedFaces(list, t){ EXT.face = true; if (modelState !== 'ready') setStatus(''); ingestFaces(list, t == null ? performance.now() : t); },
  feedMask(data, w, h, t){ EXT.mask = true; ingestMask(data, w, h, t == null ? performance.now() : t); },
  setMode, setProg, S, MODE, FS, MK, G, MAP,
  probe(pts){ PROBE.want = pts; PROBE.out = null; },
  probed(){ return PROBE.out; },
  toScreen(x, y){ const o = [0, 0]; toScreen(x, y, o, 0); return o; },
  state(){ return { frame:frameN, fx:MODE.fx, modeT:MODE.t, glOK, glErr, model:modelState, hasMask:MK.has, prog:S.prog, strain, en:MK.en,
    faces:FS.map(f => ({ on:f.on, prog:f.prog, rev:f.rev, yaw:+f.yaw.toFixed(3), disp:+f.disp.toFixed(4), turn:f.turn.st,
      finite:[f.yaw, f.disp, f.rev, f.lagN[2], f.lagN[3], f.sm[3], f.sm[4]].every(Number.isFinite) })) }; },
};

</script>
</body>
</html>
