<title>FUIGO ─ 蛇腹に風を溜める</title>
<meta name="description" content="両手のあいだに蛇腹がかかる一方向のふいご。手を広げると空気が溜まるだけで音は鳴らず、寄せて縮めているあいだだけリードが鳴る。溜めた空気は減っていくので、長いフレーズは吸うところから組み立てることになる。手の高さが音、開き具合がリードの段数。">
<meta name="theme-color" content="#eef1ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  FUIGO ─ 蛇腹に風を溜める                     ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   方眼 hougan   #eef1ee  the cool pale ground of a drawing sheet
            罫   kei      #c2d0c9  the grid printed on it, two weights
            墨   sumi     #1b2420  drafting ink — every outline in the piece
            真鍮 shinchu  #b2822f  brass: end plates, reed tongues, the note
                                   you are actually sounding
            深緑 baize    #1f4034  the cloth of the bellows itself
            臙脂 enji     #8c2f39  pressure, and only pressure
            MOOD: a workshop drawing of a bellows, drawn 1:1 on graph paper,
            with the real thing lying on top of it. Cool, measured, no glow
            anywhere. Nothing in this piece is trying to be pretty; it is
            trying to look like a machine somebody could build.
  BACKGROUND  Engineering graph paper — a 1-unit grid with every fifth line
            doubled — plus a real title block ruled in the bottom-left corner
            with the piece's name, scale and 調子. It never animates.
  TYPE      Barlow Condensed for every Latin word and every number, at the
            weight and letter-spacing of a drawing's annotation. Zen Kaku
            Gothic Antique for Japanese, which has the slightly mechanical
            kana of an instruction sheet. No display face at all — a drawing
            does not shout.
  MOTION    Two motion behaviours, deliberately unmixed. The bellows is 1:1
            with the hands and has NO easing whatsoever, because it IS the
            hands. Everything that measures the bellows — the pressure
            needle, the air column, the reed flutter — is a damped second-
            order system that lags and overshoots like real instrumentation.
            The distance between those two behaviours is the whole feel.
  SIGNATURE 一方通行のふいご。Opening the bellows makes NO sound: it only
            fills a tank. Sound happens while the bellows is held compressed,
            and it eats the tank as it goes. So a long phrase has to be
            planned backwards from the breath that will pay for it — which is
            what playing a real bellows instrument actually feels like, and
            is the opposite of every bow and breath piece in this gallery.
  AUDIO     Free reed. Each rank is two sawtooths detuned into a musette beat
            that widens as you open your hand (±6 → ±14 cents); ranks are
            16'/8'/4' and the hand opening decides how many are drawn. One
            lowpass tracks pressure so the reeds brighten as they are pushed,
            and the reeds sharpen about 8 cents at full pressure the way real
            ones do. Under it: bandpassed air noise scaled by flow, a
            highpassed intake hiss while you pump, and a lowpassed valve slap
            whenever the bellows changes direction. Chords are voice-led —
            each voice moves at most six semitones between changes. One
            compressor; nothing clips with every rank and a chord sounding.
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  FUIGO — a one-way bellows.
//  Opening is silent and fills a tank; holding it compressed spends the
//  tank through the reeds. Everything else in the piece is instrumentation
//  measuring that one quantity.
// ═══════════════════════════════════════════════════════════════════════
var view = document.getElementById('view');
var ctx  = view.getContext('2d');
var video = document.getElementById('video');
var ov = document.getElementById('ov');
var startBtn = document.getElementById('startBtn');
var flipBtn = document.getElementById('flipBtn');
var errBox = document.getElementById('errBox');
var noteLbl = document.getElementById('noteLbl');
var chordLbl = document.getElementById('chordLbl');
var demoCv = document.getElementById('demo');

var W = 0, H = 0, S = 1, DPR = 1, portrait = false;
function now(){ return performance.now(); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function lerp(a,b,t){ return a + (b-a)*t; }

var C_PAPER='#eef1ee', C_GRID='#c2d0c9', C_GRID2='#a8bbb2', C_SUMI='#1b2420',
    C_BRASS='#b2822f', C_BAIZE='#1f4034', C_ENJI='#8c2f39', C_SHEET='#f6f8f5';

var grid = null;
function buildGrid(){
  var u = Math.max(9, Math.round(13 * Math.max(S, 0.55)));
  var n = u * 5;
  var g = document.createElement('canvas');
  g.width = n; g.height = n;
  var gc = g.getContext('2d');
  if (!gc){ grid = null; return; }
  gc.fillStyle = C_PAPER; gc.fillRect(0, 0, n, n);
  gc.strokeStyle = C_GRID; gc.lineWidth = 1;
  for (var i = 1; i < 5; i++){
    gc.beginPath();
    gc.moveTo(i*u + .5, 0); gc.lineTo(i*u + .5, n);
    gc.moveTo(0, i*u + .5); gc.lineTo(n, i*u + .5);
    gc.stroke();
  }
  gc.strokeStyle = C_GRID2; gc.lineWidth = 1.4;
  gc.beginPath();
  gc.moveTo(.7, 0); gc.lineTo(.7, n);
  gc.moveTo(0, .7); gc.lineTo(n, .7);
  gc.stroke();
  grid = g;
}
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  view.width = Math.max(2, Math.round(W*DPR));
  view.height = Math.max(2, Math.round(H*DPR));
  view.style.width = W + 'px'; view.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H) / 720;
  portrait = H > W;
  buildGrid();
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════════════
//  TUNINGS — three 調子, each a scale ladder plus three voice-led chords.
//  Semitones are measured from D.
// ═══════════════════════════════════════════════════════════════════════
var NAMES = ['D','E♭','E','F','F♯','G','A♭','A','B♭','B','C','C♯'];
var TUNINGS = [
  { name:'ひなた', en:'HINATA',
    deg:[0,2,4,7,9,12,14,16],
    chords:[ {n:'D',  pcs:[0,4,7]}, {n:'G',  pcs:[5,9,0]}, {n:'A',  pcs:[7,11,2]} ] },
  { name:'くもり', en:'KUMORI',
    deg:[0,2,3,5,7,10,12,14],
    chords:[ {n:'Dm', pcs:[0,3,7]}, {n:'Gm', pcs:[5,8,0]}, {n:'C',  pcs:[10,2,5]} ] },
  { name:'みなと', en:'MINATO',
    deg:[0,2,4,5,7,9,10,12],
    chords:[ {n:'D',  pcs:[0,4,7]}, {n:'C',  pcs:[10,2,5]}, {n:'Am', pcs:[7,10,2]} ] }
];
var tune = 0;
var MEL_BASE = 62;                       // D4
var CH_BASE  = 50;                       // D3
function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }

var prevVoices = null;
function voiceChord(pcs){
  var out = [], i;
  for (i = 0; i < pcs.length; i++){
    var pc = ((pcs[i] % 12) + 12) % 12;
    var target = (prevVoices && isFinite(prevVoices[i])) ? prevVoices[i] : (CH_BASE + 4*i);
    var m = CH_BASE + pc;
    while (m < target - 6) m += 12;
    while (m > target + 6) m -= 12;
    out.push(clamp(m, 43, 64));
  }
  prevVoices = out;
  return out;
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO — free reed. Voices run continuously; only gains and frequencies
//  move, because that is how a wind instrument behaves.
// ═══════════════════════════════════════════════════════════════════════
var ac = null, comp = null, master = null, noiseBuf = null, started = false;
var reeds = [];      // 3 ranks × 2 detuned oscillators
var rankGain = [];
var melGain = null, melLP = null;
var chVoices = [], chGain = null, chLP = null;
var airGain = null, airBP = null, intakeGain = null, intakeHP = null;
var audioOK = false;

function initAudio(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (ac){ if (ac.state === 'suspended' && ac.resume) ac.resume(); return; }
  try { ac = new AC(); } catch(e){ ac = null; return; }
  comp = ac.createDynamicsCompressor();
  try {
    comp.threshold.value = -18; comp.knee.value = 26; comp.ratio.value = 6;
    comp.attack.value = 0.006; comp.release.value = 0.25;
  } catch(e){}
  master = ac.createGain(); master.gain.value = 0.8;
  comp.connect(master); master.connect(ac.destination);

  var n = Math.floor(ac.sampleRate * 1.6);
  noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  var nd = noiseBuf.getChannelData(0);
  for (var i = 0; i < n; i++) nd[i] = Math.random()*2 - 1;

  // melody chain
  melLP = ac.createBiquadFilter(); melLP.type = 'lowpass';
  melLP.frequency.value = 900; melLP.Q.value = 0.9;
  melGain = ac.createGain(); melGain.gain.value = 0;
  melLP.connect(melGain); melGain.connect(comp);
  var r, k;
  for (r = 0; r < 3; r++){
    var rg = ac.createGain(); rg.gain.value = r === 1 ? 1 : 0;
    rg.connect(melLP); rankGain.push(rg);
    var pair = [];
    for (k = 0; k < 2; k++){
      var o = ac.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = 293.66;
      o.detune.value = (k ? 6 : -6);
      o.connect(rg); o.start();
      pair.push(o);
    }
    reeds.push(pair);
  }
  // chord chain
  chLP = ac.createBiquadFilter(); chLP.type = 'lowpass';
  chLP.frequency.value = 780; chLP.Q.value = 0.7;
  chGain = ac.createGain(); chGain.gain.value = 0;
  chLP.connect(chGain); chGain.connect(comp);
  for (r = 0; r < 3; r++){
    var vg = ac.createGain(); vg.gain.value = 0.34;
    vg.connect(chLP);
    var a = ac.createOscillator(); a.type = 'sawtooth'; a.frequency.value = 146.83;
    var b = ac.createOscillator(); b.type = 'triangle'; b.frequency.value = 146.83;
    a.detune.value = -4; b.detune.value = 5;
    a.connect(vg); b.connect(vg); a.start(); b.start();
    chVoices.push({ a:a, b:b, g:vg, m:CH_BASE });
  }
  // reed air
  airBP = ac.createBiquadFilter(); airBP.type = 'bandpass';
  airBP.frequency.value = 2200; airBP.Q.value = 0.8;
  airGain = ac.createGain(); airGain.gain.value = 0;
  var an = ac.createBufferSource(); an.buffer = noiseBuf; an.loop = true;
  an.connect(airBP); airBP.connect(airGain); airGain.connect(comp); an.start();
  // intake hiss
  intakeHP = ac.createBiquadFilter(); intakeHP.type = 'highpass';
  intakeHP.frequency.value = 3400;
  intakeGain = ac.createGain(); intakeGain.gain.value = 0;
  var inn = ac.createBufferSource(); inn.buffer = noiseBuf; inn.loop = true;
  inn.connect(intakeHP); intakeHP.connect(intakeGain); intakeGain.connect(comp); inn.start();

  if (ac.state === 'suspended' && ac.resume) ac.resume();
  audioOK = true;
}
function setP(param, v, tc){
  if (!param || !isFinite(v)) return;
  try { param.setTargetAtTime(v, ac.currentTime, tc || 0.02); } catch(e){}
}
// the valve slap when the bellows reverses
function valveClick(vol){
  if (!audioOK) return;
  var t = ac.currentTime, V = clamp(vol, 0, 0.5);
  if (V < 0.01) return;
  var s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  s.playbackRate.value = 0.6 + Math.random()*0.5;
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  var g = ac.createGain();
  g.gain.setValueAtTime(V, t);
  g.gain.linearRampToValueAtTime(0, t + 0.07);
  s.connect(lp); lp.connect(g); g.connect(comp);
  s.start(t); s.stop(t + 0.1);
}
// the tongue of a reed speaking — a short brass tick on a note change
function reedTick(f, vol){
  if (!audioOK || !isFinite(f) || f <= 0) return;
  var t = ac.currentTime, V = clamp(vol, 0, 0.4);
  if (V < 0.005) return;
  var o = ac.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(f*2, t);
  var g = ac.createGain();
  g.gain.setValueAtTime(V, t);
  g.gain.linearRampToValueAtTime(0, t + 0.035);
  var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
  o.connect(hp); hp.connect(g); g.connect(comp);
  o.start(t); o.stop(t + 0.06);
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing = 'user', mirror = true, stream = null;
function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display = 'block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:960 }, height:{ ideal:720 } },
    audio:false
  }).then(function(st){
    stream = st; video.srcObject = st; mirror = (facing === 'user');
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing === 'user') ? 'environment' : 'user';
  loseAll();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  HANDS
// ═══════════════════════════════════════════════════════════════════════
var HAND_LOST_MS = 320;
function mkHand(){
  return { live:false, t:-1e9, x:.5, y:.5, span:.14, open:.5,
           pts:new Float32Array(42), has:false };
}
var hL = mkHand(), hR = mkHand();
var tmpA = mkHand(), tmpB = mkHand();
function loseAll(){
  hL.live = false; hL.t = -1e9; hL.has = false;
  hR.live = false; hR.t = -1e9; hR.has = false;
  resetBellows();
}
function validLm(c){
  if (!c || c.length < 21) return false;
  for (var i = 0; i < 21; i++){
    var p = c[i];
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' ||
        !isFinite(p.x) || !isFinite(p.y)) return false;
  }
  return true;
}
function fillHand(h, c){
  var i;
  for (i = 0; i < 21; i++){
    h.pts[i*2]   = mirror ? (1 - c[i].x) : c[i].x;
    h.pts[i*2+1] = c[i].y;
  }
  h.has = true;
  var wx = h.pts[0], wy = h.pts[1], mx = h.pts[18], my = h.pts[19];
  var palm = Math.hypot(mx - wx, my - wy);
  if (!isFinite(palm) || palm < 1e-4) return false;
  h.x = (wx + mx) * 0.5; h.y = (wy + my) * 0.5;
  var sp = Math.hypot(h.pts[10] - h.pts[34], h.pts[11] - h.pts[35]);
  h.span = (isFinite(sp) && sp > 0.01) ? sp : 0.14;
  var TIPS = [8, 12, 16, 20], sum = 0;
  for (i = 0; i < 4; i++){
    var ti = TIPS[i];
    sum += Math.hypot(h.pts[ti*2] - wx, h.pts[ti*2+1] - wy);
  }
  var ratio = (sum / 4) / palm;
  if (!isFinite(ratio)) ratio = 1.6;
  h.open = clamp((ratio - 1.15) / 0.95, 0, 1);
  h.t = now(); h.live = true;
  return true;
}
function onHands(res){
  var raw = (res && res.multiHandLandmarks) ? res.multiHandLandmarks : [];
  var good = [];
  for (var i = 0; i < raw.length && good.length < 2; i++){
    if (validLm(raw[i])) good.push(raw[i]);
  }
  if (!good.length) return;
  if (good.length === 1){
    // one hand: whichever side of the frame it is on
    var t = tmpA;
    if (!fillHand(t, good[0])) return;
    var dst = (t.x < 0.5) ? hL : hR;
    var other = (dst === hL) ? hR : hL;
    dst.pts.set(t.pts); dst.has = true;
    dst.x = t.x; dst.y = t.y; dst.span = t.span; dst.open = t.open;
    dst.t = t.t; dst.live = true;
    other.live = false;
    return;
  }
  var a = tmpA, b = tmpB;
  if (!fillHand(a, good[0]) || !fillHand(b, good[1])) return;
  var lo = (a.x <= b.x) ? a : b, hi = (a.x <= b.x) ? b : a;
  [[hL, lo], [hR, hi]].forEach(function(pair){
    var d = pair[0], s = pair[1];
    d.pts.set(s.pts); d.has = true;
    d.x = s.x; d.y = s.y; d.span = s.span; d.open = s.open;
    d.t = s.t; d.live = true;
  });
}
var hands = null, mpCamera = null, mpReady = false;
function initHands(){

  try {
    hands = new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });

}
function startMpCamera(){

// ═══════════════════════════════════════════════════════════════════════
//  THE BELLOWS
// ═══════════════════════════════════════════════════════════════════════
var D_MIN = 0.16, D_MAX = 0.62;
var ext = 0.5, extS = 0.5, extPrev = 0.5, extRate = 0;
var air = 0.55, press = 0, flow = 0, dirSign = 0;
var anchorL = { x:0.12, y:0.5 }, anchorR = { x:0.88, y:0.5 };
// one-handed play needs a fixed wall to pull against. If the wall were
// re-chosen from the hand's current side it would jump to the far side the
// moment you pushed past centre, and the bellows could never be compressed.
var wallX = 0.90, wallSet = false;
var oneHanded = false, noHands = true;
var CAP = 1.0, INTAKE = 1.35, FLOWMAX = 0.46, REST = 0.42;
var melMidi = MEL_BASE, melDeg = 0, chIdx = 0, openS = 0.35;
var motes = [];

function resetBellows(){
  extRate = 0; press = 0; flow = 0; dirSign = 0;
  extPrev = extS; wallSet = false;
}

function stepBellows(dt){
  var t = now();
  if (hL.live && t - hL.t > HAND_LOST_MS) hL.live = false;
  if (hR.live && t - hR.t > HAND_LOST_MS) hR.live = false;
  var both = hL.live && hR.live;
  oneHanded = !both && (hL.live || hR.live);
  noHands = !hL.live && !hR.live;
  if (!oneHanded) wallSet = false;

  var ax, ay, bx, by;
  if (both){
    ax = hL.x; ay = hL.y; bx = hR.x; by = hR.y;
  } else if (oneHanded){
    var h = hL.live ? hL : hR;
    if (!wallSet){ wallX = (h.x < 0.5) ? 0.90 : 0.10; wallSet = true; }
    if (wallX > 0.5){ ax = h.x; ay = h.y; bx = wallX; by = h.y; }
    else            { ax = wallX; ay = h.y; bx = h.x; by = h.y; }
  } else {
    ax = anchorL.x; ay = anchorL.y; bx = anchorR.x; by = anchorR.y;
  }
  anchorL.x = ax; anchorL.y = ay; anchorR.x = bx; anchorR.y = by;

  var d = Math.hypot(bx - ax, by - ay);
  if (!isFinite(d)) d = D_MIN;
  var target = clamp((d - D_MIN) / (D_MAX - D_MIN), 0, 1);
  if (noHands) target = extS;                        // freeze, do not snap
  ext = target;
  // the bellows is 1:1 with the hands, with only enough smoothing to kill
  // landmark jitter — no easing, because it IS the hands
  extS += (ext - extS) * clamp(dt * 22, 0, 1);
  if (!isFinite(extS)) extS = 0.5;
  var rate = (extS - extPrev) / Math.max(dt, 1e-4);
  extRate += (rate - extRate) * clamp(dt * 16, 0, 1);
  if (!isFinite(extRate)) extRate = 0;
  extPrev = extS;

  // direction change -> valve slap
  var sgn = extRate > 0.35 ? 1 : (extRate < -0.35 ? -1 : 0);
  if (sgn !== 0 && dirSign !== 0 && sgn !== dirSign){
    valveClick(clamp(Math.abs(extRate) * 0.09, 0, 0.24));
  }
  if (sgn !== 0) dirSign = sgn;

  // intake: opening fills the tank, silently
  if (extRate > 0 && !noHands){
    air = clamp(air + extRate * INTAKE * dt, 0, CAP);
  }
  // play: the bellows held compressed spends the tank
  var squeeze = clamp((1 - extS) - REST, 0, 1) / (1 - REST);
  if (noHands) squeeze = 0;
  var want = squeeze * squeeze * FLOWMAX;
  var avail = air / Math.max(dt, 1e-4);
  flow = Math.min(want, avail);
  if (!isFinite(flow) || flow < 0) flow = 0;
  var starved = (want > flow + 1e-6) && air <= 1e-6;
  air = clamp(air - flow * dt, 0, CAP);
  // plenum lag: pressure does not arrive instantly, and does not stop instantly.
  // Running the tank dry is different from letting go — the reeds choke.
  var pt = flow / FLOWMAX;
  press += (pt - press) * clamp(dt * (pt > press ? 11 : (starved ? 30 : 15)), 0, 1);
  if (!isFinite(press)) press = 0;
  if (press < 1e-4) press = 0;

  // ── pitch ────────────────────────────────────────────────────────────
  var T = TUNINGS[tune];
  var melH = hR.live ? hR : (hL.live ? hL : null);
  var chH  = hL.live ? hL : null;
  if (melH){
    var u = clamp((0.84 - melH.y) / 0.62, 0, 1);
    var raw = u * (T.deg.length - 1);
    var want2 = Math.round(raw);
    // hysteresis: only change once the hand is well past the boundary
    if (want2 !== melDeg && Math.abs(raw - melDeg) > 0.62) melDeg = want2;
    melDeg = clamp(melDeg, 0, T.deg.length - 1);
    openS += (melH.open - openS) * clamp(dt * 7, 0, 1);
  }
  var newMidi = MEL_BASE + T.deg[melDeg];
  if (newMidi !== melMidi){
    melMidi = newMidi;
    if (press > 0.06) reedTick(mtof(melMidi), 0.10 + press*0.14);
    noteLbl.textContent = NAMES[((T.deg[melDeg] % 12) + 12) % 12] +
      (T.deg[melDeg] >= 12 ? '′' : '');
  }
  if (chH){
    var cu = clamp((0.84 - chH.y) / 0.62, 0, 1);
    var ci = clamp(Math.round(cu * (T.chords.length - 1)), 0, T.chords.length - 1);
    if (ci !== chIdx){
      chIdx = ci;
      applyChord();
    }
  }

  // ── drive the sound ──────────────────────────────────────────────────
  if (audioOK){
    var sharp = press * 8;                       // reeds sharpen under pressure
    var det = 6 + openS * 8;
    var f = mtof(melMidi);
    var oct = [0.5, 1, 2], r, k;
    for (r = 0; r < 3; r++){
      for (k = 0; k < 2; k++){
        var o = reeds[r][k];
        setP(o.frequency, f * oct[r], 0.008);
        setP(o.detune, (k ? det : -det) + sharp, 0.05);
      }
      // 8' always; 16' comes in first, then 4'
      var amt = r === 1 ? 1
              : (r === 0 ? clamp((openS - 0.18) / 0.40, 0, 1)
                         : clamp((openS - 0.55) / 0.40, 0, 1));
      setP(rankGain[r].gain, amt * (r === 1 ? 0.34 : 0.24), 0.06);
    }
    setP(melLP.frequency, 420 + press * 3400, 0.03);
    setP(melGain.gain, press * 0.62, press > 0.02 ? 0.035 : 0.06);
    setP(chLP.frequency, 380 + press * 900, 0.05);
    setP(chGain.gain, press * 0.30, 0.05);
    setP(airBP.frequency, 1500 + press * 1800, 0.05);
    setP(airGain.gain, press * 0.055 + (starved ? 0.030 : 0), starved ? 0.012 : 0.04);
    setP(intakeGain.gain, clamp(extRate, 0, 3) * 0.035 * (air < CAP ? 1 : 0.3), 0.03);
  }

  // ── visible breath ───────────────────────────────────────────────────
  if (flow > 0.02 && motes.length < 140){
    var n = Math.min(4, Math.round(flow * 22));
    for (var i = 0; i < n; i++) spawnMote();
  }
  for (var j = motes.length - 1; j >= 0; j--){
    var m = motes[j];
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.vy += 26 * S * dt;
    m.life -= dt * 0.85;
    if (m.life <= 0) motes.splice(j, 1);
  }
}
function applyChord(){
  var T = TUNINGS[tune];
  var ch = T.chords[chIdx];
  var v = voiceChord(ch.pcs);
  chordLbl.textContent = ch.n;
  if (!audioOK) return;
  for (var i = 0; i < chVoices.length; i++){
    var m = v[i];
    if (!isFinite(m)) continue;
    chVoices[i].m = m;
    setP(chVoices[i].a.frequency, mtof(m), 0.03);
    setP(chVoices[i].b.frequency, mtof(m), 0.03);
  }
}
function spawnMote(){
  var p = bellowsGeom();
  if (!p) return;
  motes.push({
    x: p.mx + (Math.random()-0.5) * p.len * 0.5,
    y: p.my - p.half * (0.6 + Math.random()*0.5),
    vx: (Math.random()-0.5) * 40 * S,
    vy: -(30 + Math.random()*70) * S,
    life: 0.6 + Math.random()*0.6,
    r: (1 + Math.random()*2) * S + 0.6
  });
}

// ═══════════════════════════════════════════════════════════════════════
//  INSTRUMENTATION — everything that measures the bellows lags it
// ═══════════════════════════════════════════════════════════════════════
var needle = { x:0, v:0 }, airCol = { x:0.55, v:0 }, flutter = 0;
function stepGauges(dt){
  var a = (press - needle.x) * 210 - needle.v * 17;
  needle.v += a * dt; needle.x += needle.v * dt;
  if (!isFinite(needle.x)){ needle.x = press; needle.v = 0; }
  var a2 = (air - airCol.x) * 150 - airCol.v * 20;
  airCol.v += a2 * dt; airCol.x += airCol.v * dt;
  if (!isFinite(airCol.x)){ airCol.x = air; airCol.v = 0; }
  flutter += dt * (26 + press * 90);
  if (flutter > 1e6) flutter = 0;
}

function bellowsGeom(){
  var ax = anchorL.x * W, ay = anchorL.y * H;
  var bx = anchorR.x * W, by = anchorR.y * H;
  var dx = bx - ax, dy = by - ay;
  var len = Math.hypot(dx, dy);
  if (!isFinite(len) || len < 1) return null;
  var half = Math.max(24 * S, Math.min(W, H) * 0.11) * (0.72 + (1 - extS) * 0.5);
  return { ax:ax, ay:ay, bx:bx, by:by, dx:dx/len, dy:dy/len,
           len:len, half:half, mx:(ax+bx)/2, my:(ay+by)/2,
           ang:Math.atan2(dy, dx) };
}

function drawBackground(){
  if (grid){
    var p = ctx.createPattern(grid, 'repeat');
    if (p){ ctx.fillStyle = p; ctx.fillRect(0, 0, W, H); }
    else { ctx.fillStyle = C_PAPER; ctx.fillRect(0, 0, W, H); }
  } else {
    ctx.fillStyle = C_PAPER; ctx.fillRect(0, 0, W, H);
  }
  // title block, ruled like a drawing sheet
  var bw = Math.min(W * 0.42, 260), bh = Math.max(52, 66 * S);
  var bx = 14, by = H - bh - 14 - (portrait ? 44 : 0);
  ctx.fillStyle = C_SHEET;
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = C_SUMI; ctx.lineWidth = 1.2;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);
  ctx.beginPath();
  ctx.moveTo(bx, by + bh*0.5); ctx.lineTo(bx + bw, by + bh*0.5);
  ctx.moveTo(bx + bw*0.52, by + bh*0.5); ctx.lineTo(bx + bw*0.52, by + bh);
  ctx.stroke();
  ctx.fillStyle = C_SUMI;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '600 ' + Math.round(Math.max(13, bh*0.28)) + "px 'Barlow Condensed',sans-serif";
  ctx.fillText('FUIGO / 蛇腹', bx + 8, by + bh*0.26);
  ctx.font = Math.round(Math.max(9, bh*0.17)) + "px 'Barlow Condensed',sans-serif";
  ctx.fillStyle = C_BAIZE;
  ctx.fillText('SCALE 1:1', bx + 8, by + bh*0.74);
  ctx.fillText('調子 ' + TUNINGS[tune].en, bx + bw*0.52 + 8, by + bh*0.74);
  titleBlock = { x:bx, y:by, w:bw, h:bh };
}
var titleBlock = null;

// the bellows: real pleats, folded by the real extension
function drawBellows(){
  var p = bellowsGeom();
  if (!p) return;
  var N = 13;
  var cx = p.mx, cy = p.my;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(p.ang);
  var L = p.len, h = p.half;
  var plateW = Math.max(9, 15 * S);
  var innerL = Math.max(8, L - plateW*2);
  var step = innerL / N;
  // the pleat depth shrinks as the bellows closes — folds pack together
  var depth = h * (0.16 + extS * 0.30);

  // cloth body
  ctx.beginPath();
  ctx.moveTo(-innerL/2, -h);
  for (var i = 0; i <= N; i++){
    var x = -innerL/2 + i*step;
    ctx.lineTo(x, -h + (i % 2 ? depth : 0));
  }
  ctx.lineTo(innerL/2, h);
  for (var j = N; j >= 0; j--){
    var x2 = -innerL/2 + j*step;
    ctx.lineTo(x2, h - (j % 2 ? depth : 0));
  }
  ctx.closePath();
  ctx.fillStyle = C_BAIZE; ctx.fill();
  ctx.lineWidth = Math.max(1.2, 2.2*S); ctx.strokeStyle = C_SUMI; ctx.stroke();

  // fold lines + brass corner caps
  for (var k = 0; k <= N; k++){
    var xk = -innerL/2 + k*step;
    var yk = (k % 2 ? depth : 0);
    ctx.beginPath();
    ctx.moveTo(xk, -h + yk); ctx.lineTo(xk, h - yk);
    ctx.strokeStyle = (k % 2) ? 'rgba(238,241,238,.30)' : 'rgba(27,36,32,.55)';
    ctx.lineWidth = Math.max(1, 1.6*S);
    ctx.stroke();
    if (k % 2 === 0){
      ctx.fillStyle = C_BRASS;
      var cs = Math.max(2.4, 4*S);
      ctx.fillRect(xk - cs/2, -h - cs*0.4, cs, cs*1.1);
      ctx.fillRect(xk - cs/2, h - cs*0.7, cs, cs*1.1);
    }
  }
  // end plates
  ctx.fillStyle = C_SHEET;
  ctx.strokeStyle = C_SUMI; ctx.lineWidth = Math.max(1.4, 2.6*S);
  ctx.fillRect(-L/2, -h*1.12, plateW, h*2.24);
  ctx.strokeRect(-L/2, -h*1.12, plateW, h*2.24);
  ctx.fillRect(L/2 - plateW, -h*1.12, plateW, h*2.24);
  ctx.strokeRect(L/2 - plateW, -h*1.12, plateW, h*2.24);

  // reed block on the right plate — the tongues flutter with pressure
  var rn = 7, rh = (h*2.0) / rn;
  for (var r = 0; r < rn; r++){
    var ry = -h*1.0 + r*rh + rh*0.5;
    var amp = press * rh * 0.34 * Math.sin(flutter * (1 + r*0.17) + r);
    ctx.fillStyle = press > 0.02 ? C_BRASS : 'rgba(178,130,47,.45)';
    ctx.fillRect(L/2 - plateW + 2, ry - rh*0.22 + amp, plateW - 4, rh*0.44);
  }
  ctx.restore();
}

function drawHand(h, colour){
  if (!h.live || !h.has) return;
  var LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],
               [10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],
               [18,19],[19,20],[5,9],[9,13],[13,17]];
  ctx.save();
  ctx.lineWidth = Math.max(1.1, 2*S);
  ctx.strokeStyle = colour;
  ctx.beginPath();
  for (var i = 0; i < LINKS.length; i++){
    var a = LINKS[i][0], b = LINKS[i][1];
    var ax = h.pts[a*2]*W, ay = h.pts[a*2+1]*H;
    var bx = h.pts[b*2]*W, by = h.pts[b*2+1]*H;
    if (!isFinite(ax) || !isFinite(ay) || !isFinite(bx) || !isFinite(by)) continue;
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  }
  ctx.stroke();
  ctx.fillStyle = colour;
  for (var k = 0; k < 21; k++){
    var x = h.pts[k*2]*W, y = h.pts[k*2+1]*H;
    if (!isFinite(x) || !isFinite(y)) continue;
    ctx.beginPath(); ctx.arc(x, y, Math.max(1.2, 2.1*S), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// scale ladder down the right edge
function drawLadder(){
  var T = TUNINGS[tune];
  var n = T.deg.length;
  var x = W - Math.max(30, 44*S) - 8;
  var top = H*0.20, bot = H*0.80;
  var step = (bot - top) / (n - 1);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < n; i++){
    var y = bot - i*step;
    var on = (i === melDeg);
    var w = on ? Math.max(30, 44*S) : Math.max(18, 26*S);
    ctx.fillStyle = on ? C_BRASS : C_SHEET;
    ctx.fillRect(x, y - step*0.32, w, step*0.64);
    ctx.strokeStyle = C_SUMI; ctx.lineWidth = on ? Math.max(1.3, 2.2*S) : 1;
    ctx.strokeRect(x, y - step*0.32, w, step*0.64);
    ctx.fillStyle = on ? C_SHEET : 'rgba(27,36,32,.6)';
    ctx.font = '600 ' + Math.round(Math.max(9, step*0.42)) + "px 'Barlow Condensed',sans-serif";
    ctx.fillText(NAMES[((T.deg[i] % 12) + 12) % 12], x + w*0.5, y);
  }
  ctx.restore();
}
// chord plate on the left edge
function drawChordPlate(){
  var T = TUNINGS[tune];
  var n = T.chords.length;
  var w = Math.max(30, 44*S);
  var x = 10;
  var top = H*0.30, bot = H*0.70;
  var step = (bot - top) / Math.max(1, n - 1);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < n; i++){
    var y = bot - i*step;
    var on = (i === chIdx);
    ctx.fillStyle = on ? C_BAIZE : C_SHEET;
    ctx.beginPath();
    ctx.arc(x + w*0.5, y, w*0.42, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = C_SUMI; ctx.lineWidth = on ? Math.max(1.3, 2.2*S) : 1;
    ctx.stroke();
    ctx.fillStyle = on ? C_SHEET : 'rgba(27,36,32,.6)';
    ctx.font = '600 ' + Math.round(Math.max(9, w*0.30)) + "px 'Barlow Condensed',sans-serif";
    ctx.fillText(T.chords[i].n, x + w*0.5, y);
  }
  ctx.restore();
}
// air column + pressure dial
function drawGauges(){
  var w = Math.max(14, 20*S), h = Math.min(H*0.30, 190);
  var x = W - w - 12, y = H*0.06;
  ctx.fillStyle = C_SHEET; ctx.fillRect(x, y, w, h);
  var fh = h * clamp(airCol.x / CAP, 0, 1);
  ctx.fillStyle = air < 0.12 ? C_ENJI : C_BAIZE;
  ctx.fillRect(x, y + h - fh, w, fh);
  ctx.strokeStyle = C_SUMI; ctx.lineWidth = 1.2;
  ctx.strokeRect(x + .5, y + .5, w, h);
  for (var i = 1; i < 5; i++){
    ctx.beginPath();
    ctx.moveTo(x, y + h*i/5); ctx.lineTo(x + w*0.42, y + h*i/5);
    ctx.stroke();
  }
  ctx.fillStyle = C_SUMI;
  ctx.font = Math.round(Math.max(8, 9.5*S*1.1)) + "px 'Barlow Condensed',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('AIR', x + w*0.5, y - 3);

  // pressure dial
  var r = Math.max(24, 34*S);
  var cx = x - r - 14, cy = y + r;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = C_SHEET; ctx.fill();
  ctx.strokeStyle = C_SUMI; ctx.lineWidth = 1.4; ctx.stroke();
  var a0 = Math.PI*0.78, a1 = Math.PI*2.22;
  ctx.strokeStyle = 'rgba(27,36,32,.5)'; ctx.lineWidth = 1;
  for (var k = 0; k <= 8; k++){
    var a = a0 + (a1-a0)*k/8;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*r*0.74, cy + Math.sin(a)*r*0.74);
    ctx.lineTo(cx + Math.cos(a)*r*0.90, cy + Math.sin(a)*r*0.90);
    ctx.stroke();
  }
  var na = a0 + (a1-a0) * clamp(needle.x, 0, 1.15);
  ctx.strokeStyle = C_ENJI; ctx.lineWidth = Math.max(1.6, 2.6*S);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(na)*r*0.16, cy - Math.sin(na)*r*0.16);
  ctx.lineTo(cx + Math.cos(na)*r*0.72, cy + Math.sin(na)*r*0.72);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, Math.max(2, 3*S), 0, Math.PI*2);
  ctx.fillStyle = C_SUMI; ctx.fill();
  ctx.fillStyle = C_SUMI;
  ctx.font = Math.round(Math.max(8, 9.5*S*1.1)) + "px 'Barlow Condensed',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('圧', cx, cy + r + 3);
}
// 音栓 — three stops you tap to change 調子
var stopRects = [];
function drawStops(){
  stopRects.length = 0;
  var n = TUNINGS.length;
  var w = Math.max(52, 74*S), h = Math.max(26, 34*S), gap = 6;
  var totalW = n*w + (n-1)*gap;
  var x0 = clamp(W*0.5 - totalW/2, 8, W - totalW - 8);
  var y = H - h - 12 - (portrait ? 0 : 0);
  if (titleBlock && !portrait && x0 < titleBlock.x + titleBlock.w + 8){
    x0 = titleBlock.x + titleBlock.w + 8;
  }
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < n; i++){
    var x = x0 + i*(w+gap);
    var on = (i === tune);
    stopRects.push({ x:x, y:y, w:w, h:h, i:i });
    ctx.fillStyle = on ? C_BRASS : C_SHEET;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = C_SUMI; ctx.lineWidth = on ? Math.max(1.3, 2.2*S) : 1;
    ctx.strokeRect(x + .5, y + .5, w, h);
    ctx.fillStyle = on ? '#2a1f08' : 'rgba(27,36,32,.72)';
    ctx.font = Math.round(Math.max(10, h*0.38)) + "px 'Zen Kaku Gothic Antique',sans-serif";
    ctx.fillText(TUNINGS[i].name, x + w*0.5, y + h*0.5);
  }
  ctx.restore();
}
function drawMotes(){
  ctx.save();
  for (var i = 0; i < motes.length; i++){
    var m = motes[i];
    ctx.globalAlpha = clamp(m.life, 0, 1) * 0.5;
    ctx.fillStyle = C_BAIZE;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawHint(){
  if (!noHands && !(air < 0.06 && press < 0.02)) return;
  var msg = noHands ? '手をカメラに写す' : '広げて空気を溜める';
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.round(Math.max(13, 17*S*1.05)) + "px 'Zen Kaku Gothic Antique',sans-serif";
  var m = ctx.measureText(msg).width;
  var pad = 12*S + 8;
  ctx.fillStyle = 'rgba(246,248,245,.9)';
  ctx.fillRect(W*0.5 - m/2 - pad, H*0.5 - 18*S - 8, m + pad*2, 36*S + 16);
  ctx.strokeStyle = C_SUMI; ctx.lineWidth = 1.2;
  ctx.strokeRect(W*0.5 - m/2 - pad, H*0.5 - 18*S - 8, m + pad*2, 36*S + 16);
  ctx.fillStyle = C_BAIZE;
  ctx.fillText(msg, W*0.5, H*0.5);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var last = 0;
function frame(t){
  requestAnimationFrame(frame);
  if (!last) last = t;
  var dt = clamp((t - last)/1000, 0, 0.05);
  last = t;
  if (!started) return;

  stepBellows(dt);
  stepGauges(dt);

  drawBackground();
  drawChordPlate();
  drawLadder();
  drawBellows();
  drawHand(hL, press > 0.02 ? C_ENJI : C_SUMI);
  drawHand(hR, press > 0.02 ? C_ENJI : C_SUMI);
  drawMotes();
  drawGauges();
  drawStops();
  drawHint();
}

// ═══════════════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════════════
function pointAt(ev){
  var r = view.getBoundingClientRect();
  var cx = (ev.clientX !== undefined) ? ev.clientX :
           (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
  var cy = (ev.clientY !== undefined) ? ev.clientY :
           (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0);
  return { x: cx - r.left, y: cy - r.top };
}
view.addEventListener('pointerdown', function(ev){
  if (!started) return;
  var p = pointAt(ev);
  for (var i = 0; i < stopRects.length; i++){
    var s = stopRects[i];
    if (p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h){
      if (tune !== s.i){
        tune = s.i;
        melDeg = clamp(melDeg, 0, TUNINGS[tune].deg.length - 1);
        chIdx = clamp(chIdx, 0, TUNINGS[tune].chords.length - 1);
        prevVoices = null;
        applyChord();
        noteLbl.textContent = NAMES[((TUNINGS[tune].deg[melDeg] % 12) + 12) % 12];
        valveClick(0.16);
      }
      return;
    }
  }
});

// ═══════════════════════════════════════════════════════════════════════
//  OVERLAY DEMO — pull to fill, squeeze to sound
// ═══════════════════════════════════════════════════════════════════════
var dctx = demoCv.getContext('2d');
var demoRun = true, demoT0 = 0;
function demoBellows(cx, cy, len, half, sounding){
  var N = 11, plate = 12;
  var inner = Math.max(10, len - plate*2), step = inner/N;
  var depth = half * (0.16 + (len/260) * 0.30);
  dctx.save(); dctx.translate(cx, cy);
  dctx.beginPath();
  dctx.moveTo(-inner/2, -half);
  for (var i = 0; i <= N; i++) dctx.lineTo(-inner/2 + i*step, -half + (i%2?depth:0));
  dctx.lineTo(inner/2, half);
  for (var j = N; j >= 0; j--) dctx.lineTo(-inner/2 + j*step, half - (j%2?depth:0));
  dctx.closePath();
  dctx.fillStyle = C_BAIZE; dctx.fill();
  dctx.lineWidth = 2; dctx.strokeStyle = C_SUMI; dctx.stroke();
  dctx.fillStyle = C_SHEET; dctx.strokeStyle = C_SUMI;
  dctx.fillRect(-len/2, -half*1.14, plate, half*2.28);
  dctx.strokeRect(-len/2, -half*1.14, plate, half*2.28);
  dctx.fillRect(len/2 - plate, -half*1.14, plate, half*2.28);
  dctx.strokeRect(len/2 - plate, -half*1.14, plate, half*2.28);
  if (sounding){
    dctx.fillStyle = C_BRASS;
    for (var r = 0; r < 6; r++){
      dctx.fillRect(len/2 - plate + 2, -half*0.9 + r*(half*1.8/6) + 2, plate - 4, half*1.8/6 - 4);
    }
  }
  dctx.restore();
}
function demoFrame(t){
  if (!demoRun) return;
  requestAnimationFrame(demoFrame);
  if (!demoT0) demoT0 = t;
  var e = ((t - demoT0) % 3600) / 3600;
  var w = demoCv.width, h = demoCv.height;
  dctx.setTransform(1,0,0,1,0,0);
  dctx.fillStyle = C_PAPER; dctx.fillRect(0, 0, w, h);
  dctx.strokeStyle = C_GRID; dctx.lineWidth = 1;
  for (var g = 0; g < w; g += 16){ dctx.beginPath(); dctx.moveTo(g+.5,0); dctx.lineTo(g+.5,h); dctx.stroke(); }
  for (var g2 = 0; g2 < h; g2 += 16){ dctx.beginPath(); dctx.moveTo(0,g2+.5); dctx.lineTo(w,g2+.5); dctx.stroke(); }

  // 0.00–0.42 open (fill) · 0.42–1.00 squeeze and hold (sound)
  var openU, sounding, tank;
  if (e < 0.42){
    var u = e/0.42;
    openU = u; sounding = false; tank = u;
  } else {
    var u2 = Math.min(1, (e - 0.42)/0.26);
    openU = 1 - u2; sounding = true; tank = 1 - Math.max(0, (e - 0.42)/0.58)*0.9;
  }
  var len = 120 + openU*250;
  demoBellows(w*0.5, h*0.50, len, 46, sounding);
  // arrows
  dctx.strokeStyle = sounding ? C_ENJI : C_BAIZE;
  dctx.fillStyle = dctx.strokeStyle;
  dctx.lineWidth = 3; dctx.lineCap = 'round';
  var ar = sounding ? -1 : 1;
  [[-1],[1]].forEach(function(s){
    var sx = w*0.5 + s[0]*(len/2 + 16), ex = sx + s[0]*ar*26;
    dctx.beginPath(); dctx.moveTo(sx, h*0.50); dctx.lineTo(ex, h*0.50); dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(ex + s[0]*ar*7, h*0.50);
    dctx.lineTo(ex, h*0.50 - 6); dctx.lineTo(ex, h*0.50 + 6);
    dctx.closePath(); dctx.fill();
  });
  // tank
  dctx.fillStyle = C_SHEET; dctx.fillRect(w - 34, 22, 18, 80);
  dctx.fillStyle = C_BAIZE;
  dctx.fillRect(w - 34, 22 + 80*(1-clamp(tank,0,1)), 18, 80*clamp(tank,0,1));
  dctx.strokeStyle = C_SUMI; dctx.lineWidth = 1.2; dctx.strokeRect(w - 33.5, 22.5, 18, 80);
  dctx.fillStyle = C_SUMI;
  dctx.font = "12px 'Barlow Condensed',sans-serif";
  dctx.textAlign = 'center'; dctx.textBaseline = 'bottom';
  dctx.fillText('AIR', w - 25, 18);
  // caption
  dctx.textAlign = 'center'; dctx.textBaseline = 'bottom';
  dctx.font = "17px 'Zen Kaku Gothic Antique',sans-serif";
  dctx.fillStyle = sounding ? C_ENJI : C_BAIZE;
  dctx.fillText(sounding ? '寄せているあいだ鳴る' : 'ひろげて溜める（無音）', w*0.5, h - 10);
}

// ═══════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════
function begin(){
  if (started) return;
  initAudio();
  started = true;
  demoRun = false;
  ov.classList.add('hide');
  applyChord();
  noteLbl.textContent = NAMES[0];
  initHands();
  startStream().then(startMpCamera).catch(showError);
}
startBtn.addEventListener('click', begin);
startBtn.addEventListener('touchend', function(e){ e.preventDefault(); begin(); }, {passive:false});

resize();
requestAnimationFrame(frame);
requestAnimationFrame(demoFrame);
</script>
</body>
