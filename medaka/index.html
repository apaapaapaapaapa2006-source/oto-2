<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>

  MEDAKA めだか ─ めだかの群れが顔のまわりを泳ぐ        ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  ORIGIN     オーナーの依頼「TOKERU のグラフィックのめだか（シルエット）が顔や他の
             周りにくるエフェクト。量やスピードは調整できるように」。
             UI は TOKERU と同じ硝子のパネル・配色・書体に揃えた。
  MOOD       水槽を真上からのぞいたように、カメラの映像の上を小さなめだかの影が
             群れで泳ぐ。魚の下には水底に落ちる淡い影がずれて付き、浮いて見える。
  PALETTE    墨緑の地 #0b0d0c ／ 硝子の UI rgba(16,20,18,.52) ／ 文字 #e9efe9 ／ 差し色 #c9f0dc
             魚：黒めだか #101814 ／ 緋めだか #ef8a2c ／ 白めだか #f3f1ea
  TYPE       Zen Kaku Gothic New（UI）・IBM Plex Mono（数字）── TOKERU と同じ。
  MOTION     群れ（分離・整列・結合）のまま、顔や手のまわりを一方向に周回する。
             体は背骨にそって尾まで波打ち、曲がるときはしなる。
             顔や手を速く動かすと近くの魚がぱっと散り、少しして戻ってくる。
  SIGNATURE  タップするとえさが落ちて波紋が広がり、群れがつつきに集まる。
  TECH       2D canvas。FaceLandmarker（2 人）と HandLandmarker（2 手）を動的 import。
             魚は型付き配列で持ち、近傍は格子で探す。影は 1/4 解像度に描いて

  ══════════════════════════════════════════════════════════════════════════

<script>
'use strict';
/* =====================================================================
   MEDAKA — a school of medaka silhouettes circling faces and hands.
   per frame: landmarks → attractors (circles, in canvas px) → boids with an
   orbit steer (typed arrays, grid neighbours) → shadow pass at ¼ res →
   fish bodies built from a bending spine.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = id => document.getElementById(id);
const view = $('view'), video = $('cam');
const ctx = view.getContext('2d', { alpha:false });
const S = { count:90, speed:1, size:1, ring:1, kind:0, target:0, water:1, vol:.4 };
const KINDS = [
  { name:'黒めだか', body:'#101814', fin:'rgba(16,24,20,.55)' },
  { name:'緋めだか', body:'#ef8a2c', fin:'rgba(239,138,44,.5)' },
  { name:'白めだか', body:'#f3f1ea', fin:'rgba(243,241,234,.55)' },
];
const MAXF = 400;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

/* ---------- the medaka silhouette (top view), built along a bending spine ---------- */
const SEG = 10;
// half-width along the body, t: 0 head → 1 tail base (fraction of length)
const WIDTH = [.075, .105, .115, .11, .098, .082, .064, .047, .034, .026, .022];
const SP = new Float32Array((SEG + 1) * 2), NX = new Float32Array(SEG + 1), NY = new Float32Array(SEG + 1);
function fishPath(c, x, y, ang, L, phase, bend, amp){
  // spine: head at (x, y), heading ang; points go backwards toward the tail
  const ca = Math.cos(ang), sa = Math.sin(ang);
  for (let i = 0; i <= SEG; i++){
    const t = i / SEG, back = t * L * .78;
    const lat = (Math.sin(phase - t * 4.2) * amp * t * t + bend * t * t) * L;
    SP[i * 2] = x - ca * back - sa * lat; SP[i * 2 + 1] = y - sa * back + ca * lat;
  }
  for (let i = 0; i <= SEG; i++){
    const a = Math.max(0, i - 1), b = Math.min(SEG, i + 1);
    let dx = SP[a * 2] - SP[b * 2], dy = SP[a * 2 + 1] - SP[b * 2 + 1]; const l = Math.hypot(dx, dy) || 1;
    NX[i] = -dy / l; NY[i] = dx / l;
  }
  c.moveTo(SP[0] + (SP[0] - SP[2]) * .25, SP[1] + (SP[1] - SP[3]) * .25);           // snout
  for (let i = 0; i <= SEG; i++){ const w = WIDTH[i] * L; c.lineTo(SP[i * 2] + NX[i] * w, SP[i * 2 + 1] + NY[i] * w); }
  // caudal fin: a soft fan behind the tail base
  const tx = SP[SEG * 2], ty = SP[SEG * 2 + 1];
  let dx = SP[SEG * 2] - SP[(SEG - 1) * 2], dy = SP[SEG * 2 + 1] - SP[(SEG - 1) * 2 + 1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  const fl = L * .2, fw = L * .1, sw = Math.sin(phase - 4.6) * amp * L * .5;
  c.quadraticCurveTo(tx + dx * fl * .6 + NX[SEG] * fw * 1.1 + -dy * sw * .3, ty + dy * fl * .6 + NY[SEG] * fw * 1.1 + dx * sw * .3,
                     tx + dx * fl + NX[SEG] * fw + -dy * sw, ty + dy * fl + NY[SEG] * fw + dx * sw);
  c.lineTo(tx + dx * fl * .8 + -dy * sw, ty + dy * fl * .8 + dx * sw);
  c.lineTo(tx + dx * fl - NX[SEG] * fw + -dy * sw, ty + dy * fl - NY[SEG] * fw + dx * sw);
  c.quadraticCurveTo(tx + dx * fl * .6 - NX[SEG] * fw * 1.1 + -dy * sw * .3, ty + dy * fl * .6 - NY[SEG] * fw * 1.1 + dx * sw * .3, tx, ty);
  for (let i = SEG; i >= 0; i--){ const w = WIDTH[i] * L; c.lineTo(SP[i * 2] - NX[i] * w, SP[i * 2 + 1] - NY[i] * w); }
  c.closePath();
  // the big medaka eyes bulge past the outline
  const ex = SP[2] * .55 + SP[4] * .45, ey = SP[3] * .55 + SP[5] * .45, er = L * .052, ew = WIDTH[1] * L * 1.02;
  c.moveTo(ex + NX[1] * ew + er, ey + NY[1] * ew); c.arc(ex + NX[1] * ew, ey + NY[1] * ew, er, 0, TAU);
  c.moveTo(ex - NX[1] * ew + er, ey - NY[1] * ew); c.arc(ex - NX[1] * ew, ey - NY[1] * ew, er, 0, TAU);
}
function finPath(c, L, phase){
  // pectoral fins, flapping, just behind the eyes (uses the spine from fishPath)
  const i = 3, bx = SP[i * 2], by = SP[i * 2 + 1], w = WIDTH[i] * L;
  let dx = SP[(i + 1) * 2] - bx, dy = SP[(i + 1) * 2 + 1] - by; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  const fl = L * .13, open = .55 + .35 * Math.sin(phase * 1.7);
  for (const s of [1, -1]){
    const ox = bx + NX[i] * w * s, oy = by + NY[i] * w * s;
    const tx = ox + (dx * Math.cos(open) + NX[i] * s * Math.sin(open)) * fl, ty = oy + (dy * Math.cos(open) + NY[i] * s * Math.sin(open)) * fl;
    c.moveTo(ox, oy); c.quadraticCurveTo(ox + NX[i] * s * fl * .7, oy + NY[i] * s * fl * .7, tx, ty); c.lineTo(ox + dx * fl * .5, oy + dy * fl * .5); c.closePath();
  }
}

/* ---------- start-screen school ---------- */
const startSchool = (() => {
  const c = $('school'), x = c.getContext('2d'); let on = true;
  const f = (t) => {
    if (!on) return;
    x.clearRect(0, 0, 640, 320);
    const s = t / 1000;
    for (let k = 0; k < 14; k++){
      const a = s * .55 + k * TAU / 14 + Math.sin(k * 3.1) * .25, rx = 220 + 18 * Math.sin(k * 1.7), ry = 95 + 10 * Math.cos(k * 2.3);
      const px = 320 + Math.cos(a) * rx, py = 160 + Math.sin(a) * ry;
      const hd = Math.atan2(Math.cos(a) * ry, -Math.sin(a) * rx);
      const L = 46 + 8 * Math.sin(k * 5.3);
      x.beginPath(); fishPath(x, px + 6, py + 9, hd, L, s * 9 + k, 0, .14); x.fillStyle = 'rgba(0,0,0,.35)'; x.fill();
      x.beginPath(); fishPath(x, px, py, hd, L, s * 9 + k, 0, .14); finPath(x, L, s * 9 + k); x.fillStyle = '#c9f0dc'; x.fill();
    }
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
  return { stop(){ on = false; } };
})();

/* ---------- geometry ---------- */
const G = { W:0, H:0, ox:0, oy:0, dw:0, dh:0, short:1 };
const shadow = document.createElement('canvas'), sctx = shadow.getContext('2d');
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  const k = Math.min(1, 1920 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
  if (w !== G.W || h !== G.H){
    G.W = view.width = w; G.H = view.height = h;
    shadow.width = Math.max(8, w >> 2); shadow.height = Math.max(8, h >> 2);
  }
  const va = (vidW || 16) / (vidH || 9), ca = G.W / G.H;
  if (va > ca){ G.dh = G.H; G.dw = G.H * va; } else { G.dw = G.W; G.dh = G.W / va; }
  G.ox = (G.W - G.dw) / 2; G.oy = (G.H - G.dh) / 2; G.short = Math.min(G.W, G.H);
}

/* ---------- attractors: faces and hands as circles ---------- */
// slot-stable list; each has a smoothed centre / radius, velocity, presence
const AT = [];
for (let i = 0; i < 6; i++) AT.push({ kind:i < 2 ? 'face' : i < 4 ? 'hand' : 'food', on:false, x:0, y:0, r:0, vx:0, vy:0, a:0, seen:-1e9, lastObs:-1, dir:i % 2 ? -1 : 1, t:0 });
const FOOD = [AT[4], AT[5]];
function lmXY(q){ return [G.ox + (mirror ? 1 - q.x : q.x) * G.dw, G.oy + q.y * G.dh]; }
function okPt(q){ return q && isFinite(q.x) && isFinite(q.y); }
function circleOfFace(lm){
  if (!lm || typeof lm.length !== 'number' || lm.length < 468) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, n = 0;
  for (let i = 0; i < 468; i += 3){ const q = lm[i]; if (!okPt(q)) continue; const [x, y] = lmXY(q);
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; n++; }
  if (n < 100 || !(x1 > x0) || !(y1 > y0)) return null;
  const r = Math.max(x1 - x0, y1 - y0) * .5;
  if (!(r > 2) || r > G.short * 2) return null;
  return [(x0 + x1) / 2, (y0 + y1) / 2 - r * .08, r * 1.08];
}
function circleOfHand(lm){
  if (!lm || typeof lm.length !== 'number' || lm.length < 21) return null;
  for (const i of [0, 5, 9, 13, 17, 12]) if (!okPt(lm[i])) return null;

// a no-op path target, so fishPath can refill the spine before the fins are drawn
function Path2DSink(){ }
Path2DSink.prototype.moveTo = Path2DSink.prototype.lineTo = Path2DSink.prototype.quadraticCurveTo = Path2DSink.prototype.arc = Path2DSink.prototype.closePath = function(){};
const SINK = new Path2DSink();
function kindOf(i){ return S.kind === 3 ? F.kind[i] : S.kind; }
function drawFish(){
  const len = G.short * .062 * S.size;
  // shadows: ¼ res, offset down-right, upscaled → soft
  const sw = shadow.width, shh = shadow.height, k = sw / G.W;
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, sw, shh);
  sctx.setTransform(k, 0, 0, k, 0, 0);
  sctx.beginPath();
  const off = len * .45;
  for (let i = 0; i < F.n; i++) fishPath(sctx, F.x[i] + off, F.y[i] + off * 1.3, F.ang[i], len * F.sz[i], F.ph[i], F.turn[i], .12);
  sctx.fillStyle = S.water ? 'rgba(4,14,10,1)' : 'rgba(0,0,0,1)'; sctx.fill();
  ctx.globalAlpha = S.kind === 0 ? .26 : .34; ctx.imageSmoothingEnabled = true;
  ctx.drawImage(shadow, 0, 0, G.W, G.H); ctx.globalAlpha = 1;
  // bodies, batched by colour
  for (let kd = 0; kd < 3; kd++){
    const K = KINDS[kd];
    ctx.beginPath(); let any = false;
    for (let i = 0; i < F.n; i++){ if (kindOf(i) !== kd) continue; any = true;
      fishPath(ctx, F.x[i], F.y[i], F.ang[i], len * F.sz[i], F.ph[i], F.turn[i], .12); }
    if (!any) continue;
    ctx.fillStyle = K.body; ctx.fill();
    ctx.beginPath();
    for (let i = 0; i < F.n; i++){ if (kindOf(i) !== kd) continue;
      fishPath(SINK, F.x[i], F.y[i], F.ang[i], len * F.sz[i], F.ph[i], F.turn[i], .12); finPath(ctx, len * F.sz[i], F.ph[i]); }
    ctx.fillStyle = K.fin; ctx.fill();
  }
}
function drawRipples(dt){
  for (let k = RIP.length - 1; k >= 0; k--){
    const r = RIP[k]; r.t += dt;
    if (r.t > 1.6){ RIP.splice(k, 1); continue; }
    for (let j = 0; j < 3; j++){
      const tt = r.t - j * .22; if (tt <= 0) continue;
      const rad = G.short * (.02 + tt * .16), a = (1 - tt / 1.6) * .5;
      ctx.strokeStyle = 'rgba(233,239,233,' + a.toFixed(3) + ')'; ctx.lineWidth = Math.max(1, G.short * .003);
      ctx.beginPath(); ctx.ellipse(r.x, r.y, rad, rad * .92, 0, 0, TAU); ctx.stroke();
    }
  }
  // the food pellets themselves
  for (const f of FOOD){ if (!f.on) continue;
    ctx.fillStyle = 'rgba(214,180,120,' + (.9 * f.a).toFixed(3) + ')';
    for (let j = 0; j < 5; j++){ const a = j * 1.3 + f.t * .4, d = G.short * .008 * (1 + j % 3);
      ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, G.short * .0045, 0, TAU); ctx.fill(); }
  }
}
function loop(now){
  requestAnimationFrame(loop);
  const dt = clamp((now - (lastT || now)) / 1000, 0, TEST.maxDt); lastT = now; frameN++;
  resize();
  detect(now);
  // attractor presence
  for (const a of AT){
    if (!a.on) continue;
    if (a.kind === 'food'){
      a.t += dt; if (a.t > 4.5) a.a -= dt / .8; if (a.a <= 0){ a.on = false; a.a = 0; }
      continue;
    }
    const age = (now - a.seen) / 1000, want = age < .35 ? 1 : 0;
    a.a += (want - a.a) * (1 - Math.exp(-dt / (want ? .15 : .3)));
    if (!want && age > 1.2){ a.on = false; a.a = 0; a.vx = a.vy = 0; }
  }
  stepFish(dt, now);
  drawCamera();
  drawRipples(dt);
  drawFish();
}

/* ---------- test hook ---------- */
window.__medaka = {
  feedFaces(list, t){ if (!TRACK.extF && modelFailed) setStatus(''); TRACK.extF = true; return ingestFaces(list, t); },
  feedHands(list, t){ TRACK.extH = true; return ingestHands(list, t); },
  food(x, y){ dropFood(x, y); }, S, test:TEST, setCount, setKind,
  fish(){ const o = []; for (let i = 0; i < F.n; i++) o.push([F.x[i], F.y[i], F.tgt[i], F.scare[i]]); return o; },
  state(){ return { frame:frameN, n:F.n, faces:TRACK.faces, hands:TRACK.hands, scatter:STATS.scatter,
    at:AT.map(a => ({ kind:a.kind, on:a.on, a:+a.a.toFixed(2), x:+a.x.toFixed(1), y:+a.y.toFixed(1), r:+a.r.toFixed(1) })), G:{ ...G } }; },
};
</script>
