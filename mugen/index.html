<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<script>
'use strict';
/* =====================================================================
   MUGEN — you, a mirrored box, and a few thousand lights.
   per frame:
     video + mask → a cut-out of you (tinted by the room's light) → pushed into a
     timed ring → the lattice of reflections is drawn far → near, each copy taking
     the frame from (mirrors crossed × lag) ago, interleaved with the lanterns at
     their depths → bloom + grain → mode transition.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const view = $('view'), video = $('cam');
const ctx = view.getContext('2d', { alpha:false });
const S = { pal:0, den:.55, lag:.45, depth:.6, space:.45, skin:.55, bloom:.55, vol:.4, breath:true, floor:true };
const PALS = ['金', '七色', '氷'];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const TEST = { maxDt:.1, res:1600 };

/* ---------- palettes ---------- */
// each palette: 12 lantern tints (rgb) + the light that falls on you
const PAL = [

}
function loop(now){
  requestAnimationFrame(loop);
  const dtRaw = (now - (lastT || now)) / 1000;
  const dt = clamp(dtRaw, 0, TEST.maxDt); lastT = now; frameN++;
  // quality: if frames get slow, thin out the lanterns (and back)
  if (dtRaw > 0 && dtRaw < 1){ PERF.avg += (dtRaw * 1000 - PERF.avg) * .05;
    if (frameN % 90 === 0 && !TEST.fixedQ){ const q0 = PERF.q;
      if (PERF.avg > 42) PERF.q = Math.max(.35, PERF.q * .8); else if (PERF.avg < 22) PERF.q = Math.min(1, PERF.q * 1.12);
      if (Math.abs(q0 - PERF.q) > .02) G.den = -1; } }
  resize();
  detect(now);
  MODE.X += dt; palX += dt; bellCool -= dt;
  if (now - M.t > 300){ M.motion *= Math.exp(-dt / .15); M.lastObs = -1; }      // tracking lost: no phantom motion
  const W = G.W, H = G.H;
  const breath = MODE.on ? breathe(dt) : 1;

  // the light on you follows the palette (crossfaded when it changes) and the room's breath
  const pk = ease(palX / 1.2), tgt = PAL[S.pal].skin;
  for (let c = 0; c < 3; c++) skinRGB[c] += (tgt[c] - skinRGB[c]) * (palX < 1.2 ? .08 : 1);
  const skinB = (.2 + S.skin * .55) * (.12 + .88 * breath);

  // motion pulse
  const nowS = now / 1000;
  while (pulseLast < nowS){ pulseLast += 1 / 60; pulseHead = (pulseHead + 1) & 255; PULSE[pulseHead] = MODE.on ? clamp((M.motion - .015) * 7, 0, 1.4) : 0; }
  if (pulseLast > nowS + 1) pulseLast = nowS;
  if (MODE.on && M.motion > .05 && bellCool <= 0){ bell(clamp(M.motion * 5, 0, 1)); bellCool = .45 + Math.random() * .3; STATS.bells++; }

  // cut-outs
  if (!ringW) allocCut();
  const camOn = !MODE.on && MODE.X > .45;
  if (!camOn){
    cutInto(nearX, nearC.width, nearC.height, skinB);
    if (now - ringLast > 1000 / 30 - 2){
      ringLast = now; ringHead = (ringHead + 1) % RING_N;
      const r = RING[ringHead]; r.t = now;
      r.x.globalCompositeOperation = 'copy'; r.x.drawImage(nearC, 0, 0, ringW, ringH);
    }
  }

  // ---- draw ----
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (camOn){
    // plain camera
    ctx.save(); if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); }
    if (video.readyState >= 2) ctx.drawImage(video, mirror ? W - G.cox - G.cdw : G.cox, G.coy, G.cdw, G.cdh);
    ctx.restore();
    // the lights coming back up
    if (MODE.X < 1.1){ ctx.fillStyle = `rgba(0,0,0,${1 - ease((MODE.X - .45) / .65)})`; ctx.fillRect(0, 0, W, H); }
    return;
  }
  const haze = PAL[S.pal].haze;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // a faint glow where the lights crowd together at the vanishing point
  {
    const g = ctx.createRadialGradient(G.vpx, G.vpy, 0, G.vpx, G.vpy, G.short * .9);
    const hb = .9 * breath * ignite(G.J * .6);
    g.addColorStop(0, `rgba(${haze[0] * 1.6 * hb | 0},${haze[1] * 1.6 * hb | 0},${haze[2] * 1.6 * hb | 0},1)`);
    g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  const lag = .035 + S.lag * .13;
  const tSec = now / 1000;
  const spr = SPRITES[S.pal], sprPrev = SPRITES[(S.pal + 2) % 3];
  const lanR = G.short * .024;
  const fy = G.floorY;
  let li = 0, nCopies = 0, nLan = 0;
  const drawLanternsUntil = zStop => {
    ctx.globalCompositeOperation = 'lighter';
    for (; li < LN; li++){
      const o = li * 6, z = LAN[o + 2];
      if (z <= zStop) break;
      const s = 1 / (1 + z * G.dz);
      const X = LAN[o], Y = LAN[o + 1], seed = LAN[o + 4];
      const sx = G.vpx + X * s; if (sx < -60 || sx > W + 60) continue;
      const ig = ignite(z); if (ig <= 0) continue;
      // candle flicker, the depth pulse and the room's breath
      const fl = S.pal === 0 ? .72 + .28 * Math.sin(tSec * (2.1 + seed * 3) + seed * 40) * Math.sin(tSec * (1.3 + seed) + seed * 9)
               : S.pal === 1 ? .8 + .2 * Math.sin(tSec * .7 + seed * 30) : .85 + .15 * Math.sin(tSec * 1.7 + seed * 50);
      const pu = pulseAt(z * lag * 1.6);
      let a = ig * breath * fl * (.55 + .45 * seed) + pu * .9 * ig;
      if (a < .015) continue;
      let r = lanR * LAN[o + 3] * s * (1 + pu * .5);
      if (z < 0) r *= 1.8 + (-z) * 3;                   // in front of you: big and out of focus
      let tint = LAN[o + 5] | 0;
      if (S.pal === 1) tint = (tint + ((tSec * .25 + seed * 3 + z * .35) | 0)) % 12;   // the souls change colour in slow sequence
      const sy = G.vpy + Y * s;
      const aa = Math.min(1, a) * (z < 0 ? .45 : 1);
      ctx.globalAlpha = aa * pk; ctx.drawImage(spr[tint], sx - r * 2.2, sy - r * 2.2, r * 4.4, r * 4.4);
      if (pk < 1){ ctx.globalAlpha = aa * (1 - pk); ctx.drawImage(sprPrev[tint], sx - r * 2.2, sy - r * 2.2, r * 4.4, r * 4.4); }
      nLan++;
      if (S.floor && z > 0){        // and once more in the water on the floor
        const ry = G.vpy + (2 * fy - Y) * s;
        if (ry < H + r * 3){ ctx.globalAlpha = aa * .32 * pk; ctx.drawImage(spr[tint], sx - r * 2.2, ry - r * 1.6, r * 4.4, r * 3.2); nLan++; }
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  };
  const ring = (ago) => {
    // newest frame at least `ago` seconds old
    if (ringHead < 0) return null;
    const want = now - ago * 1000;
    let best = null;
    for (let k = 0; k < RING_N; k++){
      const r = RING[(ringHead - k + RING_N) % RING_N];
      if (r.t < -1e8) break;
      best = r; if (r.t <= want) break;
    }
    return best;
  };
  for (let j = G.J; j >= 0; j--){
    drawLanternsUntil(j);
    const show = rowIn(j); if (show <= 0) continue;
    const s = 1 / (1 + j * G.dz), row = ROWS[j] || [0];
    const w = G.dw * s, h = G.dh * s;
    const y = G.vpy + (G.oy - G.vpy) * s;
    for (const i of row){
      if (j === 0) continue;          // your own row is you; the lattice starts one mirror behind
      const cx = G.vpx + (G.ox + G.dw / 2 - G.vpx) * s + i * G.sp * s;
      if (cx + w / 2 < 0 || cx - w / 2 > W) continue;
      const bounces = Math.abs(i) + j;
      const fr = ring(bounces * lag); if (!fr) continue;
      const a = show * Math.pow(.86, bounces) * (1 - .25 * Math.min(1, j / G.J));
      ctx.save();
      ctx.translate(cx, y);
      if (i & 1) ctx.scale(-1, 1);
      ctx.globalAlpha = a; ctx.drawImage(fr.c, -w / 2, 0, w, h);
      if (S.floor && j > 0){
        const bot = (G.oy + G.dh - G.vpy) * s + G.vpy - y;
        ctx.translate(0, 2 * bot); ctx.scale(1, -1);
        ctx.globalAlpha = a * .12; ctx.drawImage(fr.c, -w / 2, 0, w, h);
      }
      ctx.restore();
      nCopies++;
    }
  }
  // you, now, sharp — then whatever hangs in front of you
  ctx.globalAlpha = 1;
  ctx.drawImage(nearC, G.ox, G.oy, G.dw, G.dh);
  drawLanternsUntil(-9);
  ctx.globalAlpha = 1;
  STATS.copies = nCopies; STATS.lanterns = nLan;

  // bloom
  if (S.bloom > 0){
    bloomX.globalCompositeOperation = 'copy';
    bloomX.filter = 'blur(2px) contrast(2.6) brightness(.8)';      // only what is bright enough spills
    bloomX.drawImage(view, 0, 0, bloomC.width, bloomC.height);
    bloomX.filter = 'none';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .2 + S.bloom * .8;
    ctx.drawImage(bloomC, 0, 0, W, H);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // grain
  if (grainPat){
    ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .09;
    ctx.save(); ctx.translate((Math.random() * 192) | 0, (Math.random() * 192) | 0); ctx.fillStyle = grainPat; ctx.fillRect(-192, -192, W + 192, H + 192); ctx.restore();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // the lights going out (enter) / coming back (leave)
  if (MODE.on && MODE.X < .45){
    // first half: the plain camera sinks into black
    ctx.save(); if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.globalAlpha = 1 - ease(MODE.X / .45);
    if (video.readyState >= 2) ctx.drawImage(video, mirror ? W - G.cox - G.cdw : G.cox, G.coy, G.cdw, G.cdh);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (!MODE.on){ ctx.fillStyle = `rgba(0,0,0,${ease(MODE.X / .45)})`; ctx.fillRect(0, 0, W, H); }
}
// entering: the lights come on from you outward, and the reflections appear one row at a time
function ignite(z){ if (!MODE.on) return 1; return clamp((MODE.X - .7 - Math.max(0, z) * .22) / .5, 0, 1); }
function rowIn(j){ if (!MODE.on) return 1; return ease((MODE.X - .6 - j * .2) / .45); }

/* ---------- start screen: a few lights in perspective ---------- */
(function(){
  const box = $('dots'), r = mulberry(3);
  for (let k = 0; k < 70; k++){
    const z = r(), s = 1 / (1 + z * 5), x = 50 + (r() - .5) * 180 * s, y = 46 + (r() - .75) * 110 * s;
    if (x < 0 || x > 100 || y < 0 || y > 100) continue;
    const i = document.createElement('i'), d = 2 + 7 * s;
    i.style.cssText = `left:${x}%;top:${y}%;width:${d}px;height:${d}px;opacity:${.3 + s};animation-delay:${(r() * 4).toFixed(2)}s`;
    box.appendChild(i);
  }
})();

/* ---------- test hook ---------- */
window.__mugen = {
  feedMask(arr, w, h, t){ if (!M.external) setStatus(''); M.external = true; return ingestMask(arr, w, h, t); },
  setMode, setPal, test:TEST, S, PERF,
  rebuild(){ G.den = -1; },
  state(){ return { frame:frameN, mode:MODE.on, X:MODE.X, pal:S.pal, motion:+M.motion.toFixed(3), area:+M.area.toFixed(3),
    copies:STATS.copies, lanterns:STATS.lanterns, lanternPool:LN, bells:STATS.bells, ring:ringHead, q:PERF.q, G:{ ...G } }; },
};
</script>
