<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AORI ─ 両手で寝かせるピント面</title>
<meta name="description" content="両手を結んだ線がそのままピントの合う面になる大判カメラの煽り。面から外れたところは滲むのではなく、明るい点がひとつずつ絞り羽根の形の玉になって開く。円・六角・環の三つの絞りと、開くほど浅くなる被写界深度。つまめば面がその場に固定され、手を下ろしても構図は動かない。">
<meta name="theme-color" content="#eceae1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;400;500;600&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  AORI ─ 両手で寝かせるピント面                      ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      The ground glass of a wooden view camera, under flat north
            daylight. High-key, matte, quiet — the exact opposite of
            tonight's companion piece (KURURI, lamplit oak). Nothing here
            glows; everything is a surface you could touch, and the image
            sits INSIDE a frame instead of bleeding off the edges, because
            a focusing screen has edges and that is the whole point.

  PALETTE   乳白  nyuuhaku #f3f1ea  the ground glass. Warm off-white — the
                                    single largest area in the piece.
            硝子  garasu   #cfd6d2  the matte screen's green-grey tooth.
                                    Every rule, grid and fiducial.
            黒檀  kokutan  #24272a  ebony. All text, the camera frame.
            黄銅  oudou    #9a7b3f  brass. RESERVED for the movements: the
                                    plane of focus rail and its knobs. If
                                    it is brass, you can move it.
            藍    ai       #2f5d8c  indigo. RESERVED for LOCKED. The rail
                                    turns indigo the instant the plane is
                                    pinned, and nothing else in the piece
                                    is ever blue.

  BACKGROUND  A real focusing screen: fine matte tooth built once into a
              tile, a faint engraved eighth-grid over the live image,
              thirds rules, and four corner fiducial crosses. Flat, even
              light across the whole page. No vignette, no gradient mesh,
              no dark stage.

  TYPE      Jost 200/400/500/600 for every latin word and number — a
            geometric sans in the register of engraving on a lens barrel.
            Shippori Mincho 400/600 for Japanese: a printed 明朝 with a
            technical-manual formality that suits a camera movement.

  MOTION    RAILED. The plane of focus is a critically damped spring on
            your hands: it lags about 90ms and arrives without wobble,
            the way a geared focusing rail does. The lock is the only
            snappy thing — a 90ms scale pop and a leaf-shutter click.
            Nothing in the piece fades linearly and nothing floats.

  SIGNATURE 滲まずに、玉になる。 Defocus here is not a blur. Every bright
            point off the plane is SPLATTED as a disc the shape of the
            aperture — round, hexagonal with six straight blades, or the
            annulus of a mirror lens — so highlights open into bokeh balls
            with bright rims exactly as glass does, while the rest of the
            frame melts through a four-level blur pyramid. And the plane
            those balls are measured from is the LINE BETWEEN YOUR TWO
            HANDS: tilt your hands and the plane of focus tilts with them,
            which is the Scheimpflug movement a view camera is built for.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#eceae1}
  body{
    font-family:'Shippori Mincho',-apple-system,'Hiragino Mincho ProN',serif;
    color:#24272a;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  }
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #video{position:fixed;width:2px;height:2px;opacity:.004;pointer-events:none;left:0;top:0}

  #flip{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:6;

    color:#24272a;background:rgba(243,241,234,.86);border:1px solid #9a7b3f;
    padding:7px 13px;cursor:pointer;border-radius:2px;
    transition:background .15s ease-out,color .15s ease-out;
  }
  #flip:hover{background:#9a7b3f;color:#f3f1ea}

  #err{
    display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;
    max-width:min(86vw,430px);white-space:pre-wrap;line-height:1.85;font-size:13px;
    background:#f3f1ea;border:1px solid #24272a;border-left:4px solid #2f5d8c;
    padding:18px 20px;color:#24272a;
  }

  #read{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:6;
    font-family:'Jost',sans-serif;font-weight:400;font-size:12px;letter-spacing:.12em;
    line-height:1.85;text-align:right;color:#6b6f6c;
    background:rgba(243,241,234,.8);border:1px solid rgba(154,123,63,.34);

  }

  #read .lk{color:#2f5d8c;font-weight:600}

  #panel{
    position:fixed;left:50%;transform:translateX(-50%);

  }

    padding:4px 11px;cursor:pointer;border-radius:2px;line-height:1.3;

  #snd{
    font-family:'Jost',sans-serif;font-weight:500;font-size:11px;letter-spacing:.16em;

    -webkit-appearance:none;width:12px;height:12px;margin-top:-6px;border-radius:50%;
    background:#f3f1ea;border:1.5px solid #24272a;
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:#f3f1ea;border:1.5px solid #24272a;
  }

  /* ── start sheet ─────────────────────────────────────── */
  .sheet{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(236,234,225,.96);
    transition:opacity .4s ease-out,visibility .4s;
  }
  .sheet.gone{opacity:0;visibility:hidden;pointer-events:none}
  .card{
    width:min(96vw,560px);max-height:94vh;overflow:auto;
    background:#f3f1ea;border:1px solid #24272a;border-radius:2px;
    box-shadow:0 18px 50px rgba(36,39,42,.14);
  }
  .cap{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:.26em;
    color:#8a8e8b;padding:12px 20px;border-bottom:1px solid rgba(36,39,42,.16);
  }
  .cap b{font-weight:600;color:#9a7b3f}
  .bodyw{padding:20px 22px 22px}
  .ttl{font-family:'Shippori Mincho',serif;font-weight:600;font-size:clamp(20px,5.2vw,27px);letter-spacing:.03em;margin-bottom:11px}
  .lead{font-size:13.5px;line-height:2.0;color:#3d4144}
  .lead em{font-style:normal;color:#9a7b3f;font-weight:600}
  #demo{display:block;width:100%;height:auto;margin:16px 0 14px;border:1px solid rgba(36,39,42,.18);background:#dfded6}

    font-size:12.5px;line-height:2.05;color:#5c605e;
    border-top:1px solid rgba(36,39,42,.16);padding-top:12px;
  }

  .go{
    display:block;width:100%;margin-top:17px;
    font-family:'Shippori Mincho',serif;font-weight:600;font-size:17px;letter-spacing:.34em;
    color:#f3f1ea;background:#24272a;border:none;border-radius:2px;
    padding:14px 0;cursor:pointer;
    transition:transform .15s cubic-bezier(.2,.9,.3,1.2),background .15s ease-out;
  }
  .go:hover{background:#3d4144;transform:scale(1.012)}

</style>

<body>

<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="err"></div>

<div id="read">
  絞り <b id="rF">—</b>　玉 <b id="rBall">0</b>　<span id="rLock"></span>
</div>

<div id="panel">
  <div class="grp">
    <label>APERTURE</label>
    <div class="modes">
      <button id="m0" class="on">円</button>
      <button id="m1">六角</button>
      <button id="m2">環</button>
    </div>
  </div>
  <div class="grp"><label>絞り</label><input type="range" id="apEl" min="0" max="100" value="66"></div>
  <div class="grp"><label>面の幅</label><input type="range" id="bandEl" min="0" max="100" value="34"></div>
  <button id="snd">音 OFF</button>
</div>

<div class="sheet" id="startSheet">
  <div class="card">
    <div class="cap"><span>OTO-II / AORI</span><span>TILT <b>&amp; BOKEH</b></span></div>
    <div class="bodyw">
      <div class="ttl">両手で寝かせるピント面</div>
      <p class="lead">
        両手を結んだ線が、そのまま<em>ピントの合う面</em>になります。<br>
        手を傾ければ面も傾き、外れたところの明るい点は<br>
        滲むのではなく<em>絞り羽根の形の玉</em>になって開きます。
      </p>
      <canvas id="demo" width="660" height="228"></canvas>
      <div class="spec">
        <span>両手を結ぶ</span>その線が合焦面。傾ければ面が寝ます<br>
        <span>片手だけ</span>水平の面が、その手の高さに来ます<br>
        <span>つまむ</span>面がその場に固定され、手を下ろせます<br>
        <span>絞り</span>開くほど浅く、玉は大きく。形は三つ
      </div>
      <button class="go" id="startBtn">覗く</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  AORI ─ 両手で寝かせるピント面
//
//  A view camera's tilt movement. The line between the two palms is the
//  PLANE OF FOCUS; everything is graded by its signed distance from that
//  line. Away from it the image melts through a four-level box-blur
//  pyramid — but bright points do not melt, they are splatted as discs
//  the shape of the aperture, which is what a real lens does and what a
//  blur filter cannot do.
//
//  Everything per-pixel happens on a small square-pixel work buffer whose
//  size adapts to the measured frame cost; typed arrays are allocated once
//  and one ImageData is reused for the life of the page.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number' && isFinite(v); }
function chase(cur,tgt,rate,dt){ var k=1-Math.exp(-rate*clamp(dt,0,0.2)); return cur+(tgt-cur)*k; }

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var apEl=document.getElementById('apEl');
var bandEl=document.getElementById('bandEl');
var sndBtn=document.getElementById('snd');
var rF=document.getElementById('rF');
var rBall=document.getElementById('rBall');
var rLock=document.getElementById('rLock');
var mBtn=[document.getElementById('m0'),document.getElementById('m1'),document.getElementById('m2')];

var W=0,H=0,DPR=1,MN=1;
var glassTile=null;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
  glassTile=null;
  layout();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  GEOMETRY ─ CONTAIN, not cover.
//
//  A focusing screen has edges, so the frame is letterboxed into the
//  ground glass rather than cropped to fill. That makes the mapping
//  honest in both directions: the work buffer is sized so that ONE WORK
//  PIXEL IS SQUARE (PH = PW / camAspect), and the image rectangle on
//  screen has the same aspect. Every distance the filter measures — the
//  plane offset, the band half-width, the bokeh radius — is therefore in
//  square pixels, and every one of them is scaled by min(PW,PH), the
//  SHORT edge, so a phone in portrait and a laptop in landscape defocus
//  by the same physical amount for the same gesture.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3;
var imgX=0,imgY=0,imgW=1,imgH=1;
function layout(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var pad=Math.max(12,MN*0.055);
  var topPad=pad+Math.max(30,MN*0.06);
  var botPad=pad+Math.max(46,MN*0.085);
  var aw=Math.max(40,W-pad*2), ah=Math.max(40,H-topPad-botPad);
  var w2=aw, h2=aw/camAspect;
  if (h2>ah){ h2=ah; w2=ah*camAspect; }
  imgW=w2; imgH=h2;
  imgX=(W-w2)/2; imgY=topPad+(ah-h2)/2;
}
// landmark → screen px (inside the image rectangle)
function sx(nx){ return imgX + (mirror?(1-nx):nx)*imgW; }
function sy(ny){ return imgY + ny*imgH; }
// landmark → work-buffer px (square pixels)
function wx(nx){ return (mirror?(1-nx):nx)*PW; }
function wy(ny){ return ny*PH; }

// ═══════════════════════════════════════════════════════════════════════
//  HANDS
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.45;
function mkHand(){ return { on:false,t:-9, x:0,y:0, wxp:0,wyp:0, span:1, pinch:0, armed:false }; }
var Hd=[mkHand(),mkHand()];

function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  return fin(p.x)&&fin(p.y);
}
function loseHands(){
  for (var i=0;i<2;i++){ Hd[i].on=false; Hd[i].t=-9; Hd[i].pinch=0; Hd[i].armed=false; }
  // the plane must not keep the velocity it had when tracking vanished, or
  // the rack-focus whoosh would keep sounding into silence
  planeVel=0;
}
function readHand(h,L,t){
  if (!lmOK(L,0)||!lmOK(L,9)||!lmOK(L,4)||!lmOK(L,8)){ h.on=false; h.armed=false; return; }
  var ax=sx(L[0].x), ay=sy(L[0].y), bx=sx(L[9].x), by=sy(L[9].y);
  if (!fin(ax)||!fin(ay)||!fin(bx)||!fin(by)){ h.on=false; h.armed=false; return; }
  var span=Math.hypot(bx-ax,by-ay);
  if (!fin(span)||span<1) span=1;
  h.span=span;
  h.x=ax*0.36+bx*0.64; h.y=ay*0.36+by*0.64;
  var uw=wx(L[0].x)*0.36+wx(L[9].x)*0.64;
  var uh=wy(L[0].y)*0.36+wy(L[9].y)*0.64;
  h.wxp=fin(uw)?uw:PW*0.5; h.wyp=fin(uh)?uh:PH*0.5;
  // PINCH is a RATIO against the hand's own span, both measured in the same
  // aspect-correct screen space — never in raw normalised units.
  var tx=sx(L[4].x), ty=sy(L[4].y), ix=sx(L[8].x), iy=sy(L[8].y);
  if (fin(tx)&&fin(ty)&&fin(ix)&&fin(iy)) h.pinch=clamp(1-(Math.hypot(ix-tx,iy-ty)/span-0.40)/0.46,0,1);
  else h.pinch=0;
  h.on=true; h.t=t;
}
function handLive(h){ return h.on && (now()-h.t)<LOST_S; }
function onHands(res){
  var t=now();
  layout();
  var mh=res?res.multiHandLandmarks:null;
  var k=(mh&&typeof mh.length==='number')?Math.min(mh.length,2):0;
  for (var i=0;i<2;i++){
    if (i<k) readHand(Hd[i],mh[i],t);
    else if (Hd[i].on && (t-Hd[i].t)>=LOST_S){ Hd[i].on=false; Hd[i].armed=false; }
  }
}
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0, selfieMode:false,
                       minDetectionConfidence:0.55, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  WORK BUFFER + BLUR PYRAMID
// ═══════════════════════════════════════════════════════════════════════
var work=document.createElement('canvas');
var wctx=work?work.getContext('2d'):null;
var PW=0,PH=0,NPX=0;
var LV=null, TMP=null, OUT=null, OUTD=null;
var LONG=224;
var STEPS=[144,168,192,224,256,288,320];
var stepIdx=3;

function allocProc(){
  var lng=STEPS[clamp(stepIdx,0,STEPS.length-1)];
  var pw,ph;
  if (camAspect>=1){ pw=lng; ph=Math.max(8,Math.round(lng/camAspect)); }
  else { ph=lng; pw=Math.max(8,Math.round(lng*camAspect)); }
  if (pw===PW&&ph===PH&&LV) return;
  PW=pw; PH=ph; NPX=PW*PH; LONG=lng;
  work.width=PW; work.height=PH;
  LV=[null,null,null,null];
  for (var i=0;i<4;i++) LV[i]=new Uint8ClampedArray(NPX*4);
  TMP=new Uint8ClampedArray(NPX*4);
  if (wctx&&wctx.createImageData){
    OUT=wctx.createImageData(PW,PH);
    OUTD=OUT.data;
  }
}

// separable box blur, running sums, RGB only (alpha is always opaque)
function boxBlur(src,dst,w,h,r){
  if (r<1) r=1;
  var win=r*2+1, inv=1/win;
  var x,y,o,c,s0,s1,s2,row,i0,i1;
  // horizontal → TMP
  for (y=0;y<h;y++){
    row=y*w*4;
    s0=0;s1=0;s2=0;
    for (x=-r;x<=r;x++){
      c=row+(clamp(x,0,w-1)<<2);
      s0+=src[c]; s1+=src[c+1]; s2+=src[c+2];
    }
    for (x=0;x<w;x++){
      o=row+(x<<2);
      TMP[o]=s0*inv; TMP[o+1]=s1*inv; TMP[o+2]=s2*inv; TMP[o+3]=255;
      i0=row+(clamp(x-r,0,w-1)<<2);
      i1=row+(clamp(x+r+1,0,w-1)<<2);
      s0+=src[i1]-src[i0]; s1+=src[i1+1]-src[i0+1]; s2+=src[i1+2]-src[i0+2];
    }
  }
  // vertical → dst
  var stride=w*4;
  for (x=0;x<w;x++){
    var col=x<<2;
    s0=0;s1=0;s2=0;
    for (y=-r;y<=r;y++){
      c=col+clamp(y,0,h-1)*stride;
      s0+=TMP[c]; s1+=TMP[c+1]; s2+=TMP[c+2];
    }
    for (y=0;y<h;y++){
      o=col+y*stride;
      dst[o]=s0*inv; dst[o+1]=s1*inv; dst[o+2]=s2*inv; dst[o+3]=255;
      i0=col+clamp(y-r,0,h-1)*stride;
      i1=col+clamp(y+r+1,0,h-1)*stride;
      s0+=TMP[i1]-TMP[i0]; s1+=TMP[i1+1]-TMP[i0+1]; s2+=TMP[i1+2]-TMP[i0+2];
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE PLANE OF FOCUS
// ═══════════════════════════════════════════════════════════════════════
var plMX=0, plMY=0, plTh=0;            // midpoint (work px) + angle (rad)
var tgMX=0, tgMY=0, tgTh=0;
var planeVel=0, planeInit=false;
var locked=false, lockPop=0, lockT=-9;
var mode=0, ballCount=0, splatStride=3;
var sharpFrac=0;
var cocLUT=new Float32Array(768);
var gLUT=new Uint8ClampedArray(256);

function buildGrade(){
  for (var i=0;i<256;i++){
    var v=i/255;
    v=clamp(0.5+(v-0.5)*1.16,0,1);      // gentle contrast, the miniature look
    v=Math.pow(v,0.96);                  // lift the toe a touch
    gLUT[i]=Math.round(v*255);
  }
}
buildGrade();

function apVal(){ return apEl?clamp((+apEl.value||0)/100,0,1):0.66; }
function bandVal(){ return bandEl?clamp((+bandEl.value||0)/100,0,1):0.34; }

function buildCoc(){
  var shortEdge=Math.max(8,Math.min(PW,PH));
  var band=lerp(0.012,0.30,bandVal())*shortEdge;         // half-width, short edge
  var ap=apVal();
  var fall=lerp(0.42,0.10,ap)*shortEdge+3;               // wide open = abrupt
  var maxC=lerp(1.25,3.0,ap);
  for (var i=0;i<768;i++){
    var d=i;
    var u=clamp((d-band)/fall,0,1);
    cocLUT[i]=clamp(Math.pow(u,0.82)*maxC,0,3);
  }
  return band;
}

function planeTargets(t){
  var a=handLive(Hd[0]), b=handLive(Hd[1]);
  if (locked) return;
  if (a&&b){
    tgMX=(Hd[0].wxp+Hd[1].wxp)*0.5;
    tgMY=(Hd[0].wyp+Hd[1].wyp)*0.5;
    var dx=Hd[1].wxp-Hd[0].wxp, dy=Hd[1].wyp-Hd[0].wyp;
    if (Math.hypot(dx,dy)>PW*0.06){
      var th=Math.atan2(dy,dx);
      // the rail is a line, not a ray: fold to ±90° so swapping which hand
      // the model reports first cannot flip the plane end over end
      while (th>Math.PI/2) th-=Math.PI;
      while (th<-Math.PI/2) th+=Math.PI;
      tgTh=th;
    }
  } else if (a||b){
    var h=a?Hd[0]:Hd[1];
    tgMX=PW*0.5; tgMY=h.wyp; tgTh=0;            // shift only, no tilt
  } else {
    tgMX=PW*0.5;
    tgMY=PH*(0.56+0.05*Math.sin(t*0.42));
    tgTh=0.035*Math.sin(t*0.27);
  }
}

function updatePlane(dt,t){
  planeTargets(t);
  if (!planeInit){ plMX=tgMX; plMY=tgMY; plTh=tgTh; planeInit=true; }
  var px=plMX, py=plMY;
  plMX=chase(plMX,tgMX,11,dt);
  plMY=chase(plMY,tgMY,11,dt);
  var dth=tgTh-plTh;
  while (dth>Math.PI/2) dth-=Math.PI;
  while (dth<-Math.PI/2) dth+=Math.PI;
  plTh=plTh+dth*(1-Math.exp(-9*clamp(dt,0,0.2)));
  if (!fin(plMX)) plMX=PW*0.5;
  if (!fin(plMY)) plMY=PH*0.5;
  if (!fin(plTh)) plTh=0;
  var v=(dt>1e-4)?Math.hypot(plMX-px,plMY-py)/dt:0;
  planeVel=chase(planeVel,fin(v)?v:0,8,dt);
  lockPop=Math.max(0,lockPop-dt*7);
}

// ═══════════════════════════════════════════════════════════════════════
//  THE FILTER
// ═══════════════════════════════════════════════════════════════════════
function renderFrame(){
  if (!wctx||!OUTD||!LV) return false;
  var vw=video?video.videoWidth:0, vh=video?video.videoHeight:0;
  if (!(vw>0&&vh>0)) return false;
  // draw the camera into the square-pixel work buffer, mirrored if needed,
  // so everything downstream shares one coordinate system
  wctx.save();
  if (mirror){ wctx.translate(PW,0); wctx.scale(-1,1); }
  try{ wctx.drawImage(video,0,0,PW,PH); }catch(e){ wctx.restore(); return false; }
  wctx.restore();

  var img;
  try{ img=wctx.getImageData(0,0,PW,PH); }catch(e){ return false; }
  var src=img.data;
  if (!src||src.length<NPX*4) return false;

  var sc=LONG/224;
  var r1=Math.max(1,Math.round(2*sc));
  var r2=Math.max(2,Math.round(4*sc));
  var r3=Math.max(3,Math.round(8*sc));
  var L0=LV[0];
  L0.set(src);
  boxBlur(L0,LV[1],PW,PH,r1);
  boxBlur(LV[1],LV[2],PW,PH,r2);
  boxBlur(LV[2],LV[3],PW,PH,r3);

  buildCoc();
  var nx=-Math.sin(plTh), ny=Math.cos(plTh);   // unit normal of the rail
  var mx=plMX, my=plMY;
  var sat=1.18;
  var sharp=0;
  var L1=LV[1], L2=LV[2], L3=LV[3];
  var x,y,o,c,i0,f,a,b,r,g,bl,lum;

  for (y=0;y<PH;y++){
    var rowBase=y*ny - mx*nx - my*ny;
    var ro=y*PW*4;
    for (x=0;x<PW;x++){
      o=ro+(x<<2);
      var d=x*nx+rowBase;
      if (d<0) d=-d;
      var di=d|0; if (di>767) di=767;
      c=cocLUT[di];
      if (c<0.35) sharp++;
      i0=c|0; if (i0>2) i0=2;
      f=c-i0;
      a=(i0===0)?L0:(i0===1?L1:L2);
      b=(i0===0)?L1:(i0===1?L2:L3);
      r=a[o]+(b[o]-a[o])*f;
      g=a[o+1]+(b[o+1]-a[o+1])*f;
      bl=a[o+2]+(b[o+2]-a[o+2])*f;
      lum=(r*77+g*150+bl*29)*0.00390625;
      OUTD[o]=gLUT[clamp(lum+(r-lum)*sat,0,255)|0];
      OUTD[o+1]=gLUT[clamp(lum+(g-lum)*sat,0,255)|0];
      OUTD[o+2]=gLUT[clamp(lum+(bl-lum)*sat,0,255)|0];
      OUTD[o+3]=255;
    }
  }
  sharpFrac=sharp/Math.max(1,NPX);
  wctx.putImageData(OUT,0,0);

  // ── the signature: highlights become aperture-shaped discs ───────────
  splatHighlights(src,nx,ny,mx,my);
  return true;
}

var APCAP=420;
function splatHighlights(src,nx,ny,mx,my){
  var ap=apVal();
  var shortEdge=Math.max(8,Math.min(PW,PH));
  var maxR=lerp(0.018,0.070,ap)*shortEdge;
  var thr=lerp(214,150,ap);
  var ss=clamp(splatStride|0,2,14);
  var hits=0, drawn=0;
  wctx.save();
  wctx.globalCompositeOperation='lighter';
  for (var y=1;y<PH;y+=ss){
    var rowBase=y*ny - mx*nx - my*ny;
    for (var x=1;x<PW;x+=ss){
      var o=(y*PW+x)<<2;
      var r=src[o], g=src[o+1], b=src[o+2];
      var lum=(r*77+g*150+b*29)*0.00390625;
      if (lum<thr) continue;
      var d=x*nx+rowBase; if (d<0) d=-d;
      var di=d|0; if (di>767) di=767;
      var c=cocLUT[di];
      if (c<0.5) continue;
      hits++;
      if (drawn>=APCAP) continue;
      drawn++;
      var rad=maxR*(c/3)*(0.55+0.45*(lum-thr)/(255-thr+1));
      if (!(rad>0.6)) continue;
      var al=clamp(0.10+0.24*(lum-thr)/(255-thr+1),0,0.42)*lerp(0.55,1,ap);
      drawAperture(wctx,x,y,rad,r,g,b,al);
    }
  }
  wctx.restore();
  ballCount=drawn;
  // adapt the scan stride so the next frame lands near the cap — this also
  // keeps the splats spatially even instead of crowding the top-left
  var want=Math.sqrt(Math.max(1,hits)/APCAP)*ss;
  splatStride=clamp(Math.round(chase(splatStride,clamp(want,2,14),6,0.2)),2,14);
}

function drawAperture(g,x,y,rad,r,gr,b,al){
  var col='rgba('+(r|0)+','+(gr|0)+','+(b|0)+','+al.toFixed(3)+')';
  g.fillStyle=col;
  if (mode===1){
    g.beginPath();
    for (var i=0;i<6;i++){
      var a=i*TAU/6 - Math.PI/2;
      var px=x+Math.cos(a)*rad, py=y+Math.sin(a)*rad;
      if (i===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.closePath(); g.fill();
    g.strokeStyle='rgba('+(r|0)+','+(gr|0)+','+(b|0)+','+Math.min(0.5,al*1.7).toFixed(3)+')';
    g.lineWidth=Math.max(0.5,rad*0.16); g.stroke();
  } else if (mode===2){
    // catadioptric: an annulus, the mirror-lens doughnut
    g.beginPath(); g.arc(x,y,rad,0,TAU);
    g.strokeStyle=col; g.lineWidth=Math.max(0.7,rad*0.42); g.stroke();
    g.beginPath(); g.arc(x,y,rad*0.99,0,TAU);
    g.strokeStyle='rgba('+(r|0)+','+(gr|0)+','+(b|0)+','+Math.min(0.5,al*1.2).toFixed(3)+')';
    g.lineWidth=Math.max(0.4,rad*0.1); g.stroke();
  } else {
    g.beginPath(); g.arc(x,y,rad,0,TAU); g.fill();
    g.beginPath(); g.arc(x,y,rad*0.93,0,TAU);
    g.strokeStyle='rgba('+(r|0)+','+(gr|0)+','+(b|0)+','+Math.min(0.5,al*1.35).toFixed(3)+')';
    g.lineWidth=Math.max(0.4,rad*0.14); g.stroke();
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ the sound of a focusing screen, and nothing else
//
//  Deliberately near-silent and entirely tied to the mechanic:
//    ・ground-glass hiss whose BAND tracks how much of the frame is sharp
//    ・a rack whoosh whose level tracks how fast the plane is travelling
//    ・a leaf-shutter click on lock and unlock
//  Off by default; the 音 button arms it.
// ═══════════════════════════════════════════════════════════════════════
var ac=null, comp=null, master=null, audioOK=false, sndOn=false;
var hissG=null, hissBP=null, rackG=null, rackLP=null, noiseBuf=null;
function makeNoise(){
  var sr=ac.sampleRate, len=Math.floor(sr*1.2);
  var buf=ac.createBuffer(1,len,sr);
  var d=buf.getChannelData(0);
  for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function initAudio(){
  if (audioOK) return true;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return false;
  try{
    ac=new AC();
    comp=ac.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=4;
    comp.attack.value=0.004; comp.release.value=0.22;
    master=ac.createGain(); master.gain.value=0;
    comp.connect(master); master.connect(ac.destination);
    noiseBuf=makeNoise();

    var hs=ac.createBufferSource(); hs.buffer=noiseBuf; hs.loop=true;
    hissBP=ac.createBiquadFilter(); hissBP.type='bandpass';
    hissBP.frequency.value=2400; hissBP.Q.value=0.8;
    hissG=ac.createGain(); hissG.gain.value=0.05;
    hs.connect(hissBP); hissBP.connect(hissG); hissG.connect(comp);

    var rs=ac.createBufferSource(); rs.buffer=noiseBuf; rs.loop=true;
    rackLP=ac.createBiquadFilter(); rackLP.type='lowpass';
    rackLP.frequency.value=700; rackLP.Q.value=1.1;
    rackG=ac.createGain(); rackG.gain.value=0;
    rs.connect(rackLP); rackLP.connect(rackG); rackG.connect(comp);

    try{ hs.start(); rs.start(); }catch(e){}
    audioOK=true;
    return true;
  }catch(e){ ac=null; audioOK=false; return false; }
}
function setSound(on){
  sndOn=!!on;
  if (sndBtn){ sndBtn.className=sndOn?'on':''; sndBtn.textContent=sndOn?'音 ON':'音 OFF'; }
  if (!audioOK||!master) return;
  try{ master.gain.setTargetAtTime(sndOn?0.5:0,ac.currentTime,0.08); }catch(e){}
}
if (sndBtn) sndBtn.addEventListener('click',function(){ setSound(!sndOn); });

function audioFrame(){
  if (!audioOK||!sndOn||!ac) return;
  var t=ac.currentTime;
  var f=clamp(1100+sharpFrac*4200,200,9000);
  try{ hissBP.frequency.setTargetAtTime(fin(f)?f:2400,t,0.12); }catch(e){}
  var hg=clamp(0.025+sharpFrac*0.055,0,0.12);
  try{ hissG.gain.setTargetAtTime(fin(hg)?hg:0.04,t,0.15); }catch(e){}
  var v=clamp(planeVel/(Math.max(8,Math.min(PW,PH))*0.9),0,1);
  var rg=clamp(v*0.20,0,0.22);
  try{ rackG.gain.setTargetAtTime(fin(rg)?rg:0,t,0.06); }catch(e){}
  var rf=clamp(360+v*2600,120,7000);
  try{ rackLP.frequency.setTargetAtTime(fin(rf)?rf:500,t,0.07); }catch(e){}
}
function playShutter(up){
  if (!audioOK||!sndOn||!ac||!noiseBuf) return;
  var t=ac.currentTime;
  try{
    var s=ac.createBufferSource(); s.buffer=noiseBuf;
    var bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=up?3100:2200; bp.Q.value=2.4;
    var g=ac.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.5,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.0008,t+0.055);
    s.connect(bp); bp.connect(g); g.connect(comp);
    s.start(t,Math.random()*0.5,0.08); s.stop(t+0.09);
    var o=ac.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(up?1760:1320,t);
    var og=ac.createGain();
    og.gain.setValueAtTime(0,t);
    og.gain.linearRampToValueAtTime(0.10,t+0.002);
    og.gain.exponentialRampToValueAtTime(0.0006,t+0.11);
    o.connect(og); og.connect(comp);
    o.start(t); o.stop(t+0.14);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  LOCK
// ═══════════════════════════════════════════════════════════════════════
// The lock toggles on the RISING edge of a pinch, and a hand has to be
// seen OPEN before it may toggle again. That second rule is what stops a
// hand that vanished mid-pinch — or one that walks back into frame with
// the fingers already together — from flipping the lock the instant the
// model reacquires it.
function pollPinch(t){
  for (var i=0;i<2;i++){
    var h=Hd[i];
    if (!handLive(h)){ h.armed=false; continue; }
    if (h.pinch<0.42){ h.armed=true; continue; }
    if (h.pinch>0.68 && h.armed && (t-lockT)>0.34){
      h.armed=false;
      locked=!locked;
      lockPop=1; lockT=t;
      playShutter(locked);
    }
  }
}

function setMode(i){
  mode=clamp(i|0,0,2);
  for (var k=0;k<3;k++) if (mBtn[k]) mBtn[k].className=(k===mode)?'on':'';
}
for (var mi=0; mi<3; mi++) (function(i){
  if (mBtn[i]) mBtn[i].addEventListener('click',function(){ setMode(i); });
})(mi);

// ═══════════════════════════════════════════════════════════════════════
//  GROUND GLASS
// ═══════════════════════════════════════════════════════════════════════
function buildGlass(){
  var c=document.createElement('canvas');
  c.width=128; c.height=128;
  var g=c.getContext('2d');
  if (!g) return null;
  g.fillStyle='#eceae1'; g.fillRect(0,0,128,128);
  for (var i=0;i<2600;i++){
    var x=Math.random()*128, y=Math.random()*128;
    var v=Math.random();
    g.fillStyle=(v<0.5)?'rgba(255,255,255,.55)':'rgba(160,166,160,.16)';
    g.fillRect(x,y,1,1);
  }
  for (var k=0;k<120;k++){
    g.strokeStyle='rgba(180,186,180,.10)'; g.lineWidth=0.6;
    var a=Math.random()*Math.PI, r=3+Math.random()*9;
    var x0=Math.random()*128, y0=Math.random()*128;
    g.beginPath(); g.moveTo(x0,y0); g.lineTo(x0+Math.cos(a)*r,y0+Math.sin(a)*r); g.stroke();
  }
  return c;
}
function drawGlass(){
  if (!glassTile) glassTile=buildGlass();
  if (glassTile){
    var pat=ctx.createPattern(glassTile,'repeat');
    if (pat){ ctx.fillStyle=pat; ctx.fillRect(0,0,W,H); }
    else { ctx.fillStyle='#eceae1'; ctx.fillRect(0,0,W,H); }
  } else { ctx.fillStyle='#eceae1'; ctx.fillRect(0,0,W,H); }
  var lg=ctx.createLinearGradient(0,0,0,H);
  lg.addColorStop(0,'rgba(255,255,255,.34)');
  lg.addColorStop(1,'rgba(180,186,180,.14)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
}
function drawScreenMarks(){
  var g=ctx;
  // the frame
  g.strokeStyle='rgba(36,39,42,.55)'; g.lineWidth=1.4;
  g.strokeRect(imgX-0.5,imgY-0.5,imgW+1,imgH+1);
  g.strokeStyle='rgba(154,123,63,.5)'; g.lineWidth=1;
  g.strokeRect(imgX-5.5,imgY-5.5,imgW+11,imgH+11);
  // engraved eighth grid + thirds, ON the image
  g.save();
  g.beginPath(); g.rect(imgX,imgY,imgW,imgH); g.clip();
  g.lineWidth=1;
  var i;
  g.strokeStyle='rgba(243,241,234,.13)';
  for (i=1;i<8;i++){
    g.beginPath(); g.moveTo(imgX+imgW*i/8,imgY); g.lineTo(imgX+imgW*i/8,imgY+imgH); g.stroke();
    g.beginPath(); g.moveTo(imgX,imgY+imgH*i/8); g.lineTo(imgX+imgW,imgY+imgH*i/8); g.stroke();
  }
  g.strokeStyle='rgba(243,241,234,.26)';
  for (i=1;i<3;i++){
    g.beginPath(); g.moveTo(imgX+imgW*i/3,imgY); g.lineTo(imgX+imgW*i/3,imgY+imgH); g.stroke();
    g.beginPath(); g.moveTo(imgX,imgY+imgH*i/3); g.lineTo(imgX+imgW,imgY+imgH*i/3); g.stroke();
  }
  g.restore();
  // corner fiducials, outside the frame
  var s=Math.max(9,MN*0.022);
  var pts=[[imgX-9,imgY-9],[imgX+imgW+9,imgY-9],[imgX-9,imgY+imgH+9],[imgX+imgW+9,imgY+imgH+9]];
  g.strokeStyle='rgba(36,39,42,.4)'; g.lineWidth=1;
  for (i=0;i<4;i++){
    g.beginPath(); g.moveTo(pts[i][0]-s,pts[i][1]); g.lineTo(pts[i][0]+s,pts[i][1]); g.stroke();
    g.beginPath(); g.moveTo(pts[i][0],pts[i][1]-s); g.lineTo(pts[i][0],pts[i][1]+s); g.stroke();
  }
  g.fillStyle='rgba(36,39,42,.42)';
  g.font='500 '+Math.round(clamp(MN*0.021,9,13))+'px Jost, sans-serif';
  g.textAlign='left'; g.textBaseline='bottom';
  g.fillText('GROUND GLASS  ·  '+PW+'×'+PH, imgX, imgY-11);
  g.textAlign='right';
  g.fillText(['円 CIRCLE','六角 HEXAGON','環 ANNULUS'][mode], imgX+imgW, imgY-11);
}

function drawRail(){
  var g=ctx;
  if (!(PW>0&&PH>0)) return;
  var sxp=imgW/PW, syp=imgH/PH;
  var cx=imgX+plMX*sxp, cy=imgY+plMY*syp;
  var dx=Math.cos(plTh), dy=Math.sin(plTh);
  var L=Math.hypot(imgW,imgH);
  var band=lerp(0.012,0.30,bandVal())*Math.min(PW,PH)*syp;
  var pop=1+lockPop*0.06;
  var accent=locked?'47,93,140':'154,123,63';
  g.save();
  // the in-focus band
  g.globalAlpha=0.16;
  g.strokeStyle='rgb('+accent+')';
  g.lineWidth=Math.max(1,band*2*pop);
  g.beginPath(); g.moveTo(cx-dx*L,cy-dy*L); g.lineTo(cx+dx*L,cy+dy*L); g.stroke();
  g.globalAlpha=1;
  // the rail
  g.strokeStyle='rgba('+accent+',.9)';
  g.lineWidth=1.6*pop;
  g.beginPath(); g.moveTo(cx-dx*L,cy-dy*L); g.lineTo(cx+dx*L,cy+dy*L); g.stroke();
  g.setLineDash([3,6]);
  g.strokeStyle='rgba('+accent+',.42)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(cx-dx*L-(-dy)*band,cy-dy*L-dx*band); g.lineTo(cx+dx*L-(-dy)*band,cy+dy*L-dx*band); g.stroke();
  g.beginPath(); g.moveTo(cx-dx*L+(-dy)*band,cy-dy*L+dx*band); g.lineTo(cx+dx*L+(-dy)*band,cy+dy*L+dx*band); g.stroke();
  g.setLineDash([]);
  // the knob at the centre of the movement
  var kr=Math.max(5,MN*0.014)*pop;
  g.beginPath(); g.arc(cx,cy,kr,0,TAU);
  g.fillStyle='rgba(243,241,234,.92)'; g.fill();
  g.strokeStyle='rgb('+accent+')'; g.lineWidth=1.8; g.stroke();
  if (locked){
    g.beginPath(); g.arc(cx,cy,kr*0.42,0,TAU);
    g.fillStyle='rgb('+accent+')'; g.fill();
  }
  g.restore();
}

function drawHands(){
  var g=ctx;
  for (var i=0;i<2;i++){
    var h=Hd[i];
    if (!handLive(h)) continue;
    var r=Math.max(9,MN*0.026);
    g.beginPath(); g.arc(h.x,h.y,r,0,TAU);
    g.fillStyle='rgba(243,241,234,.30)'; g.fill();
    g.strokeStyle=locked?'rgba(47,93,140,.85)':'rgba(154,123,63,.9)';
    g.lineWidth=2; g.stroke();
    g.beginPath(); g.arc(h.x,h.y,r*(1+h.pinch*0.55),0,TAU);
    g.strokeStyle='rgba(243,241,234,'+(0.25+h.pinch*0.6).toFixed(3)+')';
    g.lineWidth=1.4; g.stroke();
  }
  if (handLive(Hd[0])&&handLive(Hd[1])){
    g.beginPath(); g.moveTo(Hd[0].x,Hd[0].y); g.lineTo(Hd[1].x,Hd[1].y);
    g.strokeStyle='rgba(243,241,234,.5)'; g.lineWidth=1.2;
    g.setLineDash([2,5]); g.stroke(); g.setLineDash([]);
  }
}

function drawHint(t){
  if (handLive(Hd[0])||handLive(Hd[1])) return;
  var g=ctx;
  var a=0.42+0.2*Math.sin(t*2.1);
  g.fillStyle='rgba(36,39,42,'+a.toFixed(3)+')';
  g.font='600 '+Math.round(clamp(MN*0.036,13,21))+'px "Shippori Mincho", serif';
  g.textAlign='center'; g.textBaseline='top';
  g.fillText('両手をかざすと、その線がピント面になります', W/2, imgY+imgH+12);
}

// ═══════════════════════════════════════════════════════════════════════
//  FRAME
// ═══════════════════════════════════════════════════════════════════════
var started=false, last=0, costS=16, readAcc=0, haveImage=false;

function draw(t){
  drawGlass();
  if (haveImage){
    ctx.save();
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(work,imgX,imgY,imgW,imgH);
    ctx.restore();
  } else {
    ctx.fillStyle='rgba(207,214,210,.55)';
    ctx.fillRect(imgX,imgY,imgW,imgH);
  }
  drawScreenMarks();
  drawRail();
  drawHands();
  drawHint(t);
}

function updateRead(){
  readAcc++;
  if (readAcc<8) return;
  readAcc=0;
  // a nominal f-number, purely as a readout of the 絞り control
  var stops=[22,16,11,8,5.6,4,2.8,2,1.4];
  var idx=clamp(Math.round((1-apVal())*(stops.length-1)),0,stops.length-1);
  if (rF) rF.textContent='f/'+stops[idx];
  if (rBall) rBall.textContent=String(ballCount);
  if (rLock) rLock.innerHTML=locked?'<span class="lk">固定</span>':'';
}

function frame(){
  var t=now();
  var dt=clamp(t-last,0,0.1);
  last=t;
  if (started){
    var t0=now();
    layout();
    allocProc();
    pollPinch(t);
    updatePlane(dt,t);
    haveImage=renderFrame();
    audioFrame();
    updateRead();
    // adaptive resolution: measure, then step one notch at a time
    var cost=(now()-t0)*1000;
    costS=costS+(cost-costS)*0.09;
    if (costS>27&&stepIdx>0){ stepIdx--; costS=18; }
    else if (costS<13&&stepIdx<STEPS.length-1){ stepIdx++; costS=18; }
  }
  draw(t);
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoT=0;
function demoFrame(){
  if (!demoCtx) return;
  var g=demoCtx, DWd=demoCv.width, DHt=demoCv.height;
  demoT+=1/60;
  g.fillStyle='#dfded6'; g.fillRect(0,0,DWd,DHt);
  // a field of "lights" that go in and out of focus as the plane tilts
  var th=0.42*Math.sin(demoT*0.85);
  var my=DHt*0.5+18*Math.sin(demoT*0.6);
  var nx=-Math.sin(th), ny=Math.cos(th);
  var i,j;
  for (j=0;j<7;j++){
    for (i=0;i<17;i++){
      var x=22+i*(DWd-44)/16, y=26+j*(DHt-72)/6;
      var d=Math.abs((x-DWd/2)*nx+(y-my)*ny);
      var c=Math.min(1,Math.max(0,(d-16)/70));
      var rad=2.2+c*13;
      var al=0.85-c*0.55;
      g.fillStyle='rgba(154,123,63,'+(al*0.5).toFixed(3)+')';
      g.beginPath(); g.arc(x,y,rad,0,TAU); g.fill();
      if (c>0.25){
        g.strokeStyle='rgba(154,123,63,'+(al*0.7).toFixed(3)+')';
        g.lineWidth=Math.max(0.5,rad*0.16);
        g.beginPath(); g.arc(x,y,rad*0.92,0,TAU); g.stroke();
      }
    }
  }
  // the rail and the two hands
  var L=DWd;
  g.strokeStyle='rgba(36,39,42,.8)'; g.lineWidth=1.6;
  g.beginPath();
  g.moveTo(DWd/2-Math.cos(th)*L,my-Math.sin(th)*L);
  g.lineTo(DWd/2+Math.cos(th)*L,my+Math.sin(th)*L);
  g.stroke();
  var hx=[DWd/2-Math.cos(th)*150, DWd/2+Math.cos(th)*150];
  var hy=[my-Math.sin(th)*150, my+Math.sin(th)*150];
  for (i=0;i<2;i++){
    g.beginPath(); g.arc(hx[i],hy[i],14,0,TAU);
    g.fillStyle='rgba(243,241,234,.85)'; g.fill();
    g.strokeStyle='#9a7b3f'; g.lineWidth=2.2; g.stroke();
  }
  g.fillStyle='rgba(36,39,42,.7)';
  g.font='600 15px "Shippori Mincho", serif'; g.textAlign='center';
  g.fillText('手を傾ければ、ピント面も傾く',DWd/2,DHt-13);
  if (demoRun && typeof requestAnimationFrame==='function') requestAnimationFrame(demoFrame);
}
if (demoCtx) demoFrame();

// ═══════════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════════
startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  setSound(false);
  startSheet.classList.add('gone');
  initHands();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
layout();
allocProc();
setMode(0);
last=now();
frame();
</script>
