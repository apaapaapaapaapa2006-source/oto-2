<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

const video = document.getElementById('video');
const vignette = document.getElementById('vignette');
const panelsCanvas = document.getElementById('panels');
const overlayCanvas = document.getElementById('overlay');
const pCtx = panelsCanvas.getContext('2d');
const oCtx = overlayCanvas.getContext('2d');
const startBtn = document.getElementById('start');
const infoEl = document.getElementById('info');
const snapBtn = document.getElementById('snap');
const clearBtn = document.getElementById('clear');
const layoutBtn = document.getElementById('layout');
const modeBtn = document.getElementById('mode');
const muteBtn = document.getElementById('mute');
const colorModeBtn = document.getElementById('colorMode');
const errEl = document.getElementById('err');

let handLandmarker = null;
let running = false;
let mode = 0; // 0: normal, 1: heavy glitch, 2: minimal
const modeNames = ['通常', 'グリッチ強', 'ミニマル'];

// 映像の色合い: 0=カラー, 1=モノクロ, 2=セピア
// 手のグラフィックは別canvas(#overlay)に描いているのでこのフィルターの影響を受けず、
// モノクロ/セピア時はネオングリーン/レッドがくっきり浮かぶ。
let colorMode = 0;
const colorModeNames = ['カラー', 'モノクロ', 'セピア'];
const colorModeFilters = [
  { normal: 'none',                                    active: 'saturate(0.75) brightness(0.82) contrast(1.05)' },
  { normal: 'grayscale(1) contrast(1.08)',              active: 'grayscale(1) brightness(0.8) contrast(1.18)' },
  { normal: 'sepia(0.75) saturate(1.35) contrast(1.05)', active: 'sepia(0.9) saturate(1.5) brightness(0.78) contrast(1.1)' }
];
function updateVideoFilter(bothHands) {
  const f = colorModeFilters[colorMode];
  video.style.filter = bothHands ? f.active : f.normal;
}
updateVideoFilter(false);

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

let CW = 0, CH = 0; // 論理サイズ
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  CW = window.innerWidth;
  CH = window.innerHeight;
  for (const c of [panelsCanvas, overlayCanvas]) {
    c.width = CW * dpr;
    c.height = CH * dpr;
    c.style.width = CW + 'px';
    c.style.height = CH + 'px';
  }
  pCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  oCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function showErr(msg) {
  errEl.textContent = msg;
  errEl.style.display = 'block';
}

// ============================================================
// オーディオ
// ============================================================
let audioCtx = null, masterGain = null, muted = false;
let lastBlip = 0;
const SCALE = [0, 2, 4, 7, 9]; // ペンタトニック
const BASE_FREQ = 261.63; // C4

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.5;
  masterGain.connect(audioCtx.destination);
}

function noteFreq(degree, octave = 0) {
  const semis = SCALE[degree % SCALE.length] + 12 * (octave + Math.floor(degree / SCALE.length));
  return BASE_FREQ * Math.pow(2, semis / 12);
}

// パネル生成音: 短いブリップ(倍音付き) クールダウン付き
function blip(pan = 0) {
  if (!audioCtx || muted) return;
  const now = audioCtx.currentTime;
  const nowMs = performance.now();
  if (nowMs - lastBlip < 90) return; // 音の洪水防止
  lastBlip = nowMs;

  const degree = Math.floor(Math.random() * 8);
  const f = noteFreq(degree, 1);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.12, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

  const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
  if (panner) { panner.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(panner); panner.connect(masterGain); }
  else g.connect(masterGain);

  // 基音 + 2倍音 + 3倍音
  const partials = [[1, 1], [2, 0.4], [3, 0.15]];
  for (const [mult, amp] of partials) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f * mult;
    const og = audioCtx.createGain();
    og.gain.value = amp;
    o.connect(og); og.connect(g);
    o.start(now); o.stop(now + 0.4);
  }
}

// フリップ音: ノイズウーッシュ + コードスタブ
function flipStinger() {
  if (!audioCtx || muted) return;
  const now = audioCtx.currentTime;

  // ノイズ
  const dur = 0.25;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(400, now);
  bp.frequency.exponentialRampToValueAtTime(4000, now + dur);
  bp.Q.value = 1.2;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.25, now);
  ng.gain.exponentialRampToValueAtTime(0.001, now + dur);
  src.connect(bp); bp.connect(ng); ng.connect(masterGain);
  src.start(now);

  // コード(ルート + 3度上のスケール音 + オクターブ)
  const rootDeg = Math.floor(Math.random() * 5);
  const chord = [noteFreq(rootDeg, 0), noteFreq(rootDeg + 2, 0), noteFreq(rootDeg, 1)];
  for (const f of chord) {
    const o = audioCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
    o.connect(g); g.connect(masterGain);
    o.start(now); o.stop(now + 0.75);
  }
}

// ============================================================
// カメラ・MediaPipe
// ============================================================
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(res => video.onloadedmetadata = res);
  await video.play();
}

async function setupHandLandmarker() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
}

// カメラのミラー済み低解像度スナップ(カメラパネル用)
const camCanvas = document.createElement('canvas');
camCanvas.width = 320; camCanvas.height = 180;
const camCtx = camCanvas.getContext('2d');
let lastCamGrab = 0;
function grabCamera(now) {
  if (now - lastCamGrab < 120) return; // ~8fpsで十分
  lastCamGrab = now;
  if (video.readyState < 2) return;
  camCtx.save();
  camCtx.translate(camCanvas.width, 0);
  camCtx.scale(-1, 1);
  camCtx.drawImage(video, 0, 0, camCanvas.width, camCanvas.height);
  camCtx.restore();
}

// ============================================================
// パネル
// ============================================================
const panels = [];
const MAX_PANELS = 24;

const PALETTE_SETS = [
  { name: 'NEON',
    palettes: [['#00ff88','#003322'], ['#ff00aa','#220022'], ['#00aaff','#001144'], ['#aa00ff','#220044']],
    types: ['stripes','glitch','blocks','camera','camera'] },
  { name: 'WARM',
    palettes: [['#ffee00','#553300'], ['#ff5500','#220000'], ['#ff0044','#330011'], ['#ffaa00','#332200']],
    types: ['gradient','stripes','solid','camera'] },
  { name: 'MONO',
    palettes: [['#ffffff','#000000'], ['#cccccc','#222222'], ['#888888','#111111']],
    types: ['noise','blocks','glitch','camera','camera'] },
  { name: 'AQUA',
    palettes: [['#00ffcc','#003344'], ['#00ddff','#002244'], ['#88ffee','#114455']],
    types: ['gradient','stripes','noise','camera'] }
];
let currentSet = 0;

function makePanel() {
  const set = PALETTE_SETS[currentSet];
  const pal = set.palettes[Math.floor(Math.random() * set.palettes.length)];
  const types = set.types;
  return {
    type: types[Math.floor(Math.random() * types.length)],
    color: pal[0],
    bg: pal[1],
    seed: Math.random() * 10000,
    rotation: (Math.random() - 0.5) * 0.4,
    aspect: 0.5 + Math.random() * 1.2,
    life: 1.0,
    born: performance.now(),
    // カメラパネル用: クロップ矩形(正規化)
    cropX: Math.random() * 0.6,
    cropY: Math.random() * 0.5,
    cropW: 0.25 + Math.random() * 0.3,
    cropH: 0.3 + Math.random() * 0.35,
    tint: Math.random(), // カメラパネルの色被せ方バリエーション
    // スプリング補間の現在値(初回に初期化)
    px: null, py: null, prot: null, pw: null, ph: null
  };
}

const panelCache = new Map();
function getPanelTexture(panel, w, h) {
  const key = `${panel.type}_${panel.seed}_${Math.round(w/4)*4}_${Math.round(h/4)*4}`;
  if (panelCache.has(key)) return panelCache.get(key);
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(w));
  c.height = Math.max(2, Math.round(h));
  const ctx = c.getContext('2d');
  ctx.fillStyle = panel.bg;
  ctx.fillRect(0, 0, c.width, c.height);

  const rng = mulberry32(Math.floor(panel.seed));
  switch (panel.type) {
    case 'stripes': {
      const stripeH = 4 + rng() * 12;
      for (let y = 0; y < c.height; y += stripeH) {
        ctx.fillStyle = rng() > 0.5 ? panel.color : panel.bg;
        ctx.fillRect(0, y, c.width, stripeH);
      }
      break;
    }
    case 'noise': {
      // 低解像度ノイズを拡大(高速化)
      const nw = Math.max(2, Math.floor(c.width / 4));
      const nh = Math.max(2, Math.floor(c.height / 4));
      const nc = document.createElement('canvas');
      nc.width = nw; nc.height = nh;
      const nctx = nc.getContext('2d');
      const img = nctx.createImageData(nw, nh);
      const fg = hexToRgb(panel.color), bg = hexToRgb(panel.bg);
      for (let i = 0; i < img.data.length; i += 4) {
        const t = rng();
        img.data[i]   = t > 0.5 ? fg.r : bg.r;
        img.data[i+1] = t > 0.5 ? fg.g : bg.g;
        img.data[i+2] = t > 0.5 ? fg.b : bg.b;
        img.data[i+3] = 255;
      }
      nctx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(nc, 0, 0, c.width, c.height);
      break;
    }
    case 'blocks': {
      const cols = 4 + Math.floor(rng() * 8);
      const rows = 4 + Math.floor(rng() * 8);
      const cw = c.width / cols, ch = c.height / rows;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        ctx.fillStyle = rng() > 0.5 ? panel.color : panel.bg;
        ctx.fillRect(x * cw, y * ch, cw + 1, ch + 1);
      }
      break;
    }
    case 'glitch': {
      ctx.fillStyle = panel.color;
      ctx.fillRect(0, 0, c.width, c.height);
      const lines = 6 + Math.floor(rng() * 10);
      for (let i = 0; i < lines; i++) {
        ctx.fillStyle = rng() > 0.5 ? panel.bg : '#ffffff';
        ctx.fillRect(0, rng() * c.height, c.width, 1 + rng() * 4);
      }
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = ['#ff0044', '#00ff88', '#0088ff'][i];
        ctx.fillRect(rng() * c.width, 0, 2, c.height);
      }
      break;
    }
    case 'solid': {
      ctx.fillStyle = panel.color;
      ctx.fillRect(0, 0, c.width, c.height);
      break;
    }
    case 'gradient': {
      const g = ctx.createLinearGradient(0, 0, c.width, c.height);
      g.addColorStop(0, panel.color);
      g.addColorStop(1, panel.bg);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, c.width, c.height);
      break;
    }
  }
  if (panelCache.size > 200) {
    panelCache.delete(panelCache.keys().next().value);
  }
  panelCache.set(key, c);
  return c;
}

// カメラパネルはライブ描画(キャッシュしない)
function drawCameraPanel(panel, w, h) {
  const sx = panel.cropX * camCanvas.width;
  const sy = panel.cropY * camCanvas.height;
  const sw = Math.min(panel.cropW * camCanvas.width, camCanvas.width - sx);
  const sh = Math.min(panel.cropH * camCanvas.height, camCanvas.height - sy);
  pCtx.drawImage(camCanvas, sx, sy, sw, sh, -w/2, -h/2, w, h);
  // カラー被せ(パレット色でティント)
  if (panel.tint < 0.4) {
    pCtx.globalCompositeOperation = 'overlay';
    pCtx.fillStyle = panel.color;
    pCtx.globalAlpha *= 0.5;
    pCtx.fillRect(-w/2, -h/2, w, h);
    pCtx.globalCompositeOperation = 'source-over';
  } else if (panel.tint < 0.6) {
    // スキャンライン
    pCtx.fillStyle = 'rgba(0,0,0,0.35)';
    for (let y = -h/2; y < h/2; y += 4) pCtx.fillRect(-w/2, y, w, 1.5);
  } else if (panel.tint < 0.75) {
    pCtx.globalCompositeOperation = 'difference';
    pCtx.fillStyle = panel.color;
    pCtx.fillRect(-w/2, -h/2, w, h);
    pCtx.globalCompositeOperation = 'source-over';
  }
}

function hexToRgb(h) {
  const m = h.replace('#','');
  return { r: parseInt(m.substring(0,2),16), g: parseInt(m.substring(2,4),16), b: parseInt(m.substring(4,6),16) };
}
function mulberry32(a) {
  return function() {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// 最短角度lerp
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

// ============================================================
// 状態
// ============================================================
let leftHand = null, rightHand = null;
let lastSpawn = 0;

const LAYOUTS = ['LINE', 'STACK3D', 'COLUMN', 'CROSS', 'RING'];
const LAYOUT_NAMES = {
  LINE: '▦ 横一列', STACK3D: '🎴 3Dスタック', COLUMN: '┃ 縦一列',
  CROSS: '✕ クロス', RING: '◯ 円環'
};
let currentLayout = 0;
let prevLayout = 0;
let layoutTransition = 1;

let palmL = true, palmR = true;
let prevPalmL = true, prevPalmR = true;
let flipCooldown = 0;

// フリップバースト(画面グリッチ) 0〜1
let burstT = 0;

// パーティクル
const particles = [];

function isPalmFacing(landmarks, handednessLabel) {
  const p0 = landmarks[0], p5 = landmarks[5], p17 = landmarks[17];
  const cross = (p5.x - p0.x) * (p17.y - p0.y) - (p5.y - p0.y) * (p17.x - p0.x);
  if (handednessLabel === 'Right') return cross < 0;
  return cross > 0;
}

function palmCenter(landmarks) {
  const idx = [0, 5, 9, 13, 17];
  let x = 0, y = 0;
  for (const i of idx) { x += landmarks[i].x; y += landmarks[i].y; }
  return { x: x / idx.length, y: y / idx.length };
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2,
      size: 3 + Math.random() * 8,
      color,
      rot: Math.random() * Math.PI,
      vrot: (Math.random() - 0.5) * 0.3,
      life: 1
    });
  }
}

function onFlip(cx, cy) {
  currentSet = (currentSet + 1) % PALETTE_SETS.length;
  prevLayout = currentLayout;
  currentLayout = (currentLayout + 1) % LAYOUTS.length;
  layoutTransition = 0;
  burstT = 1;
  flipStinger();
  // パネル一斉追加
  for (let i = 0; i < 4; i++) {
    panels.push(makePanel());
    if (panels.length > MAX_PANELS) panels.shift();
  }
  // パーティクル
  const set = PALETTE_SETS[currentSet];
  for (let i = 0; i < 3; i++) {
    const pal = set.palettes[i % set.palettes.length];
    spawnParticles(cx, cy, pal[0], 8);
  }
}

// ============================================================
// 更新
// ============================================================
function update(dt, now) {
  if (leftHand && rightHand) {
    const spawnInterval = mode === 1 ? 30 : mode === 2 ? 120 : 55;
    if (now - lastSpawn > spawnInterval) {
      lastSpawn = now;
      panels.push(makePanel());
      if (panels.length > MAX_PANELS) panels.shift();
      // 生成音(パンは左右交互っぽく)
      blip((Math.random() - 0.5) * 1.4);
    }
  }
  if (layoutTransition < 1) layoutTransition = Math.min(1, layoutTransition + dt / 700);
  if (burstT > 0) burstT = Math.max(0, burstT - dt / 320);

  const decay = (leftHand && rightHand) ? 0.0002 : 0.0012;
  for (const p of panels) p.life -= dt * decay;
  for (let i = panels.length - 1; i >= 0; i--) {
    if (panels[i].life <= 0) panels.splice(i, 1);
  }

  // パーティクル更新
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += 0.25; // 重力
    pt.rot += pt.vrot;
    pt.life -= dt / 900;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
}

// ============================================================
// レイアウト計算
// ============================================================
function computeLayout(layoutName, i, n, p, c) {
  const { lx, ly, dx, dy, distance, angle, cx, cy, now } = c;
  const ti = n > 1 ? (i / (n - 1)) : 0.5;
  const margin = 0.08;

  switch (layoutName) {
    case 'LINE': {
      const t = margin + (1 - 2 * margin) * ti;
      return {
        x: lx + dx * t, y: ly + dy * t,
        rot: angle + Math.PI / 2,
        w: Math.max(6, (distance * (1 - 2 * margin)) / Math.max(n, 1) * 1.05),
        h: distance * 0.45
      };
    }
    case 'STACK3D': {
      const t = ti;
      const scale = 1 - t * 0.55;
      const drift = Math.sin(angle + Math.PI/2);
      return {
        x: lx + dx * t + Math.cos(angle + Math.PI/2) * t * distance * 0.05,
        y: ly + dy * t + drift * t * distance * 0.045,
        rot: angle + Math.PI / 2 + (p.seed % 0.3 - 0.15),
        w: distance * 0.28 * scale * p.aspect,
        h: distance * 0.42 * scale
      };
    }
    case 'COLUMN': {
      const total = distance * 1.1;
      return {
        x: cx + Math.sin(p.seed * 5 + now * 0.0008) * distance * 0.05,
        y: cy + (ti - 0.5) * total,
        rot: angle,
        w: distance * 0.55,
        h: Math.max(6, total / Math.max(n, 1) * 1.05)
      };
    }
    case 'CROSS': {
      const half = Math.max(1, Math.floor(n / 2));
      if (i % 2 === 0) {
        const t = margin + (1 - 2 * margin) * ((i / 2) / half);
        return {
          x: lx + dx * t, y: ly + dy * t,
          rot: angle + Math.PI / 2,
          w: Math.max(6, (distance * 0.85) / half * 1.05),
          h: distance * 0.4
        };
      } else {
        const t = margin + (1 - 2 * margin) * (((i - 1) / 2) / half);
        return {
          x: cx + Math.cos(angle + Math.PI/2) * (t - 0.5) * distance * 0.9,
          y: cy + Math.sin(angle + Math.PI/2) * (t - 0.5) * distance * 0.9,
          rot: angle,
          w: Math.max(6, (distance * 0.85) / half * 1.05),
          h: distance * 0.4
        };
      }
    }
    case 'RING': {
      const radius = distance * 0.45;
      const theta = angle + Math.PI / 2 + ti * Math.PI * 2 + now * 0.0002; // ゆっくり回る
      return {
        x: cx + Math.cos(theta) * radius,
        y: cy + Math.sin(theta) * radius,
        rot: theta + Math.PI / 2,
        w: distance * 0.18 * p.aspect,
        h: distance * 0.28
      };
    }
  }
  return { x: cx, y: cy, rot: 0, w: 40, h: 60 };
}

// ============================================================
// 描画
// ============================================================
function drawPanels() {
  // 残像トレイル: 前フレームを少し残す
  pCtx.save();
  pCtx.globalCompositeOperation = 'destination-out';
  pCtx.fillStyle = 'rgba(0,0,0,0.32)';
  pCtx.fillRect(0, 0, CW, CH);
  pCtx.restore();

  if (!leftHand || !rightHand) { drawPanels._spreadT = 0; return; }

  const lp = palmCenter(leftHand);
  const rp = palmCenter(rightHand);
  const lx = (1 - lp.x) * CW, ly = lp.y * CH;
  const rx = (1 - rp.x) * CW, ry = rp.y * CH;

  const dx = rx - lx, dy = ry - ly;
  const distance = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);
  const cx = (lx + rx) / 2, cy = (ly + ry) / 2;

  const screenDiag = Math.hypot(CW, CH);
  const t0 = 0.25, t1 = 0.55;
  let spreadT = (distance / screenDiag - t0) / (t1 - t0);
  spreadT = Math.max(0, Math.min(1, spreadT));
  spreadT = spreadT * spreadT * (3 - 2 * spreadT);

  const now = performance.now();
  const n = panels.length;
  const lt = layoutTransition;
  const layoutBlend = lt * lt * (3 - 2 * lt);
  const c = { lx, ly, rx, ry, dx, dy, distance, angle, cx, cy, now };

  const layoutName = LAYOUTS[currentLayout];
  const prevLayoutName = LAYOUTS[prevLayout];
  const indices = [...Array(n).keys()];
  if (layoutName === 'STACK3D' || prevLayoutName === 'STACK3D') indices.reverse();

  for (const i of indices) {
    const p = panels[i];

    // 塊
    const orbitRadius = distance * 0.18 + 20 + (i % 5) * 8;
    const orbitSpeed = 0.0006 + (i % 7) * 0.00008;
    const orbitAngle = p.seed + now * orbitSpeed;
    const clusterX = cx + Math.cos(orbitAngle) * orbitRadius * Math.cos(i * 0.7);
    const clusterY = cy + Math.sin(orbitAngle) * orbitRadius * 0.6;
    const clusterRot = orbitAngle * 0.5 + p.rotation;
    const clusterW = distance * (0.35 + Math.sin(p.seed * 1.7) * 0.15) * p.aspect;
    const clusterH = distance * (0.45 + Math.cos(p.seed * 2.3) * 0.15);

    // レイアウト補間
    const cur  = computeLayout(layoutName, i, n, p, c);
    const prev = computeLayout(prevLayoutName, i, n, p, c);
    const layoutX = prev.x * (1 - layoutBlend) + cur.x * layoutBlend;
    const layoutY = prev.y * (1 - layoutBlend) + cur.y * layoutBlend;
    const layoutR = lerpAngle(prev.rot, cur.rot, layoutBlend);
    const layoutW = prev.w * (1 - layoutBlend) + cur.w * layoutBlend;
    const layoutH = prev.h * (1 - layoutBlend) + cur.h * layoutBlend;

    // 塊⇔展開
    const tx = clusterX * (1 - spreadT) + layoutX * spreadT;
    const ty = clusterY * (1 - spreadT) + layoutY * spreadT;
    const tr = lerpAngle(clusterRot, layoutR, spreadT);
    const tw = clusterW * (1 - spreadT) + layoutW * spreadT;
    const th = clusterH * (1 - spreadT) + layoutH * spreadT;

    // スプリング補間(初回は直接)
    const k = 0.22;
    if (p.px === null) { p.px = tx; p.py = ty; p.prot = tr; p.pw = tw; p.ph = th; }
    else {
      p.px += (tx - p.px) * k;
      p.py += (ty - p.py) * k;
      p.prot = lerpAngle(p.prot, tr, k);
      p.pw += (tw - p.pw) * k;
      p.ph += (th - p.ph) * k;
    }
    const px = p.px, py = p.py, rot = p.prot, w = Math.max(2, p.pw), h = Math.max(2, p.ph);

    pCtx.save();
    pCtx.translate(px, py);
    pCtx.rotate(rot);
    pCtx.globalAlpha = Math.max(0, Math.min(1, p.life));

    // 擬似シャドウ(shadowBlurは使わない)
    pCtx.fillStyle = 'rgba(0,0,0,0.4)';
    pCtx.fillRect(-w/2 + 3, -h/2 + 5, w, h);

    if (p.type === 'camera') {
      drawCameraPanel(p, w, h);
      pCtx.globalAlpha = Math.max(0, Math.min(1, p.life)); // tintで変わった分を戻す
    } else {
      const tex = getPanelTexture(p, w, h);
      pCtx.drawImage(tex, -w/2, -h/2, w, h);
    }

    // 白フチ(元動画のカード感)
    pCtx.strokeStyle = 'rgba(255,255,255,0.9)';
    pCtx.lineWidth = 1.5;
    pCtx.strokeRect(-w/2, -h/2, w, h);

    pCtx.restore();

    // RGB splitフラッシュ(グリッチ強モード)
    if (mode === 1 && Math.random() < 0.12) {
      pCtx.save();
      pCtx.globalCompositeOperation = 'screen';
      pCtx.globalAlpha = 0.3;
      pCtx.translate(px + (Math.random() - 0.5) * 8, py);
      pCtx.rotate(rot);
      pCtx.fillStyle = '#ff0044';
      pCtx.fillRect(-w/2, -h/2, w, h);
      pCtx.restore();
    }
  }

  // 手と手をつなぐ白い線(二重ストロークで柔らかい発光感)
  pCtx.save();
  pCtx.strokeStyle = 'rgba(255,255,255,0.25)';
  pCtx.lineWidth = 4;
  pCtx.beginPath(); pCtx.moveTo(lx, ly); pCtx.lineTo(rx, ry); pCtx.stroke();
  pCtx.strokeStyle = 'rgba(255,255,255,0.9)';
  pCtx.lineWidth = 1.2;
  pCtx.beginPath(); pCtx.moveTo(lx, ly); pCtx.lineTo(rx, ry); pCtx.stroke();
  // 端点に白い玉
  for (const [x, y] of [[lx, ly], [rx, ry]]) {
    pCtx.fillStyle = '#fff';
    pCtx.beginPath(); pCtx.arc(x, y, 5, 0, Math.PI * 2); pCtx.fill();
  }
  pCtx.restore();

  // フリップバースト: パネルキャンバス自体をスライスずらし + RGB分裂
  if (burstT > 0) {
    const b = burstT;
    pCtx.save();
    // スライスずらし(自分自身をずらしコピー)
    const slices = 6;
    for (let s = 0; s < slices; s++) {
      if (Math.random() > b) continue;
      const sy = Math.random() * CH;
      const sh = 20 + Math.random() * 60;
      const off = (Math.random() - 0.5) * 60 * b;
      pCtx.drawImage(panelsCanvas,
        0, sy * (panelsCanvas.height / CH), panelsCanvas.width, sh * (panelsCanvas.height / CH),
        off, sy, CW, sh);
    }
    // RGBフリンジ
    pCtx.globalCompositeOperation = 'screen';
    pCtx.globalAlpha = 0.25 * b;
    pCtx.fillStyle = '#ff0033';
    pCtx.fillRect(-8 * b, 0, CW, CH);
    pCtx.fillStyle = '#0033ff';
    pCtx.fillRect(8 * b, 0, CW, CH);
    pCtx.restore();
  }

  drawPanels._spreadT = spreadT;
}

function drawHandOverlay() {
  oCtx.clearRect(0, 0, CW, CH);

  for (const hand of [leftHand, rightHand]) {
    if (!hand) continue;
    oCtx.strokeStyle = '#00ff66';
    oCtx.lineWidth = 2;
    oCtx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      const pa = hand[a], pb = hand[b];
      oCtx.moveTo((1 - pa.x) * CW, pa.y * CH);
      oCtx.lineTo((1 - pb.x) * CW, pb.y * CH);
    }
    oCtx.stroke();
    oCtx.fillStyle = '#ff2244';
    for (const lm of hand) {
      oCtx.beginPath();
      oCtx.arc((1 - lm.x) * CW, lm.y * CH, 3.5, 0, Math.PI * 2);
      oCtx.fill();
    }
  }

  // パーティクル
  for (const pt of particles) {
    oCtx.save();
    oCtx.translate(pt.x, pt.y);
    oCtx.rotate(pt.rot);
    oCtx.globalAlpha = Math.max(0, pt.life);
    oCtx.fillStyle = pt.color;
    oCtx.fillRect(-pt.size/2, -pt.size/2, pt.size, pt.size);
    oCtx.restore();
  }
}

// ============================================================
// メインループ
// ============================================================
let lastTime = 0;
async function loop() {
  if (!running) return;
  const now = performance.now();
  const dt = Math.min(50, now - lastTime);
  lastTime = now;

  grabCamera(now);

  if (video.readyState >= 2 && handLandmarker) {
    const res = handLandmarker.detectForVideo(video, now);
    leftHand = null; rightHand = null;
    let leftHd = null, rightHd = null;
    if (res.landmarks && res.landmarks.length > 0) {
      for (let i = 0; i < res.landmarks.length; i++) {
        const lm = res.landmarks[i];
        const hd = res.handedness?.[i]?.[0]?.categoryName;
        if (hd === 'Left') { rightHand = lm; rightHd = hd; }
        else if (hd === 'Right') { leftHand = lm; leftHd = hd; }
        else if (!leftHand) { leftHand = lm; leftHd = hd; }
        else { rightHand = lm; rightHd = hd; }
      }
    }

    if (flipCooldown > 0) flipCooldown -= dt;
    let flipped = false;
    let flipX = CW / 2, flipY = CH / 2;
    if (leftHand && leftHd) {
      const p = isPalmFacing(leftHand, leftHd);
      if (p !== prevPalmL && flipCooldown <= 0) {
        flipped = true;
        const pc = palmCenter(leftHand);
        flipX = (1 - pc.x) * CW; flipY = pc.y * CH;
      }
      prevPalmL = p; palmL = p;
    }
    if (rightHand && rightHd) {
      const p = isPalmFacing(rightHand, rightHd);
      if (p !== prevPalmR && flipCooldown <= 0) {
        flipped = true;
        const pc = palmCenter(rightHand);
        flipX = (1 - pc.x) * CW; flipY = pc.y * CH;
      }
      prevPalmR = p; palmR = p;
    }
    if (flipped) {
      onFlip(flipX, flipY);
      flipCooldown = 400;
    }
  }

  update(dt, now);
  drawPanels();
  drawHandOverlay();

  // 演出: 両手検出時はビネット + 映像を落ち着かせてパネルを主役に
  const bothHands = !!(leftHand && rightHand);
  vignette.classList.toggle('active', bothHands);
  updateVideoFilter(bothHands);

  if (bothHands) {
    const lSym = palmL ? '✋' : '🤚';
    const rSym = palmR ? '✋' : '🤚';
    const sT = drawPanels._spreadT || 0;
    let phaseLabel;
    if (sT < 0.2) phaseLabel = '🌀 集合';
    else if (sT < 0.8) phaseLabel = '✨ 展開中';
    else phaseLabel = LAYOUT_NAMES[LAYOUTS[currentLayout]];
    infoEl.textContent = `${lSym}${rSym} ${phaseLabel} [${PALETTE_SETS[currentSet].name}] パネル${panels.length}`;
  } else if (leftHand || rightHand) {
    infoEl.textContent = '片手検出中 - もう片方の手も';
  } else {
    infoEl.textContent = '手をかざしてください — クルッと返すとレイアウト+色切替';
  }

  requestAnimationFrame(loop);
}

// ============================================================
// UI
// ============================================================
snapBtn.addEventListener('click', () => {
  const dpr = window.devicePixelRatio || 1;
  const W = CW * dpr, H = CH * dpr;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  ctx.save();
  ctx.filter = video.style.filter || 'none';
  ctx.translate(W, 0);
  ctx.scale(-1, 1);
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(W / vw, H / vh);
  const dw = vw * scale, dh = vh * scale;
  ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.restore();
  ctx.drawImage(panelsCanvas, 0, 0);
  ctx.drawImage(overlayCanvas, 0, 0);
  out.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hand_glitch_${Date.now()}.png`;
    a.click();
  }, 'image/png');
});

clearBtn.addEventListener('click', () => {
  panels.length = 0;
  panelCache.clear();
});

layoutBtn.addEventListener('click', () => {
  prevLayout = currentLayout;
  currentLayout = (currentLayout + 1) % LAYOUTS.length;
  layoutTransition = 0;
  layoutBtn.textContent = LAYOUT_NAMES[LAYOUTS[currentLayout]];
});

modeBtn.addEventListener('click', () => {
  mode = (mode + 1) % 3;
  modeBtn.textContent = `モード: ${modeNames[mode]}`;
});

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇 音OFF' : '🔊 音ON';
});

colorModeBtn.addEventListener('click', () => {
  colorMode = (colorMode + 1) % colorModeFilters.length;
  colorModeBtn.textContent = `🎨 ${colorModeNames[colorMode]}`;
  updateVideoFilter(!!(leftHand && rightHand));
});

startBtn.addEventListener('click', async () => {
  startBtn.textContent = '読み込み中...';
  try {
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    await setupCamera();
    await setupHandLandmarker();
    startBtn.classList.add('hidden');
    running = true;
    lastTime = performance.now();
    loop();
  } catch (e) {
    console.error(e);
    showErr('初期化に失敗: ' + e.message);
    startBtn.innerHTML = '<div class="title">HAND//GLITCH</div>🖐 タップして開始';
  }
});
</script>
