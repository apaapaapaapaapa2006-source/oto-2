<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="両手のあいだに、映像を切り抜いたカードとグリッチの板が並ぶ。手を広げれば列に、近づければ塊に。手のひらを返すと並びと色が替わる。">
<meta name="theme-color" content="#000000">
<title>HAND//GLITCH ─ 両手のあいだに並ぶグリッチのカード</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  HAND//GLITCH ─ 両手のあいだに並ぶグリッチのカード   ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       夜の編集卓のモニター。素のカメラから始まり、切り替えると映像が沈んで、
             両手のあいだに白縁のカードが何十枚も並ぶ。カードは映像の切り抜き・
             走査線・ノイズ・色ブロック。
  PALETTE    地は映像そのもの。手の骨格は #00ff66、関節は #ff2244、カードの縁は白。
             カードの色は NEON / WARM / MONO / AQUA の四組から。
  TYPE       JetBrains Mono（計器）＋ Space Grotesk（名前）。
  MOTION     手を広げると塊がほどけて列に並び、近づけると塊に戻る（ばね補間）。
             切り替えは画面を横切るスライスずれの帯。手のひらを返すと並び方と色の組が
             替わり、画面全体がずれて RGB に割れる。
  SWITCH     はじめは素のカメラ。「▸ GLITCH」か片手を振るとエフェクトへ。
             手のひらを返す（表⇄裏）と並び方と色が替わる。手が見えないあいだは
             幻の両手がゆっくり呼吸して、カードを並べつづける。
  TECH       一枚の 2D canvas に、カメラ→色調→カード層（残像つき）→骨格を合成するので、
             録画にも全部残る。手の検出は MediaPipe HandLandmarker（動的 import、
             失敗してもボタンとタップで遊べる）。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px;text-align:center;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px),#000}

  text-shadow:-3px 0 var(--red),3px 0 #00d4ff;animation:jit 2.4s steps(1) infinite}
@keyframes jit{0%,100%{transform:none}92%{transform:translateX(4px) skewX(-8deg)}94%{transform:translateX(-3px)}96%{transform:none}}

  box-shadow:-4px 0 0 var(--red),4px 0 0 var(--acc)}

  border:1px solid #fff;border-radius:2px;background:rgba(0,0,0,.5);color:#fff;font:700 12px "JetBrains Mono",monospace;letter-spacing:.24em;

#info{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 50px);z-index:11;font:10px/1.6 "JetBrains Mono","Hiragino Sans",monospace;letter-spacing:.12em;
  color:#fff;opacity:.8;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9);display:none}

  background:rgba(10,10,10,.88);border:1px solid #2a2a2a;border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;transition:opacity .25s}

<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay style="display:none"></video>
<div id="label"></div>
<div id="hand"><i></i><i></i></div>
<div id="info"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ GLITCH</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="rand" class="btn">🎲 ランダム</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="lay" class="btn">▦ 並び</button>
</div>

<div id="panel" class="hide">
  <label><span>強さ</span><input type="range" id="sK" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>映像の色</span><select id="sCol"><option value="0">カラー</option><option value="1">モノクロ</option><option value="2">セピア</option></select></label>
  <label><span>色の組</span><select id="sSet"></select></label>

  <div class="note">両手をかざすと、そのあいだにカードが並ぶ。広げると列に、近づけると塊に。<br>手のひらをくるっと返すと並び方と色が替わる。<br>片手だけを開いて左右に振ると、カメラとエフェクトが入れ替わる。<br>画面をタップしても並びが替わる。🎲 で全部ランダム。</div>
</div>

<div id="start">
  <div class="t">TWO HANDS · GLITCH CARDS</div>
  <h1>HAND//GLITCH</h1>
  <p>まずは、いつものカメラ。<br>手を振るか「▸ GLITCH」で、両手のあいだにカードが並ぶ。<br>広げて、縮めて、手のひらを返して。🎲 でランダム。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const canvas = $('c'), ctx = canvas.getContext('2d');
const video = $('v');
const pc = document.createElement('canvas'), pctx = pc.getContext('2d');     // card layer, keeps a trail
const S = { k:.5, col:0, set:0, snd:true, wave:true, flip:true, ghost:true, layout:0 };
const STATE = { frames:0, flips:0, waves:0, randoms:0, spawned:0 };

const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  resetWave();
}
// cover fit of the camera frame on the canvas; landmarks go through the same mapping
const COV = { s:1, ox:0, oy:0 };
function fitCover(W, H){ const s = Math.max(W / vidW, H / vidH); COV.s = s; COV.ox = (W - vidW * s) / 2; COV.oy = (H - vidH * s) / 2; }
function toScr(p){
  const x = COV.ox + p.x * vidW * COV.s, y = COV.oy + p.y * vidH * COV.s;
  return [mirror ? canvas.width - x : x, y];
}
function drawCam(c, W, H){
  c.save();
  if (mirror){ c.translate(W, 0); c.scale(-1, 1); }
  c.drawImage(video, COV.ox, COV.oy, vidW * COV.s, vidH * COV.s);
  c.restore();
}
// low-res mirrored snapshot for the camera cards
const camC = document.createElement('canvas'); camC.width = 320; camC.height = 180;
const camX = camC.getContext('2d'); let lastGrab = 0;
function grab(now){
  if (now - lastGrab < 100 || video.readyState < 2) return; lastGrab = now;
  camC.height = Math.round(320 * vidH / vidW);
  camX.save(); if (mirror){ camX.translate(320, 0); camX.scale(-1, 1); }
  camX.drawImage(video, 0, 0, 320, camC.height); camX.restore();
}

/* ---------- audio ---------- */
let actx = null, bus = null, recDest = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .5; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  actx.resume().catch(()=>{});
}
const audioOk = () => actx && actx.state === 'running' && S.snd;
const SCALE = [0, 2, 4, 7, 9], BASE = 261.63;
const noteF = (d, o) => BASE * Math.pow(2, (SCALE[d % 5] + 12 * (o + Math.floor(d / 5))) / 12);
let lastBlip = 0;
function blip(pan){
  if (!audioOk()) return;
  const nowMs = performance.now(); if (nowMs - lastBlip < 90) return; lastBlip = nowMs;
  const t = actx.currentTime, f = noteF(Math.random() * 8 | 0, 1);
  const g = actx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.1, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + .35);
  const pn = actx.createStereoPanner ? actx.createStereoPanner() : null;
  if (pn){ pn.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(pn); pn.connect(bus); } else g.connect(bus);
  for (const [m, a] of [[1, 1], [2, .4], [3, .15]]){
    const o = actx.createOscillator(), og = actx.createGain(); o.type = 'sine'; o.frequency.value = f * m; og.gain.value = a;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + .4);
  }
}
function stinger(){
  if (!audioOk()) return;
  const t = actx.currentTime, dur = .25;
  const buf = actx.createBuffer(1, Math.round(actx.sampleRate * dur), actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = actx.createBufferSource(); src.buffer = buf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(4000, t + dur);
  const ng = actx.createGain(); ng.gain.setValueAtTime(.22, t); ng.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(bp); bp.connect(ng); ng.connect(bus); src.start(t);
  const r = Math.random() * 5 | 0;
  for (const f of [noteF(r, 0), noteF(r + 2, 0), noteF(r, 1)]){
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.07, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .7);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + .75);
  }
}
function sweepSnd(on){
  if (!audioOk()) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(); o.type = 'square';
  o.frequency.setValueAtTime(on ? 110 : 880, t); o.frequency.exponentialRampToValueAtTime(on ? 1760 : 90, t + .3);
  g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.001, t + .38);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + .4);
}

/* ---------- cards ---------- */
const SETS = [
  { name:'NEON', pal:[['#00ff88','#003322'], ['#ff00aa','#220022'], ['#00aaff','#001144'], ['#aa00ff','#220044']], types:['stripes','glitch','blocks','camera','camera'] },
  { name:'WARM', pal:[['#ffee00','#553300'], ['#ff5500','#220000'], ['#ff0044','#330011'], ['#ffaa00','#332200']], types:['gradient','stripes','solid','camera','camera'] },
  { name:'MONO', pal:[['#ffffff','#000000'], ['#cccccc','#222222'], ['#888888','#111111']], types:['noise','blocks','glitch','camera','camera'] },
  { name:'AQUA', pal:[['#00ffcc','#003344'], ['#00ddff','#002244'], ['#88ffee','#114455']], types:['gradient','stripes','noise','camera'] }
];
const LAYOUTS = ['LINE', 'STACK3D', 'COLUMN', 'CROSS', 'RING'];
const LAYOUT_JA = { LINE:'横一列', STACK3D:'3D スタック', COLUMN:'縦一列', CROSS:'クロス', RING:'円環' };
const panels = [], MAX_PANELS = 26;
let prevLayout = 0, layoutT = 1, burst = 0;
const particles = [];

function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeTex(p){
  const c = document.createElement('canvas'); c.width = 128; c.height = 128; const x = c.getContext('2d');
  const rng = mulberry32(p.seed * 1e4 | 0);
  x.fillStyle = p.bg; x.fillRect(0, 0, 128, 128);
  if (p.type === 'stripes'){ const h = 3 + rng() * 10; for (let y = 0; y < 128; y += h){ x.fillStyle = rng() > .5 ? p.color : p.bg; x.fillRect(0, y, 128, h); } }
  else if (p.type === 'noise'){ for (let y = 0; y < 128; y += 4) for (let i = 0; i < 128; i += 4){ x.fillStyle = rng() > .5 ? p.color : p.bg; x.fillRect(i, y, 4, 4); } }
  else if (p.type === 'blocks'){ const cl = 4 + (rng() * 8 | 0), rw = 4 + (rng() * 8 | 0);
    for (let j = 0; j < rw; j++) for (let i = 0; i < cl; i++){ x.fillStyle = rng() > .5 ? p.color : p.bg; x.fillRect(i * 128 / cl, j * 128 / rw, 128 / cl + 1, 128 / rw + 1); } }
  else if (p.type === 'glitch'){ x.fillStyle = p.color; x.fillRect(0, 0, 128, 128);
    for (let i = 0, n = 6 + rng() * 10; i < n; i++){ x.fillStyle = rng() > .5 ? p.bg : '#fff'; x.fillRect(0, rng() * 128, 128, 1 + rng() * 4); }
    ['#ff0044', '#00ff88', '#0088ff'].forEach(cc => { x.fillStyle = cc; x.fillRect(rng() * 128, 0, 2, 128); }); }
  else if (p.type === 'solid'){ x.fillStyle = p.color; x.fillRect(0, 0, 128, 128); }
  else if (p.type === 'gradient'){ const g = x.createLinearGradient(0, 0, 128, 128); g.addColorStop(0, p.color); g.addColorStop(1, p.bg); x.fillStyle = g; x.fillRect(0, 0, 128, 128); }
  return c;
}
function makePanel(){
  const set = SETS[S.set], pal = set.pal[Math.random() * set.pal.length | 0];
  const p = { type:set.types[Math.random() * set.types.length | 0], color:pal[0], bg:pal[1], seed:Math.random(),
    rotation:(Math.random() - .5) * .4, aspect:.5 + Math.random() * 1.2, life:1,
    cropX:Math.random() * .6, cropY:Math.random() * .5, cropW:.25 + Math.random() * .3, cropH:.3 + Math.random() * .35, tint:Math.random(),
    px:null, py:null, prot:0, pw:0, ph:0, tex:null };
  if (p.type !== 'camera') p.tex = makeTex(p);
  STATE.spawned++;
  return p;
}
function pushPanel(){ panels.push(makePanel()); if (panels.length > MAX_PANELS) panels.shift(); }
function lerpAngle(a, b, t){ let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * t; }

function computeLayout(name, i, n, p, c){
  const { lx, ly, dx, dy, distance, angle, cx, cy, now } = c;
  const ti = n > 1 ? i / (n - 1) : .5, m = .08;
  switch (name){
    case 'LINE': { const t = m + (1 - 2 * m) * ti;

    c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-w / 2 + 3 * u, -h / 2 + 5 * u, w, h);
    if (p.type === 'camera'){
      const sx = p.cropX * camC.width, sy = p.cropY * camC.height;
      const sw = Math.min(p.cropW * camC.width, camC.width - sx), sh = Math.min(p.cropH * camC.height, camC.height - sy);
      c.drawImage(camC, sx, sy, sw, sh, -w / 2, -h / 2, w, h);
      if (p.tint < .4){ c.globalCompositeOperation = 'overlay'; c.globalAlpha = al * .5; c.fillStyle = p.color; c.fillRect(-w / 2, -h / 2, w, h); }
      else if (p.tint < .6){ c.fillStyle = 'rgba(0,0,0,.35)'; for (let y = -h / 2; y < h / 2; y += 4 * u) c.fillRect(-w / 2, y, w, 1.5 * u); }
      else if (p.tint < .75){ c.globalCompositeOperation = 'difference'; c.fillStyle = p.color; c.fillRect(-w / 2, -h / 2, w, h); }
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = al;
    } else c.drawImage(p.tex, -w / 2, -h / 2, w, h);
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.5 * u; c.strokeRect(-w / 2, -h / 2, w, h);
    c.restore();
    if (Math.random() < rgbP){
      c.save(); c.globalCompositeOperation = 'screen'; c.globalAlpha = .3;
      c.translate(p.px + (Math.random() - .5) * 10 * u, p.py); c.rotate(p.prot);
      c.fillStyle = Math.random() < .5 ? '#ff0044' : '#00d4ff'; c.fillRect(-w / 2, -h / 2, w, h); c.restore();
    }
  }
  // the thread between the two hands
  c.save();
  c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 4 * u; c.beginPath(); c.moveTo(lx, ly); c.lineTo(rx, ry); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.2 * u; c.beginPath(); c.moveTo(lx, ly); c.lineTo(rx, ry); c.stroke();
  c.fillStyle = '#fff'; for (const [x, y] of [[lx, ly], [rx, ry]]){ c.beginPath(); c.arc(x, y, 5 * u, 0, Math.PI * 2); c.fill(); }
  c.restore();
}
function drawSkeleton(c, u){
  for (const h of HANDS){
    const P = h.lm.map(toScr);
    c.strokeStyle = '#00ff66'; c.lineWidth = 2 * u; c.beginPath();
    for (const [a, b] of HAND_CONNECTIONS){ c.moveTo(P[a][0], P[a][1]); c.lineTo(P[b][0], P[b][1]); }
    c.stroke();
    c.fillStyle = '#ff2244';
    for (const q of P){ c.beginPath(); c.arc(q[0], q[1], 3.5 * u, 0, Math.PI * 2); c.fill(); }
  }
  for (const q of particles){
    c.save(); c.translate(q.x, q.y); c.rotate(q.rot); c.globalAlpha = Math.max(0, q.life);
    c.fillStyle = q.color; c.fillRect(-q.size / 2, -q.size / 2, q.size, q.size); c.restore();
  }
}
// the switch: a band of displaced slices crossing the frame, split into red and cyan at its edge
function sweepEdge(c, edge, W, H, u){
  const band = 90 * u;
  for (let i = 0; i < 14; i++){
    const y = Math.random() * H, h = (6 + Math.random() * 40) * u, off = (Math.random() - .5) * 120 * u;
    const x0 = Math.max(0, edge - band * Math.random()), w = band * (.4 + Math.random());
    c.drawImage(canvas, x0, y, w, h, x0 + off, y, w, h);
  }
  c.save(); c.globalCompositeOperation = 'screen';
  c.fillStyle = '#ff2244'; c.fillRect(edge - 6 * u, 0, 3 * u, H);
  c.fillStyle = '#00d4ff'; c.fillRect(edge + 3 * u, 0, 3 * u, H);
  c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(edge - 1 * u, 0, 2 * u, H);
  c.restore();
}
function glitchAll(c, W, H, u, b){
  for (let s = 0; s < 7; s++){
    if (Math.random() > b) continue;
    const y = Math.random() * H, h = (20 + Math.random() * 60) * u, off = (Math.random() - .5) * 70 * u * b;
    c.drawImage(canvas, 0, y, W, h, off, y, W, h);
  }
  c.save(); c.globalCompositeOperation = 'screen'; c.globalAlpha = .22 * b;
  c.fillStyle = '#ff0033'; c.fillRect(-8 * u * b, 0, W, H);
  c.fillStyle = '#0033ff'; c.fillRect(8 * u * b, 0, W, H); c.restore();
}
let infoTxt = '';
function updateInfo(){
  let t;
  if (HANDS.length === 2) t = (spreadT < .2 ? '塊' : spreadT < .8 ? '展開中' : LAYOUT_JA[LAYOUTS[S.layout]]) + ' · ' + SETS[S.set].name + ' · ' + panels.length;
  else if (HANDS.length === 1) t = 'もう片方の手も';
  else if (ghostOn) t = '幻の両手 · ' + LAYOUT_JA[LAYOUTS[S.layout]] + ' · ' + SETS[S.set].name;
  else t = '両手をかざして';
  if (t !== infoTxt){ infoTxt = t; $('info').textContent = t; }
}

window.__HANDGLITCH = {
  ingestHands:(list, now) => { HANDS_EXTERNAL = true; return ingestHands(list, now); },
  mode:on => setMode(!!on), random:randomize, flip:() => onFlip(canvas.width / 2, canvas.height / 2),
  layout:i => { setLayout(i); showLabel(); }, set:setSet, col:i => { S.col = i; $('sCol').value = i; },
  ghost:on => { S.ghost = !!on; $('sGhost').checked = !!on; },
  state:() => ({ mode:MODE.on, X:MODE.X, layout:LAYOUTS[S.layout], set:SETS[S.set].name, col:S.col, k:S.k, panels:panels.length,
    hands:HANDS.length, pair:pairOn, ghost:ghostOn, spread:spreadT, ...STATE })
};
