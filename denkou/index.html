<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>

<!--
  ══════════════════════════════════════════════════════════════════════════
  DENKOU 電光 ─ 顔が光るヘルメットになる               ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  REFERENCE  フレンチハウスのロボット二人組のヘルメット、2000 年代の
             クロームのプロダクト広告、暗いスタジオのファッションフィルム。
             顔は見えないのに、LED の目と口で表情だけが伝わる。
  MOOD       暗転したスタジオ。体は冷たいモノクロに沈み、頭だけが磨かれた
             クロームのヘルメットになる。黒いガラスのバイザーの奥で LED の
             目がまばたきし、口が声に合わせて波打つ。その光が肩を赤く照らす。
  PALETTE    SILVER（既定）鏡面クローム ＋ LED は信号の赤 #ff2b1c
             GOLD   金のクローム ＋ LED は氷の白 #e9f4ff
             NOIR   漆黒の艶 ＋ LED は琥珀 #ffae3a
             体と背景はモノクロ。差し色は LED の一色だけ。
             二人で映ると、二人目は次の仕上げになる（銀と金の二人組）。
  TYPE       Unbounded 200/400（幅広の幾何学体、題字と小さなラベル）
             ＋ Zen Kaku Gothic New 300（和文）。
  MOTION     ヘルメットは顔の向きに完全に追従し、スタジオの照明の映り込みが
             首の動きにあわせて表面を滑る。LED には残光があり、首を振ると
             目と口が遅れて流れ、画面にも光の軌跡が残る。
             切り替えは、暗転 → ヘルメットが上から降りて頭に収まる →
             LED が左から一列ずつ点灯する。
  SIGNATURE  ウインクすると、ひとすじの光がヘルメットの表面をなでる。
  LAYERS     ① 顔の向き・位置・大きさに追従する 3D のヘルメット（GPU で光線を
                楕円体に当てて描く：鏡面、ガラスのバイザー、耳の円盤、溝）
             ② LED の表情：まばたき・視線・口の開き・笑み。マイクがあれば口が声の波形に
             ③ 残光：首を振ると LED が遅れて流れ、画面に光の軌跡が残る
             ④ LED の光がバイザーから体と背景にこぼれる／体はモノクロ・背景は沈む
             ⑤ 表示（タップで切替）：FACE ／ VOICE（声のオシロ）／ SCAN（走る光）
             ⑥ 仕上げ：SILVER / GOLD / NOIR、二人なら二人目は別の仕上げ
             ⑦ 素のカメラ ⇄ 作品 の切り替え：暗転→降下→LED 点灯
             ⑧ ウインクで光のスイープ
  TECH       WebGL2。全画面シェーダ 1 枚＋残光用の 1/4 解像度のピンポン。
             FaceLandmarker（2 人）とセルフィーセグメンタ。LED は 44×15 の
             CPU グリッドを 1 枚のテクスチャで渡す。配列はすべて使い回す。
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
'use strict';
/* =====================================================================
   DENKOU — the head becomes a chrome helmet; an LED visor shows the face.
   per frame:
     FaceLandmarker → head frame (right / up / front, scale) per person
     → LED grid (CPU, persistence) → trail pass (¼ res ping-pong, glow only)
     → main pass: graded camera + light spill + ray-cast ellipsoid helmets.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

const $ = id => document.getElementById(id);
const view = $('view'), video = $('cam');
const S = { fin:0, prog:0, trail:.55, glow:.6, size:.5, body:.5, bg:.22, grain:.4, vol:.4, mic:true, wink:true };
const FINISH = [
  { name:'SILVER', led:[1.0,.17,.11], css:'#ff2b1c' },
  { name:'GOLD',   led:[.91,.96,1.0], css:'#cfe6ff' },
  { name:'NOIR',   led:[1.0,.68,.23], css:'#ffae3a' },
];
const PROGS = ['FACE','VOICE','SCAN'];
const COLS = 44, ROWS = 15, MAXH = 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- start-screen LED eyes ---------- */
const startLed = (() => {
  const c = $('leds'), x = c.getContext('2d'); let on = true;
  function f(t){
    if (!on) return;
    x.clearRect(0, 0, 440, 150);
    const blink = (t / 1000) % 3.6 > 3.45 ? .12 : 1, gx = Math.sin(t / 1300) * 1.6;
    for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++){
      let v = 0;
      for (const ex of [12.5, 31.5]){ const dx = (q - ex - gx) / 3.6, dy = (r - 5.2) / (2.2 * blink + .25); if (dx * dx + dy * dy < 1) v = 1; }
      const mx = (q - 22) / 8, my = r - (10.6 + .9 * mx * mx);
      if (Math.abs(mx) < 1 && Math.abs(my) < .6) v = Math.max(v, .9);
      x.fillStyle = v ? 'rgba(255,43,28,' + (.35 + .65 * v) + ')' : 'rgba(255,43,28,.07)';
      x.beginPath(); x.arc(q * 10 + 5, r * 10 + 5, 3.4, 0, 6.283); x.fill();
    }
    requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
  return { stop(){ on = false; } };
})();

/* ---------- WebGL2 ---------- */
const gl = view.getContext('webgl2', { alpha:false, antialias:false, preserveDrawingBuffer:true, premultipliedAlpha:false });
const VS = `#version 300 es
in vec2 aP; void main(){ gl_Position = vec4(aP, 0., 1.); }`;
// a quad over one helmet's screen bound (no attributes: gl_VertexID)
const VS_BOX = `#version 300 es
uniform vec4 uBoxN; uniform vec2 uRes;
void main(){
  int id = gl_VertexID;
  vec2 a = vec2((id == 1 || id == 2 || id == 4) ? 1. : 0., (id == 2 || id == 4 || id == 5) ? 1. : 0.);
  vec2 px = mix(uBoxN.xy, uBoxN.zw, a);
  gl_Position = vec4(px.x / uRes.x * 2. - 1., 1. - px.y / uRes.y * 2., 0., 1.);
}`;
const BASE = `#version 300 es
precision highp float;
uniform sampler2D uVid, uMask, uLedN, uLedL, uTrail, uPrev;
uniform vec2 uRes;          // canvas px
uniform vec2 uRT;           // render-target px
uniform float uPS;          // canvas px per fragment
uniform vec4 uMap;          // ox, oy, dw, dh  (video cover rect on canvas)
uniform float uMirror, uT, uHasMask;
const float COLS = ${COLS}.0, ROWS = ${ROWS}.0;
vec2 vuv(vec2 p){ vec2 u = (p - uMap.xy) / uMap.zw; if (uMirror > .5) u.x = 1. - u.x; return u; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uT * 17.) * 43758.5453); }
`;
const HELM = BASE + `
uniform vec3 uC;            // helmet centre, canvas px (z into screen)
uniform mat3 uR;            // columns: right, up, front  (canvas space)
uniform float uS;           // px per cm
uniform float uA;           // presence
uniform vec4 uF;            // finish id, glint 0..1 (-1 none), boot 0..1, led level
uniform vec3 uLC;           // led colour
uniform float uSlot;        // row block in LED texture
uniform float uScale;
const vec3 RAD = vec3(9.6, 12.8, 11.6);
vec3 env(vec3 r, vec2 p){
  float up = -r.y;
  float az = atan(r.x, -r.z);
  vec3 lo = vec3(.02,.021,.025) + vec3(.04) * smoothstep(-1., -.2, up);
  vec3 hi = mix(vec3(.16,.165,.18), vec3(.62,.63,.66), pow(max(up, 0.), .9));
  vec3 c = mix(lo, hi, smoothstep(-.015, .02, up));
  c *= 1. - .75 * exp(-abs(up - .01) * 70.);
  float sb = smoothstep(.13, .07, abs(abs(az) - 1.15)) * smoothstep(-.25, -.05, up) * smoothstep(.8, .55, up);
  c += vec3(2.2) * sb;
  c += vec3(1.15) * (smoothstep(.88, .91, up) - smoothstep(.93, .96, up));   // ring light
  c += vec3(1.1) * smoothstep(.06, .02, abs(up - .35)) * smoothstep(.9, .5, abs(az));  // a long strip behind the camera
  c += vec3(.6) * smoothstep(.06, .0, abs(az - 2.6)) * smoothstep(.1, .3, up);
  // the room in front, from the camera, faintly
  vec2 ru = clamp(vec2(.5 + r.x * .42, .55 + r.y * .42), .01, .99);
  if (uMirror > .5) ru.x = 1. - ru.x;
  float rl = dot(texture(uVid, ru).rgb, vec3(.3,.59,.11));
  c += vec3(rl) * .22 * smoothstep(.3, -.3, up);
  return c;
}
// ray-cast one helmet; returns alpha, writes colour and emission
float helm(vec2 p, out vec3 col, out vec3 emi, bool full){
  col = vec3(0.); emi = vec3(0.);
  if (uA < .002) return 0.;
  mat3 Rt = transpose(uR);
  vec3 rad = RAD * uScale;
  vec3 q = Rt * (vec3(p, 0.) - uC) / uS;
  vec3 D = Rt * vec3(0., 0., 1.);
  vec3 o = q / rad, d = D / rad;
  float A = dot(d, d), B = dot(o, d), C = dot(o, o) - 1.;
  float disc = B * B - A * C;
  if (disc <= 0.) return 0.;
  float sq = sqrt(disc);
  vec3 h = o + d * ((-B - sq) / A);
  float a = smoothstep(0., .02 + .9 / (uS * rad.x), sq / sqrt(A));
  a *= smoothstep(-.84, -.8, h.y);
  if (a <= 0.) return 0.;
  vec3 nl = normalize(h / rad);
  vec3 n = normalize(uR * nl);
  vec3 rr = reflect(vec3(0., 0., 1.), n);
  float facing = clamp(-n.z, 0., 1.);
  float fres = pow(1. - facing, 4.);
  float fin = uF.x;
  vec3 e = env(rr, p);
  // shell

}
function waveAt(t){                 // t 0..1 across the visor → −1..1

function drawLed(h, slot, dt, nowS){

  for (let i = 0; i < g.length; i++) g[i] *= decay;

    if (h.eyeR > .25) ledEllipse(g, cx + 9.6, eyeY, ew, Math.max(.6, eh * h.eyeR), 1);

    for (let y = 3; y < ROWS - 3; y++) for (let k = -1; k <= 1; k++) ledDot(g, x + k + .5, y + .5, k ? .7 : 1);
    ledEllipse(g, cx - 9.6, eyeY, 3.6, Math.max(.3, 2 * h.eyeL), .22);
    ledEllipse(g, cx + 9.6, eyeY, 3.6, Math.max(.3, 2 * h.eyeR), .22);
  }

}

const M = { buf:null, w:0, h:0, has:false, external:false, t:-1e9 };

function detect(now){

  }

    try{
      segmenter.segmentForVideo(video, ts, res => {

  else if (kind === 'glint'){ tone('sine', 2600, 5200, .6, .05, 0, 9000); tone('sine', 3900, 7800, .5, .025, .05, 9000); }
  else if (kind === 'prog'){ tone('square', 1320, 1320, .035, .03, 0, 5000); tone('square', 1980, 1980, .03, .025, .05, 5000); }
  else if (kind === 'off'){ tone('sine', 300, 60, .45, .14, 0, 1200); }
}

  let mix, dark;
  const tx = MODE.X;
  if (MODE.on){ mix = tx < .35 ? 0 : 1; dark = tx < .35 ? ease(tx / .35) : 1 - ease((tx - .35) / .5); }
  else { mix = tx < .25 ? 1 : 0; dark = tx < .25 ? ease(tx / .25) * .9 : .9 * (1 - ease((tx - .25) / .35)); }
  const hasMask = M.has && (performance.now() - M.t < 1500 || M.external) ? 1 : 0;
  const base = (pr, rtw, rth) => {
    const u = pr.u; gl.useProgram(pr.p);
    gl.uniform1i(u.uVid, 0); gl.uniform1i(u.uMask, 1); gl.uniform1i(u.uLedN, 2); gl.uniform1i(u.uLedL, 3); gl.uniform1i(u.uTrail, 4); gl.uniform1i(u.uPrev, 5);
    gl.uniform2f(u.uRes, G.W, G.H); gl.uniform2f(u.uRT, rtw, rth); gl.uniform1f(u.uPS, G.W / rtw);
    gl.uniform4f(u.uMap, G.ox, G.oy, G.dw, G.dh); gl.uniform1f(u.uMirror, mirror ? 1 : 0);
    gl.uniform1f(u.uT, nowS % 100); gl.uniform1f(u.uHasMask, hasMask);
    gl.viewport(0, 0, rtw, rth);
    return u;
  };
  const drawHelms = (rtw, rth, trailMode, gain) => {
    if (!n || !MODE.on || mix < .5) return;
    const u = base(GL.helm, rtw, rth);
    gl.uniform1f(u.uTrailMode, trailMode); gl.uniform1f(u.uDark, dark); gl.uniform1f(u.uGain, gain); gl.uniform1f(u.uGrain, S.grain);
    gl.uniform1f(u.uScale, .9 + S.size * .3);
    gl.enable(gl.BLEND);
    if (trailMode) gl.blendFunc(gl.ONE, gl.ONE); else gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    for (let k = 0; k < n; k++){
      if (U.A[k] < .002) continue;
      gl.uniform4fv(u.uBoxN, U.BX.subarray(k * 4, k * 4 + 4));
      gl.uniform3fv(u.uC, U.C.subarray(k * 3, k * 3 + 3)); gl.uniformMatrix3fv(u.uR, false, U.R.subarray(k * 9, k * 9 + 9));
      gl.uniform1f(u.uS, U.S[k]); gl.uniform1f(u.uA, U.A[k]); gl.uniform4fv(u.uF, U.F.subarray(k * 4, k * 4 + 4));
      gl.uniform3fv(u.uLC, U.LC.subarray(k * 3, k * 3 + 3)); gl.uniform1f(u.uSlot, U.SL[k]);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }
    gl.disable(gl.BLEND);
  };
  // trail (¼ res): decay, then add the LED glow of each helmet
  const tw = Math.max(8, G.W >> 2), th = Math.max(8, G.H >> 2);
  trailAlloc(tw, th);
  const src = GL.ping, dst = 1 - src;
  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.fb[dst]);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, null);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, GL.tr[src]);
  let u = base(GL.decay, tw, th);
  gl.uniform1f(u.uDecay, Math.exp(-dt / (.06 + S.trail * .9)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  drawHelms(tw, th, 1, 1 - Math.exp(-dt / .05));
  GL.ping = dst;
  // main: graded camera, spill, glow; then the helmets on top
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, null);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, GL.tr[dst]);
  u = base(GL.main, G.W, G.H);
  gl.uniform1i(u.uN, n);
  for (let k = 0; k < n; k++){
    const sc = .9 + S.size * .3;
    SP[k * 4] = U.C[k * 3]; SP[k * 4 + 1] = U.C[k * 3 + 1]; SP[k * 4 + 2] = U.S[k] * sc;
    SP[k * 4 + 3] = U.A[k] * U.F[k * 4 + 3] * (U.F[k * 4 + 2] > .02 ? 1 : 0);
  }
  if (n){ gl.uniform4fv(u.uSp, SP.subarray(0, n * 4)); gl.uniform3fv(u.uSpC, U.LC.subarray(0, n * 3)); }
  gl.uniform1f(u.uMix, mix); gl.uniform1f(u.uDark, dark);
  gl.uniform1f(u.uBody, S.body); gl.uniform1f(u.uBgL, S.bg); gl.uniform1f(u.uGrain, S.grain); gl.uniform1f(u.uGlow, .8 + S.glow * 2.2);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  drawHelms(G.W, G.H, 0, 1);
}

/* ---------- test hook ---------- */
window.__denkou = {
  feedFaces(list, t){ if (!FACE.external && modelFailed) setStatus(''); FACE.external = true; return ingestFaces(list, t); },
  feedMask(arr, w, h){ M.external = true; return ingestMask(arr, w, h); },
  feedVoice(level, wave){ MIC.ext = true; MIC.level = level; MIC.extWave = wave || null; },
  setMode, setFin, setProg, test:TEST,
  state(){ return { frame:frameN, mode:MODE.on, X:MODE.X, prog:S.prog, fin:S.fin, faces:FACE.count,
    heads:HEADS.map(h => ({ on:h.on, a:+h.a.toFixed(3), C:[...h.C].map(v => +v.toFixed(1)), s:+h.s.toFixed(2), glint:h.glint, drop:h.drop, boot:h.boot,
      eyeL:+h.eyeL.toFixed(2), eyeR:+h.eyeR.toFixed(2), mouth:+h.mouth.toFixed(2), yawV:+h.yawV.toFixed(2), wink:+h.wink.toFixed(2) })),
    G:{ ...G } }; },
};
</script>
