<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>

<title>NORI ─ 黒いシルエットと白いコードで踊る</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  NORI ノリ ─ 黒いシルエットと白いコードで踊る              ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  REFERENCE  2000 年代の携帯音楽プレーヤーの「シルエット」広告。蛍光色一色の
             地に、踊る人が真っ黒な影として抜かれ、白いイヤホンのコードだけが
             その影の上を走る。三色だけで成り立つ、いちばん有名なポスターの型。
             （ロゴや製品名は出さない。黒・白・一色という型だけを借りる）
  MOOD       ダンスフロアではなく、壁一面のポスター。あなたは顔も服も消えて、
             輪郭だけの黒になる。白いコードは本物の紐のように揺れ、首を振れば
             しなり、跳べば遅れて落ちてくる。拍が来るたびに地の色がばっさり
             替わる ── 編集でカットを割るように。
  PALETTE    影 #0b0b0b ／ コード #ffffff ／ 地は一度に一色だけ：
             ライム #c6f432 ・ ピンク #ff4fa3 ・ ブルー #2b8cff ・
             オレンジ #ff8a24 ・ バイオレット #9b6bff ・ イエロー #ffd400
             残像は地の色を暗くしたもの（同じ色相の一段下）。
  TYPE       Albert Sans 300 / 800（細身の欧文と、題字だけ極太）＋ Noto Sans JP 300。
  MOTION     色はフェードしない。拍の頭でカット、同時に画面がわずかに寄って戻る。
             コードは紐の物理で揺れ、キックのたびに小さく跳ねる。
             速く動いた時だけ、地の色の一段暗い影が二枚遅れてついてくる。
  SIGNATURE  影は動かなくても完成しているが、踊ると白い線が暴れ、色が切り替わる。
  LAYERS     ① 真っ黒なシルエット（セグメンテーション、エッジは硬く）
             ② 耳から胸で Y に合流し手のプレーヤーへ続く白いコード（紐の物理）
             ③ 拍で地の色がカット（内蔵のビート／マイクの音／ジャンプ／タップ）
             ④ 動いた時の色の残像（二枚）
             ⑤ キックでコードが跳ね、カットで画面が寄る
             ⑥ 内蔵のビート（キック・クラップ・ハット・ベース）、録画に入る
             ⑦ 二人で映ればそれぞれにコード
             ⑧ 素のカメラ ⇄ 作品 の切り替え（カットで影になり、コードが空から落ちてきて耳に掛かる）
  TECH       Canvas2D。MediaPipe PoseLandmarker（2 人、セグメンテーションマスク付き）。
             コードはベルレ積分の紐（耳 2 点と手を固定、Y の合流点は自由）。
             ジャンプは肩の上向きの速さを観測時刻で測る。
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
'use strict';
/* =====================================================================
   NORI — one flat colour, one black silhouette, one white cord.
   per frame:
     pose (+ per-person mask) → silhouette canvas (black) and two delayed
     copies tinted one step darker than the ground → cords: verlet ropes pinned
     at the ears and the hand, joined at a free Y → draw → beat-cut colour.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';

const $ = id => document.getElementById(id);
const view = $('view'), video = $('cam');
const ctx = view.getContext('2d', { alpha:false });
const S = { bpm:116, len:.5, swing:.55, echo:.6, vol:.5, beat:true, mic:false, jump:true, player:true };
const COLS = ['#c6f432', '#ff4fa3', '#2b8cff', '#ff8a24', '#9b6bff', '#ffd400'];
const ECHO = ['#8fb51c', '#c62f78', '#1a5fbf', '#c25e0e', '#6a3fd0', '#c7a200'];
const colOn = COLS.map(() => true);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const TEST = { maxDt:.05 };
const fin = v => typeof v === 'number' && isFinite(v);

/* ---------- geometry ---------- */
const G = { W:0, H:0, ox:0, oy:0, dw:0, dh:0, short:1 };
let vidW = 1280, vidH = 720;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  const k = Math.min(1, 1600 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
  if (w !== G.W || h !== G.H){ G.W = view.width = w; G.H = view.height = h; }
  const va = (vidW || 16) / (vidH || 9), ca = w / h;
  if (va > ca){ G.dh = h; G.dw = h * va; } else { G.dw = w; G.dh = w / va; }
  G.cdw = G.dw; G.cdh = G.dh; G.cox = (w - G.dw) / 2; G.coy = (h - G.dh) / 2;       // the plain camera fills the screen
  // the poster never crops a wide camera to a sliver on a tall screen: step back, stand on the bottom edge
  const pull = Math.min(1, 2.6 * w / G.dw); G.dw *= pull; G.dh *= pull;
  G.ox = (w - G.dw) / 2; G.oy = h - G.dh; G.short = Math.min(w, h);
}
// normalised video coords → screen px (mirrored for the selfie camera)
function toScr(x, y){ return [G.ox + (mirror ? 1 - x : x) * G.dw, G.oy + y * G.dh]; }

/* ---------- silhouette: merged mask → black cut-out, with a short timed history for the echoes ---------- */
const SIL = { img:null, w:0, h:0, t:-1e9, has:false };
const rawC = document.createElement('canvas'), rawX = rawC.getContext('2d');
const HIST_N = 16, HIST = [];                 // { c, t } mask history (white alpha), small
let histHead = -1, histLast = -1e9;
const tintC = document.createElement('canvas'), tintX = tintC.getContext('2d');
let merged = null;
function ingestMasks(list, now){
  // list: [{ data, w, h }] — union of the people
  if (!Array.isArray(list) || !list.length) return false;
  const m0 = list[0]; if (!m0 || !(m0.w > 0) || !(m0.h > 0)) return false;
  const w = m0.w | 0, h = m0.h | 0, n = w * h;
  if (!merged || merged.length !== n){ merged = new Float32Array(n); }
  merged.fill(0);
  let any = false;
  for (const m of list){
    if (!m || m.w !== w || m.h !== h || !m.data || m.data.length < n) continue;
    const d = m.data; any = true;
    for (let i = 0; i < n; i++){ const v = d[i]; if (v > merged[i]) merged[i] = v; }
  }
  if (!any) return false;
  // upsample bilinearly before the threshold, so the hard poster edge is a smooth curve, not the model's pixels
  const up = clamp(Math.round(720 / Math.max(w, h)), 1, 4), uw = w * up, uh = h * up;
  if (SIL.w !== uw || SIL.h !== uh || !SIL.img){
    SIL.w = uw; SIL.h = uh; rawC.width = uw; rawC.height = uh; SIL.img = rawX.createImageData(uw, uh);
    const d = SIL.img.data; for (let i = 0; i < uw * uh; i++){ d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = 255; }
    HIST.length = 0; histHead = -1;
    const hw = uw, hh = uh;
    for (let k = 0; k < HIST_N; k++){ const c = document.createElement('canvas'); c.width = hw; c.height = hh; HIST.push({ c, x:c.getContext('2d'), t:-1e9 }); }
  }
  const d = SIL.img.data;
  for (let y = 0; y < uh; y++){
    const fy = clamp((y + .5) / up - .5, 0, h - 1), y0 = fy | 0, y1 = Math.min(h - 1, y0 + 1), ty = fy - y0;
    for (let x = 0; x < uw; x++){
      const fx = clamp((x + .5) / up - .5, 0, w - 1), x0 = fx | 0, x1 = Math.min(w - 1, x0 + 1), tx = fx - x0;
      let a = merged[y0 * w + x0], b = merged[y0 * w + x1], c = merged[y1 * w + x0], e = merged[y1 * w + x1];
      if (!(a > 0)) a = 0; if (!(b > 0)) b = 0; if (!(c > 0)) c = 0; if (!(e > 0)) e = 0;
      let v = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + e * tx) * ty;
      v = v < .42 ? 0 : v > .58 ? 1 : (v - .42) * 6.25;
      d[(y * uw + x) * 4 + 3] = (v * 255) | 0;
    }
  }
  rawX.putImageData(SIL.img, 0, 0);
  SIL.has = true; SIL.t = now;
  if (now - histLast > 40){
    histLast = now; histHead = (histHead + 1) % HIST_N;
    const r = HIST[histHead]; r.t = now; r.x.globalCompositeOperation = 'copy'; r.x.drawImage(rawC, 0, 0, r.c.width, r.c.height);
  }
  return true;
}
function histAt(ago, now){
  if (histHead < 0) return null;
  const want = now - ago * 1000; let best = null;
  for (let k = 0; k < HIST_N; k++){ const r = HIST[(histHead - k + HIST_N) % HIST_N]; if (r.t < -1e8) break; best = r; if (r.t <= want) break; }
  return best;
}

/* ---------- people: pose → ear / chest / hand anchors (screen px), guarded ---------- */
const PEOPLE = [];          // up to 2 { ears:[[x,y],[x,y]], head, hand:[x,y]|null, handAng, chest:[x,y], seen, sy, vy, lastObs }
const JUMP = { cool:0, n:0 };
function lmOK(L, i){ const p = L[i]; return p && fin(p.x) && fin(p.y) && (p.visibility == null || !fin(p.visibility) || p.visibility > .35) && p.x > -.3 && p.x < 1.3 && p.y > -.3 && p.y < 1.5; }
function ingestPoses(poses, now){
  if (!Array.isArray(poses)) poses = [];
  const seen = [];
  for (const L of poses){
    if (!Array.isArray(L) || L.length < 25) continue;
    let eL = lmOK(L, 7) ? toScr(L[7].x, L[7].y) : null, eR = lmOK(L, 8) ? toScr(L[8].x, L[8].y) : null;
    const nose = lmOK(L, 0) ? toScr(L[0].x, L[0].y) : null;
    const sL = lmOK(L, 11) ? toScr(L[11].x, L[11].y) : null, sR = lmOK(L, 12) ? toScr(L[12].x, L[12].y) : null;
    if (!eL && !eR && !nose) continue;
    // estimate a missing ear from the other ear or the nose
    let head = 0;
    if (eL && eR) head = Math.hypot(eL[0] - eR[0], eL[1] - eR[1]);
    if (!(head > G.short * .02)) head = sL && sR ? Math.hypot(sL[0] - sR[0], sL[1] - sR[1]) * .45 : G.short * .12;
    if (!eL && !eR){ eL = [nose[0] - head * .5, nose[1] - head * .05]; eR = [nose[0] + head * .5, nose[1] - head * .05]; }

/* ---------- the cord: a verlet rope — two branches from the ears meet at a free Y, one cord to the hand ---------- */

  ctx.moveTo(r.x[NB], r.y[NB]); for (let k = NB + 1; k < 2 * NB; k++) ctx.lineTo(r.x[k], r.y[k]); ctx.lineTo(r.x[r.Y], r.y[r.Y]);

  ctx.beginPath(); ropePath(r, r.Y, r.end, 1); ctx.stroke();
  // the slider at the Y
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(r.x[r.Y], r.y[r.Y] + lw * .4, lw * 1.3, lw * 2.4, 0, 0, 7); ctx.fill();
  if (!p.lost){
    // earbuds
    for (const e of [0, NB]){
      const x = r.x[e], y = r.y[e];
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, h * .15, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.arc(x + h * .04, y + h * .04, h * .07, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x, y + h * .19, h * .05, h * .1, 0, 0, 7); ctx.fill();
    }
    // the player in the hand
    if (S.player && p.hand){
      const [x, y] = [r.x[r.end], r.y[r.end]], pw = h * .5, ph = h * .82;
      ctx.translate(x, y); ctx.rotate(p.sm.ang);
      ctx.fillStyle = '#fff'; ctx.beginPath(); rr(-pw / 2, 0, pw, ph, pw * .14); ctx.fill();
      ctx.fillStyle = 'rgba(11,11,11,.85)'; ctx.beginPath(); rr(-pw * .38, ph * .08, pw * .76, ph * .36, pw * .05); ctx.fill();
      ctx.strokeStyle = 'rgba(11,11,11,.22)'; ctx.lineWidth = Math.max(1, pw * .05); ctx.beginPath(); ctx.arc(0, ph * .7, pw * .27, 0, 7); ctx.stroke();
    }
  }
  ctx.restore();
}
function rr(x, y, w, h, r){ ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function loop(now){
  requestAnimationFrame(loop);
  const dt = clamp((now - (lastT || now)) / 1000, 0, TEST.maxDt); lastT = now; frameN++;
  resize();
  detect(now);
  MODE.X += dt; JUMP.cool -= dt; micCool -= dt;
  schedule();
  // audio-timed events (cuts on the bar, cords bounce on the kick)
  if (actx){
    const at = actx.currentTime;
    while (SEQ.events.length && SEQ.events[0].t <= at){
      const ev = SEQ.events.shift();
      if (!MODE.on) continue;
      if (ev.kind === 'bar') cutColour(now, false);
      if (ev.kind === 'kick') for (const p of PEOPLE) kick(p, .8);
    }
    if (SEQ.events.length > 64) SEQ.events.splice(0, SEQ.events.length - 64);
  }
  // mic onsets
  if (S.mic && micAn && MODE.on){
    micAn.getFloatTimeDomainData(micBuf);
    let e = 0; for (let i = 0; i < micBuf.length; i++) e += micBuf[i] * micBuf[i];
    e = Math.sqrt(e / micBuf.length);
    if (e > .04 && e > micPrev * 1.8 && micCool <= 0){ micCool = .3; cutColour(now, false); for (const p of PEOPLE) kick(p, 1.2); }
    micPrev = micPrev * .85 + e * .15;
  }
  // people: smooth the anchors, step the cords; lost people's cords fall away
  for (const p of PEOPLE){
    if (now - p.seen > 450){ p.lost = true; p.vy = 0; p.lastObs = -1; }
    const sm = p.sm, k = clamp(dt * 22, 0, 1);
    sm.head += (p.head - sm.head) * k;
    for (const [a, b] of [[sm.eL, p.eL], [sm.eR, p.eR]]){ a[0] += (b[0] - a[0]) * k; a[1] += (b[1] - a[1]) * k; }
    const tgt = S.player && p.hand ? p.hand : [p.chest[0] + sm.head * .6, G.H + sm.head * 2.5];     // the pocket: off the bottom
    sm.hand[0] += (tgt[0] - sm.hand[0]) * k; sm.hand[1] += (tgt[1] - sm.hand[1]) * k;
    let da = p.ang - sm.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); sm.ang += da * k;
    if (MODE.on) stepRope(p, dt, p.lost);
  }
  for (let i = PEOPLE.length - 1; i >= 0; i--) if (PEOPLE[i].lost){ LOST.push(PEOPLE[i]); PEOPLE.splice(i, 1); }
  for (let i = LOST.length - 1; i >= 0; i--){
    const p = LOST[i]; p.fall = (p.fall || 0) + dt;
    if (MODE.on) stepRope(p, dt, true);
    if (p.fall > 2.5) LOST.splice(i, 1);
  }

  const W = G.W, H = G.H;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const camOn = !MODE.on;
  if (camOn){
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.save(); if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); }
    if (video.readyState >= 2) ctx.drawImage(video, mirror ? W - G.cox - G.cdw : G.cox, G.coy, G.cdw, G.cdh);
    ctx.restore();
    if (MODE.X < .12){ ctx.fillStyle = COLS[CUT.i]; ctx.globalAlpha = 1 - MODE.X / .12; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    return;
  }
  // the punch on a cut: a quick push-in, settling back
  const tc = (now - CUT.last) / 1000;
  const z = 1 + .035 * CUT.punch * Math.exp(-tc / .09);
  ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z), H / 2 * (1 - z));
  ctx.fillStyle = COLS[CUT.i]; ctx.fillRect(-W, -H, W * 3, H * 3);
  const hasSil = SIL.has && (now - SIL.t < 1500 || EXT.on);
  if (hasSil){
    // echoes: one step darker than the ground, only visible where you have moved
    if (S.echo > 0){
      const e1 = histAt(.09 + S.echo * .12, now), e2 = histAt(.2 + S.echo * .26, now);
      if (e2) drawTinted(e2.c, ECHO[CUT.i], .55 + .45 * S.echo);
      if (e1) drawTinted(e1.c, shade(ECHO[CUT.i]), .7 + .3 * S.echo);
    }
    drawTinted(rawC, '#0b0b0b', 1);
  }
  // the cord falls in on the cut
  for (const p of LOST) drawCord(p, clamp(1 - (p.fall - 1.5), 0, 1));
  for (const p of PEOPLE) drawCord(p, 1);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // the cut itself: one frame of black, then the colour
  if (MODE.X < .07){ ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0, 0, W, H); }
}
const shadeCache = {};
function shade(hex){
  if (shadeCache[hex]) return shadeCache[hex];
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) * .62 | 0, g = (n >> 8 & 255) * .62 | 0, b = (n & 255) * .62 | 0;
  return shadeCache[hex] = `rgb(${r},${g},${b})`;
}

/* ---------- test hook ---------- */
window.__nori = {
  feed(poses, masks, t){ if (!EXT.on) setStatus(''); EXT.on = true; const now = t == null ? performance.now() : t;
    let n = 0; try { n = ingestPoses(poses, now); } catch(e){ throw e; }
    if (masks) ingestMasks(masks, now); return n; },
  setMode, cut:() => cutColour(performance.now(), true), test:TEST, S,
  state(){ return { frame:frameN, mode:MODE.on, colour:CUT.i, cuts:CUT.n, jumps:JUMP.n, people:PEOPLE.length, lost:LOST.length,
    ends: PEOPLE.map(p => ({ ear:[+p.rope.x[0].toFixed(1), +p.rope.y[0].toFixed(1)], earT:p.sm.eL.map(v => +v.toFixed(1)), Y:[+p.rope.x[p.rope.Y].toFixed(1), +p.rope.y[p.rope.Y].toFixed(1)],
      end:[+p.rope.x[p.rope.end].toFixed(1), +p.rope.y[p.rope.end].toFixed(1)], hand:p.sm.hand.map(v => +v.toFixed(1)), finite:[...p.rope.x, ...p.rope.y].every(Number.isFinite) })),
    audio: actx ? actx.state : 'none' }; },
};
</script>
