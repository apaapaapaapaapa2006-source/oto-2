<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="白い紙の上に、自分が淡い墨絵になって映る。動いた跡から墨が水の中のようにゆっくり湧き出して渦を巻き、速く動くほど大きく爆ぜる。">
<meta name="theme-color" content="#f1ede4">
<title>SUMI ─ 動いた跡から墨が湧く</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  SUMI 墨 ─ 動いた跡から墨が湧く                    ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       水に墨を落とした瞬間のハイスピード写真と、余白の多い水墨画。
             あなたは生成りの紙の上に淡い墨の濃淡で描かれ、動いたところから
             濃い墨がスローモーションで湧き出し、ほどけ、渦を巻いて、ゆっくり
             薄れていく。止まっていれば墨は静かに沈み、紙は白に戻る。
  PALETTE    SUMI   紙 #f1ede4・墨 #121417（薄いところは青灰 #7d8794）
             AI     紙 #eef0ee・藍 #16264a
             BENI   紙 #f3ede6・紅 #6e0f1b（濃いところは黒に近い臙脂）
  TYPE       Shippori Antique B1（題字）。UI は小さく。
  MOTION     すべてスローモーション。墨は 8 秒ほどで薄れる。速い動きほど初速の
             大きな爆ぜ。フラッシュ・揺れは無し。
  SIGNATURE  動きの軌跡が、墨の雲になって残る。
  TECH       画面比の格子（短辺 140 セル）で墨の濃度と速度場を CPU で解く。
             流れはゆっくり回るカール・ノイズ＋動きが加える衝撃、濃度は
             セミ・ラグランジュ移流と弱い拡散と減衰。動き量は画面にそろえた
             輝度差を 1 秒あたりに直したもの（人物マスクの内側だけ）。描画は
             WebGL2 で、濃度から墨の階調・にじみの縁・紙の繊維をつくる。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1ede4;--ink:#121417;--dim:rgba(18,20,23,.5);--line:rgba(18,20,23,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px;text-align:center;
  background:radial-gradient(ellipse 60% 40% at 50% 32%,rgba(18,20,23,.85) 0%,rgba(18,20,23,.35) 35%,transparent 70%),var(--paper)}
#start h1{margin:0;font-family:"Shippori Antique B1",serif;font-weight:400;font-size:min(34vw,180px);line-height:1;color:var(--paper);margin-bottom:8vh}
#start p{margin:0;font-size:13px;line-height:2;color:var(--dim);letter-spacing:.1em}
#go{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);font:500 11px -apple-system,sans-serif;
  letter-spacing:.45em;padding:14px 34px 14px 40px;cursor:pointer}
#go:hover{background:var(--ink);color:var(--paper)}
#err{font-size:12px;line-height:1.8;max-width:320px;min-height:1em;white-space:pre-line;color:#8a1a24}

.btn{position:fixed;z-index:12;appearance:none;border:0;background:transparent;color:var(--ink);font:500 10px -apple-system,"Hiragino Sans",sans-serif;
  letter-spacing:.2em;padding:10px 8px;display:none;cursor:pointer;opacity:.55}
.btn.show{display:block}
.btn:hover{opacity:1}
#gear{right:10px;top:calc(env(safe-area-inset-top) + 6px);font-size:14px;letter-spacing:0}
#flip{right:10px;top:calc(env(safe-area-inset-top) + 40px);letter-spacing:.08em}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:12;display:none;justify-content:center;align-items:center;gap:30px}
#bar.show{display:flex}
#bar .btn{position:static;display:block}
#bar #shoot{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--ink);padding:0}
#shoot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--ink);opacity:.85}
#rec.on{opacity:1;color:#8a1a24}
#status{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:11;font-size:11px;line-height:1.7;color:var(--dim);
  pointer-events:none;max-width:72vw;white-space:pre-line}

#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 78px);z-index:12;width:min(270px,calc(100vw - 20px));
  background:rgba(241,237,228,.93);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:13px;transition:opacity .25s}
#panel.hide{opacity:0;pointer-events:none}
.chips{display:flex;border:1px solid var(--line)}
.chips button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink);padding:8px 2px;font:500 12px "Shippori Antique B1",serif;cursor:pointer;opacity:.5}
.chips button.on{opacity:1;background:rgba(18,20,23,.08)}
#panel label{display:flex;align-items:center;gap:10px;font-size:11px}
#panel label span{width:72px;flex:none;color:var(--dim)}
#panel input[type=range]{flex:1;accent-color:var(--ink)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="clear" class="btn">白紙</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">墨</button>
    <button data-p="1">藍</button>
    <button data-p="2">紅</button>
  </div>
  <label><span>墨の量</span><input type="range" id="sAmt" min="0.3" max="2.5" step="0.05" value="1"></label>
  <label><span>うねり</span><input type="range" id="sFlow" min="0" max="2" step="0.05" value="1"></label>
  <label><span>残る長さ</span><input type="range" id="sLife" min="2" max="20" step="0.5" value="8"></label>
  <label><span>自分の濃さ</span><input type="range" id="sSelf" min="0" max="1" step="0.02" value="0.45"></label>
</div>

<div id="start">
  <h1>墨</h1>
  <p>動いた跡から、墨が湧く。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   SUMI — a small CPU fluid (curl-noise drift + motion impulses) carries
   ink density; motion inside the person's silhouette injects ink.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');

const PALS = [
  { paper:[.945,.929,.894], ink:[.071,.078,.090], thin:[.49,.53,.58], css:['#f1ede4','#121417'] },
  { paper:[.933,.941,.933], ink:[.086,.149,.290], thin:[.45,.53,.66], css:['#eef0ee','#16264a'] },
  { paper:[.953,.929,.902], ink:[.431,.059,.106], thin:[.70,.45,.47], css:['#f3ede6','#6e0f1b'] },
];
const S = { pal:0, amt:1, flow:1, life:8, self:.45 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uVid, uMask, uInk;
uniform vec2 uScale, uRes;
uniform float uMirror, uHas, uWhole, uSelf, uT;
uniform vec3 uPaper, uInkC, uThin;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y); }
float lum(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
void main(){
  vec2 s = vec2(uv.x, 1. - uv.y);                          // screen, y down (the ink grid is screen aligned)
  vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x;
  vec2 px = uv * uRes / min(uRes.x, uRes.y);
  // ink: the density field, its edges roughened by paper fibres
  vec2 wob = (vec2(vn(px*38.), vn(px*38. + 7.)) - .5) * .004;
  vec2 it = .7 / vec2(textureSize(uInk, 0));
  float d = texture(uInk, s + wob).r * .4
          + (texture(uInk, s + wob + vec2(it.x, it.y)).r + texture(uInk, s + wob - vec2(it.x, it.y)).r
           + texture(uInk, s + wob + vec2(it.x, -it.y)).r + texture(uInk, s + wob - vec2(it.x, -it.y)).r) * .15;
  vec2 tx = 1.5 / uRes;
  float gx = texture(uInk, s + vec2(tx.x, 0.)).r - texture(uInk, s - vec2(tx.x, 0.)).r;
  float gy = texture(uInk, s + vec2(0., tx.y)).r - texture(uInk, s - vec2(0., tx.y)).r;
  float edge = clamp(length(vec2(gx, gy)) * 7., 0., 1.);    // wet edges gather pigment
  float a = 1. - exp(-d * 2.4);
  a *= .88 + .12 * vn(px * 21. + d * 2.);                    // pigment granulation inside dense ink
  a = clamp(a + edge * .35 * smoothstep(.05, .3, a), 0., 1.);
  vec3 inkc = mix(uThin, uInkC, smoothstep(.15, .85, a));
  // the person: a pale ink-wash portrait
  float m = uWhole > .5 ? 1. : (uHas > .5 ? smoothstep(.35, .7, texture(uMask, v).r) : 0.);
  float l = lum(textureLod(uVid, v, 1.).rgb);
  float wash = m * uSelf * (.25 + .75 * (1. - smoothstep(.1, .9, l)));
  // paper fibres
  float fib = vn(px * vec2(260., 40.)) * .5 + vn(px * vec2(40., 240.)) * .5;
  vec3 paper = uPaper * (.975 + .035 * fib);
  vec3 c = mix(paper, uThin * .9, wash * .8);
  c = mix(c, inkc, a);
  vec2 q = uv - .5; q.x *= uRes.x / uRes.y;
  c *= 1. - .12 * smoothstep(.5, 1.15, length(q));
  o = vec4(c, 1.);
}`;
let P, U = {}, texVid, texMask, texInk;
function initGL(){
  const mk = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  P = gl.createProgram(); gl.attachShader(P, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(P, mk(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(P, 0, 'p'); gl.linkProgram(P);
  if (!gl.getProgramParameter(P, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(P));
  gl.useProgram(P);
  const n = gl.getProgramParameter(P, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(P, i); U[u.name] = gl.getUniformLocation(P, u.name); }
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const tex = (unit, minF) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minF); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
  texVid = tex(0, gl.LINEAR_MIPMAP_LINEAR); texMask = tex(1, gl.LINEAR); texInk = tex(2, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  gl.activeTexture(gl.TEXTURE2); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, 1, 1, 0, gl.RED, gl.FLOAT, new Float32Array([0]));
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uInk, 2);
}

/* ---------- mask ---------- */
const M = { w:0, h:0, f:null, u8:null, present:false, cover:0, has:false, external:false };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || data.length < w*h) return;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.f = new Float32Array(w*h); M.u8 = new Uint8Array(w*h); }
  const F = M.f, U8 = M.u8; let on = 0;
  for (let i = 0, n = w*h; i < n; i++){
    let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1;
    F[i] = F[i]*.35 + m*.65; U8[i] = F[i]*255 | 0; if (F[i] > .5) on++;
  }
  M.cover = on/(w*h); M.present = M.cover > .006; M.has = true;
  if (gl && texMask){ gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, U8); }
}
let W = 0, H = 0, SX = 1, SY = 1, mirror = true, vidW = 1280, vidH = 720, fallback = false;
function whole(){ return (fallback && !M.external) || !M.has; }
function maskAtScreen(sx, sy){
  if (!M.has || !M.f) return 1;
  let vx = (sx - .5)*SX + .5, vy = (sy - .5)*SY + .5; if (mirror) vx = 1 - vx;
  const x = Math.min(M.w - 1, Math.max(0, vx*M.w | 0)), y = Math.min(M.h - 1, Math.max(0, vy*M.h | 0));
  return M.f[y*M.w + x];
}

/* ---------- ink fluid (screen aligned grid, short edge = 140 cells) ---------- */
const G = { w:0, h:0, d:null, d2:null, vx:null, vy:null, t1:null, t2:null, e:null, prevL:null, total:0 };
function ensureGrid(){
  const gw = W >= H ? Math.round(140 * W / H) : 140, gh = W >= H ? 140 : Math.round(140 * H / W);
  if (G.w === gw && G.h === gh) return;
  G.w = gw; G.h = gh; const n = gw*gh;
  G.d = new Float32Array(n); G.d2 = new Float32Array(n); G.vx = new Float32Array(n); G.vy = new Float32Array(n);
  G.t1 = new Float32Array(n); G.t2 = new Float32Array(n); G.e = new Float32Array(n); G.prevL = null;
  mo.width = gw; mo.height = gh;
}
const mo = document.createElement('canvas'), moCtx = mo.getContext('2d', { willReadFrequently:true });
let moVT = -1, moT = 0, forced = -1;
function measureMotion(){
  const vt = video.currentTime; if (vt === moVT) return; moVT = vt;
  const gw = G.w, gh = G.h;
  const cw = vidW*SX, ch = vidH*SY, cx0 = (vidW - cw)/2, cy0 = (vidH - ch)/2;
  moCtx.save(); if (mirror){ moCtx.translate(gw, 0); moCtx.scale(-1, 1); }
  try { moCtx.drawImage(video, cx0, cy0, cw, ch, 0, 0, gw, gh); } catch(e){ moCtx.restore(); return; }
  moCtx.restore();
  let d; try { d = moCtx.getImageData(0, 0, gw, gh).data; } catch(e){ return; }
  const t = performance.now(), dtF = Math.min(.25, Math.max(.016, (t - moT)/1000)); moT = t;
  const fresh = !G.prevL; if (fresh) G.prevL = new Float32Array(gw*gh);
  const E = G.e, PL = G.prevL, wh = whole(), present = wh || M.present;
  for (let y = 0, i = 0; y < gh; y++) for (let x = 0; x < gw; x++, i++){
    const l = (d[i*4]*.299 + d[i*4+1]*.587 + d[i*4+2]*.114) / 255;
    let e = 0;
    if (!fresh){ const dl = Math.abs(l - PL[i]); e = dl > .07 ? dl / dtF : 0; }
    PL[i] = l;
    if (forced >= 0) e = forced;
    if (!present || (!wh && maskAtScreen((x + .5)/gw, (y + .5)/gh) < .3)) e = 0;
    E[i] = e;
  }
}
function sample(A, x, y, gw, gh){
  if (x < 0) x = 0; else if (x > gw - 1.001) x = gw - 1.001;
  if (y < 0) y = 0; else if (y > gh - 1.001) y = gh - 1.001;
  const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, i = y0*gw + x0;
  return (A[i]*(1-fx) + A[i+1]*fx)*(1-fy) + (A[i+gw]*(1-fx) + A[i+gw+1]*fx)*fy;
}
const STATS = { injected:0 };
function stepFluid(dt, t){
  const gw = G.w, gh = G.h, D = G.d, D2 = G.d2, VX = G.vx, VY = G.vy, E = G.e, T1 = G.t1;
  // body centre from the motion itself (ink bursts away from where you are)
  let sx = 0, sy = 0, n = 0;
  for (let y = 0, i = 0; y < gh; y++) for (let x = 0; x < gw; x++, i++) if (E[i] > 1){ sx += x; sy += y; n++; }
  const cx = n ? sx/n : gw/2, cy = n ? sy/n : gh/2;
  const thr = .7, amt = S.amt;
  { const T2 = G.t2;                                        // two box passes: a soft round source instead of blocky cells
    for (let pass = 0; pass < 2; pass++){
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){ let s = 0, c = 0;
        for (let k = -2; k <= 2; k++){ const xx = x + k; if (xx >= 0 && xx < gw){ s += E[y*gw + xx]; c++; } } T1[y*gw + x] = s/c; }
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){ let s = 0, c = 0;
        for (let k = -2; k <= 2; k++){ const yy = y + k; if (yy >= 0 && yy < gh){ s += T1[yy*gw + x]; c++; } } T2[y*gw + x] = s/c; }
      E.set(T2);
    } }
  let inj = 0;
  for (let y = 0, i = 0; y < gh; y++) for (let x = 0; x < gw; x++, i++){
    const e = E[i];
    if (e > thr){
      const k = Math.min(4, e - thr);
      if (D[i] < .9) D[i] = Math.min(1.2, D[i] + k * .45 * amt * dt * 6);   // fresh ink only where it is thin: no solid lump
      let dx = x - cx, dy = y - cy; const dl = Math.hypot(dx, dy) || 1;
      const push = k * 16 * dt * 6;
      VX[i] += dx/dl * push; VY[i] += dy/dl * push;              // outward from the body
      inj += k;
    }
  }
  STATS.injected += inj;
  // velocity: decay + light diffusion
  const vd = Math.exp(-dt * .55);
  // buoyancy: dense ink rises in plumes (the classic ink-in-water shot, turned over)
  for (let i = 0, n = gw*gh; i < n; i++) VY[i] -= Math.min(1.2, D[i]) * 14 * dt;
  for (let y = 1; y < gh - 1; y++) for (let x = 1; x < gw - 1; x++){
    const i = y*gw + x;
    T1[i] = (VX[i]*4 + VX[i-1] + VX[i+1] + VX[i-gw] + VX[i+gw]) / 8 * vd;
    G.t2[i] = (VY[i]*4 + VY[i-1] + VY[i+1] + VY[i-gw] + VY[i+gw]) / 8 * vd;
  }
  VX.set(T1); VY.set(G.t2);
  // advect ink along (impulse velocity + a slowly turning curl-noise drift), then diffuse and fade
  const fl = S.flow * 3, tt = t * .09, decay = Math.exp(-dt / S.life);
  let total = 0;
  for (let y = 0, i = 0; y < gh; y++){
    const yn = y / 140;
    for (let x = 0; x < gw; x++, i++){
      const xn = x / 140;
      // curl of a sum of sines: divergence-free, so the ink swirls instead of piling up
      const cu =  Math.cos(yn*5.1 + tt*1.3) * .9 + Math.cos(yn*9.7 - xn*3.1 + tt) * .5 + Math.cos(yn*21. + xn*6. - tt*2.) * .8;
      const cv = -Math.cos(xn*4.3 - tt*1.1) * .9 - Math.cos(xn*8.9 + yn*2.7 - tt*.8) * .5 - Math.cos(xn*19. - yn*7. + tt*1.7) * .8;
      const ux = VX[i] + cu * fl, uy = VY[i] + cv * fl;
      D2[i] = sample(D, x - ux*dt, y - uy*dt, gw, gh);
    }
  }
  for (let y = 0, i = 0; y < gh; y++) for (let x = 0; x < gw; x++, i++){
    let v = D2[i];
    if (x > 0 && y > 0 && x < gw - 1 && y < gh - 1) v = v*.94 + (D2[i-1] + D2[i+1] + D2[i-gw] + D2[i+gw]) * .015;
    v *= decay; D[i] = v; total += v;
  }
  G.total = total / (gw*gh);
  if (gl && texInk){ gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texInk);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, gw, gh, 0, gl.RED, gl.FLOAT, D); }
}

/* ---------- MediaPipe ---------- */
let segmenter = null, lastTs = 0, lastVT = -1;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    setStatus('');
  }catch(e){
    if (M.external) return;
    fallback = true;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n画面全体の動きから墨を出して続けます。');
  }
}
function segment(now){
  if (!segmenter || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastVT) return; lastVT = vt;
  try{
    const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks;
      if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1];                  // 2 masks → [0] is background, [1] is the person
      ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
    });
  }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', started = false;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  G.prevL = null;
}

/* ---------- audio: a low swell that follows how much ink is moving ---------- */
let actx = null, bus = null, recDest = null, swell = null, swellLP = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .5; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  const len = actx.sampleRate*3, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++){ last = last*.98 + (Math.random()*2 - 1)*.2; d[i] = last; }
  const s = actx.createBufferSource(); s.buffer = b; s.loop = true;
  swellLP = actx.createBiquadFilter(); swellLP.type = 'lowpass'; swellLP.frequency.value = 200; swellLP.Q.value = 2;
  swell = actx.createGain(); swell.gain.value = 0;
  s.connect(swellLP); swellLP.connect(swell); swell.connect(bus); s.start();
  actx.resume().catch(()=>{});
}
function click(){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, len = actx.sampleRate*.025 | 0, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 5);
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 1.2;
  s.connect(f); f.connect(bus); s.start(t);
}

$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!P) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','clear'].forEach(id => $(id).classList.add('show'));
  if (!started){ started = true; initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('clear').onclick = () => { if (G.d){ G.d.fill(0); G.vx.fill(0); G.vy.fill(0); } click(); };
function setPal(i){
  S.pal = i; const p = PALS[i];
  [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
  const r = document.documentElement.style; r.setProperty('--paper', p.css[0]); r.setProperty('--ink', p.css[1]);
}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sAmt','amt'],['sFlow','flow'],['sLife','life'],['sSelf','self']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

$('shoot').onclick = () => {
  click();
  try{ canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'sumi-' + Date.now() + '.png'; a.click(); }, 'image/png'); }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'sumi.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- loop ---------- */
let lastT = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.05, (now - lastT)/1000) : 1/60; lastT = now;
  if (video.videoWidth){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let w = Math.round(innerWidth*dpr), h = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1600 / Math.max(w, h)); w = Math.round(w*k); h = Math.round(h*k);
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  W = w; H = h;
  const sa = W/H, va = vidW/vidH; SX = sa < va ? sa/va : 1; SY = sa < va ? 1 : va/sa;
  ensureGrid();
  if (!M.external) segment(now);
  if (video.readyState < 2) return;
  measureMotion();
  stepFluid(dt, now/1000);
  if (swell && actx){ const tt = actx.currentTime, a = Math.min(1, G.total*3);
    swell.gain.setTargetAtTime(a*.5, tt, .3); swellLP.frequency.setTargetAtTime(120 + a*500, tt, .3); }

  gl.viewport(0, 0, W, H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); gl.generateMipmap(gl.TEXTURE_2D); } catch(e){ return; }
  const pal = PALS[S.pal];
  gl.useProgram(P);
  gl.uniform2f(U.uScale, SX, SY); gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(U.uHas, M.has && M.present ? 1 : 0);
  gl.uniform1f(U.uWhole, whole() ? 1 : 0);
  gl.uniform1f(U.uSelf, S.self); gl.uniform1f(U.uT, now/1000);
  gl.uniform3fv(U.uPaper, pal.paper); gl.uniform3fv(U.uInkC, pal.ink); gl.uniform3fv(U.uThin, pal.thin);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__SUMI = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; fallback = false; ingestMask(d, w, h); },
  palette(i){ setPal(i); },
  state: () => ({ present:M.present, cover:M.cover, ink:G.total, injected:STATS.injected, fallback }),
};
</script>
