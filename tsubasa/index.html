<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人がスタジオの紙の前に立つモノクロの肖像になり、肩から大きな黒い翼がひらく。腕を広げれば翼も広がり、跳べば羽ばたいて羽根が舞い散る。">
<meta name="theme-color" content="#0c0c0e">
<title>TSUBASA ─ 肩からひらく、黒い翼</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  TSUBASA 翼 ─ 肩からひらく、黒い翼                  ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       ハイブランドのファッションフィルム。灰色のスタジオ紙の前に立つ
             モノクロの人物の肩から、漆黒の翼がひらく。腕を広げれば翼も
             広がり、腕を上げれば翼も上がる。跳べば一度大きく羽ばたいて、
             羽根がゆっくり舞い落ちる。
  PALETTE    NOIR   紙 #d8d4cc → #77736d ／ 翼 #0d0d10〜#2c2e33 ／ 縁 #8a8f99
             BLANC  闇 #26262a → #050506 ／ 翼 象牙 #f4f0e8 ／ 縁 #8d877c
             SANG   牛血 #6b1418 → #1a0507 ／ 翼 黒 ／ 縁 #8a3034
             人物は常にモノクロ。色は背景と翼の縁の一色だけ。
  TYPE       Cormorant Garamond 300 Italic（題字）・IBM Plex Mono 300（UI）。
  MOTION     翼はばねで追従し、ゆっくり開閉する。羽ばたきは跳んだときだけ。
             舞い散る羽根は揺れながら 3〜5 秒かけて落ちて消える。
  SIGNATURE  人の動きをそのまま写す翼と、紙に落ちる翼の影。
  TECH       PoseLandmarker（肩・肘・手首）で翼の骨格を決め、ImageSegmenter
             の人物マスクで「紙 → 翼 → 人物 → 手前の羽根」の順に WebGL2 で
             重ねる。翼は 2D キャンバスに羽根を一枚ずつ描いてテクスチャ化し、
             ミップマップから影を落とす。素のカメラ ⇄ 翼 を切り替えられる。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0e;--fg:#ecebe7;--dim:rgba(236,235,231,.56);--line:rgba(236,235,231,.24)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
  font-family:"IBM Plex Mono",ui-monospace,"Hiragino Sans","Noto Sans JP",monospace;font-weight:300}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding:28px;text-align:center;background:radial-gradient(ellipse at 50% 42%,#2a2a2e 0%,#0c0c0e 72%)}
#start .t{font-size:10px;letter-spacing:.62em;margin-right:-.62em;color:var(--dim)}
#start h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:300;font-size:min(21vw,124px);line-height:.95;letter-spacing:.01em}
#start p{margin:0;font-size:12px;line-height:2.1;color:var(--dim);letter-spacing:.06em}
#go{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:500 10px "IBM Plex Mono",monospace;
  letter-spacing:.5em;padding:15px 34px 15px 40px;cursor:pointer;transition:border-color .3s}
#go:hover{border-color:var(--fg)}
#err{font-size:12px;line-height:1.8;max-width:340px;min-height:1em;white-space:pre-line;color:#e0a7a7}

.btn{position:fixed;z-index:12;appearance:none;border:0;background:transparent;color:var(--fg);font:500 10px "IBM Plex Mono","Hiragino Sans",monospace;
  letter-spacing:.24em;padding:10px 8px;display:none;cursor:pointer;opacity:.62;transition:opacity .3s;text-shadow:0 0 6px rgba(0,0,0,.35)}
.btn.show{display:block}
.btn:hover{opacity:1}
#gear{right:10px;top:calc(env(safe-area-inset-top) + 6px);font-size:14px;letter-spacing:0}
#flip{right:10px;top:calc(env(safe-area-inset-top) + 40px);letter-spacing:.1em}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:12;display:none;justify-content:center;align-items:center;gap:26px}
#bar.show{display:flex}
#bar .btn{position:static;display:block}
#bar #shoot{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--fg);padding:0;opacity:.75}
#shoot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--fg);opacity:.85}
#rec.on{opacity:1;color:#e58a8a}
#mode{border:1px solid var(--line);padding:11px 16px 11px 20px;opacity:.85;background:rgba(12,12,14,.28)}
#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 14px);z-index:11;font-size:9px;letter-spacing:.34em;color:var(--dim);
  pointer-events:none;display:none;line-height:2;white-space:pre;text-shadow:0 0 6px rgba(0,0,0,.35)}
#hud.show{display:block}
#status{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:11;font-size:11px;letter-spacing:.04em;
  color:var(--fg);opacity:.75;pointer-events:none;line-height:1.7;white-space:pre-line;text-align:center;text-shadow:0 0 8px rgba(0,0,0,.5)}

#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 78px);z-index:12;width:min(270px,calc(100vw - 20px));
  background:rgba(12,12,14,.86);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:13px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .25s}
#panel.hide{opacity:0;pointer-events:none}
.chips{display:flex;border:1px solid var(--line)}
.chips button{flex:1;appearance:none;border:0;background:transparent;color:var(--fg);padding:8px 2px;font:500 9px "IBM Plex Mono",monospace;
  letter-spacing:.2em;cursor:pointer;opacity:.55}
.chips button.on{opacity:1;background:rgba(236,235,231,.12)}
#panel label{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.04em}
#panel label span{width:78px;flex:none;color:var(--dim)}
#panel input[type=range]{flex:1;accent-color:#a9adb5}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="mode" class="btn">翼をひらく</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">NOIR</button>
    <button data-p="1">BLANC</button>
    <button data-p="2">SANG</button>
  </div>
  <label><span>翼の大きさ</span><input type="range" id="sSize" min="0.6" max="1.5" step="0.01" value="1"></label>
  <label><span>羽根の散り</span><input type="range" id="sShed" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>コントラスト</span><input type="range" id="sCon" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>粒子</span><input type="range" id="sGrain" min="0" max="1" step="0.01" value="0.4"></label>
</div>

<div id="start">
  <div class="t">WINGS · 翼</div>
  <h1>Tsubasa</h1>
  <p>肩から、黒い翼がひらく。<br>腕を広げれば翼も広がり、跳べば羽ばたく。</p>
  <button id="go">はじめる</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   TSUBASA — wings drawn feather by feather on a 2D canvas, rigged to the
   pose (shoulders, elbows, wrists), composited in WebGL2 between a studio
   paper backdrop and the segmented person, with a soft cast shadow.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');

const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
const PALS = [
  { name:'NOIR',  hi:'#d8d4cc', lo:'#6f6b65', sh:'#0d0d0f', ph:'#f3f1ec', shadow:.42,
    wing:['#09090b','#0f0f12','#16171a','#1f2024','#2b2d33','#3c4048'], edge:'rgba(150,156,168,.36)', shaft:'rgba(92,96,106,.7)', dark:'rgba(0,0,0,.45)' },
  { name:'BLANC', hi:'#2a2a2e', lo:'#040405', sh:'#050506', ph:'#e9e6e0', shadow:.0,
    wing:['#b9b2a6','#c9c2b6','#d6d0c5','#e2ddd3','#ece8df','#f6f3ec'], edge:'rgba(120,112,100,.6)', shaft:'rgba(160,152,140,.75)', dark:'rgba(40,36,30,.35)' },
  { name:'SANG',  hi:'#74161b', lo:'#160406', sh:'#0a0506', ph:'#f0e6e2', shadow:.5,
    wing:['#080606','#0e0a0a','#140e0e','#1b1313','#231819','#2c1d1f'], edge:'rgba(176,60,64,.5)', shaft:'rgba(110,44,46,.7)', dark:'rgba(0,0,0,.5)' },
];
const S = { pal:0, size:1, shed:.5, con:.55, grain:.4 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uVid, uMask, uBack, uFront;
uniform vec2 uScale, uRes, uShadowOff;
uniform float uMirror, uHas, uFx, uDim, uGrain, uT, uCon, uShadow;
uniform vec3 uHi, uLo, uSh, uPh;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
float lum(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
void main(){
  vec2 v = (vec2(uv.x, 1. - uv.y) - .5) * uScale + .5;
  if (uMirror > .5) v.x = 1. - v.x;
  vec3 cam = texture(uVid, v).rgb;
  vec3 c = cam;
  if (uFx > .5){
    vec2 su = vec2(uv.x, 1. - uv.y);                         // 2D canvas space (y down)
    float m = uHas > .5 ? smoothstep(.45, .8, texture(uMask, v).r) : 0.;
    // the subject: hard monochrome, silver toned
    float l = clamp(lum(cam), 0., 1.);
    float k = mix(1.1, 2.2, uCon);
    l = clamp((l - .5) * k + .5 + .04, 0., 1.);
    l = l*l*(3. - 2.*l);
    vec3 person = mix(uSh, uPh, l);
    // studio paper sweep: a soft pool of light behind the subject
    vec2 q = uv - vec2(.5, .58); q.x *= uRes.x / uRes.y;
    float pool = 1. - smoothstep(.05, 1.0, length(q * vec2(.85, 1.15)));
    vec3 bg = mix(uLo, uHi, pool);
    if (uHas < .5) bg = person;                              // no mask: the whole frame is the print
    // the wings' shadow falls on the paper
    float sh = textureLod(uBack, su + uShadowOff, 4.5).a;
    bg *= 1. - uShadow * sh * uHas;
    vec4 bk = texture(uBack, su);
    c = mix(bg, bk.rgb, bk.a);
    c = mix(c, person, m);
    vec4 fr = texture(uFront, su);
    c = mix(c, fr.rgb, fr.a);
    // vignette + grain
    vec2 r = uv - .5; r.x *= uRes.x / uRes.y;
    c *= 1. - .42 * smoothstep(.45, 1.1, length(r));
    float n = h21(floor(gl_FragCoord.xy / 1.5) + fract(uT * 7.13) * 91.7) - .5;
    c += n * uGrain * .1;
  }
  o = vec4(clamp(c * uDim, 0., 1.), 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let P = null, texVid, texMask, texBack, texFront;
function tex(filter){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
function initGL(){
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  P = { p, U };
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  texVid = tex(gl.LINEAR); texMask = tex(gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  texBack = tex(gl.LINEAR_MIPMAP_LINEAR); texFront = tex(gl.LINEAR);
}

/* ---------- wing canvases (reduced resolution) ---------- */
const back = document.createElement('canvas'), front = document.createElement('canvas');
const bx = back.getContext('2d'), fx = front.getContext('2d');
let WW = 2, WH = 2;

/* ---------- mask (reused buffers) ---------- */
const M = { w:0, h:0, f:null, u8:null, present:false, cover:0, has:false, external:false };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || data.length < w*h) return;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.f = new Float32Array(w*h); M.u8 = new Uint8Array(w*h); }
  const F = M.f, U8 = M.u8; let on = 0;
  for (let i = 0, n = w*h; i < n; i++){
    let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1;
    F[i] = F[i]*.3 + m*.7; U8[i] = F[i]*255 | 0; if (F[i] > .5) on++;
  }
  M.cover = on/(w*h); M.present = M.cover > .006; M.has = true;
  if (P){ gl.bindTexture(gl.TEXTURE_2D, texMask); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, U8); }
}

/* ---------- pose → rig (screen space of the wing canvases) ---------- */
let mirror = true, vidW = 1280, vidH = 720, scX = 1, scY = 1;
const R = { ok:false, lastSeen:-1e9, lastT:0,
  lx:0, ly:0, rx:0, ry:0, U:1,                 // shoulders (screen, smoothed), unit = shoulder width
  armL:0, armR:0, liftL:0, liftR:0,            // 0..1 how far each arm is out, -1..1 how high
  E:0, vy:0, lastJump:-1e9, beats:0 };
function toScr(p, out){
  let x = p.x; if (mirror) x = 1 - x;
  out[0] = ((x - .5) / scX + .5) * WW; out[1] = ((p.y - .5) / scY + .5) * WH;
  return out;
}
function lmk(a, i, vis){
  if (!a || a.length <= i) return null;
  const p = a[i];
  if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) return null;
  if (vis && Number.isFinite(p.visibility) && p.visibility < vis) return null;
  return p;
}
const _a = [0,0], _b = [0,0], _c = [0,0], _d = [0,0];
function lose(){ R.ok = false; R.E = 0; R.vy = 0; F.v = 0; }
function onPose(lms, tMs){
  if (!Number.isFinite(tMs)) return;
  const A = lmk(lms, 11, .3), B = lmk(lms, 12, .3);
  if (!A || !B){ if (tMs - R.lastSeen > 400) lose(); return; }
  toScr(A, _a); toScr(B, _b);
  let lx = _a[0], ly = _a[1], rx = _b[0], ry = _b[1];
  let li = 13, ri = 14, lw = 15, rw = 16;                    // elbow / wrist on the same side as A
  if (lx > rx){ [lx, rx] = [rx, lx]; [ly, ry] = [ry, ly]; li = 14; ri = 13; lw = 16; rw = 15; }
  const U = Math.hypot(rx - lx, ry - ly), short = Math.min(WW, WH);
  if (!(U > short*.06) || !(U < short*1.2)){ if (tMs - R.lastSeen > 400) lose(); return; }
  const dtO = Math.min(.25, Math.max(.005, (tMs - R.lastT)/1000));
  if (!R.ok || tMs - R.lastSeen > 400){              // (re)acquired: snap, no velocity
    R.lx = lx; R.ly = ly; R.rx = rx; R.ry = ry; R.U = U; R.E = 0; R.vy = 0;
    R.armL = R.armR = 0; R.liftL = R.liftR = 0; R.ok = true;
  } else {
    const mx0 = (R.lx + R.rx)/2, my0 = (R.ly + R.ry)/2, mx1 = (lx + rx)/2, my1 = (ly + ry)/2;
    const sp = Math.hypot(mx1 - mx0, my1 - my0) / R.U / dtO;
    const vy = -(my1 - my0) / R.U / dtO;               // + = rising
    R.vy = R.vy*.4 + vy*.6;
    R.E = R.E*.8 + Math.min(6, sp)*.2;
    if (R.vy > 1.25 && tMs - R.lastJump > 1100){ R.lastJump = tMs; beat(1); }
    const a = .55;
    R.lx += (lx - R.lx)*a; R.ly += (ly - R.ly)*a; R.rx += (rx - R.rx)*a; R.ry += (ry - R.ry)*a; R.U += (U - R.U)*a;
  }
  // arms: out-ness from the wrist (or elbow) relative to the shoulder; lift from height
  const arm = (si, wi, sx, sy, side) => {
    const W2 = lmk(lms, wi, .3) || lmk(lms, si, .3);
    if (!W2) return null;
    toScr(W2, _c);
    const out = ((_c[0] - sx) * side) / (R.U * 1.15);
    const up = (sy - _c[1]) / R.U;
    return [Math.max(0, Math.min(1, out)), Math.max(-1, Math.min(1.2, up))];
  };
  const L = arm(li, lw, R.lx, R.ly, -1), Rr = arm(ri, rw, R.rx, R.ry, 1);
  const k = .35;
  if (L){ R.armL += (L[0] - R.armL)*k; R.liftL += (L[1] - R.liftL)*k; } else { R.armL *= .9; R.liftL *= .9; }
  if (Rr){ R.armR += (Rr[0] - R.armR)*k; R.liftR += (Rr[1] - R.liftR)*k; } else { R.armR *= .9; R.liftR *= .9; }
  R.lastSeen = tMs; R.lastT = tMs;
}

/* ---------- wing dynamics ---------- */
const F = { f:0, v:0, sL:0, sR:0, alpha:0 };   // flap angle (+ up), velocity, spreads, wing opacity
function beat(power){
  F.v += 7.5 * power; R.beats++;
  burst(18 * power * (.4 + S.shed));
  whoosh(.8 * power);
}

/* ---------- loose feathers (fixed pool) ---------- */
const NF = 240;
const FL = { x:new Float32Array(NF), y:new Float32Array(NF), vx:new Float32Array(NF), vy:new Float32Array(NF),
  a:new Float32Array(NF), w:new Float32Array(NF), len:new Float32Array(NF), life:new Float32Array(NF), max:new Float32Array(NF),
  ph:new Float32Array(NF), tone:new Uint8Array(NF), fr:new Uint8Array(NF) };
let flNext = 0;
const CAND = new Float32Array(2 * 64); let candN = 0;   // feather tips from the last wing pass
function spawn(x, y, vx, vy, len){
  const i = flNext; flNext = (flNext + 1) % NF;
  FL.x[i] = x; FL.y[i] = y; FL.vx[i] = vx; FL.vy[i] = vy; FL.a[i] = Math.random()*6.28; FL.w[i] = (Math.random() - .5)*3;
  FL.len[i] = len; FL.max[i] = 3 + Math.random()*2.2; FL.life[i] = FL.max[i]; FL.ph[i] = Math.random()*6.28;
  FL.tone[i] = Math.random()*6 | 0; FL.fr[i] = Math.random() < .45 ? 1 : 0;
}
function burst(n){
  if (!candN || F.alpha < .2) return;
  for (let k = 0; k < n; k++){
    const c = (Math.random()*candN) | 0, U = R.U;
    spawn(CAND[c*2], CAND[c*2+1], (Math.random() - .5)*U*1.6, (-.2 - Math.random()*.8)*U, U*(.15 + Math.random()*.16));
  }
}

/* ---------- drawing ---------- */
function feather(ctx, x, y, ang, L, wf, curl, fill, edge, shaft, lw){
  const c = Math.cos(ang), s = Math.sin(ang), nx = -s, ny = c, W = L*wf;
  const tx = x + c*L + nx*curl*L, ty = y + s*L + ny*curl*L;
  ctx.beginPath();
  ctx.moveTo(x + nx*W*.22, y + ny*W*.22);
  ctx.quadraticCurveTo(x + c*L*.58 + nx*W, y + s*L*.58 + ny*W, tx, ty);
  ctx.quadraticCurveTo(x + c*L*.5 - nx*W*.62, y + s*L*.5 - ny*W*.62, x - nx*W*.22, y - ny*W*.22);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (edge){ ctx.strokeStyle = edge; ctx.lineWidth = lw; ctx.stroke(); }
  if (shaft){
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + c*L*.55 + nx*curl*L*.3, y + s*L*.55 + ny*curl*L*.3, x + c*L*.92 + nx*curl*L*.85, y + s*L*.92 + ny*curl*L*.85);
    ctx.strokeStyle = shaft; ctx.lineWidth = lw*.8; ctx.stroke();
  }
}
const lerp = (a, b, t) => a + (b - a)*t;
const J = new Float32Array(8);  // joint scratch: root, elbow, wrist, tip (x,y)
// one wing; side = -1 (screen left) or +1; math angles are y-up and mirrored through `side`
// three key poses: tucked (s=0), raised arch (s=.4), spread (s=1)
const KP = [[1.45, -1.6, -1.62, .18], [1.18, .78, -.12, .72], [.62, .3, .04, 1]];
function pose3(s, k){ return s < .4 ? lerp(KP[0][k], KP[1][k], s/.4) : lerp(KP[1][k], KP[2][k], (s - .4)/.6); }
function wing(ctx, rx, ry, side, U, s, f, lift, t, pal, E){
  const sz = U * S.size * 1.05, lw = Math.max(.5, sz*.0055);
  const tilt = Math.max(0, Math.min(.5, (WH/WW - 1)*.45)) * Math.min(1, s*2.5);
  const a1 = pose3(s, 0) + .5*f + lift*.42 + tilt*.6;
  const a2 = pose3(s, 1) + .8*f + lift*.5 + tilt;
  const a3 = pose3(s, 2) + 1.0*f + lift*.55 + tilt;
  const fan = pose3(s, 3);
  const L1 = sz*.6, L2 = sz*.86, L3 = sz*.7;
  const X = (a, L) => Math.cos(a)*L*side, Y = (a, L) => -Math.sin(a)*L;
  J[0] = rx; J[1] = ry;
  J[2] = J[0] + X(a1, L1); J[3] = J[1] + Y(a1, L1);
  J[4] = J[2] + X(a2, L2); J[5] = J[3] + Y(a2, L2);
  J[6] = J[4] + X(a3, L3); J[7] = J[5] + Y(a3, L3);
  const scr = a => side > 0 ? -a : Math.PI + a;       // math angle → screen angle (y down) for this side
  const curl = .06 * -side;
  const jit = .016 + .028*Math.min(2, E);
  const flut = i => Math.sin(t*9 + i*1.7) * jit;
  // one sheen across the whole wing: dark at the back, catching light toward the tip
  const gr = ctx.createLinearGradient(J[0], J[1], J[6], J[7] + sz*.6);
  pal.wing.forEach((c, i) => gr.addColorStop(i/(pal.wing.length - 1), c));
  const edge = pal.edge, shaft = pal.shaft, dark = pal.dark;
  // primaries — the long fan from the hand
  for (let i = 11; i >= 0; i--){
    const u = i/11, px = lerp(J[6], J[4], u*.95), py = lerp(J[7], J[5], u*.95);
    const a = a3 - lerp(.04, 1.25, u)*fan - (1 - fan)*.1 + flut(i);
    const L = sz*lerp(1.38, 1.0, u), sa = scr(a);
    feather(ctx, px + side*lw*3, py + lw*4, sa, L, .12, curl, dark, null, null, lw);
    feather(ctx, px, py, sa, L, .12, curl, gr, edge, shaft, lw);
    if (i % 2 === 0 && candN < 64){ CAND[candN*2] = px + Math.cos(sa)*L*.75; CAND[candN*2+1] = py + Math.sin(sa)*L*.75; candN++; }
  }
  // secondaries — along the forearm
  for (let j = 13; j >= 0; j--){
    const u = j/13, px = lerp(J[4], J[2], u), py = lerp(J[5], J[3], u);
    const a = a2 - lerp(1.35, 1.62, u)*fan - (1 - fan)*.06 + flut(j + 20);
    const L = sz*lerp(1.0, .74, u), sa = scr(a);
    feather(ctx, px + side*lw*3, py + lw*4, sa, L, .15, curl, dark, null, null, lw);
    feather(ctx, px, py, sa, L, .15, curl, gr, edge, shaft, lw);
    if (j % 3 === 0 && candN < 64){ CAND[candN*2] = px + Math.cos(sa)*L*.7; CAND[candN*2+1] = py + Math.sin(sa)*L*.7; candN++; }
  }
  // coverts: three shorter rows that scale down toward the leading edge
  for (let row = 0; row < 3; row++){
    const n = [22, 18, 24][row], Lr0 = sz*[.5, .32, .17][row], wf = [.26, .3, .42][row];
    for (let k = n - 1; k >= 0; k--){
      const u = k/(n - 1);
      let px, py, base;
      if (u < .4){ const v = u/.4; px = lerp(J[6], J[4], v*.9); py = lerp(J[7], J[5], v*.9); base = a3 - lerp(.3, .95, v)*fan - (1 - fan)*.1; }
      else if (u < .75){ const v = (u - .4)/.35; px = lerp(J[4], J[2], v); py = lerp(J[5], J[3], v); base = a2 - lerp(1.3, 1.55, v)*fan - (1 - fan)*.06; }
      else { const v = (u - .75)/.25; px = lerp(J[2], J[0], v); py = lerp(J[3], J[1], v); base = a1 - lerp(1.9, 2.5, v)*lerp(.6, 1, fan) + .2*f; }
      if ((row === 2 && u < .4) || (row > 0 && u >= .75)) continue;
      const Lr = u >= .75 ? Lr0*lerp(1.25, .7, (u - .75)/.25) : Lr0;
      const a = base + flut(k + 60 + row*30), sa = scr(a);
      feather(ctx, px + side*lw*2, py + lw*4, sa, Lr, wf, curl, dark, null, null, lw);
      feather(ctx, px, py, sa, Lr, wf, curl, gr, edge, row ? null : shaft, lw);
    }
  }
}
function drawLoose(dt, pal){
  const g = R.U * .35;
  for (let i = 0; i < NF; i++){
    if (FL.life[i] <= 0) continue;
    FL.life[i] -= dt;
    FL.ph[i] += dt*(2.2 + (i % 5)*.3);
    FL.vy[i] += g*dt; FL.vx[i] *= Math.exp(-dt*1.4); FL.vy[i] *= Math.exp(-dt*1.6);
    FL.x[i] += (FL.vx[i] + Math.cos(FL.ph[i])*R.U*.35)*dt; FL.y[i] += FL.vy[i]*dt;
    FL.a[i] += FL.w[i]*dt + Math.sin(FL.ph[i])*dt*.8;
    const k = FL.life[i]/FL.max[i], al = Math.min(1, k*3) * Math.min(1, (1 - k)*8 + .2);
    if (al <= .01) continue;
    const ctx = FL.fr[i] ? fx : bx;
    ctx.globalAlpha = al * F.alpha;
    feather(ctx, FL.x[i], FL.y[i], FL.a[i], FL.len[i], .2, .08, pal.wing[FL.tone[i]], pal.edge, pal.shaft, Math.max(.6, FL.len[i]*.02));
  }
  bx.globalAlpha = 1; fx.globalAlpha = 1;
}

/* ---------- MediaPipe (dynamic import; the camera still runs without it) ---------- */
let segmenter = null, poser = null, lastTs = 0, lastVT = -1, modelState = 'loading';
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const mk = async (Cls, o) => { try { return await Cls.createFromOptions(fs, { ...o, baseOptions:{ ...o.baseOptions, delegate:'GPU' } }); }
                                   catch(e){ return await Cls.createFromOptions(fs, { ...o, baseOptions:{ ...o.baseOptions, delegate:'CPU' } }); } };
    poser = await mk(vision.PoseLandmarker, { baseOptions:{ modelAssetPath:POSE_MODEL }, runningMode:'VIDEO', numPoses:1,
      minPoseDetectionConfidence:.5, minPosePresenceConfidence:.5, minTrackingConfidence:.5 });
    segmenter = await mk(vision.ImageSegmenter, { baseOptions:{ modelAssetPath:SEG_MODEL }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    modelState = 'ok';
  }catch(e){
    if (EXT) return;
    modelState = 'fail';
  }
}
function track(now){
  if (video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastVT) return; lastVT = vt;
  const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
  if (poser){
    try{ const r = poser.detectForVideo(video, ts); onPose(r && r.landmarks && r.landmarks[0], ts); }catch(e){}
  }
  if (segmenter){
    try{
      segmenter.segmentForVideo(video, ts, res => {
        const ms = res && res.confidenceMasks;
        if (!ms || !ms.length) return;
        const mk = ms[ms.length - 1];
        ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
      });
    }catch(e){}
  }
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', started = false, EXT = false;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  lose();
}

/* ---------- audio: wing beats and the shutter ---------- */
let actx = null, bus = null, recDest = null, noiseBuf = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .5; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  const len = actx.sampleRate * 1.2 | 0; noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
  actx.resume().catch(()=>{});
}
function whoosh(p){
  if (!actx || actx.state !== 'running' || !noiseBuf) return;
  const t = actx.currentTime, s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = .9;
  f.frequency.setValueAtTime(260, t); f.frequency.exponentialRampToValueAtTime(900, t + .18); f.frequency.exponentialRampToValueAtTime(180, t + .7);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.55*p, t + .12); g.gain.exponentialRampToValueAtTime(.001, t + .8);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + .85);
}
function click(){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, len = actx.sampleRate*.025 | 0, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 5);
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 1.2;
  s.connect(f); f.connect(bus); s.start(t);
}

/* ---------- mode: plain camera ⇄ wings ---------- */
const MODE = { on:false, t0:-1e9, fx:false, revealed:true };
function setMode(on){
  MODE.on = on; MODE.t0 = performance.now(); MODE.revealed = false;
  $('mode').textContent = on ? 'カメラにもどる' : '翼をひらく';
}

$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!P) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','mode','hud'].forEach(id => $(id).classList.add('show'));
  if (!started){ started = true; if (!EXT) initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('mode').onclick = () => { ensureAudio(); setMode(!MODE.on); };
addEventListener('keydown', e => { if (started && (e.key === ' ' || e.key === 'Enter') && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); setMode(!MODE.on); } });
function setPal(i){
  S.pal = i; [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sSize','size'],['sShed','shed'],['sCon','con'],['sGrain','grain']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

$('shoot').onclick = () => {
  click();
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'tsubasa-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'tsubasa.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
let lastT = 0, hudT = 0, shedAcc = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  const t = now/1000;
  if (video.videoWidth){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const kk = Math.min(1, 1500 / Math.max(W, H)); W = Math.round(W*kk); H = Math.round(H*kk);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  const ww = Math.max(64, Math.round(W*.75)), wh = Math.max(64, Math.round(H*.75));
  if (ww !== WW || wh !== WH){
    const sx = ww/WW, sy = wh/WH; WW = back.width = front.width = ww; WH = back.height = front.height = wh;
    R.lx *= sx; R.rx *= sx; R.ly *= sy; R.ry *= sy; R.U *= Math.min(sx, sy);
  }
  const sa = W/H, va = vidW/vidH; scX = sa < va ? sa/va : 1; scY = sa < va ? 1 : va/sa;
  if (!EXT) track(now);
  if (video.readyState < 2) return;

  // mode transition: dip to black, swap, rise
  const k = Math.min(1, (now - MODE.t0)/900);
  const dip = Math.sin(Math.PI*k);
  const fxVisible = MODE.on ? k >= .5 : k < .5;
  if (!MODE.revealed && k >= .5){
    MODE.revealed = true;
    if (MODE.on){ F.sL = F.sR = 0; F.f = -.3; F.v = 4; setTimeout(() => { burst(26*(.4 + S.shed)); whoosh(1); }, 220); }
  }
  MODE.fx = fxVisible;

  // wings
  const pal = PALS[S.pal];
  const show = fxVisible && R.ok;
  F.alpha += ((show ? 1 : 0) - F.alpha) * (1 - Math.exp(-dt*(show ? 3 : 6)));
  const tgtL = show ? Math.min(1, .34 + R.armL*.72 + R.E*.05) : 0;
  const tgtR = show ? Math.min(1, .34 + R.armR*.72 + R.E*.05) : 0;
  const ks = 1 - Math.exp(-dt*3.2);
  F.sL += (tgtL - F.sL)*ks; F.sR += (tgtR - F.sR)*ks;
  F.v += (-58*F.f - 5.2*F.v)*dt; F.f += F.v*dt;
  if (!Number.isFinite(F.f) || Math.abs(F.f) > 3){ F.f = 0; F.v = 0; }
  bx.clearRect(0, 0, WW, WH); fx.clearRect(0, 0, WW, WH);
  candN = 0;
  if (F.alpha > .01 && R.U > 1){
    const breathe = .035*Math.sin(t*1.5);
    const U = R.U, mx = (R.lx + R.rx)/2;
    // roots: on the upper back, a little inside each shoulder and above it
    bx.globalAlpha = F.alpha;
    wing(bx, lerp(R.lx, mx, .3), R.ly - U*.18, -1, U, F.sL, F.f + breathe, R.liftL, t, pal, R.E);
    wing(bx, lerp(R.rx, mx, .3), R.ry - U*.18,  1, U, F.sR, F.f + breathe, R.liftR, t + 1.3, pal, R.E);
    bx.globalAlpha = 1;
    // shedding grows with motion and with every beat
    if (show){
      shedAcc += dt * S.shed * (Math.max(0, R.E - .6)*16 + Math.abs(F.v)*1.4 + .25);
      while (shedAcc >= 1){ shedAcc -= 1; burst(1); }
    }
  }
  drawLoose(dt, pal);

  // upload & compose
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; }
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texBack);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, back); gl.generateMipmap(gl.TEXTURE_2D);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texFront);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, front);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.p); const U = P.U;
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uBack, 2); gl.uniform1i(U.uFront, 3);
  gl.uniform2f(U.uScale, scX, scY); gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uShadowOff, -.018, -.026);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uHas, M.has && M.present ? 1 : 0);
  gl.uniform1f(U.uFx, fxVisible ? 1 : 0); gl.uniform1f(U.uDim, 1 - .94*dip);
  gl.uniform1f(U.uGrain, S.grain); gl.uniform1f(U.uT, t); gl.uniform1f(U.uCon, S.con); gl.uniform1f(U.uShadow, pal.shadow);
  gl.uniform3fv(U.uHi, hex(pal.hi)); gl.uniform3fv(U.uLo, hex(pal.lo)); gl.uniform3fv(U.uSh, hex(pal.sh)); gl.uniform3fv(U.uPh, hex(pal.ph));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  hudT += dt;
  if (hudT > .25){ hudT = 0;
    $('hud').textContent = 'TSUBASA\n' + (fxVisible ? pal.name : 'CAMERA');
    let st = '';
    if (modelState === 'fail' && !EXT) st = '人物検出モデルを読み込めませんでした（ネット接続を確認）。';
    else if (fxVisible && !R.ok && (modelState === 'ok' || EXT)) st = '肩まで映るように、すこし離れてください。';
    if ($('status').textContent !== st && !$('status').textContent.startsWith('カメラを起動')) setStatus(st);
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__TSUBASA = {
  external(){ EXT = true; },
  ingestMask(d, w, h){ EXT = true; ingestMask(d, w, h); },
  pose(lms, tMs){ EXT = true; onPose(lms, tMs); },
  mode(on){ setMode(!!on); },
  palette(i){ setPal(i); },
  state: () => ({ ok:R.ok, U:R.U, lx:R.lx, ly:R.ly, rx:R.rx, ry:R.ry, E:R.E, sL:F.sL, sR:F.sR, f:F.f, alpha:F.alpha, beats:R.beats,
                  fx:MODE.fx, cand:candN, loose:Array.prototype.reduce.call(FL.life, (a, v) => a + (v > 0), 0), W:WW, H:WH }),
};
</script>
</body>
