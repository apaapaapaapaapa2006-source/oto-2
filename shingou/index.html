<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="白い壁の前で、あなたのシルエットが黒く抜かれ、その中をバーコード・点滅する格子・波形・1ビットの顔が帯になって流れる。止まれば整然と流れ、動けば体が横の帯ごとに裂けてずれ、帯の中身が切り替わる。">
<meta name="theme-color" content="#f2f1ed">
<title>SHINGOU ─ 体がデータの帯になって流れる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  SHINGOU 信号 ─ 体がデータの帯になって流れる              ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       白い展示室の壁に投影されたデータ・アート。あなたのシルエットだけが
             黒く抜かれ、その内側をバーコード、点滅する 2 進の格子、オシロの
             波形、細い罫、1 ビットに落とした顔が、横の帯になって左右に流れる。
             止まっていれば整然とした楽譜のよう。動けば体そのものが帯ごとに
             横へ裂けてずれ、帯の中身がカットで入れ替わる。
  PALETTE    WHITE  壁 #f2f1ed／体 #0b0b0b／差し色 #ff2a1a（走査線一本だけ）
             BLACK  反転：壁 #0b0b0b／体 #f2f1ed
             RED    壁 #f2f1ed／体 #0b0b0b／データが朱で刷られる
  TYPE       Chivo Mono 300/600（すべて等幅、小さく）
  MOTION     帯の流れは止まっていてもゆっくり続く。動きの量で 0.15 秒で速くなり
             1 秒で戻る。裂けとカットは動いている間だけ、カットは 0.3 秒に一度まで。
             切り替えは上から帯ごとに走査して入れ替わる。
  SIGNATURE  人の形をしたデータの流れと、動いた瞬間に横へ裂ける体。
  TECH       WebGL2 の一枚のシェーダ。帯の高さは画面の短辺基準。帯ごとの種類・
             速さ・向き・裂けの量はハッシュとカットの種から決まる。人物マスクは
             帯ごとにずらした位置で読むので、シルエット自体が裂ける。顔の帯は
             カメラの明るさを 8×8 のベイヤーで 1 ビットに落とす。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f1ed;--fg:#0b0b0b;--dim:rgba(11,11,11,.55);--line:rgba(11,11,11,.25);--acc:#ff2a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);font-family:"Chivo Mono",ui-monospace,monospace;font-weight:300}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px;padding:0 max(28px,12vw);background:var(--bg)}
#start .bars{width:min(76vw,360px);height:54px;background:repeating-linear-gradient(90deg,#0b0b0b 0 3px,transparent 3px 5px,#0b0b0b 5px 6px,transparent 6px 11px,#0b0b0b 11px 15px,transparent 15px 17px)}
#start .t{font-size:10px;letter-spacing:.4em;color:var(--dim)}
#start h1{margin:0;font-weight:600;font-size:min(13vw,74px);letter-spacing:.12em;line-height:1}
#start h1 i{font-style:normal;color:var(--acc)}
#start p{margin:0;font:13px/2 "Hiragino Sans","Noto Sans JP",sans-serif;color:var(--dim)}
#go{appearance:none;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font:600 11px "Chivo Mono",monospace;letter-spacing:.4em;padding:14px 28px 14px 32px;cursor:pointer}
#go:hover{background:transparent;color:var(--fg)}
#err{font:12px/1.8 "Hiragino Sans","Noto Sans JP",sans-serif;max-width:340px;min-height:1em;white-space:pre-line;color:#c4241a}
.btn{position:fixed;z-index:12;appearance:none;border:0;background:var(--bg);color:var(--fg);font:600 10px "Chivo Mono","Hiragino Sans",monospace;letter-spacing:.24em;padding:8px 9px;display:none;cursor:pointer;opacity:.85}
.btn.show{display:block}
.btn:hover{opacity:1}
#gear{right:10px;top:calc(env(safe-area-inset-top) + 8px);font-size:14px;letter-spacing:0}
#flip{right:10px;top:calc(env(safe-area-inset-top) + 44px);font:11px "Hiragino Sans","Noto Sans JP",sans-serif;letter-spacing:.08em}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:12;display:none;justify-content:center;align-items:center;gap:22px}
#bar.show{display:flex}
#bar .btn{position:static;display:block}

#hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:11;font-size:10px;letter-spacing:.2em;color:var(--fg);background:var(--bg);padding:5px 8px;
  pointer-events:none;display:none;line-height:1.8;white-space:pre}
#hud.show{display:block}
#status{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 64px);z-index:11;font:12px/1.7 "Hiragino Sans","Noto Sans JP",sans-serif;color:var(--fg);background:var(--bg);pointer-events:none;max-width:72vw;white-space:pre-line}
#status:empty{display:none}
#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 80px);z-index:12;width:min(270px,calc(100vw - 20px));background:var(--bg);border:1px solid var(--fg);
  padding:14px 16px;display:flex;flex-direction:column;gap:13px;transition:opacity .25s}
#panel.hide{opacity:0;pointer-events:none}
.chips{display:flex;border:1px solid var(--fg)}
.chips button{flex:1;appearance:none;border:0;background:transparent;color:var(--fg);padding:8px 2px;font:600 10px "Chivo Mono",monospace;letter-spacing:.16em;cursor:pointer;opacity:.55}
.chips button.on{opacity:1;background:var(--fg);color:var(--bg)}
#panel label{display:flex;align-items:center;gap:10px;font:11px "Hiragino Sans","Noto Sans JP",sans-serif}
#panel label span{width:74px;flex:none;color:var(--dim)}
#panel input[type=range]{flex:1;min-width:0;accent-color:var(--fg)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="mode" class="btn">▸ SHINGOU</button>
</div>
<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">WHITE</button>
    <button data-p="1">BLACK</button>
    <button data-p="2">RED</button>
  </div>
  <label><span>帯の太さ</span><input type="range" id="sBand" min="0" max="1" step="0.01" value="0.45"></label>
  <label><span>流れの速さ</span><input type="range" id="sSpeed" min="0" max="1" step="0.01" value="0.4"></label>
  <label><span>裂け方</span><input type="range" id="sTear" min="0" max="1" step="0.01" value="0.6"></label>
  <label><span>顔の帯</span><input type="range" id="sFace" min="0" max="1" step="0.01" value="0.7"></label>
</div>
<div id="start">
  <div class="bars" aria-hidden="true"></div>
  <div class="t">DATA · BODY · 01</div>
  <h1>SHINGOU<i>.</i></h1>
  <p>あなたの形をしたデータが流れる。<br>動くと、体が帯ごとに裂ける。</p>
  <button id="go">RUN</button>
  <div id="err"></div>
</div>
<script>
'use strict';
/* =====================================================================
   SHINGOU — the silhouette becomes a stack of horizontal data bands
   (barcode, binary grid, oscilloscope, hairlines, 1-bit face). Motion
   speeds the flow, tears the body sideways band by band and cuts the
   band contents.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');
const S = { pal:0, band:0.45, speed:0.4, tear:0.6, face:0.7 };
const PALS = [
  { name:'WHITE', wall:[.949,.945,.929], body:[.043,.043,.043], ink:[.949,.945,.929], css:['#f2f1ed','#0b0b0b'] },
  { name:'BLACK', wall:[.043,.043,.043], body:[.949,.945,.929], ink:[.043,.043,.043], css:['#0b0b0b','#f2f1ed'] },
  { name:'RED',   wall:[.949,.945,.929], body:[.043,.043,.043], ink:[1,.165,.102],   css:['#f2f1ed','#0b0b0b'] },
];

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D uVid, uMask; uniform vec2 uScale, uRes; uniform float uMirror, uHas;
uniform float uT, uE, uBand, uSeed, uTear, uFace, uReveal, uMix, uScan;
uniform vec2 uHeadY;                        // face band range in screen px (y down)
uniform vec3 uWall, uBody, uInk; uniform float uRed;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
float h11(float x){ return fract(sin(x*91.345)*47453.5453); }
vec2 toVid(vec2 px){ vec2 s = px/uRes; vec2 v = (s - .5)*uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
float bayer(vec2 p){                        // 8×8 ordered dither threshold
  ivec2 q = ivec2(mod(p, 8.));
  int m[64] = int[64](0,32,8,40,2,34,10,42, 48,16,56,24,50,18,58,26, 12,44,4,36,14,46,6,38, 60,28,52,20,62,30,54,22,
                      3,35,11,43,1,33,9,41, 51,19,59,27,49,17,57,25, 15,47,7,39,13,45,5,37, 63,31,55,23,61,29,53,21);
  return (float(m[q.y*8 + q.x]) + .5)/64.;
}
void main(){
  vec2 px = vec2(uv.x, 1. - uv.y)*uRes;
  float b = floor(px.y/uBand), by = fract(px.y/uBand);
  float r1 = h11(b + uSeed*13.1), r2 = h11(b*1.7 + uSeed*7.3 + 3.), r3 = h11(b*2.3 + uSeed*5.9 + 7.);
  // tear: each band slides sideways by its own amount while you move
  float shift = (r1 - .5)*2.*uTear*uE*uRes.x*.22;
  float sx = px.x + shift;
  float m = uHas > .5 ? texture(uMask, toVid(vec2(sx, px.y))).r : 0.;
  float inside = smoothstep(.45, .55, m);
  // band content
  float dir = r2 < .5 ? -1. : 1.;
  float speed = uBand*(1.5 + 5.*r3)*(.35 + 2.6*uE);
  float x = sx + dir*uT*speed;
  float type = floor(r2*5.);
  bool faceBand = px.y > uHeadY.x && px.y < uHeadY.y && r3 < uFace*1.15;
  float ink = 0.;
  if (faceBand){
    vec3 cam = texture(uVid, toVid(vec2(sx, px.y))).rgb;
    float l = dot(cam, vec3(.299,.587,.114));
    l = clamp((l - .12)/.7, 0., 1.);
    ink = step(bayer(floor(px/1.5)), l);
  } else if (type < 1.){                    // barcode
    float w = uBand*.11, col = floor(x/w);
    ink = step(.5, h21(vec2(col, b + uSeed))) * step(.12, by) * step(by, .88);
  } else if (type < 2.){                    // binary grid, flickering
    float c = uBand/3.2; vec2 cell = floor(vec2(x, px.y)/c);
    float on = step(.62, h21(cell + floor(uT*(6. + 18.*uE)) + uSeed));
    vec2 f = fract(vec2(x, px.y)/c);
    ink = on * step(.14, f.x) * step(f.x, .86) * step(.14, f.y) * step(f.y, .86);
  } else if (type < 3.){                    // oscilloscope
    float yv = .5 + .36*sin(x/uBand*(1.2 + 3.*r1) + uT*(1. + 4.*uE)) * sin(x/uBand*.27 + r3*6.);
    ink = 1. - smoothstep(.0, 1.6/uBand, abs(by - yv) - .6/uBand);
  } else if (type < 4.){                    // hairlines
    ink = step(.5, fract(px.y/3.)) * step(.2, by) * step(by, .8);
  } else {                                  // a single moving marker on black
    ink = step(fract(x/(uRes.x*.37)), .015);
  }
  vec3 body = mix(uBody, uInk, ink);
  // the wall: plain, with a faint registration grid
  float gs = min(uRes.x, uRes.y)/8.;
  vec2 g = abs(fract(px/gs) - .5)*gs;
  float grid = (1. - smoothstep(.0, 1., min(g.x, g.y) - .3)) * .06;
  vec3 wall = mix(uWall, uBody, grid);
  vec3 c = mix(wall, body, inside);
  // one red scan line drifting down; where it crosses the body it inverts the band
  float sl = abs(px.y - uScan);
  float scan = 1. - smoothstep(.6, 1.6, sl);
  if (inside > .5 && abs(floor(uScan/uBand) - b) < .5) c = mix(c, vec3(1.) - c, .85);
  c = mix(c, vec3(1.,.165,.102), scan*uRed);
  // reveal: the effect scans in from the top, band by band
  vec3 cam = texture(uVid, toVid(px)).rgb;
  float rv = step(b*uBand, uReveal*uRes.y);
  float edge = (1. - smoothstep(.0, 2., abs(px.y - uReveal*uRes.y)))*step(uReveal, .999);
  vec3 outc = mix(cam, c, rv*uMix);
  outc = mix(outc, vec3(1.,.165,.102), edge);
  o = vec4(outc, 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let P, U = {}, texVid, texMask;
function tex(){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
function initGL(){
  P = gl.createProgram(); gl.attachShader(P, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(P, sh(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(P, 0, 'p'); gl.linkProgram(P);
  if (!gl.getProgramParameter(P, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(P));
  const n = gl.getProgramParameter(P, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(P, i); U[u.name] = gl.getUniformLocation(P, u.name); }
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  texVid = tex(); texMask = tex(); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
}

/* ---------- mask (reused buffers) + head band + motion ---------- */
const M = { w:0, h:0, f:null, u8:null, present:false, has:false, external:false, diff:0, top:0, headH:0, cx:.5 };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || data.length < w*h) return;
  w |= 0; h |= 0;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.f = new Float32Array(w*h); M.u8 = new Uint8Array(w*h); }
  const F = M.f; let diff = 0, on = 0, sx = 0;
  for (let i = 0, n = w*h; i < n; i++){
    let m = +data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1;
    const f = F[i]*.3 + m*.7; diff += Math.abs(f - F[i]); F[i] = f; M.u8[i] = f*255 | 0;
  }
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (F[y*w + x] > .5){ on++; sx += x; }
  const was = M.present;
  M.present = on/(Math.ceil(w/2)*Math.ceil(h/2)) > .01;
  M.diff = was && M.present ? diff/(w*h) : 0;
  if (M.present){
    // head: the top of the silhouette near the body's centre line (raised arms are not the head)
    const bx = sx/on, half = Math.max(3, Math.round(w*.13)), x0 = Math.max(0, Math.round(bx - half)), x1 = Math.min(w, Math.round(bx + half));
    let top = -1, maxW = 0;
    for (let y = 0; y < h && top < 0; y++) for (let x = x0; x < x1; x++) if (F[y*w + x] > .5){ top = y; break; }
    if (top >= 0){
      for (let y = top; y < Math.min(h, top + Math.round(h*.12)); y++){ let c = 0; for (let x = x0; x < x1; x++) if (F[y*w + x] > .5) c++; if (c > maxW) maxW = c; }
      M.top = top/h; M.headH = Math.max(.05, Math.min(.45, maxW/w*(vidW/vidH)*1.35)); M.cx = bx/w;   // head height ≈ 1.35 × its width
    }
  }
  M.has = true;
  if (texMask){ gl.bindTexture(gl.TEXTURE_2D, texMask); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, M.u8); }
}
let segmenter = null, lastTs = 0, lastVT = -1;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); } catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    setStatus('');
  }catch(e){ if (!M.external) setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。'); }
}
function segment(now){
  if (!segmenter || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastVT) return; lastVT = vt;
  try{ const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    segmenter.segmentForVideo(video, ts, res => { const ms = res && res.confidenceMasks; if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1]; ingestMask(mk.getAsFloat32Array(), mk.width, mk.height); }); }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text; if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices; if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user'; video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
}

/* ---------- audio: sine ticks and clicks (AudioContext opens on the start button) ---------- */
let actx = null, bus = null, recDest = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .4; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  actx.resume().catch(()=>{});
}
function tick(f, dur, vol){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(0, t + dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .01);
}
function clickN(){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, n = 64, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (i < 3 ? 1 : 0)*(Math.random() < .5 ? -1 : 1);
  const s = actx.createBufferSource(); s.buffer = b; const g = actx.createGain(); g.gain.value = .5; s.connect(g); g.connect(bus); s.start(t);
}

/* ---------- mode ---------- */
const MODE = { on:false, t:9 };
function setMode(on){ if (on === MODE.on) return; MODE.on = on; MODE.t = 0; $('mode').textContent = on ? '◂ CAMERA' : '▸ SHINGOU'; clickN(); tick(on ? 8000 : 4000, .06, .08); }
$('mode').onclick = () => setMode(!MODE.on);
addEventListener('keydown', e => { if (started && (e.key === ' ' || e.key === 'Enter') && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); setMode(!MODE.on); } });
$('go').onclick = async () => {
  $('err').textContent = ''; ensureAudio();
  try { if (!gl) throw new Error('WebGL2 に未対応のブラウザです'); if (!P) initGL(); await startCam(); } catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','mode','hud'].forEach(id => $(id).classList.add('show'));
  if (!started){ started = true; initModel(); requestAnimationFrame(loop); }
  MODE.on = false; MODE.t = 9; setTimeout(() => setMode(true), 1400);
};
$('flip').onclick = async () => { const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); } };
$('gear').onclick = () => $('panel').classList.toggle('hide');
function setPal(i){ S.pal = i; const p = PALS[i], r = document.documentElement.style;
  r.setProperty('--bg', p.css[0]); r.setProperty('--fg', p.css[1]);
  r.setProperty('--dim', i === 1 ? 'rgba(242,241,237,.55)' : 'rgba(11,11,11,.55)'); r.setProperty('--line', i === 1 ? 'rgba(242,241,237,.25)' : 'rgba(11,11,11,.25)');
  [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i)); }
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sBand','band'],['sSpeed','speed'],['sTear','tear'],['sFace','face']].forEach(([id, k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });
$('shoot').onclick = () => { clickN(); try{ canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'shingou-' + Date.now() + '.png'; a.click(); }, 'image/png'); }catch(e){ setStatus('保存できませんでした。'); } };
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()]; if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {}); chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => { $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' })); a.download = 'shingou.' + ext; a.click(); };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- motion energy, cuts ---------- */
const TR = { energy:0, last:null, seed:1, lastCut:0, cuts:0, flow:0 };
function track(dt, now){
  let raw = 0;
  if (M.present){
    if (TR.last !== null && dt > 0) raw += Math.abs(M.cx - TR.last)/dt*2;
    TR.last = M.cx; raw += M.diff*30;
  } else TR.last = null;
  raw = Math.min(1, raw);
  const tau = raw > TR.energy ? .15 : 1.0;
  TR.energy += (raw - TR.energy)*(1 - Math.exp(-dt/tau));
  if (!(TR.energy >= 0)) TR.energy = 0;
  // a cut: band contents reshuffle — only while moving, at most every 0.3 s
  if (MODE.on && TR.energy > .45 && now - TR.lastCut > 300){ TR.lastCut = now; TR.seed = (TR.seed*7 + 3) % 997; TR.cuts++; clickN(); tick(6000 + Math.random()*6000, .03, .05); }
}

/* ---------- render ---------- */
let lastT = 0, hudT = 0, W = 2, H = 2;
function loop(now){
  requestAnimationFrame(loop);
  const rdt = lastT ? Math.min(.5, Math.max(0, (now - lastT)/1000)) : 1/60, dt = Math.min(.1, rdt); lastT = now;
  MODE.t += rdt;
  if (video.videoWidth){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.round(innerWidth*dpr); H = Math.round(innerHeight*dpr);
  const kk = Math.min(1, 1600/Math.max(W, H)); W = Math.round(W*kk); H = Math.round(H*kk);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  if (!M.external) segment(now);
  if (video.readyState < 2) return;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; }
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  const sa = W/H, va = vidW/vidH, SX = sa < va ? sa/va : 1, SY = sa < va ? 1 : va/sa;
  track(rdt, now);
  TR.flow += dt*(.3 + S.speed*1.6);
  const E = Math.min(1, TR.energy);
  const reveal = MODE.on ? Math.min(1, MODE.t/.9) : Math.max(0, 1 - MODE.t/.5);
  const band = Math.min(W, H)*(.018 + S.band*.05);
  // face band range on screen (y down, px)
  const topS = ((M.top - .5)/SY + .5)*H, hh = M.headH*H/SY*.9;
  const pal = PALS[S.pal];
  gl.viewport(0, 0, W, H); gl.useProgram(P);
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1);
  gl.uniform2f(U.uScale, SX, SY); gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(U.uHas, M.has && M.present ? 1 : 0);
  gl.uniform1f(U.uT, TR.flow); gl.uniform1f(U.uE, E); gl.uniform1f(U.uBand, band); gl.uniform1f(U.uSeed, TR.seed);
  gl.uniform1f(U.uTear, S.tear); gl.uniform1f(U.uFace, S.face);
  gl.uniform1f(U.uReveal, reveal); gl.uniform1f(U.uMix, reveal > 0 ? 1 : 0);
  gl.uniform1f(U.uScan, ((now/1000*.07) % 1)*H);
  gl.uniform2f(U.uHeadY, M.present ? topS : -1, M.present ? topS + hh : -1);
  gl.uniform3fv(U.uWall, pal.wall); gl.uniform3fv(U.uBody, pal.body); gl.uniform3fv(U.uInk, pal.ink); gl.uniform1f(U.uRed, 1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  hudT += dt;
  if (hudT > .25){ hudT = 0; $('hud').textContent = MODE.on ? 'SHINGOU / ' + pal.name + '\nFLOW ' + (E*100 | 0).toString().padStart(3, '0') + '  CUT ' + TR.cuts.toString().padStart(4, '0') + (M.present ? '' : '  NO SIGNAL') : 'CAMERA'; }
}

/* ---------- test hook ---------- */
window.__SHINGOU = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; ingestMask(d, w, h); },
  mode(on){ setMode(!!on); if (on) MODE.t = 9; },
  palette(i){ setPal(i); },
  state: () => ({ on:MODE.on, present:M.present, energy:TR.energy, cuts:TR.cuts, top:M.top }),
};
</script>
</body>
</html>
