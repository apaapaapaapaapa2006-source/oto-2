<meta name="description" content="カメラはあなたを三分の一秒ごとに切り抜いて覚えている。覚えられたあなたは藍に沈められ、遠いものほど小さく淡く、暮れ方の空をゆっくり渡っていく。しばらく居れば数百人の行列になり、先頭に立っているのは今のあなた。渡る・昇る・佇むの三通り。両腕を高く掲げれば開帳。">

<!--
  ══════════════════════════════════════════════════════════════════════════
  GYORETSU 行列 ─ 暮れ方を渡っていく過去のあなた   ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      The twenty seconds before the light goes. A wide, empty sky
            with a burning strip along the bottom of it, and a procession
            of people crossing at every distance — all of whom are you,
            from the last half-minute. Not a glitch, not a trail: a
            LANDSCAPE, with aerial perspective and a horizon, that happens
            to be populated entirely by your own past.

  PALETTE   宵闇  yoiyami  #16162e  the zenith. Cold, nearly violet.
            藍    ai       #2a3a63  the middle sky and the ink every
                                    figure is sunk into. The further away
                                    a figure is, the more of the sky it
                                    has in it — that IS the depth cue.
            茜    akane    #e0673a  the horizon band. The single warm
                                    thing in the frame, so the eye goes to
                                    the line the procession walks on.
            枇杷  biwa     #f2b25c  the low sun and the lanterns of light
                                    caught on the near figures' edges.
            白練  shironeri #f4efe4 type only. Never used as light.
            This is the night piece of the pair — ARINOMICHI is paper and
            daylight, and these two must not look like siblings.

  BACKGROUND  A dusk gradient from 宵闇 down through 藍 into 茜, with a
              hard sun line at the horizon, three drifting haze bands and
              a slow scatter of high cloud. No vignette. Nothing is black.

  TYPE      Zen Old Mincho for the mode names and the title — an upright
            old-style mincho, quiet and a little ceremonial, which is what
            a procession wants. Space Grotesk 300/500/700 for counts and
            labels, wide-tracked, because the numbers here are a census
            and should read like one.

  MOTION    PROCESSIONAL. Everything moves at walking pace and nothing
            accelerates. Figures cross on a constant speed set by their
            distance, bob on a per-figure phase so no two walk in step,
            and fade in and out over most of a second. The single
            exception is 開帳: 120 ms, and the whole field goes at once.

  SIGNATURE 先頭はいつも今のあなた。 The live silhouette is drawn at full
            size, in its true place, at the front of its own procession —
            so you are always looking at the head of a line made of
            yourself. Ninety-six slots hold the last half-minute of you at
            a third of a second apart; the moment a slot is overwritten,
            every figure still using it lets go and fades. Nothing here is
            older than about thirty seconds, which is why the crowd keeps
            changing even when you stand perfectly still.
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  GYORETSU 行列 ─ 暮れ方を渡っていく過去のあなた
//
//  Every third of a second the segmentation mask is turned into a real
//  alpha channel, the live video is cut with it, the cut-out is sunk into
//  indigo, and the result is stamped into one of ninety-six slots of a
//  single atlas canvas. Hundreds of walkers then reference those slots.
//
//  Because a walker only REFERENCES a slot, one captured instant can be
//  worn by a dozen figures at a dozen distances at no memory cost — which
//  is how a crowd of several hundred fits in six megabytes. When a slot
//  is overwritten, every walker still wearing it lets go and fades, so
//  nothing on screen is older than about thirty seconds.
//
//  Depth is assigned ONCE per pool index and never changes, so iterating
//  the pool in order is already back-to-front order: no sort, no garbage,
//  no z-fighting. Scale, height on screen, speed and how much sky is
//  mixed into the figure all come off that one number.
//
//  Raise both arms: 開帳. A ring runs out from you and every walker it
//  passes flares white and breaks into embers.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number' && isFinite(v); }
function chase(cur,tgt,rate,dt){ var k=1-Math.exp(-rate*clamp(dt,0,0.2)); return cur+(tgt-cur)*k; }
function rgba(r,g,b,a){
  r=fin(r)?clamp(r|0,0,255):0; g=fin(g)?clamp(g|0,0,255):0; b=fin(b)?clamp(b|0,0,255):0;
  a=fin(a)?clamp(a,0,1):0;
  return 'rgba('+r+','+g+','+b+','+a.toFixed(3)+')';
}

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var densEl=document.getElementById('densEl');
var sndBtn=document.getElementById('snd');
var modeK=document.getElementById('modeK');
var modeS=document.getElementById('modeS');
var rW=document.getElementById('rW');
var rS=document.getElementById('rS');
var rD=document.getElementById('rD');
var mBtn=[document.getElementById('m0'),document.getElementById('m1'),document.getElementById('m2')];

var W=0,H=0,DPR=1,MN=1,HORIZ=0;
function mkCanvas(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  return c;
}

// ═══════════════════════════════════════════════════════════════════════
//  ATLAS ─ one canvas, ninety-six slots, round robin
// ═══════════════════════════════════════════════════════════════════════
var SCOL=12, SROW=8, SLOTS=SCOL*SROW;
var SPW=104, SPH=140;
var atlas=null, actx=null;
var slotGen=new Int32Array(SLOTS);      // bumped every time a slot is reused
var slotAsp=new Float32Array(SLOTS);    // captured figure's width/height
var slotHas=new Uint8Array(SLOTS);
var slotNext=0, storedN=0;

var capCv=null, capCtx=null, inkGrad=null;
var liveCv=null, lctx=null, LW=0, LH=0, liveGrad=null;
var alphaCv=null, alCtx=null, alImg=null, alData=null;

function allocSprites(){
  SPH=Math.round(clamp(MN*0.30,120,208));
  SPW=Math.round(SPH*0.74);
  atlas=mkCanvas(SPW*SCOL,SPH*SROW);
  actx=atlas.getContext('2d');
  capCv=mkCanvas(SPW,SPH);
  capCtx=capCv.getContext('2d');
  if (capCtx){
    try{
      inkGrad=capCtx.createLinearGradient(0,0,0,SPH);
      inkGrad.addColorStop(0,'rgba(24,26,58,0.80)');
      inkGrad.addColorStop(0.62,'rgba(42,58,99,0.66)');
      inkGrad.addColorStop(1,'rgba(224,103,58,0.34)');
    }catch(e){ inkGrad=null; }
  }
  for (var i=0;i<SLOTS;i++){ slotHas[i]=0; slotAsp[i]=0.74; }
  slotNext=0; storedN=0;
  LW=Math.max(64,Math.round(W*0.55)); LH=Math.max(64,Math.round(H*0.55));
  liveCv=mkCanvas(LW,LH);
  lctx=liveCv.getContext('2d');
  if (lctx){
    try{
      liveGrad=lctx.createLinearGradient(0,0,0,LH);
      liveGrad.addColorStop(0,'rgba(28,30,64,0.52)');
      liveGrad.addColorStop(0.60,'rgba(46,64,108,0.38)');
      liveGrad.addColorStop(1,'rgba(242,178,92,0.26)');
    }catch(e){ liveGrad=null; }
  }
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
  HORIZ=H*0.50;
  allocSprites();
  buildSky();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseBody();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  COVER MAPPING
//
//  MediaPipe normalises x by the FRAME width and y by the FRAME height.
//  Positions reach the screen only through this cover map. Every SIZE in
//  the piece — figure heights, the arm-raise threshold, the shockwave —
//  is measured against MN, the SHORT edge, so a figure is the same
//  fraction of the frame and the same gesture is the same gesture whether
//  the device is held upright or on its side.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect;
  if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX + (mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY + ny*(covS/camAspect); }

// ═══════════════════════════════════════════════════════════════════════
//  BODY ─ one Pose pass gives the segmentation mask and the joints
// ═══════════════════════════════════════════════════════════════════════
var pose=null, mpCamera=null, mpReady=false;
var LOST_S=0.6;
var MW=0,MH=0,MN2=0;
var MASK=null, maskCv=null, maskCtx=null;
var onN=0, bodyT=-9, maskT=-9, bodySeen=false;
var maskSeq=0;      // bumped only when a NEW mask has actually been read
var bx0=0,by0=0,bx1=1,by1=1, bboxOK=false;
var wristUp=[false,false], noseY=0.5, noseOn=false, raiseT=0;

function allocMask(){
  MW=160;
  MH=Math.max(24,Math.round(MW/camAspect));
  MN2=MW*MH;
  MASK=new Uint8Array(MN2);
  maskCv=mkCanvas(MW,MH);
  maskCtx=maskCv.getContext('2d');
  alphaCv=mkCanvas(MW,MH);
  alCtx=alphaCv.getContext('2d');
  alImg=alCtx?alCtx.createImageData(MW,MH):null;
  alData=alImg?alImg.data:null;
  if (alData){
    for (var i=0;i<MN2;i++){
      var o=i<<2;
      alData[o]=255; alData[o+1]=255; alData[o+2]=255; alData[o+3]=0;
    }
  }
}
function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  if (!fin(p.x)||!fin(p.y)) return false;
  if (typeof p.visibility==='number' && p.visibility<0.4) return false;
  return true;
}
function loseBody(){
  bodySeen=false; onN=0; bboxOK=false; raiseT=0;
  wristUp[0]=false; wristUp[1]=false; noseOn=false;
  bodyT=-9; maskT=-9;
}
function bodyLive(){ return bodySeen && (now()-bodyT)<LOST_S; }
function maskLive(){ return (now()-maskT)<LOST_S; }

// Turn the segmentation mask into a real alpha channel. The mask's own
// alpha cannot be trusted (some builds ship it opaque everywhere), so the
// coverage is taken as min(red, alpha) and written into a canvas whose
// ONLY content is that coverage — which is what makes destination-in
// cut a clean silhouette instead of a rectangle.
function readMask(src){
  if (!maskCtx||!alCtx||!alData) return false;
  try{
    maskCtx.clearRect(0,0,MW,MH);
    maskCtx.drawImage(src,0,0,MW,MH);
  }catch(e){ return false; }
  var img;
  try{ img=maskCtx.getImageData(0,0,MW,MH); }catch(e){ return false; }
  var d=img&&img.data;
  if (!d||d.length<MN2*4) return false;
  var i,o,v,cnt=0;
  var lox=MW, loy=MH, hix=-1, hiy=-1;
  for (i=0;i<MN2;i++){
    o=i<<2;
    v=d[o]<d[o+3]?d[o]:d[o+3];
    MASK[i]=v;
    // a soft shoulder so the cut edge is not a staircase
    var a=v<70?0:(v>150?255:Math.round((v-70)*(255/80)));
    alData[o+3]=a;
    if (v>110){
      cnt++;
      var gx=i%MW, gy=(i-gx)/MW;
      if (gx<lox) lox=gx; if (gx>hix) hix=gx;
      if (gy<loy) loy=gy; if (gy>hiy) hiy=gy;
    }
  }
  onN=cnt;
  if (cnt<40||hix<0){ bboxOK=false; return false; }
  try{ alCtx.putImageData(alImg,0,0); }catch(e){ return false; }
  var padx=Math.max(2,(hix-lox)*0.07), pady=Math.max(2,(hiy-loy)*0.05);
  bx0=clamp((lox-padx)/MW,0,1); bx1=clamp((hix+1+padx)/MW,0,1);
  by0=clamp((loy-pady)/MH,0,1); by1=clamp((hiy+1+pady)/MH,0,1);
  if (bx1-bx0<0.02||by1-by0<0.02){ bboxOK=false; return false; }
  bboxOK=true;
  maskSeq++;
  maskT=now();
  return true;
}
function onPose(res){
  var t=now();
  updateCover();
  if (!MASK||Math.abs(MW/Math.max(1,MH)-camAspect)>0.06) allocMask();
  var L=res?res.poseLandmarks:null;
  if (L&&typeof L.length==='number'&&L.length>=25) poseSeenT=t;
  var got=false;
  if (res&&res.segmentationMask) got=readMask(res.segmentationMask);
  if (got){ bodySeen=true; bodyT=t; }
  else if (t-bodyT>=LOST_S){ bodySeen=false; onN=0; bboxOK=false; }
  // A result that carries no mask at all must not leave the last bounding
  // box standing forever — stale geometry would keep being photographed.
  if (!got&&(t-maskT)>=LOST_S) bboxOK=false;

  // 開帳 needs both wrists clearly above the head, in FRAME coordinates,
  // which are the only ones where "above" is unambiguous.
  var WI=[15,16];
  var haveNose=L&&lmOK(L,0);
  noseOn=!!haveNose;
  if (haveNose) noseY=L[0].y;
  for (var k=0;k<2;k++){
    wristUp[k]=!!(haveNose&&L&&lmOK(L,WI[k])&&(L[WI[k]].y<noseY-0.05));
  }
  if (!L){ wristUp[0]=false; wristUp[1]=false; }
}
function initPose(){
  if (typeof window.Pose!=='function') return false;
  try{
    pose=new window.Pose({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f;
    }});
    pose.setOptions({ modelComplexity:1, smoothLandmarks:true,
                      enableSegmentation:true, smoothSegmentation:true,
                      selfieMode:false,
                      minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    pose.onResults(onPose);
    mpReady=true; return true;
  }catch(e){ pose=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!pose||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!pose) return Promise.resolve();
        try{ return pose.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  CUT ─ video ∩ mask, sunk into ink
// ═══════════════════════════════════════════════════════════════════════
function cutInto(g,gw,gh,grad){
  if (!g||!bboxOK||!alphaCv) return false;
  var vw=(video&&video.videoWidth)?video.videoWidth:640;
  var vh=(video&&video.videoHeight)?video.videoHeight:480;
  var sxp=bx0*vw, syp=by0*vh, swp=(bx1-bx0)*vw, shp=(by1-by0)*vh;
  if (!(swp>0.5&&shp>0.5)) return false;
  try{
    g.setTransform(1,0,0,1,0,0);
    g.clearRect(0,0,gw,gh);
    g.globalCompositeOperation='source-over';
    g.globalAlpha=1;
    g.drawImage(video,sxp,syp,swp,shp,0,0,gw,gh);
    g.globalCompositeOperation='destination-in';
    g.drawImage(alphaCv,bx0*MW,by0*MH,(bx1-bx0)*MW,(by1-by0)*MH,0,0,gw,gh);
    if (grad){
      g.globalCompositeOperation='source-atop';
      g.fillStyle=grad;
      g.fillRect(0,0,gw,gh);
    }
    g.globalCompositeOperation='source-over';
  }catch(e){ try{ g.globalCompositeOperation='source-over'; }catch(e2){} return false; }
  return true;
}

var CAP_INT=0.32, capT=-9, capSeq=-1;
function capture(t){
  if (!bboxOK||!capCtx||!actx||!atlas) return;
  capSeq=maskSeq;
  if (!cutInto(capCtx,SPW,SPH,inkGrad)) return;
  var s=slotNext;
  slotNext=(slotNext+1)%SLOTS;
  slotGen[s]++;
  var wpx=(bx1-bx0)*covS;
  var hpx=(by1-by0)*(covS/camAspect);
  slotAsp[s]=(hpx>1)?clamp(wpx/hpx,0.16,3.2):0.74;
  if (!slotHas[s]){ slotHas[s]=1; storedN++; }
  var dx=(s%SCOL)*SPW, dy=Math.floor(s/SCOL)*SPH;
  try{
    actx.setTransform(1,0,0,1,0,0);
    actx.globalCompositeOperation='source-over';
    actx.globalAlpha=1;
    actx.clearRect(dx,dy,SPW,SPH);
    actx.drawImage(capCv,dx,dy);
  }catch(e){}
  // whoever is still wearing this slot has to let go
  for (var i=0;i<WMAX;i++){ if (wAlive[i]&&wSlot[i]===s) wFade[i]=1; }
  capT=t;
}

// ═══════════════════════════════════════════════════════════════════════
//  WALKERS
//
//  Depth is a pure function of the pool index and never changes, so
//  walking the pool in order is already far-to-near order — no sort and
//  no allocation per frame. A walker owns nothing but a slot number, so
//  one captured instant can be worn by a dozen figures at once.
// ═══════════════════════════════════════════════════════════════════════
var WMAX=560, WN=380;
var wD=new Float32Array(WMAX), wAct=new Uint8Array(WMAX);
var wAlive=new Uint8Array(WMAX), wSlot=new Int32Array(WMAX), wGen=new Int32Array(WMAX);
var wX=new Float32Array(WMAX), wY=new Float32Array(WMAX), wV=new Float32Array(WMAX);
var wAge=new Float32Array(WMAX), wLife=new Float32Array(WMAX), wPh=new Float32Array(WMAX);
var wFade=new Uint8Array(WMAX), wFa=new Float32Array(WMAX), wFlip=new Uint8Array(WMAX);
var wFlare=new Float32Array(WMAX), wSeed=new Float32Array(WMAX), wBase=new Float32Array(WMAX);
for (var _w=0;_w<WMAX;_w++){
  wD[_w]=Math.pow((_w+0.5)/WMAX,2.15);   // far-heavy: a procession is mostly distance
  wSeed[_w]=Math.random();
  wFa[_w]=1;
}
var mode=0, MODES=[{k:'行',s:'WATARI'},{k:'昇',s:'NOBORI'},{k:'佇',s:'TATAZUMI'}];
var drawnN=0;

function rebuildActive(){
  wAct.fill(0);
  var n=clamp(WN,20,WMAX);
  for (var k=0;k<n;k++){
    var idx=Math.min(WMAX-1,Math.round(k*(WMAX-1)/Math.max(1,n-1)));
    wAct[idx]=1;
  }
}
function groundY(d){ return HORIZ+(H*1.04-HORIZ)*Math.pow(d,1.55); }
// Sprite OVERDRAW, not arithmetic, is what costs money here: a handful of
// near figures can cost more fill than four hundred distant ones. So the
// depth curve is deliberately far-heavy, AND every figure height is a
// fraction of the SHORT edge rather than of H. Measured on the long side,
// a phone held upright pays three times the fill a laptop pays for the
// same scene, and the nearest figure is half again as tall relative to
// the frame — the same class of bug as a gesture that needs twice the
// reach in landscape.
function figH(d){ return MN*lerp(0.09,0.42,Math.pow(d,1.3)); }
function figA(d){ return lerp(0.26,0.95,Math.pow(d,0.8)); }

function pickSlot(){
  if (storedN<=0) return -1;
  for (var tries=0;tries<12;tries++){
    var s=(Math.random()*SLOTS)|0;
    if (slotHas[s]) return s;
  }
  for (var i=0;i<SLOTS;i++) if (slotHas[i]) return i;
  return -1;
}
function spawn(i,seeded){
  var s=pickSlot();
  if (s<0){ wAlive[i]=0; return; }
  var d=wD[i];
  wAlive[i]=1; wSlot[i]=s; wGen[i]=slotGen[s]; wFade[i]=0; wFa[i]=0;
  wAge[i]=0; wPh[i]=Math.random()*TAU; wFlare[i]=0;
  if (mode===0){
    var dir=(i%5===0)?-1:1;
    wFlip[i]=(dir<0)?1:0;
    wV[i]=dir*W*lerp(0.030,0.078,d);
    var span=W*1.34;
    var start=(dir>0)?(-W*0.17):(W*1.17);
    wX[i]=seeded?(start+dir*Math.random()*span):start;
    wY[i]=groundY(d);
    wLife[i]=span/Math.max(1e-4,Math.abs(wV[i]))+1.2;
    if (seeded) wAge[i]=Math.abs(wX[i]-start)/Math.max(1e-4,Math.abs(wV[i]));
  } else if (mode===1){
    wFlip[i]=(Math.random()<0.5)?1:0;
    wX[i]=W*(0.06+0.88*Math.random());
    var rise=H*lerp(0.020,0.058,d);
    wV[i]=-rise;
    wY[i]=seeded?(groundY(d)-Math.random()*(groundY(d)+figH(d))):groundY(d);
    wLife[i]=(groundY(d)+figH(d)*1.3)/rise+1.0;
    if (seeded) wAge[i]=(groundY(d)-wY[i])/rise;
  } else {
    wFlip[i]=(Math.random()<0.5)?1:0;
    wBase[i]=W*(0.04+0.92*Math.random());
    wX[i]=wBase[i];
    wY[i]=groundY(d);
    wV[i]=0;
    wLife[i]=13+Math.random()*11;
    if (seeded) wAge[i]=Math.random()*wLife[i]*0.8;
  }
}
function reseedAll(){
  for (var i=0;i<WMAX;i++){ wAlive[i]=0; wFa[i]=0; }
  for (i=0;i<WMAX;i++){ if (wAct[i]) spawn(i,true); }
}
function setMode(m){
  mode=clamp(m|0,0,2);
  for (var i=0;i<3;i++){ if (mBtn[i]) mBtn[i].className=(i===mode)?'on':''; }
  if (modeK) modeK.textContent=MODES[mode].k;
  if (modeS) modeS.textContent=MODES[mode].s;
  reseedAll();
}
for (var _m=0;_m<3;_m++){
  (function(k){ if (mBtn[k]) mBtn[k].addEventListener('click',function(){ setMode(k); }); })(_m);
}

// ═══════════════════════════════════════════════════════════════════════
//  EMBERS
// ═══════════════════════════════════════════════════════════════════════
var EMAX=520, eN=0;
var ex=new Float32Array(EMAX), ey=new Float32Array(EMAX);
var evx=new Float32Array(EMAX), evy=new Float32Array(EMAX);
var elf=new Float32Array(EMAX), esz=new Float32Array(EMAX);
function ember(x,y,vx,vy,sz){
  if (eN>=EMAX) return;
  var i=eN++;
  ex[i]=x; ey[i]=y; evx[i]=vx; evy[i]=vy; elf[i]=1; esz[i]=sz;
}
function killEmber(i){
  var j=--eN;
  ex[i]=ex[j]; ey[i]=ey[j]; evx[i]=evx[j]; evy[i]=evy[j]; elf[i]=elf[j]; esz[i]=esz[j];
}

// ═══════════════════════════════════════════════════════════════════════
//  開帳 KAICHO ─ the one big event
// ═══════════════════════════════════════════════════════════════════════
var kaiT=-99, kaiR=0, kaiFlash=0, kaiX=0, kaiY=0, KAI_COOL=8;
var raiseArmed=true, poseSeenT=-9;
function fireKaicho(t){
  if (t-kaiT<KAI_COOL) return;
  kaiT=t; kaiR=0; kaiFlash=1;
  kaiX=bboxOK?(sx(bx0)+sx(bx1))*0.5:W*0.5;
  kaiY=bboxOK?sy((by0+by1)*0.5):H*0.55;
  if (!fin(kaiX)) kaiX=W*0.5;
  if (!fin(kaiY)) kaiY=H*0.55;
  kaichoSound();
}
function kaiActive(t){ return (t-kaiT)<1.8; }

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ a dusk bed, and one small bell each time a figure passes the
//  middle of the frame. Pitch comes off the figure's distance, so the
//  near ones toll low and the far ones tick high up in the sky: the
//  ambience is literally the census being counted.
// ═══════════════════════════════════════════════════════════════════════
var ac=null, master=null, comp=null, droneG=null, dA=null, dB=null, windG=null;
var noiseBuf=null, sndOn=true, canPan=false;
var bellTok=3, BELL_RATE=3.2, BELL_CAP=3;
var SC5=[0,2,4,7,9];

function makeNoise(){
  if (!ac) return null;
  var n=Math.max(1,Math.floor(ac.sampleRate*1.4));
  var b=ac.createBuffer(1,n,ac.sampleRate);
  var d=b.getChannelData(0);
  var lp=0;
  for (var i=0;i<n;i++){ var w=Math.random()*2-1; lp=lp+(w-lp)*0.22; d[i]=lp*2.4; }
  return b;
}
function initAudio(){
  if (ac) return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return;
  try{ ac=new AC(); }catch(e){ ac=null; return; }
  comp=ac.createDynamicsCompressor();
  try{
    comp.threshold.value=-18; comp.knee.value=26; comp.ratio.value=4;
    comp.attack.value=0.005; comp.release.value=0.3;
  }catch(e){}
  master=ac.createGain(); master.gain.value=0.9;
  master.connect(comp); comp.connect(ac.destination);
  canPan=(typeof ac.createStereoPanner==='function');
  noiseBuf=makeNoise();

  var lp=ac.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=190; lp.Q.value=0.6;
  droneG=ac.createGain(); droneG.gain.value=0;
  lp.connect(droneG); droneG.connect(master);
  dA=ac.createOscillator(); dA.type='sawtooth'; dA.frequency.value=55;
  dB=ac.createOscillator(); dB.type='sawtooth'; dB.frequency.value=82.6;
  try{ dB.detune.value=6; }catch(e){}
  dA.connect(lp); dB.connect(lp);
  try{ dA.start(); dB.start(); }catch(e){}

  if (noiseBuf){
    var ws=ac.createBufferSource(); ws.buffer=noiseBuf; ws.loop=true;
    var bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=520; bp.Q.value=0.6;
    windG=ac.createGain(); windG.gain.value=0;
    ws.connect(bp); bp.connect(windG); windG.connect(master);
    try{ ws.start(); }catch(e){}
  }
  setSound(sndOn);
}
function setSound(on){
  sndOn=!!on;
  if (sndBtn){ sndBtn.className=sndOn?'on':''; sndBtn.textContent=sndOn?'音 ON':'音 OFF'; }
  if (!ac) return;
  var t=ac.currentTime;
  if (droneG) droneG.gain.setTargetAtTime(sndOn?0.030:0,t,1.2);
  if (windG) windG.gain.setTargetAtTime(sndOn?0.013:0,t,1.6);
}
if (sndBtn) sndBtn.addEventListener('click',function(){ setSound(!sndOn); });

function bell(d,xFrac){
  if (!sndOn||!ac||!master) return;
  if (bellTok<1) return;
  bellTok-=1;
  var dd=fin(d)?clamp(d,0,1):0.5;
  var xf=fin(xFrac)?clamp(xFrac,0,1):0.5;
  // far figures ring high and thin, near ones low and round
  var step=Math.round((1-dd)*11);
  var semis=SC5[step%5]+12*Math.floor(step/5);
  var f=220*Math.pow(2,semis/12);
  if (!fin(f)||f<40) f=440;
  var amp=lerp(0.030,0.085,dd);
  var dur=lerp(0.9,2.1,dd);
  try{
    var t=ac.currentTime;
    var out=ac.createGain(); out.gain.value=1;
    if (canPan){
      var p=ac.createStereoPanner();
      p.pan.value=clamp((xf-0.5)*1.5,-1,1);
      out.connect(p); p.connect(master);
    } else out.connect(master);
    var parts=[[1,1],[2.76,0.32],[5.4,0.11]];
    for (var i=0;i<parts.length;i++){
      var o=ac.createOscillator(); o.type='sine';
      o.frequency.value=f*parts[i][0];
      var g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0005,amp*parts[i][1]),t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur*(i===0?1:0.55));
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t+dur+0.05);
    }
  }catch(e){}
}
function kaichoSound(){
  if (!sndOn||!ac||!master) return;
  try{
    var t=ac.currentTime;
    var o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(132,t);
    o.frequency.exponentialRampToValueAtTime(38,t+0.6);
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.30,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0002,t+1.3);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+1.4);
    if (noiseBuf){
      var ns=ac.createBufferSource(); ns.buffer=noiseBuf;
      var bp=ac.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.setValueAtTime(2600,t);
      bp.frequency.exponentialRampToValueAtTime(420,t+1.6);
      bp.Q.value=2.4;
      var ng=ac.createGain();
      ng.gain.setValueAtTime(0.0001,t);
      ng.gain.exponentialRampToValueAtTime(0.16,t+0.03);
      ng.gain.exponentialRampToValueAtTime(0.0002,t+1.7);
      ns.connect(bp); bp.connect(ng); ng.connect(master);
      ns.start(t); ns.stop(t+1.8);
    }
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  SIMULATION
// ═══════════════════════════════════════════════════════════════════════
var started=false, last=0, qual=1, costS=8, hudT=0, fpsS=1/60;
var wPrev=new Float32Array(WMAX);
function density(){ return densEl?clamp((+densEl.value||0)/100,0.15,1):0.62; }

function stepWalkers(dt,t){
  var kai=kaiActive(t);
  if (kai) kaiR+=dt*MN*2.0;
  var i;
  for (i=0;i<WMAX;i++){
    if (!wAct[i]){
      if (wAlive[i]){
        wFade[i]=1;
        wFa[i]=chase(wFa[i],0,3.2,dt);
        if (wFa[i]<0.02) wAlive[i]=0;
      }
      continue;
    }
    if (!wAlive[i]){ spawn(i,false); if (!wAlive[i]) continue; }
    var d=wD[i];
    if (wGen[i]!==slotGen[wSlot[i]]) wFade[i]=1;
    wAge[i]+=dt;
    if (wAge[i]>wLife[i]) wFade[i]=1;
    var px=wX[i], py=wY[i];
    if (mode===1) wY[i]+=wV[i]*dt;
    else if (mode===2) wX[i]=wBase[i]+Math.sin(t*0.55+wPh[i])*MN*0.013;  // an OFFSET, not a velocity
    else wX[i]+=wV[i]*dt;

    // a small bell as a figure passes the middle of the frame
    if (mode===0){
      if ((px-W*0.5)*(wX[i]-W*0.5)<0) bell(d,0.5);
    } else if (mode===1){
      if ((py-HORIZ)*(wY[i]-HORIZ)<0) bell(d,W>0?clamp(wX[i]/W,0,1):0.5);
    }
    wPrev[i]=px;

    if (kai&&wFlare[i]<=0&&!wFade[i]){
      var h0=figH(d);
      var cx=wX[i], cy=wY[i]-h0*0.5;
      var ddx=cx-kaiX, ddy=cy-kaiY;
      if (ddx*ddx+ddy*ddy<kaiR*kaiR){
        wFlare[i]=1; wFade[i]=1;
        var nEm=d>0.55?4:2;
        for (var e=0;e<nEm;e++){
          var a=-Math.PI*0.5+(Math.random()-0.5)*2.0;
          var sp=MN*(0.06+Math.random()*0.16);
          ember(cx+(Math.random()-0.5)*h0*0.4, cy+(Math.random()-0.5)*h0*0.6,
                Math.cos(a)*sp, Math.sin(a)*sp, MN*lerp(0.002,0.006,d));
        }
      }
    }
    if (wFlare[i]>0) wFlare[i]=Math.max(0,wFlare[i]-dt*2.3);
    wFa[i]=chase(wFa[i],wFade[i]?0:1,wFade[i]?3.2:1.7,dt);
    if (wFade[i]&&wFa[i]<0.02) spawn(i,false);
  }
}
function stepEmbers(dt){
  for (var i=eN-1;i>=0;i--){
    elf[i]-=dt*0.62;
    if (elf[i]<=0){ killEmber(i); continue; }
    evy[i]-=MN*0.10*dt;                 // embers rise
    evx[i]*=Math.exp(-dt*0.7); evy[i]*=Math.exp(-dt*0.5);
    ex[i]+=evx[i]*dt; ey[i]+=evy[i]*dt;
  }
}
function step(dt,t){
  updateCover();
  var want=Math.round((60+density()*(WMAX-70))*qual);
  if (Math.abs(want-WN)>=6){ WN=want; rebuildActive(); }
  bellTok=Math.min(BELL_CAP,bellTok+BELL_RATE*dt);
  // A capture needs a mask that has ARRIVED SINCE the last one. Time alone
  // is not enough: if the body leaves, the grace period that stops the
  // live figure flickering would otherwise keep stamping the same stale
  // silhouette into new slots.
  if (bboxOK&&maskSeq!==capSeq&&(t-capT)>=CAP_INT) capture(t);

  // 開帳 gate: both wrists above the head, on FRESH pose results only.
  // The lost-tracking grace that keeps the figure from flickering must
  // not feed this, or the event fires after the body has left the frame.
  var fresh=(t-poseSeenT)<0.25;
  var up=fresh&&wristUp[0]&&wristUp[1]&&noseOn;
  if (up) raiseT+=dt;
  else { raiseT=Math.max(0,raiseT-dt*2.5); if (raiseT<=0) raiseArmed=true; }
  if (raiseArmed&&raiseT>0.40){ fireKaicho(t); raiseT=0; raiseArmed=false; }

  stepWalkers(dt,t);
  stepEmbers(dt);
  kaiFlash*=Math.exp(-dt*3.6);
  if (t-hudT>0.2){ hudT=t; updateHud(); }
}
function updateHud(){
  if (rW) rW.textContent=String(drawnN);
  if (rS) rS.textContent=String(storedN);
  if (rD){
    if (bboxOK&&maskLive()){
      var h=(by1-by0)*(covS/camAspect);
      rD.textContent=Math.round(clamp(h/Math.max(1,H),0,1)*100)+'%';
    } else rD.textContent='—';
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════════════════════
var skyGrad=null, sunGrad=null;
var CN=30, clx=new Float32Array(CN), cly=new Float32Array(CN),
    clw=new Float32Array(CN), cla=new Float32Array(CN), clv=new Float32Array(CN);
var cloudsMade=false;
function buildSky(){
  try{
    skyGrad=ctx.createLinearGradient(0,0,0,H);
    skyGrad.addColorStop(0,'#14142b');
    skyGrad.addColorStop(0.26,'#1d2247');
    skyGrad.addColorStop(0.42,'#3a3c66');
    skyGrad.addColorStop(0.482,'#8e5560');
    skyGrad.addColorStop(0.50,'#e0673a');
    skyGrad.addColorStop(0.525,'#a24b36');
    skyGrad.addColorStop(0.66,'#4a3350');
    skyGrad.addColorStop(1,'#231d36');
  }catch(e){ skyGrad=null; }
  try{
    sunGrad=ctx.createRadialGradient(W*0.5,HORIZ,0,W*0.5,HORIZ,MN*0.95);
    sunGrad.addColorStop(0,'rgba(242,178,92,0.42)');
    sunGrad.addColorStop(0.28,'rgba(224,103,58,0.18)');
    sunGrad.addColorStop(1,'rgba(224,103,58,0)');
  }catch(e){ sunGrad=null; }
  if (!cloudsMade){
    for (var i=0;i<CN;i++){
      clx[i]=Math.random(); cly[i]=Math.random()*0.46;
      clw[i]=0.06+Math.random()*0.26;
      cla[i]=0.03+Math.random()*0.09;
      clv[i]=0.0035+Math.random()*0.010;
    }
    cloudsMade=true;
  }
}
function drawSky(t){
  ctx.fillStyle=skyGrad?skyGrad:'#1d2247';
  ctx.fillRect(0,0,W,H);
  if (sunGrad){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=sunGrad;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // high cloud, drifting
  var i;
  for (i=0;i<CN;i++){
    var x=((clx[i]+t*clv[i])%1.22-0.11)*W;
    var y=cly[i]*H;
    var w=clw[i]*W, h=Math.max(1,MN*0.006);
    ctx.fillStyle=rgba(244,239,228,cla[i]*(0.5+0.5*Math.sin(t*0.25+i)));
    ctx.fillRect(x,y,w,h);
  }
  // the sun line
  ctx.fillStyle=rgba(255,214,150,0.55);
  ctx.fillRect(0,HORIZ-Math.max(1,MN*0.0016),W,Math.max(1.4,MN*0.0032));
  // haze bands sitting on the horizon
  for (i=0;i<3;i++){
    var by=HORIZ+MN*(0.012+i*0.05)+Math.sin(t*0.16+i*2.1)*MN*0.006;
    var bh=MN*(0.016+i*0.012);
    ctx.fillStyle=rgba(226,140,96,0.070-i*0.016);
    ctx.fillRect(0,by,W,bh);
  }
}

function drawWalkers(t){
  drawnN=0;
  if (!atlas) return;
  for (var i=0;i<WMAX;i++){
    if (!wAlive[i]) continue;
    var s=wSlot[i];
    if (s<0||s>=SLOTS||!slotHas[s]) continue;
    var d=wD[i];
    var h=figH(d);
    var w=h*slotAsp[s];
    if (!(w>0.4&&h>0.4)) continue;
    var bob=Math.sin(t*2.1+wPh[i])*h*0.020;
    var dx=wX[i]-w*0.5, dy=wY[i]+bob-h;
    if (dx+w<-2||dx>W+2||dy>H+2||dy+h<-2) continue;
    var al=figA(d)*clamp(wFa[i],0,1);
    if (al<0.04||h<1.6) continue;
    if (!fin(dx)||!fin(dy)) continue;
    var sxs=(s%SCOL)*SPW, sys=((s/SCOL)|0)*SPH;
    ctx.globalAlpha=clamp(al,0,1);
    if (wFlip[i]){
      ctx.save(); ctx.translate(dx+w,dy); ctx.scale(-1,1);
      ctx.drawImage(atlas,sxs,sys,SPW,SPH,0,0,w,h);
      ctx.restore();
    } else {
      ctx.drawImage(atlas,sxs,sys,SPW,SPH,dx,dy,w,h);
    }
    if (wFlare[i]>0.02){
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=clamp(wFlare[i]*0.85,0,1);
      if (wFlip[i]){ ctx.translate(dx+w,dy); ctx.scale(-1,1); ctx.drawImage(atlas,sxs,sys,SPW,SPH,0,0,w,h); }
      else ctx.drawImage(atlas,sxs,sys,SPW,SPH,dx,dy,w,h);
      ctx.restore();
    }
    drawnN++;
  }
  ctx.globalAlpha=1;
}

// The present you, at full size, in your true place — the head of a line
// made of yourself.
function drawLive(){
  if (!maskLive()||!bboxOK||!lctx||!liveCv) return;
  if (!cutInto(lctx,LW,LH,liveGrad)) return;
  var xA=sx(bx0), xB=sx(bx1);
  var l=Math.min(xA,xB), r=Math.max(xA,xB);
  var tp=sy(by0), bt=sy(by1);
  var w=r-l, h=bt-tp;
  if (!fin(l)||!fin(tp)||!(w>1)||!(h>1)) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.15;
  if (mirror){ ctx.translate(l+w,tp-MN*0.004); ctx.scale(-1,1); ctx.drawImage(liveCv,0,0,w,h); }
  else ctx.drawImage(liveCv,l,tp-MN*0.004,w,h);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=0.97;
  if (mirror){ ctx.translate(l+w,tp); ctx.scale(-1,1); ctx.drawImage(liveCv,0,0,w,h); }
  else ctx.drawImage(liveCv,l,tp,w,h);
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawEmbers(){
  if (eN<=0) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for (var i=0;i<eN;i++){
    var a=clamp(elf[i],0,1);
    ctx.fillStyle=rgba(255,205,130,a*0.85);
    var s=Math.max(0.8,esz[i]*(0.4+a));
    ctx.fillRect(ex[i]-s*0.5,ey[i]-s*0.5,s,s);
  }
  ctx.restore();
}

function drawKaicho(t){
  if (kaiActive(t)){
    var a=clamp(1-(t-kaiT)/1.8,0,1);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=rgba(255,220,160,a*0.75);
    ctx.lineWidth=Math.max(1.5,MN*0.007*a+1);
    ctx.beginPath(); ctx.arc(kaiX,kaiY,Math.max(1,kaiR),0,TAU); ctx.stroke();
    ctx.strokeStyle=rgba(224,103,58,a*0.35);
    ctx.lineWidth=Math.max(1,MN*0.003);
    ctx.beginPath(); ctx.arc(kaiX,kaiY,Math.max(1,kaiR*0.86),0,TAU); ctx.stroke();
    ctx.restore();
  }
  if (kaiFlash>0.01){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=rgba(255,222,168,kaiFlash*0.42);
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

function drawHint(t){
  if (bodyLive()&&storedN>3) return;
  var a=0.34+0.17*Math.sin(t*1.7);
  ctx.fillStyle=rgba(244,239,228,a);
  ctx.font=Math.round(clamp(MN*0.036,13,21))+'px "Zen Old Mincho", serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('全身がカメラに入るところまで下がってください',W/2,H*0.30);
  ctx.font='300 '+Math.round(clamp(MN*0.026,11,15))+'px "Space Grotesk", sans-serif';
  ctx.fillStyle=rgba(244,239,228,a*0.62);
  ctx.fillText('しばらく居るほど、列は長くなります',W/2,H*0.30+MN*0.058);
}

function draw(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky(t);
  drawWalkers(t);
  drawLive();
  drawEmbers();
  drawKaicho(t);
  if (started) drawHint(t);
}

function frame(){
  var t=now();
  var dt=clamp(t-last,0,0.1);
  last=t;
  var t0=now();
  if (started) step(dt,t);
  draw(t);
  if (started){
    // The governor watches the REAL frame interval, not the JavaScript
    // slice. This piece is GPU-bound on sprite fill, and fill costs
    // nothing that performance.now() can see from inside the frame — a
    // JS-only budget would report 1.3ms while the device drew at 18fps.
    var cost=(now()-t0)*1000;
    costS=costS+(cost-costS)*0.07;
    if (dt>0.002) fpsS=fpsS+(dt-fpsS)*0.06;
    var slow=(fpsS>1/26)||(costS>26);
    var fast=(fpsS<1/50)&&(costS<14);
    if (slow&&qual>0.3) qual=Math.max(0.3,qual-0.035);
    else if (fast&&qual<1) qual=Math.min(1,qual+0.015);
  }
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM ─ one figure becomes a line of figures, then the
//  line goes up. Seven seconds, no reading required.
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoT=0;
function demoFig(g,x,yF,h,al,flare){
  g.globalAlpha=clamp(al,0,1);
  g.fillStyle=flare?'#ffd79a':'#2a3a63';
  var w=h*0.36;
  g.beginPath(); g.arc(x,yF-h*0.87,h*0.13,0,TAU); g.fill();
  g.beginPath();
  g.moveTo(x-w*0.5,yF); g.lineTo(x-w*0.40,yF-h*0.70);
  g.lineTo(x+w*0.40,yF-h*0.70); g.lineTo(x+w*0.5,yF);
  g.closePath(); g.fill();
  g.globalAlpha=1;
}
function demoFrame(){
  if (!demoCtx) return;
  var g=demoCtx, DW=demoCv.width, DH=demoCv.height;
  demoT+=1/60;
  var cyc=demoT%8;
  var hz=DH*0.56;
  var sg=null;
  try{
    sg=g.createLinearGradient(0,0,0,DH);
    sg.addColorStop(0,'#14142b'); sg.addColorStop(0.42,'#3a3c66');
    sg.addColorStop(0.56,'#e0673a'); sg.addColorStop(0.62,'#a24b36');
    sg.addColorStop(1,'#231d36');
  }catch(e){ sg=null; }
  g.fillStyle=sg?sg:'#1d2247'; g.fillRect(0,0,DW,DH);
  g.fillStyle='rgba(255,214,150,.5)'; g.fillRect(0,hz-1,DW,2);
  var rise=(cyc>5.0&&cyc<6.4), flare=(cyc>6.4);
  var n=14;
  for (var i=0;i<n;i++){
    var d=(i+1)/n;
    var age=cyc-0.25*i;
    if (age<0) continue;
    var h=DH*(0.05+0.30*Math.pow(d,1.7));
    var yF=hz+(DH*1.0-hz)*Math.pow(d,1.5);
    var x=DW*0.5+(1-d)*0+((age*(0.02+0.05*d))%1.3-0.15)*DW;
    if (rise) yF-=(cyc-5.0)*DH*0.55*(0.4+d);
    var al=(0.22+0.7*Math.pow(d,0.8))*clamp(age*1.2,0,1)*(flare?clamp(1-(cyc-6.4)/1.1,0,1):1);
    demoFig(g,x,yF+Math.sin(demoT*2.1+i)*h*0.02,h,al,flare);
  }
  // the live one, at the front
  var lx=DW*0.5+Math.sin(demoT*0.55)*DW*0.13;
  demoFig(g,lx,DH*1.02,DH*0.62,0.98,false);
  if (flare){
    var fa=clamp(1-(cyc-6.4)/0.9,0,1);
    g.fillStyle='rgba(255,222,168,'+(fa*0.4).toFixed(3)+')';
    g.fillRect(0,0,DW,DH);
    g.strokeStyle='rgba(255,220,160,'+fa.toFixed(3)+')';
    g.lineWidth=3;
    g.beginPath(); g.arc(lx,DH*0.72,(cyc-6.4)*620,0,TAU); g.stroke();
  }
  var label;
  if (cyc<2.6) label='三分の一秒ごとに、あなたが覚えられる';
  else if (cyc<5.0) label='覚えられたあなたが、暮れ方を渡っていく';
  else if (cyc<6.4) label='昇・佇 ── 渡りかたは三通り';
  else label='両腕を掲げれば ── 開帳';
  g.fillStyle='rgba(244,239,228,.8)';
  g.font='15px "Zen Old Mincho", serif'; g.textAlign='center';
  g.fillText(label,DW/2,24);
  if (demoRun && typeof requestAnimationFrame==='function') requestAnimationFrame(demoFrame);
}
if (demoCtx) demoFrame();

// ═══════════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════════
startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  initPose();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
updateCover();
allocMask();
rebuildActive();
setMode(0);
last=now();
frame();
</script>
