<title>HAKUCHU ─ 白飛びした街の図解</title>
<meta name="description" content="カメラを街へ向けると、ビルも空も白く飛んで退色したスキャンの色に沈む。輪郭は製図のインクでなぞられ、構造のあるところへ手描きの注釈と矢印が書き込まれていく。">
<meta name="theme-color" content="#eceee6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  HAKUCHU ─ 白昼                              ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   紙   kami    #f6f8f2  paper white       (highlights, ground)
            乳   chichi  #e7e9d7  bleached cream    (upper mids)
            鼠   nezumi  #c4cfc7  ash green-grey    (mids)
            石   ishi    #96a6a6  stone             (lower mids)
            青鈍 aonibi  #5f6e74  cold slate        (shadows — never black)
            墨   sumi    #2f3a3c  drafting ink      (edge lines, type)
            MOOD: an overexposed photograph of a motorway, photocopied
            twice, then annotated by hand in a lab notebook. Cold in the
            shadows, cream in the highlights, NO TRUE BLACK ANYWHERE — the
            darkest pixel on screen is a blue-grey, which is the whole
            trick. Homage to the bleached, diagrammatic sleeve art Stanley
            Donwood and Thom Yorke made for OK COMPUTER (1997).

  BACKGROUND  The page IS the image, full bleed. A WHITE fog creeps in from
            the edges instead of a dark vignette: the print is bleaching
            from the outside in, not falling into shadow.

  TYPE      Space Mono for the latin annotations, Zen Kaku Gothic New for
            the Japanese chrome. Deliberately the most machine-like type in
            the collection — against MINAMO's rounded, KAGEE's mincho and
            IKI's Cormorant. Everything is set as if it were a figure
            caption in a manual nobody wants to read.

  MOTION    Almost none, on purpose. The image itself is still; only the
            grain crawls. Annotations are DRAWN ON stroke by stroke over
            half a second, then sit, then fade. Nothing eases, nothing
            bounces, nothing bobs — ink either is on the page or is not.

  SIGNATURE THE ANNOTATIONS FIND THE ARCHITECTURE. Sobel energy from every
            processed frame is accumulated into a coarse grid, and the
            hand-drawn boxes, brackets, arrows and crosshairs are only ever
            spawned over cells that actually contain structure. Point it at
            the sky and the page stays empty; point it at a building and
            the diagram marks up the building. Tap to pin your own mark,
            hold to lift the grade and see the raw camera underneath.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>

<body>

<canvas id="view"></canvas>

<div class="chrome" id="top">

<div id="start">
  <div class="fig">FIG. 01 — EXPOSURE TEST</div>
  <h1>HAKUCHU</h1>
  <div class="jp">白昼</div>
  <div class="rule"></div>
  <p>カメラを街や建物へ向けてください。<br>
     白く飛んだ写真の上に、構造のあるところだけ注釈が書き込まれます。<br>
     画面をタップで注釈を打つ／長押しで元の映像。</p>

  <div class="credit">HOMAGE TO THE BLEACHED, ANNOTATED SLEEVE ART OF<br>OK COMPUTER (1997) — STANLEY DONWOOD &amp; THOM YORKE.<br>SOUND ON. CAMERA REQUIRED.</div>
</div>

<div id="err"></div>

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  ELEMENTS
// ═══════════════════════════════════════════════════════════════════════
var view = document.getElementById('view');
var dctx = view.getContext('2d');
var startEl = document.getElementById('start');
var goBtn = document.getElementById('go');
var errBox = document.getElementById('err');
var statEl = document.getElementById('stat');
var flipBtn = document.getElementById('flipBtn');
var bleachBtn = document.getElementById('bleachBtn'), bleachLbl = document.getElementById('bleachLbl');
var annBtn = document.getElementById('annBtn'), annLbl = document.getElementById('annLbl');
var qualBtn = document.getElementById('qualBtn'), qualLbl = document.getElementById('qualLbl');
var saveBtn = document.getElementById('saveBtn');
var sndBtn = document.getElementById('sndBtn'), sndLbl = document.getElementById('sndLbl');

var video = document.createElement('video');
video.playsInline = true; video.muted = true; video.setAttribute('playsinline',''); video.autoplay = true;

// ═══════════════════════════════════════════════════════════════════════
//  PALETTE — the whole piece lives inside this ramp
// ═══════════════════════════════════════════════════════════════════════
var INK = [47, 58, 60];          // 墨   drafting ink
var PAPER = [246, 248, 242];     // 紙   paper white
var RAMP = [                     // luma 0 → 1, cold shadows, cream highs
  [0.00,  72,  86,  92],         // 青鈍  darkest pixel on screen — a slate, never black
  [0.25, 128, 145, 148],         // 石
  [0.50, 176, 190, 184],         // 鼠
  [0.75, 218, 222, 205],         // 乳   (the sickly cream)
  [1.00, 245, 247, 240]          // 紙
];

// exposure presets: gain, lift, gamma, fog, chroma
var BLEACH = [
  { name:'弱',   en:'LOW',  gain:1.00, lift:0.02, gamma:0.96, fog:0.10, chroma:0.22 },
  { name:'標準', en:'MID',  gain:1.06, lift:0.05, gamma:0.86, fog:0.17, chroma:0.14 },
  { name:'強',   en:'HIGH', gain:1.16, lift:0.11, gamma:0.72, fog:0.26, chroma:0.07 }
];
var bleach = 1;

var LEVELS = 10;                 // printed tone steps
var BAYER = [ 0, 8, 2,10, 12, 4,14, 6, 3,11, 1, 9, 15, 7,13, 5 ];
var EDGE_T = 12;                 // sobel threshold (0..1020 scale)
var EDGE_K = 0.0060;             // sobel → ink alpha

// ═══════════════════════════════════════════════════════════════════════
//  LOOK-UP TABLES — luma is quantised, then graded, once per setting
// ═══════════════════════════════════════════════════════════════════════
var LR = new Uint8Array(256), LG = new Uint8Array(256), LB = new Uint8Array(256);
var GLOW = new Uint8Array(256);
function rampAt(t){
  if (t <= 0) return [RAMP[0][1], RAMP[0][2], RAMP[0][3]];
  for (var i = 1; i < RAMP.length; i++){
    if (t <= RAMP[i][0] || i === RAMP.length - 1){
      var a = RAMP[i-1], b = RAMP[i];
      var f = (t - a[0]) / (b[0] - a[0]);
      if (f < 0) f = 0; if (f > 1) f = 1;
      return [ a[1] + (b[1]-a[1])*f, a[2] + (b[2]-a[2])*f, a[3] + (b[3]-a[3])*f ];
    }
  }
  return [246,248,242];
}
function buildLUT(){
  var b = BLEACH[bleach], step = 255 / (LEVELS - 1);
  for (var k = 0; k < 256; k++){
    var q = Math.round(k / step) * step / 255;      // printed tone steps
    var y = q * b.gain + b.lift;                     // exposure + lifted blacks
    if (y < 0) y = 0; if (y > 1) y = 1;
    y = Math.pow(y, b.gamma);                        // push the mids to milk
    var c = rampAt(y);
    LR[k] = c[0]; LG[k] = c[1]; LB[k] = c[2];
    var g = (y - 0.82) / 0.18;                       // halation source
    GLOW[k] = g <= 0 ? 0 : (g >= 1 ? 255 : (g * 255) | 0);
  }
}
buildLUT();

// ═══════════════════════════════════════════════════════════════════════
//  BUFFERS
// ═══════════════════════════════════════════════════════════════════════
var work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently:true });
var glowC = document.createElement('canvas'), gctx = glowC.getContext('2d');
var pw = 0, ph = 0, W = 0, H = 0, dpr = 1;
var lum = null, outImg = null, glowImg = null, colOf = null, rowOf = null;
var grainTile = null, paperTile = null;

var GW = 9, GH = 9;
var grid = new Float32Array(GW * GH);

var QUALS = [ {n:'オート',en:'AUTO'}, {n:'高',en:'HIGH'}, {n:'低',en:'LOW'} ];
var qual = 0, autoLong = 512, lastAdapt = 0;
function longSide(){ return qual === 1 ? 672 : qual === 2 ? 384 : autoLong; }

var canFilter = (function(){
  var c = document.createElement('canvas').getContext('2d');
  try { c.filter = 'blur(2px)'; return c.filter !== 'none' && c.filter !== ''; }
  catch (e){ return false; }
})();

function makeGrain(){
  var c = document.createElement('canvas'); c.width = c.height = 192;
  var x = c.getContext('2d'), im = x.createImageData(192, 192), d = im.data;
  for (var i = 0; i < d.length; i += 4){
    var v = 128 + ((Math.random() - 0.5) * 74) | 0;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  x.putImageData(im, 0, 0);
  return c;
}
function makePaper(){
  // long, faint xerox bands + a couple of blotches. Drawn once, never moves.
  var c = document.createElement('canvas'); c.width = 512; c.height = 512;
  var x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 512, 512);
  for (var i = 0; i < 26; i++){
    var y = Math.random() * 512, h = 0.6 + Math.random() * 3.4;
    x.fillStyle = 'rgba(47,58,60,' + (0.014 + Math.random() * 0.03).toFixed(3) + ')';
    x.fillRect(0, y, 512, h);
  }
  for (var j = 0; j < 8; j++){
    var g = x.createRadialGradient(Math.random()*512, Math.random()*512, 4,
                                   Math.random()*512, Math.random()*512, 90 + Math.random()*130);
    g.addColorStop(0, 'rgba(47,58,60,0.035)'); g.addColorStop(1, 'rgba(47,58,60,0)');
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  }
  return c;
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(window.innerWidth * dpr));
  H = Math.max(1, Math.round(window.innerHeight * dpr));
  view.width = W; view.height = H;
  view.style.width = window.innerWidth + 'px';
  view.style.height = window.innerHeight + 'px';

  var L = longSide();
  if (W >= H){ pw = L; ph = Math.max(1, Math.round(L * H / W)); }
  else       { ph = L; pw = Math.max(1, Math.round(L * W / H)); }
  work.width = pw; work.height = ph;
  glowC.width = pw; glowC.height = ph;

  lum = new Uint8Array(pw * ph);
  outImg = wctx.createImageData(pw, ph);
  glowImg = gctx.createImageData(pw, ph);
  var i;
  colOf = new Uint8Array(pw); for (i = 0; i < pw; i++) colOf[i] = (i * GW / pw) | 0;
  rowOf = new Uint8Array(ph); for (i = 0; i < ph; i++) rowOf[i] = (i * GH / ph) | 0;

  primed = false;
}
var primed = false;

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing = 'environment', mirror = false, stream = null;
function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display = 'block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video: { facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } },
    audio: false
  }).then(function(st){
    stream = st; video.srcObject = st;
    mirror = (facing === 'user');
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing === 'environment') ? 'user' : 'environment';
  primed = false;
  startStream().catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  SOUND — a cold room tone that follows how bright the page is
// ═══════════════════════════════════════════════════════════════════════
var ac = null, master = null, lp = null, droneG = null, muted = false, sceneBright = 0.5;
function initAudio(){
  if (ac) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = 0.0; master.connect(ac.destination);
  lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 0.6;
  lp.connect(master);
  droneG = ac.createGain(); droneG.gain.value = 0.5; droneG.connect(lp);

  [110, 110.4, 164.8, 220.7].forEach(function(f, i){
    var o = ac.createOscillator(); o.type = i === 3 ? 'triangle' : 'sine'; o.frequency.value = f;
    var g = ac.createGain(); g.gain.value = i === 3 ? 0.05 : 0.13;
    o.connect(g); g.connect(droneG); o.start();
  });
  // room tone: filtered noise bed
  var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
  for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * 0.4;
  var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  var ng = ac.createGain(); ng.gain.value = 0.05;
  src.connect(ng); ng.connect(lp); src.start();

  master.gain.setTargetAtTime(muted ? 0 : 0.16, ac.currentTime, 1.2);
}
function scratch(){          // a pen stroke
  if (!ac || muted) return;
  var t = ac.currentTime, len = (ac.sampleRate * 0.09) | 0;
  var buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
  for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var s = ac.createBufferSource(); s.buffer = buf;
  var bp = ac.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 1700 + Math.random() * 1400; bp.Q.value = 1.4;
  var g = ac.createGain(); g.gain.value = 0.16;
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + 0.1);
}
function shutter(){
  if (!ac || muted) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(880, t);
  o.frequency.exponentialRampToValueAtTime(160, t + 0.05);
  var g = ac.createGain(); g.gain.setValueAtTime(0.1, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.1);
}

// ═══════════════════════════════════════════════════════════════════════
//  ANNOTATIONS — hand drawn, and only ever over real structure
// ═══════════════════════════════════════════════════════════════════════
var LABELS_EN = ['FIG. 4','DETAIL A','SCALE 1:2000','NOT TO SCALE','SECTION B–B',
  'ELEV. +38M','GRID 07','KEEP LEFT','NO ACCESS','THIS SIDE UP','CONTINUES →',
  'AREA OF DETAIL','SURVEY 1997','PLATE VII','REF. 0042','HORIZON','VANISHING PT.',
  'LOAD BEARING','TEMPORARY','SEE OVERLEAF','EXIT','APPROX.','UNVERIFIED'];
var LABELS_JP = ['注意','拡大図','立入禁止','この先行止り','高さ制限','非常口','断面','基準線','測量点','上'];
var KINDS = ['box','box','bracket','arrow','cross','underline'];

var anns = [], MAX_ANN = 7, lastSpawn = 0, annOn = true, figNo = 1;

function seedRand(s){ s = Math.sin(s) * 43758.5453; return s - Math.floor(s); }
function pickLabel(s){
  return seedRand(s) < 0.78
    ? LABELS_EN[(seedRand(s + 1.7) * LABELS_EN.length) | 0]
    : LABELS_JP[(seedRand(s + 3.1) * LABELS_JP.length) | 0];
}
function addAnn(nx, ny, pinned){
  var s = Math.random() * 1000;
  var kind = pinned ? (Math.random() < 0.5 ? 'box' : 'cross') : KINDS[(Math.random() * KINDS.length) | 0];
  anns.push({
    kind: kind, nx: nx, ny: ny,
    nw: 0.10 + Math.random() * 0.16,
    nh: 0.08 + Math.random() * 0.13,
    dir: Math.random() < 0.5 ? -1 : 1,
    text: pickLabel(s), seed: s,
    born: performance.now(),
    life: pinned ? 21000 : 7000 + Math.random() * 4500,
    pinned: !!pinned
  });
  if (anns.length > MAX_ANN + 4) anns.shift();
  scratch();
}
function pickHotCell(){
  var i, total = 0, n = GW * GH;
  for (i = 0; i < n; i++) total += grid[i];
  if (total <= 0) return null;
  var mean = total / n, cand = [], wsum = 0;
  for (i = 0; i < n; i++){
    if (grid[i] < mean * 1.25) continue;
    var cx = ((i % GW) + 0.5) / GW, cy = (((i / GW) | 0) + 0.5) / GH;
    var near = false;
    for (var a = 0; a < anns.length; a++){
      var dx = anns[a].nx - cx, dy = anns[a].ny - cy;
      if (dx*dx + dy*dy < 0.045){ near = true; break; }
    }
    if (near) continue;
    cand.push({ x:cx, y:cy, w:grid[i] }); wsum += grid[i];
  }
  if (!cand.length) return null;
  var r = Math.random() * wsum;
  for (i = 0; i < cand.length; i++){ r -= cand[i].w; if (r <= 0) return cand[i]; }
  return cand[cand.length - 1];
}

// wobbly ink line, revealed 0..prog
function wline(x1, y1, x2, y2, amp, seed, prog){
  var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx*dx + dy*dy);
  if (len < 0.5) return;
  var segs = Math.max(2, Math.min(26, Math.round(len / 13)));
  var px = -dy / len, py = dx / len;
  dctx.beginPath();
  for (var i = 0; i <= segs; i++){
    var t = i / segs;
    if (t > prog){                                  // stop mid-segment
      t = prog;
      if (t <= 0) break;
    }
    var w = (seedRand(seed + i * 2.3) - 0.5) * amp;
    var x = x1 + dx * t + px * w, y = y1 + dy * t + py * w;
    if (i === 0) dctx.moveTo(x, y); else dctx.lineTo(x, y);
    if (i / segs > prog) break;
  }
  dctx.stroke();
}
function wpath(pts, amp, seed, prog, close){
  // reveal a multi-segment path evenly along its total length
  var i, total = 0, segl = [];
  for (i = 0; i < pts.length - 1; i++){
    var l = Math.hypot(pts[i+1][0] - pts[i][0], pts[i+1][1] - pts[i][1]);
    segl.push(l); total += l;
  }
  if (close && pts.length > 2){
    var l2 = Math.hypot(pts[0][0] - pts[pts.length-1][0], pts[0][1] - pts[pts.length-1][1]);
    segl.push(l2); total += l2; pts = pts.concat([pts[0]]);
  }
  var want = total * prog, acc = 0;
  for (i = 0; i < segl.length; i++){
    if (acc >= want) break;
    var p = Math.min(1, (want - acc) / segl[i]);
    wline(pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1], amp, seed + i * 9.1, p);
    acc += segl[i];
  }
}
function annText(t, x, y, size, align){
  dctx.font = '700 ' + size + 'px "Space Mono", ui-monospace, monospace';
  if (/[^\x00-\x7F]/.test(t)) dctx.font = '500 ' + size + 'px "Zen Kaku Gothic New", sans-serif';
  dctx.textAlign = align || 'left'; dctx.textBaseline = 'alphabetic';
  var w = dctx.measureText(t).width, pad = size * 0.34;
  var bx = align === 'right' ? x - w - pad : x - pad;
  dctx.save();
  dctx.globalAlpha *= 0.9;
  dctx.fillStyle = 'rgba(246,248,242,0.55)';
  dctx.fillRect(bx, y - size, w + pad * 2, size * 1.34);
  dctx.restore();
  dctx.fillText(t, x, y);
}

function drawAnns(now){
  var s = Math.min(W, H);
  dctx.lineJoin = 'round'; dctx.lineCap = 'round';
  for (var i = anns.length - 1; i >= 0; i--){
    var a = anns[i], age = now - a.born;
    if (age > a.life){ anns.splice(i, 1); continue; }
    var fade = 1;
    if (age < 260) fade = age / 260;
    else if (age > a.life - 1100) fade = (a.life - age) / 1100;
    var prog = Math.min(1, age / 520);              // ink appearing
    var x = a.nx * W, y = a.ny * H;
    var w = a.nw * s * 1.5, h = a.nh * s * 1.5;
    var amp = s * 0.007;

    dctx.globalAlpha = fade * (a.pinned ? 0.95 : 0.82);
    dctx.strokeStyle = 'rgba(47,58,60,0.9)';
    dctx.fillStyle = 'rgba(47,58,60,0.92)';
    dctx.lineWidth = Math.max(1, s * 0.0024);

    var x0 = x - w/2, y0 = y - h/2, x1 = x + w/2, y1 = y + h/2;

    if (a.kind === 'box'){
      wpath([[x0,y0],[x1,y0],[x1,y1],[x0,y1]], amp, a.seed, prog, true);
      if (prog > 0.75) annText(a.text, x0, y0 - s*0.014, Math.max(9, s*0.019));
    } else if (a.kind === 'bracket'){
      var c = Math.min(w, h) * 0.34;
      wpath([[x0+c,y0],[x0,y0],[x0,y0+c]], amp, a.seed, prog, false);
      wpath([[x1-c,y0],[x1,y0],[x1,y0+c]], amp, a.seed+40, prog, false);
      wpath([[x0+c,y1],[x0,y1],[x0,y1-c]], amp, a.seed+80, prog, false);
      wpath([[x1-c,y1],[x1,y1],[x1,y1-c]], amp, a.seed+120, prog, false);
      if (prog > 0.75) annText(a.text, x1, y1 + s*0.03, Math.max(9, s*0.019), 'right');
    } else if (a.kind === 'arrow'){
      var tx = x, ty = y, sx = x + a.dir * w * 0.9, sy = y - h * 0.75;
      wline(sx, sy, tx, ty, amp, a.seed, prog);
      if (prog > 0.85){
        var ang = Math.atan2(ty - sy, tx - sx), hl = s * 0.022;
        wline(tx, ty, tx - Math.cos(ang - 0.42) * hl, ty - Math.sin(ang - 0.42) * hl, amp*0.4, a.seed+7, 1);
        wline(tx, ty, tx - Math.cos(ang + 0.42) * hl, ty - Math.sin(ang + 0.42) * hl, amp*0.4, a.seed+9, 1);
        annText(a.text, sx, sy - s*0.012, Math.max(9, s*0.019), a.dir > 0 ? 'left' : 'right');
      }
    } else if (a.kind === 'cross'){
      var r = s * 0.028;
      wline(x - r, y, x + r, y, amp*0.5, a.seed, prog);
      wline(x, y - r, x, y + r, amp*0.5, a.seed+3, prog);
      dctx.globalAlpha = fade * 0.5;
      dctx.beginPath(); dctx.arc(x, y, r*0.62, 0, Math.PI*2 * prog); dctx.stroke();
      dctx.globalAlpha = fade * 0.9;
      if (prog > 0.8) annText(a.text, x + r*1.2, y - r*0.4, Math.max(8, s*0.017));
    } else { // underline
      wline(x0, y1, x1, y1, amp, a.seed, prog);
      if (prog > 0.6) wline(x0, y1 + s*0.008, x0 + (x1-x0)*0.4, y1 + s*0.008, amp, a.seed+5, prog);
      if (prog > 0.8) annText(a.text, x0, y1 + s*0.04, Math.max(9, s*0.019));
    }
  }
  dctx.globalAlpha = 1;
}

function drawRegistration(){
  // the printed page furniture: inset frame, crop marks, caption
  var m = Math.round(Math.min(W, H) * 0.028), t = Math.max(1, Math.min(W,H) * 0.0022);
  dctx.save();
  dctx.strokeStyle = 'rgba(47,58,60,0.42)'; dctx.lineWidth = t;
  dctx.strokeRect(m, m, W - m*2, H - m*2);
  dctx.strokeStyle = 'rgba(47,58,60,0.7)'; dctx.lineWidth = t * 1.4;
  var c = m * 0.62;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(function(p){
    dctx.beginPath();
    dctx.moveTo(p[0] - p[2]*c*0.5, p[1]); dctx.lineTo(p[0] + p[2]*c, p[1]);
    dctx.moveTo(p[0], p[1] - p[3]*c*0.5); dctx.lineTo(p[0], p[1] + p[3]*c);
    dctx.stroke();
  });
  var fs = Math.max(8, Math.min(W,H) * 0.016);
  dctx.font = '400 ' + fs + 'px "Space Mono", monospace';
  dctx.fillStyle = 'rgba(47,58,60,0.6)';
  dctx.textAlign = 'right'; dctx.textBaseline = 'bottom';
  dctx.fillText('HAKUCHU — FIG. ' + (figNo < 10 ? '0' : '') + figNo,
                W - m - fs*0.4, H - m - fs*0.5 - Math.min(H * 0.10, 86));
  dctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  THE GRADE
// ═══════════════════════════════════════════════════════════════════════
var lastProc = 0, procMs = 12;

function process(){
  var vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh || video.readyState < 2) return false;

  var sc = Math.max(pw / vw, ph / vh), dw = vw * sc, dh = vh * sc;
  wctx.save();
  if (mirror){ wctx.translate(pw, 0); wctx.scale(-1, 1); }
  wctx.drawImage(video, (pw - dw) / 2, (ph - dh) / 2, dw, dh);
  wctx.restore();

  var t0 = performance.now();
  var src = wctx.getImageData(0, 0, pw, ph).data;
  var out = outImg.data, gl = glowImg.data, L = lum;
  var n = pw * ph, i, p;

  for (i = 0, p = 0; i < n; i++, p += 4){
    L[i] = (src[p] * 77 + src[p+1] * 150 + src[p+2] * 29) >> 8;
  }

  var b = BLEACH[bleach], chroma = b.chroma;
  for (i = 0; i < GW * GH; i++) grid[i] *= 0.55;      // decay, so the map follows the camera

  var x, y, idx = 0;
  for (y = 0; y < ph; y++){
    var yUp = y > 0 ? -pw : 0, yDn = y < ph - 1 ? pw : 0;
    var gRow = rowOf[y] * GW;
    for (x = 0; x < pw; x++, idx++){
      var xL = x > 0 ? -1 : 0, xR = x < pw - 1 ? 1 : 0;
      var tl = L[idx + yUp + xL], tc = L[idx + yUp], tr = L[idx + yUp + xR];
      var ml = L[idx + xL],       mr = L[idx + xR];
      var bl = L[idx + yDn + xL], bc = L[idx + yDn], br = L[idx + yDn + xR];
      var gx = (tr + 2*mr + br) - (tl + 2*ml + bl);
      var gy = (bl + 2*bc + br) - (tl + 2*tc + tr);
      if (gx < 0) gx = -gx; if (gy < 0) gy = -gy;
      var e = gx + gy;
      grid[gRow + colOf[x]] += e;

      var v = L[idx];
      var k = v + ((BAYER[((y & 3) << 2) | (x & 3)] - 7.5) * 2.6);   // ordered dither
      if (k < 0) k = 0; else if (k > 255) k = 255;
      k = k | 0;

      var q = idx << 2;
      var r = LR[k] + (src[q] - v) * chroma;
      var g = LG[k] + (src[q+1] - v) * chroma;
      var bb = LB[k] + (src[q+2] - v) * chroma;

      if (e > EDGE_T){                                   // drafting ink on the structure
        var a = (e - EDGE_T) * EDGE_K;
        if (a > 0.72) a = 0.72;
        var ia = 1 - a;
        r = r * ia + INK[0] * a; g = g * ia + INK[1] * a; bb = bb * ia + INK[2] * a;
      }
      out[q]   = r < 0 ? 0 : r > 255 ? 255 : r;
      out[q+1] = g < 0 ? 0 : g > 255 ? 255 : g;
      out[q+2] = bb < 0 ? 0 : bb > 255 ? 255 : bb;
      out[q+3] = 255;

      var gv = GLOW[k];
      gl[q] = 238; gl[q+1] = 248; gl[q+2] = 250; gl[q+3] = gv;
    }
  }
  wctx.putImageData(outImg, 0, 0);
  gctx.putImageData(glowImg, 0, 0);

  // scene brightness → filter cutoff, read cheaply off the grid-free luma sum
  var sum = 0, stepN = Math.max(1, (n / 4000) | 0);
  for (i = 0; i < n; i += stepN) sum += L[i];
  sceneBright = sum / ((n / stepN) | 0 || 1) / 255;

  procMs = procMs * 0.85 + (performance.now() - t0) * 0.15;
  return true;
}

function adapt(now){
  if (qual !== 0 || now - lastAdapt < 1800) return;
  lastAdapt = now;
  var want = autoLong;
  if (procMs > 24 && autoLong > 352) want = autoLong - 96;
  else if (procMs < 9 && autoLong < 640) want = autoLong + 96;
  if (want !== autoLong){ autoLong = want; resize(); }
}

// ═══════════════════════════════════════════════════════════════════════
//  COMPOSITE
// ═══════════════════════════════════════════════════════════════════════
var grainOff = 0;
function drawRaw(){
  var vw = video.videoWidth, vh = video.videoHeight;
  dctx.fillStyle = '#1b2224'; dctx.fillRect(0, 0, W, H);
  if (vw && vh){
    var sc = Math.max(W / vw, H / vh), dw = vw * sc, dh = vh * sc;
    dctx.save();
    if (mirror){ dctx.translate(W, 0); dctx.scale(-1, 1); }
    dctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
    dctx.restore();
  }
  var fs = Math.max(10, Math.min(W, H) * 0.02), m = Math.round(Math.min(W, H) * 0.028);
  dctx.font = '700 ' + fs + 'px "Space Mono", monospace';
  dctx.textAlign = 'left'; dctx.textBaseline = 'top';
  dctx.fillStyle = 'rgba(246,248,242,0.9)';
  dctx.fillText('RAW — 未処理', m, m + Math.min(W, H) * 0.075);
}

function composite(now){
  var b = BLEACH[bleach];
  dctx.globalCompositeOperation = 'source-over';
  dctx.globalAlpha = 1;
  dctx.imageSmoothingEnabled = true;
  dctx.imageSmoothingQuality = 'high';
  dctx.drawImage(work, 0, 0, W, H);

  // halation — the bleached highlights bleed
  dctx.save();
  dctx.globalCompositeOperation = 'lighter';
  dctx.globalAlpha = 0.34;
  if (canFilter){
    dctx.filter = 'blur(' + Math.max(6, Math.min(W, H) * 0.022).toFixed(1) + 'px)';
    dctx.drawImage(glowC, 0, 0, W, H);
    dctx.filter = 'none';
  } else {
    dctx.drawImage(glowC, 0, 0, W, H);
  }
  dctx.restore();

  // paper: long xerox bands, fixed to the page
  dctx.save();
  dctx.globalCompositeOperation = 'multiply';
  dctx.globalAlpha = 0.5;
  dctx.drawImage(paperTile, 0, 0, W, H);
  dctx.restore();

  // white fog bleaching in from the edges (never a dark vignette)
  var fg = dctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.42, W/2, H/2,
                                     Math.sqrt(W*W + H*H) * 0.56);
  fg.addColorStop(0, 'rgba(246,248,242,0)');
  fg.addColorStop(0.72, 'rgba(246,248,242,' + (b.fog * 0.30).toFixed(3) + ')');
  fg.addColorStop(1, 'rgba(246,248,242,' + b.fog.toFixed(3) + ')');
  dctx.fillStyle = fg; dctx.fillRect(0, 0, W, H);

  // grain, crawling
  dctx.save();
  dctx.globalCompositeOperation = 'soft-light';
  dctx.globalAlpha = 0.38;
  grainOff = (grainOff + 37) % 192;
  var gs = 192 * Math.max(1, dpr * 0.75);
  for (var gx2 = -gs; gx2 < W; gx2 += gs)
    for (var gy2 = -gs; gy2 < H; gy2 += gs)
      dctx.drawImage(grainTile, gx2 + grainOff % gs, gy2 + (grainOff * 1.7) % gs, gs, gs);
  dctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var running = false, peeking = false;
function loop(){
  if (!running) return;
  requestAnimationFrame(loop);
  var now = performance.now();

  if (peeking){ drawRaw(); return; }

  if (now - lastProc >= 32){
    if (process()){ primed = true; lastProc = now; adapt(now); }
  }
  if (!primed){
    dctx.fillStyle = '#eceee6'; dctx.fillRect(0, 0, W, H);
    return;
  }

  composite(now);

  if (annOn){
    if (now - lastSpawn > 1500 && anns.length < MAX_ANN){
      var c = pickHotCell();
      if (c){
        addAnn(Math.min(0.80, Math.max(0.20, c.x + (Math.random() - 0.5) * 0.06)),
               Math.min(0.82, Math.max(0.18, c.y + (Math.random() - 0.5) * 0.06)), false);
      }
      lastSpawn = now;
    }
    drawAnns(now);
  }
  drawRegistration();

  if (ac && !muted){
    lp.frequency.setTargetAtTime(420 + sceneBright * 1500, ac.currentTime, 0.6);
    droneG.gain.setTargetAtTime(0.34 + sceneBright * 0.3, ac.currentTime, 0.9);
  }

  if (now - lastStat > 400){
    lastStat = now;
    statEl.textContent = 'FIG.' + (figNo < 10 ? '0' : '') + figNo +
      ' · EV ' + BLEACH[bleach].en + ' · ' + (annOn ? anns.length : 0) + ' MARKS';
  }
}
var lastStat = 0;

// ═══════════════════════════════════════════════════════════════════════
//  INPUT — tap pins a mark, hold lifts the grade
// ═══════════════════════════════════════════════════════════════════════
var downT = 0, downX = 0, downY = 0, holdTimer = 0, moved = false;
view.addEventListener('pointerdown', function(e){
  if (!running) return;
  downT = performance.now(); downX = e.clientX; downY = e.clientY; moved = false;
  holdTimer = setTimeout(function(){ peeking = true; }, 260);
});
view.addEventListener('pointermove', function(e){
  if (!downT) return;
  if (Math.abs(e.clientX - downX) > 12 || Math.abs(e.clientY - downY) > 12) moved = true;
});
function endPointer(e){
  if (!downT) return;
  clearTimeout(holdTimer);
  var held = performance.now() - downT;
  if (peeking){ peeking = false; }
  else if (!moved && held < 260 && annOn){
    addAnn(Math.min(0.9, Math.max(0.1, downX / window.innerWidth)),
           Math.min(0.9, Math.max(0.1, downY / window.innerHeight)), true);
  }
  downT = 0;
}
view.addEventListener('pointerup', endPointer);
view.addEventListener('pointercancel', endPointer);
view.addEventListener('pointerleave', endPointer);

bleachBtn.addEventListener('click', function(){
  bleach = (bleach + 1) % BLEACH.length;
  bleachLbl.textContent = BLEACH[bleach].name;
  buildLUT();
});
annBtn.addEventListener('click', function(){
  annOn = !annOn;
  annLbl.textContent = annOn ? 'ON' : 'OFF';
  if (!annOn) anns.length = 0;
});
qualBtn.addEventListener('click', function(){
  qual = (qual + 1) % QUALS.length;
  qualLbl.textContent = QUALS[qual].n;
  resize();
});
sndBtn.addEventListener('click', function(){
  muted = !muted;
  sndLbl.textContent = muted ? 'OFF' : 'ON';
  if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.16, ac.currentTime, 0.3);
});
saveBtn.addEventListener('click', function(){
  if (!running) return;
  shutter();
  try {
    view.toBlob(function(blob){
      if (!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hakuchu_fig' + (figNo < 10 ? '0' : '') + figNo + '_' + Date.now() + '.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      figNo++;
    }, 'image/png');
  } catch (e){ showError(e); }
});

window.addEventListener('resize', function(){ resize(); });
window.addEventListener('orientationchange', function(){ setTimeout(resize, 240); });

// ═══════════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════════
goBtn.addEventListener('click', function(){
  goBtn.textContent = 'よみこみ中';
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
  startStream().then(function(){
    startEl.classList.add('gone');
    running = true;
    lastSpawn = performance.now();
    loop();
  }).catch(function(e){
    goBtn.textContent = 'まちを見る';
    showError(e);
  });
});

grainTile = makeGrain();
paperTile = makePaper();
resize();
dctx.fillStyle = '#eceee6'; dctx.fillRect(0, 0, W, H);

})();
</script>
</body>
