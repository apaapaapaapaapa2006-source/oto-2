<meta name="description" content="止まっているあいだだけ、体の上に花が咲きつづける。咲いた花は寿命が来れば散り、あなたが動いてその場所から居なくなれば、そこにあった花は手を離して落ちていく。散った花びらは画面の底に光の褥として積もり、しばらく消えない。季節は九十五秒で一巡し、花の種も色も休みなく移り変わるので、同じ景色は二度と現れない。両腕を高く掲げれば散華。">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Murecho:wght@200;400;600&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  RYORAN 繚乱 ─ 体の上に咲いて散る百花            ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      A dark room with nothing in it but you and several hundred
            flowers that are alive. Not a filter laid over a photograph —
            an ecosystem that happens to be using your body as soil. The
            gallery has been getting quiet and tasteful; this one is
            allowed to be extravagant, because the request was for
            something that makes you say "わ" out loud.

  PALETTE   THE PALETTE IS A FUNCTION OF TIME, NOT A LIST. Only three
            colours are fixed:
              玄    kuro    #05040a  the night. A violet-black, never pure
                                     black, so the glow has somewhere to
                                     sit and the darkness still has depth.
              藍鉄  aitetsu #141a2e  you. The camera is graded down into
                                     this, so you read as a dark form with
                                     flowers on it and never as a photo.
              金    kin     #f5d78a  RESERVED for 散華 — the flash, the
                                     shockwave ring, and the drift of
                                     settled petals. Gold means "this
                                     already happened".
            Every flower colour is generated from the season phase, which
            advances continuously and never lands twice in the same place.
            春 pale rose / crimson / white, 夏 cyan / viridian / yellow,
            秋 amber / vermilion / gold, 冬 white / ice / pale violet —
            and always interpolated BETWEEN two seasons, never on one.

  BACKGROUND  Night, with a slow vertical gradient and a field of drifting
              motes of light that never stops moving. Along the bottom, a
              persistent drift layer: every petal that finishes its fall
              stamps its colour there, and the layer erases itself at
              about 1% a second. So the floor of the piece is a slowly
              fading record of everything that has already bloomed. No
              vignette anywhere.

  TYPE      Murecho 200/400/600 for every label and number — a modern,
            almost invisible sans, because the ornament in this piece is
            the flowers and the type must not compete with them. Cormorant
            Garamond 300 italic, large and quiet, for the season name
            alone: the one place the page is allowed to be lavish.

  MOTION    ORGANIC AND UNHURRIED, WITH ONE VIOLENT MOMENT. Flowers open
            on an eased curve with a small overshoot at full bloom and
            then breathe. Petals flutter on a per-petal phase so no two
            fall alike. Every camera-side reaction is slow (0.4–0.8 s).
            The single exception is 散華: 90 ms, a white-gold flash, an
            expanding ring, and every flower on your body lets go at once.

  SIGNATURE 咲くのは、止まっているあいだだけ。 Stillness is the input.
            The stiller you are, the faster the garden grows over you —
            and the instant your body moves out from under a flower, that
            flower has nothing left to hold and falls. So you can draw
            with stillness: hold a shape until it fills with flowers, then
            move, and watch the shape you used to be rain down behind you.
            And the garden is also the score — each flower rings a single
            note at the moment it opens, so a body that is filling with
            flowers is audibly filling with music.
  ══════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  RYORAN 繚乱 ─ 体の上に咲いて散る百花
//
//  Your body is soil. Flowers are seeded onto the segmentation mask, open
//  on their own clock, ring one note each at the moment they open, live
//  out a lifespan and scatter into petals. A flower whose anchor point is
//  no longer inside your body has nothing to hold on to and falls — so
//  MOVING is what makes the garden rain, and STILLNESS is what makes it
//  grow. Petals that finish falling stamp themselves into a persistent
//  drift layer that erases itself over about a minute, so the floor is a
//  fading record of everything that has already bloomed.
//
//  The season phase advances continuously and is always between two
//  seasons, never on one, so the palette and the species mix never land
//  in the same place twice.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number' && isFinite(v); }
function chase(cur,tgt,rate,dt){ var k=1-Math.exp(-rate*clamp(dt,0,0.2)); return cur+(tgt-cur)*k; }

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var densEl=document.getElementById('densEl');
var sndBtn=document.getElementById('snd');
var seasonK=document.getElementById('seasonK');
var seasonJ=document.getElementById('seasonJ');
var rF=document.getElementById('rF');
var rP=document.getElementById('rP');
var rC=document.getElementById('rC');
var mBtn=[document.getElementById('m0'),document.getElementById('m1'),
          document.getElementById('m2'),document.getElementById('m3'),document.getElementById('m4')];

var W=0,H=0,DPR=1,MN=1;
var layer=null,lctx=null;      // flowers + petals, drawn once, reused for the glow
var glow=null,gctx=null;       // downsampled copy of `layer` = the bloom
var drift=null,dctx=null;      // persistent record of petals that have landed

function mkCanvas(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  return c;
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
  layer=mkCanvas(W*DPR,H*DPR); lctx=layer.getContext('2d');
  if (lctx) lctx.setTransform(DPR,0,0,DPR,0,0);
  glow=mkCanvas(W/7,H/7); gctx=glow.getContext('2d');
  var nd=mkCanvas(W/2,H/2), ndc=nd.getContext('2d');
  if (drift&&ndc){ try{ ndc.drawImage(drift,0,0,nd.width,nd.height); }catch(e){} }
  drift=nd; dctx=ndc;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseBody();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  COVER MAPPING
//
//  MediaPipe normalises x by the FRAME width and y by the FRAME height.
//  The mask grid covers the same frame, so everything — flower anchors,
//  wrist positions, the body centroid — lives in MASK GRID coordinates
//  and reaches the screen only through this one aspect-preserving cover
//  map. Every radius and distance is then compared in screen pixels
//  against MN (the SHORT edge), so the same physical gesture and the same
//  flower size read identically in portrait and in landscape.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect;
  if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX + (mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY + ny*(covS/camAspect); }
function mx2s(mx){ return sx(MW>0?mx/MW:0.5); }   // mask grid → screen px
function my2s(my){ return sy(MH>0?my/MH:0.5); }

// ═══════════════════════════════════════════════════════════════════════
//  BODY  ─ one Pose pass gives both the segmentation mask and the joints
// ═══════════════════════════════════════════════════════════════════════
var pose=null, mpCamera=null, mpReady=false;
var LOST_S=0.6;
var MW=0,MH=0,MN2=0;
var MASK=null, MPREV=null, maskCv=null, maskCtx=null;
var onList=null, onN=0, occ=null, OCW=0, OCH=0;
var bodyT=-9, bodySeen=false, maskT=-9;
var calm=0, diffFrac=0;
var cenX=0, cenY=0;                          // body centroid, mask coords
var wrist=[{on:false,x:0,y:0,sx:0,sy:0},{on:false,x:0,y:0,sx:0,sy:0}];
var noseY=0.5, noseOn=false;
var raiseT=0, sangeArm=0;

function allocMask(){
  MW=120;
  MH=Math.max(24,Math.round(MW/camAspect));
  MN2=MW*MH;
  MASK=new Uint8Array(MN2);
  MPREV=new Uint8Array(MN2);
  onList=new Int32Array(MN2);
  maskCv=mkCanvas(MW,MH);
  maskCtx=maskCv.getContext('2d');
  OCW=Math.max(4,Math.ceil(MW/4)); OCH=Math.max(4,Math.ceil(MH/4));
  occ=new Uint8Array(OCW*OCH);
  allocBody();
}
function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  if (!fin(p.x)||!fin(p.y)) return false;
  if (typeof p.visibility==='number' && p.visibility<0.4) return false;
  return true;
}
function loseBody(){
  bodySeen=false; bodyT=-9; maskT=-9;
  wrist[0].on=false; wrist[1].on=false; noseOn=false;
  if (MASK) MASK.fill(0);
  if (MPREV) MPREV.fill(0);
  onN=0; diffFrac=0; calm=0;
  // a half-held 散華 must not survive a dropout, or an arm that leaves the
  // frame raised and comes back raised would fire one for free
  raiseT=0;
}
function bodyLive(){ return bodySeen && (now()-bodyT)<LOST_S; }
function maskLive(){ return (now()-maskT)<LOST_S; }

// Read the mask. MediaPipe delivers the confidence in the RED channel on
// some builds and in ALPHA on others; min(R,A) is correct for both and
// for the case where it is in both, so there is no version sniffing here.
function readMask(src){
  if (!maskCtx) return false;
  try{
    maskCtx.clearRect(0,0,MW,MH);
    maskCtx.drawImage(src,0,0,MW,MH);
  }catch(e){ return false; }
  var img;
  try{ img=maskCtx.getImageData(0,0,MW,MH); }catch(e){ return false; }
  var d=img&&img.data;
  if (!d||d.length<MN2*4) return false;
  var i,o,r,a,v,diff=0,sum=0;
  for (i=0;i<MN2;i++){
    o=i<<2;
    r=d[o]; a=d[o+3];
    v=r<a?r:a;
    MASK[i]=v;
    if (v>110) sum++;
    var pv=MPREV[i];
    var dd=v-pv; if (dd<0) dd=-dd;
    if (dd>70) diff++;
  }
  MPREV.set(MASK);
  onN=0;
  var gx,gy,cx=0,cy=0;
  for (i=0;i<MN2;i++){
    if (MASK[i]>110){
      onList[onN++]=i;
      gx=i%MW; gy=(i-gx)/MW;
      cx+=gx; cy+=gy;
    }
  }
  if (onN>0){ cenX=cx/onN; cenY=cy/onN; }
  diffFrac=(sum>40)?(diff/sum):0;
  maskT=now();
  return onN>0;
}

// Fallback: if the build has no segmentation mask, paint the body from the
// skeleton as capsules. The piece has to work rather than sit empty.
var CAPS=[[11,12,0.30],[11,23,0.22],[12,24,0.22],[23,24,0.26],
          [11,13,0.13],[13,15,0.105],[12,14,0.13],[14,16,0.105],
          [23,25,0.15],[25,27,0.12],[24,26,0.15],[26,28,0.12]];
function maskFromSkeleton(L){
  if (!MASK) return false;
  MASK.fill(0);
  var span=1;
  if (lmOK(L,11)&&lmOK(L,12)) span=Math.hypot((L[11].x-L[12].x)*MW,(L[11].y-L[12].y)*MH);
  if (!fin(span)||span<4) span=MW*0.18;
  var k,c,ax,ay,bx,by,rad;
  for (k=0;k<CAPS.length;k++){
    c=CAPS[k];
    if (!lmOK(L,c[0])||!lmOK(L,c[1])) continue;
    ax=L[c[0]].x*MW; ay=L[c[0]].y*MH;
    bx=L[c[1]].x*MW; by=L[c[1]].y*MH;
    rad=span*c[2];
    if (fin(ax)&&fin(ay)&&fin(bx)&&fin(by)&&rad>0.4) capsule(ax,ay,bx,by,rad);
  }
  if (lmOK(L,0)) capsule(L[0].x*MW,L[0].y*MH-span*0.05,L[0].x*MW,L[0].y*MH+span*0.05,span*0.30);
  onN=0;
  var i,gx,gy,cx=0,cy=0,diff=0,sum=0;
  for (i=0;i<MN2;i++){
    var v=MASK[i], pv=MPREV[i];
    if (v>110){ sum++; onList[onN++]=i; gx=i%MW; gy=(i-gx)/MW; cx+=gx; cy+=gy; }
    var dd=v-pv; if (dd<0) dd=-dd;
    if (dd>70) diff++;
  }
  MPREV.set(MASK);
  if (onN>0){ cenX=cx/onN; cenY=cy/onN; }
  diffFrac=(sum>40)?(diff/sum):0;
  maskT=now();
  return onN>0;
}
function capsule(ax,ay,bx,by,r){
  var x0=Math.max(0,Math.floor(Math.min(ax,bx)-r)), x1=Math.min(MW-1,Math.ceil(Math.max(ax,bx)+r));
  var y0=Math.max(0,Math.floor(Math.min(ay,by)-r)), y1=Math.min(MH-1,Math.ceil(Math.max(ay,by)+r));
  var dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  var r2=r*r,x,y,px,py,t,qx,qy,dd;
  for (y=y0;y<=y1;y++){
    for (x=x0;x<=x1;x++){
      px=x-ax; py=y-ay;
      t=(L2>1e-6)?clamp((px*dx+py*dy)/L2,0,1):0;
      qx=px-dx*t; qy=py-dy*t;
      dd=qx*qx+qy*qy;
      if (dd<=r2) MASK[y*MW+x]=255;
    }
  }
}
function maskAt(mx,my){
  var x=mx|0, y=my|0;
  if (x<0||y<0||x>=MW||y>=MH) return 0;
  return MASK[y*MW+x];
}

function onPose(res){
  var t=now();
  updateCover();
  if (!MASK||Math.abs(MW/Math.max(1,MH)-camAspect)>0.06) allocMask();
  var L=res?res.poseLandmarks:null;
  var got=false;
  if (res&&res.segmentationMask) got=readMask(res.segmentationMask);
  if (!got&&L) got=maskFromSkeleton(L);
  if (got){ bodySeen=true; bodyT=t; }
  else if (t-bodyT>=LOST_S){ bodySeen=false; onN=0; }

  var WI=[15,16];
  for (var k=0;k<2;k++){
    if (L&&lmOK(L,WI[k])){
      var mx=L[WI[k]].x*MW, my=L[WI[k]].y*MH;
      var px=sx(L[WI[k]].x), py=sy(L[WI[k]].y);
      if (fin(px)&&fin(py)){ wrist[k].on=true; wrist[k].x=mx; wrist[k].y=my; wrist[k].sx=px; wrist[k].sy=py; }
      else wrist[k].on=false;
    } else wrist[k].on=false;
  }
  if (L&&lmOK(L,0)&&fin(L[0].y)){ noseOn=true; noseY=L[0].y; } else noseOn=false;
}
function initPose(){
  if (typeof window.Pose!=='function') return false;
  try{
    pose=new window.Pose({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f;
    }});
    pose.setOptions({ modelComplexity:1, smoothLandmarks:true,
                      enableSegmentation:true, smoothSegmentation:true,
                      selfieMode:false,
                      minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    pose.onResults(onPose);
    mpReady=true; return true;
  }catch(e){ pose=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!pose||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!pose) return Promise.resolve();
        try{ return pose.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  SEASONS ─ the palette is a function of time
//
//  The phase never rests on a season; it is always between two, and the
//  species mix, the hue set and the pad chord are all interpolated. A
//  ninety-five second year plus a slow drift means the exact combination
//  on screen has not occurred before and will not occur again.
// ═══════════════════════════════════════════════════════════════════════
var SEASONS=[
  { k:'Spring', j:'は る', hues:[[342,62,80],[318,48,86],[  0, 0,96],[  6,58,78]],
    spec:[0,0,1,4], pitch:[0,3,5,7,10] },                    // 春
  { k:'Summer', j:'な つ', hues:[[186,72,68],[152,58,62],[ 48,84,72],[210,66,66]],
    spec:[2,3,5,2], pitch:[0,2,4,7,9] },                     // 夏
  { k:'Autumn', j:'あ き', hues:[[ 26,80,66],[  8,72,60],[ 42,78,64],[350,60,56]],
    spec:[3,1,4,3], pitch:[0,2,3,7,8] },                     // 秋
  { k:'Winter', j:'ふ ゆ', hues:[[  0, 0,94],[202,34,84],[262,30,80],[ 22,20,88]],
    spec:[4,0,0,5], pitch:[0,1,5,7,8] }                      // 冬
];
var YEAR=95;
var seasonPhase=0, seasonLock=-1, seasonWobble=0;
function seasonMix(){
  // returns {a, b, t} — always BETWEEN two seasons
  var p;
  if (seasonLock>=0) p=seasonLock+0.001;
  else p=(seasonPhase+seasonWobble)%4;
  if (p<0) p+=4;
  var a=Math.floor(p)%4, t=p-Math.floor(p);
  return { a:a, b:(a+1)%4, t:t };
}
function seasonHue(r1,r2){
  var m=seasonMix();
  var A=SEASONS[m.a].hues, B=SEASONS[m.b].hues;
  var i=(r1*4)|0; if (i>3) i=3;
  var ha=A[i], hb=B[i];
  var dh=hb[0]-ha[0];
  while (dh>180) dh-=360;
  while (dh<-180) dh+=360;
  var mixT=(r2<m.t)?1:0;            // dither between the two seasons' sets
  var h=ha[0]+dh*lerp(m.t,mixT,0.55);
  return [ (h%360+360)%360,
           lerp(ha[1],hb[1],m.t)*(0.86+r2*0.28),
           lerp(ha[2],hb[2],m.t)*(0.88+r1*0.22) ];
}
function seasonSpec(r){
  var m=seasonMix();
  var set=(r<m.t)?SEASONS[m.b].spec:SEASONS[m.a].spec;
  var i=(r*4)|0; if (i>3) i=3; if (i<0) i=0;
  return set[i];
}
function setSeason(i){
  seasonLock=(i<=0)?-1:(i-1);
  for (var k=0;k<5;k++) if (mBtn[k]) mBtn[k].className=(k===i)?'on':'';
  retunePad();
}
for (var mi=0; mi<5; mi++) (function(i){
  if (mBtn[i]) mBtn[i].addEventListener('click',function(){ setSeason(i); });
})(mi);

// ═══════════════════════════════════════════════════════════════════════
//  FLOWERS + PETALS ─ fixed pools, no per-frame allocation
// ═══════════════════════════════════════════════════════════════════════
var FMAX=520, PMAX=1900;
var fMx=new Float32Array(FMAX), fMy=new Float32Array(FMAX);
var fLife=new Float32Array(FMAX), fRate=new Float32Array(FMAX);
var fSize=new Float32Array(FMAX), fRot=new Float32Array(FMAX), fSpin=new Float32Array(FMAX);
var fH=new Float32Array(FMAX), fS=new Float32Array(FMAX), fL=new Float32Array(FMAX);
var fOff=new Float32Array(FMAX), fPh=new Float32Array(FMAX);
var fSpec=new Uint8Array(FMAX), fAlive=new Uint8Array(FMAX), fRang=new Uint8Array(FMAX);
var fCount=0;

var pX=new Float32Array(PMAX), pY=new Float32Array(PMAX);
var pVx=new Float32Array(PMAX), pVy=new Float32Array(PMAX);
var pRot=new Float32Array(PMAX), pVr=new Float32Array(PMAX);
var pR=new Float32Array(PMAX), pLife=new Float32Array(PMAX), pFade=new Float32Array(PMAX);
var pH=new Float32Array(PMAX), pS=new Float32Array(PMAX), pL=new Float32Array(PMAX);
var pPh=new Float32Array(PMAX), pAlive=new Uint8Array(PMAX);
var pCount=0, pHead=0;

var fBudget=FMAX, pBudget=PMAX;         // adaptive, driven by measured cost
var quality=1;

function spawnPetal(x,y,vx,vy,r,h,s,l){
  var i=pHead, guard=0;
  while (pAlive[i]&&guard<PMAX){ i=(i+1)%PMAX; guard++; }
  if (guard>=PMAX) return;
  pHead=(i+1)%PMAX;
  if (!pAlive[i]) pCount++;
  pAlive[i]=1;
  pX[i]=x; pY[i]=y; pVx[i]=vx; pVy[i]=vy;
  pR[i]=r; pH[i]=h; pS[i]=s; pL[i]=l;
  pRot[i]=Math.random()*TAU; pVr[i]=(Math.random()-0.5)*5.5;
  pLife[i]=0; pFade[i]=lerp(2.6,5.4,Math.random());
  pPh[i]=Math.random()*TAU;
}
function scatter(i,impX,impY,force){
  if (!fAlive[i]) return;
  var x=mx2s(fMx[i]), y=my2s(fMy[i]);
  var r=fSize[i]*MN;
  var n=3+((Math.random()*4)|0)+(r>MN*0.02?2:0);
  for (var k=0;k<n;k++){
    var a=Math.random()*TAU;
    var sp=(0.25+Math.random()*0.75)*MN*(0.10+force*0.55);
    spawnPetal(x,y,
      Math.cos(a)*sp+impX, Math.sin(a)*sp+impY-MN*0.04,
      r*(0.34+Math.random()*0.26), fH[i], fS[i], fL[i]);
  }
  fAlive[i]=0; fCount--;
}
function seed(mx,my,boost){
  if (fCount>=fBudget) return false;
  var i=-1;
  for (var k=0;k<FMAX;k++){ if (!fAlive[k]){ i=k; break; } }
  if (i<0) return false;
  var r1=Math.random(), r2=Math.random();
  var hs=seasonHue(r1,r2);
  fAlive[i]=1; fCount++;
  fMx[i]=mx; fMy[i]=my;
  fLife[i]=0;
  fRate[i]=lerp(0.16,0.40,Math.random())*(1+boost*0.9);
  fSize[i]=lerp(0.011,0.034,Math.pow(Math.random(),1.6));
  fRot[i]=Math.random()*TAU;
  fSpin[i]=(Math.random()-0.5)*0.22;
  fH[i]=hs[0]; fS[i]=hs[1]; fL[i]=hs[2];
  fSpec[i]=seasonSpec(Math.random());
  fOff[i]=0; fPh[i]=Math.random()*TAU; fRang[i]=0;
  return true;
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ the garden is the score
//
//  ・a four-voice pad whose chord is the season, voice-led so the change
//    of season is heard as a slow modulation and never as a cut
//  ・ONE BELL PER FLOWER, rung at the instant it opens: pitch from where
//    on the screen it is, so a body filling with flowers fills with an
//    ascending sparkle. Rate-limited, because a garden is not a machine
//  ・a filtered-noise sigh when a flower lets go
//  ・散華: the pad swells, a low boom, and a shower of bells
// ═══════════════════════════════════════════════════════════════════════
var ac=null, comp=null, master=null, dryG=null, wetG=null, conv=null;
var padOsc=[], padGain=[], padLP=null, padBus=null, bellBus=null, noiseBuf=null;
var audioOK=false, sndOn=true;
var BASE=110, bellBudget=0, bellT=0;

function makeIR(){
  var sr=ac.sampleRate, len=Math.floor(sr*3.2);
  var buf=ac.createBuffer(2,len,sr);
  for (var c=0;c<2;c++){
    var d=buf.getChannelData(c);
    for (var i=0;i<len;i++){
      var x=i/len;
      d[i]=(Math.random()*2-1)*Math.pow(1-x,2.2)*(1-Math.exp(-i/(sr*0.01)))*0.55;
    }
  }
  return buf;
}
function makeNoise(){
  var sr=ac.sampleRate, len=Math.floor(sr*1.0);
  var buf=ac.createBuffer(1,len,sr);
  var d=buf.getChannelData(0);
  for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function initAudio(){
  if (audioOK) return true;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return false;
  try{
    ac=new AC();
    comp=ac.createDynamicsCompressor();
    comp.threshold.value=-17; comp.knee.value=11; comp.ratio.value=4.4;
    comp.attack.value=0.004; comp.release.value=0.26;
    master=ac.createGain(); master.gain.value=0.0;
    comp.connect(master); master.connect(ac.destination);

    conv=ac.createConvolver(); conv.buffer=makeIR();
    wetG=ac.createGain(); wetG.gain.value=0.5;
    dryG=ac.createGain(); dryG.gain.value=0.82;
    conv.connect(wetG); wetG.connect(comp); dryG.connect(comp);

    noiseBuf=makeNoise();

    padLP=ac.createBiquadFilter(); padLP.type='lowpass';
    padLP.frequency.value=700; padLP.Q.value=0.8;
    padBus=ac.createGain(); padBus.gain.value=0.19;
    padLP.connect(padBus); padBus.connect(dryG); padBus.connect(conv);
    for (var v=0;v<4;v++){
      var o=ac.createOscillator();
      o.type=(v%2===0)?'triangle':'sine';
      o.frequency.value=BASE*Math.pow(2,v/4);
      o.detune.value=(v-1.5)*6;
      var g=ac.createGain(); g.gain.value=0.25;
      o.connect(g); g.connect(padLP);
      try{ o.start(); }catch(e){}
      padOsc.push(o); padGain.push(g);
    }
    bellBus=ac.createGain(); bellBus.gain.value=0.5;
    bellBus.connect(dryG); bellBus.connect(conv);

    audioOK=true;
    retunePad();
    setSound(sndOn);
    return true;
  }catch(e){ ac=null; audioOK=false; return false; }
}
function setSound(on){
  sndOn=!!on;
  if (sndBtn){ sndBtn.className=sndOn?'on':''; sndBtn.textContent=sndOn?'音 ON':'音 OFF'; }
  if (!audioOK||!master) return;
  try{ master.gain.setTargetAtTime(sndOn?0.9:0,ac.currentTime,0.25); }catch(e){}
}
if (sndBtn) sndBtn.addEventListener('click',function(){ setSound(!sndOn); });

function scaleNow(){
  var m=seasonMix();
  return (m.t<0.5)?SEASONS[m.a].pitch:SEASONS[m.b].pitch;
}
function retunePad(){
  if (!audioOK) return;
  var sc=scaleNow(), t=ac.currentTime;
  var deg=[0,2,3,4];
  for (var v=0;v<4;v++){
    var st=sc[deg[v]%sc.length]+12*Math.floor(deg[v]/sc.length);
    var f=BASE*Math.pow(2,(st-12+(v>=2?12:0))/12);
    if (!fin(f)) f=BASE;
    try{ padOsc[v].frequency.setTargetAtTime(clamp(f,30,2000),t,1.3); }catch(e){}
  }
}
function padFrame(){
  if (!audioOK||!ac) return;
  var t=ac.currentTime;
  var d=clamp(fCount/Math.max(1,fBudget*0.6),0,1);
  var f=clamp(320+d*2300,120,9000);
  try{ padLP.frequency.setTargetAtTime(f,t,0.5); }catch(e){}
  var g=clamp(0.12+d*0.13+sange*0.22,0,0.42);
  try{ padBus.gain.setTargetAtTime(g,t,0.35); }catch(e){}
}
function bell(yFrac,vel){
  if (!audioOK||!sndOn||!ac) return;
  var t=ac.currentTime;
  var sc=scaleNow();
  // high on the screen = high in the scale, so a body filling from the
  // feet upward is audibly an ascending figure
  var step=Math.round(clamp(1-yFrac,0,1)*(sc.length*3-1));
  var oct=Math.floor(step/sc.length);
  var st=sc[step%sc.length]+12*oct;
  var f=BASE*4*Math.pow(2,st/12);
  if (!fin(f)) return;
  f=clamp(f,120,5000);
  try{
    var car=ac.createOscillator(); car.type='sine'; car.frequency.value=f;
    var mod=ac.createOscillator(); mod.type='sine'; mod.frequency.value=f*2.76;
    var mg=ac.createGain(); mg.gain.value=f*1.7;
    mod.connect(mg); mg.connect(car.frequency);
    var g=ac.createGain();
    var a=clamp(0.05+vel*0.10,0.01,0.2);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(a,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.5+Math.random()*0.8);
    mg.gain.setValueAtTime(f*1.7,t);
    mg.gain.exponentialRampToValueAtTime(f*0.05,t+0.5);
    car.connect(g); g.connect(bellBus);
    car.start(t); car.stop(t+2.6);
    mod.start(t); mod.stop(t+2.6);
  }catch(e){}
}
function sigh(amt){
  if (!audioOK||!sndOn||!ac||!noiseBuf) return;
  var t=ac.currentTime, a=clamp(amt,0.05,1);
  try{
    var s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    var bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime(2600,t);
    bp.frequency.exponentialRampToValueAtTime(520,t+0.6);
    bp.Q.value=0.9;
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.10*a,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.75);
    s.connect(bp); bp.connect(g); g.connect(dryG); g.connect(conv);
    s.start(t); s.stop(t+0.85);
  }catch(e){}
}
function sangeSound(){
  if (!audioOK||!sndOn||!ac) return;
  var t=ac.currentTime;
  try{
    var o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(140,t);
    o.frequency.exponentialRampToValueAtTime(38,t+1.1);
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.42,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
    o.connect(g); g.connect(dryG);
    o.start(t); o.stop(t+1.6);
  }catch(e){}
  sigh(1);
  for (var k=0;k<9;k++) bell(Math.random(),0.8);
}

// ═══════════════════════════════════════════════════════════════════════
//  PLAY
// ═══════════════════════════════════════════════════════════════════════
var started=false, last=0, costS=16;
var sighAccum=0, sighTimer=0;
var sange=0, sangeT=-9, sangeRing=9, sangeCount=0;
var hotR=1, driftFade=0;
var motes=[];
for (var k0=0;k0<130;k0++) motes.push({x:Math.random(),y:Math.random(),r:Math.random(),s:Math.random(),p:Math.random()*TAU});

function density(){ return densEl?clamp((+densEl.value||0)/100,0.1,1):0.72; }

function tryGesture(dt,t){
  sangeArm=Math.max(0,sangeArm-dt);
  var up=0;
  if (noseOn){
    for (var k=0;k<2;k++){
      if (wrist[k].on && MH>0 && (wrist[k].y/MH) < noseY-0.03) up++;
    }
  }
  if (up>=2 && bodyLive()) raiseT+=dt; else raiseT=Math.max(0,raiseT-dt*2.2);
  if (raiseT>0.35 && sangeArm<=0){
    raiseT=0; sangeArm=2.6; sange=1; sangeT=t; sangeRing=0; sangeCount++;
    var cx=mx2s(cenX), cy=my2s(cenY);
    for (var i=0;i<FMAX;i++){
      if (!fAlive[i]) continue;
      var dx=mx2s(fMx[i])-cx, dy=my2s(fMy[i])-cy;
      var d=Math.hypot(dx,dy)||1;
      scatter(i,dx/d*MN*0.55,dy/d*MN*0.55-MN*0.2,1.35);
    }
    sangeSound();
  }
}

function step(dt,t){
  // ── season ─────────────────────────────────────────────────────────
  seasonPhase+=dt/YEAR*4;
  seasonWobble+=(Math.random()-0.5)*dt*0.012;
  seasonWobble=clamp(seasonWobble,-0.25,0.25);
  if (seasonPhase>1e6) seasonPhase=0;

  var live=maskLive()&&onN>0;
  calm=chase(calm,live?clamp(1-diffFrac/0.055,0,1):0,3.4,dt);
  // the white flash is fast; the shockwave it leaves behind is not
  sange=Math.max(0,sange-dt*3.6);
  sangeRing+=dt;
  hotR=MN*0.17;

  tryGesture(dt,t);

  // ── seeding ────────────────────────────────────────────────────────
  var dens=density();
  fBudget=Math.round(lerp(80,FMAX,dens)*quality);
  pBudget=Math.round(lerp(420,PMAX,dens)*quality);
  if (live){
    // stillness is the input: a calm body fills quickly, a moving one barely
    var rate=lerp(3,86,Math.pow(calm,1.35))*dens*quality;
    var n=Math.min(34,Math.floor(rate*dt+Math.random()));
    if (occ) occ.fill(0);
    var i,gi,gx,gy;
    for (i=0;i<FMAX;i++){
      if (!fAlive[i]||!occ) continue;
      gx=(fMx[i]/4)|0; gy=(fMy[i]/4)|0;
      if (gx>=0&&gy>=0&&gx<OCW&&gy<OCH) occ[gy*OCW+gx]++;
    }
    for (var s=0;s<n;s++){
      if (fCount>=fBudget) break;
      var tries=0, ok=false, mxp=0, myp=0, boost=0;
      while (tries<14&&!ok){
        tries++;
        gi=onList[(Math.random()*onN)|0];
        gx=gi%MW; gy=(gi-gx)/MW;
        mxp=gx+Math.random(); myp=gy+Math.random();
        var ox=(mxp/4)|0, oy=(myp/4)|0;
        if (ox<0||oy<0||ox>=OCW||oy>=OCH) continue;
        if (occ[oy*OCW+ox]>=4) continue;
        ok=true;
        occ[oy*OCW+ox]++;
      }
      if (!ok) continue;
      // the hands hurry the flowers under them
      var px=mx2s(mxp), py=my2s(myp);
      for (var w=0;w<2;w++){
        if (!wrist[w].on) continue;
        var d=Math.hypot(px-wrist[w].sx,py-wrist[w].sy);
        if (d<hotR) boost=Math.max(boost,1-d/hotR);
      }
      seed(mxp,myp,boost);
    }
  } else if (fCount<fBudget*0.10 && Math.random()<dt*7){
    // never an empty screen: a few wild flowers open in the dark and fall
    seed(Math.random()*MW,MH*(0.15+Math.random()*0.7),0);
  }

  // ── flowers ────────────────────────────────────────────────────────
  var opened=0;
  bellBudget=Math.min(4,bellBudget+dt*9);
  for (var i2=0;i2<FMAX;i2++){
    if (!fAlive[i2]) continue;
    var boost2=0;
    var fx=mx2s(fMx[i2]), fy=my2s(fMy[i2]);
    for (var w2=0;w2<2;w2++){
      if (!wrist[w2].on) continue;
      var dd=Math.hypot(fx-wrist[w2].sx,fy-wrist[w2].sy);
      if (dd<hotR) boost2=Math.max(boost2,1-dd/hotR);
    }
    fLife[i2]+=fRate[i2]*dt*(0.55+calm*0.75+boost2*1.5);
    fRot[i2]+=fSpin[i2]*dt;
    if (!fRang[i2]&&fLife[i2]>=0.40){
      fRang[i2]=1;
      if (bellBudget>=1&&Math.random()<0.5){ bellBudget-=1; bell(fy/Math.max(1,H),fSize[i2]/0.034); opened++; }
    }
    if (fLife[i2]>=1){ scatter(i2,0,0,0.22); continue; }
    if (live){
      if (maskAt(fMx[i2],fMy[i2])>100) fOff[i2]=0;
      else {
        fOff[i2]+=dt;
        // a flower whose ground has walked away has nothing left to hold
        if (fOff[i2]>0.14){ scatter(i2,0,0,0.30); sighAccum+=1; continue; }
      }
    } else {
      fOff[i2]+=dt;
      if (fOff[i2]>2.2){ scatter(i2,0,0,0.2); continue; }
    }
  }
  if (sighAccum>0){
    sighTimer-=dt;
    if (sighTimer<=0){ sigh(clamp(sighAccum/26,0.06,1)); sighTimer=0.22; sighAccum=0; }
  } else sighTimer=0;

  // ── petals ─────────────────────────────────────────────────────────
  var floorY=H*0.94;
  for (var j=0;j<PMAX;j++){
    if (!pAlive[j]) continue;
    pLife[j]+=dt;
    pPh[j]+=dt*(2.2+pR[j]*0.05);
    // flutter: a per-petal lateral sway, so no two petals fall alike
    pVx[j]+=Math.sin(pPh[j])*MN*0.42*dt;
    pVy[j]+=MN*0.30*dt;
    pVx[j]*=Math.pow(0.24,dt); pVy[j]*=Math.pow(0.42,dt);
    pX[j]+=pVx[j]*dt; pY[j]+=pVy[j]*dt;
    pRot[j]+=pVr[j]*dt;
    var dead=(pLife[j]>pFade[j]);
    if (pY[j]>floorY&&!dead){ dead=true; }
    if (dead){
      // what has finished falling is stamped into the drift and remembered
      if (dctx&&pY[j]>H*0.45&&Math.random()<0.75){
        var hx=pX[j]*0.5, hy=Math.min(drift.height-1,pY[j]*0.5);
        dctx.globalAlpha=0.30;
        dctx.fillStyle='hsl('+pH[j].toFixed(0)+','+pS[j].toFixed(0)+'%,'+pL[j].toFixed(0)+'%)';
        dctx.beginPath(); dctx.arc(hx,hy,Math.max(0.8,pR[j]*0.34),0,TAU); dctx.fill();
        dctx.globalAlpha=1;
      }
      pAlive[j]=0; pCount--;
      continue;
    }
    if (pCount>pBudget&&pLife[j]>pFade[j]*0.55&&Math.random()<dt*3){ pAlive[j]=0; pCount--; }
  }

  // the drift erases itself, so the floor is a fading record, not a stain
  if (dctx){
    driftFade+=dt;
    if (driftFade>0.06){
      dctx.globalCompositeOperation='destination-out';
      dctx.fillStyle='rgba(0,0,0,'+clamp(driftFade*0.055,0,0.2).toFixed(4)+')';
      dctx.fillRect(0,0,drift.width,drift.height);
      dctx.globalCompositeOperation='source-over';
      driftFade=0;
    }
  }

  padFrame();
  updateHud();
}

var hudAcc=0;
function updateHud(){
  hudAcc++;
  if (hudAcc<10) return;
  hudAcc=0;
  if (rF) rF.textContent=String(fCount);
  if (rP) rP.textContent=String(pCount);
  if (rC) rC.textContent=(maskLive()&&onN>0)?(Math.round(calm*100)+'%'):'—';
  var m=seasonMix();
  var A=SEASONS[m.a], B=SEASONS[m.b];
  if (seasonK) seasonK.textContent=(m.t<0.5)?A.k:B.k;
  if (seasonJ) seasonJ.textContent=(m.t<0.5)?A.j:B.j;
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAWING
// ═══════════════════════════════════════════════════════════════════════
// species: [petals, widthRatio, innerRing, tipRound]
var SPEC=[
  [5,0.42,1,0.0],   // 0 桜 — five petals, notched, a pale inner ring
  [5,0.30,0,0.0],   // 1 梅 — narrow five
  [8,0.34,1,0.0],   // 2 朝顔ふう — eight
  [14,0.17,1,0.0],  // 3 コスモス／菊 — many thin rays
  [6,0.50,1,0.0],   // 4 椿 — broad six
  [4,0.55,0,0.0]    // 5 四弁 — wide four
];
function petalPath(g,cx,cy,a,len,wid){
  var dx=Math.cos(a), dy=Math.sin(a);
  var px=-dy*wid, py=dx*wid;
  g.moveTo(cx,cy);
  g.quadraticCurveTo(cx+dx*len*0.52+px, cy+dy*len*0.52+py, cx+dx*len, cy+dy*len);
  g.quadraticCurveTo(cx+dx*len*0.52-px, cy+dy*len*0.52-py, cx,cy);
}
function drawFlower(g,x,y,r,rot,open,h,s,l,alpha,lod,spec){
  if (!(r>0.4)||alpha<=0.01) return;
  var sp=SPEC[spec|0]||SPEC[0];
  var n=sp[0], wr=sp[1], inner=sp[2];
  var len=r*(0.3+0.7*open);
  var wid=len*wr;
  var i,a;
  g.globalAlpha=alpha;
  g.beginPath();
  for (i=0;i<n;i++){
    a=rot+i*TAU/n;
    petalPath(g,x,y,a,len,wid);
  }
  g.fillStyle='hsl('+h.toFixed(0)+','+s.toFixed(0)+'%,'+l.toFixed(0)+'%)';
  g.fill();
  if (lod>0){
    g.beginPath();
    for (i=0;i<n;i++){
      a=rot+i*TAU/n;
      petalPath(g,x,y,a,len*0.58,wid*0.72);
    }
    g.fillStyle='hsl('+h.toFixed(0)+','+clamp(s*0.62,0,100).toFixed(0)+'%,'+clamp(l+13,0,100).toFixed(0)+'%)';
    g.fill();
    if (inner){
      g.beginPath(); g.arc(x,y,Math.max(0.6,len*0.17),0,TAU);
      g.fillStyle='hsl('+((h+42)%360).toFixed(0)+',92%,'+clamp(l+22,0,100).toFixed(0)+'%)';
      g.fill();
    }
  }
  g.globalAlpha=1;
}
function drawPetalShape(g,x,y,r,rot,h,s,l,alpha){
  if (!(r>0.3)||alpha<=0.01) return;
  g.globalAlpha=alpha;
  g.beginPath();
  var dx=Math.cos(rot), dy=Math.sin(rot);
  var px=-dy*r*0.46, py=dx*r*0.46;
  g.moveTo(x-dx*r,y-dy*r);
  g.quadraticCurveTo(x+px,y+py,x+dx*r,y+dy*r);
  g.quadraticCurveTo(x-px,y-py,x-dx*r,y-dy*r);
  g.fillStyle='hsl('+h.toFixed(0)+','+s.toFixed(0)+'%,'+l.toFixed(0)+'%)';
  g.fill();
  g.globalAlpha=1;
}

function drawNight(t){
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0714');
  bg.addColorStop(0.62,'#06050d');
  bg.addColorStop(1,'#040309');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // motes — the dark is never still
  for (var i=0;i<motes.length;i++){
    var m=motes[i];
    var y=(m.y+t*(0.006+m.s*0.016))%1;
    var x=(m.x+Math.sin(t*0.16+m.p)*0.012+1)%1;
    var a=0.05+0.12*(0.5+0.5*Math.sin(t*0.7+m.p));
    ctx.beginPath();
    ctx.arc(x*W,y*H,(0.4+m.r*1.7),0,TAU);
    ctx.fillStyle='rgba(206,196,236,'+a.toFixed(3)+')';
    ctx.fill();
  }
}
// The body is not the camera image and not a flat silhouette: it is the
// camera's own luminance graded all the way down into 藍鉄, written at mask
// resolution so the flowers always sit on top of a dark form. One 120×90
// readback a frame; nothing here touches the full-resolution frame.
var camCv=null,camCtx=null,bodyCv=null,bodyCtx=null,bodyImg=null;
function allocBody(){
  camCv=mkCanvas(MW,MH); camCtx=camCv.getContext('2d');
  bodyCv=mkCanvas(MW,MH); bodyCtx=bodyCv.getContext('2d');
  bodyImg=bodyCtx?bodyCtx.createImageData(MW,MH):null;
}
function buildBody(){
  if (!bodyCtx||!bodyImg||!MASK) return false;
  var cam=null;
  if (camCtx&&video&&video.videoWidth>0){
    try{
      camCtx.drawImage(video,0,0,MW,MH);
      cam=camCtx.getImageData(0,0,MW,MH).data;
    }catch(e){ cam=null; }
  }
  var d=bodyImg.data;
  if (!d||d.length<MN2*4) return false;
  var i,o,v,lum;
  for (i=0;i<MN2;i++){
    o=i<<2;
    v=MASK[i];
    if (v<40){ d[o]=0; d[o+1]=0; d[o+2]=0; d[o+3]=0; continue; }
    lum=cam?((cam[o]*77+cam[o+1]*150+cam[o+2]*29)>>8):128;
    // 藍鉄 #141a2e, lifted a little by your own light
    var k=0.55+lum/255*0.95;
    d[o]=(20*k)|0; d[o+1]=(26*k)|0; d[o+2]=(46*k+lum*0.16)|0;
    d[o+3]=v;
  }
  bodyCtx.putImageData(bodyImg,0,0);
  return true;
}

function draw(t){
  drawNight(t);

  // the body as a dark indigo form — never as a photograph
  if (maskLive()&&onN>0&&buildBody()){
    var dw=covS, dh=covS/camAspect;
    ctx.save();
    ctx.globalAlpha=0.95;
    if (mirror){ ctx.translate(covOX+dw,covOY); ctx.scale(-1,1); }
    else ctx.translate(covOX,covOY);
    try{ ctx.drawImage(bodyCv,0,0,dw,dh); }catch(e){}
    ctx.restore();
  }

  // the accumulated drift of everything that has already fallen
  if (drift){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.62;
    try{ ctx.drawImage(drift,0,0,W,H); }catch(e){}
    ctx.restore();
  }

  // ── flowers + petals go to their own layer so the glow is one pass ──
  if (!lctx) return;
  lctx.setTransform(1,0,0,1,0,0);
  lctx.clearRect(0,0,layer.width,layer.height);
  lctx.setTransform(DPR,0,0,DPR,0,0);

  var i;
  for (i=0;i<PMAX;i++){
    if (!pAlive[i]) continue;
    var pa=1-clamp((pLife[i]-pFade[i]*0.6)/(pFade[i]*0.4),0,1);
    drawPetalShape(lctx,pX[i],pY[i],pR[i],pRot[i],pH[i],pS[i],pL[i],pa*0.9);
  }
  var nowT=t;
  for (i=0;i<FMAX;i++){
    if (!fAlive[i]) continue;
    var li=fLife[i];
    var open, alpha=1, lig=fL[i], sat=fS[i];
    if (li<0.10) open=0;
    else if (li<0.42) open=smooth01((li-0.10)/0.32);
    else if (li<0.74) open=1+0.055*Math.sin(nowT*1.6+fPh[i]);
    else { open=1-(li-0.74)/0.26*0.22; alpha=1-smooth01((li-0.80)/0.20)*0.85; sat=fS[i]*(1-(li-0.74)*1.1); }
    var r=fSize[i]*MN*(li<0.10?smooth01(li/0.10)*0.55:1);
    drawFlower(lctx,mx2s(fMx[i]),my2s(fMy[i]),r,fRot[i],clamp(open,0,1.1),
               fH[i],clamp(sat,0,100),lig,clamp(alpha,0,1),
               r>MN*0.014?1:0, fSpec[i]);
  }

  // ── bloom ──────────────────────────────────────────────────────────
  ctx.drawImage(layer,0,0,W,H);
  if (gctx&&glow.width>2){
    gctx.setTransform(1,0,0,1,0,0);
    gctx.clearRect(0,0,glow.width,glow.height);
    gctx.drawImage(layer,0,0,glow.width,glow.height);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.72;
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(glow,0,0,W,H);
    ctx.globalAlpha=0.4;
    ctx.drawImage(glow,-W*0.01,-H*0.01,W*1.02,H*1.02);
    ctx.restore();
  }

  // ── hands ──────────────────────────────────────────────────────────
  for (i=0;i<2;i++){
    if (!wrist[i].on||!(hotR>1)) continue;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    var g2=ctx.createRadialGradient(wrist[i].sx,wrist[i].sy,1,wrist[i].sx,wrist[i].sy,hotR);
    g2.addColorStop(0,'rgba(245,215,138,.20)');
    g2.addColorStop(1,'rgba(245,215,138,0)');
    ctx.fillStyle=g2;
    ctx.beginPath(); ctx.arc(wrist[i].sx,wrist[i].sy,hotR,0,TAU); ctx.fill();
    ctx.restore();
  }

  // ── 散華 ───────────────────────────────────────────────────────────
  if (sange>0.01||sangeRing<1.25){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    if (sange>0.01){
      ctx.fillStyle='rgba(245,215,138,'+(sange*sange*0.42).toFixed(3)+')';
      ctx.fillRect(0,0,W,H);
    }
    if (sangeRing<1.25){
      var rp=sangeRing/1.25;
      var rr=Math.pow(rp,0.62)*MN*1.5;
      var ra=(1-rp)*(1-rp)*0.75;
      ctx.beginPath();
      ctx.arc(mx2s(cenX),my2s(cenY),Math.max(1,rr),0,TAU);
      ctx.strokeStyle='rgba(245,215,138,'+ra.toFixed(3)+')';
      ctx.lineWidth=Math.max(1,MN*0.02*(1-rp));
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mx2s(cenX),my2s(cenY),Math.max(1,rr*0.82),0,TAU);
      ctx.strokeStyle='rgba(255,246,222,'+(ra*0.5).toFixed(3)+')';
      ctx.lineWidth=Math.max(1,MN*0.006*(1-rp));
      ctx.stroke();
    }
    ctx.restore();
  }

  drawHint(t);
}

function drawHint(t){
  if (maskLive()&&onN>0) return;
  var a=0.30+0.2*Math.sin(t*1.7);
  ctx.fillStyle='rgba(232,226,240,'+a.toFixed(3)+')';
  ctx.font='200 '+Math.round(clamp(MN*0.036,13,20))+'px Murecho, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('全身がカメラに入るところまで下がってください', W/2, H*0.5);
  ctx.font='200 '+Math.round(clamp(MN*0.026,11,15))+'px Murecho, sans-serif';
  ctx.fillStyle='rgba(232,226,240,'+(a*0.6).toFixed(3)+')';
  ctx.fillText('止まっているほど、速く咲きます', W/2, H*0.5+MN*0.06);
}

function frame(){
  var t=now();
  var dt=clamp(t-last,0,0.1);
  last=t;
  var t0=now();
  if (started) step(dt,t);
  draw(t);
  if (started){
    var cost=(now()-t0)*1000;
    costS=costS+(cost-costS)*0.07;
    if (costS>30&&quality>0.34) quality=Math.max(0.34,quality-0.05);
    else if (costS<15&&quality<1) quality=Math.min(1,quality+0.02);
  }
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM ─ stillness fills, motion scatters, arms burst
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoT=0;
function demoFrame(){
  if (!demoCtx) return;
  var g=demoCtx, DW=demoCv.width, DH=demoCv.height;
  demoT+=1/60;
  var cyc=demoT%6;
  g.fillStyle='#07050e'; g.fillRect(0,0,DW,DH);
  var bx=DW*0.5, by=DH*0.62, bs=DH*0.34;
  var raised=(cyc>4.3&&cyc<5.0);
  // a little body
  g.save();
  g.translate(bx,by);
  g.strokeStyle='rgba(120,130,180,.55)'; g.lineWidth=bs*0.26; g.lineCap='round';
  g.beginPath(); g.moveTo(0,-bs*0.55); g.lineTo(0,bs*0.45); g.stroke();
  g.beginPath();
  if (raised){ g.moveTo(-bs*0.62,-bs*1.05); g.lineTo(0,-bs*0.3); g.lineTo(bs*0.62,-bs*1.05); }
  else { g.moveTo(-bs*0.75,-bs*0.05); g.lineTo(0,-bs*0.35); g.lineTo(bs*0.75,-bs*0.05); }
  g.lineWidth=bs*0.17; g.stroke();
  g.beginPath(); g.arc(0,-bs*0.85,bs*0.24,0,TAU);
  g.fillStyle='rgba(120,130,180,.55)'; g.fill();
  g.restore();
  // flowers filling while "still"
  var fill=(cyc<3.4)?clamp(cyc/3.0,0,1):(raised?0:clamp(1-(cyc-3.4)/0.8,0,1));
  var nf=Math.round(fill*26);
  for (var i=0;i<nf;i++){
    var a0=i*2.399, rr=Math.sqrt(i/26);
    var fx=bx+Math.cos(a0)*rr*bs*0.72, fy=by-bs*0.3+Math.sin(a0)*rr*bs*0.9;
    var h=(i*37+demoT*26)%360;
    drawFlower(g,fx,fy,bs*0.13*(0.5+0.5*Math.sin(demoT*2+i)),i*0.7,1,h,72,74,1,1,i%6);
  }
  var label;
  if (cyc<3.4) label='止まっているあいだ、咲きつづける';
  else if (cyc<4.3) label='動けば、居なくなった場所の花が散る';
  else label='両腕を上げれば ── 散華';
  if (cyc>3.4){
    for (var p=0;p<40;p++){
      var pt=(cyc<4.3)?(cyc-3.4):(cyc-4.3);
      var ang=p*0.9;
      var sp=(raised?200:70)*pt;
      drawPetalShape(g,bx+Math.cos(ang)*sp*(0.4+((p*7)%10)/10),
                       by-bs*0.3+Math.sin(ang)*sp*0.5+pt*pt*130,
                       bs*0.07,ang+pt*4,(p*29)%360,74,72,clamp(1-pt,0,1));
    }
  }
  if (raised){
    g.save(); g.globalCompositeOperation='lighter';
    g.fillStyle='rgba(245,215,138,'+(0.3*clamp(1-(cyc-4.3)/0.7,0,1)).toFixed(3)+')';
    g.fillRect(0,0,DW,DH); g.restore();
  }
  g.fillStyle='rgba(232,226,240,.72)';
  g.font='400 15px Murecho, sans-serif'; g.textAlign='center';
  g.fillText(label,DW/2,DH-16);
  if (demoRun && typeof requestAnimationFrame==='function') requestAnimationFrame(demoFrame);
}
if (demoCtx) demoFrame();

// ═══════════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════════
startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  initPose();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
updateCover();
allocMask();
setSeason(0);
last=now();
frame();
</script>
