<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人が、横に走る何十本もの線でできた立体になる。回すと体の裏の線は隠れ、動いたところの線が波形のように震える。AUTO にすると動くほど色と線の太さと本数が自動で変わる。">
<meta name="theme-color" content="#050505">
<title>KEISEN ─ 線でできた立体の体</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  KEISEN 罫線 ─ 線でできた立体の体                     ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       『Unknown Pleasures』のジャケットと、3D ボディスキャナの輪切り。
             画面を横切る罫線が、あなたのところだけ手前へ盛り上がる。
             ゆっくり首を振るカメラで見ると線は体に巻きつき、体の向こう側に
             回った線は体に隠れて見えない ── 本物の陰線消去。
             動いたところの線は、そこだけ音の波形のように震える。
  PALETTE    固定しない。AUTO が四つの型から毎回つくる。
             夜  暗い地に白い線、差し色一色　　　双  暗い地に補色の二色
             紙  生成りの紙に墨の線と朱　　　　　光  真っ黒に原色の蛍光
             どの型も 背景・線の二色・震えの差し色 の四色まで。
  TYPE       Space Grotesk 300/500 と Zen Kaku Gothic New。数字は等幅。
  MOTION     カメラは 22 秒周期でゆっくり首を振る。ドラッグで回せる。
             AUTO：動いた量を溜めて閾値で次の見た目へ 1 秒かけて移る。
             急に大きく動くと 0.2 秒で切り替わり、線が上から引き直される。
             止まっていても 14 秒に一度はゆっくり変わる。
  SIGNATURE  体の輪郭のところで線が手前へ折れ、その向こうの線が隠れること。
  TECH       WebGL2。線は頂点シェーダで画面空間に押し出したリボンなので、
             太さは奥行きに関係なく指定どおりのピクセル幅。先に同じ高さ場の
             面を深度だけ描いてから線を深度テストするので、体の裏の線が消える。
             高さ場は人物マスク（MediaPipe）をぼかした膨らみ＋明るさ。
             マスクが読めないときは明るさだけで浮き彫りにする。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

<body>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ KEISEN</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="auto" class="btn on">AUTO</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="kinds">
    <button data-k="0">夜</button>
    <button data-k="1">双</button>
    <button data-k="2">紙</button>
    <button data-k="3">光</button>
  </div>
  <label><span>太さ</span><input type="range" id="sThick" min="0" max="1" step="0.01" value="0.35"></label>
  <label><span>本数</span><input type="range" id="sRows" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>奥行き</span><input type="range" id="sDepth" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>震え</span><input type="range" id="sWob" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>首振り</span><input type="range" id="sOrbit" min="0" max="1" step="0.01" value="0.55"></label>
  <div class="note">AUTO：動くほど色・太さ・本数・奥行きが自動で変わる。大きく動くと一気に切り替わる。<br>色や数値に触ると AUTO は止まる。<br>ドラッグで回す／タップで見た目をひとつ引き直す。</div>
</div>

<div id="start">
  <div class="t">RULED-LINE BODY SCAN</div>
  <h1>KEISEN</h1>
  <div class="rule"></div>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、あなたが横に走る線でできた立体になります。<br>AUTO のあいだは、動くほど色と線が変わっていきます。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   KEISEN — a height field (blurred person mask + brightness) drawn as
   ruled lines. Each line is a ribbon pushed out in screen space in the
   vertex shader, so its width is exact in pixels at any depth. The same
   height field is first drawn as a depth-only surface; lines that fall
   behind it fail the depth test, which is what makes this read as a
   solid rather than a stack of transparent wires.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });
const SAMPLES = 220;                 // points along one line

/* ---------- looks: generated, and eased between ---------- */
function hsl(h, s, l){
  h = ((h % 360) + 360) % 360 / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
const KINDS = ['夜', '双', '紙', '光'];
function makeLook(kind){
  if (kind == null) kind = Math.random() * 4 | 0;
  const h = Math.random() * 360, L = { kind, hue:h | 0 };
  if (kind === 0){ L.bg = hsl(h, .35, .035); L.a = hsl(h, .10, .80); L.b = hsl(h, .20, .98); L.acc = hsl(h, .95, .60); }
  else if (kind === 1){ const h2 = h + 150 + Math.random() * 60;
    L.bg = hsl(h, .45, .04); L.a = hsl(h, .85, .56); L.b = hsl(h2, .85, .68); L.acc = hsl(h2 + 40, .25, .96); }
  else if (kind === 2){ L.bg = hsl(h, .20, .90); L.a = hsl(h, .30, .12); L.b = hsl(h + 20, .75, .40); L.acc = hsl(h + 180, .85, .48); }
  else { L.bg = [0, 0, 0]; L.a = hsl(h, 1, .52); L.b = hsl(h + 50, 1, .62); L.acc = hsl(h + 180, 1, .64); }
  // thickness is drawn log-uniform: hairlines and fat marker lines should both come up
  L.thick = Math.exp(Math.log(.12) + Math.random() * (Math.log(1) - Math.log(.12)));
  L.rows = .08 + Math.random() * .84; L.depth = .25 + Math.random() * .75; L.wob = .25 + Math.random() * .75;
  L.light = kind === 2 ? 1 : 0;
  return L;
}
const LOOK = makeLook(0), TGT = Object.assign({}, LOOK);
LOOK.thick = TGT.thick = .35; LOOK.rows = TGT.rows = .5; LOOK.depth = TGT.depth = .5; LOOK.wob = TGT.wob = .5;
const S = { auto:true, orbit:.55 };
const AUTO = { acc:0, lastJump:0, lastSoft:0, rate:1.2, Eslow:0, E:0, Eprev:0, changes:0, jumps:0 };
function lerp3(a, b, k){ for (let i = 0; i < 3; i++) a[i] += (b[i] - a[i]) * k; }
function setTarget(L, fast){
  Object.assign(TGT, L);
  AUTO.rate = fast ? 5.5 : 1.1;
  AUTO.changes++;
  if (fast){ AUTO.jumps++; redraw = 0; }            // the lines are drawn again from the top
  syncUI();
}
function easeLook(dt){
  const k = 1 - Math.exp(-dt * AUTO.rate);
  lerp3(LOOK.bg, TGT.bg, k); lerp3(LOOK.a, TGT.a, k); lerp3(LOOK.b, TGT.b, k); lerp3(LOOK.acc, TGT.acc, k);
  for (const n of ['thick','depth','wob','light']) LOOK[n] += (TGT[n] - LOOK[n]) * k;
  LOOK.rows = TGT.rows; LOOK.kind = TGT.kind; LOOK.hue = TGT.hue;
}
function driveAuto(dt, now){
  if (!S.auto || !MODE.on || MODE.reveal < 1) return;
  const E = F.E, jump = E - AUTO.Eprev; AUTO.Eprev = AUTO.Eprev * .8 + E * .2;
  // 'sudden' is judged against your own recent level, near the camera or far from it
  const base = AUTO.Eslow; AUTO.Eslow += (E - AUTO.Eslow) * Math.min(1, dt * .6);
  // big sudden movement: cut to a new look at once
  if (E > .12 && E > base * 2.8 + .05 && jump > .07 && now - AUTO.lastJump > 1400){ AUTO.lastJump = now; AUTO.acc = 0; setTarget(makeLook(), true); return; }
  // otherwise movement is saved up and spent on a gentle change
  // square root: small movements still add up; big ones do not run away
  AUTO.acc += Math.sqrt(Math.min(E, .3)) * dt * 2.2;
  if (AUTO.acc > 1){ AUTO.acc = 0; AUTO.lastSoft = now; setTarget(makeLook(), false); return; }
  if (now - AUTO.lastSoft > 14000 && now - AUTO.lastJump > 14000){ AUTO.lastSoft = now; setTarget(makeLook(), false); }
}

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:true, premultipliedAlpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const HEIGHT = `
uniform sampler2D uField;
uniform vec2 uSpan;
uniform float uYaw, uPitch, uDepth, uWob, uT;
vec4 fieldAt(vec2 uv){ return texture(uField, vec2(uv.x, 1. - uv.y)); }
vec3 P(vec2 uv){
  vec4 f = fieldAt(uv);
  // the dome of the body, plus the light on it (inside the body only) so a face gets its features
  float z = (f.g * .40 + smoothstep(.05, .95, f.a) * .15 * f.r) * uDepth;
  // where you moved the line shakes like a trace on a scope
  z += f.b * uWob * .09 * sin(uv.x * 46. - uT * 13. + uv.y * 61.7);
  z *= min(uSpan.x, uSpan.y);
  return vec3((uv - .5) * uSpan, z);
}
vec3 proj(vec3 p){
  float cy = cos(uYaw), sy = sin(uYaw), cp = cos(uPitch), sp = sin(uPitch);
  p = vec3(cy * p.x + sy * p.z, p.y, -sy * p.x + cy * p.z);
  p = vec3(p.x, cp * p.y - sp * p.z, sp * p.y + cp * p.z);
  float D = 2.2, zc = D - p.z;
  return vec3(p.xy * (D / zc) * 2. / uSpan * .9, (zc - D) / 3.);
}`;
const VS_SURF = `#version 300 es
precision highp float;
in vec2 aUV;
${HEIGHT}
void main(){ vec3 c = proj(P(aUV)); gl_Position = vec4(c, 1.); }`;
const FS_NONE = `#version 300 es
precision mediump float; out vec4 o; void main(){ o = vec4(0.); }`;
const VS_LINE = `#version 300 es
precision highp float;
in vec3 aA;                                   // u, row v, side (-1 | +1)
uniform vec2 uRes;
uniform float uThick, uReveal, uRedraw;
${HEIGHT}
out float vD; out float vHalf; out float vZ; out float vHeat; out float vA;
void main(){
  vec2 uv = aA.xy; float side = aA.z;
  float du = 1. / ${SAMPLES}.;
  vec3 c = proj(P(uv));
  vec3 a = proj(P(vec2(max(0., uv.x - du), uv.y)));
  vec3 b = proj(P(vec2(min(1., uv.x + du), uv.y)));
  vec2 hr = uRes * .5;
  vec2 t = (b.xy - a.xy) * hr; float tl = length(t); t = tl > 1e-5 ? t / tl : vec2(1., 0.);
  vec2 n = vec2(-t.y, t.x);
  vec4 f = fieldAt(uv);
  float th = uThick * (1. + f.b * 1.1);
  float hw = th * .5 + .8;                       // half width plus a pixel for the soft edge
  gl_Position = vec4(c.xy + n * side * hw / hr, c.z - .003, 1.);
  vD = side * hw; vHalf = th * .5;
  vZ = f.g * .8 + f.a * .2 * f.r; vHeat = f.b;
  // lines are laid top to bottom when the piece switches on, and again on a cut
  float pr = (1. - uv.y) * .86;
  vA = smoothstep(pr, pr + .04, uReveal) * smoothstep(pr, pr + .04, uRedraw);
  vA *= smoothstep(0., .025, min(uv.x, 1. - uv.x));
}`;
const FS_LINE = `#version 300 es
precision mediump float;
in float vD; in float vHalf; in float vZ; in float vHeat; in float vA;
uniform vec3 uA, uB, uAcc;
out vec4 o;
void main(){
  float cov = clamp(vHalf + .5 - abs(vD), 0., 1.) * vA;
  vec3 c = mix(uA, uB, smoothstep(.05, .7, vZ));
  c = mix(c, uAcc, clamp(vHeat * 1.4, 0., 1.));
  o = vec4(c * cov, cov);
}`;
const VS_Q = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS_BG = `#version 300 es
precision mediump float;
uniform vec3 uBg; uniform vec2 uRes; uniform float uT, uLight; out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
void main(){
  vec2 q = gl_FragCoord.xy / uRes - .5; q.x *= uRes.x / uRes.y;
  float v = 1. - smoothstep(.3, 1.15, length(q));
  vec3 c = uBg * mix(1., mix(.55, .92, uLight) + v * mix(.45, .08, uLight), 1.);
  c += (h21(floor(gl_FragCoord.xy / 1.5) + fract(uT * 7.13) * 91.7) - .5) * .022;
  o = vec4(c, 1.);
}`;
const FS_CAM = `#version 300 es
precision mediump float;
uniform sampler2D uVid; uniform vec2 uRes, uScale; uniform float uMirror, uA; out vec4 o;
void main(){
  vec2 s = gl_FragCoord.xy / uRes; s.y = 1. - s.y;
  vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x;
  o = vec4(texture(uVid, v).rgb * uA, 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs, attrs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function tex(){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
let PS, PL, PB, PC, vaoQ, vaoS, vaoL, bufS, idxS, bufL, idxL, nS = 0, nL = 0, texVid, texField, linesKey = '', surfKey = '';
function initGL(){
  PS = prog(VS_SURF, FS_NONE, ['aUV']); PL = prog(VS_LINE, FS_LINE, ['aA']);
  PB = prog(VS_Q, FS_BG, ['p']); PC = prog(VS_Q, FS_CAM, ['p']);

    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    if (MODE.camA > 0){
      const sa0 = W/H, va0 = vidW/vidH;
      gl.useProgram(PC.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid); gl.uniform1i(PC.U.uVid, 0);
      gl.uniform2f(PC.U.uRes, W, H); gl.uniform2f(PC.U.uScale, sa0 < va0 ? sa0/va0 : 1, sa0 < va0 ? 1 : va0/sa0);
      gl.uniform1f(PC.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PC.U.uA, MODE.camA * MODE.camA);
      gl.bindVertexArray(vaoQ); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    return;
  }
  // background
  gl.useProgram(PB.p);
  gl.uniform3fv(PB.U.uBg, LOOK.bg); gl.uniform2f(PB.U.uRes, W, H); gl.uniform1f(PB.U.uT, t); gl.uniform1f(PB.U.uLight, LOOK.light);
  gl.bindVertexArray(vaoQ); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  const span = [W / H, 1];
  const setH = (P) => {
    gl.uniform1i(P.U.uField, 1); gl.uniform2f(P.U.uSpan, span[0], span[1]);
    gl.uniform1f(P.U.uYaw, yaw); gl.uniform1f(P.U.uPitch, pitch);
    gl.uniform1f(P.U.uDepth, (.35 + 1.5 * LOOK.depth) * Math.min(1, MODE.reveal * 1.4));
    gl.uniform1f(P.U.uWob, .3 + 1.7 * LOOK.wob); gl.uniform1f(P.U.uT, t);
  };
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texField);
  // 1) the body as a depth-only surface, so lines behind it are hidden
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
  gl.clearDepth(1); gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.colorMask(false, false, false, false);
  gl.useProgram(PS.p); setH(PS);
  gl.bindVertexArray(vaoS); gl.drawElements(gl.TRIANGLES, nS, gl.UNSIGNED_INT, 0);
  gl.colorMask(true, true, true, true);
  // 2) the lines
  gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(PL.p); setH(PL);
  gl.uniform2f(PL.U.uRes, W, H);
  gl.uniform1f(PL.U.uThick, (.7 + 7.5 * LOOK.thick * LOOK.thick) * Math.min(W, H) / 900);
  gl.uniform1f(PL.U.uReveal, MODE.reveal); gl.uniform1f(PL.U.uRedraw, redraw);
  gl.uniform3fv(PL.U.uA, LOOK.a); gl.uniform3fv(PL.U.uB, LOOK.b); gl.uniform3fv(PL.U.uAcc, LOOK.acc);
  gl.bindVertexArray(vaoL); gl.drawElements(gl.TRIANGLES, nL, gl.UNSIGNED_INT, 0);
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.depthMask(true);

  if (++uiT > 6){ uiT = 0; paintUI(); }
  if (++hudT > 10){
    hudT = 0;
    $('hud').innerHTML = 'KEISEN  ' + (S.auto ? '<b>AUTO</b>' : 'MANUAL') + '  ' + KINDS[LOOK.kind] + ' ' + String(LOOK.hue).padStart(3, '0') + '°' +
      '\nLINES ' + String(rowCount()).padStart(3, '0') + '   ' + ((.7 + 7.5 * LOOK.thick * LOOK.thick)).toFixed(1) + 'PX' +
      '\nYAW ' + (yaw * 57.3 >= 0 ? '+' : '−') + Math.abs(yaw * 57.3).toFixed(0).padStart(2, '0') + '°';
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__KEISEN = {
  state: () => ({ on:MODE.on, reveal:MODE.reveal, auto:S.auto, kind:LOOK.kind, hue:LOOK.hue, rows:rowCount(),
                  thick:+LOOK.thick.toFixed(3), E:+F.E.toFixed(4), changes:AUTO.changes, jumps:AUTO.jumps, mask:M.live, fw:F.w, fh:F.h }),
  mode(m){ setMode(!!m); },
  auto(on){ setAuto(!!on); },
  feedMask(data, w, h){ M.external = true; return ingestMask(data, w, h); },
  look: () => JSON.parse(JSON.stringify(LOOK)),
};
</script>
