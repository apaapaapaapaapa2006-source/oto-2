<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="description" content="動いたところから透明な羽が生えて体にまとわりつき、景色をガラスのように曲げながら消えていく。羽には少し前の自分が映る。絹・葉・ガラスの三つの羽。撮影と録画ができる。">
<meta name="theme-color" content="#000000">
<title>FRINGE ─ 動くと透明な羽がまとわりつく</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  FRINGE ─ 動くと透明な羽がまとわりつく                  ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  ORIGIN     オーナーが持ち込んだ完成品（index.html、画面上のタイトル「FRINGE」）。
             仕組み（動きの検出→羽の束→屈折と残像の合成）・三つの羽・配色・書体はオーナーの
             設計。画廊に揃えたのは開始ボタン・⟲ カメラ・⚙ で隠せる調整パネル・撮影・録画
             （REC-FIX）・カメラ失敗時の定型文と再試行。
  10-15 改訂 オーナーの声「なんか思ってたのとちがう」。実在の人の映像（正面の顔が首を振る・
             部屋を人が歩く）で見ると、羽は頭の横の壁に黒っぽい細い線が数本出るだけだった。
             ①動きの閾値を固定の 11 から、映像の静かな部分のざわつきに合わせる可変に
             ②スマホは 60Hz 以上で描くのにカメラは 30 コマ／秒なので、同じコマを二度比べて
             「動きなし」と読み、羽が半分以下になっていた → カメラの新しいコマでだけ動きを測る
             ③羽の根元を動いている体の側に置き、根元が下の動きに乗って体についていく
             （止まればそこに留まる）。羽は動きの後ろへなびき、先が遅れてしなる
             ④流れの読めない所は周りの動きの向きに揃え、束が一方向に流れる
             ⑤細い羽の縁の暗さは外側 1px だけにして黒い傷に見えないように、中は背景が透ける
             ⑥GLASS は羽軸と羽枝の溝のあるガラスの羽に（縁だけ虹色）。
  MOOD       動いたところから、動きと逆向きに透明な羽が束になって生え、体の流れに
             乗ってまとわりつきながら細って消える。羽はガラスのように景色を曲げて分光し、
             中には生まれた瞬間の自分（少し前のコマ）が引きずられて映る。
  STYLES     SILK 細く長いガラスの糸 ／ LEAF 幅広で残像の濃い葉 ／ GLASS 羽軸と羽枝のある透明な羽
  PALETTE    地 #000 ／ 文字 #f4f4f2 ／ 色はカメラの映像と羽の虹色だけ
  TYPE       -apple-system / Helvetica Neue（オーナーの指定のまま、細く字間を広く）
  TECH       WebGL2。CPU の低解像度 Lucas–Kanade オプティカルフローで動きを拾い、
             羽をインスタンス描画（最大 4000 本）。法線・残像色・縁／溝を MRT に描いて合成で
             屈折・分光・鏡面・薄膜の虹色。過去 32 コマを TEXTURE_2D_ARRAY のリングに保持。
             新しいコマは requestVideoFrameCallback で知る（無ければ毎回）。
             外部モデルを使わないので CDN が落ちていても動く。
  ══════════════════════════════════════════════════════════════════════════
-->
<style>

  #panel.hide{display:none}

<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>
<div id="start">
  <h1>FRINGE</h1>
  <p>動くと、透明な羽がまとわりつく</p>
  <p>体を動かすと、動いたところから羽が生えて<br>流れに乗ってまとわりつき、消えていく。<br>画面をタップすると操作が出ます。</p>
  <button id="go">TAP TO START</button>
  <div id="err"></div>
</div>
<div id="msg"></div>
<div id="ui" class="hide">
  <button id="bStyle">SILK</button>
  <button id="bDen">DENSITY 2</button>
  <button id="rec">● REC</button>
  <button id="shoot" aria-label="撮る"></button>
  <button id="bFlip">⟲ カメラ</button>

</div>

  <button class="x" id="px" aria-label="閉じる">✕</button>
  <div>羽</div>
  <div class="row" id="styles"><button data-s="0">SILK</button><button data-s="1">LEAF</button><button data-s="2">GLASS</button></div>
  <div>密度</div>
  <div class="row" id="dens"><button data-d="0">1</button><button data-d="1">2</button><button data-d="2">3</button></div>
  <label>感度<input id="sens" type="range" min="0.5" max="2" step="0.05" value="1"></label>
  <label>羽の長さ<input id="lenK" type="range" min="0.5" max="1.8" step="0.05" value="1"></label>
  <div class="note">SILK は細く長い絹糸、LEAF は幅広で残像の濃い葉、GLASS は羽軸のある透きとおった羽。小さな動きにも羽を出したいときは感度を上げる。</div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c');
const video = $('v');
const errEl = $('err'), msgEl = $('msg');
const gl = cv.getContext('webgl2', {alpha:false, antialias:false, premultipliedAlpha:false});
if (!gl) { errEl.textContent = 'このブラウザでは WebGL2 が使えないため動きません。'; $('go').disabled = true; return; }
let sens = 1, lenK = 1;

/* ---------------- presets ---------------- */
// sizes in CSS px, life in seconds.
// 2026-10-15: retuned after testing on real footage of a person. The owner's values gave a few dark
// hairlines on the wall beside a moving head; these give a visible plume of clear feathers that rides
// on the body. barb = how much of the strand is a feather vane (barbs off a shaft, ragged edge).
const PRESETS = {
  SILK:  {w:[1.2,2.8], len:[45,140],  life:[1.0,1.8], smear:0.22, smearLen:0.20, refr:0.012, disp:0.30, spec:1.3, specPow:70, irid:0.60,
          alive:360, curve:0.20, spread:0.22, cluster:[3,6], rate:0.60, follow:0.85, dark:0.30, barb:0.0, sway:0.7},
  LEAF:  {w:[6,14],   len:[50,150],  life:[0.9,1.6], smear:0.82, smearLen:0.10, refr:0.018, disp:0.20, spec:0.9, specPow:45, irid:0.35,
          alive:150, curve:0.22, spread:0.35, cluster:[2,4], rate:0.35, follow:0.75, dark:0.35, barb:0.35, sway:0.4},
  GLASS: {w:[9,20],   len:[55,150],  life:[1.0,1.9], smear:0.0,  smearLen:0.0,  refr:0.030, disp:0.40, spec:1.5, specPow:80, irid:1.00,
          alive:120, curve:0.18, spread:0.30, cluster:[2,3], rate:0.35, follow:0.80, dark:0.35, barb:1.0, sway:0.5},
};
const STYLE_ORDER = ['SILK','LEAF','GLASS'];
let styleIdx = 0, P = PRESETS.SILK;
const DENS = [0.45, 1.0, 1.9]; let denIdx = 1;

/* ---------------- shaders ---------------- */
const VS_FULL = `#version 300 es
layout(location=0) in vec2 p; out vec2 vS;
void main(){ vS=p*.5+.5; gl_Position=vec4(p,0.,1.); }`;

const MAP_GLSL = `
uniform vec4 uMap; uniform vec2 uRes; uniform float uMirror;
vec2 vidUV(vec2 s){
  vec2 px=vec2(s.x*uRes.x,(1.-s.y)*uRes.y);
  vec2 uv=(px-uMap.xy)/uMap.zw;
  if(uMirror>.5) uv.x=1.-uv.x;
  return clamp(uv,0.001,0.999);
}`;

const FS_CAPTURE = `#version 300 es
precision highp float;
in vec2 vS; out vec4 o; uniform sampler2D uVid; ${MAP_GLSL}
void main(){ o=vec4(texture(uVid,vidUV(vS)).rgb,1.); }`;

const VS_STRAND = `#version 300 es
layout(location=0) in vec2 aQ;
layout(location=1) in vec4 aA; // x,y,angle,len
layout(location=2) in vec4 aB; // width, age, curve, layer
layout(location=3) in vec4 aC; // srcX, srcY, seed, smearLen
uniform vec2 uRes;
out vec2 vQ; out vec2 vPerp; out vec2 vTan; out float vAge; out vec3 vSrc; out float vSeed; out vec2 vWL;
void main(){
  float s=aQ.x, t=aQ.y, age=aB.y;
  float grow=smoothstep(0.,.16,age);
  float L=aA.w*mix(.2,1.,grow)*(1.-.25*age);
  float W=aB.x*(1.-.55*age)+1.2;           // +1.2px pad for AA
  vec2 d=vec2(cos(aA.z),sin(aA.z)); vec2 n=vec2(-d.y,d.x);
  float taper=pow(sin(3.14159*pow(s,.6)),.75);
  vec2 P=aA.xy + d*s*L + n*(aB.z*s*s*L) + n*t*W*taper*.5;
  vec2 tg=normalize(d+n*2.*aB.z*s); vPerp=vec2(-tg.y,tg.x); vTan=tg;
  vQ=aQ; vAge=age; vSeed=aC.z; vWL=vec2(max(W*taper,1.),L);
  vec2 src=aC.xy + d*s*L*aC.w + n*t*W*.35;
  vSrc=vec3(src.x/uRes.x, 1.-src.y/uRes.y, aB.w);

// three targets: N = normal/height, C = afterimage colour, E = outline / shaft / barb glint
const FS_STRAND = `#version 300 es
precision highp float; precision highp sampler2DArray;
in vec2 vQ; in vec2 vPerp; in vec2 vTan; in float vAge; in vec3 vSrc; in float vSeed; in vec2 vWL;
uniform sampler2DArray uFrames; uniform float uBarb, uDpr;
layout(location=0) out vec4 oN; layout(location=1) out vec4 oC; layout(location=2) out vec4 oE;
float hash(float n){ return fract(sin(n)*43758.5453); }
void main(){
  float s=vQ.x, t=vQ.y, at=abs(t);
  float W=vWL.x, L=vWL.y;                  // local width and length, px
  // barbs: fine lines leaving the shaft and leaning toward the tip, like the vane of a feather
  float spc=mix(3.6,5.,fract(vSeed*7.31))*uDpr;
  float ph=(s*L - at*W*.5*1.8)/spc;
  float cell=floor(ph), f=fract(ph);
  float rnd=hash(cell+vSeed*91.7);
  float barb=smoothstep(0.,.35,f)*smoothstep(1.,.55,f);
  // a ragged outline and the odd split between barbs
  float lim=1.-uBarb*(.10+.40*rnd*rnd);
  float split=uBarb*step(.87,hash(cell*1.71+vSeed*13.3))*smoothstep(.12,.45,at);
  float soft=mix(.45,.2,uBarb);
  float edgeA=smoothstep(lim,lim-soft,at)*(1.-split);
  // silk keeps the owner's fine lengthwise ridges -> sparkly refraction
  float ridge=sin(t*7.+vSeed*40.)*.18*(1.-uBarb);
  float tt=clamp(t+ridge*(1.-at),-1.,1.);
  float h=sqrt(max(0.,1.-tt*tt));

  float tip=smoothstep(1.,.8,s);

  c*= .88+.24*h;                           // slight bevel shading on the smear
  oC=vec4(c*a,a);

  float px=2./max(W,1.);
  float rim=smoothstep(lim-soft*.5-1.6*px,lim-soft*.5,at);

  float band=smoothstep(.6,.95,at/lim)*clamp((W/uDpr-5.)/9.,0.,1.);

  float shaft=uBarb*(1.-smoothstep(.5*px,1.6*px,at))*smoothstep(.02,.12,s)*smoothstep(1.,.7,s);
  float groove=max(uBarb*(1.-barb)*.8, shaft);

}`;

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vS; out vec4 o;
uniform sampler2D uVid, uN, uC, uE;
uniform float uRefr, uSmear, uDisp, uSpec, uSpecPow, uIrid, uDark, uTime, uBarb;
${MAP_GLSL}
void main(){
  vec2 s=vS;
  vec4 N=texture(uN,s), C=texture(uC,s), E=texture(uE,s);
  float a=clamp(N.a,0.,1.);
  vec3 base=texture(uVid,vidUV(s)).rgb;
  if(a<.003){ o=vec4(base,1.); return; }
  vec2 n=(N.rg/a)*2.-1.; float h=N.b/a;
  float rim=E.r/a, band=E.g/a, groove=E.b/a;
  vec2 asp=vec2(uRes.y/uRes.x,1.);
  vec2 off=n*uRefr*asp*(.6+.4*a);
  vec3 g=vec3(texture(uVid,vidUV(s+off)).r,
              texture(uVid,vidUV(s+off*(1.+uDisp))).g,
              texture(uVid,vidUV(s+off*(1.+2.*uDisp))).b);
  vec3 sm=C.rgb/max(C.a,1e-3);
  vec3 body=mix(g, sm, uSmear);
  vec3 N3=normalize(vec3(n*1.7, max(h,.05)));
  vec3 L1=normalize(vec3(-.45,.6,.66)), L2=normalize(vec3(.6,-.3,.75));
  float sp=pow(max(dot(reflect(-L1,N3),vec3(0,0,1)),0.),uSpecPow)

  float fr=pow(1.-N3.z,2.5);

  // and the dark line sit only at the very edge
  // the barbs show as faint grooves in the glass, not as highlights
  vec3 col=body*(1.+.03*h)*(1.-rim*uDark-band*uDark*.55)*(1.-.13*groove) + sp*uSpec*mix(1.,.45,uBarb) + fr*.10*film + rim*.25*film;

/* ---------------- optical flow (CPU, low-res Lucas–Kanade) ---------------- */
const fc=document.createElement('canvas'); const fx=fc.getContext('2d',{willReadFrequently:true});
let FW=80,FH=60, prevG=null, curG=null, Ix,Iy,It;
const STEP=3, RAD=3; let GW=0,GH=0, flowU, flowV, flowM, mSort;
function setupFlow(){
  // the long side of the camera picture is 80 samples, whichever way the phone is held
  const L=80; if(vw>=vh){ FW=L; FH=Math.max(16,Math.round(L*vh/vw)); } else { FH=L; FW=Math.max(16,Math.round(L*vw/vh)); }
  fc.width=FW; fc.height=FH;
  prevG=new Float32Array(FW*FH); curG=new Float32Array(FW*FH);
  Ix=new Float32Array(FW*FH); Iy=new Float32Array(FW*FH); It=new Float32Array(FW*FH);
  GW=Math.floor((FW-2*RAD-2)/STEP); GH=Math.floor((FH-2*RAD-2)/STEP);
  flowU=new Float32Array(GW*GH); flowV=new Float32Array(GW*GH); flowM=new Float32Array(GW*GH); mSort=new Float32Array(GW*GH);
  hasPrev=false;
}
let hasPrev=false;
function computeFlow(){
  fx.drawImage(video,0,0,FW,FH);
  const d=fx.getImageData(0,0,FW,FH).data;
  const t=prevG; prevG=curG; curG=t;
  for(let i=0,j=0;i<FW*FH;i++,j+=4) curG[i]=d[j]*.299+d[j+1]*.587+d[j+2]*.114;
  if(!hasPrev){ hasPrev=true; return false; }
  for(let y=1;y<FH-1;y++) for(let x=1;x<FW-1;x++){ const i=y*FW+x;
    Ix[i]=(curG[i+1]-curG[i-1]+prevG[i+1]-prevG[i-1])*.25;
    Iy[i]=(curG[i+FW]-curG[i-FW]+prevG[i+FW]-prevG[i-FW])*.25;
    It[i]=curG[i]-prevG[i]; }
  for(let gy=0;gy<GH;gy++) for(let gx=0;gx<GW;gx++){
    const cx=RAD+1+gx*STEP, cy=RAD+1+gy*STEP;
    let sxx=0,sxy=0,syy=0,sxt=0,syt=0,m=0;
    for(let y=cy-RAD;y<=cy+RAD;y++){ let i=y*FW+cx-RAD;
      for(let x=-RAD;x<=RAD;x++,i++){ const a=Ix[i],b=Iy[i],c=It[i];
        sxx+=a*a; sxy+=a*b; syy+=b*b; sxt+=a*c; syt+=b*c; m+=c<0?-c:c; } }
    const k=gy*GW+gx, det=sxx*syy-sxy*sxy;
    m/=(2*RAD+1)*(2*RAD+1);
    let u=0,v=0;
    if(det>1e-2 && m>2){ u=(-syy*sxt+sxy*syt)/det; v=(sxy*sxt-sxx*syt)/det;
      const l=Math.hypot(u,v); if(l>4){u*=4/l; v*=4/l;} }
    // temporal smoothing
    flowU[k]=flowU[k]*.4+u*.6; flowV[k]=flowV[k]*.4+v*.6; flowM[k]=flowM[k]*.35+m*.65;
  }
  flowStats();

}
// how much the picture changes where nothing moves (sensor noise, flicker) sets the bar for "moving";
// when most of the picture moves (the phone itself is moving) fewer feathers are born
let noiseLvl=3, thrDyn=8, movingFrac=0;
function flowStats(){
  mSort.set(flowM); mSort.sort();
  const q=mSort[Math.floor(mSort.length*.4)];
  noiseLvl+=(q-noiseLvl)*.08;
  thrDyn=Math.max(4, noiseLvl*2+2.5)/sens;
  let c=0; for(let k=0;k<flowM.length;k++) if(flowM[k]>thrDyn) c++;
  movingFrac=c/flowM.length;
}
// flow cell -> screen px
function cellToScreen(gx,gy,out){
  let fxp=(RAD+1+gx*STEP)/FW, fyp=(RAD+1+gy*STEP)/FH;
  if(mirror) fxp=1-fxp;
  out[0]=map.ox+fxp*map.dw; out[1]=map.oy+fyp*map.dh; return out;
}
// the motion around a screen point, in screen px per second. The 3x3 cells around it are weighed by how
// much they move, so a strand sitting at the edge of a moving arm is carried along with the arm.
function sampleFlowAt(sx,sy,out){
  let u=(sx-map.ox)/map.dw, v=(sy-map.oy)/map.dh; if(mirror) u=1-u;
  const gx=Math.round((u*FW-RAD-1)/STEP), gy=Math.round((v*FH-RAD-1)/STEP);
  let su=0,sv=0,sw=0; const t0=thrDyn*.6;

    for(let i=-1;i<=1;i++){ const x=gx+i; if(x<0||x>=GW) continue;
      const k=y*GW+x, w0=flowM[k]-t0; if(w0<=0) continue;
      const w=w0*w0*((i||j)?.5:1); su+=flowU[k]*w; sv+=flowV[k]*w; sw+=w; } }
  if(sw<=0){ out[0]=0; out[1]=0; return out; }

  out[0]=su/sw*k2*(mirror?-1:1); out[1]=sv/sw*k2; return out;

/* ---------------- strands ---------------- */
const S=[]; // pool of objects
const rnd=(a,b)=>a+Math.random()*(b-a);
const tmpA=[0,0], tmpB=[0,0];
let curLayer=0, freshCount=0, frameDt=1/30;
function spawnCluster(x,y,mx,my){
  const n=Math.round(rnd(P.cluster[0],P.cluster[1]));
  const base=Math.atan2(-my,-mx); // trail opposite to motion
  const spd=Math.hypot(mx,my);
  const cap=Math.min(MAX,P.alive*DENS[denIdx]);
  for(let i=0;i<n && S.length<cap;i++){
    const ang=base+(Math.random()-.5)*2*P.spread;
    const jx=(Math.random()-.5)*14*dpr, jy=(Math.random()-.5)*14*dpr;
    const lenBoost=Math.min(1.3,.75+spd/(20*dpr));
    S.push({
      x:x+jx, y:y+jy, sx:x+jx, sy:y+jy,
      ang, len:rnd(P.len[0],P.len[1])*dpr*lenBoost*lenK, w:rnd(P.w[0],P.w[1])*dpr,
      curve:(Math.random()-.5)*2*P.curve, bend:0, age:0, life:rnd(P.life[0],P.life[1]),
      layer:curLayer, seed:Math.random(), vx:mx/frameDt*P.follow, vy:my/frameDt*P.follow
    });
  }
}
// once per new camera frame
function spawnFromFlow(){
  const cap=Math.min(MAX,P.alive*DENS[denIdx]); if(S.length>=cap) return;
  const sc=map.dw/FW, NC=GW*GH, k0=(Math.random()*NC)|0;
  const calm=1-Math.min(1,Math.max(0,(movingFrac-.45)/.4));
  if(calm<=0) return;
  // where the flow can't be read (a plain wall, the inside of dark hair) the feathers take the way the
  // rest of the moving area goes, instead of a random one, so a plume streams in one direction
  let du=0,dv=0,dw=0;
  for(let k=0;k<NC;k++){ const m=flowM[k]-thrDyn; if(m<=0) continue; const u=flowU[k], v=flowV[k];
    if(u*u+v*v<.0225) continue; du+=u*m; dv+=v*m; dw+=m; }
  if(dw>0){ du/=dw; dv/=dw; }
  const domOK=du*du+dv*dv>=.0225;
  for(let kk=0;kk<NC;kk++){
    const k=(kk+k0)%NC;
    const m=flowM[k]; if(m<thrDyn) continue;
    let u=flowU[k], v=flowV[k]; const fl=Math.hypot(u,v);
    const real=fl>=.15;
    if(!real){ if(!domOK) continue; u=du; v=dv; }
    const p=Math.min(1,(m-thrDyn)/thrDyn*.45*P.rate*DENS[denIdx]*calm);
    if(Math.random()<p){
      const gx=k%GW, gy=(k/GW)|0; const c=cellToScreen(gx,gy,tmpA);
      const mx=u*sc*(mirror?-1:1), my=v*sc;
      // root half a cell ahead of the motion, so it sits on the moving body rather than on the wall it just left
      let x=c[0]+(Math.random()-.5)*STEP*sc, y=c[1]+(Math.random()-.5)*STEP*sc;
      if(real){ const l=Math.hypot(mx,my); x+=mx/l*STEP*sc*.5; y+=my/l*STEP*sc*.5; }
      spawnCluster(x,y,mx,my);

let lastT=performance.now(), flowReady=false;
function step(dt,now,fresh){
  if(fresh && flowReady) spawnFromFlow();

    s.age+=dt/s.life; if(s.age>=1){ S[i]=S[S.length-1]; S.pop(); continue; }
    // ride on the body: the root takes on the motion under it, and stays put where the body stops
    const f=sampleFlowAt(s.x,s.y,tmpB);
    s.vx+=(f[0]*P.follow-s.vx)*kF; s.vy+=(f[1]*P.follow-s.vy)*kF;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    // stream out behind the motion, the tip lagging like hair
    const spd=Math.hypot(s.vx,s.vy);
    if(spd>still){
      let da=Math.atan2(-s.vy,-s.vx)-s.ang; da-=Math.round(da/6.2832)*6.2832;

    s.bend*=dec;
    s.ang+=s.curve*dt*.6;
  }

  const n=S.length, tt=now*.001;
  for(let i=0;i<n;i++){ const s=S[i], o=i*STRIDE;
    inst[o]=s.x; inst[o+1]=s.y; inst[o+2]=s.ang; inst[o+3]=s.len;
    inst[o+4]=s.w; inst[o+5]=s.age; inst[o+6]=s.curve+s.bend+Math.sin(tt*(1.6+s.seed)+s.seed*40)*P.sway*.08; inst[o+7]=s.layer;
    inst[o+8]=s.sx; inst[o+9]=s.sy; inst[o+10]=s.seed; inst[o+11]=P.smearLen; }

}

function setMapUniforms(u){
  gl.uniform4f(u.uMap,map.ox,map.oy,map.dw,map.dh); gl.uniform2f(u.uRes,W,H); gl.uniform1f(u.uMirror,mirror?1:0);
}

// Phones draw at 60 Hz or more while the camera gives 30 frames a second. The owner's loop measured the
// motion on every draw, so every other measurement saw the same picture twice, read "no motion" and
// halved the feathers. The motion is now measured only when the camera has delivered a new frame.
let newFrame=true, rvfc=false;
function armFrameClock(){
  if(rvfc || !video.requestVideoFrameCallback) return;
  rvfc=true; const cb=()=>{ newFrame=true; video.requestVideoFrameCallback(cb); };
  video.requestVideoFrameCallback(cb);
}
let running=false, shootReq=false, lastFresh=0;
function frame(now){
  if(!running) return; requestAnimationFrame(frame);

  if(video.readyState<2) return;
  if(video.videoWidth!==vw||video.videoHeight!==vh){ updateMap(); setupFlow(); }
  // (if the frame clock ever goes quiet, fall back to measuring every 200 ms rather than freezing)
  const fresh=!rvfc||newFrame||now-lastFresh>200; newFrame=false;
  if(fresh){
    if(lastFresh) frameDt+=(Math.min(.15,Math.max(1/90,(now-lastFresh)/1000))-frameDt)*.3;
    lastFresh=now;
    // upload video
    gl.bindTexture(gl.TEXTURE_2D,vidTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
    freshCount++;
    // flow
    flowReady=computeFlow();
    // capture frame into ring layer (every 2 camera frames)
    if(freshCount%2===0){
      curLayer=(curLayer+1)%LAYERS;
      gl.bindFramebuffer(gl.FRAMEBUFFER,capFBO);
      gl.framebufferTextureLayer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,frames,0,curLayer);
      gl.viewport(0,0,LW,LH); gl.disable(gl.BLEND);
      gl.useProgram(pCap.p); setMapUniforms(pCap.u);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,vidTex); gl.uniform1i(pCap.u.uVid,0);
      gl.bindVertexArray(fullVAO); gl.drawArrays(gl.TRIANGLES,0,3);
    }
  }
  const n=step(dt,now,fresh);
  // strands pass
  gl.bindFramebuffer(gl.FRAMEBUFFER,strFBO); gl.viewport(0,0,W,H);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  if(n){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(pStr.p); gl.uniform2f(pStr.u.uRes,W,H); gl.uniform1f(pStr.u.uBarb,P.barb); gl.uniform1f(pStr.u.uDpr,dpr);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY,frames); gl.uniform1i(pStr.u.uFrames,0);
    gl.bindVertexArray(strVAO); gl.bindBuffer(gl.ARRAY_BUFFER,ib);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,inst,0,n*STRIDE);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,(SEG+1)*2,n);
    gl.disable(gl.BLEND);
  }
  // composite
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.useProgram(pComp.p); const u=pComp.u; setMapUniforms(u);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,vidTex); gl.uniform1i(u.uVid,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,nTex); gl.uniform1i(u.uN,1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,cTex); gl.uniform1i(u.uC,2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,eTex); gl.uniform1i(u.uE,3);
  gl.uniform1f(u.uRefr,P.refr); gl.uniform1f(u.uSmear,P.smear); gl.uniform1f(u.uDisp,P.disp);
  gl.uniform1f(u.uSpec,P.spec); gl.uniform1f(u.uSpecPow,P.specPow); gl.uniform1f(u.uIrid,P.irid);
  gl.uniform1f(u.uDark,P.dark); gl.uniform1f(u.uTime,now/1000); gl.uniform1f(u.uBarb,P.barb);
  gl.bindVertexArray(fullVAO); gl.drawArrays(gl.TRIANGLES,0,3);
  if(shootReq){ shootReq=false; saveShot(); }
}

/* ---------------- camera ---------------- */
let facing='user', stream=null;
function camErrText(e){
  const m=(e&&(e.message||e.name))?(e.message||e.name):String(e||'unknown');
  return 'カメラを起動できませんでした：'+m+'\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
async function startCam(){
  const md=navigator.mediaDevices;
  if(!md||!md.getUserMedia) throw new Error('getUserMedia is unavailable');
  // get the new stream first, so a failed flip keeps the old camera running
  const s2=await md.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=s2; video.srcObject=stream; mirror=(facing==='user');
  await video.play().catch(()=>{});
  await new Promise(r=>{ if(video.videoWidth) r(); else video.onloadedmetadata=r; });
  armFrameClock(); updateMap(); setupFlow(); S.length=0;
}

/* ---------------- UI ---------------- */
const ui=$('ui'), panel=$('panel');
const bStyle=$('bStyle'), bDen=$('bDen'), bFlip=$('bFlip');
function setStyle(i){ styleIdx=i; P=PRESETS[STYLE_ORDER[i]]; bStyle.textContent=STYLE_ORDER[i];
  document.querySelectorAll('#styles button').forEach(b=>b.classList.toggle('on',+b.dataset.s===i)); }
function setDen(i){ denIdx=i; bDen.textContent='DENSITY '+(i+1);
  document.querySelectorAll('#dens button').forEach(b=>b.classList.toggle('on',+b.dataset.d===i)); }
bStyle.onclick=e=>{ e.stopPropagation(); setStyle((styleIdx+1)%STYLE_ORDER.length); pokeUI(); };
bDen.onclick=e=>{ e.stopPropagation(); setDen((denIdx+1)%DENS.length); pokeUI(); };
document.querySelectorAll('#styles button').forEach(b=>b.onclick=()=>setStyle(+b.dataset.s));
document.querySelectorAll('#dens button').forEach(b=>b.onclick=()=>setDen(+b.dataset.d));
$('sens').oninput=e=>{ sens=+e.target.value; };
$('lenK').oninput=e=>{ lenK=+e.target.value; };
setStyle(0); setDen(1);
bFlip.onclick=async e=>{ e.stopPropagation(); const prev=facing; facing=facing==='user'?'environment':'user';
  try{ await startCam(); msgEl.textContent=''; }catch(err){ facing=prev; msgEl.textContent=camErrText(err); }
  pokeUI(); };
function setPanel(open){ panel.classList.toggle('hide',!open); $('gear').setAttribute('aria-expanded',open?'true':'false'); pokeUI(); }
$('gear').onclick=e=>{ e.stopPropagation(); setPanel(panel.classList.contains('hide')); };
$('px').onclick=()=>setPanel(false);
let uiTimer=0;
// the bar fades after a few seconds (owner's design), but stays while the panel is open or a recording runs
function pokeUI(){ ui.classList.remove('hide'); clearTimeout(uiTimer);
  uiTimer=setTimeout(()=>{ if(panel.classList.contains('hide') && !(mr&&mr.state==='recording')) ui.classList.add('hide'); else pokeUI(); },3500); }
cv.addEventListener('pointerdown',()=>{ if(!panel.classList.contains('hide')) setPanel(false); pokeUI(); });

// shot: the WebGL canvas does not keep its buffer, so it is copied right after a frame is drawn
$('shoot').onclick=e=>{ e.stopPropagation(); shootReq=true; pokeUI(); };
function saveShot(){
  try{
    const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(cv,0,0,W,H);
    c.toBlob(b=>{ if(!b) return; const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='fringe_'+Date.now()+'.png';
      document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); },'image/png');
  }catch(e){ msgEl.textContent='保存できませんでした。'; }
}
let mr=null, chunks=[];
$('rec').onclick=e=>{
  e.stopPropagation(); const b=e.currentTarget;
  if(mr&&mr.state==='recording'){ mr.stop(); return; }
  const ms=cv.captureStream(30);
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  try{ mr=new MediaRecorder(ms,mt?{mimeType:mt,videoBitsPerSecond:6e6}:{}); }
  catch(err){ msgEl.textContent='録画を開始できませんでした。'+(err&&err.message?'\n'+err.message:''); return; }
  chunks=[]; mr.ondataavailable=ev=>{ if(ev.data&&ev.data.size) chunks.push(ev.data); };
  mr.onstop=()=>{ b.classList.remove('act'); b.textContent='● REC';
    const blob=new Blob(chunks,{type:mr.mimeType||'video/mp4'}); const ext=(mr.mimeType||'').includes('mp4')?'mp4':'webm';
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fringe_'+Date.now()+'.'+ext;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); pokeUI(); };
  mr.start(1000); b.classList.add('act'); b.textContent='■ STOP'; pokeUI();
};

$('go').addEventListener('click',async function(){
  const go=this; go.disabled=true; errEl.textContent='';
  resize();
  try{ await startCam(); }
  catch(e){ errEl.textContent=camErrText(e); go.disabled=false; return; }   // stay on the start screen so it can be retried
  $('start').style.display='none';
  running=true; lastT=performance.now(); requestAnimationFrame(frame); pokeUI();
});

// test hook
window.__fringe={ get n(){ return S.length; }, state(){ return {n:S.length, style:STYLE_ORDER[styleIdx], den:denIdx, sens, lenK, W, H, mirror, running, thr:thrDyn, noise:noiseLvl, moving:movingFrac, frameDt, rvfc}; } };
})();
</script>
