<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>

<meta name="theme-color" content="#000000">
<title>FRINGE ─ 動くと透明な羽がまとわりつく</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  FRINGE ─ 動くと透明な羽がまとわりつく                  ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  ORIGIN     オーナーが持ち込んだ完成品（index.html、画面上のタイトル「FRINGE」）。
             機構・シェーダ・三つの羽・配色・書体はオーナーの設計のまま。画廊に揃えたのは
             開始ボタン・⟲ カメラ・⚙ で隠せる調整パネル・撮影・録画（REC-FIX）・
             カメラ失敗時の定型文と再試行だけ。
  MOOD       動いたところから、動きと逆向きに透明な羽が束になって生え、体の流れに
             乗ってまとわりつきながら細って消える。羽はガラスのように景色を曲げて分光し、
             中には生まれた瞬間の自分（少し前のコマ）が引きずられて映る。
  STYLES     SILK 細く長い絹糸 ／ LEAF 幅広で残像の濃い葉 ／ GLASS 残像なし、屈折と虹色が最強
  PALETTE    地 #000 ／ 文字 #f4f4f2 ／ 色はカメラの映像と羽の虹色だけ
  TYPE       -apple-system / Helvetica Neue（オーナーの指定のまま、細く字間を広く）
  TECH       WebGL2。CPU の低解像度 Lucas–Kanade オプティカルフローで動きを拾い、
             羽をインスタンス描画（最大 4000 本）。法線と残像色を MRT に描いて合成で屈折・
             分光・鏡面・薄膜の虹色。過去 32 コマを TEXTURE_2D_ARRAY のリングに保持。
             外部モデルを使わないので CDN が落ちていても動く。
  ══════════════════════════════════════════════════════════════════════════
-->
<style>

  #start h1{margin:0;font-weight:200;font-size:40px;letter-spacing:.5em;padding-left:.5em}
  #start p{margin:0;color:var(--dim);letter-spacing:.12em;font-size:12px;line-height:1.9}
  #go{appearance:none;margin-top:28px;border:1px solid var(--dim);background:transparent;color:var(--fg);padding:12px 28px;border-radius:999px;

  #go:active{background:var(--fg);color:#000}
  #err{color:#f88;font-size:12px;line-height:1.8;letter-spacing:.04em;max-width:340px;white-space:pre-line;min-height:1em}
  #msg{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 14px);color:#f99;text-align:center;font-size:12px;line-height:1.7;white-space:pre-line;pointer-events:none;z-index:6;text-shadow:0 1px 6px #000}
  #ui{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:0 12px;z-index:4;transition:opacity .4s}
  #ui.hide{opacity:0;pointer-events:none}
  #ui button,#panel button{appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.28);color:#fff;
    font:600 11px/1 -apple-system,"Helvetica Neue",sans-serif;letter-spacing:.18em;padding:12px 16px;border-radius:999px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  #ui #rec.act{background:#ff2a2a;border-color:#ff2a2a}

    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px;font-size:11px;letter-spacing:.12em;color:var(--dim)}

  #panel .x{position:absolute;right:8px;top:6px;border:0;background:none;padding:6px 8px;font-size:13px;letter-spacing:0}

<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>
<div id="start">
  <h1>FRINGE</h1>
  <p>動くと、透明な羽がまとわりつく</p>
  <p>体を動かすと、動いたところから羽が生えて<br>流れに乗ってまとわりつき、消えていく。<br>画面をタップすると操作が出ます。</p>
  <button id="go">TAP TO START</button>
  <div id="err"></div>
</div>
<div id="msg"></div>
<div id="ui" class="hide">
  <button id="bStyle">SILK</button>
  <button id="bDen">DENSITY 2</button>
  <button id="rec">● REC</button>
  <button id="shoot" aria-label="撮る"></button>
  <button id="bFlip">⟲ カメラ</button>
  <button id="gear" aria-label="調整" aria-expanded="false">⚙</button>
</div>
<div id="panel" class="hide">
  <button class="x" id="px" aria-label="閉じる">✕</button>
  <div>羽</div>
  <div class="row" id="styles"><button data-s="0">SILK</button><button data-s="1">LEAF</button><button data-s="2">GLASS</button></div>
  <div>密度</div>
  <div class="row" id="dens"><button data-d="0">1</button><button data-d="1">2</button><button data-d="2">3</button></div>
  <label>感度<input id="sens" type="range" min="0.5" max="2" step="0.05" value="1"></label>
  <label>羽の長さ<input id="lenK" type="range" min="0.5" max="1.8" step="0.05" value="1"></label>
  <div class="note">SILK は細く長い絹糸、LEAF は幅広で残像の濃い葉、GLASS は残像のないガラス。小さな動きにも羽を出したいときは感度を上げる。</div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c');
const video = $('v');
const errEl = $('err'), msgEl = $('msg');
const gl = cv.getContext('webgl2', {alpha:false, antialias:false, premultipliedAlpha:false});
if (!gl) { errEl.textContent = 'このブラウザでは WebGL2 が使えないため動きません。'; $('go').disabled = true; return; }
let sens = 1, lenK = 1;

/* ---------------- presets ---------------- */
// sizes in CSS px
const PRESETS = {
  SILK:  {w:[1.0,2.6], len:[16,64],  life:[0.35,0.75], smear:0.30, smearLen:0.22, refr:0.010, disp:0.25, spec:1.3, specPow:70, irid:0.55,
          alive:380, curve:0.18, spread:0.40, cluster:[2,5], rate:0.75,  follow:0.55, drift:0.35, dark:0.55},
  LEAF:  {w:[4,11],   len:[50,170],  life:[0.55,1.0],  smear:0.82, smearLen:0.10, refr:0.018, disp:0.20, spec:0.9, specPow:45, irid:0.35,
          alive:110, curve:0.22, spread:0.55, cluster:[2,5], rate:0.26, follow:0.45, drift:0.25, dark:0.40},
  GLASS: {w:[2,7],    len:[30,140],  life:[0.5,1.0],   smear:0.0,  smearLen:0.0,  refr:0.032, disp:0.40, spec:1.5, specPow:80, irid:1.0,
          alive:220, curve:0.20, spread:0.45, cluster:[2,5], rate:0.42, follow:0.55, drift:0.3, dark:0.30},
};
const STYLE_ORDER = ['SILK','LEAF','GLASS'];
let styleIdx = 0, P = PRESETS.SILK;
const DENS = [0.45, 1.0, 1.9]; let denIdx = 1;

/* ---------------- shaders ---------------- */
const VS_FULL = `#version 300 es
layout(location=0) in vec2 p; out vec2 vS;
void main(){ vS=p*.5+.5; gl_Position=vec4(p,0.,1.); }`;

const MAP_GLSL = `
uniform vec4 uMap; uniform vec2 uRes; uniform float uMirror;
vec2 vidUV(vec2 s){
  vec2 px=vec2(s.x*uRes.x,(1.-s.y)*uRes.y);
  vec2 uv=(px-uMap.xy)/uMap.zw;
  if(uMirror>.5) uv.x=1.-uv.x;
  return clamp(uv,0.001,0.999);
}`;

const FS_CAPTURE = `#version 300 es
precision highp float;
in vec2 vS; out vec4 o; uniform sampler2D uVid; ${MAP_GLSL}
void main(){ o=vec4(texture(uVid,vidUV(vS)).rgb,1.); }`;

const VS_STRAND = `#version 300 es
layout(location=0) in vec2 aQ;
layout(location=1) in vec4 aA; // x,y,angle,len
layout(location=2) in vec4 aB; // width, age, curve, layer
layout(location=3) in vec4 aC; // srcX, srcY, seed, smearLen
uniform vec2 uRes;
out vec2 vQ; out vec2 vPerp; out float vAge; out vec3 vSrc; out float vSeed;
void main(){
  float s=aQ.x, t=aQ.y, age=aB.y;
  float grow=smoothstep(0.,.16,age);
  float L=aA.w*mix(.2,1.,grow)*(1.-.25*age);
  float W=aB.x*(1.-.55*age)+1.2;           // +1.2px pad for AA
  vec2 d=vec2(cos(aA.z),sin(aA.z)); vec2 n=vec2(-d.y,d.x);
  float taper=pow(sin(3.14159*pow(s,.6)),.75);
  vec2 P=aA.xy + d*s*L + n*(aB.z*s*s*L) + n*t*W*taper*.5;
  vec2 tg=normalize(d+n*2.*aB.z*s); vPerp=vec2(-tg.y,tg.x);
  vQ=aQ; vAge=age; vSeed=aC.z;
  vec2 src=aC.xy + d*s*L*aC.w + n*t*W*.35;
  vSrc=vec3(src.x/uRes.x, 1.-src.y/uRes.y, aB.w);
  gl_Position=vec4(P.x/uRes.x*2.-1., 1.-P.y/uRes.y*2., 0., 1.);
}`;

const FS_STRAND = `#version 300 es
precision highp float; precision highp sampler2DArray;
in vec2 vQ; in vec2 vPerp; in float vAge; in vec3 vSrc; in float vSeed;
uniform sampler2DArray uFrames;
layout(location=0) out vec4 oN; layout(location=1) out vec4 oC;
void main(){
  float t=vQ.y;
  float h=sqrt(max(0.,1.-t*t));
  // fine lengthwise ridges -> sparkly refraction
  float ridge=sin(t*7.+vSeed*40.)*.18;
  float tt=clamp(t+ridge*(1.-abs(t)),-1.,1.);
  float edgeA=smoothstep(1.,.55,abs(t));
  float fade=(1.-smoothstep(.5,1.,vAge))*smoothstep(0.,.04,vAge);
  float tip=smoothstep(1.,.8,vQ.x);
  float a=edgeA*fade*tip;
  vec2 n=vec2(vPerp.x,-vPerp.y)*tt;      // y-up
  oN=vec4((n*.5+.5)*a, h*a, a);
  vec3 c=texture(uFrames,vSrc).rgb;
  c*= .88+.24*h;                          // slight bevel shading on the smear
  oC=vec4(c*a,a);
}`;

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vS; out vec4 o;
uniform sampler2D uVid, uN, uC;
uniform float uRefr, uSmear, uDisp, uSpec, uSpecPow, uIrid, uDark, uTime;
${MAP_GLSL}
void main(){
  vec2 s=vS;
  vec4 N=texture(uN,s), C=texture(uC,s);
  float a=clamp(N.a,0.,1.);
  vec3 base=texture(uVid,vidUV(s)).rgb;
  if(a<.003){ o=vec4(base,1.); return; }
  vec2 n=(N.rg/a)*2.-1.; float h=N.b/a;
  vec2 asp=vec2(uRes.y/uRes.x,1.);
  vec2 off=n*uRefr*asp*(.6+.4*a);
  vec3 g=vec3(texture(uVid,vidUV(s+off)).r,
              texture(uVid,vidUV(s+off*(1.+uDisp))).g,
              texture(uVid,vidUV(s+off*(1.+2.*uDisp))).b);
  vec3 sm=C.rgb/max(C.a,1e-3);
  vec3 body=mix(g, sm, uSmear);
  vec3 N3=normalize(vec3(n*1.7, max(h,.05)));
  vec3 L1=normalize(vec3(-.45,.6,.66)), L2=normalize(vec3(.6,-.3,.75));
  float sp=pow(max(dot(reflect(-L1,N3),vec3(0,0,1)),0.),uSpecPow)
          +.45*pow(max(dot(reflect(-L2,N3),vec3(0,0,1)),0.),uSpecPow*.6);
  float fr=pow(1.-N3.z,2.5);
  vec3 irid=.5+.5*cos(6.2832*(fr*1.3+n.x*.4+n.y*.25+uTime*.05+vec3(0.,.33,.67)));
  float edge=smoothstep(.7,.97,length(n));
  vec3 col=body*(1.-edge*uDark) + sp*uSpec + fr*.32*mix(vec3(1.),irid,uIrid);
  o=vec4(mix(base,col,smoothstep(0.,.55,a)),1.);
}`;

function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const nm=gl.getActiveUniform(p,i).name; u[nm]=gl.getUniformLocation(p,nm); } return {p,u}; }

let pCap, pStr, pComp;
try { pCap=prog(VS_FULL,FS_CAPTURE); pStr=prog(VS_STRAND,FS_STRAND); pComp=prog(VS_FULL,FS_COMP); }
catch(e){ errEl.textContent='Shader error: '+e.message; console.error(e); return; }

/* ---------------- geometry ---------------- */
const fullVAO=gl.createVertexArray(); gl.bindVertexArray(fullVAO);
const fb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,fb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const SEG=12, MAX=4000, STRIDE=12;
const strVAO=gl.createVertexArray(); gl.bindVertexArray(strVAO);
const qb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,qb);
const q=[]; for(let i=0;i<=SEG;i++){ const s=i/SEG; q.push(s,-1,s,1); }
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(q),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const inst=new Float32Array(MAX*STRIDE);
const ib=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,ib); gl.bufferData(gl.ARRAY_BUFFER,inst.byteLength,gl.DYNAMIC_DRAW);
for(let k=0;k<3;k++){ gl.enableVertexAttribArray(1+k); gl.vertexAttribPointer(1+k,4,gl.FLOAT,false,STRIDE*4,k*16); gl.vertexAttribDivisor(1+k,1); }
gl.bindVertexArray(null);

/* ---------------- textures / fbos ---------------- */
function tex2D(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t; }

const vidTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,vidTex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));

const LAYERS=32;
let W=0,H=0,dpr=1, nTex, cTex, strFBO, frames, capFBO, LW=0, LH=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1, 2);
  const cw=window.innerWidth, ch=window.innerHeight;
  // cap pixel count for mobile GPUs
  const maxPx=1.7e6; let s=dpr; if(cw*ch*s*s>maxPx) s=Math.sqrt(maxPx/(cw*ch)); dpr=s;
  W=Math.round(cw*dpr); H=Math.round(ch*dpr); cv.width=W; cv.height=H;
  if(nTex){ gl.deleteTexture(nTex); gl.deleteTexture(cTex); gl.deleteFramebuffer(strFBO); gl.deleteTexture(frames); }
  nTex=tex2D(W,H); cTex=tex2D(W,H);
  strFBO=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,strFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,nTex,0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT1,gl.TEXTURE_2D,cTex,0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);
  LW=Math.max(64,Math.round(W/3)); LH=Math.max(64,Math.round(H/3));
  frames=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D_ARRAY,frames);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY,1,gl.RGBA8,LW,LH,LAYERS);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(!capFBO) capFBO=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  updateMap();
}
window.addEventListener('resize',resize);

/* ---------------- video mapping (cover fit) ---------------- */
let vw=1280,vh=720,mirror=true; const map={ox:0,oy:0,dw:1,dh:1};
function updateMap(){
  if(video.videoWidth){ vw=video.videoWidth; vh=video.videoHeight; }
  const s=Math.max(W/vw,H/vh); map.dw=vw*s; map.dh=vh*s; map.ox=(W-map.dw)/2; map.oy=(H-map.dh)/2;
}

/* ---------------- optical flow (CPU, low-res Lucas–Kanade) ---------------- */
const fc=document.createElement('canvas'); const fx=fc.getContext('2d',{willReadFrequently:true});
let FW=80,FH=60, prevG=null, curG=null, Ix,Iy,It;
const STEP=3, RAD=3; let GW=0,GH=0, flowU, flowV, flowM;
function setupFlow(){
  FW=80; FH=Math.max(16,Math.round(80*vh/vw)); fc.width=FW; fc.height=FH;
  prevG=new Float32Array(FW*FH); curG=new Float32Array(FW*FH);
  Ix=new Float32Array(FW*FH); Iy=new Float32Array(FW*FH); It=new Float32Array(FW*FH);
  GW=Math.floor((FW-2*RAD-2)/STEP); GH=Math.floor((FH-2*RAD-2)/STEP);
  flowU=new Float32Array(GW*GH); flowV=new Float32Array(GW*GH); flowM=new Float32Array(GW*GH);
  hasPrev=false;
}
let hasPrev=false;
function computeFlow(){
  fx.drawImage(video,0,0,FW,FH);
  const d=fx.getImageData(0,0,FW,FH).data;
  const t=prevG; prevG=curG; curG=t;
  for(let i=0,j=0;i<FW*FH;i++,j+=4) curG[i]=d[j]*.299+d[j+1]*.587+d[j+2]*.114;
  if(!hasPrev){ hasPrev=true; return false; }
  for(let y=1;y<FH-1;y++) for(let x=1;x<FW-1;x++){ const i=y*FW+x;
    Ix[i]=(curG[i+1]-curG[i-1]+prevG[i+1]-prevG[i-1])*.25;
    Iy[i]=(curG[i+FW]-curG[i-FW]+prevG[i+FW]-prevG[i-FW])*.25;
    It[i]=curG[i]-prevG[i]; }
  for(let gy=0;gy<GH;gy++) for(let gx=0;gx<GW;gx++){
    const cx=RAD+1+gx*STEP, cy=RAD+1+gy*STEP;
    let sxx=0,sxy=0,syy=0,sxt=0,syt=0,m=0;
    for(let y=cy-RAD;y<=cy+RAD;y++){ let i=y*FW+cx-RAD;
      for(let x=-RAD;x<=RAD;x++,i++){ const a=Ix[i],b=Iy[i],c=It[i];
        sxx+=a*a; sxy+=a*b; syy+=b*b; sxt+=a*c; syt+=b*c; m+=c<0?-c:c; } }
    const k=gy*GW+gx, det=sxx*syy-sxy*sxy;
    m/=(2*RAD+1)*(2*RAD+1);
    let u=0,v=0;
    if(det>1e-2 && m>2){ u=(-syy*sxt+sxy*syt)/det; v=(sxy*sxt-sxx*syt)/det;
      const l=Math.hypot(u,v); if(l>4){u*=4/l; v*=4/l;} }
    // temporal smoothing
    flowU[k]=flowU[k]*.4+u*.6; flowV[k]=flowV[k]*.4+v*.6; flowM[k]=flowM[k]*.35+m*.65;
  }
  return true;
}
// flow cell -> screen px
function cellToScreen(gx,gy){
  let fxp=(RAD+1+gx*STEP)/FW, fyp=(RAD+1+gy*STEP)/FH;
  if(mirror) fxp=1-fxp;
  return [map.ox+fxp*map.dw, map.oy+fyp*map.dh];
}
function sampleFlowAt(sx,sy){ // returns screen px per flow-frame
  let u=(sx-map.ox)/map.dw, v=(sy-map.oy)/map.dh; if(mirror) u=1-u;
  const gx=Math.round((u*FW-RAD-1)/STEP), gy=Math.round((v*FH-RAD-1)/STEP);
  if(gx<0||gy<0||gx>=GW||gy>=GH) return [0,0];
  const k=gy*GW+gx, sc=map.dw/FW;
  return [flowU[k]*sc*(mirror?-1:1), flowV[k]*sc];
}

/* ---------------- strands ---------------- */
const S=[]; // pool of objects
const rnd=(a,b)=>a+Math.random()*(b-a);
let curLayer=0, frameCount=0;
function spawnCluster(x,y,mx,my,mag){
  const n=Math.round(rnd(P.cluster[0],P.cluster[1]));
  const base=Math.atan2(-my,-mx); // trail opposite to motion
  const spd=Math.hypot(mx,my);
  const cap=Math.min(MAX,P.alive*DENS[denIdx]);
  for(let i=0;i<n && S.length<cap;i++){
    const ang=base+(Math.random()-.5)*2*P.spread;
    const jx=(Math.random()-.5)*14*dpr, jy=(Math.random()-.5)*14*dpr;
    const lenBoost=Math.min(1.6,.6+spd/(12*dpr));
    S.push({
      x:x+jx, y:y+jy, sx:x+jx, sy:y+jy,
      ang, len:rnd(P.len[0],P.len[1])*dpr*lenBoost*lenK, w:rnd(P.w[0],P.w[1])*dpr,
      curve:(Math.random()-.5)*2*P.curve, age:0, life:rnd(P.life[0],P.life[1]),
      layer:curLayer, seed:Math.random(), vx:mx*P.drift, vy:my*P.drift
    });
  }
}

let lastT=performance.now(), flowReady=false;
function step(dt){
  // spawn from flow
  if(flowReady){
    const thr=11/sens, budget=Math.round(45*DENS[denIdx]);
    let made=0; const sc=map.dw/FW;
    const NC=GW*GH, k0=(Math.random()*NC)|0;
    for(let kk=0;kk<NC && made<budget;kk++){
      const k=(kk+k0)%NC;
      const m=flowM[k]; if(m<thr) continue;
      let u=flowU[k], v=flowV[k]; const fl=Math.hypot(u,v);
      if(fl<.15){ const a=Math.random()*6.283; u=Math.cos(a)*.4; v=Math.sin(a)*.4; }
      const p=Math.min(1,(m-thr)*.006*P.rate*DENS[denIdx]*dt*60);
      if(Math.random()<p){
        const gx=k%GW, gy=(k/GW)|0; const [x,y]=cellToScreen(gx,gy);
        const mx=u*sc*(mirror?-1:1), my=v*sc;
        spawnCluster(x+(Math.random()-.5)*STEP*sc, y+(Math.random()-.5)*STEP*sc, mx, my, m); made++;
      }
    }
  }
  // update
  for(let i=S.length-1;i>=0;i--){ const s=S[i];
    s.age+=dt/s.life; if(s.age>=1){ S[i]=S[S.length-1]; S.pop(); continue; }
    const [fu,fv]=sampleFlowAt(s.x,s.y);
    s.vx=s.vx*Math.pow(.02,dt)+fu*P.follow*.5; s.vy=s.vy*Math.pow(.02,dt)+fv*P.follow*.5;
    s.x+=s.vx*dt*6; s.y+=s.vy*dt*6;
    s.ang+=s.curve*dt*.6;
  }
  // pack
  const n=S.length;
  for(let i=0;i<n;i++){ const s=S[i], o=i*STRIDE;
    inst[o]=s.x; inst[o+1]=s.y; inst[o+2]=s.ang; inst[o+3]=s.len;
    inst[o+4]=s.w; inst[o+5]=s.age; inst[o+6]=s.curve; inst[o+7]=s.layer;
    inst[o+8]=s.sx; inst[o+9]=s.sy; inst[o+10]=s.seed; inst[o+11]=P.smearLen; }
  return n;
}

function setMapUniforms(u){
  gl.uniform4f(u.uMap,map.ox,map.oy,map.dw,map.dh); gl.uniform2f(u.uRes,W,H); gl.uniform1f(u.uMirror,mirror?1:0);
}

let running=false, shootReq=false;
function frame(now){
  if(!running) return; requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(video.readyState<2) return;
  if(video.videoWidth!==vw||video.videoHeight!==vh){ updateMap(); setupFlow(); }
  // upload video
  gl.bindTexture(gl.TEXTURE_2D,vidTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  frameCount++;
  // flow
  flowReady=computeFlow();
  // capture frame into ring layer (every 2 frames)
  if(frameCount%2===0){
    curLayer=(curLayer+1)%LAYERS;
    gl.bindFramebuffer(gl.FRAMEBUFFER,capFBO);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,frames,0,curLayer);
    gl.viewport(0,0,LW,LH); gl.disable(gl.BLEND);
    gl.useProgram(pCap.p); setMapUniforms(pCap.u);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,vidTex); gl.uniform1i(pCap.u.uVid,0);
    gl.bindVertexArray(fullVAO); gl.drawArrays(gl.TRIANGLES,0,3);
  }
  const n=step(dt);
  // strands pass
  gl.bindFramebuffer(gl.FRAMEBUFFER,strFBO); gl.viewport(0,0,W,H);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  if(n){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(pStr.p); gl.uniform2f(pStr.u.uRes,W,H);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY,frames); gl.uniform1i(pStr.u.uFrames,0);
    gl.bindVertexArray(strVAO); gl.bindBuffer(gl.ARRAY_BUFFER,ib);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,inst,0,n*STRIDE);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,(SEG+1)*2,n);
    gl.disable(gl.BLEND);
  }
  // composite
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.useProgram(pComp.p); const u=pComp.u; setMapUniforms(u);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,vidTex); gl.uniform1i(u.uVid,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,nTex); gl.uniform1i(u.uN,1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,cTex); gl.uniform1i(u.uC,2);
  gl.uniform1f(u.uRefr,P.refr); gl.uniform1f(u.uSmear,P.smear); gl.uniform1f(u.uDisp,P.disp);
  gl.uniform1f(u.uSpec,P.spec); gl.uniform1f(u.uSpecPow,P.specPow); gl.uniform1f(u.uIrid,P.irid);
  gl.uniform1f(u.uDark,P.dark); gl.uniform1f(u.uTime,now/1000);
  gl.bindVertexArray(fullVAO); gl.drawArrays(gl.TRIANGLES,0,3);
  if(shootReq){ shootReq=false; saveShot(); }
}

/* ---------------- camera ---------------- */
let facing='user', stream=null;
function camErrText(e){
  const m=(e&&(e.message||e.name))?(e.message||e.name):String(e||'unknown');
  return 'カメラを起動できませんでした：'+m+'\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
async function startCam(){
  const md=navigator.mediaDevices;
  if(!md||!md.getUserMedia) throw new Error('getUserMedia is unavailable');
  // get the new stream first, so a failed flip keeps the old camera running
  const s2=await md.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=s2; video.srcObject=stream; mirror=(facing==='user');
  await video.play().catch(()=>{});
  await new Promise(r=>{ if(video.videoWidth) r(); else video.onloadedmetadata=r; });
  updateMap(); setupFlow(); S.length=0;
}

/* ---------------- UI ---------------- */
const ui=$('ui'), panel=$('panel');
const bStyle=$('bStyle'), bDen=$('bDen'), bFlip=$('bFlip');
function setStyle(i){ styleIdx=i; P=PRESETS[STYLE_ORDER[i]]; bStyle.textContent=STYLE_ORDER[i];
  document.querySelectorAll('#styles button').forEach(b=>b.classList.toggle('on',+b.dataset.s===i)); }
function setDen(i){ denIdx=i; bDen.textContent='DENSITY '+(i+1);
  document.querySelectorAll('#dens button').forEach(b=>b.classList.toggle('on',+b.dataset.d===i)); }
bStyle.onclick=e=>{ e.stopPropagation(); setStyle((styleIdx+1)%STYLE_ORDER.length); pokeUI(); };
bDen.onclick=e=>{ e.stopPropagation(); setDen((denIdx+1)%DENS.length); pokeUI(); };
document.querySelectorAll('#styles button').forEach(b=>b.onclick=()=>setStyle(+b.dataset.s));
document.querySelectorAll('#dens button').forEach(b=>b.onclick=()=>setDen(+b.dataset.d));
$('sens').oninput=e=>{ sens=+e.target.value; };
$('lenK').oninput=e=>{ lenK=+e.target.value; };
setStyle(0); setDen(1);
bFlip.onclick=async e=>{ e.stopPropagation(); const prev=facing; facing=facing==='user'?'environment':'user';
  try{ await startCam(); msgEl.textContent=''; }catch(err){ facing=prev; msgEl.textContent=camErrText(err); }
  pokeUI(); };
function setPanel(open){ panel.classList.toggle('hide',!open); $('gear').setAttribute('aria-expanded',open?'true':'false'); pokeUI(); }
$('gear').onclick=e=>{ e.stopPropagation(); setPanel(panel.classList.contains('hide')); };
$('px').onclick=()=>setPanel(false);
let uiTimer=0;
// the bar fades after a few seconds (owner's design), but stays while the panel is open or a recording runs
function pokeUI(){ ui.classList.remove('hide'); clearTimeout(uiTimer);
  uiTimer=setTimeout(()=>{ if(panel.classList.contains('hide') && !(mr&&mr.state==='recording')) ui.classList.add('hide'); else pokeUI(); },3500); }
cv.addEventListener('pointerdown',()=>{ if(!panel.classList.contains('hide')) setPanel(false); pokeUI(); });

// shot: the WebGL canvas does not keep its buffer, so it is copied right after a frame is drawn
$('shoot').onclick=e=>{ e.stopPropagation(); shootReq=true; pokeUI(); };
function saveShot(){
  try{
    const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(cv,0,0,W,H);
    c.toBlob(b=>{ if(!b) return; const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='fringe_'+Date.now()+'.png';
      document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); },'image/png');
  }catch(e){ msgEl.textContent='保存できませんでした。'; }
}
let mr=null, chunks=[];
$('rec').onclick=e=>{
  e.stopPropagation(); const b=e.currentTarget;
  if(mr&&mr.state==='recording'){ mr.stop(); return; }
  const ms=cv.captureStream(30);
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  try{ mr=new MediaRecorder(ms,mt?{mimeType:mt,videoBitsPerSecond:6e6}:{}); }
  catch(err){ msgEl.textContent='録画を開始できませんでした。'+(err&&err.message?'\n'+err.message:''); return; }
  chunks=[]; mr.ondataavailable=ev=>{ if(ev.data&&ev.data.size) chunks.push(ev.data); };
  mr.onstop=()=>{ b.classList.remove('act'); b.textContent='● REC';
    const blob=new Blob(chunks,{type:mr.mimeType||'video/mp4'}); const ext=(mr.mimeType||'').includes('mp4')?'mp4':'webm';
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fringe_'+Date.now()+'.'+ext;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); pokeUI(); };
  mr.start(1000); b.classList.add('act'); b.textContent='■ STOP'; pokeUI();
};

$('go').addEventListener('click',async function(){
  const go=this; go.disabled=true; errEl.textContent='';
  resize();
  try{ await startCam(); }
  catch(e){ errEl.textContent=camErrText(e); go.disabled=false; return; }   // stay on the start screen so it can be retried
  $('start').style.display='none';
  running=true; lastT=performance.now(); requestAnimationFrame(frame); pokeUI();
});

// test hook
window.__fringe={ get n(){ return S.length; }, state(){ return {n:S.length, style:STYLE_ORDER[styleIdx], den:denIdx, sens, lenK, W, H, mirror, running}; } };
})();
