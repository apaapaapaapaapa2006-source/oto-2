<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人が液体金属の彫像になる。スタジオの照明が体の曲面にゆっくり映り込んで流れ、表面はかすかに波打つ。銀・黒鉄・シャンパンの三つの金属。">
<meta name="theme-color" content="#0d0d0e">
<title>SUIGIN ─ 液体金属の彫像になる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  SUIGIN 水銀 ─ 液体金属の彫像になる                 ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       時計や香水の広告のスタジオ撮影。グレーの背景紙の前に立つあなたが
             磨き上げた液体金属の像になり、ソフトボックスの白い帯が肩や頬の
             曲面を滑っていく。表面は止まっていてもかすかに揺らぐ ── 固体では
             なく液体であることの印。
  PALETTE    CHROME     銀 #d9dde1 と黒 #0d0d0e の鏡面、背景 #1b1c1f→#0d0d0e
             BLACK      黒鉄。反射率を下げ、ハイライトだけが鋭く残る
             CHAMPAGNE  淡い金 #e9d8b4。背景は温灰 #1e1b17
             彩度のある色はシャンパンの金だけ。
  TYPE       Syncopate 700（題字）・Syncopate 400（小さなラベル）。
  MOTION     ソフトボックスが 50 秒で体のまわりを一周する。表面の揺らぎは 6 秒
             周期。どれもゆっくり。フラッシュ・揺れは無し。
  SIGNATURE  体の曲面に映り込んで流れる白い帯。
  TECH       人物マスクを正方セル格子へ落として二度ぼかした「高さ場」（R16F）
             に、映像の明るさの起伏（顔の凹凸）と液面の揺らぎを足し、差分で
             法線を出す。視線を法線で反射させ、手続きで作ったスタジオ（背景紙
             の階調＋三枚のソフトボックス）を引く。フレネルで縁ほど明るい。
             マスクが無ければ画面全体を金属のレリーフにして動く。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0e;--fg:#d9dde1;--dim:rgba(217,221,225,.5);--line:rgba(217,221,225,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);font-family:Syncopate,-apple-system,"Hiragino Sans",sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:28px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#2a2c30 0%,#0d0d0e 72%)}
#start h1{margin:0;font-weight:700;font-size:min(13vw,78px);letter-spacing:.18em;margin-right:-.18em;
  background:linear-gradient(180deg,#fff 0%,#9aa0a6 45%,#f2f4f6 52%,#5d6268 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#start .t{font-size:9px;letter-spacing:.6em;margin-right:-.6em;color:var(--dim)}
#start p{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:13px;letter-spacing:.1em;color:var(--dim);line-height:1.9}
#go{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:400 10px Syncopate,sans-serif;
  letter-spacing:.45em;padding:15px 34px 15px 40px;cursor:pointer;transition:border-color .3s}
#go:hover{border-color:var(--fg)}
#err{font:12px/1.8 -apple-system,"Hiragino Sans",sans-serif;max-width:340px;min-height:1em;white-space:pre-line;color:#e0a3a3}

.btn{position:fixed;z-index:12;appearance:none;border:0;background:transparent;color:var(--fg);font:400 9px Syncopate,"Hiragino Sans",sans-serif;
  letter-spacing:.3em;padding:10px 8px;display:none;cursor:pointer;opacity:.55;transition:opacity .3s}
.btn.show{display:block}
.btn:hover{opacity:1}
#gear{right:10px;top:calc(env(safe-area-inset-top) + 6px);font-size:14px;letter-spacing:0}
#flip{right:10px;top:calc(env(safe-area-inset-top) + 40px);font-family:-apple-system,"Hiragino Sans",sans-serif;font-size:10px;letter-spacing:.1em}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:12;display:none;justify-content:center;align-items:center;gap:30px}
#bar.show{display:flex}
#bar .btn{position:static;display:block}
#bar #shoot{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--fg);padding:0}
#shoot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--fg);opacity:.8}
#rec.on{opacity:1;color:#e08080}
#status{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:11;font:11px/1.7 -apple-system,"Hiragino Sans",sans-serif;
  color:var(--dim);pointer-events:none;max-width:72vw;white-space:pre-line}

#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 78px);z-index:12;width:min(270px,calc(100vw - 20px));
  background:rgba(13,13,14,.88);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:13px;transition:opacity .25s}
#panel.hide{opacity:0;pointer-events:none}
.chips{display:flex;border:1px solid var(--line)}
.chips button{flex:1;appearance:none;border:0;background:transparent;color:var(--fg);padding:8px 2px;font:400 8px Syncopate,sans-serif;
  letter-spacing:.14em;cursor:pointer;opacity:.5}
.chips button.on{opacity:1;background:rgba(255,255,255,.08)}
#panel label{display:flex;align-items:center;gap:10px;font:11px -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.04em}
#panel label span{width:72px;flex:none;color:var(--dim)}
#panel input[type=range]{flex:1;accent-color:#c9ced3}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <span class="btn show" style="visibility:hidden">● REC</span>
</div>

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">CHROME</button>
    <button data-p="1">BLACK</button>
    <button data-p="2">CHAMPAGNE</button>
  </div>
  <label><span>顔の起伏</span><input type="range" id="sRelief" min="0" max="1" step="0.02" value="0.35"></label>
  <label><span>液面の揺れ</span><input type="range" id="sWave" min="0" max="1" step="0.02" value="0.35"></label>
  <label><span>照明の速さ</span><input type="range" id="sSpin" min="0" max="1" step="0.02" value="0.4"></label>
</div>

<div id="start">
  <div class="t">LIQUID METAL</div>
  <h1>SUIGIN</h1>
  <p>あなたが液体金属の像になる。</p>
  <button id="go">ENTER STUDIO</button>
  <div id="err"></div>
</div>

<script>
'use strict';
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');

const PALS = [ // metal tint, reflectivity floor, backdrop top, backdrop bottom
  { name:'CHROME',    tint:[.93,.95,.97], base:.10, bgT:[.118,.122,.133], bgB:[.043,.043,.047], css:['#0d0d0e','#d9dde1'] },
  { name:'BLACK',     tint:[.55,.57,.60], base:.02, bgT:[.090,.090,.098], bgB:[.030,.030,.032], css:['#08080a','#c4c8cc'] },
  { name:'CHAMPAGNE', tint:[.95,.85,.66], base:.09, bgT:[.125,.110,.094], bgB:[.047,.041,.035], css:['#12100d','#e9d8b4'] },
];
const S = { pal:0, relief:.35, wave:.35, spin:.4 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uVid, uMask, uField;
uniform vec2 uScale, uRes, uVidPx;
uniform float uMirror, uHas, uWhole, uT, uRelief, uWave, uSpin, uBase;
uniform vec3 uTint, uBgT, uBgB;
float lum(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
vec2 toV(vec2 s){ vec2 v = (vec2(s.x, 1. - s.y) - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y); }

// height of the metal at a screen position (camera space in short-edge units)
float height(vec2 s){
  vec2 v = toV(s);
  float f = uWhole > .5 ? .8 : texture(uField, v).r;
  float body = smoothstep(0., 1., f);                        // a dome: the wide blur rounds the whole body
  float face = lum(textureLod(uVid, v, 2.5).rgb);
  vec2 c = s * uRes / min(uRes.x, uRes.y);
  float w = vn(c * 7. + vec2(uT * .23, -uT * .17)) + .5 * vn(c * 15. - vec2(uT * .31, uT * .19));
  return body * .55 + face * uRelief * .12 * body + (w - .75) * uWave * .025 * body;
}
// a studio: backdrop gradient + three softboxes that orbit slowly
vec3 env(vec3 r, float spin){
  float y = r.y;
  vec3 c = vec3(mix(.03, .11, smoothstep(-.7, .8, y)));
  // a big white card behind the camera: flat, front-facing metal reads silver, not black
  c += .42 * smoothstep(.1, 1., r.z) * (.65 + .35 * y);
  float a = atan(r.x, r.z) + spin;
  // two tall softbox strips that orbit, so bright bands slide across the body
  float s1 = smoothstep(.2, .06, abs(sin(a - .9))) * smoothstep(-.6, 0., y) * smoothstep(1., .7, y);
  float s2 = smoothstep(.1, .03, abs(sin(a + 1.4))) * smoothstep(-.4, .2, y);
  // overhead box
  float s3 = smoothstep(.55, .9, y);
  // dark floor
  c *= mix(.35, 1., smoothstep(-.8, -.2, y));
  return c + vec3(s1 * 2.2 + s2 * 2.6 + s3 * 1.3);
}
void main(){
  vec2 v = toV(uv);
  float m = uWhole > .5 ? 1. : (uHas > .5 ? smoothstep(.4, .65, texture(uMask, v).r) : 0.);
  vec2 q = uv - .5; q.x *= uRes.x / uRes.y;
  // backdrop: a sweep of grey paper with a soft pool of light
  vec3 bg = mix(uBgB, uBgT, smoothstep(0., 1., uv.y));
  bg += .05 * exp(-dot(q - vec2(0., .1), q - vec2(0., .1)) * 3.);
  vec3 c = bg;
  if (m > .001){
    vec2 e = 4.5 / uRes;                                    // wider than a field texel: smooth normals, no facets
    float hx = height(uv + vec2(e.x, 0.)) - height(uv - vec2(e.x, 0.));
    float hy = height(uv + vec2(0., e.y)) - height(uv - vec2(0., e.y));
    float k = min(uRes.x, uRes.y) * .5 * (1.2 / 4.5);
    vec3 n = normalize(vec3(-hx * k, -hy * k, 1.));
    vec3 view = vec3(0., 0., -1.);
    vec3 r = reflect(view, n);
    vec3 refl = env(r, uT * uSpin * .126);
    float fres = uBase + (1. - uBase) * pow(1. - max(n.z, 0.), 5.);
    vec3 metal = refl * uTint * (.55 + .45 * fres) + uTint * fres * .25;
    metal = metal / (1. + metal * .6);                        // tone map the softbox highlights
    // a thin dark bevel where the metal meets the air
    float edge = smoothstep(.4, .65, m) * (1. - smoothstep(.65, .95, m));
    metal *= 1. - .5 * edge;
    c = mix(bg, metal, m);
  }
  c *= 1. - .45 * smoothstep(.45, 1.1, length(q));
  float g = h21(floor(gl_FragCoord.xy / 1.5) + fract(uT * 3.7) * 57.) - .5;
  c += g * .025;
  o = vec4(clamp(c, 0., 1.), 1.);
}`;
let P, U = {}, texVid, texMask, texField;
function initGL(){
  const mk = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  P = gl.createProgram(); gl.attachShader(P, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(P, mk(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(P, 0, 'p'); gl.linkProgram(P);
  if (!gl.getProgramParameter(P, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(P));
  gl.useProgram(P);
  const n = gl.getProgramParameter(P, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(P, i); U[u.name] = gl.getUniformLocation(P, u.name); }
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const tex = (unit, minF) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minF); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
  texVid = tex(0, gl.LINEAR_MIPMAP_LINEAR); texMask = tex(1, gl.LINEAR); texField = tex(2, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  gl.activeTexture(gl.TEXTURE2); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, 1, 1, 0, gl.RED, gl.FLOAT, new Float32Array([0]));
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uField, 2);
}

/* ---------- mask → smooth height field (reused buffers) ---------- */
let vidW = 1280, vidH = 720;
const M = { w:0, h:0, f:null, u8:null, present:false, cover:0, has:false, external:false };
const G = { w:0, h:0, a:null, b:null };
function ensureGrid(){
  const gw = vidW >= vidH ? 192 : Math.max(48, Math.round(192 * vidW / vidH));
  const gh = vidW >= vidH ? Math.max(48, Math.round(192 * vidH / vidW)) : 192;
  if (G.w === gw && G.h === gh) return;
  G.w = gw; G.h = gh; G.a = new Float32Array(gw*gh); G.b = new Float32Array(gw*gh);
}
function boxH(src, dst, w, h, r){ const inv = 1/(2*r+1);
  for (let y = 0; y < h; y++){ const o = y*w; let s = 0;
    for (let x = -r; x <= r; x++) s += src[o + Math.min(w-1, Math.max(0, x))];
    for (let x = 0; x < w; x++){ dst[o+x] = s*inv; s += src[o + Math.min(w-1, x+r+1)] - src[o + Math.max(0, x-r)]; } } }
function boxV(src, dst, w, h, r){ const inv = 1/(2*r+1);
  for (let x = 0; x < w; x++){ let s = 0;
    for (let y = -r; y <= r; y++) s += src[Math.min(h-1, Math.max(0, y))*w + x];
    for (let y = 0; y < h; y++){ dst[y*w+x] = s*inv; s += src[Math.min(h-1, y+r+1)*w + x] - src[Math.max(0, y-r)*w + x]; } } }
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || data.length < w*h) return;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.f = new Float32Array(w*h); M.u8 = new Uint8Array(w*h); }
  const F = M.f, U8 = M.u8; let on = 0;
  for (let i = 0, n = w*h; i < n; i++){
    let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1;
    F[i] = F[i]*.35 + m*.65; U8[i] = F[i]*255 | 0; if (F[i] > .5) on++;
  }
  M.cover = on/(w*h); M.present = M.cover > .006; M.has = true;
  ensureGrid();
  const gw = G.w, gh = G.h, A = G.a, B = G.b;
  for (let y = 0; y < gh; y++){
    const my = Math.min(h-1, ((y + .5)/gh*h) | 0) * w;
    for (let x = 0; x < gw; x++) A[y*gw + x] = F[my + Math.min(w-1, ((x + .5)/gw*w) | 0)];
  }
  const r = Math.max(3, Math.round(Math.min(gw, gh) * .085));
  boxH(A, B, gw, gh, r); boxV(B, A, gw, gh, r); boxH(A, B, gw, gh, r); boxV(B, A, gw, gh, r);
  if (gl && texMask){
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, U8);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texField);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, gw, gh, 0, gl.RED, gl.FLOAT, A);
  }
}

/* ---------- MediaPipe (dynamic import; a relief of the whole frame without it) ---------- */
let segmenter = null, lastTs = 0, lastVT = -1, fallback = false;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    setStatus('');
  }catch(e){
    if (M.external) return;
    fallback = true;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n画面全体を金属のレリーフにして続けます。');
  }
}
function segment(now){
  if (!segmenter || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastVT) return; lastVT = vt;
  try{
    const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks;
      if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1];                  // 2 masks → [0] is background, [1] is the person
      ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
    });
  }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  ensureGrid();
}

/* ---------- audio: a low metallic hum + the shutter ---------- */
let actx = null, bus = null, recDest = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .3; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  [55, 82.4, 110.3].forEach((f, i) => {                   // three slow, slightly detuned sines: a studio room tone
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f; g.gain.value = .045 / (i + 1);
    o.connect(g); g.connect(bus); o.start();
  });
  actx.resume().catch(()=>{});
}
function click(){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, len = actx.sampleRate*.025 | 0, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 5);
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 1.2;
  s.connect(f); f.connect(bus); s.start(t);
}

$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!P) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot'].forEach(id => $(id).classList.add('show'));
  if (!started){ started = true; initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
function setPal(i){
  S.pal = i; const p = PALS[i];
  [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
  const r = document.documentElement.style; r.setProperty('--bg', p.css[0]); r.setProperty('--fg', p.css[1]);
}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sRelief','relief'],['sWave','wave'],['sSpin','spin']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

$('shoot').onclick = () => {
  click();
  try{ canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'suigin-' + Date.now() + '.png'; a.click(); }, 'image/png'); }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'suigin.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
function loop(now){
  requestAnimationFrame(loop);
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; ensureGrid(); }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1500 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  if (!M.external) segment(now);
  if (video.readyState < 2) return;
  gl.viewport(0, 0, W, H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); gl.generateMipmap(gl.TEXTURE_2D); } catch(e){ return; }
  const sa = W/H, va = vidW/vidH, sx = sa < va ? sa/va : 1, sy = sa < va ? 1 : va/sa;
  const pal = PALS[S.pal];
  gl.uniform2f(U.uScale, sx, sy); gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(U.uHas, M.has && M.present ? 1 : 0);
  gl.uniform1f(U.uWhole, (fallback && !M.external) || !M.has ? 1 : 0);
  gl.uniform1f(U.uT, now/1000); gl.uniform1f(U.uRelief, S.relief); gl.uniform1f(U.uWave, S.wave); gl.uniform1f(U.uSpin, S.spin);
  gl.uniform1f(U.uBase, pal.base); gl.uniform3fv(U.uTint, pal.tint); gl.uniform3fv(U.uBgT, pal.bgT); gl.uniform3fv(U.uBgB, pal.bgB);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__SUIGIN = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; fallback = false; ingestMask(d, w, h); },
  palette(i){ setPal(i); },
  state: () => ({ present:M.present, cover:M.cover, fallback }),
};
</script>
