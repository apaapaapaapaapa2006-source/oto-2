<title>KIRIE ─ 切って重ねた紙の奥行き</title>
<meta name="description" content="カメラ映像を明るさで切り分け、色紙を重ねた切り絵にするエフェクト。輪郭は画素ではなく本物の曲線として切り出されるので、どれだけ拡大しても刃の跡のままなめらか。手を開くと層が離れて影が落ち、手を動かすと視差でずれる。">
<meta name="theme-color" content="#efe4cf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  KIRIE ─ 切り絵                              ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   生成 kinari  #efe4cf  paper ground, the box the diorama sits in
            砂子 sunago  #d9c9a8  the shallow shadow paper casts on paper
            蒅   sukumo  #43362a  the cut face, where the blade went through
            墨   sumi    #2a2521  type
            ── the sheets themselves are NOT in this palette. Each one takes
            the hue of the band of the picture it came from and has only its
            VALUE forced onto an even ladder, because five averaged browns
            all read as one sheet.
            MOOD: a paper-cut diorama in a shallow box on a table, lit from
            the upper left by window light. Matte, warm, handmade, and with
            no glow anywhere — nothing in this piece is emissive.

  BACKGROUND  Washi: a warm ground with visible fibres that gets warmer, never
            blacker, toward the edge — paper does not vignette into shadow.

  TYPE      Klee One, the only handwritten face in the collection, because the
            labels on a craft box are written by hand rather than set.

  MOTION    Paper is stiff. Sheets slide and separate; they never bounce,
            stretch or fade. One smoothed follow, no springs, no overshoot.
            The CUTS themselves are damped in time as well as space, so the
            outlines breathe instead of boiling — a cut line that flickers
            frame to frame stops reading as an object.

  SIGNATURE THE CUT IS A REAL CURVE, NOT A ROW OF PIXELS. Each brightness band
            is traced with marching squares into closed loops with sub-pixel
            crossings, smoothed by Chaikin subdivision, then filled as one
            even-odd path — so an island inside a hole inside a sheet comes
            out right, and the edge stays a curve at any zoom. Two things
            follow from working in outlines instead of pixels. A loop whose
            enclosed area is below a threshold is DISCARDED, because a blade
            cannot cut a speck and a papercut artist simplifies; and the grid
            the cuts are traced from can stay coarse on purpose, since its
            resolution now sets how much detail the knife bothers with rather
            than how blocky the result looks. There is also real air between
            the sheets: opening your hand pulls the stack apart, each sheet
            casting onto the one behind it, and moving it slides them at
            different rates so the parallax tells you the depth.
  ══════════════════════════════════════════════════════════════════════════
-->

<body>

<canvas id="view"></canvas>

<div class="chrome" id="top">
  <div class="tag" id="name"><b>切り絵</b><span>KIRIE</span></div>

</div>

<div id="start">
  <div class="en">PAPER-CUT DIORAMA</div>
  <h1>切り絵</h1>
  <div class="rule"></div>
  <p>カメラに映るものを明るさで切り分けて、色紙を重ねた切り絵にします。<br>
     紙と紙のあいだには隙間があります。<br>
     <b>手を開くと</b>層が離れ、<b>手を動かすと</b>ずれます。</p>
  <button id="go" type="button">紙を切る</button>
  <div style="font-size:11px;opacity:.5">カメラを使います</div>
</div>

<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
(function(){
'use strict';

var view = document.getElementById('view'), ctx = view.getContext('2d');
var startEl = document.getElementById('start'), goBtn = document.getElementById('go');
var errBox = document.getElementById('err'), statEl = document.getElementById('stat');
var hintEl = document.getElementById('hint');
var flipBtn = document.getElementById('flipBtn');
var layerBtn = document.getElementById('layerBtn'), layerLbl = document.getElementById('layerLbl');
var fineBtn = document.getElementById('fineBtn'), fineLbl = document.getElementById('fineLbl');
var invBtn = document.getElementById('invBtn'), invLbl = document.getElementById('invLbl');
var saveBtn = document.getElementById('saveBtn');
var sndBtn = document.getElementById('sndBtn'), sndLbl = document.getElementById('sndLbl');

var video = document.createElement('video');
video.playsInline = true; video.muted = true;
video.setAttribute('playsinline',''); video.autoplay = true;
function now(){ return performance.now(); }

// ═══════════════════════════════════════════════════════════════════════
//  CUTTING — marching squares into closed loops
// ═══════════════════════════════════════════════════════════════════════
// Every grid edge the iso-line crosses is crossed exactly once, so the edge
// index is a stable identity for that crossing and neighbouring cells agree on
// it by construction. Loop assembly is then exact: pair the edges inside each
// cell, then walk the pairing. No point hashing and no epsilon anywhere.
function contours(f, W, H, T, minArea){
  var hN = W * (H + 1);
  var pxs = new Map(), link = new Map();
  function cross(a, b){ var d = b - a; return d === 0 ? 0.5 : (T - a) / d; }
  function pair(e1, e2){
    var l1 = link.get(e1); if (l1) l1.push(e2); else link.set(e1, [e2]);
    var l2 = link.get(e2); if (l2) l2.push(e1); else link.set(e2, [e1]);
  }
  for (var y = 0; y < H - 1; y++){
    for (var x = 0; x < W - 1; x++){
      var a = f[y * W + x],           b = f[y * W + x + 1];
      var c = f[(y + 1) * W + x + 1], d = f[(y + 1) * W + x];
      var code = (a >= T ? 1 : 0) | (b >= T ? 2 : 0) | (c >= T ? 4 : 0) | (d >= T ? 8 : 0);
      if (code === 0 || code === 15) continue;
      // var is function-scoped, so these must be cleared or a cell inherits
      // the previous cell's crossings and never pairs cleanly
      var top, right, bottom, left;
      top = right = bottom = left = undefined;
      if (code & 1 ? !(code & 2) : !!(code & 2)){
        top = y * W + x;
        if (!pxs.has(top)) pxs.set(top, [x + cross(a, b), y]);
      }
      if (code & 2 ? !(code & 4) : !!(code & 4)){
        right = hN + y * (W + 1) + x + 1;
        if (!pxs.has(right)) pxs.set(right, [x + 1, y + cross(b, c)]);
      }
      if (code & 8 ? !(code & 4) : !!(code & 4)){
        bottom = (y + 1) * W + x;
        if (!pxs.has(bottom)) pxs.set(bottom, [x + cross(d, c), y + 1]);
      }
      if (code & 1 ? !(code & 8) : !!(code & 8)){
        left = hN + y * (W + 1) + x;
        if (!pxs.has(left)) pxs.set(left, [x, y + cross(a, d)]);
      }
      if (code === 5 || code === 10){
        var mid = (a + b + c + d) * 0.25;
        var flip = (code === 5) ? (mid < T) : (mid >= T);
        if (flip){ pair(top, left); pair(right, bottom); }
        else     { pair(top, right); pair(bottom, left); }
      } else {
        var e = [];
        if (top !== undefined) e.push(top);
        if (right !== undefined) e.push(right);
        if (bottom !== undefined) e.push(bottom);
        if (left !== undefined) e.push(left);
        if (e.length === 2) pair(e[0], e[1]);
      }
    }
  }
  var loops = [], seen = new Set(), limit = pxs.size * 2 + 8;
  link.forEach(function(_, start){
    if (seen.has(start)) return;
    var loop = [], cur = start, prev = -1, guard = 0;
    while (cur !== undefined && !seen.has(cur) && guard++ < limit){
      seen.add(cur);
      loop.push(pxs.get(cur));
      var ns = link.get(cur), nxt;
      if (!ns) break;
      for (var i = 0; i < ns.length; i++){
        if (ns[i] !== prev && !seen.has(ns[i])){ nxt = ns[i]; break; }
      }
      prev = cur; cur = nxt;
    }
    if (loop.length < 4) return;
    var A = 0;
    for (var k = 0, n = loop.length; k < n; k++){
      var p = loop[k], q = loop[(k + 1) % n];
      A += p[0] * q[1] - q[0] * p[1];
    }
    // a blade cannot cut a speck, so specks are not cut
    if (Math.abs(A * 0.5) >= minArea) loops.push(loop);
  });
  return loops;
}

// Chaikin: each pass replaces a corner with two points a quarter in, which is
// exactly what turns a staircase into a curve. Area is preserved.
function smooth(pts, passes){
  for (var p = 0; p < passes; p++){
    var n = pts.length, out = new Array(n * 2);
    for (var i = 0; i < n; i++){
      var a = pts[i], b = pts[(i + 1) % n];
      out[i * 2]     = [a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25];
      out[i * 2 + 1] = [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75];
    }
    pts = out;
  }
  return pts;
}

// torn-paper wobble that runs ALONG the cut, rather than noise on the pixels
function deckle(pts, amp, seed){
  var n = pts.length, out = new Array(n);
  for (var i = 0; i < n; i++){
    var p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    var tx = b[0] - a[0], ty = b[1] - a[1];
    var L = Math.hypot(tx, ty) || 1;
    var nx = ty / L, ny = -tx / L;
    // two incommensurate periods so the edge never falls into a scallop
    var w = Math.sin(i * 0.0731 + seed) * 0.62 + Math.sin(i * 0.0194 + seed * 1.7) * 0.38;
    out[i] = [p[0] + nx * w * amp, p[1] + ny * w * amp];
  }
  return out;
}

// ═══════════════════════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════════════════════
var W = 0, H = 0, dpr = 1;
var small = document.createElement('canvas'), sctx = small.getContext('2d', { willReadFrequently:true });
var gw = 0, gh = 0, fw = 0, fh = 0;   // fw/fh are gw/gh plus a one-cell border
var field = null, tmpF = null, fibre = null;

var FINE = [{ n:'粗', L:90 }, { n:'並', L:140 }, { n:'細', L:210 }];
var fi = 1;

function buildFibre(){
  var c = document.createElement('canvas'); c.width = c.height = 300;
  var x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 300, 300);
  x.strokeStyle = 'rgba(120,100,70,0.055)';
  for (var i = 0; i < 240; i++){
    var px = Math.random() * 300, py = Math.random() * 300;
    var a = Math.random() * Math.PI, L = 6 + Math.random() * 34;
    x.lineWidth = 0.5 + Math.random();
    x.beginPath(); x.moveTo(px, py);
    x.lineTo(px + Math.cos(a) * L, py + Math.sin(a) * L); x.stroke();
  }
  fibre = c;
}
buildFibre();

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(window.innerWidth * dpr));
  H = Math.max(1, Math.round(window.innerHeight * dpr));
  view.width = W; view.height = H;
  view.style.width = window.innerWidth + 'px';
  view.style.height = window.innerHeight + 'px';

  var L = FINE[fi].L;
  if (W >= H){ gw = L; gh = Math.max(8, Math.round(L * H / W)); }
  else       { gh = L; gw = Math.max(8, Math.round(L * W / H)); }
  small.width = gw; small.height = gh;
  // A region touching the frame never closes: marching squares finds no
  // crossing on the outermost edges, the chain just stops, and closePath then
  // joins the two ends with a straight chord right across the picture. Pad the
  // field with a ring below every threshold and every region becomes interior.
  fw = gw + 2; fh = gh + 2;
  field = new Float32Array(fw * fh);
  tmpF  = new Float32Array(fw * fh);
  primed = false; sheets = [];
}

// ═══════════════════════════════════════════════════════════════════════
//  SOUND — paper only
// ═══════════════════════════════════════════════════════════════════════
var ac = null, master = null, muted = false;
function initAudio(){
  if (ac) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.5;
  master.connect(ac.destination);
  var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.25;
  var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
  var g = ac.createGain(); g.gain.value = 0.05;
  src.connect(lp); lp.connect(g); g.connect(master); src.start();
}
var lastRustle = 0;
function rustle(amt){
  if (!ac || muted) return;
  var t = now();
  if (t - lastRustle < 90) return;
  lastRustle = t;
  var T = ac.currentTime, n = (ac.sampleRate * 0.13) | 0;
  var buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
  for (var i = 0; i < n; i++){ var e = 1 - i / n; ch[i] = (Math.random() * 2 - 1) * e * e; }
  var s = ac.createBufferSource(); s.buffer = buf;
  var bp = ac.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 2600 + Math.random() * 2600; bp.Q.value = 0.7;
  var gg = ac.createGain(); gg.gain.value = Math.min(0.22, amt * 0.3);
  s.connect(bp); bp.connect(gg); gg.connect(master);
  s.start(T); s.stop(T + 0.15);
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing = 'user', mirror = true, stream = null;
function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display = 'block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } },
    audio:false
  }).then(function(st){
    stream = st; video.srcObject = st; mirror = (facing === 'user');
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing === 'user') ? 'environment' : 'user';
  loseHand(); primed = false;
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  HAND
// ═══════════════════════════════════════════════════════════════════════
var hands = null, mpCamera = null, mpReady = false;
var lm = null, lastHandT = -1e9, LOST_MS = 340;
var TIPS = [8,12,16,20], PIPS = [6,10,14,18];
function initHands(){
  if (typeof window.Hands !== 'function') return false;
  try {
    hands = new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
    }});
    hands.setOptions({ maxNumHands:1, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady = true; return true;
  } catch(e){ return false; }
}
function validLm(c){
  if (!c || c.length < 21) return null;
  for (var i = 0; i < 21; i++){
    var p = c[i];
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' ||
        !isFinite(p.x) || !isFinite(p.y)) return null;
  }
  return c;
}
function onHands(res){
  var c = (res && res.multiHandLandmarks && res.multiHandLandmarks.length)
        ? validLm(res.multiHandLandmarks[0]) : null;
  if (c){ lm = c; lastHandT = now(); }
}
function loseHand(){ lm = null; lastHandT = -1e9; }
function startMpCamera(){
  if (!mpReady || typeof window.Camera !== 'function') return;
  try {
    if (mpCamera && mpCamera.stop) mpCamera.stop();
    mpCamera = new window.Camera(video, {
      onFrame:function(){
        if (!hands || !running) return Promise.resolve();
        return hands.send({ image:video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  } catch(e){ mpReady = false; }
}
function readHand(){
  if (!lm || now() - lastHandT > LOST_MS) return null;
  var ids = [0,5,9,13,17], cx = 0, cy = 0, i;
  for (i = 0; i < ids.length; i++){ cx += lm[ids[i]].x; cy += lm[ids[i]].y; }
  cx /= ids.length; cy /= ids.length;
  var wr = lm[0], span = Math.hypot(lm[5].x - lm[17].x, lm[5].y - lm[17].y);
  if (!isFinite(span) || span <= 0) return null;
  var ext = 0;
  for (i = 0; i < TIPS.length; i++){
    var dt = Math.hypot(lm[TIPS[i]].x - wr.x, lm[TIPS[i]].y - wr.y);
    var dp = Math.hypot(lm[PIPS[i]].x - wr.x, lm[PIPS[i]].y - wr.y);
    if (dt > dp * 1.05) ext++;
  }
  return { x: mirror ? 1 - cx : cx, y: cy, open: ext / 4 };
}

// ═══════════════════════════════════════════════════════════════════════
//  THE STACK
// ═══════════════════════════════════════════════════════════════════════
var N = 5, brightFront = true, primed = false;
var thr = [], cols = [], sheets = [];
var sep = 0, sepT = 0, panX = 0, panY = 0, panXT = 0, panYT = 0;
var HIST = new Uint32Array(64);

function resetStack(){
  thr = []; cols = []; sheets = []; primed = false;
  for (var k = 0; k < N; k++){ thr.push(255 * (k + 1) / (N + 1)); cols.push([200,190,170]); }
}
resetStack();

function analyse(){
  var vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh || video.readyState < 2) return false;
  var sc = Math.max(gw / vw, gh / vh), dw = vw * sc, dh = vh * sc;
  sctx.save();
  if (mirror){ sctx.translate(gw, 0); sctx.scale(-1, 1); }
  sctx.drawImage(video, (gw - dw) / 2, (gh - dh) / 2, dw, dh);
  sctx.restore();

  var src = sctx.getImageData(0, 0, gw, gh).data;
  var n = gw * gh, i, k, x, y;

  // A cut line that flickers frame to frame stops reading as an object, so the
  // field is damped in time before anything is traced from it.
  for (y = 0; y < gh; y++){
    for (x = 0; x < gw; x++){
      var q = ((y * gw + x) << 2);
      var v = (src[q] * 77 + src[q+1] * 150 + src[q+2] * 29) >> 8;
      var fi2 = (y + 1) * fw + (x + 1);
      tmpF[fi2] = primed ? field[fi2] + (v - field[fi2]) * 0.30 : v;
    }
  }
  // and smoothed in space, so the blade follows form rather than sensor grain.
  // Sampling is clamped inside the interior so the border never bleeds in.
  for (y = 1; y <= gh; y++){
    for (x = 1; x <= gw; x++){
      var xa = x > 1 ? x - 1 : 1, xb = x < gw ? x + 1 : gw;
      field[y * fw + x] = (tmpF[y * fw + xa] + tmpF[y * fw + x] * 2 + tmpF[y * fw + xb]) * 0.25;
    }
  }
  for (x = 1; x <= gw; x++){
    for (y = 1; y <= gh; y++){
      var ya = y > 1 ? y - 1 : 1, yb = y < gh ? y + 1 : gh;
      tmpF[y * fw + x] = (field[ya * fw + x] + field[y * fw + x] * 2 + field[yb * fw + x]) * 0.25;
    }
  }
  for (y = 1; y <= gh; y++) for (x = 1; x <= gw; x++) field[y * fw + x] = tmpF[y * fw + x];
  for (x = 0; x < fw; x++){ field[x] = -1; field[(fh - 1) * fw + x] = -1; }
  for (y = 0; y < fh; y++){ field[y * fw] = -1; field[y * fw + fw - 1] = -1; }

  HIST.fill(0);
  for (y = 1; y <= gh; y++){
    for (x = 1; x <= gw; x++){
      var b = field[y * fw + x] | 0;
      HIST[(b < 0 ? 0 : b > 255 ? 255 : b) >> 2]++;
    }
  }

  // cut lines by equal-area quantile, so every sheet holds about the same
  // amount of paper whatever the light is doing
  var want = n / N, acc = 0, next = 1;
  for (k = 0; k < 64 && next < N; k++){
    acc += HIST[k];
    while (next < N && acc >= want * next){
      var t = k * 4 + 2;
      thr[next - 1] = primed ? thr[next - 1] + (t - thr[next - 1]) * 0.12 : t;
      next++;
    }
  }
  while (next < N){ thr[next - 1] = 250; next++; }
  // When one histogram bin holds a lot of mass, several quantiles land in it
  // and two sheets get cut along the SAME line — coincident paper whose
  // translucent shadows stack into a ghost. Force the cuts apart.
  var MIN_GAP = 6;
  for (k = 1; k < N - 1; k++){
    if (thr[k] < thr[k - 1] + MIN_GAP) thr[k] = thr[k - 1] + MIN_GAP;
  }
  for (k = N - 2; k >= 0; k--){
    if (thr[k] > 252 - (N - 2 - k) * MIN_GAP) thr[k] = 252 - (N - 2 - k) * MIN_GAP;
  }

  var sumR = new Float64Array(N), sumG = new Float64Array(N),
      sumB = new Float64Array(N), cnt = new Float64Array(N);
  for (y = 0; y < gh; y++){
    for (x = 0; x < gw; x++){
      var L = field[(y + 1) * fw + (x + 1)], bnd = 0;
      while (bnd < N - 1 && L >= thr[bnd]) bnd++;
      var qq = (y * gw + x) << 2;
      sumR[bnd] += src[qq]; sumG[bnd] += src[qq+1]; sumB[bnd] += src[qq+2]; cnt[bnd]++;
    }
  }
  for (k = 0; k < N; k++){
    var c = cnt[k] || 1;
    var r = sumR[k] / c, g = sumG[k] / c, bl = sumB[k] / c;
    var yy = r * 0.299 + g * 0.587 + bl * 0.114;
    // keep the band's hue, put its value on an even ladder
    var Lt = 58 + 176 * (N > 1 ? k / (N - 1) : 0.5);
    r = Lt + (r - yy) * 0.62 + 6; g = Lt + (g - yy) * 0.62 + 2; bl = Lt + (bl - yy) * 0.62 - 4;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g));
    bl = Math.max(0, Math.min(255, bl));
    if (!primed) cols[k] = [r, g, bl];
    else { cols[k][0] += (r - cols[k][0]) * 0.10;
           cols[k][1] += (g - cols[k][1]) * 0.10;
           cols[k][2] += (bl - cols[k][2]) * 0.10; }
  }
  primed = true;
  return true;
}

// Trace every sheet. Runs at the cut rate, not the frame rate — the hand moves
// paper that has already been cut.
var cutMs = 8;
function cutAll(){
  if (!primed) return;
  var t0 = now();
  var minArea = Math.max(2.5, (gw * gh) * 0.00035);
  var out = [];
  for (var k = 0; k < N; k++){
    var paths = [];
    if (k > 0){
      var T = brightFront ? thr[k - 1] : thr[N - 1 - k];
      var loops = contours(field, fw, fh, T, minArea);
      for (var i = 0; i < loops.length; i++){
        paths.push(deckle(smooth(loops[i], 2), 0.30, i * 3.7 + k));
      }
    }
    out.push({ full: k === 0, paths: paths, band: brightFront ? k : (N - 1 - k) });
  }
  sheets = out;
  cutMs = cutMs * 0.8 + (now() - t0) * 0.2;
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAWING — vectors straight onto the display, at full device resolution
// ═══════════════════════════════════════════════════════════════════════
// The contours bound {field >= T}. When the dark end is in front we want the
// other side of the same cut, and an even-odd path with the whole canvas added
// as one more subpath is exactly the complement.
function tracePath(paths, sx, sy, invert){
  ctx.beginPath();
  if (invert) ctx.rect(-8, -8, W + 16, H + 16);
  for (var i = 0; i < paths.length; i++){
    var p = paths[i];
    if (p.length < 3) continue;
    ctx.moveTo((p[0][0] - 1) * sx, (p[0][1] - 1) * sy);
    for (var j = 1; j < p.length; j++) ctx.lineTo((p[j][0] - 1) * sx, (p[j][1] - 1) * sy);
    ctx.closePath();
  }
}

function drawStack(){
  if (!sheets.length) return;
  var sx = W / (gw - 1), sy = H / (gh - 1);   // contour coords are padded by 1
  var u = Math.min(W, H);
  var gap = (0.006 + sep * 0.030) * u;
  var slide = (0.004 + sep * 0.028) * u;

  var beneath = cols[sheets[0].band] || [180,170,150];
  for (var k = 0; k < sheets.length; k++){
    var sh = sheets[k];
    var c = cols[sh.band] || [180,170,150];
    var fillC = 'rgb(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ')';
    // A shadow on opaque paper is the sheet beneath, darker — not a wash. Drawn
    // translucent it accumulates: seven nested sheets pile seven browns on top
    // of one another and the stack turns to mush.
    var sd = 0.60 - sep * 0.10, sd2 = 0.76 - sep * 0.08;
    var shA = 'rgb(' + (beneath[0]*sd|0) + ',' + (beneath[1]*sd|0) + ',' + (beneath[2]*sd|0) + ')';
    var shB = 'rgb(' + (beneath[0]*sd2|0) + ',' + (beneath[1]*sd2|0) + ',' + (beneath[2]*sd2|0) + ')';
    var dx = panX * slide * k, dy = panY * slide * k * 0.6 - gap * k * 0.16;
    var lift = gap * k;

    if (sh.full){
      ctx.save(); ctx.translate(dx, dy);
      ctx.fillStyle = fillC; ctx.fillRect(-4, -4, W + 8, H + 8);
      ctx.restore();
      beneath = c;
      continue;
    }
    if (!sh.paths.length) continue;

    // cast shadow: the same outline, filled twice at a slight offset. Vector
    // fills are cheap, and canvas shadowBlur re-blurs the whole layer on every
    // draw — it cost 30ms of a 64ms frame in the version this replaces.
    ctx.save();
    ctx.translate(dx + lift * 0.5 + u * 0.002, dy + lift * 0.7 + u * 0.003);
    tracePath(sh.paths, sx, sy, !brightFront);
    ctx.fillStyle = shA;
    ctx.fill('evenodd');
    ctx.restore();
    ctx.save();
    ctx.translate(dx + lift * 0.22 + u * 0.001, dy + lift * 0.32 + u * 0.0015);
    tracePath(sh.paths, sx, sy, !brightFront);
    ctx.fillStyle = shB;
    ctx.fill('evenodd');
    ctx.restore();

    ctx.save();
    ctx.translate(dx, dy);
    tracePath(sh.paths, sx, sy, !brightFront);
    ctx.fillStyle = fillC;
    ctx.fill('evenodd');
    // the cut face: the thickness of the sheet, catching the light. Retraced
    // without the inversion rect so the screen border is not stroked.
    tracePath(sh.paths, sx, sy, false);
    ctx.strokeStyle = 'rgba(67,54,42,0.34)';
    ctx.lineWidth = Math.max(0.8, u * 0.0016);
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
    beneath = c;
  }
}

function drawPaper(){
  var g = ctx.createRadialGradient(W * 0.34, H * 0.22, Math.min(W,H) * 0.1,
                                   W * 0.5, H * 0.5, Math.max(W,H) * 0.78);
  g.addColorStop(0, '#f6ecd9');
  g.addColorStop(1, '#e2d3b6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawFibre(){
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.42;
  var s = Math.min(W, H) * 0.55;
  for (var y = 0; y < H; y += s) for (var x = 0; x < W; x += s) ctx.drawImage(fibre, x, y, s, s);
  ctx.restore();
}
function drawHandMark(h){
  if (!h) return;
  var u = Math.min(W, H), x = h.x * W, y = h.y * H;
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.strokeStyle = '#2a2521';
  ctx.lineWidth = Math.max(1, u * 0.0022);
  var r = u * (0.020 + h.open * 0.026);
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha = 0.25;
  ctx.beginPath(); ctx.arc(x, y, r * 0.30, 0, 6.2832); ctx.stroke();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var running = false, lastCut = 0, lastStat = 0, startedAt = 0, frameMs = 16, lastFrame = 0;
function loop(){
  requestAnimationFrame(loop);
  if (!running) return;
  var t = now();
  if (lastFrame){ var dt = t - lastFrame; if (dt < 400) frameMs = frameMs * 0.9 + dt * 0.1; }
  lastFrame = t;

  var h = readHand();
  var targetSep = h ? h.open : 0;
  var targetX = h ? (h.x - 0.5) * 2 : 0;
  var targetY = h ? (h.y - 0.5) * 2 : 0;
  var prevSep = sep, prevX = panX;
  sepT += (targetSep - sepT) * 0.10; sep = sepT;
  panXT += (targetX - panXT) * 0.10; panX = panXT;
  panYT += (targetY - panYT) * 0.10; panY = panYT;
  var moved = Math.abs(sep - prevSep) * 4 + Math.abs(panX - prevX);
  if (moved > 0.012) rustle(moved);

  // re-cut at a calm rate; between cuts the hand only moves the paper
  if (t - lastCut >= 70){
    if (analyse()){ cutAll(); lastCut = t; }
  }

  drawPaper();
  drawStack();
  drawFibre();
  drawHandMark(h);

  if (t - lastStat > 400){
    lastStat = t;
    var np = 0;
    for (var k = 0; k < sheets.length; k++) np += sheets[k].paths ? sheets[k].paths.length : 0;
    statEl.textContent = N + '枚 ・ ' + np + '片';
  }
  if (h && t - startedAt > 8000 && hintEl.style.opacity !== '0') hintEl.style.opacity = '0';
}

// ═══════════════════════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════════════════════
var LAYER_OPTS = [3, 5, 7];
layerBtn.addEventListener('click', function(){
  N = LAYER_OPTS[(LAYER_OPTS.indexOf(N) + 1) % LAYER_OPTS.length];
  layerLbl.textContent = String(N);
  resetStack();
});
fineBtn.addEventListener('click', function(){
  fi = (fi + 1) % FINE.length;
  fineLbl.textContent = FINE[fi].n;
  resize(); resetStack();
});
invBtn.addEventListener('click', function(){
  brightFront = !brightFront;
  invLbl.textContent = brightFront ? '明' : '暗';
  cutAll();
});
sndBtn.addEventListener('click', function(){
  muted = !muted; sndLbl.textContent = muted ? 'OFF' : 'ON';
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.5, ac.currentTime, 0.2);
});
saveBtn.addEventListener('click', function(){
  if (!running) return;
  try {
    view.toBlob(function(blob){
      if (!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'kirie_' + Date.now() + '.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    }, 'image/png');
  } catch(e){ showError(e); }
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

goBtn.addEventListener('click', function(){
  goBtn.textContent = 'よみこみ中';
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
  startStream().then(function(){
    if (initHands()) startMpCamera();
    startEl.classList.add('gone');
    running = true; startedAt = now();
    goBtn.textContent = '紙を切る';
  }).catch(function(e){ goBtn.textContent = '紙を切る'; showError(e); });
});

resize();
drawPaper();
requestAnimationFrame(loop);

window.__KIRIE__ = {
  feed: function(l){ onHands({ multiHandLandmarks:[l] }); },
  contours: contours, smooth: smooth,
  state: function(){
    var np = 0, per = [];
    for (var k = 0; k < sheets.length; k++){
      var c = sheets[k].paths ? sheets[k].paths.length : 0;
      per.push(c); np += c;
    }
    return { running:running, primed:primed, N:N, brightFront:brightFront, fine:FINE[fi].n,
             gw:gw, gh:gh, sep:sep, panX:panX, frameMs:frameMs, cutMs:cutMs,
             thr:thr.map(Math.round), cols:cols.map(function(c){ return c.map(Math.round); }),
             pieces:np, perSheet:per };
  }
};

})();
</script>
