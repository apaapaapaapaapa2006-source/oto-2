<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IAI ─ 一閃の間合い</title>
<meta name="description" content="夕日を背にした影と向かい合う一本勝負。手を掲げて構え、合図の「斬」が出た刹那に振り下ろす。早まれば負け、遅れれば斬られる。反応の速さだけで決まる居合の対決。">
<meta name="theme-color" content="#efe7d6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Bebas+Neue&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  IAI ─ 一閃の間合い                          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   生成 kinari   #efe7d6   the washi the whole duel is printed on
            墨   sumi     #17150f   the opponent, the blade, every letter
            丹   ni       #c0392b   the sun, and the one instant of blood
            金  kin       #c8a44a   the edge of the blade, and a win
            薄墨 usuzumi  #7a7364   the horizon, the rules, the quiet text
            MOOD: a woodblock print of a duel at sundown. Warm paper, four
            inks, no gradients that a printer could not pull. This is the
            gallery's brightest piece on purpose — everything else made
            tonight goes dark, and a duel reads hardest in full daylight.
  BACKGROUND  Flat kinari paper with a real grain tile, one enormous
            vermilion sun disc, and a single horizon rule. Nothing moves in
            the background, ever. All motion in this piece is a person.
  TYPE      Yuji Syuku — a brush-cut 明朝 with a dry, splitting stroke, used
            at enormous size for the four kanji that run the match
            (構・斬・勝・負). Bebas Neue, condensed and all-caps, for the
            millisecond readouts: a stopwatch face against a brush face.
  MOTION    静と一閃. Long, completely still holds; then state changes
            happen in ONE frame with no tween at all — that hard cut IS the
            motion language. The only easing in the piece is follow-through:
            ink settling, the split halves drifting apart on an ease-out,
            the sun never moving. Hit-stop of 90ms on every resolution.
  SIGNATURE The screen is cut. On every decided round the finished frame is
            sliced along the angle your own blade travelled, and the two
            halves slide apart along the cut, showing paper through the gap.
            You are not watching a slash effect; the picture itself is the
            thing that gets cut.
  AUDIO     Filtered-noise percussion plus one metallic FM voice. The draw
            is white noise through a bandpass swept 6k→400Hz in 90ms with a
            2.2kHz FM ping on top; the signal is a 拍子木 wood clack (noise,
            highpassed, 12ms decay); the 構え is a 55Hz sine heartbeat that
            speeds up the longer the wait runs, which is the only thing in
            the piece that tells you tension is building.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#efe7d6;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{font-family:'Yuji Syuku',serif;color:#17150f;
    touch-action:none;user-select:none;-webkit-user-select:none}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block}
  #video{position:fixed;width:2px;height:2px;opacity:.001;pointer-events:none;left:0;top:0}

  /* ── hud ────────────────────────────────────────────── */
  .hud{position:fixed;left:0;right:0;top:0;padding:
    calc(env(safe-area-inset-top,0px) + 14px) 16px 0;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;z-index:5}
  .ttl{font-size:15px;letter-spacing:.34em;line-height:1}
  .sub{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:.3em;
    color:#7a7364;margin-top:7px}
  .pips{display:flex;gap:7px;margin-top:12px}
  .pip{width:13px;height:13px;border:1.5px solid #7a7364;border-radius:50%}
  .pip.w{background:#17150f;border-color:#17150f}
  .pip.l{background:#c0392b;border-color:#c0392b}
  .btns{display:flex;flex-direction:column;gap:8px;align-items:flex-end;
    pointer-events:auto}
  button{font-family:'Yuji Syuku',serif;font-size:12.5px;letter-spacing:.16em;
    color:#17150f;background:rgba(239,231,214,.86);border:1.5px solid #17150f;
    border-radius:2px;padding:8px 13px;cursor:pointer;line-height:1;
    transition:background .12s,color .12s}
  button:active{background:#17150f;color:#efe7d6}
  .val{font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;margin-left:6px}

  /* ── readout ────────────────────────────────────────── */
  .read{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    text-align:center;pointer-events:none;z-index:5}
  .rd-msg{font-size:16px;letter-spacing:.3em;color:#17150f;min-height:20px}
  .rd-ms{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;
    letter-spacing:.06em;margin-top:6px;min-height:44px}
  .rd-ms small{font-size:16px;color:#7a7364;margin-left:4px}
  .rd-vs{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.22em;
    color:#7a7364;margin-top:4px;min-height:15px}

  /* ── overlays ───────────────────────────────────────── */
  .sheet{position:fixed;inset:0;z-index:20;background:#efe7d6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px;gap:0}
  .sheet.gone{display:none}
  .sheet h1{font-size:clamp(46px,17vw,88px);letter-spacing:.16em;line-height:1;
    text-indent:.16em}
  .sheet .en{font-family:'Bebas Neue',sans-serif;font-size:12px;
    letter-spacing:.46em;color:#7a7364;margin-top:14px;text-indent:.46em}
  .lead{font-size:14px;line-height:2.1;color:#3a352c;margin-top:22px;
    max-width:23em;letter-spacing:.04em}
  .go{margin-top:26px;font-size:17px;letter-spacing:.4em;padding:14px 30px;
    text-indent:.4em;background:#17150f;color:#efe7d6}
  .go:active{background:#c0392b;border-color:#c0392b}
  .foot{margin-top:16px;font-family:'Bebas Neue',sans-serif;font-size:10px;
    letter-spacing:.28em;color:#9a9282}
  .hr{width:54px;height:1px;background:#c9c0ab;margin:20px 0}

  /* ── the 3-second diagram ───────────────────────────── */
  .dia{width:186px;height:104px;position:relative;margin-top:6px}
  .dia .fl{position:absolute;left:0;right:0;bottom:16px;height:1px;background:#d6cdb8}
  .dia .hd{position:absolute;left:50%;width:26px;height:26px;margin-left:-13px;
    border:2px solid #17150f;border-radius:13px 13px 4px 4px;top:8px;
    animation:iaiHand 2.6s cubic-bezier(.2,0,.1,1) infinite}
  .dia .cut{position:absolute;left:14px;right:14px;top:62px;height:2px;
    background:#c0392b;transform:scaleX(0);transform-origin:right center;
    animation:iaiCut 2.6s cubic-bezier(.2,0,.1,1) infinite}
  .dia .sig{position:absolute;left:50%;top:24px;margin-left:-14px;width:28px;
    text-align:center;font-size:20px;color:#c0392b;opacity:0;
    animation:iaiSig 2.6s steps(1) infinite}
  .dia .lb{position:absolute;bottom:-4px;font-family:'Bebas Neue',sans-serif;
    font-size:9px;letter-spacing:.2em;color:#9a9282}
  .dia .lb.a{left:2px}.dia .lb.b{right:2px}
  @keyframes iaiHand{
    0%,44%{transform:translateY(0)}
    52%{transform:translateY(56px)}
    72%{transform:translateY(56px)}
    100%{transform:translateY(0)}}
  @keyframes iaiSig{0%,40%{opacity:0}41%,66%{opacity:1}67%,100%{opacity:0}}
  @keyframes iaiCut{
    0%,46%{transform:scaleX(0);opacity:1}
    54%,70%{transform:scaleX(1);opacity:1}
    86%,100%{transform:scaleX(1);opacity:0}}

  /* ── result sheet ───────────────────────────────────── */
  #result{background:rgba(239,231,214,.965)}
  .verd{font-size:clamp(62px,22vw,120px);letter-spacing:.1em;line-height:1;
    text-indent:.1em}
  .verd.win{color:#17150f}
  .verd.lose{color:#c0392b}
  .stats{display:flex;gap:30px;margin-top:24px}
  .st{text-align:center}
  .st b{display:block;font-family:'Bebas Neue',sans-serif;font-size:32px;
    line-height:1;letter-spacing:.04em;font-weight:400}
  .st span{display:block;font-size:10px;letter-spacing:.2em;color:#7a7364;
    margin-top:7px}

  #err{position:fixed;left:16px;right:16px;bottom:16px;z-index:40;display:none;
    white-space:pre-wrap;background:#17150f;color:#efe7d6;padding:14px 16px;
    font-size:12.5px;line-height:1.8;border-radius:2px}

  @media (max-height:520px){
    .lead{display:none} .dia{transform:scale(.8)}
    .sheet h1{font-size:44px}
  }
</style>
</head>
<body>

<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>

<div class="hud">
  <div>
    <div class="ttl">一本勝負</div>
    <div class="sub">IAI &nbsp;/&nbsp; FIRST TO THREE</div>
    <div class="pips" id="pips"></div>
  </div>
  <div class="btns">
    <button id="flipBtn" type="button">⟲ カメラ</button>
    <button id="sndBtn" type="button">音<span class="val" id="sndLbl">ON</span></button>
  </div>
</div>

<div class="read">
  <div class="rd-msg" id="msg">構えよ</div>
  <div class="rd-ms" id="ms"></div>
  <div class="rd-vs" id="vs"></div>
</div>

<div class="sheet" id="start">
  <h1>一閃</h1>
  <div class="en">IAI &nbsp;— &nbsp;THE INSTANT</div>
  <div class="hr"></div>
  <div class="dia">
    <div class="fl"></div>
    <div class="hd"></div>
    <div class="sig">斬</div>
    <div class="lb a">HOLD</div>
    <div class="lb b">STRIKE</div>
  </div>
  <p class="lead">
    片手を顔の高さに掲げ、動かさずに構える。<br>
    夕日に「斬」が出た刹那、手を振り下ろす。<br>
    早まれば負け。遅れれば斬られる。三本先取。
  </p>
  <button class="go" id="go" type="button">立合</button>
  <div class="foot">CAMERA REQUIRED</div>
</div>

<div class="sheet gone" id="result">
  <div class="verd" id="verd">勝</div>
  <div class="en" id="verdEn">VICTORY</div>
  <div class="stats">
    <div class="st"><b id="stW">0</b><span>本</span></div>
    <div class="st"><b id="stBest">—</b><span>最速 MS</span></div>
    <div class="st"><b id="stAvg">—</b><span>平均 MS</span></div>
  </div>
  <button class="go" id="again" type="button">もう一本</button>
</div>

<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  ELEMENTS
// ═══════════════════════════════════════════════════════════════════════
var cv      = document.getElementById('view');
var ctx     = cv.getContext('2d');
var video   = document.getElementById('video');
var pipsEl  = document.getElementById('pips');
var msgEl   = document.getElementById('msg');
var msEl    = document.getElementById('ms');
var vsEl    = document.getElementById('vs');
var flipBtn = document.getElementById('flipBtn');
var sndBtn  = document.getElementById('sndBtn');
var sndLbl  = document.getElementById('sndLbl');
var startSh = document.getElementById('start');
var goBtn   = document.getElementById('go');
var resSh   = document.getElementById('result');
var verdEl  = document.getElementById('verd');
var verdEn  = document.getElementById('verdEn');
var stW     = document.getElementById('stW');
var stBest  = document.getElementById('stBest');
var stAvg   = document.getElementById('stAvg');
var againBt = document.getElementById('again');
var errBox  = document.getElementById('err');

var KINARI = '#efe7d6', SUMI = '#17150f', NI = '#c0392b',
    KIN = '#c8a44a', USU = '#7a7364';

function now(){ return performance.now(); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function ease(t){ return 1 - Math.pow(1 - clamp(t,0,1), 3); }

// ═══════════════════════════════════════════════════════════════════════
//  CANVAS — the duel is drawn once into a scene buffer, then presented.
//  The split can only exist because the finished frame is a thing we hold.
// ═══════════════════════════════════════════════════════════════════════
var W = 1, H = 1, dpr = 1, S = 1;
var scn = document.createElement('canvas'), g = scn.getContext('2d');
var grainPat = null;

function makeGrain(){
  var n = document.createElement('canvas'); n.width = 128; n.height = 128;
  var c = n.getContext('2d'), im = c.createImageData(128,128), d = im.data;
  for (var i = 0; i < d.length; i += 4){
    var v = (Math.random() * 255) | 0;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = 13;
  }
  c.putImageData(im, 0, 0);
  try { grainPat = ctx.createPattern(n, 'repeat'); } catch(e){ grainPat = null; }
}
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  cv.width  = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  W = cv.width; H = cv.height;
  scn.width = W; scn.height = H;
  S = Math.min(W, H) / 720;                 // one scale for every drawn size
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing = 'user', mirror = true, stream = null, started = false;

function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display = 'block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:960 }, height:{ ideal:720 } },
    audio:false
  }).then(function(st){
    stream = st; video.srcObject = st; mirror = (facing === 'user');
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing === 'user') ? 'environment' : 'user';
  loseHand();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  HANDS — the hand is the sword. Everything the match measures comes
//  from one wrist, so it is guarded to the point of paranoia.
// ═══════════════════════════════════════════════════════════════════════
var hands = null, mpCamera = null, mpReady = false;
var LOST_MS = 260;

var hand = {
  live:false, t:-1e9,
  wx:.5, wy:.4,      // wrist, in display space
  px:.5, py:.4,      // palm centre
  dx:0,  dy:-1,      // wrist -> middle knuckle, unit
  span:.14
};
// ring buffer of palm height, the only history the duel needs
var TR = 48, trX = new Float64Array(TR), trY = new Float64Array(TR),
    trT = new Float64Array(TR), trN = 0, trI = 0;

function pushTrace(x, y, t){
  trX[trI] = x; trY[trI] = y; trT[trI] = t;
  trI = (trI + 1) % TR; if (trN < TR) trN++;
}
function traceAt(k){                       // k=0 newest
  var i = (trI - 1 - k + TR * 2) % TR;
  return i;
}
function clearTrace(){ trN = 0; trI = 0; }

function initHands(){
  if (typeof window.Hands !== 'function') return false;
  try {
    hands = new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
    }});
    hands.setOptions({ maxNumHands:1, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady = true; return true;
  } catch(e){ return false; }
}
function validLm(c){
  if (!c || c.length < 21) return null;
  for (var i = 0; i < 21; i++){
    var p = c[i];
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' ||
        !isFinite(p.x) || !isFinite(p.y)) return null;
  }
  return c;
}
function onHands(res){
  var raw = (res && res.multiHandLandmarks) ? res.multiHandLandmarks : [];
  var c = raw.length ? validLm(raw[0]) : null;
  if (!c) return;
  var wr = c[0], mk = c[9], ix = c[5], pk = c[17];
  if (!wr || !mk || !ix || !pk) return;
  var wx = mirror ? (1 - wr.x) : wr.x, wy = wr.y;
  var mx = mirror ? (1 - mk.x) : mk.x, my = mk.y;
  var ax = mx - wx, ay = my - wy;
  var len = Math.hypot(ax, ay);
  if (!isFinite(len) || len < 1e-4) return;
  var px = (wx + mx) * .5, py = (wy + my) * .5;
  if (!isFinite(px) || !isFinite(py)) return;
  var sp = Math.hypot((mirror ? (1-ix.x) : ix.x) - (mirror ? (1-pk.x) : pk.x),
                      ix.y - pk.y);
  hand.wx = wx; hand.wy = wy; hand.px = px; hand.py = py;
  hand.dx = ax / len; hand.dy = ay / len;
  hand.span = (isFinite(sp) && sp > .01) ? sp : .14;
  hand.t = now(); hand.live = true;
  pushTrace(px, py, hand.t);
}
function loseHand(){
  hand.live = false; hand.t = -1e9;
  clearTrace();
  resetGesture();                 // a lost hand must never leave a half-swing
}
function startMpCamera(){
  if (!mpReady || typeof window.Camera !== 'function') return;
  try {
    if (mpCamera && mpCamera.stop) mpCamera.stop();
    mpCamera = new window.Camera(video, {
      onFrame:function(){
        if (!hands || !started) return Promise.resolve();
        return hands.send({ image:video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  } catch(e){ mpReady = false; }
}

// ═══════════════════════════════════════════════════════════════════════
//  GESTURE — the chop.
//  Tuned against the harness, not by eye. MediaPipe wrist jitter at rest
//  random-walks ~0.02 of frame height over 130ms; a real chop covers four
//  times that. CHOP_DY sits at 0.085 so noise can never reach it, and the
//  reported instant is walked BACK to where the fall actually started, so
//  the millisecond figure is the player's reaction and not the model's lag.
// ═══════════════════════════════════════════════════════════════════════
var CHOP_DY   = 0.085;    // downward travel required, fraction of frame
var CHOP_WIN  = 150;      // ...within this many ms
var CHOP_V    = 0.70;     // ...and moving at least this fast (frames/sec)
var STEADY_R  = 0.038;    // 構え: no more than this much wander
var STEADY_MS = 420;      // ...held for this long
var READY_Y   = 0.70;     // ...with the hand up here or higher
var TIMEOUT   = 1500;     // too slow to answer the signal

var swung = false;        // latch: one chop per round, cleared on reset

function resetGesture(){ swung = false; }

// returns the timestamp the fall began, or 0
function detectChop(){
  if (swung || trN < 4) return 0;
  var t0 = trT[traceAt(0)], y0 = trY[traceAt(0)];
  var k, i, best = 0;
  for (k = 1; k < trN; k++){
    i = traceAt(k);
    var dt = t0 - trT[i];
    if (dt > CHOP_WIN) break;
    var dy = y0 - trY[i];                  // +ve = hand has moved DOWN
    if (dy >= CHOP_DY && dt > 1 && (dy / (dt / 1000)) >= CHOP_V) best = k;
  }
  if (!best) return 0;
  // Walk back to the instant the hand LEFT the top. Not the lowest sample
  // going backwards — jitter makes that wander hundreds of ms into the
  // hold. Take the highest point the palm reached in the last half second,
  // then the most RECENT sample still up there: that is departure.
  var winMs = 500, ymin = 1e9;
  for (k = 0; k < trN; k++){
    i = traceAt(k);
    if (t0 - trT[i] > winMs) break;
    if (trY[i] < ymin) ymin = trY[i];
  }
  var apex = best;
  for (k = 0; k < trN; k++){
    i = traceAt(k);
    if (t0 - trT[i] > winMs) break;
    if (trY[i] <= ymin + 0.015){ apex = k; break; }
  }
  swung = true;
  return trT[traceAt(apex)];
}
function isSteady(){
  if (!hand.live || trN < 3) return false;
  var t0 = trT[traceAt(0)];
  var minx = 9, maxx = -9, miny = 9, maxy = -9, span = 0, k, i;
  for (k = 0; k < trN; k++){
    i = traceAt(k);
    if (t0 - trT[i] > STEADY_MS) break;
    if (trX[i] < minx) minx = trX[i];
    if (trX[i] > maxx) maxx = trX[i];
    if (trY[i] < miny) miny = trY[i];
    if (trY[i] > maxy) maxy = trY[i];
    span = t0 - trT[i];
  }
  if (span < STEADY_MS * .7) return false;
  return (maxx - minx) < STEADY_R && (maxy - miny) < STEADY_R && hand.py < READY_Y;
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO — filtered noise percussion + one metallic FM voice
// ═══════════════════════════════════════════════════════════════════════
var ac = null, master = null, comp = null, noiseBuf = null, muted = false;

function initAudio(){
  if (ac) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ ac = null; return; }
  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 26;
  comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.20;
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.62;
  master.connect(comp); comp.connect(ac.destination);
  var n = Math.floor(ac.sampleRate * 1.6);
  noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
}
function noiseSrc(){
  var s = ac.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  s.playbackRate.value = 0.85 + Math.random() * 0.3;
  return s;
}
// the draw: a bandpass falling out of the air, plus a struck-metal ping
function sfxSlash(vol){
  if (!ac || muted) return;
  var t = ac.currentTime, v = (vol === undefined ? 1 : vol);
  var s = noiseSrc(), bp = ac.createBiquadFilter(), gn = ac.createGain();
  bp.type = 'bandpass'; bp.Q.value = 2.4;
  bp.frequency.setValueAtTime(6200, t);
  bp.frequency.exponentialRampToValueAtTime(420, t + 0.095);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.55 * v, t + 0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
  s.connect(bp); bp.connect(gn); gn.connect(master);
  s.start(t); s.stop(t + 0.34);
  fmPing(2200, 3.7, 0.34 * v, 0.55, t + 0.008);
}
function fmPing(car, ratio, amp, dec, at){
  if (!ac || muted) return;
  var t = (at === undefined ? ac.currentTime : at);
  var c = ac.createOscillator(), m = ac.createOscillator();
  var mg = ac.createGain(), cg = ac.createGain();
  c.frequency.value = car; m.frequency.value = car * ratio;
  mg.gain.setValueAtTime(car * 2.6, t);
  mg.gain.exponentialRampToValueAtTime(1, t + dec * 0.6);
  cg.gain.setValueAtTime(0.0001, t);
  cg.gain.exponentialRampToValueAtTime(amp, t + 0.006);
  cg.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  m.connect(mg); mg.connect(c.frequency); c.connect(cg); cg.connect(master);
  m.start(t); c.start(t); m.stop(t + dec + .05); c.stop(t + dec + .05);
}
// 拍子木 — two hardwood blocks, the signal to strike
function sfxClack(){
  if (!ac || muted) return;
  var t = ac.currentTime;
  var s = noiseSrc(), hp = ac.createBiquadFilter(), pk = ac.createBiquadFilter(),
      gn = ac.createGain();
  hp.type = 'highpass'; hp.frequency.value = 900;
  pk.type = 'peaking'; pk.frequency.value = 2050; pk.Q.value = 3.2; pk.gain.value = 14;
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.85, t + 0.002);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
  s.connect(hp); hp.connect(pk); pk.connect(gn); gn.connect(master);
  s.start(t); s.stop(t + 0.10);
}
// the heartbeat under 構え — 55Hz, and it hurries as the wait runs long
function sfxHeart(p){
  if (!ac || muted) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), gn = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(64, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.13);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.16 + 0.14 * clamp(p,0,1), t + 0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
  o.connect(gn); gn.connect(master);
  o.start(t); o.stop(t + 0.24);
}
function sfxThud(){
  if (!ac || muted) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), gn = ac.createGain(),
      s = noiseSrc(), lp = ac.createBiquadFilter(), ng = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.22);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.5, t + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.40);
  lp.type = 'lowpass'; lp.frequency.value = 700;
  ng.gain.setValueAtTime(0.0001, t);
  ng.gain.exponentialRampToValueAtTime(0.22, t + 0.004);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(gn); gn.connect(master);
  s.connect(lp); lp.connect(ng); ng.connect(master);
  o.start(t); o.stop(t + 0.44); s.start(t); s.stop(t + 0.20);
}
function sfxBell(win){
  if (!ac || muted) return;
  var t = ac.currentTime;
  fmPing(win ? 620 : 330, win ? 2.01 : 1.41, 0.30, win ? 2.6 : 1.8, t);
  fmPing(win ? 930 : 247, win ? 3.02 : 2.41, 0.16, win ? 2.0 : 1.4, t + 0.045);
}

// ═══════════════════════════════════════════════════════════════════════
//  MATCH
// ═══════════════════════════════════════════════════════════════════════
var ST_IDLE = 0, ST_READY = 1, ST_WAIT = 2, ST_SIGNAL = 3, ST_ROUND = 4, ST_OVER = 5;
var state = ST_IDLE;
var wins = 0, losses = 0, roundNo = 0;
var pips = [];                  // 'w' | 'l'
var times = [];                 // winning reaction times, ms
var stateT = 0;                 // when the current state began
var waitDur = 0, signalT = 0, oppMs = 0, playerMs = 0;
var settled = false;            // round resolution is idempotent
var outcome = '';               // 'win' | 'lose' | 'false' | 'slow'
var lastHeart = 0, heartN = 0;
var hitstop = 0;

function oppTime(){
  // Human visual reaction is ~250ms and the camera adds its own; the
  // opponent must start generous or the first bout is unwinnable.
  // Tuned by Monte Carlo against the harness, not by eye: this curve gives
  // a ~340ms player a 63% match win over ~3.9 bouts, a 300ms player 86%,
  // a 400ms player 34%. The wide spread matters as much as the mean — it
  // is what makes a single bout feel like a duel and not a verdict on your
  // average, so a slow hand still steals one and a fast hand still drops one.
  var base = 620 - roundNo * 40 - wins * 110;
  return clamp(base + (Math.random() - .5) * 380, 300, 950);
}
function setPips(){
  var h = '', i;
  for (i = 0; i < pips.length; i++) h += '<span class="pip ' + pips[i] + '"></span>';
  for (i = pips.length; i < 5; i++) h += '<span class="pip"></span>';
  pipsEl.innerHTML = h;
}
function say(m, ms, vs){
  msgEl.textContent = m;
  msEl.innerHTML = ms || '';
  vsEl.textContent = vs || '';
}
function enterReady(){
  state = ST_READY; stateT = now(); settled = false; outcome = '';
  playerMs = 0; oppMs = 0; resetGesture();
  say('手を掲げて構え');
}
function enterWait(){
  state = ST_WAIT; stateT = now(); resetGesture();
  waitDur = 1000 + Math.random() * 2600;
  oppMs = oppTime();
  lastHeart = 0; heartN = 0;
  say('…');
}
function enterSignal(){
  state = ST_SIGNAL; stateT = now(); signalT = stateT;
  resetGesture();
  sfxClack();
  shake(9); flash = 1;
  say('斬');
}
function resolve(kind, ms){
  if (settled) return;            // exactly once, whatever calls it
  settled = true;
  outcome = kind; playerMs = ms || 0;
  state = ST_ROUND; stateT = now();
  hitstop = 90;
  var won = (kind === 'win');
  if (won){ wins++; pips.push('w'); times.push(playerMs); }
  else { losses++; pips.push('l'); }
  setPips();
  cutAngle = Math.atan2(hand.dy, hand.dx);
  if (!isFinite(cutAngle)) cutAngle = -0.42;
  cutAngle = clamp(cutAngle, -1.15, -0.10);
  if (won){
    sfxSlash(1); sfxBell(true); shake(26); flash = 1;
    splatter(NI, 34); splatter(SUMI, 18);
    say('勝', playerMs + '<small>MS</small>',
        'YOU ' + playerMs + ' / FOE ' + Math.round(oppMs));
  } else if (kind === 'false'){
    sfxThud(); shake(14);
    splatter(SUMI, 12);
    say('早まった', '<small>FALSE START</small>', '');
  } else if (kind === 'slow'){
    sfxThud(); sfxBell(false); shake(18);
    splatter(NI, 22);
    say('遅い', '<small>TOO LATE</small>', 'FOE ' + Math.round(oppMs));
  } else {
    sfxSlash(.8); sfxBell(false); shake(22);
    splatter(NI, 26);
    say('負', playerMs ? playerMs + '<small>MS</small>' : '',
        (playerMs ? 'YOU ' + playerMs + ' / ' : '') + 'FOE ' + Math.round(oppMs));
  }
  roundNo++;
}
function finish(){
  state = ST_OVER; stateT = now();
  var win = wins >= 3;
  verdEl.textContent = win ? '勝' : '負';
  verdEl.className = 'verd ' + (win ? 'win' : 'lose');
  verdEn.textContent = win ? 'VICTORY' : 'DEFEAT';
  stW.textContent = wins;
  var best = 0, sum = 0, i;
  for (i = 0; i < times.length; i++){
    sum += times[i];
    if (!best || times[i] < best) best = times[i];
  }
  stBest.textContent = best ? best : '—';
  stAvg.textContent = times.length ? Math.round(sum / times.length) : '—';
  resSh.classList.remove('gone');
  sfxBell(win);
}
function newMatch(){
  wins = 0; losses = 0; roundNo = 0; pips = []; times = [];
  setPips(); resSh.classList.add('gone');
  clearTrace(); enterReady();
}

// ═══════════════════════════════════════════════════════════════════════
//  FEEL — shake, flash, ink, and the cut
// ═══════════════════════════════════════════════════════════════════════
var shakeAmp = 0, shX = 0, shY = 0, flash = 0;
var cutAngle = -0.42, cutOpen = 0;
var parts = [];

function shake(a){ shakeAmp = Math.max(shakeAmp, a); }
function splatter(col, n){
  var a = cutAngle;
  for (var i = 0; i < n; i++){
    var sp = (0.25 + Math.random() * 1.5);
    var th = a + (Math.random() - .5) * 1.5;
    parts.push({
      x: W * .5 + (Math.random() - .5) * W * .3,
      y: H * .45 + (Math.random() - .5) * H * .2,
      vx: Math.cos(th) * sp * 900 * S,
      vy: Math.sin(th) * sp * 900 * S - 120 * S,
      r: (1.4 + Math.random() * 5.2) * S,
      life: 0.5 + Math.random() * 0.9, age: 0, col: col
    });
  }
}
function stepParts(dt){
  for (var i = parts.length - 1; i >= 0; i--){
    var p = parts[i];
    p.age += dt;
    if (p.age >= p.life){ parts.splice(i, 1); continue; }
    p.vy += 1500 * S * dt;
    p.vx *= 0.965; p.vy *= 0.988;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  STEP
// ═══════════════════════════════════════════════════════════════════════
function step(dt){
  var t = now();
  if (hand.live && t - hand.t > LOST_MS) loseHand();

  shakeAmp *= Math.pow(0.001, dt);
  if (shakeAmp < 0.05) shakeAmp = 0;
  shX = (Math.random() - .5) * shakeAmp * S * 2;
  shY = (Math.random() - .5) * shakeAmp * S * 2;
  flash = Math.max(0, flash - dt * 5.5);
  stepParts(dt);

  if (state === ST_ROUND || state === ST_OVER)
    cutOpen = Math.min(1, cutOpen + dt * 1.7);
  else cutOpen = 0;

  if (state === ST_READY){
    if (!hand.live){ say('手が見えません'); return; }
    if (isSteady()){
      var held = t - stateT;
      if (held > 260) enterWait();
    } else {
      say('手を掲げて構え');
    }
  }
  else if (state === ST_WAIT){
    var el = t - stateT;
    var p = clamp(el / 3200, 0, 1);
    var period = 900 - 480 * p;
    if (el - lastHeart > period){ lastHeart = el; heartN++; sfxHeart(p); }
    if (!hand.live){ resolve('false', 0); return; }   // dropping guard = losing
    if (detectChop()){ resolve('false', 0); return; }
    if (el >= waitDur) enterSignal();
  }
  else if (state === ST_SIGNAL){
    var e2 = t - signalT;
    var strike = detectChop();
    if (strike){
      var ms = Math.round(clamp(strike - signalT, 80, 4000));
      if (ms < oppMs) resolve('win', ms);
      else resolve('lose', ms);
      return;
    }
    if (e2 >= oppMs + 120){ resolve('lose', 0); return; }
    if (e2 >= TIMEOUT){ resolve('slow', 0); return; }
  }
  else if (state === ST_ROUND){
    if (t - stateT > 1750){
      if (wins >= 3 || losses >= 3) finish();
      else { clearTrace(); enterReady(); }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════════════════════
function paper(){
  g.fillStyle = KINARI; g.fillRect(0, 0, W, H);
  if (grainPat){ g.fillStyle = grainPat; g.fillRect(0, 0, W, H); }
}
function wash(){
  // the camera, pressed into the paper like a wet sumi wash
  if (!video || !video.videoWidth) return;
  g.save();
  g.globalAlpha = 0.30;
  g.globalCompositeOperation = 'multiply';
  var vw = video.videoWidth, vh = video.videoHeight;
  var s = Math.max(W / vw, H / vh);
  var dw = vw * s, dh = vh * s;
  if (mirror){ g.translate(W, 0); g.scale(-1, 1); }
  g.drawImage(video, (W - dw) * .5, (H - dh) * .5, dw, dh);
  g.restore();
}
function sun(){
  var cx = W * .5, cy = H * .365, r = Math.min(W, H) * .27;
  g.fillStyle = NI;
  g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.fill();
  g.strokeStyle = USU; g.lineWidth = 1.4 * dpr;
  g.beginPath(); g.moveTo(0, H * .70); g.lineTo(W, H * .70); g.stroke();
}
// the opponent: five strokes of ink, and a sword that comes out on time
function foe(){
  var cx = W * .5, base = H * .70, hgt = Math.min(H * .30, W * .46);
  var u = hgt / 100;
  var drawn = 0;
  if (state === ST_SIGNAL) drawn = clamp((now() - signalT) / Math.max(1, oppMs), 0, 1);
  else if (state === ST_ROUND) drawn = (outcome === 'win') ? clamp((playerMs) / Math.max(1, oppMs), 0, 1) : 1;
  g.save();
  g.translate(cx, base);
  g.fillStyle = SUMI; g.strokeStyle = SUMI;
  g.lineCap = 'round'; g.lineJoin = 'round';
  // hakama
  g.beginPath();
  g.moveTo(-13 * u, 0); g.lineTo(-7 * u, -42 * u);
  g.lineTo(7 * u, -42 * u); g.lineTo(13 * u, 0);
  g.closePath(); g.fill();
  // torso
  g.beginPath();
  g.moveTo(-9 * u, -40 * u); g.lineTo(-11 * u, -74 * u);
  g.lineTo(11 * u, -74 * u); g.lineTo(9 * u, -40 * u);
  g.closePath(); g.fill();
  // shoulders + head
  g.lineWidth = 5 * u;
  g.beginPath(); g.moveTo(-11 * u, -74 * u); g.lineTo(11 * u, -74 * u); g.stroke();
  g.beginPath(); g.arc(0, -84 * u, 8 * u, 0, 6.2832); g.fill();
  // the blade, drawn out of the scabbard as its reaction time runs down
  if (drawn > 0){
    var L = 46 * u * drawn;
    var a = -0.62 - 1.25 * drawn;
    g.lineWidth = 3.2 * u;
    g.strokeStyle = (drawn >= 1) ? KIN : SUMI;
    g.beginPath();
    g.moveTo(12 * u, -58 * u);
    g.lineTo(12 * u + Math.cos(a) * L, -58 * u + Math.sin(a) * L);
    g.stroke();
  }
  g.restore();
}
// your hand, always drawn, so you can see the camera has you
function blade(){
  var t = now();
  var fade = clamp(1 - (t - hand.t) / LOST_MS, 0, 1);
  if (!hand.live && fade <= 0){
    g.save();
    g.globalAlpha = .55; g.fillStyle = USU;
    g.font = (13 * dpr) + 'px "Yuji Syuku",serif';
    g.textAlign = 'center';
    g.fillText('手をカメラに', W * .5, H * .86);
    g.restore();
    return;
  }
  var x = hand.wx * W, y = hand.wy * H;
  var L = clamp(hand.span, .06, .34) * H * 1.55;
  var dx = hand.dx, dy = hand.dy;
  var nx = -dy, ny = dx;
  var wdt = L * 0.055;
  g.save();
  g.globalAlpha = 0.35 + 0.65 * fade;
  // guard ring at the wrist
  g.strokeStyle = SUMI; g.lineWidth = 2.6 * dpr;
  g.beginPath(); g.arc(x, y, wdt * 2.1, 0, 6.2832); g.stroke();
  // the blade itself
  var tipx = x + dx * L, tipy = y + dy * L;
  g.beginPath();
  g.moveTo(x + nx * wdt, y + ny * wdt);
  g.lineTo(tipx + nx * wdt * .18, tipy + ny * wdt * .18);
  g.lineTo(tipx - nx * wdt * .18, tipy - ny * wdt * .18);
  g.lineTo(x - nx * wdt, y - ny * wdt);
  g.closePath();
  g.fillStyle = SUMI; g.fill();
  g.strokeStyle = KIN; g.lineWidth = 1.6 * dpr;
  g.beginPath();
  g.moveTo(x + nx * wdt, y + ny * wdt);
  g.lineTo(tipx + nx * wdt * .18, tipy + ny * wdt * .18);
  g.stroke();
  g.restore();
  // the swing's own trail, straight from the trace buffer
  if (trN > 2){
    g.save();
    g.strokeStyle = SUMI; g.lineCap = 'round';
    var t0 = trT[traceAt(0)];
    for (var k = 1; k < trN; k++){
      var i = traceAt(k), j = traceAt(k - 1);
      var age = t0 - trT[i];
      if (age > 260) break;
      var a = (1 - age / 260);
      g.globalAlpha = a * a * .55;
      g.lineWidth = (1 + a * 7) * dpr;
      g.beginPath();
      g.moveTo(trX[i] * W, trY[i] * H);
      g.lineTo(trX[j] * W, trY[j] * H);
      g.stroke();
    }
    g.restore();
  }
}
function bigKanji(){
  if (state === ST_SIGNAL){
    var e = now() - signalT;
    var s = 0.72 + 0.28 * ease(e / 90);
    g.save();
    g.translate(W * .5, H * .365);
    g.scale(s, s);
    g.fillStyle = KINARI;
    g.font = (Math.min(W, H) * .30) + 'px "Yuji Syuku",serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('斬', 0, 0);
    g.restore();
  } else if (state === ST_WAIT){
    var p = clamp((now() - stateT) / 3200, 0, 1);
    g.save();
    g.globalAlpha = .16 + .10 * Math.sin(heartN * 3.1);
    g.fillStyle = KINARI;
    g.font = (Math.min(W, H) * .17) + 'px "Yuji Syuku",serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('構', W * .5, H * .365);
    g.restore();
  } else if (state === ST_READY){
    var ok = isSteady();
    g.save();
    g.strokeStyle = ok ? KIN : KINARI;
    g.globalAlpha = ok ? .95 : .5;
    g.lineWidth = 3 * dpr;
    var r = Math.min(W, H) * .09;
    g.beginPath(); g.arc(W * .5, H * .365, r, 0, 6.2832); g.stroke();
    g.restore();
  }
}
function ink(){
  for (var i = 0; i < parts.length; i++){
    var p = parts[i];
    var a = 1 - p.age / p.life;
    g.globalAlpha = a * a;
    g.fillStyle = p.col;
    g.beginPath(); g.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
}
function renderScene(){
  paper(); wash(); sun(); foe(); bigKanji(); blade(); ink();
  if (flash > 0){
    g.globalAlpha = flash * .55; g.fillStyle = KINARI;
    g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  }
}
// SIGNATURE — the finished picture is cut along the line your blade took
function present(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = KINARI; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(shX, shY);
  if (cutOpen > 0 && state !== ST_IDLE){
    var e = ease(cutOpen);
    var off = e * Math.min(W, H) * (outcome === 'win' ? .085 : .05);
    var ux = Math.cos(cutAngle), uy = Math.sin(cutAngle);
    var nx = -uy, ny = ux;
    var BIG = (W + H) * 2, cx = W * .5, cy = H * .48, s;
    for (s = -1; s <= 1; s += 2){
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx - ux * BIG, cy - uy * BIG);
      ctx.lineTo(cx + ux * BIG, cy + uy * BIG);
      ctx.lineTo(cx + ux * BIG + nx * BIG * s, cy + uy * BIG + ny * BIG * s);
      ctx.lineTo(cx - ux * BIG + nx * BIG * s, cy - uy * BIG + ny * BIG * s);
      ctx.closePath(); ctx.clip();
      ctx.translate(nx * off * s + ux * off * .5 * s, ny * off * s + uy * off * .5 * s);
      ctx.drawImage(scn, 0, 0);
      ctx.restore();
    }
    // the cut itself
    ctx.save();
    ctx.globalAlpha = clamp(1 - e * .7, 0, 1);
    ctx.strokeStyle = (outcome === 'win') ? KIN : NI;
    ctx.lineWidth = (1 + (1 - e) * 8) * dpr;
    ctx.beginPath();
    ctx.moveTo(cx - ux * BIG, cy - uy * BIG);
    ctx.lineTo(cx + ux * BIG, cy + uy * BIG);
    ctx.stroke();
    ctx.restore();
  } else {
    ctx.drawImage(scn, 0, 0);
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var last = 0;
function loop(){
  var t = now();
  var dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016;
  last = t;
  try {
    if (hitstop > 0) hitstop -= dt * 1000;
    else if (started) step(dt);
    renderScene(); present();
  } catch(e){ /* one bad frame must never end a duel */ }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════════════════════
goBtn.addEventListener('click', function(){
  goBtn.textContent = 'よみこみ中';
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
  startStream().then(function(){
    if (!initHands()){
      showError(new Error('手の認識を読み込めませんでした'));
    } else startMpCamera();
    goBtn.textContent = '立合';
    started = true;
    startSh.classList.add('gone');
    newMatch();
  }).catch(function(e){ goBtn.textContent = '立合'; showError(e); });
});
againBt.addEventListener('click', function(){ newMatch(); });
sndBtn.addEventListener('click', function(){
  muted = !muted; sndLbl.textContent = muted ? 'OFF' : 'ON';
  if (master && ac) master.gain.setTargetAtTime(muted ? 0 : 0.62, ac.currentTime, 0.15);
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

resize(); makeGrain(); setPips();
requestAnimationFrame(loop);

// a headless harness fights the whole match without a camera
window.__IAI__ = {
  feed:function(list){ onHands({ multiHandLandmarks:list }); },
  lose:loseHand,
  step:function(dt){ if (hitstop > 0) hitstop -= dt * 1000; else if (started) step(dt); renderScene(); present(); },
  start:function(){ started = true; newMatch(); },
  get:function(){
    return { state:state, wins:wins, losses:losses, roundNo:roundNo,
             settled:settled, outcome:outcome, playerMs:playerMs, oppMs:oppMs,
             times:times, pips:pips, swung:swung, hand:hand, trN:trN,
             parts:parts.length, over:!resSh.classList.contains('gone') };
  },
  force:{ signal:enterSignal, ready:enterReady, wait:enterWait },
  consts:{ CHOP_DY:CHOP_DY, CHOP_WIN:CHOP_WIN, CHOP_V:CHOP_V,
           STEADY_R:STEADY_R, STEADY_MS:STEADY_MS, LOST_MS:LOST_MS,
           ST:{ IDLE:ST_IDLE, READY:ST_READY, WAIT:ST_WAIT, SIGNAL:ST_SIGNAL,
                ROUND:ST_ROUND, OVER:ST_OVER } }
};
})();
</script>
</body>
</html>
