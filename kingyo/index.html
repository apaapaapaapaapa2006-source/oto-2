<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KINGYO ─ 夜店の金魚すくい</title>
<meta name="description" content="手のひらがポイになる金魚すくい。紙は水に浸けるほど濡れ、濡れた紙を速く動かすと破れる。浅いところに上がってきた金魚を、破らないうちに何匹すくえるか。">
<meta name="theme-color" content="#101820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  KINGYO ─ 金魚すくい                          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   墨   sumi    #101820  night beyond the stall   (ground)
            藍   ai      #16324a  deep water
            浅葱 asagi   #2e7f8c  the shallows
            灯   hi      #ffbf6a  lantern amber            (light, rim, type)
            朱   shu     #e2453a  goldfish red             (fish, poi ring)
            白   shiro   #fdf6ea  wet paper
            MOOD: a summer festival stall after dark. Warm lantern light
            falling on cold water from somewhere up and to the left. The
            water is the only cold thing on screen and everything above it
            is warm — that contrast is the whole picture.

  BACKGROUND  The tank is inset from the edges with a lacquer rim, so you
            are leaning over a real object on a table, not looking through
            a window. Night presses in around it.

  TYPE      Yuji Syuku — a brush face — for the count and the title, Kiwi
            Maru for everything small. Against KAGEE's mincho and MINAMO's
            rounded gothic, this is the only hand-brushed type in the
            collection, because a stall's sign is painted, not set.

  MOTION    The fish are the only fast things in the piece. Water drifts,
            lanterns breathe, the paper sags. Nothing eases in or out —
            fish either glide or bolt, with nothing in between, which is
            what makes them feel alive.

  SIGNATURE THE PAPER REALLY GETS WET. Wetness accumulates the whole time
            the poi is under, never fully dries, and is the multiplier on
            every tearing force: drag while you move, and the thrash of a
            fish standing on it. Holes are punched into the actual disc you
            are looking at and never heal. So the game is not about
            reflexes — it is about deciding when to commit, and knowing
            that a fish you chase costs you more paper than one you wait
            for. Only fish that have risen near the surface can be scooped.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden; background:#101820; color:#fdf6ea;
    font-family:'Kiwi Maru','Hiragino Kaku Gothic ProN',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none;
    overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
  }
  #view{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  .layer{ position:fixed; z-index:10; pointer-events:none; }
  #hud{ top:0; left:0; right:0;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  #time{ font-family:'Yuji Syuku',serif; font-size:30px; line-height:1;
    color:#ffbf6a; text-shadow:0 2px 12px rgba(0,0,0,.7); font-variant-numeric:tabular-nums; }
  #time small{ font-size:12px; margin-left:3px; opacity:.7; }
  #time.warn{ color:#ff7a5c; }
  #poiRow{ display:flex; gap:5px; margin-top:7px; }
  .poiDot{ width:13px; height:13px; border-radius:50%;
    border:2px solid #e2453a; background:rgba(253,246,234,.5); }
  .poiDot.gone{ background:none; border-color:rgba(226,69,58,.28); }
  #catchBox{ text-align:right; }
  #catchN{ font-family:'Yuji Syuku',serif; font-size:34px; line-height:1;
    text-shadow:0 2px 12px rgba(0,0,0,.7); }
  #catchBox .lbl{ font-size:10px; letter-spacing:.24em; opacity:.62; margin-top:2px; }

  #hint{ left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 124px);
    text-align:center; font-size:12.5px; letter-spacing:.06em; line-height:1.9;
    color:rgba(253,246,234,.78); text-shadow:0 2px 10px rgba(0,0,0,.8);
    transition:opacity .5s ease; }

  #ctl{ left:0; right:0; bottom:0;
    padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);
    display:flex; justify-content:center; gap:8px; }
  .btn{ pointer-events:auto; cursor:pointer;
    background:rgba(16,24,32,.72); border:1px solid rgba(255,191,106,.42);
    color:#ffd9a8; padding:9px 13px; border-radius:3px; min-height:38px;
    font-family:'Kiwi Maru',sans-serif; font-size:12px; letter-spacing:.06em;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:inline-flex; align-items:center; gap:5px; }
  .btn small{ font-size:9.5px; opacity:.62; letter-spacing:.1em; }
  .btn:active{ background:#ffbf6a; color:#101820; border-color:#ffbf6a; }

  .sheet{ position:fixed; inset:0; z-index:30; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:30px 26px; text-align:center;
    background:radial-gradient(ellipse at 30% 12%, #24344a 0%, #101820 62%); }
  .sheet.gone{ display:none; }
  .sheet .sub{ font-size:12.5px; line-height:2.1; color:rgba(253,246,234,.8); max-width:23em; }
  .sheet h1{ font-family:'Yuji Syuku',serif; font-size:clamp(38px,13vw,62px);
    font-weight:400; letter-spacing:.14em; margin-right:-.14em; color:#fdf6ea;
    text-shadow:0 0 34px rgba(255,191,106,.5); }
  .sheet .en{ font-size:10px; letter-spacing:.44em; margin-right:-.44em;
    color:#ffbf6a; opacity:.85; }
  .sheet .rule{ width:min(240px,62vw); height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,191,106,.55),transparent); }
  .go{ pointer-events:auto; cursor:pointer; margin-top:4px;
    background:#e2453a; color:#fff6ec; border:none; border-radius:3px;
    padding:15px 34px; font-family:'Yuji Syuku',serif; font-size:19px;
    letter-spacing:.24em; margin-right:-.24em; box-shadow:0 6px 26px rgba(226,69,58,.4); }
  #tally{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap;
    font-size:12px; color:rgba(253,246,234,.86); }
  #tally b{ font-family:'Yuji Syuku',serif; font-size:24px; font-weight:400;
    display:block; color:#ffbf6a; line-height:1.3; }
  #bigScore{ font-family:'Yuji Syuku',serif; font-size:clamp(56px,22vw,104px);
    line-height:1; color:#ffbf6a; text-shadow:0 0 40px rgba(255,191,106,.45); }
  #bigScore span{ font-size:.3em; color:#fdf6ea; margin-left:.15em; }
  #stamp{ font-family:'Yuji Syuku',serif; font-size:14px; letter-spacing:.3em;
    margin-right:-.3em; color:#e2453a; border:2px solid #e2453a; border-radius:3px;
    padding:7px 14px; transform:rotate(-4deg); }

  #err{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:40;
    display:none; white-space:pre-line; max-width:82vw; background:#e2453a; color:#fff;
    padding:14px 16px; border-radius:3px; font-size:12.5px; line-height:1.85; }
</style>
</head>
<body>

<canvas id="view"></canvas>

<div class="layer" id="hud">
  <div>
    <div id="time">60<small>秒</small></div>
    <div id="poiRow"></div>
  </div>
  <div id="catchBox">
    <div id="catchN">0</div>
    <div class="lbl">すくった</div>
  </div>
</div>

<div class="layer" id="hint">手を開くとポイが水に入ります<br>すくったら、手を握って持ち上げる</div>

<div class="layer" id="ctl">
  <button class="btn" id="flipBtn" type="button">⟲ カメラ</button>
  <button class="btn" id="sndBtn" type="button">♪<small id="sndLbl">ON</small></button>
  <button class="btn" id="againBtn" type="button">はじめから</button>
</div>

<div class="sheet" id="start">
  <div class="en">GOLDFISH SCOOPING</div>
  <h1>金魚すくい</h1>
  <div class="rule"></div>
  <p class="sub">
    手のひらがポイになります。<br>
    <b>手を開いて</b>水に入れ、金魚の下へ運び、<b>手を握って</b>持ち上げる。<br>
    紙は浸けるほど濡れ、濡れた紙を急に動かすと破れます。ポイは三枚。
  </p>
  <button class="go" id="go" type="button">すくう</button>
  <div class="sub" style="opacity:.55;font-size:11px">カメラと音を使います・60秒</div>
</div>

<div class="sheet gone" id="result">
  <div class="en">RESULT</div>
  <div id="bigScore">0<span>匹</span></div>
  <div class="rule"></div>
  <div id="tally"></div>
  <div id="stamp">またのお越しを</div>
  <button class="go" id="retry" type="button">もう一度</button>
</div>

<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  ELEMENTS / CANVAS
// ═══════════════════════════════════════════════════════════════════════
var view = document.getElementById('view'), ctx = view.getContext('2d');
var timeEl = document.getElementById('time'), poiRow = document.getElementById('poiRow');
var catchNEl = document.getElementById('catchN'), hintEl = document.getElementById('hint');
var startEl = document.getElementById('start'), resultEl = document.getElementById('result');
var goBtn = document.getElementById('go'), retryBtn = document.getElementById('retry');
var flipBtn = document.getElementById('flipBtn'), againBtn = document.getElementById('againBtn');
var sndBtn = document.getElementById('sndBtn'), sndLbl = document.getElementById('sndLbl');
var bigScore = document.getElementById('bigScore'), tallyEl = document.getElementById('tally');
var errBox = document.getElementById('err');

var video = document.createElement('video');
video.playsInline = true; video.muted = true;
video.setAttribute('playsinline',''); video.autoplay = true;

var W = 0, H = 0, dpr = 1;
var TANK = { x:0, y:0, w:0, h:0, r:0 };     // the water, in device px

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(window.innerWidth * dpr));
  H = Math.max(1, Math.round(window.innerHeight * dpr));
  view.width = W; view.height = H;
  view.style.width = window.innerWidth + 'px';
  view.style.height = window.innerHeight + 'px';
  var m = Math.round(Math.min(W, H) * 0.035);
  TANK.x = m; TANK.y = m; TANK.w = W - m*2; TANK.h = H - m*2;
  TANK.r = Math.min(TANK.w, TANK.h) * 0.06;
  buildCaustic();
}

// tank space is normalised 0..1 on both axes
function tx(u){ return TANK.x + u * TANK.w; }
function ty(v){ return TANK.y + v * TANK.h; }
function unit(){ return Math.min(TANK.w, TANK.h); }   // for sizes that must stay round

// ═══════════════════════════════════════════════════════════════════════
//  SOUND — a stall at night
// ═══════════════════════════════════════════════════════════════════════
var ac = null, master = null, muted = false, ambGain = null;
function initAudio(){
  if (ac) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.85;
  master.connect(ac.destination);

  ambGain = ac.createGain(); ambGain.gain.value = 0.11; ambGain.connect(master);
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
  lp.connect(ambGain);
  [58, 87, 116.5].forEach(function(f, i){
    var o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    var g = ac.createGain(); g.gain.value = i === 0 ? 0.5 : 0.22;
    o.connect(g); g.connect(lp); o.start();
  });
  var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.3;
  var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  var hp = ac.createBiquadFilter(); hp.type = 'bandpass';
  hp.frequency.value = 5200; hp.Q.value = 0.8;
  var ng = ac.createGain(); ng.gain.value = 0.05;
  src.connect(hp); hp.connect(ng); ng.connect(master); src.start();
}
function noise(dur, freq, q, gain, type){
  if (!ac || muted) return;
  var t = ac.currentTime, n = Math.max(1, (ac.sampleRate * dur) | 0);
  var buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var s = ac.createBufferSource(); s.buffer = buf;
  var f = ac.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.value = freq; f.Q.value = q;
  var g = ac.createGain(); g.gain.value = gain;
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
function splash(){ noise(0.22, 900, 0.7, 0.24); }
function plip(){ noise(0.08, 2400, 3.5, 0.14); }
function rip(){ noise(0.42, 3100, 0.5, 0.42, 'highpass'); }
function bell(step){
  if (!ac || muted) return;
  var t = ac.currentTime, base = 1046.5 * Math.pow(2, (step || 0) / 12);
  [1, 2.76].forEach(function(mul, i){
    var o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = base * mul;
    var g = ac.createGain();
    g.gain.setValueAtTime(i ? 0.09 : 0.19, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (i ? 0.5 : 0.9));
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 1);
  });
}
function tick(){
  if (!ac || muted) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = 420;
  var g = ac.createGain();
  g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.13);
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing = 'user', mirror = true, stream = null;
function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display = 'block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:960 }, height:{ ideal:720 } },
    audio:false
  }).then(function(st){
    stream = st; video.srcObject = st; mirror = (facing === 'user');
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing === 'user') ? 'environment' : 'user';
  loseHand();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  HAND — the palm is the poi
// ═══════════════════════════════════════════════════════════════════════
var hands = null, mpCamera = null, mpReady = false;
var lm = null, lastHandT = -1e9, LOST_MS = 320;

function initHands(){
  if (typeof window.Hands !== 'function') return false;
  try {
    hands = new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
    }});
    hands.setOptions({ maxNumHands:1, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady = true; return true;
  } catch(e){ return false; }
}
function validLm(c){
  if (!c || c.length < 21) return null;
  for (var i = 0; i < 21; i++){
    var p = c[i];
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' ||
        !isFinite(p.x) || !isFinite(p.y)) return null;
  }
  return c;
}
function onHands(res){
  var c = (res && res.multiHandLandmarks && res.multiHandLandmarks.length)
        ? validLm(res.multiHandLandmarks[0]) : null;
  if (c){ lm = c; lastHandT = now(); }
}
function loseHand(){ lm = null; lastHandT = -1e9; }
function startMpCamera(){
  if (!mpReady || typeof window.Camera !== 'function') return;
  try {
    if (mpCamera && mpCamera.stop) mpCamera.stop();
    mpCamera = new window.Camera(video, {
      onFrame:function(){
        if (!hands || state === 'boot') return Promise.resolve();
        return hands.send({ image:video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  } catch(e){ mpReady = false; }
}
function now(){ return performance.now(); }

// palm centre, span and openness, all guarded
var TIPS = [8, 12, 16, 20], PIPS = [6, 10, 14, 18];
function readHand(){
  if (!lm || now() - lastHandT > LOST_MS) return null;
  var ids = [0, 5, 9, 13, 17], cx = 0, cy = 0, i;
  for (i = 0; i < ids.length; i++){ cx += lm[ids[i]].x; cy += lm[ids[i]].y; }
  cx /= ids.length; cy /= ids.length;
  var span = Math.hypot(lm[5].x - lm[17].x, lm[5].y - lm[17].y);
  if (!isFinite(span) || span <= 0) return null;
  var wr = lm[0], ext = 0;
  for (i = 0; i < TIPS.length; i++){
    var dt = Math.hypot(lm[TIPS[i]].x - wr.x, lm[TIPS[i]].y - wr.y);
    var dp = Math.hypot(lm[PIPS[i]].x - wr.x, lm[PIPS[i]].y - wr.y);
    if (dt > dp * 1.06) ext++;
  }
  return {
    x: mirror ? 1 - cx : cx, y: cy,
    wx: mirror ? 1 - wr.x : wr.x, wy: wr.y,
    span: span, open: ext >= 3, ext: ext
  };
}

// ═══════════════════════════════════════════════════════════════════════
//  POI — a paper disc that really gets wet
// ═══════════════════════════════════════════════════════════════════════
var poi = null;
function newPoi(){
  return { x:0.5, y:0.5, px:0.5, py:0.5, r:0.10, ang:0,
           down:false, wet:0, tear:0, holes:[], speed:0, born:now(), broke:0, live:true };
}
var poiCanvas = document.createElement('canvas'), pctx = poiCanvas.getContext('2d');

function updatePoi(dt, h){
  if (!poi || !poi.live) return;
  if (h){
    poi.px = poi.x; poi.py = poi.y;
    poi.x += (h.x - poi.x) * Math.min(1, dt * 16);
    poi.y += (h.y - poi.y) * Math.min(1, dt * 16);
    var want = Math.max(0.062, Math.min(0.17, h.span * 1.42));
    poi.r += (want - poi.r) * Math.min(1, dt * 6);
    poi.ang = Math.atan2(h.wy - poi.y, h.wx - poi.x);
    var wasDown = poi.down;
    poi.down = h.open;
    if (poi.down && !wasDown) splash();
    if (!poi.down && wasDown) lift();
  } else {
    poi.down = false;          // no hand, no paper in the water — but no free catch either
  }
  var sp = Math.hypot(poi.x - poi.px, poi.y - poi.py) / Math.max(dt, 0.001);
  poi.speed = poi.speed * 0.72 + sp * 0.28;

  if (poi.down){
    poi.wet = Math.min(1, poi.wet + dt * 0.055);
    // drag tears the paper, and only wet paper tears
    var drag = poi.speed * poi.speed * poi.wet * dt * 0.020;
    if (drag > 0) damage(drag);
    if (poi.speed > 0.9 && Math.random() < dt * 6) ripple(poi.x, poi.y, poi.r * 0.9, 0.5);
  } else {
    poi.wet = Math.max(0, poi.wet - dt * 0.008);   // it never really dries
  }
}
function damage(a){
  if (!poi || !poi.live || a <= 0) return;
  var before = poi.tear;
  poi.tear = Math.min(1, poi.tear + a);
  // holes appear as the paper goes, and never heal
  if (poi.tear > 0.3 && Math.floor(poi.tear * 9) > Math.floor(before * 9)){
    var a2 = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * 0.78;
    poi.holes.push({ x:Math.cos(a2) * rr, y:Math.sin(a2) * rr,
                     r:0.10 + Math.random() * 0.16, born:now() });
    plip();
  }
  if (poi.tear >= 1) breakPoi();
}
function breakPoi(){
  if (!poi || !poi.live) return;
  poi.live = false; poi.broke = now();
  rip();
  for (var i = 0; i < 16; i++){
    scraps.push({ x:poi.x, y:poi.y, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5,
                  rot:Math.random()*6.28, vr:(Math.random()-0.5)*7,
                  s:poi.r*(0.10+Math.random()*0.16), life:1 });
  }
  for (var f = 0; f < fish.length; f++) if (fish[f].onPoi){ fish[f].onPoi = false; startle(fish[f], 1.5); }
  poiLeft--;
  renderPoiRow();
  if (poiLeft <= 0) setTimeout(function(){ if (state === 'play') endGame(); }, 900);
  else setTimeout(function(){ if (state === 'play'){ poi = newPoi(); } }, 1100);
}
function lift(){
  if (!poi || !poi.live) return;
  var got = 0;
  for (var i = 0; i < fish.length; i++){
    var f = fish[i];
    if (!f.onPoi || f.caught) continue;
    f.caught = true; f.catchT = now();
    f.cx0 = f.x; f.cy0 = f.y;
    f.onPoi = false;
    got++;
    caught.push(f.kind);
    score += KINDS[f.kind].pt;
  }
  if (got){
    for (var g = 0; g < got; g++) bell(g * 3);
    catchNEl.textContent = String(caught.length);
    ripple(poi.x, poi.y, poi.r * 1.3, 0.9);
  }
}

function drawPoi(){
  if (!poi) return;
  var R = poi.r * unit();
  if (!poi.live){
    return;   // scraps carry the moment instead
  }
  var s = Math.max(8, Math.ceil(R * 2.4));
  if (poiCanvas.width !== s){ poiCanvas.width = poiCanvas.height = s; }
  pctx.clearRect(0, 0, s, s);
  var c = s / 2;

  // wet paper: more transparent, more grey, as it soaks
  var wet = poi.wet;
  var g = pctx.createRadialGradient(c, c, R * 0.1, c, c, R);
  g.addColorStop(0, 'rgba(253,246,234,' + (0.24 - wet * 0.15).toFixed(3) + ')');
  g.addColorStop(0.72, 'rgba(246,236,220,' + (0.23 - wet * 0.15).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(228,216,198,' + (0.15 - wet * 0.10).toFixed(3) + ')');
  pctx.fillStyle = g;
  pctx.beginPath(); pctx.arc(c, c, R, 0, 6.2832); pctx.fill();

  // fibres
  pctx.strokeStyle = 'rgba(255,255,255,' + (0.05 - wet * 0.03).toFixed(3) + ')';
  pctx.lineWidth = Math.max(1, R * 0.010);
  for (var i = 0; i < 3; i++){
    var a = i * 1.1 + 0.4;
    pctx.beginPath();
    pctx.moveTo(c + Math.cos(a) * R * 0.9, c + Math.sin(a) * R * 0.9);
    pctx.lineTo(c - Math.cos(a) * R * 0.9, c - Math.sin(a) * R * 0.9);
    pctx.stroke();
  }
  // holes are punched out for real
  pctx.globalCompositeOperation = 'destination-out';
  for (var k = 0; k < poi.holes.length; k++){
    var ho = poi.holes[k];
    var grow = Math.min(1, (now() - ho.born) / 260);
    pctx.beginPath();
    pctx.arc(c + ho.x * R, c + ho.y * R, ho.r * R * grow, 0, 6.2832);
    pctx.fill();
  }
  pctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(tx(poi.x), ty(poi.y));
  // handle, pointing back to the wrist
  ctx.rotate(poi.ang);
  ctx.fillStyle = '#c9a06a';
  ctx.fillRect(R * 0.86, -R * 0.055, R * 1.15, R * 0.11);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(R * 0.86, R * 0.01, R * 1.15, R * 0.035);
  ctx.rotate(-poi.ang);

  ctx.drawImage(poiCanvas, -s/2, -s/2);
  // the ring
  ctx.strokeStyle = poi.down ? 'rgba(226,69,58,0.86)' : '#e2453a';
  ctx.lineWidth = Math.max(2, R * 0.10);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,214,180,0.55)';
  ctx.lineWidth = Math.max(1, R * 0.035);
  ctx.beginPath(); ctx.arc(0, 0, R * 0.94, -2.4, -0.7); ctx.stroke();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  FISH
// ═══════════════════════════════════════════════════════════════════════
var KINDS = {
  aka:   { pt:1, body:'#e2453a', fin:'#f4785f', label:'和金',   w:0.62 },
  sarasa:{ pt:2, body:'#e8623f', fin:'#ffd9b0', label:'更紗',   w:0.28, patch:true },
  demekin:{pt:3, body:'#2a2028', fin:'#4a3a44', label:'出目金', w:0.10, pop:true }
};
var fish = [], scraps = [], ripples = [];

function pickKind(){
  var r = Math.random(), a = 0;
  for (var k in KINDS){ a += KINDS[k].w; if (r <= a) return k; }
  return 'aka';
}
function makeFish(){
  var kind = pickKind();
  return {
    kind: kind,
    x: 0.1 + Math.random() * 0.8, y: 0.12 + Math.random() * 0.76,
    a: Math.random() * 6.2832, sp: 0.05 + Math.random() * 0.05,
    z: 0.35 + Math.random() * 0.6,                 // 0 surface, 1 floor
    zT: Math.random() * 6,
    len: (kind === 'demekin' ? 0.085 : 0.075) + Math.random() * 0.03,
    ph: Math.random() * 6.2832, wag: 0, fix: false,
    dart: 0, onPoi: false, caught: false, catchT: 0, bowlA: Math.random() * 6.2832
  };
}
function startle(f, mult){
  f.dart = 0.55 * (mult || 1);
  f.sp = (0.34 + Math.random() * 0.2) * (mult || 1);
}

function updateFish(dt, t){
  var pdown = poi && poi.live && poi.down;
  for (var i = 0; i < fish.length; i++){
    var f = fish[i];
    if (f.caught) continue;

    // depth: fish drift up and down on their own; only shallow ones can be scooped
    if (!f.fix){
      f.zT += dt * 0.22;
      f.z += (0.5 + 0.42 * Math.sin(f.zT) - f.z) * dt * 0.55;
      f.z = Math.max(0.04, Math.min(1, f.z));
    }

    var dx = 0, dy = 0;
    if (poi && poi.live){
      var px = poi.x - f.x, py = poi.y - f.y;
      var d = Math.hypot(px, py);
      var reach = poi.r + f.len * 0.5;
      // a poi that moves fast scares them; a still one does not
      var scare = poi.speed * (pdown ? 1 : 0.45);
      var trig = (f.kind === 'demekin' ? 0.55 : 0.85);
      if (d < reach * 2.6 && scare > trig){
        startle(f, 1);
        dx -= px / (d || 1); dy -= py / (d || 1);
      }
      f.onPoi = !!(pdown && d < reach * 0.82 && f.z < 0.45 && !f.caught);
      if (f.onPoi){
        // it thrashes on the paper — this is what really costs you
        damage(dt * 0.30 * (0.45 + poi.wet));
        f.wag = 1;
        if (Math.random() < dt * 3) plip();
      }
    } else f.onPoi = false;

    if (f.fix){ f.ph += dt * 6; continue; }

    // schooling, gently
    var ax = 0, ay = 0, n = 0;
    for (var j = 0; j < fish.length; j++){
      if (j === i || fish[j].caught) continue;
      var ox = fish[j].x - f.x, oy = fish[j].y - f.y;
      var od = Math.hypot(ox, oy);
      if (od < 0.16 && od > 0.0001){
        n++;
        if (od < 0.075){ ax -= ox / od * 0.6; ay -= oy / od * 0.6; }
        else { ax += ox / od * 0.18; ay += oy / od * 0.18; }
      }
    }
    if (n){ dx += ax / n; dy += ay / n; }

    // walls
    var mIn = 0.055;
    if (f.x < mIn) dx += (mIn - f.x) * 22;
    if (f.x > 1 - mIn) dx -= (f.x - (1 - mIn)) * 22;
    if (f.y < mIn) dy += (mIn - f.y) * 22;
    if (f.y > 1 - mIn) dy -= (f.y - (1 - mIn)) * 22;

    if (dx || dy){
      var want = Math.atan2(dy, dx), diff = want - f.a;
      while (diff > Math.PI) diff -= 6.2832;
      while (diff < -Math.PI) diff += 6.2832;
      f.a += diff * Math.min(1, dt * (f.dart > 0 ? 9 : 2.4));
    } else if (Math.random() < dt * 0.7){
      f.a += (Math.random() - 0.5) * 0.9;
    }

    if (f.dart > 0){ f.dart -= dt; if (f.dart <= 0) f.sp = 0.05 + Math.random() * 0.05; }
    else f.sp += ((0.05 + Math.random() * 0.03) - f.sp) * dt * 0.8;

    var v = f.sp * (f.onPoi ? 0.25 : 1);
    f.x += Math.cos(f.a) * v * dt;
    f.y += Math.sin(f.a) * v * dt;
    f.x = Math.max(0.02, Math.min(0.98, f.x));
    f.y = Math.max(0.02, Math.min(0.98, f.y));
    f.ph += dt * (6 + v * 34);
    f.wag += ((f.dart > 0 ? 1 : 0.35) - f.wag) * dt * 5;
  }
}

function drawFish(f, t){
  var L = f.len * unit();
  var depth = f.z;
  var x, y, sc = 1, alpha = 1;

  if (f.caught){
    var k = Math.min(1, (now() - f.catchT) / 620);
    var bx = bowl.x, by = bowl.y;
    var e = k * k * (3 - 2 * k);
    x = tx(f.cx0) + (bx - tx(f.cx0)) * e;
    y = ty(f.cy0) + (by - ty(f.cy0)) * e - Math.sin(k * Math.PI) * unit() * 0.16;
    sc = 1 - k * 0.55;
    if (k >= 1){
      f.bowlA += 0.9 * 0.016;
      var br = bowl.r * (0.34 + (f.bowlSeed || (f.bowlSeed = Math.random())) * 0.3);
      x = bx + Math.cos(f.bowlA) * br;
      y = by + Math.sin(f.bowlA) * br * 0.6;
      sc = 0.42;
    }
  } else {
    x = tx(f.x); y = ty(f.y);
    sc = 1 - depth * 0.16;
    alpha = 1 - depth * 0.40;
  }

  var K = KINDS[f.kind], len = L * sc, wdt = len * 0.44;
  var ang = f.caught ? -1.2 : f.a;
  var wag = Math.sin(f.ph) * (0.22 + f.wag * 0.4);

  // shadow on the tank floor, further away the deeper it is
  if (!f.caught){
    ctx.save();
    ctx.globalAlpha = 0.20 * (0.3 + depth * 0.7);
    ctx.fillStyle = '#040a12';
    ctx.translate(x + depth * unit() * 0.035, y + depth * unit() * 0.05);
    ctx.rotate(ang); ctx.scale(1, 0.5);
    ctx.beginPath(); ctx.arc(0, 0, len * 0.52, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(ang);

  // tail
  ctx.fillStyle = K.fin;
  ctx.globalAlpha = alpha * 0.85;
  ctx.beginPath();
  ctx.moveTo(-len * 0.34, 0);
  ctx.quadraticCurveTo(-len * 0.72, wag * len * 0.55 - wdt * 0.9,
                       -len * 0.96, wag * len * 0.9 - wdt * 0.35);
  ctx.quadraticCurveTo(-len * 0.74, wag * len * 0.7, -len * 0.90, wag * len * 1.0 + wdt * 0.5);
  ctx.quadraticCurveTo(-len * 0.62, wag * len * 0.4 + wdt * 0.4, -len * 0.34, 0);
  ctx.fill();
  // dorsal
  ctx.beginPath();
  ctx.moveTo(-len * 0.05, -wdt * 0.42);
  ctx.quadraticCurveTo(-len * 0.3, -wdt * 1.25, -len * 0.42, -wdt * 0.3);
  ctx.fill();
  ctx.globalAlpha = alpha;

  // body
  ctx.fillStyle = K.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, len * 0.5, wdt * 0.62, 0, 0, 6.2832);
  ctx.fill();

  if (K.patch){
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, len * 0.5, wdt * 0.62, 0, 0, 6.2832); ctx.clip();
    ctx.fillStyle = 'rgba(255,246,236,0.92)';
    ctx.beginPath(); ctx.ellipse(-len * 0.16, wdt * 0.14, len * 0.2, wdt * 0.4, 0.3, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(len * 0.2, -wdt * 0.2, len * 0.13, wdt * 0.26, -0.2, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  // belly light
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.beginPath();
  ctx.ellipse(len * 0.06, -wdt * 0.22, len * 0.32, wdt * 0.2, 0, 0, 6.2832);
  ctx.fill();

  // eye
  var ex = len * 0.32, ey = wdt * 0.2;
  if (K.pop){
    ctx.fillStyle = '#1b1620';
    ctx.beginPath(); ctx.arc(ex * 0.86, -ey, wdt * 0.34, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(ex * 0.86, ey, wdt * 0.34, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(ex, -ey * 1.15, wdt * 0.1, 0, 6.2832); ctx.fill();
  } else {
    ctx.fillStyle = '#160f14';
    ctx.beginPath(); ctx.arc(ex, -ey, wdt * 0.15, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(ex + wdt * 0.05, -ey - wdt * 0.05, wdt * 0.055, 0, 6.2832); ctx.fill();
  }
  ctx.restore();

  // it is standing on your paper — say so
  if (f.onPoi){
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(now() / 90);
    ctx.strokeStyle = '#ffbf6a'; ctx.lineWidth = Math.max(1.5, unit() * 0.004);
    ctx.beginPath(); ctx.arc(x, y, len * 0.78, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  WATER
// ═══════════════════════════════════════════════════════════════════════
var caustic = null;
function buildCaustic(){
  var s = 256;
  caustic = document.createElement('canvas'); caustic.width = caustic.height = s;
  var c = caustic.getContext('2d');
  c.clearRect(0, 0, s, s);
  c.strokeStyle = 'rgba(255,255,255,0.42)';
  c.lineCap = 'round';
  for (var i = 0; i < 90; i++){
    var x = Math.random() * s, y = Math.random() * s;
    var r = 5 + Math.random() * 20, a0 = Math.random() * 6.2832;
    c.lineWidth = 0.7 + Math.random() * 1.6;
    c.beginPath(); c.arc(x, y, r, a0, a0 + 0.5 + Math.random() * 1.2); c.stroke();
  }
}
function ripple(u, v, r, str){
  ripples.push({ x:u, y:v, r:r, r0:r, life:1, str:str || 1 });
}
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawWater(t){
  // night, and the lantern that lights the stall
  ctx.fillStyle = '#101820'; ctx.fillRect(0, 0, W, H);
  var lg = ctx.createRadialGradient(W * 0.22, -H * 0.1, unit() * 0.05,
                                    W * 0.22, -H * 0.1, unit() * 1.5);
  var pulse = 0.5 + 0.06 * Math.sin(t * 0.0011) + 0.03 * Math.sin(t * 0.0037);
  lg.addColorStop(0, 'rgba(255,191,106,' + (0.30 * pulse * 2).toFixed(3) + ')');
  lg.addColorStop(1, 'rgba(255,191,106,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  roundRect(ctx, TANK.x, TANK.y, TANK.w, TANK.h, TANK.r);
  ctx.clip();

  var g = ctx.createLinearGradient(0, TANK.y, 0, TANK.y + TANK.h);
  g.addColorStop(0, '#2e6f80');
  g.addColorStop(0.45, '#1d4560');
  g.addColorStop(1, '#122a40');
  ctx.fillStyle = g; ctx.fillRect(TANK.x, TANK.y, TANK.w, TANK.h);

  // your reflection, rippling on the surface
  if (video.readyState >= 2 && video.videoWidth){
    var vw = video.videoWidth, vh = video.videoHeight;
    var sc = Math.max(TANK.w / vw, TANK.h / vh);
    var dw = vw * sc, dh = vh * sc;
    var ox = TANK.x + (TANK.w - dw) / 2, oy = TANK.y + (TANK.h - dh) / 2;
    var strips = 12, sh = dh / strips;
    ctx.save();
    ctx.globalAlpha = 0.11;
    ctx.globalCompositeOperation = 'screen';
    if (mirror){ ctx.translate(TANK.x * 2 + TANK.w, 0); ctx.scale(-1, 1); }
    for (var i = 0; i < strips; i++){
      var off = Math.sin(t * 0.0013 + i * 0.55) * unit() * 0.006;
      ctx.drawImage(video, 0, (vh / strips) * i, vw, vh / strips,
                    ox + off, oy + sh * i, dw, sh + 1);
    }
    ctx.restore();
  }

  // caustics
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var cs = unit() * 0.44;
  ctx.globalAlpha = 0.045;
  for (var cy2 = -1; cy2 * cs < TANK.h + cs; cy2++){
    for (var cx2 = -1; cx2 * cs < TANK.w + cs; cx2++){
      ctx.drawImage(caustic,
        TANK.x + cx2 * cs + Math.sin(t * 0.00021 + cy2) * cs * 0.10,
        TANK.y + cy2 * cs + Math.cos(t * 0.00017 + cx2) * cs * 0.09, cs, cs);
    }
  }
  ctx.restore();

  // ripples
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (var r = ripples.length - 1; r >= 0; r--){
    var p = ripples[r];
    ctx.globalAlpha = 0.28 * p.life * p.str;
    ctx.strokeStyle = '#bfe6ee';
    ctx.lineWidth = Math.max(1, unit() * 0.004 * p.life);
    ctx.beginPath();
    ctx.arc(tx(p.x), ty(p.y), p.r * unit(), 0, 6.2832);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRim(){
  ctx.save();
  // the water stops here
  ctx.lineWidth = Math.max(3, unit() * 0.016);
  roundRect(ctx, TANK.x, TANK.y, TANK.w, TANK.h, TANK.r);
  ctx.strokeStyle = '#3b2418'; ctx.stroke();
  ctx.lineWidth = Math.max(1, unit() * 0.005);
  roundRect(ctx, TANK.x + unit() * 0.006, TANK.y + unit() * 0.006,
            TANK.w - unit() * 0.012, TANK.h - unit() * 0.012, TANK.r * 0.9);
  ctx.strokeStyle = 'rgba(255,191,106,0.30)'; ctx.stroke();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  BOWL — where the caught ones end up
// ═══════════════════════════════════════════════════════════════════════
var bowl = { x:0, y:0, r:0 };
function layoutBowl(){
  bowl.r = unit() * 0.115;
  bowl.x = TANK.x + TANK.w - bowl.r * 1.22;
  bowl.y = TANK.y + TANK.h - bowl.r * 1.22 - unit() * 0.11;
}
function drawBowl(){
  ctx.save();
  ctx.globalAlpha = 0.9;
  var g = ctx.createRadialGradient(bowl.x - bowl.r * 0.3, bowl.y - bowl.r * 0.3, bowl.r * 0.1,
                                   bowl.x, bowl.y, bowl.r);
  g.addColorStop(0, 'rgba(190,235,240,0.42)');
  g.addColorStop(1, 'rgba(120,190,205,0.20)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(bowl.x, bowl.y, bowl.r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(220,245,250,0.55)';
  ctx.lineWidth = Math.max(1.5, bowl.r * 0.05);
  ctx.beginPath(); ctx.arc(bowl.x, bowl.y, bowl.r, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = Math.max(1, bowl.r * 0.035);
  ctx.beginPath(); ctx.arc(bowl.x, bowl.y, bowl.r * 0.84, 2.5, 3.9); ctx.stroke();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  GAME
// ═══════════════════════════════════════════════════════════════════════
var state = 'boot';            // boot | play | over
var ROUND = 60, POI_N = 3;
var timeLeft = ROUND, poiLeft = POI_N, caught = [], score = 0, lastTick = 99, shownSec = -1;

function renderPoiRow(){
  var h = '';
  for (var i = 0; i < POI_N; i++) h += '<span class="poiDot' + (i < poiLeft ? '' : ' gone') + '"></span>';
  poiRow.innerHTML = h;
}
function startGame(){
  timeLeft = ROUND; poiLeft = POI_N; caught = []; score = 0; lastTick = 99; shownSec = -1;
  fish.length = 0; scraps.length = 0; ripples.length = 0;
  for (var i = 0; i < 13; i++) fish.push(makeFish());
  poi = newPoi();
  catchNEl.textContent = '0';
  timeEl.classList.remove('warn');
  renderPoiRow();
  startEl.classList.add('gone'); resultEl.classList.add('gone');
  hintEl.style.opacity = '1';
  state = 'play';
}
function endGame(){
  if (state !== 'play') return;
  state = 'over';
  var n = { aka:0, sarasa:0, demekin:0 };
  for (var i = 0; i < caught.length; i++) n[caught[i]]++;
  bigScore.innerHTML = caught.length + '<span>匹</span>';
  tallyEl.innerHTML =
    '<div><b>' + n.aka + '</b>和金</div>' +
    '<div><b>' + n.sarasa + '</b>更紗</div>' +
    '<div><b>' + n.demekin + '</b>出目金</div>' +
    '<div><b>' + score + '</b>点</div>';
  resultEl.classList.remove('gone');
  bell(0); setTimeout(function(){ bell(4); }, 130); setTimeout(function(){ bell(7); }, 260);
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var last = 0;
function loop(){
  requestAnimationFrame(loop);
  var t = now(), dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t;
  layoutBowl();

  if (state === 'play'){
    timeLeft -= dt;
    if (timeLeft <= 0){ timeLeft = 0; endGame(); }
    var s = Math.ceil(timeLeft);
    if (s !== shownSec){ shownSec = s; timeEl.innerHTML = s + '<small>秒</small>'; }
    if (s <= 10){
      timeEl.classList.add('warn');
      if (s !== lastTick && s > 0){ lastTick = s; tick(); }
    }
    var h = readHand();
    updatePoi(dt, h);
    updateFish(dt, t);
    if (t - lastHandT < LOST_MS && hintEl.style.opacity !== '0' && t - startedAt > 7000){
      hintEl.style.opacity = '0';
    }
  }

  for (var r = ripples.length - 1; r >= 0; r--){
    var p = ripples[r];
    p.r += dt * 0.26; p.life -= dt * 1.5;
    if (p.life <= 0) ripples.splice(r, 1);
  }
  for (var s2 = scraps.length - 1; s2 >= 0; s2--){
    var sc = scraps[s2];
    sc.x += sc.vx * dt; sc.y += sc.vy * dt;
    sc.vx *= 0.94; sc.vy = sc.vy * 0.94 + dt * 0.06;
    sc.rot += sc.vr * dt; sc.life -= dt * 0.55;
    if (sc.life <= 0) scraps.splice(s2, 1);
  }

  drawWater(t);

  // deep fish first so shallow ones sit on top
  var order = fish.slice().sort(function(a, b){
    return (b.caught ? -2 : b.z) - (a.caught ? -2 : a.z);
  });
  var i2;
  for (i2 = 0; i2 < order.length; i2++) if (!order[i2].caught) drawFish(order[i2], t);
  if (state !== 'boot') drawPoi();
  drawBowl();
  for (i2 = 0; i2 < order.length; i2++) if (order[i2].caught) drawFish(order[i2], t);

  // torn paper drifting down
  for (i2 = 0; i2 < scraps.length; i2++){
    var q = scraps[i2];
    ctx.save();
    ctx.globalAlpha = Math.max(0, q.life) * 0.8;
    ctx.translate(tx(q.x), ty(q.y)); ctx.rotate(q.rot);
    ctx.fillStyle = '#f2e7d6';
    var qs = q.s * unit();
    ctx.fillRect(-qs / 2, -qs / 2, qs, qs * 0.72);
    ctx.restore();
  }

  ctx.restore();      // out of the tank clip
  drawRim();

  if (state === 'play') drawStatus();
}

function drawStatus(){
  if (!poi) return;
  // the wetness gauge lives on the rim, bottom left, where it will not fight the fish
  var w = unit() * 0.30, h2 = Math.max(5, unit() * 0.017);
  var x = TANK.x + unit() * 0.045, y = TANK.y + TANK.h - unit() * 0.145;
  ctx.save();
  ctx.fillStyle = 'rgba(10,18,26,0.55)';
  roundRect(ctx, x, y, w, h2, h2 / 2); ctx.fill();
  var lv = poi.live ? Math.max(poi.wet * 0.55 + poi.tear * 0.45, 0) : 1;
  var g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#7fd3d8'); g.addColorStop(0.6, '#ffbf6a'); g.addColorStop(1, '#e2453a');
  ctx.fillStyle = g;
  roundRect(ctx, x, y, Math.max(h2, w * Math.min(1, lv)), h2, h2 / 2); ctx.fill();
  ctx.fillStyle = 'rgba(253,246,234,0.62)';
  ctx.font = Math.max(9, unit() * 0.026) + "px 'Kiwi Maru', sans-serif";
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText(poi.live ? 'ポイの傷み' : 'やぶれた', x, y - h2 * 0.5);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════════════════════
var startedAt = 0;
function begin(){
  startedAt = now();
  startGame();
}
goBtn.addEventListener('click', function(){
  goBtn.textContent = 'よみこみ中';
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
  startStream().then(function(){
    if (initHands()) startMpCamera();
    else {
      errBox.style.display = 'block';
      errBox.textContent = '手の検出を読み込めませんでした。\n通信環境を確認して、ページを再読み込みしてください。';
    }
    goBtn.textContent = 'すくう';
    begin();
  }).catch(function(e){ goBtn.textContent = 'すくう'; showError(e); });
});
retryBtn.addEventListener('click', begin);
againBtn.addEventListener('click', function(){ if (state !== 'boot') begin(); });
sndBtn.addEventListener('click', function(){
  muted = !muted; sndLbl.textContent = muted ? 'OFF' : 'ON';
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.85, ac.currentTime, 0.2);
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

resize(); renderPoiRow();
requestAnimationFrame(loop);

// a headless harness can play the game without a camera
window.__KINGYO__ = {
  feed: function(l){ onHands({ multiHandLandmarks:[l] }); },
  state: function(){
    return { state:state, timeLeft:timeLeft, poiLeft:poiLeft, caught:caught.length,
             score:score, fish:fish.length,
             poi: poi ? { x:poi.x, y:poi.y, r:poi.r, down:poi.down, wet:poi.wet,
                          tear:poi.tear, live:poi.live, holes:poi.holes.length } : null,
             onPoi: fish.filter(function(f){ return f.onPoi; }).length,
             shallow: fish.filter(function(f){ return !f.caught && f.z < 0.45; }).length };
  },
  startGame: begin, endGame: endGame,
  put: function(u, v, z){    // drop a fish where the test wants one
    var f = makeFish(); f.x = u; f.y = v; f.z = (z === undefined ? 0.2 : z);
    f.sp = 0; f.fix = true; fish.push(f); return f;
  },
  damage: function(a){ damage(a); }
};

})();
</script>
