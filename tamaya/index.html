<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAMAYA ─ 指でためて放つ川開きの花火</title>
<meta name="description" content="親指と人差し指でつまんでいるあいだ導火線が燃え、放せば玉が上がる花火の楽器。長く持つほど大きな玉が高く上がって低く鳴り、開いた星がひとつ消えるたびに一音が散る。あなたが見えるのは花火に照らされた一瞬だけ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Marcellus&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  TAMAYA 玉屋 ─ 指でためて放つ川開きの花火          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      川開きの夜。対岸は遠く、音は少し遅れて届く。画面はほとんど
            まっ暗で、見えているのは空と水だけ。人が見えるのは花火が
            上がった一瞬だけで、その一瞬は花火の色をしている。
            涼しくて、さびしくて、二度と同じ形が来ない。
            今夜のもう一本（KATSUJI）は白い和紙の昼の仕事なので、
            こちらは徹底して夜側に振る。似て見えてはいけない。

  PALETTE   藍墨  aizumi    #060a16  空。黒ではなく青黒。星の金が浮く。
            群青  gunjo     #16305c  川。空より少しだけ明るい藍。
            紅    kurenai   #ff4d5e  玉の火。いちばん熱い色。
            金    kin       #ffd27a  尾を引く星と、画面のすべての文字。
            白緑  byakuroku #a9f0d1  冷たい玉。紅の対。

  BG        上から下へ 藍墨→群青 のグラデーション、粒の粗い星空（静止）、
            水平線に対岸の灯り、下三割は川。川には空がそのまま映る。
            ヴィネットは使わない。暗さは絵の中の暗さであって額縁ではない。

  TYPE      Hina Mincho ─ 細くて折れそうな明朝。花火大会の刷り物の字。
            Marcellus   ─ ローマン大文字。数字と欧字だけ。
            字間は広く（.18em〜.42em）、大きさは控えめ。字は主役ではない。

  MOTION    「上がって、溜めて、落ちる」。重力と空気抵抗しか無い世界。
            UI は 520ms の cubic-bezier(.16,.9,.28,1) でゆっくり開く。
            画面の中の動きに直線は一本も無い。

  SIGNATURE カメラ映像は「花火に照らされた分だけ」合成される。無音の
            暗がりでは何も映らず、玉が開いた瞬間だけ、その玉の色で
            あなたが浮かび上がって、すぐ消える。そしてそれは川にも映る。
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#060a16}
  body{
    font-family:'Hina Mincho','Yu Mincho','Hiragino Mincho ProN',serif;
    color:#ffd27a;
    -webkit-font-smoothing:antialiased;
  }
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px;top:-10px}

  /* ── 文字まわり ─────────────────────────────────────────── */
  #ttl{
    position:fixed;left:max(1.15rem,env(safe-area-inset-left));
    top:max(1.05rem,env(safe-area-inset-top));
    pointer-events:none;line-height:1.25;
    text-shadow:0 0 18px rgba(6,10,22,.95),0 1px 3px rgba(6,10,22,1);
  }
  #ttl .k{font-size:1.42rem;letter-spacing:.34em;color:#ffe6b4}
  #ttl .s{
    font-family:'Marcellus',serif;font-size:.62rem;letter-spacing:.46em;
    color:#7f93bd;margin-top:.22rem;
  }
  #read{
    position:fixed;right:max(1.1rem,env(safe-area-inset-right));
    top:max(1.1rem,env(safe-area-inset-top));
    font-family:'Marcellus',serif;font-size:.68rem;letter-spacing:.2em;
    color:#8ea3cc;text-align:right;line-height:1.85;pointer-events:none;
    text-shadow:0 0 14px rgba(6,10,22,.95);
  }
  #read b{color:#ffd27a;font-weight:400;font-size:.8rem;letter-spacing:.06em}
  #read i{font-style:normal;color:#5d6e93}

  /* ── 操作盤 ─────────────────────────────────────────────── */
  #panel{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:max(.7rem,env(safe-area-inset-bottom));
    display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:center;
    padding:.46rem .6rem;border-radius:2px;
    background:rgba(8,13,28,.62);border:1px solid rgba(127,147,189,.22);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    max-width:calc(100vw - 1.4rem);
  }
  .grp{display:flex;align-items:center;gap:.36rem}
  .grp label{font-size:.72rem;letter-spacing:.16em;color:#8ea3cc}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:4.6rem;height:14px;background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:#3c4a6b}
  input[type=range]::-moz-range-track{height:1px;background:#3c4a6b}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:9px;height:9px;border-radius:50%;
    background:#ffd27a;margin-top:-4px;box-shadow:0 0 9px rgba(255,210,122,.6);
  }
  input[type=range]::-moz-range-thumb{
    width:9px;height:9px;border:0;border-radius:50%;
    background:#ffd27a;box-shadow:0 0 9px rgba(255,210,122,.6);
  }
  .seg{display:flex;border:1px solid rgba(127,147,189,.26)}
  .seg button{
    font-family:inherit;font-size:.76rem;letter-spacing:.12em;
    padding:.2rem .52rem;border:0;background:transparent;color:#7f93bd;cursor:pointer;
    transition:color .3s,background .3s;
  }
  .seg button+button{border-left:1px solid rgba(127,147,189,.26)}
  .seg button.on{background:rgba(255,210,122,.14);color:#ffe6b4}
  #snd{
    font-family:'Marcellus',serif;font-size:.62rem;letter-spacing:.2em;
    padding:.24rem .5rem;border:1px solid rgba(127,147,189,.26);
    background:transparent;color:#7f93bd;cursor:pointer;transition:color .3s,border-color .3s;
  }
  #snd.on{color:#ffd27a;border-color:rgba(255,210,122,.42)}
  #flip{
    position:fixed;right:max(.9rem,env(safe-area-inset-right));
    bottom:max(.9rem,env(safe-area-inset-bottom));
    font-family:inherit;font-size:.76rem;letter-spacing:.14em;
    padding:.3rem .6rem;border:1px solid rgba(127,147,189,.26);
    background:rgba(8,13,28,.62);color:#8ea3cc;cursor:pointer;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  }
  #err{
    display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(30rem,88vw);padding:1.1rem 1.2rem;white-space:pre-wrap;
    background:rgba(8,13,28,.92);border:1px solid rgba(255,77,94,.4);
    color:#ffc9cf;font-size:.9rem;line-height:1.85;z-index:40;
  }

  /* ── 開始シート ─────────────────────────────────────────── */
  .sheet{
    position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    padding:1rem;background:radial-gradient(120% 90% at 50% 0%,#0d1730 0%,#060a16 62%);
    transition:opacity .52s cubic-bezier(.16,.9,.28,1),visibility .52s;
  }
  .sheet.gone{opacity:0;visibility:hidden;pointer-events:none}
  .card{
    width:min(33rem,94vw);max-height:94vh;overflow:auto;
    background:linear-gradient(180deg,rgba(13,23,48,.96),rgba(6,10,22,.96));
    border:1px solid rgba(255,210,122,.2);
  }
  .cap{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:.6rem .95rem;border-bottom:1px solid rgba(127,147,189,.18);
    font-family:'Marcellus',serif;font-size:.6rem;letter-spacing:.3em;color:#6f82ac;
  }
  .cap b{font-family:'Hina Mincho',serif;font-weight:400;letter-spacing:.2em;color:#ffd27a}
  .bodyw{padding:1.15rem .95rem 1.25rem}
  .ttl2{font-size:1.32rem;line-height:1.66;letter-spacing:.1em;color:#ffe6b4}
  .lead{
    margin-top:.7rem;font-size:.86rem;line-height:2;letter-spacing:.045em;color:#a9bada;
  }
  .lead em{font-style:normal;color:#ffd27a}
  #demo{
    display:block;width:100%;height:auto;margin:.95rem 0 .2rem;
    background:#060a16;border:1px solid rgba(127,147,189,.16);
  }
  .spec{
    margin-top:.7rem;font-size:.78rem;line-height:2.15;letter-spacing:.04em;color:#93a6ca;
  }
  .spec span{
    display:inline-block;min-width:5.6rem;color:#ffd27a;letter-spacing:.14em;
  }
  .spec em{font-style:normal;color:#a9f0d1}
  .go{
    margin-top:1.05rem;width:100%;padding:.72rem;cursor:pointer;
    font-family:'Hina Mincho',serif;font-size:1.02rem;letter-spacing:.44em;text-indent:.44em;
    background:linear-gradient(180deg,rgba(255,210,122,.16),rgba(255,77,94,.12));
    border:1px solid rgba(255,210,122,.44);color:#ffe6b4;
    transition:background .3s,transform .3s cubic-bezier(.16,.9,.28,1);
  }
  .go:hover{background:linear-gradient(180deg,rgba(255,210,122,.26),rgba(255,77,94,.2))}
  .go:active{transform:scale(.985)}
  @media (max-width:430px){
    #ttl .k{font-size:1.2rem}
    .ttl2{font-size:1.12rem}
    .lead{font-size:.8rem}
    .spec{font-size:.73rem}
    .spec span{min-width:4.9rem}
    input[type=range]{width:3.5rem}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="err"></div>

<div id="ttl">
  <div class="k">玉屋</div>
  <div class="s">TAMAYA</div>
</div>

<div id="read">
  玉 <b id="rShell">0</b>　星 <b id="rStar">0</b><br>
  <i id="rMode">—</i>
</div>

<div id="panel">
  <div class="grp"><label>星</label><input type="range" id="denEl" min="30" max="100" value="85"></div>
  <div class="grp"><label>風</label><input type="range" id="windEl" min="0" max="100" value="38"></div>
  <div class="seg">
    <button id="sc0" class="on">夜</button><button id="sc1">宵</button><button id="sc2">祭</button>
  </div>
  <button id="snd" class="on">音 ON</button>
</div>

<div class="sheet" id="startSheet">
  <div class="card">
    <div class="cap"><span>OTO-II / TAMAYA</span><span><b>玉屋ー</b></span></div>
    <div class="bodyw">
      <div class="ttl2">つまんで、ためて、<br>放すと上がる。</div>
      <p class="lead">
        親指と人差し指をつまむと、指のあいだで導火線が燃えはじめます。<br>
        <em>持っているあいだ玉は育ちます。</em>放せば、育った分だけ高く上がる。<br>
        大きい玉ほど高く上がって、<em>低く</em>鳴ります。小さい玉は低く、高く。<br>
        開いた星がひとつ消えるたびに、一音。音を鳴らしているのは花火そのもの。
      </p>
      <canvas id="demo" width="680" height="250"></canvas>
      <div class="spec">
        <span>つまむ</span>導火線に火がつきます。指を離すまで玉が育つ<br>
        <span>放す</span>玉が上がる。手を振りながら放せばその向きへ流れる<br>
        <span>両手を上へ</span><em>スターマイン</em>。十発が一度に上がります<br>
        <span>あなた</span>花火が上がった一瞬だけ、その色で照らされます
      </div>
      <button class="go" id="startBtn">川 開 き</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  BASICS
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function fin(v){ return typeof v==='number' && isFinite(v); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function now(){
  return (typeof performance!=='undefined'&&performance&&performance.now)
    ? performance.now()/1000 : Date.now()/1000;
}
function raf(fn){
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(fn);
  else setTimeout(function(){ fn(now()*1000); },16);
}
function mkCanvas(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  return c;
}
function rnd(a,b){ return a+Math.random()*(b-a); }

var view=document.getElementById('view');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var denEl=document.getElementById('denEl');
var windEl=document.getElementById('windEl');
var sndBtn=document.getElementById('snd');
var scBtns=[document.getElementById('sc0'),document.getElementById('sc1'),document.getElementById('sc2')];
var rShell=document.getElementById('rShell'), rStar=document.getElementById('rStar');
var rMode=document.getElementById('rMode');
var demoCv=document.getElementById('demo');
var g=view.getContext('2d');

var DPR=1, W=960, H=600, SHORT=600;
var started=false, last=now();

// ═══════════════════════════════════════════════════════════════════════
//  PALETTE — 玉の色。i=0 は柳の金で、消えぎわは全部ここへ寄る。
// ═══════════════════════════════════════════════════════════════════════
var COL=[
  [255,210,122],  // 0 金     kin
  [255, 77, 94],  // 1 紅     kurenai
  [169,240,209],  // 2 白緑   byakuroku
  [255,255,242],  // 3 銀     gin
  [126,182,255],  // 4 浅葱   asagi
  [255,146, 82],  // 5 橙     daidai
  [216,150,255],  // 6 藤     fuji
  [168,255,124]   // 7 若草   wakakusa
];
var NCOL=COL.length;
function colStr(i,a){
  var c=COL[i]||COL[0];
  return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a.toFixed(3)+')';
}

// ═══════════════════════════════════════════════════════════════════════
//  LAYOUT — 世界の寸法はすべて SHORT（短辺）基準。横長でも縦長でも
//  同じ身振りが同じ高さの玉になる。
// ═══════════════════════════════════════════════════════════════════════
var horizonY=0, GRAV=0;
var glowCv=null, glowCx=null, GQ=0.5, GW=1, GH=1;
var bloomCv=null, bloomCx=null;
var vcCv=null, vcCx=null;
var skyCv=null, skyCx=null;
var dotCv=null, smokeCv=null;

function buildSprites(){
  // 星の粒（加算用の放射グラデーション）
  var S=34; dotCv=mkCanvas(S,S);
  var c=dotCv.getContext('2d');
  var gr=c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.26,'rgba(255,255,255,.72)');
  gr.addColorStop(0.62,'rgba(255,255,255,.16)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=gr; c.fillRect(0,0,S,S);
  // 煙
  var M=72; smokeCv=mkCanvas(M,M);
  var m=smokeCv.getContext('2d');
  var gm=m.createRadialGradient(M/2,M/2,0,M/2,M/2,M/2);
  gm.addColorStop(0,'rgba(255,255,255,.34)');
  gm.addColorStop(0.5,'rgba(255,255,255,.12)');
  gm.addColorStop(1,'rgba(255,255,255,0)');
  m.fillStyle=gm; m.fillRect(0,0,M,M);
  // 照らされたあなたを作る小さな板。ここが小さいから色を掛けても安い。
  vcCv=mkCanvas(192,144); vcCx=vcCv.getContext('2d');
}

var SKY_N=170;
var skySeed=[];
function buildSky(){
  skyCv=mkCanvas(W,H); skyCx=skyCv.getContext('2d');
  var c=skyCx;
  var gr=c.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#04060f');
  gr.addColorStop(0.52,'#080e1f');
  gr.addColorStop(0.74,'#0e1a34');
  c.fillStyle=gr; c.fillRect(0,0,W,horizonY);
  // 川
  var gw=c.createLinearGradient(0,horizonY,0,H);
  gw.addColorStop(0,'#16305c');
  gw.addColorStop(0.3,'#0c1830');
  gw.addColorStop(1,'#05080f');
  c.fillStyle=gw; c.fillRect(0,horizonY,W,H-horizonY);
  // 星空
  var i;
  if (skySeed.length===0){
    for (i=0;i<SKY_N;i++) skySeed.push([Math.random(),Math.random(),Math.random()]);
  }
  for (i=0;i<SKY_N;i++){
    var s=skySeed[i];
    var x=s[0]*W, y=s[1]*horizonY*0.94, a=0.05+s[2]*0.3;
    var r=s[2]<0.86?0.7:1.25;
    c.fillStyle='rgba(206,222,255,'+a.toFixed(3)+')';
    c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  }
  // 対岸 — 黒い帯と、ぽつぽつの灯り
  var bankH=Math.max(5,SHORT*0.022);
  c.fillStyle='#03050b';
  c.beginPath();
  c.moveTo(0,horizonY);
  var step=Math.max(18,W/34), x0=0, hprev=horizonY-bankH*rnd(0.5,1);
  c.lineTo(0,hprev);
  for (x0=step;x0<=W+step;x0+=step){
    var hh=horizonY-bankH*(0.35+Math.abs(Math.sin(x0*0.021))*0.95);
    c.lineTo(Math.min(W,x0),hh);
  }
  c.lineTo(W,horizonY); c.closePath(); c.fill();
  for (i=0;i<26;i++){
    var lx=(i+0.5)*W/26+Math.sin(i*2.7)*W*0.012;
    var ly=horizonY-bankH*rnd(0.15,0.7);
    c.fillStyle='rgba(255,196,110,'+rnd(0.2,0.6).toFixed(3)+')';
    c.beginPath(); c.arc(lx,ly,rnd(0.7,1.5),0,TAU); c.fill();
  }
}

function layout(){
  horizonY=Math.round(H*0.735);
  SHORT=Math.min(W,H);
  GRAV=SHORT*0.60;
  GW=Math.max(64,Math.round(W*GQ));
  GH=Math.max(64,Math.round(H*GQ));
  glowCv=mkCanvas(GW,GH); glowCx=glowCv.getContext('2d');
  bloomCv=mkCanvas(Math.max(24,GW>>2),Math.max(24,GH>>2));
  bloomCx=bloomCv.getContext('2d');
  buildSky();
}

function resize(){
  var w=(typeof window!=='undefined'&&window.innerWidth)?window.innerWidth:960;
  var h=(typeof window!=='undefined'&&window.innerHeight)?window.innerHeight:600;
  DPR=Math.min(2,(typeof window!=='undefined'&&window.devicePixelRatio)?window.devicePixelRatio:1);
  if (!fin(DPR)||DPR<=0) DPR=1;
  W=Math.max(240,Math.round(w)); H=Math.max(240,Math.round(h));
  view.width=Math.round(W*DPR); view.height=Math.round(H*DPR);
  if (view.style){ view.style.width=W+'px'; view.style.height=H+'px'; }
  g.setTransform(DPR,0,0,DPR,0,0);
  layout();
  updateCover();
}
if (typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('resize',function(){ resize(); });
  window.addEventListener('orientationchange',function(){ setTimeout(resize,260); });
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ── COVER + アスペクト補正カメラ空間 ───────────────────────────────
//  x はフレーム幅で、y はフレーム高さで正規化されている。だから比率
//  （つまみ具合・手の大きさ）は必ず cu()/cv() で測る。
var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect;
  if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX+(mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY+ny*(covS/camAspect); }
function cu(nx){ return nx*camAspect; }
function cv(ny){ return ny; }

// ═══════════════════════════════════════════════════════════════════════
//  HANDS
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.40;
var TIPS=[4,8,12,16,20];
function mkHand(){
  return { on:false, t:-9, span:0.1,
           tx:new Float32Array(5), ty:new Float32Array(5),
           px:0, py:0, vx:0, vy:0,
           pinch:false, charge:0, hx:0, hy:0,
           pinchR:9, crT:0,
           raised:false, fresh:false };
}
var HAND=[mkHand(),mkHand()];
var seenN=0, lastSeen=-99;
var raiseT=0, mineCool=-99;

function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  return fin(p.x)&&fin(p.y);
}
function dropHand(h){
  // 追跡が切れたらつまみ状態ごと捨てる。復帰した瞬間に暴発させない。
  h.on=false; h.t=-9; h.pinch=false; h.charge=0; h.crT=0; h.pinchR=9;
  h.vx=0; h.vy=0; h.raised=false; h.fresh=false;
}
function loseHands(){ dropHand(HAND[0]); dropHand(HAND[1]); seenN=0; raiseT=0; }

function onHands(res){
  var t=now();
  var lists=(res&&res.multiHandLandmarks)?res.multiHandLandmarks:null;
  var n=(lists&&typeof lists.length==='number')?Math.min(2,lists.length):0;
  var k,i,idx;
  seenN=0;
  for (k=0;k<2;k++){
    var h=HAND[k];
    if (k<n){
      var L=lists[k];
      if (!lmOK(L,0)||!lmOK(L,9)||!lmOK(L,4)||!lmOK(L,8)){ continue; }
      var ok=true;
      for (i=0;i<5;i++){ if (!lmOK(L,TIPS[i])){ ok=false; break; } }
      if (!ok) continue;
      var du=cu(L[9].x)-cu(L[0].x), dv=cv(L[9].y)-cv(L[0].y);
      var span=Math.sqrt(du*du+dv*dv);
      if (!fin(span)||span<0.02) span=0.02;
      var wasLive=h.on&&(t-h.t)<LOST_S;
      for (i=0;i<5;i++){
        idx=TIPS[i];
        var nx=sx(L[idx].x), ny=sy(L[idx].y);
        if (!fin(nx)||!fin(ny)){ ok=false; break; }
        h.tx[i]=nx; h.ty[i]=ny;
      }
      if (!ok) continue;
      // つまみ点＝親指先と人差し指先の中点（画面座標）
      var mx=(h.tx[0]+h.tx[1])*0.5, my=(h.ty[0]+h.ty[1])*0.5;
      if (wasLive){
        var dt=Math.max(0.008,Math.min(0.2,t-h.t));
        var nvx=(mx-h.px)/dt, nvy=(my-h.py)/dt;
        if (fin(nvx)&&fin(nvy)){ h.vx=h.vx*0.55+nvx*0.45; h.vy=h.vy*0.55+nvy*0.45; }
      } else { h.vx=0; h.vy=0; }
      h.px=mx; h.py=my; h.hx=mx; h.hy=my;
      h.span=span;
      // つまみ比 — 必ずカメラ空間で測る（画面 px では向きで倍ちがう）
      var pu=cu(L[4].x)-cu(L[8].x), pv=cv(L[4].y)-cv(L[8].y);
      h.pinchR=Math.sqrt(pu*pu+pv*pv)/span;
      h.raised=(cv(L[0].y)<0.36 && cv(L[9].y)<0.32);
      h.fresh=!wasLive;
      h.on=true; h.t=t;
      seenN++;
    } else if (h.on&&(t-h.t)>LOST_S){
      dropHand(h);
    }
  }
  if (seenN>0) lastSeen=t;
}
function handLive(k){ return HAND[k].on && (now()-HAND[k].t)<LOST_S; }

function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0, selfieMode:false,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO
//  音色の考えかたは二つだけ。
//   ・開いた星の一粒 = 2オペレータの FM ベル（比 3.51、指数は減衰）。
//     ガラスのように立ち上がって、すぐ痩せる。花火の「パチ」ではなく
//     「チン」で鳴らすのは、そうしないと和音にならないから。
//   ・開く瞬間の胴 = 帯域通過フィルタ三本に白色雑音を通した「ドン」。
//     玉が大きいほど低い。ここだけは音程を持たない。
//  すべてコンプレッサ経由。同時発音は上限つきで間引く。
// ═══════════════════════════════════════════════════════════════════════
var ac=null, master=null, comp=null, wetG=null, dryG=null, noiseBuf=null;
var soundOn=true, voices=0, VOICE_MAX=30;

function makeNoise(){
  if (!ac) return null;
  var n=Math.max(1,Math.floor(ac.sampleRate*2));
  var b=ac.createBuffer(1,n,ac.sampleRate);
  var d=b.getChannelData(0), i;
  for (i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function makeIR(){
  if (!ac) return null;
  var dur=1.7, n=Math.max(1,Math.floor(ac.sampleRate*dur));
  var b=ac.createBuffer(2,n,ac.sampleRate), ch,i;
  for (ch=0;ch<2;ch++){
    var d=b.getChannelData(ch);
    for (i=0;i<n;i++){
      var x=i/n;
      // 対岸から返ってくる、暗くて平らな尾
      d[i]=(Math.random()*2-1)*Math.pow(1-x,2.6)*(0.36+0.64*Math.pow(1-x,0.4));
    }
  }
  return b;
}
function initAudio(){
  if (ac) return;
  var AC=(typeof window!=='undefined')?(window.AudioContext||window.webkitAudioContext):null;
  if (!AC) return;
  try{ ac=new AC(); }catch(e){ ac=null; return; }
  comp=ac.createDynamicsCompressor();
  try{
    comp.threshold.value=-19; comp.knee.value=26; comp.ratio.value=7;
    comp.attack.value=0.004; comp.release.value=0.26;
  }catch(e){}
  master=ac.createGain(); master.gain.value=soundOn?0.9:0.0001;
  comp.connect(master); master.connect(ac.destination);
  dryG=ac.createGain(); dryG.gain.value=0.86; dryG.connect(comp);
  wetG=ac.createGain(); wetG.gain.value=0.3;
  try{
    var cvn=ac.createConvolver(); cvn.buffer=makeIR(); cvn.normalize=true;
    wetG.connect(cvn); cvn.connect(comp);
  }catch(e){ wetG.connect(comp); }
  noiseBuf=makeNoise();
}
function setSound(on){
  soundOn=!!on;
  sndBtn.textContent=soundOn?'音 ON':'音 OFF';
  if (soundOn) sndBtn.classList.add('on'); else sndBtn.classList.remove('on');
  if (ac&&master){
    try{ master.gain.setTargetAtTime(soundOn?0.9:0.0001,ac.currentTime,0.05); }catch(e){}
  }
}
sndBtn.addEventListener('click',function(){ setSound(!soundOn); });

function outFor(pan){
  // 定位。左右いっぱいには振らない（空は広いが耳は狭い）
  if (!ac) return null;
  var p=clamp(fin(pan)?pan:0,-1,1)*0.78;
  var node=null;
  if (ac.createStereoPanner){
    node=ac.createStereoPanner();
    try{ node.pan.value=p; }catch(e){}
  } else {
    node=ac.createGain();
  }
  node.connect(dryG); node.connect(wetG);
  return node;
}
function release(){ voices=Math.max(0,voices-1); }
function relOnce(){
  // onended を落とすブラウザでも声が漏れないよう、時間でも必ず戻す
  var done=false;
  return function(){ if (done) return; done=true; voices=Math.max(0,voices-1); };
}

// ── 星ひと粒 ─ FM ベル ────────────────────────────────────────────
function ping(freq,pan,amp,dec,bright){
  if (!ac||!soundOn) return;
  if (!fin(freq)||freq<=20||freq>9000) return;
  if (!fin(amp)||amp<=0) return;
  if (voices>=VOICE_MAX) return;
  voices++;
  var t=ac.currentTime;
  var d=fin(dec)?clamp(dec,0.14,3.2):0.9;
  var out=outFor(pan);
  var car=ac.createOscillator(); car.type='sine';
  var mod=ac.createOscillator(); mod.type='sine';
  var mg=ac.createGain();
  var vg=ac.createGain();
  try{
    car.frequency.setValueAtTime(freq,t);
    mod.frequency.setValueAtTime(freq*3.51,t);
    var idx=freq*(fin(bright)?clamp(bright,0.3,4):1.4);
    mg.gain.setValueAtTime(idx,t);
    mg.gain.exponentialRampToValueAtTime(Math.max(1,idx*0.02),t+d*0.42);
    vg.gain.setValueAtTime(0.0001,t);
    vg.gain.exponentialRampToValueAtTime(clamp(amp,0.0002,0.6),t+0.004);
    vg.gain.exponentialRampToValueAtTime(0.0001,t+d);
  }catch(e){ voices=Math.max(0,voices-1); return; }
  mod.connect(mg); mg.connect(car.frequency);
  car.connect(vg); vg.connect(out);
  var rel=relOnce();
  car.onended=rel;
  try{ mod.start(t); car.start(t); mod.stop(t+d+0.05); car.stop(t+d+0.05); }
  catch(e){ rel(); return; }
  if (typeof setTimeout==='function') setTimeout(rel,(d+0.35)*1000);
}

// ── 開く瞬間の胴 ─ 雑音を三本の共鳴に通す ───────────────────────
var BOOM_F=[[190,300,470],[118,188,296],[74,124,198]];
function boom(size,pan,amp){
  if (!ac||!soundOn||!noiseBuf) return;
  var t=ac.currentTime;
  var F=BOOM_F[clamp(size|0,0,2)];
  var out=outFor(pan);
  var src=ac.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  var dur=0.26+size*0.20;
  var vg=ac.createGain();
  try{
    vg.gain.setValueAtTime(0.0001,t);
    vg.gain.exponentialRampToValueAtTime(clamp(amp,0.001,0.5),t+0.008);
    vg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }catch(e){ return; }
  var i;
  for (i=0;i<3;i++){
    var bp=ac.createBiquadFilter(); bp.type='bandpass';
    try{ bp.frequency.value=F[i]; bp.Q.value=5.5+i*2.4; }catch(e){}
    var gg=ac.createGain(); gg.gain.value=[1,0.62,0.35][i];
    src.connect(bp); bp.connect(gg); gg.connect(vg);
  }
  // 腹に来る低い成分
  var sub=ac.createOscillator(); sub.type='sine';
  var sg=ac.createGain();
  try{
    sub.frequency.setValueAtTime(F[0]*0.52,t);
    sub.frequency.exponentialRampToValueAtTime(F[0]*0.33,t+dur*0.8);
    sg.gain.setValueAtTime(0.0001,t);
    sg.gain.exponentialRampToValueAtTime(clamp(amp*0.8,0.001,0.4),t+0.012);
    sg.gain.exponentialRampToValueAtTime(0.0001,t+dur*1.1);
  }catch(e){}
  sub.connect(sg); sg.connect(out);
  vg.connect(out);
  try{
    src.start(t); src.stop(t+dur+0.05);
    sub.start(t); sub.stop(t+dur*1.1+0.05);
  }catch(e){}
}

// ── 上がっていく笛 ───────────────────────────────────────────────
function whistle(dur,pan,amp){
  if (!ac||!soundOn||!noiseBuf) return;
  var t=ac.currentTime;
  var d=clamp(fin(dur)?dur:1,0.25,3.2);
  var out=outFor(pan);
  var src=ac.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  var bp=ac.createBiquadFilter(); bp.type='bandpass';
  var vg=ac.createGain();
  try{
    bp.frequency.setValueAtTime(760,t);
    bp.frequency.exponentialRampToValueAtTime(2150,t+d);
    bp.Q.value=15;
    vg.gain.setValueAtTime(0.0001,t);
    vg.gain.exponentialRampToValueAtTime(clamp(amp,0.001,0.3),t+0.09);
    vg.gain.exponentialRampToValueAtTime(0.0001,t+d);
  }catch(e){ return; }
  src.connect(bp); bp.connect(vg); vg.connect(out);
  try{ src.start(t); src.stop(t+d+0.05); }catch(e){}
}

// ── 導火線 ───────────────────────────────────────────────────────
function crackle(pan,amp){
  if (!ac||!soundOn||!noiseBuf) return;
  var t=ac.currentTime, d=0.045;
  var out=outFor(pan);
  var src=ac.createBufferSource(); src.buffer=noiseBuf;
  try{ src.playbackRate.value=rnd(0.8,1.6); }catch(e){}
  var hp=ac.createBiquadFilter(); hp.type='highpass';
  try{ hp.frequency.value=2600; }catch(e){}
  var vg=ac.createGain();
  try{
    vg.gain.setValueAtTime(clamp(amp,0.0005,0.2),t);
    vg.gain.exponentialRampToValueAtTime(0.0001,t+d);
  }catch(e){ return; }
  src.connect(hp); hp.connect(vg); vg.connect(out);
  try{ src.start(t); src.stop(t+d+0.02); }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  SCALE — 五音。どの星が消えても外れた音にならない。
// ═══════════════════════════════════════════════════════════════════════
var SCALES=[
  { name:'夜', deg:[0,2,5,7,9]  },   // 陽旋法
  { name:'宵', deg:[0,1,5,7,8]  },   // 都節
  { name:'祭', deg:[0,4,5,7,11] }    // 琉球
];
var scIdx=0, BASE=55.0;              // A1
function freqOf(d){
  var S=SCALES[scIdx].deg, n=S.length;
  var o=Math.floor(d/n), i=d-o*n;
  if (i<0){ i+=n; o-=1; }
  var semi=S[i]+12*o;
  var f=BASE*Math.pow(2,semi/12);
  return (fin(f)&&f>20&&f<9000)?f:440;
}
function setScale(i){
  scIdx=clamp(i|0,0,SCALES.length-1);
  var k;
  for (k=0;k<scBtns.length;k++){
    if (!scBtns[k]) continue;
    if (k===scIdx) scBtns[k].classList.add('on'); else scBtns[k].classList.remove('on');
  }
}
for (var _s=0;_s<scBtns.length;_s++){
  (function(i){
    if (!scBtns[i]) return;
    scBtns[i].addEventListener('click',function(){ setScale(i); });
  })(_s);
}

// ═══════════════════════════════════════════════════════════════════════
//  POOLS
//  玉 12 / 星 2600 / 煙 220。すべて固定長。増やさない、減らさない。
// ═══════════════════════════════════════════════════════════════════════
var SH_N=12;
var sh_on=new Uint8Array(SH_N), sh_x=new Float32Array(SH_N), sh_y=new Float32Array(SH_N);
var sh_vx=new Float32Array(SH_N), sh_vy=new Float32Array(SH_N);
var sh_t=new Float32Array(SH_N), sh_fuse=new Float32Array(SH_N);
var sh_kind=new Uint8Array(SH_N), sh_col=new Uint8Array(SH_N), sh_col2=new Uint8Array(SH_N);
var sh_deg=new Int16Array(SH_N), sh_pw=new Float32Array(SH_N);

var ST_N=4200;
var st_life=new Float32Array(ST_N), st_max=new Float32Array(ST_N);
var st_x=new Float32Array(ST_N), st_y=new Float32Array(ST_N);
var st_px=new Float32Array(ST_N), st_py=new Float32Array(ST_N);
var st_vx=new Float32Array(ST_N), st_vy=new Float32Array(ST_N);
var st_drag=new Float32Array(ST_N), st_z=new Float32Array(ST_N);
var st_col=new Uint8Array(ST_N), st_col2=new Uint8Array(ST_N);
var st_sing=new Int16Array(ST_N), st_kind=new Uint8Array(ST_N);
var st_r=new Float32Array(ST_N), st_twk=new Float32Array(ST_N);
var stHead=0, stLive=0;

var SM_N=260;
var sm_life=new Float32Array(SM_N), sm_max=new Float32Array(SM_N);
var sm_x=new Float32Array(SM_N), sm_y=new Float32Array(SM_N);
var sm_vx=new Float32Array(SM_N), sm_vy=new Float32Array(SM_N);
var sm_r=new Float32Array(SM_N), sm_rot=new Float32Array(SM_N);
var smHead=0;

// 照らされ具合。これがカメラ映像の合成量と色になる。
var litAmt=0, litR=255, litG=210, litB=122;
var flash=0;
var density=0.85, windK=0.38, windPh=0;

function readControls(){
  var d=parseFloat(denEl&&denEl.value);
  density=fin(d)?clamp(d/100,0.3,1):0.85;
  var w=parseFloat(windEl&&windEl.value);
  windK=fin(w)?clamp(w/100,0,1):0.38;
}
if (denEl) denEl.addEventListener('input',readControls);
if (windEl) windEl.addEventListener('input',readControls);

// ═══════════════════════════════════════════════════════════════════════
//  SPAWNING
// ═══════════════════════════════════════════════════════════════════════
function addSmoke(x,y,r,life,vx,vy){
  var i=smHead; smHead=(smHead+1)%SM_N;
  sm_x[i]=x; sm_y[i]=y; sm_vx[i]=vx||0; sm_vy[i]=vy||0;
  sm_r[i]=r; sm_max[i]=life; sm_life[i]=life; sm_rot[i]=Math.random()*TAU;
}

function addStar(x,y,vx,vy,life,drag,z,c1,c2,kind,sing,r){
  var i=stHead; stHead=(stHead+1)%ST_N;
  if (st_life[i]<=0) stLive++;
  st_x[i]=x; st_y[i]=y; st_px[i]=x; st_py[i]=y;
  st_vx[i]=vx; st_vy[i]=vy;
  st_life[i]=life; st_max[i]=life; st_drag[i]=drag; st_z[i]=z;
  st_col[i]=c1; st_col2[i]=c2; st_kind[i]=kind; st_sing[i]=sing;
  st_r[i]=r; st_twk[i]=Math.random()*TAU;
}

// kind: 0=小玉 1=牡丹 2=柳
var KIND_NAME=['小玉','牡丹','柳'];
function launch(x,y,vx,vy,kind,degRoot){
  var i,slot=-1;
  for (i=0;i<SH_N;i++){ if (!sh_on[i]){ slot=i; break; } }
  if (slot<0) return false;
  sh_on[slot]=1;
  sh_x[slot]=x; sh_y[slot]=y; sh_vx[slot]=vx; sh_vy[slot]=vy;
  sh_t[slot]=0;
  // 頂点で開く。ただし画面の上へ抜けてしまう玉は、天井で開かせる。
  var tapex=(vy<0)?(-vy/GRAV):0.12;
  var yTop=H*0.10, tb=tapex;
  if (y>yTop){
    var disc=vy*vy-2*GRAV*(y-yTop);
    if (disc>0){
      var tt=(-vy-Math.sqrt(disc))/GRAV;
      if (fin(tt)&&tt>0&&tt<tb) tb=tt;
    }
  } else tb=0.15;
  sh_fuse[slot]=clamp(tb,0.15,3.0);
  sh_kind[slot]=kind;
  var c1=1+Math.floor(Math.random()*(NCOL-1));
  var c2=(kind===2)?0:(1+Math.floor(Math.random()*(NCOL-1)));
  sh_col[slot]=c1; sh_col2[slot]=c2;
  sh_deg[slot]=degRoot;
  sh_pw[slot]=0;
  whistle(sh_fuse[slot],clamp((x/W)*2-1,-1,1),0.055);
  return true;
}

function burst(k){
  var x=sh_x[k], y=sh_y[k], kind=sh_kind[k];
  var c1=sh_col[k], c2=sh_col2[k], root=sh_deg[k];
  var pan=clamp((x/W)*2-1,-1,1);
  var i;
  // ── 数と形 ────────────────────────────────────────────────
  var base=[220,460,360][kind];
  var n=Math.round(base*density);
  var spd=SHORT*[0.30,0.42,0.30][kind];
  var drag=[1.55,1.15,0.62][kind];
  var lifeB=[0.95,1.65,3.10][kind];
  var rad=SHORT*[0.0032,0.0040,0.0038][kind];
  // 歌う星。音が濁らないよう一玉あたり上限つき。
  var singN=Math.min(16,Math.max(7,Math.round(n*0.055)));
  var singStep=Math.max(1,Math.floor(n/singN));
  var chord=[0,2,4,5,7];
  for (i=0;i<n;i++){
    // 3次元の一様な向き（球殻）を 2D へ落とす。奥行きは明るさと大きさへ。
    var u=Math.random()*2-1, ph=Math.random()*TAU;
    var s=Math.sqrt(Math.max(0,1-u*u));
    var dx=s*Math.cos(ph), dy=s*Math.sin(ph), dz=u;
    var sp=spd*(0.80+Math.random()*0.30);
    var life=lifeB*(0.72+Math.random()*0.56);
    var col=(Math.random()<0.5)?c1:c2;
    var sing=-1;
    if (i%singStep===0){
      var deg=root+chord[(i/singStep|0)%5]+((Math.random()<0.28)?5:0);
      sing=deg;
    }
    addStar(x,y,dx*sp,dy*sp+(kind===2?SHORT*0.05:0),
            life,drag,dz,col,(kind===2?0:col),kind,sing,
            rad*(0.75+0.5*Math.random())*(1+0.3*dz));
  }
  // ── 光と音 ───────────────────────────────────────────────
  var size=kind; // 0 小 → 2 大
  var amp=[0.16,0.22,0.26][kind];
  boom(size,pan,amp);
  // 開いた瞬間の和音（胴とは別に、根音・五度・オクターブ）
  var ch=[0,2,4];
  for (i=0;i<3;i++){
    ping(freqOf(root+ch[i]),pan*0.6,0.055-i*0.012,1.5+i*0.4,1.0);
  }
  var cc=COL[c1]||COL[0];
  var w=[0.55,0.95,0.8][kind];
  litAmt=Math.min(1.6,litAmt+w);
  litR=litR*0.35+cc[0]*0.65; litG=litG*0.35+cc[1]*0.65; litB=litB*0.35+cc[2]*0.65;
  flash=Math.min(1,flash+[0.20,0.34,0.26][kind]);
  var sn=[2,4,3][kind];
  for (i=0;i<sn;i++){
    addSmoke(x+rnd(-1,1)*SHORT*0.02,y+rnd(-1,1)*SHORT*0.02,
             SHORT*rnd(0.035,0.075),rnd(7,13),rnd(-8,8),rnd(-14,-3));
  }
  sh_on[k]=0;
}

// ── スターマイン ─ 一晩に一度の大盤振る舞い ──────────────────────
var mineQueue=[], mineT=0;
function starmine(){
  var i;
  mineQueue.length=0;
  for (i=0;i<10;i++){
    mineQueue.push({
      d:i*0.13,
      x:W*(0.10+0.80*(i/9))+rnd(-1,1)*W*0.03,
      k:(i%3===1)?2:((i%3===0)?1:0),
      g:14+((i*3)%9)
    });
  }
  mineT=0;
  flash=Math.min(1,flash+0.38);
}
function pumpMine(dt){
  if (mineQueue.length===0) return;
  mineT+=dt;
  var i=0;
  while (i<mineQueue.length){
    var m=mineQueue[i];
    if (mineT>=m.d){
      launch(m.x,H*1.02,rnd(-1,1)*SHORT*0.05,-SHORT*rnd(0.82,1.02),m.k,m.g);
      mineQueue.splice(i,1);
    } else i++;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  PLAY — つまむ / ためる / 放す
//  ためた時間 c(0..1) がひとつで三つを決める:
//    玉の大きさ（小玉→牡丹→柳）・上がる高さ・鳴る高さ（大きいほど低い）
// ═══════════════════════════════════════════════════════════════════════
var PIN_ON=0.56, PIN_OFF=0.76, CHARGE_MAX=1.30;
var autoT=0, autoNext=1.2;

function kindOf(c){ return (c<0.28)?0:((c<0.68)?1:2); }
function degOf(c){ return Math.round(24-18*clamp(c,0,1)); }

function doLaunch(x,y,vx,vy,c){
  var k=kindOf(c);
  return launch(x,y,vx,vy,k,degOf(c));
}

function updateHands(dt,t){
  var k;
  var bothUp=true, anyUp=false;
  for (k=0;k<2;k++){
    var h=HAND[k];
    if (!handLive(k)){
      if (h.pinch){ h.pinch=false; h.charge=0; }   // 見失ったら不発。暴発させない
      bothUp=false;
      continue;
    }
    if (h.raised) anyUp=true; else bothUp=false;
    var r=fin(h.pinchR)?h.pinchR:9;
    if (!h.pinch){
      if (r<PIN_ON && !h.fresh){ h.pinch=true; h.charge=0; }
    } else {
      h.charge=Math.min(CHARGE_MAX,h.charge+dt);
      var pan=clamp((h.hx/W)*2-1,-1,1);
      h.crT=(h.crT||0)+dt;
      var iv=0.085-0.045*(h.charge/CHARGE_MAX);
      if (h.crT>iv){ h.crT=0; crackle(pan,0.012+0.03*(h.charge/CHARGE_MAX)); }
      if (r>PIN_OFF){
        var c=h.charge/CHARGE_MAX;
        h.pinch=false; h.charge=0;
        if (c>0.09){
          var sp=SHORT*(0.42+0.40*c);
          var lvx=clamp(h.vx*0.55,-SHORT*0.35,SHORT*0.35);
          var lvy=-sp+clamp(h.vy*0.30,-SHORT*0.2,SHORT*0.2);
          if (lvy>-SHORT*0.30) lvy=-SHORT*0.30;
          doLaunch(h.hx,h.hy,lvx,lvy,c);
          addSmoke(h.hx,h.hy,SHORT*0.012,2.4,lvx*0.1,-SHORT*0.02);
        }
      }
    }
  }
  if (seenN<2) bothUp=false;
  if (bothUp&&anyUp) raiseT+=dt; else raiseT=0;
  if (raiseT>0.45 && (t-mineCool)>9){
    mineCool=t; raiseT=0; starmine();
  }
  // 誰も見えないときは、空が空っぽにならないように自分で上げる
  if ((t-lastSeen)>5){
    autoT+=dt;
    if (autoT>autoNext){
      autoT=0; autoNext=rnd(1.3,3.0);
      var c2=Math.random();
      doLaunch(W*rnd(0.16,0.84),H*1.02,rnd(-1,1)*SHORT*0.06,
               -SHORT*(0.42+0.40*c2),c2);
    }
  } else { autoT=0; }
}

// ═══════════════════════════════════════════════════════════════════════
//  SIM
// ═══════════════════════════════════════════════════════════════════════
var st_bk=new Uint8Array(ST_N);
var BKN=32;
var bkCount=new Int32Array(BKN+1), bkOff=new Int32Array(BKN+1);
var bkOrder=new Int32Array(ST_N);
var ABAND=[0.16,0.34,0.62,0.98];

function step(dt,t){
  var i,k;
  windPh+=dt*0.33;
  var wind=windK*SHORT*0.16*(0.55+0.45*Math.sin(windPh)+0.25*Math.sin(windPh*2.31));

  pumpMine(dt);

  // ── 玉 ──────────────────────────────────────────────────
  var shN=0;
  for (k=0;k<SH_N;k++){
    if (!sh_on[k]) continue;
    shN++;
    sh_t[k]+=dt;
    sh_vy[k]+=GRAV*dt;
    sh_vx[k]+=wind*0.25*dt;
    sh_x[k]+=sh_vx[k]*dt; sh_y[k]+=sh_vy[k]*dt;
    sh_pw[k]+=dt;
    if (sh_pw[k]>0.034){
      sh_pw[k]=0;
      addSmoke(sh_x[k],sh_y[k],SHORT*rnd(0.006,0.013),rnd(2.6,5.2),
               rnd(-6,6),rnd(-4,2));
    }
    if (sh_t[k]>=sh_fuse[k] || sh_y[k]>H*1.25 || sh_x[k]<-W*0.3 || sh_x[k]>W*1.3){
      if (sh_y[k]>H*1.2||sh_x[k]<-W*0.3||sh_x[k]>W*1.3) sh_on[k]=0;
      else burst(k);
    }
  }

  // ── 星 ──────────────────────────────────────────────────
  var live=0;
  for (i=0;i<ST_N;i++){
    if (st_life[i]<=0){ st_bk[i]=255; continue; }
    var df=1/(1+st_drag[i]*dt);
    st_vx[i]=(st_vx[i]+wind*dt)*df;
    st_vy[i]=st_vy[i]*df+GRAV*dt*0.62;
    st_px[i]=st_x[i]; st_py[i]=st_y[i];
    st_x[i]+=st_vx[i]*dt; st_y[i]+=st_vy[i]*dt;
    st_life[i]-=dt;
    if (st_life[i]<=0 || st_y[i]>H*1.06 || st_x[i]<-W*0.15 || st_x[i]>W*1.15){
      var onScreen=(st_y[i]<=H*1.06&&st_x[i]>=-W*0.15&&st_x[i]<=W*1.15);
      if (st_sing[i]>=0 && onScreen){
        var pan=clamp((st_x[i]/W)*2-1,-1,1);
        var kd=st_kind[i];
        ping(freqOf(st_sing[i]),pan,[0.050,0.044,0.056][kd],
             [0.55,0.85,1.5][kd],[1.8,1.35,0.9][kd]);
      }
      st_life[i]=0; st_bk[i]=255; st_sing[i]=-1;
      continue;
    }
    live++;
    // 明るさ — 生まれぎわは白く強く、消えぎわは瞬く
    var u=st_life[i]/st_max[i];
    var b=(u>0.86)?1:(0.18+0.82*Math.pow(u,0.72));
    b*=0.62+0.38*st_z[i]*0.5+0.19;
    if (st_kind[i]!==2 && u<0.42){
      b*=0.55+0.45*Math.sin(t*38+st_twk[i]);
    }
    if (b<0.05){ st_bk[i]=255; continue; }
    var ci=(st_kind[i]===2&&u<0.55)?0:st_col[i];
    var band=(b>0.78)?3:((b>0.46)?2:((b>0.2)?1:0));
    st_bk[i]=(ci&7)*4+band;
  }
  stLive=live;

  // ── 煙 ──────────────────────────────────────────────────
  for (i=0;i<SM_N;i++){
    if (sm_life[i]<=0) continue;
    sm_vx[i]+=wind*0.5*dt;
    sm_vy[i]+=-SHORT*0.004*dt;
    sm_x[i]+=sm_vx[i]*dt; sm_y[i]+=sm_vy[i]*dt;
    sm_r[i]+=SHORT*0.012*dt;
    sm_life[i]-=dt;
    if (sm_life[i]<0) sm_life[i]=0;
  }

  // ── 照らされ具合 ────────────────────────────────────────
  litAmt*=Math.pow(0.055,dt);
  flash*=Math.pow(0.016,dt);
  if (litAmt<0.0005) litAmt=0;
  if (flash<0.0005) flash=0;

  if (rShell) rShell.textContent=String(shN);
  if (rStar) rStar.textContent=String(stLive);
  if (rMode){
    var cm='—';
    if (HAND[0].pinch||HAND[1].pinch){
      var cc=Math.max(HAND[0].pinch?HAND[0].charge:0,HAND[1].pinch?HAND[1].charge:0);
      cm=KIND_NAME[kindOf(cc/CHARGE_MAX)]+' 　'+Math.round(cc/CHARGE_MAX*100)+'%';
    } else if (seenN===0) cm='自動';
    else cm='つまむ';
    rMode.textContent=cm;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════
function drawGlow(t){
  var c=glowCx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,GW,GH);
  c.globalCompositeOperation='lighter';
  c.lineCap='round'; c.lineJoin='round';

  // 星 — 色 × 明るさ で 32 のたばに分けて一気に引く
  var i,b;
  for (b=0;b<=BKN;b++) bkCount[b]=0;
  for (i=0;i<ST_N;i++){
    var k=st_bk[i];
    if (k>=BKN) continue;
    bkCount[k]++;
  }
  var acc=0;
  for (b=0;b<BKN;b++){ bkOff[b]=acc; acc+=bkCount[b]; }
  bkOff[BKN]=acc;
  for (b=0;b<BKN;b++) bkCount[b]=bkOff[b];
  for (i=0;i<ST_N;i++){
    var kk=st_bk[i];
    if (kk>=BKN) continue;
    bkOrder[bkCount[kk]++]=i;
  }
  var lw=Math.max(0.7,SHORT*0.0030*GQ);
  for (b=0;b<BKN;b++){
    var s=bkOff[b], e=bkOff[b+1];
    if (e<=s) continue;
    var col=b>>2, band=b&3;
    c.strokeStyle=colStr(col,ABAND[band]);
    c.lineWidth=lw*(0.7+band*0.22);
    c.beginPath();
    for (i=s;i<e;i++){
      var j=bkOrder[i];
      c.moveTo(st_px[j]*GQ,st_py[j]*GQ);
      c.lineTo(st_x[j]*GQ,st_y[j]*GQ);
    }
    c.stroke();
  }

  // 上がっていく玉 — 火の粉を散らしながら
  var k2;
  for (k2=0;k2<SH_N;k2++){
    if (!sh_on[k2]) continue;
    var x=sh_x[k2]*GQ, y=sh_y[k2]*GQ;
    var r=Math.max(2,SHORT*0.012*GQ);
    c.globalAlpha=0.85;
    c.drawImage(dotCv,x-r,y-r,r*2,r*2);
    c.globalAlpha=1;
    c.strokeStyle='rgba(255,196,110,.5)';
    c.lineWidth=Math.max(0.8,SHORT*0.0022*GQ);
    c.beginPath();
    c.moveTo(x,y);
    c.lineTo(x-sh_vx[k2]*0.045*GQ,y-sh_vy[k2]*0.045*GQ);
    c.stroke();
    var q;
    for (q=0;q<3;q++){
      var a=t*9+q*2.1+k2;
      var sxp=x-sh_vx[k2]*0.02*GQ*(q+1)+Math.sin(a)*3;
      var syp=y-sh_vy[k2]*0.02*GQ*(q+1)+Math.cos(a*1.3)*3;
      c.fillStyle='rgba(255,'+(150+q*28)+',90,'+(0.5-q*0.13).toFixed(2)+')';
      c.fillRect(sxp-0.9,syp-0.9,1.8,1.8);
    }
  }
  // 指のあいだで育っている玉
  var hk;
  for (hk=0;hk<2;hk++){
    var h=HAND[hk];
    if (!handLive(hk)||!h.pinch) continue;
    var cN=h.charge/CHARGE_MAX;
    var rr=Math.max(2,SHORT*(0.009+0.026*cN)*GQ);
    var pul=1+0.10*Math.sin(t*(11+18*cN));
    c.globalAlpha=clamp(0.5+0.5*cN,0,1);
    c.drawImage(dotCv,h.hx*GQ-rr*pul,h.hy*GQ-rr*pul,rr*2*pul,rr*2*pul);
    c.globalAlpha=1;
  }
  c.globalCompositeOperation='source-over';
}

var REFN=18;
function drawReflection(t){
  var band=H-horizonY;
  if (band<=2) return;
  var n=REFN, i;
  g.save();
  g.globalCompositeOperation='lighter';
  for (i=0;i<n;i++){
    var y0=horizonY+band*(i/n);
    var hgt=band/n+1;
    var d=(i+0.5)/n;                       // 手前ほど暗く、ぼやけて、揺れる
    var a=(0.34*(1-d*0.82))*clamp(0.35+litAmt*0.9,0,1.2);
    if (a<0.004) continue;
    var wob=Math.sin(t*1.5+i*0.72)*(SHORT*0.004+SHORT*0.016*d);
    var stretch=1+d*0.5;
    // 空の、水平線から上へ d だけ離れた帯を、下へ折り返す
    var sy0=(horizonY-band*d*stretch)*GQ;
    var sh0=Math.max(1,(band/n)*stretch*GQ);
    if (sy0<0){ sy0=0; }
    g.globalAlpha=a;
    g.drawImage(glowCv,0,sy0,GW,sh0,wob,y0,W,hgt);
  }
  g.restore();
  // 水面のきらめき
  g.save();
  g.globalCompositeOperation='lighter';
  var sh=clamp(litAmt,0,1);
  if (sh>0.02){
    g.strokeStyle='rgba(180,210,255,'+(0.05*sh).toFixed(3)+')';
    g.lineWidth=1;
    g.beginPath();
    for (i=0;i<9;i++){
      var yy=horizonY+band*(0.08+0.10*i);
      var ww=W*(0.1+0.09*i);
      var xx=W*0.5+Math.sin(t*0.9+i*1.7)*W*0.12;
      g.moveTo(xx-ww*0.5,yy); g.lineTo(xx+ww*0.5,yy);
    }
    g.stroke();
  }
  g.restore();
}

function drawCameraLight(){
  if (litAmt<=0.004) return;
  if (!vcCv) return;
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (!vw||!vh) return;
  var c=vcCx, VW=vcCv.width, VH=vcCv.height;
  c.setTransform(1,0,0,1,0,0);
  c.globalCompositeOperation='source-over';
  c.globalAlpha=1;
  try{
    if (mirror){ c.save(); c.translate(VW,0); c.scale(-1,1); c.drawImage(video,0,0,VW,VH); c.restore(); }
    else c.drawImage(video,0,0,VW,VH);
  }catch(e){ return; }
  // 花火の色で染める（ここが小さいから安い）
  c.globalCompositeOperation='multiply';
  c.fillStyle='rgb('+Math.round(litR)+','+Math.round(litG)+','+Math.round(litB)+')';
  c.fillRect(0,0,VW,VH);
  c.globalCompositeOperation='source-over';

  var a=clamp(litAmt*0.30,0,0.42);
  g.save();
  g.globalCompositeOperation='lighter';
  g.globalAlpha=a;
  var rw=covS, rh=covS/camAspect;
  g.drawImage(vcCv,covOX,covOY,rw,rh);
  g.restore();
}

function drawSmoke(){
  var i;
  g.save();
  g.globalCompositeOperation='lighter';
  for (i=0;i<SM_N;i++){
    if (sm_life[i]<=0) continue;
    var u=sm_life[i]/sm_max[i];
    var a=clamp(Math.sin(clamp(u,0,1)*Math.PI)*0.34,0,0.34)*(0.35+litAmt*0.75);
    if (a<0.004) continue;
    var r=sm_r[i];
    g.globalAlpha=a;
    g.drawImage(smokeCv,sm_x[i]-r,sm_y[i]-r,r*2,r*2);
  }
  g.restore();
}

function drawHands(t){
  var k,i;
  g.save();
  for (k=0;k<2;k++){
    if (!handLive(k)) continue;
    var h=HAND[k];
    for (i=0;i<5;i++){
      var a=(i<2)?0.5:0.22;
      g.fillStyle='rgba(255,210,122,'+a+')';
      g.beginPath();
      g.arc(h.tx[i],h.ty[i],Math.max(1.4,SHORT*0.0042),0,TAU);
      g.fill();
    }
    if (h.pinch){
      var cN=h.charge/CHARGE_MAX;
      g.strokeStyle='rgba(255,210,122,'+(0.2+0.45*cN).toFixed(3)+')';
      g.lineWidth=Math.max(1,SHORT*0.0022);
      g.beginPath(); g.moveTo(h.tx[0],h.ty[0]); g.lineTo(h.tx[1],h.ty[1]); g.stroke();
      // ためた分の環
      var rr=SHORT*(0.016+0.05*cN);
      g.strokeStyle='rgba(255,'+Math.round(210-110*cN)+','+Math.round(122-40*cN)+','+(0.28+0.4*cN).toFixed(3)+')';
      g.lineWidth=Math.max(1,SHORT*0.0026);
      g.beginPath();
      g.arc(h.hx,h.hy,rr,-Math.PI/2,-Math.PI/2+TAU*clamp(cN,0,1));
      g.stroke();
    } else {
      g.strokeStyle='rgba(126,182,255,.16)';
      g.lineWidth=Math.max(1,SHORT*0.0018);
      g.beginPath(); g.moveTo(h.tx[0],h.ty[0]); g.lineTo(h.tx[1],h.ty[1]); g.stroke();
    }
  }
  g.restore();
}

var fpsAvg=1/60, gqT=0;
function render(t,dt){
  // 負荷に合わせて発光レイヤの解像度を上下させる
  fpsAvg=fpsAvg*0.92+dt*0.08;
  gqT+=dt;
  if (gqT>1.1){
    gqT=0;
    var want=GQ;
    if (fpsAvg>0.040 && GQ>0.34) want=GQ-0.08;
    else if (fpsAvg<0.023 && GQ<0.52) want=GQ+0.06;
    if (want!==GQ){ GQ=clamp(want,0.32,0.52); layout(); }
  }

  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalCompositeOperation='source-over';
  g.globalAlpha=1;
  if (skyCv) g.drawImage(skyCv,0,0,W,H);

  drawCameraLight();
  drawSmoke();
  drawGlow(t);

  g.save();
  g.globalCompositeOperation='lighter';
  g.globalAlpha=1;
  g.drawImage(glowCv,0,0,W,H);
  // ブルーム — 縮小して戻すだけ。drawImage 二回で格が変わる。
  bloomCx.setTransform(1,0,0,1,0,0);
  bloomCx.clearRect(0,0,bloomCv.width,bloomCv.height);
  bloomCx.drawImage(glowCv,0,0,bloomCv.width,bloomCv.height);
  g.globalAlpha=0.82;
  g.drawImage(bloomCv,0,0,W,H);
  g.restore();

  drawReflection(t);

  if (flash>0.004){
    g.save();
    g.globalCompositeOperation='lighter';
    g.fillStyle='rgba('+Math.round(litR)+','+Math.round(litG)+','+Math.round(litB)+','+
      (clamp(flash,0,1)*0.13).toFixed(3)+')';
    g.fillRect(0,0,W,H);
    g.restore();
  }

  drawHands(t);
}

function frame(){
  var t=now();
  var dt=t-last; last=t;
  if (!fin(dt)||dt<0) dt=1/60;
  if (dt>0.062) dt=0.062;
  try{
    updateHands(dt,t);
    step(dt,t);
    render(t,dt);
  }catch(e){
    if (typeof console!=='undefined'&&console.error) console.error(e);
  }
  raf(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  START SHEET — つまんで、ためて、放す、を三秒で見せる
// ═══════════════════════════════════════════════════════════════════════
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var demoRun=true, demoT0=now();
var DW=680, DH=250;
var dStars=[];
function demoFrame(){
  if (!demoRun||!demoCtx) return;
  var c=demoCtx, t=now()-demoT0;
  var T=t%4.2;
  c.setTransform(1,0,0,1,0,0);
  var gr=c.createLinearGradient(0,0,0,DH);
  gr.addColorStop(0,'#05080f'); gr.addColorStop(1,'#0d1a33');
  c.fillStyle=gr; c.fillRect(0,0,DW,DH);

  var handY=DH*0.80, handX=DW*0.5;
  var gap, chg=0, phase;
  if (T<0.75){ phase=0; gap=34-(T/0.75)*24; }
  else if (T<2.15){ phase=1; gap=10; chg=(T-0.75)/1.4; }
  else { phase=2; gap=10+Math.min(26,(T-2.15)*90); chg=1; }

  // 指（二つの点と、そのあいだの線）
  c.strokeStyle='rgba(126,182,255,.4)'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(handX-gap,handY); c.lineTo(handX+gap,handY); c.stroke();
  c.fillStyle='rgba(255,210,122,.82)';
  c.beginPath(); c.arc(handX-gap,handY,5,0,TAU); c.fill();
  c.beginPath(); c.arc(handX+gap,handY,5,0,TAU); c.fill();

  // ためている玉
  if (phase<2 && chg>0){
    var r=5+chg*17;
    var grd=c.createRadialGradient(handX,handY,0,handX,handY,r*2.2);
    grd.addColorStop(0,'rgba(255,240,200,.95)');
    grd.addColorStop(0.35,'rgba(255,150,90,.6)');
    grd.addColorStop(1,'rgba(255,90,60,0)');
    c.fillStyle=grd;
    c.beginPath(); c.arc(handX,handY,r*2.2,0,TAU); c.fill();
    c.strokeStyle='rgba(255,210,122,.7)'; c.lineWidth=2;
    c.beginPath(); c.arc(handX,handY,r+10,-Math.PI/2,-Math.PI/2+TAU*chg); c.stroke();
  }

  // 上がって、開く
  if (phase===2){
    var u=(T-2.15);
    var v0=330, gg=210;
    var sy=handY-(v0*u-0.5*gg*u*u);
    var apex=v0/gg;
    if (u<apex){
      c.fillStyle='rgba(255,220,150,.95)';
      c.beginPath(); c.arc(handX,sy,4,0,TAU); c.fill();
      c.strokeStyle='rgba(255,170,100,.4)'; c.lineWidth=2;
      c.beginPath(); c.moveTo(handX,sy); c.lineTo(handX,sy+22); c.stroke();
      dStars.length=0;
    } else {
      if (dStars.length===0){
        var i;
        for (i=0;i<64;i++){
          var a=(i/64)*TAU+Math.random()*0.1;
          var sp=90*(0.8+Math.random()*0.35);
          dStars.push([handX,handY-(v0*apex-0.5*gg*apex*apex),Math.cos(a)*sp,Math.sin(a)*sp,
                       (i%3===0)?'255,210,122':((i%3===1)?'255,77,94':'169,240,209')]);
        }
      }
      var e=u-apex, i2;
      c.lineCap='round';
      for (i2=0;i2<dStars.length;i2++){
        var s=dStars[i2];
        var dfv=1/(1+1.4*e);
        var px2=s[0]+s[2]*e*dfv, py2=s[1]+s[3]*e*dfv+0.5*90*e*e;
        var al=clamp(1-e/1.2,0,1);
        c.strokeStyle='rgba('+s[4]+','+(al*0.9).toFixed(2)+')';
        c.lineWidth=2;
        c.beginPath();
        c.moveTo(px2-s[2]*0.02*dfv,py2-s[3]*0.02*dfv);
        c.lineTo(px2,py2);
        c.stroke();
      }
    }
  } else dStars.length=0;

  c.fillStyle='rgba(143,163,204,.85)';
  c.font='15px "Hina Mincho", serif';
  c.textAlign='center';
  c.fillText(phase===0?'つまむ':(phase===1?'ためる ─ 大きく育つ':'放す ─ 上がって、開く'),DW/2,30);
  raf(demoFrame);
}
if (demoCtx) demoFrame();

startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  initHands();
  startStream().then(startMpCamera).catch(showError);
  last=now();
  lastSeen=-99;
});

buildSprites();
resize();
readControls();
setScale(0);
setSound(true);
last=now();
frame();
</script>
