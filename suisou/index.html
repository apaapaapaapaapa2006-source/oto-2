<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="手の上に線だけの立方体が浮かび、その中に赤い水が入っている。手を傾ければ水が流れて寄り、振れば波打って跳ねる。両手を離すと箱が大きくなる。中の水は千八百粒の本物の粒子流体。">
<meta name="theme-color" content="#0b0a09">
<title>SUISOU ─ 手の上の水槽</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  SUISOU 水槽 ─ 手の上の水槽                            ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       色を落とした暗い部屋の映像の上に、細い橙の線で描いた立方体が
             ひとつ浮かぶ。中には赤い水。研究室の流体シミュレーションの画面を
             そのまま現実に重ねた感じ ── 端には本当に計算している数字が並ぶ。
  RULE       片手：箱は手のひらに乗り、手の向き（手首→中指、人差し指→小指）
             にそのまま回る。両手：箱は両手のあいだに浮かび、離すほど大きい。
             手が無いときは宙でゆっくり回り、画面をドラッグしても回せる。
  FLUID      箱の中の座標で 1,800 粒の粒子流体を解く（二重密度緩和）。重力は
             画面の下向きを箱の向きに直して与え、箱が急に動いた加速度は慣性と
             して逆向きにかかる。箱を回すと水は世界に残ろうとして箱の中で回る。
  LOOK       粒は赤橙の円。混んだところは塗りの円、まばらな粒は輪だけ ──
             しぶきが輪になって飛ぶ。カメラは彩度を落として暗く沈める。
  PALETTE    暗い映像・橙の線・赤い水が正。色は替えられる（赤・青・金・緑）。
  TYPE       Archivo Narrow と JetBrains Mono（計器の数字）。
  ══════════════════════════════════════════════════════════════════════════
-->

<div id="start">
  <div class="t">FLUID IN A HAND-HELD BOX</div>
  <h1>SUISOU</h1>
  <svg viewBox="0 0 140 140" aria-hidden="true">
    <path d="M30 50 L82 34 L118 56 L66 74 Z M30 50 L30 104 L66 128 L66 74 M118 56 L118 108 L66 128" fill="none" stroke="#f08a4b" stroke-width="1.6"/>
    <path d="M30 86 C46 80 58 92 66 96 C84 90 100 84 118 80 L118 108 L66 128 L30 104 Z" fill="#ff3d1f" opacity=".92"/>

  <p>まずは、いつものカメラ。<br>ボタンを押すと、手の上に水の入った箱が浮かびます。<br>傾けると流れ、振ると跳ねます。</p>

<script>
'use strict';
/* =====================================================================
   SUISOU — a 3D particle fluid (double-density relaxation: Clavet et al.
   2005) solved in the box's own coordinates, so the walls are always the
   cube [-1,1]^3. Each frame the box's world rotation R gives the fluid its
   gravity (screen-down turned into box axes), the box's own acceleration
   pushes back as inertia, and a turn of the box carries the water only
   part of the way round — the rest stays behind in the world and sloshes.
   Hands (MediaPipe HandLandmarker, world landmarks) give R from the palm:
   wrist→middle knuckle and index→pinky knuckles.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const COLS = [
  { name:'赤', water:'#ff3d1f', line:'#f08a4b' },
  { name:'青', water:'#2f8cff', line:'#9ccaf0' },
  { name:'金', water:'#ffb21f', line:'#f4d58a' },
  { name:'緑', water:'#5cff6a', line:'#b8f0a6' },
].map(c => Object.assign(c, { W:hex(c.water), L:hex(c.line) }));
const S = { col:0, amt:.55, visc:.2, grav:.5 };

/* ---------- small 3x3 rotation helpers (column-major arrays of 9) ---------- */
const m3 = {
  mul(a, b){ const o = new Array(9); for (let c = 0; c < 3; c++) for (let r = 0; r < 3; r++) o[c*3+r] = a[r]*b[c*3] + a[3+r]*b[c*3+1] + a[6+r]*b[c*3+2]; return o; },
  tr(a){ return [a[0],a[3],a[6], a[1],a[4],a[7], a[2],a[5],a[8]]; },
  app(a, x, y, z){ return [a[0]*x + a[3]*y + a[6]*z, a[1]*x + a[4]*y + a[7]*z, a[2]*x + a[5]*y + a[8]*z]; },
  rotX(t){ const c = Math.cos(t), s = Math.sin(t); return [1,0,0, 0,c,s, 0,-s,c]; },
  rotY(t){ const c = Math.cos(t), s = Math.sin(t); return [c,0,-s, 0,1,0, s,0,c]; },
  rotZ(t){ const c = Math.cos(t), s = Math.sin(t); return [c,s,0, -s,c,0, 0,0,1]; },
};
// rotation matrix <-> quaternion, to ease between orientations
function m2q(m){
  const t = m[0] + m[4] + m[8]; let w, x, y, z;
  if (t > 0){ const s = Math.sqrt(t + 1) * 2; w = s / 4; x = (m[5] - m[7]) / s; y = (m[6] - m[2]) / s; z = (m[1] - m[3]) / s; }
  else if (m[0] > m[4] && m[0] > m[8]){ const s = Math.sqrt(1 + m[0] - m[4] - m[8]) * 2; w = (m[5] - m[7]) / s; x = s / 4; y = (m[3] + m[1]) / s; z = (m[6] + m[2]) / s; }
  else if (m[4] > m[8]){ const s = Math.sqrt(1 + m[4] - m[0] - m[8]) * 2; w = (m[6] - m[2]) / s; x = (m[3] + m[1]) / s; y = s / 4; z = (m[7] + m[5]) / s; }
  else { const s = Math.sqrt(1 + m[8] - m[0] - m[4]) * 2; w = (m[1] - m[3]) / s; x = (m[6] + m[2]) / s; y = (m[7] + m[5]) / s; z = s / 4; }
  return [w, x, y, z];
}
function q2m(q){
  const [w, x, y, z] = q;
  return [1 - 2*(y*y + z*z), 2*(x*y + z*w), 2*(x*z - y*w),
          2*(x*y - z*w), 1 - 2*(x*x + z*z), 2*(y*z + x*w),
          2*(x*z + y*w), 2*(y*z - x*w), 1 - 2*(x*x + y*y)];
}
function qslerp(a, b, t){
  let d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
  if (d < 0){ b = b.map(v => -v); d = -d; }
  const o = a.map((v, i) => v + (b[i] - v) * t), n = Math.hypot(...o);
  return o.map(v => v / n);
}

/* ---------- the fluid ---------- */
const NMAX = 2400, H = .25, H2 = H * H;
const FL = {
  n:0, x:new Float32Array(NMAX * 3), p:new Float32Array(NMAX * 3), v:new Float32Array(NMAX * 3), rho:new Float32Array(NMAX),
  rad:.055, nb:new Int32Array(NMAX * 48), nbc:new Uint8Array(NMAX), grid:null, gN:0, cellStart:null, cellNext:new Int32Array(NMAX), want:0, ke:0, splash:0,
};
const G = Math.ceil(2 / H) + 1;
FL.cellStart = new Int32Array(G * G * G);
const cellOf = (x, y, z) => {
  const i = Math.min(G - 1, Math.max(0, (x + 1) / H | 0)), j = Math.min(G - 1, Math.max(0, (y + 1) / H | 0)), k = Math.min(G - 1, Math.max(0, (z + 1) / H | 0));
  return (k * G + j) * G + i;
};
function spawn(gx, gy, gz, count){
  // pour from the side the water would call "up"
  const L = Math.hypot(gx, gy, gz) || 1, ux = -gx / L, uy = -gy / L, uz = -gz / L;
  for (let c = 0; c < count && FL.n < FL.want; c++){
    const i = FL.n++ * 3;
    FL.x[i] = ux * .75 + (Math.random() - .5) * .7; FL.x[i+1] = uy * .75 + (Math.random() - .5) * .7; FL.x[i+2] = uz * .75 + (Math.random() - .5) * .7;
    for (let k = 0; k < 3; k++){ FL.x[i+k] = Math.max(-.9, Math.min(.9, FL.x[i+k])); FL.v[i+k] = -(k === 0 ? ux : k === 1 ? uy : uz) * 1.5; }
  }
}
function step(dt, gx, gy, gz){
  const n = FL.n, X = FL.x, P = FL.p, V = FL.v, R = FL.rad, lim = 1 - R;
  const visc = .02 + 2.2 * S.visc * S.visc;
  // gravity, then predict
  for (let i = 0; i < n; i++){
    const a = i * 3;
    V[a] += gx * dt; V[a+1] += gy * dt; V[a+2] += gz * dt;
    P[a] = X[a]; P[a+1] = X[a+1]; P[a+2] = X[a+2];
    X[a] += V[a] * dt; X[a+1] += V[a+1] * dt; X[a+2] += V[a+2] * dt;
  }
  // neighbour grid
  FL.cellStart.fill(-1);
  for (let i = 0; i < n; i++){ const a = i * 3, c = cellOf(X[a], X[a+1], X[a+2]); FL.cellNext[i] = FL.cellStart[c]; FL.cellStart[c] = i; }
  // double density relaxation; the neighbour search is done once and its list reused
  const k = .5 / (dt * dt) * .004, kn = k * 3.2, rho0 = 5, NB = FL.nb, NBC = FL.nbc;
  for (let i = 0; i < n; i++){
    const a = i * 3, xi = X[a], yi = X[a+1], zi = X[a+2], base = i * 48;
    const ci = Math.min(G - 1, Math.max(0, (xi + 1) / H | 0)), cj = Math.min(G - 1, Math.max(0, (yi + 1) / H | 0)), ck = Math.min(G - 1, Math.max(0, (zi + 1) / H | 0));
    let cnt = 0;
    for (let dk = -1; dk <= 1; dk++){ const kk = ck + dk; if (kk < 0 || kk >= G) continue;
      for (let dj = -1; dj <= 1; dj++){ const jj = cj + dj; if (jj < 0 || jj >= G) continue;
        for (let di = -1; di <= 1; di++){ const ii = ci + di; if (ii < 0 || ii >= G) continue;
          for (let j = FL.cellStart[(kk * G + jj) * G + ii]; j >= 0 && cnt < 48; j = FL.cellNext[j]){
            if (j === i) continue;
            const b = j * 3, dx = X[b] - xi, dy = X[b+1] - yi, dz = X[b+2] - zi;
            if (dx*dx + dy*dy + dz*dz < H2) NB[base + cnt++] = j;
          } } } }
    NBC[i] = cnt;
  }
  for (let i = 0; i < n; i++){
    const a = i * 3, xi = X[a], yi = X[a+1], zi = X[a+2], base = i * 48, cnt = NBC[i];
    let rho = 0, rhon = 0;
    for (let m = 0; m < cnt; m++){
      const b = NB[base + m] * 3, dx = X[b] - xi, dy = X[b+1] - yi, dz = X[b+2] - zi, r2 = dx*dx + dy*dy + dz*dz;
      if (r2 < H2){ const q = 1 - Math.sqrt(r2) / H; rho += q * q; rhon += q * q * q; }
    }
    FL.rho[i] = rho;
    const pr = k * (rho - rho0), prn = kn * rhon;
    let ddx = 0, ddy = 0, ddz = 0;
    for (let m = 0; m < cnt; m++){
      const b = NB[base + m] * 3, dx = X[b] - xi, dy = X[b+1] - yi, dz = X[b+2] - zi, r2 = dx*dx + dy*dy + dz*dz;
      if (r2 < H2 && r2 > 1e-10){
        const r = Math.sqrt(r2), q = 1 - r / H, D = dt * dt * (pr * q + prn * q * q) * .5 / r;
        X[b] += dx * D; X[b+1] += dy * D; X[b+2] += dz * D; ddx -= dx * D; ddy -= dy * D; ddz -= dz * D;
        // viscosity: pull neighbours' velocities together a little
        const ux = (V[a] - V[b]) * dx + (V[a+1] - V[b+1]) * dy + (V[a+2] - V[b+2]) * dz;
        if (ux > 0){ const I = dt * q * visc * ux / r2 * .5 * dt; X[a] -= dx * I; X[a+1] -= dy * I; X[a+2] -= dz * I; X[b] += dx * I; X[b+1] += dy * I; X[b+2] += dz * I; }
      }
    }
    X[a] += ddx; X[a+1] += ddy; X[a+2] += ddz;
  }
  // walls, and velocities from where everything ended up
  let ke = 0, sp = 0;
  const inv = 1 / dt;
  for (let i = 0; i < n; i++){
    const a = i * 3;
    for (let c = 0; c < 3; c++){
      if (X[a+c] < -lim){ X[a+c] = -lim + (-lim - X[a+c]) * .1; }
      else if (X[a+c] > lim){ X[a+c] = lim - (X[a+c] - lim) * .1; }
    }
    let vx = (X[a] - P[a]) * inv, vy = (X[a+1] - P[a+1]) * inv, vz = (X[a+2] - P[a+2]) * inv;
    const s2 = vx*vx + vy*vy + vz*vz;
    if (s2 > 400){ const f = 20 / Math.sqrt(s2); vx *= f; vy *= f; vz *= f; }    // a speed limit keeps it from exploding
    V[a] = vx * .999; V[a+1] = vy * .999; V[a+2] = vz * .999;
    ke += s2; if (FL.rho[i] < 2 && s2 > 4) sp++;
  }
  FL.ke = n ? ke / n : 0; FL.splash = sp;
}
// the box turned by dR (box-local to box-local): the water mostly stays where it was in the world
function carry(dR, keep){
  const n = FL.n, X = FL.x, V = FL.v;
  for (let i = 0; i < n; i++){
    const a = i * 3;
    const p = m3.app(dR, X[a], X[a+1], X[a+2]), v = m3.app(dR, V[a], V[a+1], V[a+2]);

/* ---------- audio: water against glass ---------- */
let actx = null, bus = null, recDest = null, sloshG = null, sloshF = null, noiseBuf = null, lastDrip = 0;

  sloshF.frequency.setTargetAtTime(300 + Math.min(1400, ke * 80), t, .08);

    lastSub = sub;
    for (let i = 0; i < sub; i++) step(dt / sub, gl3[0], gl3[1], gl3[2]);
    simMs = simMs * .9 + (performance.now() - t0) * .1;
    const dke = FL.ke - keSlow; keSlow += (FL.ke - keSlow) * .2;
    waterSound(FL.ke, dke, FL.splash);
  } else waterSound(0, 0, 0);

  MODE.dim += ((MODE.on ? 1 : 0) - MODE.dim) * (1 - Math.exp(-dt / .25));
  const sa = W / Hh, va = vidW / vidH;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, Hh);
  gl.useProgram(PC.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid); gl.uniform1i(PC.U.uVid, 0);
  gl.uniform2f(PC.U.uRes, W, Hh); gl.uniform2f(PC.U.uScale, sa < va ? sa / va : 1, sa < va ? 1 : va / sa);
  gl.uniform1f(PC.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PC.U.uDim, MODE.dim);
  gl.bindVertexArray(vaoQ); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (MODE.dim > .02){
    const C = COLS[S.col];
    // particles, far ones first
    const n = FL.n;
    for (let i = 0; i < n; i++){
      const a = i * 3, p = project(FL.x[a], FL.x[a+1], FL.x[a+2]);
      PDATA[i*4] = p[0]; PDATA[i*4+1] = p[1]; PDATA[i*4+2] = FL.rad * 1.08 * BOX.s * p[3]; PDATA[i*4+3] = FL.rho[i];
      DEPTH[i] = p[2]; ORDER[i] = i;
    }
    const ord = Array.prototype.slice.call(ORDER, 0, n).sort((a, b) => DEPTH[b] - DEPTH[a]);
    const tmp = new Float32Array(n * 4);
    let zmin = 1e9, zmax = -1e9; for (let i = 0; i < n; i++){ if (DEPTH[i] < zmin) zmin = DEPTH[i]; if (DEPTH[i] > zmax) zmax = DEPTH[i]; }
    for (let r = 0; r < n; r++){ const i = ord[r]; tmp.set(PDATA.subarray(i*4, i*4+4), r*4); ZDATA[r] = (DEPTH[i] - zmin) / Math.max(1, zmax - zmin); }
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    if (n){
      gl.useProgram(PP.p); gl.uniform2f(PP.U.uRes, W, Hh); gl.uniform3fv(PP.U.uW, C.W);
      gl.bindVertexArray(vaoP);
      gl.bindBuffer(gl.ARRAY_BUFFER, bufP); gl.bufferSubData(gl.ARRAY_BUFFER, 0, tmp);
      gl.bindBuffer(gl.ARRAY_BUFFER, bufZ); gl.bufferSubData(gl.ARRAY_BUFFER, 0, ZDATA.subarray(0, n));
      // glow first: the same points, wider and faint
      for (let r = 0; r < n; r++) tmp[r*4+2] *= 2.4;
      gl.bindBuffer(gl.ARRAY_BUFFER, bufP); gl.bufferSubData(gl.ARRAY_BUFFER, 0, tmp);
      gl.uniform1f(PP.U.uPass, 0); gl.drawArrays(gl.POINTS, 0, n);
      for (let r = 0; r < n; r++) tmp[r*4+2] /= 2.4;
      gl.bindBuffer(gl.ARRAY_BUFFER, bufP); gl.bufferSubData(gl.ARRAY_BUFFER, 0, tmp);
      gl.uniform1f(PP.U.uPass, 1); gl.drawArrays(gl.POINTS, 0, n);
    }
    // the cube's edges, as thin quads; the far ones fainter
    const V = CUBE.map(c => project(c[0], c[1], c[2]));
    let o = 0; const lw = Math.max(1, ms / 700) * MODE.dim;
    for (const [i, j] of EDGES){
      const a = V[i], b = V[j], far = (a[2] + b[2]) / 2 > 0;
      let dx = b[0] - a[0], dy = b[1] - a[1]; const L = Math.hypot(dx, dy) || 1; const nx = -dy / L * lw, ny = dx / L * lw;
      const al = (far ? .45 : .95) * MODE.dim;
      for (const [x, y] of [[a[0]-nx, a[1]-ny], [a[0]+nx, a[1]+ny], [b[0]+nx, b[1]+ny], [a[0]-nx, a[1]-ny], [b[0]+nx, b[1]+ny], [b[0]-nx, b[1]-ny]]){
        LDATA[o++] = x; LDATA[o++] = y; LDATA[o++] = al; }
    }
    gl.useProgram(PL.p); gl.uniform2f(PL.U.uRes, W, Hh); gl.uniform3fv(PL.U.uC, C.L);
    gl.bindVertexArray(vaoL); gl.bindBuffer(gl.ARRAY_BUFFER, bufL); gl.bufferSubData(gl.ARRAY_BUFFER, 0, LDATA.subarray(0, o));
    gl.drawArrays(gl.TRIANGLES, 0, o / 3);
    gl.disable(gl.BLEND);
  }

  if (++hudT > 8){
    hudT = 0;
    const f = v => (v >= 0 ? ' ' : '') + v.toFixed(3);
    $('hudL').innerHTML = '<b>SUISOU · Fluid Particle Simulation</b>' +
      'radius     ' + FL.rad.toFixed(3) + '\nsmoothing  ' + H.toFixed(3) + '\nrestdens   5.000\nviscosity  ' + (.02 + 2.2 * S.visc * S.visc).toFixed(3) +
      '\ngravity    ' + (6 + 14 * S.grav).toFixed(2) + '\nsubsteps   ' + lastSub + '\nkinetic    ' + FL.ke.toFixed(3) + '\nsplash     ' + String(FL.splash).padStart(4, ' ') +
      '\nsolve ms   ' + simMs.toFixed(2) + '\nparticles  ' + FL.n;
    const r = BOX.R, roll = Math.atan2(r[1], r[0]) * 57.3, pitch = Math.asin(Math.max(-1, Math.min(1, -r[2]))) * 57.3;
    let rt = '+ BOX_ROLL     ' + roll.toFixed(1) + '°\n+ BOX_PITCH    ' + pitch.toFixed(1) + '°\n+ BOX_SIZE     ' + (BOX.s * 2 / ms).toFixed(2);
    HANDS.list.forEach((h, i) => { if (live) rt += '\n+ HAND_' + (i + 1) + '_POS     ' + (h.c[0] / W).toFixed(2) + ', ' + (h.c[1] / Hh).toFixed(2); });
    if (live && HANDS.list.length >= 2) rt += '\n+ HANDS_DISTANCE ' + (Math.hypot(HANDS.list[1].c[0] - HANDS.list[0].c[0], HANDS.list[1].c[1] - HANDS.list[0].c[1]) / ms).toFixed(2);
    if (!live) rt += '\n+ NO HANDS · DRAG TO TURN';
    $('hudR').textContent = rt;
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__SUISOU = {
  state: () => {
    // how the water sits: its mean position along gravity, and how much of it is outside the box (must be none)
    let out = 0, my = 0; const n = FL.n;
    for (let i = 0; i < n; i++){ const a = i * 3; if (Math.abs(FL.x[a]) > 1 || Math.abs(FL.x[a+1]) > 1 || Math.abs(FL.x[a+2]) > 1 || !isFinite(FL.x[a])) out++; }
    const gd = m3.app(m3.tr(BOX.R), 0, 1, 0);
    for (let i = 0; i < n; i++){ const a = i * 3; my += FL.x[a] * gd[0] + FL.x[a+1] * gd[1] + FL.x[a+2] * gd[2]; }
    return { on:MODE.on, n, out, down:n ? +(my / n).toFixed(3) : 0, ke:+FL.ke.toFixed(3), splash:FL.splash, ms:+simMs.toFixed(2),
             box:[BOX.x, BOX.y, BOX.s].map(v => +v.toFixed(1)), hands:HANDS.list.length };
  },
  mode(m){ setMode(!!m); },
  col(k){ setCol(k); },
  set(k, v){ S[k] = v; },
  feedHands(h){ HANDS.external = true; return ingestHands(h); },
};
</script>
