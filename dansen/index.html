<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="カメラに映るものが、割れた液晶に映った像になる。動いた列から電極が死んで純色の縦線が走り、壊れた跡はそのまま残る。タップすると罅が入る。">
<meta name="theme-color" content="#050506">
<title>DANSEN ─ 割れた画面に映る</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  DANSEN 断線 ─ 割れた画面に映る                       ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       落として割れた液晶パネル。映像は生きているのに、パネルの配線が
             死んでいる。動いた列のソースドライバが焼き切れて純色の縦線が
             天地を貫き、ゲートドライバが飛んだ帯では像が横へ引き伸ばされて
             流れる。壊れた跡は治らない ── 画面には、そこで動いた履歴が残る。
  PALETTE    PANEL 黒 #050506 の上に、潰れた階調から出てくる純色だけ
                   （赤・緑・青・シアン・マゼンタ・黄・白）。中間色は作らない。
             HALL  壁ぜんぶが縦線になった暗い展示室。黒を沈め発光を上げる。
             MONO  像も線も無彩色。壊れた所だけ朱 #ff3b1f が差す。
  TYPE       Azeret Mono 200/500。小さな大文字、広い字間。UI は四隅に小さく。
  MOTION     damage は一方向。速い動き＝壊れる、静止＝そのまま残る。
             フラッシュは切り替えの一度だけ。罅はタップした時だけ走る。
  SIGNATURE  純色の縦線が、画面の端から端まで一本通っていること。
             ノイズは毎フレーム振り直さない。壊れ方は固定され、像だけが動く。
  TECH       小さなグレー画像の差分を列和・行和に潰し、列／行ごとの応力に
             積む。列にはあらかじめ乱数の耐久値があり、越えた列だけが死ぬ
             ので破損は疎に、動いた所に群れる。死んだ列は DAC をやめて
             step() の 1bit になり、像の明暗がそのまま純色の点滅になる。
             死んだ行はアドレスを誤り、狭いスライスを横幅いっぱいへ伸ばす。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@200;300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--fg:#e8e8ea;--dim:rgba(232,232,234,.55);--line:rgba(232,232,234,.2);--acc:#ff3b1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
  font-family:"Azeret Mono",ui-monospace,"Hiragino Sans","Noto Sans JP",monospace;font-weight:300}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#est{display:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding:28px;text-align:center;background:var(--bg)}
#start .t{font-size:10px;letter-spacing:.6em;margin-right:-.6em;color:var(--dim)}
#start h1{margin:0;font-weight:200;font-size:min(16vw,100px);line-height:1;letter-spacing:.17em;margin-right:-.17em}
#start h1 i{font-style:normal;display:inline-block;color:var(--acc);transform:translate(.04em,-.02em) scaleY(1.04)}
#start p{margin:0;font-size:12px;line-height:2.1;color:var(--dim);letter-spacing:.06em;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:300}
#go{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:500 10px "Azeret Mono",monospace;
  letter-spacing:.45em;padding:15px 30px 15px 36px;cursor:pointer;transition:border-color .3s}
#go:hover{border-color:var(--fg)}
#err{font-size:12px;line-height:1.8;max-width:340px;min-height:1em;white-space:pre-line;color:#e0a08c;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}

.btn{position:fixed;z-index:12;appearance:none;border:0;background:transparent;color:var(--fg);font:500 10px "Azeret Mono","Hiragino Sans",monospace;
  letter-spacing:.24em;padding:10px 8px;display:none;cursor:pointer;opacity:.62;transition:opacity .3s}
.btn.show{display:block}
.btn:hover{opacity:1}
#gear{right:10px;top:calc(env(safe-area-inset-top) + 6px);font-size:14px;letter-spacing:0}
#flip{right:10px;top:calc(env(safe-area-inset-top) + 40px);letter-spacing:.1em;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:12;display:none;justify-content:center;align-items:center;gap:26px}
#bar.show{display:flex}
#bar .btn{position:static;display:block}
#bar #shoot{position:relative;width:42px;height:42px;border:1px solid var(--fg);padding:0;opacity:.7}
#shoot::after{content:"";position:absolute;inset:7px;background:var(--fg);opacity:.85}
#rec.on{opacity:1;color:var(--acc)}
#fix{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;letter-spacing:.12em}
#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 14px);z-index:11;font-size:9px;letter-spacing:.3em;color:var(--dim);
  pointer-events:none;display:none;line-height:2.1;white-space:pre}
#hud.show{display:block}
#hud b{font-weight:500;color:var(--acc)}
#status{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:11;font-size:11px;letter-spacing:.04em;
  color:var(--dim);pointer-events:none;max-width:72vw;line-height:1.7;white-space:pre-line;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}

#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 78px);z-index:12;width:min(268px,calc(100vw - 20px));
  background:rgba(5,5,6,.86);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:13px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .25s}
#panel.hide{opacity:0;pointer-events:none}
.chips{display:flex;border:1px solid var(--line)}
.chips button{flex:1;appearance:none;border:0;background:transparent;color:var(--fg);padding:8px 2px;font:500 9px "Azeret Mono",monospace;
  letter-spacing:.2em;cursor:pointer;opacity:.55}
.chips button.on{opacity:1;background:rgba(232,232,234,.12)}
#panel label{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.04em;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
#panel label span{width:74px;flex:none;color:var(--dim)}
#panel input[type=range]{flex:1;accent-color:#c6c6cc}
#panel .note{font-size:10px;color:var(--dim);line-height:1.8;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
#mode{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:13;display:none;
  appearance:none;border:1px solid var(--line);background:rgba(5,5,6,.55);color:var(--fg);
  font:500 10px "Azeret Mono",monospace;letter-spacing:.42em;padding:13px 22px 13px 28px;cursor:pointer;opacity:.9;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .3s,opacity .3s}
#mode.show{display:block}
#mode:hover{border-color:var(--fg);opacity:1}
body.cam #mode{border-color:rgba(255,255,255,.55);color:#fff;background:rgba(0,0,0,.35)}
body.cam .btn{color:#fff}
body.cam #bar #shoot{border-color:#fff}
body.cam #shoot::after{background:#fff}
body.cam #fix,body.cam #hud{visibility:hidden}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ DANSEN</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="fix" class="btn">直す</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">PANEL</button>
    <button data-p="1">HALL</button>
    <button data-p="2">MONO</button>
  </div>
  <label><span>壊れやすさ</span><input type="range" id="sBreak" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>流れ</span><input type="range" id="sFlow" min="0" max="1" step="0.01" value="0.78"></label>
  <label><span>発光</span><input type="range" id="sGlow" min="0" max="1" step="0.01" value="0.5"></label>
  <div class="note">動いたところの列から死ぬ。壊れた跡は残る。<br>画面をタップ：そこに罅が入る。<br>直す：パネルを新品に戻す。</div>
</div>

<div id="start">
  <div class="t">BROKEN PANEL CAMERA</div>
  <h1>DAN<i>S</i>EN</h1>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、画面が割れる。<br>動いたところから配線が死んで、跡は消えない。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   DANSEN — the camera is fine; the panel is not.
   Motion is reduced to a per-column and a per-row stress. Each line of
   the panel has a fixed random strength, so only the weak ones give way:
   damage stays sparse and clusters where you moved. A dead column stops
   being an analogue DAC and latches bits, so the picture's own light
   turns it into a pure primary. A dead row mis-addresses the source and
   smears a narrow slice across the full width. Nothing heals.
   ===================================================================== */
const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

const PALS = [
  { name:'PANEL', floor:0,   mono:0, hall:0,   glow:1,    bg:'#050506' },
  { name:'HALL',  floor:.82, mono:0, hall:1,   glow:1.55, bg:'#000000' },
  { name:'MONO',  floor:0,   mono:1, hall:.35, glow:.8,   bg:'#070707' },
];
const S = { pal:0, brk:.5, flow:.78, glow:.5 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

const FS_PANEL = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uVid, uFrz, uCA, uCB, uRA, uRB, uCrk;
uniform vec2 uScale, uPanel;
uniform float uMirror, uMono, uHall, uFloor, uFlow, uRev, uAcc0, uAcc1, uAcc2;
const vec3 LW = vec3(.2126,.7152,.0722);
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec3 srcAt(sampler2D T, vec2 s){
  vec2 v = (vec2(s.x, 1. - s.y) - .5) * uScale + .5;
  if (uMirror > .5) v.x = 1. - v.x;
  return texture(T, clamp(v, .0015, .9985)).rgb;
}
void main(){
  float ci = floor(uv.x * uPanel.x), ri = floor(uv.y * uPanel.y);
  vec4 A = texture(uCA, vec2((ci + .5) / uPanel.x, .5));   // dam, stuck, wash, bright
  vec4 B = texture(uCB, vec2((ci + .5) / uPanel.x, .5));   // threshold.rgb, hue
  vec4 Ra = texture(uRA, vec2((ri + .5) / uPanel.y, .5));  // dam, anchor, span, vshift
  vec4 Rb = texture(uRB, vec2((ri + .5) / uPanel.y, .5));  // hold, black, -, -

  float rnd = h21(vec2(ci, 11.3));
  float dam   = max(max(A.x, Ra.x), uFloor * smoothstep(.10, .92, rnd + .22));
  float stuck = max(A.y,            uFloor * smoothstep(.62, .86, rnd) * .95);

  // a dead gate driver addresses the wrong source: a narrow slice, stretched
  float span = mix(1., Ra.z, uFlow);
  vec2 s = vec2(.5 + (uv.x - .5) * span + (Ra.y - .5) * uFlow,
                uv.y + Ra.w * uFlow);
  // whole rows share this, so the branch is coherent and saves a fetch
  vec3 c = Rb.x > .5 ? srcAt(uFrz, s) : srcAt(uVid, s);

  // the driver stops resolving levels and latches bits: the picture's own
  // light switches each channel fully on or off -> only pure primaries
  vec3 q = step(B.xyz, c);
  c = mix(c, q, smoothstep(.12, .78, dam));
  // a fully dead column holds one value for its whole height
  c = mix(c, step(B.xyz, vec3(.55)), stuck);
  c *= 1. - Rb.y;

  // a dead colour bus: the band keeps its light but loses a channel
  vec3 tint = .5 + .5 * cos(6.2831853 * (B.w + vec3(0., .33, .67)));
  c = mix(c, mix(vec3(dot(c, LW)), tint * dot(c, LW) * 1.35, .42), A.z);

  // A fracture is a dark tear with a thin lit rim. pow() pulls the rim back
  // onto the line (the upscaled crack texture otherwise spreads into a grey
  // halo) and (1 - dark) keeps the rim off the tear itself, which would
  // otherwise light up the very thing it is supposed to edge.
  vec2 kk = texture(uCrk, uv).rg;
  float dark = smoothstep(.20, .60, kk.r);
  c = mix(c, vec3(.015), dark);
  c += vec3(1., .96, .88) * pow(kk.g, 2.) * .9 * (1. - dark);

  if (uHall > 0.) c = mix(c, pow(c, vec3(1.9)) * (1.25 - .3 * dam), uHall);
  if (uMono > 0.){
    float l = dot(c, LW);
    vec3 m = mix(vec3(l), vec3(uAcc0, uAcc1, uAcc2) * (.22 + 1.05 * l), clamp(dam * .78 + stuck * .3, 0., 1.));
    c = mix(c, m, uMono);
  }
  vec2 g = uv - .5; g.x *= uPanel.x / uPanel.y;
  c *= 1. - (.30 + .22 * uHall) * smoothstep(.42, 1.05, length(g));

  // power-on: the columns of the panel come up in their own order
  if (uRev < 1.){
    float f = uRev * 1.32 - h21(vec2(ci, 3.7)) * .82 - (1. - uv.y) * .16;
    if (f < 0.){ o = vec4(0., 0., 0., 1.); return; }
    c = mix(c, vec3(1.), (1. - smoothstep(0., .11, f)) * .75);
  }
  o = vec4(clamp(c, 0., 1.), 1.);
}`;

const FS_OUT = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uScene;
uniform vec2 uRes; uniform float uGlow, uT;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
void main(){
  vec3 c = texture(uScene, uv).rgb;
  vec3 b = textureLod(uScene, uv, 3.2).rgb + textureLod(uScene, uv, 5.0).rgb * .75;
  c += b * b * uGlow * .62;
  c += (h21(floor(gl_FragCoord.xy / 1.5) + fract(uT * 7.13) * 91.7) - .5) * .035;
  o = vec4(clamp(c, 0., 1.), 1.);
}`;

const FS_CAM = `#version 300 es
precision mediump float;
in vec2 uv; out vec4 o;
uniform sampler2D uVid; uniform vec2 uScale; uniform float uMirror, uA;
void main(){
  vec2 v = (vec2(uv.x, 1. - uv.y) - .5) * uScale + .5;
  if (uMirror > .5) v.x = 1. - v.x;
  o = vec4(texture(uVid, v).rgb * uA, 1.);
}`;

function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(fs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function tex(filter, mip){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }

let PP, PO, PC, texVid, texFrz, texCA, texCB, texRA, texRB, texCrk, sceneTex = null, sceneFB = null, sw = 0, shh = 0;
function initGL(){
  PP = prog(FS_PANEL); PO = prog(FS_OUT); PC = prog(FS_CAM);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  texVid = tex(gl.LINEAR); texFrz = tex(gl.LINEAR); texCrk = tex(gl.LINEAR);
  texCA = tex(gl.NEAREST); texCB = tex(gl.NEAREST); texRA = tex(gl.NEAREST); texRB = tex(gl.NEAREST);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
}
function ensureScene(w, h){
  if (w === sw && h === shh) return;
  sw = w; shh = h;
  if (sceneTex) gl.deleteTexture(sceneTex); if (sceneFB) gl.deleteFramebuffer(sceneFB);
  sceneTex = tex(gl.LINEAR, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.generateMipmap(gl.TEXTURE_2D);              // keep the texture mip-complete from the start
  sceneFB = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* ---------- the panel and its wounds ----------------------------------
   Every column and every row carries a fixed strength drawn once. Stress
   accumulates from motion and never drains; a line dies the moment its
   own strength is passed. That is why the damage is sparse, why it
   clusters where you moved, and why it is still there when you stop.   */
const DENS = 400;
const P = { w:0, h:0, deadC:0, deadR:0, stress:0, capC:0, capR:0 };
let cDam, cStuck, cWash, cBright, cThr, cHue, cStress, cFrag;
let rDam, rAnchor, rSpan, rVsh, rHold, rBlack, rStress, rFrag;
let bufCA, bufCB, bufRA, bufRB;
let texDirty = true, freezeWanted = true;

function ensurePanel(W, H){
  const m = Math.max(1, Math.min(W, H));
  const w = Math.max(140, Math.min(1200, Math.round(DENS * W / m)));
  const h = Math.max(140, Math.min(1200, Math.round(DENS * H / m)));
  if (w === P.w && h === P.h) return;
  P.w = w; P.h = h;
  cDam = new Float32Array(w); cStuck = new Float32Array(w); cWash = new Float32Array(w);
  cBright = new Float32Array(w); cThr = new Float32Array(w*3); cHue = new Float32Array(w);
  cStress = new Float32Array(w); cFrag = new Float32Array(w);
  rDam = new Float32Array(h); rAnchor = new Float32Array(h); rSpan = new Float32Array(h);
  rVsh = new Float32Array(h); rHold = new Float32Array(h); rBlack = new Float32Array(h);
  rStress = new Float32Array(h); rFrag = new Float32Array(h);
  bufCA = new Float32Array(w*4); bufCB = new Float32Array(w*4);
  bufRA = new Float32Array(h*4); bufRB = new Float32Array(h*4);
  repair();
}
function repair(){
  const w = P.w, h = P.h; if (!w) return;
  cDam.fill(0); cStuck.fill(0); cWash.fill(0); cStress.fill(0);
  for (let i = 0; i < w; i++){
    // a long tail: most columns hold, a few are ready to go at the first shove
    cFrag[i] = .10 + Math.pow(Math.random(), 2.6) * 7.5;
    cThr[i*3]   = .18 + Math.random() * .70;
    cThr[i*3+1] = .18 + Math.random() * .70;
    cThr[i*3+2] = .18 + Math.random() * .70;
    cHue[i] = Math.random(); cBright[i] = .55;
  }
  rDam.fill(0); rHold.fill(0); rBlack.fill(0); rStress.fill(0);
  rAnchor.fill(.5); rSpan.fill(1); rVsh.fill(0);
  for (let i = 0; i < h; i++) rFrag[i] = .6 + Math.pow(Math.random(), 2.2) * 9;
  P.deadC = 0; P.deadR = 0; P.stress = 0; caps();
  CRK.segs.length = 0; drawCracks();
  texDirty = true; freezeWanted = true;
}

/* The ceilings matter more than the rates. A panel that fails everywhere is
   just noise: the picture has to stay readable underneath the damage, and it
   only stays readable while most of the lines are still alive. */
function caps(){
  P.capC = Math.round(P.w * (.05 + .36 * S.brk));
  P.capR = Math.round(P.h * (.02 + .17 * S.brk));
}
function killColumn(i, hard){
  if (i < 0 || i >= P.w || cDam[i] > .02 || P.deadC >= P.capC) return false;
  cDam[i] = 1;
  // roughly two in five lose the level entirely and hold one value top to bottom
  cStuck[i] = Math.random() < (hard ? .55 : .38) ? (.7 + Math.random() * .3) : 0;
  P.deadC++;
  // drivers sit side by side on one bonded tape: a failure leans on its
  // neighbours, but never hard enough to take them out on its own
  if (Math.random() < .3) cStress[Math.max(0, i-1)] += cFrag[Math.max(0, i-1)] * .5;
  if (Math.random() < .3) cStress[Math.min(P.w-1, i+1)] += cFrag[Math.min(P.w-1, i+1)] * .5;
  texDirty = true;
  return true;
}
function killRowBand(i, cx){
  if (i < 0 || i >= P.h || rDam[i] > .02 || P.deadR >= P.capR) return false;
  // never let one band spend more than what is left of the ceiling
  const n = Math.min(2 + (Math.random() * Math.random() * 46 | 0), Math.max(2, P.capR - P.deadR));
  const anchor = Math.min(.96, Math.max(.04, (cx == null ? Math.random() : cx) + (Math.random() - .5) * .34));
  const span = .015 + Math.pow(Math.random(), 1.8) * .42;
  const vsh = (Math.random() - .5) * .22;
  const hold = Math.random() < .26 ? 1 : 0;
  const black = Math.random() < .10 ? 1 : 0;
  const top = Math.max(0, i - (Math.random() * n | 0));
  let made = 0;
  for (let j = top; j < Math.min(P.h, top + n); j++){
    if (rDam[j] > .02) continue;
    rDam[j] = 1; rAnchor[j] = anchor; rSpan[j] = span;
    rVsh[j] = vsh + (j - top) * .0006; rHold[j] = hold; rBlack[j] = black;
    made++;
  }
  P.deadR += made;
  if (hold) freezeWanted = true;
  texDirty = true;
  return made > 0;
}
// a colour bus that lost a line: the band keeps its light but not its colour
function washBand(cx){
  const w = P.w, c = Math.round(cx * w), n = Math.max(6, (w * (.05 + Math.random() * .18)) | 0);
  const hue = Math.random(), amt = .32 + Math.random() * .3;
  const a = Math.max(0, c - (n * Math.random() | 0)), b = Math.min(w, a + n);
  const fade = Math.max(2, n * .18 | 0);
  for (let i = a; i < b; i++){
    const e = Math.min(i - a, b - 1 - i) / fade;       // the bus fails off gradually at its ends
    cWash[i] = Math.max(cWash[i], amt * Math.min(1, e));
    cHue[i] = hue;
  }
  texDirty = true;
}

/* ---------- cracks ---------- */
const CRK = { cv:null, ctx:null, segs:[], w:0, h:0, dirty:true };
function ensureCrack(w, h){
  if (!CRK.cv){ CRK.cv = document.createElement('canvas'); CRK.ctx = CRK.cv.getContext('2d', { alpha:false }); }
  if (CRK.w === w && CRK.h === h) return;
  CRK.w = w; CRK.h = h; CRK.cv.width = w; CRK.cv.height = h; drawCracks();
}
function drawCracks(){
  if (!CRK.ctx) return;
  const g = CRK.ctx, w = CRK.w, h = CRK.h, k = Math.max(1, Math.min(w, h) / 380);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const s of CRK.segs){
    g.beginPath();
    for (let i = 0; i < s.p.length; i += 2){
      const x = s.p[i] * w, y = (1 - s.p[i+1]) * h;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    // a lit lip hugging the tear, then the tear itself over it — not a halo
    g.strokeStyle = 'rgba(0,255,0,' + (.34 * s.a).toFixed(3) + ')'; g.lineWidth = s.wd * 1.6 * k;  g.stroke();
    g.strokeStyle = 'rgba(255,0,0,' + (1 * s.a).toFixed(3) + ')';   g.lineWidth = s.wd * .9 * k;  g.stroke();
  }
  CRK.dirty = true;
}
function makeCrack(ux, uy, scale){
  const arms = 3 + (Math.random() * 3 | 0), base = Math.random() * 6.2832, step = .011;
  for (let k = 0; k < arms; k++){
    let a = base + k * 6.2832 / arms + (Math.random() - .5) * .85;
    let x = ux, y = uy;
    const len = (.09 + Math.random() * .40) * scale, p = [x, y];
    // a fracture runs straight through the glass and then turns sharply;
    // a smooth random walk gives you a twig instead
    for (let t = 0; t < len; ){
      const run = .022 + Math.random() * .07;
      a += (Math.random() - .5) * 1.25;
      let out = false;
      for (let u = 0; u < run; u += step){
        x += Math.cos(a) * step; y += Math.sin(a) * step;
        if (x < -.06 || x > 1.06 || y < -.06 || y > 1.06){ out = true; break; }
        p.push(x, y);
      }
      if (out) break;
      t += run;
    }
    if (p.length < 6) continue;
    CRK.segs.push({ p, wd: 1.0 + Math.random() * 1.5, a: .8 + Math.random() * .2 });
    if (p.length > 10 && Math.random() < .72){
      const j = 2 * (2 + (Math.random() * (p.length / 2 - 4) | 0));
      let bx = p[j], by = p[j+1], ba = a + (Math.random() < .5 ? -1 : 1) * (.6 + Math.random() * .8);
      const q = [bx, by];
      for (let t = 0; t < len * .5; ){
        const run = .02 + Math.random() * .05;
        ba += (Math.random() - .5) * 1.1;
        let out = false;
        for (let u = 0; u < run; u += step){
          bx += Math.cos(ba) * step; by += Math.sin(ba) * step;
          if (bx < -.06 || bx > 1.06 || by < -.06 || by > 1.06){ out = true; break; }
          q.push(bx, by);
        }
        if (out) break;
        t += run;
      }
      if (q.length >= 6) CRK.segs.push({ p:q, wd:.65 + Math.random() * .75, a:.62 });
    }
  }
  if (CRK.segs.length > 120) CRK.segs.splice(0, CRK.segs.length - 120);
  drawCracks();
}
// An impact: the fracture, then the drivers it takes with it. It may only
// ever spend a slice of what is left, so a tap always bites but never uses
// up the panel — the rest of the ceiling stays there for you to move into.
function impact(ux, uy, power, share){
  caps();
  makeCrack(ux, uy, .75 + power * .6);
  const w = P.w, h = P.h, sp = .035 + .075 * power;
  const budget = Math.max(3, Math.round(P.capC * (share == null ? .16 : share) * (.4 + power)));
  for (let k = 0, made = 0; k < budget * 6 && made < budget; k++){
    // most go near the break, but a shock travels the whole bonded tape, so a
    // few lines die far from it — that is what stops the damage reading as a
    // single slab down the middle
    const far = Math.random() < .22;
    const g = far ? (Math.random() - .5) * 8
                  : (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
    if (killColumn(Math.round((ux + g * sp * 2.4) * w), true)) made++;
  }
  const nR = 1 + Math.round(2 * power);
  for (let k = 0; k < nR; k++){
    const g = (Math.random() + Math.random() - 1);
    killRowBand(Math.round((1 - (uy + g * sp * 2.2)) * h), ux);
  }
  if (Math.random() < .4 + .3 * power) washBand(ux);
  freezeWanted = true;
  crackSound(power);
}

/* ---------- motion -> stress ---------- */
const EST = { w:0, h:0, cur:null, prev:null, have:false, col:null, row:null, mean:0 };
function ensureEst(W, H){
  const SH = 128; let w, h;
  if (W >= H){ h = SH; w = Math.round(SH * W / H); } else { w = SH; h = Math.round(SH * H / W); }
  w = Math.max(32, Math.min(w, 288)); h = Math.max(32, Math.min(h, 288));
  if (w === EST.w && h === EST.h) return;
  EST.w = w; EST.h = h; est.width = w; est.height = h;
  EST.cur = new Uint8Array(w*h); EST.prev = new Uint8Array(w*h); EST.have = false;
  EST.col = new Float32Array(w); EST.row = new Float32Array(h);
}
function measure(){
  const w = EST.w, h = EST.h, vw = video.videoWidth, vh = video.videoHeight;
  if (!(vw > 0 && vh > 0)) return false;
  const sa = w / h, va = vw / vh;
  let cw = vw, ch = vh; if (va > sa) cw = vh * sa; else ch = vw / sa;
  ectx.setTransform(mirror ? -1 : 1, 0, 0, 1, mirror ? w : 0, 0);
  try { ectx.drawImage(video, (vw - cw)/2, (vh - ch)/2, cw, ch, 0, 0, w, h); } catch(e){ return false; }
  const d = ectx.getImageData(0, 0, w, h).data;
  const t = EST.prev; EST.prev = EST.cur; EST.cur = t;
  const C = EST.cur;
  for (let i = 0, j = 0, n = w*h; i < n; i++, j += 4) C[i] = (d[j]*77 + d[j+1]*150 + d[j+2]*29) >> 8;
  if (!EST.have){ EST.have = true; return false; }
  const Pv = EST.prev, col = EST.col, row = EST.row;
  col.fill(0); row.fill(0);
  let tot = 0;
  for (let y = 0; y < h; y++){
    let rs = 0, o = y * w;
    for (let x = 0; x < w; x++){
      let v = C[o + x] - Pv[o + x]; if (v < 0) v = -v;
      v = v > 7 ? v - 7 : 0;                      // sensor noise floor
      if (v){ col[x] += v; rs += v; }
    }
    row[y] = rs / w / 64; tot += rs;
  }
  for (let x = 0; x < w; x++) col[x] = col[x] / h / 64;
  EST.mean = tot / (w*h) / 64;
  return true;
}
function stressStep(dt){
  const w = P.w, h = P.h, ew = EST.w, eh = EST.h;
  if (!w || !ew) return;
  caps();
  const step = Math.min(dt, .05);
  // calibrated so the weakest lines go within a second of moving at them and
  // the toughest need most a minute: a wave should cost you a few columns,
  // not the panel
  const rate = (.002 + .028 * S.brk * S.brk) * step * 60;
  // Stress bleeds away over ~25s, so only movement breaks a line. Without
  // this, sensor noise alone would eventually take the whole panel; with it,
  // the drain sits below the weakest column's strength and noise never does.
  const keep = Math.max(0, 1 - step * .04);
  let deaths = 0;
  if (P.deadC < P.capC){
    for (let i = 0; i < w; i++){
      if (cDam[i] > .02) continue;
      const m = EST.col[(i * ew / w) | 0];
      cStress[i] = cStress[i] * keep + (m > 0 ? m * rate : 0);
      if (cStress[i] > cFrag[i] && killColumn(i, false)) deaths++;
    }
  }
  const rrate = rate * 1.6;
  if (P.deadR < P.capR){
    for (let i = 0; i < h; i++){
      if (rDam[i] > .02) continue;
      // panel rows run top-down, uv runs bottom-up
      const m = EST.row[(((h - 1 - i) * eh / h) | 0)];
      rStress[i] = rStress[i] * keep + (m > 0 ? m * rrate : 0);
      if (rStress[i] > rFrag[i] && killRowBand(i, null)) deaths += 3;
    }
  }
  P.stress = EST.mean;
  if (deaths) tick(deaths);
}
function uploadPanel(){
  if (!texDirty) return; texDirty = false;
  const w = P.w, h = P.h;
  for (let i = 0; i < w; i++){
    const o = i*4;
    bufCA[o] = cDam[i]; bufCA[o+1] = cStuck[i]; bufCA[o+2] = cWash[i]; bufCA[o+3] = cBright[i];
    bufCB[o] = cThr[i*3]; bufCB[o+1] = cThr[i*3+1]; bufCB[o+2] = cThr[i*3+2]; bufCB[o+3] = cHue[i];
  }
  for (let i = 0; i < h; i++){
    const o = i*4;
    bufRA[o] = rDam[i]; bufRA[o+1] = rAnchor[i]; bufRA[o+2] = rSpan[i]; bufRA[o+3] = rVsh[i];
    bufRB[o] = rHold[i]; bufRB[o+1] = rBlack[i]; bufRB[o+2] = 0; bufRB[o+3] = 0;
  }
  const up = (t, n, data) => { gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, n, 1, 0, gl.RGBA, gl.FLOAT, data); };
  up(texCA, w, bufCA); up(texCB, w, bufCB); up(texRA, h, bufRA); up(texRB, h, bufRB);
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720, lastVT = -1;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  EST.have = false; freezeWanted = true;
}

/* ---------- audio: the panel is a thing that breaks ---------- */
let actx = null, bus = null, recDest = null, lastTick = 0;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .32; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  actx.resume().catch(()=>{});
}
function noise(len, decay){
  const sr = actx.sampleRate, n = Math.max(1, sr * len | 0), b = actx.createBuffer(1, n, sr), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/n, decay);
  const s = actx.createBufferSource(); s.buffer = b; return s;
}
// one column giving way: a dry electrical tick, never a machine gun
function tick(n){
  if (!actx || actx.state !== 'running') return;
  const now = actx.currentTime; if (now - lastTick < .045) return; lastTick = now;
  const s = noise(.035, 26), f = actx.createBiquadFilter(), g = actx.createGain();
  f.type = 'bandpass'; f.frequency.value = 2400 + Math.random() * 3600; f.Q.value = 2.2;
  g.gain.value = Math.min(.5, .1 + n * .05);
  s.connect(f); f.connect(g); g.connect(bus); s.start();
}
function crackSound(power){
  if (!actx || actx.state !== 'running') return;
  const t0 = actx.currentTime;
  const s = noise(.22, 7), f = actx.createBiquadFilter(), g = actx.createGain();
  f.type = 'highpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(.55 + .35 * power, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .22);
  s.connect(f); f.connect(g); g.connect(bus); s.start();
  const o = actx.createOscillator(), og = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(42, t0 + .3);
  og.gain.setValueAtTime(.4, t0); og.gain.exponentialRampToValueAtTime(.001, t0 + .34);
  o.connect(og); og.connect(bus); o.start(t0); o.stop(t0 + .36);
}

/* ---------- ui ---------- */
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!PP) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','fix','hud','mode'].forEach(id => $(id).classList.add('show'));
  MODE.on = true; setMode(false); MODE.X = 0;
  if (!started){ started = true; requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('fix').onclick = () => { repair(); if (actx && actx.state === 'running') tick(2); };

const MODE = { on:false, X:0, seeded:false, reveal:0, camA:1 };
function setMode(m){
  if (m === MODE.on) return; MODE.on = m;
  $('mode').textContent = m ? '◂ CAMERA' : '▸ DANSEN';
  document.body.classList.toggle('cam', !m);
  if (m){ repair(); MODE.seeded = false; }
  else crackSound(.3);
}
$('mode').onclick = () => setMode(!MODE.on);
addEventListener('keydown', e => {
  if (!started || document.activeElement.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); setMode(!MODE.on); }
});
canvas.addEventListener('pointerdown', e => {
  if (e.isPrimary === false || !started || !MODE.on || MODE.X < .9) return;
  const r = canvas.getBoundingClientRect();
  impact((e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height, .55 + Math.random() * .35);
});
function setPal(i){
  S.pal = i;
  [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
  document.documentElement.style.setProperty('--bg', PALS[i].bg);
}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sBreak','brk'],['sFlow','flow'],['sGlow','glow']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

$('shoot').onclick = () => {
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'dansen-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'dansen.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
const ACC = [1, .23, .12];
let lastT = 0, hudT = 0, mipT = 0;
function newVideoFrame(){ const vt = video.currentTime; if (vt === lastVT) return false; lastVT = vt; return true; }
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1400 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  ensureScene(W, H); ensurePanel(W, H); ensureEst(W, H);
  ensureCrack(Math.min(1100, Math.round(P.w * 1.7)), Math.min(1100, Math.round(P.h * 1.7)));
  if (video.readyState < 2) return;

  const fresh = newVideoFrame();
  MODE.X = MODE.on ? Math.min(1.7, MODE.X + dt) : Math.max(0, MODE.X - dt * 2.8);
  const camA = 1 - Math.min(1, MODE.X / .26);
  const reveal = Math.max(0, Math.min(1, (MODE.X - .30) / .78));
  MODE.camA = camA; MODE.reveal = reveal;

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texVid);
  if (fresh){ try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }

  if (reveal <= 0){                              // plain camera, then a cut to black
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    if (camA > 0){
      const sa = W/H, va = vidW/vidH;
      gl.useProgram(PC.p); gl.uniform1i(PC.U.uVid, 1);
      gl.uniform2f(PC.U.uScale, sa < va ? sa/va : 1, sa < va ? 1 : va/sa);
      gl.uniform1f(PC.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PC.U.uA, camA * camA);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    EST.have = false;
    return;
  }
  // the panel comes up already broken — that is the point of pressing the button
  if (!MODE.seeded && reveal > .55){
    MODE.seeded = true;
    impact(.42 + Math.random() * .16, .44 + Math.random() * .16, .95, .30);
  }
  if (fresh && measure()) stressStep(dt);
  if (fresh && freezeWanted){
    freezeWanted = false;
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texFrz);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){}
  }
  uploadPanel();
  if (CRK.dirty && CRK.cv && CRK.w){
    CRK.dirty = false;
    gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, texCrk);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, CRK.cv); } catch(e){}
  }

  const p = PALS[S.pal];
  const sa = W/H, va = vidW/vidH;
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFB); gl.viewport(0, 0, W, H);
  gl.useProgram(PP.p);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texVid);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texFrz);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texCA);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, texCB);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, texRA);
  gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, texCrk);
  gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D, texRB);
  gl.uniform1i(PP.U.uVid, 1); gl.uniform1i(PP.U.uFrz, 2); gl.uniform1i(PP.U.uCA, 3);
  gl.uniform1i(PP.U.uCB, 4); gl.uniform1i(PP.U.uRA, 5); gl.uniform1i(PP.U.uCrk, 6); gl.uniform1i(PP.U.uRB, 7);
  gl.uniform2f(PP.U.uScale, sa < va ? sa/va : 1, sa < va ? 1 : va/sa);
  gl.uniform2f(PP.U.uPanel, P.w, P.h);
  gl.uniform1f(PP.U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(PP.U.uMono, p.mono); gl.uniform1f(PP.U.uHall, p.hall); gl.uniform1f(PP.U.uFloor, p.floor);
  gl.uniform1f(PP.U.uFlow, S.flow); gl.uniform1f(PP.U.uRev, reveal);
  gl.uniform1f(PP.U.uAcc0, ACC[0]); gl.uniform1f(PP.U.uAcc1, ACC[1]); gl.uniform1f(PP.U.uAcc2, ACC[2]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  const glow = S.glow * p.glow;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  // the glow is broad and slow; refreshing its mip chain every other frame
  // is invisible and costs half as much as doing it every frame
  if (glow > .01 && (mipT ^= 1)) gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(PO.p);
  gl.uniform1i(PO.U.uScene, 0); gl.uniform2f(PO.U.uRes, W, H);
  gl.uniform1f(PO.U.uGlow, glow); gl.uniform1f(PO.U.uT, now/1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (++hudT > 10){
    hudT = 0;
    const pc = P.w ? (P.deadC / P.w * 100) : 0;
    $('hud').innerHTML = 'DANSEN  ' + p.name +
      '\nDEAD COL ' + String(P.deadC).padStart(4, '0') + '  ' + pc.toFixed(0).padStart(2, '0') + '%' +
      '\nDEAD ROW ' + String(P.deadR).padStart(4, '0') +
      (P.stress > .012 && P.deadC < P.capC ? '\n<b>BREAKING</b>' : '');
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__DANSEN = {
  state: () => ({ pw:P.w, ph:P.h, deadC:P.deadC, deadR:P.deadR, capC:P.capC, capR:P.capR, stress:P.stress,
                  cracks:CRK.segs.length, reveal:MODE.reveal, on:MODE.on, pal:S.pal,
                  estMean:EST.mean, ew:EST.w, eh:EST.h }),
  mode(m){ setMode(!!m); },
  palette(i){ setPal(i); },
  impact, repair, killColumn, killRowBand, washBand,
  set(k, v){ if (k in S) S[k] = v; },
  columns: () => Array.from(cDam || []),
  rows: () => Array.from(rDam || []),
  load: () => {
    const f = a => a && a.length ? Math.max.apply(null, Array.from(a)) : 0;
    let cs = 0, rs = 0;
    for (let i = 0; i < P.w; i++) if (!cDam[i] && cStress[i] / cFrag[i] > cs) cs = cStress[i] / cFrag[i];
    for (let i = 0; i < P.h; i++) if (!rDam[i] && rStress[i] / rFrag[i] > rs) rs = rStress[i] / rFrag[i];
    return { colWorst:+cs.toFixed(2), rowWorst:+rs.toFixed(2), estColMax:+f(EST.col).toFixed(3), estRowMax:+f(EST.row).toFixed(3) };
  },
};
</script>
