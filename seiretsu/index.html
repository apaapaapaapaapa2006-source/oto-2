<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<meta name="description" content="映った人がピクセルソートのグリッチアートになる。動いた向きに体が光の筋へ並べ替えられて尾を引き、止まると明るいところが静かに垂れていく。跳ぶかタップすると体ごと滝のように流れ落ちる。撮影と録画ができる。">
<meta name="theme-color" content="#060607">
<title>SEIRETSU ─ 体が光の筋に並べ替わる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  SEIRETSU 整列 ─ 体が光の筋に並べ替わる                ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  REFERENCE  キム・アセンドルフのピクセルソート（2010）と、それを使った
             エレクトロニカのジャケットやファッションフィルムのグリッチ。
             画素を明るさ順に並べ替えると、像が縞の滝にほどける。
  MOOD       暗いスタジオで銀塩のモノクロに沈んだ人物。動いたところだけが
             動いた向きへ明るさ順に「整列」され、コバルトの光の筋になって
             体から後ろへ流れる。止まれば像は締まり、ハイライトだけが
             蝋のようにゆっくり垂れる。
  PALETTE    SILVER（既定）銀のモノクロ ＋ 筋はクラインブルー #1f3cff → 白
             SODIUM ナトリウム灯：深い青緑 #0b2026 の影と琥珀 #ffb15c の光
             PAPER  白いホリゾント #ecebe6 に墨の人物、筋は墨のグラデーション
             COLOR  素の色。筋も素の色のまま並ぶ（古典的なピクセルソート）
             どれも二〜三色まで。
  TYPE       Reddit Mono 200/400（細い等幅、計測値のような小さな文字組み）
             ＋ Murecho 300（和文）。
  MOTION     止まっていれば静か。動いた部分の画素が、動いた向き（横か縦、
             前か後ろ）に明るさ順で並び、先頭が最も明るい彗星の尾になる。
             尾は一瞬で消えず、余韻の時間をかけて暗くなり縮む。
             切り替えは、画面が上から一行ずつ明るさ順に並べ替えられて
             横縞のグラデーションになり、その縞がほどけて作品が現れる。
  SIGNATURE  並べ替えの向きが自分の動きの向き。腕を振れば横の筋、
             しゃがめば縦の筋。跳ぶ（またはタップ）と体ごと床へ流れ落ちる。
  LAYERS     ① 動きの向きに沿ったソート＋残像の帰還（尾が伸びて消える）
             ② 静止の滴り：止まっているとハイライトが下へ垂れていく
             ③ 滝：跳ぶかタップで、体が縦に流れ落ちてから組み直る
             ④ 版：SILVER / SODIUM / PAPER / COLOR
             ⑤ 顔の保護：顔は速く動いたときだけ崩れる（調整可）
             ⑥ 並べ替えの走査で 素のカメラ ⇄ 作品 を切り替える
             ⑦ 小さな文字組みと粒子、録画にも焼き込む
  TECH       2D canvas。内部解像度（長辺 640 前後、重ければ自動で下げる）で
             1/4 縮小の輝度にブロックマッチングをかけて向きを取り、
             行・列ごとに区間を数え上げソート。配列はすべて使い回す。
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
'use strict';
/* =====================================================================
   SEIRETSU — the person pixel-sorted along the way they move.
   per camera frame (internal res):
     grade → motion (block matching on ¼ luma) → energy field with decay
     → trail feedback → drip (still) → H / V run sorts → cascade → blend.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function ramp(stops){                     // [[t,'#rrggbb'],…] → Uint8Array(256*3)
  const o = new Uint8Array(768), cs = stops.map(s => [s[0], hex(s[1])]);
  for (let i = 0; i < 256; i++){
    const t = i / 255; let k = 0; while (k < cs.length - 2 && t > cs[k + 1][0]) k++;
    const a = cs[k], b = cs[k + 1], u = Math.max(0, Math.min(1, (t - a[0]) / ((b[0] - a[0]) || 1)));
    for (let c = 0; c < 3; c++) o[i * 3 + c] = Math.round(a[1][c] + (b[1][c] - a[1][c]) * u);
  }
  return o;
}

/* ---------- buffers (internal resolution) ---------- */
const work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently:true });
const outC = document.createElement('canvas'), octx = outC.getContext('2d');
const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
const B = { w:0, h:0, n:0, sw:0, sh:0, bw:0, bh:0, bs:24 };
let outImg = null, out32 = null, base32 = null, src32 = null, prev32 = null, key = null, wt = null, prevKey = null, baseKey = null;
let lum = null, mI = null, mPrev = null, E = null, FP = null, cam32 = null;
let sCur = null, sPrev = null, bVX = null, bVY = null, bAx = null, bSg = null, bE = null, bCov = null, bxOf = null, byOf = null;
let colRand = null, rowRand = null, colRun = null, rowRun = null, maskIdx = null, maskFx = null, maskFy = null, maskKey = '';
const TK = new Uint8Array(4096), TC = new Uint32Array(4096), CNT = new Int32Array(257);
let tkLen = 0;
function alloc(w, h){
  B.w = w; B.h = h; B.n = w * h;
  work.width = outC.width = w; work.height = outC.height = h;
  glow.width = Math.max(8, w >> 3); glow.height = Math.max(8, h >> 3);
  outImg = octx.createImageData(w, h); out32 = new Uint32Array(outImg.data.buffer);
  base32 = new Uint32Array(B.n); src32 = new Uint32Array(B.n); prev32 = new Uint32Array(B.n); cam32 = new Uint32Array(B.n);
  key = new Uint8Array(B.n); wt = new Uint8Array(B.n); lum = new Uint8Array(B.n); prevKey = new Uint8Array(B.n); baseKey = new Uint8Array(B.n);
  mI = new Float32Array(B.n); mPrev = new Float32Array(B.n); E = new Float32Array(B.n); FP = new Float32Array(B.n).fill(1);
  B.sw = w >> 2; B.sh = h >> 2;
  sCur = new Uint8Array(B.sw * B.sh); sPrev = new Uint8Array(B.sw * B.sh);
  B.bw = Math.max(1, Math.floor(B.sw / 6)); B.bh = Math.max(1, Math.floor(B.sh / 6));
  const nb = B.bw * B.bh;
  bVX = new Float32Array(nb); bVY = new Float32Array(nb); bAx = new Uint8Array(nb); bSg = new Int8Array(nb).fill(1);
  bE = new Float32Array(nb); bCov = new Float32Array(nb);
  bxOf = new Uint16Array(w); byOf = new Uint16Array(h);
  for (let x = 0; x < w; x++) bxOf[x] = Math.min(B.bw - 1, (x / B.bs) | 0);
  for (let y = 0; y < h; y++) byOf[y] = Math.min(B.bh - 1, (y / B.bs) | 0) * B.bw;
  colRand = new Float32Array(w); rowRand = new Float32Array(h); colRun = new Uint16Array(w); rowRun = new Uint16Array(h);
  for (let x = 0; x < w; x++) colRand[x] = .35 + .65 * Math.pow(Math.random(), .7);
  for (let y = 0; y < h; y++) rowRand[y] = Math.random();
  // each line gets its own longest run, so the streaks end staggered like a real sort
  for (let x = 0; x < w; x++) colRun[x] = Math.max(6, (h * (.12 + .88 * Math.pow(Math.random(), 1.6))) | 0);
  for (let y = 0; y < h; y++) rowRun[y] = Math.max(6, (w * (.12 + .88 * Math.pow(Math.random(), 1.6))) | 0);
  maskKey = ''; A.have = false; A.hasPrevS = false;
}
const A = { have:false, hasPrevS:false, lastVT:0, energy:0, axisH:0, axisV:0, dirLabel:'—' };

/* ---------- geometry: camera cover-fit into the internal buffer ---------- */
const G = { s:1, ox:0, oy:0, dw:1, dh:1 };
function fitGeom(){
  G.s = Math.max(B.w / vidW, B.h / vidH); G.dw = vidW * G.s; G.dh = vidH * G.s;
  G.ox = (B.w - G.dw) / 2; G.oy = (B.h - G.dh) / 2;
}
function buildMaskIdx(mw, mh){
  const k = B.w + 'x' + B.h + ':' + mw + 'x' + mh + ':' + vidW + 'x' + vidH + ':' + mirror;
  if (k === maskKey) return; maskKey = k;
  if (!maskIdx || maskIdx.length !== B.n){ maskIdx = new Int32Array(B.n); maskFx = new Uint8Array(B.n); maskFy = new Uint8Array(B.n); }
  for (let y = 0; y < B.h; y++){
    const v = Math.max(0, Math.min(mh - 1.001, (y + .5 - G.oy) / G.dh * mh - .5)), my = v | 0, fy = ((v - my) * 255) | 0;
    for (let x = 0; x < B.w; x++){
      const xx = mirror ? B.w - 1 - x : x;
      const u = Math.max(0, Math.min(mw - 1.001, (xx + .5 - G.ox) / G.dw * mw - .5)), mx = u | 0, i = y * B.w + x;
      maskIdx[i] = my * mw + mx; maskFx[i] = ((u - mx) * 255) | 0; maskFy[i] = fy;
    }
  }
}

/* ---------- segmentation & face ---------- */
const M = { f:null, w:0, h:0, has:false, live:false, lastT:0, external:false, fresh:false };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || !(w * h <= 4e6) || data.length < w * h) return false;
  if (M.w !== w || M.h !== h || !M.f){ M.w = w; M.h = h; M.f = new Float32Array(w * h); maskKey = ''; }
  for (let i = 0, n = w * h; i < n; i++){ let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1; M.f[i] = m; }
  M.has = true; M.live = true; M.lastT = performance.now(); M.fresh = true;
  return true;
}
const FACE = { el:[], lastT:-1e9, external:false, dirty:true };
const okPt = p => p && Number.isFinite(p.x) && Number.isFinite(p.y);
function ingestFaces(list){
  FACE.el.length = 0;
  if (Array.isArray(list)) for (const lm of list){
    if (!Array.isArray(lm) || lm.length < 10) continue;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, n = 0;
    for (let i = 0; i < lm.length; i++){
      const p = lm[i]; if (!okPt(p)) continue;
      if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; n++;
    }
    if (n < 10 || !(x1 > x0) || !(y1 > y0) || x1 - x0 > 2 || y1 - y0 > 2) continue;
    FACE.el.push({ u:(x0 + x1) / 2, v:(y0 + y1) / 2, ru:(x1 - x0) / 2, rv:(y1 - y0) / 2 });
    if (FACE.el.length >= 3) break;
  }
  FACE.lastT = performance.now(); FACE.dirty = true;
  return FACE.el.length;
}
function buildFaceProtect(){
  FP.fill(1);
  const pr = S.face; if (pr <= 0) return;
  for (const f of FACE.el){
    let cx = G.ox + f.u * G.dw; if (mirror) cx = B.w - cx;
    const cy = G.oy + f.v * G.dh, rx = Math.max(2, f.ru * G.dw * 1.15), ry = Math.max(2, f.rv * G.dh * 1.1);
    const x0 = Math.max(0, (cx - rx * 1.3) | 0), x1 = Math.min(B.w - 1, (cx + rx * 1.3) | 0);
    const y0 = Math.max(0, (cy - ry * 1.3) | 0), y1 = Math.min(B.h - 1, (cy + ry * 1.3) | 0);
    for (let y = y0; y <= y1; y++){
      const dy = (y - cy) / ry;
      for (let x = x0; x <= x1; x++){
        const dx = (x - cx) / rx, d = Math.sqrt(dx * dx + dy * dy);
        if (d >= 1.25) continue;
        const k = d <= .85 ? 1 : 1 - (d - .85) / .4, v = 1 - pr * .92 * k, i = y * B.w + x;
        if (v < FP[i]) FP[i] = v;
      }
    }
  }
}
let segmenter = null, faceLM = null, segFailed = false, lastTs = 0, lastSegVT = -1;
async function initModel(){

    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const so = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, so('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, so('CPU')); }
    setStatus('');
    const fo = d => ({ baseOptions:{ modelAssetPath:FACE_MODEL, delegate:d }, runningMode:'VIDEO', numFaces:3 });
    try { faceLM = await vision.FaceLandmarker.createFromOptions(fs, fo('GPU')); }
    catch(e){ try { faceLM = await vision.FaceLandmarker.createFromOptions(fs, fo('CPU')); } catch(e2){} }
  }catch(e){
    if (M.external) return;
    segFailed = true;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n画面全体を並べ替えて続けます。');
  }
}
function detect(now){
  if (!segmenter || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastSegVT) return; lastSegVT = vt;
  const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
  try{
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks; if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1]; ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
    });
  }catch(e){}
  if (faceLM && !FACE.external){
    try{ const r = faceLM.detectForVideo(video, ts); ingestFaces(r && r.faceLandmarks); }catch(e){}
  }
}

let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720;

function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';

async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  maskKey = ''; A.have = false; A.hasPrevS = false; resetMotion();
}

/* ---------- audio: a hiss that follows the sorting, a fall for the pour ---------- */
let actx = null, bus = null, recDest = null, hiss = null, hissBP = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try{
    actx = new AC(); bus = actx.createGain(); bus.gain.value = 1; bus.connect(actx.destination);
    recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
    const len = actx.sampleRate * 2, nb = actx.createBuffer(1, len, actx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = nb; src.loop = true;
    hissBP = actx.createBiquadFilter(); hissBP.type = 'bandpass'; hissBP.frequency.value = 1800; hissBP.Q.value = 1.4;
    hiss = actx.createGain(); hiss.gain.value = 0;
    src.connect(hissBP); hissBP.connect(hiss); hiss.connect(bus); src.start();
    actx.resume().catch(()=>{});
  }catch(e){ actx = null; }
}
function sfx(kind){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = kind === 'pour' ? 700 : 2400;
  if (kind === 'pour'){ o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(32, t + 1.4); }
  else if (kind === 'plate'){ o.type = 'square'; o.frequency.setValueAtTime(1320, t); o.frequency.exponentialRampToValueAtTime(660, t + .04); }
  else { o.type = 'sine'; o.frequency.setValueAtTime(kind === 'on' ? 70 : 140, t); o.frequency.exponentialRampToValueAtTime(kind === 'on' ? 420 : 50, t + .5); }
  const dur = kind === 'pour' ? 1.5 : kind === 'plate' ? .07 : .55, pk = (kind === 'plate' ? .08 : .22) * (.3 + S.vol);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .05);
}

const MODE = { on:false, X:0 };
function setMode(on){
  if (on === MODE.on) return;
  MODE.on = on;
  $('mode').textContent = on ? '◂ CAMERA' : '▸ SEIRETSU';
  document.body.classList.toggle('cam', !on);
  document.body.classList.toggle('paper', on && PLATES[S.plate].paper);
  ['plate','pour'].forEach(id => $(id).style.visibility = on ? 'visible' : 'hidden');
  if (!on) CAS.t = -1;

}

}

/* ---------- motion ---------- */
const JUMP = { top:NaN, t:0, hits:0, v:0 };
function resetMotion(){
  if (E) E.fill(0);
  if (bVX){ bVX.fill(0); bVY.fill(0); bE.fill(0); }
  A.hasPrevS = false; A.energy = 0;
  JUMP.top = NaN; JUMP.hits = 0; JUMP.v = 0;
}
function blockMatch(dtObs){
  const sw = B.sw, sh = B.sh, bw = B.bw, bh = B.bh, R = 3, BS = 6;
  // ¼ luma
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++){
    let s = 0; const r0 = (y * 4) * B.w + x * 4;
    for (let j = 0; j < 4; j += 2){ const r = r0 + j * B.w; s += lum[r] + lum[r + 2]; }
    sCur[y * sw + x] = s >> 2;
  }
  if (!A.hasPrevS){ sPrev.set(sCur); A.hasPrevS = true; return; }
  const short = Math.min(B.w, B.h), inv = 4 / Math.max(1e-3, dtObs) / short;      // small px / frame → short edges / s
  const em = Math.exp(-dtObs / .09);
  for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++){
    const bi = by * bw + bx;
    if (bCov[bi] < .04 && !segFailed){ bVX[bi] *= em; bVY[bi] *= em; continue; }
    const x0 = bx * BS, y0 = by * BS;
    let best = 1e9, bdx = 0, bdy = 0, sad0 = 0;
    for (let dy = -R; dy <= R; dy++){

  set(k, v){ S[k] = v; if (k === 'face') FACE.dirty = true; },
  state(){ return { mode:MODE.on, X:MODE.X, energy:A.energy, cas:CAS.t, drip:DRIP.len, live:M.live, faces:FACE.el.length,
    jumpV:JUMP.v, w:B.w, h:B.h, ms:PERF.ms, LE, axisH:A.axisH, axisV:A.axisV }; },
  energyAt(fx, fy){ if (!E) return 0; const x = Math.max(0, Math.min(B.w - 1, (fx * B.w) | 0)), y = Math.max(0, Math.min(B.h - 1, (fy * B.h) | 0)); return E[y * B.w + x]; },
};
</script>
