<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="体が、動くレントゲン写真になる。頭蓋骨・肋骨・骨盤・手の小さな骨まで X 線の写り方で透け、黒い肺野に心臓の影が打つ。速く動くと X 線が連写され、骨の残像が多重露光として焼き付く。">
<meta name="theme-color" content="#03060a">
<title>TOUSHI ─ 体が、動くレントゲン写真になる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  TOUSHI 透視 ─ 体が、動くレントゲン写真になる          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       夜の読影室。シャウカステンの青白い光の上で、自分の骨格が一枚の
             レントゲン写真として動いている。手を振れば指の骨が、首をかしげれば
             頭蓋骨が、踊れば肋骨と背骨がそのまま踊る。動くほど心臓の影は速く
             打ち、横隔膜は大きく上下する。
  REFERENCE  Nick Veasey の X 線写真作品／The Chemical Brothers
             "Hey Boy Hey Girl"（1999）の骸骨のダンサー／W. C. Röntgen が 1895 年
             に撮った指輪の手（最初の X 線写真）。
  PALETTE    FILM    空気 #02050a → 肉 #24394a → 骨 #f5fafc ／ 未露光の縁 #b9c8d0
             FLUORO  反転表示：空気 #e2eadf → 骨 #0b100d（イメージ管の円い視野）
             1895    ガラス乾板：#140d07 → #f4e6c6 のセピア、薬指に指輪
             どれも単色の階調だけ。色相は一つの写真につき一つ。
  TYPE       B612（題字）・B612 Mono（フィルムの記載）── 航空機の計器表示の書体。
  MOTION     骨は体そのものなので速さを決めない。写真のほうが動きに応える ──
             速く動くと X 線が 8 回/秒のパルスで連写され、ひとつ前の姿勢の骨が
             薄い残像として 0.5 秒ほどフィルムに残る（マレーの連続写真の多重露光）。
             FLUORO は代わりにイメージ管の残像を引く。心拍 64→126、呼吸 13→30 は
             動いた量の積分で数十秒かけて上下し、心臓の影と横隔膜がその速さで動く。
  SIGNATURE  骨は「中が空洞の管」として X 線が通る長さで描く ── 皮質が縁で厚く
             中央で薄いので、本物と同じく縁が白く髄腔が暗い。曲がった骨（肋骨・
             鎖骨・下顎・腸骨稜）は継ぎ目を斜めに切って一本につなぎ、視線に沿って
             走る部分ほど白くなる。腸骨翼・仙骨・肩甲骨は扇形の薄い板。
  TECH       PoseLandmarker（2 人・人物マスク付き）＋ HandLandmarker（4 手）。
             骨格・肺野・肺血管・心臓・腸のガスを 1 人あたり約 1300 個の解析的
             プリミティブ（中空の管・回転楕円体の殻・角丸の箱・扇形の板）として
             組み、インスタンス描画で半精度の「通過長」バッファに加算する（骨・
             軟部・空気・金属の 4 チャンネル）。フィルム状態のパスで人物マスクの
             厚み（ミップマップのぼかし）を軟部に足し、Beer–Lambert の減衰
             1−exp(−μx) を求め、骨にだけアンシャープマスクをかけ、ブレ（前フレーム
             との混合）とパルスごとの残像（減衰する最大値）を保持する。表示の
             パスでフィルムの階調・枠・鉛マーカー・コリメータ光に通す。
  ══════════════════════════════════════════════════════════════════════════
-->

<div id="start">
  <div class="t">RADIOGRAPH · 透視</div>
  <h1>TOUSHI</h1>
  <p>X 線が、あなたを透かす。<br>骨のまま、動ける。</p>
  <button id="go">はじめる</button>
  <div id="err"></div>

<script>
'use strict';
/* =====================================================================
   TOUSHI — a live radiograph. The skeleton, lungs and organs are rebuilt
   every frame from the pose and hand landmarks as ~1300 analytic
   primitives per person whose X-ray path lengths are accumulated in a
   half-float buffer, then exposed through Beer–Lambert attenuation onto
   one of three films. Fast motion fires a strobe: ghost exposures.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
const PALS = [
  { name:'FILM',   ramp:['#02050a','#22374a','#a5bccb','#f6fbfd'], frame:0, lag:.3,  grain:1,   ink:'#22323c' },
  { name:'FLUORO', ramp:['#e1e9de','#a3b2a6','#4a584e','#0a0f0c'], frame:1, lag:.62, grain:1.3, ink:'#a6d9ad' },
  { name:'1895',   ramp:['#120c07','#4b3521','#b6966f','#f4e6c6'], frame:2, lag:.22, grain:1.5, ink:'#e2cfa6' },
];
const S = { pal:0, bone:1, tissue:1, lag:.5, grain:.5 };
PALS.forEach(p => { p.rampF = new Float32Array(12); p.ramp.forEach((h, i) => p.rampF.set(hex(h), i*3)); });

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
let floatOK = false;
const VS_Q = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
// one instanced quad per primitive; the fragment shader returns the X-ray path length through it
const VS_PRIM = `#version 300 es
in vec2 aC; in vec4 iBox, iP, iQ, iR, iW, iE;
uniform vec2 uRes;
out vec2 vPx; flat out vec4 vP, vQ, vR, vW, vE;
void main(){
  vec2 px = mix(iBox.xy, iBox.zw, aC);
  vPx = px; vP = iP; vQ = iQ; vR = iR; vW = iW; vE = iE;
  vec2 n = px / uRes * 2. - 1.;
  gl_Position = vec4(n.x, -n.y, 0., 1.);
}`;
const FS_PRIM = `#version 300 es
precision highp float;
in vec2 vPx; flat in vec4 vP, vQ, vR, vW, vE;
uniform sampler2D uNoise;
out vec4 o;
// signed distance of p from the line a→b, positive on the side of c
float side(vec2 a, vec2 b, vec2 c, vec2 p){ vec2 n = normalize(vec2(a.y - b.y, b.x - a.x)); return dot(p - a, n) * (dot(c - a, n) < 0. ? -1. : 1.); }
void main(){
  int type = int(vE.w + .5);
  float d = 0.;
  if (type == 0){
    // a hollow tube (long bone): cortex is a shell, the medulla is dark, the ends fill with spongy bone
    vec2 A = vP.xy, B = vP.zw, ab = B - A; float L = max(length(ab), 1e-3); vec2 dir = ab / L;
    vec2 ap = vPx - A; float along = dot(ap, dir), perp = dot(ap, vec2(-dir.y, dir.x));
    bool mA = vE.x < 50., mB = vE.y < 50.;                                     // mitred joints inside a chain
    if (mA && dot(ap, vec2(cos(vE.x), sin(vE.x))) < 0.) discard;
    if (mB && dot(vPx - B, vec2(cos(vE.y), sin(vE.y))) > 0.) discard;
    float t = clamp(along / L, 0., 1.), ck = vE.z > 0. ? vE.z : 1.;           // ck flattens the end caps (joints)
    float over = (along < 0. && !mA) ? -along : (along > L && !mB) ? along - L : 0.;
    float e = vR.w > .5 ? 0. : max(clamp(1. - t / vR.z, 0., 1.), clamp(1. - (1. - t) / vR.z, 0., 1.));
    e = e*e*(3. - 2.*e);
    float R = mix(vQ.x, vQ.y, t) * (1. + vQ.z * e);
    float dd2 = perp*perp + over*over/(ck*ck);
    if (dd2 >= R*R) discard;
    float outer = 2.*sqrt(R*R - dd2);
    float ri = R * vQ.w * (1. - .3*e);
    float inner = 2.*sqrt(max(ri*ri - dd2, 0.));
    vec2 tu = vec2(along, perp) / max(vQ.x, .8);
    float tex = texture(uNoise, tu * vec2(.07, .26) + vR.y).r;               // trabeculae run along the bone
    d = (outer - inner) * (1. - .45*e) + inner * vR.x * (.15 + .32*e) * (.4 + 1.2*tex);
  } else if (type == 1){
    // an ellipsoid (or an ellipsoidal shell): exact chord of the ray along the view axis
    vec2 q = vPx - vP.xy;
    vec3 pp = vec3(dot(vQ.xy, q), dot(vR.xy, q), dot(vE.xy, q));
    vec3 dv = vec3(vQ.z, vR.z, vE.z);
    float a = dot(dv, dv), b = dot(pp, dv), c = dot(pp, pp) - 1.;
    float disc = b*b - a*c; if (disc <= 0.) discard;
    float outer = 2.*sqrt(disc) / a, inner = 0., k = vP.z;
    if (k > 0.){ float k2 = k*k, a2 = a/k2, b2 = b/k2, c2 = dot(pp, pp)/k2 - 1., d2 = b2*b2 - a2*c2; if (d2 > 0.) inner = 2.*sqrt(d2) / a2; }
    vec2 lp = vec2(pp.x / max(length(vQ.xy), 1e-4), pp.y / max(length(vR.xy), 1e-4));   // local px, so the texture rides on the bone
    float tex = texture(uNoise, lp * .021 + vQ.w).r, tx2 = texture(uNoise, lp * .043 + vQ.w*1.7).r;
    d = (outer - inner) * (.8 + .4*tx2) + inner * vP.w * (.45 + 1.1*tex);
    if (vR.w != 0.){ float ly = (pp + dv*(-b/a)).y; d *= smoothstep(vR.w - .3, vR.w + .12, ly); }
  } else if (type == 3){
    // a thin plate (iliac wing, sacrum, scapula): one triangle of a fan, even thickness, thicker toward the fan's centre
    vec2 v0 = vP.xy, v1 = vP.zw, v2 = vQ.xy;
    float e0 = side(v1, v2, v0, vPx), e1 = side(v2, v0, v1, vPx), e2 = side(v0, v1, v2, vPx);
    float cov = clamp(min(min(e0, e1), e2) + .5, 0., 1.);                      // shared edges of the fan sum to one
    if (cov <= 0.) discard;
    float l0 = clamp(e0 / max(side(v1, v2, v0, v0), 1e-3), 0., 1.);
    vec2 dq = vPx - v0, tc = vec2(vR.z*dq.x - vR.w*dq.y, vR.w*dq.x + vR.z*dq.y);
    float tex = texture(uNoise, tc + vR.y).r * .6 + texture(uNoise, tc * 2.3 + vR.y).r * .4;
    float prof = vQ.w < 0. ? -vQ.w * sqrt(l0*(2. - l0)) : vQ.w * l0*l0;          // < 0: rounded like a lung, > 0: a thick body at the centre
    d = vQ.z * cov * (1. + prof) * (1. + vR.x * (2.*tex - 1.));
  } else {
    // a rounded box (vertebral bodies): flat depth inside, rounded falloff and an optional cortical rim
    vec2 q0 = vPx - vP.xy; float ca = cos(vP.z), sa = sin(vP.z);
    vec2 q = vec2(ca*q0.x + sa*q0.y, -sa*q0.x + ca*q0.y);
    float rr = max(vP.w, .5);
    vec2 qq = abs(q) - (vQ.xy - rr);
    float sdf = length(max(qq, 0.)) + min(max(qq.x, qq.y), 0.) - rr;
    if (sdf >= 0.) discard;
    float outer = vQ.z * sqrt(clamp(-sdf / rr, 0., 1.)), inner = 0.;
    if (vQ.w > 0.) inner = vQ.z * .9 * sqrt(clamp(-(sdf + vQ.w) / rr, 0., 1.));
    float tex = texture(uNoise, q * .05 + vR.y).r;
    d = outer - inner + inner * vR.x * (.45 + 1.1*tex);
  }
  o = vW * d;
}`;
// the film's state: tissue thickness from the mask + path lengths → Beer–Lambert exposure, kept with its lag and
// with the stroboscopic ghosts (fast motion fires short pulses; each pulse is a fainter copy that stays a moment)
const FS_FILM = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uDen, uMask, uPrev;
uniform vec2 uScale, uRes; uniform float uMirror;
uniform float uMuT, uMuB, uLod, uHasMask, uLag, uEdge, uPulse, uGDecay;
uniform vec4 uDec;
vec2 vuv(vec2 s){ vec2 v = (vec2(s.x, 1. - s.y) - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
void main(){
  vec2 v = vuv(uv), tx = 1. / uRes;
  vec4 D = texture(uDen, uv) * uDec;
  float bl = (texture(uDen, uv + vec2(2.5, 0.)*tx).r + texture(uDen, uv - vec2(2.5, 0.)*tx).r
            + texture(uDen, uv + vec2(0., 2.5)*tx).r + texture(uDen, uv - vec2(0., 2.5)*tx).r) * .25 * uDec.r;
  float bone = max(D.r + uEdge*(D.r - bl), 0.);                                // unsharp mask, bone only
  float mk = smoothstep(.25, .7, texture(uMask, v).r);
  float mb = textureLod(uMask, v, uLod).r;
  float thick = uHasMask * mk * (.016 + .25*pow(mb, 1.25));                    // metres of soft tissue
  float tissue = max(thick + D.g - D.b, 0.);
  float att = uMuT*tissue + uMuB*bone + 320.*max(D.a, 0.);
  float val = 1. - exp(-att);
  vec4 pv = texture(uPrev, uv);
  o = vec4(mix(val, pv.r, uLag), max(pv.g * uGDecay, val * uPulse), val, 1.);  // exposure blur / intensifier lag; ghosts
}`;
// what is shown: the film on its light box (or the intensifier, or the plate), the markings, the camera and the flash
const FS_SHOW = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uSt, uVid, uOver, uGlyph, uNoise;
uniform vec2 uScale, uRes; uniform float uMirror;
uniform float uGrain, uT, uCam, uColl, uFlash, uDev, uGhost;
uniform vec4 uField, uMk[4]; uniform vec3 uCirc; uniform int uFrame;
uniform vec3 uRamp[4];
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
vec2 vuv(vec2 s){ vec2 v = (vec2(s.x, 1. - s.y) - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
vec3 ramp(float x){ x = clamp(x, 0., 1.)*3.;
  return x < 1. ? mix(uRamp[0], uRamp[1], x) : x < 2. ? mix(uRamp[1], uRamp[2], x - 1.) : mix(uRamp[2], uRamp[3], x - 2.); }
void main(){
  vec2 px = gl_FragCoord.xy, sp = vec2(px.x, uRes.y - px.y);
  vec3 cam = texture(uVid, vuv(uv)).rgb;
  vec4 st = texture(uSt, uv);
  float gh = st.g * uGhost, gm = max(st.r, gh);

/* ---------- frames from landmarks ---------- */
const WP = new Float32Array(99);

/* ---------- physiology: the more you move, the faster the heart and the breath ---------- */
function physiology(P, dt){
  const target = Math.min(1.5, P.E / .7);
  P.ex += (target - P.ex) * (1 - Math.exp(-dt / (target > P.ex ? 4 : 18)));

/* ---------- build the whole frame ---------- */

/* ---------- mask (pose segmentation, reused buffers) ---------- */
const M = { w:0, h:0, u8:null, has:false, at:-1e9 };

/* ---------- MediaPipe (dynamic import; the page still runs without it) ---------- */
let poser = null, hander = null, lastTs = 0, lastVT = -1, modelState = 'loading', EXT = false, frameNo = 0;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const mk = async (Cls, o) => { try { return await Cls.createFromOptions(fs, { ...o, baseOptions:{ ...o.baseOptions, delegate:'GPU' } }); }
                                   catch(e){ return await Cls.createFromOptions(fs, { ...o, baseOptions:{ ...o.baseOptions, delegate:'CPU' } }); } };
    poser = await mk(vision.PoseLandmarker, { baseOptions:{ modelAssetPath:POSE_MODEL }, runningMode:'VIDEO', numPoses:2,
      minPoseDetectionConfidence:.5, minPosePresenceConfidence:.5, minTrackingConfidence:.5, outputSegmentationMasks:true });

  const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts; frameNo++;
  try{
    const r = poser.detectForVideo(video, ts);
    onPose(r && r.landmarks, r && r.worldLandmarks, ts);
    const ms = r && r.segmentationMasks;
    if (ms && ms.length){
      let w = 0, h = 0;

        const m = ms[i], d = m.getAsFloat32Array(); w = m.width; h = m.height;
        if (!MASKBUF.f || MASKBUF.f.length !== w*h) MASKBUF.f = new Float32Array(w*h);

}

    octx.strokeStyle = 'rgba(240,226,196,.16)'; octx.lineWidth = 1;
    for (let i = 0; i < 7; i++){ const x = rnd()*CW, y = rnd()*CH, l = (.1 + rnd()*.35)*CH, a = (rnd() - .5)*.5 + Math.PI/2;
      octx.beginPath(); octx.moveTo(x, y); octx.quadraticCurveTo(x + Math.cos(a)*l*.5 + (rnd() - .5)*20, y + Math.sin(a)*l*.5, x + Math.cos(a)*l, y + Math.sin(a)*l); octx.stroke(); }
  }
  gl.bindTexture(gl.TEXTURE_2D, texOver); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, over);
  overDirty = false; overAt = now;
}
const MK = new Float32Array(16);
function markers(){
  MK.fill(0);
  if (PALS[S.pal].frame !== 0) return;
  let n = 0;
  for (const P of PEOPLE){ if (P.alpha < .5 || !P.fN.init || n >= 4) continue;
    const x = P.fN.x[36], y = P.fN.x[37], x2 = P.fN.x[33]; let sx, sy, ox;
    { let a = x; if (mirror) a = 1 - a; sx = ((a - .5)/scX + .5)*CW; sy = ((y - .5)/scY + .5)*CH;
      let b = x2; if (mirror) b = 1 - b; ox = ((b - .5)/scX + .5)*CW; }
    // lead markers sit in the corner of the collimated field on the side they mark
    const right = sx > ox, size = Math.max(18, Math.min(40, Math.min(CW, CH)*.045)), m = size*1.2;
    MK[n*4] = right ? FIELD[2] - m : FIELD[0] + m; MK[n*4+1] = Math.max(FIELD[1] + m*2, Math.min(FIELD[3] - m*2, sy - P.T.s*.05)) + n*size*1.5;
    MK[n*4+2] = size; MK[n*4+3] = 0; n++;
  }
}

/* ---------- audio: the rotor, the exposure beep, a faint high-voltage hum ---------- */
let actx = null, bus = null, recDest = null, noiseB = null, hum = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .5; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  const len = actx.sampleRate | 0; noiseB = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseB.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
  const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.value = 100; o2.type = 'sine'; o2.frequency.value = 2400; f.type = 'lowpass'; f.frequency.value = 420;
  g.gain.value = 0; o.connect(f); o2.connect(g); f.connect(g); g.connect(bus); o.start(); o2.start(); hum = g;
  actx.resume().catch(()=>{});
}
function humTo(v){ if (hum && actx) hum.gain.setTargetAtTime(v, actx.currentTime, .4); }
function rotorAndBeep(){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(1900, t + .95);
  f.type = 'bandpass'; f.Q.value = 3; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + .95);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t + .3); g.gain.setValueAtTime(.08, t + .95); g.gain.exponentialRampToValueAtTime(.0005, t + 1.6);
  o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + 1.7);
  const b = actx.createOscillator(), bg = actx.createGain(); b.frequency.value = 1046;
  bg.gain.setValueAtTime(0, t + .78); bg.gain.linearRampToValueAtTime(.16, t + .8); bg.gain.setValueAtTime(.16, t + 1.04); bg.gain.linearRampToValueAtTime(0, t + 1.07);
  b.connect(bg); bg.connect(bus); b.start(t + .75); b.stop(t + 1.1);
  click(.5, t + .02);
}
function tick(p){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(3200, t); o.frequency.exponentialRampToValueAtTime(900, t + .012);
  g.gain.setValueAtTime(p, t); g.gain.exponentialRampToValueAtTime(.0003, t + .03);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + .035);
}
function click(p, at){
  if (!actx || actx.state !== 'running' || !noiseB) return;
  const t = at || actx.currentTime, s = actx.createBufferSource(); s.buffer = noiseB;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 1.4;
  const g = actx.createGain(); g.gain.setValueAtTime((p || .6), t); g.gain.exponentialRampToValueAtTime(.0005, t + .05);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random()*.5); s.stop(t + .06);
}

/* ---------- mode: plain camera ⇄ radiograph ---------- */
const MODE = { on:false, t0:-1e9, xr:false, cam:1, coll:0, flash:0, dev:0, reset:true };
function setMode(on){
  MODE.on = on; MODE.t0 = performance.now(); MODE.reset = true;
  $('mode').textContent = on ? 'カメラにもどる' : '透視する';
  if (on){ rotorAndBeep(); humTo(.012); } else { click(.6); humTo(0); }
}

$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!PF) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','mode','hud'].forEach(id => $(id).classList.add('show'));
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('700 38px B612'), document.fonts.load('12px "B612 Mono"')]).then(() => { drawGlyphs(); overDirty = true; }).catch(()=>{});
  if (!started){ started = true; t0 = performance.now(); if (!EXT) initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('mode').onclick = () => { ensureAudio(); setMode(!MODE.on); };
addEventListener('keydown', e => { if (started && (e.key === ' ' || e.key === 'Enter') && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); setMode(!MODE.on); } });
function setPal(i){
  S.pal = i; [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
  overDirty = true; MODE.reset = true; click(.4);
}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sBone','bone'],['sTissue','tissue'],['sLag','lag'],['sGrain','grain']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

$('shoot').onclick = () => {
  click(.8);
  try{ canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'toushi-' + Date.now() + '.png'; a.click(); }, 'image/png'); }
  catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'toushi.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- the strobe: fast motion fires short exposure pulses, each one a ghost that lingers on the film ---------- */
const STROBE = { k:0, last:0, n:0 };
function strobe(now, dt, pal){
  let e = 0; for (const P of PEOPLE) if (P.ok && P.alpha > .5) e = Math.max(e, P.E);
  const on = pal.frame !== 1 && MODE.on && MODE.xr ? sstep(.5, 1.6, e) : 0;              // the intensifier has its own lag instead
  STROBE.k += (on - STROBE.k) * (1 - Math.exp(-dt * (on > STROBE.k ? 4 : 1.2)));
  if (on > .02 && STROBE.k > .04 && now - STROBE.last > 120){ STROBE.last = now; STROBE.n++; tick(.025 + .05*STROBE.k); return 1; }
  return 0;
}

const CIRC = [0, 0, 0];
function circle(W, H, dt){
  const r = Math.min(W, H) * (H > W ? .49 : .47);
  let tx = W/2, ty = H/2;
  for (const P of PEOPLE) if (P.ok && P.alpha > .5){ tx = P.T.ax; ty = P.T.ay + .05*P.T.s; break; }
  tx = Math.max(r*.9, Math.min(W - r*.9, tx)); ty = Math.max(r*.9, Math.min(H - r*.9, ty));
  if (!CIRC[2]){ CIRC[0] = tx; CIRC[1] = ty; }
  const k = 1 - Math.exp(-dt*1.5); CIRC[0] += (tx - CIRC[0])*k; CIRC[1] += (ty - CIRC[1])*k; CIRC[2] = r;
}

/* ---------- render ---------- */
let lastT = 0, hudT = 0, noBodyFor = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dtw = lastT ? Math.min(.5, (now - lastT)/1000) : 1/60, dt = Math.min(.1, dtw); lastT = now;
  if (video.videoWidth){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const kk = Math.min(1, 1600 / Math.max(W, H)); W = Math.round(W*kk); H = Math.round(H*kk);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  CW = W; CH = H;
  const asp = W/H, va = vidW/vidH; scX = asp < va ? asp/va : 1; scY = asp < va ? 1 : va/asp;
  ensureRT(W, H); fieldRect();
  if (!EXT) track(now);
  if (video.readyState < 2) return;

  // mode timeline: collimator light (0–1.05 s), exposure flash, the film develops
  const el = (now - MODE.t0)/1000;
  if (MODE.on){
    MODE.xr = el >= 1.05; MODE.cam = MODE.xr ? 0 : 1; MODE.coll = MODE.xr ? 0 : sstep(0, .35, el);
    MODE.flash = MODE.xr ? Math.exp(-(el - 1.05)*9) : 0; MODE.dev = MODE.xr ? 1 - Math.exp(-(el - 1.05)*3.2) : 0;
  } else {
    MODE.coll = 0; MODE.flash = 0;
    if (el < .55){ MODE.xr = true; MODE.cam = sstep(0, .55, el) * (.86 + .14*Math.sin(el*95)); MODE.dev = 1; }
    else { MODE.xr = false; MODE.cam = 1; MODE.dev = 0; }
  }

  build(dt);
  markers();
  const pal = PALS[S.pal];
  if (overDirty || now - overAt > 1000) drawOver(now);

  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texVid);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; }

  // pass 1: path lengths
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.denF); gl.viewport(0, 0, RT.dw, RT.dh);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (NI > 0){
    gl.useProgram(PP.p); gl.uniform2f(PP.U.uRes, CW, CH); gl.uniform1i(PP.U.uNoise, 0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texNoise);
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, INST, 0, NI*IF);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.blendEquation(gl.FUNC_ADD);
    gl.bindVertexArray(primVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, NI);
    gl.disable(gl.BLEND);
  }
  // pass 2: the exposure, into the ping-pong film state (lag + stroboscopic ghosts)
  const src = RT.ping, dst = 1 - src;
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.stF[dst]); gl.viewport(0, 0, W, H);
  gl.useProgram(PF.p); gl.bindVertexArray(quadVAO);
  let U = PF.U;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.den);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, RT.st[src]);
  gl.uniform1i(U.uDen, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uPrev, 3);
  gl.uniform2f(U.uScale, scX, scY); gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(U.uMuT, 2.2 * S.tissue); gl.uniform1f(U.uMuB, 52 * S.bone); gl.uniform1f(U.uEdge, .9);
  const dec = floatOK ? 1 : 1/8;
  gl.uniform4f(U.uDec, dec, dec, dec, dec);
  const ps = PEOPLE[0].s || PEOPLE[1].s || 600;
  gl.uniform1f(U.uLod, Math.log2(Math.max(1, .085*ps * scX * (M.w || 1) / CW)));
  gl.uniform1f(U.uHasMask, M.has && now - M.at < 1500 ? 1 : 0);
  gl.uniform1f(U.uLag, MODE.reset ? 0 : Math.min(.93, pal.lag * S.lag * 2));
  const pulse = strobe(now, dtw, pal);
  gl.uniform1f(U.uPulse, pulse); gl.uniform1f(U.uGDecay, MODE.reset ? 0 : Math.exp(-dtw / .5));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  RT.ping = dst; MODE.reset = MODE.reset && MODE.on && el < 1.1;
  // pass 3: to the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(PS.p); U = PS.U;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.st[dst]);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, texOver);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, texGlyph);
  gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, texNoise);
  gl.uniform1i(U.uSt, 0); gl.uniform1i(U.uVid, 2); gl.uniform1i(U.uOver, 4); gl.uniform1i(U.uGlyph, 5); gl.uniform1i(U.uNoise, 6);
  gl.uniform2f(U.uScale, scX, scY); gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(U.uGrain, S.grain * pal.grain); gl.uniform1f(U.uT, now/1000);
  gl.uniform1f(U.uCam, MODE.cam); gl.uniform1f(U.uColl, MODE.coll); gl.uniform1f(U.uFlash, MODE.flash); gl.uniform1f(U.uDev, MODE.dev);
  gl.uniform1f(U.uGhost, STROBE.k * .9);
  gl.uniform4f(U.uField, FIELD[0], FIELD[1], FIELD[2], FIELD[3]);
  circle(W, H, dtw); gl.uniform3f(U.uCirc, CIRC[0], CIRC[1], CIRC[2]);
  gl.uniform1i(U.uFrame, pal.frame);
  gl.uniform4fv(U.uMk, MK);
  gl.uniform3fv(U.uRamp, pal.rampF);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  hudT += dtw;
  noBodyFor = lastBuild.people || lastBuild.hands ? 0 : noBodyFor + dtw;
  if (hudT > .25){ hudT = 0;
    $('hud').classList.toggle('show', !MODE.xr);
    $('hud').textContent = 'TOUSHI\n' + (MODE.on ? pal.name : 'CAMERA');
    let st = '';
    if (modelState === 'fail' && !EXT) st = '骨格の検出モデルを読み込めませんでした（ネット接続を確認）。';
    else if (MODE.xr && MODE.on && noBodyFor > 1 && (modelState === 'ok' || EXT)) st = '上半身が映るように、すこし離れてください。';
    if ($('status').textContent !== st && !$('status').textContent.startsWith('カメラを起動')) setStatus(st);
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__TOUSHI = {
  external(){ EXT = true; },
  pose(list, world, tMs){ EXT = true; onPose(list, world, tMs); },
  hands(list, tMs){ EXT = true; onHands(list, tMs); },
  ingestMask(d, w, h){ EXT = true; ingestMask(d, w, h, 1); },
  mode(on){ setMode(!!on); },
  palette(i){ setPal(i); },
  set(k, v){ if (k in S) S[k] = +v; },
  state: () => ({ people:PEOPLE.map(P => ({ ok:P.ok, alpha:P.alpha, s:P.s, sh:P.sh, E:P.E, hr:P.hr, rr:P.rr, ax:P.T.ax, ay:P.T.ay, HR:Array.from(P.H.R), TR:Array.from(P.T.R) })), CW, CH, hands:HANDS.map(h => h.ok),
                  prims:NI, built:{ ...lastBuild }, xr:MODE.xr, floatOK, mask:M.has, strobe:{ k:STROBE.k, n:STROBE.n } }),
};
</script>
</body>
</html>
