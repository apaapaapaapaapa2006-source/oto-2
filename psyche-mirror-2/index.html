<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<title>PSYCHE MIRROR II ─ みつめると、はじける</title>
<meta name="description" content="カメラをじっと見つめると、髪が液体のマーブル絵の具になって頭からはじけ出す。顔は白い紙のように抜け、後ろでは色の粉が爆発し、しぶきが線を引いて飛ぶ。頭をふるとしぶき、口をあけると爆発、目を長めにとじると配色がかわる。">
<meta name="theme-color" content="#060509">
<!--
  ══════════════════════════════════════════════════════════════════════════
  PSYCHE MIRROR II ─ みつめると、はじける          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  出自      オーナーの PSYCHE MIRROR（アパート / APARTMENT）の新しい版。
            「見つめると変わる」「口」「目をとじると配色」の仕組みは元のまま、
            絵をオーナーが見せた 3 枚に寄せて作り直した：
            ① MINIMA のアート（白く抜けた顔、髪がサイケな液体マーブル絵の具に
              なって爆ぜ、目のあたりまで絵の具がかぶり、服へ垂れる）
            ② 黒地に放射状に爆発するホーリーの色粉
            ③ 黒地に飛び散るネオンのペンキ（細い線を引いて飛ぶしぶきと点、垂れ）

  MOOD      静かなカメラ映像が、見つめた瞬間に爆ぜる。夢というより覚醒。

  主役      髪が液体のマーブル絵の具になる。髪の中で絵の具が生まれ、渦を巻き
            ながら頭のまわりへ流れ出て、伸びた筋が帯になる（墨流しと同じ原理：
            色の境目が流れで引き伸ばされる）。帯の境目に細い墨の線と白い光沢。

  層        ① 顔は白い紙のポスター（明・中・影の淡い 3 階調＋目鼻の墨線、
              影には左右で違う色が映り込む）。服は暗い 3 階調。
            ② 絵の具が額から目のあたりまでかぶり、何本か顔に垂れる（量は⚙）
            ③ はじけた瞬間、頭の後ろで色粉が放射状に爆発する（人の後ろに描く）
            ④ しぶき：線を引いて飛ぶ滴と大小の点。頭をふると、ふった向きへ飛ぶ
            ⑤ 口をあけると、もう一度爆発。目を長めにとじると配色がかわる
            ⑥ 髪の先から絵の具が垂れていく。画面をたたくとそこに絵の具がはねる

  PALETTE   ネオン・マーブル（MINIMA）/ ホーリー / スプラッシュ / すみ流し（白黒）。
            UI は 黒 #060509・紙 #f5fbf6・マゼンタ #ff2fb4・シアン #3ff0ff・
            ライム #b8ff3a・バイオレット #7a35ff・オレンジ #ff8a1e。

  TYPE      Rubik Wet Paint（垂れるペンキの題字）と Zen Kaku Gothic New（本文）。

  TECH      WebGL2。絵の具は画面空間の流体もどき（カールノイズ＋頭からの外向き流れ
            ＋頭の動き＋爆発の衝撃）で 2 本の位相と量を毎フレーム運ぶ。
            髪・顔・肌・服は MediaPipe ImageSegmenter（selfie_multiclass）、
            見つめる・口・目は FaceLandmarker（どちらも動的 import）。
            粉としぶきは解析的に動くインスタンス描画（CPU は生まれた時だけ書く）。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>
:root{

.burst{position:absolute;left:50%;top:44%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;opacity:.8;

    #b8ff3a 12.5deg 13.3deg,transparent 13.3deg 18deg,#7a35ff 18deg 20deg,transparent 20deg 25deg,#ff8a1e 25deg 26deg,transparent 26deg 31deg);
  -webkit-mask:radial-gradient(circle,transparent 0 7%,#000 9%,rgba(0,0,0,.55) 20%,transparent 40%);
  mask:radial-gradient(circle,transparent 0 7%,#000 9%,rgba(0,0,0,.55) 20%,transparent 40%);
  animation:spin 140s linear infinite}
.dots{position:absolute;inset:0;opacity:.9;background:
  radial-gradient(circle at 14% 18%,#ff2fb4 0 6px,transparent 7px),radial-gradient(circle at 82% 14%,#3ff0ff 0 4px,transparent 5px),
  radial-gradient(circle at 90% 38%,#b8ff3a 0 9px,transparent 10px),radial-gradient(circle at 8% 62%,#ff8a1e 0 5px,transparent 6px),
  radial-gradient(circle at 76% 84%,#7a35ff 0 7px,transparent 8px),radial-gradient(circle at 22% 88%,#3ff0ff 0 3px,transparent 4px),
  radial-gradient(circle at 63% 9%,#ffe53a 0 3px,transparent 4px),radial-gradient(circle at 36% 7%,#ff2fb4 0 2px,transparent 3px),

.card{position:relative;max-width:420px;width:100%;text-align:center;padding:26px 20px}

/* ---------- hud ---------- */

  padding:8px 16px;border-radius:999px;background:var(--ui-bg);border:1px solid var(--ui-line);font-size:13.5px;font-weight:700;letter-spacing:.05em;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .5s;white-space:nowrap;pointer-events:none;

<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="start">
  <div class="burst"></div>
  <div class="dots"></div>
  <div class="card">
    <div class="brand">アパート / APARTMENT</div>
    <h1>Psyche<br>Mirror <i>II</i></h1>
    <div class="sub">みつめると、はじける。</div>
    <div class="how">
      カメラを <b>2〜3秒</b> じっと見つめる<br>
      髪が絵の具になって、<b class="m">はじける</b><br>
      頭をふると<b class="c">しぶき</b>、口をあけると<b class="m">爆発</b><br>
      目を長めにとじると、<b>色がかわる</b><br>
      画面をたたくと、そこに絵の具がはねる
    </div><br>
    <button class="go" id="go" type="button">カメラをひらく</button>
    <div id="err"></div>
    <div class="note">映像はこの端末の中だけで処理されます。</div>
  </div>
</div>

<div id="status" class="off"></div>
<div id="toast"></div>
<div id="ui">
  <button class="btn" id="flip" type="button">⟲ カメラ</button>

</div>

<script type="module">
/* =========================================================
   PSYCHE MIRROR II — 見つめると、髪が液体の絵の具になってはじける
   ========================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const $ = id => document.getElementById(id);

/* ---------- palettes ---------- */
const PALS = [
  { name: 'ネオン・マーブル',
    bands: ['#ff2fb4', '#3ff0ff', '#b8ff3a', '#7a35ff', '#ff8a1e', '#f6f3ff', '#2f6bff', '#170c2c'],
    bg: '#060509', ink: '#12081f', hi: '#ffffff', glow: '#3a1060',
    face: { l: '#f6fbf7', m: '#dcefe8', s: '#a6c2c8', i: '#1a1024' }, tint: ['#6ff5da', '#ff8ee6'],
    body: ['#07080d', '#13262e', '#2c5a5a'],
    powder: ['#ff2fb4', '#3ff0ff', '#b8ff3a', '#8a3dff', '#ff8a1e', '#ff5ac8'] },
  { name: 'ホーリー',
    bands: ['#ff2d87', '#1fb6ff', '#ff8c1a', '#6fdc4a', '#b03cff', '#ffd23a', '#101a3c'],
    bg: '#04050a', ink: '#0c0a18', hi: '#fff8f0', glow: '#0b2a4a',
    face: { l: '#fbf8f4', m: '#efe3e8', s: '#bba8c2', i: '#1b1020' }, tint: ['#7cc8ff', '#ffb27a'],
    body: ['#06070c', '#1a1f33', '#394666'],
    powder: ['#ff2d87', '#1fb6ff', '#ff8c1a', '#6fdc4a', '#b03cff', '#ffd23a'] },
  { name: 'スプラッシュ',
    bands: ['#ff2a55', '#ffe53a', '#a5ff2e', '#2ef2e6', '#e33cff', '#ff9d2e', '#0a0612'],
    bg: '#000000', ink: '#0a0612', hi: '#ffffff', glow: '#2a0a2a',
    face: { l: '#fbfbf6', m: '#ebf0e2', s: '#b6c0ad', i: '#14101a' }, tint: ['#c8ff8a', '#ff9ad0'],
    body: ['#050507', '#1a1424', '#3a2e50'],
    powder: ['#ff2a55', '#ffe53a', '#a5ff2e', '#2ef2e6', '#e33cff', '#ff9d2e'] },
  { name: 'すみ流し', mono: true,
    bands: ['#f2efe8', '#141218', '#f2efe8', '#8e8a94', '#141218', '#d6d2da'],
    bg: '#eeebe4', ink: '#0d0c10', hi: '#ffffff', glow: '#ffffff',
    face: { l: '#ffffff', m: '#f0eee9', s: '#c6c2bd', i: '#0d0c10' }, tint: ['#d8d8d8', '#bdbdbd'],
    body: ['#0d0c10', '#29272d', '#55525a'],
    powder: ['#141218', '#3a3740', '#141218', '#6f6b74'] },
];
for (const p of PALS) {
  p.bandsF = new Float32Array(24); p.bands.forEach((h, i) => p.bandsF.set(hex(h), i * 3));
  const avg = [0, 0, 0]; p.bands.forEach(h => { const c = hex(h); avg[0] += c[0]; avg[1] += c[1]; avg[2] += c[2]; });
  p.avg = avg.map(v => v / p.bands.length);
  p.powderF = p.powder.map(hex); p.bandsRGB = p.bands.map(hex);
}

/* ---------- MediaPipe ---------- */
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const SEG_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite';
const DELEGATE = /[?&]cpu=1/.test(location.search) ? 'CPU' : 'GPU';   // ?cpu=1 skips the GPU path on devices where it misbehaves
const OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];

/* ---------- DOM / GL ---------- */
const cv = $('gl'), video = $('cam');
const statusEl = $('status'), toastEl = $('toast');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
if (!gl) { $('err').textContent = 'この端末のブラウザは WebGL2 に対応していないため表示できません。'; $('go').disabled = true; }

let useFloat = false;
if (gl) {
  useFloat = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
  if (useFloat) {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 4, 4, 0, gl.RGBA, gl.HALF_FLOAT, null);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    useFloat = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(f); gl.deleteTexture(t);
  }
}

/* ---------- shaders ---------- */
const ENC = useFloat ? 0 : 1;
const COMMON = `
precision highp float;
#define ENC ${ENC}
float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 h22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
/* gradient noise with its derivative: (value, d/dx, d/dy) */
vec3 gnd(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 u=f*f*(3.-2.*f),du=6.*f*(1.-f);
  vec2 ga=h22(i)*2.-1.,gb=h22(i+vec2(1,0))*2.-1.,gc=h22(i+vec2(0,1))*2.-1.,gd=h22(i+vec2(1,1))*2.-1.;
  float va=dot(ga,f),vb=dot(gb,f-vec2(1,0)),vc=dot(gc,f-vec2(0,1)),vd=dot(gd,f-vec2(1,1));
  float k=va-vb-vc+vd;
  return vec3(va+u.x*(vb-va)+u.y*(vc-va)+u.x*u.y*k,
              ga+u.x*(gb-ga)+u.y*(gc-ga)+u.x*u.y*(ga-gb-gc+gd)+du*(vec2(vb-va,vc-va)+u.yx*k));
}
float gn(vec2 p){return gnd(p).x;}
/* paint texel: x = band phase, y = lace phase, z = amount */
vec4 dec(vec4 c){
#if ENC
  return vec4((c.x-.5)*16.,(c.y-.5)*16.,c.z,c.w);
#else
  return c;
#endif
}
vec4 enc(vec4 c){
#if ENC
  return vec4(clamp(c.x/16.+.5,0.,1.),clamp(c.y/16.+.5,0.,1.),c.z,c.w);
#else
  return c;
#endif
}
`;
/* the paint that runs over the forehead and eyes, in face coordinates (-1 at the top of the forehead, +1 at the chin) */
const VEIL = `
uniform vec4 uFF;   // face centre (q) and its left->right axis
uniform vec2 uFS;   // half width, half height (q)
uniform float uVeil, uFaceOK;
vec2 fco(vec2 q){vec2 d=q-uFF.xy, ex=uFF.zw, ey=vec2(-ex.y,ex.x); return vec2(dot(d,ex)/max(uFS.x,1e-3),dot(d,ey)/max(uFS.y,1e-3));}
float veilShape(vec2 q){
  if(uVeil<=0.001||uFaceOK<0.5) return 0.;
  vec2 fc=fco(q); float fx=fc.x, fy=fc.y;
  float edge=-1.+uVeil*(1.02+0.34*gn(vec2(fx*1.6,3.3)));
  float cx=(fx+1.)*3.6, ci=floor(cx), cl=(fract(cx)-.5)/.27;
  float on=step(.42,h12(vec2(ci,7.7)));
  float len=(.22+.62*h12(vec2(ci,1.3)))*uVeil*on;
  edge+=len*sqrt(max(0.,1.-cl*cl));
  return 1.-smoothstep(edge-.035,edge+.035,fy);
}
`;
const VS_FULL = `#version 300 es
out vec2 vUv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;

/* ---- paint transport: advect two phases and an amount, then add new paint from the hair ---- */
const FS_SIM = `#version 300 es
${COMMON}
${VEIL}
in vec2 vUv; out vec4 o;
uniform sampler2D uPrev, uMask;
uniform float uAsp, uT, uDt, uSrc, uOut, uSwirl, uFadeA, uFadeB, uR;
uniform vec2 uC, uHv, uVA, uVB;
uniform vec4 uB[4];
vec2 curlAt(vec2 q){
  float tt=uT*.2, i=floor(tt), f=smoothstep(0.,1.,fract(tt));
  vec2 o1=h22(vec2(i,3.1))*40., o2=h22(vec2(i+1.,3.1))*40.;
  vec3 a=mix(gnd(q*1.6+o1),gnd(q*1.6+o2),f);
  vec3 b=mix(gnd(q*4.2+o1.yx),gnd(q*4.2+o2.yx),f);
  vec3 c=mix(gnd(q*9.5-o1),gnd(q*9.5-o2),f);
  vec2 g=a.yz+b.yz*.85+c.yz*.6;
  return vec2(g.y,-g.x);
}
vec2 vel(vec2 q, float face){
  vec2 d=q-uC; float r=length(d)+1e-4; vec2 n=d/r; float rr=r/uR;
  vec2 cu=curlAt(q)*uSwirl*(1.+.35*min(rr,4.));
  vec2 v=cu;
  float ramp=smoothstep(.5,1.5,rr)*exp(-max(rr-1.5,0.)*.4);
  v+=n*uOut*ramp;
  v+=vec2(-n.y,n.x)*uOut*ramp*.3;
  vec2 hv=uHv*min(1.,.8/max(length(uHv),1e-4));
  v+=hv*.4*exp(-rr*rr*.3);
  for(int k=0;k<4;k++){vec4 b=uB[k]; if(b.w<=0.) continue; vec2 e=q-b.xy; float l=length(e)+1e-4;
    v+=e/l*b.w*exp(-b.z*2.2)*exp(-l*l*7.);}
  /* on the face the paint creeps down slowly instead of being thrown out */
  return mix(v,vec2(0.,.03)+cu*.3,face*uFaceOK);
}
void main(){
  vec2 s=vec2(vUv.x,1.-vUv.y), q=vec2(s.x*uAsp,s.y);
  vec2 vv=s*uVA+uVB;
  vec4 m=(vv.x>0.&&vv.x<1.&&vv.y>0.&&vv.y<1.)?texture(uMask,vv):vec4(0.);
  m=smoothstep(.3,.7,m);
  vec2 v=vel(q,m.g);
  vec2 qp=q-v*uDt, sp=vec2(qp.x/uAsp,qp.y);
  vec4 c=dec(texture(uPrev,vec2(sp.x,1.-sp.y)));
  if(sp.x<0.||sp.x>1.||sp.y<0.||sp.y>1.) c.z=0.;
  float rr=length(q-uC)/uR;
  c.z*=exp(-uDt*(uFadeA+uFadeB*smoothstep(1.6,4.5,rr)));
  /* sources: the hair, the veil, and fresh splashes */
  float vw=m.g>.01?m.g*veilShape(q):0.;
  float src=max(m.r,vw)*smoothstep(0.,.2,uSrc);
  for(int k=0;k<4;k++){vec4 b=uB[k]; if(b.w<=0.||b.z>.3) continue; float l=length(q-b.xy);
    src=max(src,(1.-smoothstep(.02,.05,l))*(1.-b.z/.3));}
  src=clamp(src,0.,1.);
  if(src>.002){                       /* the patterns are only needed where new paint is made */
    vec2 n=normalize(q-uC+1e-5);
    float big=1.3*gn(q*.75+vec2(uT*.017,5.));
    /* strands twist as they leave the head */
    float tw=1.1*gn(q*2.4+vec2(uT*.03,1.))+.45*(rr-1.);
    vec2 nw=vec2(n.x*cos(tw)-n.y*sin(tw),n.x*sin(tw)+n.y*cos(tw));
    float Ph=2.6*gn(nw*3.2+vec2(uT*.04,-uT*.03))+1.2*gn(q*3.4+vec2(-uT*.05,uT*.04))+.55*gn(q*8.5-uT*.09);
    vec2 fc=fco(q);
    float Pv=vw>.001?2.4*gn(vec2(fc.x*2.6,fc.y*.35-uT*.05))+1.1*gn(vec2(fc.x*6.5,uT*.03+3.)):0.;
    float Ps=big+mix(Ph,Pv,vw/(vw+m.r+1e-3));
    float P2=1.7*gn(q*5.3+vec2(uT*.06,9.))+.6*gn(q*11.-uT*.1);
    float w=max(clamp(src*uDt*2.5,0.,1.),src*(1.-smoothstep(0.,.35,c.z)));
    c.x=mix(c.x,Ps,w); c.y=mix(c.y,P2,w);
    c.z=max(c.z,src);
  }
  o=enc(c);
}`;

/* paint colour shared by the back and front passes */
const PAINT = `
uniform sampler2D uPaint;
uniform vec2 uPTx; uniform float uPxSim, uK, uK2, uLW;
uniform vec3 uPal[8]; uniform int uPN; uniform float uStep; uniform vec3 uInk, uHi, uAvg;
vec4 paintCol(vec2 s){
  vec2 t=vec2(s.x,1.-s.y);
  vec4 c=dec(texture(uPaint,t));
  if(c.z<.06) return vec4(0.);
  vec4 xp=dec(texture(uPaint,t+vec2(uPTx.x,0.))), xm=dec(texture(uPaint,t-vec2(uPTx.x,0.)));
  vec4 yp=dec(texture(uPaint,t+vec2(0.,uPTx.y))), ym=dec(texture(uPaint,t-vec2(0.,uPTx.y)));
  vec4 gx=(xp-xm)/(2.*uPxSim), gy=(ym-yp)/(2.*uPxSim);
  /* bands */
  float f=c.x*uK, id=floor(f), fr=f-id;
  vec2 gf=vec2(gx.x,gy.x)*uK; float gl=max(length(gf),1e-5);
  float de=min(fr,1.-fr)/gl;
  float edge=1.-smoothstep(uLW*.5,uLW*.5+1.,de);
  float N=float(uPN);
  int i=int(mod(id*uStep,N));
  vec3 base=uPal[i];
  vec2 dir=gf/gl;
  float wpx=1./gl;                                   /* band width in px */
  float face=dot(dir,vec2(-.6,-.8));                 /* which edge looks toward the light */
  float dl=(face>0.?1.-fr:fr)*wpx;
  float gloss=(1.-smoothstep(.5,1.5,abs(dl-uLW*2.2)))*smoothstep(.15,.6,abs(face))*smoothstep(7.,14.,wpx);
  vec3 col=base*(.8+.2*smoothstep(0.,uLW*4.,de))*(.94+.12*sin(3.14159*fr));
  col=mix(col,uHi,gloss*.75);
  /* a thin thread of the next colour inside wide bands, like combed marbling */
  float th=(1.-smoothstep(uLW*.6,uLW*.6+1.,abs(fr-.5)*wpx))*smoothstep(20.,34.,wpx)*step(.35,fract(id*.618));
  col=mix(col,uPal[int(mod((id+1.)*uStep,N))],th);
  float aa=smoothstep(.35,.9,gl);
  col=mix(col,uAvg,aa); edge*=1.-aa;
  col=mix(col,uInk,edge*.85);
  /* white lace, in patches that travel with the paint */
  float f2=c.y*uK2, fr2=fract(f2);
  vec2 g2=vec2(gx.y,gy.y)*uK2; float gl2=max(length(g2),1e-5);
  float d2=abs(fr2-.5)/gl2;
  float lm=smoothstep(-.12,.35,gn(vec2(c.x,c.y)*.8+3.));
  float lace=(1.-smoothstep(uLW*.35,uLW*.35+1.,d2))*lm*(1.-smoothstep(.3,.8,gl2))*smoothstep(.012,.035,gl2);
  col=mix(col,uHi,lace*.9);
  /* the edge of the paint: crisp, with a dark rim */
  vec2 ga=vec2(gx.z,gy.z); float gla=max(length(ga),1e-5);
  float da=(c.z-.5)/gla;
  float cov=smoothstep(-.8,.8,da);
  float rim=1.-smoothstep(uLW*.55,uLW*.55+1.2,abs(da-uLW*.6));
  col=mix(col,uInk,rim*.9);
  return vec4(col,max(cov,rim*.9));
}
`;

/* ---- back: the room (camera -> black) with the paint behind the person ---- */
const FS_BACK = `#version 300 es
${COMMON}
${PAINT}
in vec2 vUv; out vec4 o;
uniform sampler2D uVid;
uniform vec2 uVA, uVB, uC; uniform float uAsp, uR, uGbg, uGp;
uniform vec3 uBg, uGlow;
void main(){
  vec2 s=vec2(vUv.x,1.-vUv.y), q=vec2(s.x*uAsp,s.y);
  vec3 cam=texture(uVid,s*uVA+uVB).rgb;
  float r=length(q-uC)/uR;
  vec3 bg=uBg+uGlow*exp(-r*r*.09)*.45;
  vec3 col=mix(cam,mix(cam*.35,bg,smoothstep(.2,.9,uGbg)),smoothstep(0.,.35,uGbg));
  vec4 p=paintCol(s);
  col=mix(col,p.rgb,p.a*uGp);
  o=vec4(col,1.);
}`;

/* ---- front: the person (pale face, dark clothes, paint hair, veil) ---- */
const FS_FRONT = `#version 300 es
${COMMON}
${VEIL}
${PAINT}
in vec2 vUv; out vec4 o;
uniform sampler2D uVid, uMask;
uniform vec2 uVA, uVB, uVTx, uC; uniform float uAsp, uGs, uGp, uPhoto, uR;
uniform vec3 uFL, uFM, uFSh, uFI, uTA, uTB, uDA, uDB, uDC;
uniform vec4 uTh;   // face thresholds T0 T1 T2, clothes split
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
  vec2 s=vec2(vUv.x,1.-vUv.y), q=vec2(s.x*uAsp,s.y);
  vec2 vv=s*uVA+uVB;
  vec4 m=(vv.x>0.&&vv.x<1.&&vv.y>0.&&vv.y<1.)?texture(uMask,vv):vec4(0.);
  float person=smoothstep(.38,.62,m.r+m.g+m.b+m.a);
  if(person<.004){o=vec4(0.);return;}
  m=m*m*m; m/=max(m.r+m.g+m.b+m.a,1e-4);   /* sharpen which class a pixel belongs to */
  vec3 cam=texture(uVid,vv).rgb;
  if(uGs<.002){o=vec4(cam*person,person);return;}
  vec2 t1=uVTx*1.2, t3=uVTx*3.6;
  float l0=lum(cam);
  float b1=.5*l0+.125*(lum(texture(uVid,vv+vec2(t1.x,0.)).rgb)+lum(texture(uVid,vv-vec2(t1.x,0.)).rgb)+lum(texture(uVid,vv+vec2(0.,t1.y)).rgb)+lum(texture(uVid,vv-vec2(0.,t1.y)).rgb));
  float b2=0.;
  for(int k=0;k<8;k++){float a=float(k)*.7854+.39; b2+=lum(texture(uVid,vv+vec2(cos(a),sin(a))*t3).rgb);}
  b2*=.125;
  float dog=b1-b2;
  float line=smoothstep(.016,.05,-dog);
  /* pale paper skin */
  vec3 tint=mix(uTA,uTB,smoothstep(-.7,.7,dot(q-uFF.xy,uFF.zw)/max(uFS.x,1e-3)));
  vec3 cl=uFL, cm=mix(uFM,tint,.2), cs=mix(uFSh,tint,.42);
  vec3 pale=mix(cs,cm,smoothstep(uTh.y-.012,uTh.y+.012,b1));
  pale=mix(pale,cl,smoothstep(uTh.z-.012,uTh.z+.012,b1));
  float ink=max(1.-smoothstep(uTh.x-.01,uTh.x+.01,b1),line);
  pale=mix(pale,uFI,ink);
  /* dark clothes */
  vec3 dark=mix(uDA,uDB,smoothstep(uTh.w-.03,uTh.w+.03,b1));
  dark=mix(dark,uDC,smoothstep(uTh.w+.18,uTh.w+.26,b1));
  dark=mix(dark,uDA*.6,line*.7);
  /* hair: the paint, or dark ink where none has arrived yet */
  float veil=m.g*veilShape(q);
  vec4 p=(m.r>.01||veil>.01)?paintCol(s):vec4(0.);
  vec3 hb=mix(uDA,uDB,smoothstep(.25,.6,b1));
  vec3 hair=mix(hb,p.rgb,p.a*uGp);
  float ws=m.g+m.b, wc=m.a, wh=m.r, sum=max(ws+wc+wh,1e-4);
  vec3 skin=mix(pale,cam,uPhoto);
  vec3 styl=(skin*ws+dark*wc+hair*wh)/sum;
  float rr=length(q-uC)/uR;
  float k=max(clamp(uGs*6.-rr*.9+.7*gn(q*7.),0.,1.),smoothstep(.85,1.,uGs));
  vec3 col=mix(cam,styl,k);
  col=mix(col,p.rgb,veil*p.a*uGp);
  o=vec4(col*person,person);
}`;

/* ---- powder, droplets and drips: each one moves on a closed-form path from where it was born ---- */
const VS_PART = `#version 300 es
precision highp float;

  f1(P, 'uFadeA', act ? 0.12 / flowAmt : 0.9); f1(P, 'uFadeB', 0.9 / flowAmt);

  const B = BUF16; B.fill(0);
  bursts.forEach((b, k) => { B[k * 4] = b.x; B[k * 4 + 1] = b.y; B[k * 4 + 2] = T - b.t; B[k * 4 + 3] = T - b.t < 3 ? b.s : 0; });

function draw(paint) {
  const p = pal(), G = easeIO(S.G);

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texVid);

  let P = PR.back; gl.useProgram(P.p); gl.disable(gl.BLEND);
  i1(P, 'uPaint', 0); i1(P, 'uVid', 2); setPaintUniforms(P, p); videoMapUniforms(P);
  f1(P, 'uAsp', W / H); f2(P, 'uC', FG.C[0] / H, FG.C[1] / H); f1(P, 'uR', Math.max(0.05, FG.Hf / H * 0.62));
  f1(P, 'uGbg', vw ? G : 1); f1(P, 'uGp', Gp); f3(P, 'uBg', hex(p.bg)); f3(P, 'uGlow', hex(p.glow));

    P = PR.front; gl.useProgram(P.p); gl.bindVertexArray(emptyVAO);
    i1(P, 'uPaint', 0); i1(P, 'uMask', 1); i1(P, 'uVid', 2); setPaintUniforms(P, p); videoMapUniforms(P); setVeilUniforms(P);
    f2(P, 'uVTx', 1 / vw, 1 / vh); f1(P, 'uAsp', W / H); f2(P, 'uC', FG.C[0] / H, FG.C[1] / H); f1(P, 'uR', Math.max(0.05, FG.Hf / H * 0.62)); f1(P, 'uGs', G); f1(P, 'uGp', Gp); f1(P, 'uPhoto', photoFace ? 1 : 0);
    const F = p.face; f3(P, 'uFL', hex(F.l)); f3(P, 'uFM', hex(F.m)); f3(P, 'uFSh', hex(F.s)); f3(P, 'uFI', hex(F.i));
    f3(P, 'uTA', hex(p.tint[0])); f3(P, 'uTB', hex(p.tint[1]));
    f3(P, 'uDA', hex(p.body[0])); f3(P, 'uDB', hex(p.body[1])); f3(P, 'uDC', hex(p.body[2]));

  f2(P, 'uRC', FG.C[0] / H, FG.C[1] / H); f1(P, 'uAsp', W / H); f1(P, 'uRR', FG.Hf / H * 0.72);
  f1(P, 'uRP', clamp(S.charge / HOLD, 0, 1)); f1(P, 'uRA', ringA); f1(P, 'uFlash', S.flash * 0.6);
  f1(P, 'uVig', p.mono ? 0 : G * 0.55); f1(P, 'uPx', 1 / (H * DPR)); f3v(P, 'uPal', p.bandsF); i1(P, 'uPN', p.bands.length);

function drawParts(layer) {
  const P = PR.part; gl.useProgram(P.p); gl.bindVertexArray(partVAO);
  if (pHi >= pLo) {
    gl.bindBuffer(gl.ARRAY_BUFFER, partBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, pLo * PST * 4, pData, pLo * PST, (pHi - pLo + 1) * PST);
    pLo = PMAX; pHi = -1;
  }
  f1(P, 'uT', T); f1(P, 'uAsp', W / H); f1(P, 'uPx', 1 / (H * DPR)); i1(P, 'uLayer', layer);

}

/* ---------- loop ---------- */
let vidFrames = 0, lastUpVT = -1;
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000; let dt = now - lastT; lastT = now; dt = clamp(dt, 0, 0.05);
  if (!running || !PR) return;
  if (TEST.freeze) dt = 0; else if (TEST.dt) { dt = TEST.dt; T += dt; } else T = now - T0;
  TEST.frames++;
  updateVideoMap();
  if (vw && video.readyState >= 2 && video.currentTime !== lastUpVT) {
    lastUpVT = video.currentTime;
    gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); vidFrames++; } catch (e) {}
  }
  detectFace(nowMs);
  runMasks(nowMs);
  updateState(dt, nowMs);
  if (S.mode === 'active' && S.G > 0.3) { fling(dt); if (S.G > 0.7) drips(dt); }
  const paint = simStep(dt);
  draw(paint);
  if (shotReq) { shotReq = false; saveShot(); }
  adapt(now);
}
/* if the device cannot keep up, draw the screen at a lower resolution (the paint keeps its own size) */
let adN = 0, adAcc = 0, adPrev = 0, adSince = 0;
function adapt(now) {
  if (TEST.dt || !faceLM) { adPrev = now; return; }
  if (!adSince) adSince = now;
  const ft = now - adPrev; adPrev = now;
  if (now - adSince < 5 || ft > 0.25) return;
  adAcc += ft; adN++;
  if (adN >= 90) {
    const avg = adAcc / adN; adAcc = 0; adN = 0;
    if (avg > 0.04 && DPR > 0.8) { DPR = Math.max(0.8, DPR * 0.85); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
  }
}

/* ---------- UI ---------- */
let toastTimer = 0;
function toast(s) { toastEl.textContent = s; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1300); }
function nextPalette() { palIdx = (palIdx + 1) % PALS.length; toast(pal().name); if (running && hasFace) splash(FG.C[0] / H, FG.C[1] / H - FG.Hf / H * 0.75); }
function resetAll() {
  S.mode = 'idle'; S.charge = 0; S.G = 0; S.away = 0; S.flash = 0; S.veilT = 0; S.mouth = false; S.splashVis = 0;
  bursts.length = 0; pData.fill(0); pLo = 0; pHi = PMAX - 1;
  if (paintA) { for (const t of [paintA, paintB]) { gl.bindFramebuffer(gl.FRAMEBUFFER, t.f); gl.clearColor(ENC ? .5 : 0, ENC ? .5 : 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); } gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
  holdOff = performance.now() + 900; tipUntil = 0;
  toast('最初から');
}
function forceToggle() { if (S.mode === 'active') { deactivate(); holdOff = performance.now() + 1500; } else { if (!hasFace) demoFace(); activate(); S.forced = true; } syncNow(); }
function syncNow() { $('bNow').textContent = S.mode === 'active' ? 'もどす' : '今すぐはじける'; }
function saveShot() {
  try {
    cv.toBlob(b => {
      if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'psyche-mirror-2_' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    }, 'image/png');
    toast('保存しました');
  } catch (e) { toast('保存できませんでした'); }
}
let mr = null, chunks = [];
$('rec').onclick = () => {
  const b = $('rec');
  if (mr && mr.state === 'recording') { mr.stop(); return; }
  AE.init();
  const tracks = [...cv.captureStream(30).getVideoTracks()];
  if (AE.recDest) tracks.push(...AE.recDest.stream.getAudioTracks());
  const ms = new MediaStream(tracks);
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const mt = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  try { mr = new MediaRecorder(ms, mt ? { mimeType: mt, videoBitsPerSecond: 6e6 } : {}); }
  catch (err) { toast('録画を開始できませんでした'); return; }
  chunks = []; mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  mr.onstop = () => {
    b.classList.remove('act'); b.textContent = '● REC';
    const blob = new Blob(chunks, { type: mr.mimeType || 'video/mp4' }); const ext = (mr.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'psyche-mirror-2_' + Date.now() + '.' + ext;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  };
  mr.start(1000); b.classList.add('act'); b.textContent = '■ STOP';
};
$('shot').onclick = () => { shotReq = true; };
$('pal').onclick = () => nextPalette();
const panel = $('panel');
$('gear').onclick = () => { panel.hidden = !panel.hidden; $('gear').setAttribute('aria-expanded', String(!panel.hidden)); };
$('panelX').onclick = () => { panel.hidden = true; $('gear').setAttribute('aria-expanded', 'false'); };
$('sFlow').oninput = e => { flowAmt = +e.target.value; };
$('sVeil').oninput = e => { veilAmt = +e.target.value; };
$('sSwirl').oninput = e => { swirlAmt = +e.target.value; };
$('bNow').onclick = () => forceToggle();
$('bReset').onclick = () => { resetAll(); syncNow(); };
const tog = (id, on, a, b) => { const el = $(id); el.classList.toggle('on', on); el.textContent = on ? a : b; };
$('bFace').onclick = () => { photoFace = !photoFace; tog('bFace', !photoFace, '顔：白い紙', '顔：そのまま'); };
$('bSound').onclick = () => { soundOn = !soundOn; tog('bSound', soundOn, '音：入', '音：切'); if (soundOn) AE.init(); AE.level(S.G); };
const fsBtn = $('bFs');
if (!document.documentElement.requestFullscreen) fsBtn.style.display = 'none';
else fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
cv.addEventListener('pointerdown', e => {
  if (!running) return;
  if (!panel.hidden) { panel.hidden = true; $('gear').setAttribute('aria-expanded', 'false'); }
  splash(e.clientX / H, e.clientY / H);
});
addEventListener('keydown', e => {
  if (!running) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); forceToggle(); }
  else if (k === 'c') nextPalette();
  else if (k === 's') shotReq = true;
  else if (k === 'r') { resetAll(); syncNow(); }
  else if (k === 'b' && S.mode === 'active') { S.lastBoom = T; bigBurst(FG.C[0] / H, FG.C[1] / H, 0.9); AE.boom(0.9); }
});
addEventListener('resize', resize);

function camErrText(e) {
  const m = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  return 'カメラを起動できませんでした：' + m + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
async function startCam() {

  /* get the new stream first, so a failed flip keeps the old camera running */
  const s2 = await md.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s2; video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  await new Promise(r => { if (video.videoWidth) r(); else { video.onloadedmetadata = () => r(); setTimeout(r, 3000); } });

  maskF.fill(0); maskU8.fill(0); hairN = 0;
}
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); toast(facing === 'user' ? '前のカメラ' : '後ろのカメラ'); }
  catch (e) { facing = prev; toast('切り替えられませんでした'); console.warn(camErrText(e)); }
};
$('go').onclick = async () => {
  const btn = $('go'); btn.disabled = true; $('err').textContent = 'カメラを起動しています…';
  AE.init();
  try { if (!PR) initGL(); resize(); }
  catch (e) { $('err').textContent = '描画の準備に失敗しました：' + (e && e.message ? e.message.split('\n')[0] : e); console.error(e); btn.disabled = false; return; }
  try { await startCam(); }
  catch (e) { $('err').textContent = camErrText(e); btn.disabled = false; btn.textContent = 'もう一度'; return; }
  $('start').classList.add('hide'); $('ui').classList.add('on'); $('err').textContent = '';
  running = true; T0 = performance.now() / 1000; T = 0;

requestAnimationFrame(frame);
/* test hook (local checks only) */
window.__pm2 = {
