<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TOUSEN ─ 金屏風の前の投扇興</title>
<meta name="description" content="つまんだ指のあいだに扇がある。腕を振って指をひらいた瞬間の速さと向きで扇は飛ぶ。扇は板なので、まっすぐは飛ばずに舞い、翻り、落ちる。枕の上の蝶を落とし、扇と蝶と枕がどう納まったかで銘がつく。十投一番。">
<meta name="theme-color" content="#c9a24a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  TOUSEN ─ 金屏風の前の投扇興                        ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   金地   kinji    #c9a24a  the ground. Gold LEAF, not gold light —
                                     it is opaque, slightly dirty, and it
                                     does not glow. Every tile is laid at a
                                     marginally different tone so the seams
                                     between leaves stay visible.
            洗朱   araishu  #b8442c  the fan's paper and the vermillion of
                                     the seal. The only saturated colour in
                                     the piece and it is spent on exactly two
                                     objects, so the eye always knows where
                                     the action is.
            濃墨   koboku   #221d16  ink. Every line, every glyph, the ribs
                                     of the fan, the traced hand. Near-black
                                     but warm — there is no cold pixel here.
            生成   kinari   #f0e4c8  the butterfly's wings and the paper of
                                     the certificate. Unbleached, so it sits
                                     on gold without shouting.
            松葉   matsuba  #5d6b3a  the tatami. A dull olive green; the only
                                     cool-ish note, and it is kept to the
                                     bottom fifth of the screen.
            MOOD: a gold folding screen in a bright zashiki at midday. Warm,
            heavy, expensive, and completely still until the fan is loosed.
            Nothing in this piece glows, blurs or bloom-flares.
  BACKGROUND  Real 金屏風 construction: a grid of gold-leaf squares, each
            with its own tone jitter and a visible overlap seam, dusted with
            砂子 (gold flake). The bottom fifth is 畳 — woven, with a 縁 braid
            along its top edge. Painted ONCE into an offscreen canvas at
            every resize; the per-frame cost is a single drawImage.
  TYPE      Shippori Mincho throughout, and nothing else. 800 weight for the
            銘, 500 for the ledger. Latin is set in the same mincho at small
            size with heavy letter-spacing, so it reads as a stamp and not as
            a UI. There is no sans-serif anywhere in this file.
  MOTION    Noh timing. Anticipation is LONG (the held fan breathes and
            trembles; the aim arc grows), the release is INSTANT (one frame),
            and the follow-through is the longest part of all — the fan
            tumbles for a second and a half before it settles, and only then,
            after a deliberate half-second of nothing at all, does the seal
            fall. Every tween is eased; the seal is the one elastic move in
            the piece and it overshoots exactly once.
  SIGNATURE THE TUMBLING FAN. The fan is integrated as a real flat plate:
            the airflow is split into components normal and tangential to the
            blade, the normal component is punished ~20× harder than the
            tangential one, and the offset between the centre of pressure and
            the centre of mass feeds a pitching moment. Nobody wrote a
            "flutter" animation — the leaf-like翻り falls out of those three
            lines, which is why the fan curves differently on every throw and
            why a hard flat throw knifes through while a lofted one stalls,
            broadsides, and drifts. The second signature is the 銘: each throw
            is judged on the FINAL ARRANGEMENT of fan, butterfly and pillow —
            never on aim — and stamped in vermillion down the right edge, so
            the screen slowly fills with the record of the bout.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#c9a24a; }
  body{
    font-family:"Shippori Mincho", serif;
    color:#221d16;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  #view{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #video{ position:fixed; width:2px; height:2px; opacity:0.01; pointer-events:none; left:-10px; top:-10px; }

  #flip{
    position:fixed; right:12px; top:12px; z-index:30;
    font-family:inherit; font-size:13px; font-weight:600; letter-spacing:.14em;
    color:#f0e4c8; background:rgba(34,29,22,.82);
    border:1px solid rgba(240,228,200,.45); border-radius:2px;
    padding:8px 12px; cursor:pointer;
    transition:background .18s cubic-bezier(.2,.7,.3,1);
  }
  #flip:active{ background:rgba(34,29,22,.96); }

  #err{
    display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:60; max-width:min(86vw,460px); white-space:pre-wrap;
    background:#221d16; color:#f0e4c8; border:1px solid #b8442c;
    padding:18px 20px; font-size:14px; line-height:1.85; letter-spacing:.03em;
  }

  /* ── start sheet ─────────────────────────────────────────────── */
  #sheet{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:max(16px,env(safe-area-inset-left)) 16px;
    background:#c9a24a;
    transition:opacity .34s cubic-bezier(.4,0,.2,1);
  }
  #sheet.gone{ opacity:0; pointer-events:none; }
  #sheet .card{
    width:min(560px,100%); max-height:94vh; overflow-y:auto;
    background:#f0e4c8;
    border:1px solid #221d16;
    box-shadow:10px 10px 0 rgba(34,29,22,.22);
    padding:26px 24px 24px;
  }
  #sheet .cap{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10.5px; letter-spacing:.34em; font-weight:600;
    color:#8a6a2e; border-bottom:1px solid rgba(34,29,22,.3);
    padding-bottom:9px; margin-bottom:18px;
  }
  #sheet .cap b{ color:#b8442c; font-weight:700; }
  #sheet h1{
    margin:0 0 4px; font-size:clamp(27px,7.4vw,40px); font-weight:800;
    letter-spacing:.1em; line-height:1.24;
  }
  #sheet .sub{
    margin:0 0 16px; font-size:11px; letter-spacing:.4em;
    color:#8a6a2e; font-weight:600;
  }
  #sheet p.lead{
    margin:0 0 16px; font-size:14.5px; line-height:2.0; letter-spacing:.035em;
  }
  #sheet p.lead em{ font-style:normal; color:#b8442c; font-weight:700; }
  #demo{
    display:block; width:100%; height:auto; aspect-ratio:640/188;
    border:1px solid rgba(34,29,22,.34); background:#c9a24a; margin-bottom:16px;
  }
  #sheet .spec{
    font-size:12.5px; line-height:2.0; letter-spacing:.03em;
    border-top:1px solid rgba(34,29,22,.22); padding-top:13px; margin-bottom:20px;
  }
  #sheet .spec span{
    display:inline-block; min-width:5.4em; color:#b8442c; font-weight:700;
  }
  #go{
    display:block; width:100%; font-family:inherit;
    font-size:19px; font-weight:800; letter-spacing:.5em; text-indent:.5em;
    color:#f0e4c8; background:#b8442c; border:none; border-radius:0;
    padding:15px 0; cursor:pointer;
    transition:transform .16s cubic-bezier(.2,.7,.3,1), background .16s linear;
  }
  #go:active{ transform:scale(.985); background:#9d3823; }

  /* ── end sheet ───────────────────────────────────────────────── */
  #endsheet{
    position:fixed; inset:0; z-index:45; display:none;
    align-items:center; justify-content:center; padding:16px;
    background:rgba(201,162,74,.9);
    opacity:0; transition:opacity .4s cubic-bezier(.4,0,.2,1);
  }
  #endsheet.on{ display:flex; opacity:1; }
  #endsheet .card{
    width:min(430px,100%); background:#f0e4c8; border:1px solid #221d16;
    box-shadow:10px 10px 0 rgba(34,29,22,.22); padding:28px 26px;
    text-align:center;
    transform:translateY(14px) scale(.97);
    transition:transform .44s cubic-bezier(.22,1.2,.36,1);
  }
  #endsheet.on .card{ transform:none; }
  #endsheet .k{ font-size:10.5px; letter-spacing:.42em; color:#8a6a2e; font-weight:600; }
  #endsheet .rank{
    font-size:clamp(38px,12vw,58px); font-weight:800; letter-spacing:.16em;
    margin:12px 0 4px; color:#b8442c;
  }
  #endsheet .tot{ font-size:15px; letter-spacing:.14em; margin-bottom:6px; }
  #endsheet .tot b{ font-size:30px; font-weight:800; letter-spacing:.02em; }
  #endsheet .best{ font-size:11.5px; letter-spacing:.2em; color:#8a6a2e; margin-bottom:20px; }
  #again{
    font-family:inherit; font-size:16px; font-weight:800; letter-spacing:.42em;
    text-indent:.42em; color:#f0e4c8; background:#221d16; border:none;
    padding:13px 30px; cursor:pointer;
    transition:transform .16s cubic-bezier(.2,.7,.3,1);
  }
  #again:active{ transform:scale(.97); }

  @media (max-width:420px){
    #sheet .card{ padding:20px 17px 18px; }
    #sheet p.lead{ font-size:13.5px; line-height:1.95; }
  }
</style>

<body>

<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="err"></div>

<div id="sheet">
  <div class="card">
    <div class="cap"><span>OTO-II ／ 投扇興</span><span>FLAT&nbsp;PLATE <b>AERODYNAMICS</b></span></div>
    <h1>金屏風の前の<br>投扇興</h1>
    <div class="sub">TOUSEN</div>
    <p class="lead">
      親指と人差し指を<em>つまむ</em>と、そこに扇があります。<br>
      腕を振り、指を<em>ひらいた瞬間</em>の速さと向きで扇は飛びます。<br>
      扇は板なので、まっすぐには飛びません。<em>舞って、翻って</em>落ちます。
    </p>
    <canvas id="demo" width="640" height="188"></canvas>
    <div class="spec">
      <span>ねらい</span>枕の上の蝶を落とす<br>
      <span>点</span>扇と蝶と枕の<em>納まりかた</em>で銘がつく<br>
      <span>ゆるく放つと</span>投げたことになりません。振り抜いてください<br>
      <span>一番</span>十投
    </div>
    <button id="go">は じ め</button>
  </div>
</div>

<div id="endsheet">
  <div class="card">
    <div class="k">十投 満尾</div>
    <div class="rank" id="eRank">—</div>
    <div class="tot">合計 <b id="eTot">0</b> 点</div>
    <div class="best" id="eBest"></div>
    <button id="again">も う 一 番</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  TOUSEN ─ 金屏風の前の投扇興
//
//  The fan is not animated.  It is integrated as a rigid flat plate in a
//  quasi-steady flow:  the relative wind is resolved into a component
//  NORMAL to the blade and one TANGENTIAL to it, the normal one is
//  penalised ~20x harder (a fan presents all of itself to the wind one way
//  and none of itself the other), and the resulting pressure acts ahead of
//  the centre of mass, which feeds a pitching moment.  Everything that
//  looks like choreography — the stall, the broadside slap, the leaf-fall
//  翻り — is those three terms and nothing else.
//
//  The score never looks at your aim.  It looks at where the three objects
//  came to rest, exactly as the parlour game does.
// ═══════════════════════════════════════════════════════════════════════

var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function easeOut(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function nowS(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v,d){ return (typeof v==='number'&&isFinite(v))?v:d; }

// deterministic hash noise — the leaf tones must not shimmer between frames
function h2(x,y){
  var n=Math.sin(x*127.1+y*311.7)*43758.5453;
  return n-Math.floor(n);
}

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var sheet=document.getElementById('sheet');
var goBtn=document.getElementById('go');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv.getContext('2d');
var endSheet=document.getElementById('endsheet');
var eRank=document.getElementById('eRank');
var eTot=document.getElementById('eTot');
var eBest=document.getElementById('eBest');
var againBtn=document.getElementById('again');

// ═══════════════════════════════════════════════════════════════════════
//  METRICS.  Everything in the simulation is expressed in SCREEN UNITS
//  where 1.0 = min(W,H).  That is what makes the bout play identically on
//  a phone held upright and on a laptop turned sideways: the pillow is
//  always the same fraction of the short edge away, and gravity is always
//  the same fraction of the short edge per second squared.
// ═══════════════════════════════════════════════════════════════════════
var W=0,H=0,DPR=1,MN=1;
var floorY=0, pillowX=0, pillowW=0, pillowH=0, pillowTop=0;
var LAND=false;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(240,window.innerWidth); H=Math.max(320,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.min(W,H);
  LAND=(W>=H);
  floorY=H*(LAND?0.80:0.795);
  pillowW=MN*0.105; pillowH=MN*0.082;
  // The pillow is anchored a fixed number of SHORT EDGES right of centre,
  // never a fraction of the width.  Gravity and the fan are sized off the
  // short edge, so pinning the target to the width would mean a laptop
  // needed a throw twice as strong as a phone for the identical gesture.
  // This way the gap is ~0.30 of the short edge in every layout.
  pillowX=clamp(W*0.5+MN*0.27, W*0.56, W*0.86);
  pillowTop=floorY-pillowH;
  screenCache=null;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// px <-> normalised unit
function ux(u){ return u*MN; }

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user'); camOK=true;
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
var camOK=false;
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHand();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  HAND.  One hand.  We need four things from it and nothing else:
//  where it is, how big it is on screen (so the pinch test is scale free),
//  whether it is pinching, and how fast it has been moving over the last
//  ~130ms.  The velocity comes from a ring buffer rather than a per-frame
//  difference because a single-frame difference at 30fps IS the jitter.
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var HAND={
  on:false, t:-1e9,
  x:0.32, y:0.62,       // screen px
  span:0.13,            // wrist->middle-mcp, aspect-corrected camera units
  pinch:1,              // tip separation / hand span, aspect-corrected
  npts:null,            // 21 landmarks in aspect-corrected camera space
  held:false,           // is the fan gripped
  pts:null,             // 21 landmarks in screen px
  vx:0, vy:0            // px/s over the sample window
};
var TRAIL=[];           // {t,x,y}
var TRAIL_WIN=0.13;
var LOST_S=0.30;

function loseHand(){
  HAND.on=false; HAND.pts=null; HAND.npts=null;
  HAND.vx=0; HAND.vy=0;
  TRAIL.length=0;
  // a lost hand must never look like a throw on reacquisition
  if (HAND.held && phase==='aim'){ HAND.held=false; dropHeld(); }
  HAND.held=false;
}

function lmOK(L,i){
  if (!L || L.length<21) return false;
  var p=L[i];
  return !!p && typeof p.x==='number' && typeof p.y==='number' &&
         isFinite(p.x) && isFinite(p.y);
}

// The camera's normalised space is anisotropic against the screen: x is a
// fraction of the FRAME width and y a fraction of the FRAME height, and the
// screen those get stretched onto has its own, different aspect.  Measuring
// the pinch in screen pixels therefore makes the same physical gesture read
// up to twice as open horizontally as vertically on a portrait phone, which
// would make the grip a coin toss.  So: drawing uses screen pixels, and
// every RATIO is measured in an aspect-corrected space instead.
function camAspect(){
  var a=1.3333;
  if (video && video.videoWidth>0 && video.videoHeight>0) a=video.videoWidth/video.videoHeight;
  if (!isFinite(a)||a<0.2||a>5) a=1.3333;
  return a;
}

function onHands(res){
  var L=(res&&res.multiHandLandmarks&&res.multiHandLandmarks.length)?res.multiHandLandmarks[0]:null;
  var need=[0,4,5,8,9,12,13,16,17,20,2,6,10,14,18,1,3,7,11,15,19];
  if (L){
    for (var k=0;k<need.length;k++){ if (!lmOK(L,need[k])){ L=null; break; } }
  }
  if (!L){ return; }

  var t=nowS();
  var pts=HAND.pts;
  if (!pts || pts.length!==21){ pts=new Array(21); for (var q=0;q<21;q++) pts[q]={x:0,y:0}; }
  var npts=HAND.npts;
  if (!npts || npts.length!==21){ npts=new Array(21); for (var q2=0;q2<21;q2++) npts[q2]={x:0,y:0}; }
  var AS=camAspect();
  for (var i=0;i<21;i++){
    var nx=mirror ? (1-L[i].x) : L[i].x;
    nx=clamp(nx,-0.4,1.4);
    var ny=clamp(L[i].y,-0.4,1.4);
    pts[i].x=nx*W;  pts[i].y=ny*H;
    npts[i].x=nx*AS; npts[i].y=ny;
  }
  HAND.pts=pts; HAND.npts=npts;

  var cx=(pts[0].x+pts[9].x)*0.5, cy=(pts[0].y+pts[9].y)*0.5;
  var span=Math.hypot(npts[9].x-npts[0].x, npts[9].y-npts[0].y);
  if (!isFinite(span)||span<0.02) span=0.02;
  HAND.span=span;

  var d=Math.hypot(npts[4].x-npts[8].x, npts[4].y-npts[8].y);
  HAND.pinch=clamp(d/span,0,4);

  // the grip point is between the two fingertips — that is where the fan is
  var gx=(pts[4].x+pts[8].x)*0.5, gy=(pts[4].y+pts[8].y)*0.5;
  gx=lerp(cx,gx,0.72); gy=lerp(cy,gy,0.72);

  if (!HAND.on){ TRAIL.length=0; }
  HAND.x=gx; HAND.y=gy; HAND.on=true; HAND.t=t;

  TRAIL.push({t:t,x:gx,y:gy});
  while (TRAIL.length>2 && t-TRAIL[0].t>TRAIL_WIN*1.9) TRAIL.shift();
  if (TRAIL.length>40) TRAIL.shift();

  // window velocity: oldest sample still inside the window
  var v0=null;
  for (var j=0;j<TRAIL.length;j++){ if (t-TRAIL[j].t<=TRAIL_WIN){ v0=TRAIL[j]; break; } }
  if (!v0) v0=TRAIL[0];
  var dt=t-v0.t;
  if (dt>0.028){
    HAND.vx=(gx-v0.x)/dt; HAND.vy=(gy-v0.y)/dt;
  } else if (TRAIL.length<3){
    HAND.vx=0; HAND.vy=0;
  }
  if (!isFinite(HAND.vx)) HAND.vx=0;
  if (!isFinite(HAND.vy)) HAND.vy=0;
}

function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:1, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.55 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ SOUND DESIGN: struck wood and filtered noise.
//
//  There is no oscillator drone in this piece and no reverb tail longer
//  than a zashiki.  Four voices, chosen so their ATTACKS cannot be
//  confused with one another even when three land inside 200ms:
//
//    拍子木  a 3.2kHz high-Q bandpass burst over a 1ms noise click.
//            Bright, dry, ~55ms.  This is the hit.
//    鈴      a 3:1 FM bell (carrier 1180Hz, modulator 3540Hz) with an
//            8ms attack and a 1.4s exponential tail.  Ringing, pitched.
//            This is the butterfly leaving the pillow.
//    畳      a 74Hz sine dropped a fifth in 90ms under a lowpassed noise
//            thump.  Blunt, no pitch to speak of.  This is landing.
//    風切り  continuous pink-ish noise through a bandpass whose centre
//            frequency and gain both track the fan's airspeed.  It is the
//            only sustained sound in the piece and it exists so the flight
//            has a shape you can hear stall.
//
//  Everything meets at one compressor so five overlapping events duck
//  rather than clip.
// ═══════════════════════════════════════════════════════════════════════
var AC=null, comp=null, master=null, audioOK=false;
var noiseBuf=null, windSrc=null, windBp=null, windGain=null;

function makeNoise(){
  var n=Math.floor(AC.sampleRate*2);
  if (n<1) n=1;
  var b=AC.createBuffer(1,n,AC.sampleRate);
  var d=b.getChannelData(0);
  var b0=0,b1=0,b2=0;
  for (var i=0;i<n;i++){
    var wnoise=Math.random()*2-1;
    b0=0.99765*b0+wnoise*0.0990460;
    b1=0.96300*b1+wnoise*0.2965164;
    b2=0.57000*b2+wnoise*1.0526913;
    d[i]=clamp((b0+b1+b2+wnoise*0.1848)*0.22,-1,1);
  }
  return b;
}

function initAudio(){
  if (AC){ if (AC.state==='suspended'&&AC.resume){ try{AC.resume();}catch(e){} } return true; }
  var C=window.AudioContext||window.webkitAudioContext;
  if (!C) return false;
  try{ AC=new C(); }catch(e){ AC=null; return false; }
  if (AC.state==='suspended'&&AC.resume){ try{AC.resume();}catch(e){} }
  try{
    comp=AC.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=5;
    comp.attack.value=0.004; comp.release.value=0.22;
    master=AC.createGain(); master.gain.value=0.72;
    comp.connect(master); master.connect(AC.destination);

    noiseBuf=makeNoise();

    windBp=AC.createBiquadFilter();
    windBp.type='bandpass'; windBp.frequency.value=700; windBp.Q.value=1.1;
    windGain=AC.createGain(); windGain.gain.value=0.0001;
    windSrc=AC.createBufferSource();
    windSrc.buffer=noiseBuf; windSrc.loop=true;
    windSrc.connect(windBp); windBp.connect(windGain); windGain.connect(comp);
    try{ windSrc.start(); }catch(e){}
    audioOK=true;
  }catch(e){ audioOK=false; }
  return audioOK;
}

function noiseVoice(){
  var s=AC.createBufferSource();
  s.buffer=noiseBuf; s.loop=true;
  var off=Math.random()*1.0;
  try{ s.start(AC.currentTime, off); }catch(e){ try{ s.start(); }catch(e2){} }
  return s;
}

// 拍子木 — the strike
function sfxClack(vel){
  if (!audioOK) return;
  var t=AC.currentTime, v=clamp(fin(vel,0.6),0.15,1);
  try{
    var s=noiseVoice();
    var bp=AC.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=2400+1500*v; bp.Q.value=7.5;
    var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.62*v,t+0.0022);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.055+0.02*v);
    s.connect(bp); bp.connect(hp); hp.connect(g); g.connect(comp);
    try{ s.stop(t+0.14); }catch(e){}
    // a woody body under the click so it reads as two blocks, not as static
    var o=AC.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(880,t);
    o.frequency.exponentialRampToValueAtTime(540,t+0.05);
    var og=AC.createGain();
    og.gain.setValueAtTime(0.0001,t);
    og.gain.linearRampToValueAtTime(0.2*v,t+0.003);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    o.connect(og); og.connect(comp);
    try{ o.start(t); o.stop(t+0.13); }catch(e){}
  }catch(e){}
}

// 鈴 — FM bell, 3:1
function sfxBell(v){
  if (!audioOK) return;
  var t=AC.currentTime; v=clamp(fin(v,0.7),0.2,1);
  try{
    var car=AC.createOscillator(); car.type='sine'; car.frequency.value=1180;
    var mod=AC.createOscillator(); mod.type='sine'; mod.frequency.value=3540;
    var mg=AC.createGain();
    mg.gain.setValueAtTime(1500*v,t);
    mg.gain.exponentialRampToValueAtTime(20,t+0.55);
    mod.connect(mg); mg.connect(car.frequency);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.3*v,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    car.connect(g); g.connect(comp);
    try{ car.start(t); mod.start(t); car.stop(t+1.5); mod.stop(t+1.5); }catch(e){}
  }catch(e){}
}

// 畳 — the blunt landing
function sfxThud(v){
  if (!audioOK) return;
  var t=AC.currentTime; v=clamp(fin(v,0.5),0.1,1);
  try{
    var o=AC.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(112,t);
    o.frequency.exponentialRampToValueAtTime(52,t+0.09);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.46*v,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
    o.connect(g); g.connect(comp);
    try{ o.start(t); o.stop(t+0.28); }catch(e){}
    var s=noiseVoice();
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.7;
    var ng=AC.createGain();
    ng.gain.setValueAtTime(0.0001,t);
    ng.gain.linearRampToValueAtTime(0.24*v,t+0.004);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
    s.connect(lp); lp.connect(ng); ng.connect(comp);
    try{ s.stop(t+0.2); }catch(e){}
  }catch(e){}
}

// 印 — the seal falling on the screen: a 鼓 'pon'
function sfxSeal(){
  if (!audioOK) return;
  var t=AC.currentTime;
  try{
    var o=AC.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(430,t);
    o.frequency.exponentialRampToValueAtTime(196,t+0.13);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.4,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
    o.connect(g); g.connect(comp);
    try{ o.start(t); o.stop(t+0.46); }catch(e){}
    var s=noiseVoice();
    var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=2.4;
    var ng=AC.createGain();
    ng.gain.setValueAtTime(0.0001,t);
    ng.gain.linearRampToValueAtTime(0.2,t+0.003);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
    s.connect(bp); bp.connect(ng); ng.connect(comp);
    try{ s.stop(t+0.16); }catch(e){}
  }catch(e){}
}

// 風切り — sustained, tracks airspeed
function pushWind(speedU){
  if (!audioOK||!windGain||!windBp) return;
  var s=clamp(fin(speedU,0)/2.6,0,1);
  var g=0.0001+0.3*s*s;
  var f=380+1700*s;
  try{
    windGain.gain.setTargetAtTime(g,AC.currentTime,0.045);
    windBp.frequency.setTargetAtTime(f,AC.currentTime,0.06);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  THE BOUT
// ═══════════════════════════════════════════════════════════════════════
var THROWS=10;
var phase='idle';          // idle | aim | fly | judge | over
var throwNo=0, total=0, best=0;
var log=[];                // {mei, pts}
var running=false, gameOver=false;

// ── fan: a rigid flat plate, mass 1, half-chord L ─────────────────────
var fan={ x:0,y:0,vx:0,vy:0,th:0,w:0, L:1, live:false, rest:false, restT:0, land:false, airT:0 };
// ── butterfly: a disc that can be knocked off the pillow ──────────────
var fly={ x:0,y:0,vx:0,vy:0,r:1, knocked:false, rest:true, restT:0, ph:0, land:false };
// ── pillow ────────────────────────────────────────────────────────────
var pil={ tilt:0, tv:0, toppled:false, hitImp:0 };

var throwT=-1e9, resolved=false;
var judgeT=-1e9, judgeMei='', judgePts=0, judgeSub='';
var shake=0, flash=0;
var parts=[];
var heldWobble=0;
var hintT=-1e9, hintMsg='';

// physics constants — tuned against the headless harness, not by eye
var G_U       = 2.35;      // gravity, screen-units / s^2
var CN        = 2.45;      // normal-axis drag: a fan is all sail this way
var CT        = 0.090;     // tangential drag: and almost nothing this way
var KM        = 3.40;      // pitching moment from the offset centre of pressure
var KD        = 0.045;     // quadratic spin damping — deliberately tiny.  A
                           // tumbling plate in air keeps tumbling; damp this
                           // hard and the whole signature of the piece dies
                           // inside a third of a second.
var KL        = 0.18;      // linear spin damping
var KGW       = 7.0;       // angular damping WHILE TOUCHING something
var KGV       = 2.6;       // linear damping while touching
var KFLAT     = 9.0;       // righting spring: a fan on the mat lies flat
var REST_E    = 0.19;      // restitution
var MU        = 0.52;      // friction
var MIN_FLICK = 0.62;      // screen-units / s.  Below this it is not a throw.
var MAX_FLICK = 2.20;
var PINCH_ON  = 0.42;      // tip separation / hand span
var PINCH_OFF = 0.66;
var REST_V    = 0.030;     // screen-units / s
var REST_W    = 0.60;      // rad / s
var REST_HOLD = 0.20;      // s
var TIMEOUT   = 3.6;       // s — a throw always resolves

function resetBout(){
  throwNo=0; total=0; log.length=0; gameOver=false; resolved=true;
  phase='aim'; parts.length=0;
  fan.live=false; fan.rest=true; fan.land=false;
  placePillow();
  judgeMei=''; judgeT=-1e9;
  hintT=-1e9;
}
function placePillow(){
  pil.tilt=0; pil.tv=0; pil.toppled=false; pil.hitImp=0;
  fly.r=MN*0.023;
  fly.x=pillowX; fly.y=pillowTop-fly.r*0.92;
  fly.vx=0; fly.vy=0; fly.knocked=false; fly.rest=true; fly.restT=0; fly.ph=0; fly.land=false;
  fan.L=MN*0.058;
}
function dropHeld(){
  // the fan slips out of the fingers without a swing: not a throw, no cost
  hint('振り抜いて放ってください');
}
function hint(m){ hintMsg=m; hintT=nowS(); }

function launch(vx,vy){
  fan.L=MN*0.058;
  fan.x=HAND.x; fan.y=HAND.y;
  fan.vx=vx; fan.vy=vy;
  // A fan does NOT leave the hand edge-on to its own velocity.  Released
  // edge-on it would sit at a knife-edge equilibrium — no angle of attack
  // means no normal flow, which means no drag and no pitching moment, and
  // the thing would fly like a dart forever.  It leaves broadside-ish and
  // already turning, which is what starts the tumble.
  var spin=(5.5+Math.random()*5.0)*(Math.random()<0.5?-1:1);
  fan.th=Math.atan2(vy,vx) + (0.62+Math.random()*0.45)*(spin>=0?1:-1);
  fan.w=spin;
  fan.live=true; fan.rest=false; fan.restT=0; fan.land=false; fan.airT=0;
  phase='fly'; throwT=nowS(); resolved=false;
  fly.rest=true; fly.restT=0;
  sfxClack(0.42);
  shake=Math.min(shake+0.22,1);
}

// ── contact of one body point against a half-plane ────────────────────
// n is the OUTWARD surface normal (pointing away from the solid).
function plateContact(px,py,nx,ny,depth){
  var rx=px-fan.x, ry=py-fan.y;
  var I=Math.max(1e-6, fan.L*fan.L/3);
  // positional correction
  fan.x+=nx*depth; fan.y+=ny*depth;
  var vpx=fan.vx - fan.w*ry;
  var vpy=fan.vy + fan.w*rx;
  var vn=vpx*nx+vpy*ny;
  if (vn>=0) return 0;
  var rn=rx*ny-ry*nx;
  var denom=1+(rn*rn)/I;
  var j=-(1+REST_E)*vn/denom;
  fan.vx+=j*nx; fan.vy+=j*ny;
  fan.w+=(rx*(j*ny)-ry*(j*nx))/I;
  // friction along the surface
  var tx=-ny, ty=nx;
  vpx=fan.vx - fan.w*ry; vpy=fan.vy + fan.w*rx;
  var vt=vpx*tx+vpy*ty;
  var rt=rx*ty-ry*tx;
  var dt2=1+(rt*rt)/I;
  var jt=-vt/dt2;
  var lim=MU*Math.abs(j);
  if (jt> lim) jt= lim;
  if (jt<-lim) jt=-lim;
  fan.vx+=jt*tx; fan.vy+=jt*ty;
  fan.w+=(rx*(jt*ty)-ry*(jt*tx))/I;
  return Math.abs(j);
}

function stepFan(dt){
  if (!fan.live) return;
  var sn,st,ct2,st2,nx,ny,tx,ty,vn,vt;
  ct2=Math.cos(fan.th); st2=Math.sin(fan.th);
  tx=ct2; ty=st2; nx=-st2; ny=ct2;
  vn=fan.vx*nx+fan.vy*ny;
  vt=fan.vx*tx+fan.vy*ty;
  sn=vn/MN; st=vt/MN;
  var ax=0, ay=G_U*MN;
  // quadratic drag, resolved on the plate's own axes
  var fnMag=-CN*Math.abs(sn)*sn*MN;
  var ftMag=-CT*Math.abs(st)*st*MN;
  ax+=fnMag*nx+ftMag*tx;
  ay+=fnMag*ny+ftMag*ty;
  fan.vx+=ax*dt; fan.vy+=ay*dt;
  // pitching moment: pressure acts ahead of the centre of mass
  var aw=-KM*sn*st - KD*fan.w*Math.abs(fan.w) - KL*fan.w;
  fan.w+=aw*dt;
  fan.w=clamp(fan.w,-42,42);
  fan.x+=fan.vx*dt; fan.y+=fan.vy*dt;
  fan.th+=fan.w*dt;
  if (!isFinite(fan.x)||!isFinite(fan.y)||!isFinite(fan.th)||!isFinite(fan.w)){
    fan.x=W*0.5; fan.y=floorY-1; fan.vx=0; fan.vy=0; fan.th=0; fan.w=0;
  }

  // ── contacts ──────────────────────────────────────────────────────
  var e=[[fan.x-fan.L*tx, fan.y-fan.L*ty],
         [fan.x+fan.L*tx, fan.y+fan.L*ty],
         [fan.x,fan.y]];
  var maxImp=0, k, touching=false;
  var pl=pillowX-pillowW*0.5, pr=pillowX+pillowW*0.5;
  for (k=0;k<3;k++){
    var px=e[k][0], py=e[k][1];
    if (py>floorY){
      touching=true;
      maxImp=Math.max(maxImp, plateContact(px,py,0,-1,(py-floorY)*0.6));
    }
    if (!pil.toppled && px>pl && px<pr && py>pillowTop && py<floorY){
      touching=true;
      // pick the shallowest exit face
      var dTop=py-pillowTop, dL=px-pl, dR=pr-px;
      if (dTop<=dL && dTop<=dR){
        maxImp=Math.max(maxImp, plateContact(px,py,0,-1,dTop*0.65));
      } else if (dL<dR){
        var im=plateContact(px,py,-1,0,dL*0.65);
        if (im>MN*0.26) pil.hitImp+=im;
        maxImp=Math.max(maxImp,im);
      } else {
        var im2=plateContact(px,py,1,0,dR*0.65);
        if (im2>MN*0.26) pil.hitImp+=im2;
        maxImp=Math.max(maxImp,im2);
      }
    }
  }
  // Resting on something is not the same as flying through air.  Once the
  // blade is in contact the spin bleeds off fast, the slide bleeds off fast,
  // and a spring pulls the blade towards lying flat — which is how a real
  // fan settles on a mat, and what stops the solver ringing for ten seconds.
  if (touching){
    var gd=Math.exp(-KGW*dt);
    fan.w=fan.w*gd - KFLAT*Math.sin(2*fan.th)*dt;
    var vd=Math.exp(-KGV*dt);
    fan.vx*=vd; fan.vy*=vd;
  }
  if (maxImp>MN*0.16 && !fan.land){
    fan.land=true; sfxThud(clamp(maxImp/(MN*0.9),0.15,1));
    shake=Math.min(shake+clamp(maxImp/(MN*1.6),0,0.4),1);
  } else if (maxImp>MN*0.34){
    sfxThud(clamp(maxImp/(MN*1.1),0.12,0.7));
  }
  if (pil.hitImp>MN*0.95 && !pil.toppled){
    pil.toppled=true; pil.tv=(fan.vx>=0?1:-1)*2.6;
    sfxThud(0.9); shake=Math.min(shake+0.4,1);
    if (!fly.knocked) knockFly(fan.vx*0.35, -Math.abs(fan.vy)*0.2-MN*0.3);
  }

  // ── the fan strikes the butterfly ─────────────────────────────────
  if (!fly.knocked){
    var d=segDist(fan.x-fan.L*tx, fan.y-fan.L*ty, fan.x+fan.L*tx, fan.y+fan.L*ty, fly.x, fly.y);
    if (d<fly.r+MN*0.012){
      var sp=Math.hypot(fan.vx,fan.vy);
      if (sp>MN*0.16){
        knockFly(fan.vx*0.44+(Math.random()-0.5)*MN*0.1, Math.min(-MN*0.16, fan.vy*0.4-MN*0.22));
      }
    }
  }

  // "At rest" has to mean SUPPORTED BY SOMETHING, not "low on the screen".
  // A height test cannot tell the apex of an arc (momentarily slow, and in
  // mid-air) from a fan lying still — and it also cannot tell that a fan
  // perched on the PILLOW is at rest, which is exactly the arrangement the
  // two best 銘 in the game are made of.
  fan.airT+=dt;
  if (touching) fan.airT=0;
  var spd=Math.hypot(fan.vx,fan.vy)/MN;
  if (spd<REST_V && Math.abs(fan.w)<REST_W && fan.airT<0.20){
    fan.restT+=dt; if (fan.restT>REST_HOLD) fan.rest=true;
  } else { fan.restT=0; fan.rest=false; }
}

function segDist(x1,y1,x2,y2,px,py){
  var dx=x2-x1, dy=y2-y1;
  var L2=dx*dx+dy*dy;
  var t=L2>1e-9?clamp(((px-x1)*dx+(py-y1)*dy)/L2,0,1):0;
  return Math.hypot(px-(x1+dx*t), py-(y1+dy*t));
}

function knockFly(vx,vy){
  if (fly.knocked) return;
  fly.knocked=true; fly.rest=false; fly.restT=0;
  fly.vx=fin(vx,0); fly.vy=fin(vy,-MN*0.3);
  sfxClack(0.95); sfxBell(0.85);
  shake=Math.min(shake+0.5,1); flash=1;
  burst(fly.x,fly.y,26);
}

function stepFly(dt){
  if (!fly.knocked || fly.rest) return;
  fly.ph+=dt*9;
  fly.vy+=G_U*MN*0.78*dt;
  // 蝶 does not fall like a stone; the wings catch
  var sp=Math.hypot(fly.vx,fly.vy);
  var drag=0.9+sp/MN*0.5;
  fly.vx-=fly.vx*drag*dt; fly.vy-=fly.vy*drag*0.55*dt;
  // The wings only catch while it is actually falling through air.  Left
  // running on the mat this term is a perpetual motion machine and the
  // butterfly never comes to rest, so the throw never resolves.
  var airborne = fly.y < floorY-fly.r*1.4;
  if (airborne && sp>MN*0.05 && sp<MN*0.85) fly.vx+=Math.sin(fly.ph)*MN*0.26*dt;
  if (!airborne){ fly.vx-=fly.vx*3.4*dt; }
  fly.x+=fly.vx*dt; fly.y+=fly.vy*dt;
  if (!isFinite(fly.x)||!isFinite(fly.y)){ fly.x=pillowX; fly.y=floorY-fly.r; fly.vx=0; fly.vy=0; }

  var pl=pillowX-pillowW*0.5, pr=pillowX+pillowW*0.5;
  var hitSome=false;
  if (fly.y+fly.r>floorY){ fly.y=floorY-fly.r; if (fly.vy>0){ fly.vy*=-0.22; hitSome=true; } fly.vx*=0.7; }
  if (!pil.toppled && fly.x>pl-fly.r && fly.x<pr+fly.r && fly.y+fly.r>pillowTop && fly.y<floorY){
    if (fly.y<pillowTop && fly.vy>0){ fly.y=pillowTop-fly.r; fly.vy*=-0.2; hitSome=true; }
    else if (fly.x<pillowX){ fly.x=pl-fly.r; fly.vx=-Math.abs(fly.vx)*0.4; }
    else { fly.x=pr+fly.r; fly.vx=Math.abs(fly.vx)*0.4; }
  }
  // rests on the fan?
  if (fan.live){
    var ct2=Math.cos(fan.th), st2=Math.sin(fan.th);
    var d=segDist(fan.x-fan.L*ct2, fan.y-fan.L*st2, fan.x+fan.L*ct2, fan.y+fan.L*st2, fly.x, fly.y);
    if (d<fly.r+MN*0.008 && fly.vy>0 && fly.y<fan.y+fan.L*0.6){
      fly.vy*=-0.18; fly.vx*=0.6;
      fly.y-=(fly.r+MN*0.008-d)*0.9;
      hitSome=true;
    }
  }
  if (hitSome && !fly.land && Math.abs(fly.vy)>MN*0.06){ fly.land=true; sfxThud(0.28); }
  fly.x=clamp(fly.x,-W*0.3,W*1.3);
  if (Math.hypot(fly.vx,fly.vy)/MN<REST_V*1.5){
    fly.restT+=dt; if (fly.restT>REST_HOLD) fly.rest=true;
  } else fly.restT=0;
}

// ═══════════════════════════════════════════════════════════════════════
//  THE 銘.  The bout is never scored on aim.  It is scored on how the
//  three objects came to rest — which is why a wild throw sometimes
//  outscores a clean one, and why the good players in the real game aim
//  for the arrangement rather than for the butterfly.
// ═══════════════════════════════════════════════════════════════════════
function fanOffscreen(){
  return fan.x<-W*0.18 || fan.x>W*1.18 || fan.y>H*1.2;
}
function fanOnPillow(){
  if (pil.toppled) return false;
  var pl=pillowX-pillowW*0.5-fan.L*0.7, pr=pillowX+pillowW*0.5+fan.L*0.7;
  return fan.x>pl && fan.x<pr && fan.y<pillowTop+pillowH*0.42 && fan.y>pillowTop-fan.L*1.3;
}
function flyOnFan(){
  if (!fan.live || fanOffscreen()) return false;
  var ct2=Math.cos(fan.th), st2=Math.sin(fan.th);
  var d=segDist(fan.x-fan.L*ct2, fan.y-fan.L*st2, fan.x+fan.L*ct2, fan.y+fan.L*st2, fly.x, fly.y);
  return d < fly.r+MN*0.026 && fly.y < fan.y+fan.L*0.55;
}

var MEI=[
  { id:'suma',     mei:'須磨',   pts:0,  sub:'扇は行方知れず' },
  { id:'utsusemi', mei:'空蝉',   pts:0,  sub:'蝶は落ちず' },
  { id:'nowaki',   mei:'野分',   pts:2,  sub:'枕まで倒した' },
  { id:'ukifune',  mei:'浮舟',   pts:3,  sub:'扇だけ枕に載った' },
  { id:'hanachiru',mei:'花散里', pts:4,  sub:'蝶は落ちたが扇は去った' },
  { id:'yugao',    mei:'夕顔',   pts:6,  sub:'蝶も扇も畳の上' },
  { id:'wakamura', mei:'若紫',   pts:10, sub:'扇が枕に載った' },
  { id:'kocho',    mei:'胡蝶',   pts:14, sub:'蝶が扇に載った' },
  { id:'yumeno',   mei:'夢浮橋', pts:25, sub:'蝶が扇に、扇が枕に' }
];
function meiById(id){
  for (var i=0;i<MEI.length;i++) if (MEI[i].id===id) return MEI[i];
  return MEI[1];
}

function judgeThrow(){
  var off=fanOffscreen();
  var onP=!off && fanOnPillow();
  var onF=!off && fly.knocked && flyOnFan();
  var id;
  if (pil.toppled)            id='nowaki';
  else if (!fly.knocked)      id = off ? 'suma' : (onP ? 'ukifune' : 'utsusemi');
  else if (onF && onP)        id='yumeno';
  else if (onF)               id='kocho';
  else if (onP)               id='wakamura';
  else if (off)               id='hanachiru';
  else                        id='yugao';
  return meiById(id);
}

function resolveThrow(){
  if (resolved) return;            // idempotent: exactly once per throw
  resolved=true;
  var m=judgeThrow();
  judgeMei=m.mei; judgePts=m.pts; judgeSub=m.sub;
  total+=m.pts;
  log.push({ mei:m.mei, pts:m.pts });
  if (log.length>10) log.shift();
  phase='judge'; judgeT=nowS();
  sfxSeal();
  if (m.pts>=10){ burst(pillowX, pillowTop, 34); shake=Math.min(shake+0.34,1); }
  pushWind(0);
}

function nextThrow(){
  if (throwNo>=THROWS){ endBout(); return; }
  placePillow();
  fan.live=false; fan.rest=true;
  phase='aim'; judgeMei='';
  HAND.held=false;
  TRAIL.length=0;
}

function endBout(){
  if (gameOver) return;            // idempotent
  gameOver=true; phase='over';
  if (total>best) best=total;
  var r;
  if (total<15) r='精進';
  else if (total<40) r='一級';
  else if (total<70) r='初段';
  else if (total<110) r='三段';
  else r='皆伝';
  eRank.textContent=r;
  eTot.textContent=String(total);
  eBest.textContent = best>total ? ('自己最高 '+best+' 点') : '自己最高';
  endSheet.classList.add('on');
  sfxBell(1);
}

// ── particles: 金粉 ───────────────────────────────────────────────────
function burst(x,y,n){
  x=fin(x,W*0.5); y=fin(y,H*0.5);
  for (var i=0;i<n;i++){
    var a=Math.random()*TAU, s=MN*(0.10+Math.random()*0.5);
    parts.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-MN*0.16,
                 r:MN*(0.0035+Math.random()*0.006), th:Math.random()*TAU,
                 w:(Math.random()*2-1)*7, life:0.55+Math.random()*0.75, age:0 });
  }
  if (parts.length>240) parts.splice(0,parts.length-240);
}
function stepParts(dt){
  for (var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.age+=dt;
    if (p.age>=p.life){ parts.splice(i,1); continue; }
    p.vy+=G_U*MN*0.55*dt;
    p.vx-=p.vx*1.5*dt; p.vy-=p.vy*0.5*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.th+=p.w*dt;
    if (p.y>floorY){ p.y=floorY; p.vy*=-0.3; p.vx*=0.7; }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE GRIP.  A pinch that appears out of nowhere after the hand was lost
//  is not a grip, and a release with no swing behind it is not a throw.
//  Both of those are the difference between a game and a random number
//  generator, and both are enforced here.
// ═══════════════════════════════════════════════════════════════════════
function stepGrip(){
  var t=nowS();
  var seen=HAND.on && (t-HAND.t)<LOST_S;
  if (!seen){
    if (HAND.on) loseHand();
    return;
  }
  if (phase!=='aim') { HAND.held=false; return; }
  if (!HAND.held){
    if (HAND.pinch<PINCH_ON && TRAIL.length>=3) HAND.held=true;
  } else {
    if (HAND.pinch>PINCH_OFF){
      HAND.held=false;
      var sp=Math.hypot(HAND.vx,HAND.vy)/MN;
      if (sp>=MIN_FLICK && TRAIL.length>=3){
        var k=smooth((sp-MIN_FLICK)/(MAX_FLICK-MIN_FLICK));
        var power=MN*lerp(0.66,1.86,k);
        var inv=1/Math.max(1e-6,Math.hypot(HAND.vx,HAND.vy));
        throwNo++;
        launch(HAND.vx*inv*power, HAND.vy*inv*power);
      } else {
        dropHeld();
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE SCREEN.  金屏風 is built once per resize into an offscreen canvas —
//  a grid of leaf squares each at its own tone, their overlap seams, the
//  砂子 flake, the tatami and its 縁.  Per frame this whole background
//  costs exactly one drawImage.
// ═══════════════════════════════════════════════════════════════════════
var screenCache=null;
function buildScreen(){
  var cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(W*DPR)); cv.height=Math.max(1,Math.round(H*DPR));
  var g=cv.getContext('2d');
  if (!g) return null;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#c19a44'; g.fillRect(0,0,W,H);

  var S=Math.max(28,MN*0.185);
  var cols=Math.ceil(W/S)+1, rows=Math.ceil(H/S)+1, i, j;
  for (j=0;j<rows;j++){
    for (i=0;i<cols;i++){
      var n=h2(i*1.7+3.1, j*2.3+5.9);
      var n2=h2(i*5.3+1.1, j*3.7+9.2);
      var L=176+Math.round(n*30);
      var A=140+Math.round(n2*26);
      g.fillStyle='rgb('+L+','+A+','+(58+Math.round(n*26))+')';
      g.fillRect(i*S, j*S, S+0.6, S+0.6);
    }
  }
  // seams: the leaves are laid overlapping, so every edge shows twice
  g.lineWidth=1;
  for (j=0;j<=rows;j++){
    g.strokeStyle='rgba(120,88,26,0.20)';
    g.beginPath(); g.moveTo(0,j*S+0.5); g.lineTo(W,j*S+0.5); g.stroke();
    g.strokeStyle='rgba(255,236,178,0.22)';
    g.beginPath(); g.moveTo(0,j*S+1.5); g.lineTo(W,j*S+1.5); g.stroke();
  }
  for (i=0;i<=cols;i++){
    g.strokeStyle='rgba(120,88,26,0.20)';
    g.beginPath(); g.moveTo(i*S+0.5,0); g.lineTo(i*S+0.5,H); g.stroke();
    g.strokeStyle='rgba(255,236,178,0.22)';
    g.beginPath(); g.moveTo(i*S+1.5,0); g.lineTo(i*S+1.5,H); g.stroke();
  }
  // 砂子
  var N=Math.round(W*H/900);
  if (N>2600) N=2600;
  for (i=0;i<N;i++){
    var hx=h2(i*0.913, 4.21), hy=h2(i*1.771, 8.13), hs=h2(i*2.339, 1.07);
    var x=hx*W, y=hy*H, r=0.4+hs*1.5;
    g.fillStyle = hs>0.55 ? 'rgba(255,240,190,0.30)' : 'rgba(126,92,30,0.20)';
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  // a huge, very faint 松 branch — a gold screen is never empty
  g.save();
  g.globalAlpha=0.085; g.strokeStyle='#3a2f18'; g.lineCap='round';
  var bx=W*0.06, by=H*0.30;
  g.lineWidth=Math.max(2,MN*0.016);
  g.beginPath(); g.moveTo(bx,by);
  g.bezierCurveTo(W*0.22,by-H*0.10, W*0.34,by+H*0.06, W*0.52,by-H*0.04);
  g.stroke();
  for (i=0;i<7;i++){
    var tt=i/6, px=lerp(bx,W*0.52,tt)+Math.sin(tt*4)*W*0.02;
    var py=lerp(by,by-H*0.04,tt)+Math.cos(tt*5)*H*0.05;
    g.lineWidth=Math.max(1,MN*0.006);
    for (var q=0;q<5;q++){
      var a=-Math.PI*0.5+(q-2)*0.34+Math.sin(i*2.1)*0.3;
      g.beginPath(); g.moveTo(px,py);
      g.lineTo(px+Math.cos(a)*MN*0.055, py+Math.sin(a)*MN*0.055);
      g.stroke();
    }
  }
  g.restore();

  // ── 畳 ──────────────────────────────────────────────────────────
  g.fillStyle='#5d6b3a'; g.fillRect(0,floorY,W,H-floorY+2);
  g.save();
  g.beginPath(); g.rect(0,floorY,W,H-floorY+2); g.clip();
  g.lineWidth=1;
  for (var y2=floorY+2;y2<H+2;y2+=3){
    g.strokeStyle = (Math.round(y2)%6<3) ? 'rgba(255,255,240,0.055)' : 'rgba(20,26,10,0.075)';
    g.beginPath(); g.moveTo(0,y2+0.5); g.lineTo(W,y2+0.5); g.stroke();
  }
  var TW=MN*0.62;
  for (var x2=-TW*0.3;x2<W+TW;x2+=TW){
    g.strokeStyle='rgba(20,26,10,0.22)'; g.lineWidth=2;
    g.beginPath(); g.moveTo(x2,floorY); g.lineTo(x2,H); g.stroke();
  }
  g.restore();
  // 縁 braid along the top edge of the mat
  var eb=Math.max(4,MN*0.016);
  g.fillStyle='#2b2a1c'; g.fillRect(0,floorY-eb,W,eb);
  g.strokeStyle='rgba(201,162,74,0.55)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,floorY-eb+0.5); g.lineTo(W,floorY-eb+0.5); g.stroke();
  g.beginPath(); g.moveTo(0,floorY-1.5); g.lineTo(W,floorY-1.5); g.stroke();
  g.fillStyle='rgba(201,162,74,0.28)';
  for (var xb=0;xb<W;xb+=eb*1.6){ g.fillRect(xb, floorY-eb+eb*0.34, eb*0.55, eb*0.32); }
  return cv;
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAWING THE FAN.  A real 扇 is a sector of paper on ribs with the 要
//  rivet at the apex, so it is drawn from the apex out — which means its
//  rotation is legible even at speed, and which is the whole reason the
//  tumble reads as tumbling and not as a spinning stick.
// ═══════════════════════════════════════════════════════════════════════
function drawFan(g,x,y,th,L,alpha){
  var SPREAD=1.16;
  g.save();
  g.globalAlpha=clamp(alpha,0,1);
  g.translate(x,y); g.rotate(th);
  // apex sits at -L along the blade axis
  var ax=-L, R=L*2;
  g.beginPath();
  g.moveTo(ax,0);
  g.arc(ax,0,R,-SPREAD*0.5,SPREAD*0.5);
  g.closePath();
  var grd=g.createLinearGradient(ax,0,ax+R,0);
  grd.addColorStop(0,'#d8623f');
  grd.addColorStop(0.55,'#b8442c');
  grd.addColorStop(1,'#9c351f');
  g.fillStyle=grd; g.fill();
  // paper edge highlight
  g.lineWidth=Math.max(1,L*0.045); g.strokeStyle='rgba(240,228,200,0.55)';
  g.beginPath(); g.arc(ax,0,R,-SPREAD*0.5,SPREAD*0.5); g.stroke();
  // ribs
  g.lineWidth=Math.max(1,L*0.036); g.strokeStyle='rgba(34,29,22,0.62)';
  for (var i=0;i<=8;i++){
    var a=-SPREAD*0.5+SPREAD*(i/8);
    g.beginPath(); g.moveTo(ax+Math.cos(a)*R*0.24, Math.sin(a)*R*0.24);
    g.lineTo(ax+Math.cos(a)*R, Math.sin(a)*R); g.stroke();
  }
  // the gold moon on the paper
  g.globalAlpha=clamp(alpha*0.9,0,1);
  g.fillStyle='#e8c257';
  g.beginPath(); g.arc(ax+R*0.62,0,R*0.15,0,TAU); g.fill();
  // 要
  g.globalAlpha=clamp(alpha,0,1);
  g.fillStyle='#221d16';
  g.beginPath(); g.arc(ax,0,Math.max(1.4,L*0.11),0,TAU); g.fill();
  g.restore();
}

function drawPillow(g){
  g.save();
  var cx=pillowX, by=floorY;
  g.translate(cx,by);
  g.rotate(clamp(pil.tilt,-2.2,2.2));
  var w=pillowW, h=pillowH;
  g.fillStyle='rgba(20,18,10,0.24)';
  g.beginPath(); g.ellipse(0,2,w*0.62,Math.max(1,h*0.10),0,0,TAU); g.fill();
  g.fillStyle='#221d16';
  g.fillRect(-w*0.5,-h,w,h);
  var grd=g.createLinearGradient(-w*0.5,0,w*0.5,0);
  grd.addColorStop(0,'rgba(255,255,255,0.10)');
  grd.addColorStop(0.35,'rgba(255,255,255,0.02)');
  grd.addColorStop(1,'rgba(0,0,0,0.22)');
  g.fillStyle=grd; g.fillRect(-w*0.5,-h,w,h);
  g.strokeStyle='#c9a24a'; g.lineWidth=Math.max(1,MN*0.0035);
  g.strokeRect(-w*0.5,-h,w,h);
  g.beginPath(); g.moveTo(-w*0.5,-h+h*0.22); g.lineTo(w*0.5,-h+h*0.22); g.stroke();
  g.restore();
}

function drawFly(g,x,y,ph,scale){
  g.save();
  g.translate(x,y);
  var flap=0.45+0.55*Math.abs(Math.sin(ph));
  var r=fly.r*(scale||1);
  g.fillStyle='#f0e4c8';
  g.strokeStyle='#221d16'; g.lineWidth=Math.max(1,r*0.14);
  // two wings, the near one foreshortened by the flap
  g.beginPath(); g.ellipse(-r*0.62,-r*0.12,r*0.72*flap,r*0.86,-0.34,0,TAU); g.fill(); g.stroke();
  g.beginPath(); g.ellipse( r*0.62,-r*0.12,r*0.72*flap,r*0.86, 0.34,0,TAU); g.fill(); g.stroke();
  g.fillStyle='#b8442c';
  g.beginPath(); g.ellipse(-r*0.6,-r*0.3,r*0.24*flap,r*0.24,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse( r*0.6,-r*0.3,r*0.24*flap,r*0.24,0,0,TAU); g.fill();
  g.fillStyle='#221d16';
  g.beginPath(); g.ellipse(0,0,r*0.15,r*0.62,0,0,TAU); g.fill();
  g.lineWidth=Math.max(1,r*0.09);
  g.beginPath(); g.moveTo(-r*0.05,-r*0.5); g.quadraticCurveTo(-r*0.4,-r*1.0,-r*0.52,-r*1.05);
  g.moveTo( r*0.05,-r*0.5); g.quadraticCurveTo( r*0.4,-r*1.0, r*0.52,-r*1.05);
  g.stroke();
  g.restore();
}

// the traced hand: proof the camera sees you, drawn in ink on gold
var HBONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
            [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(g){
  var p=HAND.pts;
  if (!p || p.length<21) return;
  var seen=HAND.on && (nowS()-HAND.t)<LOST_S;
  g.save();
  g.globalAlpha=seen?0.5:0.18;
  g.strokeStyle='#221d16'; g.lineCap='round'; g.lineJoin='round';
  g.lineWidth=Math.max(1.2,MN*0.0085);
  for (var i=0;i<HBONES.length;i++){
    var a=p[HBONES[i][0]], b=p[HBONES[i][1]];
    if (!a||!b) continue;
    g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke();
  }
  g.globalAlpha=seen?0.66:0.2;
  g.fillStyle='#221d16';
  for (var k=0;k<21;k++){
    var q=p[k]; if (!q) continue;
    var r=(k===4||k===8)?MN*0.008:MN*0.0042;
    g.beginPath(); g.arc(q.x,q.y,r,0,TAU); g.fill();
  }
  g.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  FRAME
// ═══════════════════════════════════════════════════════════════════════
var lastT=nowS();
function frame(){
  requestAnimationFrame(frame);
  var t=nowS();
  var dt=t-lastT; lastT=t;
  if (!(dt>0)) dt=0.016;
  if (dt>0.05) dt=0.05;

  if (!screenCache) screenCache=buildScreen();

  if (running){
    stepGrip();
    if (phase==='fly'){
      // sub-step: a fast fan must not tunnel through the pillow
      var n=3, sd=dt/n, i;
      for (i=0;i<n;i++){ stepFan(sd); stepFly(sd); }
      pushWind(Math.hypot(fan.vx,fan.vy)/MN);
      if (pil.toppled){ pil.tv+=(pil.tv>=0?1:-1)*4.2*dt; pil.tilt+=pil.tv*dt; pil.tilt=clamp(pil.tilt,-1.55,1.55);
        if (Math.abs(pil.tilt)>=1.5) pil.tv=0; }
      var done = (fan.rest && (fly.rest||!fly.knocked) && (!pil.toppled||Math.abs(pil.tilt)>=1.49))
                 || fanOffscreen() || (t-throwT>TIMEOUT);
      if (done) resolveThrow();
    } else if (phase==='judge'){
      pushWind(0);
      stepFly(dt);
      if (t-judgeT>2.05){ nextThrow(); }
    } else {
      pushWind(0);
    }
    stepParts(dt);
  }
  shake=Math.max(0,shake-dt*3.2);
  flash=Math.max(0,flash-dt*4.5);

  // ── paint ────────────────────────────────────────────────────────
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var sx=0,sy=0;
  if (shake>0.001){
    var m=shake*shake*MN*0.028;
    sx=(Math.random()*2-1)*m; sy=(Math.random()*2-1)*m;
    ctx.translate(sx,sy);
  }
  if (screenCache) ctx.drawImage(screenCache,0,0,W,H);
  else { ctx.fillStyle='#c19a44'; ctx.fillRect(-40,-40,W+80,H+80); }

  drawPillow(ctx);
  if (!fly.knocked && !pil.toppled) drawFly(ctx, fly.x, fly.y, nowS()*2.2, 1);

  // the aim arc: anticipation, and the whole tutorial in one line
  if (running && phase==='aim' && HAND.held){
    var sp=Math.hypot(HAND.vx,HAND.vy)/MN;
    if (sp>MIN_FLICK*0.5){
      var k=smooth((sp-MIN_FLICK)/(MAX_FLICK-MIN_FLICK));
      var power=MN*lerp(0.66,1.86,k);
      var inv=1/Math.max(1e-6,Math.hypot(HAND.vx,HAND.vy));
      var pvx=HAND.vx*inv*power, pvy=HAND.vy*inv*power;
      var ready=sp>=MIN_FLICK;
      ctx.save();
      ctx.fillStyle=ready?'#b8442c':'rgba(34,29,22,0.4)';
      for (var s=1;s<=22;s++){
        var tt=s*0.035;
        var px2=HAND.x+pvx*tt, py2=HAND.y+(pvy*tt+0.5*G_U*MN*tt*tt);
        if (py2>floorY) break;
        var rr=Math.max(0.6, MN*0.006*(1-s/26));
        ctx.globalAlpha=clamp((ready?0.85:0.4)*(1-s/24),0,1);
        ctx.beginPath(); ctx.arc(px2,py2,rr,0,TAU); ctx.fill();
      }
      ctx.restore();
    }
  }

  drawHand(ctx);

  // held fan breathes at the fingertips
  if (running && phase==='aim' && HAND.held){
    heldWobble+=0.06;
    var wob=Math.sin(heldWobble)*0.05;
    var ang=Math.atan2(HAND.vy,HAND.vx);
    if (!isFinite(ang) || Math.hypot(HAND.vx,HAND.vy)<MN*0.08) ang=-0.55;
    drawFan(ctx, HAND.x, HAND.y, ang+wob, MN*0.058, 1);
  }
  if (fan.live) drawFan(ctx, fan.x, fan.y, fan.th, fan.L, 1);
  if (fly.knocked) drawFly(ctx, fly.x, fly.y, fly.rest?0:fly.ph, 1);

  // 金粉
  for (var pi=0;pi<parts.length;pi++){
    var p=parts[pi];
    var a=clamp(1-p.age/p.life,0,1);
    ctx.save();
    ctx.globalAlpha=clamp(a*0.92,0,1);
    ctx.translate(p.x,p.y); ctx.rotate(p.th);
    ctx.fillStyle = (pi%3===0) ? '#f0e4c8' : '#e8c257';
    ctx.fillRect(-p.r,-p.r*0.5,p.r*2,Math.max(0.5,p.r));
    ctx.restore();
  }

  if (flash>0.002){
    ctx.save();
    ctx.globalAlpha=clamp(flash*0.30,0,1);
    ctx.fillStyle='#fff3d0';
    ctx.fillRect(-60,-60,W+120,H+120);
    ctx.restore();
  }

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (running) drawHUD(ctx);
  if (running && phase==='judge') drawMei(ctx);
  if (!running && screenCache===null) { /* nothing */ }
}

function drawHUD(g){
  g.save();
  g.font='600 '+Math.round(MN*0.026)+'px "Shippori Mincho", serif';
  g.textBaseline='top';
  g.fillStyle='rgba(34,29,22,0.86)';
  g.textAlign='left';
  var pad=Math.round(MN*0.035);
  g.fillText('投 '+Math.min(throwNo+ (phase==='aim'?1:0), THROWS)+' ／ '+THROWS, pad, pad*0.72);
  g.font='800 '+Math.round(MN*0.05)+'px "Shippori Mincho", serif';
  g.fillText(String(total), pad, pad*0.72+MN*0.036);
  g.font='500 '+Math.round(MN*0.021)+'px "Shippori Mincho", serif';
  g.fillStyle='rgba(34,29,22,0.6)';
  g.fillText('点', pad+g.measureText(String(total)).width*0.1+MN*0.052, pad*0.72+MN*0.062);

  // tracking tell
  var seen=HAND.on && (nowS()-HAND.t)<LOST_S;
  g.beginPath();
  g.arc(pad+MN*0.008, pad*0.72+MN*0.104, MN*0.008, 0, TAU);
  g.fillStyle = seen ? '#b8442c' : 'rgba(34,29,22,0.25)';
  g.fill();
  g.font='500 '+Math.round(MN*0.019)+'px "Shippori Mincho", serif';
  g.fillStyle='rgba(34,29,22,0.55)';
  g.fillText(seen?(HAND.held?'つまんでいます':'手が見えています'):'手が見えません', pad+MN*0.024, pad*0.72+MN*0.094);

  // hint
  var ht=nowS()-hintT;
  if (ht<2.0 && hintMsg){
    g.globalAlpha=clamp(1-Math.max(0,ht-1.3)/0.7,0,1);
    g.font='600 '+Math.round(MN*0.026)+'px "Shippori Mincho", serif';
    g.textAlign='center';
    g.fillStyle='#b8442c';
    g.fillText(hintMsg, W*0.5, H*0.86);
    g.globalAlpha=1;
  }

  // the record: past 銘 stamped down the right edge
  g.textAlign='center'; g.textBaseline='middle';
  var sz=MN*0.052, gap=sz*1.14;
  var x0=W-pad-sz*0.5;
  var y0=pad+MN*0.16;
  for (var i=0;i<log.length;i++){
    var e=log[i];
    var yy=y0+i*gap;
    if (yy>floorY-sz) break;
    g.save();
    g.globalAlpha=e.pts>0?0.9:0.34;
    g.fillStyle='#b8442c';
    g.fillRect(x0-sz*0.5,yy-sz*0.5,sz,sz);
    g.fillStyle='#f0e4c8';
    g.font='700 '+Math.round(sz*0.30)+'px "Shippori Mincho", serif';
    var mm=e.mei;
    if (mm.length<=2){
      g.font='700 '+Math.round(sz*0.40)+'px "Shippori Mincho", serif';
      g.fillText(mm.charAt(0), x0, yy-sz*0.20);
      g.fillText(mm.charAt(1)||'', x0, yy+sz*0.20);
    } else {
      g.fillText(mm.slice(0,2), x0, yy-sz*0.18);
      g.fillText(mm.slice(2), x0, yy+sz*0.18);
    }
    g.restore();
  }
  g.restore();
}

// the seal falls, overshoots once, and stays
function drawMei(g){
  var e=nowS()-judgeT;
  var k=easeOut(clamp(e/0.30,0,1));
  var over=1+0.16*Math.sin(clamp((e-0.10)/0.34,0,1)*Math.PI)*(e<0.44?1:0);
  var sc=lerp(2.5,1,k)*over;
  var al=clamp(e/0.14,0,1)*clamp((2.05-e)/0.42,0,1);
  if (al<=0.002) return;
  g.save();
  g.globalAlpha=clamp(al,0,1);
  g.translate(W*0.5, H*0.40);
  g.rotate(lerp(-0.24,-0.045,k));
  g.scale(clamp(sc,0.05,4),clamp(sc,0.05,4));
  var S=MN*0.20;
  g.fillStyle='#b8442c';
  g.fillRect(-S*0.5,-S*0.5,S,S);
  g.strokeStyle='rgba(240,228,200,0.55)'; g.lineWidth=Math.max(1,S*0.022);
  g.strokeRect(-S*0.40,-S*0.40,S*0.80,S*0.80);
  g.fillStyle='#f0e4c8';
  g.textAlign='center'; g.textBaseline='middle';
  var mm=judgeMei;
  if (mm.length<=2){
    g.font='800 '+Math.round(S*0.40)+'px "Shippori Mincho", serif';
    g.fillText(mm.charAt(0),0,-S*0.20);
    g.fillText(mm.charAt(1)||'',0,S*0.20);
  } else {
    g.font='800 '+Math.round(S*0.30)+'px "Shippori Mincho", serif';
    g.fillText(mm.slice(0,2),0,-S*0.17);
    g.fillText(mm.slice(2),0,S*0.17);
  }
  g.restore();

  g.save();
  g.globalAlpha=clamp(al,0,1);
  g.textAlign='center';
  g.fillStyle='rgba(34,29,22,0.9)';
  g.font='700 '+Math.round(MN*0.040)+'px "Shippori Mincho", serif';
  g.fillText(judgePts>0?('＋'+judgePts+' 点'):'０ 点', W*0.5, H*0.40+MN*0.175);
  g.font='500 '+Math.round(MN*0.024)+'px "Shippori Mincho", serif';
  g.fillStyle='rgba(34,29,22,0.62)';
  g.fillText(judgeSub, W*0.5, H*0.40+MN*0.225);
  g.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  THE DIAGRAM ON THE START SHEET.  Three seconds, on a loop: pinch,
//  swing, open, and the fan tumbles into the butterfly.  It teaches the
//  gesture faster than the four lines of text beneath it.
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoT0=nowS();
function demoFrame(){
  if (!demoRun) return;
  var g=demoCtx;
  if (!g) return;
  var w=demoCv.width, h=demoCv.height;
  var t=(nowS()-demoT0)%3.4;
  g.fillStyle='#c19a44'; g.fillRect(0,0,w,h);
  g.fillStyle='#5d6b3a'; g.fillRect(0,h*0.80,w,h*0.20);
  g.fillStyle='#2b2a1c'; g.fillRect(0,h*0.80-5,w,5);
  // pillow + butterfly
  var px=w*0.80, ph=h*0.24, pw=h*0.30;
  g.fillStyle='#221d16'; g.fillRect(px-pw*0.5,h*0.80-ph,pw,ph);
  g.strokeStyle='#c9a24a'; g.lineWidth=1.4; g.strokeRect(px-pw*0.5,h*0.80-ph,pw,ph);

  var hx=lerp(w*0.14,w*0.34,smooth(clamp((t-0.55)/0.45,0,1)));
  var hy=lerp(h*0.60,h*0.38,smooth(clamp((t-0.55)/0.45,0,1)));
  var open = t<0.35 || t>1.00;
  var gap = open? h*0.10 : h*0.028;

  // fingers
  g.strokeStyle='#221d16'; g.lineWidth=Math.max(2,h*0.022); g.lineCap='round';
  g.beginPath(); g.moveTo(hx-h*0.14,hy+h*0.13); g.lineTo(hx,hy-gap*0.5); g.stroke();
  g.beginPath(); g.moveTo(hx-h*0.14,hy+h*0.13); g.lineTo(hx,hy+gap*0.5); g.stroke();
  g.fillStyle='#b8442c';
  g.beginPath(); g.arc(hx,hy-gap*0.5,h*0.026,0,TAU); g.fill();
  g.beginPath(); g.arc(hx,hy+gap*0.5,h*0.026,0,TAU); g.fill();

  var flyY=h*0.80-ph-h*0.07, flyX=px, flyR=h*0.055;
  if (t<1.00){
    // held: the fan sits between the fingertips
    if (t>0.35) drawDemoFan(g,hx+h*0.10,hy,-0.5+Math.sin(t*9)*0.06,h*0.16);
    if (t>0.62){
      g.fillStyle='rgba(34,29,22,0.4)';
      for (var s=1;s<10;s++){
        var tt=s*0.10;
        g.beginPath(); g.arc(hx+h*0.9*tt, hy-h*0.55*tt+h*1.5*tt*tt, Math.max(0.8,2.4-s*0.18),0,TAU); g.fill();
      }
    }
  } else {
    var ft=(t-1.00);
    var fx=hx+h*2.6*ft, fy=hy-h*1.55*ft+h*3.0*ft*ft;
    fy=Math.min(fy,h*0.80-h*0.05);
    drawDemoFan(g,fx,fy,-0.6+ft*7.5,h*0.16);
    if (ft>0.52){ flyX=px+ (ft-0.52)*h*1.2; flyY=Math.min(h*0.80-flyR*0.7, flyY+(ft-0.52)*(ft-0.52)*h*7); }
  }
  // butterfly
  g.fillStyle='#f0e4c8'; g.strokeStyle='#221d16'; g.lineWidth=Math.max(1,h*0.008);
  g.beginPath(); g.ellipse(flyX-flyR*0.55,flyY,flyR*0.55,flyR*0.72,-0.3,0,TAU); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(flyX+flyR*0.55,flyY,flyR*0.55,flyR*0.72, 0.3,0,TAU); g.fill(); g.stroke();
  g.fillStyle='#221d16';
  g.beginPath(); g.ellipse(flyX,flyY,flyR*0.13,flyR*0.55,0,0,TAU); g.fill();

  g.fillStyle='rgba(34,29,22,0.72)';
  g.font='600 '+Math.round(h*0.10)+'px "Shippori Mincho", serif';
  g.textAlign='left'; g.textBaseline='top';
  g.fillText(t<0.35?'ひらく':(t<1.00?'つまんで振る':'ひらいて放つ'), h*0.06, h*0.06);
}
function drawDemoFan(g,x,y,th,L){
  g.save(); g.translate(x,y); g.rotate(th);
  g.beginPath(); g.moveTo(-L,0); g.arc(-L,0,L*2,-0.58,0.58); g.closePath();
  g.fillStyle='#b8442c'; g.fill();
  g.strokeStyle='rgba(240,228,200,0.6)'; g.lineWidth=Math.max(1,L*0.06);
  g.beginPath(); g.arc(-L,0,L*2,-0.58,0.58); g.stroke();
  g.strokeStyle='rgba(34,29,22,0.55)'; g.lineWidth=Math.max(1,L*0.05);
  for (var i=0;i<=5;i++){
    var a=-0.58+1.16*(i/5);
    g.beginPath(); g.moveTo(-L+Math.cos(a)*L*0.5, Math.sin(a)*L*0.5);
    g.lineTo(-L+Math.cos(a)*L*2, Math.sin(a)*L*2); g.stroke();
  }
  g.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  WIRING
// ═══════════════════════════════════════════════════════════════════════
goBtn.addEventListener('click',function(){
  if (running) return;
  demoRun=false;
  initAudio();
  sheet.classList.add('gone');
  setTimeout(function(){ sheet.style.display='none'; },360);
  running=true;
  resetBout();
  startStream()
    .then(function(){ if (initHands()) startMpCamera(); })
    .catch(showError);
});

againBtn.addEventListener('click',function(){
  endSheet.classList.remove('on');
  initAudio();
  resetBout();
});

document.addEventListener('visibilitychange',function(){
  if (document.hidden) loseHand();
});

function tick(){
  requestAnimationFrame(tick);
  if (demoRun) demoFrame();
}

resize();
placePillow();
requestAnimationFrame(frame);
requestAnimationFrame(tick);
</script>
