<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人が映画ポスターのような二重露光になる。体の中に霧の森と赤い太陽が写り込み、動いたところから体の輪郭が黒い鳥の群れになって飛び立つ。">
<meta name="theme-color" content="#eceae5">
<title>HABATAKI ─ 二重露光の体、ほどける鳥</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  HABATAKI 羽搏き ─ 二重露光の体、ほどける鳥            ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       映画ポスター／レコードジャケットの二重露光。白い紙の上で、映った人の
             シルエットの中にだけ霧の山並みと針葉樹の森と沈む太陽が写り込み、
             顔はその上に重なって残る。動いたところから輪郭がほどけて、墨色の
             鳥の群れになって飛び立ち、遠くへ小さくなって消える。
  PALETTE    FOG    紙 #eceae5・墨 #15171a・空 #aeb5ba→#dcdedd・太陽 #b3392b
             DUSK   紙 #efe6da・墨 #1f1612・空 #b88e78→#e6cdb8・太陽 #6e1b16
             NIGHT  紙 #0e1013・月明かりの空 #8d98a4→#39414b・森 #06070a・月 #e6d9b2・鳥 #dcd6c6
  TYPE       DM Serif Display（題字・イタリック）＋ Sometype Mono（小さな字）。
  MOTION     森は 60 秒で一周するほどゆっくり横へ流れ、体の位置に合わせて奥と手前が
             ずれる（体の中の視差）。鳥は羽ばたきと滑空を繰り返しながら上へ遠くへ。
             止まっていれば何も飛ばない。タップで輪郭全体から一斉に飛び立つ。
  SIGNATURE  動いたぶんだけ、あなたの形が鳥になって空へほどけること。
  SWITCH     はじめは素のカメラ。「▸ HABATAKI」で映像が白く飛び（露光過多）、
             印画紙が現像されるように森と顔が浮かび、現れた瞬間に輪郭から群れが発つ。
             「◂ CAMERA」で像が紙に溶け、元のカメラへ戻る。録画は両方で撮れる。
  TECH       WebGL2。合成は全画面シェーダ一枚（映像・人物マスク・森のテクスチャ）。
             森は起動時に一度だけ Canvas で三層（遠山・丘・松）を描いてテクスチャ化。
             鳥は固定プール 900 羽を型付き配列で持ち、インスタンス描画する。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Sometype+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceae5;--fg:#15171a;--dim:rgba(21,23,26,.55);--line:rgba(21,23,26,.22);--acc:#b3392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
  font-family:"Sometype Mono","Hiragino Sans","Noto Sans JP",monospace;transition:background .4s}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding:28px;text-align:center;background:var(--bg)}

  font:italic 400 13px "DM Serif Display",serif;letter-spacing:.34em;color:var(--fg);opacity:.8}
#credit.show{display:block}

  color:var(--dim);pointer-events:none;max-width:72vw;line-height:1.7;white-space:pre-line}

#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 78px);z-index:12;width:min(270px,calc(100vw - 20px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:13px;

  letter-spacing:.22em;cursor:pointer;opacity:.55}

#mode{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:13;display:none;
  appearance:none;border:1px solid var(--fg);background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--fg);
  font:400 10px "Sometype Mono",monospace;letter-spacing:.42em;padding:13px 22px 13px 28px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .3s}
#mode.show{display:block}
body.cam #mode{border-color:rgba(255,255,255,.7);color:#fff;background:rgba(0,0,0,.3)}
body.cam .btn{color:#fff}
body.cam #bar #shoot{border-color:#fff}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="credit">HABATAKI<small>DOUBLE EXPOSURE</small></div>
<div id="status" class="jp"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn jp">⟲ カメラ</button>
<button id="mode">▸ HABATAKI</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="fly" class="btn">FLY</button>
</div>

<div id="panel" class="hide jp">
  <div class="chips" id="pals">
    <button data-p="0" class="on">FOG</button>
    <button data-p="1">DUSK</button>
    <button data-p="2">NIGHT</button>
  </div>
  <label><span>鳥の数</span><input type="range" id="sBirds" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>顔の濃さ</span><input type="range" id="sFace" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>森の高さ</span><input type="range" id="sForest" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>霧</span><input type="range" id="sMist" min="0" max="1" step="0.01" value="0.5"></label>
  <div class="note">動いたところから鳥が発つ。タップで一斉に。</div>
</div>

<div id="start">
  <div class="t">DOUBLE EXPOSURE</div>
  <h1>Habataki</h1>
  <div class="sun"></div>
  <p class="jp">まずは、いつものカメラ。<br>ボタンを押すと、あなたの中に森が写る。<br>動けば、あなたは鳥になってほどける。</p>
  <button id="go">START</button>
  <div id="err" class="jp"></div>
</div>

<script>
'use strict';
/* =====================================================================
   HABATAKI — a film double exposure of the person (silhouette filled with
   a three-layer misty forest + sun, face on top) whose outline peels away
   into a flock of ink birds wherever the silhouette moves.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

const hex = h => [1,3,5].map(i => parseInt(h.substr(i, 2), 16) / 255);
const PALS = [
  { name:'FOG',   paper:'#eceae5', ink:'#15171a', bird:'#15171a', mist:'#15171a', skyT:'#aeb5ba', skyB:'#dcdedd', sun:'#b3392b', dim:'rgba(21,23,26,.55)',   line:'rgba(21,23,26,.22)' },
  { name:'DUSK',  paper:'#efe6da', ink:'#1f1612', bird:'#1f1612', mist:'#1f1612', skyT:'#b88e78', skyB:'#e6cdb8', sun:'#6e1b16', dim:'rgba(31,22,18,.55)',   line:'rgba(31,22,18,.22)' },
  { name:'NIGHT', paper:'#0e1013', ink:'#06070a', bird:'#dcd6c6', mist:'#5a6573', skyT:'#8d98a4', skyB:'#39414b', sun:'#e6d9b2', dim:'rgba(220,214,198,.55)', line:'rgba(220,214,198,.22)', fg:'#dcd6c6' },
];
PALS.forEach(p => { p.v = { paper:hex(p.paper), ink:hex(p.ink), bird:hex(p.bird), mist:hex(p.mist), skyT:hex(p.skyT), skyB:hex(p.skyB), sun:hex(p.sun) }; });
const S = { pal:0, birds:.55, face:.55, forest:.5, mist:.5 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:true, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS_Q = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS_COMP = `#version 300 es
precision highp float;
uniform sampler2D uVid, uMask, uLand;
uniform vec2 uRes, uScale;              // canvas px; cover-crop scale for the video
uniform float uMirror, uHasMask, uT, uCam, uDev, uFace, uForest, uMist, uLumMid;
uniform vec4 uBox;                      // head: centre x, crown y, crown-to-shoulder height, width (short-edge units)
uniform vec3 uPaper, uInk, uMistC, uSkyT, uSkyB, uSun;
uniform vec3 uDrift;                    // horizontal offsets of far / mid / near layers
out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
void main(){
  vec2 s = gl_FragCoord.xy / uRes; s.y = 1. - s.y;
  float S = min(uRes.x, uRes.y);
  vec2 q = vec2(s.x * uRes.x, s.y * uRes.y) / S;           // short-edge units, y down
  vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x;
  vec3 vid = texture(uVid, v).rgb;
  float l = dot(vid, vec3(.2126,.7152,.0722));
  float m = uHasMask > .5 ? smoothstep(.36, .64, texture(uMask, s).r) : 1.;

  // landscape anchored to the person: horizon a little below the chin line
  float hs = max(uBox.z, .08), top = uBox.y, Hb = hs * 2.1;   // head height (crown to shoulders)
  float hor = top + 1.32 * hs;
  float sc = 1. / (Hb * 1.15);
  float lv = .5 + (q.y - hor) * sc;
  float lift = (uForest - .5) * .16;
  float lu = (q.x - uBox.x) * sc;
  float far  = texture(uLand, vec2(lu * .8 + uDrift.x, lv * .9 + .05)).r;
  float mid  = texture(uLand, vec2(lu + uDrift.y, lv + lift * .5)).g;
  float near = texture(uLand, vec2(lu * 1.15 + uDrift.z, lv + lift)).b;
  float mist = .35 + .65 * uMist;
  float li = max(max(far * (.46 - .22 * mist), mid * (.78 - .2 * mist)), near);

  // sun (moon at night) sitting on the horizon behind the forest
  vec2 sp = vec2(uBox.x, hor - .12 * hs);
  float sr = clamp(hs * .46, .045, .26);
  float sun = 1. - smoothstep(sr - .004, sr + .004, length(q - sp));

  // portrait: auto-levelled around the person's own mid-grey, strongest on the head
  float pc = smoothstep(uLumMid - .30, uLumMid + .28, l);
  float faceW = mix(1., .12, smoothstep(top + .85 * hs, top + 1.3 * hs, q.y));
  float pi = (1. - pc) * faceW * (.45 + .75 * uFace);

  // develop unevenly, like a print in the tray
  float n = h21(floor(q * 40.));
  float dv = smoothstep(n * .35, n * .35 + .65, uDev);
  float dvL = smoothstep(0., .7, uDev);

  float sky = clamp((q.y - top) / (hs * 1.4), 0., 1.);
  vec3 fill = mix(uSkyT, uSkyB, sky);
  fill = mix(fill, uSun, sun * (1. - near) * .92);
  float ink = 1. - (1. - pi * dv) * (1. - li * dvL);
  vec3 inside = mix(fill, uInk, clamp(ink, 0., 1.));
  // the forest leaks out a little into the paper, as mist around the figure
  float leak = (far * .10 + mid * .06) * mist * dvL;
  vec3 outside = mix(uPaper, uMistC, leak);
  vec3 eff = mix(outside, mix(uPaper, inside, dvL), m);
  // paper grain + a soft vignette
  float g = h21(floor(gl_FragCoord.xy / 1.5) + fract(uT * 7.31) * 113.) - .5;
  float vig = smoothstep(.45, 1.25, length(s - .5) * 1.6);
  eff = mix(eff, uInk, vig * .10 * step(.3, dot(uPaper, vec3(.33))));
  eff += g * .045;

  // plain camera; on the way in it burns out to paper (over-exposure)
  float burn = smoothstep(.25, 1., 1. - uCam);
  vec3 cam = mix(vid, uPaper, burn);
  o = vec4(mix(eff, cam, smoothstep(0., .6, uCam)), 1.);
}`;
const VS_BIRD = `#version 300 es
in vec3 aT;                 // template x, y, kind (0 root, 1 elbow, 2 tip)
in vec4 aP;                 // centre x, y (short-edge units), size, bank
in vec3 aW;                 // elbow lift, tip lift, alpha
uniform vec2 uAsp;          // canvas size in short-edge units
out float vA;
void main(){
  vec2 p = aT.xy;
  if (aT.z > .5 && aT.z < 1.5) p.y += aW.x;
  else if (aT.z > 1.5) p.y += aW.y;
  float c = cos(aP.w), s = sin(aP.w);
  p = vec2(c * p.x - s * p.y, s * p.x + c * p.y) * aP.z;
  vec2 w = aP.xy + vec2(p.x, -p.y);
  gl_Position = vec4(w.x / uAsp.x * 2. - 1., 1. - w.y / uAsp.y * 2., 0., 1.);
  vA = aW.z;
}`;
const FS_BIRD = `#version 300 es
precision mediump float;
uniform vec3 uInk; in float vA; out vec4 o;
void main(){ o = vec4(uInk * vA, vA); }`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs, attrs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function tex(wrapS){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrapS || gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }

// bird: two bent wings + a small tail, drawn as 21 vertices
const BIRD_T = (() => {
  const L = [[-.02,.06,0],[-.02,-.07,0],[-.42,.05,1], [-.02,-.07,0],[-.40,-.04,1],[-.42,.05,1], [-.42,.05,1],[-.40,-.04,1],[-1,0,2]];
  const R = L.map(([x,y,k]) => [-x,y,k]);
  const T = [[-.05,-.02,0],[.05,-.02,0],[0,-.2,0]];
  return new Float32Array([...L, ...R, ...T].flat());
})();
const BMAX = 900;
const BI = new Float32Array(BMAX * 7);
let PC, PB, vaoQuad, vaoBird, bufInst, texVid, texMask, texLand;
function initGL(){
  PC = prog(VS_Q, FS_COMP, ['p']); PB = prog(VS_BIRD, FS_BIRD, ['aT', 'aP', 'aW']);
  vaoQuad = gl.createVertexArray(); gl.bindVertexArray(vaoQuad);
  let b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  vaoBird = gl.createVertexArray(); gl.bindVertexArray(vaoBird);
  b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, BIRD_T, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  bufInst = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufInst); gl.bufferData(gl.ARRAY_BUFFER, BI.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 28, 0); gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 28, 16); gl.vertexAttribDivisor(2, 1);
  gl.bindVertexArray(null);
  texVid = tex(); texMask = tex(); texLand = tex(gl.REPEAT);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  buildLand();
}

/* ---------- the landscape: far ridge (R), wooded hills (G), tall pines (B); seamless in x ---------- */
function buildLand(){
  const N = 1024, TAU = Math.PI * 2, c = document.createElement('canvas'); c.width = N; c.height = N;
  const x2 = c.getContext('2d'), img = x2.createImageData(N, N), d = img.data;
  const rnd = (() => { let s = 20260928; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; })();
  const ridge = (u, base, amps) => { let y = base; amps.forEach(([k, a, ph]) => { y += a * Math.sin(TAU * k * u + ph); }); return y; };
  const fA = [[1,.035,rnd()*6],[2,.028,rnd()*6],[5,.014,rnd()*6],[11,.006,rnd()*6],[23,.003,rnd()*6]];
  const mA = [[1,.02,rnd()*6],[3,.018,rnd()*6],[7,.008,rnd()*6]];
  const trees = (count, hMin, hMax, wk) => { const a = []; for (let i = 0; i < count; i++){ const h = hMin + (hMax - hMin) * Math.pow(rnd(), 1.6); a.push([rnd(), h, h * wk * (.8 + .4 * rnd())]); } return a; };
  const midT = trees(150, .025, .07, .22), nearT = trees(26, .14, .30, .20);
  const pine = (u, list, base) => {           // top edge of a row of tiered pines at u (wraps)
    let top = base;
    for (const [x, h, w] of list){
      let dx = Math.abs(u - x); if (dx > .5) dx = 1 - dx; if (dx >= w) continue;
      const f = 1 - dx / w;                    // 0 at the edge of the crown, 1 on the trunk line
      const tier = .18 * (1 - ((f * 6) % 1));  // branch tiers notch the outline
      const y = base - h * Math.max(0, f - tier * (1 - f));
      if (y < top) top = y;
    }
    return top;

    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'habataki.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
let lastT = 0, drift = [0, 0, 0];
const STATE = { cam:1, dev:0, birds:0, spawned:0, total:0 };
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  const t = now / 1000;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; F.have = false; F.idxKey = ''; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1800 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; F.boxOK = false; }
  ensureField(W, H);
  if (!M.external) segment(now);
  if (M.live && now - M.lastT > 1500) M.live = false;
  if (video.readyState < 2) return;

  const vt = video.currentTime, fresh = vt !== lastVT; lastVT = vt;
  const grabbed = fresh && grab();
  if (fresh){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }

  MODE.X = MODE.on ? Math.min(1.8, MODE.X + dt) : Math.max(0, MODE.X - dt * 2.4);
  const cam = 1 - Math.min(1, MODE.X / .45);
  const dev = Math.max(0, Math.min(1, (MODE.X - .4) / 1.1));
  const live = MODE.on && MODE.X > 1.1 && performance.now() - camT0 > 900;
  const spawned = updateField(dt, grabbed, live);
  STATE.spawned = spawned; STATE.total += spawned;
  if (spawned) flutter(Math.min(.4, spawned / 60));
  if (MODE.on && !MODE.burst && MODE.X > 1.05){ MODE.burst = true; burst(.8); }

  drift[0] += dt * .004; drift[1] += dt * .009; drift[2] += dt * .016;
  const px = F.box.x;
  const p = PALS[S.pal].v;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(PC.p); gl.bindVertexArray(vaoQuad);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texLand);
  gl.uniform1i(PC.U.uVid, 0); gl.uniform1i(PC.U.uMask, 1); gl.uniform1i(PC.U.uLand, 2);
  const sa = W/H, va = vidW/vidH;
  gl.uniform2f(PC.U.uRes, W, H); gl.uniform2f(PC.U.uScale, sa < va ? sa/va : 1, sa < va ? 1 : va/sa);
  gl.uniform1f(PC.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PC.U.uHasMask, M.has ? 1 : 0);
  gl.uniform1f(PC.U.uT, t); gl.uniform1f(PC.U.uCam, cam); gl.uniform1f(PC.U.uDev, dev);
  gl.uniform1f(PC.U.uFace, S.face); gl.uniform1f(PC.U.uForest, S.forest); gl.uniform1f(PC.U.uMist, S.mist); gl.uniform1f(PC.U.uLumMid, F.lumMid);
  gl.uniform4f(PC.U.uBox, F.box.x, F.box.y, F.box.h, F.box.w);
  gl.uniform3fv(PC.U.uPaper, p.paper); gl.uniform3fv(PC.U.uInk, p.ink); gl.uniform3fv(PC.U.uMistC, p.mist); gl.uniform3fv(PC.U.uSkyT, p.skyT); gl.uniform3fv(PC.U.uSkyB, p.skyB); gl.uniform3fv(PC.U.uSun, p.sun);
  gl.uniform3f(PC.U.uDrift, drift[0] - px * .05, drift[1] - px * .14, drift[2] - px * .3);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  const nb = stepBirds(dt, t, !MODE.on);
  STATE.cam = cam; STATE.dev = dev; STATE.birds = nb;
  if (nb && MODE.X > .2){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PB.p); gl.bindVertexArray(vaoBird);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufInst); gl.bufferSubData(gl.ARRAY_BUFFER, 0, BI, 0, nb * 7);
    const Sh = Math.min(W, H); gl.uniform2f(PB.U.uAsp, W / Sh, H / Sh);
    gl.uniform3fv(PB.U.uInk, p.bird);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 21, nb);
    gl.disable(gl.BLEND);
  }
  gl.bindVertexArray(null);

  if (actx && wing){
    flutterLvl *= Math.exp(-dt * 1.6);
    wing.gain.setTargetAtTime(Math.min(.5, flutterLvl * .6 + nb / BMAX * .15) * (MODE.X > .5 ? 1 : 0), actx.currentTime, .08);
    wind.gain.setTargetAtTime(MODE.on ? .1 : 0, actx.currentTime, .6);
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__HABATAKI = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; return ingestMask(d, w, h); },
  state: () => ({ hasMask:M.has, live:M.live, cover:F.cover, vacated:F.vacated, birds:B.n, spawned:STATE.spawned, total:STATE.total,
    box:{ ...F.box }, cam:STATE.cam, dev:STATE.dev, on:MODE.on, X:MODE.X }),
  birdsNear(x, y, r){ let c = 0; for (let i = 0; i < BMAX; i++) if (B.alive[i] && Math.hypot(B.x[i] - x, B.y[i] - y) < r) c++; return c; },
  palette(i){ setPal(i); },
  mode(c){ setMode(!!c); },
  burst(k){ return burst(k == null ? 1 : k); },
};
</script>
