<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<title>SAKEME ─ 裂け目のキャンバス</title>
<meta name="description" content="画面が一枚の真っ赤なキャンバスになる。うしろからあなたの体と手が布を押し、手をすばやく払うとナイフのように切れ目が入る。めくれた縁の奥の暗がりから、あなたがのぞく。">
<meta name="theme-color" content="#9c1219">
<!--
  ══════════════════════════════════════════════════════════════════════════
  SAKEME ─ 裂け目のキャンバス                    ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  元ネタ    ルーチョ・フォンタナ「空間概念 ── 期待」（1958–68）。一色に塗った
            キャンバスに、ナイフで斜めの切れ目を数本。切れ目の縁は内側へめくれ、
            奥は黒い。あわせて、白い壁から人の形が押し出されてくるアニッシュ・
            カプーアの壁の作品と、エンリコ・カステラーニの張りつめた画面。

  最終の一枚  真っ赤なキャンバスに、押し当てた手の形が浮き、斜めの裂け目が三本。
            めくれた縁が光を受け、その奥の暗がりから、あなたの目がのぞく。

  主役      画面は一枚のキャンバス。あなたはその裏側にいる。体と手が布を押すと、
            その形が赤い布に浮き彫りになる。手をすばやく払うと、そこが切れる。

  層        ① キャンバス：一色の絵の具、麻の織り目、刷毛の跡、木枠のふち、左上からの一灯
            ② 布の押し：体はやわらかく、手は指の形まで。ばねのように少し揺れて戻る
            ③ 裂け目：払った軌跡がナイフの線になり、アーモンド形に開いて縁がめくれる。
              光の側の縁は明るく、反対の縁は影。切り口に麻の生地がのぞく
            ④ 奥：切れ目の中だけ、暗がりにいるあなたが見える
            ⑤ 張り替え：新しい布が上から巻き下ろされ、タッカーの音が続く
            ⑥ 音：布を裂く音、張りがゆるむ低い音、ギャラリーの静けさ

  PALETTE   キャンバスは四つ ── 赤 #a8121b・白 #e7e3da・黒 #161514・群青 #1e3479。
            どれも一色。奥は黒。それ以外の色は使わない。

  TYPE      Instrument Serif（イタリック、作品札）と Zen Kaku Gothic New（本文）。

  MOTION    布はゆっくり押され、ゆっくり戻る。切れ目だけが速い。

  TECH      WebGL2。布の高さは低解像度のばねの格子（RGBA16F）。体は MediaPipe
            ImageSegmenter（selfie）の切り抜きをぼかした山、手は HandLandmarker の
            21 点の骨をカプセルにした山。切れ目は三角形の帯を別のバッファへ描き、
            最後の合成で縁のめくれと影を計算する。
  ══════════════════════════════════════════════════════════════════════════
-->

<script type="module">
/* =========================================================
   SAKEME — 裂け目のキャンバス
   ========================================================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];

/* ---------- the four canvases ---------- */
const PALS = [
  { name: '赤', it: 'Rosso', jp: '赤いキャンバス', col: '#a8121b', sheen: 0.04, ui: 'light', bg: '#7e0d13' },

  f2(P, 'uVA', VA_[0], VA_[1]); f2(P, 'uVB', VB_[0], VB_[1]); f2(P, 'uWH', W / S, H / S);
  f4(P, 'uMat', [...p.colF, 0]); f4(P, 'uMatOld', [...po.colF, 0]);
  f1(P, 'uSheen', p.sheen); f1(P, 'uSheenOld', po.sheen); f1(P, 'uRoll', roll); f1(P, 'uT', T); f1(P, 'uLight', lightAmt);
  f1(P, 'uSeed', seed); f1(P, 'uDpr', DPR); f1(P, 'uLive', vw ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- loop ---------- */
let lastUpVT = -1;
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000; let dt = now - lastT; lastT = now; dt = clamp(dt, 0, 0.1);
  if (!running || !PR) return;
  if (TEST.freeze) dt = 0; else if (TEST.dt) dt = TEST.dt;
  if (TEST.budget != null) { if (TEST.budget <= 0) return; TEST.budget--; }   // test: advance exactly N frames
  T += dt; Tnow = TEST.dt ? T : now; TEST.frames++;
  updateVideoMap();
  if (vw && video.readyState >= 2 && video.currentTime !== lastUpVT) {
    lastUpVT = video.currentTime;
    gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch (e) {}
  }
  runSeg(nowMs); runHands(TEST.dt ? T * 1000 : nowMs);
  if (roll >= 0) { roll += dt / 1.25; if (roll >= 1) { roll = -1; palOld = palIdx; cuts = []; label(); } }
  if (dt > 0) stepSim(dt);
  drawSlits(); composite();
  if (shotReq) { shotReq = false; saveShot(); }
}

/* ---------- UI ---------- */
let toastTimer = 0, statusTimer = 0;
function toast(s) { toastEl.textContent = s; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1200); }
function showStatus(s, ms) { clearTimeout(statusTimer); if (s) statusEl.textContent = s; statusEl.classList.toggle('off', !s); if (s && ms) statusTimer = setTimeout(() => statusEl.classList.add('off'), ms); }
function applyUi() {
  const p = PALS[palIdx], r = document.documentElement.style;
  if (p.ui === 'dark') { r.setProperty('--ui-ink', '#231e1c'); r.setProperty('--ui-bg', 'rgba(255,255,255,.35)'); r.setProperty('--ui-line', 'rgba(35,30,28,.25)'); }
  else { r.setProperty('--ui-ink', '#f4efe9'); r.setProperty('--ui-bg', 'rgba(20,8,8,.32)'); r.setProperty('--ui-line', 'rgba(244,239,233,.28)'); }
  document.body.style.background = p.bg;
  $('pal').textContent = '■ ' + p.name;
  label();
}
/* a fresh canvas is rolled down over the old one */
function restretch(next) {
  if (roll >= 0) return;
  for (const h of [...HANDS, PTR]) if (h.cut) endCut(h);
  palOld = palIdx; if (next != null) palIdx = next;
  roll = 0; seed = Math.random() * 10; AE.roll(); applyUi();
  toast(PALS[palIdx].it);
}
$('pal').onclick = () => restretch((palIdx + 1) % PALS.length);
$('fresh').onclick = () => restretch(null);
const panel = $('panel');
$('gear').onclick = () => { panel.hidden = !panel.hidden; $('gear').setAttribute('aria-expanded', String(!panel.hidden)); };
$('panelX').onclick = () => { panel.hidden = true; $('gear').setAttribute('aria-expanded', 'false'); };
$('sCut').oninput = e => { cutEase = +e.target.value; };
$('sBody').oninput = e => { bodyAmt = +e.target.value; };
$('sHand').oninput = e => { handAmt = +e.target.value; };
$('sLight').oninput = e => { lightAmt = +e.target.value; };
const tog = (id, on, a, b) => { const el = $(id); el.classList.toggle('on', on); el.textContent = on ? a : b; };
$('bSound').onclick = () => { soundOn = !soundOn; tog('bSound', soundOn, '音：入', '音：切'); if (soundOn) AE.init(); AE.level(); };
const fsBtn = $('bFs');
if (!document.documentElement.requestFullscreen) fsBtn.style.display = 'none';
else fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$('shot').onclick = () => { shotReq = true; };
function saveShot() {
  try {
    cv.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'sakeme_' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }, 'image/png');
    toast('saved');
  } catch (e) { toast('保存できませんでした'); }
}
let mr = null, chunks = [];
$('rec').onclick = () => {
  const b = $('rec');
  if (mr && mr.state === 'recording') { mr.stop(); return; }
  AE.init();
  const tracks = [...cv.captureStream(30).getVideoTracks()];
  if (AE.recDest) tracks.push(...AE.recDest.stream.getAudioTracks());
  const ms = new MediaStream(tracks);
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const mt = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  try { mr = new MediaRecorder(ms, mt ? { mimeType: mt, videoBitsPerSecond: 6e6 } : {}); }
  catch (err) { toast('録画を開始できませんでした'); return; }
  chunks = []; mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  mr.onstop = () => {
    b.classList.remove('act'); b.innerHTML = '●<span class="t"> REC</span>';
    const blob = new Blob(chunks, { type: mr.mimeType || 'video/mp4' }); const ext = (mr.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sakeme_' + Date.now() + '.' + ext;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  };
  mr.start(1000); b.classList.add('act'); b.innerHTML = '■<span class="t"> STOP</span>';
};
addEventListener('keydown', e => {
  if (!running) return; const k = e.key.toLowerCase();
  if (k === 'c') restretch((palIdx + 1) % PALS.length); else if (k === 'r') restretch(null); else if (k === 's') shotReq = true;
});
addEventListener('resize', resize);

function camErrText(e) {
  const m = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  return 'カメラを起動できませんでした：' + m + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
async function startCam() {
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  /* get the new stream first, so a failed flip keeps the old camera running */
  const s2 = await md.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s2; video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  await new Promise(r => { if (video.videoWidth) r(); else { video.onloadedmetadata = () => r(); setTimeout(r, 3000); } });
  mirror = facing === 'user'; lastUpVT = -1; maskOK = false; if (maskF.length) maskF.fill(0);
  for (const h of HANDS) loseHand(h, performance.now());
  updateVideoMap();
}
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); toast(facing === 'user' ? '前のカメラ' : '後ろのカメラ'); }
  catch (e) { facing = prev; toast('切り替えられませんでした'); console.warn(camErrText(e)); }
};
$('go').onclick = async () => {
  const btn = $('go'); btn.disabled = true; $('err').textContent = 'カメラを起動しています…';
  AE.init();
  try { if (!PR) initGL(); resize(); }
  catch (e) { $('err').textContent = '描画の準備に失敗しました：' + (e && e.message ? e.message.split('\n')[0] : e); console.error(e); btn.disabled = false; return; }
  try { await startCam(); }
  catch (e) { $('err').textContent = camErrText(e); btn.disabled = false; btn.textContent = 'もう一度'; return; }
  $('start').classList.add('hide'); $('ui').classList.add('on'); $('label').classList.add('on'); $('err').textContent = '';
  running = true; T = 0; lastT = performance.now() / 1000; applyUi();
  showStatus('手を近づけると布が押される。すばやく払うと、切れる', 6500);
  if (!handLm && !mpErr) initMP();
};

requestAnimationFrame(frame);
/* test hook (local checks only) */
window.__sakeme = {
  state: () => ({ running, maskOK, hands: !!handLm, seg: !!segmenter, mpErr, float: useFloat, T, cuts: cuts.map(c => ({ live: c.live, len: c.fit && c.fit.len })), roll, pal: palIdx,
    handOn: HANDS.map(h => h.on), speed: HANDS.map(h => +h.speed.toFixed(2)) }),
  /* a cut from (ax,ay) to (bx,by) through (mx,my), in screen fractions, made over dur seconds of test time */
  slash: (ax, ay, bx, by, mx, my, dur = 0.25) => {
    const t0 = Tnow - dur, A = [ax * W, ay * H, t0], B = [bx * W, by * H, Tnow], M = [(mx != null ? mx : (ax + bx) / 2) * W, (my != null ? my : (ay + by) / 2) * H, t0 + dur / 2];
    const c = { raw: [A, M, B], t0, live: false, closeT: -1, fit: null }; fitCut(c); cuts.push(c); label(); AE.thump(c.fit.len / S); return c.fit.len / S;
  },
  restretch: i => restretch(i), set: o => { if (o.light != null) lightAmt = o.light; if (o.body != null) bodyAmt = o.body; if (o.seed != null) seed = o.seed; if (o.pal != null) { palIdx = palOld = o.pal; applyUi(); } },
  TEST, T: () => T,
};
</script>
