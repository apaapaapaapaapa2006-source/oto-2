<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<meta name="description" content="映った人が映写機にかかった古いフィルムになる。動いたところからフィルムが熱で焦げ、泡立って白く焼け抜け、やがて冷えて元に戻る。すばやく動くとコマが滑り、タップした場所に火が入る。撮影と録画ができる。">
<meta name="theme-color" content="#0b0806">
<title>KOGASHI ─ 映写機の中で焦げるフィルム</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  KOGASHI 焦がし ─ 映写機の中で焦げるフィルム          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  REFERENCE  ベルイマン『仮面／ペルソナ』（1966）冒頭の、映写機のゲートで
             フィルムが止まり焼け抜ける場面。MV のフィルムバーン転換。
             CineStill のハレーション（ハイライトに赤い滲み）。
  MOOD       暗い試写室。あなたは粒子の粗い温黒調のモノクロ映画の中にいて、
             画は 24 コマで瞬き、ゲートの中で少し揺れている。動いたところだけ
             セルロイドに熱が溜まり、茶色く焦げ、ぶくぶくと泡立ち、琥珀色に
             光る縁をつれて白い穴が開く。止まれば穴は冷えて閉じ、映画は続く。
  PALETTE    PRINT（既定）温黒調：影 #0f0b08・紙白 #f3e7d2・焦げ #7a4320・
                         縁の火 #ff8a1e・抜けた光 #fff4e2
             NITRATE 冷たい銀：影 #07090b・光 #e6ecef・焦げ #5a2f2a・縁 #ff5a2a
             EKTA    褪せたカラー（影はシアンに、光はマゼンタに寄る）
             三色まで。原色は焦げの縁だけ。
  TYPE       Sorts Mill Goudy（イタリック、字幕の題字）＋ Kaisei Opti（和文）。
             フィルムの縁には等幅のエッジ印字。
  MOTION     24 コマで瞬く明滅とゲートの揺れ。動きは焦げとして画に溜まり、
             泡と縁の火を経て白く抜け、数秒かけて冷えて閉じる。
             すばやく大きく動くとコマが一枚ぶん滑り、枠線が画面を通り過ぎる。
             切り替えは映写機のランプが数回瞬いて点き、コマが上から降りてきて止まる。
  SIGNATURE  動いた軌跡がそのままフィルムに焼き穴として残る。
  LAYERS     ① 温黒調の粒子・明滅・ゲートの揺れ・傷と埃・周辺減光
             ② 焦げの場：動きが熱になり、熱が広がり、燃えた所が周りを焦がす
             ③ 焼け抜け：焦げ→泡（ブリスター）→光る縁→白い穴、熱で画が歪む
             ④ ハレーション：明るい所と穴のまわりが赤く滲む
             ⑤ コマ滑り：すばやい動きで枠線が通り過ぎる。タップで火を入れる
             ⑥ フィルムの縁：パーフォレーションとエッジ印字（調整で消せる）
             ⑦ 版：PRINT / NITRATE / EKTA。映写機の音と焦げる音
  TECH       WebGL2。焦げの場は長辺 160 の格子で CPU が計算
             （熱の拡散・冷却・燃料・損傷・回復）、RGBA8 のテクスチャで渡す。
             描画はフィルム → 1/4 → 1/16 の縮小ぼかし → 合成の三段。
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
'use strict';
/* =====================================================================
   KOGASHI — you, as a print running through a projector that is too hot.
   CPU: a 160-cell burn field (heat · fuel · damage) fed by your motion.
   GPU: film grade + burn shading → ¼ → 1/16 blur → halation composite.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');
const S = { stock:0, sens:.55, spread:.5, heal:.45, grain:.55, weave:.5, hal:.5, bg:.45, vol:.35, edge:true, scratch:true };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS_FILM = `#version 300 es
precision highp float;

vec2 cell(vec2 p){ vec2 i = floor(p), f = fract(p); float d = 9., e = 9.;

  col = mix(col, lamp * (1.02 + .08 * uFlick) - vec3(.05, .07, .09) * (1. - smoothstep(.55, .9, b)) + l * .05, hole);
  col *= frameLine;

  col = mix(col, vec3(1., .95, .86) * uFlash, clamp(uFlash, 0., 1.) * .9);
  o = vec4(col, 1.);
}`;
const FS_DOWN = `#version 300 es
precision highp float;
uniform sampler2D uT; uniform vec2 uTex; out vec4 o;
void main(){ vec2 u = gl_FragCoord.xy * 2. * uTex;
  vec2 d = uTex * 1.5;
  o = .25 * (texture(uT, u + vec2(-d.x, -d.y)) + texture(uT, u + vec2(d.x, -d.y)) + texture(uT, u + vec2(-d.x, d.y)) + texture(uT, u + vec2(d.x, d.y))); }`;
const FS_COMP = `#version 300 es
precision highp float;
uniform sampler2D uA, uB, uC, uEdgeT;
uniform vec2 uRes; uniform float uHal, uFilm, uEdge, uRoll, uStock, uT;
out vec4 o;
void main(){

  vec3 halC = (uStock > 1.5) ? vec3(1., .3, .2) : (uStock > .5 ? vec3(1., .32, .22) : vec3(1., .42, .16));

    float ew = sh * .052, x = gl_FragCoord.x, xr = uRes.x - x;

        base += vec3(.75, .5, .25) * ink * .55 * step(side, ew * .3);

let PF, PD, PC, vao, texVid, texSim, texEdge;
const FB = { key:'', A:null, B:null, C:null };

/* ---------- the burn field ---------- */
const ana = document.createElement('canvas'), actx2 = ana.getContext('2d', { willReadFrequently:true });

function allocField(w, h){

  F.H = new Float32Array(F.n); F.Hn = new Float32Array(F.n); F.D = new Float32Array(F.n); F.fuel = new Float32Array(F.n).fill(1);
  F.th = new Float32Array(F.n); F.Lp = new Float32Array(F.n); F.mk = new Float32Array(F.n); F.mkP = new Float32Array(F.n);
  F.bytes = new Uint8Array(F.n * 4); F.have = false; F.idxKey = '';

    const v = Math.sin(x * .37 + y * .11) * .5 + Math.sin(x * .13 - y * .29 + 1.7) * .5;

const SCR = { W:1, H:1 };
let vidW = 1280, vidH = 720, mirror = true;
function coverK(){ const sa = SCR.W / SCR.H, va = vidW / vidH; return sa > va ? [1, va / sa] : [sa / va, 1]; }

const IGN = [];                         // pending ignitions from taps {x,y} in 0..1 screen
function stepField(dt, live, useMask){
  const w = F.w, h = F.h, n = F.n, H = F.H, Hn = F.Hn, D = F.D, fuel = F.fuel;

  const [kx, ky] = coverK();
  actx2.setTransform(1, 0, 0, 1, 0, 0);

  if (mirror){ actx2.translate(w, 0); actx2.scale(-1, 1); }

  actx2.setTransform(1, 0, 0, 1, 0, 0);

  if (useMask){ maskIndex(M.w, M.h); for (let i = 0; i < n; i++) mk[i] = M.f[F.idx[i]]; }

/* ---------- segmentation ---------- */
const M = { f:null, w:0, h:0, has:false, live:false, lastT:0, external:false };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || !(w * h <= 4e6) || data.length < w * h) return false;
  if (M.w !== w || M.h !== h || !M.f){ M.w = w; M.h = h; M.f = new Float32Array(w * h); F.idxKey = ''; }
  for (let i = 0, n = w * h; i < n; i++){ let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1; M.f[i] = m; }
  M.has = true; M.live = true; M.lastT = performance.now();
  return true;
}
let segmenter = null, segFailed = false, lastTs = 0, lastSegVT = -1;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const so = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, so('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, so('CPU')); }
    setStatus('');
  }catch(e){
    if (M.external) return;
    segFailed = true;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n画面全体の動きで焦がして続けます。');
  }
}
function detect(now){
  if (!segmenter || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastSegVT) return; lastSegVT = vt;
  const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
  try{
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks; if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1]; ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
    });
  }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', started = false;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  F.idxKey = ''; resetField();
}

/* ---------- audio: the projector, and the crackle of the burn ---------- */
let actx = null, bus = null, recDest = null, proj = null, crk = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try{
    actx = new AC(); bus = actx.createGain(); bus.connect(actx.destination);
    recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
    const sr = actx.sampleRate;
    // one second of a 24-frame claw: a click and a soft thump each frame
    const pb = actx.createBuffer(1, sr, sr), pd = pb.getChannelData(0);
    for (let k = 0; k < 24; k++){
      const s0 = Math.round(k * sr / 24);
      for (let i = 0; i < sr * .018 && s0 + i < sr; i++){
        const e = Math.exp(-i / (sr * .003)), e2 = Math.exp(-i / (sr * .008));
        pd[s0 + i] += (Math.random() * 2 - 1) * e * .8 + Math.sin(i / sr * 2 * Math.PI * 95) * e2 * .5;
      }
    }
    for (let i = 0; i < sr; i++) pd[i] += (Math.random() * 2 - 1) * .03;
    const ps = actx.createBufferSource(); ps.buffer = pb; ps.loop = true;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    proj = actx.createGain(); proj.gain.value = 0; ps.connect(lp); lp.connect(proj); proj.connect(bus); ps.start();
    // crackle: sparse sharp pops
    const cb = actx.createBuffer(1, sr * 2, sr), cd = cb.getChannelData(0);
    for (let k = 0; k < 160; k++){
      const s0 = (Math.random() * (sr * 2 - 400)) | 0, a = .3 + Math.random() * .7;
      for (let i = 0; i < 300; i++) cd[s0 + i] += (Math.random() * 2 - 1) * a * Math.exp(-i / 40);
    }
    const cs = actx.createBufferSource(); cs.buffer = cb; cs.loop = true;
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    crk = actx.createGain(); crk.gain.value = 0; cs.connect(hp); hp.connect(crk); crk.connect(bus); cs.start();
    actx.resume().catch(()=>{});
  }catch(e){ actx = null; }
}
function sfx(kind){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, len = kind === 'ignite' ? .9 : .35;
  const b = actx.createBuffer(1, Math.round(actx.sampleRate * len), actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'lowpass';
  const g = actx.createGain();
  if (kind === 'ignite'){ f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + .25); f.frequency.exponentialRampToValueAtTime(500, t + .9); }
  else { f.frequency.value = kind === 'slip' ? 1400 : 2200; }
  const pk = (kind === 'ignite' ? .3 : .16) * (.3 + S.vol);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + (kind === 'ignite' ? .12 : .01)); g.gain.exponentialRampToValueAtTime(.0001, t + len);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t);
}

/* ---------- mode, slip, stock ---------- */
const MODE = { on:false, X:0 };
const SLIP = { t:-1, dur:.55, cool:0, armed:true };
function setMode(on){
  if (on === MODE.on) return;
  MODE.on = on;
  $('mode').textContent = on ? '◂ camera' : '▸ Kogashi';
  document.body.classList.toggle('cam', !on);
  ['stock','slip'].forEach(id => $(id).style.visibility = on ? 'visible' : 'hidden');
  if (!on){ SLIP.t = -1; }
  sfx(on ? 'on' : 'off');
}
function slip(){
  if (!MODE.on || MODE.X < 1.4 || SLIP.t >= 0) return false;
  SLIP.t = 0; sfx('slip'); return true;
}
function ignite(x, y){
  if (!MODE.on || MODE.X < 1.4 || !Number.isFinite(x) || !Number.isFinite(y)) return false;
  IGN.push({ x:Math.max(0, Math.min(1, x)), y:Math.max(0, Math.min(1, y)) }); sfx('ignite'); return true;
}
function setStock(i){
  S.stock = ((i % 3) + 3) % 3;
  [...$('stocks').children].forEach(x => x.classList.toggle('on', +x.dataset.s === S.stock));
}

/* ---------- UI ---------- */
$('mode').onclick = () => setMode(!MODE.on);
addEventListener('keydown', e => {
  if (!started || document.activeElement.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); setMode(!MODE.on); }
  else if (e.key === 's') setStock(S.stock + 1);
  else if (e.key === 'r') slip();
});
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!PF) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','stock','slip','mode'].forEach(id => $(id).classList.add('show'));
  MODE.on = true; setMode(false);
  if (!started){ started = true; initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('stock').onclick = () => setStock(S.stock + 1);
$('slip').onclick = () => slip();
$('stocks').onclick = e => { const b = e.target.closest('button'); if (b) setStock(+b.dataset.s); };
[['sSens','sens'],['sSpread','spread'],['sHeal','heal'],['sGrain','grain'],['sWeave','weave'],['sHal','hal'],['sBg','bg'],['sVol','vol']]
  .forEach(([id, k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });
$('tEdge').onclick = e => { S.edge = !S.edge; e.target.classList.toggle('on', S.edge); };
$('tScratch').onclick = e => { S.scratch = !S.scratch; e.target.classList.toggle('on', S.scratch); };
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 12 && performance.now() - down.t < 600){
    const r = canvas.getBoundingClientRect(); ignite((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  }
  down = null;
});
$('shoot').onclick = () => {
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'kogashi-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● rec';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'kogashi.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ stop';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
let lastT = 0, lastVT = -1, lastFieldT = 0;
const FILM = { frame:-1, seed:0, flick:1, wx:0, wy:0, tx:0, ty:0, scr:new Float32Array([-1,-1,-1,-1]), scrLife:[0,0,0,0] };
const TEST = { hold:null };
function filmClock(t){
  const fr = Math.floor(t * 24);
  if (fr === FILM.frame) return;
  FILM.frame = fr;
  FILM.seed = (fr * 13.37) % 997;
  const wv = S.weave;
  FILM.flick = 1 - wv * (.03 + .05 * Math.random()) + (Math.random() < .02 ? -.12 * wv : 0);
  if (Math.random() < .12){ FILM.tx = (Math.random() - .5) * .006 * wv; FILM.ty = (Math.random() - .5) * .009 * wv; }
  FILM.wx += (FILM.tx - FILM.wx) * .35; FILM.wy += (FILM.ty - FILM.wy) * .35;
  for (let i = 0; i < 4; i++){
    if (FILM.scrLife[i] > 0){ FILM.scrLife[i]--; FILM.scr[i] += (Math.random() - .5) * .002; }
    else if (Math.random() < (i === 0 ? .01 : .03)){ FILM.scrLife[i] = 6 + (Math.random() * 40 | 0); FILM.scr[i] = Math.random(); }
    else FILM.scr[i] = -1;
  }
}
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.5, (now - lastT) / 1000) : 1 / 60; lastT = now;
  const t = now / 1000;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  const kk = Math.min(1, 1600 / Math.max(W, H)); W = Math.round(W * kk); H = Math.round(H * kk);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  SCR.W = W; SCR.H = H;
  const fw = W >= H ? 160 : Math.max(40, Math.round(160 * W / H)), fh = W >= H ? Math.max(40, Math.round(160 * H / W)) : 160;
  if (fw !== F.w || fh !== F.h) allocField(fw, fh);
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; F.idxKey = ''; }
  ensureTargets(W, H);
  if (!M.external) detect(now);
  if (M.live && now - M.lastT > 1500){ M.live = false; F.have = false; SLIP.armed = true; }       // tracking lost: nothing new burns
  if (video.readyState < 2) return;
  MODE.X = MODE.on ? Math.min(2, MODE.X + dt) : Math.max(0, MODE.X - dt * 1.6);
  if (TEST.hold !== null) MODE.X = TEST.hold;
  const X = MODE.X;
  const vt = video.currentTime, fresh = vt !== lastVT; lastVT = vt;
  if (fresh){
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){}
  }
  const live = (M.has && M.live) || segFailed, useMask = M.has && M.live && !segFailed;
  if (fresh && X > .3){
    const dtf = lastFieldT ? Math.min(.25, Math.max(.01, t - lastFieldT)) : 1 / 30; lastFieldT = t;
    stepField(dtf, live && X > 1.4, useMask);
    // a sharp, big move makes the frame slip once
    if (F.seedMean > .1 && SLIP.armed && t > SLIP.cool){ if (slip()){ SLIP.cool = t + 3.5; SLIP.armed = false; } }
    if (F.seedMean < .03) SLIP.armed = true;
    if (proj && actx){
      proj.gain.setTargetAtTime(X > .5 ? .07 * S.vol : 0, actx.currentTime, .15);
      crk.gain.setTargetAtTime(Math.min(1, F.burnArea * 12 + F.heatMean * 2) * .5 * S.vol * (X > 1 ? 1 : 0), actx.currentTime, .1);
    }
  } else if (X <= .3) lastFieldT = 0;
  if (SLIP.t >= 0){ SLIP.t += dt; if (SLIP.t > SLIP.dur) SLIP.t = -1; }
  filmClock(t);
  // the switch: lamp blinks on, the frame rolls down into the gate
  let film = X > 0 ? 1 : 0, flash = 0, roll = 0;
  if (X > 0 && X < .45){ const k = Math.floor(X / .075); flash = k % 2 ? 0 : .9 * (1 - X / .45); film = X > .15 ? 1 : 0; }
  if (X > 0 && X < 1.2){ const u = Math.max(0, (X - .15) / 1.05); roll = (1 - (1 - Math.pow(1 - u, 3))) * 1.6; }
  if (SLIP.t >= 0){ const u = SLIP.t / SLIP.dur; roll += 1 - (1 - Math.pow(1 - u, 2)); if (u >= 1) roll = 0; }
  if (roll >= .999 || roll <= .001) roll = 0;
  const [kx, ky] = coverK();
  // pass 1: film
  gl.bindVertexArray(vao);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.A.f); gl.viewport(0, 0, W, H);
  gl.useProgram(PF.p); const U = PF.U;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid); gl.uniform1i(U.uVid, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texSim); gl.uniform1i(U.uSim, 1);
  gl.uniform2f(U.uRes, W, H); gl.uniform2f(U.uK, kx, ky); gl.uniform2f(U.uSimRes, F.w, F.h);
  gl.uniform2f(U.uWeave, film ? FILM.wx : 0, film ? FILM.wy : 0);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uRoll, film ? roll : 0);
  gl.uniform1f(U.uFlick, FILM.flick); gl.uniform1f(U.uT, t); gl.uniform1f(U.uSeed, FILM.seed);
  gl.uniform1f(U.uGrain, S.grain); gl.uniform1f(U.uBg, S.bg); gl.uniform1f(U.uFilm, film); gl.uniform1f(U.uFlash, flash);
  gl.uniform1f(U.uStock, S.stock); gl.uniform1f(U.uScratch, S.scratch ? 1 : 0); gl.uniform1f(U.uWarp, 1);
  gl.uniform4fv(U.uScr, FILM.scr);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // pass 2: blur pyramid
  gl.useProgram(PD.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.B.f); gl.viewport(0, 0, FB.B.w, FB.B.h);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.A.t); gl.uniform1i(PD.U.uT, 0);
  gl.uniform2f(PD.U.uTex, 1 / (FB.B.w * 2), 1 / (FB.B.h * 2));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.C.f); gl.viewport(0, 0, FB.C.w, FB.C.h);
  gl.bindTexture(gl.TEXTURE_2D, FB.B.t); gl.uniform2f(PD.U.uTex, 1 / (FB.C.w * 2), 1 / (FB.C.h * 2));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // pass 3: composite
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(PC.p); const C = PC.U;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.A.t); gl.uniform1i(C.uA, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, FB.B.t); gl.uniform1i(C.uB, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, FB.C.t); gl.uniform1i(C.uC, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texEdge); gl.uniform1i(C.uEdgeT, 3);
  gl.uniform2f(C.uRes, W, H); gl.uniform1f(C.uHal, S.hal); gl.uniform1f(C.uFilm, film);
  gl.uniform1f(C.uEdge, S.edge && film ? 1 : 0); gl.uniform1f(C.uRoll, film ? roll : 0); gl.uniform1f(C.uStock, S.stock); gl.uniform1f(C.uT, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- test hook (used by the local Playwright check only) ---------- */
window.__kogashi = {
  feedMask(arr, w, h){ M.external = true; return ingestMask(arr, w, h); },
  feedFaces(){ return 0; },
  setMode, setStock, slip, ignite, hold(x){ TEST.hold = x; },
  set(k, v){ S[k] = v; },
  state(){ return { mode:MODE.on, X:MODE.X, live:M.live, seed:F.seedMean, burn:F.burnArea, heat:F.heatMean, slip:SLIP.t, w:F.w, h:F.h }; },
  heatAt(fx, fy){ if (!F.n) return 0; const x = Math.max(0, Math.min(F.w - 1, (fx * F.w) | 0)), y = Math.max(0, Math.min(F.h - 1, (fy * F.h) | 0)), i = y * F.w + x; return F.H[i] + F.D[i]; },
};
</script>
