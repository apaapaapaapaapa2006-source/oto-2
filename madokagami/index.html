<title>MADOKAGAMI ─ 手と顔が、窓になる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  MADOKAGAMI 窓鏡 ─ 手と顔が、窓になる                ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      誰かのデスクトップを覗き込んでいる。青空と丘の、あの見慣れた
            壁紙の上で、自分のカメラのプレビュー窓が野生化して増えつづけ
            ている。一枚ずつは見慣れた OS のチロム（信号機ボタン・タイ
            トルバー・角丸・影）そのものなので不気味さは無く、ただ数が
            異常なだけ。中身はどの窓も嘘のない「いまのあなた」で、顔の
            周りには Face・FaceTime・Portrait・Photo Booth・Camera の
            名を持つ窓が、手の周りには Hand・Preview・IMG_2041・Finder・
            Untitled の名を持つ窓が群れて憑いてくる。

  PALETTE   窓          #e6e6e9〜#d9d9dd  本物のウィンドウ・クローム。
                                          このガラリー唯一、発光もネオンも
                                          持たない「素材そのものの色」。
             信号機       #ff5f57 / #febc2e / #28c840  赤・黄・緑の三点。
             壁紙・空      #2a67d0 → #bfe0fa  Bliss 型の青空グラデーション。
             壁紙・丘      #7ccb43 → #2b7a1c  二段の緑の丘。
             操作パネル    rgba(28,30,36,.72) 内のガラス。窓の外の唯一の
                                          「本物ではない」層で、意図して
                                          別の質感にしてある。
             MOOD LINE: 発光ゼロの、彩度低めで硬い正午の光。このガラリー
             の他作品が夜のネオンや灯りで語るのに対し、ここだけ蛍光灯の
             下のオフィスの明るさで語る。

  BACKGROUND  Windows のありふれた壁紙（丘と青空）の上に、macOS のウィン
              ドウ・クロームが浮く────OS をまたいだ小さな悪ふざけ。壁紙は
              「camera」に切り替えるとうっすら透けたライブ映像に、「dark」
              にすると窓だけが宙に浮く。

  TYPE      system-ui / -apple-system / Hiragino Sans / Segoe UI のみ。
            このガラリーで唯一 Google Fonts を読み込まない作品──窓の中の
            文字は本物の OS が使う書体でなければ、本物のウィンドウに見え
            ないため。これは手抜きではなく、この技法の要件。

  MOTION    窓は一枚ずつ独立したばね（k・減衰・目標）で追いかけるので、
            速く動けば群れが伸び、止まれば几帳面にキュッと収まる。配置は
            ホルトン数列（低差異列）で散らしてあるので、何十枚あっても
            重なりが偏らない。群れの1割ほどは「エコー」── 検出枠そのもの
            を大きく映す窓で、群れの輪郭を教える役。

  SIGNATURE  窓の中身は本物のクロップ映像で、顔や手の同じ場所を同じ窓が
            律儀に映しつづける。だから群れ全体が、たくさんの小さな鏡の
            破片のように、いまのあなたを再構成している。

  GESTURE   顔を見せれば顔の群れが、手を見せれば手ごとの群れが独立して
            憑く（最大2手）。動けば窓が遅れてついてくる（追従のゆるさで
            調整）。操作パネルの「並べ直す」で配置を撒き直せる。

  TECHNICAL SIGNATURE  MediaPipe Tasks Vision の FaceLandmarker /
            HandLandmarker で顔と手それぞれの外接矩形を求め、各窓は矩形
            内のホルトン数列座標を自分の定位置として持つ──だから同じ窓は
            毎フレーム同じ場所（＝顔や手の同じパーツ）を映しつづける。
  ══════════════════════════════════════════════════════════════════════════
-->
<style>

<body>

<script type="module">
// tasks-vision is imported dynamically inside init(), not as a static
// top-level import: a static import that fails to fetch (CDN outage,
// blocked network) would kill this whole module silently before any of
// our own event listeners or error handling ever runs. A dynamic import
// inside the existing try/catch surfaces the same failure through the
// house's normal camera-error message instead.
let FilesetResolver, HandLandmarker, FaceLandmarker;
const VISION_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const HAND_MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const FACE_MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d'), video = $('v');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- settings ---------- */
const S = { nFace: 26, nHand: 16, size: 1, lag: 0.5, bg: 'bliss', showBox: false, sound: true };

/* ---------- audio: small, real, optional ----------
   窓が一枚も鳴らないのは寂しいので、群れが「憑いた」瞬間にだけ
   ごく短いガラスのクリック音を鳴らす。付け足しのBGMは無い。 */
let actx = null, master = null;
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = 0.18; master.connect(actx.destination);
}
function pop(freq, dur) {
  if (!S.sound || !actx || actx.state !== 'running') return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t0); osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.55), t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(1, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function popFace() { pop(720, 0.14); }
function popHand() { pop(520, 0.11); }
function popShuffle() { pop(880, 0.08); setTimeout(() => pop(660, 0.08), 40); }

/* ---------- canvas ---------- */
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

/* video (cover fit) -> screen mapping. mirror follows the active camera:
   front camera mirrors (matches what you see in a real mirror), a rear
   camera does not (matches what other people see). */
let map = null, mirror = true;
function computeMap() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const sc = Math.max(W / vw, H / vh);
  const dw = vw * sc, dh = vh * sc;
  return { vw, vh, dw, dh, ox: (W - dw) / 2, oy: (H - dh) / 2 };
}
// normalized video rect -> screen rect
function toScreen(nx, ny, nw, nh) {
  const x = mirror ? (1 - (nx + nw)) : nx;
  return { x: map.ox + x * map.dw, y: map.oy + ny * map.dh, w: nw * map.dw, h: nh * map.dh };
}
function clampRect(x, y, w, h) {
  const x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(1, x + w), y1 = Math.min(1, y + h);
  return [x0, y0, Math.max(0.002, x1 - x0), Math.max(0.002, y1 - y0)];
}

/* ---------- groups & panels ---------- */
const mkGroup = name => ({ name, active: false, last: 0, box: { x: .3, y: .3, w: .4, h: .4 }, panels: [] });
const groups = { face: mkGroup('face'), h0: mkGroup('h0'), h1: mkGroup('h1') };
let allPanels = [];

const TITLES = {
  face: ['Face', 'FaceTime', 'Portrait', 'Photo Booth', 'Camera'],
  hand: ['Hand', 'Preview', 'IMG_2041', 'Finder', 'Untitled']
};
function halton(i, b) { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }

function buildGroup(g, kind, n) {
  const arr = [];
  const off = Math.floor(Math.random() * 60);
  const nEcho = Math.round(n * 0.12);
  for (let i = 0; i < n; i++) {
    const echo = i >= n - nEcho;
    const w = clamp((0.2 + Math.random() * 0.4) * S.size, 0.08, 1);
    const h = clamp((0.2 + Math.random() * 0.4) * S.size, 0.08, 1);
    const cu = halton(i + 1 + off, 2), cv = halton(i + 1 + off, 3);
    const titles = TITLES[kind];
    arr.push({
      g, echo,
      u: clamp(cu - w / 2, 0, 1 - w), v: clamp(cv - h / 2, 0, 1 - h), rw: w, rh: h,
      pop: 0.9 + Math.random() * 0.24,
      eScale: 0.28 + Math.random() * 0.22,
      eox: (Math.random() * 2 - 1) * 0.95, eoy: (Math.random() * 2 - 1) * 0.95,
      k: 0.05 + Math.random() * 0.12, damp: 0.78 + Math.random() * 0.08,
      z: Math.random() + (kind === 'hand' ? 0.35 : 0),
      wob: 1.5 + Math.random() * 6, phase: Math.random() * 6.28, spd: 0.5 + Math.random() * 1.1,
      title: titles[Math.floor(Math.random() * titles.length)],
      x: 0, y: 0, w: 4, h: 4, vx: 0, vy: 0, vw: 0, vh: 0, alpha: 0, rot: 0,
      src: [0, 0, 1, 1]
    });
  }
  return arr;
}
function buildAll() {
  groups.face.panels = buildGroup(groups.face, 'face', S.nFace);
  groups.h0.panels = buildGroup(groups.h0, 'hand', S.nHand);
  groups.h1.panels = buildGroup(groups.h1, 'hand', S.nHand);
  allPanels = [...groups.face.panels, ...groups.h0.panels, ...groups.h1.panels].sort((a, b) => a.z - b.z);
  for (const k in groups) if (groups[k].active) spawn(groups[k]);
}
function spawn(g) {
  if (!map) return;
  const r = toScreen(g.box.x, g.box.y, g.box.w, g.box.h);
  for (const p of g.panels) {
    p.x = r.x + r.w / 2; p.y = r.y + r.h / 2; p.w = 4; p.h = 4; p.vx = p.vy = p.vw = p.vh = 0; p.alpha = 0; p.rot = 0;
  }
}

/* ---------- detection -> boxes ---------- */
function bboxOf(lm, pad) {
  if (!lm || !lm.length) return null;
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (const p of lm) {
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' || !isFinite(p.x) || !isFinite(p.y)) continue;
    if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y;
  }
  if (x1 < x0 || y1 < y0) return null;
  const w = x1 - x0, h = y1 - y0;
  x0 -= w * pad; x1 += w * pad; y0 -= h * pad; y1 += h * pad;
  x0 = clamp(x0, 0, 1); y0 = clamp(y0, 0, 1); x1 = clamp(x1, 0, 1); y1 = clamp(y1, 0, 1);
  return { x: x0, y: y0, w: Math.max(0.02, x1 - x0), h: Math.max(0.02, y1 - y0) };
}
function setBox(g, b, now) {
  if (!g.active) {
    g.box = { ...b }; g.active = true; g.last = now; spawn(g);
    if (g === groups.face) popFace(); else popHand();
    return;
  }
  const a = 0.55;
  g.box.x += (b.x - g.box.x) * a; g.box.y += (b.y - g.box.y) * a;
  g.box.w += (b.w - g.box.w) * a; g.box.h += (b.h - g.box.h) * a;
  g.last = now;
}
const cdist = (a, b) => Math.hypot(a.x + a.w / 2 - b.x - b.w / 2, a.y + a.h / 2 - b.y - b.h / 2);
function updateHands(dets, now) {
  const trackers = [groups.h0, groups.h1];
  const pairs = [];
  trackers.forEach((g, ti) => { if (g.active) dets.forEach((b, di) => pairs.push([cdist(g.box, b), ti, di])); });
  pairs.sort((a, b) => a[0] - b[0]);
  const tUsed = new Set(), dUsed = new Set();
  for (const [d, ti, di] of pairs) {
    if (d > 0.5) break;
    if (tUsed.has(ti) || dUsed.has(di)) continue;
    tUsed.add(ti); dUsed.add(di); setBox(trackers[ti], dets[di], now);
  }
  dets.forEach((b, di) => {
    if (dUsed.has(di)) return;
    const ti = trackers.findIndex((g, i) => !tUsed.has(i) && !g.active);
    if (ti >= 0) { tUsed.add(ti); setBox(trackers[ti], b, now); }
  });
}

/* ---------- panel physics ---------- */
function computeTarget(p, g, now) {
  const b = g.box;
  let r, src;
  if (!p.echo) {
    const [vx, vy, vw, vh] = clampRect(b.x + p.u * b.w, b.y + p.v * b.h, p.rw * b.w, p.rh * b.h);
    src = [vx, vy, vw, vh];
    r = toScreen(vx, vy, vw, vh);
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    r = { x: cx, y: cy, w: r.w * p.pop, h: r.h * p.pop };
  } else {
    src = [b.x, b.y, b.w, b.h];
    const br = toScreen(b.x, b.y, b.w, b.h);
    r = { x: br.x + br.w / 2 + p.eox * br.w, y: br.y + br.h / 2 + p.eoy * br.h, w: br.w * p.eScale, h: br.h * p.eScale };
  }
  const t = now / 1000;
  r.x += Math.sin(t * p.spd + p.phase) * p.wob;
  r.y += Math.cos(t * p.spd * 0.8 + p.phase) * p.wob;
  if (!g.active) r.y += Math.min(400, (now - g.last) * 0.18);
  p.src = src;
  return r;
}
function stepPanel(p, g, now, s) {
  const t = computeTarget(p, g, now);
  const kk = p.k * (2.2 - 1.75 * S.lag);
  const d = Math.pow(p.damp, s);
  p.vx += (t.x - p.x) * kk * s; p.vx *= d; p.x += p.vx * s;
  p.vy += (t.y - p.y) * kk * s; p.vy *= d; p.y += p.vy * s;
  p.vw += (t.w - p.w) * kk * s; p.vw *= d; p.w = Math.max(2, p.w + p.vw * s);
  p.vh += (t.h - p.h) * kk * s; p.vh *= d; p.h = Math.max(2, p.h + p.vh * s);
  const ta = g.active ? 1 : 0;
  p.alpha += (ta - p.alpha) * Math.min(1, (g.active ? 0.18 : 0.1) * s);
  p.rot += (clamp(p.vx * 0.006, -0.2, 0.2) - p.rot) * Math.min(1, 0.15 * s);
}

/* ---------- drawing ---------- */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
const DOT = ['#ff5f57', '#febc2e', '#28c840'];
function drawPanel(p) {
  if (p.alpha < 0.02 || p.w < 3) return;
  const w = p.w, h = p.h;
  const bar = clamp(w * 0.11, 7, 16);
  const X = -w / 2, Y = -h / 2 - bar, WW = w, HH = h + bar;
  ctx.save();
  ctx.globalAlpha = clamp(p.alpha, 0, 1);
  ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  rr(ctx, X, Y, WW, HH, 5);
  if (w > 24) { ctx.shadowColor = 'rgba(0,0,0,.34)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4; }
  ctx.fillStyle = '#e6e6e9'; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.save();
  ctx.clip();
  const gr = ctx.createLinearGradient(0, Y, 0, Y + bar);
  gr.addColorStop(0, '#f1f1f3'); gr.addColorStop(1, '#d9d9dd');
  ctx.fillStyle = gr; ctx.fillRect(X, Y, WW, bar);
  const dr = bar * 0.27;
  if (w > 34) for (let i = 0; i < 3; i++) { ctx.fillStyle = DOT[i]; ctx.beginPath(); ctx.arc(X + bar * 0.85 + i * bar * 0.82, Y + bar / 2, dr, 0, 6.283); ctx.fill(); }
  if (w > 96) {
    ctx.fillStyle = '#5b5e66'; ctx.font = `${(bar * 0.62).toFixed(1)}px -apple-system, "Hiragino Sans", "Segoe UI", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.title, 0, Y + bar / 2 + 0.5);
  }
  // content: crop of the live camera, mirrored to match the on-screen mapping
  const [nx, ny, nw, nh] = p.src;
  ctx.save(); ctx.scale(mirror ? -1 : 1, 1);
  try { ctx.drawImage(video, nx * map.vw, ny * map.vh, nw * map.vw, nh * map.vh, mirror ? -w / 2 : -w / 2, -h / 2, w, h); } catch (e) {}
  ctx.restore();
  ctx.restore();
  rr(ctx, X, Y, WW, HH, 5);
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.stroke();
  ctx.restore();
}
function drawBoxes() {
  ctx.save(); ctx.lineWidth = 2; ctx.font = '12px sans-serif';
  for (const k in groups) {
    const g = groups[k]; if (!g.active) continue;
    const r = toScreen(g.box.x, g.box.y, g.box.w, g.box.h);
    ctx.strokeStyle = k === 'face' ? '#ffd23c' : '#48f08a'; ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = ctx.strokeStyle; ctx.fillText(k === 'face' ? 'face' : 'hand', r.x + 4, r.y - 5);
  }
  ctx.restore();
}

/* ---------- main loop ---------- */
let hand = null, face = null, lastVT = -1, prev = performance.now(), hudT = 0;
function detect(now) {
  const ts = performance.now();
  let hr = null, fr = null;
  try { hr = hand.detectForVideo(video, ts); } catch (e) {}
  try { fr = face.detectForVideo(video, ts); } catch (e) {}
  if (fr && fr.faceLandmarks && fr.faceLandmarks.length) {
    const b = bboxOf(fr.faceLandmarks[0], 0.09);
    if (b) setBox(groups.face, b, now);
  }
  if (hr && hr.landmarks && hr.landmarks.length) {
    const boxes = hr.landmarks.map(l => bboxOf(l, 0.22)).filter(Boolean);
    if (boxes.length) updateHands(boxes, now);
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  const s = dt * 60;
  ctx.clearRect(0, 0, W, H);
  if (video.readyState < 2 || !video.videoWidth) return;
  map = computeMap();
  if (!map) return;
  if (video.currentTime !== lastVT) { lastVT = video.currentTime; detect(now); }
  for (const k in groups) { const g = groups[k]; if (g.active && now - g.last > 350) g.active = false; }

  if (S.bg === 'camera') {
    ctx.save(); ctx.globalAlpha = 0.35;
    if (mirror) { ctx.translate(map.ox + map.dw, map.oy); ctx.scale(-1, 1); }
    else { ctx.translate(map.ox, map.oy); }
    ctx.drawImage(video, 0, 0, map.dw, map.dh); ctx.restore();
  }
  for (const p of allPanels) stepPanel(p, p.g, now, s);
  for (const p of allPanels) drawPanel(p);
  if (S.showBox) drawBoxes();

  if (now - hudT > 250) {
    hudT = now;
    const nh = (groups.h0.active ? 1 : 0) + (groups.h1.active ? 1 : 0);
    $('hud').textContent = `顔 ${groups.face.active ? '検出' : '—'}　手 ${nh}`;
  }
}

/* ---------- camera ---------- */
let facing = 'user', stream = null;
function showError(e) {
  const msg = (e && e.message) ? e.message : String(e || 'unknown');
  const err = $('err');
  err.classList.add('show');
  err.textContent = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream() {
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
  return md.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
    .then(st => {
      stream = st; video.srcObject = st; mirror = (facing === 'user');
      const p = video.play();
      return (p && p.then) ? p.catch(() => {}) : null;
    });
}
$('flip').addEventListener('click', () => {
  facing = (facing === 'user') ? 'environment' : 'user';
  for (const k in groups) groups[k].active = false;
  startStream().catch(showError);
});

/* ---------- start ---------- */
async function createLandmarker(cls, fileset, model, opts) {
  try { return await cls.createFromOptions(fileset, { baseOptions: { modelAssetPath: model, delegate: 'GPU' }, runningMode: 'VIDEO', ...opts }); }
  catch (e) { return await cls.createFromOptions(fileset, { baseOptions: { modelAssetPath: model, delegate: 'CPU' }, runningMode: 'VIDEO', ...opts }); }
}
async function init() {
  const msg = $('msg'), go = $('go');
  go.disabled = true; msg.className = ''; msg.classList.add('ok');
  ensureAudio();
  try {
    msg.textContent = 'カメラを起動しています…';
    await startStream();
    msg.textContent = '手と顔のモデルを読み込んでいます…（初回は少し時間がかかります）';
    if (!FilesetResolver) {
      const mod = await import(VISION_URL);
      FilesetResolver = mod.FilesetResolver; HandLandmarker = mod.HandLandmarker; FaceLandmarker = mod.FaceLandmarker;
    }
    const fileset = await FilesetResolver.forVisionTasks(WASM);
    hand = await createLandmarker(HandLandmarker, fileset, HAND_MODEL, { numHands: 2 });
    face = await createLandmarker(FaceLandmarker, fileset, FACE_MODEL, { numFaces: 1 });
    map = computeMap(); buildAll();
    $('start').style.display = 'none';
    $('ui').classList.add('show'); $('hud').classList.add('show'); $('flip').classList.add('show');
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    go.disabled = false; msg.classList.remove('ok'); msg.textContent = '';
    showError(e);
  }
}
$('go').addEventListener('click', init);

/* ---------- controls ---------- */
function bindRange(id, outId, fmt, apply, rebuild) {
  const el = $(id);
  el.addEventListener('input', () => { const v = parseFloat(el.value); $(outId).textContent = fmt(v); apply(v); if (rebuild) buildAll(); });
}
bindRange('nFace', 'oFace', v => v, v => S.nFace = v, true);
bindRange('nHand', 'oHand', v => v, v => S.nHand = v, true);
bindRange('size', 'oSize', v => v.toFixed(1), v => S.size = v, true);
bindRange('lag', 'oLag', v => v.toFixed(2), v => S.lag = v, false);
function applyBg() {
  $('bg').style.display = S.bg === 'bliss' ? 'block' : 'none';
}
$('bg-sel').addEventListener('change', e => { S.bg = e.target.value; applyBg(); });
$('box').addEventListener('change', e => { S.showBox = e.target.checked; });
$('snd').addEventListener('change', e => { S.sound = e.target.checked; });
$('reshuffle').addEventListener('click', () => { buildAll(); popShuffle(); });
function toggleFS() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
$('fs').addEventListener('click', toggleFS);
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') && e.key.length === 1 && e.target.type !== 'range') return;
  if (e.key === 'h' || e.key === 'H') { $('ui').classList.toggle('show'); $('hud').classList.toggle('show'); }
  if (e.key === 'f' || e.key === 'F') toggleFS();
});
applyBg();
</script>
</body>
