<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人の輪郭から、その形の等高線が波紋のように広がっていく。止まっていればゆっくり一本ずつ、動けばゆがんだ輪がいくつも重なってあふれ出す。">
<meta name="theme-color" content="#07080a">
<title>HAMON ─ 輪郭から広がる、あなたの波紋</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  HAMON 波紋 ─ 輪郭から広がる、あなたの波紋          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       テクノのレコードジャケット、ソナーの画面、地形図の等高線。
             暗い地に映った人が静かなモノクロで立ち、その輪郭から「その瞬間の
             自分の形」をした細い線が一本ずつ外へ広がっていく。止まっていれば
             1 秒に 1 本の穏やかな呼吸。動くとその形のまま輪が次々に放たれ、
             ゆがんだ線が重なって画面を埋め、動いた瞬間の輪だけが差し色になる。
  PALETTE    NIGHT   地 #07080a・線 #ebe7df・差し色 #ff6a2b（ナトリウム灯の橙）
             PAPER   地 #ece8df・線 #141414・差し色 #2c4bd6（群青）
             INFRA   地 #0b0303・線 #ff5a4a（暗室の赤一色）・差し色 #ffd9c9
  TYPE       Albert Sans 200/500（見出し）＋ Chivo Mono（計器）。
  MOTION     輪は短辺の 0.24 倍／秒で広がり、遠くへ行くほど細く淡くなる。
             放つ間隔は動きの量で 1.1 秒 → 0.09 秒まで詰まる。
             タップで三重の強い輪を一度に放つ。
  SIGNATURE  止まれば静かな同心の呼吸、動けば自分の形の輪があふれること。
  SWITCH     はじめは素のカメラ。「▸ HAMON」で色が抜けて暗転し、最初の三重の輪が
             体から放たれる。「◂ CAMERA」で輪が消えて映像が戻る。
  TECH       WebGL2。輪を放つたびに、その瞬間の人物マスクから画面空間の距離場
             （ユークリッド距離変換）を作り、24 層のテクスチャ配列の一層に書く。
             シェーダは各画素で 24 層を読み、「距離 ＝ 経過時間 × 速さ」の所に線を引く。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@200;500&family=Chivo+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080a;--fg:#ebe7df;--dim:rgba(235,231,223,.5);--line:rgba(235,231,223,.2);--acc:#ff6a2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
  font-family:"Albert Sans","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:200;transition:background .4s,color .4s}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#est{display:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding:28px;text-align:center;background:var(--bg)}
#start .t{font:300 10px "Chivo Mono",monospace;letter-spacing:.46em;margin-right:-.46em;color:var(--dim)}
#start h1{margin:0;font:200 min(15vw,92px)/1 "Albert Sans",sans-serif;letter-spacing:.36em;margin-right:-.36em}
#start svg{width:120px;height:60px}
#start p{margin:0;font-size:12px;line-height:2.1;color:var(--dim);letter-spacing:.1em;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:300}
#go{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:400 10px "Chivo Mono",monospace;
  letter-spacing:.5em;padding:15px 30px 15px 36px;cursor:pointer;transition:border-color .3s}
#go:hover{border-color:var(--fg)}
#err{font-size:12px;line-height:1.8;max-width:340px;min-height:1em;white-space:pre-line;color:#e39a8a;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}

.btn{position:fixed;z-index:12;appearance:none;border:0;background:transparent;color:var(--fg);font:400 10px "Chivo Mono","Hiragino Sans",monospace;
  letter-spacing:.3em;padding:10px 8px;display:none;cursor:pointer;opacity:.6;transition:opacity .3s}
.btn.show{display:block}
.btn:hover{opacity:1}
#gear{right:10px;top:calc(env(safe-area-inset-top) + 6px);font-size:14px;letter-spacing:0}
#flip{right:10px;top:calc(env(safe-area-inset-top) + 40px);letter-spacing:.1em;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:12;display:none;justify-content:center;align-items:center;gap:30px}
#bar.show{display:flex}
#bar .btn{position:static;display:block}
#bar #shoot{width:42px;height:42px;border-radius:50%;border:1px solid var(--fg);padding:0;opacity:.8;
  background:radial-gradient(circle,transparent 9px,var(--fg) 9.5px,var(--fg) 10.5px,transparent 11px,transparent 14px,var(--fg) 14.5px,var(--fg) 15.3px,transparent 15.8px)}
#rec.on{opacity:1;color:var(--acc)}
#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 14px);z-index:11;font:300 9px "Chivo Mono",monospace;letter-spacing:.24em;color:var(--dim);
  pointer-events:none;display:none;line-height:2.1;white-space:pre}
#hud.show{display:block}
#status{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:11;font-size:11px;letter-spacing:.04em;
  color:var(--dim);pointer-events:none;max-width:72vw;line-height:1.7;white-space:pre-line;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}

#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 78px);z-index:12;width:min(270px,calc(100vw - 20px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:13px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .25s}
#panel.hide{opacity:0;pointer-events:none}
.chips{display:flex;border:1px solid var(--line)}
.chips button{flex:1;appearance:none;border:0;background:transparent;color:var(--fg);padding:8px 2px;font:400 9px "Chivo Mono",monospace;
  letter-spacing:.2em;cursor:pointer;opacity:.55}
.chips button.on{opacity:1;background:color-mix(in srgb,var(--fg) 12%,transparent)}
#panel label{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.04em;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:300}
#panel label span{width:74px;flex:none;color:var(--dim)}
#panel input[type=range]{flex:1;accent-color:var(--acc)}
#panel .note{font-size:10px;color:var(--dim);line-height:1.7;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
#mode{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 72px);z-index:13;display:none;
  appearance:none;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,transparent);color:var(--fg);
  font:400 10px "Chivo Mono",monospace;letter-spacing:.42em;padding:13px 22px 13px 28px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .3s}
#mode.show{display:block}
#mode:hover{border-color:var(--fg)}
body.cam #mode{border-color:rgba(255,255,255,.55);color:#fff;background:rgba(0,0,0,.35)}
body.cam .btn{color:#fff}
body.cam #bar #shoot{border-color:#fff}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ HAMON</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="pulse" class="btn">PULSE</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">NIGHT</button>
    <button data-p="1">PAPER</button>
    <button data-p="2">INFRA</button>
  </div>
  <label><span>輪の速さ</span><input type="range" id="sSpeed" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>線の太さ</span><input type="range" id="sWidth" min="0" max="1" step="0.01" value="0.4"></label>
  <label><span>反応</span><input type="range" id="sSens" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>人の明るさ</span><input type="range" id="sBody" min="0" max="1" step="0.01" value="0.5"></label>
  <div class="note">止まれば静かな輪、動けば自分の形の輪があふれる。<br>PULSE か画面タップで、三重の輪を放つ。</div>
</div>

<div id="start">
  <div class="t">CONTOUR · PULSE</div>
  <svg viewBox="0 0 120 60" aria-hidden="true" fill="none" stroke="currentColor" stroke-width=".8">
    <ellipse cx="60" cy="30" rx="8" ry="11"/><ellipse cx="60" cy="30" rx="18" ry="19" opacity=".7"/><ellipse cx="60" cy="30" rx="30" ry="26" opacity=".45"/><ellipse cx="60" cy="30" rx="44" ry="29" opacity=".25" stroke="#ff6a2b"/>
  </svg>
  <h1>HAMON</h1>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、あなたの輪郭が波紋になって広がる。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   HAMON — contour rings. Each time a ring is emitted, the current person
   mask becomes a screen-space distance field (two-pass chamfer) written
   into one layer of a 24-layer texture array. The shader draws a line in
   each layer where distance = age × speed, so every ring keeps the exact
   shape the body had when it left. Motion shortens the emission interval.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

const PALS = [
  { name:'NIGHT', bg:[.027,.031,.039], line:[.92,.905,.875], acc:[1,.42,.17], ink:[.03,.03,.035], paper:[.86,.85,.83], neg:0, css:['#07080a','#ebe7df','#ff6a2b'] },
  { name:'PAPER', bg:[.925,.91,.875],  line:[.08,.08,.08],   acc:[.17,.29,.84], ink:[.10,.10,.10], paper:[.97,.96,.94], neg:1, css:['#ece8df','#141414','#2c4bd6'] },
  { name:'INFRA', bg:[.043,.012,.012], line:[1,.35,.29],     acc:[1,.85,.79],   ink:[.04,.01,.01], paper:[.95,.33,.27], neg:0, css:['#0b0303','#ff8a7a','#ffd9c9'] },
];
const S = { pal:0, speed:.5, width:.4, sens:.55, body:.5 };
const K = 24;                                          // rings alive at once (texture array layers)

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
precision highp sampler2DArray;
uniform sampler2D uVid, uMask;
uniform sampler2DArray uRings;
uniform vec2 uRes, uScale, uMT;
uniform float uMirror, uE, uT, uHasMask, uW, uBody, uNeg, uRmax;
uniform float uR[${K}], uHot[${K}];
uniform vec3 uBg, uLine, uAcc, uInk, uPaper;
out vec4 o;
float h2(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
void main(){
  vec2 s = gl_FragCoord.xy / uRes; s.y = 1. - s.y;
  vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x;
  vec3 cam = texture(uVid, v).rgb;
  float l = dot(cam, vec3(.299,.587,.114));
  float m = uHasMask > .5 ? texture(uMask, v).r : (uHasMask < -.5 ? 0. : 1.);
  float a = smoothstep(.35, .65, m);
  float ring = 0.;
  for (int i = 0; i < 8; i++){ float an = float(i) * .785398; ring += uHasMask > .5 ? texture(uMask, v + vec2(cos(an), sin(an)) * uMT).r : m; }
  float rim = clamp((m - ring / 8.) * 3., 0., 1.);
  // the rings
  float lineW = 0., accW = 0.;
  for (int k = 0; k < ${K}; k++){
    float r = uR[k];
    if (r <= 0.) continue;
    float d = texture(uRings, vec3(s, float(k))).r;
    float f = 1. - r / uRmax; if (f <= 0.) continue;
    float w = uW * (.55 + .45 * f);
    float x = (d - r) / w;
    float g = exp(-x * x) * f * sqrt(f) * step(.0005, d);
    lineW += g * (1. - uHot[k]); accW += g * uHot[k];
  }
  lineW = min(lineW, 1.2); accW = min(accW, 1.2);
  // the person: quiet monochrome with a thin rim
  float g = smoothstep(.04, .9, l); g = g * g * (3. - 2. * g);
  vec3 body = mix(uInk, uPaper, g) * uBody;
  vec3 bg = uBg + (h2(gl_FragCoord.xy + fract(uT) * 97.) - .5) * .018;
  vec3 c = mix(bg, uNeg > .5 ? mix(uBg, body, .85) : body, a);
  c = uNeg > .5 ? mix(c, uLine, min(1., lineW)) : c + uLine * lineW;
  c = uNeg > .5 ? mix(c, uAcc, min(1., accW)) : c + uAcc * accW;
  c = uNeg > .5 ? mix(c, uLine, rim * .9) : c + uLine * rim * .8;
  o = vec4(mix(cam, c, uE), 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name.replace('[0]', '')] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function params(t, target){
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(target, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); }
let P = null, vao, texVid, texMask, texRings, ringsKey = '';
function initGL(){
  P = prog(VS, FS);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  texVid = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texVid); params(texVid, gl.TEXTURE_2D);
  texMask = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texMask); params(texMask, gl.TEXTURE_2D);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  texRings = gl.createTexture();
}
function ensureRings(){
  const key = F.w + 'x' + F.h; if (key === ringsKey) return; ringsKey = key;
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texRings); params(texRings, gl.TEXTURE_2D_ARRAY);
  gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.R16F, F.w, F.h, K, 0, gl.RED, gl.FLOAT, null);
  for (const R of RINGS) R.t0 = -1;
}

/* ---------- screen-space mask field + distance transform (all buffers reused) ---------- */
const FSHORT = 120;
const F = { w:0, h:0, m:null, prevM:null, d:null };
function ensureField(W, H){
  let w, h; if (W >= H){ h = FSHORT; w = Math.round(FSHORT * W / H); } else { w = FSHORT; h = Math.round(FSHORT * H / W); }
  if (w === F.w && h === F.h) return;
  F.w = w; F.h = h; est.width = w; est.height = h;
  F.m = new Uint8Array(w * h); F.prevM = new Uint8Array(w * h); F.d = new Float32Array(w * h);
}
const M = { w:0, h:0, f:null, b:null, has:false, live:false, external:false, lastT:0, dirty:false };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || !(w * h <= 4e6) || data.length < w * h) return false;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.f = new Float32Array(w * h); M.b = new Uint8Array(w * h); }
  for (let i = 0, n = w * h; i < n; i++){ let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1; M.f[i] = m; M.b[i] = m * 255; }
  M.has = true; M.live = true; M.lastT = performance.now(); M.dirty = true;
  return true;
}
// the mask in screen cells (cover crop + mirror); returns the fraction of cells that changed
function sampleField(W, H){
  const t = F.prevM; F.prevM = F.m; F.m = t;
  const live = M.has && M.live;
  if (!live){ F.m.fill(0); F.on = 0; return 0; }
  const s = Math.max(W / vidW, H / vidH), ox = (W - vidW * s) / 2, oy = (H - vidH * s) / 2;
  let ch = 0, on = 0;
  for (let y = 0; y < F.h; y++){
    const v = (((y + .5) / F.h * H) - oy) / s / vidH;
    for (let x = 0; x < F.w; x++){
      const sx = (x + .5) / F.w * W, u = ((mirror ? W - sx : sx) - ox) / s / vidW;
      let m = 0;
      if (u >= 0 && u < 1 && v >= 0 && v < 1) m = M.f[(v * M.h | 0) * M.w + (u * M.w | 0)] > .5 ? 1 : 0;
      const i = y * F.w + x; F.m[i] = m; if (m !== F.prevM[i]) ch++; on += m;
    }
  }
  F.on = on;
  return ch / Math.max(40, on);                           // relative to the body's own size
}
// exact Euclidean distance to the body (Felzenszwalb–Huttenlocher, two 1-D passes), in short-edge units
const EDT = { f:null, dd:null, v:null, z:null, n:0 };
function edt1(f, n, dd, v, z){
  let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 1; q < n; q++){
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]){ k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  k = 0;
  for (let q = 0; q < n; q++){ while (z[k + 1] < q) k++; const dq = q - v[k]; dd[q] = dq * dq + f[v[k]]; }
}
function distance(){
  const w = F.w, h = F.h, d = F.d, BIG = 1e12, n = Math.max(w, h);
  if (EDT.n < n){ EDT.n = n; EDT.f = new Float64Array(n); EDT.dd = new Float64Array(n); EDT.v = new Int32Array(n); EDT.z = new Float64Array(n + 1); }
  const f = EDT.f, dd = EDT.dd, v = EDT.v, z = EDT.z;
  for (let i = 0; i < w * h; i++) d[i] = F.m[i] ? 0 : BIG;
  for (let x = 0; x < w; x++){
    for (let y = 0; y < h; y++) f[y] = d[y * w + x];
    edt1(f, h, dd, v, z);
    for (let y = 0; y < h; y++) d[y * w + x] = dd[y];
  }
  for (let y = 0; y < h; y++){
    const o = y * w;
    for (let x = 0; x < w; x++) f[x] = d[o + x];
    edt1(f, w, dd, v, z);
    for (let x = 0; x < w; x++) d[o + x] = dd[x];
  }
  const k = 1 / FSHORT;
  for (let i = 0; i < w * h; i++) d[i] = d[i] >= BIG * .5 ? 50 : Math.sqrt(d[i]) * k;
}

/* ---------- rings ---------- */
const RINGS = []; for (let i = 0; i < K; i++) RINGS.push({ t0:-1, hot:0 });
let nextRing = 0, lastEmit = 0;
function emit(now, hot){
  if (!F.on || F.on < 20) return false;                   // nobody there: nothing to send
  distance();
  const layer = nextRing; nextRing = (nextRing + 1) % K;
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texRings);
  gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, layer, F.w, F.h, 1, gl.RED, gl.FLOAT, F.d);
  RINGS[layer].t0 = now; RINGS[layer].hot = hot;
  lastEmit = now; STATS.emitted++;
  return true;
}
const QUEUE = [];                                        // timed extra rings (switch, tap)
function triple(now){ QUEUE.push(now, now + 110, now + 220); }

/* ---------- model ---------- */
let segmenter = null, lastTs = 0, lastSegVT = -1;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    setStatus('');
  }catch(e){
    if (M.external) return;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n輪郭が取れないので、波紋は出せません。');
  }
}
function segment(now){
  if (!segmenter || M.external || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastSegVT) return; lastSegVT = vt;
  try{
    const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks; if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1]; ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
    });
  }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720, lastVT = -1, camT0 = 0;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  camT0 = performance.now();
}

/* ---------- audio: a soft sonar ping per ring, brighter for the hot ones ---------- */
let actx = null, bus = null, recDest = null, verb = null, lastPing = 0;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .5; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  // a long, dark tail made from decaying noise
  const sr = actx.sampleRate, n = sr * 3.2 | 0, ir = actx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.5); }
  verb = actx.createConvolver(); verb.buffer = ir; const vg = actx.createGain(); vg.gain.value = .5; verb.connect(vg); vg.connect(bus);
  actx.resume().catch(()=>{});
}
const PENTA = [0, 3, 5, 7, 10];
function ping(hot, vol){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  const step = PENTA[(Math.random() * 5) | 0] + (hot ? 12 : 0);
  o.type = 'sine'; o.frequency.value = 220 * Math.pow(2, step / 12);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + (hot ? .5 : 1.4));
  o.connect(g); g.connect(verb); g.connect(bus); o.start(t); o.stop(t + 1.5);
}

// the switch: plain camera (X = 0) ⇄ rings (X = 1)
const MODE = { on:false, X:0 };
function setMode(on){
  if (on === MODE.on) return;
  MODE.on = on;
  $('mode').textContent = on ? '◂ CAMERA' : '▸ HAMON';
  document.body.classList.toggle('cam', !on);
  $('pulse').style.visibility = on ? 'visible' : 'hidden';
  if (on){ for (const R of RINGS) R.t0 = -1; triple(performance.now() + 450); }
}
$('mode').onclick = () => setMode(!MODE.on);
addEventListener('keydown', e => { if (started && (e.key === ' ' || e.key === 'Enter') && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); setMode(!MODE.on); } });
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!P) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','pulse','hud','mode'].forEach(id => $(id).classList.add('show'));
  MODE.on = true; setMode(false);
  if (!started){ started = true; initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
function pulse(){ if (MODE.on && MODE.X >= 1) triple(performance.now()); }
$('pulse').onclick = pulse;
canvas.addEventListener('pointerdown', () => { if (started) pulse(); });
function setPal(i){
  S.pal = i; const p = PALS[i];
  [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
  const r = document.documentElement.style;
  r.setProperty('--bg', p.css[0]); r.setProperty('--fg', p.css[1]); r.setProperty('--acc', p.css[2]);
  r.setProperty('--dim', p.neg ? 'rgba(20,20,20,.55)' : 'rgba(235,231,223,.5)'); r.setProperty('--line', p.neg ? 'rgba(20,20,20,.22)' : 'rgba(235,231,223,.2)');
}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sSpeed','speed'],['sWidth','width'],['sSens','sens'],['sBody','body']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

$('shoot').onclick = () => {
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'hamon-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'hamon.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
let lastT = 0, hudT = 0, motion = 0;
const STATS = { emitted:0, alive:0, hot:0, motion:0 };
const RU = new Float32Array(K), HU = new Float32Array(K);
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  const t = now / 1000;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1800 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  ensureField(W, H); ensureRings();
  segment(now);
  if (M.live && now - M.lastT > 1200) M.live = false;
  if (video.readyState < 2) return;
  const vt = video.currentTime, fresh = vt !== lastVT; lastVT = vt;
  if (fresh){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }
  let changed = 0;
  if (M.dirty){ M.dirty = false; gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, M.w, M.h, 0, gl.RED, gl.UNSIGNED_BYTE, M.b);
    changed = sampleField(W, H); }
  else if (M.has && !M.live){ sampleField(W, H); }
  // motion: the share of the body's outline that moved, smoothed (a camera cut is ignored)
  if (now - camT0 < 700 || changed > 1.2) changed = 0;
  motion = Math.max(motion * Math.exp(-dt / .35), Math.min(1, changed * (1.2 + 3 * S.sens)));
  STATS.motion = motion;

  MODE.X = MODE.on ? Math.min(1, MODE.X + dt / .7) : Math.max(0, MODE.X - dt / .5);
  const speed = .12 + .26 * S.speed;                      // short edges per second
  const Rmax = 1.5;
  if (MODE.on && MODE.X >= .6){
    while (QUEUE.length && QUEUE[0] <= now){ QUEUE.shift(); if (emit(now, 1)) ping(true, .12); }
    const interval = 1100 - 1010 * Math.min(1, motion * 1.4);
    if (now - lastEmit > interval){ const hot = motion > .4 ? 1 : 0; if (emit(now, hot) && now - lastPing > 120){ lastPing = now; ping(hot, hot ? .05 : .09); } }
  } else if (!MODE.on) QUEUE.length = 0;
  let alive = 0, hot = 0;
  for (let i = 0; i < K; i++){
    const R = RINGS[i];
    const r = R.t0 < 0 ? 0 : (now - R.t0) / 1000 * speed + .002;
    RU[i] = MODE.on || MODE.X > 0 ? (r < Rmax ? r : 0) : 0; HU[i] = R.hot;
    if (RU[i] > 0){ alive++; if (R.hot) hot++; }
  }
  STATS.alive = alive; STATS.hot = hot;

  const E = Math.min(1, MODE.X / .6);
  const p = PALS[S.pal];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.p); gl.bindVertexArray(vao);
  const U = P.U;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texRings);
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uRings, 2);
  const sa = W/H, va = vidW/vidH;
  gl.uniform2f(U.uRes, W, H); gl.uniform2f(U.uScale, sa < va ? sa/va : 1, sa < va ? 1 : va/sa);
  const sc = Math.max(W / vidW, H / vidH), rimPx = Math.min(W, H) * .004;
  gl.uniform2f(U.uMT, rimPx / (vidW * sc), rimPx / (vidH * sc));
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uE, E); gl.uniform1f(U.uT, t);
  gl.uniform1f(U.uHasMask, M.has ? (M.live ? 1 : -1) : 0);
  gl.uniform1f(U.uW, (.0014 + .006 * S.width)); gl.uniform1f(U.uBody, .35 + .9 * S.body); gl.uniform1f(U.uNeg, p.neg); gl.uniform1f(U.uRmax, Rmax);
  gl.uniform1fv(U.uR, RU); gl.uniform1fv(U.uHot, HU);
  gl.uniform3fv(U.uBg, p.bg); gl.uniform3fv(U.uLine, p.line); gl.uniform3fv(U.uAcc, p.acc); gl.uniform3fv(U.uInk, p.ink); gl.uniform3fv(U.uPaper, p.paper);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  $('hud').style.visibility = MODE.X >= 1 ? 'visible' : 'hidden';
  hudT += dt;
  if (hudT > .3){ hudT = 0;
    $('hud').textContent = 'HAMON  ' + p.name + '\nRINGS ' + String(alive).padStart(2, '0') + ' / ' + K + '\nPULSE ' + (1000 / (1100 - 1010 * Math.min(1, motion * 1.4))).toFixed(2) + ' Hz'; }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__HAMON = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; return ingestMask(d, w, h); },
  state: () => ({ emitted:STATS.emitted, alive:STATS.alive, hot:STATS.hot, motion:STATS.motion, maskLive:M.live, on:F.on || 0 }),
  // distance of a screen point from the body in the newest ring (short-edge units)
  newestAt(x, y){ const fx = Math.min(F.w - 1, Math.max(0, x * F.w | 0)), fy = Math.min(F.h - 1, Math.max(0, y * F.h | 0)); return F.d ? F.d[fy * F.w + fx] : -1; },
  palette(i){ setPal(i); },
  mode(c){ setMode(!!c); },
  tap(){ pulse(); },
  view: () => ({ on:MODE.on, X:MODE.X }),
};
</script>
</body>
</html>
