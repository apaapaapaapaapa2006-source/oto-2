<title>KURURI ─ 廻しつづける手回し弦</title>
<meta name="description" content="片手で宙に輪を描きつづけると、その速さで松脂の車輪が回り、三本の弦を擦って鳴らしつづける手回し楽器。止めれば音も止まる。もう一方の手の高さが旋律弦の鍵を選び、つまめば装飾音が転がる。輪を描く速さを急に上げると駒が跳ねて唸り、その唸りだけで拍子が取れる。">
<meta name="theme-color" content="#2a1a0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Kaisei+Decol:wght@400;700&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  KURURI ─ 廻しつづける手回し弦                      ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      A village instrument on a workbench, by lamplight. Oak, brass,
            ivory and madder cloth — handmade, a little worn, warm all the
            way through. Tonight's companion piece (AORI) is a high-key
            photographic white, so this one is allowed to be the dark half
            of the pair; but it is dark BROWN, never black, and every
            surface has grain in it.

  PALETTE   煤    susu     #170f09  the ground under everything. Lamp-soot
                                    brown-black — warm, so nothing in the
                                    piece ever reads as a screen.
            樫    kashi    #3a2415  the oak body. All wood is this, lit
                                    and shaded from a single lamp above
                                    left; the grain is drawn, not faked
                                    with noise.
            蜜    mitsu    #c9913f  honeyed varnish and brass. The crank,
                                    the wheel rim, the tuning pegs, every
                                    number on screen.
            生成  kinari   #efe0c4  ivory. The key tops, the labels, the
                                    body text. Warm, never white.
            茜    akane    #a8322a  madder. RESERVED for the chien — the
                                    buzzing bridge. Nothing else in the
                                    piece is red, so a red flash always
                                    means exactly one thing.

  BACKGROUND  Quarter-sawn oak, drawn once into an offscreen tile: long
              grain lines of varying weight, medullary rays across them,
              and a slow tonal drift. It fills the whole page, so on a
              tall phone the instrument sits on a plank rather than in a
              void. No vignette, no radial gradient anywhere.

  TYPE      Alegreya 400/500/700 + italic for every latin word and number:
            a bookish, slightly calligraphic serif — the face of a printed
            tune book rather than of an app. Kaisei Decol 400/700 for
            Japanese: rounded, hand-cut, a woodblock warmth that sits on
            oak without going clinical.

  MOTION    GEARED AND WEIGHTED. Everything in the piece is downstream of
            one number — wheel speed — and inherits its inertia. The body
            rocks in phase with the crank. Keys drop with a hard ease-out
            and overshoot 8% on release, like a lever on a spring. Bow
            pressure, string brightness and dust density are all critically
            damped chases; nothing steps, nothing fades linearly.

  SIGNATURE 廻しつづけているあいだだけ鳴る。 The wheel is a bow, and a bow
            only sounds while it moves. Stop circling and the three strings
            die away in a fifth of a second; circle faster and the same
            strings open up, because the lowpass cutoff tracks bow speed
            exactly as rosin bite does on a real wheel. And the ornament
            that no other instrument here has: 犬 (chien) — a sudden
            ACCELERATION of the crank, not a position and not a pose,
            lifts the buzzing bridge and makes it rattle. Rhythm therefore
            comes out of how you turn, not out of anything you press.
  ══════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  KURURI ─ 廻しつづける手回し弦
//
//  A wheel fiddle. One hand draws a circle in the air; the ANGULAR VELOCITY
//  of that circle is the wheel, and the wheel is a bow, so the three
//  strings sound only while it turns. The other hand's height picks the
//  key on the melody string. A sudden ANGULAR ACCELERATION lifts the
//  buzzing bridge (犬 / chien) and makes it rattle — which is how a real
//  hurdy-gurdy player keeps time, and is the one gesture in this gallery
//  that is a derivative rather than a position.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number' && isFinite(v); }
// critically damped chase, frame-rate independent
function chase(cur,tgt,rate,dt){ var k=1-Math.exp(-rate*clamp(dt,0,0.2)); return cur+(tgt-cur)*k; }

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var chienEl=document.getElementById('chienEl');
var roomEl=document.getElementById('roomEl');
var rRev=document.getElementById('rRev');
var rNote=document.getElementById('rNote');
var rChien=document.getElementById('rChien');
var mBtn=[document.getElementById('m0'),document.getElementById('m1'),document.getElementById('m2')];

var W=0,H=0,DPR=1,MN=1;
var FIT=1;          // uniform design→screen scale, ALWAYS from the short edge
var DW=980, DH=620; // design box
var GSPAN=1;        // key-gesture span in px, anchored to MN
var woodTile=null;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
  // min() of the two ratios is by construction governed by the SHORT edge,
  // so a phone in portrait and a laptop in landscape get the same instrument.
  FIT=Math.max(0.16,Math.min(W/DW,H/DH)*0.95);
  GSPAN=MN*0.68;
  woodTile=null;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  COVER MAPPING
//
//  MediaPipe normalises x by the FRAME width and y by the FRAME height.
//  Every landmark goes through the same aspect-preserving cover map, so
//  every distance, radius, angle and angular velocity downstream of it is
//  in real screen pixels and means the same thing in both orientations.
//  Nothing in this file reads a raw .x / .y.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect;
  if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX + (mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY + ny*(covS/camAspect); }

// ═══════════════════════════════════════════════════════════════════════
//  HANDS
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.42;

function mkHand(){
  return {
    on:false, t:-9,
    px:0, py:0,          // palm centre, screen px
    span:1,              // wrist→middle-MCP, screen px (aspect-correct)
    pinch:0,             // 0..1, 1 = fully pinched
    // crank tracking
    buf:[], head:0, n:0,
    cx:0, cy:0, rad:0, stab:0,
    ang:0, angInit:false, om:0, omS:0, omAbs:0, coh:0, cohS:0, energy:0
  };
}
var Hd=[mkHand(),mkHand()];
var BUFN=24;

function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  return fin(p.x)&&fin(p.y);
}
function resetCrank(h){
  h.buf.length=0; h.head=0; h.n=0;
  h.cx=0; h.cy=0; h.rad=0; h.stab=0;
  h.ang=0; h.angInit=false; h.om=0; h.omS=0; h.omAbs=0; h.coh=0; h.cohS=0; h.energy=0;
}
function loseHands(){
  for (var i=0;i<2;i++){ Hd[i].on=false; Hd[i].t=-9; Hd[i].pinch=0; resetCrank(Hd[i]); }
  // Gesture state must not survive a dropout. Wheel speed, the chien
  // accelerometer and the trill all reset, so reacquiring the hand cannot
  // fire a phantom buzz or a phantom note.
  bowRaw=0; bowS=0; omPrev=0; accS=0; chienArm=0; trillOn=false;
  crankIdx=-1; crankHold=0;
}

function readHand(h,L,t){
  if (!lmOK(L,0)||!lmOK(L,9)||!lmOK(L,4)||!lmOK(L,8)){ h.on=false; return; }
  var wx=sx(L[0].x), wy=sy(L[0].y);
  var mx=sx(L[9].x), my=sy(L[9].y);
  if (!fin(wx)||!fin(wy)||!fin(mx)||!fin(my)){ h.on=false; return; }
  var span=Math.hypot(mx-wx,my-wy);
  if (!fin(span)||span<1) span=1;
  h.span=span;
  h.px=wx*0.38+mx*0.62; h.py=wy*0.38+my*0.62;
  // PINCH as a RATIO in aspect-corrected screen space, normalised by the
  // hand's own span — never in raw normalised units, or the same physical
  // pinch would read twice as tight in portrait as in landscape.
  var tx=sx(L[4].x), ty=sy(L[4].y), ix=sx(L[8].x), iy=sy(L[8].y);
  if (fin(tx)&&fin(ty)&&fin(ix)&&fin(iy)){
    var r=Math.hypot(ix-tx,iy-ty)/span;
    h.pinch=clamp(1-(r-0.42)/0.46,0,1);
  } else h.pinch=0;
  h.on=true; h.t=t;
  pushCrank(h,t);
}

// ── circle tracking ────────────────────────────────────────────────────
// A ring buffer of recent palm positions. The fitted centre is their mean;
// the radius is the mean distance to it; stability is 1 minus the radius'
// coefficient of variation. Only a path that is actually round drives the
// wheel — waving a hand back and forth has stability near zero.
function pushCrank(h,t){
  var e=h.buf[h.head];
  if (!e){ e={x:0,y:0,t:0}; h.buf[h.head]=e; }
  // a teleport (a hand-index swap, or a reacquisition after a dropout) must
  // not be read as a huge angular step
  var prev=h.buf[(h.head-1+BUFN)%BUFN];
  if (h.n>0 && prev && Math.hypot(h.px-prev.x,h.py-prev.y)>MN*0.26){
    resetCrank(h);
    e=h.buf[h.head]; if (!e){ e={x:0,y:0,t:0}; h.buf[h.head]=e; }
  }
  e.x=h.px; e.y=h.py; e.t=t;
  h.head=(h.head+1)%BUFN;
  if (h.n<BUFN) h.n++;
  if (h.n<6){ h.energy=0; h.omS=chase(h.omS,0,14,1/60); h.omAbs=chase(h.omAbs,0,14,1/60); h.coh=0; h.cohS=0; return; }
  var sxs=0,sys=0,i,p;
  for (i=0;i<h.n;i++){ p=h.buf[i]; sxs+=p.x; sys+=p.y; }
  h.cx=sxs/h.n; h.cy=sys/h.n;
  var sr=0,sr2=0,d;
  for (i=0;i<h.n;i++){ p=h.buf[i]; d=Math.hypot(p.x-h.cx,p.y-h.cy); sr+=d; sr2+=d*d; }
  var mr=sr/h.n;
  var va=sr2/h.n-mr*mr; if (va<0) va=0;
  h.rad=mr;
  h.stab=(mr>1e-4)?clamp(1-(Math.sqrt(va)/mr)/0.62,0,1):0;
  var a=Math.atan2(h.py-h.cy,h.px-h.cx);
  if (!fin(a)) return;
  if (!h.angInit){ h.ang=a; h.angInit=true; h.om=0; return; }
  var d2=a-h.ang;
  while (d2>Math.PI) d2-=TAU;
  while (d2<-Math.PI) d2+=TAU;
  h.ang=a;
  var last=h.buf[(h.head-2+BUFN)%BUFN];
  var dt=(last&&fin(last.t))?(t-last.t):(1/30);
  if (!(dt>1e-4)) dt=1/30;
  if (dt>0.25){ h.om=0; h.energy=0; return; }
  var om=d2/dt;
  if (!fin(om)) om=0;
  om=clamp(om,-26,26);
  h.om=om;
  h.omS=chase(h.omS,om,11,dt);
  h.omAbs=chase(h.omAbs,Math.abs(om),11,dt);
  // COHERENCE is what separates cranking from waving. A circle turns the
  // same way every frame, so the smoothed SIGNED rate and the smoothed
  // ABSOLUTE rate are the same number; a hand being shaken about has a
  // large absolute rate and a signed rate near zero. Without this, any
  // fidgeting inside the radius gate would sound the strings.
  h.coh=(h.omAbs>0.25)?clamp(Math.abs(h.omS)/h.omAbs,0,1):0;
  // and it has to STAY coherent: a random walk throws up the occasional
  // run of same-sign steps, so coherence is itself integrated over about
  // half a second before it is allowed to open the gate. The musical cost
  // is that the wheel takes a moment to bite, which is what a rosined
  // wheel does anyway.
  h.cohS=chase(h.cohS,h.coh,3.5,dt);
  h.energy=Math.abs(h.omS)*crankGate(h);
}
// radius, roundness and direction-coherence, all measured against MN so a
// phone and a laptop demand the same physical gesture
function crankGate(h){
  var rg=smooth01((h.rad-MN*0.026)/(MN*0.05));
  var cg=smooth01((h.cohS-0.66)/0.26);
  return rg*h.stab*cg;
}
function handLive(h){ return h.on && (now()-h.t)<LOST_S; }

function onHands(res){
  var t=now();
  updateCover();
  var mh=res?res.multiHandLandmarks:null;
  var k=(mh&&typeof mh.length==='number')?Math.min(mh.length,2):0;
  for (var i=0;i<2;i++){
    if (i<k) readHand(Hd[i],mh[i],t);
    else if (Hd[i].on && (t-Hd[i].t)>=LOST_S){ Hd[i].on=false; resetCrank(Hd[i]); }
  }
}
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0, selfieMode:false,
                       minDetectionConfidence:0.55, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  TUNING ─ three chōshi, no wrong notes in any of them
// ═══════════════════════════════════════════════════════════════════════
var NKEY=11;
var CHROMA=['ハ','嬰ハ','ニ','嬰ニ','ホ','ヘ','嬰ヘ','ト','嬰ト','イ','嬰イ','ロ'];
var CHOSHI=[
  { name:'ニ', pc:2, base:146.832, drone:73.416, fifth:110.000,
    deg:[0,2,4,5,7,9,10,12,14,16,17] },                      // D mixolydian
  { name:'ト', pc:7, base:195.998, drone:97.999, fifth:146.832,
    deg:[0,2,4,5,7,9,11,12,14,16,17] },                      // G major
  { name:'イ短', pc:9, base:220.000, drone:110.000, fifth:164.814,
    deg:[0,2,3,5,7,8,10,12,14,15,17] }                       // A aeolian
];
var mode=0;
function keyFreq(i){
  var C=CHOSHI[mode]||CHOSHI[0];
  i=clamp(Math.round(i),0,NKEY-1);
  var f=C.base*Math.pow(2,C.deg[i]/12);
  return fin(f)?clamp(f,40,4000):C.base;
}
function keyName(i){
  var C=CHOSHI[mode]||CHOSHI[0];
  i=clamp(Math.round(i),0,NKEY-1);
  return CHROMA[((C.pc+C.deg[i])%12+12)%12];
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ 車輪は弓である
//
//  Three friction-excited strings, built once and never rebuilt. Each is
//  a sawtooth pair through a resonant lowpass whose cutoff is a multiple
//  of its own fundamental TIMES bow speed — so the timbre opens with the
//  wheel exactly as rosin bite does, instead of just getting louder. A
//  band-passed noise layer riding at 3f is the rosin itself; at slow
//  speeds a random-walk detune makes the scratch that a real wheel has
//  before it settles. On top of all three sits a wooden body: three
//  peaking filters in series at 220 / 430 / 1150 Hz.
//
//  The chien is separate and percussive: a 1.1 kHz band of noise with a
//  6 ms attack and a 110 ms decay, plus a low thump, fired by angular
//  ACCELERATION. It is the only thing in the piece that is not sustained.
// ═══════════════════════════════════════════════════════════════════════
var ac=null, comp=null, master=null, dryG=null, wetG=null, conv=null;
var bodyIn=null, noiseBuf=null, audioOK=false;
var STR=[];   // 0 bourdon, 1 mouche(fifth), 2 chanterelle(melody)

function makeIR(){
  var sr=ac.sampleRate, len=Math.floor(sr*1.9);
  var buf=ac.createBuffer(2,len,sr);
  for (var c=0;c<2;c++){
    var d=buf.getChannelData(c);
    for (var i=0;i<len;i++){
      var x=i/len;
      d[i]=(Math.random()*2-1)*Math.pow(1-x,2.5)*(1-Math.exp(-i/(sr*0.005)))*0.5;
    }
    var er=[0.009,0.017,0.029,0.043,0.061,0.083];
    for (var k=0;k<er.length;k++){
      var idx=Math.floor(er[k]*sr)+c*11;
      if (idx<len) d[idx]+=(k%2?-1:1)*0.4/(k+1);
    }
  }
  return buf;
}
function makeNoise(){
  var sr=ac.sampleRate, len=Math.floor(sr*1.0);
  var buf=ac.createBuffer(1,len,sr);
  var d=buf.getChannelData(0);
  for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function mkString(f,det,gain,cutMul){
  var s={ f:f, target:f, gain:gain, cutMul:cutMul, jit:0 };
  s.out=ac.createGain(); s.out.gain.value=0;
  s.lp=ac.createBiquadFilter(); s.lp.type='lowpass';
  s.lp.frequency.value=clamp(f*3,60,16000); s.lp.Q.value=3.6;
  s.lp.connect(s.out);
  s.o1=ac.createOscillator(); s.o1.type='sawtooth'; s.o1.frequency.value=f; s.o1.detune.value=-det;
  s.o2=ac.createOscillator(); s.o2.type='sawtooth'; s.o2.frequency.value=f; s.o2.detune.value= det;
  s.g1=ac.createGain(); s.g1.gain.value=0.5;
  s.g2=ac.createGain(); s.g2.gain.value=0.5;
  s.o1.connect(s.g1); s.g1.connect(s.lp);
  s.o2.connect(s.g2); s.g2.connect(s.lp);
  // rosin: a band of noise riding on the third partial
  s.nz=ac.createBufferSource(); s.nz.buffer=noiseBuf; s.nz.loop=true;
  s.bp=ac.createBiquadFilter(); s.bp.type='bandpass';
  s.bp.frequency.value=clamp(f*3,80,12000); s.bp.Q.value=1.3;
  s.ng=ac.createGain(); s.ng.gain.value=0;
  s.nz.connect(s.bp); s.bp.connect(s.ng); s.ng.connect(s.out);
  s.out.connect(bodyIn);
  try{ s.o1.start(); s.o2.start(); s.nz.start(); }catch(e){}
  return s;
}
function initAudio(){
  if (audioOK) return true;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return false;
  try{
    ac=new AC();
    comp=ac.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=10; comp.ratio.value=4.5;
    comp.attack.value=0.005; comp.release.value=0.2;
    master=ac.createGain(); master.gain.value=0.82;
    comp.connect(master); master.connect(ac.destination);

    conv=ac.createConvolver(); conv.buffer=makeIR();
    wetG=ac.createGain(); wetG.gain.value=0.34;
    dryG=ac.createGain(); dryG.gain.value=0.92;
    conv.connect(wetG); wetG.connect(comp); dryG.connect(comp);

    // wooden body: three peaking resonances in series
    var b1=ac.createBiquadFilter(); b1.type='peaking'; b1.frequency.value=220; b1.Q.value=1.9; b1.gain.value=5.0;
    var b2=ac.createBiquadFilter(); b2.type='peaking'; b2.frequency.value=430; b2.Q.value=2.8; b2.gain.value=3.4;
    var b3=ac.createBiquadFilter(); b3.type='peaking'; b3.frequency.value=1150; b3.Q.value=2.4; b3.gain.value=2.2;
    b1.connect(b2); b2.connect(b3); b3.connect(dryG); b3.connect(conv);
    bodyIn=b1;

    noiseBuf=makeNoise();
    var C=CHOSHI[mode];
    STR=[ mkString(C.drone,5,0.30,2.2),
          mkString(C.fifth,4,0.22,2.6),
          mkString(C.base ,3,0.34,3.4) ];
    audioOK=true;
    setRoom();
    return true;
  }catch(e){ ac=null; audioOK=false; return false; }
}
function setRoom(){
  if (!audioOK||!wetG) return;
  var v=roomEl?(+roomEl.value||0)/100:0.4;
  try{ wetG.gain.setTargetAtTime(0.10+v*0.52,ac.currentTime,0.08); }catch(e){}
}
if (roomEl) roomEl.addEventListener('input',setRoom);

// per-frame audio update
function audioFrame(dt){
  if (!audioOK||!ac) return;
  var t=ac.currentTime;
  var bow=bowS;
  for (var i=0;i<3;i++){
    var s=STR[i];
    if (!s) continue;
    var amp=(bow<=0.002)?0:s.gain*Math.pow(clamp(bow,0,1.25),0.72);
    if (!fin(amp)) amp=0;
    try{ s.out.gain.setTargetAtTime(clamp(amp,0,1),t,bow>0.01?0.045:0.055); }catch(e){}
    var cut=clamp(s.f*(1.5+s.cutMul*(0.4+bow*3.4)),60,15000);
    if (!fin(cut)) cut=800;
    try{ s.lp.frequency.setTargetAtTime(cut,t,0.06); }catch(e){}
    // rosin scratch is loud when the wheel is slow and disappears when fast
    var nz=clamp(0.10*bow*(1.25-clamp(bow,0,1)),0,0.2);
    try{ s.ng.gain.setTargetAtTime(fin(nz)?nz:0,t,0.07); }catch(e){}
    var bpf=clamp(s.f*3,80,12000);
    try{ s.bp.frequency.setTargetAtTime(bpf,t,0.1); }catch(e){}
    // slow-speed pitch instability: a bounded random walk in cents
    s.jit=clamp(s.jit+(Math.random()*2-1)*0.9,-7,7);
    var det=s.jit*(1-clamp(bow,0,1))*1.5;
    var base=(i===2)?(s.target):(s.f);
    if (!fin(base)||base<=0) base=110;
    try{
      s.o1.frequency.setTargetAtTime(base,t,i===2?0.018:0.05);
      s.o2.frequency.setTargetAtTime(base,t,i===2?0.018:0.05);
      s.o1.detune.setTargetAtTime(-5+det,t,0.05);
      s.o2.detune.setTargetAtTime( 5-det,t,0.05);
    }catch(e){}
    if (i===2) s.f=base;
  }
}
function setMelody(f){
  if (!audioOK||!STR[2]||!fin(f)) return;
  STR[2].target=clamp(f,40,4000);
}
function retuneStrings(){
  if (!audioOK) return;
  var C=CHOSHI[mode]||CHOSHI[0], t=ac.currentTime;
  if (STR[0]){ STR[0].f=C.drone; try{ STR[0].o1.frequency.setTargetAtTime(C.drone,t,0.09); STR[0].o2.frequency.setTargetAtTime(C.drone,t,0.09); }catch(e){} }
  if (STR[1]){ STR[1].f=C.fifth; try{ STR[1].o1.frequency.setTargetAtTime(C.fifth,t,0.09); STR[1].o2.frequency.setTargetAtTime(C.fifth,t,0.09); }catch(e){} }
}
function playChien(amt){
  if (!audioOK||!ac||!noiseBuf) return;
  var t=ac.currentTime, a=clamp(amt,0.18,1);
  try{
    var src=ac.createBufferSource(); src.buffer=noiseBuf; src.loop=false;
    var off=Math.random()*0.5; src.playbackRate.value=0.85+Math.random()*0.4;
    var bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=900+Math.random()*420; bp.Q.value=1.7;
    var g=ac.createGain(); g.gain.value=0;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.42*a,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0009,t+0.10+0.07*a);
    src.connect(bp); bp.connect(g); g.connect(dryG); g.connect(conv);
    src.start(t,off,0.30); src.stop(t+0.34);
    var o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(96,t+0.09);
    var og=ac.createGain(); og.gain.setValueAtTime(0,t);
    og.gain.linearRampToValueAtTime(0.20*a,t+0.005);
    og.gain.exponentialRampToValueAtTime(0.0007,t+0.15);
    o.connect(og); og.connect(dryG);
    o.start(t); o.stop(t+0.2);
  }catch(e){}
}
function playKeyTap(){
  if (!audioOK||!ac||!noiseBuf) return;
  var t=ac.currentTime;
  try{
    var src=ac.createBufferSource(); src.buffer=noiseBuf;
    var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=2.2;
    var g=ac.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.10,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.0006,t+0.055);
    src.connect(bp); bp.connect(g); g.connect(dryG);
    src.start(t,Math.random()*0.5,0.08); src.stop(t+0.09);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  PLAY STATE
// ═══════════════════════════════════════════════════════════════════════
var started=false, last=0;
var crankIdx=-1, crankHold=0;
var wheelAng=0, wheelDir=1;
var bowRaw=0, bowS=0;
var omPrev=0, accS=0, chienArm=0, chienCount=0, chienFlash=0, chienT=-9;
var keyIdx=5, keyIdxF=5, keyPress=0, keyHandOn=false, keyPos=0.5;
var trillOn=false, trillPh=0;
var bodyRock=0, shake=0;
var dust=[], DUSTN=150, dustHead=0;
for (var di=0; di<DUSTN; di++) dust.push({a:0,x:0,y:0,vx:0,vy:0,r:1,hot:0});

function spawnDust(x,y,vx,vy,r,hot){
  var d=dust[dustHead]; dustHead=(dustHead+1)%DUSTN;
  d.a=1; d.x=x; d.y=y; d.vx=vx; d.vy=vy; d.r=r; d.hot=hot?1:0;
}

function setMode(i){
  mode=clamp(i|0,0,2);
  for (var k=0;k<3;k++) if (mBtn[k]) mBtn[k].className=(k===mode)?'on':'';
  retuneStrings();
}
for (var mi=0; mi<3; mi++) (function(i){
  if (mBtn[i]) mBtn[i].addEventListener('click',function(){ setMode(i); });
})(mi);

function pickCrank(t,dt){
  var a=handLive(Hd[0]), b=handLive(Hd[1]);
  if (!a&&!b){ crankIdx=-1; crankHold=0; return; }
  if (a&&!b){ crankIdx=0; crankHold=0; return; }
  if (b&&!a){ crankIdx=1; crankHold=0; return; }
  var e0=Hd[0].energy, e1=Hd[1].energy;
  var want=(e1>e0)?1:0;
  if (crankIdx<0){ crankIdx=want; crankHold=0; return; }
  var other=1-crankIdx;
  // hysteresis: the other hand must beat the current crank by 1.6× for a
  // third of a second before the roles swap, or a momentary wobble in the
  // key hand would steal the wheel mid-phrase.
  if (Hd[other].energy>Hd[crankIdx].energy*1.6+0.25){
    crankHold+=dt;
    if (crankHold>0.3){ crankIdx=other; crankHold=0; }
  } else crankHold=0;
}

function step(dt){
  var t=now();
  pickCrank(t,dt);
  var ch=(crankIdx>=0&&handLive(Hd[crankIdx]))?Hd[crankIdx]:null;

  // ── the wheel ────────────────────────────────────────────────────────
  var om=0;
  if (ch){
    om=ch.omS;
    // a hand the model has stopped reporting is not a hand that is still
    // cranking: staleness pulls the bow off the strings before the
    // landmark is formally declared lost.
    var fresh=1-smooth01((t-ch.t-0.06)/0.16);
    bowRaw=clamp(Math.abs(om)/8.2,0,1.25)*crankGate(ch)*fresh;
  } else bowRaw=0;
  // rise fast, fall faster: a bow that stops moving stops sounding, and
  // that is the whole identity of the instrument.
  bowS=chase(bowS,bowRaw,bowRaw>bowS?13:12,dt);
  if (bowS<0.005) bowS=0;
  if (Math.abs(om)>0.6) wheelDir=(om>0)?1:-1;
  wheelAng+=om*dt;
  if (!fin(wheelAng)) wheelAng=0;
  wheelAng=wheelAng%TAU;

  // ── the chien: angular ACCELERATION, not position ────────────────────
  var acc=(dt>1e-4)?(om-omPrev)/dt:0;
  if (!fin(acc)) acc=0;
  omPrev=om;
  accS=chase(accS,clamp(acc,-260,260),18,dt);
  var sens=chienEl?(+chienEl.value||0)/100:0.52;
  var thr=lerp(74,20,sens);
  chienArm=Math.max(0,chienArm-dt);
  if (ch && bowS>0.14 && Math.abs(accS)>thr && chienArm<=0){
    var amt=clamp((Math.abs(accS)-thr)/70,0.2,1);
    playChien(amt);
    chienCount++; chienFlash=1; chienT=t; chienArm=0.13; shake=Math.min(1,shake+0.55*amt);
    var cxp=W*0.5+wheelDX*FIT, cyp=H*0.5+wheelDY*FIT;
    for (var k=0;k<14;k++){
      var ang=Math.random()*TAU, sp=(60+Math.random()*230)*amt;
      spawnDust(cxp+Math.cos(ang)*8,cyp+Math.sin(ang)*8,Math.cos(ang)*sp,Math.sin(ang)*sp-40,1.1+Math.random()*2.2,true);
    }
    accS*=0.25;
  }
  chienFlash=Math.max(0,chienFlash-dt*4.2);
  shake=Math.max(0,shake-dt*3.4);

  // ── the keys ─────────────────────────────────────────────────────────
  var kh=null;
  for (var i=0;i<2;i++) if (i!==crankIdx && handLive(Hd[i])) kh=Hd[i];
  keyHandOn=!!kh;
  var src=kh?kh:(ch?ch:null);
  if (src){
    // gesture span is anchored to MN (the short edge) so the same physical
    // reach covers the same eleven keys in portrait and in landscape.
    var yy=(src===kh)?src.py:src.cy;
    if (!fin(yy)) yy=H*0.5;
    keyPos=clamp(0.5-(yy-H*0.5)/GSPAN,0,1);
    var raw=keyPos*(NKEY-1);
    // quantise with hysteresis so a hand hovering on a boundary does not
    // chatter between two keys
    if (Math.abs(raw-keyIdx)>0.62) keyIdx=clamp(Math.round(raw),0,NKEY-1);
    keyIdxF=chase(keyIdxF,keyIdx,20,dt);
  }
  if (keyIdx!==lastKey){
    if (bowS>0.05) playKeyTap();
    keyPress=1; lastKey=keyIdx;
  }
  keyPress=Math.max(0,keyPress-dt*3.2);

  // ── the ornament ─────────────────────────────────────────────────────
  var wantTrill=!!(kh && kh.pinch>0.62 && bowS>0.06);
  if (wantTrill&&!trillOn) trillPh=0;
  trillOn=wantTrill;
  var play=keyIdx;
  if (trillOn){
    trillPh+=dt*9.5;
    if ((trillPh%1)>0.5) play=clamp(keyIdx+1,0,NKEY-1);
  }
  setMelody(keyFreq(play));

  // ── body sway, geared to the wheel ───────────────────────────────────
  bodyRock=chase(bodyRock,Math.sin(wheelAng)*0.012*clamp(bowS,0,1),9,dt);

  // ── rosin dust shed by a turning wheel ───────────────────────────────
  if (bowS>0.22 && Math.random()<bowS*0.55){
    var cx2=W*0.5+wheelDX*FIT, cy2=H*0.5+wheelDY*FIT;
    var aa=wheelAng+ (Math.random()-0.5);
    var rr=wheelR*FIT;
    spawnDust(cx2+Math.cos(aa)*rr,cy2+Math.sin(aa)*rr,
              -Math.sin(aa)*wheelDir*rr*Math.abs(om)*0.12,
               Math.cos(aa)*wheelDir*rr*Math.abs(om)*0.12-18,
              0.7+Math.random()*1.4,false);
  }
  for (var d2=0; d2<DUSTN; d2++){
    var p=dust[d2];
    if (p.a<=0) continue;
    p.a-=dt*(p.hot?1.5:2.2);
    p.vy+=260*dt; p.vx*=Math.pow(0.22,dt); p.vy*=Math.pow(0.5,dt);
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if (p.a<0) p.a=0;
  }

  audioFrame(dt);
  updateRead();
}
var lastKey=-1;

var readAcc=0;
function updateRead(){
  readAcc+=1;
  if (readAcc<6) return;
  readAcc=0;
  if (rRev) rRev.textContent=(bowS<0.01)?'—':(Math.abs(omPrev)/TAU).toFixed(2);
  if (rNote) rNote.textContent=(bowS<0.01)?'—':keyName(keyIdx);
  if (rChien) rChien.textContent=String(chienCount);
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAWING ─ design space is 980×620, centred, uniform FIT
// ═══════════════════════════════════════════════════════════════════════
var wheelDX=118, wheelDY=14, wheelR=118;
var KBX=-352, KBY=-176, KBW=118, KBH=352;

function buildWood(){
  var c=document.createElement('canvas');
  var TW=256, TH=256;
  c.width=TW; c.height=TH;
  var g=c.getContext('2d');
  if (!g) return null;
  g.fillStyle='#22160c'; g.fillRect(0,0,TW,TH);
  // long grain
  var i,y,k;
  for (i=0;i<130;i++){
    y=Math.random()*TH;
    var w=0.4+Math.random()*2.1;
    var al=0.03+Math.random()*0.12;
    g.strokeStyle='rgba(0,0,0,'+al.toFixed(3)+')';
    g.lineWidth=w;
    g.beginPath();
    g.moveTo(0,y);
    for (k=1;k<=8;k++) g.lineTo(TW*k/8, y+Math.sin(k*1.3+i)*2.2);
    g.stroke();
  }
  for (i=0;i<70;i++){
    y=Math.random()*TH;
    g.strokeStyle='rgba(201,145,63,'+(0.018+Math.random()*0.05).toFixed(3)+')';
    g.lineWidth=0.5+Math.random()*1.3;
    g.beginPath(); g.moveTo(0,y);
    for (k=1;k<=8;k++) g.lineTo(TW*k/8, y+Math.sin(k*0.9+i*2.1)*1.8);
    g.stroke();
  }
  // medullary rays, across the grain
  for (i=0;i<60;i++){
    var x0=Math.random()*TW, y0=Math.random()*TH;
    g.strokeStyle='rgba(201,145,63,'+(0.02+Math.random()*0.05).toFixed(3)+')';
    g.lineWidth=0.6;
    g.beginPath(); g.moveTo(x0,y0); g.lineTo(x0+2+Math.random()*3,y0+7+Math.random()*16); g.stroke();
  }
  return c;
}
function drawBackground(){
  if (!woodTile) woodTile=buildWood();
  if (woodTile){
    var pat=ctx.createPattern(woodTile,'repeat');
    if (pat){ ctx.fillStyle=pat; ctx.fillRect(0,0,W,H); }
    else { ctx.fillStyle='#22160c'; ctx.fillRect(0,0,W,H); }
  } else { ctx.fillStyle='#22160c'; ctx.fillRect(0,0,W,H); }
  // lamp from above-left: a linear tonal drift, NOT a radial vignette
  var lg=ctx.createLinearGradient(0,0,W*0.75,H);
  lg.addColorStop(0,'rgba(201,145,63,.10)');
  lg.addColorStop(0.45,'rgba(23,15,9,0)');
  lg.addColorStop(1,'rgba(10,6,3,.5)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
}

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}

function drawBody(g){
  // shadow
  g.save();
  g.translate(10,20);
  g.fillStyle='rgba(0,0,0,.42)';
  roundRect(g,-430,-210,860,420,44); g.fill();
  g.restore();
  // top plate
  var lg=g.createLinearGradient(-430,-210,320,210);
  lg.addColorStop(0,'#5a3a20');
  lg.addColorStop(0.42,'#3a2415');
  lg.addColorStop(1,'#241509');
  g.fillStyle=lg;
  roundRect(g,-430,-210,860,420,44); g.fill();
  g.lineWidth=3; g.strokeStyle='rgba(201,145,63,.42)'; g.stroke();
  g.lineWidth=1; g.strokeStyle='rgba(0,0,0,.5)';
  roundRect(g,-421,-201,842,402,38); g.stroke();
  // soundhole
  g.save();
  g.translate(-146,116);
  g.beginPath(); g.arc(0,0,30,0,TAU);
  g.fillStyle='#0d0805'; g.fill();
  g.lineWidth=2.4; g.strokeStyle='rgba(201,145,63,.5)'; g.stroke();
  for (var r=0;r<3;r++){
    g.beginPath(); g.arc(0,0,34+r*5,0,TAU);
    g.strokeStyle='rgba(201,145,63,'+(0.2-r*0.05).toFixed(3)+')'; g.lineWidth=1; g.stroke();
  }
  g.restore();
  // madder cloth under the keybox
  g.fillStyle='rgba(168,50,42,.28)';
  roundRect(g,KBX-22,KBY-26,KBW+44,KBH+52,12); g.fill();
  g.strokeStyle='rgba(168,50,42,.5)'; g.lineWidth=1.4; g.stroke();
}

function drawStrings(g,tt){
  var bow=clamp(bowS,0,1.25);
  var ys=[-56,0,56];
  var amps=[7.5,6.0,9.5];
  var modes=[1,2,3];
  for (var s=0;s<3;s++){
    var y0=ys[s];
    var A=amps[s]*bow*(0.55+0.45*Math.sin(tt*(3+s)));
    if (chienFlash>0) A*= (1+chienFlash*1.6);
    g.beginPath();
    var x;
    for (x=-392; x<=392; x+=8){
      var u=(x+392)/784;
      var v=Math.sin(u*Math.PI*modes[s])*Math.sin(tt*(41+s*13))
           +0.42*Math.sin(u*Math.PI*(modes[s]+2))*Math.sin(tt*(77+s*9));
      var yy=y0+v*A;
      if (x===-392) g.moveTo(x,yy); else g.lineTo(x,yy);
    }
    var hot=(s===2);
    g.lineWidth=hot?2.6:(s===0?3.2:2.2);
    if (chienFlash>0.02 && s!==2){
      g.strokeStyle='rgba(168,50,42,'+(0.35+chienFlash*0.6).toFixed(3)+')';
    } else {
      g.strokeStyle=hot?'rgba(239,224,196,'+(0.5+bow*0.45).toFixed(3)+')'
                      :'rgba(201,145,63,'+(0.4+bow*0.4).toFixed(3)+')';
    }
    g.stroke();
  }
  // tailpiece + pegs
  g.fillStyle='#1a1008';
  roundRect(g,376,-84,44,168,7); g.fill();
  g.strokeStyle='rgba(201,145,63,.45)'; g.lineWidth=1.3; g.stroke();
  for (var p=0;p<3;p++){
    g.beginPath(); g.arc(398,-56+p*56,7,0,TAU);
    g.fillStyle='#c9913f'; g.fill();
  }
}

function drawWheel(g,tt){
  var bow=clamp(bowS,0,1.25);
  g.save();
  g.translate(wheelDX,wheelDY);
  // well
  g.beginPath(); g.arc(0,0,wheelR+15,0,TAU);
  g.fillStyle='#120b06'; g.fill();
  g.strokeStyle='rgba(201,145,63,.3)'; g.lineWidth=1.6; g.stroke();
  g.save();
  g.rotate(wheelAng);
  // rim
  var rg=g.createRadialGradient(-wheelR*0.3,-wheelR*0.35,wheelR*0.1,0,0,wheelR);
  rg.addColorStop(0,'#7a5430');
  rg.addColorStop(0.62,'#4a2f18');
  rg.addColorStop(1,'#2a1a0c');
  g.beginPath(); g.arc(0,0,wheelR,0,TAU);
  g.fillStyle=rg; g.fill();
  g.lineWidth=5; g.strokeStyle='#c9913f'; g.stroke();
  // rosin grain on the rim so rotation is legible even at speed
  var i,a;
  for (i=0;i<48;i++){
    a=i/48*TAU;
    g.beginPath();
    g.moveTo(Math.cos(a)*(wheelR-9),Math.sin(a)*(wheelR-9));
    g.lineTo(Math.cos(a)*(wheelR-2),Math.sin(a)*(wheelR-2));
    g.strokeStyle='rgba(239,224,196,'+(i%2?0.1:0.2)+')'; g.lineWidth=1.6; g.stroke();
  }
  // spokes
  for (i=0;i<6;i++){
    a=i/6*TAU;
    g.beginPath();
    g.moveTo(Math.cos(a)*16,Math.sin(a)*16);
    g.lineTo(Math.cos(a)*(wheelR-10),Math.sin(a)*(wheelR-10));
    g.lineWidth=7; g.strokeStyle='rgba(58,36,21,.95)'; g.stroke();
    g.lineWidth=2; g.strokeStyle='rgba(201,145,63,.36)'; g.stroke();
  }
  g.restore();
  // motion arcs
  if (bow>0.2){
    for (i=0;i<3;i++){
      var w0=wheelAng*1.0 - wheelDir*(0.35+i*0.3)*clamp(bow,0,1.25);
      g.beginPath();
      g.arc(0,0,wheelR-16-i*8,w0,w0+wheelDir*(0.5+bow*0.8));
      g.strokeStyle='rgba(239,224,196,'+(0.10*bow/(i+1)).toFixed(3)+')';
      g.lineWidth=5; g.stroke();
    }
  }
  // hub
  g.beginPath(); g.arc(0,0,17,0,TAU);
  g.fillStyle='#c9913f'; g.fill();
  g.strokeStyle='#2a1a0c'; g.lineWidth=2; g.stroke();
  g.restore();

  // ── the crank arm, at your hand's angle ──────────────────────────────
  var ch=(crankIdx>=0&&handLive(Hd[crankIdx]))?Hd[crankIdx]:null;
  var ca=ch?ch.ang:wheelAng;
  g.save();
  g.translate(wheelDX,wheelDY);
  g.rotate(ca);
  g.lineCap='round';
  g.beginPath(); g.moveTo(0,0); g.lineTo(wheelR+56,0);
  g.lineWidth=13; g.strokeStyle='#3a2415'; g.stroke();
  g.lineWidth=7; g.strokeStyle='#c9913f'; g.stroke();
  g.beginPath(); g.arc(wheelR+56,0,16,0,TAU);
  var hg=g.createRadialGradient(wheelR+50,-6,3,wheelR+56,0,18);
  hg.addColorStop(0,'#f4d79a'); hg.addColorStop(0.6,'#c9913f'); hg.addColorStop(1,'#6d4816');
  g.fillStyle=hg; g.fill();
  g.strokeStyle='#2a1a0c'; g.lineWidth=2; g.stroke();
  g.restore();

  // ── the bridge that buzzes ───────────────────────────────────────────
  var lift=chienFlash*10;
  g.save();
  g.translate(wheelDX-wheelR-34,-56-lift);
  g.rotate(-chienFlash*0.3);
  g.fillStyle=chienFlash>0.03?'#a8322a':'#c9913f';
  roundRect(g,-9,-18,18,36,4); g.fill();
  g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=1.4; g.stroke();
  g.restore();
}

function drawKeybox(g){
  g.save();
  g.translate(KBX,KBY);
  g.fillStyle='#1c1108';
  roundRect(g,0,0,KBW,KBH,9); g.fill();
  g.strokeStyle='rgba(201,145,63,.46)'; g.lineWidth=1.6; g.stroke();
  var kh=(KBH-16)/NKEY;
  for (var i=0;i<NKEY;i++){
    // key 0 (lowest pitch) at the BOTTOM
    var idx=NKEY-1-i;
    var y=8+i*kh;
    var sel=(idx===keyIdx);
    var press=sel?(0.35+0.65*smooth01(clamp(bowS*3,0,1))):0;
    var dx=press*12 - keyPress*(sel?5:0);
    g.save();
    g.translate(dx,0);
    g.fillStyle=sel?'#efe0c4':'rgba(239,224,196,.30)';
    roundRect(g,7,y+1.5,KBW-24,kh-3,3); g.fill();
    if (sel){
      g.strokeStyle='#c9913f'; g.lineWidth=1.6; g.stroke();
    }
    g.fillStyle=sel?'#2a1a0e':'rgba(23,15,9,.6)';
    g.font=(sel?'700 ':'400 ')+Math.round(clamp(kh*0.56,9,17))+'px "Kaisei Decol", serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(keyName(idx),7+(KBW-24)/2,y+kh/2);
    g.restore();
  }
  g.restore();
}

function drawHandGhosts(g){
  // the tracked hands, in design space — proof that the camera sees you
  for (var i=0;i<2;i++){
    var h=Hd[i];
    if (!handLive(h)) continue;
    var isC=(i===crankIdx);
    var hx=(h.px-W*0.5)/FIT, hy=(h.py-H*0.5)/FIT;
    if (!fin(hx)||!fin(hy)) continue;
    if (isC && h.n>=6 && h.rad>MN*0.012){
      var cx=(h.cx-W*0.5)/FIT, cy=(h.cy-H*0.5)/FIT, rr=h.rad/FIT;
      g.beginPath(); g.arc(cx,cy,rr,0,TAU);
      g.strokeStyle='rgba(201,145,63,'+(0.14+0.4*h.stab).toFixed(3)+')';
      g.setLineDash([7,9]); g.lineWidth=2.4; g.stroke(); g.setLineDash([]);
      // the arrow of travel
      var a0=h.ang, dirs=(h.omS>=0)?1:-1;
      g.beginPath(); g.arc(cx,cy,rr,a0,a0+dirs*Math.min(1.5,Math.abs(h.omS)*0.16),dirs<0);
      g.strokeStyle='rgba(239,224,196,.5)'; g.lineWidth=3.5; g.stroke();
    }
    g.beginPath(); g.arc(hx,hy,isC?21:16,0,TAU);
    g.fillStyle=isC?'rgba(201,145,63,.28)':'rgba(239,224,196,.20)';
    g.fill();
    g.strokeStyle=isC?'rgba(201,145,63,.85)':'rgba(239,224,196,.6)';
    g.lineWidth=2.2; g.stroke();
    if (!isC && h.pinch>0.62){
      g.beginPath(); g.arc(hx,hy,26,0,TAU);
      g.strokeStyle='rgba(239,224,196,.75)'; g.lineWidth=1.6; g.stroke();
    }
  }
}

function drawGuideTrack(g){
  if (!keyHandOn && !(crankIdx>=0&&handLive(Hd[crankIdx]))) return;
  var x=KBX-46, span=GSPAN/FIT;
  g.beginPath(); g.moveTo(x,-span/2); g.lineTo(x,span/2);
  g.strokeStyle='rgba(239,224,196,.16)'; g.lineWidth=2; g.stroke();
  var y=(0.5-keyPos)*span;
  g.beginPath(); g.moveTo(x-9,y); g.lineTo(x+9,y);
  g.strokeStyle='#c9913f'; g.lineWidth=3; g.stroke();
}

function drawDust(g){
  for (var i=0;i<DUSTN;i++){
    var p=dust[i];
    if (p.a<=0) continue;
    g.beginPath(); g.arc(p.x,p.y,p.r*(0.4+p.a*0.9),0,TAU);
    g.fillStyle=p.hot?('rgba(168,50,42,'+(p.a*0.8).toFixed(3)+')')
                     :('rgba(201,145,63,'+(p.a*0.45).toFixed(3)+')');
    g.fill();
  }
}

function drawIdleHint(g,tt){
  if (bowS>0.03) return;
  var a=0.3+0.22*Math.sin(tt*2.2);
  g.fillStyle='rgba(239,224,196,'+a.toFixed(3)+')';
  g.font='400 26px "Kaisei Decol", serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('手で輪を描きつづける', 0, 258);
  var r=34, cx=0, cy=-256;
  g.beginPath(); g.arc(cx,cy,r,0,TAU);
  g.strokeStyle='rgba(201,145,63,'+(a*0.7).toFixed(3)+')';
  g.setLineDash([6,8]); g.lineWidth=2.4; g.stroke(); g.setLineDash([]);
  var ph=tt*1.7;
  g.beginPath(); g.arc(cx+Math.cos(ph)*r,cy+Math.sin(ph)*r,9,0,TAU);
  g.fillStyle='rgba(201,145,63,.9)'; g.fill();
}

function draw(){
  var tt=now();
  drawBackground();
  ctx.save();
  ctx.translate(W*0.5+(shake>0?(Math.random()-0.5)*shake*7:0),
                H*0.5+(shake>0?(Math.random()-0.5)*shake*7:0));
  ctx.scale(FIT,FIT);
  ctx.rotate(bodyRock);
  drawBody(ctx);
  drawStrings(ctx,tt);
  drawWheel(ctx,tt);
  drawKeybox(ctx);
  drawGuideTrack(ctx);
  drawHandGhosts(ctx);
  drawIdleHint(ctx,tt);
  ctx.restore();
  drawDust(ctx);
  if (chienFlash>0.02){
    ctx.fillStyle='rgba(168,50,42,'+(chienFlash*0.1).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}

function frame(){
  var t=now();
  var dt=clamp(t-last,0,0.1);
  last=t;
  if (started) step(dt);
  draw();
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM ─ teaches the gesture in one 3s loop
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoT=0;
function demoFrame(){
  if (!demoCtx) return;
  var g=demoCtx, DWd=demoCv.width, DHt=demoCv.height;
  demoT+=1/60;
  var ph=(demoT%3.0)/3.0;
  g.fillStyle='#1d1209'; g.fillRect(0,0,DWd,DHt);
  g.strokeStyle='rgba(201,145,63,.13)'; g.lineWidth=1;
  for (var x=0;x<DWd;x+=26){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,DHt); g.stroke(); }

  // left: the key hand sliding
  var kx=132, ky0=44, ky1=172;
  g.fillStyle='rgba(239,224,196,.14)';
  roundRect(g,kx-30,ky0-10,60,ky1-ky0+20,7); g.fill();
  var kp=0.5+0.42*Math.sin(demoT*1.25);
  for (var i=0;i<5;i++){
    var yy=ky0+ (ky1-ky0)*i/4;
    var sel=(Math.round((1-kp)*4)===i);
    g.fillStyle=sel?'#efe0c4':'rgba(239,224,196,.3)';
    roundRect(g,kx-24+(sel?7:0),yy-8,44,16,3); g.fill();
  }
  var hy=ky0+(ky1-ky0)*(1-kp);
  g.beginPath(); g.arc(kx+62,hy,15,0,TAU);
  g.fillStyle='rgba(239,224,196,.2)'; g.fill();
  g.strokeStyle='rgba(239,224,196,.75)'; g.lineWidth=2.2; g.stroke();

  // right: the crank hand circling
  var wx=452, wy=108, wr=58;
  g.beginPath(); g.arc(wx,wy,wr,0,TAU);
  g.fillStyle='#3a2415'; g.fill();
  g.strokeStyle='#c9913f'; g.lineWidth=3.5; g.stroke();
  var spin=demoT*(2.4+ (ph>0.66?5.5:0));
  for (var s2=0;s2<6;s2++){
    var a2=spin+s2/6*TAU;
    g.beginPath(); g.moveTo(wx+Math.cos(a2)*10,wy+Math.sin(a2)*10);
    g.lineTo(wx+Math.cos(a2)*(wr-7),wy+Math.sin(a2)*(wr-7));
    g.strokeStyle='rgba(201,145,63,.4)'; g.lineWidth=3; g.stroke();
  }
  var ha=spin;
  g.beginPath(); g.arc(wx,wy,wr+40,0,TAU);
  g.setLineDash([6,8]); g.strokeStyle='rgba(201,145,63,.4)'; g.lineWidth=2; g.stroke(); g.setLineDash([]);
  var hxp=wx+Math.cos(ha)*(wr+40), hyp=wy+Math.sin(ha)*(wr+40);
  g.beginPath(); g.arc(hxp,hyp,17,0,TAU);
  g.fillStyle='rgba(201,145,63,.3)'; g.fill();
  g.strokeStyle='#c9913f'; g.lineWidth=2.5; g.stroke();

  // the chien moment
  if (ph>0.66){
    var f=1-(ph-0.66)/0.34;
    g.fillStyle='rgba(168,50,42,'+(f*0.34).toFixed(3)+')';
    g.fillRect(0,0,DWd,DHt);
    g.fillStyle='#a8322a';
    g.font='700 17px "Kaisei Decol", serif'; g.textAlign='center';
    g.fillText('急に速く ＝ 唸る',DWd/2,DHt-22);
  } else {
    g.fillStyle='rgba(239,224,196,.6)';
    g.font='400 16px "Kaisei Decol", serif'; g.textAlign='center';
    g.fillText('手の高さ ＝ 鍵　　　輪を描く ＝ 弓',DWd/2,DHt-22);
  }
  if (demoRun && typeof requestAnimationFrame==='function') requestAnimationFrame(demoFrame);
}
if (demoCtx) demoFrame();

// ═══════════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════════
startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  initHands();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
updateCover();
setMode(0);
last=now();
frame();
</script>
