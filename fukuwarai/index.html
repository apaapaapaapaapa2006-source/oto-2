<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FUKUWARAI ─ 目かくし福笑い</title>
<meta name="description" content="のっぺらぼうの面に、眉・目・鼻・口を置いていく福笑い。手をひらくと部品が手のひらに乗るが、その瞬間に目かくしの布が下りて顔が消える。どこに顔があったかを覚えているうちに、握って置く。三つの面が終わると布が払われ、できた顔が動きだして笑う。">
<meta name="theme-color" content="#efe6d2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;600&family=Yuji+Syuku&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  FUKUWARAI ─ 目かくし福笑い                        ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   生成  kinari  #efe6d2  the washi. everything sits on this, and it
                                   is the brightest thing in the piece
            墨    sumi    #2b2620  every line. brush black, never pure black
            朱    shu     #cf3a2e  the mouth, the seal, the one hot colour
            金    kin     #c19b40  the verdict stamp and the rank, nothing else
            藍鼠  ainezu  #5d6e80  THE BLINDFOLD, and only the blindfold —
                                   the single cool colour, so the instant it
                                   appears the whole picture changes temperature
            MOOD: New Year daylight on a low table. Paper, not screen. There
            is no glow anywhere in this piece and no element is allowed to
            emit light — every colour is pigment sitting on fibre. The
            gallery is full of dusk; this one is a bright room in January.
  BACKGROUND  Washi drawn once to an offscreen canvas on resize: a cream
            field, a few hundred darker fibre flecks, four deckled edges and
            a very soft warm falloff into the corners. The live camera is
            composited over the whole sheet in 'multiply' at 0.09 so the
            room's shadow moves across the paper — you can always tell the
            camera is awake without the paper becoming a window.
  TYPE      Yuji Syuku for every Japanese word — it is a brushed 楷書 with a
            slightly unsteady stroke, which is exactly the hand that writes
            a 福笑い box lid. Josefin Sans 300 for numerals and latin, small
            and tracked +0.3em. Two sizes only: the brush shouts, the latin
            whispers, nothing sits between them.
  MOTION    Elastic, like paper cutouts on a table. Everything that arrives
            arrives with an overshoot (easeOutBack c=2.2) and then wobbles
            for ~0.4s on a decaying sine. Nothing fades linearly. The one
            exception is the blindfold, which moves on a heavy easeInOutCubic
            because cloth has weight.
  SIGNATURE THE BLINDFOLD IS A REAL CLOTH. Picking a part up does not fade
            the face out — a band of indigo cloth, woven with visible weft
            and a slack lower hem that sags and swings as it settles, sweeps
            down over the sheet and the face is simply GONE underneath it.
            You keep your own inked hand and the part you are carrying, and
            nothing else. At the end of a face the cloth is pulled off in one
            diagonal drag and the finished face is underneath, waiting.
  AUDIO     Koto and wood. The pluck when a part lifts is a real
            Karplus-Strong string — noise into a tuned delay with a lowpass
            in the feedback path — on a 都節 scale, one step up the scale per
            part so a whole face is a rising phrase. Placing is wood: a sine
            dropping 210→120Hz in 45ms under a bright noise click. The
            reveal is 拍子木, two hard clacks, then the phrase played back as
            an arpeggio. A part that misses the face slides off on a
            downward glide. Everything into one compressor.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#e5dcc6;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{font-family:'Josefin Sans',system-ui,sans-serif;color:#2b2620}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #video{position:fixed;width:2px;height:2px;opacity:.001;pointer-events:none;left:0;top:0}

  #flip{
    position:fixed;right:calc(env(safe-area-inset-right,0px) + .8rem);
    top:calc(env(safe-area-inset-top,0px) + .8rem);z-index:30;
    background:rgba(239,230,210,.86);color:#4a4038;border:1px solid rgba(43,38,32,.28);
    border-radius:2px;padding:.42rem .7rem;font:600 .62rem/1 'Josefin Sans',sans-serif;
    letter-spacing:.24em;cursor:pointer;backdrop-filter:blur(4px)
  }
  #flip:active{background:#cf3a2e;color:#f6ece0}
  #err{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;
    display:none;max-width:22rem;white-space:pre-wrap;text-align:center;
    background:#efe6d2;border:1px solid #cf3a2e;border-radius:2px;
    padding:1rem 1.1rem;font:400 .78rem/1.9 'Yuji Syuku',serif;
    color:#4a3a30;letter-spacing:.03em
  }

  .sheet{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#e5dcc6;padding:1.2rem;overflow:auto
  }
  .sheet.hide{display:none}
  .panel{
    width:min(29rem,100%);background:#efe6d2;color:#2b2620;
    border:1px solid rgba(43,38,32,.22);box-shadow:0 20px 54px rgba(70,55,35,.24);
    padding:1.5rem 1.35rem 1.6rem;position:relative
  }

  .stamp{
    display:flex;justify-content:space-between;font:300 .58rem/1 'Josefin Sans',sans-serif;
    letter-spacing:.3em;color:#9a8a68;margin-bottom:1rem
  }
  .panel h1{
    font-family:'Josefin Sans',sans-serif;font-weight:600;
    font-size:clamp(2.1rem,10vw,2.9rem);line-height:.92;letter-spacing:.02em;color:#2b2620
  }
  .panel h1 b{display:block;font-family:'Yuji Syuku',serif;font-size:.34em;font-weight:400;
    letter-spacing:.36em;color:#cf3a2e;margin-top:.7rem}

  .lead{font:400 .84rem/1.95 'Yuji Syuku',serif;color:#453c32}
  .lead em{font-style:normal;color:#cf3a2e;border-bottom:2px solid rgba(207,58,46,.28)}

  }

<body>

<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="err"></div>

<div class="sheet" id="startSheet">
  <div class="panel">
    <div class="stamp"><span>OTO-II / FUKUWARAI</span><span>目かくし福笑い</span></div>
    <h1>FUKUWARAI<b>ふくわらい</b></h1>
    <canvas id="demo" width="620" height="290"></canvas>
    <p class="lead">のっぺらぼうの面に、眉・目・鼻・口を置く。手を<em>ひらく</em>と部品が手のひらに乗り、その瞬間に<em>目かくしの布</em>が下りて顔が消える。<em>握る</em>と、そこに置かれる。</p>
    <ul class="rules">
      <li>布が下りる前に、顔がどこにあるか覚えておく</li>
      <li>面は三つ。毎回ちがう場所に、ちがう傾きで置かれる</li>
      <li>面からはみ出した部品は、紙をすべり落ちて零点</li>
    </ul>
    <button class="go" id="startBtn">START</button>
  </div>
</div>

<div class="sheet hide" id="overSheet">
  <div class="panel">
    <div class="stamp"><span>出来ばえ</span><span id="rFaces">三面</span></div>
    <p class="res">SCORE</p>
    <p class="big" id="rScore">0</p>
    <p class="rank" id="rRank">—</p>
    <p class="sub" id="rNote">—</p>
    <button class="go" id="retryBtn">RETRY</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  FUKUWARAI ─ 目かくし福笑い
//
//  Every face part lives in FACE SPACE: the face is the unit circle at the
//  origin, +y down, so a part's canonical home is a pair of constants that
//  never change no matter where, how big, or at what angle the face is laid
//  on the paper.  Placement converts the palm from canvas space into face
//  space through the inverse of the face transform, and scoring is then a
//  plain distance in face radii.  That is the whole reason a face can be
//  dropped anywhere on the sheet and rotated without touching the scoring.
// ═══════════════════════════════════════════════════════════════════════
var view = document.getElementById('view');
var g    = view.getContext('2d');
var video      = document.getElementById('video');
var errBox     = document.getElementById('err');
var flipBtn    = document.getElementById('flip');
var startSheet = document.getElementById('startSheet');
var overSheet  = document.getElementById('overSheet');
var startBtn   = document.getElementById('startBtn');
var retryBtn   = document.getElementById('retryBtn');
var demoCv     = document.getElementById('demo');
var rScore     = document.getElementById('rScore');
var rRank      = document.getElementById('rRank');
var rNote      = document.getElementById('rNote');
var rFaces     = document.getElementById('rFaces');

var now = (typeof performance !== 'undefined' && performance.now)
  ? function(){ return performance.now()/1000; }
  : function(){ return Date.now()/1000; };

function num(v,d){ return (typeof v==='number' && isFinite(v)) ? v : d; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOutBack(t){ var c=2.2; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); }
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
// a decaying wobble, +-1, used on everything that lands on the paper
function wobble(t, freq, life){
  if (t>=life) return 0;
  return Math.sin(t*freq*6.2831853)*Math.exp(-t*(4.6/Math.max(life,0.001)));
}

// ── palette ────────────────────────────────────────────────────────────
var C_PAPER='#efe6d2', C_PAPER_D='#e5dcc6', C_SUMI='#2b2620',
    C_SHU='#cf3a2e', C_KIN='#c19b40', C_AI='#5d6e80', C_AI_D='#48586a';

// ═══════════════════════════════════════════════════════════════════════
//  LAYOUT + WASHI
// ═══════════════════════════════════════════════════════════════════════
var W=1, H=1, DPR=1;
var washiCv=null, washiG=null;

function resize(){
  DPR = Math.min(2, (window.devicePixelRatio || 1));
  W = Math.max(1, Math.floor(window.innerWidth));
  H = Math.max(1, Math.floor(window.innerHeight));
  view.width  = Math.floor(W*DPR);
  view.height = Math.floor(H*DPR);
  view.style.width  = W+'px';
  view.style.height = H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
  buildWashi();
  layoutFace();
}

function buildWashi(){
  if (!washiCv){
    washiCv = document.createElement('canvas');
    washiG  = washiCv.getContext('2d');
  }
  if (!washiG) return;
  washiCv.width = W; washiCv.height = H;
  var c = washiG, i, x, y, l;
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = C_PAPER; c.fillRect(0,0,W,H);
  // fibre flecks — short darker hairs lying in the pulp
  var n = Math.floor((W*H)/2600);
  for (i=0;i<n;i++){
    x = Math.random()*W; y = Math.random()*H;
    l = 3 + Math.random()*13;
    var a = Math.random()*Math.PI;
    c.strokeStyle = 'rgba(120,104,74,'+(0.03+Math.random()*0.07).toFixed(3)+')';
    c.lineWidth = 0.6+Math.random()*0.7;
    c.beginPath();
    c.moveTo(x,y); c.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l);
    c.stroke();
  }
  // a few lighter pulp clumps
  for (i=0;i<Math.floor(n/6);i++){
    x = Math.random()*W; y = Math.random()*H;
    c.fillStyle = 'rgba(255,250,236,'+(0.12+Math.random()*0.16).toFixed(3)+')';
    c.beginPath(); c.arc(x,y,2+Math.random()*7,0,6.2831853); c.fill();
  }
  // warm falloff into the corners — the lamp is overhead and slightly left
  var gr = c.createRadialGradient(W*0.42,H*0.36,Math.min(W,H)*0.15,
                                  W*0.5,H*0.5,Math.max(W,H)*0.78);
  gr.addColorStop(0,'rgba(255,252,244,0.30)');
  gr.addColorStop(0.55,'rgba(255,252,244,0)');
  gr.addColorStop(1,'rgba(150,126,86,0.20)');
  c.fillStyle = gr; c.fillRect(0,0,W,H);
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ koto and wood
// ═══════════════════════════════════════════════════════════════════════
var A=null, comp=null, master=null, noiseBuf=null, audioOn=false;

function mkNoise(){
  if (!A) return null;
  var n = Math.floor(A.sampleRate*1.2);
  var b = A.createBuffer(1,n,A.sampleRate), d = b.getChannelData(0), i;
  for (i=0;i<n;i++) d[i] = Math.random()*2-1;
  return b;
}
function initAudio(){
  if (audioOn) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { A = new AC(); } catch(e){ A=null; return; }
  comp = A.createDynamicsCompressor();
  try {
    comp.threshold.value=-15; comp.knee.value=20; comp.ratio.value=6;
    comp.attack.value=0.004; comp.release.value=0.2;
  } catch(e){}
  master = A.createGain(); master.gain.value = 0.88;
  comp.connect(master); master.connect(A.destination);
  noiseBuf = mkNoise();
  audioOn = true;
}
function ac(){ return (A && audioOn) ? A.currentTime : 0; }

// 都節 — the scale the whole piece is tuned to. one step per part placed,
// so a finished face is a phrase that has climbed six degrees.
var MIYAKO = [0,1,5,7,8,12,13,17];
function deg(i){ return 220 * Math.pow(2, MIYAKO[clamp(i,0,MIYAKO.length-1)]/12); }

// real Karplus-Strong: a burst of noise poured into a delay whose length is
// the period, with a lowpass in the feedback path doing the string's damping
function pluck(f, amp, damp, when){
  if (!A || !noiseBuf) return;
  f = num(f,220); amp = num(amp,0.3); damp = num(damp,0.965);
  if (f < 40 || f > 4000) return;
  var t = num(when, ac());
  try{
    var dl = A.createDelay(0.06); dl.delayTime.value = 1/f;
    var fb = A.createGain();      fb.gain.value = clamp(damp,0,0.995);
    var lp = A.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.value = clamp(f*7, 300, 11000); lp.Q.value = 0.4;
    dl.connect(lp); lp.connect(fb); fb.connect(dl);
    // a hollow paulownia body: a gentle peak an octave and a bit up
    var body = A.createBiquadFilter(); body.type='peaking';
    body.frequency.value = clamp(f*2.6,200,9000); body.gain.value = 5; body.Q.value = 1.1;
    var out = A.createGain(); out.gain.value = amp;
    dl.connect(body); body.connect(out); out.connect(comp);
    var src = A.createBufferSource(); src.buffer = noiseBuf;
    var eg  = A.createGain();
    eg.gain.setValueAtTime(1,t); eg.gain.setValueAtTime(0, t + 2/f);
    src.connect(eg); eg.connect(dl);
    src.start(t); src.stop(t + 0.05);
    out.gain.setValueAtTime(amp, t+1.1);
    out.gain.exponentialRampToValueAtTime(0.0001, t+2.4);
    setTimeout(function(){
      try{ out.disconnect(); body.disconnect(); fb.disconnect(); lp.disconnect(); dl.disconnect(); }catch(e){}
    }, 2900);
  }catch(e){}
}

// wood: a sine dropping fast under a bright click. this is a part landing.
function wood(when){
  if (!A) return;
  var t = num(when, ac());
  try{
    var o = A.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(210,t);
    o.frequency.exponentialRampToValueAtTime(120, t+0.045);
    var og = A.createGain();
    og.gain.setValueAtTime(0.0001,t);
    og.gain.exponentialRampToValueAtTime(0.34, t+0.006);
    og.gain.exponentialRampToValueAtTime(0.0001, t+0.20);
    o.connect(og); og.connect(comp); o.start(t); o.stop(t+0.24);
    if (noiseBuf){
      var s = A.createBufferSource(); s.buffer=noiseBuf;
      var hp = A.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
      var ng = A.createGain();
      ng.gain.setValueAtTime(0.24,t);
      ng.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
      s.connect(hp); hp.connect(ng); ng.connect(comp);
      s.start(t); s.stop(t+0.07);
    }
  }catch(e){}
}

// 拍子木 — two hard bright clacks. the reveal, and nothing else.
function clack(when, gain){
  if (!A || !noiseBuf) return;
  var t = num(when, ac()), a = num(gain,0.5);
  try{
    var s = A.createBufferSource(); s.buffer=noiseBuf;
    var bp = A.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=2500; bp.Q.value=5;
    var ng = A.createGain();
    ng.gain.setValueAtTime(a,t);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    s.connect(bp); bp.connect(ng); ng.connect(comp);
    s.start(t); s.stop(t+0.12);
    var o = A.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(900,t);
    var og= A.createGain();
    og.gain.setValueAtTime(a*0.5,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(og); og.connect(comp); o.start(t); o.stop(t+0.08);
  }catch(e){}
}

// a part that missed the face, sliding off the paper
function slip(when){
  if (!A) return;
  var t = num(when, ac());
  try{
    var o = A.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(430,t);
    o.frequency.exponentialRampToValueAtTime(96, t+0.55);
    var og= A.createGain();
    og.gain.setValueAtTime(0.0001,t);
    og.gain.exponentialRampToValueAtTime(0.20,t+0.02);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
    o.connect(og); og.connect(comp); o.start(t); o.stop(t+0.64);
  }catch(e){}
}

// cloth: a short filtered-noise swish, the blindfold arriving or leaving
function swish(when, up){
  if (!A || !noiseBuf) return;
  var t = num(when, ac());
  try{
    var s = A.createBufferSource(); s.buffer=noiseBuf;
    var bp = A.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
    bp.frequency.setValueAtTime(up?520:1500, t);
    bp.frequency.exponentialRampToValueAtTime(up?1500:420, t+0.34);
    var ng = A.createGain();
    ng.gain.setValueAtTime(0.0001,t);
    ng.gain.exponentialRampToValueAtTime(0.13,t+0.09);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    s.connect(bp); bp.connect(ng); ng.connect(comp);
    s.start(t); s.stop(t+0.44);
  }catch(e){}
}

// the phrase the face turned out to be, played back at the reveal
function phrase(steps){
  if (!A || !steps || !steps.length) return;
  var t0 = ac()+0.30, i;
  for (i=0;i<steps.length;i++){
    pluck(deg(num(steps[i],0)), 0.26, 0.972, t0 + i*0.115);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null, camOK=false;

function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display='block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:960 }, height:{ ideal:720 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user'); camOK=true;
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing==='user') ? 'environment' : 'user';
  loseHand();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  HAND
//
//  Two numbers come out of the tracker and only two: where the palm is, and
//  how closed it is.  Closedness is the mean fingertip->wrist distance
//  divided by the palm's own length, so it is scale free — it reads the same
//  with the hand near the lens or far from it.  Open sits near 2.3, a fist
//  near 1.2, and the two thresholds below are deliberately far apart so that
//  tracker jitter, which is worth about 0.06 of this ratio, cannot walk the
//  state across on its own.  A grab must also be HELD for GRAB_HOLD before
//  it counts, which kills the last of it.
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S    = 0.42;   // s of silence before the hand is declared gone
var OPEN_TH   = 1.95;   // ratio above which the hand is open
var SHUT_TH   = 1.52;   // ratio below which the hand is a fist
var GRAB_HOLD = 0.10;   // s the fist must persist before a part is released
var OPEN_HOLD = 0.12;   // s the open hand must persist before a part is taken

var Hn = { live:false, t:-1e9, x:0.5, y:0.5, open:false, ratio:2.0,
           shutFor:0, openFor:0, tips:null };

function loseHand(){
  Hn.live=false; Hn.shutFor=0; Hn.openFor=0; Hn.tips=null;
  // a hand that vanishes mid-carry must not be able to place anything on
  // reacquisition, so the carry is unwound here rather than left dangling
  if (st.mode==='carry') returnPart();
}
function initHands(){
  if (typeof window.Hands !== 'function') return false;
  try{
    hands = new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
    }});
    hands.setOptions({ maxNumHands:1, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ return false; }
}
function startMpCamera(){
  if (!mpReady || !hands || mpCamera) return;
  if (typeof window.Camera !== 'function') return;
  try{
    mpCamera = new window.Camera(video, {
      onFrame:function(){
        if (!hands) return Promise.resolve();
        return hands.send({ image: video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}
function validLm(c){
  if (!c || typeof c.length !== 'number' || c.length < 21) return null;
  for (var i=0;i<21;i++){
    var p = c[i];
    if (!p || typeof p.x!=='number' || typeof p.y!=='number' ||
        !isFinite(p.x) || !isFinite(p.y)) return null;
  }
  return c;
}
var TIPS = [4,8,12,16,20];
function onHands(res){
  var list = (res && res.multiHandLandmarks) ? res.multiHandLandmarks : null;
  var lm = (list && list.length) ? validLm(list[0]) : null;
  if (!lm) return;                       // a dropped frame is not a lost hand
  var t = now();
  var wr = lm[0], mc = lm[9];
  var palm = Math.hypot(mc.x-wr.x, mc.y-wr.y);
  if (!isFinite(palm) || palm < 1e-4) return;
  var sum=0, i, p, tips=[];
  for (i=0;i<TIPS.length;i++){
    p = lm[TIPS[i]];
    sum += Math.hypot(p.x-wr.x, p.y-wr.y);
    tips.push({ x:p.x, y:p.y });
  }
  var ratio = (sum/TIPS.length)/palm;
  if (!isFinite(ratio)) return;

  // a gap in tracking is a fresh hand: the hold timers and the smoothed
  // ratio are both re-seeded, so a hand that left the frame open and comes
  // back open still has to hold it before anything fires
  var fresh = !Hn.live || (t - Hn.t) > LOST_S;
  if (fresh){ Hn.shutFor = 0; Hn.openFor = 0; Hn.ratio = ratio; }
  var dt = fresh ? 0 : clamp(t-Hn.t, 0, 0.25);
  if (!fresh) Hn.ratio = lerp(Hn.ratio, ratio, 0.45);
  if (Hn.ratio < SHUT_TH){ Hn.shutFor += dt; Hn.openFor = 0; }
  else if (Hn.ratio > OPEN_TH){ Hn.openFor += dt; Hn.shutFor = 0; }
  else { Hn.shutFor = 0; Hn.openFor = 0; }
  Hn.open = Hn.ratio > OPEN_TH;

  // the palm centre, halfway between the wrist and the knuckles, is far
  // steadier than any single landmark while the fingers are curling
  var px = (wr.x + mc.x)*0.5, py = (wr.y + mc.y)*0.5;
  Hn.x = mirror ? (1-px) : px;
  Hn.y = py;
  Hn.tips = tips;
  Hn.t = t; Hn.live = true;
}
function handAlive(){ return Hn.live && (now()-Hn.t) < LOST_S; }
function palmPx(){ return { x: Hn.x*W, y: Hn.y*H }; }

// ═══════════════════════════════════════════════════════════════════════
//  THE FACES
//
//  Canonical part homes, in face space (unit circle, +y down).  These are
//  the answers; the score is a distance from them.
// ═══════════════════════════════════════════════════════════════════════
var PART_ORDER = ['browL','browR','eyeL','eyeR','nose','mouth'];
var PART_JP = { browL:'ひだりの まゆ', browR:'みぎの まゆ', eyeL:'ひだりの め',
                eyeR:'みぎの め', nose:'はな', mouth:'くち' };

var FACES = [
  { key:'okame', jp:'おかめ', kana:'一の面',
    w:1.00, h:1.06, hair:'okame',
    home:{ browL:{x:-0.42,y:-0.44}, browR:{x:0.42,y:-0.44},
           eyeL:{x:-0.36,y:-0.13}, eyeR:{x:0.36,y:-0.13},
           nose:{x:0.00,y:0.10},  mouth:{x:0.00,y:0.46} } },
  { key:'hyottoko', jp:'ひょっとこ', kana:'二の面',
    w:0.92, h:1.10, hair:'hyottoko',
    home:{ browL:{x:-0.44,y:-0.52}, browR:{x:0.38,y:-0.33},
           eyeL:{x:-0.37,y:-0.18}, eyeR:{x:0.33,y:-0.02},
           nose:{x:0.03,y:0.13},   mouth:{x:0.09,y:0.48} } },
  { key:'oni', jp:'おに', kana:'三の面',
    w:1.06, h:1.00, hair:'oni',
    home:{ browL:{x:-0.46,y:-0.40}, browR:{x:0.46,y:-0.40},
           eyeL:{x:-0.38,y:-0.10}, eyeR:{x:0.38,y:-0.10},
           nose:{x:0.00,y:0.14},   mouth:{x:0.00,y:0.44} } }
];

// where the face is laid on the paper this round
var face = { cx:0, cy:0, r:1, rot:0, def:FACES[0] };

function layoutFace(){
  var base = Math.min(W,H);
  face.r = base*0.215;
  // recompute the pixel centre from the stored normalised drop so a resize
  // does not teleport a face that is already half finished
  face.cx = clamp(face.nx, 0.22, 0.78)*W;
  face.cy = clamp(face.ny, 0.20, 0.62)*H;
}
face.nx = 0.5; face.ny = 0.40;

function placeFaceForRound(ri){
  var def = FACES[clamp(ri,0,FACES.length-1)];
  face.def = def;
  // rounds drift further from the middle and lean harder
  var spread = [0.075, 0.125, 0.165][clamp(ri,0,2)];
  var tilt   = [0.05, 0.16, 0.26][clamp(ri,0,2)];
  face.nx = 0.5 + (Math.random()*2-1)*spread;
  face.ny = 0.40 + (Math.random()*2-1)*spread*0.72;
  face.rot = (Math.random()*2-1)*tilt;
  layoutFace();
}

// face space -> canvas
function f2c(fx, fy){
  var d = face.def;
  var x = fx*d.w*face.r, y = fy*d.h*face.r;
  var co = Math.cos(face.rot), si = Math.sin(face.rot);
  return { x: face.cx + x*co - y*si, y: face.cy + x*si + y*co };
}
// canvas -> face space
function c2f(px, py){
  var d = face.def;
  var dx = px-face.cx, dy = py-face.cy;
  var co = Math.cos(-face.rot), si = Math.sin(-face.rot);
  var x = dx*co - dy*si, y = dx*si + dy*co;
  return { x: x/(d.w*face.r), y: y/(d.h*face.r) };
}

// ═══════════════════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════════════════
var st = {
  running:false,
  mode:'idle',        // idle | show | carry | settle | reveal | over
  round:0,
  partIdx:0,
  tMode:0,            // s spent in the current mode
  placed:[],          // {key, fx, fy, t, score, off}
  roundScores:[],
  total:0,
  cloth:0,            // 0 = up and away, 1 = fully covering
  clothTarget:0,
  clothDrag:0,        // the diagonal pull-off at reveal
  carry:{ x:0, y:0, vx:0, vy:0, scale:0 },
  revealDone:false,
  overDone:false,
  hint:'',
  flash:0,
  slips:[],           // parts sliding off the paper
  puffs:[]
};

function resetGame(){
  st.round=0; st.total=0; st.roundScores.length=0;
  st.revealDone=false; st.overDone=false;
  beginRound(0);
}
function beginRound(ri){
  st.round = ri;
  st.partIdx = 0;
  st.placed.length = 0;
  st.slips.length = 0;
  st.puffs.length = 0;
  st.revealDone = false;
  placeFaceForRound(ri);
  setMode('show');
}
function setMode(m){
  st.mode = m; st.tMode = 0;
  if (m==='show'){
    st.clothTarget = 0;
    st.hint = '手をひらいて「'+PART_JP[PART_ORDER[st.partIdx]]+'」をとる';
  } else if (m==='carry'){
    st.clothTarget = 1;
    st.hint = 'にぎると そこに おかれる';
  } else if (m==='settle'){
    st.clothTarget = 0;
  } else if (m==='reveal'){
    st.clothTarget = 0;
    st.clothDrag = 0;
    st.hint = '';
  }
}

function trayPos(){ return { x: W*0.5, y: H - Math.min(W,H)*0.13 }; }

function takePart(){
  if (st.mode!=='show' || st.partIdx>=PART_ORDER.length) return;
  var t = trayPos();
  st.carry.x = t.x; st.carry.y = t.y; st.carry.vx=0; st.carry.vy=0; st.carry.scale=0;
  setMode('carry');
  pluck(deg(st.partIdx), 0.30, 0.968);
  swish(ac(), true);
}
// the hand went away while carrying — put it back, lift the cloth, no score
function returnPart(){
  if (st.mode!=='carry') return;
  setMode('show');
  swish(ac(), false);
}
function dropPart(){
  if (st.mode!=='carry' || st.partIdx>=PART_ORDER.length) return;
  var key = PART_ORDER[st.partIdx];
  var f = c2f(st.carry.x, st.carry.y);
  var d = face.def;
  // is it even on the face?  the outline is the unit ellipse in face space
  var on = (f.x*f.x + f.y*f.y) <= 1.16;
  var home = d.home[key];
  var err = Math.hypot(f.x-home.x, f.y-home.y);
  var sc = on ? Math.round(clamp(100*(1 - Math.max(0, err-0.055)/0.52), 0, 100)) : 0;

  st.placed.push({ key:key, fx:f.x, fy:f.y, t:0, score:sc, off:!on,
                   cx:st.carry.x, cy:st.carry.y });
  if (!on){
    st.slips.push({ key:key, x:st.carry.x, y:st.carry.y, vy:0, rot:0, vr:(Math.random()*2-1)*2.4 });
    slip(ac());
  } else {
    wood(ac());
    puff(st.carry.x, st.carry.y, sc);
  }
  st.partIdx++;
  st.flash = 1;
  setMode('settle');
}
function puff(x,y,sc){
  var n = 5 + Math.round(sc/14), i;
  for (i=0;i<n;i++){
    var a = Math.random()*6.2831853, sp = 18+Math.random()*70;
    st.puffs.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-22,
                    life:0.5+Math.random()*0.45, t:0, r:1+Math.random()*2.4 });
  }
}

function finishRound(){
  if (st.revealDone) return;            // exactly once
  st.revealDone = true;
  var s=0, i, steps=[];
  for (i=0;i<st.placed.length;i++){ s += st.placed[i].score; steps.push(i); }
  var avg = st.placed.length ? Math.round(s/st.placed.length) : 0;
  st.roundScores.push(avg);
  st.total += avg;
  setMode('reveal');
  clack(ac(), 0.5);
  clack(ac()+0.13, 0.42);
  phrase(steps);
}
function afterReveal(){
  if (st.round < FACES.length-1){ beginRound(st.round+1); }
  else { endGame(); }
}
function endGame(){
  if (st.overDone) return;              // exactly once
  st.overDone = true;
  st.running = false;
  st.mode = 'over';
  var avg = st.roundScores.length ? Math.round(st.total/st.roundScores.length) : 0;
  var rank, note;
  if (avg>=88){ rank='神 業'; note='ずれが指一本ぶんもない。目かくしをしていたとは思えない出来。'; }
  else if (avg>=72){ rank='大 吉'; note='顔がちゃんと顔になっている。三面ともよく覚えていた。'; }
  else if (avg>=55){ rank='中 吉'; note='だいたい合っている。傾いた面でずれたぶんが響いた。'; }
  else if (avg>=35){ rank='小 吉'; note='眉と口が旅に出ている。福笑いとしてはこれが正しい。'; }
  else { rank='大 凶'; note='もはや顔ではない。よく笑える顔ができた、という意味では満点。'; }
  rScore.textContent = String(avg);
  rRank.textContent  = rank;
  rNote.textContent  = note + '（' + st.roundScores.join(' ・ ') + '）';
  rFaces.textContent = FACES.length + '面';
  overSheet.classList.remove('hide');
}

// ═══════════════════════════════════════════════════════════════════════
//  PART DRAWING ─ every part is a brushed shape in its own local units,
//  drawn at scale 1 == face radius, so one routine serves the tray, the
//  palm, the paper and the demo.
// ═══════════════════════════════════════════════════════════════════════
function drawPart(c, key, x, y, s, rot, alpha, faceKey){
  c.save();
  c.translate(x,y); c.rotate(num(rot,0)); c.scale(s,s);
  c.globalAlpha = clamp(num(alpha,1),0,1);
  c.lineCap='round'; c.lineJoin='round';
  var oni = (faceKey==='oni'), hy = (faceKey==='hyottoko');
  if (key==='browL' || key==='browR'){
    var sgn = (key==='browL') ? -1 : 1;
    c.strokeStyle = C_SUMI; c.lineWidth = 0.075;
    c.beginPath();
    if (oni){
      c.moveTo(-0.20*sgn, -0.075); c.quadraticCurveTo(0, -0.02, 0.21*sgn, 0.085);
    } else if (hy){
      c.moveTo(-0.20*sgn, 0.03); c.quadraticCurveTo(0, -0.10, 0.20*sgn, 0.02);
    } else {
      c.moveTo(-0.21*sgn, 0.035); c.quadraticCurveTo(0, -0.085, 0.21*sgn, 0.035);
    }
    c.stroke();
  } else if (key==='eyeL' || key==='eyeR'){
    var sq = (hy && key==='eyeR') ? 0.55 : 1;      // ひょっとこ squints
    c.fillStyle = C_SUMI;
    c.beginPath();
    if (oni){
      c.moveTo(-0.17,0); c.quadraticCurveTo(0,-0.135, 0.17,0);
      c.quadraticCurveTo(0, 0.135, -0.17, 0);
    } else {
      c.moveTo(-0.15,0); c.quadraticCurveTo(0,-0.10*sq, 0.15,0);
      c.quadraticCurveTo(0, 0.09*sq, -0.15, 0);
    }
    c.fill();
    if (oni){
      c.fillStyle = C_PAPER;
      c.beginPath(); c.arc(0.03,-0.012,0.036,0,6.2831853); c.fill();
    }
  } else if (key==='nose'){
    c.strokeStyle = C_SUMI; c.lineWidth=0.062;
    c.beginPath();
    c.moveTo(-0.012,-0.115);
    c.quadraticCurveTo(-0.075,0.055, 0.055,0.075);
    c.stroke();
    c.lineWidth=0.035;
    c.beginPath(); c.moveTo(0.055,0.075); c.quadraticCurveTo(0.10,0.062, 0.108,0.022); c.stroke();
  } else if (key==='mouth'){
    if (hy){
      c.fillStyle = C_SHU;
      c.beginPath(); c.ellipse(0,0,0.085,0.115,0,0,6.2831853); c.fill();
      c.strokeStyle = 'rgba(43,38,32,.55)'; c.lineWidth=0.022;
      c.beginPath(); c.ellipse(0,0,0.085,0.115,0,0,6.2831853); c.stroke();
    } else if (oni){
      c.fillStyle = C_SUMI;
      c.beginPath();
      c.moveTo(-0.20,-0.035); c.quadraticCurveTo(0,0.145, 0.20,-0.035);
      c.quadraticCurveTo(0,0.02, -0.20,-0.035);
      c.fill();
      c.fillStyle = C_PAPER;                       // two tusks
      c.beginPath(); c.moveTo(-0.10,-0.018); c.lineTo(-0.062,-0.018); c.lineTo(-0.081,0.052); c.fill();
      c.beginPath(); c.moveTo(0.062,-0.018); c.lineTo(0.10,-0.018); c.lineTo(0.081,0.052); c.fill();
    } else {
      c.fillStyle = C_SHU;
      c.beginPath();
      c.moveTo(-0.15,-0.02); c.quadraticCurveTo(0,0.13, 0.15,-0.02);
      c.quadraticCurveTo(0,0.035, -0.15,-0.02);
      c.fill();
    }
  }
  c.restore();
}

// the blank face: outline, hair, ears, and whatever the mask itself carries
function drawFaceBlank(c, alpha){
  var d = face.def;
  c.save();
  c.globalAlpha = clamp(alpha,0,1);
  c.translate(face.cx, face.cy); c.rotate(face.rot);
  var r = face.r, rx = r*d.w, ry = r*d.h;

  // a soft cast shadow so the mask sits ON the paper
  c.fillStyle = 'rgba(120,100,66,0.13)';
  c.beginPath(); c.ellipse(r*0.05, r*0.09, rx*1.005, ry*1.005, 0, 0, 6.2831853); c.fill();

  if (d.hair==='oni'){
    c.fillStyle = '#e2d3ad'; c.strokeStyle=C_SUMI; c.lineWidth=r*0.028;
    c.beginPath();
    c.moveTo(-rx*0.72, -ry*0.62); c.quadraticCurveTo(-rx*1.02,-ry*1.30, -rx*0.30,-ry*1.06);
    c.quadraticCurveTo(-rx*0.52,-ry*0.78, -rx*0.72,-ry*0.62); c.fill(); c.stroke();
    c.beginPath();
    c.moveTo(rx*0.72, -ry*0.62); c.quadraticCurveTo(rx*1.02,-ry*1.30, rx*0.30,-ry*1.06);
    c.quadraticCurveTo(rx*0.52,-ry*0.78, rx*0.72,-ry*0.62); c.fill(); c.stroke();
  }

  // the face itself
  c.fillStyle = (d.hair==='oni') ? '#f3ded2' : '#f7efdd';
  c.beginPath(); c.ellipse(0,0, rx, ry, 0, 0, 6.2831853); c.fill();
  c.strokeStyle = C_SUMI; c.lineWidth = r*0.026;
  c.beginPath(); c.ellipse(0,0, rx, ry, 0, 0, 6.2831853); c.stroke();

  // ears
  c.lineWidth = r*0.02;
  c.beginPath(); c.ellipse(-rx*0.99, ry*0.06, rx*0.10, ry*0.17, 0,0,6.2831853); c.stroke();
  c.beginPath(); c.ellipse( rx*0.99, ry*0.06, rx*0.10, ry*0.17, 0,0,6.2831853); c.stroke();

  if (d.hair==='okame'){
    c.fillStyle = '#2b2620';
    c.beginPath();
    c.moveTo(-rx, -ry*0.18);
    c.quadraticCurveTo(-rx*1.02, -ry*1.12, 0, -ry*1.02);
    c.quadraticCurveTo(rx*1.02, -ry*1.12, rx, -ry*0.18);
    c.quadraticCurveTo(rx*0.72, -ry*0.62, 0, -ry*0.56);
    c.quadraticCurveTo(-rx*0.72, -ry*0.62, -rx, -ry*0.18);
    c.fill();
    c.fillStyle = 'rgba(207,58,46,0.24)';                 // 頬紅
    c.beginPath(); c.ellipse(-rx*0.58, ry*0.24, rx*0.20, ry*0.13, 0,0,6.2831853); c.fill();
    c.beginPath(); c.ellipse( rx*0.58, ry*0.24, rx*0.20, ry*0.13, 0,0,6.2831853); c.fill();
  } else if (d.hair==='hyottoko'){
    c.fillStyle = '#2b2620';                              // 手ぬぐい
    c.beginPath();
    c.moveTo(-rx*1.02, -ry*0.40);
    c.quadraticCurveTo(0, -ry*1.16, rx*1.02, -ry*0.40);
    c.quadraticCurveTo(0, -ry*0.66, -rx*1.02, -ry*0.40);
    c.fill();
    c.fillStyle = C_SHU;
    c.beginPath(); c.arc(rx*0.60, -ry*0.63, rx*0.11, 0, 6.2831853); c.fill();
  }
  c.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  THE CLOTH ─ drawn in canvas space, a band with a woven weft and a hem
//  that sags.  cover 0..1 is how far down the sheet it has come.
// ═══════════════════════════════════════════════════════════════════════
var clothCv=null, clothG=null, clothW=0, clothH=0;
function clothTexture(){
  if (clothCv && clothW===Math.ceil(W) && clothH===Math.ceil(H)) return clothCv;
  if (!clothCv){ clothCv=document.createElement('canvas'); clothG=clothCv.getContext('2d'); }
  if (!clothG) return null;
  clothW = Math.ceil(W); clothH = Math.ceil(H);
  clothCv.width = clothW; clothCv.height = clothH;
  var c = clothG, i;
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = C_AI; c.fillRect(0,0,clothW,clothH);
  c.strokeStyle = 'rgba(30,42,56,0.30)'; c.lineWidth = 1;
  for (i=0;i<clothH;i+=4){ c.beginPath(); c.moveTo(0,i+0.5); c.lineTo(clothW,i+0.5); c.stroke(); }
  c.strokeStyle = 'rgba(122,140,158,0.16)';
  for (i=0;i<clothW;i+=5){ c.beginPath(); c.moveTo(i+0.5,0); c.lineTo(i+0.5,clothH); c.stroke(); }
  var gr = c.createLinearGradient(0,0,0,clothH);
  gr.addColorStop(0,'rgba(255,255,255,0.10)');
  gr.addColorStop(0.5,'rgba(0,0,0,0)');
  gr.addColorStop(1,'rgba(0,0,0,0.22)');
  c.fillStyle = gr; c.fillRect(0,0,clothW,clothH);
  return clothCv;
}
function drawCloth(c, cover, drag, tAbs){
  if (cover <= 0.001) return;
  var tex = clothTexture();
  var hem = H*cover;
  // the hem sags in the middle and swings for a moment after it settles
  var sag = Math.min(W,H)*0.055*Math.sin(Math.PI*clamp(cover,0,1));
  var sway = Math.sin(tAbs*3.1)*Math.min(W,H)*0.012*clamp(1-Math.abs(cover-1)*3,0,1);
  var dx = drag*W*1.25, dy = -drag*H*0.42;

  c.save();
  c.translate(dx, dy);
  c.beginPath();
  c.moveTo(-4,-4); c.lineTo(W+4,-4);
  c.lineTo(W+4, hem - sag*0.35);
  c.quadraticCurveTo(W*0.5, hem + sag + sway, -4, hem - sag*0.35);
  c.closePath();
  c.save(); c.clip();
  if (tex) c.drawImage(tex, 0, 0, W, H);
  else { c.fillStyle = C_AI; c.fillRect(0,0,W,H); }
  c.restore();
  // the hem edge, and its shadow falling on the paper below
  c.strokeStyle = C_AI_D; c.lineWidth = Math.max(2, Math.min(W,H)*0.006);
  c.beginPath();
  c.moveTo(-4, hem - sag*0.35);
  c.quadraticCurveTo(W*0.5, hem + sag + sway, W+4, hem - sag*0.35);
  c.stroke();
  c.restore();

  var sh = c.createLinearGradient(0, hem+dy, 0, hem+dy + Math.min(W,H)*0.09);
  sh.addColorStop(0,'rgba(60,55,45,0.20)');
  sh.addColorStop(1,'rgba(60,55,45,0)');
  c.fillStyle = sh;
  c.fillRect(0, hem+dy, W, Math.min(W,H)*0.09);
}

// ═══════════════════════════════════════════════════════════════════════
//  HAND INK ─ always drawn, cloth or no cloth, so you can see you are seen
// ═══════════════════════════════════════════════════════════════════════
function drawHand(c){
  if (!handAlive()) return;
  var p = palmPx();
  var r = Math.min(W,H)*0.052;
  var closed = clamp((OPEN_TH - Hn.ratio)/(OPEN_TH - SHUT_TH), 0, 1);
  c.save();
  c.globalAlpha = 0.9;
  c.strokeStyle = st.cloth>0.5 ? 'rgba(238,232,216,0.85)' : 'rgba(43,38,32,0.62)';
  c.lineWidth = Math.max(1.6, r*0.10);
  c.beginPath();
  c.arc(p.x, p.y, r*(1 - closed*0.34), 0, 6.2831853);
  c.stroke();
  // the fingertips, as five ink dots drawing in toward the palm as you close
  if (Hn.tips && Hn.tips.length===5){
    var i;
    for (i=0;i<5;i++){
      var t = Hn.tips[i];
      var tx = (mirror ? (1-t.x) : t.x)*W, ty = t.y*H;
      c.fillStyle = st.cloth>0.5 ? 'rgba(238,232,216,0.8)' : 'rgba(43,38,32,0.55)';
      c.beginPath();
      c.arc(tx, ty, Math.max(1.5, r*0.115), 0, 6.2831853);
      c.fill();
    }
  }
  c.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════════════════════
function drawHud(c){
  var pad = Math.min(W,H)*0.045;
  var s = Math.min(W,H);
  c.save();
  c.textBaseline='top';
  c.fillStyle='rgba(43,38,32,0.55)';
  c.font = '300 '+Math.max(9, s*0.026).toFixed(1)+'px "Josefin Sans",sans-serif';
  c.fillText('FUKUWARAI', pad, pad*0.62);
  c.fillStyle='rgba(43,38,32,0.85)';
  c.font = Math.max(12, s*0.040).toFixed(1)+'px "Yuji Syuku",serif';
  c.fillText(face.def.kana + '　' + face.def.jp, pad, pad*0.62 + s*0.036);

  // the six part slots, filled in as they are placed
  var bx = pad, by = pad*0.62 + s*0.092, bw = s*0.026, gap = s*0.012, i;
  for (i=0;i<PART_ORDER.length;i++){
    var done = i < st.placed.length;
    c.fillStyle = done ? (st.placed[i].off ? 'rgba(207,58,46,0.55)' : C_SUMI)
                       : 'rgba(43,38,32,0.16)';
    c.fillRect(bx + i*(bw+gap), by, bw, bw*0.34);
  }

  if (st.hint && st.mode!=='reveal'){
    c.textAlign='center'; c.textBaseline='bottom';
    c.font = Math.max(12, s*0.040).toFixed(1)+'px "Yuji Syuku",serif';
    c.fillStyle = st.cloth>0.5 ? 'rgba(238,232,216,0.92)' : 'rgba(43,38,32,0.78)';
    c.fillText(st.hint, W*0.5, H - Math.max(10, s*0.035));
  }
  c.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════════════
var lastT = 0, rafId = 0;

function step(dt, tAbs){
  st.tMode += dt;
  st.cloth += (st.clothTarget - st.cloth) * clamp(dt*6.2, 0, 1);
  st.flash = Math.max(0, st.flash - dt*2.6);

  // ── carried part springs toward the palm ────────────────────────────
  if (st.mode==='carry'){
    st.carry.scale = clamp(st.carry.scale + dt*5.5, 0, 1);
    if (handAlive()){
      var p = palmPx();
      var k = 150, damp = 15;
      st.carry.vx += (p.x - st.carry.x)*k*dt;
      st.carry.vy += (p.y - st.carry.y)*k*dt;
      st.carry.vx -= st.carry.vx*clamp(damp*dt,0,1);
      st.carry.vy -= st.carry.vy*clamp(damp*dt,0,1);
      st.carry.x += st.carry.vx*dt;
      st.carry.y += st.carry.vy*dt;
      if (Hn.shutFor >= GRAB_HOLD) dropPart();
    } else {
      returnPart();
    }
  } else if (st.mode==='show'){
    if (handAlive() && Hn.openFor >= OPEN_HOLD) takePart();
  } else if (st.mode==='settle'){
    if (st.tMode > 0.72){
      if (st.partIdx >= PART_ORDER.length) finishRound();
      else setMode('show');
    }
  } else if (st.mode==='reveal'){
    // cloth is already up; the drag pulls whatever is left off diagonally
    st.clothDrag = clamp(st.tMode/0.55, 0, 1);
    if (st.tMode > 2.9) afterReveal();
  }

  // ── placed parts settle, slipped parts fall off the sheet ───────────
  var i;
  for (i=0;i<st.placed.length;i++) st.placed[i].t += dt;
  for (i=st.slips.length-1;i>=0;i--){
    var s = st.slips[i];
    s.vy += 900*dt; s.y += s.vy*dt; s.rot += s.vr*dt;
    if (s.y > H + Math.min(W,H)*0.3) st.slips.splice(i,1);
  }
  for (i=st.puffs.length-1;i>=0;i--){
    var q = st.puffs[i];
    q.t += dt; q.vy += 210*dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.vx -= q.vx*clamp(2.2*dt,0,1);
    if (q.t >= q.life) st.puffs.splice(i,1);
  }
}

function render(tAbs){
  var s = Math.min(W,H);
  g.setTransform(DPR,0,0,DPR,0,0);
  // paper
  if (washiCv) g.drawImage(washiCv, 0, 0, W, H);
  else { g.fillStyle=C_PAPER; g.fillRect(0,0,W,H); }
  // the room's shadow moving across it
  if (camOK && video && video.videoWidth > 0){
    g.save();
    g.globalAlpha = 0.09;
    g.globalCompositeOperation = 'multiply';
    if (mirror){ g.translate(W,0); g.scale(-1,1); }
    var vw = video.videoWidth, vh = video.videoHeight;
    var sc = Math.max(W/vw, H/vh);
    g.drawImage(video, (W-vw*sc)/2, (H-vh*sc)/2, vw*sc, vh*sc);
    g.restore();
  }

  var revealing = (st.mode==='reveal');
  var faceVisible = (st.mode!=='carry') || st.cloth < 0.98;

  // ── the mask and everything already on it ──────────────────────────
  if (faceVisible){
    drawFaceBlank(g, 1);
    var i;
    for (i=0;i<st.placed.length;i++){
      var pl = st.placed[i];
      if (pl.off) continue;
      var pos = f2c(pl.fx, pl.fy);
      var wob = wobble(pl.t, 4.2, 0.5);
      var sc2 = face.r * (1 + wob*0.10);
      var pop = pl.t < 0.22 ? easeOutBack(clamp(pl.t/0.22,0,1)) : 1;
      drawPart(g, pl.key, pos.x, pos.y, sc2*pop, face.rot + wob*0.06, 1, face.def.key);
    }
  }

  // ── the finished face comes alive at the reveal ─────────────────────
  if (revealing) drawRevealExtras(g, tAbs);

  // ── parts sliding off the paper ─────────────────────────────────────
  var j;
  for (j=0;j<st.slips.length;j++){
    var sl = st.slips[j];
    drawPart(g, sl.key, sl.x, sl.y, face.r, sl.rot, 0.85, face.def.key);
  }
  // paper dust
  for (j=0;j<st.puffs.length;j++){
    var q = st.puffs[j];
    var a = 1 - q.t/q.life;
    g.fillStyle = 'rgba(120,104,74,'+(a*0.5).toFixed(3)+')';
    g.beginPath(); g.arc(q.x, q.y, q.r*(0.5+a*0.7), 0, 6.2831853); g.fill();
  }

  // ── the tray: the part waiting to be taken ──────────────────────────
  if (st.mode==='show' && st.partIdx < PART_ORDER.length){
    var t = trayPos();
    var breathe = 1 + Math.sin(tAbs*2.3)*0.045;
    g.save();
    g.globalAlpha = 0.16;
    g.strokeStyle = C_SUMI; g.lineWidth = Math.max(1, s*0.004);
    g.setLineDash([s*0.016, s*0.014]);
    g.beginPath(); g.arc(t.x, t.y, s*0.088, 0, 6.2831853); g.stroke();
    g.restore();
    drawPart(g, PART_ORDER[st.partIdx], t.x, t.y, face.r*1.25*breathe, 0, 1, face.def.key);
    g.save();
    g.textAlign='center'; g.textBaseline='top';
    g.font = Math.max(10, s*0.030).toFixed(1)+'px "Yuji Syuku",serif';
    g.fillStyle='rgba(43,38,32,0.5)';
    g.fillText(PART_JP[PART_ORDER[st.partIdx]], t.x, t.y + s*0.095);
    g.restore();
  }

  // ── the cloth ───────────────────────────────────────────────────────
  drawCloth(g, st.cloth, revealing ? easeInOut(clamp(st.clothDrag,0,1)) : 0, tAbs);

  // ── the part on the palm rides ABOVE the cloth ──────────────────────
  if (st.mode==='carry'){
    var ps = face.r * (0.85 + easeOutBack(clamp(st.carry.scale,0,1))*0.4);
    drawPart(g, PART_ORDER[clamp(st.partIdx,0,PART_ORDER.length-1)],
             st.carry.x, st.carry.y, ps, Math.sin(tAbs*2.6)*0.05, 1, face.def.key);
  }

  drawHand(g);

  // ── the white flash when something lands ────────────────────────────
  if (st.flash > 0.001){
    g.save();
    g.globalCompositeOperation='lighter';
    g.fillStyle = 'rgba(255,250,236,'+(st.flash*0.22).toFixed(3)+')';
    g.fillRect(0,0,W,H);
    g.restore();
  }

  drawHud(g);
}

// the payoff: the assembled face blinks, the mouth works, and a seal drops
function drawRevealExtras(c, tAbs){
  var t = st.tMode, s = Math.min(W,H);
  if (t < 0.5) return;
  var sc = st.roundScores.length ? st.roundScores[st.roundScores.length-1] : 0;

  // it wakes up: a shiver through the whole mask
  var sh = wobble(t-0.5, 3.0, 1.1) * s*0.006;
  // the seal
  if (t > 1.0){
    var k = clamp((t-1.0)/0.30, 0, 1);
    var kk = easeOutBack(k);
    var sx = W - s*0.17, sy = H*0.5 - s*0.02;
    c.save();
    c.translate(sx, sy);
    c.rotate((1-k)*0.5 - 0.06);
    c.scale(kk*1.0 + (1-kk)*1.8, kk*1.0 + (1-kk)*1.8);
    c.globalAlpha = clamp(k*1.4,0,1);
    c.fillStyle = C_SHU;
    c.beginPath();
    var rr = s*0.075, rad = s*0.012;
    c.moveTo(-rr+rad,-rr); c.lineTo(rr-rad,-rr); c.quadraticCurveTo(rr,-rr,rr,-rr+rad);
    c.lineTo(rr,rr-rad); c.quadraticCurveTo(rr,rr,rr-rad,rr);
    c.lineTo(-rr+rad,rr); c.quadraticCurveTo(-rr,rr,-rr,rr-rad);
    c.lineTo(-rr,-rr+rad); c.quadraticCurveTo(-rr,-rr,-rr+rad,-rr);
    c.fill();
    c.fillStyle = C_PAPER;
    c.textAlign='center'; c.textBaseline='middle';
    c.font = (s*0.052).toFixed(1)+'px "Yuji Syuku",serif';
    c.fillText(sc>=80?'吉':(sc>=50?'半':'凶'), 0, -s*0.018);
    c.font = '300 '+(s*0.040).toFixed(1)+'px "Josefin Sans",sans-serif';
    c.fillText(String(sc), 0, s*0.030);
    c.restore();
  }
  // 出来ばえ, brushed across the top of the mask
  if (t > 1.5){
    var k2 = clamp((t-1.5)/0.4,0,1);
    c.save();
    c.globalAlpha = k2;
    c.textAlign='center'; c.textBaseline='middle';
    c.font = (s*0.070).toFixed(1)+'px "Yuji Syuku",serif';
    c.fillStyle = C_KIN;
    c.fillText(sc>=80?'よく できました':(sc>=50?'まあまあ':'たいへん よろしい'),
               W*0.5, face.cy - face.r*1.42 + sh);
    c.restore();
  }
}

function frame(){
  rafId = requestAnimationFrame(frame);
  var t = now();
  var dt = clamp(t - lastT, 0, 0.05);
  lastT = t;
  if (st.running) step(dt, t);
  render(t);
}

// ═══════════════════════════════════════════════════════════════════════
//  START SHEET DEMO ─ a palm opens, a part rides it, the fist drops it
// ═══════════════════════════════════════════════════════════════════════
var dg = demoCv ? demoCv.getContext('2d') : null;
var demoT = 0, demoRaf = 0;
function demoFrame(){
  demoRaf = requestAnimationFrame(demoFrame);
  if (!dg) return;
  demoT += 1/60;
  var L = 4.2, u = (demoT % L)/L;
  var w = demoCv.width, h = demoCv.height;
  dg.setTransform(1,0,0,1,0,0);
  dg.fillStyle = '#e8ddc4'; dg.fillRect(0,0,w,h);

  var faceX = w*0.30, faceY = h*0.44, R = h*0.30;
  var covered = clamp((u-0.22)/0.10, 0, 1) * (1 - clamp((u-0.78)/0.10,0,1));

  // the blank face
  dg.save();
  dg.globalAlpha = 1 - covered*0.97;
  dg.fillStyle='#f7efdd'; dg.strokeStyle=C_SUMI; dg.lineWidth=R*0.075;
  dg.beginPath(); dg.ellipse(faceX,faceY,R,R*1.05,0,0,6.2831853); dg.fill(); dg.stroke();
  dg.fillStyle='#2b2620';
  dg.beginPath();
  dg.moveTo(faceX-R, faceY-R*0.18);
  dg.quadraticCurveTo(faceX-R, faceY-R*1.16, faceX, faceY-R*1.06);
  dg.quadraticCurveTo(faceX+R, faceY-R*1.16, faceX+R, faceY-R*0.18);
  dg.quadraticCurveTo(faceX+R*0.7, faceY-R*0.62, faceX, faceY-R*0.58);
  dg.quadraticCurveTo(faceX-R*0.7, faceY-R*0.62, faceX-R, faceY-R*0.18);
  dg.fill();
  dg.restore();

  // the eye already placed, once it has been dropped
  if (u > 0.76){
    dg.save();
    var pk = clamp((u-0.76)/0.06,0,1);
    dg.globalAlpha = 1 - covered*0.97;
    drawDemoEye(dg, faceX - R*0.34, faceY - R*0.10, R*(0.9+easeOutBack(pk)*0.25));
    dg.restore();
  }

  // the cloth
  if (covered > 0.001){
    dg.save();
    dg.fillStyle = C_AI;
    var hem = h*covered*0.92;
    dg.beginPath();
    dg.moveTo(0,0); dg.lineTo(w,0); dg.lineTo(w,hem-h*0.03);
    dg.quadraticCurveTo(w*0.5, hem+h*0.05, 0, hem-h*0.03);
    dg.closePath(); dg.fill();
    dg.strokeStyle=C_AI_D; dg.lineWidth=3;
    dg.beginPath();
    dg.moveTo(0,hem-h*0.03); dg.quadraticCurveTo(w*0.5,hem+h*0.05,w,hem-h*0.03); dg.stroke();
    dg.restore();
  }

  // the hand: travels left, opens at 0.20, closes at 0.74
  var hx = lerp(w*0.80, faceX - R*0.34, easeInOut(clamp((u-0.24)/0.48,0,1)));
  var hy = lerp(h*0.72, faceY - R*0.10, easeInOut(clamp((u-0.24)/0.48,0,1)));
  var open = (u>0.18 && u<0.74) ? 1 : 0;
  var oa = lerp(0.62, 1, open ? clamp((u-0.18)/0.05,0,1) : 1-clamp((u-0.74)/0.05,0,1));
  dg.save();
  dg.strokeStyle='rgba(43,38,32,0.66)'; dg.lineWidth=h*0.018;
  dg.beginPath(); dg.arc(hx,hy,h*0.085*oa,0,6.2831853); dg.stroke();
  var i;
  for (i=0;i<5;i++){
    var a = -2.5 + i*0.62;
    var rr = h*0.085*oa*(open?1.85:1.15);
    dg.fillStyle='rgba(43,38,32,0.55)';
    dg.beginPath(); dg.arc(hx+Math.cos(a)*rr, hy+Math.sin(a)*rr, h*0.014, 0, 6.2831853); dg.fill();
  }
  dg.restore();
  // the part riding the palm
  if (u>0.20 && u<0.76) drawDemoEye(dg, hx, hy, h*0.16);

  dg.save();
  dg.textAlign='left'; dg.textBaseline='top';
  dg.font = (h*0.075).toFixed(1)+'px "Yuji Syuku",serif';
  dg.fillStyle = covered>0.5 ? 'rgba(238,232,216,0.9)' : 'rgba(43,38,32,0.55)';
  dg.fillText(u<0.20 ? 'ひらく' : (u<0.74 ? 'はこぶ（顔は見えない）' : 'にぎる'), h*0.07, h*0.07);
  dg.restore();
}
function drawDemoEye(c, x, y, s){
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle=C_SUMI;
  c.beginPath();
  c.moveTo(-0.30,0); c.quadraticCurveTo(0,-0.20,0.30,0);
  c.quadraticCurveTo(0,0.18,-0.30,0);
  c.fill();
  c.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════
function begin(){
  initAudio();
  if (A && A.state === 'suspended' && A.resume) { try{ A.resume(); }catch(e){} }
  startSheet.classList.add('hide');
  overSheet.classList.add('hide');
  if (demoRaf){ cancelAnimationFrame(demoRaf); demoRaf=0; }
  st.running = true;
  resetGame();
  lastT = now();
  startStream().then(function(){
    if (initHands()) startMpCamera();
  }).catch(showError);
  if (!rafId) frame();
}
startBtn.addEventListener('click', begin);
retryBtn.addEventListener('click', function(){
  overSheet.classList.add('hide');
  st.running = true;
  st.overDone = false;
  resetGame();
  lastT = now();
});

window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
render(now());
demoFrame();
</script>
