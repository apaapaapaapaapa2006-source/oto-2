<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="赤い地の前で、映った人が白黒の肖像になり、顔から首まで黒い紋様の入れ墨が入る。波線・稲妻・渦・菱の紋様は顔に貼りついて首の動きについてくる。動くと線が流れ、入れたての墨が赤く滲む。タップで図案が彫り直される。">
<meta name="theme-color" content="#e8262d">
<title>IREZUMI ─ 顔に入る墨</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  IREZUMI 入れ墨 ─ 顔に入る墨                           ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       80 年代のロックのレコードジャケット。真っ赤な地に、エアブラシで
             描いたような白黒の顔。その顔から首まで、黒い紋様がびっしり
             入っている ── 部族の文様とオプアートの縞が混ざった、波線、
             稲妻、渦、菱、山形。目と唇だけは素肌のまま残る。
  RULE       紋様は画面ではなく顔に描かれている。両目と鼻から顔の座標を作り、
             紋様はその座標で計算するので、首を振れば紋様も回り、近づけば
             大きくなる。区画は顔の上の歪んだボロノイで、区画ごとに違う紋様、
             境目には太い黒線と細い素肌の縁。
  MOTION     タップで図案が変わり、鼻を中心に墨が外へ彫り広がっていく
             （彫りのモーター音）。動くと線が区画ごとに流れ、動いたところの
             墨は入れたての赤に滲む。
  PALETTE    赤の地・白黒の肌・墨。地の色は替えられる（赤・黄・青・黒）。
  TYPE       上に Josefin Sans 300 で作品名だけ、ジャケットの帯のように。
  TECH       WebGL2 の全画面シェーダ一枚。人物マスク（ImageSegmenter）と
             顔の点（FaceLandmarker）を交互のフレームで走らせる。顔が見えない
             ときは人物マスクの頭のあたりから顔の座標を推定し、モデルが無い
             ときは画面全体を赤の二色刷りにして紋様を重ねる。
  ══════════════════════════════════════════════════════════════════════════
-->

  <h1>IREZUMI</h1>
  <svg viewBox="0 0 150 150" aria-hidden="true">

<script>
'use strict';
/* =====================================================================
   IREZUMI — one full-screen shader. The person mask (ImageSegmenter) puts
   the portrait on the red; the face (FaceLandmarker, on alternate frames)
   gives a frame — origin at the nose, x along the eyes, unit = the eyes'
   distance — and the tattoo is computed in that frame, so it turns and
   scales with the head. The design is a domain-warped Voronoi on the face,
   one pattern per cell (wave lines, zigzags, rings, diamonds, chevrons,
   solid with white lines), black borders with a bare-skin keyline, and
   the eyes and lips left out.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const BGS = [
  { name:'赤', c:'#e8262d', title:'#ffffff' },
  { name:'黄', c:'#f2c418', title:'#141414' },
  { name:'青', c:'#1f5fd6', title:'#ffffff' },
  { name:'黒', c:'#121212', title:'#e8262d' },
].map(b => Object.assign(b, { C:hex(b.c), T:hex(b.title) }));
const S = { bg:0, dens:.5, freq:.5, ink:.85 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uVid, uF, uTxt, uMask;
uniform vec2 uRes, uScale;
uniform float uMirror, uT, uSeed, uDens, uFreq, uInk, uCover, uPhase, uHasMask, uLo, uHi, uMode, uTxtOn;
uniform vec4 uFace;               // origin x, y (px), unit (px), angle
uniform vec4 uEyes;               // left eye x, y, right eye x, y (px)
uniform vec4 uMouth;              // mouth x, y, half-width, half-height (px)
uniform vec4 uTxtRect;
uniform vec3 uBg, uTitle;
out vec4 o;
float h11(float n){ return fract(sin(n * 91.345 + uSeed * 17.13) * 43758.5453); }
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + uSeed * 3.71) * 43758.5453); }
vec2 h22(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))) + uSeed) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
vec2 vidUV(vec2 s){ vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
// lines of ink: 1 near the middle of every period of v, 'duty' of the period wide
float stripes(float v, float duty){
  float w = fwidth(v) * .75 + 1e-4;
  float s = abs(fract(v) - .5);
  return 1. - smoothstep(duty * .5 - w, duty * .5 + w, s);
}
// the tattoo at face-frame point q (unit = the eyes' distance)
float tattoo(vec2 q, out float rim){
  // the skin is not flat: warp the frame so the cells bend like they were drawn on a face
  vec2 w = q + .32 * (vec2(vn(q * 1.2 + 3.1), vn(q * 1.2 + 9.7)) - .5);
  vec2 g = w * uDens;
  vec2 ip = floor(g), fp = fract(g);
  float d1 = 8., d2 = 8.; vec2 id = vec2(0), rc = vec2(0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 c = vec2(i, j), r = c + .15 + .7 * h22(ip + c) - fp;
    float d = dot(r, r);
    if (d < d1){ d2 = d1; d1 = d; id = ip + c; rc = r; } else if (d < d2) d2 = d;
  }
  float edge = (sqrt(d2) - sqrt(d1)) / uDens;          // to the cell's border, in face units
  float h = h21(id * 1.31 + 7.), a = h21(id + 2.3) * 6.2832;
  vec2 lc = -rc / uDens;                                // from the cell's centre, face units
  vec2 r = mat2(cos(a), sin(a), -sin(a), cos(a)) * lc;
  float F = uFreq, ph = uPhase * (.6 + h);
  float ink;
  if (h < .2)       ink = stripes(r.y * F + .55 * sin(r.x * 3.1 + h * 40.) + ph, .46);                     // waves
  else if (h < .36) ink = stripes(r.y * F + abs(fract(r.x * F * .32) - .5) * 2.4 + ph, .5);              // zigzag
  else if (h < .52) ink = stripes(length(lc) * F * 1.15 - ph, .42);                                    // rings
  else if (h < .66){ float u = stripes((r.x + r.y) * F * .55 + ph, .5), v = stripes((r.x - r.y) * F * .55, .5);
                     ink = abs(u - v); }                                                                // diamonds
  else if (h < .82) ink = stripes(r.y * F * .7 + abs(r.x) * F * .55 + ph, .62);                          // chevrons
  else if (h < .94) ink = 1. - stripes(r.y * F * .9 + .35 * sin(r.x * 5.) + ph, .2);                      // solid, white lines
  else ink = 0.;                                                                                       // left bare
  // the cell's border: a heavy black line with a thin bare keyline inside it
  float bw = fwidth(edge) * .75 + 1e-4;
  float border = 1. - smoothstep(.045 - bw, .045 + bw, edge);
  float key = 1. - smoothstep(.085 - bw, .085 + bw, edge);
  rim = border;
  return max(border, ink * (1. - key));
}
void main(){
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 s = px / uRes;
  vec4 f = texture(uF, s);
  vec3 cam = texture(uVid, vidUV(s)).rgb;
  float l = dot(cam, vec3(.299, .587, .114));
  // the portrait: black and white, contrast pulled out to the person's own range
  float gv = clamp((l - uLo) / max(.08, uHi - uLo), 0., 1.);
  gv = gv * gv * (3. - 2. * gv);
  gv = .04 + .9 * gv;
  // the outline from the model's own mask, at its own resolution: a clean edge against the flat red
  float m = uHasMask > .5 ? smoothstep(.3, .7, texture(uMask, vidUV(s)).r) : 1.;
  // where the face frame puts this pixel
  vec2 d = px - uFace.xy;
  float ca = cos(uFace.w), sa = sin(uFace.w);
  vec2 q = vec2(ca * d.x + sa * d.y, -sa * d.x + ca * d.y) / uFace.z;
  float rim;
  float t = tattoo(q, rim);
  // the eyes and the lips stay bare, as they are on the sleeve
  float bare = 0.;
  float er = .34 * length(uEyes.zw - uEyes.xy);
  bare = max(bare, 1. - smoothstep(er * .85, er * 1.1, length((px - uEyes.xy) * vec2(1., 1.6))));
  bare = max(bare, 1. - smoothstep(er * .85, er * 1.1, length((px - uEyes.zw) * vec2(1., 1.6))));
  vec2 mq = (px - uMouth.xy) / max(uMouth.zw, vec2(1.));
  bare = max(bare, 1. - smoothstep(.95, 1.25, length(mq)));
  // the needle reaches out from the nose
  float reach = smoothstep(uCover, uCover - .6, length(q) + .5 * vn(q * 2.));
  // only skin takes the ink (the face itself always does): not the shirt, not the wall
  float cb = -.169 * cam.r - .331 * cam.g + .5 * cam.b + .5, cr = .5 * cam.r - .419 * cam.g - .081 * cam.b + .5;
  float skin = 1. - smoothstep(.75, 1.15, length(vec2((cb - .41) / .1, (cr - .59) / .085)));
  // the face oval itself always takes ink (unit = the eyes' distance: chin ~1.1 below the nose, brow ~1.4 above)
  float oval = length(vec2(q.x / .95, q.y / (q.y > 0. ? 1.15 : 1.6)));
  skin = max(skin, 1. - smoothstep(.95, 1.2, oval));
  skin *= smoothstep(.06, .16, l);                  // ink does not show on black cloth or hair anyway
  float amt = t * (1. - bare * (1. - rim * .3)) * reach * uInk * skin;
  // fresh ink, where you just moved, bleeds red
  vec3 inkc = mix(vec3(.035), vec3(.55, .04, .05), clamp(f.b * 1.4, 0., 1.)) * (.6 + .4 * gv);
  vec3 port = mix(vec3(gv), inkc, amt);
  // the red ground, flat like a print, with a little tooth
  vec3 bg = uBg * (.96 + .05 * vn(px / 1.6) - .03 * vn(px / 60.));
  vec3 col = mix(bg, port, m);
  if (uHasMask < .5){
    // no person model: the whole picture as a two-colour print on the ground colour
    vec3 duo = mix(vec3(.02), uBg, smoothstep(.15, .7, gv));
    duo = mix(duo, vec3(.96), smoothstep(.72, .98, gv));
    col = mix(duo, inkc, amt);
  }
  col += (h21(px + fract(uT) * 91.) - .5) * .03;
  if (uTxtOn > .5 && px.x > uTxtRect.x && px.y > uTxtRect.y && px.x < uTxtRect.z && px.y < uTxtRect.w){
    vec2 tt = (px - uTxtRect.xy) / (uTxtRect.zw - uTxtRect.xy);
    col = mix(col, uTitle, texture(uTxt, tt).a);
  }
  if (uMode < .5) col = cam;
  o = vec4(col, 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs, attrs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function tex(){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
let PR, vaoQ, texVid, texField, texTxt, texMask = null, txtW = 1, txtH = 1;
function initGL(){
  PR = prog(VS, FS, ['p']);
  vaoQ = gl.createVertexArray(); gl.bindVertexArray(vaoQ);
  const q = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, q);

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1800 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  ensureField(W, H);
  if (!M.external || !FACE.external) segment(now);
  if (M.live && now - M.lastT > 1500) M.live = false;
  if (FACE.live && now - FACE.lastT > 900) FACE.live = false;
  if (video.readyState < 2) return;
  const vt = video.currentTime, fresh = vt !== lastVT; lastVT = vt;
  const grabbed = fresh && grab();
  updateField(dt, grabbed);
  if (grabbed) levels();
  if (fresh){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }
  if (!FACE.live && grabbed) guessFace();
  easeFace(dt);

  // the needle works outward from the nose; you hear it while it does
  const before = DESIGN.cover;
  if (MODE.on) DESIGN.cover = Math.min(DESIGN.coverT, DESIGN.cover + dt * (1.4 + DESIGN.cover * 1.2));
  buzz(MODE.on && DESIGN.cover < 9 ? Math.min(1, (DESIGN.cover - before) / dt / 6 + .3) : 0);
  // moving makes the lines run
  phase += dt * Math.min(F.E, .25) * 9;

  const B = BGS[S.bg], ms = Math.min(W, H), sa = W / H, va = vidW / vidH;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(PR.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid); gl.uniform1i(PR.U.uVid, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texField); gl.uniform1i(PR.U.uF, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texTxt); gl.uniform1i(PR.U.uTxt, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texMask); gl.uniform1i(PR.U.uMask, 3);
  gl.uniform2f(PR.U.uRes, W, H); gl.uniform2f(PR.U.uScale, sa < va ? sa / va : 1, sa < va ? 1 : va / sa);
  gl.uniform1f(PR.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PR.U.uT, t);
  gl.uniform1f(PR.U.uSeed, DESIGN.seed); gl.uniform1f(PR.U.uDens, .8 + 1.6 * S.dens); gl.uniform1f(PR.U.uFreq, 4 + 10 * S.freq);
  gl.uniform1f(PR.U.uInk, .35 + .65 * S.ink); gl.uniform1f(PR.U.uCover, DESIGN.cover); gl.uniform1f(PR.U.uPhase, phase);
  gl.uniform1f(PR.U.uHasMask, M.has && M.live ? 1 : 0); gl.uniform1f(PR.U.uLo, LV.lo); gl.uniform1f(PR.U.uHi, LV.hi);
  gl.uniform1f(PR.U.uMode, MODE.on ? 1 : 0);
  gl.uniform4f(PR.U.uFace, FACE.x, FACE.y, Math.max(4, FACE.u), FACE.a);
  gl.uniform4f(PR.U.uEyes, FACE.ex, FACE.ey, FACE.fx, FACE.fy);
  gl.uniform4f(PR.U.uMouth, FACE.mx, FACE.my, FACE.mw, FACE.mh);
  const th = ms * .055, tw = th * txtW / txtH, ty = ms * .05 + (H > W ? ms * .14 : 0);
  gl.uniform4f(PR.U.uTxtRect, (W - tw) / 2, ty, (W + tw) / 2, ty + th); gl.uniform1f(PR.U.uTxtOn, 1);
  gl.uniform3fv(PR.U.uBg, B.C); gl.uniform3fv(PR.U.uTitle, B.T);
  gl.bindVertexArray(vaoQ); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__IREZUMI = {
  state: () => ({ on:MODE.on, bg:S.bg, cover:+DESIGN.cover.toFixed(2), seed:+DESIGN.seed.toFixed(2), E:+F.E.toFixed(4), mask:M.live, face:FACE.live,
                  frame:[FACE.x, FACE.y, FACE.u, FACE.a].map(v => +v.toFixed(2)), lo:+LV.lo.toFixed(3), hi:+LV.hi.toFixed(3) }),
  mode(m){ setMode(!!m); },
  bg(k){ setBg(k); },
  redo(){ redo(); },
  feedMask(data, w, h){ M.external = true; return ingestMask(data, w, h); },
  feedFace(lm){ FACE.external = true; return ingestFace(lm); },
};
