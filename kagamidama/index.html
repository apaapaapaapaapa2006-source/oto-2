<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人が銀のタイルでできたミラーボールになり、暗い部屋じゅうに光の粒を投げる。止まればゆっくり回り、動くほど速く回って光が壁を流れる。">
<meta name="theme-color" content="#060708">
<title>KAGAMIDAMA ─ ミラーボールになる体</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  KAGAMIDAMA 鏡玉 ─ ミラーボールになる体                 ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       照明を落としたクラブの一角。映った人だけが小さな銀のタイルを貼り
             詰めたミラーボールになり、スポットを受けた面が光って、部屋じゅうの
             壁に光の粒を投げる。止まっていればゆっくり回る夜更けの一枚、動けば
             ボールが回り出して光の粒が尾を引いて流れる。ハウスのレコード
             ジャケットや 70 年代ディスコの写真のような、黒と銀と一色の光。
  PALETTE    SILVER     地 #060708・タイル 銀・光 #f4f6fa
             CHAMPAGNE  地 #0a0806・タイル 金がかった銀・光 #ffd49a
             BLUE NOTE  地 #04060b・タイル 鋼・光 #8fb4ff
  TYPE       Poiret One（アールデコの細い題字）＋ JetBrains Mono（小さな字）。
  MOTION     基本は 1 周 40 秒ほどのゆっくりした回転。体を動かした量がそのまま
             回転の勢いになり（左右の向きも拾う）、粒は速さのぶんだけ長い尾を
             引く。動いたところのタイルは一瞬きらめく。タップで一押し回す。
  SIGNATURE  体のタイルが光を受けてきらめき、その光が部屋を回ること。
  SWITCH     はじめは素のカメラ。「▸ KAGAMIDAMA」で部屋の照明が落ち、タイルが
             ランダムな順に貼られて、スポットが入ると壁に粒が一斉に散る。
             「◂ CAMERA」で粒が消え、明かりが戻る。録画は両方で撮れる。
  TECH       WebGL2。CPU はタイル解像度の場（人物マスク・ふくらみ・明るさ・
             きらめき）を毎フレーム一枚のテクスチャにするだけ。タイル・粒・星形の
             きらめきはすべてシェーダ側でタイルごとの法線から決める。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>
:root{--bg:#060708;--fg:#eceef2;--dim:rgba(236,238,242,.5);--line:rgba(236,238,242,.2);--acc:#f4f6fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
  font-family:"JetBrains Mono","Hiragino Sans","Noto Sans JP",monospace;font-weight:300;transition:background .4s}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding:28px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#15171b 0,var(--bg) 60%)}

  background-blend-mode:normal,multiply,normal;box-shadow:0 0 30px rgba(255,255,255,.15)}

  appearance:none;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,transparent);color:var(--fg);
  font:400 10px "JetBrains Mono",monospace;letter-spacing:.42em;padding:13px 22px 13px 28px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .3s}

body.cam #mode{border-color:rgba(255,255,255,.55);color:#fff;background:rgba(0,0,0,.35)}

<body>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status" class="jp"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn jp">⟲ カメラ</button>
<button id="mode">▸ KAGAMIDAMA</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="spin" class="btn">SPIN</button>
</div>

<div id="panel" class="hide jp">
  <div class="chips" id="pals">
    <button data-p="0" class="on">SILVER</button>
    <button data-p="1">CHAMPAGNE</button>
    <button data-p="2">BLUE NOTE</button>
  </div>
  <label><span>タイル</span><input type="range" id="sTile" min="0" max="1" step="0.01" value="0.45"></label>
  <label><span>光の粒</span><input type="range" id="sSpeck" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>回りやすさ</span><input type="range" id="sSpin" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>部屋の明るさ</span><input type="range" id="sRoom" min="0" max="1" step="0.01" value="0.35"></label>
  <div class="note">動くほど速く回る。タップで一押し。</div>
</div>

<div id="start">
  <div class="t">MIRROR BALL</div>
  <h1>KAGAMIDAMA</h1>
  <div class="ball"></div>
  <p class="jp">まずは、いつものカメラ。<br>ボタンを押すと明かりが落ちて、<br>あなたはミラーボールになる。</p>
  <button id="go">START</button>
  <div id="err" class="jp"></div>
</div>

<script>
'use strict';
/* =====================================================================
   KAGAMIDAMA — the person as a mirror ball. The screen is tiled; every tile
   inside the person gets a normal from the (blurred) mask's bulge plus its
   own small tilt, glints when a slowly orbiting spotlight lines up with it,
   and throws one speck of light onto the dark room. Movement spins the ball.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

const PALS = [
  { name:'SILVER',    bg:[.024,.027,.031], tile:[.86,.88,.92], light:[.96,.97,.99], css:['#060708','#eceef2','#f4f6fa'] },
  { name:'CHAMPAGNE', bg:[.039,.031,.024], tile:[.93,.85,.70], light:[1.0,.83,.60], css:['#0a0806','#f3e9d8','#ffd49a'] },
  { name:'BLUE NOTE', bg:[.016,.024,.043], tile:[.74,.80,.90], light:[.56,.71,1.0], css:['#04060b','#e2e8f3','#8fb4ff'] },
];
const S = { pal:0, tile:.45, speck:.55, spin:.55, room:.35 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const COMMON = `
uniform sampler2D uField;           // per tile: r luminance, g/b normal x/y, a mask (high bit) + sparkle
uniform ivec2 uGrid;                // tiles across, down
uniform float uTile;                // tile size in px
uniform float uSpin;                // turns
float hh(float n){ return fract(sin(n) * 43758.5453); }
struct T { float m, spark, lum; vec3 n; };
T tileAt(ivec2 c){
  vec4 f = texelFetch(uField, clamp(c, ivec2(0), uGrid - 1), 0);
  float a = floor(f.a * 255. + .5);
  T t; t.m = step(127.5, a); t.spark = mod(a, 128.) / 127.; t.lum = f.r;
  vec2 n = f.gb * 2. - 1.;                                  // y up
  t.n = vec3(n, sqrt(max(0., 1. - dot(n, n))));
  return t;
}
// two spotlights orbiting the ball; returns the glint of a facet
float glint(vec3 n){
  float a = uSpin * 6.2832;
  vec3 h1 = normalize(vec3(sin(a) * .95, .32, 1.));
  vec3 h2 = normalize(vec3(sin(a + 2.3) * .95, -.22 + .15 * sin(a * .7), 1.));
  return pow(max(dot(n, h1), 0.), 180.) + .7 * pow(max(dot(n, h2), 0.), 240.);
}`;
const VS_Q = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
// the room: the camera, nearly dark; fades from the plain camera during the switch
const FS_BG = `#version 300 es
precision highp float;
uniform sampler2D uVid; uniform vec2 uRes, uScale; uniform float uMirror, uCam, uRoom, uT; uniform vec3 uBg;
out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
void main(){
  vec2 s = gl_FragCoord.xy / uRes; s.y = 1. - s.y;
  vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x;
  vec3 c = texture(uVid, v).rgb;
  float l = dot(c, vec3(.2126,.7152,.0722));
  vec2 q = s - .5; q.x *= uRes.x / uRes.y;
  vec3 room = uBg + vec3(l) * (.03 + .16 * uRoom) * (1. - .7 * smoothstep(.2, 1., length(q)));
  room += (h21(floor(gl_FragCoord.xy / 1.5) + fract(uT * 7.1) * 91.) - .5) * .018;
  o = vec4(mix(room, c, uCam), 1.);
}`;
// the tiles: one opaque pass over the person
const FS_TILE = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform vec3 uTileC, uLight; uniform float uReveal, uT;
out vec4 o;
${COMMON}
void main(){
  vec2 fc = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  ivec2 c = ivec2(floor(fc / uTile));
  T f = tileAt(c);
  float id = float(c.y * 4099 + c.x);
  float show = f.m * step(hh(id * 7.7) * .9, uReveal);
  if (show < .5) discard;
  vec2 u = fract(fc / uTile);
  vec3 n = f.n;
  // silver: posterised brightness of you under it (so the face still reads) + a mirror-ish scatter
  float L = floor(f.lum * 5. + .5) / 5.;
  float base = .10 + .62 * L + (hh(id * 3.3) - .5) * .16;
  base *= .75 + .35 * n.y;                                 // a soft key light from above
  float g = glint(n);
  vec3 col = uTileC * base * (1. + .25 * f.spark) + uLight * (g * 2.2 + f.spark * f.spark * .55);
  // bevel + grout
  float e = min(min(u.x, 1. - u.x), min(u.y, 1. - u.y));
  col *= mix(.12, 1., smoothstep(.02, .12, e));
  col *= 1. - .22 * u.y + .12 * (1. - u.x);
  o = vec4(col, 1.);
}`;
// specks on the room + star glints on the body: instanced quads, one per tile
const VS_SPK = `#version 300 es
precision highp float;
in vec2 aC;                         // corner (-1..1)
uniform vec2 uRes; uniform float uLag, uSize, uAmt, uReveal, uLayer, uT;
out vec2 vL; out float vI, vLen;
${COMMON}
void main(){
  int id = gl_InstanceID;
  ivec2 c = ivec2(id % uGrid.x, id / uGrid.x);
  T f = tileAt(c);
  float fid = float(c.y * 4099 + c.x);
  float S = min(uRes.x, uRes.y);
  vec2 A = uRes / S;                                       // canvas in short-edge units
  vec3 n = f.n;
  gl_Position = vec4(2., 2., 2., 1.); vI = 0.; vL = vec2(0.); vLen = 0.;
  if (f.m < .5 || hh(fid * 7.7) * .9 > uReveal) return;
  if (uLayer < .5){
    if (hh(fid * 5.1) > uAmt) return;                      // thin the specks out
    // each facet owns a direction in the room; the ball's turn carries it round
    float th = hh(fid * 1.7) + n.x * .18;
    float e = clamp(-n.y * 1.4 + (hh(fid * 2.9) - .5) * 1.7, -1., 1.);
    float m = .15;
    float x1 = fract(th + uSpin) * (A.x + 2. * m) - m;
    float x0 = fract(th + uLag) * (A.x + 2. * m) - m;
    if (abs(x1 - x0) > A.x * .5) x0 = x1;
    float y = A.y * (.5 + .47 * e);
    vec2 p1 = vec2(x1, y), p0 = vec2(x0, y);
    float r = uSize * (.5 + 1.3 * pow(hh(fid * 4.3), 3.));
    float len = length(p1 - p0);
    vec2 dir = len > 1e-5 ? (p1 - p0) / len : vec2(1., 0.);
    vec2 nor = vec2(-dir.y, dir.x);
    vec2 w = p0 + dir * ((aC.x * .5 + .5) * (len + 2. * r) - r) + nor * aC.y * r;
    vL = vec2((aC.x * .5 + .5) * (len + 2. * r) - r, aC.y * r) / r; vLen = len / r;
    float tw = .75 + .25 * sin(uT * (3. + 9. * hh(fid)) + fid);
    vI = (.35 + .65 * pow(hh(fid * 6.1), 2.)) * tw * (1. + f.spark) / (1. + vLen * .22);
    gl_Position = vec4(w.x / A.x * 2. - 1., 1. - w.y / A.y * 2., 0., 1.);
  } else {
    float g = glint(n) + (hh(fid * 9.1) < .25 ? f.spark * f.spark * .7 : 0.);
    if (g < .35) return;
    vec2 ctr = (vec2(c) + .5) * uTile / S;
    float r = uTile / S * (2.5 + 5. * min(1., g));
    vec2 w = ctr + aC * r;
    vL = aC; vI = min(1.2, g); vLen = -1.;
    gl_Position = vec4(w.x / A.x * 2. - 1., 1. - w.y / A.y * 2., 0., 1.);
  }
}`;
const FS_SPK = `#version 300 es
precision mediump float;
uniform vec3 uLight; in vec2 vL; in float vI, vLen; out vec4 o;
void main(){
  float a;
  if (vLen >= 0.){
    float dx = max(0., max(-vL.x, vL.x - vLen));
    float d = length(vec2(dx, vL.y));
    a = exp(-d * d * 2.6) * vI;
  } else {                                                  // four-point star
    vec2 q = abs(vL);
    a = (exp(-q.y * 60.) * (1. - q.x) + exp(-q.x * 60.) * (1. - q.y)) * .9 + exp(-dot(q, q) * 30.) * .8;
    a *= vI;
  }
  o = vec4(uLight * a, 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs, attrs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function tex(filter){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
let PB, PT, PS, vaoQuad, vaoSpk, texVid, texField;
// immutable storage, re-made only when the tile grid changes size
function retex(old, w, h){
  if (old) gl.deleteTexture(old);
  const t = tex(gl.NEAREST); gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h); return t;
}
function initGL(){
  PB = prog(VS_Q, FS_BG, ['p']); PT = prog(VS_Q, FS_TILE, ['p']); PS = prog(VS_SPK, FS_SPK, ['aC']);
  vaoQuad = gl.createVertexArray(); gl.bindVertexArray(vaoQuad);
  let b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  vaoSpk = gl.createVertexArray(); gl.bindVertexArray(vaoSpk);
  b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  texVid = tex(gl.LINEAR); texField = null;
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
}

/* ---------- field: one cell per tile (all buffers reused) ---------- */
const F = { gw:0, gh:0, tile:0, sm:null, blur:null, tmp:null, lum:null, lumP:null, spark:null, px:null, idx:null, idxKey:'', have:false, texKey:'',
  cover:0, energy:0, cx:.5, cxPrev:-1, vx:0, cutFrac:0 };
function ensureField(W, H){
  const Sh = Math.min(W, H), ts = Math.round(38 + 64 * S.tile);           // tiles across the short edge
  const tile = Sh / ts, gw = Math.ceil(W / tile), gh = Math.ceil(H / tile);

  F.gw = gw; F.gh = gh; F.tile = tile; est.width = gw; est.height = gh; const n = gw * gh;
  F.sm = new Float32Array(n); F.blur = new Float32Array(n); F.tmp = new Float32Array(n);
  F.lum = new Uint8Array(n); F.lumP = new Uint8Array(n); F.spark = new Float32Array(n); F.px = new Uint8Array(n * 4);
  F.jx = new Float32Array(n); F.jy = new Float32Array(n);
  for (let i = 0; i < n; i++){ F.jx[i] = Math.random() - .5; F.jy[i] = Math.random() - .5; }   // each tile's own small tilt

}
// the tile grid covers [0, gw*tile] x [0, gh*tile] px, a little past the canvas edge
function grab(W, H){
  const w = F.gw, h = F.gh, vw = video.videoWidth, vh = video.videoHeight;
  if (!(vw > 0 && vh > 0)) return false;
  const sa = W / H, va = vw / vh;
  let cw = vw, ch = vh; if (va > sa) cw = vh * sa; else ch = vw / sa;
  const ex = w * F.tile / W, ey = h * F.tile / H;                         // overscan of the grid
  ectx.setTransform(mirror ? -1 : 1, 0, 0, 1, mirror ? w : 0, 0);
  try { ectx.drawImage(video, (vw - cw)/2, (vh - ch)/2, cw * ex, ch * ey, 0, 0, w, h); } catch(e){ return false; }
  const d = ectx.getImageData(0, 0, w, h).data;
  const t = F.lumP; F.lumP = F.lum; F.lum = t;
  for (let i = 0, j = 0, n = w*h; i < n; i++, j += 4) F.lum[i] = (d[j]*77 + d[j+1]*150 + d[j+2]*29) >> 8;
  const ok = F.have; F.have = true; return ok;
}
function ensureIdx(W, H){
  const key = F.gw + 'x' + F.gh + ':' + F.tile + ':' + M.w + 'x' + M.h + ':' + (mirror ? 1 : 0) + ':' + vidW + 'x' + vidH + ':' + W + 'x' + H;
  if (key === F.idxKey) return; F.idxKey = key;
  if (!F.idx || F.idx.length !== F.gw * F.gh) F.idx = new Int32Array(F.gw * F.gh);
  const sa = W / H, va = vidW / vidH, sx = sa < va ? sa / va : 1, sy = sa < va ? 1 : va / sa;
  for (let y = 0; y < F.gh; y++) for (let x = 0; x < F.gw; x++){
    let u = ((x + .5) * F.tile / W - .5) * sx + .5, v = ((y + .5) * F.tile / H - .5) * sy + .5;
    if (mirror) u = 1 - u;
    const mx = Math.min(M.w - 1, Math.max(0, u * M.w | 0)), my = Math.min(M.h - 1, Math.max(0, v * M.h | 0));
    F.idx[y * F.gw + x] = (u < 0 || u > 1 || v < 0 || v > 1) ? -1 : my * M.w + mx;

}
function boxBlur(src, dst, tmp, w, h, r){

    for (let x = 0; x < w; x++){ tmp[o + x] = s * inv; s += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; } }
  for (let x = 0; x < w; x++){ let s = 0;
    for (let y = -r; y <= r; y++) s += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++){ dst[y * w + x] = s * inv; s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; } }

function updateField(dt, grabbed, W, H, armed){
  const w = F.gw, h = F.gh, n = w * h, useMask = M.has;

  if (armed){ for (let i = 0; i < n; i += 5){ const dv = F.lum[i] - F.lumP[i]; if (dv > 34 || dv < -34) cut++; } F.cutFrac = cut * 5 / n; if (cut * 5 > n * .5){ armed = false; F.spark.fill(0); } }
  const dk = Math.exp(-dt / .35);
  for (let i = 0; i < n; i++){
    const j = useMask ? F.idx[i] : 0;
    const mk = useMask ? (j >= 0 ? M.f[j] : 0) : 1;
    F.sm[i] = F.sm[i] * .4 + mk * .6;
    let sp = F.spark[i] * dk;
    if (F.sm[i] > .5){

      if (armed){ const dv = F.lum[i] - F.lumP[i], a = dv < 0 ? -dv : dv; if (a > 34){ diff += Math.min(a, 120); if (Math.random() < .2) sp = 1; } }   // a scattering of tiles catch the change
    }

  boxBlur(F.blur, F.blur, F.tmp, w, h, Math.max(2, Math.round(Math.min(w, h) / 14)));

  const P = F.px, B = F.blur;

    const up = (y > 0 ? y - 1 : y) * w, dn = (y < h - 1 ? y + 1 : y) * w;
    for (let x = 0; x < w; x++, i++, j += 4){
      const gx = (Math.min(1, B[y * w + (x < w - 1 ? x + 1 : x)] * 1.3) - Math.min(1, B[y * w + (x > 0 ? x - 1 : x)] * 1.3));
      const gy = (Math.min(1, B[dn + x] * 1.3) - Math.min(1, B[up + x] * 1.3));

  if (F.texKey !== w + 'x' + h){ F.texKey = w + 'x' + h; texField = retex(texField, w, h); }

  const e = on > 20 ? diff / on / 60 : 0;

}

/* ---------- mask ---------- */
const M = { w:0, h:0, f:null, has:false, live:false, external:false, lastT:0 };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || !(w * h <= 4e6) || !(data.length >= w * h)) return false;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.f = new Float32Array(w * h); F.idxKey = ''; }
  for (let i = 0, n = w * h; i < n; i++){ let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1; M.f[i] = m; }
  if (!M.live) F.cxPrev = -1;                              // re-seat after a gap
  M.has = true; M.live = true; M.lastT = performance.now();
  return true;
}
let segmenter = null, lastTs = 0, lastSegVT = -1;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    setStatus('');
  }catch(e){
    if (M.external) return;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n画面全体をミラーボールにして続けます。');
  }
}
function segment(now){
  if (!segmenter || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastSegVT) return; lastSegVT = vt;
  try{
    const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks;
      if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1];
      ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
    });
  }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720, lastVT = -1, camT0 = 0;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  F.have = false; F.idxKey = ''; F.cxPrev = -1; camT0 = performance.now();
}

/* ---------- audio: the spotlight's clack, and a shimmer that follows the spin ---------- */
let actx = null, bus = null, recDest = null, shim = null, noiseBuf = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .55; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  const sr = actx.sampleRate, n = sr * 2; noiseBuf = actx.createBuffer(1, n, sr); const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const hp = actx.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 7500; hp.Q.value = 1.2;
  shim = actx.createGain(); shim.gain.value = 0;
  src.connect(hp); hp.connect(shim); shim.connect(bus); src.start();
  actx.resume().catch(()=>{});
}
function clack(on){
  if (!actx || actx.state !== 'running' || !noiseBuf) return;
  const t = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = on ? 1800 : 1200; f.Q.value = 2;
  const g = actx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.7, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random()); s.stop(t + .12);
  const o = actx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(on ? 90 : 70, t);
  const og = actx.createGain(); og.gain.setValueAtTime(.0001, t); og.gain.exponentialRampToValueAtTime(on ? .35 : .2, t + .01); og.gain.exponentialRampToValueAtTime(.0001, t + .5);
  o.connect(og); og.connect(bus); o.start(t); o.stop(t + .55);
}

// the switch between the plain camera (X = 0) and the mirror ball (X = 1.8)
const MODE = { on:false, X:0, clacked:false };
function setMode(on){
  if (on === MODE.on) return;
  MODE.on = on; MODE.clacked = false;
  $('mode').textContent = on ? '◂ CAMERA' : '▸ KAGAMIDAMA';
  document.body.classList.toggle('cam', !on);
  $('spin').style.visibility = on ? 'visible' : 'hidden';
  if (!on) clack(false);
}
$('mode').onclick = () => setMode(!MODE.on);
addEventListener('keydown', e => { if (started && (e.key === ' ' || e.key === 'Enter') && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); setMode(!MODE.on); } });
$('go').onclick = async () => {

  }catch(e){ camError(e); return; }

};
$('flip').onclick = async () => {

};
$('gear').onclick = () => $('panel').classList.toggle('hide');
const push = () => { if (MODE.on) SPIN.v += .35 * SPIN.dir; };
$('spin').onclick = push;
canvas.addEventListener('pointerup', () => { if (started) push(); });
function setPal(i){

  [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
  const r = document.documentElement.style;

}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };

$('shoot').onclick = () => {
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'kagamidama-' + Date.now() + '.png'; a.click(); }, 'image/png');

let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'kagamidama.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }

/* ---------- render ---------- */
const BASE = .025;                                        // turns per second when you stand still
const SPIN = { a:0, lag:0, v:0, dir:1 };
let lastT = 0, hudT = 0, hudVis = '';
const STATE = { cam:1, reveal:0, speed:BASE, energy:0, eTot:0 };
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  const t = now / 1000;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; F.have = false; F.idxKey = ''; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1800 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  ensureField(W, H);
  if (!M.external) segment(now);
  if (M.live && now - M.lastT > 1500){ M.live = false; F.cxPrev = -1; }
  if (video.readyState < 2) return;

  const vt = video.currentTime, fresh = vt !== lastVT; lastVT = vt;
  const grabbed = fresh && grab(W, H);
  MODE.X = MODE.on ? Math.min(1.8, MODE.X + dt) : Math.max(0, MODE.X - dt * 2.5);
  const cam = 1 - Math.min(1, MODE.X / .45);
  const reveal = Math.max(0, Math.min(1, (MODE.X - .45) / .8));
  const speckA = Math.max(0, Math.min(1, (MODE.X - 1.05) / .45));
  if (MODE.on && !MODE.clacked && MODE.X > 1.05){ MODE.clacked = true; clack(true); }
  const armed = MODE.on && MODE.X > 1.2 && performance.now() - camT0 > 900;
  updateField(dt, grabbed, W, H, armed);
  if (fresh){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }

  // the spin: movement adds momentum (sideways motion also picks the direction), friction returns it to the idle turn
  if (Math.abs(F.vx) > .08) SPIN.dir = F.vx > 0 ? 1 : -1;
  SPIN.v += F.energy * (1.2 + 3.5 * S.spin) * dt * 6 * SPIN.dir;
  SPIN.v *= Math.exp(-dt / 1.6);
  SPIN.v = Math.max(-1.2, Math.min(1.2, SPIN.v));
  const speed = BASE * (SPIN.dir || 1) + SPIN.v;
  SPIN.a += speed * dt;
  SPIN.lag += (SPIN.a - SPIN.lag) * (1 - Math.exp(-dt / .07));       // the trail: where each speck was ~70 ms ago
  if (SPIN.a > 1e4 || SPIN.a < -1e4){ SPIN.a %= 1; SPIN.lag = SPIN.a; }
  STATE.speed = speed; STATE.energy = F.energy; STATE.eTot += F.energy;

  const p = PALS[S.pal];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(vaoQuad);
  gl.useProgram(PB.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid); gl.uniform1i(PB.U.uVid, 0);
  const sa = W/H, va = vidW/vidH;
  gl.uniform2f(PB.U.uRes, W, H); gl.uniform2f(PB.U.uScale, sa < va ? sa/va : 1, sa < va ? 1 : va/sa);
  gl.uniform1f(PB.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PB.U.uCam, cam * cam); gl.uniform1f(PB.U.uRoom, S.room);
  gl.uniform1f(PB.U.uT, t); gl.uniform3fv(PB.U.uBg, p.bg);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  STATE.cam = cam; STATE.reveal = reveal;
  if (reveal > 0){
    const setCommon = P => {
      gl.uniform1i(P.U.uField, 1); gl.uniform2i(P.U.uGrid, F.gw, F.gh); gl.uniform1f(P.U.uTile, F.tile); gl.uniform1f(P.U.uSpin, SPIN.a);
    };
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texField);
    const nInst = F.gw * F.gh;
    // specks on the room, behind you
    if (speckA > 0){
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(PS.p); gl.bindVertexArray(vaoSpk); setCommon(PS);
      gl.uniform2f(PS.U.uRes, W, H); gl.uniform1f(PS.U.uLag, SPIN.lag); gl.uniform1f(PS.U.uReveal, reveal);
      gl.uniform1f(PS.U.uSize, (.0036 + .0036 * S.speck) * (1 + 12 / Math.max(40, Math.min(F.gw, F.gh)))); gl.uniform1f(PS.U.uAmt, .2 + .8 * S.speck);
      gl.uniform1f(PS.U.uT, t); gl.uniform1f(PS.U.uLayer, 0);
      gl.uniform3f(PS.U.uLight, p.light[0] * speckA, p.light[1] * speckA, p.light[2] * speckA);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nInst);
      gl.disable(gl.BLEND);
    }
    // the tiles
    gl.useProgram(PT.p); gl.bindVertexArray(vaoQuad); setCommon(PT);
    gl.uniform2f(PT.U.uRes, W, H); gl.uniform3fv(PT.U.uTileC, p.tile); gl.uniform3fv(PT.U.uLight, p.light);
    gl.uniform1f(PT.U.uReveal, reveal); gl.uniform1f(PT.U.uT, t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // star glints on the body
    if (speckA > 0){
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(PS.p); gl.bindVertexArray(vaoSpk); setCommon(PS);
      gl.uniform2f(PS.U.uRes, W, H); gl.uniform1f(PS.U.uReveal, reveal); gl.uniform1f(PS.U.uLayer, 1); gl.uniform1f(PS.U.uT, t);
      gl.uniform3f(PS.U.uLight, p.light[0] * speckA, p.light[1] * speckA, p.light[2] * speckA);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nInst);
      gl.disable(gl.BLEND);
    }
  }
  gl.bindVertexArray(null);

  if (actx && shim) shim.gain.setTargetAtTime(Math.min(.25, Math.abs(SPIN.v) * .5) * speckA, actx.currentTime, .1);
  const hv = MODE.X > 1.2 ? 'visible' : 'hidden';
  if (hudVis !== hv){ hudVis = hv; $('hud').style.visibility = hv; }
  hudT += dt;
  if (hudT > .25){ hudT = 0;
    $('hud').innerHTML = '<b>KAGAMIDAMA</b>' + p.name + '\nTILES ' + Math.round(F.gw * F.gh * F.cover).toLocaleString('en-US') +
      '\nRPM ' + (Math.abs(speed) * 60).toFixed(1).padStart(4, '0') + (speed >= 0 ? ' →' : ' ←'); }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__KAGAMIDAMA = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; return ingestMask(d, w, h); },
  state: () => ({ hasMask:M.has, live:M.live, cover:F.cover, energy:STATE.energy, total:STATE.eTot * 100, cutFrac:F.cutFrac, speed:STATE.speed, spinV:SPIN.v, cx:F.cx,
    cam:STATE.cam, reveal:STATE.reveal, on:MODE.on, X:MODE.X, grid:[F.gw, F.gh] }),
  palette(i){ setPal(i); },
  mode(c){ setMode(!!c); },
  push(){ push(); },
};
</script>
