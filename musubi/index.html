<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MUSUBI ─ 手と手を結ぶ和音</title>
<meta name="description" content="手が四つまで見える楽器。一本の手は細く濁った声しか出せず、もう一方の手に近づけると二本のあいだに組紐が伸びて、伸びるだけ声の唸りがほどけて澄んでゆく。近づけきると紐が結ばれて金の結び目が残る。ひとりでも両手で、ふたりなら四本で、和音は人と人の距離そのものになる。">
<meta name="theme-color" content="#f6f1e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Jost:wght@200;300&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  MUSUBI ─ 手と手を結ぶ和音                          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   生成り kinari  #f6f1e6  the ground, and the brightest thing here.
                                    This piece is high-key: there is no dark
                                    anywhere in it, not even behind the type.
            亜麻  ama      #e6ddc9  the linen weave, and EVERY shadow. Shadow
                                    in this piece is a warmer beige, never a
                                    grey and never an alpha-black — that one
                                    rule is what makes it read as daylight
                                    on cloth instead of as a dark UI inverted.
            紅    beni     #c8455c  one silk. Low voices lean toward it.
            藍    ai       #3a5a8c  the other silk. High voices lean toward it.
            金    kin      #c9a227  RESERVED for a cord that has actually been
                                    tied, and for the knot it leaves. Nothing
                                    else in the piece is ever gold, so gold
                                    means "these two are in tune".
            MOOD: a bright workroom at midday with silk laid out on a 組紐台.
            Flat even light, soft warm shadow, no glow, no neon, no vignette.
  BACKGROUND  A procedurally woven linen tile, baked once: warp and weft with
            a real over/under alternation, so at any zoom it is cloth and not
            a grid. Over it a soft warm wash from the upper left. The camera
            is present at about 7% and pushed almost to white — the room is a
            ghost under the cloth, never the subject.
  TYPE      Zen Old Mincho for Japanese: an old-style mincho with a lot of
            air, set large and sparse. Jost 200 for latin and numerals only,
            at small sizes with wide tracking, so the two faces never compete.
            The pentatonic degrees are named the old way — 宮 商 角 徴 羽 —
            because note letters would make this look like a tuner.
  MOTION    Floaty, slow, elastic. Cords grow on a 620ms elastic settle and
            pitch slides on a 90ms glide, so the instrument always sounds like
            it is leaning rather than stepping. The single fast event in the
            piece is the knot tying, at 120ms, and it is fast precisely
            because nothing else is.
  SIGNATURE THE BRAID. A cord between two hands is a real three-strand braid
            drawn along a catenary, with the over/under order alternating
            correctly down its length and a silk sheen travelling along it.
            The two strand colours are the two hands' own colours, so you can
            see whose voice is in the cord. When the cord completes, a knot
            ties at its centre in 金 and stays.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#f6f1e6;color:#4a4235}
  body{font-family:'Zen Old Mincho',serif;-webkit-font-smoothing:antialiased}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block}
  #video{position:fixed;width:2px;height:2px;opacity:.001;pointer-events:none;left:-10px;top:-10px}

  #flip{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 15px);right:15px;z-index:6;
    font-family:'Jost',sans-serif;font-weight:300;font-size:11px;letter-spacing:.26em;
    color:#7d7263;background:rgba(246,241,230,.8);border:1px solid #ddd3bd;
    border-radius:999px;padding:8px 14px;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:color .5s cubic-bezier(.22,.9,.26,1),border-color .5s cubic-bezier(.22,.9,.26,1);
  }
  #flip:hover{color:#c8455c;border-color:#c8455c}
  #err{
    display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:40;max-width:min(30rem,86vw);white-space:pre-line;
    background:#f6f1e6;border:1px solid #ddd3bd;color:#4a4235;
    padding:24px 26px;font-size:14px;line-height:2;letter-spacing:.04em;
  }

  #hud{
    position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
    padding:0 18px calc(env(safe-area-inset-bottom,0px) + 16px);
    display:flex;align-items:flex-end;gap:18px;
    opacity:0;transition:opacity .62s cubic-bezier(.22,.9,.26,1);
  }
  #hud.on{opacity:1}
  .grp{display:flex;flex-direction:column;gap:5px}
  .grp .k{font-family:'Jost',sans-serif;font-weight:200;font-size:9.5px;
          letter-spacing:.34em;color:#a2977f}
  .grp .v{font-size:15px;letter-spacing:.24em;color:#6a6050;line-height:1}
  #chord{margin-left:auto;text-align:right}
  #chord .v{font-size:26px;letter-spacing:.3em;color:#4a4235}
  #tuned{color:#c9a227 !important}

  .sheet{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(246,241,230,.965);
    transition:opacity .62s cubic-bezier(.22,.9,.26,1);
  }
  .sheet.gone{opacity:0;pointer-events:none}
  .card{

    border:1px solid #e2d8c2;padding:34px 34px 28px;background:#fbf8f0;
  }
  .ttl{font-size:clamp(27px,7.6vw,38px);letter-spacing:.1em;line-height:1.25}
  .sub{font-family:'Jost',sans-serif;font-weight:200;font-size:10.5px;
       letter-spacing:.44em;color:#a2977f;margin-top:11px}
  .lead{font-size:13.5px;line-height:2.15;letter-spacing:.04em;margin-top:20px;color:#5c5344}
  .lead em{font-style:normal;color:#c8455c}

        letter-spacing:.06em;color:#8b8170;border-top:1px solid #e2d8c2;
        margin-top:16px;padding-top:13px}

</style>

<body>

<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="err"></div>

<div id="hud">
  <div class="grp"><span class="k">HANDS</span><span class="v" id="hHands">—</span></div>
  <div class="grp"><span class="k">CORDS</span><span class="v" id="hCords">—</span></div>
  <div class="grp"><span class="k">KNOTS</span><span class="v" id="hKnots">0</span></div>
  <div class="grp" id="chord"><span class="k">SOUNDING</span><span class="v" id="hChord">—</span></div>
</div>

<div class="sheet" id="startSheet">
  <div class="card">
    <div class="ttl">手と手を結ぶ</div>
    <div class="sub">MUSUBI ─ OTO II</div>
    <p class="lead">手をひとつだけ挙げても、細く<em>濁った</em>声しか出ません。<br>
      もう一方の手を近づけると、あいだに組紐が伸びます。<br>
      紐が伸びるだけ唸りがほどけ、近づけきると<b>結ばれます</b>。</p>
    <canvas id="demo" width="640" height="210"></canvas>
    <div class="note">
      <span>高さ</span> が音の高さ（宮・商・角・徴・羽の五音）。<br>
      <span>手のひらの開き</span> が明るさ。握れば、その声だけ休みます。<br>
      <span>手は四本まで</span> 見えます。<span>ふたりでも遊べます</span>。
    </div>
    <button class="go" id="startBtn">はじめる</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  MUSUBI ─ 手と手を結ぶ和音
//  The one input axis nothing in this gallery has used: MORE THAN ONE
//  PERSON.  maxNumHands is 4, every hand is a voice, and the musical
//  relationship between two voices is literally the distance between two
//  hands — so a chord is built by people reaching toward each other.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(a,b,v){ var t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function eOut(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function eElastic(t){
  t=clamp(t,0,1);
  if (t===0||t===1) return t;
  return 1 + Math.pow(2,-9*t)*Math.sin((t*9.2-0.22)*Math.PI*1.6)*-1;
}
function rnd(a,b){ return a+Math.random()*(b-a); }

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var hud=document.getElementById('hud');
var hHands=document.getElementById('hHands');
var hCords=document.getElementById('hCords');
var hKnots=document.getElementById('hKnots');
var hChord=document.getElementById('hChord');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv.getContext('2d');

var W=0,H=0,DPR=1,MN=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.min(W,H);
  cloth=null;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null, camOK=false;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user'); camOK=true;
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseAll();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  VOICES ─ four slots, each one a hand.  MediaPipe hands carry no stable
//  identity between frames, so slots are claimed by nearest-neighbour
//  matching against last frame's palm centres.  Without that the voices
//  swap pitch whenever the detection order changes.
// ═══════════════════════════════════════════════════════════════════════
var NV=4, LOST_S=0.34, MATCH_R=0.30;
var TIPS=[4,8,12,16,20], PIPS=[2,6,10,14,18];
var V=[];
for (var vi=0; vi<NV; vi++){
  V.push({
    on:false, t:-1e9, x:0.5, y:0.5, px:0.5, py:0.5, span:0.12,
    open:0, openS:0, pts:null, step:7, stepF:7, freq:220, glide:220,
    link:0, linkS:0, lvl:0, bend:1, node:null, claimed:false, idx:vi
  });
}
function loseAll(){
  for (var i=0;i<NV;i++){ V[i].on=false; V[i].pts=null; V[i].link=0; V[i].linkS=0; }
  for (var j=0;j<CORDS.length;j++){ CORDS[j].s=0; CORDS[j].grow=0; CORDS[j].tied=false; CORDS[j].hold=0; }
}

var hands=null, mpCamera=null, mpReady=false;
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:4, modelComplexity:0,
                       minDetectionConfidence:0.55, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        return hands.send({ image:video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}
function sx(x){ return mirror?(1-x):x; }
function validHand(c){
  if (!c||typeof c.length!=='number'||c.length<21) return null;
  for (var i=0;i<21;i++){
    var p=c[i];
    if (!p||typeof p.x!=='number'||typeof p.y!=='number'||
        !isFinite(p.x)||!isFinite(p.y)) return null;
  }
  return c;
}
function d2(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function onHands(res){
  var list=(res&&res.multiHandLandmarks)?res.multiHandLandmarks:null;
  var i,j;
  for (i=0;i<NV;i++) V[i].claimed=false;
  if (!list||!list.length) return;
  var t=now();
  var seen=[];
  for (i=0;i<list.length && seen.length<NV;i++){
    var lm=validHand(list[i]);
    if (!lm) continue;
    var wr=lm[0], mc=lm[9];
    var palm=d2(wr,mc);
    if (!isFinite(palm)||palm<1e-4) continue;
    var n=0;
    for (j=1;j<5;j++) if (d2(lm[TIPS[j]],wr) > d2(lm[PIPS[j]],wr)*1.12) n++;
    var thumbOut=(d2(lm[4],lm[17])/palm) > 1.05 ? 1 : 0;
    var pts=[], k;
    for (k=0;k<21;k++) pts.push({ x:sx(lm[k].x), y:lm[k].y });
    seen.push({
      x: sx((wr.x+mc.x*2)/3), y:(wr.y+mc.y*2)/3,
      open: clamp((n+thumbOut*0.6)/4.6, 0, 1),
      span: clamp(palm*2.7, 0.05, 0.6),
      pts: pts
    });
  }
  // nearest-neighbour claim of a live slot, then any free slot
  for (i=0;i<seen.length;i++){
    var s=seen[i], best=-1, bd=MATCH_R;
    for (j=0;j<NV;j++){
      if (V[j].claimed) continue;
      if (!V[j].on || (t-V[j].t)>LOST_S) continue;
      var d=Math.hypot(V[j].px-s.x, V[j].py-s.y);
      if (d<bd){ bd=d; best=j; }
    }
    if (best<0){
      for (j=0;j<NV;j++){
        if (!V[j].claimed && (!V[j].on || (t-V[j].t)>LOST_S)){ best=j; break; }
      }
    }
    if (best<0) continue;
    var v=V[best];
    v.claimed=true;
    if (!v.on || (t-v.t)>LOST_S){ v.px=s.x; v.py=s.y; v.openS=s.open; }
    v.x=s.x; v.y=s.y; v.open=s.open; v.span=s.span; v.pts=s.pts;
    v.on=true; v.t=t;
  }
}
function vAlive(v){ return v.on && (now()-v.t)<LOST_S; }

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ sound design: a DETUNED SUPERSAW read as a choir.  Five sawtooth
//  oscillators per voice through one lowpass.  The instrument's whole idea
//  lives in one number: the detune spread.  Alone, a voice is spread ±30
//  cents and is audibly sour; as a cord grows the spread closes to ±2 cents
//  and the five saws fuse into one bright voice.  So "in tune" is not a
//  score you are shown, it is a texture you hear arrive.
//  Nothing is allocated per frame: 4 voices × (5 saws + 1 sine) start once
//  at boot and only their parameters ever move.
// ═══════════════════════════════════════════════════════════════════════
var AC=null, comp=null, master=null, verb=null, verbSend=null, audioOK=false;
var NOISE=null, SPREAD=[-1,-0.55,0,0.55,1];

function makeNoise(ac){
  var len=Math.floor(ac.sampleRate*1.0);
  if (!isFinite(len)||len<1) len=1;
  var buf;
  try{ buf=ac.createBuffer(1,len,ac.sampleRate); }catch(e){ return null; }
  var d=buf.getChannelData(0);
  for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function buildReverb(ac){
  // 2.6s, bright: a workroom with hard walls and cloth on the table. Long
  // enough that a knot's pluck hangs over the drone it belongs to.
  var len=Math.floor(ac.sampleRate*2.6);
  if (!isFinite(len)||len<1) len=1;
  var buf;
  try{ buf=ac.createBuffer(2,len,ac.sampleRate); }catch(e){ return null; }
  for (var ch=0;ch<2;ch++){
    var d=buf.getChannelData(ch);
    for (var i=0;i<len;i++){
      var e=Math.pow(1-i/len,2.4);
      d[i]=(Math.random()*2-1)*e*0.4;
    }
  }
  var cv=ac.createConvolver(); cv.buffer=buf; return cv;
}
function initAudio(){
  if (AC){ if (AC.state==='suspended'&&AC.resume){ try{AC.resume();}catch(e){} } return true; }
  var C=window.AudioContext||window.webkitAudioContext;
  if (!C) return false;
  try{ AC=new C(); }catch(e){ AC=null; return false; }
  if (AC.state==='suspended'&&AC.resume){ try{AC.resume();}catch(e){} }

  comp=AC.createDynamicsCompressor();
  comp.threshold.value=-19; comp.knee.value=26; comp.ratio.value=4.5;
  comp.attack.value=0.012; comp.release.value=0.3;
  master=AC.createGain(); master.gain.value=0.8;
  comp.connect(master); master.connect(AC.destination);

  verb=buildReverb(AC);
  verbSend=AC.createGain(); verbSend.gain.value=0.34;
  if (verb){ verbSend.connect(verb); verb.connect(comp); }
  NOISE=makeNoise(AC);

  for (var i=0;i<NV;i++) V[i].node=buildVoice(i);
  audioOK=true;
  return true;
}
function buildVoice(i){
  var n={ saws:[], sub:null, lp:null, gain:null, pan:null, wet:null };
  n.gain=AC.createGain(); n.gain.gain.value=0.0001;
  n.lp=AC.createBiquadFilter(); n.lp.type='lowpass';
  n.lp.frequency.value=900; n.lp.Q.value=0.9;
  n.lp.connect(n.gain);
  if (AC.createStereoPanner){ n.pan=AC.createStereoPanner(); n.pan.pan.value=0;
    n.gain.connect(n.pan); n.pan.connect(comp); }
  else { n.gain.connect(comp); }
  n.wet=AC.createGain(); n.wet.gain.value=0.5;
  n.gain.connect(n.wet);
  if (verbSend) n.wet.connect(verbSend);
  var j;
  for (j=0;j<SPREAD.length;j++){
    var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=220;
    var g=AC.createGain(); g.gain.value=0.17;
    o.connect(g); g.connect(n.lp);
    try{ o.start(); }catch(e){}
    n.saws.push({ o:o, g:g, k:SPREAD[j] });
  }
  var so=AC.createOscillator(); so.type='sine'; so.frequency.value=110;
  var sg=AC.createGain(); sg.gain.value=0.26;
  so.connect(sg); sg.connect(n.gain);
  try{ so.start(); }catch(e){}
  n.sub={ o:so, g:sg };
  return n;
}
function ramp(param,v,tc){
  if (!param||!isFinite(v)) return;
  try{ param.setTargetAtTime(v, AC.currentTime, Math.max(0.005,tc||0.05)); }catch(e){}
}
// 箏 のような一撃: the knot.  A noise burst read through a short comb (a
// delay tuned to the pitch with feedback) — a plucked string with no
// oscillator in it, so it never sits on top of the saws as a sixth saw.
var plucks=0;
function pluck(f, gain){
  if (!audioOK||!NOISE) return;
  if (!isFinite(f)||f<40||f>4000) return;
  if (plucks>14) return;
  plucks++;
  var t0=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=NOISE;
  var bp=AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=clamp(f*3,120,7000); bp.Q.value=0.8;
  var ng=AC.createGain();
  try{
    ng.gain.setValueAtTime(0.0001,t0);
    ng.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain),t0+0.003);
    ng.gain.exponentialRampToValueAtTime(0.0001,t0+0.02);
  }catch(e){}
  var dl=AC.createDelay(0.05);
  dl.delayTime.value=clamp(1/f,0.00025,0.045);
  var fb=AC.createGain(); fb.gain.value=0.86;
  var damp=AC.createBiquadFilter(); damp.type='lowpass';
  damp.frequency.value=clamp(f*7,600,9000); damp.Q.value=0.3;
  var out=AC.createGain();
  try{
    out.gain.setValueAtTime(1,t0);
    out.gain.exponentialRampToValueAtTime(0.0001,t0+1.5);
  }catch(e){}
  s.connect(bp); bp.connect(ng);
  ng.connect(dl); dl.connect(damp); damp.connect(fb); fb.connect(dl);
  dl.connect(out); ng.connect(out);
  out.connect(comp);
  if (verbSend){ var w=AC.createGain(); w.gain.value=0.5; out.connect(w); w.connect(verbSend); }
  try{ s.start(t0); s.stop(t0+0.1); }catch(e){}
  if (typeof setTimeout==='function') setTimeout(function(){ plucks=Math.max(0,plucks-1); }, 1700);
}

// ═══════════════════════════════════════════════════════════════════════
//  SCALE ─ ヨナ抜き pentatonic over three octaves, named the old way.
//  Height quantises with hysteresis so a hand hovering on a boundary does
//  not flutter between two notes, and the sounding pitch glides.
// ═══════════════════════════════════════════════════════════════════════
var PENTA=[0,2,4,7,9], NSTEP=16, BASE=130.813;   // C3
var DEG=['宮','商','角','徴','羽'];
function stepFreq(st){
  st=clamp(st,0,NSTEP-1)|0;
  var oct=(st/5)|0, k=st-oct*5;
  return BASE*Math.pow(2,(PENTA[k]+oct*12)/12);
}
function stepName(st){
  st=clamp(st,0,NSTEP-1)|0;
  return DEG[st-((st/5)|0)*5];
}
// just ratios a cord will pull two voices onto
var JUST=[1, 6/5, 5/4, 4/3, 3/2, 5/3, 2, 12/5, 5/2, 3];
function nearestJust(r){
  var best=JUST[0], bd=Math.abs(Math.log(r/JUST[0]));
  for (var i=1;i<JUST.length;i++){
    var d=Math.abs(Math.log(r/JUST[i]));
    if (d<bd){ bd=d; best=JUST[i]; }
  }
  return best;
}

// ═══════════════════════════════════════════════════════════════════════
//  CORDS ─ one per pair of slots, so four hands make six possible cords
// ═══════════════════════════════════════════════════════════════════════
var D_FAR=0.62, D_NEAR=0.20, TIE_S=0.88, TIE_HOLD=0.30;
var CORDS=[];
(function(){
  for (var a=0;a<NV;a++) for (var b=a+1;b<NV;b++)
    CORDS.push({ a:a, b:b, s:0, grow:0, tied:false, hold:0, phase:Math.random()*TAU, sheen:Math.random() });
})();
var KNOTS=[], knotTotal=0, KMAX=26;
var bloom=0;

function pairDist(p,q){
  var dx=(p.x-q.x)*W, dy=(p.y-q.y)*H;
  return Math.hypot(dx,dy)/Math.max(1,MN);
}
function updateCords(dt){
  var i, cordCount=0, aliveCount=0, tiedCount=0, possible=0;
  for (i=0;i<NV;i++) if (vAlive(V[i])) aliveCount++;
  for (i=0;i<NV;i++) V[i].link=0;
  for (i=0;i<CORDS.length;i++){
    var c=CORDS[i], A=V[c.a], B=V[c.b];
    var live = vAlive(A) && vAlive(B);
    var target = 0;
    if (live){
      var d=pairDist(A,B);
      target = smooth(D_FAR, D_NEAR, d);
      // a closed fist is resting: it does not pull a cord
      target *= clamp(A.openS*1.4,0,1)*clamp(B.openS*1.4,0,1);
      possible++;
    }
    c.s = lerp(c.s, target, 1-Math.pow(0.002,dt));
    if (!isFinite(c.s)) c.s=0;
    c.grow = lerp(c.grow, c.s, 1-Math.pow(0.0015,dt));
    c.phase += dt*(0.5+c.s*1.1);
    c.sheen = (c.sheen + dt*(0.22+c.s*0.5))%1;
    if (live && c.s>TIE_S){
      c.hold += dt;
      if (!c.tied && c.hold>=TIE_HOLD){
        c.tied=true;
        tieKnot(c,A,B);
      }
    } else {
      c.hold=0;
      if (c.s < TIE_S*0.72) c.tied=false;
    }
    if (c.s>0.02) cordCount++;
    if (c.tied) tiedCount++;
    if (c.s>A.link) A.link=c.s;
    if (c.s>B.link) B.link=c.s;
  }
  for (i=0;i<NV;i++) V[i].linkS = lerp(V[i].linkS, V[i].link, 1-Math.pow(0.01,dt));
  // everyone in the frame tied to everyone else: the bloom
  var full = (aliveCount>=2 && possible>0 && tiedCount>=possible) ? 1 : 0;
  bloom = lerp(bloom, full, 1-Math.pow(0.02,dt));
  for (i=KNOTS.length-1;i>=0;i--){
    var k=KNOTS[i];
    k.age+=dt;
    if (k.age>k.life) KNOTS.splice(i,1);
  }
  return { cords:cordCount, alive:aliveCount, tied:tiedCount };
}
function tieKnot(c,A,B){
  var mx=(A.x+B.x)/2, my=(A.y+B.y)/2 + pairDist(A,B)*0.06;
  if (KNOTS.length>=KMAX) KNOTS.shift();
  KNOTS.push({ x:mx, y:my, age:0, life:7.5, r:0, seed:Math.random()*TAU });
  knotTotal++;
  var f=Math.min(A.glide,B.glide);
  pluck(f*2, 0.32);
}

// ═══════════════════════════════════════════════════════════════════════
//  UPDATE ─ pitch, bend, and every audio parameter
// ═══════════════════════════════════════════════════════════════════════
function updateVoices(dt){
  var i;
  for (i=0;i<NV;i++){
    var v=V[i];
    var live=vAlive(v);
    if (live){
      v.px=lerp(v.px,v.x,1-Math.pow(0.0006,dt));
      v.py=lerp(v.py,v.y,1-Math.pow(0.0006,dt));
      v.openS=lerp(v.openS,v.open,1-Math.pow(0.006,dt));
      // height -> pentatonic step, with hysteresis at the boundaries
      var cont=(1-clamp((v.py-0.08)/0.84,0,1))*(NSTEP-1);
      if (!isFinite(cont)) cont=v.stepF;
      v.stepF=cont;
      if (Math.abs(cont-v.step)>0.62) v.step=Math.round(cont);
      v.step=clamp(v.step,0,NSTEP-1)|0;
      v.freq=stepFreq(v.step);
    } else {
      v.openS=lerp(v.openS,0,1-Math.pow(0.02,dt));
    }
    v.lvl=lerp(v.lvl, live ? (0.055+0.100*v.linkS)*(0.16+0.84*v.openS) : 0,
               1-Math.pow(live?0.02:0.004,dt));
    if (!isFinite(v.lvl)) v.lvl=0;
  }
  // the cord pulls the upper voice of its strongest pair onto a just ratio
  for (i=0;i<NV;i++) V[i].bend=1;
  for (i=0;i<CORDS.length;i++){
    var c=CORDS[i];
    if (c.s<0.3) continue;
    var A=V[c.a], B=V[c.b];
    if (!vAlive(A)||!vAlive(B)) continue;
    var hi = (A.freq>=B.freq) ? A : B, lo = (A.freq>=B.freq) ? B : A;
    if (!(lo.freq>0)) continue;
    var r=hi.freq/lo.freq;
    if (!isFinite(r)||r<=0) continue;
    var tgt=nearestJust(r);
    var want=tgt/r;
    if (!isFinite(want)||want<=0) continue;
    var pull=Math.pow(want, clamp(c.s,0,1)*0.9);
    if (isFinite(pull)&&pull>0 && Math.abs(Math.log(pull))>Math.abs(Math.log(hi.bend))) hi.bend=pull;
  }
  for (i=0;i<NV;i++){
    var v2=V[i];
    var f=v2.freq*(isFinite(v2.bend)?v2.bend:1);
    if (!isFinite(f)||f<=0) f=220;
    v2.glide=lerp(v2.glide,f,1-Math.pow(0.0004,dt));
    if (!isFinite(v2.glide)||v2.glide<=0) v2.glide=f;
    pushVoiceAudio(v2);
  }
}
function pushVoiceAudio(v){
  if (!audioOK||!v.node) return;
  var n=v.node, f=v.glide;
  if (!isFinite(f)||f<20||f>8000) return;
  // ±30 cents alone, ±2 cents when the cord is complete
  var cents=lerp(30,2,clamp(v.linkS,0,1));
  var j;
  for (j=0;j<n.saws.length;j++){
    var sv=n.saws[j];
    var sf=f*Math.pow(2,(sv.k*cents)/1200);
    if (isFinite(sf)&&sf>20&&sf<12000) ramp(sv.o.frequency, sf, 0.09);
  }
  if (isFinite(f)) ramp(n.sub.o.frequency, Math.max(30,f*0.5), 0.09);
  var cut=clamp(380 + v.openS*2500 + v.linkS*1900 + f*1.4, 200, 9200);
  ramp(n.lp.frequency, cut, 0.12);
  ramp(n.gain.gain, Math.max(0.0001, v.lvl), 0.07);
  if (n.pan) ramp(n.pan.pan, clamp((v.px-0.5)*1.5,-0.85,0.85), 0.2);
  // a tied voice sits a little further back in the room than a lone one
  if (n.wet) ramp(n.wet.gain, 0.38+0.26*clamp(v.linkS,0,1), 0.3);
}

// ═══════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════
var KIN='#f6f1e6', AMA='#e6ddc9', BENI=[200,69,92], AI=[58,90,140], KIN2=[201,162,39];
var MIN='"Zen Old Mincho",serif', JOST='"Jost",sans-serif';
var cloth=null, clothPat=null;
function rgb(c,a){ return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'; }
function mix(a,b,t){ t=clamp(t,0,1); return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]; }
function voiceCol(v){ return mix(BENI, AI, clamp(v.stepF/(NSTEP-1),0,1)); }

function bakeCloth(){
  var n=48, cv;
  try{ cv=document.createElement('canvas'); }catch(e){ return null; }
  cv.width=n; cv.height=n;
  var c=cv.getContext('2d');
  if (!c) return null;
  c.fillStyle=KIN; c.fillRect(0,0,n,n);
  var step=6, i, j;
  // warp and weft with a real over/under alternation
  for (i=0;i<n;i+=step){
    for (j=0;j<n;j+=step){
      var over=(((i/step)|0)+((j/step)|0))%2===0;
      c.fillStyle='rgba(214,202,176,0.5)';
      if (over) c.fillRect(i+1, j, step-2, step);
      else      c.fillRect(i, j+1, step, step-2);
      c.fillStyle='rgba(255,253,246,0.42)';
      if (over) c.fillRect(i+1, j, step-2, 1.2);
      else      c.fillRect(i, j+1, 1.2, step-2);
    }
  }
  return cv;
}
function drawGround(t){
  ctx.fillStyle=KIN; ctx.fillRect(0,0,W,H);
  if (!cloth){ cloth=bakeCloth(); clothPat=null; }
  if (cloth && !clothPat){
    try{ clothPat=ctx.createPattern(cloth,'repeat'); }catch(e){ clothPat=null; }
  }
  if (clothPat){
    ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle=clothPat; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  // the room, a ghost under the cloth
  if (camOK && video && video.videoWidth>0){
    var vw=video.videoWidth, vh=video.videoHeight;
    var sc=Math.max(W/vw,H/vh), dw=vw*sc, dh=vh*sc;
    ctx.save();
    ctx.globalAlpha=0.075;
    if (mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
    try{ ctx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh); }catch(e){}
    ctx.restore();
  }
  // flat daylight from the upper left; the only gradient in the piece
  var g=ctx.createLinearGradient(0,0,W*0.75,H);
  g.addColorStop(0,'rgba(255,253,247,0.72)');
  g.addColorStop(0.55,'rgba(246,241,230,0.1)');
  g.addColorStop(1,'rgba(224,213,190,0.34)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if (bloom>0.01){
    var bg=ctx.createRadialGradient(W/2,H*0.46,0,W/2,H*0.46,Math.max(W,H)*0.72);
    bg.addColorStop(0,'rgba(201,162,39,'+(bloom*0.16)+')');
    bg.addColorStop(1,'rgba(201,162,39,0)');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  }
}

// ── the braid ───────────────────────────────────────────────────────────
// three strands along a catenary, over/under resolved per segment from the
// sign of each strand's depth, so the weave is actually correct rather than
// three sine waves stacked in a fixed order
var NSEG=34;
function drawCord(c,t){
  var A=V[c.a], B=V[c.b];
  var g=clamp(c.grow,0,1);
  if (g<0.015) return;
  var ax=A.px*W, ay=A.py*H, bx=B.px*W, by=B.py*H;
  var d=Math.hypot(bx-ax,by-ay);
  if (!isFinite(d)||d<1) return;
  var sag=d*(0.22-0.16*g);
  var cxm=(ax+bx)/2, cym=(ay+by)/2+sag;
  var ca=voiceCol(A), cb=voiceCol(B);
  var gold=c.tied?1:0;
  var amp=Math.max(1.5, MN*0.011*(0.5+g*0.8));
  var wind=5+Math.round(d/Math.max(40,MN*0.12));
  var lw=Math.max(1.4, MN*0.0085*(0.45+g*0.75));
  var end=clamp(g*1.12,0,1);
  var pts=[], i;
  for (i=0;i<=NSEG;i++){
    var u=i/NSEG;
    var uu=u*end;
    var m=1-uu;
    var x=m*m*ax + 2*m*uu*cxm + uu*uu*bx;
    var y=m*m*ay + 2*m*uu*cym + uu*uu*by;
    pts.push({ x:x, y:y, u:uu });
  }
  // soft warm shadow of the whole cord on the cloth, never a black alpha
  ctx.save();
  ctx.strokeStyle='rgba(198,183,154,0.5)';
  ctx.lineWidth=lw*2.6; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(pts[0].x+MN*0.006, pts[0].y+MN*0.009);
  for (i=1;i<pts.length;i++) ctx.lineTo(pts[i].x+MN*0.006, pts[i].y+MN*0.009);
  ctx.stroke();
  ctx.restore();

  var order=[0,1,2];
  ctx.lineCap='round';
  for (i=0;i<NSEG;i++){
    var p0=pts[i], p1=pts[i+1];
    var tx=p1.x-p0.x, ty=p1.y-p0.y;
    var tl=Math.hypot(tx,ty);
    if (!(tl>1e-4)) continue;
    var nx=-ty/tl, ny=tx/tl;
    var ph0=p0.u*wind*TAU + c.phase, ph1=p1.u*wind*TAU + c.phase;
    var depth=[Math.cos(ph0),Math.cos(ph0+TAU/3),Math.cos(ph0+2*TAU/3)];
    order[0]=0; order[1]=1; order[2]=2;
    order.sort(function(p,q){ return depth[p]-depth[q]; });
    var sheenD=Math.abs(((p0.u - c.sheen)+1.5)%1 - 0.5);
    var sheen=Math.exp(-sheenD*sheenD*44);
    for (var k=0;k<3;k++){
      var sIdx=order[k];
      var o0=Math.sin(ph0+sIdx*TAU/3)*amp*g;
      var o1=Math.sin(ph1+sIdx*TAU/3)*amp*g;
      var col = sIdx===0 ? ca : (sIdx===1 ? cb : mix(ca,cb,0.5));
      if (gold) col=mix(col,KIN2,0.72);
      var lit=mix(col,[255,252,242],sheen*0.6 + (depth[sIdx]>0?0.14:0));
      ctx.strokeStyle=rgb(lit, 0.28+0.62*g);
      ctx.lineWidth=lw*(depth[sIdx]>0?1.05:0.82);
      ctx.beginPath();
      ctx.moveTo(p0.x+nx*o0, p0.y+ny*o0);
      ctx.lineTo(p1.x+nx*o1, p1.y+ny*o1);
      ctx.stroke();
    }
  }
  // how close the cord is to being tied, written on the cloth once it is close
  if (g>0.45 && !c.tied){
    var mx=pts[(NSEG/2)|0].x, my=pts[(NSEG/2)|0].y;
    ctx.save();
    ctx.globalAlpha=clamp((g-0.45)/0.4,0,1)*0.55;
    ctx.font=(MN*0.021).toFixed(1)+'px '+JOST;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(122,112,94,1)';
    ctx.fillText(Math.round(clamp(c.s,0,1)*100)+'', mx, my+MN*0.034);
    ctx.restore();
  }
}
function drawKnot(k){
  var x=k.x*W, y=k.y*H;
  var a=k.age<0.14 ? eElastic(k.age/0.14) : 1;
  var fade=1-clamp((k.age-(k.life-2.2))/2.2,0,1);
  var r=MN*0.028*a;
  if (!(r>0)||fade<=0.01) return;
  ctx.save();
  ctx.translate(x,y); ctx.rotate(k.seed*0.2);
  ctx.globalAlpha=fade;
  ctx.fillStyle='rgba(198,183,154,0.42)';
  ctx.beginPath(); ctx.ellipse(MN*0.004,MN*0.007,r*1.02,r*0.84,0,0,TAU); ctx.fill();
  // 淡路結び as three interlocking loops
  ctx.lineCap='round'; ctx.lineJoin='round';
  var i;
  for (i=0;i<3;i++){
    var ang=i*TAU/3 + 0.3;
    ctx.strokeStyle=rgb(mix(KIN2,[255,248,214],i*0.2), 0.95);
    ctx.lineWidth=Math.max(1.6,r*0.29);
    ctx.beginPath();
    ctx.ellipse(Math.cos(ang)*r*0.34, Math.sin(ang)*r*0.34, r*0.66, r*0.34, ang, 0, TAU);
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,250,226,0.9)';
  ctx.lineWidth=Math.max(1,r*0.12);
  ctx.beginPath(); ctx.arc(0,0,r*0.18,0,TAU); ctx.stroke();
  ctx.restore();
}

// ── the hand ────────────────────────────────────────────────────────────
var BONES=[[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]];
function drawHand(v,t){
  if (!v.pts || v.pts.length<21) return;
  var col=voiceCol(v);
  var a=clamp((now()-v.t)<LOST_S ? 1 : 0, 0, 1);
  var alpha=0.2+0.8*clamp(v.openS,0,1);
  var lw=Math.max(1.6, v.span*MN*0.055);
  var i,j,p;
  ctx.save();
  // palm, as cloth-coloured shadow first then the silk fill
  var palmIdx=[0,1,5,9,13,17];
  ctx.beginPath();
  for (i=0;i<palmIdx.length;i++){
    p=v.pts[palmIdx[i]];
    if (!p) { ctx.restore(); return; }
    var x=p.x*W+MN*0.006, y=p.y*H+MN*0.01;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(200,186,158,0.4)'; ctx.fill();
  ctx.beginPath();
  for (i=0;i<palmIdx.length;i++){
    p=v.pts[palmIdx[i]];
    if (i===0) ctx.moveTo(p.x*W,p.y*H); else ctx.lineTo(p.x*W,p.y*H);
  }
  ctx.closePath();
  ctx.fillStyle=rgb(col, 0.13+0.1*v.linkS); ctx.fill();

  ctx.lineCap='round'; ctx.lineJoin='round';
  for (i=0;i<BONES.length;i++){
    var b=BONES[i];
    ctx.strokeStyle='rgba(198,183,154,0.42)';
    ctx.lineWidth=lw*1.5;
    ctx.beginPath();
    for (j=0;j<b.length;j++){
      p=v.pts[b[j]]; if(!p) break;
      var xx=p.x*W+MN*0.005, yy=p.y*H+MN*0.008;
      if (j===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    ctx.strokeStyle=rgb(col, 0.42+0.48*alpha);
    ctx.lineWidth=lw;
    ctx.beginPath();
    for (j=0;j<b.length;j++){
      p=v.pts[b[j]]; if(!p) break;
      if (j===0) ctx.moveTo(p.x*W,p.y*H); else ctx.lineTo(p.x*W,p.y*H);
    }
    ctx.stroke();
  }
  for (i=0;i<TIPS.length;i++){
    p=v.pts[TIPS[i]]; if(!p) continue;
    ctx.fillStyle=rgb(col,0.8);
    ctx.beginPath(); ctx.arc(p.x*W,p.y*H,lw*0.62,0,TAU); ctx.fill();
  }
  // the voice: a ring at the palm that breathes with the level
  var cx=v.px*W, cy=v.py*H;
  var rr=MN*(0.034+v.lvl*0.5);
  ctx.strokeStyle=rgb(col, 0.3+0.5*clamp(v.linkS,0,1));
  ctx.lineWidth=Math.max(1.2, MN*0.0035);
  ctx.beginPath(); ctx.arc(cx,cy,rr,0,TAU); ctx.stroke();
  if (v.linkS>0.02){
    ctx.strokeStyle=rgb(mix(col,KIN2,v.linkS), 0.5*v.linkS);
    ctx.lineWidth=Math.max(1.4, MN*0.006*v.linkS);
    ctx.beginPath(); ctx.arc(cx,cy,rr*1.22,0,TAU*clamp(v.linkS,0,1)); ctx.stroke();
  }
  // degree name, set in mincho so it reads as a name and not a tuner readout
  ctx.font=(MN*0.05).toFixed(1)+'px '+MIN;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(198,183,154,0.6)';
  ctx.fillText(stepName(v.step), cx+MN*0.005, cy-rr-MN*0.048+MN*0.005);
  ctx.fillStyle=rgb(mix(col,[74,66,53],0.35), 0.86);
  ctx.fillText(stepName(v.step), cx, cy-rr-MN*0.048);
  ctx.font=(MN*0.017).toFixed(1)+'px '+JOST;
  ctx.fillStyle='rgba(140,129,108,0.8)';
  ctx.fillText(Math.round(v.glide)+' Hz', cx, cy+rr+MN*0.034);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  FRAME
// ═══════════════════════════════════════════════════════════════════════
var running=false, lastT=now(), hudT=0, started=false;
function frame(){
  requestAnimationFrame(frame);
  var t=now(), dt=t-lastT; lastT=t;
  if (!(dt>0)) dt=0;
  if (dt>0.05) dt=0.05;

  if (demoRun) drawDemo(t);

  var st=updateCords(dt);
  updateVoices(dt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  drawGround(t);

  var i;
  for (i=0;i<CORDS.length;i++) drawCord(CORDS[i],t);
  for (i=0;i<KNOTS.length;i++) drawKnot(KNOTS[i]);
  for (i=0;i<NV;i++) if (vAlive(V[i])) drawHand(V[i],t);

  if (running && st.alive===0) drawWaiting(t);

  hudT+=dt;
  if (hudT>0.16){
    hudT=0;
    hHands.textContent = st.alive ? String(st.alive) : '—';
    hCords.textContent = st.cords ? (st.cords + (st.tied?(' / 結 '+st.tied):'')) : '—';
    hKnots.textContent = String(knotTotal);
    var names=[], j;
    for (j=0;j<NV;j++) if (vAlive(V[j]) && V[j].lvl>0.008) names.push(stepName(V[j].step));
    hChord.textContent = names.length ? names.join(' ') : '—';
    hChord.id='hChord';
    hChord.style.color = (st.tied>0) ? '#c9a227' : '';
  }
}
function drawWaiting(t){
  var a=0.4+Math.sin(t*1.6)*0.12;
  ctx.save();
  ctx.globalAlpha=a;
  ctx.font=(MN*0.032).toFixed(1)+'px '+MIN;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(122,112,94,1)';
  ctx.fillText('手をかざしてください', W/2, H*0.5);
  ctx.font=(MN*0.017).toFixed(1)+'px '+JOST;
  ctx.fillStyle='rgba(162,151,127,1)';
  ctx.fillText('UP TO FOUR HANDS', W/2, H*0.5+MN*0.048);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  THE TEACHING LOOP ─ two palms drift together, a braid grows between them
//  and ties; underneath, two sour wavy lines converge into one clean line,
//  which is the sound the picture is describing.
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true;
function demoPalm(c,x,y,r,col,a){
  c.save(); c.globalAlpha=a;
  c.fillStyle='rgba(200,186,158,0.45)';
  c.beginPath(); c.ellipse(x+r*0.1,y+r*0.14,r*0.78,r*0.62,0,0,TAU); c.fill();
  c.fillStyle=rgb(col,0.2);
  c.beginPath(); c.ellipse(x,y,r*0.78,r*0.62,0,0,TAU); c.fill();
  c.strokeStyle=rgb(col,0.8); c.lineWidth=Math.max(1.4,r*0.09);
  c.lineCap='round';
  for (var i=0;i<4;i++){
    var ang=-1.5+i*0.42;
    c.beginPath();
    c.moveTo(x+Math.cos(ang)*r*0.42, y+Math.sin(ang)*r*0.34);
    c.lineTo(x+Math.cos(ang)*r*1.16, y+Math.sin(ang)*r*0.96);
    c.stroke();
  }
  c.beginPath(); c.arc(x,y,r*0.2,0,TAU); c.strokeStyle=rgb(col,0.6); c.stroke();
  c.restore();
}
function drawDemo(t){
  var c=demoCtx, w=demoCv.width, h=demoCv.height;
  if (!c) return;
  c.clearRect(0,0,w,h);
  c.fillStyle='#fbf8f0'; c.fillRect(0,0,w,h);
  var per=3.6, ph=(t%per)/per;
  var close = ph<0.62 ? eOut(ph/0.62) : 1-eOut(clamp((ph-0.78)/0.22,0,1));
  var tied = ph>0.62 && ph<0.82;
  var r=h*0.15;
  var x0=w*0.20+close*w*0.14, x1=w*0.80-close*w*0.14, y=h*0.40;
  // braid between them
  var gg=clamp(close,0,1);
  if (gg>0.02){
    var amp=h*0.035*gg, wind=6;
    var sag=(x1-x0)*(0.2-0.15*gg);
    for (var i=0;i<40;i++){
      var u0=i/40, u1=(i+1)/40;
      var f=function(u){
        var m=1-u;
        return { x:m*m*x0+2*m*u*((x0+x1)/2)+u*u*x1, y:m*m*y+2*m*u*(y+sag)+u*u*y };
      };
      var p0=f(u0), p1=f(u1);
      var tx=p1.x-p0.x, ty=p1.y-p0.y, tl=Math.hypot(tx,ty)||1;
      var nx=-ty/tl, ny=tx/tl;
      var ph0=u0*wind*TAU + t*1.1;
      var dep=[Math.cos(ph0),Math.cos(ph0+TAU/3),Math.cos(ph0+2*TAU/3)];
      var ord=[0,1,2]; ord.sort(function(p,q){ return dep[p]-dep[q]; });
      for (var k=0;k<3;k++){
        var si=ord[k];
        var col = si===0?BENI:(si===1?AI:mix(BENI,AI,0.5));
        if (tied) col=mix(col,KIN2,0.7);
        c.strokeStyle=rgb(col, 0.3+0.6*gg);
        c.lineWidth=Math.max(1.2,h*0.016*(dep[si]>0?1.05:0.8));
        c.lineCap='round';
        c.beginPath();
        c.moveTo(p0.x+nx*Math.sin(ph0+si*TAU/3)*amp, p0.y+ny*Math.sin(ph0+si*TAU/3)*amp);
        c.moveTo(p0.x+nx*Math.sin(ph0+si*TAU/3)*amp, p0.y+ny*Math.sin(ph0+si*TAU/3)*amp);
        c.lineTo(p1.x+nx*Math.sin(u1*wind*TAU+t*1.1+si*TAU/3)*amp,
                 p1.y+ny*Math.sin(u1*wind*TAU+t*1.1+si*TAU/3)*amp);
        c.stroke();
      }
    }
  }
  demoPalm(c,x0,y,r,BENI,1);
  demoPalm(c,x1,y,r,AI,1);
  if (tied){
    var kr=h*0.052*eOut(clamp((ph-0.62)/0.05,0,1));
    c.save(); c.translate((x0+x1)/2, y+(x1-x0)*(0.2-0.15)*0.5+h*0.02);
    for (var m=0;m<3;m++){
      var ang=m*TAU/3+0.3;
      c.strokeStyle=rgb(KIN2,0.95); c.lineWidth=Math.max(1.5,kr*0.3);
      c.beginPath(); c.ellipse(Math.cos(ang)*kr*0.34,Math.sin(ang)*kr*0.34,kr*0.66,kr*0.34,ang,0,TAU); c.stroke();
    }
    c.restore();
  }
  // the sound, drawn: two sour lines converging into one
  var by=h*0.83, bw=w*0.72, bx=(w-bw)/2;
  c.save();
  c.lineWidth=Math.max(1,h*0.009); c.lineCap='round';
  var spread=lerp(0.055,0.004,gg);
  for (var s=0;s<2;s++){
    c.strokeStyle=rgb(s? AI:BENI, 0.75);
    c.beginPath();
    for (var px=0;px<=bw;px+=3){
      var u=px/bw;
      var f2=(s? 1+spread : 1-spread);
      var yy=by + Math.sin(u*TAU*5*f2 + t*3.4)*h*0.045;
      if (px===0) c.moveTo(bx+px,yy); else c.lineTo(bx+px,yy);
    }
    c.stroke();
  }
  c.font=(h*0.072).toFixed(1)+'px '+MIN;
  c.textAlign='left'; c.textBaseline='middle';
  c.fillStyle = gg>0.8 ? rgb(KIN2,1) : 'rgba(162,151,127,1)';
  c.fillText(gg>0.8?'澄む':'濁る', bx-w*0.0, by-h*0.13);
  c.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════
startBtn.addEventListener('click', function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  startSheet.classList.add('gone');
  setTimeout(function(){ startSheet.style.display='none'; }, 660);
  hud.classList.add('on');
  running=true;
  startStream()
    .then(function(){ if (initHands()) startMpCamera(); })
    .catch(showError);
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden) loseAll();
});

resize();
requestAnimationFrame(frame);
</script>
