<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<!--
  ══════════════════════════════════════════════════════════════════════════
  HIKU 引く ─ 指先の糸で映像を引き伸ばす                ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  ORIGIN     オーナーが持ち込んだ完成品（hiku.html、作者表記「APARTMENT」）。
             機構・シェーダ・配色・書体・音はオーナーの設計のまま。画廊に揃えたのは
             開始画面の文言・⟲ カメラ・⚙ で隠せる調整パネル・撮影・録画（REC-FIX）・
             カメラ失敗時の定型文・ランドマークのガードだけ。
  MOOD       両手の同じ指どうしのあいだに見えない糸が五本張られ、あやとりのように
             引くと、カメラの映像が糸に沿って透明なガラスのスライムのように
             とろりと伸び、虹色の縁とハイライトをつれて少しずつ垂れながら残る。
  PALETTE    地 #050505 ／ 文字 #f4f1ea ／ 差し色 #ff4fa3 ／ 糸の五色
             #ff4fa3・#f4f1ea・#7fffd4・#ffd36b・#9f8bff
  TYPE       Helvetica Neue（オーナーの指定のまま、細く字間を広く）
  MOTION     前のコマを指先の動きの向きにずらして描き重ねる（帰還）。
             10-14 改訂（オーナーの指示「もっとなめらかなガラスのスライムのような美しい感じ」）：
             ブロック状のデータモッシュをやめ、引き伸ばした跡を厚みのある透明なスライムとして
             描く ── 中の映像が屈折して分光し、縁は薄膜の虹色、表面にハイライト、
             厚みは粘りけをもって丸まり、ゆっくり垂れる。
  SOUND      糸一本が一声（のこぎり波の和音）。糸が短いほど高く、D のマイナー
             ペンタトニック。音程が段を変えるたびにはじく音、手の速さでフィルタが
             開き、量子化したノイズが混ざる。
  TECH       WebGL1 のピンポン FBO。HandLandmarker（2 手、動的 import）。
             ?demo で合成の手が動く（テスト用、オーナーの実装のまま）。
  ══════════════════════════════════════════════════════════════════════════

<script type="module">
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo');
const $ = id => document.getElementById(id);
const cv = $('gl'), ov = $('ov'), vid = $('vid'), octx = ov.getContext('2d');
const statusEl = $('status');

/* ---------------- WebGL ---------------- */
const gl = cv.getContext('webgl', {antialias:false, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:false});
if (!gl) $('err').textContent = 'WebGLが使えません';

const VS = `attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;

/* 2026-10-14: the look was changed from a blocky datamosh to smooth glass slime (owner's request).
   Pass 1 (FS_MOSH) advects the picture and a "thickness" field (alpha) along the strings, with no
   per-block randomness, and lets the thickness relax like a viscous blob.
   Pass 2 (FS_SHOW) renders that thickness as clear glass: refraction with dispersion, a specular
   highlight, a thin-film iridescent rim and a soft lip at the edge. */
const FS_MOSH = `
precision highp float;
varying vec2 v;
uniform sampler2D cam, prev;
uniform vec2 sxy, px;
uniform float mir, aspect, time, strength, decay, camOK;
uniform vec4 A[5];
uniform vec4 B[5];
uniform vec2 hands;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
vec3 camAt(vec2 u){
  vec2 c=vec2(.5+(u.x-.5)*sxy.x,.5+(u.y-.5)*sxy.y);
  if(mir>.5)c.x=1.-c.x;
  vec3 col=texture2D(cam,clamp(c,0.,1.)).rgb;
  vec3 ph=vec3(.08+.25*u.y,.06+.1*sin(u.x*6.+time),.12+.2*(1.-u.y))+.04*sin(vec3(0,2,4)+u.x*20.+time*2.);
  return mix(ph,col,camOK);
}
vec4 pv(vec2 u){return texture2D(prev,vec2(u.x,1.-u.y));}
float seg(vec2 p,vec2 a,vec2 b,out float t){vec2 pa=p-a,ba=b-a;t=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.,1.);return length(pa-ba*t);}
void main(){
  vec2 asp=vec2(aspect,1.);
  // a slow, smooth wobble instead of random blocks
  float n=vn(v*asp*7.+time*.35)*.6+vn(v*asp*15.-time*.5)*.4;
  float W=0.,ws=0.;vec2 V=vec2(0.);
  for(int i=0;i<5;i++){
    float t,d,w;
    if(hands.x>.5&&hands.y>.5){
      d=seg(v*asp,A[i].xy*asp,B[i].xy*asp,t);
      float wid=.03+.03*n+.01*sin(t*9.+time*2.+float(i));
      w=smoothstep(wid,0.,d);w*=w*(3.-2.*w);
      W=max(W,w);V+=w*mix(A[i].zw,B[i].zw,t);ws+=w;
    }
    if(hands.x>.5){d=length((v-A[i].xy)*asp);float rr=.05+.03*n;w=smoothstep(rr,0.,d);W=max(W,w);V+=w*A[i].zw;ws+=w;}
    if(hands.y>.5){d=length((v-B[i].xy)*asp);float rr=.05+.03*n;w=smoothstep(rr,0.,d);W=max(W,w);V+=w*B[i].zw;ws+=w;}
  }
  V/=max(ws,1e-4);
  float sp=length(V);
  float mv=clamp(sp*70.,0.,1.);
  // viscous relax: the thickness spreads a little to its neighbours, so blobs round off and merge
  vec2 o1=px*2.;
  float Ab=(pv(v+vec2(o1.x,0.)).a+pv(v-vec2(o1.x,0.)).a+pv(v+vec2(0.,o1.y)).a+pv(v-vec2(0.,o1.y)).a)*.25;
  // the picture follows the motion: out(u)=prev(u - V*k), smoothly, with a slow downward sag
  vec2 off=V*strength*(.75+.5*n);
  vec4 P=pv(v);
  vec2 sag=vec2(0.,.0009)*P.a;
  vec2 q=v-off-sag;
  vec4 Q=pv(q);
  float act=W*(.35+.65*mv);
  float m=max(act,mix(Q.a,Ab,.5)*decay);
  // keep colour honest over time
  // where nothing has been smeared yet the buffer is empty, so take the colour from the camera there

const FS_SHOW = `

/* ---------------- camera ---------------- */
let facing='user', camOK=0, stream=null;
async function startCam(){
  const md=navigator.mediaDevices;
  if(!md||!md.getUserMedia)throw new Error('getUserMedia is unavailable');
  const s2=await md.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=s2;vid.srcObject=stream;await vid.play().catch(()=>{});camOK=1;
  rawHands=[];resetHands();
}
function camErrText(e){
  const m=(e&&(e.message||e.name))?(e.message||e.name):String(e||'unknown');
  return 'カメラを起動できませんでした：'+m+'\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function cover(){ // screen uv -> cam uv scale
  const vw=vid.videoWidth||16,vh=vid.videoHeight||9;const va=vw/vh,ca=W/H;
  return va>ca?[ca/va,1]:[1,va/ca];
}
const mirrored=()=>facing==='user';
function lmToScreen(x,y,s){ const cx=mirrored()?1-x:x; return [.5+(cx-.5)/s[0], .5+(y-.5)/s[1]]; }

/* ---------------- hand tracking ---------------- */
let landmarker=null, lastVT=-1, rawHands=[], lastSeen=[0,0], modelErr=false;
async function initHands(){
  const {FilesetResolver,HandLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},
    runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
  try{landmarker=await HandLandmarker.createFromOptions(fs,opts('GPU'));}
  catch(e){console.warn('GPU delegate failed',e);landmarker=await HandLandmarker.createFromOptions(fs,opts('CPU'));}
}
const TIPS=[4,8,12,16,20];
function detect(now){
  if(DEMO){rawHands=demoHands(now/1000);return;}
  if(EXT||!landmarker||vid.readyState<2||vid.currentTime===lastVT)return;
  lastVT=vid.currentTime;
  const ts=Math.max(lastTs+1,Math.round(now));lastTs=ts;
  let r=null;try{r=landmarker.detectForVideo(vid,ts);}catch(e){return;}
  rawHands=parseHands(r&&r.landmarks);
}
// keep only hands whose wrist and five fingertips are real, finite points
const okP=q=>q&&isFinite(q.x)&&isFinite(q.y);
function parseHands(list){
  const out=[];if(!Array.isArray(list))return out;
  const s=cover();
  for(const l of list){
    if(out.length>=2)break;
    if(!l||typeof l.length!=='number'||l.length<21)continue;
    if(!okP(l[0])||!TIPS.every(k=>okP(l[k])))continue;
    out.push({wrist:lmToScreen(l[0].x,l[0].y,s),tips:TIPS.map(k=>lmToScreen(l[k].x,l[k].y,s))});
  }
  return out;
}
let lastTs=0,EXT=false;
function demoHands(t){
  const a=[.22+.08*Math.sin(t*.9),.55+.12*Math.sin(t*1.3)], b=[.78+.08*Math.sin(t*1.1+1),.45+.15*Math.cos(t*.8)];
  const mk=(c,sgn,ph)=>({wrist:[c[0],c[1]+.12],tips:[0,1,2,3,4].map(i=>[c[0]+sgn*(.03+.015*i)+.02*Math.sin(t*3+i+ph),c[1]-.10+i*.045+.03*Math.sin(t*2.3+i*.7+ph)])});
  return [mk(a,1,0),mk(b,-1,2)];
}

/* smoothed state: hand slots 0=left on screen, 1=right */
const S=[0,1].map(()=>({on:false,tips:TIPS.map(()=>[.5,.5]),prev:TIPS.map(()=>[.5,.5]),vel:TIPS.map(()=>[0,0]),fresh:true}));
function resetHands(){S.forEach(st=>{st.on=false;st.fresh=true;st.vel.forEach(v=>{v[0]=0;v[1]=0;});});lastSeen=[0,0];}
function updateHands(now){
  const hs=rawHands.slice(0,2).sort((p,q)=>p.wrist[0]-q.wrist[0]);
  let assign=[null,null];
  if(hs.length===2) assign=[hs[0],hs[1]];
  else if(hs.length===1){ // keep it in the slot it's closest to
    const h=hs[0];let k=h.wrist[0]<.5?0:1;
    if(S[0].on&&!S[1].on)k=0; else if(S[1].on&&!S[0].on)k=1;
    else if(S[0].on&&S[1].on){const d=i=>Math.hypot(S[i].tips[1][0]-h.tips[1][0],S[i].tips[1][1]-h.tips[1][1]);k=d(0)<d(1)?0:1;}
    assign[k]=h;
  }
  for(let i=0;i<2;i++){
    const st=S[i],h=assign[i];
    if(h){lastSeen[i]=now;
      for(let j=0;j<5;j++){
        const tp=st.tips[j];st.prev[j]=[tp[0],tp[1]];
        if(st.fresh){tp[0]=h.tips[j][0];tp[1]=h.tips[j][1];}
        else{tp[0]+=(h.tips[j][0]-tp[0])*.55;tp[1]+=(h.tips[j][1]-tp[1])*.55;}
        let vx=tp[0]-st.prev[j][0],vy=tp[1]-st.prev[j][1];
        const m=Math.hypot(vx,vy),cap=.06;if(m>cap){vx*=cap/m;vy*=cap/m;}
        st.vel[j][0]+=(vx-st.vel[j][0])*.6;st.vel[j][1]+=(vy-st.vel[j][1])*.6;
      }
      st.fresh=false;st.on=true;
    } else if(now-lastSeen[i]>160){st.on=false;st.fresh=true;st.vel.forEach(v=>{v[0]=0;v[1]=0;});}
  }
}

/* ---------------- audio ---------------- */
let AC=null,master,send,voices=[],noise,recDest;
const SC=[0,3,5,7,10], BASE=73.42; // D minor pentatonic from D2
const nf=n=>BASE*Math.pow(2,(12*Math.floor(n/5)+SC[((n%5)+5)%5])/12);
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=.9;master.connect(comp);
  recDest=AC.createMediaStreamDestination();comp.connect(recDest);
  const dl=AC.createDelay(1.5);dl.delayTime.value=.36;const fbk=AC.createGain();fbk.gain.value=.42;const lp=AC.createBiquadFilter();lp.frequency.value=2200;
  dl.connect(lp);lp.connect(fbk);fbk.connect(dl);lp.connect(master);
  const dl2=AC.createDelay(1.5);dl2.delayTime.value=.53;const fb2=AC.createGain();fb2.gain.value=.3;dl2.connect(fb2);fb2.connect(dl2);fb2.connect(lp);
  send=AC.createGain();send.gain.value=.4;send.connect(dl);send.connect(dl2);
  const pan=()=>AC.createStereoPanner?AC.createStereoPanner():AC.createGain();
  for(let i=0;i<5;i++){
    const f=AC.createBiquadFilter();f.type='lowpass';f.Q.value=7;f.frequency.value=400;
    const g=AC.createGain();g.gain.value=0;const p=pan();
    const os=[['sawtooth',1,0],['sawtooth',1,9],['triangle',.5,0]].map(([t,m,d])=>{const o=AC.createOscillator();o.type=t;o.detune.value=d;o.start();const og=AC.createGain();og.gain.value=t==='triangle'?.7:.35;o.connect(og);og.connect(f);return {o,m};});
    f.connect(g);g.connect(p);p.connect(master);p.connect(send);

  }
  // glitch noise
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  let hold=0,hv=0;for(let i=0;i<len;i++){if(--hold<=0){hold=1+(Math.random()*40|0);hv=Math.random()*2-1;}d[i]=hv*.7+(Math.random()*2-1)*.3;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;src.start();
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.5;bp.frequency.value=1200;
  const ws=AC.createWaveShaper();const cur=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;cur[i]=Math.round(x*5)/5;}ws.curve=cur;
  const ng=AC.createGain();ng.gain.value=0;src.connect(bp);bp.connect(ws);ws.connect(ng);ng.connect(master);ng.connect(send);
  noise={bp,ng};
}
function pluck(f,pan,vel){
  const t=AC.currentTime,g=AC.createGain(),p=AC.createStereoPanner?AC.createStereoPanner():AC.createGain();

function updateAudio(now){
  if(!AC)return;const t=AC.currentTime;
  const both=S[0].on&&S[1].on;let tot=0,cnt=0;
  S.forEach(s=>{if(s.on)s.vel.forEach(v=>{tot+=Math.hypot(v[0],v[1]);cnt++;});});
  const asp=W/H;
  for(let i=0;i<5;i++){
    const vo=voices[i];
    if(both){
      const a=S[0].tips[i],b=S[1].tips[i];
      const len=Math.hypot((a[0]-b[0])*asp,a[1]-b[1]);
      const sp=(Math.hypot(...S[0].vel[i])+Math.hypot(...S[1].vel[i]))/2;
      const x=Math.min(1,Math.max(0,(len-.06)/.9));
      const step=Math.round((1-x)*11)+i;           // shorter string = higher
      const f=nf(step);

/* ---------------- overlay strings ---------------- */
let showLines=false;
function drawLines(){
  octx.clearRect(0,0,ov.width,ov.height);if(!showLines)return;
  const w=ov.width,h=ov.height;octx.lineWidth=Math.max(1,w/600);octx.lineCap='round';
  const col=['#ff4fa3','#f4f1ea','#7fffd4','#ffd36b','#9f8bff'];
  if(S[0].on&&S[1].on)for(let i=0;i<5;i++){
    const a=S[0].tips[i],b=S[1].tips[i];octx.strokeStyle=col[i];octx.globalAlpha=.75;octx.shadowColor=col[i];octx.shadowBlur=8;
    octx.beginPath();octx.moveTo(a[0]*w,a[1]*h);octx.lineTo(b[0]*w,b[1]*h);octx.stroke();}
  octx.shadowBlur=0;octx.globalAlpha=.9;
  S.forEach(s=>{if(s.on)s.tips.forEach((p,i)=>{octx.fillStyle=col[i];octx.beginPath();octx.arc(p[0]*w,p[1]*h,w/220,0,7);octx.fill();});});

/* ---------------- render loop ---------------- */
let cur=0,t0=performance.now(),strength=1.7,decay=.972,running=false;
const ua=new Float32Array(20),ub=new Float32Array(20);
function frame(now){
  requestAnimationFrame(frame);
  detect(now);updateHands(now);updateAudio(now);
  for(let j=0;j<5;j++){
    const a=S[0],b=S[1];
    ua.set([a.tips[j][0],a.tips[j][1],a.vel[j][0],a.vel[j][1]],j*4);
    ub.set([b.tips[j][0],b.tips[j][1],b.vel[j][0],b.vel[j][1]],j*4);
  }
  if(camOK&&vid.readyState>=2){gl.bindTexture(gl.TEXTURE_2D,camTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid);}

  gl.uniform1f(u.strength,strength);gl.uniform1f(u.decay,decay);gl.uniform1f(u.camOK,camOK&&vid.readyState>=2?1:0);

  gl.useProgram(PS.p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,dst.t);gl.uniform1i(PS.u.t,0);gl.uniform2f(PS.u.px,1/W,1/H);gl.uniform1f(PS.u.time,(now-t0)/1000);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  cur=1-cur;
  drawLines();
  const n=(S[0].on?1:0)+(S[1].on?1:0);
  statusEl.textContent=modelErr?'':!landmarker&&!DEMO&&!EXT?'手の検出を準備中…':n===2?'糸 ×5':n===1?'片手':'手をかざして';
  if(shootReq){shootReq=false;saveShot();}
}

$('rec').onclick=e=>{
  const b=e.currentTarget;
  if(mr&&mr.state==='recording'){mr.stop();return;}
  const vs=cv.captureStream(30);const tracks=[...vs.getVideoTracks()];if(recDest)tracks.push(...recDest.stream.getAudioTracks());
  const ms=new MediaStream(tracks);
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  try{mr=new MediaRecorder(ms,mt?{mimeType:mt,videoBitsPerSecond:6e6}:{});}catch(err){$('msg').textContent='録画を開始できませんでした。'+(err&&err.message?'\n'+err.message:'');return;}
  chunks=[];mr.ondataavailable=ev=>ev.data.size&&chunks.push(ev.data);
  mr.onstop=()=>{b.classList.remove('act');b.textContent='● REC';
    const blob=new Blob(chunks,{type:mr.mimeType||'video/mp4'});const ext=(mr.mimeType||'').includes('mp4')?'mp4':'webm';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hiku_'+Date.now()+'.'+ext;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);};
  mr.start(1000);b.classList.add('act');b.textContent='■ STOP';
};
if(DEMO){$('go').click();}
window.__hiku={
  feedHands(list){if(!EXT&&modelErr){modelErr=false;$('msg').textContent='';}EXT=true;rawHands=parseHands(list);return rawHands.length;},
  state(){return {hands:S.map(st=>({on:st.on,tips:st.tips.map(t=>t.slice()),vel:st.vel.map(v=>v.slice())})),raw:rawHands.length,W,H};}
};
requestAnimationFrame(frame);
