<title>HAND//DUST ─ 手でつかむ粒の群れ</title>
<meta name="description" content="HAND//GLITCH の後継。映像が一万八千の粒にほどけ、その一粒ずつが自分の居場所を覚えている。手をひらけば粒は押しのけられ、握れば掴めて、握ったまま動かして離せば手の速さのまま飛んでいく。放せば粒は自分の居場所へ帰り、肖像がひとりでに組み上がる。速い粒ほど赤と青がずれて尾を引く。粒・塊・尾の三つ。">
<meta name="theme-color" content="#080b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  ══════════════════════════════════════════════════════════════════════════
  HAND//DUST ─ 手でつかむ粒の群れ                    ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  WHAT IT IS  HAND//GLITCH v2, asked for by the owner, with one thing added
              that the original did not have: the glitch is made of OBJECTS
              you can hold. v1 tore the picture with screen-space noise —
              the image was never anything but an image. Here the picture is
              dissolved into about eighteen thousand dots, each of which
              remembers which pixel of you it is, and your hands can shove
              them, grab a fistful and carry them, and throw them. Let go and
              the portrait reassembles itself, dot by dot.

  PALETTE   深藍  shin-ai  #080b14  the void the dust hangs in. Deep indigo,
                                    NOT black — black would make the dark
                                    half of the camera's own colours vanish
                                    and the swarm would look like it had
                                    holes in it.
            粒            LIVE      the dots are not coloured by this sheet
                                    at all: every dot carries the colour of
                                    the pixel of you that it came from. The
                                    only palette in the piece is your room.
            裂    retsu   #ff2f4e / #00e5ff   the split. A fast dot writes
                                    its red and its blue a few pixels apart,
                                    so speed itself is the chromatic fringe.
                                    These two are never drawn directly.
            骨    hone    #c9d4e8   glyphs.
            鈍    nibi    #4a5468   rules and inactive controls.

  BACKGROUND  None, and that is the point: there is no camera image behind
              the dust. If a dot is not there, nothing is there.

  TYPE      DotGothic16 — a Japanese BITMAP face, letters built out of dots,
            which is the piece's own subject at type size. Share Tech Mono
            for the numerals.

  MOTION    SNAPPY AND PHYSICAL, the opposite of tonight's slow pieces. Every
            dot is a real damped spring to its home pixel with genuine
            overshoot; a grab is instant; a throw carries the hand's measured
            velocity. Nothing here is eased by hand — it is all integrated.

  SIGNATURE THE FISTFUL. Close your hand inside the swarm and the dots inside
            it are CAPTURED — they keep their positions relative to your fist,
            so what you are holding is a legible piece of the picture, not a
            blob. Carry it somewhere else and the portrait has a hole in it
            and your hand has the missing piece. Open your fist while moving
            and every captured dot leaves with your hand's velocity, trailing
            its own red and blue apart, and then falls home.
  ══════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  HAND//DUST ─ 手でつかむ粒の群れ
//
//  The difference from v1 in one line: the glitch is no longer applied TO
//  the picture, it is made OF the picture. Every dot is a real object with
//  a home pixel, a velocity and a spring, and the hands are forces on it.
//
//  Real-time budget: ~18,000 dots at 60fps means nothing may be allocated
//  per frame and nothing may be an object. Every dot lives in flat typed
//  arrays (structure-of-arrays), the splat writes straight into one reused
//  ImageData, and the buffer size adapts to measured frame time.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function nowS(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number'&&isFinite(v); }

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var sheet=document.getElementById('sheet');
var goBtn=document.getElementById('go');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var densEl=document.getElementById('dens');
var springEl=document.getElementById('spring');
var rN=document.getElementById('rN'), rD=document.getElementById('rD'), rG=document.getElementById('rG');
var mBtn=[document.getElementById('m0'),document.getElementById('m1'),document.getElementById('m2')];

var W=0,H=0,DPR=1,MN=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null, camOK=false;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user'); camOK=true;
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  BUFFERS.  The dust lives in the same space as the camera sample, which
//  is why one buffer pixel has to be SQUARE: CH is derived from CW by the
//  CAMERA's aspect, so a grab radius means the same physical distance
//  whichever way the phone is held.
// ═══════════════════════════════════════════════════════════════════════
var camAspectV=4/3;
function camAspect(){
  var a=camAspectV;
  if (video&&video.videoWidth>0&&video.videoHeight>0) a=video.videoWidth/video.videoHeight;
  if (!fin(a)||a<0.2||a>5) a=1.3333;
  camAspectV=a;
  return a;
}
var CW=0, CH=0, NPX=0;
var camCv=null, camCtx=null, outCv=null, outCtx=null, outImg=null, OUT=null;
var FBUF=null;          // Float32Array NPX*3 — the trail buffer the dust writes into
var TEAR=null;          // Int16Array CH — per-row horizontal tear offset
var srcData=null;
var targetArea=92000, lastAlloc=-99;

function allocBuffers(cw){
  cw=clamp(Math.round(cw),180,460);
  var chh=Math.max(120,Math.round(cw/Math.max(0.35,camAspect())));
  if (cw===CW&&chh===CH) return;
  CW=cw; CH=chh; NPX=CW*CH;
  if (!camCv) camCv=document.createElement('canvas');
  camCv.width=CW; camCv.height=CH;
  camCtx=camCv.getContext('2d',{willReadFrequently:true})||camCv.getContext('2d');
  if (!outCv) outCv=document.createElement('canvas');
  outCv.width=CW; outCv.height=CH;
  outCtx=outCv.getContext('2d');
  outImg=outCtx.createImageData(CW,CH);
  OUT=outImg.data;
  FBUF=new Float32Array(NPX*3);
  TEAR=new Int16Array(CH);
  for (var i=0;i<NPX;i++) OUT[i*4+3]=255;
  seedDots(true);
}

// ═══════════════════════════════════════════════════════════════════════
//  THE DUST.  Structure of arrays, allocated once per resolution.
// ═══════════════════════════════════════════════════════════════════════
var ND=0;
var DX=null, DY=null, DVX=null, DVY=null, DHX=null, DHY=null, DHI=null;
var DR=null, DG=null, DB=null, DGRAB=null, DOX=null, DOY=null;
var density=0.55, springAmt=0.52, MODE=0;

function targetDots(){
  var per=lerp(14,4.2,clamp(density,0,1));
  return clamp(Math.round(NPX/per), 1500, 30000);
}
function seedDots(force){
  var want=targetDots();
  if (!force && want===ND) return;
  ND=want;
  DX=new Float32Array(ND); DY=new Float32Array(ND);
  DVX=new Float32Array(ND); DVY=new Float32Array(ND);
  DHX=new Float32Array(ND); DHY=new Float32Array(ND);
  DHI=new Int32Array(ND);
  DR=new Uint8Array(ND); DG=new Uint8Array(ND); DB=new Uint8Array(ND);
  DGRAB=new Int8Array(ND); DOX=new Float32Array(ND); DOY=new Float32Array(ND);
  // a jittered lattice, not pure random: pure random leaves visible clumps
  // and bald patches, and the picture has to stay readable as a picture
  var cols=Math.max(1,Math.round(Math.sqrt(ND*CW/Math.max(1,CH))));
  var rows=Math.max(1,Math.ceil(ND/cols));
  var k=0;
  for (var j=0;j<rows&&k<ND;j++){
    for (var i=0;i<cols&&k<ND;i++){
      var hx=clamp((i+0.5+(Math.random()-0.5)*0.85)*(CW/cols),0,CW-1);
      var hy=clamp((j+0.5+(Math.random()-0.5)*0.85)*(CH/rows),0,CH-1);
      DHX[k]=hx; DHY[k]=hy;
      DHI[k]=((hy|0)*CW+(hx|0));
      DX[k]=hx; DY[k]=hy;
      DVX[k]=0; DVY[k]=0; DGRAB[k]=-1;
      DR[k]=40; DG[k]=48; DB[k]=70;
      k++;
    }
  }
  for (;k<ND;k++){ DHX[k]=0; DHY[k]=0; DHI[k]=0; DX[k]=0; DY[k]=0; DGRAB[k]=-1; }
}

// ═══════════════════════════════════════════════════════════════════════
//  HANDS ─ position, size, how open, and (the one v1 never needed) a
//  measured VELOCITY, because a throw has to carry it.
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.34;
var PALMPTS=[0,5,9,13,17], TIPS=[8,12,16,20];
var NEED=[0,5,8,9,12,13,16,17,20];
function mkHand(){
  return { on:false, t:-1e9, x:0, y:0, r:20, open:0.6, vx:0, vy:0,
           fist:false, wasFist:false, grabN:0 };
}
var HA=[mkHand(),mkHand()];
function loseHands(){
  for (var k=0;k<2;k++){
    HA[k].on=false; HA[k].t=-1e9; HA[k].vx=0; HA[k].vy=0;
    HA[k].fist=false; HA[k].wasFist=false; HA[k].grabN=0;
  }
  releaseAll();
}
function handLive(i){ return HA[i].on && (nowS()-HA[i].t)<LOST_S; }
function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<21) return false;
  var p=L[i];
  return !!p && fin(p.x) && fin(p.y);
}
function onHands(res){
  var t=nowS();
  var list=(res&&res.multiHandLandmarks)?res.multiHandLandmarks:[];
  var AS=camAspect(), used=0, k, i;
  for (k=0;k<list.length && used<2;k++){
    var L=list[k], ok=true;
    for (i=0;i<NEED.length;i++){ if (!lmOK(L,NEED[i])){ ok=false; break; } }
    if (!ok) continue;
    var cx=0, cy=0;
    for (i=0;i<PALMPTS.length;i++){ cx+=L[PALMPTS[i]].x; cy+=L[PALMPTS[i]].y; }
    cx/=PALMPTS.length; cy/=PALMPTS.length;
    // buffer pixels, which are square because CH came from the camera aspect
    var bx=clamp(mirror?(1-cx):cx,-0.4,1.4)*CW;
    var by=clamp(cy,-0.4,1.4)*CH;
    if (!fin(bx)||!fin(by)) continue;
    var sp=Math.hypot((L[9].x-L[0].x)*CW,(L[9].y-L[0].y)*CH);
    if (!fin(sp)||sp<1) sp=1;
    var acc=0;
    for (i=0;i<4;i++) acc+=Math.hypot((L[TIPS[i]].x-L[0].x)*CW,(L[TIPS[i]].y-L[0].y)*CH);
    var Hd=HA[used];
    var dtm=t-Hd.t;
    if (Hd.on && dtm>1e-3 && dtm<LOST_S){
      var nvx=(bx-Hd.x)/dtm, nvy=(by-Hd.y)/dtm;
      var mix=clamp(dtm/0.07,0,1);
      Hd.vx+=(clamp(nvx,-6000,6000)-Hd.vx)*mix;
      Hd.vy+=(clamp(nvy,-6000,6000)-Hd.vy)*mix;
    } else {
      // reacquired after a dropout: a hand that teleported has no velocity,
      // and must not fling the whole swarm across the frame
      Hd.vx=0; Hd.vy=0;
      Hd.wasFist=false;
      releaseHand(used,false);
    }
    Hd.x=bx; Hd.y=by;
    Hd.r=clamp(sp*1.5, CW*0.02, CW*0.45);
    Hd.open=clamp((acc/4/sp-1.30)/1.15,0,1);
    Hd.wasFist=Hd.fist;
    Hd.fist=(Hd.open<0.34);
    Hd.on=true; Hd.t=t;
    used++;
  }
  for (k=used;k<2;k++){
    if (HA[k].on){ HA[k].on=false; HA[k].vx=0; HA[k].vy=0; HA[k].fist=false;
                   HA[k].wasFist=false; releaseHand(k,false); }
  }
}
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0,
                       minDetectionConfidence:0.55, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  GRAB AND RELEASE
//  A captured dot keeps its offset from the fist, so a fistful is a legible
//  piece of the picture rather than a blob. Release hands the dot the fist's
//  own measured velocity, which is what makes a throw feel thrown.
// ═══════════════════════════════════════════════════════════════════════
var GRAB_CAP=3200;
function releaseHand(hi,withVelocity){
  if (!DGRAB) return;
  var vx=0, vy=0;
  if (withVelocity && HA[hi]){ vx=HA[hi].vx*1.05; vy=HA[hi].vy*1.05; }
  if (!fin(vx)) vx=0;
  if (!fin(vy)) vy=0;
  for (var i=0;i<ND;i++){
    if (DGRAB[i]===hi){
      DGRAB[i]=-1;
      DVX[i]=clamp(vx,-6000,6000);
      DVY[i]=clamp(vy,-6000,6000);
    }
  }
  if (HA[hi]) HA[hi].grabN=0;
}
function releaseAll(){
  if (!DGRAB) return;
  for (var i=0;i<ND;i++) DGRAB[i]=-1;
  HA[0].grabN=0; HA[1].grabN=0;
}
function grabStep(){
  for (var hi=0;hi<2;hi++){
    var Hd=HA[hi];
    if (!handLive(hi)){ if (Hd.grabN>0) releaseHand(hi,false); continue; }
    if (Hd.fist && !Hd.wasFist){
      // the fist just closed: capture what is inside it
      var R=Hd.r*0.95, R2=R*R, n=0;
      for (var i=0;i<ND&&n<GRAB_CAP;i++){
        if (DGRAB[i]!==-1) continue;
        var dx=DX[i]-Hd.x, dy=DY[i]-Hd.y;
        if (dx*dx+dy*dy>R2) continue;
        DGRAB[i]=hi; DOX[i]=dx; DOY[i]=dy; n++;
      }
      Hd.grabN=n;
      if (n>0) sfxGrab(n);
    } else if (!Hd.fist && Hd.wasFist){
      var thrown=Hd.grabN;
      var sp2=Math.hypot(Hd.vx,Hd.vy);
      releaseHand(hi,true);
      if (thrown>0) sfxThrow(sp2);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE STEP.  One pass over the dust: sample its own colour, apply the
//  hands, integrate the spring. Everything is a flat array read.
// ═══════════════════════════════════════════════════════════════════════
var MODE_K   =[30.0, 11.0, 3.2];      // spring stiffness per mode
var MODE_DAMP=[ 6.2,  4.4, 2.0];
var MODE_FADE=[0.34, 0.52, 0.80];     // trail persistence per mode
var MODE_SIZE=[   1,    2,    1];     // splat half-size in buffer px
var MODE_SPLIT=[0.030,0.055,0.045];
var PUSH_K=55;                        // how hard an open palm clears its own radius
var dustEnergy=0, grabbed=0;

function dustStep(dt){
  if (!ND||!srcData) return;
  var d=srcData.data;
  var K=MODE_K[MODE]*lerp(0.35,1.9,clamp(springAmt,0,1));
  var DP=MODE_DAMP[MODE]*lerp(0.75,1.35,clamp(springAmt,0,1));
  var h0=HA[0], h1=HA[1];
  var l0=handLive(0), l1=handLive(1);
  var p0=(l0&&!h0.fist), p1=(l1&&!h1.fist);
  var r0=l0?h0.r:0, r1=l1?h1.r:0;
  // An open palm is an EXCLUSION ZONE, not a gentle breeze. A plain
  // inverse-falloff force was measured at about one buffer pixel of
  // displacement — invisible, and the piece is supposed to be about
  // CONTROLLING the dots. The restoring force is proportional to how far
  // INSIDE the palm a dot is, so the hole actually clears to the rim and
  // stays cleared while the hand is there; sweeping fast adds a shove on
  // top, which is what throws dust rather than merely parting it.
  var pk0=p0?PUSH_K:0, pk1=p1?PUSH_K:0;
  var pu0=p0?Math.min(2600,Math.hypot(h0.vx,h0.vy))*0.85:0;
  var pu1=p1?Math.min(2600,Math.hypot(h1.vx,h1.vy))*0.85:0;
  var maxV=CW*14;
  var en=0, gn=0;
  for (var i=0;i<ND;i++){
    var q=DHI[i]<<2;
    DR[i]=d[q]; DG[i]=d[q+1]; DB[i]=d[q+2];
    var g=DGRAB[i];
    if (g>=0){
      var Hg=HA[g];
      if (!handLive(g)){ DGRAB[i]=-1; }
      else {
        DX[i]=Hg.x+DOX[i]; DY[i]=Hg.y+DOY[i];
        DVX[i]=Hg.vx; DVY[i]=Hg.vy;
        gn++;
        var exd=DX[i]-DHX[i], eyd=DY[i]-DHY[i];
        en+=exd*exd+eyd*eyd;
        continue;
      }
    }
    var x=DX[i], y=DY[i], vx=DVX[i], vy=DVY[i];
    var ex=DHX[i]-x, ey=DHY[i]-y;
    var ax=ex*K-vx*DP, ay=ey*K-vy*DP;
    if (p0){
      var dx0=x-h0.x, dy0=y-h0.y;
      var s0=dx0*dx0+dy0*dy0;
      if (s0<r0*r0){
        var dd0=Math.sqrt(s0)+0.001;
        var q0=1-dd0/r0;
        var f0=(r0-dd0)*pk0+q0*q0*pu0;
        ax+=dx0/dd0*f0; ay+=dy0/dd0*f0;
      }
    }
    if (p1){
      var dx1=x-h1.x, dy1=y-h1.y;
      var s1=dx1*dx1+dy1*dy1;
      if (s1<r1*r1){
        var dd1=Math.sqrt(s1)+0.001;
        var q1=1-dd1/r1;
        var f1=(r1-dd1)*pk1+q1*q1*pu1;
        ax+=dx1/dd1*f1; ay+=dy1/dd1*f1;
      }
    }
    vx+=ax*dt; vy+=ay*dt;
    if (vx>maxV) vx=maxV; else if (vx<-maxV) vx=-maxV;
    if (vy>maxV) vy=maxV; else if (vy<-maxV) vy=-maxV;
    x+=vx*dt; y+=vy*dt;
    // the frame is a wall, not a hole: a dot that leaves never comes back
    if (x<-CW*0.5){ x=-CW*0.5; vx=-vx*0.3; }
    else if (x>CW*1.5){ x=CW*1.5; vx=-vx*0.3; }
    if (y<-CH*0.5){ y=-CH*0.5; vy=-vy*0.3; }
    else if (y>CH*1.5){ y=CH*1.5; vy=-vy*0.3; }
    if (!fin(x)||!fin(y)||!fin(vx)||!fin(vy)){
      x=DHX[i]; y=DHY[i]; vx=0; vy=0;
    }
    DX[i]=x; DY[i]=y; DVX[i]=vx; DVY[i]=vy;
    var exx=x-DHX[i], eyy=y-DHY[i];
    en+=exx*exx+eyy*eyy;
  }
  grabbed=gn;
  var norm=ND>0?Math.sqrt(en/ND)/Math.max(1,CW*0.10):0;
  dustEnergy=lerp(dustEnergy,clamp(norm,0,1),clamp(dt/0.12,0,1));
}

// ═══════════════════════════════════════════════════════════════════════
//  THE TEAR ─ the one thing kept wholesale from v1, but now it is caused
//  by the dust rather than by a timer: bands of rows slip sideways only
//  when the swarm is actually disturbed, and settle when it settles.
// ═══════════════════════════════════════════════════════════════════════
var tearT=0;
function tearStep(dt){
  if (!TEAR) return;
  tearT-=dt;
  if (tearT>0) return;
  tearT=0.055+Math.random()*0.10;
  var amp=dustEnergy*CW*0.09;
  var y=0;
  while (y<CH){
    var band=2+((Math.random()*22)|0);
    var off=0;
    if (amp>0.6 && Math.random()<0.18+0.45*dustEnergy){
      off=((Math.random()*2-1)*amp)|0;
    }
    var end=Math.min(CH,y+band);
    for (;y<end;y++) TEAR[y]=off;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE SPLAT.  The dust is drawn straight into a float accumulation buffer
//  that is never fully cleared — it decays — so a moving dot leaves a tail.
//  Red and blue are written a few pixels apart, by an amount that IS the
//  dot's speed, so the chromatic fringe is never decorative.
// ═══════════════════════════════════════════════════════════════════════
function renderDust(){
  if (!FBUF||!OUT||!ND) return;
  var i, n3=NPX*3;
  var fade=MODE_FADE[MODE];
  for (i=0;i<n3;i++) FBUF[i]*=fade;

  var half=MODE_SIZE[MODE];
  var splitK=MODE_SPLIT[MODE];
  var cw=CW, ch=CH;
  for (i=0;i<ND;i++){
    var x=DX[i], y=DY[i];
    if (x<-4||y<-4||x>cw+4||y>ch+4) continue;
    var yi=y|0;
    if (yi<0) yi=0; else if (yi>ch-1) yi=ch-1;
    var xi=(x|0)+TEAR[yi];
    var sp=Math.hypot(DVX[i],DVY[i])*splitK;
    if (sp>cw*0.10) sp=cw*0.10;
    var so=sp|0;
    var r=DR[i], g=DG[i], b=DB[i];
    for (var oy=-half;oy<=half;oy++){
      var py=yi+oy;
      if (py<0||py>ch-1) continue;
      var rowo=py*cw;
      for (var ox=-half;ox<=half;ox++){
        var pxc=xi+ox;
        if (pxc>=0&&pxc<cw){ FBUF[(rowo+pxc)*3+1]+=g; }
        var pr=pxc-so;
        if (pr>=0&&pr<cw){ FBUF[(rowo+pr)*3]+=r; }
        var pb=pxc+so;
        if (pb>=0&&pb<cw){ FBUF[(rowo+pb)*3+2]+=b; }
      }
    }
  }
  // ground + tone map. The deep indigo is added, not cleared to, so the
  // dark half of the camera's own colours still reads against it.
  for (i=0;i<NPX;i++){
    var o=i*3, q=i<<2;
    var fr=FBUF[o]+8, fg=FBUF[o+1]+11, fb=FBUF[o+2]+20;
    OUT[q]  =fr>255?255:fr;
    OUT[q+1]=fg>255?255:fg;
    OUT[q+2]=fb>255?255:fb;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ the swarm has to be audible as a swarm. The hiss IS the
//  displacement energy, so a picture at rest is nearly silent and a picture
//  you have thrown across the room roars.
// ═══════════════════════════════════════════════════════════════════════
var AC=null, comp=null, master=null, audioOK=false, noiseBuf=null;
var hissG=null, hissBp=null, bedG=null;
function initAudio(){
  if (audioOK) return true;
  var A=window.AudioContext||window.webkitAudioContext;
  if (!A) return false;
  try{
    AC=new A();
    comp=AC.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=9; comp.ratio.value=4.4;
    comp.attack.value=0.004; comp.release.value=0.20;
    master=AC.createGain(); master.gain.value=0.82;
    comp.connect(master); master.connect(AC.destination);
    var sr=AC.sampleRate, n=Math.floor(sr*1.3);
    noiseBuf=AC.createBuffer(1,n,sr);
    var nd=noiseBuf.getChannelData(0);
    for (var i=0;i<n;i++) nd[i]=Math.random()*2-1;

    var bedLP=AC.createBiquadFilter();
    bedLP.type='lowpass'; bedLP.frequency.value=240; bedLP.Q.value=0.6;
    bedG=AC.createGain(); bedG.gain.value=0.040;
    bedLP.connect(bedG); bedG.connect(comp);
    var bs=AC.createBufferSource(); bs.buffer=noiseBuf; bs.loop=true;
    bs.connect(bedLP);
    try{ bs.start(); }catch(e){}

    var hs=AC.createBufferSource(); hs.buffer=noiseBuf; hs.loop=true;
    hissBp=AC.createBiquadFilter(); hissBp.type='bandpass';
    hissBp.frequency.value=1800; hissBp.Q.value=1.3;
    hissG=AC.createGain(); hissG.gain.value=0.0001;
    hs.connect(hissBp); hissBp.connect(hissG); hissG.connect(comp);
    try{ hs.start(); }catch(e){}
    audioOK=true; return true;
  }catch(e){ AC=null; audioOK=false; return false; }
}
function pushAudio(){
  if (!audioOK) return;
  var t=AC.currentTime;
  var e=clamp(dustEnergy,0,1);
  hissG.gain.setTargetAtTime(0.0006+0.085*e*e,t,0.09);
  hissBp.frequency.setTargetAtTime(clamp(900+5200*e,200,9000),t,0.12);
  bedG.gain.setTargetAtTime(0.030+0.030*e,t,0.3);
}
function sfxGrab(n){
  if (!audioOK||!n) return;
  var t=AC.currentTime;
  var o=AC.createOscillator(); o.type='square';
  o.frequency.setValueAtTime(clamp(200+n*0.05,80,900),t);
  o.frequency.exponentialRampToValueAtTime(70,t+0.11);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(clamp(0.03+n*0.00002,0.004,0.11),t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
  o.connect(g); g.connect(comp);
  o.start(t); o.stop(t+0.2);
}
function sfxThrow(v){
  if (!audioOK||!noiseBuf) return;
  var t=AC.currentTime;
  var a=clamp(v/2600,0,1);
  if (a<0.04) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf;
  var bp=AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(600,t);
  bp.frequency.exponentialRampToValueAtTime(clamp(1800+7000*a,400,12000),t+0.16);
  bp.Q.value=0.9;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.02+0.11*a,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
  s.connect(bp); bp.connect(g); g.connect(comp);
  s.start(t); s.stop(t+0.4);
}
var settleArmed=false;
function settleWatch(){
  if (!audioOK) return;
  if (dustEnergy>0.28) settleArmed=true;
  else if (settleArmed && dustEnergy<0.05){
    settleArmed=false;
    var t=AC.currentTime;
    var o=AC.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(880,t);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.035,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    o.connect(g); g.connect(comp);
    o.start(t); o.stop(t+1.0);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  COMPOSITE + OVERLAY
// ═══════════════════════════════════════════════════════════════════════
var fitS=1, fitX=0, fitY=0;
function updateFit(){
  var s=Math.max(W/Math.max(1,CW),H/Math.max(1,CH));
  if (!fin(s)||s<=0) s=1;
  fitS=s; fitX=(W-CW*s)/2; fitY=(H-CH*s)/2;
}
function bufX(bx){ return fitX+bx*fitS; }
function bufY(by){ return fitY+by*fitS; }
function drawHands(g){
  for (var i=0;i<2;i++){
    if (!handLive(i)) continue;
    var Hd=HA[i];
    var px=bufX(Hd.x), py=bufY(Hd.y), pr=Hd.r*fitS;
    if (!fin(px)||!fin(py)||!fin(pr)||pr<1) continue;
    g.save();
    if (Hd.fist){
      g.fillStyle='rgba(255,47,78,0.10)';
      g.beginPath(); g.arc(px,py,pr,0,TAU); g.fill();
      g.strokeStyle='rgba(255,47,78,0.85)';
      g.lineWidth=Math.max(2,MN*0.0055);
      g.beginPath(); g.arc(px,py,pr,0,TAU); g.stroke();
      if (Hd.grabN>0){
        g.font='14px "Share Tech Mono", monospace';
        g.fillStyle='rgba(255,47,78,0.95)';
        g.textAlign='center'; g.textBaseline='bottom';
        g.fillText(String(Hd.grabN), px, py-pr-6);
      }
    } else {
      g.strokeStyle='rgba(0,229,255,0.55)';
      g.lineWidth=Math.max(1,MN*0.0030);
      g.setLineDash([Math.max(3,pr*0.14),Math.max(3,pr*0.20)]);
      g.beginPath(); g.arc(px,py,pr,0,TAU); g.stroke();
      g.setLineDash([]);
    }
    g.restore();
  }
}
function drawHint(g){
  if (handLive(0)||handLive(1)) return;
  g.save();
  g.font=Math.round(Math.max(12,MN*0.022))+'px "DotGothic16", sans-serif';
  g.fillStyle='rgba(201,212,232,0.62)';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('手をかざして、粒をつかんでください', W*0.5, H*0.09);
  g.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var running=false, lastT=nowS(), frameMs=16, lastResize=-99, hudT=0;
function frame(){
  requestAnimationFrame(frame);
  var t0=(typeof performance!=='undefined'&&performance.now)?performance.now():0;
  var t=nowS();
  var dt=t-lastT; lastT=t;
  if (!fin(dt)||dt<=0) dt=0.016;
  if (dt>0.05) dt=0.05;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#080b14'; ctx.fillRect(0,0,W,H);

  if (running&&CW>0){
    updateFit();
    if (camOK&&video&&video.videoWidth>0){
      try{
        camCtx.save();
        if (mirror){ camCtx.translate(CW,0); camCtx.scale(-1,1); }
        camCtx.drawImage(video,0,0,CW,CH);
        camCtx.restore();
        srcData=camCtx.getImageData(0,0,CW,CH);
      }catch(e){ srcData=null; }
    }
    var pdt=dt>0.033?0.033:dt;
    grabStep();
    dustStep(pdt);
    tearStep(dt);
    renderDust();
    try{ outCtx.putImageData(outImg,0,0); }catch(e){}
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(outCv,fitX,fitY,CW*fitS,CH*fitS);
    drawHands(ctx);
    drawHint(ctx);
    pushAudio();
    settleWatch();
  }

  var t1=(typeof performance!=='undefined'&&performance.now)?performance.now():0;
  var ms=t1-t0;
  if (fin(ms)) frameMs=frameMs*0.92+ms*0.08;
  if (running&&(t-lastResize)>1.8&&CW>0){
    if (Math.abs(CW/CH-camAspect())>0.06){
      lastResize=t;
      allocBuffers(Math.round(Math.sqrt(targetArea*Math.max(0.35,camAspect()))));
      updateFit();
    }
    else if (frameMs>27&&CW>200){ lastResize=t; allocBuffers(Math.round(CW*0.87)); }
    else if (frameMs<14&&CW<430){ lastResize=t; allocBuffers(Math.round(CW*1.09)); }
  }
  if (t-hudT>0.25){
    hudT=t;
    if (rN) rN.textContent=String(ND);
    if (rD) rD.textContent=String(Math.round(clamp(dustEnergy,0,1)*100));
    if (rG) rG.textContent=String(grabbed);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  CONSOLE
// ═══════════════════════════════════════════════════════════════════════
function setMode(m){
  MODE=clamp(Math.round(m),0,2);
  for (var i=0;i<3;i++) if (mBtn[i]) mBtn[i].className=(i===MODE)?'on':'';
}
for (var mi=0;mi<3;mi++) (function(i){
  if (mBtn[i]) mBtn[i].addEventListener('click',function(){ setMode(i); });
})(mi);
if (densEl) densEl.addEventListener('input',function(){
  var v=parseInt(densEl.value,10);
  density=clamp((fin(v)?v:55)/100,0,1);
  if (CW>0) seedDots(false);
});
if (springEl) springEl.addEventListener('input',function(){
  var v=parseInt(springEl.value,10);
  springAmt=clamp((fin(v)?v:52)/100,0,1);
});

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM ─ a small swarm, a hand that grabs a fistful,
//  carries it, throws it, and lets the picture put itself back together.
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoLast=nowS(), demoT=0;
var dN=560, dX=new Float32Array(dN), dY=new Float32Array(dN);
var dVX=new Float32Array(dN), dVY=new Float32Array(dN);
var dHX=new Float32Array(dN), dHY=new Float32Array(dN);
var dGr=new Int8Array(dN), dOX=new Float32Array(dN), dOY=new Float32Array(dN);
var dCol=new Uint8Array(dN*3);
(function(){
  var cols=40, rows=Math.ceil(dN/cols);
  for (var i=0;i<dN;i++){
    var cx=(i%cols+0.5)/cols, cy=(Math.floor(i/cols)+0.5)/rows;
    dHX[i]=cx; dHY[i]=cy; dX[i]=cx; dY[i]=cy; dGr[i]=-1;
    var band=Math.abs(cx-0.5)<0.16&&cy>0.15&&cy<0.9;
    dCol[i*3]  =band?235:40+Math.round(70*cx);
    dCol[i*3+1]=band?170:60+Math.round(90*cy);
    dCol[i*3+2]=band?140:130+Math.round(60*(1-cx));
  }
})();
function demoFrame(){
  if (!demoRun||!demoCtx) return;
  requestAnimationFrame(demoFrame);
  var t=nowS(), dt=Math.min(0.04,t-demoLast); demoLast=t;
  demoT+=dt;
  var P=6.0, ph=(demoT%P)/P;
  var DW=demoCv.width, DH=demoCv.height, g=demoCtx;
  var hx=0.5+0.30*Math.sin(ph*TAU*0.85), hy=0.5+0.18*Math.sin(ph*TAU*1.7);
  var fist=(ph>0.22&&ph<0.62), R=0.13;
  var hvx=(0.30*Math.cos(ph*TAU*0.85)*TAU*0.85)/P, hvy=(0.18*Math.cos(ph*TAU*1.7)*TAU*1.7)/P;
  var i;
  if (fist){
    for (i=0;i<dN;i++){
      if (dGr[i]!==-1) continue;
      var ddx=dX[i]-hx, ddy=dY[i]-hy;
      if (ddx*ddx+ddy*ddy<R*R){ dGr[i]=0; dOX[i]=ddx; dOY[i]=ddy; }
    }
  } else {
    for (i=0;i<dN;i++) if (dGr[i]===0){ dGr[i]=-1; dVX[i]=hvx*2.2; dVY[i]=hvy*2.2; }
  }
  for (i=0;i<dN;i++){
    if (dGr[i]===0){ dX[i]=hx+dOX[i]; dY[i]=hy+dOY[i]; continue; }
    var ax=(dHX[i]-dX[i])*22-dVX[i]*5.0;
    var ay=(dHY[i]-dY[i])*22-dVY[i]*5.0;
    dVX[i]+=ax*dt; dVY[i]+=ay*dt;
    dX[i]+=dVX[i]*dt; dY[i]+=dVY[i]*dt;
  }
  g.fillStyle='#080b14'; g.fillRect(0,0,DW,DH);
  for (i=0;i<dN;i++){
    var sp=Math.min(6,Math.hypot(dVX[i],dVY[i])*9);
    var px=dX[i]*DW, py=dY[i]*DH;
    g.fillStyle='rgb('+dCol[i*3]+',0,0)';
    g.fillRect(px-sp-1,py-1,3,3);
    g.fillStyle='rgb(0,'+dCol[i*3+1]+',0)';
    g.fillRect(px-1,py-1,3,3);
    g.fillStyle='rgb(0,0,'+dCol[i*3+2]+')';
    g.fillRect(px+sp-1,py-1,3,3);
  }
  var HX=hx*DW, HY=hy*DH, HR=R*DW;
  g.lineWidth=2;
  if (fist){
    g.fillStyle='rgba(255,47,78,0.10)';
    g.beginPath(); g.arc(HX,HY,HR,0,TAU); g.fill();
    g.strokeStyle='rgba(255,47,78,0.9)';
  } else {
    g.strokeStyle='rgba(0,229,255,0.6)';
    g.setLineDash([5,6]);
  }
  g.beginPath(); g.arc(HX,HY,HR,0,TAU); g.stroke();
  g.setLineDash([]);
  g.fillStyle='rgba(201,212,232,0.85)';
  g.font='13px "Share Tech Mono", monospace';
  g.textAlign='left'; g.textBaseline='top';
  g.fillText(fist?'GRAB':'OPEN / THROW',12,12);
}
if (demoCtx) demoFrame();

// ═══════════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════════
goBtn.addEventListener('click',function(){
  if (running) return;
  running=true; demoRun=false;
  initAudio();
  if (AC&&AC.state==='suspended'){ var r=AC.resume(); if (r&&r.then) r.catch(function(){}); }
  sheet.classList.add('gone');
  allocBuffers(Math.round(Math.sqrt(targetArea*Math.max(0.35,camAspect()))));
  updateFit();
  initHands();
  startStream().then(startMpCamera).catch(showError);
  lastT=nowS();
});

resize();
setMode(0);
lastT=nowS();
frame();
</script>
