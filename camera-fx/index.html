<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="カメラ映像に 22 種類のリアルタイムエフェクトをかけるフィルター台。手を振るとカメラとエフェクトが入れ替わり、手のひらを返すと次のエフェクトへ。🎲 でランダム、AUTO で自動切り替え。">
<meta name="theme-color" content="#000000">
<title>CAMERA FX ─ 二十二のエフェクトを手で切り替えるフィルター台</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  CAMERA FX ─ 二十二のエフェクトを手で切り替えるフィルター台   ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       深夜のビデオ編集室のエフェクト卓。黒い画面に、ネオン緑の計器と
             エフェクト名のテープラベル。どのエフェクトも画面いっぱいの絵になる。
  EFFECTS    MATRIX・ASCII・GLITCH・THERMAL・KALEIDO・PIXEL（初代の六つを作り直し）
             ＋ HALFTONE・COMIC・NEON・VHS・NIGHT・X-RAY・WARHOL・MIRROR・SWIRL・
             FISHEYE・LIQUID・8BIT・LED・ECHO・SKETCH・DUOTONE（2026-10-04 追加）。
  PALETTE    UI は #000 地・#00ff41 の計器緑・白。色はエフェクトごとに持ち、
             「色」スライダーと 🎲 で色相をずらせる。
  TYPE       Space Grotesk（エフェクト名）＋ JetBrains Mono（計器）。
  MOTION     切り替えは升目のブロックが左から塗り替わる。エフェクト同士の切り替えは
             0.35 秒の色ブロックのちらつき。AUTO は数秒ごとにひとりでに替わる。
  SWITCH     はじめは素のカメラ。「▸ FX」か手を振ると選んだエフェクトへ。
             手のひらを返す（表⇄裏）と次のエフェクトへ。
  TECH       全エフェクトを WebGL2 の一枚のフラグメントシェーダで描く（エフェクト番号で分岐）。
             ECHO は前フレームを読む帰還（ピンポンの二枚の FBO）。MATRIX と ASCII は
             起動時に焼いた文字アトラスを升目ごとに引く。手の検出は MediaPipe
             HandLandmarker（動的 import、失敗してもボタンで遊べる）。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

  background:linear-gradient(90deg,#00ff41,#fff,#ff2bd6,#00d4ff,#00ff41);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}

  border:1px solid var(--acc);border-radius:24px;background:rgba(0,0,0,.5);color:#fff;font:700 12px "JetBrains Mono",monospace;letter-spacing:.24em;

<div id="start">
  <div class="t">22 REALTIME EFFECTS</div>
  <h1>CAMERA FX</h1>
  <div class="tags" id="tags"></div>
  <p>まずは、いつものカメラ。<br>手を振るか「▸ FX」で、エフェクトの世界へ。<br>手のひらを返すたびに次のエフェクトへ。🎲 でランダム。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>
<script>
'use strict';
/* =====================================================================
   CAMERA FX — twenty-two effects in one fragment shader.
   Pass 1 renders the chosen effect (mixed with the camera by the block
   sweep, and with a colour-block flicker right after a change) into one of
   two FBOs; ECHO reads the other one (last frame). Pass 2 copies it to the
   screen. MATRIX / ASCII sample a glyph atlas baked once at start.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = id => document.getElementById(id);
const canvas = $('gl');
const video = document.createElement('video'); video.playsInline = true; video.muted = true; video.autoplay = true;

const FX = [
  ['MATRIX', '#00ff41'], ['ASCII', '#ffaa00'], ['GLITCH', '#ff0066'], ['THERMAL', '#ff5a1a'], ['KALEIDO', '#00d4ff'], ['PIXEL', '#ff00ff'],
  ['HALFTONE', '#00b7eb'], ['COMIC', '#ffe100'], ['NEON', '#ff2bd6'], ['VHS', '#7cf0ff'], ['NIGHT', '#5dff6a'], ['X-RAY', '#8fd8ff'],
  ['WARHOL', '#ff4fa3'], ['MIRROR', '#e0e0e0'], ['SWIRL', '#b06bff'], ['FISHEYE', '#3fd0c0'], ['LIQUID', '#3aa0ff'], ['8BIT', '#ff004d'],
  ['LED', '#ff8a00'], ['ECHO', '#c8ff00'], ['SKETCH', '#bdb6a8'], ['DUOTONE', '#ff6a3d'],
];
const S = { fx:0, k:.5, hue:0, auto:false, autoSpeed:.5, wave:true, flip:true };
const STATE = { frames:0, waves:0, flips:0, changes:0, randoms:0, autos:0 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uVid, uPrev, uGlyph;
uniform vec2 uRes, uScale;
uniform float uMirror, uT, uX, uSw, uSwSeed, uK, uHue;
uniform int uFx;
out vec4 o;
const float PI = 3.14159265;
float L(vec3 c){ return dot(c, vec3(.299, .587, .114)); }
vec3 hsv(float h, float s, float v){ vec3 k = clamp(abs(mod(h * 6. + vec3(0., 4., 2.), 6.) - 3.) - 1., 0., 1.); return v * mix(vec3(1.), k, s); }
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
vec3 hueRot(vec3 c, float a){
  const mat3 toY = mat3(.299, .596, .211, .587, -.274, -.523, .114, -.322, .312);
  const mat3 toR = mat3(1., 1., 1., .956, -.272, -1.106, .621, -.647, 1.703);
  vec3 y = toY * c; float cs = cos(a), sn = sin(a);
  y.yz = vec2(y.y * cs - y.z * sn, y.y * sn + y.z * cs);
  return clamp(toR * y, 0., 1.);
}
vec3 cam(vec2 s){
  vec2 v = (vec2(s.x, 1. - s.y) - .5) * uScale + .5;
  if (uMirror > .5) v.x = 1. - v.x;
  return texture(uVid, clamp(v, 0., 1.)).rgb;
}
float edge(vec2 s, float r){
  vec2 e = r / uRes;
  float tl = L(cam(s + vec2(-e.x, e.y))), t = L(cam(s + vec2(0., e.y))), tr = L(cam(s + e));
  float l = L(cam(s + vec2(-e.x, 0.))), rr = L(cam(s + vec2(e.x, 0.)));
  float bl = L(cam(s - e)), b = L(cam(s - vec2(0., e.y))), br = L(cam(s + vec2(e.x, -e.y)));
  float gx = -tl - 2. * l - bl + tr + 2. * rr + br, gy = tl + 2. * t + tr - bl - 2. * b - br;
  return sqrt(gx * gx + gy * gy);
}
float glyph(float idx, float row, vec2 f){
  vec2 uv = (vec2(idx, row) + vec2(f.x, 1. - f.y) * .86 + .07) / vec2(16., 2.);
  return texture(uGlyph, uv).r;
}
vec2 asp(){ return vec2(uRes.x / min(uRes.x, uRes.y), uRes.y / min(uRes.x, uRes.y)); }
vec3 effect(int id, vec2 s, vec2 px){
  float U = min(uRes.x, uRes.y), k = uK, hu = uHue;
  vec3 c0 = cam(s);
  if (id == 0){                                                   // MATRIX
    float cs = max(9., U / (38. + 40. * k));
    vec2 cell = floor(px / cs), f = fract(px / cs);
    float rows = uRes.y / cs, r = floor((uRes.y - px.y) / cs), col = cell.x;
    float sp = .4 + h21(vec2(col, 1.)) * 1.;
    float head = mod(uT * sp * 9. + h21(vec2(col, 7.)) * rows * 3., rows * 1.7);
    float d = head - r, tail = 7. + h21(vec2(col, 3.)) * 16.;
    float a = (d >= 0. && d < tail) ? pow(1. - d / tail, 1.4) : 0.;
    float l = L(cam((cell + .5) * cs / uRes));
    float gi = floor(h21(cell + floor(uT * (2. + h21(cell) * 6.))) * 16.);
    float g = glyph(gi, 0., f);
    vec3 green = hsv(.36 + hu, .9, 1.);
    // every cell keeps a dim glyph lit by the camera, so the person stands in the rain
    float base = smoothstep(.15, .85, l);
    vec3 c = green * g * (a * (.35 + 1.1 * l) + base * (.25 + .35 * k));
    if (d >= 0. && d < 1.) c += vec3(.8, 1., .85) * g * (.5 + .5 * base);
    return c;
  }
  if (id == 1){                                                   // ASCII
    float ch = max(8., U / (28. + 52. * k)), cw = ch * .62;
    vec2 cell = floor(px / vec2(cw, ch)), f = fract(px / vec2(cw, ch));
    vec3 cc = cam((cell + .5) * vec2(cw, ch) / uRes);
    float l = clamp(pow(L(cc), .8) * 1.15, 0., .999);
    float g = glyph(floor(l * 10.), 1., f);
    vec3 col = hu > .02 ? hsv(.09 + hu, .85, 1.) : mix(vec3(1., .67, .12), cc * 1.4, .35);
    return col * g * (.55 + .9 * l) + vec3(.04, .02, 0.);
  }
  if (id == 2){                                                   // GLITCH
    float tt = floor(uT * 12.), band = floor(s.y * 26.);
    float n = h21(vec2(band, tt));
    float off = n > .84 ? (h21(vec2(band, tt + 3.)) - .5) * .16 * (.4 + k) : 0.;
    vec2 q = s + vec2(off, 0.);
    float sh = .005 + .014 * k + .006 * sin(uT * 3.);
    vec3 c = vec3(cam(q + vec2(sh, 0.)).r, cam(q).g, cam(q - vec2(sh, 0.)).b);
    vec2 bc = floor(px / (U * .07));
    if (h21(bc + tt * 1.7) > .975) c = 1. - c.gbr;
    c *= .82 + .18 * step(.5, fract(px.y / 3.));
    return hueRot(c, hu * 6.2832);
  }
  if (id == 3){                                                   // THERMAL
    vec2 e = 3. / uRes;
    float l = (L(c0) * 2. + L(cam(s + vec2(e.x, 0.))) + L(cam(s - vec2(e.x, 0.))) + L(cam(s + vec2(0., e.y))) + L(cam(s - vec2(0., e.y)))) / 6.;
    l = clamp((l - .5) * (1. + k) + .5, 0., 1.);
    vec3 c = l < .25 ? mix(vec3(0., 0., .1), vec3(.35, 0., .55), l / .25)
           : l < .5 ? mix(vec3(.35, 0., .55), vec3(.95, .1, .2), (l - .25) / .25)
           : l < .75 ? mix(vec3(.95, .1, .2), vec3(1., .65, 0.), (l - .5) / .25)
           : mix(vec3(1., .65, 0.), vec3(1., 1., .9), (l - .75) / .25);
    return hueRot(c, hu * 6.2832);
  }
  if (id == 4){                                                   // KALEIDO
    vec2 p = (s - .5) * asp();
    float r = length(p), a = atan(p.y, p.x) + uT * .25;
    float n = 6. + 2. * floor(k * 5.), w = 2. * PI / n;
    a = mod(a, w); a = abs(a - w * .5);
    vec2 q = vec2(cos(a), sin(a)) * r * (.9 + .2 * sin(uT * .4));
    vec3 c = cam(.5 + q / asp());
    return hueRot(c * (1.1 - .3 * r), hu * 6.2832 + r * 1.5);
  }
  if (id == 5){                                                   // PIXEL
    float ps = U / (14. + 36. * (1. - k));
    vec2 cell = floor(px / ps), f = fract(px / ps);
    vec3 cc = cam((cell + .5) * ps / uRes); float l = L(cc);
    vec3 c = l > .55 ? mix(vec3(1., .2, 1.), vec3(1., .9, 1.), (l - .55) / .45) : l > .25 ? mix(vec3(.2, .1, .6), vec3(1., .2, 1.), (l - .25) / .3) : vec3(.05, 0., .15) + l * vec3(.4, 0., .8);
    float gap = step(.08, f.x) * step(.08, f.y);
    return hueRot(c * gap, hu * 6.2832);
  }
  if (id == 6){                                                   // HALFTONE (CMYK)
    float sz = U / (45. + 55. * (1. - k));
    vec3 paper = vec3(.98, .96, .92), c = paper;
    vec3 inkC = vec3(0., .68, .94), inkM = vec3(.93, .0, .55), inkY = vec3(1., .93, 0.);
    float ang[4] = float[4](.26, 1.31, 0., .79);
    for (int i = 0; i < 4; i++){
      float a = ang[i]; mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
      vec2 q = R * px / sz, cell = floor(q) + .5;
      vec2 cp = inverse(R) * cell * sz;
      vec3 cc = cam(cp / uRes);
      float kk = 1. - max(cc.r, max(cc.g, cc.b));
      float v = i == 0 ? (1. - cc.r - kk) / (1. - kk + 1e-3) : i == 1 ? (1. - cc.g - kk) / (1. - kk + 1e-3) : i == 2 ? (1. - cc.b - kk) / (1. - kk + 1e-3) : kk;
      float rad = sqrt(clamp(v, 0., 1.)) * .62;
      float d = length(q - cell);
      float dot1 = 1. - smoothstep(rad - .06, rad + .06, d);
      vec3 ink = i == 0 ? inkC : i == 1 ? inkM : i == 2 ? inkY : vec3(.1);
      c *= mix(vec3(1.), ink, dot1 * (i == 3 ? .9 : .85));
    }
    return hueRot(c, hu * 6.2832);
  }
  if (id == 7){                                                   // COMIC
    vec3 c = floor(clamp(c0 * 1.25, 0., 1.) * 3. + .5) / 3.;
    float m = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b));
    c = mix(vec3(L(c)), c, 1.6); c = clamp(c, 0., 1.);
    float l = L(c0);
    float ds = U / 90.; vec2 q = mat2(.707, -.707, .707, .707) * px / ds;
    float dots = 1. - smoothstep(.25, .32, length(fract(q) - .5));

    if (!WAVE.closedSince) WAVE.closedSince = now;
    if (now - WAVE.closedSince > WAVE_CLOSED) resetWave();
    return true;
  }
  WAVE.closedSince = 0;
  WAVE.xs.push(best.x); WAVE.ts.push(now);
  while (WAVE.ts.length && now - WAVE.ts[0] > WAVE_WIN){ WAVE.ts.shift(); WAVE.xs.shift(); }
  WAVE.count = countTurns(WAVE.xs, Math.max(.025, best.size * .45));
  if (WAVE.count >= 2 && now > WAVE.cool && S.wave && started){
    WAVE.cool = now + 1400; resetWave(); STATE.waves++; FLIP.cool = Math.max(FLIP.cool, now + 700);
    setMode(!MODE.on);
  }
  return true;
}
function drawHandBadge(){
  const el = $('hand'); if (!el) return;
  const now = performance.now();
  const seen = WAVE.seen && now - WAVE.lastObs < WAVE_GAP;
  el.className = !hands && !HANDS_EXTERNAL ? 'off' : seen ? (WAVE.isOpen ? 'open' : 'seen') : '';
  el.dataset.n = seen && WAVE.isOpen ? Math.min(2, WAVE.count) : 0;
  el.classList.toggle('flip', now - FLIP.flashT < 500);
}


/* ---------- start, buttons ---------- */
FX.forEach(([n, c], i) => {
  const b = document.createElement('button'); b.textContent = n; b.dataset.i = i; if (!i) b.classList.add('on');
  b.onclick = () => { setFx(i); if (!MODE.on) setMode(true); }; $('fxrow').appendChild(b);
  const t = document.createElement('i'); t.textContent = n; t.style.color = c; $('tags').appendChild(t);
});
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!PF) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','rand','shoot','auto','prev','mode','fxrow'].forEach(id => $(id).classList.add('show'));
  if (!started){ started = true; initModels(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('sK').oninput = e => { S.k = +e.target.value; };
$('sHue').oninput = e => { S.hue = +e.target.value; };
$('sAuto').oninput = e => { S.autoSpeed = +e.target.value; AUTO.next = Math.min(AUTO.next, performance.now() + autoGap()); };
$('sWave').onchange = e => { S.wave = e.target.checked; };
$('sFlip').onchange = e => { S.flip = e.target.checked; };
$('shoot').onclick = () => {
  try{ canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'camera-fx-' + FX[S.fx][0].toLowerCase() + '-' + Date.now() + '.png'; a.click(); }, 'image/png'); }
  catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'camera-fx.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
const T0 = performance.now();
let lastT = 0, lastFrameVT = -1;
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT) / 1000) : 1 / 60; lastT = now;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  const kk = Math.min(1, 1500 / Math.max(W, H)); W = Math.round(W * kk); H = Math.round(H * kk);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  detect(now);
  drawHandBadge();
  if (video.readyState < 2) return;
  STATE.frames++;
  const vt = video.currentTime;
  if (vt !== lastFrameVT){ lastFrameVT = vt; gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }
  ensureFB(W, H);
  MODE.X = MODE.on ? Math.min(1, MODE.X + dt / .65) : Math.max(0, MODE.X - dt / .5);
  SW.v = Math.max(0, SW.v - dt / .35);
  if (S.auto && MODE.on && now > AUTO.next){ AUTO.next = now + autoGap(); STATE.autos++;
    let i = S.fx; while (i === S.fx) i = Math.random() * FX.length | 0;
    S.hue = Math.random() < .5 ? 0 : +Math.random().toFixed(2); $('sHue').value = S.hue; setFx(i); }

  // pass 1: effect into an FBO (ECHO reads the other one)
  const dst = FB[fbi], src = FB[1 - fbi];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, W, H);
  gl.useProgram(PF.p); gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src.t);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texGlyph);
  const U = PF.U;
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uPrev, 1); gl.uniform1i(U.uGlyph, 2);
  const sa = W / H, va = vidW / vidH;
  gl.uniform2f(U.uRes, W, H); gl.uniform2f(U.uScale, sa < va ? sa / va : 1, sa < va ? 1 : va / sa);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uT, (now - T0) / 1000);
  gl.uniform1f(U.uX, MODE.X); gl.uniform1f(U.uSw, MODE.X > 0 ? SW.v : 0); gl.uniform1f(U.uSwSeed, SW.seed);
  gl.uniform1f(U.uK, S.k); gl.uniform1f(U.uHue, S.hue); gl.uniform1i(U.uFx, S.fx);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // pass 2: to the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(PC.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dst.t);
  gl.uniform1i(PC.U.uTex, 0); gl.uniform2f(PC.U.uRes, W, H);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  fbi = 1 - fbi;
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__CAMERAFX = {
  ingestHands(list, t){ HANDS_EXTERNAL = true; return ingestHands(list, t); },
  state: () => ({ ...STATE, mode:MODE.on, X:MODE.X, fx:S.fx, name:FX[S.fx][0], k:S.k, hue:S.hue, auto:S.auto, waveCount:WAVE.count, side:FLIP.side }),
  mode(c){ setMode(!!c); }, fx(i){ setFx(i, 'force'); SW.v = 0; }, random(){ randomize(); }, auto(c){ setAuto(!!c); },
  count: FX.length,
};
</script>
</body>
