<meta charset="utf-8">
<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<title>USUBA ─ 手から硝子の薄刃がこぼれる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  USUBA 薄刃 ─ 手から硝子の薄刃がこぼれる                ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  ORIGIN     オーナーが持ち込んだ参照動画（2026-10-27、森で手をふる AR）を一コマずつ見て写した。
             ・指と手の縁に、両端のとがった細い硝子の刃が何百枚も密に付く
             ・刃はほぼまっすぐ（わずかに反る）。動いた向きの後ろへ揃ってなびく
             ・刃の中は「根元あたりの映像を縦に引き伸ばしたもの」。手に付いているあいだは
               肌色（桃・えんじ）、離れると背景（緑）が透けるただの硝子になる
             ・赤紫／黄緑は塗った色ではなく、屈折で赤青と緑が逆にずれて出る（HIKU の素材感）
             ・手が去ると根元が外れ、まっすぐ垂れ下がって、ゆっくり沈みながら透けて消える
  PALETTE    地 #050505 ／ 文字 #f4f1ea ／ 刃の色は映像から（赤紫 #ff3d9e・黄緑 #a6ff42 は屈折の縁）
  TYPE       Helvetica Neue、細く字間を広く。
  MOTION     刃は剛体（根元・角度・長さ・幅・反り）。付いている間は手の 21 点のどこかに根元を
             留め、角度は動きの反対向きへ遅れて揃う。外れたら速度を少し受け継いで止まり、
             角度は真下へ、終端速度のゆっくりした沈み。
  SOUND      硝子の細かい鳴り（高域のパチパチ）が刃のこぼれる量で鳴り、束で生えるごとに鈴が一音。
  TECH       WebGL2 のインスタンス描画（四角形一枚に両端のとがったレンズ形の不透明度）。
             HandLandmarker（2 手）。指でなぞってもこぼれる。?demo で合成の手が動く。
  ══════════════════════════════════════════════════════════════════════════
-->

<script type="module">
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo');
const $ = id => document.getElementById(id);
const cv = $('gl'), vid = $('vid');
const statusEl = $('status');

/* ---------------- WebGL2 ---------------- */
const gl = cv.getContext('webgl2', {antialias:true, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:false});
if (!gl) $('err').textContent = 'WebGL2 が使えません（iOS 15 以降の Safari で開いてください）';

const CAM = `
uniform sampler2D cam; uniform vec2 sxy; uniform float mir, camOK, time;
vec3 camAt(vec2 u){
  vec2 c=vec2(.5+(u.x-.5)*sxy.x,.5+(u.y-.5)*sxy.y);
  if(mir>.5)c.x=1.-c.x;
  vec3 col=texture(cam,clamp(c,0.,1.)).rgb;
  vec3 ph=vec3(.10+.10*u.y,.15+.10*sin(u.x*7.+time*.4)+.07*sin(u.y*23.+u.x*9.),.09+.07*(1.-u.y));
  ph+=.12*smoothstep(.55,1.,sin(u.x*31.+sin(u.y*13.)*2.)*sin(u.y*27.+time*.3));
  return mix(ph,col,camOK);
}
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 hue(vec3 c,float a){const vec3 k=vec3(.57735);float cs=cos(a),sn=sin(a);return c*cs+cross(k,c)*sn+k*dot(k,c)*(1.-cs);}
`;
const BG_VS = `#version 300 es
in vec2 p;out vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const BG_FS = `#version 300 es
precision highp float;in vec2 v;out vec4 o;
${CAM}
uniform vec2 res;
void main(){
  vec3 c=pow(camAt(v),vec3(1.05));
  vec2 vv=v-.5;c*=1.-.18*smoothstep(.3,.95,length(vv*vec2(1.,1.2)));
  c+=(hs(floor(v*res*.5)+fract(time*7.1)*91.)-.5)*.03;
  o=vec4(c,1.);
}`;

/* one quad per blade; the lens shape (pointed at both ends) is cut out in the fragment shader */
const BL_VS = `#version 300 es
in vec2 corner;            // x: along 0..1 (root -> tip), y: across -1..1
in vec4 iA;                // root x,y (px), direction cos, sin
in vec4 iB;                // length, half width, bend, alpha
in vec4 iC;                // seed, hue turn, glass (0 fresh .. 1 clear), 0
uniform vec2 res;
out vec2 vTS; out float vAl, vSeed, vHue, vGl, vL, vHw;
out vec2 vRoot, vDir;
void main(){
  float t=corner.x,s=corner.y;
  vec2 d=iA.zw,n=vec2(-d.y,d.x);
  vec2 p=iA.xy+d*iB.x*t+n*(iB.y*1.15*s+iB.z*iB.x*t*t);
  gl_Position=vec4(p.x/res.x*2.-1.,1.-p.y/res.y*2.,0.,1.);
  vTS=vec2(t,s);vAl=iB.w;vSeed=iC.x;vHue=iC.y;vGl=iC.z;vL=iB.x;vHw=iB.y;vRoot=iA.xy;vDir=d;
}`;
const BL_FS = `#version 300 es
precision highp float;
in vec2 vTS; in float vAl, vSeed, vHue, vGl, vL, vHw; in vec2 vRoot, vDir;
out vec4 o;
${CAM}
uniform vec2 res; uniform float refr;
void main(){
  float t=vTS.x,s=vTS.y*1.15;
  float prof=pow(max(sin(3.14159*t),0.),.82);
  float as=abs(s);
  float aa=max(fwidth(as),.02);
  float m=1.-smoothstep(prof-aa,prof+aa*.3,as);
  if(m<.002)discard;
  float r=as/max(prof,1e-3);                       // 0 on the spine .. 1 on the edge
  vec2 d=vDir,n=vec2(-d.y,d.x);
  vec2 fuv=vec2(gl_FragCoord.x/res.x,1.-gl_FragCoord.y/res.y);   // what is behind this blade
  // the picture near the root, stretched along the blade
  vec2 sp=vRoot+d*vL*(.10+t*.8)+n*vHw*s*1.1;

function updateAudio(now,spawned){
  if(!AC||!tink)return;const t=AC.currentTime;
  let sx=0,sy=0,sw=0;for(const st of SRC)if(st.on){const v=Math.hypot(st.vx,st.vy);sx+=st.cx*v;sy+=st.cy*v;sw+=v;}
  const px=sw?sx/sw/W:.5,py=sw?sy/sw/H:.5;
  tink.g.gain.setTargetAtTime(Math.min(spawned*.03,.28),t,.05);
  tink.pk.frequency.setTargetAtTime(4200+Math.min(spawned*400,5000),t,.08);
  if(tink.pan.pan)tink.pan.pan.setTargetAtTime((px-.5)*1.4,t,.1);
  bellAcc+=spawned;
  if(bellAcc>=28&&now-lastBell>140){bellAcc=0;lastBell=now;bell(nf(Math.round((1-py)*9)+((Math.random()*3)|0)-1),(px-.5)*1.6,.7);}
}

/* ---------------- render loop ---------------- */
let t0=performance.now(),lastNow=t0,simAcc=0,running=false,shootReq=false;
const MANUAL=Q.has('manual');let VNOW=t0;   // ?manual: a test rig steps frames itself
const DT=1/60;
function frame(now){
  if(!MANUAL)requestAnimationFrame(frame);
  const dt=Math.min(.1,Math.max(.001,(now-lastNow)/1000));lastNow=now;
  detect(now);updateHands(now,dt);updateTouch(now,dt);
  const spawned=running?emit(dt):0;
  simAcc+=dt;let k=0;while(simAcc>=DT&&k<4){step(DT);simAcc-=DT;k++;}if(k===4)simAcc=0;
  updateAudio(now,spawned);
  const ce=SRCV(),cready=window.__camSrc?1:(camOK&&vid.readyState>=2?1:0);
  if(cready){gl.bindTexture(gl.TEXTURE_2D,camTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,ce);}
  const s=cover(),time=(now-t0)/1000;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.disable(gl.BLEND);
  gl.useProgram(PB.p);let u=PB.u;
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,camTex);gl.uniform1i(u.cam,0);
  gl.uniform2f(u.sxy,s[0],s[1]);gl.uniform1f(u.mir,mirrored()?1:0);gl.uniform1f(u.camOK,cready);gl.uniform1f(u.time,time);gl.uniform2f(u.res,W,H);
  gl.bindVertexArray(bgVAO);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  const n=build();
  if(n>0){
    gl.bindVertexArray(blVAO);gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferSubData(gl.ARRAY_BUFFER,0,INST,0,n*FPI);
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PL.p);u=PL.u;
    gl.uniform1i(u.cam,0);gl.uniform2f(u.sxy,s[0],s[1]);gl.uniform1f(u.mir,mirrored()?1:0);gl.uniform1f(u.camOK,cready);gl.uniform1f(u.time,time);
    gl.uniform2f(u.res,W,H);gl.uniform1f(u.refr,refr);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,(ROWS+1)*2,n);
    gl.disable(gl.BLEND);
  }
  gl.bindVertexArray(null);
  const nh=(SRC[0].on?1:0)+(SRC[1].on?1:0);
  statusEl.textContent=!running?'':modelErr?'刃 '+alive:!landmarker&&!DEMO&&!EXT?'手の検出を準備中…':(nh||SRC[2].on)?'刃 '+alive:'手をかざして';
  if(shootReq){shootReq=false;saveShot();}
}

/* ---------------- UI ---------------- */
$('go').onclick=async()=>{
  $('go').disabled=true;$('go').textContent='…';
  try{initAudio();if(AC.state==='suspended')AC.resume().catch(()=>{});}catch(e){console.warn(e);}
  if(!DEMO||/cam/.test(Q.get('demo'))){
    try{await startCam();}catch(e){$('err').textContent=camErrText(e);$('go').disabled=false;$('go').textContent='START';return;}
    if(!DEMO)initHands().catch(e=>{if(EXT)return;modelErr=true;$('msg').textContent='手の検出モデルを読み込めませんでした（ネット接続を確認）。\n画面を指でなぞると刃がこぼれます。';console.error(e);});
  }
  running=true;
  $('start').style.display='none';$('ui').classList.add('on');$('gear').classList.add('on');$('flip').classList.add('on');
};
$('flip').onclick=async()=>{const prev=facing;facing=facing==='user'?'environment':'user';
  try{await startCam();$('msg').textContent=modelErr?$('msg').textContent:'';}catch(e){facing=prev;$('msg').textContent=camErrText(e);}clearBlades();};
$('gear').onclick=()=>$('panel').classList.toggle('hide');
cv.addEventListener('click',()=>$('panel').classList.add('hide'));
$('amt').oninput=e=>amount=+e.target.value;
$('len').oninput=e=>lenMul=+e.target.value;
$('wid').oninput=e=>widMul=+e.target.value;
$('life').oninput=e=>lifeMul=+e.target.value;
$('refr').oninput=e=>refr=+e.target.value;
$('clr').onclick=clearBlades;
// the WebGL canvas does not keep its drawing buffer, so the shot is taken right after a frame is drawn
$('shoot').onclick=()=>{shootReq=true;};
function saveShot(){
  try{const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(cv,0,0,W,H);
    c.toBlob(b=>{if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='usuba_'+Date.now()+'.png';a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png');
  }catch(e){$('msg').textContent='保存できませんでした。';}
}
let mr=null,chunks=[];
$('rec').onclick=e=>{
  const b=e.currentTarget;
  if(mr&&mr.state==='recording'){mr.stop();return;}
  const vs=cv.captureStream(30);const tracks=[...vs.getVideoTracks()];if(recDest)tracks.push(...recDest.stream.getAudioTracks());
  const ms=new MediaStream(tracks);
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  try{mr=new MediaRecorder(ms,mt?{mimeType:mt,videoBitsPerSecond:6e6}:{});}catch(err){$('msg').textContent='録画を開始できませんでした。'+(err&&err.message?'\n'+err.message:'');return;}
  chunks=[];mr.ondataavailable=ev=>ev.data.size&&chunks.push(ev.data);
  mr.onstop=()=>{b.classList.remove('act');b.textContent='● REC';
    const blob=new Blob(chunks,{type:mr.mimeType||'video/mp4'});const ext=(mr.mimeType||'').includes('mp4')?'mp4':'webm';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='usuba_'+Date.now()+'.'+ext;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);};
  mr.start(1000);b.classList.add('act');b.textContent='■ STOP';
};
if(DEMO){$('go').click();}
window.__usuba=window.__haku={
  tick(n,ms){for(let i=0;i<n;i++){VNOW+=ms;if(window.__rigDraw)window.__rigDraw();frame(VNOW);}return cv.toDataURL('image/png');},
  feedHands(list){if(!EXT&&modelErr){modelErr=false;$('msg').textContent='';}EXT=true;rawHands=parseHands(list);return rawHands.length;},
  state(){return {alive,W,H,hands:SRC.map(s=>({on:s.on,cx:s.cx,cy:s.cy,vx:s.vx,vy:s.vy}))};}
};
if(!MANUAL)requestAnimationFrame(frame);
</script>
