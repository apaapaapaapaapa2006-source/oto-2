<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>

<title>TSUMAMU ─ 映像をつまんで引っぱる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  TSUMAMU 摘む ─ 映像をつまんで引っぱる                     ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  ORIGIN     オーナーの「hiku みたいな作品がほしい」（2026-10-17）。HIKU と同じく、主役は
             人の見た目ではなく「指と映像のあいだで起きること」。HIKU が指どうしの糸で
             映像を伸ばすのに対し、こちらは映像の面そのものをつまんで引く。
  REFERENCE  ラテックスやゼリーの膜を指でつまんで持ち上げたときの、つままれた一点に
             向かって寄るしわと、離した瞬間のぷるんとした揺れ戻り。素材写真の世界で言えば
             ハイスピードで撮った水風船やゼリーの揺れ（ぬめった反射と縁の虹色）。
  MOOD       画面いっぱいのカメラ映像に、透明な膜が一枚かかっている。触るまでは
             ただの映像で、つまんだ瞬間だけ「これは柔らかい物だった」と分かる。
  PALETTE    映像の色がそのまま主役。膜が足すのは光だけ：白い鏡面反射、伸びた所の
             薄膜の虹色、色ずれ。素材ごとに一色だけ差す ── GEL は無色、LATEX は墨、
             HONEY は琥珀 #e0a040。UI は白 #f2efe9 と差し色の珊瑚 #ff6a4d。
  TYPE       Bricolage Grotesque 300/600（題字・ラベル）・M PLUS 2 300（和文）。
  MOTION     つまんだ点を中心に、まわりの映像が距離に応じてなめらかに付いてくる。
             離すと膜が自分の張力で揺れ戻り、波が端まで行って返ってくる。
  SIGNATURE  離した瞬間の「ぼよん」── 伸ばした長さで音程が決まり（D のマイナー
             ペンタトニック）、膜の揺れと同じ速さでビブラートがかかる。
  LAYERS     ① 主役：映像の面を親指と人差し指でつまんで引く。つまんだ点のまわりが
                重みつきで付いてきて、膜は持ち上がる
             ② 素材の光：膜の傾きで鏡面反射と縁の明るさ、伸びて薄くなった所に薄膜の
                虹色と色ずれ。縮んだ所はしわの影
             ③ 揺れ戻り：離すと膜の波動として揺れながら戻る（端は額縁に留まっている）
             ④ 両手：二か所をつまめば、そのあいだで映像が引き伸ばされる。画面を指で
                ドラッグしてもつまめる
             ⑤ はじく：つままずに人差し指をすばやく振ると、そこから波紋が走る
             ⑥ 素材 3 種：GEL（柔らかく長く揺れる）・LATEX（固く速く戻る、墨の艶）・
                HONEY（重く、ゆっくり垂れるように戻る、琥珀色）
             ⑥b 色 5 種：素・銀・桃・藍・夜光。影→中間→光の三色のグラデーションマップで、
                元の色を少し残す。切り替えると新しい色が対角線に拭き込まれる
             ⑦ 素のカメラ ⇄ 膜：膜が上から落ちてきて一度波打ち、光沢が画面をなでる
             ⑧ 音：引くあいだはゴムのきしみ（伸ばすほど高い）、離すと音程つきの
                「ぼよん」、はじくと低い太鼓。録画に入る
  TECH       WebGL2。画面を約 36 マス（短辺）の格子にし、各頂点の変位（x・y・持ち上がり）を
             膜の波動方程式（元の位置へのばね＋隣どうしのラプラシアン＋減衰）で
             固定刻みで解く。つまみは開始時に半径内の頂点を重み付きで捕まえ、
             目標位置へ強いばねで引く。頂点ごとに面の傾きと面積の伸び率を出して、
             シェーダで反射・虹色・色ずれを計算する。HandLandmarker（2 手、動的 import）。
             つまみは親指と人差し指の先の距離を手の大きさで割った値に履歴差をつけ、
             観測時間で判定する。
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const fin = Number.isFinite;

const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

/* ---------- settings & materials ---------- */
const S = { col:0, mat:0, soft:1, wob:1, rad:1, gloss:1, iri:1, vol:.6, freeze:false, dots:true };
// K: pull back to rest, C: neighbour coupling (wave speed), D: damping, G: grip, lift: how far the pinch raises the sheet
const MATS = [
  { en:'GEL',   jp:'ゼリー', K:20, C:950,  D:2.4, G:900,  lift:1.0, tint:[1, 1, 1],         spec:.6, shin:160,  iri:1.0, dark:0,   amber:0 },
  { en:'LATEX', jp:'ゴム',   K:70, C:1700, D:5.5, G:1100, lift:.7,  tint:[.92, .92, .95],   spec:1.2, shin:180, iri:.2, dark:.55, amber:0 },
  { en:'HONEY', jp:'蜜',     K:5,  C:420,  D:8.5, G:700,  lift:1.3, tint:[1.08, .86, .55],  spec:.85, shin:40,  iri:.25, dark:0,   amber:.55 },
];
// colour modes for the picture: a gradient map (shadow → mid → light) that keeps a little of the original colour
const COLS = [
  { en:'NATURAL', jp:'素',   on:0, k:1,   d:[0, 0, 0],         m:[.5, .5, .5],      l:[1, 1, 1] },
  { en:'SILVER',  jp:'銀',   on:1, k:0,   d:[.03, .035, .045], m:[.47, .49, .52],   l:[.95, .96, .97] },
  { en:'PEACH',   jp:'桃',   on:1, k:.25, d:[.2, .05, .13],    m:[.86, .45, .45],   l:[1, .93, .84] },
  { en:'INDIGO',  jp:'藍',   on:1, k:.2,  d:[.01, .03, .13],   m:[.08, .34, .66],   l:[.62, .97, 1] },
  { en:'NEON',    jp:'夜光', on:1, k:.15, d:[.05, 0, .1],      m:[.92, .12, .52],   l:[1, .97, .55] },
];
const CW = { from:0, to:0, t:1 };
const PAL = new Float32Array(18), PALK = new Float32Array(4);
const SCALE = [146.83, 174.61, 196.0, 220.0, 261.63, 293.66, 349.23, 392.0, 440.0, 523.25, 587.33, 698.46, 783.99]; // D minor pentatonic

/* ---------- canvas, camera mapping ---------- */
const view = $('view'), video = $('cam');
const G = { W:2, H:2, short:2 };
let vidW = 1280, vidH = 720, mirror = true;
const MAP = { ox:0, oy:0, dw:1, dh:1 };
function toScreen(x, y, out, o){ let X = MAP.ox + x * MAP.dw; if (mirror) X = G.W - X; out[o] = X; out[o + 1] = MAP.oy + y * MAP.dh; }
function camUV(X, Y, out, o){ let x = mirror ? G.W - X : X; out[o] = (x - MAP.ox) / MAP.dw; out[o + 1] = (Y - MAP.oy) / MAP.dh; }

/* ---------- the sheet: a membrane on a grid, solved with a fixed step ---------- */
const M = { nx:0, ny:0, n:0, cell:1, rx:null, ry:null, dx:null, dy:null, dz:null, vx:null, vy:null, vz:null, w:null, tx:null, ty:null, tz:null, acc:0 };
let VBUF = null, IDX = null;           // per vertex: x, y, u, v, gx, gy, z, strain
function buildGrid(){
  const cell = G.short / 50;
  const nx = Math.max(8, Math.round(G.W / cell) + 1), ny = Math.max(8, Math.round(G.H / cell) + 1), n = nx * ny;

const GRABS = [];      // { key, p0:[x,y], p:[x,y], idx:Int32Array, wt:Float32Array, ox, oy, oz, t0, stretch, lastStretch, voice }

/* ---------- hands: pinch with hysteresis on observation time, flicks from fingertip speed ---------- */
const HS = [0, 1].map(i => ({ i, on:false, seen:-1e9, pinch:false, hold:0, rel:0, tip:[0, 0], thumb:[0, 0], mid:[0, 0], vel:[0, 0], lastTip:null, flickCool:0, k:'h' + i }));

  const arr = Array.isArray(list) ? list.filter(validHand).slice(0, 2) : [];

}

  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try{
    actx = new AC(); master = actx.createGain(); master.gain.value = S.vol;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    // a small room so the boings have somewhere to go
    const conv = actx.createConvolver(), len = actx.sampleRate * 1.4 | 0, ir = actx.createBuffer(2, len, actx.sampleRate);
    for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    conv.buffer = ir; const wet = actx.createGain(); wet.gain.value = .22; master.connect(conv); conv.connect(wet); wet.connect(comp);
    recDest = actx.createMediaStreamDestination(); comp.connect(recDest);
    const nl = actx.sampleRate | 0; noiseBuf = actx.createBuffer(1, nl, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < nl; i++) d[i] = Math.random() * 2 - 1;
    actx.resume().catch(() => {});
  }catch(e){ actx = null; }
}
const live = () => actx && actx.state === 'running';
const panOf = x => clamp((x / G.W) * 2 - 1, -1, 1) * .7;
function out(pan){
  if (actx.createStereoPanner){ const p = actx.createStereoPanner(); p.pan.value = pan; p.connect(master); return p; }
  return master;
}
function voiceStart(x){
  if (!live()) return null;
  const t = actx.currentTime, dst = out(panOf(x));
  const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 80;
  const o2 = actx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 40;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 7; bp.frequency.value = 500;
  const g = actx.createGain(); g.gain.value = 0;
  o.connect(bp); o2.connect(bp); bp.connect(g); g.connect(dst); o.start(t); o2.start(t);
  return { o, o2, bp, g, dst };
}
function voiceTick(g){
  const v = g.voice; if (!v || !live()) return;
  const t = actx.currentTime, s = g.stretch, ds = Math.abs(g.stretch - g.lastStretch);
  const f = 70 * Math.pow(2, Math.min(3.2, s * 4.2));
  v.o.frequency.setTargetAtTime(f, t, .03); v.o2.frequency.setTargetAtTime(f / 2, t, .03);
  v.bp.frequency.setTargetAtTime(f * 3.5, t, .05);
  v.g.gain.setTargetAtTime(clamp(ds * 9, 0, .1) + Math.min(.035, s * .06), t, .04);
}
function voiceStop(v){
  if (!v || !actx) return;
  const t = actx.currentTime;
  try{ v.g.gain.setTargetAtTime(0, t, .03); v.o.stop(t + .2); v.o2.stop(t + .2); }catch(e){}
}
function tone(t, type, f0, f1, dur, peak, dst){
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dst || master); o.start(t); o.stop(t + dur + .05); return o;
}
function noiseHit(t, dur, type, f, q, peak, dst){
  const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(dst || master); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
}
function sfxStick(x){ if (!live()) return; const t = actx.currentTime, d = out(panOf(x)); noiseHit(t, .05, 'bandpass', 1800, 4, .08, d); tone(t, 'sine', 320, 260, .06, .05, d); }
function sfxBoing(stretch, x){
  if (!live() || stretch < .015) return;
  const t = actx.currentTime, d = out(panOf(x));
  // pitch from how far it was pulled, snapped to the scale; vibrato at the sheet's own wobble
  const i = clamp(Math.round(stretch * 22), 0, SCALE.length - 1), f0 = SCALE[i] * (S.mat === 2 ? .5 : S.mat === 1 ? 1.5 : 1);
  const amp = clamp(stretch * 2.2, .08, .32);
  const dur = S.mat === 1 ? .55 : S.mat === 2 ? 1.6 : 1.1;
  const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(f0 * 1.45, t); o.frequency.exponentialRampToValueAtTime(f0, t + .05); o.frequency.exponentialRampToValueAtTime(f0 * .82, t + dur);
  const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = S.mat === 1 ? 11 : S.mat === 2 ? 3.5 : 6.5;
  lg.gain.setValueAtTime(f0 * .09, t); lg.gain.exponentialRampToValueAtTime(f0 * .005, t + dur);
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(amp, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(d); o.start(t); lfo.start(t); o.stop(t + dur + .05); lfo.stop(t + dur + .05);
  tone(t, 'triangle', f0 * 2.01, f0 * 1.7, dur * .5, amp * .25, d);
  noiseHit(t, .04, 'lowpass', 900, .7, amp * .4, d);
}
function sfxFlick(x, sp){ if (!live()) return; const t = actx.currentTime, d = out(panOf(x)); const a = clamp(sp * .06, .08, .3); tone(t, 'sine', 190, 62, .38, a, d); noiseHit(t, .07, 'bandpass', 700, 1.2, a * .5, d); }
function sfxColor(){ if (!live()) return; const t = actx.currentTime; noiseHit(t, .8, 'bandpass', 3000, 1.5, .05); tone(t, 'sine', 880, 880, .5, .03); tone(t + .07, 'sine', 1318.5, 1318.5, .45, .02); }
function sfxSheet(on){ if (!live()) return; const t = actx.currentTime; noiseHit(t, .5, 'bandpass', on ? 1400 : 2600, .9, .07); if (on) tone(t + .18, 'sine', 110, 70, .7, .18); else tone(t, 'sine', 300, 600, .25, .05); }

/* ---------- mode: plain camera ⇄ the sheet (it drops on and ripples once) ---------- */
const MODE = { fx:false, t:9 };
function setMode(on){
  if (on === MODE.fx) return;
  MODE.fx = on; MODE.t = 0;
  $('mode').textContent = on ? '膜をはずす' : '膜をかける';
  $('mat').style.visibility = $('col').style.visibility = on ? 'visible' : 'hidden';
  if (on){
    settle();
    // the sheet lands: a ring of lift spreading from the middle, and a little sag along the top
    const cx = G.W / 2, cy = G.H * .45;
    for (let k = 0; k < M.n; k++){
      const r = Math.hypot(M.rx[k] - cx, M.ry[k] - cy) / G.short;
      M.vz[k] = 9 * Math.exp(-r * r * 10); M.vy[k] = G.short * .25 * Math.exp(-r * r * 6);
    }
    showHint();
  } else {
    for (const g of [...GRABS]) grabEnd(g.key, true);
    for (const h of HS){ h.pinch = false; h.hold = 0; h.rel = 0; }
  }
  sfxSheet(on);
}
function fxAmount(){ return MODE.fx ? smooth(MODE.t / .5) : 1 - smooth(MODE.t / .45); }
function sweepPos(){ const d = MODE.fx ? .9 : .6; return MODE.t < d ? -.15 + MODE.t / d * 1.7 : -9; }
let hintT = null;
function showHint(){ if (hintSeenOnce) return; $('hint').classList.add('on'); clearTimeout(hintT); hintT = setTimeout(() => $('hint').classList.remove('on'), 7000); }
let hintSeenOnce = false;
function hintSeen(){ hintSeenOnce = true; $('hint').classList.remove('on'); }

/* ---------- UI ---------- */
function setMat(i){
  S.mat = ((i % 3) + 3) % 3;
  const m = MATS[S.mat];
  $('pMat').textContent = m.en; $('mat').textContent = m.en + ' ▸';
  [...$('mats').children].forEach(b => b.classList.toggle('on', +b.dataset.m === S.mat));
}
$('mats').onclick = e => { const b = e.target.closest('button'); if (b) setMat(+b.dataset.m); };
$('mat').onclick = () => setMat(S.mat + 1);
function setCol(i, instant){
  i = ((i % COLS.length) + COLS.length) % COLS.length;
  // a switch mid-wipe starts from whatever is mostly showing
  CW.from = instant ? i : (CW.t > .5 ? CW.to : CW.from); CW.to = i; CW.t = instant ? 1 : 0; S.col = i;
  const c = COLS[i]; $('col').textContent = c.jp + ' ▸'; $('pCol').textContent = c.en;
  [...$('cols').children].forEach(b => b.classList.toggle('on', +b.dataset.c === i));
  if (!instant) sfxColor();
}
$('cols').onclick = e => { const b = e.target.closest('button'); if (b) setCol(+b.dataset.c); };
$('col').onclick = () => setCol(S.col + 1);
$('tFreeze').onclick = e => { S.freeze = !S.freeze; e.target.classList.toggle('on', S.freeze); };
$('tDots').onclick = e => { S.dots = !S.dots; e.target.classList.toggle('on', S.dots); };
[['sSoft', 'soft'], ['sWob', 'wob'], ['sRad', 'rad'], ['sGloss', 'gloss'], ['sIri', 'iri'], ['sVol', 'vol']]
  .forEach(([id, k]) => { $(id).oninput = e => { S[k] = +e.target.value; if (k === 'vol' && master) master.gain.value = S.vol; }; });
$('mode').onclick = () => setMode(!MODE.fx);
$('gear').onclick = () => $('panel').classList.toggle('hide');
addEventListener('keydown', e => {
  if (!started || document.activeElement.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); setMode(!MODE.fx); }
  else if (e.key === 'm') setMat(S.mat + 1);
  else if (e.key === 'c') setCol(S.col + 1);
});
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try { await startCam(); } catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear', 'flip', 'bar', 'rec', 'shoot', 'mat', 'col', 'mode', 'brand'].forEach(id => $(id).classList.add('show'));
  if (!MODE.fx) $('mat').style.visibility = $('col').style.visibility = 'hidden';
  if (!started){ started = true; if (!glOK) initGL(); if (glErr) setStatus(glErr); resize(); initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
// a finger or the mouse can pinch too
const PTRS = new Map();
function ptrXY(e){ const r = view.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * G.W, (e.clientY - r.top) / r.height * G.H]; }
view.addEventListener('pointerdown', e => {
  if (!$('panel').classList.contains('hide')){ $('panel').classList.add('hide'); return; }
  if (!MODE.fx) return;
  const [x, y] = ptrXY(e); try{ view.setPointerCapture(e.pointerId); }catch(_){}
  PTRS.set(e.pointerId, true); grabStart('p' + e.pointerId, x, y);
});
view.addEventListener('pointermove', e => { if (PTRS.has(e.pointerId)){ const [x, y] = ptrXY(e); grabMove('p' + e.pointerId, x, y); } });
const ptrUp = e => { if (PTRS.delete(e.pointerId)) grabEnd('p' + e.pointerId); };
view.addEventListener('pointerup', ptrUp); view.addEventListener('pointercancel', ptrUp);
let wantShot = false;
$('shoot').onclick = () => { wantShot = true; };
function doShot(){
  try{ view.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'tsumamu-' + Date.now() + '.png'; a.click(); }, 'image/png'); }
  catch(e){ setStatus('保存できませんでした。'); }
}
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...view.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● 録画';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'tsumamu.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ 停止';
  }catch(e){ setStatus('録画を開始できませんでした。' + (e && e.message ? '\n' + e.message : '')); }
};
addEventListener('resize', () => { if (started) resize(); });
let idleAt = performance.now();
const wake = () => { idleAt = performance.now(); document.body.classList.remove('idle'); };
['pointermove', 'pointerdown', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive:true }));

/* ---------- frame ---------- */
let lastT = 0, frameN = 0, clock = 0;
const PROBE = { want:null, out:null };
function render(){
  if (video.readyState >= 2 && !S.freeze){ gl.bindTexture(gl.TEXTURE_2D, texCam); try{ gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); }catch(e){} }
  packVerts();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, G.W, G.H);
  gl.clearColor(.04, .04, .045, 1); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  const pr = PR, m = MATS[S.mat], fx = fxAmount();
  gl.useProgram(pr.p); gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufV); gl.bufferSubData(gl.ARRAY_BUFFER, 0, VBUF);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texCam); gl.uniform1i(pr.u.uCam, 0);
  gl.uniform2f(pr.u.uRes, G.W, G.H); gl.uniform1f(pr.u.uFx, fx); gl.uniform1f(pr.u.uSpec, m.spec); gl.uniform1f(pr.u.uShin, m.shin);
  gl.uniform1f(pr.u.uIri, m.iri * S.iri); gl.uniform1f(pr.u.uDark, m.dark); gl.uniform1f(pr.u.uAmber, m.amber); gl.uniform3fv(pr.u.uTint, m.tint);
  const ca = COLS[CW.from], cb = COLS[CW.to];
  PAL.set(ca.d, 0); PAL.set(ca.m, 3); PAL.set(ca.l, 6); PAL.set(cb.d, 9); PAL.set(cb.m, 12); PAL.set(cb.l, 15);
  PALK[0] = ca.k; PALK[1] = ca.on * fx; PALK[2] = cb.k; PALK[3] = cb.on * fx;
  gl.uniform3fv(pr.u['uPal[0]'], PAL); gl.uniform4fv(pr.u.uPalK, PALK); gl.uniform1f(pr.u.uGT, smooth(CW.t));
  gl.uniform1f(pr.u.uSweep, sweepPos()); gl.uniform1f(pr.u.uGloss, S.gloss); gl.uniform1f(pr.u.uTime, clock);
  gl.drawElements(gl.TRIANGLES, IDX.length, IDX instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0);
  gl.disable(gl.DEPTH_TEST);
  if (PROBE.want){
    const px = new Uint8Array(4); PROBE.out = PROBE.want.map(([x, y]) => { gl.readPixels(Math.round(x), Math.round(G.H - 1 - y), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return [px[0], px[1], px[2]]; });
    PROBE.want = null;
  }
  // fingertip marks: two small dots per hand, a ring where a pinch holds
  let n = 0;
  if (MODE.fx && S.dots){
    const sz = Math.max(8, G.short * .022);
    for (const h of HS){
      if (!h.on || n > 20) continue;
      if (h.pinch){ PTS.set([h.mid[0], h.mid[1], sz * 2.6, .9], n * 4); n++; }
      else { PTS.set([h.tip[0], h.tip[1], -sz, .75], n * 4); n++; PTS.set([h.thumb[0], h.thumb[1], -sz, .75], n * 4); n++; }
    }
    for (const g of GRABS) if (g.key[0] === 'p' && n < 22){ PTS.set([g.p[0], g.p[1], sz * 2.6, .8], n * 4); n++; }
  }
  if (n){
    gl.useProgram(PP.p); gl.bindVertexArray(vaoP);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufP); gl.bufferSubData(gl.ARRAY_BUFFER, 0, PTS.subarray(0, n * 4));
    gl.uniform2f(PP.u.uRes, G.W, G.H); gl.uniform3f(PP.u.uCol, 1, 1, 1);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.POINTS, 0, n);

}
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  const rdt = lastT ? clamp((now - lastT) / 1000, 0, .1) : 0; lastT = now; clock += rdt; frameN++;
  detect(now);
  for (const h of HS) if (h.on && now - h.seen > 400) loseHand(h);
  MODE.t += rdt; CW.t = Math.min(1, CW.t + rdt / .9);
  applyGrabs();
  for (const g of GRABS) voiceTick(g);
  if (MODE.fx || MODE.t < 1) simulate(rdt); else if (M.n && M.dx[(M.ny >> 1) * M.nx + (M.nx >> 1)] !== 0) settle();
  if (MODE.fx && MODE.t > 3 && now - idleAt > 3500 && $('panel').classList.contains('hide') && !(rec && rec.state === 'recording')) document.body.classList.add('idle');
  if (!glOK) return;
  render();
  if (wantShot){ wantShot = false; doShot(); }
}

/* ---------- start-screen emblem: a grid with one point pinched and pulled ---------- */
(function emblem(){
  const c = $('emblem').getContext('2d'), S0 = $('emblem').width, N = 14, px = .62, py = .4, qx = .74, qy = .26;
  c.clearRect(0, 0, S0, S0);
  const P = (i, j) => {
    const x = i / N, y = j / N, d2 = (x - px) ** 2 + (y - py) ** 2, w = Math.exp(-d2 / .045) * (x > 0 && x < 1 && y > 0 && y < 1 ? 1 : 0);
    return [(x + (qx - px) * w) * S0 * .84 + S0 * .08, (y + (qy - py) * w) * S0 * .84 + S0 * .08, w];
  };
  c.lineWidth = 1.4;
  for (let j = 0; j <= N; j++){ c.beginPath(); for (let i = 0; i <= N; i++){ const p = P(i, j); c.strokeStyle = 'rgba(242,239,233,.55)'; i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } c.stroke(); }
  for (let i = 0; i <= N; i++){ c.beginPath(); for (let j = 0; j <= N; j++){ const p = P(i, j); j ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } c.stroke(); }
  const t = [(qx) * S0 * .84 + S0 * .08, qy * S0 * .84 + S0 * .08];
  c.strokeStyle = '#ff6a4d'; c.lineWidth = 3; c.beginPath(); c.arc(t[0], t[1], S0 * .045, 0, 7); c.stroke();
})();
setMat(0); setCol(0, true);

/* ---------- test hook ---------- */
window.__tsumamu = {
  feedHands(list, t){ EXT.hands = true; if (modelState !== 'ready') setStatus(''); ingestHands(list, t == null ? performance.now() : t); },
  setMode, setMat, setCol, CW, S, MODE, M, G, GRABS, HS,
  grab:grabStart, move:grabMove, release:k => grabEnd(k),
  probe(p){ PROBE.want = p; PROBE.out = null; }, probed(){ return PROBE.out; },
  toScreen(x, y){ const o = [0, 0]; toScreen(x, y, o, 0); return o; },
  // displacement of the vertex nearest a screen point
  dispAt(x, y){ let b = -1, bd = 1e18; for (let k = 0; k < M.n; k++){ const d = (M.rx[k] - x) ** 2 + (M.ry[k] - y) ** 2; if (d < bd){ bd = d; b = k; } }
    return b < 0 ? null : [M.dx[b], M.dy[b], M.dz[b]]; },
  state(){ let mx = 0, fin_ = true; for (let k = 0; k < M.n; k++){ const v = Math.hypot(M.dx[k], M.dy[k]); if (v > mx) mx = v; if (!fin(v) || !fin(M.dz[k])) fin_ = false; }
    return { frame:frameN, fx:MODE.fx, modeT:MODE.t, glOK, glErr, model:modelState, grabs:GRABS.map(g => ({ key:g.key, n:g.idx.length, stretch:+g.stretch.toFixed(3) })),
      hands:HS.map(h => ({ on:h.on, pinch:h.pinch })), maxDisp:mx / G.short, finite:fin_, n:M.n }; },
};
