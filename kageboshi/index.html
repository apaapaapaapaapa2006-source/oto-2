<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<meta name="description" content="部屋の明かりが落ち、横から一灯だけの光があなたを照らして、壁に大きな影が落ちる。その影は一秒ほど遅れてあなたを追いかけてくる。タップすると影をその場に置いていける。">

<title>KAGEBOSHI ─ 遅れてついてくる、あなたの影</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  KAGEBOSHI 影法師 ─ 遅れてついてくる、あなたの影        ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       夜の部屋で、横に置いた裸電球だけが点いている映画のワンカット。
             映った人は片側から照らされ、うしろの壁に大きな影が落ちる。
             ただしその影はほんの少し遅れていて、首をかしげれば一拍おいて影が
             かしげ、止まれば影があとから追いついてくる。タップすると影は
             その姿勢のまま壁に残り、もう一度タップするとゆっくり戻ってくる。
  PALETTE    TUNGSTEN  光 #ffcf94（電球）・影 #120c0a・壁の闇 #0d0a08
             MOON      光 #bcd2ff（窓の月明かり）・影 #05070c
             NOIR      モノクロの硬調・影 #050505
  TYPE       Bodoni Moda 400 の斜体（題字）＋ Red Hat Mono 300（計器）。
  MOTION     影の遅れは既定 0.9 秒（0.3〜2 秒）。影は光源から 1.47 倍に広がって、光と反対の側へ大きく落ちる。
             置いた影は、戻すと 0.8 秒かけていまの影に溶けて戻る。
  SIGNATURE  自分より遅れて動く、自分の影。
  SWITCH     はじめは素のカメラ。「▸ KAGEBOSHI」で部屋が暗転し、カチッと電球が点いて
             壁に影が浮かび上がる。「◂ CAMERA」で電球が消えて元の部屋に戻る。
  TECH       WebGL2。人物マスクを時刻つきで 64 枚のテクスチャ配列に貯め、
             「いま − 遅れ」にいちばん近い一枚を影として、光源から拡大して壁に落とす。
             裸電球の硬い影なので縁は少しだけぼかし、人の上には落とさない。
  ══════════════════════════════════════════════════════════════════════════
-->

  <p>まずは、いつものカメラ。<br>ボタンを押すと明かりが落ちて、壁にあなたの影が落ちる。<br>その影は、少し遅れてついてくる。</p>

<script>
'use strict';
/* =====================================================================
   KAGEBOSHI — a lagging shadow. Person masks are kept with timestamps in
   a 64-layer texture array; the shader takes the layer nearest to
   (now − delay), projects it from a lamp beside the person onto the wall
   (scaled up, pushed away from the lamp), softens it with 9 taps and
   darkens only the wall with it. The person is re-lit from the lamp side.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl');
const video = document.createElement('video'); video.playsInline = true; video.muted = true; video.autoplay = true;

const PALS = [
  { name:'TUNGSTEN', light:[1,.80,.58], dark:[.05,.035,.03], shadow:[.07,.045,.035], mono:0 },
  { name:'MOON',     light:[.74,.83,1],  dark:[.02,.03,.05],  shadow:[.02,.028,.05],  mono:0 },
  { name:'NOIR',     light:[1,1,1],      dark:[.02,.02,.02],  shadow:[.02,.02,.02],   mono:1 },
];
const S = { pal:0, side:-1, delay:.35, size:.45, dark:.6 };
const NL = 64;                                          // remembered masks

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
precision highp sampler2DArray;
uniform sampler2D uVid;
uniform sampler2DArray uMasks;
uniform vec2 uRes, uScale, uLamp, uBlur;
uniform float uMirror, uE, uLampOn, uLayer, uHeld, uHeldLayer, uHeldMix, uHasMask, uCur, uScaleS, uDark, uT, uMono, uShadowOn;
uniform vec3 uLight, uDarkC, uShadowC;
out vec4 o;
float h2(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
vec2 vuv(vec2 s){ vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
float maskAt(vec2 s, float layer){
  if (uHasMask < .5) return 0.;
  vec2 v = vuv(s);
  if (v.x < 0. || v.x > 1. || v.y < 0. || v.y > 1.) return 0.;
  return texture(uMasks, vec3(v, layer)).r;
}
float softShadow(vec2 s, float layer){
  float acc = 0.;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) acc += maskAt(s + vec2(float(i), float(j)) * uBlur, layer);
  return acc / 9.;
}
void main(){
  vec2 s = gl_FragCoord.xy / uRes; s.y = 1. - s.y;
  vec3 cam = texture(uVid, vuv(s)).rgb;
  // the person's own mask, softened a little so the cut edge does not show
  float me = 0.;
  if (uHasMask > .5){ float a = 0.; for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) a += maskAt(s + vec2(float(i), float(j)) * uBlur * 1.7, uCur); me = smoothstep(.5, .85, a / 9.); }
  // the lamp: light falls off with distance from it, in aspect-correct units
  vec2 q = (s - uLamp) * vec2(uRes.x / uRes.y, 1.);
  float fall = 1. / (1. + 2.2 * dot(q, q));
  float l = dot(cam, vec3(.299,.587,.114));
  vec3 base = uMono > .5 ? vec3(l) : cam;
  // one light for the whole room: the lamp's pool, falling to dark
  float pool = clamp(fall * (1.25 - uDark * .6), 0., 1.);
  vec3 wall = mix(uDarkC, base * uLight * 1.2, pool);
  // the person: a strong key from the lamp side, a darker fill side, a touch more contrast
  float toward = (uLamp.x < .5 ? -1. : 1.) * (s.x - .5);       // > 0 on the lamp's side of the frame
  float side = clamp(1. + toward * 1.4, .62, 1.3);
  // the person stands nearer the lamp than the wall, so the same light reaches them stronger
  vec3 body = mix(uDarkC, base * mix(vec3(1.), uLight, .55) * 1.1, clamp(pool * 1.1 + .42, 0., 1.)) * side;
  body = clamp((body - .5) * 1.15 + .5, 0., 1.);
  // the shadow: the mask from a moment ago, projected away from the lamp onto the wall
  vec2 sp = uLamp + (s - uLamp) / uScaleS;
  float sh = softShadow(sp, uLayer);
  if (uHeld > .5) sh = mix(softShadow(sp, uHeldLayer), sh, uHeldMix);
  sh *= uShadowOn;
  wall = mix(wall, uShadowC, smoothstep(.15, .7, sh) * .92);
  vec3 c = mix(wall, body, me);
  c += (h2(gl_FragCoord.xy + fract(uT) * 77.) - .5) * .03;
  vec2 v = s - .5; v.x *= uRes.x / uRes.y;
  c *= 1. - .35 * smoothstep(.45, 1.1, length(v));
  c = mix(vec3(0.), c, uLampOn);
  o = vec4(mix(cam, c, uE), 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
let P = null, vao, texVid, texMasks, masksKey = '';
function initGL(){
  P = prog(VS, FS);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  texVid = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texVid);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  texMasks = gl.createTexture();
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
}
function ensureMasks(w, h){
  const key = w + 'x' + h; if (key === masksKey) return; masksKey = key;
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texMasks);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.R8, w, h, NL, 0, gl.RED, gl.UNSIGNED_BYTE, null);
  RING.t.fill(-1); RING.next = 0; RING.cur = -1;
}

/* ---------- the mask history ---------- */
const RING = { t:new Float64Array(NL).fill(-1), next:0, cur:-1 };
const M = { w:0, h:0, b:null, has:false, live:false, external:false, lastT:0 };
function ingestMask(data, w, h, now){
  if (!data || !(w > 0) || !(h > 0) || !(w * h <= 4e6) || data.length < w * h) return false;
  now = now == null ? performance.now() : now;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.b = new Uint8Array(w * h); }
  for (let i = 0, n = w * h; i < n; i++){ let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1; M.b[i] = m * 255; }
  M.has = true; M.live = true; M.lastT = now;
  if (!P) return true;
  ensureMasks(w, h);
  // keep at most one mask per 40 ms, so 64 layers cover more than two seconds
  if (RING.cur >= 0 && now - RING.t[RING.cur] < 40){
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texMasks);
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, RING.cur, w, h, 1, gl.RED, gl.UNSIGNED_BYTE, M.b);
    return true;
  }
  let L = RING.next;
  if (HELD.on && L === HELD.layer) L = (L + 1) % NL;          // never overwrite the shadow left on the wall
  RING.next = (L + 1) % NL;
  return ingestLayer(L, w, h, now);
}
function ingestLayer(L, w, h, now){
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texMasks);
  gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, L, w, h, 1, gl.RED, gl.UNSIGNED_BYTE, M.b);
  RING.t[L] = now; RING.cur = L;
  return true;
}
// the layer whose time is nearest to (now − delay); never newer than now
function delayedLayer(now, delay){
  let best = -1, bd = 1e12; const want = now - delay;
  for (let i = 0; i < NL; i++){ const t = RING.t[i]; if (t < 0 || (i === HELD.layer && HELD.on)) continue; const d = Math.abs(t - want); if (d < bd){ bd = d; best = i; } }
  return best;
}
const HELD = { on:false, layer:-1, mix:1, back:-1 };

/* ---------- model ---------- */
let segmenter = null, lastTs = 0, lastSegVT = -1;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    setStatus('');
  }catch(e){
    if (M.external) return;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n影は出せませんが、電球の明かりは続けます。');
  }
}
function segment(now){
  if (!segmenter || M.external || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastSegVT) return; lastSegVT = vt;
  try{
    const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks; if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1]; ingestMask(mk.getAsFloat32Array(), mk.width, mk.height, now);
    });
  }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720, lastVT = -1;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  RING.t.fill(-1); RING.cur = -1; HELD.on = false;
}

/* ---------- audio: the lamp's click and hum ---------- */
let actx = null, bus = null, recDest = null, hum = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .6; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  hum = actx.createGain(); hum.gain.value = 0; hum.connect(bus);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500; lp.connect(hum);
  [50, 100, 150].forEach((f, i) => { const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f; const g = actx.createGain(); g.gain.value = [.5, .3, .1][i]; o.connect(g); g.connect(lp); o.start(); });
  actx.resume().catch(()=>{});
}
function click(vol){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, n = actx.sampleRate * .04 | 0, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / n * 9);
  const s = actx.createBufferSource(); s.buffer = b; const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 2;
  const g = actx.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(bus); s.start(t);
}

// the switch: plain camera (X = 0) ⇄ lamp-lit room (X = 1.6)
const MODE = { on:false, X:0 };
function setMode(on){
  if (on === MODE.on) return;
  MODE.on = on;
  $('mode').textContent = on ? '◂ CAMERA' : '▸ KAGEBOSHI';
  $('hold').style.visibility = on ? 'visible' : 'hidden';
  if (!on){ HELD.on = false; $('hold').classList.remove('on'); $('hold').textContent = '影を置く'; click(.4); }
  if (hum && actx) hum.gain.setTargetAtTime(on ? .035 : 0, actx.currentTime + (on ? .45 : 0), .2);
}
$('mode').onclick = () => setMode(!MODE.on);
addEventListener('keydown', e => { if (started && (e.key === ' ' || e.key === 'Enter') && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); setMode(!MODE.on); } });
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!P) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','hold','hud','mode'].forEach(id => $(id).classList.add('show'));
  MODE.on = true; setMode(false);
  if (!started){ started = true; initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
// leave the shadow on the wall / call it back
function toggleHold(){
  if (!MODE.on || MODE.X < 1.6) return;
  if (!HELD.on){
    const L = delayedLayer(performance.now(), delayMs()); if (L < 0) return;
    HELD.on = true; HELD.layer = L; HELD.mix = 0;
    $('hold').classList.add('on'); $('hold').textContent = '影を戻す'; click(.25);
  } else { HELD.on = false; HELD.mix = 0; HELD.back = HELD.layer; $('hold').classList.remove('on'); $('hold').textContent = '影を置く'; click(.18); }
}
$('hold').onclick = toggleHold;
canvas.addEventListener('pointerdown', () => { if (started) toggleHold(); });
$('pals').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.pal = +b.dataset.p; [...$('pals').children].forEach(x => x.classList.toggle('on', x === b)); };
$('sides').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.side = +b.dataset.s; [...$('sides').children].forEach(x => x.classList.toggle('on', x === b)); };
[['sDelay','delay'],['sSize','size'],['sDark','dark']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });
const delayMs = () => 300 + 1700 * S.delay;

$('shoot').onclick = () => {
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'kageboshi-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'kageboshi.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
let lastT = 0, hudT = 0, clicked = false;
const STATE = { layer:-1, lagMs:0, lampOn:0, shadowOn:0 };
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1600 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  segment(now);
  if (M.live && now - M.lastT > 1200) M.live = false;
  if (video.readyState < 2) return;
  const vt = video.currentTime, fresh = vt !== lastVT; lastVT = vt;
  if (fresh){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }
  if (!masksKey) ensureMasks(1, 1);

  // the switch: the room goes dark (0 → .35), the lamp clicks on (.55), the shadow fades onto the wall
  MODE.X = MODE.on ? Math.min(1.6, MODE.X + dt) : Math.max(0, MODE.X - dt * 2.4);
  const E = Math.min(1, MODE.X / .35);
  const lampOn = MODE.on ? (MODE.X < .55 ? .12 : Math.min(1, .12 + (MODE.X - .55) * 6)) : Math.min(1, MODE.X);
  if (MODE.on && MODE.X >= .55 && !clicked){ clicked = true; click(.5); }
  if (!MODE.on) clicked = false;
  const shadowOn = Math.max(0, Math.min(1, (MODE.X - .7) / .8));
  HELD.mix = Math.min(1, HELD.mix + dt / .8);

  const layer = delayedLayer(now, delayMs());
  STATE.layer = layer; STATE.lagMs = layer >= 0 ? now - RING.t[layer] : 0; STATE.lampOn = lampOn; STATE.shadowOn = shadowOn;
  const p = PALS[S.pal];
  const lamp = S.side < 0 ? [.02, .34] : [.98, .34];
  gl.viewport(0, 0, W, H); gl.useProgram(P.p); gl.bindVertexArray(vao);
  const U = P.U;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texMasks);
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMasks, 1);
  const sa = W/H, va = vidW/vidH;
  gl.uniform2f(U.uRes, W, H); gl.uniform2f(U.uScale, sa < va ? sa/va : 1, sa < va ? 1 : va/sa);
  gl.uniform2f(U.uLamp, lamp[0], lamp[1]);
  const blurPx = Math.min(W, H) * .0045; gl.uniform2f(U.uBlur, blurPx / W, blurPx / H);
  const live = M.has && M.live;
  gl.uniform1f(U.uHasMask, live && RING.cur >= 0 ? 1 : 0);
  gl.uniform1f(U.uCur, RING.cur < 0 ? 0 : RING.cur);
  gl.uniform1f(U.uLayer, layer < 0 ? 0 : layer);
  const heldShown = HELD.on || HELD.mix < 1;
  gl.uniform1f(U.uHeld, heldShown && (HELD.on ? HELD.layer : HELD.back) >= 0 ? 1 : 0);
  gl.uniform1f(U.uHeldLayer, HELD.on ? HELD.layer : (HELD.back >= 0 ? HELD.back : 0));
  gl.uniform1f(U.uHeldMix, HELD.on ? 0 : HELD.mix);
  gl.uniform1f(U.uScaleS, 1.2 + .6 * S.size); gl.uniform1f(U.uDark, S.dark);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uE, E); gl.uniform1f(U.uLampOn, lampOn); gl.uniform1f(U.uT, now / 1000);
  gl.uniform1f(U.uMono, p.mono); gl.uniform1f(U.uShadowOn, shadowOn * (layer >= 0 ? 1 : 0));
  gl.uniform3fv(U.uLight, p.light); gl.uniform3fv(U.uDarkC, p.dark); gl.uniform3fv(U.uShadowC, p.shadow);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  $('hud').style.visibility = MODE.X >= 1.6 ? 'visible' : 'hidden';
  hudT += dt;
  if (hudT > .3){ hudT = 0;
    $('hud').textContent = 'KAGEBOSHI  ' + p.name + '\nLAG ' + (STATE.lagMs / 1000).toFixed(2) + ' s' + (HELD.on ? '\nSHADOW LEFT ON THE WALL' : ''); }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__KAGEBOSHI = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; return ingestMask(d, w, h); },
  state: () => ({ ...STATE, held:HELD.on, maskLive:M.live, stored:RING.t.filter(t => t >= 0).length }),
  palette(i){ S.pal = i; },
  mode(c){ setMode(!!c); },
  tap(){ toggleHold(); },
  view: () => ({ on:MODE.on, X:MODE.X }),
};
</script>
</body>
