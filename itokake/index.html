<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人が、円く打った二百本の釘のあいだに何千本もの糸を張った糸かけの肖像になる。動いたところの糸は金色に弾けて切れ、止まれば張り直されて顔に戻る。">
<meta name="theme-color" content="#0d0c0b">
<title>ITOKAKE ─ 糸で張られた肖像</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  ITOKAKE 糸かけ ─ 糸で張られた肖像                    ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       暗い展示室に掛かった一枚のストリングアート。円く打った真鍮の釘の
             あいだに、生糸の白が何千本も弦のように張られ、その重なりの濃淡だけで
             顔が浮かぶ。近づけばただの直線の束、離れれば肖像。動いたところを通る
             糸は金に弾けて切れ、釘へ跳ね戻る。止まっていれば糸は一本ずつ張り直され、
             また顔に織り上がる。
  PALETTE    URUSHI  地 黒漆 #0d0c0b・糸 生糸の白 #efe9dc・切れた糸 金 #d7a640（明るい所に白糸を張る）
             KINARI  地 生成り #ece6da・糸 墨 #1b1714・釘 真鍮・切れた糸 朱 #d2401f（暗い所に黒糸を張る）
             AI      地 藍 #14213a・糸 白 #eef0f2・切れた糸 朱 #e0482a
  TYPE       Castoro（見出し・細身のセリフ）＋ Inconsolata（計器）。
  MOTION     糸は常に入れ替わり、数秒で全体が張り直される（肖像はかすかに呼吸する）。
             動きが糸の上を通ると、その糸は切れて 0.6 秒で両端の釘へ縮む。
             タップした点のまわりの糸はまとめて弾ける。切れた糸は一本ずつ弦の音で鳴り、
             短い糸ほど高い。
  SIGNATURE  直線しか無いのに顔に見えること。そして動けば糸が切れること。
  SWITCH     はじめは素のカメラ。「▸ ITOKAKE」で黒漆の板と釘の輪が現れ、
             何も無い板に糸が一本ずつ高速で張られて肖像が編み上がる。
             「◂ CAMERA」で糸がいっせいに切れて、カメラに戻る。
  TECH       128×128 の濃さの目標を毎フレーム作り（人物マスクで背景を白へ、
             マスク内でだけ濃淡を伸ばし、輪郭を少し足す）、そこから張った糸の
             濃さを引いた残差の上で、いまの釘から全釘への弦を総当たりで採点して
             いちばん暗い弦を張る（貪欲法）。弦ごとの標本は起動時に一度だけ
             Uint16 の表に焼いてある。描画は WebGL の細い四角形。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

  font-family:"Castoro","Hiragino Mincho ProN","Noto Serif JP",serif;transition:background .4s,color .4s}

  font:400 11px "Inconsolata",monospace;letter-spacing:.42em;padding:13px 22px 13px 28px;cursor:pointer;

<body>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ ITOKAKE</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="pluck" class="btn">PLUCK</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">URUSHI</button>
    <button data-p="1">KINARI</button>
    <button data-p="2">AI</button>
  </div>
  <label><span>糸の本数</span><input type="range" id="sCount" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>糸の濃さ</span><input type="range" id="sDark" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>切れやすさ</span><input type="range" id="sSens" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>張り直す速さ</span><input type="range" id="sRenew" min="0" max="1" step="0.01" value="0.5"></label>
  <div class="note">動いたところの糸が切れ、止まれば張り直される。<br>PLUCK か画面タップで、その点の糸をまとめて弾く。</div>
</div>

<div id="start">
  <div class="t">STRING · PORTRAIT</div>
  <svg viewBox="0 0 132 132" aria-hidden="true" fill="none" stroke="currentColor">
    <circle cx="66" cy="66" r="62" stroke-width=".5" opacity=".5"/>
    <g stroke-width=".35" opacity=".75">
      <path d="M66 4 L20 108 M66 4 L112 108 M8 50 L124 82 M8 82 L124 50 M30 16 L102 116 M102 16 L30 116 M44 8 L60 128 M88 8 L72 128 M4 66 L128 66 M14 34 L118 98 M14 98 L118 34 M54 6 L96 124 M78 6 L36 124"/>
    </g>
    <path d="M18 30 L116 92" stroke="#d7a640" stroke-width=".7"/>
  </svg>
  <h1>ITO<i>KAKE</i></h1>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、あなたは糸で張られた肖像になる。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   ITOKAKE — real-time string art. N pins on a circle; every chord's grid
   samples are baked once into a Uint16 table. Each frame the camera gives
   a 128×128 darkness target D; C is the darkness the current threads
   already lay down; R = D − C. A greedy shuttle walks pin to pin, always
   taking the chord with the darkest mean residual. Threads are renewed
   FIFO so the portrait follows the person; threads crossed by motion
   snap (removed at once, drawn recoiling to their pins) and get rewoven.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

const PALS = [
  { name:'URUSHI', paper:[.051,.047,.043], thread:[.937,.914,.863], snap:[.84,.65,.25], brass:[.55,.45,.28], dark:1, css:['#0d0c0b','#efe9dc','#d7a640'] },
  { name:'KINARI', paper:[.925,.902,.855], thread:[.105,.09,.078], snap:[.82,.25,.12], brass:[.62,.48,.25], dark:0, css:['#ece6da','#1b1714','#d2401f'] },
  { name:'AI',     paper:[.078,.13,.227],  thread:[.933,.94,.95],   snap:[.88,.28,.16], brass:[.6,.58,.55],  dark:1, css:['#14213a','#eef0f2','#e0482a'] },
];
const S = { pal:0, count:.55, dark:.5, sens:.55, renew:.5 };

/* ---------- pins and chords (grid space, baked once) ---------- */
const N = 200, G = 128, MINGAP = 14;
const NAIL = new Float32Array(N * 2);
const PO = new Int32Array(N * N), PL = new Uint16Array(N * N);
let LS = null;
const INC = new Uint8Array(G * G);                       // cells inside the circle
function gapOf(i, j){ const d = i > j ? i - j : j - i; return d < N - d ? d : N - d; }
(function bake(){
  const c = G / 2, r = G / 2 - .6;
  for (let k = 0; k < N; k++){ const a = -Math.PI / 2 + 2 * Math.PI * k / N; NAIL[k * 2] = c + r * Math.cos(a); NAIL[k * 2 + 1] = c + r * Math.sin(a); }
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++){ const dx = x + .5 - c, dy = y + .5 - c; INC[y * G + x] = dx * dx + dy * dy < (c - .3) * (c - .3) ? 1 : 0; }
  let total = 0;
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++){
    if (gapOf(i, j) < MINGAP) continue;
    total += Math.max(2, Math.ceil(Math.hypot(NAIL[j * 2] - NAIL[i * 2], NAIL[j * 2 + 1] - NAIL[i * 2 + 1])));
  }
  LS = new Uint16Array(total);
  let o = 0;
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++){
    if (gapOf(i, j) < MINGAP) continue;
    const x0 = NAIL[i * 2], y0 = NAIL[i * 2 + 1], x1 = NAIL[j * 2], y1 = NAIL[j * 2 + 1];
    const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
    PO[i * N + j] = PO[j * N + i] = o; PL[i * N + j] = PL[j * N + i] = n;
    for (let k = 0; k < n; k++){
      const t = (k + .5) / n, x = Math.min(G - 1, Math.max(0, x0 + (x1 - x0) * t | 0)), y = Math.min(G - 1, Math.max(0, y0 + (y1 - y0) * t | 0));
      LS[o++] = y * G + x;
    }
  }
})();

/* ---------- target, coverage, residual ---------- */
const L = new Float32Array(G * G), Lp = new Float32Array(G * G), D = new Float32Array(G * G), C = new Float32Array(G * G), R = new Float32Array(G * G);
const MO = new Float32Array(G * G), MK = new Float32Array(G * G);
const HIST = new Uint32Array(64);
let haveL = false, wThread = .04;

/* ---------- threads: a FIFO ring; snapped ones are marked dead in place ---------- */
const CAP = 4096;
const TA = new Uint8Array(CAP), TB = new Uint8Array(CAP), TL = new Uint8Array(CAP), TT = new Float32Array(CAP), TW = new Float32Array(CAP);
let head = 0, tail = 0, used = 0, alive = 0, cur = 0, prevNail = -1, chainLeft = 60;
function addThread(a, b, now){
  if (used >= CAP) retireOne();
  const k = head; head = (head + 1) % CAP; used++;
  TA[k] = a; TB[k] = b; TL[k] = 1; TT[k] = now; TW[k] = wThread; alive++;
  const p = a * N + b, o = PO[p], e = o + PL[p], w = wThread;
  for (let i = o; i < e; i++){ const c = LS[i]; C[c] += w; R[c] -= w; }
}
function killThread(k){
  if (!TL[k]) return;
  TL[k] = 0; alive--;
  const p = TA[k] * N + TB[k], o = PO[p], e = o + PL[p], w = TW[k];          // exactly what it laid down
  for (let i = o; i < e; i++){ const c = LS[i]; C[c] -= w; R[c] += w; }
}
function retireOne(){
  if (!used) return;
  killThread(tail); tail = (tail + 1) % CAP; used--;
}
function clearThreads(){ while (used) retireOne(); C.fill(0); alive = 0; }
// the shuttle: from pin `cur`, the chord with the darkest mean residual
function bestFrom(a){
  let best = -1e9, bj = -1;
  const base = a * N;
  for (let j = 0; j < N; j++){
    if (j === prevNail || gapOf(a, j) < MINGAP) continue;
    const o = PO[base + j], n = PL[base + j];
    let s = 0;
    for (let i = o, e = o + n; i < e; i++) s += R[LS[i]];
    s /= n;
    if (s > best){ best = s; bj = j; }
  }
  BEST.j = bj; BEST.s = best;
}
const BEST = { j:-1, s:0 };
function weave(now, maxSteps, budget, tcap){
  const t0 = performance.now();
  let n = 0;
  while (n < maxSteps && alive < budget){
    if (--chainLeft <= 0){ cur = (Math.random() * N) | 0; prevNail = -1; chainLeft = 40 + (Math.random() * 40 | 0); }
    bestFrom(cur);
    if (BEST.j < 0 || BEST.s < .015){ cur = (Math.random() * N) | 0; prevNail = -1; if (BEST.s < .015 && n > 4) break; n++; continue; }
    addThread(cur, BEST.j, now); prevNail = cur; cur = BEST.j; n++;
    if ((n & 7) === 0 && performance.now() - t0 > tcap) break;
  }
  STATS.woven += n;
}

/* ---------- snaps: the two halves of a cut thread spring back to their pins ---------- */
const SNAP_MAX = 520;
const SN = { a:new Uint8Array(SNAP_MAX), b:new Uint8Array(SNAP_MAX), t:new Float32Array(SNAP_MAX), u:new Float32Array(SNAP_MAX), live:new Uint8Array(SNAP_MAX), next:0 };
function addSnap(a, b, u, now){
  const k = SN.next; SN.next = (SN.next + 1) % SNAP_MAX;
  SN.a[k] = a; SN.b[k] = b; SN.u[k] = Math.min(.95, Math.max(.05, u)); SN.t[k] = now; SN.live[k] = 1;
}
let lastPluck = 0, snapScan = 0;
function snapThread(k, u, now){
  addSnap(TA[k], TB[k], u, now);
  const len = PL[TA[k] * N + TB[k]];
  killThread(k); STATS.snapped++;
  if (now - lastPluck > 38){ lastPluck = now; pluck(len); }
}
// threads whose chord runs through motion are cut where the motion is strongest
function snapByMotion(now){
  const sens = .07 - .045 * S.sens;                      // mean motion along a chord that cuts it
  let cut = 0;
  for (let q = 0, k = (tail + snapScan) % CAP; q < used && cut < 26; q++, k = (k + 1) % CAP){
    if (!TL[k]) continue;
    const p = TA[k] * N + TB[k], o = PO[p], n = PL[p];
    let s = 0, mx = 0, mi = 0;
    for (let i = 0; i < n; i++){ const m = MO[LS[o + i]]; s += m; if (m > mx){ mx = m; mi = i; } }
    if (s / n > sens && mx > .14){ snapThread(k, (mi + .5) / n, now); cut++; }
  }
  snapScan = (snapScan + 397) % Math.max(1, used);           // start somewhere else next time so cuts spread over all threads
  return cut;
}
// a pluck at a screen point: every thread passing near it lets go
function pluckAt(fx, fy, now){
  if (!MODE.on || MODE.X < 1) return 0;
  const gx = (fx * VIEW.W - VIEW.cx) / VIEW.r * (G / 2) + G / 2, gy = (fy * VIEW.H - VIEW.cy) / VIEW.r * (G / 2) + G / 2;
  const rad = G * .11;
  let cut = 0;
  for (let q = 0, k = tail; q < used; q++, k = (k + 1) % CAP){
    if (!TL[k]) continue;
    const ax = NAIL[TA[k] * 2], ay = NAIL[TA[k] * 2 + 1], bx = NAIL[TB[k] * 2], by = NAIL[TB[k] * 2 + 1];
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    const u = Math.max(0, Math.min(1, ((gx - ax) * dx + (gy - ay) * dy) / l2));
    const ex = ax + dx * u - gx, ey = ay + dy * u - gy;
    if (ex * ex + ey * ey < rad * rad){ snapThread(k, u, now); cut++; }
  }
  return cut;
}

/* ---------- camera → darkness target ---------- */
const VIEW = { W:0, H:0, cx:0, cy:0, r:0 };
function sampleCamera(){
  est.width === G || (est.width = G, est.height = G);
  const W = VIEW.W, H = VIEW.H, sc = Math.max(W / vidW, H / vidH), ox = (W - vidW * sc) / 2, oy = (H - vidH * sc) / 2;
  const x0 = VIEW.cx - VIEW.r, y0 = VIEW.cy - VIEW.r, sz = VIEW.r * 2;
  const sx = (x0 - ox) / sc, sy = (y0 - oy) / sc, sW = sz / sc, sH = sz / sc;
  ectx.setTransform(1, 0, 0, 1, 0, 0); ectx.fillStyle = '#808080'; ectx.fillRect(0, 0, G, G);
  if (mirror){ ectx.translate(G, 0); ectx.scale(-1, 1); }
  try { ectx.drawImage(video, mirror ? vidW - (sx + sW) : sx, sy, sW, sH, 0, 0, G, G); } catch(e){ ectx.setTransform(1, 0, 0, 1, 0, 0); return false; }
  ectx.setTransform(1, 0, 0, 1, 0, 0);
  let d; try { d = ectx.getImageData(0, 0, G, G).data; } catch(e){ return false; }
  Lp.set(L);
  for (let i = 0, p = 0; i < G * G; i++, p += 4) L[i] = (d[p] * .299 + d[p + 1] * .587 + d[p + 2] * .114) / 255;
  // the person mask in the same cells

    for (let q = 0, k = tail; q < used; q++, k = (k + 1) % CAP){
      if (!TL[k]) continue;
      const age = (now - TT[k]) / 1000, a = alpha * E * Math.min(1, age * 6 + .2);
      quad(pinX(TA[k]), pinY(TA[k]), pinX(TB[k]), pinY(TB[k]), hw, tr, tg, tb, a);
    }
  }
  const [sr, sg, sb] = p.snap;
  for (let k = 0; k < SNAP_MAX; k++){
    if (!SN.live[k]) continue;
    const t = (now - SN.t[k]) / 620;
    if (t >= 1){ SN.live[k] = 0; continue; }
    const e = 1 - Math.pow(1 - t, 3), a = SN.a[k], b = SN.b[k], u = SN.u[k];
    const ax = pinX(a), ay = pinY(a), bx = pinX(b), by = pinY(b);
    const cx = ax + (bx - ax) * u, cy = ay + (by - ay) * u;
    const l = Math.hypot(bx - ax, by - ay) || 1, nx = -(by - ay) / l, ny = (bx - ax) / l;
    const wob = Math.sin(t * 38) * (1 - t) * px * 9;
    // each half shrinks toward its own pin, whipping sideways as it goes
    const h1x = cx + (ax - cx) * e + nx * wob, h1y = cy + (ay - cy) * e + ny * wob;
    const h2x = cx + (bx - cx) * e - nx * wob, h2y = cy + (by - cy) * e - ny * wob;
    const al = (1 - t) * (1 - t) * .9;
    quad(ax, ay, h1x, h1y, hw * 1.4, sr, sg, sb, al);
    quad(bx, by, h2x, h2y, hw * 1.4, sr, sg, sb, al);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(PB.p); gl.bindVertexArray(vaoQ);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  const U = PB.U, sa = W / H, va = vidW / vidH;
  gl.uniform1i(U.uVid, 0);
  gl.uniform2f(U.uRes, W, H); gl.uniform2f(U.uScale, sa < va ? sa / va : 1, sa < va ? 1 : va / sa);
  gl.uniform2f(U.uC, VIEW.cx, VIEW.cy); gl.uniform1f(U.uR, VIEW.r * (G / 2 - .6) / (G / 2)); gl.uniform1f(U.uPx, px);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uE, E); gl.uniform1f(U.uT, now / 1000); gl.uniform1f(U.uDark, p.dark);
  gl.uniform3fv(U.uPaper, p.paper); gl.uniform3fv(U.uBrass, p.brass); gl.uniform3fv(U.uInk, p.thread);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (vbN){
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PLn.p); gl.bindVertexArray(vaoL);
    gl.bindBuffer(gl.ARRAY_BUFFER, vboL); gl.bufferSubData(gl.ARRAY_BUFFER, 0, VB, 0, vbN * 6);
    gl.uniform2f(PLn.U.uRes, W, H);
    gl.drawArrays(gl.TRIANGLES, 0, vbN);
    gl.disable(gl.BLEND);
  }

  $('hud').style.visibility = MODE.X >= 1 ? 'visible' : 'hidden';
  hudT += dt;
  if (hudT > .3){ hudT = 0;
    $('hud').textContent = 'ITOKAKE  ' + p.name + '\nPINS     ' + N + '\nTHREADS  ' + String(alive).padStart(4, '0'); }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__ITOKAKE = {
  ingestMask(d, w, h){ M.external = true; return ingestMask(d, w, h); },
  dropMask(){ M.live = false; M.lastT = -1e9; },
  state: () => ({ alive, snapped:STATS.snapped, woven:STATS.woven, motion:STATS.motion, maskLive:M.live, used }),
  // mean thread coverage over cells where the person is (mask > .5) and where they are not
  coverage(){ let a = 0, na = 0, b = 0, nb = 0;
    for (let i = 0; i < G * G; i++){ if (!INC[i]) continue; if (MK[i] > .5){ a += C[i]; na++; } else { b += C[i]; nb++; } }
    return { person: na ? a / na : 0, room: nb ? b / nb : 0 }; },
  palette(i){ setPal(i); },
  mode(c){ setMode(!!c); },
  pluck(x, y){ return pluckAt(x, y, performance.now()); },
  view: () => ({ on:MODE.on, X:MODE.X }),
  // the harness renders in software at a few fps; this lets the shuttle catch up the way a 60 fps device would
  settle(ms){ weave(performance.now(), 1e6, Math.round(1200 + 3600 * S.count), ms); return alive; },
};
</script>
