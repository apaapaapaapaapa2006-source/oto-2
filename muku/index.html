<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人が、白い紙にシルクスクリーンで刷られたポップアートの一枚になる。体は黄色のベタに黒いインクの斑、太い輪郭線。指でなぞると刷りがステッカーのようにめくれて、下から桃色のあなたが出てくる。動くと版がずれる。">
<meta name="theme-color" content="#f5f3ee">
<title>MUKU ─ 剥がせる刷り</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  MUKU 剥く ─ 剥がせる刷り                              ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       60 年代のポップアートのレコードジャケット。白い紙のまんなかに、
             シルクスクリーンで刷った黄色いものがひとつだけ置かれている。
             その一つが、あなたになる。そしてジャケットの黄色は剥がせる
             ステッカーだった ── 指でめくると、下から桃色のあなたが出てくる。
  PRINT      版は二枚。黄色のベタ（体の形）と、黒いインク（体の中の暗いところと
             太い輪郭線）。インクは写真の濃淡ではなく、刷りの斑 ── 紙目と
             スクリーンの目に噛んで縁がざらつく。黄色の版は黒の版から少し
             ずれて刷られ、動くと黄色が遅れてついてくる（見当ずれ）。
  PALETTE    白い紙・黄・黒が正。タップで色版が替わる（桃／青に橙の紙／緑に
             藤色の紙）。どの色版にも、剥がした下の「中身の色」が一つある。
  TYPE       Archivo Narrow 600 と Zen Kaku Gothic New、右下の書き文字だけ
             Yellowtail（今日の日付を署名のように）。
  MOTION     カメラ⇄刷りの切り替えは、スキージ（へら）が上から下へインクを
             引いていく一往復。めくりは指に吸いつき、離すとぱたんと戻る。
  SIGNATURE  めくれ ── 折り返した紙の裏と、その影と、下から覗く桃色。
  TECH       WebGL2 の全画面シェーダ一枚。人物マスク（MediaPipe、無ければ
             明るさ）を短辺 96 の場に落とし、黄色の版用に時間遅れのマスクを
             CPU で作る。インクの閾値は「体の中の明るさの分位」で毎フレーム
             決めるので、暗い部屋でも明るい部屋でも同じだけ黒が乗る。
             めくりは指の始点 A と今の点 B の垂直二等分線で紙を折る：
             A 側は剥がれて下の版、反対側には A 側を線対称に写した紙の裏。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

  font-family:"Zen Kaku Gothic New",ui-sans-serif,sans-serif;font-weight:400;transition:background .4s,color .4s}

<body>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hint">ゆっくり剥がしてみて ── PEEL WITH A FINGER</div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ MUKU</button>
<div id="bar">

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-k="0">黄</button>

</div>

<div id="start">
  <div class="t">SILKSCREEN CAMERA</div>
  <h1>MUKU</h1>
  <svg viewBox="0 0 170 120" aria-hidden="true">
    <path d="M18 98 C40 112 118 96 150 30 L156 14 L164 16 L160 34 C134 104 52 124 14 106 Z" fill="#f2cd1d" stroke="#16120e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40 104 C70 108 104 92 128 66 L122 64 C102 86 74 98 46 100 Z M150 36 L154 24 L158 26 L154 40 Z" fill="#16120e"/>
    <path d="M150 30 C142 50 128 66 118 72 L132 92 C146 80 156 56 160 34 Z" fill="#f0a6b4" stroke="#16120e" stroke-width="2"/>
    <path d="M118 72 L132 92 C122 78 120 76 118 72 Z" fill="#efe9dc"/>
  </svg>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、あなたが白い紙に刷られた<br>ポップアートになります。<br>指でなぞると、刷りがめくれます。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   MUKU — one full-screen shader. The person mask (or, with no model,
   the darker part of the picture) sits in a 96-cell field together with
   a time-lagged copy of itself; the yellow plate is drawn from the lag,
   the black plate from the mask now and the live picture's brightness,
   thresholded at a per-frame percentile taken inside the body. The peel
   folds the paper along the perpendicular bisector of the drag: points on
   the grabbed side show the plate underneath, and the other side gets the
   grabbed side mirrored across the fold as the back of the paper.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

/* ---------- colourways: paper, plate, ink, and what is under the plate ---------- */
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const PALS = [
  { name:'黄', paper:'#f5f3ee', fill:'#f2cd1d', ink:'#16120e', under:'#f2a3b3', uink:'#a73d62', back:'#efe9dc' },
  { name:'桃', paper:'#f6f1ea', fill:'#f39bb8', ink:'#1a1012', under:'#f2d23a', uink:'#8e6d0c', back:'#f1e9de' },
  { name:'青', paper:'#f2a24a', fill:'#43b6df', ink:'#10192a', under:'#f4ead0', uink:'#6b5733', back:'#f3ece0' },
  { name:'緑', paper:'#eee4ef', fill:'#7fd06c', ink:'#111511', under:'#f06a58', uink:'#7a1d1d', back:'#f0eae0' },
].map(p => Object.assign(p, { P:hex(p.paper), F:hex(p.fill), I:hex(p.ink), U:hex(p.under), UI:hex(p.uink), B:hex(p.back) }));
const S = { pal:0, ink:.45, reg:.4, line:.45 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uVid, uF, uTxt;
uniform vec2 uRes, uScale, uReg;
uniform float uMirror, uT, uThr, uLine, uPull, uPeelOn, uTxtOn;
uniform vec4 uPeel, uTxtRect;
uniform vec3 uPaper, uFill, uInk, uUnder, uUInk, uBack;
out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
vec2 vidUV(vec2 s){ vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
float lum(vec2 s){ return dot(texture(uVid, vidUV(s)).rgb, vec3(.299, .587, .114)); }
// the ink is printed from a softened picture: blotches, not photographic detail
float lumSoft(vec2 s){
  vec2 e = .007 * min(uRes.x, uRes.y) / uRes, f = e * .7071;
  return (lum(s) * 2. + lum(s + vec2(e.x, 0.)) + lum(s - vec2(e.x, 0.)) + lum(s + vec2(0., e.y)) + lum(s - vec2(0., e.y))
        + lum(s + f) + lum(s - f) + lum(s + vec2(f.x, -f.y)) + lum(s - vec2(f.x, -f.y))) / 10.;
}
// plate k at pixel px: rgb, and how much of the plate is there (0 = bare paper)
vec4 plate(vec2 px, bool under){
  // nothing is printed off the edge of the sheet (a fold can reach out there)
  if (px.x < 0. || px.y < 0. || px.x > uRes.x || px.y > uRes.y) return vec4(uPaper, 0.);
  vec2 s = px / uRes;
  vec4 f = texture(uF, s);
  // the screen's grain and the paper's tooth: every edge of ink is a little ragged
  float grain = vn(px / 2.2) * .55 + vn(px / 9.) * .45;
  // the outline: distance in pixels to the mask's half-way line, from its gradient
  vec2 e = vec2(1.5 / 96.);
  float m = f.r;
  vec2 g = vec2((texture(uF, s + vec2(e.x, 0.)).r - texture(uF, s - vec2(e.x, 0.)).r) / (2. * e.x) / uRes.x,
                (texture(uF, s + vec2(0., e.y)).r - texture(uF, s - vec2(0., e.y)).r) / (2. * e.y) / uRes.y);
  float dist = (m - .5) / max(length(g), 1e-5) + (grain - .5) * 2.5;   // inside > 0
  float body = smoothstep(-.8, .8, dist);
  float line = (1. - smoothstep(uLine * .5, uLine * .5 + 1.2, abs(dist))) * step(.5, uLine);
  // the colour plate: from the lagged mask, printed a little off the black
  float fm = texture(uF, s - uReg).g;
  float fill = smoothstep(.42, .58, fm + (grain - .5) * .08);
  // black ink inside the body where it is dark
  float l = lumSoft(s) + (grain - .5) * .09 + f.b * (vn(px / 6. + uT * 9.) - .5) * .25;
  float ink = body * smoothstep(uThr + .02, uThr - .02, l);
  vec3 cf = under ? uUnder : uFill, ci = under ? uUInk : uInk;
  float a = max(fill, max(ink, line));
  vec3 c = mix(uPaper, cf, fill);
  c = mix(c, ci, max(ink, line));
  return vec4(c, a);
}
void main(){
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 s = px / uRes;
  // the paper itself, with a faint tooth
  vec3 col = uPaper * (.975 + .05 * vn(px / 1.7) - .012 * vn(px / 40.));
  vec4 top;
  float d = -1e5;                                 // not peeled anywhere
  if (uPeelOn > .5) d = dot(px - uPeel.xy, uPeel.zw);
  if (d > 0.){
    // peeled away here: the plate underneath, and the fold's shadow on it
    vec4 u = plate(px, true);
    col = mix(col, u.rgb, u.a);
    col *= 1. - .22 * exp(-d / (.02 * uRes.y));
  } else {
    top = plate(px, false);
    col = mix(col, top.rgb, top.a);
    if (uPeelOn > .5){
      // the shadow the lifted flap throws, a little down and to the right
      vec2 sp = px - vec2(.008, .012) * uRes.y;
      float ds = dot(sp - uPeel.xy, uPeel.zw);
      if (ds < 0.){ float sa = plate(sp - 2. * ds * uPeel.zw, false).a; col *= 1. - .28 * sa; }
      // the flap: the grabbed side, folded over onto this side
      vec2 q = px - 2. * d * uPeel.zw;
      float fa = plate(q, false).a;
      float shade = mix(.8, 1.02, smoothstep(0., .07 * uRes.y, -d));
      col = mix(col, uBack * shade, fa);
    }
  }
  // the signature: today's date in a hand, bottom right
  if (uTxtOn > .5 && px.x > uTxtRect.x && px.y > uTxtRect.y && px.x < uTxtRect.z && px.y < uTxtRect.w){
    vec2 t = (px - uTxtRect.xy) / (uTxtRect.zw - uTxtRect.xy);
    col = mix(col, uInk, texture(uTxt, t).a * .92);
  }
  // the squeegee: above the blade, the print; below it, the camera
  float by = uPull * (uRes.y + .06 * uRes.y);
  if (px.y > by){
    col = texture(uVid, vidUV(s)).rgb;
  }
  float blade = 1. - smoothstep(0., .012 * uRes.y, abs(px.y - by));
  col = mix(col, uInk, blade * step(.001, uPull) * step(uPull, .999) * .85);
  o = vec4(col, 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs, attrs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function tex(){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
let PR, vaoQ, texVid, texField, texTxt, txtW = 1, txtH = 1;
function initGL(){
  PR = prog(VS, FS, ['p']);
  vaoQ = gl.createVertexArray(); gl.bindVertexArray(vaoQ);
  const q = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, q);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  texVid = tex(); texField = tex(); texTxt = tex();
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  makeSignature();
  document.fonts && document.fonts.load('80px Yellowtail').then(makeSignature, () => {});
}
// today's date, written as a signature
function makeSignature(){
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const d = new Date(), M = ['Jan.','Feb.','Mar.','Apr.','May','June','July','Aug.','Sept.','Oct.','Nov.','Dec.'];
  const text = M[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  x.font = '80px Yellowtail, "Brush Script MT", cursive';
  txtW = Math.ceil(x.measureText(text).width) + 40; txtH = 120;
  c.width = txtW; c.height = txtH;
  x.font = '80px Yellowtail, "Brush Script MT", cursive'; x.fillStyle = '#000'; x.textBaseline = 'middle';
  x.fillText(text, 20, 62);
  gl.bindTexture(gl.TEXTURE_2D, texTxt);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
}

/* ---------- field: mask in screen space, its blur, motion heat, brightness ---------- */
const FSHORT = 96;
const F = { w:0, h:0, cur:null, prev:null, have:false, lum:null, sm:null, blur:null, tmp:null, heat:null, px:null, idx:null, idxKey:'', E:0 };
function ensureField(W, H){
  let w, h; if (W >= H){ h = FSHORT; w = Math.round(FSHORT * W / H); } else { w = FSHORT; h = Math.round(FSHORT * H / W); }
  if (w === F.w && h === F.h) return;
  F.w = w; F.h = h; est.width = w; est.height = h; const n = w * h;

/* ---------- how much black goes on: a share of the body, whatever the light ---------- */

  gl.uniform3fv(PR.U.uUnder, P.U); gl.uniform3fv(PR.U.uUInk, P.UI); gl.uniform3fv(PR.U.uBack, P.B);
  gl.bindVertexArray(vaoQ); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
