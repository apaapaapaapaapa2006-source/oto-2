<title>BIROUDO ─ 撫でた向きに光る毛の世界</title>
<meta name="description" content="カメラに映るものすべてに毛が生える。一万数千本の毛が同じ向きに寝ているあいだは一色だが、指で撫でると毛並みが変わり、光のほうを向いた毛だけが明るくなる。撫でた跡は芝生の刈り跡のように残り、ゆっくり寝直す。両手を掲げれば一陣の風。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  BIROUDO 天鵞絨 ─ 撫でた向きに光る毛の世界        ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      A bolt of cloth unrolled across a table in a draper's shop, and
            the cloth happens to be the room you are sitting in. Warm,
            tactile, expensive. The pleasure is not "my face looks funny" —
            it is that you can STROKE the world and it holds the mark, the
            way velvet or a mown lawn does. Tonight's other piece (SOROI) is
            cold brass in a dark hall; this one is dyed wool in daylight and
            they are meant to share nothing at all.

  PALETTE   Three BOLTS, and switching bolt re-dyes the whole world. Each is
            a duotone the camera is pulled 55% of the way into, so any room
            comes out as cloth:
              蘇芳 suou     shadow #1c0b14 → light #f7dcc4  short dense pile,
                                              hardest sheen. The house cloth.
              萌黄 moegi    shadow #101a0e → light #edf0c8  long soft pile,
                                              wispy, moves like mohair.
              鉄紺 tetsukon shadow #0a1024 → light #cfe0f4  very short nap,
                                              suede, the comb lines bite.
            Over all three: 金茶 kincha #d9a24e is the SPECULAR ONLY. Gold
            never appears except as light caught on a strand's side.
            生成 kinari #f4ece0 and 鉄黒 tetsukuro #221d1f are chrome only —
            the labels are printed card laid ON the cloth, never in it.

  BACKGROUND  There is no background. The cloth is full bleed: a per-pixel
              pass writes the dyed, darkened body of the fabric, and
              thirteen thousand strands are drawn on top of it.

  TYPE      Bodoni Moda — a didone, the face of a textile catalogue and a
              perfume box, used at 600 for the wordmark and 400 for figures,
              wide-tracked. Klee One for Japanese: a soft calligraphic
              face with almost no stroke contrast, which is the exact
              opposite of the Bodoni and makes the pairing read as a label
              printed on cloth rather than a UI.

  MOTION    Viscous. Nothing snaps. The nap relaxes back to rest with a
            fourteen-second time constant, the rest direction itself drifts
            over forty seconds, and every panel transition is a long
            ease-out. The only fast thing in the piece is the gust.

  SIGNATURE 撫でた向きが、明るさになる。 Real velvet is not one colour: a
            strand tipped toward the light is bright and the same strand
            tipped away is almost black, which is why a mown lawn has
            stripes. So the shading here is anisotropic and honest —
            brightness is 1 + 艶·(T·L) with a narrow gold specular on top,
            where T is the strand's own direction. Comb five furrows with
            five fingers and you have written in light, with no ink
            anywhere. The furrows stay because the cloth remembers being
            touched, and fade over about half a minute.
  ══════════════════════════════════════════════════════════════════════════
-->

  }

    display:flex;justify-content:space-between;align-items:center;

    color:rgba(34,29,31,.5);
  }

    letter-spacing:.1em;color:#221d1f;line-height:1.5;

<body>
<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="err"></div>

<div id="ttl">
  <div class="k">天鵞絨</div>
  <div class="s">BIROUDO</div>
</div>

<div id="read">
  毛 <b id="rS">0</b>　撫 <b id="rC">0</b>　艶 <b id="rG">0</b>
</div>

<div id="panel">
  <div class="grp"><label>毛足</label><input type="range" id="lenEl" min="10" max="100" value="52"></div>

  </div>

</div>

<div class="sheet" id="startSheet">
  <div class="card">
    <div class="cap"><span>OTO-II / BIROUDO</span><span>毛 <b>一万三千本</b></span></div>
    <div class="bodyw">
      <div class="ttl2">世界に毛が生えて、<br>撫でた向きだけ光る</div>
      <p class="lead">
        カメラに映るものすべてが、毛の生えた布になります。<br>
        毛が同じ向きに寝ているうちは、ただの一色の布。<br>
        でも指で撫でると毛並みが変わって、<br>
        <em>光のほうを向いた毛だけが明るくなります</em>。<br>
        芝生の刈り跡と同じ理屈なので、撫でた跡は光のまま残ります。
      </p>
      <canvas id="demo" width="660" height="230"></canvas>
      <div class="spec">
        <span>指で撫でる</span>五本の指が櫛になって、五本の筋が引けます<br>
        <span>毛足・艶</span>毛の長さと、向きで変わる明るさの強さ<br>
        <span>反物</span>蘇芳・萌黄・鉄紺。布が変われば毛足も変わります<br>
        <span>両手を上へ</span><em>一陣</em>。風が横切って、毛が一斉に寝ます
      </div>
      <button class="go" id="startBtn">反物をひろげる</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  BASICS
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function fin(v){ return typeof v==='number' && isFinite(v); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function now(){
  return (typeof performance!=='undefined'&&performance&&performance.now)
    ? performance.now()/1000 : Date.now()/1000;
}
function raf(fn){
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(fn);
  else setTimeout(function(){ fn(now()*1000); },16);
}
function mkCanvas(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  return c;
}

var view=document.getElementById('view');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var lenEl=document.getElementById('lenEl');
var shEl=document.getElementById('shEl');
var sndBtn=document.getElementById('snd');
var boBtns=[document.getElementById('bo0'),document.getElementById('bo1'),document.getElementById('bo2')];
var rS=document.getElementById('rS'), rC=document.getElementById('rC'), rG=document.getElementById('rG');
var demoCv=document.getElementById('demo');
var g=view.getContext('2d');

var DPR=1, W=960, H=600, SHORT=600;
var started=false, last=now();

// ═══════════════════════════════════════════════════════════════════════
//  THE BOLTS — each is a dye, a pile length and a hardness of sheen
// ═══════════════════════════════════════════════════════════════════════
var BOLTS=[
  { name:'蘇芳', lo:[28,11,20],  hi:[247,220,196], len:1.00, dense:1.00, sheen:1.00, spec:1.00, curl:0.30, dye:0.56 },
  { name:'萌黄', lo:[16,26,14],  hi:[237,240,200], len:1.85, dense:0.78, sheen:0.72, spec:0.55, curl:0.72, dye:0.50 },
  { name:'鉄紺', lo:[10,16,36],  hi:[207,224,244], len:0.58, dense:1.26, sheen:1.30, spec:1.45, curl:0.12, dye:0.62 }
];
var boltIx=0;
var SPEC_R=217, SPEC_G=162, SPEC_B=78;   // 金茶 — specular only

// ═══════════════════════════════════════════════════════════════════════
//  GRID (camera space) — the nap, and how worn each patch is
// ═══════════════════════════════════════════════════════════════════════
var CW=0, CH=0, CN=0, BASE_H=120;
var fldX=null, fldY=null, wear=null;
var srcCv=null, srcCtx=null, srcData=null;
var bodyCv=null, bodyCtx=null, bodyImg=null, bodyBuf=null;
var restA=0.586;                          // rest nap angle (perp to the light)
var LX=0.55, LY=-0.83;                    // direction toward the light

function allocGrid(h){
  var hh=clamp(Math.round(h),64,168);
  var ww=clamp(Math.round(hh*camAspect),64,320);
  if (ww===CW&&hh===CH&&fldX) return;
  // Resolution changes must not wipe the cloth's memory: the nap AND the
  // wear are resampled into the new grid, so the furrows you combed survive
  // an adaptive step.
  var oldX=fldX, oldY=fldY, oldWe=wear, oldW=CW, oldH=CH;
  CW=ww; CH=hh; CN=CW*CH;
  fldX=new Float32Array(CN); fldY=new Float32Array(CN); wear=new Float32Array(CN);
  var i,c=Math.cos(restA),s=Math.sin(restA);
  for (i=0;i<CN;i++){ fldX[i]=c; fldY[i]=s; wear[i]=0; }
  if (oldX&&oldW>0&&oldH>0){
    for (var y=0;y<CH;y++){
      var oy=Math.min(oldH-1,Math.floor(y*oldH/CH));
      for (var x=0;x<CW;x++){
        var ox=Math.min(oldW-1,Math.floor(x*oldW/CW));
        var d=y*CW+x, o=oy*oldW+ox;
        fldX[d]=oldX[o]; fldY[d]=oldY[o];
        if (oldWe) wear[d]=oldWe[o];
      }
    }
  }
  srcCv=mkCanvas(CW,CH); srcCtx=srcCv.getContext('2d');
  bodyCv=mkCanvas(CW,CH); bodyCtx=bodyCv.getContext('2d');
  if (bodyCtx){
    bodyImg=bodyCtx.createImageData(CW,CH);
    bodyBuf=bodyImg?bodyImg.data:null;
    if (bodyBuf){ for (i=0;i<bodyBuf.length;i+=4){ bodyBuf[i]=28; bodyBuf[i+1]=11; bodyBuf[i+2]=20; bodyBuf[i+3]=255; } }
  }
  srcData=null;
}

// ═══════════════════════════════════════════════════════════════════════
//  STRANDS — one fixed pool, shuffled, so any prefix still covers the frame
// ═══════════════════════════════════════════════════════════════════════
var SMAX=16000, sN=((window.innerWidth||900)*(window.innerHeight||600)<420000)?5200:9000;
var sU=new Float32Array(SMAX), sV=new Float32Array(SMAX);
var sJ=new Float32Array(SMAX), sK=new Float32Array(SMAX);
function seedStrands(){
  var cols=Math.ceil(Math.sqrt(SMAX*1.4)), rows=Math.ceil(SMAX/cols), i=0,x,y;
  for (y=0;y<rows&&i<SMAX;y++){
    for (x=0;x<cols&&i<SMAX;x++){
      sU[i]=clamp((x+0.5+(Math.random()-0.5)*0.95)/cols,0.0005,0.9995);
      sV[i]=clamp((y+0.5+(Math.random()-0.5)*0.95)/rows,0.0005,0.9995);
      sJ[i]=Math.random(); sK[i]=Math.random()*2-1;
      i++;
    }
  }
  for (i=SMAX-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var a=sU[i]; sU[i]=sU[j]; sU[j]=a;
    a=sV[i]; sV[i]=sV[j]; sV[j]=a;
    a=sJ[i]; sJ[i]=sJ[j]; sJ[j]=a;
    a=sK[i]; sK[i]=sK[j]; sK[j]=a;
  }
}
seedStrands();

// draw buffers: six coordinates per strand, sorted into colour buckets
var QQ=6, NBUCK=QQ*QQ*QQ;
var bx0=new Float32Array(SMAX), by0=new Float32Array(SMAX);
var bx1=new Float32Array(SMAX), by1=new Float32Array(SMAX);
var bx2=new Float32Array(SMAX), by2=new Float32Array(SMAX);
var bBuck=new Int32Array(SMAX);
var bCount=new Int32Array(NBUCK+1), bStart=new Int32Array(NBUCK+1), bOrder=new Int32Array(SMAX);
var bFill=new Int32Array(NBUCK);

// ═══════════════════════════════════════════════════════════════════════
//  LAYOUT
// ═══════════════════════════════════════════════════════════════════════
function resize(){
  DPR=Math.min(2,(window.devicePixelRatio||1));
  var cw=Math.max(240,window.innerWidth||320);
  var ch=Math.max(240,window.innerHeight||480);
  view.width=Math.round(cw*DPR); view.height=Math.round(ch*DPR);
  view.style.width=cw+'px'; view.style.height=ch+'px';
  W=view.width; H=view.height; SHORT=Math.min(W,H);
  updateCover();
  allocGrid(BASE_H);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user');
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  COVER MAPPING + ASPECT-CORRECTED CAMERA SPACE
//  The cover map is UNIFORM: one unit of aspect-corrected camera space is
//  the same number of pixels in x and y. So the nap field can be stored in
//  screen-space unit vectors and stay isotropic under either orientation,
//  and every radius below is a fraction of the SHORT edge, never of W.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect;
  if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX+(mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY+ny*(covS/camAspect); }
function cu(nx){ return nx*camAspect; }
function cv(ny){ return ny; }
// screen → grid cell
function gridAt(X,Y){
  var nx=(X-covOX)/Math.max(1e-6,covS);
  if (mirror) nx=1-nx;
  var ny=(Y-covOY)/Math.max(1e-6,covS/camAspect);
  var gx=Math.floor(nx*CW), gy=Math.floor(ny*CH);
  if (gx<0||gy<0||gx>=CW||gy>=CH) return -1;
  return gy*CW+gx;
}

// ═══════════════════════════════════════════════════════════════════════
//  HANDS
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.42;
var HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
        [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
var TIPS=[4,8,12,16,20];
function mkHand(){
  return { on:false,t:-9,L:null,fresh:false,raised:false,
           cx:new Float32Array(5),cy:new Float32Array(5),
           ox:new Float32Array(5),oy:new Float32Array(5) };
}
var HAND=[mkHand(),mkHand()];
var seenN=0, raiseT=0, gustT=-99, gustCool=-99, gustDX=1, gustDY=0;

function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  if (!p) return false;
  return fin(p.x)&&fin(p.y);
}
function handLive(k){ return HAND[k].on && (now()-HAND[k].t)<LOST_S; }
function loseHands(){
  for (var k=0;k<2;k++){
    var h=HAND[k];
    h.on=false; h.L=null; h.t=-9; h.fresh=false; h.raised=false;
  }
  seenN=0; raiseT=0;
}
function onHands(res){
  var t=now();
  var lists=(res&&res.multiHandLandmarks)?res.multiHandLandmarks:null;
  var n=(lists&&typeof lists.length==='number')?Math.min(2,lists.length):0;
  seenN=0;
  for (var k=0;k<2;k++){
    var h=HAND[k];
    if (k<n){
      var L=lists[k];
      if (!lmOK(L,0)||!lmOK(L,9)){ continue; }
      var wasLive=h.on&&(t-h.t)<LOST_S;
      var i,idx,ok=true;
      for (i=0;i<5;i++){ if (!lmOK(L,TIPS[i])){ ok=false; break; } }
      if (!ok) continue;
      for (i=0;i<5;i++){
        idx=TIPS[i];
        var nx=sx(L[idx].x), ny=sy(L[idx].y);
        if (!fin(nx)||!fin(ny)){ ok=false; break; }
        if (wasLive){ h.ox[i]=h.cx[i]; h.oy[i]=h.cy[i]; }
        else { h.ox[i]=nx; h.oy[i]=ny; }
        h.cx[i]=nx; h.cy[i]=ny;
      }
      if (!ok) continue;
      h.fresh=!wasLive;
      h.on=true; h.t=t; h.L=L;
      h.raised=(cv(L[0].y)<0.34&&cv(L[9].y)<0.30);
      seenN++;
    } else if (h.on&&(t-h.t)>LOST_S){
      h.on=false; h.L=null; h.fresh=false; h.raised=false;
    }
  }
}
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0, selfieMode:false,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO — the sound of a hand on cloth. Filtered noise whose band and
//  level follow how fast and how much you are stroking, over a very quiet
//  pad tuned to the average lie of the nap. Nothing else.
// ═══════════════════════════════════════════════════════════════════════
var ac=null, master=null, comp=null;
var brushSrc=null, brushFil=null, brushGain=null;
var padOsc=[], padFil=null, padGain=null, noiseBuf=null;
var soundOn=true;
function makeNoise(){
  if (!ac) return null;
  var n=Math.floor(ac.sampleRate*2);
  if (!fin(n)||n<64) n=44100;
  var b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0), lp=0;
  for (var i=0;i<n;i++){ lp=lp*0.72+(Math.random()*2-1)*0.28; d[i]=lp*2.2; }
  return b;
}
function initAudio(){
  if (ac) return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return;
  try{ ac=new AC(); }catch(e){ ac=null; return; }
  master=ac.createGain(); master.gain.value=0.42;
  comp=ac.createDynamicsCompressor();
  try{
    comp.threshold.value=-18; comp.knee.value=24;
    comp.ratio.value=6; comp.attack.value=0.006; comp.release.value=0.3;
  }catch(e){}
  comp.connect(master); master.connect(ac.destination);
  noiseBuf=makeNoise();
  try{
    brushSrc=ac.createBufferSource(); brushSrc.buffer=noiseBuf; brushSrc.loop=true;
    brushFil=ac.createBiquadFilter(); brushFil.type='bandpass';
    brushFil.frequency.value=900; brushFil.Q.value=0.7;
    brushGain=ac.createGain(); brushGain.gain.value=0.0001;
    brushSrc.connect(brushFil); brushFil.connect(brushGain); brushGain.connect(comp);
    brushSrc.start(0);
  }catch(e){ brushSrc=null; }
  try{
    padGain=ac.createGain(); padGain.gain.value=0.0001;
    padFil=ac.createBiquadFilter(); padFil.type='lowpass';
    padFil.frequency.value=420; padFil.Q.value=0.8;
    padFil.connect(padGain); padGain.connect(comp);
    var fr=[73.42,110.0,146.83,220.0];
    for (var i=0;i<4;i++){
      var o=ac.createOscillator();
      o.type=(i%2)?'triangle':'sine';
      o.frequency.value=fr[i]*(1+(i-1.5)*0.0015);
      var og=ac.createGain(); og.gain.value=[0.5,0.32,0.22,0.12][i];
      o.connect(og); og.connect(padFil); o.start(0);
      padOsc.push(o);
    }
    padGain.gain.setTargetAtTime(0.10,ac.currentTime,1.2);
  }catch(e){ padGain=null; }
}
function setSound(on){
  soundOn=!!on;
  sndBtn.textContent=soundOn?'音 ON':'音 OFF';
  if (soundOn) sndBtn.classList.add('on'); else sndBtn.classList.remove('on');
  if (master&&ac){
    try{ master.gain.setTargetAtTime(soundOn?0.42:0.0001,ac.currentTime,0.12); }catch(e){}
  }
}
function audioUpdate(combE,meanSheen){
  if (!ac||!soundOn) return;
  var t=ac.currentTime;
  if (brushGain&&brushFil){
    var lv=clamp(combE*0.55,0,0.5);
    try{
      brushGain.gain.setTargetAtTime(Math.max(0.0001,lv),t,0.09);
      brushFil.frequency.setTargetAtTime(clamp(420+combE*2600,120,7000),t,0.14);
    }catch(e){}
  }
  if (padFil){
    try{ padFil.frequency.setTargetAtTime(clamp(240+meanSheen*520,90,3000),t,0.6); }catch(e){}
  }
}
function whoosh(){
  if (!ac||!soundOn||!comp||!noiseBuf) return;
  var t=ac.currentTime+0.01;
  try{
    var s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    var f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.setValueAtTime(1.4,t);
    f.frequency.setValueAtTime(260,t);
    f.frequency.exponentialRampToValueAtTime(2600,t+0.55);
    f.frequency.exponentialRampToValueAtTime(320,t+1.35);
    var gn=ac.createGain();
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(0.5,t+0.16);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+1.45);
    s.connect(f); f.connect(gn); gn.connect(comp);
    s.start(t); s.stop(t+1.5);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  NAP — comb, relax, wear, gust
// ═══════════════════════════════════════════════════════════════════════
var combE=0, meanSheen=0, gustPos=0;
function relaxNap(dt){
  restA+=dt*0.028*Math.sin(now()*0.052);
  var rx=Math.cos(restA), ry=Math.sin(restA);
  var k=1-Math.exp(-dt/14);
  var wk=Math.exp(-dt/30);
  for (var i=0;i<CN;i++){
    var x=fldX[i]+(rx-fldX[i])*k;
    var y=fldY[i]+(ry-fldY[i])*k;
    var m=Math.sqrt(x*x+y*y);
    if (m>1e-5){ fldX[i]=x/m; fldY[i]=y/m; } else { fldX[i]=rx; fldY[i]=ry; }
    wear[i]*=wk;
  }
}
function combAt(X,Y,vx,vy,rad,strength){
  var m=Math.sqrt(vx*vx+vy*vy);
  if (m<1e-6) return 0;
  var dx=vx/m, dy=vy/m;
  var cellPx=Math.max(1e-6,covS/CW);
  var rc=Math.max(1,rad/cellPx);
  var nx=(X-covOX)/Math.max(1e-6,covS);
  if (mirror) nx=1-nx;
  var ny=(Y-covOY)/Math.max(1e-6,covS/camAspect);
  var cx=nx*CW, cy=ny*CH;
  var x0=Math.max(0,Math.floor(cx-rc)), x1=Math.min(CW-1,Math.ceil(cx+rc));
  var y0=Math.max(0,Math.floor(cy-rc)), y1=Math.min(CH-1,Math.ceil(cy+rc));
  var touched=0, r2=rc*rc;
  // dx,dy already came from a SCREEN-space velocity, which is exactly how
  // the field is stored, so no mirroring is applied here or at draw time.
  var pdx=dx, pdy=dy;
  for (var y=y0;y<=y1;y++){
    for (var x=x0;x<=x1;x++){
      var ddx=x+0.5-cx, ddy=y+0.5-cy;
      var d2=ddx*ddx+ddy*ddy;
      if (d2>r2) continue;
      var f=1-Math.sqrt(d2)/rc;
      var w=clamp(f*f*strength,0,1);
      var i=y*CW+x;
      var ax=fldX[i]+(pdx-fldX[i])*w;
      var ay=fldY[i]+(pdy-fldY[i])*w;
      var mm=Math.sqrt(ax*ax+ay*ay);
      if (mm>1e-5){ fldX[i]=ax/mm; fldY[i]=ay/mm; }
      wear[i]=clamp(wear[i]+w*0.9,0,1);
      touched++;
    }
  }
  return touched;
}
// COMB_MIN is a speed in aspect-corrected CAMERA units per second, and the
// comb radius is a fraction of the camera frame — not of the screen. One
// camUnit is the on-screen height of the camera image, and because the cover
// map is uniform it is the same number of pixels in x and y. So the same
// physical wave of the hand combs the same patch of picture in portrait and
// in landscape, and MediaPipe's landmark jitter (well under 0.15 u/s) never
// clears the threshold.
var COMB_MIN=0.30;
function combHands(dt){
  if (dt<=0) return 0;
  var e=0;
  var camUnit=Math.max(1e-6,covS/camAspect);
  var rad=camUnit*0.075;
  for (var k=0;k<2;k++){
    var h=HAND[k];
    if (!handLive(k)||h.fresh) continue;
    for (var p=0;p<5;p++){
      var ax=h.ox[p], ay=h.oy[p], bx=h.cx[p], by=h.cy[p];
      if (!fin(ax)||!fin(ay)||!fin(bx)||!fin(by)) continue;
      var vx=(bx-ax)/dt, vy=(by-ay)/dt;
      var sp=Math.sqrt(vx*vx+vy*vy)/camUnit;
      if (sp<COMB_MIN) continue;
      var st=clamp((sp-COMB_MIN)*1.15,0,0.85)*clamp(dt*24,0,1);
      // sample along the swept segment so a fast hand does not skip
      var steps=clamp(Math.ceil(Math.sqrt((bx-ax)*(bx-ax)+(by-ay)*(by-ay))/(rad*0.6)),1,6);
      for (var s2=1;s2<=steps;s2++){
        var f2=s2/steps;
        combAt(ax+(bx-ax)*f2,ay+(by-ay)*f2,vx,vy,rad,st/steps*1.6);
      }
      e+=clamp(sp-COMB_MIN,0,2.5);
    }
  }
  return e;
}
function stepGust(dt,t){
  var el=t-gustT;
  if (el<0||el>1.5) return;
  var prev=gustPos;
  gustPos=clamp(el/1.15,0,1);
  var lo=Math.min(prev,gustPos)-0.14, hi=gustPos+0.02;
  var x0=Math.max(0,Math.floor(lo*CW)), x1=Math.min(CW-1,Math.ceil(hi*CW));
  for (var x=x0;x<=x1;x++){
    var d=Math.abs((x/CW)-gustPos);
    var w=clamp(1-d/0.16,0,1);
    if (w<=0) continue;
    w=w*w*0.85;
    for (var y=0;y<CH;y++){
      var i=y*CW+x;
      var ax=fldX[i]+(gustDX-fldX[i])*w;
      var ay=fldY[i]+(gustDY-fldY[i])*w;
      var m=Math.sqrt(ax*ax+ay*ay);
      if (m>1e-5){ fldX[i]=ax/m; fldY[i]=ay/m; }
      wear[i]=clamp(wear[i]+w*0.5,0,1);
    }
  }
}
function fireGust(){
  gustT=now(); gustCool=gustT; gustPos=0;
  var a=-0.62+(Math.random()-0.5)*0.5;
  gustDX=Math.cos(a); gustDY=Math.sin(a);
  whoosh();
}
function checkGust(t,dt){
  var both=handLive(0)&&handLive(1)&&HAND[0].raised&&HAND[1].raised;
  if (both&&(t-gustCool)>11){
    raiseT+=dt;
    if (raiseT>0.5){ raiseT=0; fireGust(); }
  } else {
    raiseT=Math.max(0,raiseT-dt*2);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  PER-PIXEL: the body of the cloth. Every pixel is written, every frame.
// ═══════════════════════════════════════════════════════════════════════
function grabFrame(){
  if (!srcCtx) return false;
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (!vw||!vh) return false;
  try{ srcCtx.drawImage(video,0,0,CW,CH); }catch(e){ return false; }
  try{ srcData=srcCtx.getImageData(0,0,CW,CH).data; }catch(e){ srcData=null; return false; }
  return !!srcData;
}
function paintBody(){
  if (!bodyBuf||!bodyImg||!bodyCtx) return;
  var B=BOLTS[boltIx]||BOLTS[0];
  var lr=B.lo[0], lg=B.lo[1], lb=B.lo[2];
  var hr=B.hi[0], hg=B.hi[1], hb=B.hi[2];
  var dye=B.dye, keep=1-dye;
  var len=bodyBuf.length, n=CN;
  var have=!!srcData;
  for (var i=0;i<n;i++){
    var o=i<<2;
    var r,gg2,b;
    if (have){ r=srcData[o]; gg2=srcData[o+1]; b=srcData[o+2]; }
    else { r=90; gg2=70; b=80; }
    var lum=(r*0.299+gg2*0.587+b*0.114)/255;
    if (!(lum>=0)) lum=0; else if (lum>1) lum=1;
    // duotone pull, then the pile's own shadow (strands sit on top of this)
    var dr=lr+(hr-lr)*lum, dg=lg+(hg-lg)*lum, db=lb+(hb-lb)*lum;
    var sheen=fldX[i]*LX+fldY[i]*LY;
    var amb=0.40+0.10*sheen+wear[i]*0.06;
    var rr=(dr*dye+r*keep)*amb;
    var gv=(dg*dye+gg2*keep)*amb;
    var bv=(db*dye+b*keep)*amb;
    bodyBuf[o]  =rr<0?0:(rr>255?255:rr);
    bodyBuf[o+1]=gv<0?0:(gv>255?255:gv);
    bodyBuf[o+2]=bv<0?0:(bv>255?255:bv);
    bodyBuf[o+3]=255;
  }
  for (var j=n<<2;j<len;j+=4){ bodyBuf[j]=0; bodyBuf[j+1]=0; bodyBuf[j+2]=0; bodyBuf[j+3]=255; }
  try{ bodyCtx.putImageData(bodyImg,0,0); }catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
//  STRANDS
// ═══════════════════════════════════════════════════════════════════════
var lenK=0.52, shK=0.62;
function readControls(){
  var lv=parseFloat(lenEl&&lenEl.value); lenK=fin(lv)?lv/100:0.52;
  var sv=parseFloat(shEl&&shEl.value);   shK=fin(sv)?sv/100:0.62;
}
function drawStrands(){
  var B=BOLTS[boltIx]||BOLTS[0];
  var n=Math.min(Math.round(sN*B.dense),SMAX);
  if (n<1) return;
  var baseLen=SHORT*(0.011+lenK*0.030)*B.len;
  var sheenK=(0.25+shK*0.95)*B.sheen;
  var specK=(0.20+shK*1.05)*B.spec;
  var curl=B.curl;
  var lr=B.lo[0], lg2=B.lo[1], lb=B.lo[2];
  var hr=B.hi[0], hg=B.hi[1], hb=B.hi[2];
  var dye=B.dye, keep=1-dye;
  var have=!!srcData;
  var i,acc=0,cnt=0;

  bCount.fill(0);
  for (i=0;i<n;i++){
    var u=sU[i], v=sV[i];
    var gx=(u*CW)|0, gy=(v*CH)|0;
    if (gx<0) gx=0; else if (gx>=CW) gx=CW-1;
    if (gy<0) gy=0; else if (gy>=CH) gy=CH-1;
    var ci=gy*CW+gx;
    var o=ci<<2;
    var r,gg2,b;
    if (have){ r=srcData[o]; gg2=srcData[o+1]; b=srcData[o+2]; }
    else { r=90; gg2=70; b=80; }
    var lum=(r*0.299+gg2*0.587+b*0.114)/255;
    if (!(lum>=0)) lum=0; else if (lum>1) lum=1;
    var dr=(lr+(hr-lr)*lum)*dye+r*keep;
    var dg=(lg2+(hg-lg2)*lum)*dye+gg2*keep;
    var db=(lb+(hb-lb)*lum)*dye+b*keep;

    var fx=fldX[ci], fy=fldY[ci];
    var dot=fx*LX+fy*LY;
    acc+=dot; cnt++;
    var m=1+sheenK*dot+wear[ci]*0.30;
    if (m<0.08) m=0.08;
    var sp=dot>0?(dot*dot*dot*dot*specK*(0.5+wear[ci]*0.6)):0;

    var cr=dr*m+SPEC_R*sp, cg=dg*m+SPEC_G*sp, cb=db*m+SPEC_B*sp;
    var qr=cr<0?0:(cr>255?5:(cr*QQ/256)|0);
    var qg=cg<0?0:(cg>255?5:(cg*QQ/256)|0);
    var qb=cb<0?0:(cb>255?5:(cb*QQ/256)|0);
    var bk=(qr*QQ+qg)*QQ+qb;
    bBuck[i]=bk; bCount[bk]++;

    var X=covOX+(mirror?(1-u):u)*covS;
    var Y=covOY+v*(covS/camAspect);
    var L2=baseLen*(0.62+sJ[i]*0.78);
    var dxs=fx, dys=fy;
    var pxn=-dys*curl*L2*sK[i];
    var pyn=dxs*curl*L2*sK[i];
    bx0[i]=X; by0[i]=Y;
    bx1[i]=X+dxs*L2*0.55+pxn*0.5; by1[i]=Y+dys*L2*0.55+pyn*0.5;
    bx2[i]=X+dxs*L2+pxn; by2[i]=Y+dys*L2+pyn+L2*0.10;
  }
  meanSheen=cnt>0?(acc/cnt*0.5+0.5):0.5;

  var run=0;
  for (i=0;i<NBUCK;i++){ bStart[i]=run; run+=bCount[i]; }
  bStart[NBUCK]=run;
  bFill.fill(0);
  for (i=0;i<n;i++){
    var bb=bBuck[i];
    bOrder[bStart[bb]+bFill[bb]]=i;
    bFill[bb]++;
  }

  g.lineCap='round'; g.lineJoin='round';
  g.lineWidth=Math.max(0.8,SHORT*0.0016*(1/Math.max(0.6,B.dense)));
  var half=256/QQ/2;
  for (var bk2=0;bk2<NBUCK;bk2++){
    var c0=bCount[bk2];
    if (c0===0) continue;
    var rq=((bk2/(QQ*QQ))|0), gq=(((bk2/QQ)|0)%QQ), bq=bk2%QQ;
    g.strokeStyle='rgb('+Math.round(rq*256/QQ+half)+','+Math.round(gq*256/QQ+half)+','+Math.round(bq*256/QQ+half)+')';
    g.beginPath();
    var s0=bStart[bk2], s1=s0+c0;
    for (var q=s0;q<s1;q++){
      var ix=bOrder[q];
      g.moveTo(bx0[ix],by0[ix]);
      g.lineTo(bx1[ix],by1[ix]);
      g.lineTo(bx2[ix],by2[ix]);
    }
    g.stroke();
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════
function drawHand(k){
  var h=HAND[k];
  if (!handLive(k)||!h.L) return;
  var L=h.L, i, a, b;
  g.lineWidth=Math.max(1,SHORT*0.0018);
  g.strokeStyle=h.raised?'rgba(247,220,196,.7)':'rgba(244,236,224,.34)';
  g.beginPath();
  for (i=0;i<HC.length;i++){
    a=HC[i][0]; b=HC[i][1];
    if (!lmOK(L,a)||!lmOK(L,b)) continue;
    g.moveTo(sx(L[a].x),sy(L[a].y));
    g.lineTo(sx(L[b].x),sy(L[b].y));
  }
  g.stroke();
  for (i=0;i<5;i++){
    var x=h.cx[i], y=h.cy[i];
    if (!fin(x)||!fin(y)) continue;
    var r=SHORT*0.0085;
    g.strokeStyle=h.raised?'rgba(217,162,78,.95)':'rgba(244,236,224,.8)';
    g.lineWidth=Math.max(1.2,SHORT*0.0022);
    g.beginPath(); g.arc(x,y,r,0,TAU); g.stroke();
    var vx=x-h.ox[i], vy=y-h.oy[i];
    var m=Math.sqrt(vx*vx+vy*vy);
    if (m>SHORT*0.004){
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+vx/m*r*2.6,y+vy/m*r*2.6); g.stroke();
    }
  }
}
function render(t){
  g.fillStyle='#1c0b14'; g.fillRect(0,0,W,H);
  if (bodyCv){
    g.imageSmoothingEnabled=true;
    var rw=covS, rh=covS/camAspect;
    if (mirror){
      g.save(); g.translate(covOX+rw,covOY); g.scale(-1,1);
      g.drawImage(bodyCv,0,0,rw,rh); g.restore();
    } else {
      g.drawImage(bodyCv,covOX,covOY,rw,rh);
    }
  }
  drawStrands();
  drawHand(0); drawHand(1);

  if (raiseT>0.02){
    var cr=clamp(raiseT/0.5,0,1);
    g.strokeStyle='rgba(217,162,78,'+(0.3+cr*0.55).toFixed(3)+')';
    g.lineWidth=Math.max(1.5,SHORT*0.004);
    g.beginPath(); g.arc(W*0.5,H*0.5,SHORT*0.28*(1.25-cr*0.4),0,TAU*cr); g.stroke();
  }
  var el=t-gustT;
  if (el>=0&&el<1.3){
    var gp=clamp(el/1.15,0,1);
    var bandX=covOX+(mirror?(1-gp):gp)*covS;
    var grd=g.createLinearGradient(bandX-SHORT*0.16,0,bandX+SHORT*0.16,0);
    var al=clamp(1-el/1.15,0,1)*0.30;
    grd.addColorStop(0,'rgba(217,162,78,0)');
    grd.addColorStop(0.5,'rgba(247,220,196,'+al.toFixed(3)+')');
    grd.addColorStop(1,'rgba(217,162,78,0)');
    g.fillStyle=grd; g.fillRect(0,0,W,H);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP + adaptive resolution
// ═══════════════════════════════════════════════════════════════════════
var smoothMs=16, hudT=0, resT=0;
function frame(){
  var t=now();
  var dt=clamp(t-last,0.0005,0.05);
  last=t;
  var f0=now();
  updateCover();
  readControls();
  allocGrid(BASE_H);
  if (started){
    checkGust(t,dt);
    var e=combHands(dt);
    combE=combE*Math.pow(0.02,dt)+e*0.5;
    combE=clamp(combE,0,3);
  } else {
    combE*=Math.pow(0.1,dt);
  }
  stepGust(dt,t);
  relaxNap(dt);
  grabFrame();
  paintBody();
  render(t);
  audioUpdate(combE,meanSheen);

  var ms=(now()-f0)*1000;
  smoothMs=smoothMs*0.9+ms*0.1;
  resT+=dt;
  if (smoothMs>30){
    sN=Math.max(2600,Math.round(sN*0.94));
    if (sN<=3200&&BASE_H>86&&resT>1.5){ BASE_H=Math.max(86,BASE_H-6); resT=0; }
  } else if (smoothMs<19){
    sN=Math.min(SMAX,Math.round(sN*1.03)+40);
    if (sN>=SMAX-200&&BASE_H<150&&resT>2.5){ BASE_H=Math.min(150,BASE_H+6); resT=0; }
  }

  hudT+=dt;
  if (hudT>0.2){
    hudT=0;
    rS.textContent=String(Math.round(sN));
    rC.textContent=String(Math.round(clamp(combE,0,3)*100));
    rG.textContent=String(Math.round(clamp(meanSheen,0,1)*100));
  }
  raf(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════════════════
sndBtn.addEventListener('click',function(){ setSound(!soundOn); });
for (var bi=0;bi<3;bi++){
  (function(k){
    if (!boBtns[k]) return;
    boBtns[k].addEventListener('click',function(){
      boltIx=k;
      for (var j=0;j<3;j++){
        if (!boBtns[j]) continue;
        if (j===k) boBtns[j].classList.add('on'); else boBtns[j].classList.remove('on');
      }
    });
  })(bi);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM — five fingers combing five furrows into a swatch
// ═══════════════════════════════════════════════════════════════════════
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var demoRun=true, demoT0=now();
var DGX=52, DGY=18, dF=new Float32Array(DGX*DGY);
(function(){ for (var i=0;i<DGX*DGY;i++) dF[i]=0.586; })();
function demoFrame(){
  if (!demoCtx||!demoRun) return;
  var DW=demoCv.width, DH=demoCv.height;
  var t=now()-demoT0, cyc=t%8.6;
  demoCtx.fillStyle='#1c0b14'; demoCtx.fillRect(0,0,DW,DH);
  var cwp=DW/DGX, chp=(DH-40)/DGY, oy=34;
  var hx=-999, hy=DH*0.55;
  if (cyc>0.6&&cyc<4.2){
    var f=(cyc-0.6)/3.6;
    hx=DW*0.1+f*DW*0.8; hy=DH*0.35+Math.sin(f*3.1)*DH*0.2;
  }
  var i,x,y;
  var gust=(cyc>6.0&&cyc<7.4)?clamp((cyc-6.0)/1.15,0,1):-1;
  for (y=0;y<DGY;y++){
    for (x=0;x<DGX;x++){
      i=y*DGX+x;
      var px2=x*cwp+cwp*0.5, py2=oy+y*chp+chp*0.5;
      dF[i]+=(0.586-dF[i])*0.012;
      if (hx>-500){
        for (var fg=0;fg<5;fg++){
          var fxp=hx+(fg-2)*12, fyp=hy+Math.abs(fg-2)*3;
          var dd=Math.sqrt((px2-fxp)*(px2-fxp)+(py2-fyp)*(py2-fyp));
          if (dd<16){ dF[i]+=(-0.5-dF[i])*(1-dd/16)*0.5; }
        }
      }
      if (gust>=0){
        var gd=Math.abs(px2/DW-gust);
        if (gd<0.12) dF[i]+=(-2.5-dF[i])*(1-gd/0.12)*0.4;
      }
      var dot=Math.cos(dF[i])*0.55+Math.sin(dF[i])*-0.83;
      var m=clamp(1+0.95*dot,0.1,2.1);
      var base=[120,52,72];
      demoCtx.strokeStyle='rgb('+Math.round(clamp(base[0]*m+(dot>0?dot*dot*110:0),0,255))+','
        +Math.round(clamp(base[1]*m+(dot>0?dot*dot*82:0),0,255))+','
        +Math.round(clamp(base[2]*m+(dot>0?dot*dot*40:0),0,255))+')';
      demoCtx.lineWidth=2.4;
      demoCtx.beginPath();
      demoCtx.moveTo(px2,py2);
      demoCtx.lineTo(px2+Math.cos(dF[i])*11,py2+Math.sin(dF[i])*11);
      demoCtx.stroke();
    }
  }
  if (hx>-500){
    demoCtx.strokeStyle='rgba(244,236,224,.9)'; demoCtx.lineWidth=2;
    for (var fg2=0;fg2<5;fg2++){
      var fx2=hx+(fg2-2)*12, fy2=hy+Math.abs(fg2-2)*3;
      demoCtx.beginPath(); demoCtx.arc(fx2,fy2,4.5,0,TAU); demoCtx.stroke();
    }
  }
  var label=cyc<4.2?'指で撫でると、その向きに毛が寝る'
           :(cyc<6.0?'光を向いた毛だけが明るい ── 刈り跡が残る'
           :'両手を上へ ── 一陣');
  demoCtx.fillStyle=(cyc<6.0)?'rgba(244,236,224,.9)':'rgba(217,162,78,1)';
  demoCtx.font='15px "Klee One", serif';
  demoCtx.textAlign='center';
  demoCtx.fillText(label,DW/2,20);
  raf(demoFrame);
}
if (demoCtx) demoFrame();

startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  initHands();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
updateCover();
readControls();
setSound(true);
last=now();
frame();
</script>
