<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="カメラが長時間露光の写真機になる。動いたぶんだけ体が絹のように流れて尾を引き、止まっているところはくっきり残る。いまの自分だけは鮮明に重なる、後幕シンクロの一枚。">
<meta name="theme-color" content="#0b1017">
<title>ROKOU ─ 動いたぶんだけ流れる、長時間露光</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  ROKOU 露光 ─ 動いたぶんだけ流れる、長時間露光     ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       ファッションフィルムの夜のワンカット。シャッターを開けたままの
             カメラの前で、動いた腕や髪が絹のような光の尾になって流れ、止ま
             っている部屋はくっきり残る。いまの自分だけがストロボを浴びた
             ように鮮明に重なる ── 後幕シンクロの写真。
  PALETTE    DUSK    影 #0b1017（青墨）→ 中間 #5d6f82 → 光 #e6ecef（銀）
             SILVER  完全なモノクロ（#0a0a0a → #efefef）
             TUNGSTEN影 #140e0a → 光 #f1e2c8（くすんだ琥珀）
             彩度は全配色で 15% 以下に落とす。原色は使わない。
  TYPE       Hanken Grotesk 300（字間を広げた小さな大文字）・Newsreader Italic。
             UI は画面の端に小さく、映像に譲る。
  MOTION     すべて連続的でゆっくり。露光の尾は 0.4〜4 秒で消える（シャッター
             スライダー）。フラッシュ・揺れは使わない。
  SIGNATURE  流れる過去と、鮮明な現在が一枚に同居すること。
  TECH       WebGL2。浮動小数の蓄積バッファ（EXT_color_buffer_float、無ければ
             RGBA8）に毎フレーム「少しだけぼかした前フレーム」と今の映像を
             混ぜ、明るいところは長く残す（max 保持）。表示パスで人物マスク
             の範囲だけ今の映像を重ね、スプリットトーン・ハレーション・粒子・
             周辺減光をかける。マスクが無くても長時間露光として成立する。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;500&family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1017;--fg:#e6ecef;--dim:rgba(230,236,239,.55);--line:rgba(230,236,239,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
  font-family:"Hanken Grotesk",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:300}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:28px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#16202b 0%,#0b1017 70%)}
#start .t{font-size:11px;letter-spacing:.6em;margin-right:-.6em;color:var(--dim)}
#start h1{margin:0;font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:300;font-size:min(20vw,112px);line-height:1;letter-spacing:-.01em}
#start p{margin:0;font-size:13px;line-height:2;color:var(--dim);letter-spacing:.08em}
#go{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:500 10px "Hanken Grotesk",sans-serif;
  letter-spacing:.5em;padding:15px 36px 15px 42px;cursor:pointer;transition:border-color .3s}
#go:hover{border-color:var(--fg)}
#err{font-size:12px;line-height:1.8;max-width:340px;min-height:1em;white-space:pre-line;color:#d9a3a3}

.btn{position:fixed;z-index:12;appearance:none;border:0;background:transparent;color:var(--fg);font:500 10px "Hanken Grotesk","Hiragino Sans",sans-serif;
  letter-spacing:.3em;padding:10px 8px;display:none;cursor:pointer;opacity:.6;transition:opacity .3s}
.btn.show{display:block}
.btn:hover{opacity:1}
#gear{right:10px;top:calc(env(safe-area-inset-top) + 6px);font-size:14px;letter-spacing:0}
#flip{right:10px;top:calc(env(safe-area-inset-top) + 40px);letter-spacing:.12em}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:12;display:none;justify-content:center;align-items:center;gap:28px}
#bar.show{display:flex}
#bar .btn{position:static;display:block}
#bar #shoot{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--fg);padding:0;opacity:.7}
#shoot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--fg);opacity:.85}
#rec.on{opacity:1;color:#e07a7a}
#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 14px);z-index:11;font-size:9px;letter-spacing:.34em;color:var(--dim);
  pointer-events:none;display:none;line-height:2}
#hud.show{display:block}
#status{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:11;font-size:11px;letter-spacing:.04em;
  color:var(--dim);pointer-events:none;max-width:72vw;line-height:1.7;white-space:pre-line}

#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 78px);z-index:12;width:min(270px,calc(100vw - 20px));
  background:rgba(11,16,23,.86);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:13px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .25s}
#panel.hide{opacity:0;pointer-events:none}
.chips{display:flex;border:1px solid var(--line)}
.chips button{flex:1;appearance:none;border:0;background:transparent;color:var(--fg);padding:8px 2px;font:500 9px "Hanken Grotesk",sans-serif;
  letter-spacing:.2em;cursor:pointer;opacity:.55}
.chips button.on{opacity:1;background:rgba(230,236,239,.12)}
#panel label{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.06em}
#panel label span{width:74px;flex:none;color:var(--dim)}
#panel input[type=range]{flex:1;accent-color:#b9c6cf}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="clear" class="btn">CLEAR</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">DUSK</button>
    <button data-p="1">SILVER</button>
    <button data-p="2">TUNGSTEN</button>
  </div>
  <label><span>シャッター</span><input type="range" id="sShut" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>光の残り</span><input type="range" id="sGlow" min="0" max="1" step="0.01" value="0.6"></label>
  <label><span>いまの自分</span><input type="range" id="sNow" min="0" max="1" step="0.01" value="0.7"></label>
  <label><span>粒子</span><input type="range" id="sGrain" min="0" max="1" step="0.01" value="0.45"></label>
</div>

<div id="start">
  <div class="t">LONG EXPOSURE</div>
  <h1>Rokou</h1>
  <p>シャッターを開けたままのカメラ。<br>動いたぶんだけ、あなたが流れる。</p>
  <button id="go">OPEN SHUTTER</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   ROKOU — float accumulation buffer = an open shutter. Moving parts
   smear into soft trails (highlights linger), still parts stay sharp,
   and the person's present is laid on top like a rear-curtain flash.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam');

const PALS = [ // shadow, mid, light (linear-ish 0..1), saturation kept, css
  { name:'DUSK',     sh:[.043,.063,.090], mid:[.365,.435,.510], hi:[.902,.925,.937], sat:.14, bg:'#0b1017', fg:'#e6ecef' },
  { name:'SILVER',   sh:[.039,.039,.039], mid:[.46,.46,.46],    hi:[.937,.937,.937], sat:0,   bg:'#0a0a0a', fg:'#efefef' },
  { name:'TUNGSTEN', sh:[.078,.055,.039], mid:[.50,.42,.33],    hi:[.945,.886,.784], sat:.12, bg:'#140e0a', fg:'#f1e2c8' },
];
const S = { pal:0, shut:0.55, glow:0.6, now:0.7, grain:0.45 };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
let floatOK = false;

const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

// pass 1: accumulate (screen space, y up)
const FS_ACC = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uPrev, uVid;
uniform vec2 uScale, uTexel;
uniform float uMirror, uA, uKeep, uReset;
vec3 cam(vec2 s){
  vec2 v = (vec2(s.x, 1. - s.y) - .5) * uScale + .5;
  if (uMirror > .5) v.x = 1. - v.x;
  return texture(uVid, v).rgb;
}
void main(){
  vec3 cur = cam(uv);
  if (uReset > .5){ o = vec4(cur, 1.); return; }
  // a slightly diffused previous frame: trails turn to silk instead of stepping copies
  vec3 p = texture(uPrev, uv).rgb * .4
         + (texture(uPrev, uv + vec2(uTexel.x, 0.)).rgb + texture(uPrev, uv - vec2(uTexel.x, 0.)).rgb
          + texture(uPrev, uv + vec2(0., uTexel.y)).rgb + texture(uPrev, uv - vec2(0., uTexel.y)).rgb) * .15;
  vec3 avg = mix(p, cur, uA);
  // highlights linger longer than shadows (light keeps writing onto the film)
  vec3 keep = p * uKeep;
  o = vec4(max(avg, keep), 1.);
}`;

// pass 2: present + grade
const FS_OUT = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uAcc, uVid, uMask;
uniform vec2 uScale, uRes, uTexel;
uniform float uMirror, uNow, uHas, uGrain, uT, uSat, uBars;
uniform vec3 uSh, uMid, uHi;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
float lum(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
void main(){
  vec2 v = (vec2(uv.x, 1. - uv.y) - .5) * uScale + .5;
  if (uMirror > .5) v.x = 1. - v.x;
  vec3 acc = texture(uAcc, uv).rgb;
  vec3 cur = texture(uVid, v).rgb;
  float m = uHas > .5 ? smoothstep(.4, .75, texture(uMask, v).r) : 0.;
  vec3 c = mix(acc, cur, m * uNow);                       // rear-curtain: the present, crisp
  // halation: a soft bloom of the brightest trails
  vec3 b = vec3(0.);
  for (int i = 0; i < 8; i++){
    float a = float(i) * .785398;
    vec3 s = texture(uAcc, uv + vec2(cos(a), sin(a)) * uTexel * 9.).rgb;
    b += max(s - .62, 0.);
  }
  c += b * .16;
  // grade: contrast curve on luminance, split-tone through three anchors, keep a little of the colour
  float l = clamp(lum(c), 0., 1.);
  l = smoothstep(.05, .95, l);
  l = mix(l, l*l*(3. - 2.*l), .7);                        // a second, gentler S: deeper blacks
  vec3 tone = l < .5 ? mix(uSh, uMid, l*2.) : mix(uMid, uHi, (l - .5)*2.);
  vec3 chroma = c - vec3(lum(c));
  vec3 g = tone + chroma * uSat;
  // vignette + grain
  vec2 q = uv - .5; q.x *= uRes.x / uRes.y;
  g *= 1. - .55 * smoothstep(.35, 1.05, length(q));
  float n = h21(floor(gl_FragCoord.xy / 1.5) + fract(uT * 7.13) * 91.7) - .5;
  g += n * uGrain * .09 * (1. - l*.5);
  // cinema bars in landscape
  if (uBars > 0. && abs(uv.y - .5) > .5 - uBars) g = uSh * .45;
  o = vec4(clamp(g, 0., 1.), 1.);
}`;

function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(fs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
let PA, PO, texVid, texMask, acc = [null, null], fbo = [null, null], accW = 0, accH = 0, ping = 0, needReset = true;
function tex(filter){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
function initGL(){
  floatOK = !!gl.getExtension('EXT_color_buffer_float');
  gl.getExtension('OES_texture_float_linear');
  PA = prog(FS_ACC); PO = prog(FS_OUT);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  texVid = tex(gl.LINEAR); texMask = tex(gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
}
function ensureAcc(w, h){
  if (w === accW && h === accH) return;
  accW = w; accH = h;
  for (let i = 0; i < 2; i++){
    if (acc[i]) gl.deleteTexture(acc[i]); if (fbo[i]) gl.deleteFramebuffer(fbo[i]);
    acc[i] = tex(gl.LINEAR);
    if (floatOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    fbo[i] = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[i]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, acc[i], 0);
    if (floatOK && gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE){ floatOK = false; accW = 0; gl.bindFramebuffer(gl.FRAMEBUFFER, null); return ensureAcc(w, h); }
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  needReset = true;
}

/* ---------- mask (reused buffers) ---------- */
const M = { w:0, h:0, f:null, u8:null, present:false, cover:0, has:false, external:false };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || data.length < w*h) return;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.f = new Float32Array(w*h); M.u8 = new Uint8Array(w*h); }
  const F = M.f, U8 = M.u8; let on = 0;
  for (let i = 0, n = w*h; i < n; i++){
    let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1;
    F[i] = F[i]*.35 + m*.65; U8[i] = F[i]*255 | 0; if (F[i] > .5) on++;
  }
  M.cover = on/(w*h); M.present = M.cover > .006; M.has = true;
  if (gl && texMask){ gl.bindTexture(gl.TEXTURE_2D, texMask); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, U8); }
}

/* ---------- MediaPipe (dynamic import; the long exposure works without it) ---------- */
let segmenter = null, lastTs = 0, lastVT = -1;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    setStatus('');
  }catch(e){
    if (M.external) return;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n長時間露光だけで続けます。');
  }
}
function segment(now){
  if (!segmenter || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastVT) return; lastVT = vt;
  try{
    const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks;
      if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1];                  // 2 masks → [0] is background, [1] is the person
      ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
    });
  }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  needReset = true;
}

/* ---------- audio: only the shutter (AudioContext is opened from the start button) ---------- */
let actx = null, bus = null, recDest = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .4; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  actx.resume().catch(()=>{});
}
function click(){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, len = actx.sampleRate*.025 | 0, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 5);
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 1.2;
  s.connect(f); f.connect(bus); s.start(t);
}

$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!PA) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','clear','hud'].forEach(id => $(id).classList.add('show'));
  if (!started){ started = true; initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('clear').onclick = () => { needReset = true; click(); };
function setPal(i){
  S.pal = i; const p = PALS[i];
  [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
  document.documentElement.style.setProperty('--bg', p.bg); document.documentElement.style.setProperty('--fg', p.fg);
}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sShut','shut'],['sGlow','glow'],['sNow','now'],['sGrain','grain']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

$('shoot').onclick = () => {
  click();
  try{
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'rokou-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'rokou.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
let lastT = 0, hudT = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; needReset = true; }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1500 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  const aw = Math.max(64, Math.round(W*.6)), ah = Math.max(64, Math.round(H*.6));
  ensureAcc(aw, ah);
  if (!M.external) segment(now);
  if (video.readyState < 2) return;

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texVid);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; }
  const sa = W/H, va = vidW/vidH, sx = sa < va ? sa/va : 1, sy = sa < va ? 1 : va/sa;

  // shutter: time constant 0.35 s … 4 s, frame-rate independent
  const tau = .35 * Math.pow(11.5, S.shut);
  const a = 1 - Math.exp(-dt / tau);
  const tauHi = tau * (1 + 2.2*S.glow);
  const keep = S.glow > 0 ? Math.exp(-dt / tauHi) : 0;

  // pass 1: accumulate into the other buffer
  const src = ping, dst = 1 - ping;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[dst]); gl.viewport(0, 0, aw, ah);
  gl.useProgram(PA.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, acc[src]);
  gl.uniform1i(PA.U.uPrev, 0); gl.uniform1i(PA.U.uVid, 1);
  gl.uniform2f(PA.U.uScale, sx, sy); gl.uniform2f(PA.U.uTexel, .6/aw, .6/ah);
  gl.uniform1f(PA.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PA.U.uA, floatOK ? a : Math.max(a, .06));
  gl.uniform1f(PA.U.uKeep, floatOK ? keep : Math.min(keep, .93)); gl.uniform1f(PA.U.uReset, needReset ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  needReset = false; ping = dst;

  // pass 2: present
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(PO.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, acc[dst]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.uniform1i(PO.U.uAcc, 0); gl.uniform1i(PO.U.uVid, 1); gl.uniform1i(PO.U.uMask, 2);
  gl.uniform2f(PO.U.uScale, sx, sy); gl.uniform2f(PO.U.uRes, W, H); gl.uniform2f(PO.U.uTexel, 1/aw, 1/ah);
  gl.uniform1f(PO.U.uMirror, mirror ? 1 : 0); gl.uniform1f(PO.U.uNow, S.now);
  gl.uniform1f(PO.U.uHas, M.has && M.present ? 1 : 0); gl.uniform1f(PO.U.uGrain, S.grain); gl.uniform1f(PO.U.uT, now/1000);
  const pal = PALS[S.pal];
  gl.uniform1f(PO.U.uSat, pal.sat); gl.uniform3fv(PO.U.uSh, pal.sh); gl.uniform3fv(PO.U.uMid, pal.mid); gl.uniform3fv(PO.U.uHi, pal.hi);
  gl.uniform1f(PO.U.uBars, W > H*1.3 ? Math.max(0, .5 - (W/2.39)/H/2) : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  hudT += dt;
  if (hudT > .25){ hudT = 0;
    $('hud').textContent = 'EXPOSURE ' + tau.toFixed(1) + ' S\n' + pal.name + (M.present ? ' · SUBJECT' : ''); }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__ROKOU = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; ingestMask(d, w, h); },
  palette(i){ setPal(i); },
  state: () => ({ present:M.present, cover:M.cover, floatOK, accW, accH }),
};
</script>
</body>
</html>
