<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>

  SHABON ─ 押せるシャボン玉                               ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  ORIGIN     オーナーが持ち込んだ完成品（shabon.html、画面上のタイトル「SHABON」）。
             玉・膜・屈折・押し心地・音・配色・書体はオーナーの設計のまま。画廊に揃えたのは
             開始画面（音とカメラはここで始まる）・⟲ カメラ・⚙ で隠せる調整パネル・

  MOOD       景色の前に大きなシャボン玉がひとつ。押すと指の形にへこみ、離すとぷるんと
             揺れ戻る。触らずにいると見えない手がにぎにぎする。
  PALETTE    地 #0b0d0c ／ 膜の干渉色（厚さ 250〜1500nm、屈折率 1.33）／ 差し色 #ff9bd2・#8ff5d4
  TYPE       Zen Maru Gothic（オーナーの指定のまま）

             裏の膜→表の膜の 2 パスで屈折と薄膜干渉。背景は既定で背面カメラ。
  ══════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const canvas = document.getElementById('stage');
const toastEl = document.getElementById('toast');
const hintEl = document.getElementById('hint');
let toastTimer = 0;
function toast(msg, ms = 4200){
  toastEl.textContent = msg; toastEl.classList.remove('off');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.add('off'), ms);
}
const errEl = document.getElementById('err');
if (!window.THREE){ errEl.textContent = '3D描画ライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。'; document.getElementById('go').disabled = true; return; }

/* ---------- renderer ---------- */
let renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:'high-performance'});
}catch(e){ errEl.textContent = 'この端末ではWebGLが使えないため表示できません。'; document.getElementById('go').disabled = true; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.autoClear = false;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
camera.position.set(0, 0, 5);
const quadCam = new THREE.Camera();
const rt = new THREE.WebGLRenderTarget(4, 4, {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, depthBuffer:true});

/* ---------- background sources ---------- */
function makeGardenCanvas(){
  // low-res on purpose: linear upscaling gives a soft, out-of-focus garden
  const c = document.createElement('canvas'); c.width = 300; c.height = 540;
  const g = c.getContext('2d');
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const grad = g.createLinearGradient(0, 0, 0, c.height);
  grad.addColorStop(0, '#2f4a24'); grad.addColorStop(.55, '#3d5a2a'); grad.addColorStop(1, '#5b4a35');
  g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  // soil patches
  for (let i = 0; i < 40; i++){
    g.fillStyle = `rgba(${110+rnd()*40|0},${90+rnd()*30|0},${60+rnd()*25|0},${.25+rnd()*.35})`;
    g.beginPath(); g.ellipse(rnd()*c.width, c.height*(.55+rnd()*.5), 10+rnd()*40, 6+rnd()*20, rnd()*3, 0, 7); g.fill();
  }
  // leaves
  const greens = ['#4f7a2e','#6a9a3a','#86b24a','#3c6326','#9cc25a','#c9d86a','#2d4d1e','#a8b84a'];
  for (let i = 0; i < 260; i++){
    const x = rnd()*c.width, y = rnd()*c.height*.8;
    g.save(); g.translate(x, y); g.rotate(rnd()*Math.PI*2);
    g.fillStyle = greens[(rnd()*greens.length)|0]; g.globalAlpha = .55 + rnd()*.45;
    const w = 6 + rnd()*16, h = 4 + rnd()*9;
    g.beginPath(); g.moveTo(-w,0); g.quadraticCurveTo(0,-h,w,0); g.quadraticCurveTo(0,h,-w,0); g.fill();
    g.restore();
  }
  // a few yellowing leaves and two daisies
  for (let i = 0; i < 18; i++){
    g.fillStyle = `rgba(${200+rnd()*40|0},${190+rnd()*40|0},${70+rnd()*40|0},.8)`;
    g.beginPath(); g.ellipse(rnd()*c.width, c.height*(.2+rnd()*.7), 6+rnd()*12, 4+rnd()*7, rnd()*3, 0, 7); g.fill();
  }
  [[210,120,15],[60,300,11]].forEach(([x,y,r]) => {
    g.globalAlpha = .95;
    for (let k = 0; k < 18; k++){ g.save(); g.translate(x,y); g.rotate(k/18*Math.PI*2);
      g.fillStyle = '#f2efe6'; g.beginPath(); g.ellipse(r*.75,0,r*.6,r*.18,0,0,7); g.fill(); g.restore(); }
    g.fillStyle = '#6b5320'; g.beginPath(); g.arc(x,y,r*.38,0,7); g.fill();
  });
  g.globalAlpha = 1;
  // light from upper left
  const lg = g.createRadialGradient(40, 40, 10, 40, 40, 380);
  lg.addColorStop(0, 'rgba(255,250,220,.28)'); lg.addColorStop(1, 'rgba(255,250,220,0)');
  g.fillStyle = lg; g.fillRect(0, 0, c.width, c.height);
  // step down twice so the linear upscale reads as out-of-focus bokeh
  const m = document.createElement('canvas'); m.width = 170; m.height = 306;
  m.getContext('2d').drawImage(c, 0, 0, m.width, m.height);
  const o = document.createElement('canvas'); o.width = 110; o.height = 198;
  o.getContext('2d').drawImage(m, 0, 0, o.width, o.height);
  return o;
}
const gardenTex = new THREE.CanvasTexture(makeGardenCanvas());
gardenTex.minFilter = THREE.LinearFilter;
let bgTex = gardenTex, bgW = 300, bgH = 540, bgMirror = false;

const video = document.createElement('video');
video.setAttribute('playsinline', ''); video.muted = true; video.autoplay = true;
let videoTex = null, stream = null, facing = 'environment';   // owner's choice: the bubble floats in front of the world

const cover = new THREE.Vector4(1, 1, 0, 0);
function updateCover(){
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const sa = size.x / size.y, ta = bgW / bgH;
  let sx = 1, sy = 1;
  if (ta > sa) sx = sa / ta; else sy = ta / sa;
  let ox = (1 - sx) / 2, oy = (1 - sy) / 2;
  if (bgMirror){ ox = ox + sx; sx = -sx; }
  cover.set(sx, sy, ox, oy);
}

/* ---------- shaders ---------- */
const SNOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const BUBBLE_VERT = `
uniform vec4 uDents[8];
uniform float uDentR[8];
uniform float uModes[9];
uniform float uTime;
uniform float uRipple;
uniform float uInflate;
varying vec3 vNView;
varying vec3 vPosView;
varying float vD;
${SNOISE}
float dentShape(float s){ return exp(-s*s) - 0.2*exp(-(s-1.6)*(s-1.6)*2.2); }
float disp(vec3 n){
  float r = 1.0 + uInflate;
  r += uModes[0]*(n.x*n.x - n.y*n.y);
  r += uModes[1]*(2.0*n.z*n.z - n.x*n.x - n.y*n.y)*0.5;
  r += uModes[2]*(n.x*n.y)*2.0;
  r += uModes[3]*(n.x*n.z)*2.0;
  r += uModes[4]*(n.y*n.z)*2.0;
  r += uModes[5]*n.x*(n.x*n.x - 3.0*n.y*n.y);
  r += uModes[6]*n.y*(3.0*n.x*n.x - n.y*n.y);
  r += uModes[7]*n.z*(n.x*n.x - n.y*n.y)*2.0;
  r += uModes[8]*n.z*(2.0*n.z*n.z - 3.0*n.x*n.x - 3.0*n.y*n.y)*0.5;
  r += uRipple * snoise(n*2.3 + vec3(0.0, uTime*0.4, uTime*0.25));
  for (int i = 0; i < 8; i++){
    vec4 d = uDents[i];
    if (abs(d.w) < 1e-4) continue;
    float a = acos(clamp(dot(n, d.xyz), -1.0, 1.0)) / uDentR[i];
    r -= d.w * dentShape(a);
  }
  return r;
}
float thinning(vec3 n){
  float t = 0.0;
  for (int i = 0; i < 8; i++){
    vec4 d = uDents[i];
    if (abs(d.w) < 1e-4) continue;
    float a = acos(clamp(dot(n, d.xyz), -1.0, 1.0)) / uDentR[i];
    t += d.w * exp(-a*a*0.6);
  }
  return t;
}
float thickness(vec3 p, float thin){
  vec3 q = p*0.85 + vec3(0.0, uTime*0.04, 0.0);
  vec3 w = vec3(snoise(q + vec3(0.0, uTime*0.06, 0.0)),
                snoise(q + vec3(5.2, 1.3, uTime*0.05)),
                snoise(q + vec3(2.0, 7.0 - uTime*0.04, 3.0)));
  float n1 = snoise(q*1.1 + w*1.1 + vec3(uTime*0.03));
  float n2 = snoise(q*2.2 + w*1.4);
  float d = 860.0 + 230.0*n1 + 55.0*n2 - 170.0*p.y;
  d += thin * 700.0 * snoise(q*1.8 + w + 9.0);
  return clamp(d, 250.0, 1500.0);
}
void main(){
  vec3 n = normalize(position);
  vec3 up = abs(n.y) < 0.98 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
  vec3 t1 = normalize(cross(n, up));
  vec3 t2 = cross(n, t1);
  float e = 0.014;
  vec3 p  = n * disp(n);
  vec3 n1 = normalize(n + t1*e); vec3 p1 = n1 * disp(n1);
  vec3 n2 = normalize(n + t2*e); vec3 p2 = n2 * disp(n2);
  vec3 nrm = normalize(cross(p1 - p, p2 - p));
  if (dot(nrm, n) < 0.0) nrm = -nrm;
  vD = thickness(n, thinning(n));
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  vPosView = mv.xyz;
  vNView = normalize(normalMatrix * nrm);
  gl_Position = projectionMatrix * mv;
}`;

const FILM = `
vec3 filmColor(float d, float cosT){
  float n = 1.33;
  float cosR = sqrt(max(0.0, 1.0 - (1.0 - cosT*cosT)/(n*n)));
  vec3 lam = vec3(640.0, 535.0, 455.0);
  vec3 ph = 12.566370614 * n * d * cosR / lam;
  vec3 c = 0.5 - 0.5*cos(ph);
  float l = dot(c, vec3(0.3333));
  c = mix(vec3(l), c, 1.12);
  return clamp(c, 0.0, 1.0);
}`;

// Back wall of the bubble, drawn into the scene buffer over the background.
const BACK_FRAG = `
uniform sampler2D uBg; uniform vec4 uCover; uniform vec2 uRes; uniform float uRefract;
varying vec3 vNView; varying vec3 vPosView; varying float vD;
${FILM}
vec3 bg(vec2 uv){ return texture2D(uBg, uv*uCover.xy + uCover.zw).rgb; }
void main(){
  vec3 N = -normalize(vNView);
  vec3 V = normalize(-vPosView);
  float cosT = clamp(dot(N, V), 0.0, 1.0);
  vec2 suv = gl_FragCoord.xy / uRes;
  vec2 off = N.xy * uRefract * 0.55;
  vec3 col = bg(suv + off);
  vec3 film = filmColor(vD, cosT);
  float F = pow(1.0 - cosT, 2.2);
  float refl = mix(0.1, 0.55, F);
  float lum = dot(col, vec3(0.3, 0.59, 0.11));
  col = col*(1.0 - refl*0.35) + film*refl*(0.5 + 0.6*lum);
  gl_FragColor = vec4(col, 1.0);
}`;

// Front wall: refracts the scene buffer (background + back wall) and adds the film.
const FRONT_FRAG = `
uniform sampler2D uScene; uniform sampler2D uBg; uniform vec4 uCover; uniform vec2 uRes; uniform float uRefract;
varying vec3 vNView; varying vec3 vPosView; varying float vD;
${FILM}
void main(){
  vec3 N = normalize(vNView);
  vec3 V = normalize(-vPosView);
  float cosT = clamp(dot(N, V), 0.0, 1.0);
  vec2 suv = gl_FragCoord.xy / uRes;
  vec2 off = N.xy * uRefract * (0.55 + 0.9*(1.0 - cosT));
  vec3 refr;
  refr.r = texture2D(uScene, suv + off*1.06).r;
  refr.g = texture2D(uScene, suv + off).g;
  refr.b = texture2D(uScene, suv + off*0.94).b;
  vec3 film = filmColor(vD, cosT);
  float F = pow(1.0 - cosT, 2.4);
  float refl = mix(0.15, 0.95, F);
  vec3 R = reflect(-V, N);
  vec2 euv = vec2(0.5 - R.x*0.38, 0.5 + R.y*0.38);
  vec3 env = texture2D(uBg, euv*uCover.xy + uCover.zw).rgb;
  float envL = dot(env, vec3(0.3, 0.59, 0.11));
  vec3 col = refr*(1.0 - refl*0.42) + film*refl*(0.55 + 0.75*envL) + env*film*refl*0.25;
  col *= mix(vec3(1.0), 0.82 + 0.36*film, 0.3);
  float rim = smoothstep(0.62, 0.99, 1.0 - cosT);
  col = mix(col, film*0.85 + vec3(0.32, 0.1, 0.2), rim*0.5);
  vec3 L1 = normalize(vec3(-0.45, 0.75, 0.5));
  vec3 L2 = normalize(vec3(0.6, -0.3, 0.75));
  float s = pow(max(dot(R, L1), 0.0), 70.0)*0.55 + pow(max(dot(R, L2), 0.0), 140.0)*0.22;
  col += s*(0.7 + 0.3*film);
  gl_FragColor = vec4(col, 1.0);
}`;

const QUAD_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

/* ---------- materials & meshes ---------- */
const NDENT = 8, NMODE = 9;
const dentU = Array.from({length:NDENT}, () => new THREE.Vector4(0, 0, 1, 0));
const dentR = new Array(NDENT).fill(0.4);
const modeU = new Array(NMODE).fill(0);
const res = new THREE.Vector2(1, 1);
const shared = {
  uDents:{value:dentU}, uDentR:{value:dentR}, uModes:{value:modeU},
  uTime:{value:0}, uRipple:{value:0.006}, uInflate:{value:0},
  uBg:{value:bgTex}, uCover:{value:cover}, uRes:{value:res}, uRefract:{value:0.075},
  uScene:{value:rt.texture}
};
const backMat = new THREE.ShaderMaterial({uniforms:shared, vertexShader:BUBBLE_VERT, fragmentShader:BACK_FRAG, side:THREE.BackSide});
const frontMat = new THREE.ShaderMaterial({uniforms:shared, vertexShader:BUBBLE_VERT, fragmentShader:FRONT_FRAG, side:THREE.FrontSide});

const bubble = new THREE.Mesh(new THREE.SphereGeometry(1, 200, 140), frontMat);
bubble.frustumCulled = false;
const bubbleScene = new THREE.Scene(); bubbleScene.add(bubble);

const quadGeo = new THREE.PlaneGeometry(2, 2);
const bgMat = new THREE.ShaderMaterial({
  uniforms:{uTex:{value:bgTex}, uCover:{value:cover}},
  vertexShader:QUAD_VERT,
  fragmentShader:`uniform sampler2D uTex; uniform vec4 uCover; varying vec2 vUv;
    void main(){ gl_FragColor = vec4(texture2D(uTex, vUv*uCover.xy + uCover.zw).rgb, 1.0); }`,
  depthTest:false, depthWrite:false
});
const copyMat = new THREE.ShaderMaterial({
  uniforms:{uTex:{value:rt.texture}}, vertexShader:QUAD_VERT,
  fragmentShader:`uniform sampler2D uTex; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(uTex, vUv).rgb, 1.0); }`,
  depthTest:false, depthWrite:false
});
const bgQuad = new THREE.Mesh(quadGeo, bgMat); bgQuad.frustumCulled = false;
const copyQuad = new THREE.Mesh(quadGeo, copyMat); copyQuad.frustumCulled = false;
const bgScene = new THREE.Scene(); bgScene.add(bgQuad);
const copyScene = new THREE.Scene(); copyScene.add(copyQuad);

function setBackground(tex, w, h, mirror){
  bgTex = tex; bgW = w; bgH = h; bgMirror = !!mirror;
  bgMat.uniforms.uTex.value = tex; shared.uBg.value = tex;
  updateCover();
}

/* ---------- layout ---------- */
let R = 1, viewW = 1, viewH = 1, sizeK = 1;
const center = new THREE.Vector3(0, -0.15, 0), centerTarget = center.clone(), centerVel = new THREE.Vector3();
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(size.x, size.y); res.set(size.x, size.y);
  viewH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  viewW = viewH * camera.aspect;
  R = Math.min(viewW, viewH) * 0.37 * sizeK;
  updateCover();
}
window.addEventListener('resize', resize);
resize();

/* ---------- soft body state ---------- */
const dents = Array.from({length:NDENT}, () => ({
  active:false, dir:new THREE.Vector3(0,0,1), depth:0, vel:0, target:0, rad:0.4,
  pressing:false, pointerId:null, sx:0, sy:0, auto:false, releaseAt:0, born:0, base:0
}));
const modeVel = new Array(NMODE).fill(0);
const modeK = [170,170,170,170,170,340,340,340,340];

function freeSlot(){
  let best = null;
  for (const d of dents){ if (!d.active) return d; }
  for (const d of dents){ if (!d.pressing && (!best || Math.abs(d.depth) < Math.abs(best.depth))) best = d; }
  return best;
}
function kickModes(amount){
  for (let i = 0; i < NMODE; i++) modeVel[i] += (Math.random() - 0.5) * amount;
}

/* ---------- picking ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const sphere = new THREE.Sphere();
const tmpV = new THREE.Vector3();
const zPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
function rayFrom(x, y){
  const r = canvas.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray;
}
function hitLocal(x, y, out){
  const ray = rayFrom(x, y);
  sphere.set(center, R * 1.02);
  if (!ray.intersectSphere(sphere, tmpV)) return false;
  bubble.updateMatrixWorld();
  out.copy(tmpV); bubble.worldToLocal(out); out.normalize();
  return true;
}

/* ---------- sound ---------- */
let actx = null, master = null, soundOn = true, recDest = null;
const SCALE = [0, 2, 4, 7, 9];
function ensureAudio(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC();
  const comp = actx.createDynamicsCompressor();
  master = actx.createGain(); master.gain.value = 0.55;
  master.connect(comp); comp.connect(actx.destination);
  try{ recDest = actx.createMediaStreamDestination(); comp.connect(recDest); }catch(e){ recDest = null; }   // so the squish and boing are in the recording
}
function noteFor(dir){
  const ang = (Math.atan2(dir.x, dir.z) + Math.PI) / (Math.PI * 2);
  const idx = Math.floor(ang * 5) % 5;
  const oct = dir.y > 0.33 ? 1 : dir.y < -0.33 ? -1 : 0;
  return 261.63 * Math.pow(2, (SCALE[idx] + 12 * oct) / 12);
}
function squish(freq, vol){
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
  o.type = 'sine'; o.frequency.setValueAtTime(freq * 1.6, t); o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + 0.16);
  lp.type = 'lowpass'; lp.frequency.value = 1400;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
  const len = Math.floor(actx.sampleRate * 0.08), buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const ns = actx.createBufferSource(), bp = actx.createBiquadFilter(), ng = actx.createGain();
  ns.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq * 5; bp.Q.value = 2.5; ng.gain.value = vol * 0.35;
  ns.connect(bp); bp.connect(ng); ng.connect(master); ns.start(t);
}
function boing(freq, vol){
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), g2 = actx.createGain();
  const lfo = actx.createOscillator(), lg = actx.createGain();
  o.type = 'sine'; o2.type = 'triangle';
  o.frequency.setValueAtTime(freq * 0.8, t); o.frequency.exponentialRampToValueAtTime(freq, t + 0.08);
  o2.frequency.value = freq * 2;
  lfo.frequency.setValueAtTime(11, t); lfo.frequency.linearRampToValueAtTime(6, t + 0.6);
  lg.gain.setValueAtTime(freq * 0.07, t); lg.gain.exponentialRampToValueAtTime(0.5, t + 0.6);
  lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
  g2.gain.value = 0.18;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  [o, o2, lfo].forEach(n => { n.start(t); n.stop(t + 0.75); });
}

/* ---------- input ---------- */
const drags = new Map();
let lastUser = -10, interacted = false;
function now(){ return performance.now() / 1000; }
function firstTouch(){
  if (interacted) return; interacted = true; hintEl.classList.add('off');
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio(); firstTouch();
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  lastUser = now();
  const dir = new THREE.Vector3();
  if (hitLocal(e.clientX, e.clientY, dir)){
    const d = freeSlot(); if (!d) return;
    Object.assign(d, {active:true, pressing:true, auto:false, pointerId:e.pointerId, sx:e.clientX, sy:e.clientY,
      target:0.3, rad:0.33 + Math.random()*0.1, born:now(), base:0.3});
    if (Math.abs(d.depth) < 0.01){ d.depth = 0; d.vel = 0; }
    d.dir.copy(dir);
    squish(noteFor(dir), 0.32);
  } else {
    const ray = rayFrom(e.clientX, e.clientY), p = new THREE.Vector3();
    if (ray.intersectPlane(zPlane, p)) drags.set(e.pointerId, {offset:center.clone().sub(p)});
  }
});
canvas.addEventListener('pointermove', e => {
  const d = dents.find(x => x.pressing && x.pointerId === e.pointerId);
  if (d){ d.sx = e.clientX; d.sy = e.clientY; lastUser = now(); return; }
  const dr = drags.get(e.pointerId);
  if (dr){
    const ray = rayFrom(e.clientX, e.clientY), p = new THREE.Vector3();
    if (ray.intersectPlane(zPlane, p)){
      centerTarget.copy(p.add(dr.offset));
      const lim = (v, m) => Math.max(-m, Math.min(m, v));
      centerTarget.x = lim(centerTarget.x, viewW / 2); centerTarget.y = lim(centerTarget.y, viewH / 2);
    }
    lastUser = now();
  }
});
function release(d, loud){
  d.pressing = false; d.pointerId = null; d.target = 0;
  kickModes(Math.abs(d.depth) * 1.4);
  if (loud) boing(noteFor(d.dir) * 1.5, 0.22 + Math.min(0.25, Math.abs(d.depth) * 0.5));
}
function endPointer(e){
  const d = dents.find(x => x.pressing && x.pointerId === e.pointerId);
  if (d) release(d, true);
  drags.delete(e.pointerId);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- auto squeeze (a hand gently holding the bubble) ---------- */
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let autoOn = !reduceMotion, nextGrip = 0.4;
function grip(t){
  const q = bubble.quaternion.clone().invert();
  const base = new THREE.Vector3((Math.random() - 0.5) * 1.6, (Math.random() - 0.5) * 1.6, -0.4 - Math.random() * 0.8).normalize();
  const fingers = 1 + Math.floor(Math.random() * 3);
  const side = new THREE.Vector3().crossVectors(base, new THREE.Vector3(0, 1, 0)).normalize();
  for (let k = 0; k < fingers; k++){
    const d = freeSlot(); if (!d || d.pressing) break;
    const w = base.clone().addScaledVector(side, (k - (fingers - 1) / 2) * 0.55).normalize().applyQuaternion(q);
    const hold = 0.5 + Math.random() * 1.1;
    Object.assign(d, {active:true, pressing:true, auto:true, pointerId:null, target:0.18 + Math.random() * 0.22,
      rad:0.3 + Math.random() * 0.12, releaseAt:t + hold + k * 0.07, born:t + k * 0.07, base:0});
    if (Math.abs(d.depth) < 0.01){ d.depth = 0; d.vel = 0; }
    d.dir.copy(w);
  }
}

function camErrText(e){
  const m = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  return 'カメラを起動できませんでした：' + m + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
async function startCamera(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  // get the new stream first, so a failed flip keeps the old camera running
  const s2 = await md.getUserMedia({audio:false,
    video:{facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720}}});
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s2; video.srcObject = stream;
  await video.play().catch(() => {});
  await new Promise(r => { if (video.videoWidth) r(); else video.onloadedmetadata = () => r(); });
  if (!videoTex){ videoTex = new THREE.VideoTexture(video); videoTex.minFilter = THREE.LinearFilter; }
  setBackground(videoTex, video.videoWidth, video.videoHeight, facing === 'user');
}
video.addEventListener('resize', () => { if (stream && video.videoWidth) setBackground(videoTex, video.videoWidth, video.videoHeight, facing === 'user'); });
btnFlip.addEventListener('click', async () => {
  const prev = facing; facing = facing === 'environment' ? 'user' : 'environment';
  try{ await startCamera(); }catch(err){ facing = prev; toast(camErrText(err), 6000); }
});

// the WebGL canvas does not keep its buffer, so the shot is copied right after a frame is drawn
function saveShot(){

      a.download = 'shabon_' + Date.now() + '.png'; document.body.appendChild(a); a.click();

  }catch(e){ toast('保存できませんでした。'); }

const btnRec = document.getElementById('btnRec');
let mr = null, chunks = [];
btnRec.addEventListener('click', () => {
  if (mr && mr.state === 'recording'){ mr.stop(); return; }
  ensureAudio();
  const tracks = [...canvas.captureStream(30).getVideoTracks()];
  if (recDest) tracks.push(...recDest.stream.getAudioTracks());
  const ms = new MediaStream(tracks);
  const types = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  const mt = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  try{ mr = new MediaRecorder(ms, mt ? {mimeType:mt, videoBitsPerSecond:6e6} : {}); }
  catch(err){ toast('録画を開始できませんでした。' + (err && err.message ? '\n' + err.message : '')); return; }
  chunks = []; mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  mr.onstop = () => {
    btnRec.setAttribute('aria-pressed', 'false'); btnRec.textContent = '● REC';
    const blob = new Blob(chunks, {type: mr.mimeType || 'video/mp4'}); const ext = (mr.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'shabon_' + Date.now() + '.' + ext;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  };
  mr.start(1000); btnRec.setAttribute('aria-pressed', 'true'); btnRec.textContent = '■ STOP';
});

/* ---------- simulation ---------- */
const dentTmp = new THREE.Vector3();
let tPrev = now(), t0 = tPrev;
function step(dt, t){
  // bubble position follows its target like a light floating ball
  const ax = (centerTarget.x - center.x) * 55 - centerVel.x * 9;
  const ay = (centerTarget.y - center.y) * 55 - centerVel.y * 9;
  centerVel.x += ax * dt; centerVel.y += ay * dt;
  center.x += centerVel.x * dt; center.y += centerVel.y * dt;
  modeVel[0] += (Math.abs(ax) - Math.abs(ay)) * 0.0009 * dt * 60 * 0.05;
  modeVel[2] += ax * ay * 0.00002;
  modeVel[3] += -ax * 0.0006; modeVel[4] += -ay * 0.0006;

  // shape modes: damped oscillators with a faint random breeze
  for (let i = 0; i < NMODE; i++){
    modeVel[i] += (-modeK[i] * modeU[i] - 2.2 * modeVel[i]) * dt + (Math.random() - 0.5) * dt * 0.35;
    modeU[i] = Math.max(-0.16, Math.min(0.16, modeU[i] + modeVel[i] * dt));
  }

  let inflate = 0;
  for (let i = 0; i < NDENT; i++){
    const d = dents[i];
    if (d.active){
      if (d.pressing && t >= d.born){
        if (d.auto){ if (t >= d.releaseAt) release(d, false); }
        else d.target = Math.min(0.5, d.base + Math.min(t - d.born, 1.6) * 0.1);
      }
      const k = d.pressing ? (t >= d.born ? 95 : 0) : 150;
      const c = d.pressing ? 12 : 4.2;
      d.vel += (k * (d.target - d.depth) - c * d.vel) * dt;
      d.depth += d.vel * dt;
      if (!d.pressing && Math.abs(d.depth) < 0.002 && Math.abs(d.vel) < 0.03){ d.active = false; d.depth = 0; d.vel = 0; }
      inflate += Math.max(0, d.depth) * d.rad * d.rad * 0.4;
    }
    dentU[i].set(d.dir.x, d.dir.y, d.dir.z, d.active ? d.depth : 0);
    dentR[i] = d.rad;
  }
  shared.uInflate.value = inflate;
}

function frame(){
  const t = now();
  let dt = Math.min(0.05, t - tPrev); tPrev = t;
  const time = t - t0;

  // follow fingers that are pressing the bubble
  for (const d of dents){
    if (d.pressing && !d.auto){
      if (hitLocal(d.sx, d.sy, dentTmp)){ d.dir.lerp(dentTmp, 0.55).normalize(); }
      else release(d, true);
    }
  }
  if (autoOn && drags.size === 0 && !dents.some(d => d.pressing && !d.auto) && time > nextGrip && t - lastUser > 1.6){
    grip(t); nextGrip = time + 0.9 + Math.random() * 1.6;
  }

  const sub = 3;
  for (let i = 0; i < sub; i++) step(dt / sub, t);

  bubble.position.copy(center);
  bubble.scale.setScalar(R);
  bubble.rotation.y = time * 0.12;
  bubble.rotation.x = Math.sin(time * 0.31) * 0.18;
  shared.uTime.value = time;
  shared.uRipple.value = reduceMotion ? 0.003 : 0.0065;

  // pass 1: background + back wall into the scene buffer
  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(bgScene, quadCam);
  bubble.material = backMat;
  renderer.render(bubbleScene, camera);
  // pass 2: scene buffer to screen, then the refracting front wall
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(copyScene, quadCam);
  bubble.material = frontMat;
  renderer.render(bubbleScene, camera);
  if (shotReq){ shotReq = false; saveShot(); }

  requestAnimationFrame(frame);
}

setBackground(gardenTex, 300, 540, false);
// test hook
window.__shabon = {
  state(){ return {R, sizeK, cx:center.x, cy:center.y, tx:centerTarget.x, ty:centerTarget.y, dents:dents.filter(d => d.active).length,
    pressing:dents.filter(d => d.pressing && !d.auto).length, cam:!!stream, facing, refract:shared.uRefract.value, auto:autoOn, sound:soundOn}; }
};
requestAnimationFrame(frame);
})();
</script>
