<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<title>SHABON ─ 押せるシャボン玉</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  SHABON ─ 押せるシャボン玉                               ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  ORIGIN     オーナーが持ち込んだ完成品（shabon.html、画面上のタイトル「SHABON」）。
             玉・膜・屈折・押し心地・音・配色・書体はオーナーの設計のまま。画廊に揃えたのは
             開始画面（音とカメラはここで始まる）・⟲ カメラ・⚙ で隠せる調整パネル・
             撮影・録画（REC-FIX、押した音も入る）・カメラ失敗時の定型文だけ。
             写真の読み込みとカメラの入／切は他の作品に合わせて外した。カメラが使えない
             ときはオーナーの作った庭の背景で遊べる。
  MOOD       景色の前に大きなシャボン玉がひとつ。押すと指の形にへこみ、離すとぷるんと
             揺れ戻る。触らずにいると見えない手がにぎにぎする。
  10-15 改訂 オーナーの声「カメラでうつった手でさわれるようにしてほしい」「もう少しシルクかかった
             きれいなものに」。①HandLandmarker（2 手、動的 import）で指先 5 本を追い、玉のふちに
             入った指先の所が外からへこむ（深さは入り込んだ分）。奥まで入れると玉が押されて逃げる。
             指先には小さな点（録画には入らない）。カメラは自分の手が見える前面を既定に。
             ②膜を「シルク」に ── 各色を波長の帯で平均して厚い所は真珠色に褪せ、薄い上の方だけ
             金や薔薇色が残る。模様は横に引き伸ばしたゆるい流れ、真ん中は澄んで、光の側に
             サテンの柔らかな艶、ふちは淡い真珠色。元の虹色は調整で戻せる。
  PALETTE    地 #0b0d0c ／ 膜の干渉色（シルク 180〜1100nm・虹色 250〜1500nm、屈折率 1.33）／ 差し色 #ff9bd2・#8ff5d4
  TYPE       Zen Maru Gothic（オーナーの指定のまま）
  TECH       three.js r128。球を 9 個の形のモード（減衰振動）と 8 個のへこみで変形し、
             裏の膜→表の膜の 2 パスで屈折と薄膜干渉。手は MediaPipe HandLandmarker。
  ══════════════════════════════════════════════════════════════════════════
-->

<script>
(() => {
'use strict';
const canvas = document.getElementById('stage');
const toastEl = document.getElementById('toast');
const hintEl = document.getElementById('hint');
let toastTimer = 0;
function toast(msg, ms = 4200){
  toastEl.textContent = msg; toastEl.classList.remove('off');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.add('off'), ms);
}
const errEl = document.getElementById('err');
if (!window.THREE){ errEl.textContent = '3D描画ライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。'; document.getElementById('go').disabled = true; return; }

/* ---------- renderer ---------- */
let renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:'high-performance'});
}catch(e){ errEl.textContent = 'この端末ではWebGLが使えないため表示できません。'; document.getElementById('go').disabled = true; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.autoClear = false;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
camera.position.set(0, 0, 5);
const quadCam = new THREE.Camera();
const rt = new THREE.WebGLRenderTarget(4, 4, {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, depthBuffer:true});

/* ---------- background sources ---------- */
function makeGardenCanvas(){
  // low-res on purpose: linear upscaling gives a soft, out-of-focus garden

const SNOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const BUBBLE_VERT = `
uniform vec4 uDents[8];
uniform float uDentR[8];
uniform float uModes[9];
uniform float uTime;
uniform float uRipple;
uniform float uInflate;
uniform float uSilk;
varying vec3 vNView;
varying vec3 vPosView;
varying float vD;
${SNOISE}
float dentShape(float s){ return exp(-s*s) - 0.2*exp(-(s-1.6)*(s-1.6)*2.2); }
float disp(vec3 n){
  float r = 1.0 + uInflate;
  r += uModes[0]*(n.x*n.x - n.y*n.y);
  r += uModes[1]*(2.0*n.z*n.z - n.x*n.x - n.y*n.y)*0.5;
  r += uModes[2]*(n.x*n.y)*2.0;
  r += uModes[3]*(n.x*n.z)*2.0;
  r += uModes[4]*(n.y*n.z)*2.0;
  r += uModes[5]*n.x*(n.x*n.x - 3.0*n.y*n.y);
  r += uModes[6]*n.y*(3.0*n.x*n.x - n.y*n.y);
  r += uModes[7]*n.z*(n.x*n.x - n.y*n.y)*2.0;
  r += uModes[8]*n.z*(2.0*n.z*n.z - 3.0*n.x*n.x - 3.0*n.y*n.y)*0.5;
  r += uRipple * snoise(n*2.3 + vec3(0.0, uTime*0.4, uTime*0.25));
  for (int i = 0; i < 8; i++){
    vec4 d = uDents[i];
    if (abs(d.w) < 1e-4) continue;
    float a = acos(clamp(dot(n, d.xyz), -1.0, 1.0)) / uDentR[i];
    r -= d.w * dentShape(a);
  }
  return r;
}
float thinning(vec3 n){
  float t = 0.0;
  for (int i = 0; i < 8; i++){
    vec4 d = uDents[i];
    if (abs(d.w) < 1e-4) continue;
    float a = acos(clamp(dot(n, d.xyz), -1.0, 1.0)) / uDentR[i];
    t += d.w * exp(-a*a*0.6);
  }
  return t;
}
float thicknessSilk(vec3 p, float thin){
  // silk (2026-10-15): slow marbled swirls drawn out sideways like the sheen on silk, thinner toward the
  // top where the film drains (gold and rose bands up there, pearl lower down)
  vec3 q = p*vec3(0.6, 1.25, 0.6) + vec3(0.0, uTime*0.03, 0.0);
  vec3 w = vec3(snoise(q*0.6 + vec3(0.0, uTime*0.045, 0.0)),
                snoise(q*0.6 + vec3(5.2, 1.3, uTime*0.035)),
                snoise(q*0.6 + vec3(2.0, 7.0, 3.0 - uTime*0.03)));

  float d = 700.0 + 190.0*n1 - 300.0*p.y;
  d += thin * 340.0 * snoise(q*1.2 + w + 9.0);
  return clamp(d, 180.0, 1100.0);
}
float thickness(vec3 p, float thin){
  if (uSilk > 0.5) return thicknessSilk(p, thin);
  vec3 q = p*0.85 + vec3(0.0, uTime*0.04, 0.0);
  vec3 w = vec3(snoise(q + vec3(0.0, uTime*0.06, 0.0)),
                snoise(q + vec3(5.2, 1.3, uTime*0.05)),
                snoise(q + vec3(2.0, 7.0 - uTime*0.04, 3.0)));
  float n1 = snoise(q*1.1 + w*1.1 + vec3(uTime*0.03));
  float n2 = snoise(q*2.2 + w*1.4);
  float d = 860.0 + 230.0*n1 + 55.0*n2 - 170.0*p.y;
  d += thin * 700.0 * snoise(q*1.8 + w + 9.0);

}
void main(){
  vec3 n = normalize(position);
  vec3 up = abs(n.y) < 0.98 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
  vec3 t1 = normalize(cross(n, up));
  vec3 t2 = cross(n, t1);
  float e = 0.014;
  vec3 p  = n * disp(n);
  vec3 n1 = normalize(n + t1*e); vec3 p1 = n1 * disp(n1);
  vec3 n2 = normalize(n + t2*e); vec3 p2 = n2 * disp(n2);
  vec3 nrm = normalize(cross(p1 - p, p2 - p));

}`;

const FILM = `
vec3 filmColor(float d, float cosT){
  float n = 1.33;
  float cosR = sqrt(max(0.0, 1.0 - (1.0 - cosT*cosT)/(n*n)));
  vec3 lam = vec3(640.0, 535.0, 455.0);
  vec3 ph = 12.566370614 * n * d * cosR / lam;
  vec3 c = 0.5 - 0.5*cos(ph);
  float l = dot(c, vec3(0.3333));
  c = mix(vec3(l), c, 1.12);
  return clamp(c, 0.0, 1.0);
}
// silk: each channel is averaged over a band of wavelengths, so the thick (high-order) parts of the film
// fade to pearl the way a real film does, and only the thin parts keep strong colour
vec3 filmSilk(float d, float cosT){
  float n = 1.33;
  float cosR = sqrt(max(0.0, 1.0 - (1.0 - cosT*cosT)/(n*n)));
  float opd = 12.566370614 * n * d * cosR;
  vec3 acc = vec3(0.0); float ws = 0.0;
  for (int i = 0; i < 5; i++){
    float k = float(i) - 2.0;
    vec3 lam = vec3(640.0, 535.0, 455.0) + k*vec3(40.0, 34.0, 28.0);
    float w = exp(-k*k*0.35);
    acc += w*(0.5 - 0.5*cos(opd/lam)); ws += w;
  }
  vec3 c = acc/ws;
  float l = dot(c, vec3(0.3333));
  c = mix(vec3(l), c, 1.25);
  c = mix(c, vec3(1.0, 0.96, 0.95), 0.16);   // a pearl cast
  return clamp(c, 0.0, 1.0);
}
vec3 film2(float d, float cosT){ return uSilk > 0.5 ? filmSilk(d, cosT) : filmColor(d, cosT); }`;

// Back wall of the bubble, drawn into the scene buffer over the background.
const BACK_FRAG = `
uniform sampler2D uBg; uniform vec4 uCover; uniform vec2 uRes; uniform float uRefract; uniform float uSilk;
varying vec3 vNView; varying vec3 vPosView; varying float vD;
${FILM}
vec3 bg(vec2 uv){ return texture2D(uBg, uv*uCover.xy + uCover.zw).rgb; }
void main(){
  vec3 N = -normalize(vNView);
  vec3 V = normalize(-vPosView);
  float cosT = clamp(dot(N, V), 0.0, 1.0);
  vec2 suv = gl_FragCoord.xy / uRes;
  vec2 off = N.xy * uRefract * 0.55;
  vec3 col = bg(suv + off);
  vec3 film = film2(vD, cosT);
  float F = pow(1.0 - cosT, 2.2);
  float refl = mix(mix(0.1, 0.04, uSilk), mix(0.55, 0.3, uSilk), F);
  float lum = dot(col, vec3(0.3, 0.59, 0.11));

}`;

// Front wall: refracts the scene buffer (background + back wall) and adds the film.
const FRONT_FRAG = `
uniform sampler2D uScene; uniform sampler2D uBg; uniform vec4 uCover; uniform vec2 uRes; uniform float uRefract; uniform float uSilk;
varying vec3 vNView; varying vec3 vPosView; varying float vD;
${FILM}
void main(){
  vec3 N = normalize(vNView);
  vec3 V = normalize(-vPosView);
  float cosT = clamp(dot(N, V), 0.0, 1.0);
  vec2 suv = gl_FragCoord.xy / uRes;
  vec2 off = N.xy * uRefract * (0.55 + 0.9*(1.0 - cosT));
  vec3 refr;
  refr.r = texture2D(uScene, suv + off*1.06).r;
  refr.g = texture2D(uScene, suv + off).g;
  refr.b = texture2D(uScene, suv + off*0.94).b;
  vec3 film = film2(vD, cosT);
  float F = pow(1.0 - cosT, 2.4);
  float refl = mix(0.15, 0.95, F);
  vec3 R = reflect(-V, N);
  vec2 euv = vec2(0.5 - R.x*0.38, 0.5 + R.y*0.38);
  vec3 env = texture2D(uBg, euv*uCover.xy + uCover.zw).rgb;
  float envL = dot(env, vec3(0.3, 0.59, 0.11));
  vec3 L1 = normalize(vec3(-0.45, 0.75, 0.5));
  vec3 L2 = normalize(vec3(0.6, -0.3, 0.75));
  vec3 col;
  if (uSilk > 0.5){

    // lit side and a pale pearly rim instead of a saturated one

    col *= mix(vec3(1.0), 0.86 + 0.28*film, 0.12);

    col *= mix(vec3(1.0), 0.82 + 0.36*film, 0.3);

const drags = new Map();

function grip(t){
  const q = bubble.quaternion.clone().invert();
  const base = new THREE.Vector3((Math.random() - 0.5) * 1.6, (Math.random() - 0.5) * 1.6, -0.4 - Math.random() * 0.8).normalize();
  const fingers = 1 + Math.floor(Math.random() * 3);
  const side = new THREE.Vector3().crossVectors(base, new THREE.Vector3(0, 1, 0)).normalize();
  for (let k = 0; k < fingers; k++){
    const d = freeSlot(); if (!d || d.pressing) break;
    const w = base.clone().addScaledVector(side, (k - (fingers - 1) / 2) * 0.55).normalize().applyQuaternion(q);

    Object.assign(d, {active:true, pressing:true, auto:true, hand:false, pointerId:null, target:0.18 + Math.random() * 0.22,

    if (Math.abs(d.depth) < 0.01){ d.depth = 0; d.vel = 0; }

}

/* ---------- hands seen by the camera (2026-10-15, owner's request) ---------- */
// Fingertips that reach the bubble press it from the side: the outline caves in under each finger,
// and a hand that goes deep pushes the whole bubble away. MediaPipe HandLandmarker, loaded on demand.
let landmarker = null, handsErr = false, EXT = false, lastVT = -1, lastTs = 0;
let handsOn = true, dotsOn = true;
const TIPS = [4, 8, 12, 16, 20];
let hands = [];                      // [{tips:[[x,y] client px] x5, touch:[bool] x5}]
async function initHands(){
  const {FilesetResolver, HandLandmarker} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d},
    runningMode:'VIDEO', numHands:2, minHandDetectionConfidence:.5, minHandPresenceConfidence:.5, minTrackingConfidence:.5});
  try{ landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
  catch(e){ console.warn('GPU delegate failed', e); landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
}
function detectHands(){
  if (EXT || !landmarker || !stream || video.readyState < 2 || video.currentTime === lastVT) return;
  lastVT = video.currentTime;
  const ts = Math.max(lastTs + 1, Math.round(performance.now())); lastTs = ts;
  let r = null; try{ r = landmarker.detectForVideo(video, ts); }catch(e){ return; }
  parseHands(r && r.landmarks);
}
// camera picture (top-left origin) -> texture uv -> screen, through the same cover mapping as the background
function lmToClient(x, y, out){
  const su = (x - cover.z) / cover.x, sv = ((1 - y) - cover.w) / cover.y;
  out[0] = su * window.innerWidth; out[1] = (1 - sv) * window.innerHeight; return out;
}
// keep only hands whose five fingertips are real, finite points; smooth them a little
const okP = q => q && isFinite(q.x) && isFinite(q.y);
const tmpXY = [0, 0];
function parseHands(list){
  const out = [];
  if (Array.isArray(list)) for (const l of list){
    if (out.length >= 2) break;
    if (!l || typeof l.length !== 'number' || l.length < 21) continue;
    if (!TIPS.every(k => okP(l[k]))) continue;
    const prev = hands[out.length];
    const tips = TIPS.map((k, i) => {
      lmToClient(l[k].x, l[k].y, tmpXY);
      const p = prev && prev.tips[i];
      return p && Math.hypot(p[0] - tmpXY[0], p[1] - tmpXY[1]) < 120 ? [p[0] + (tmpXY[0] - p[0]) * .65, p[1] + (tmpXY[1] - p[1]) * .65] : [tmpXY[0], tmpXY[1]];
    });
    out.push({tips, touch:[false, false, false, false, false]});
  }
  hands = out;
}
const contacts = new Map();          // fingertip key -> dent
const tipP = new THREE.Vector3(), tipDir = new THREE.Vector3(), qInv = new THREE.Quaternion();
let lastSquish = -1, lastBoing = -1;
function handContacts(t, dt){
  const seen = new Set();
  let px = 0, py = 0;
  if (handsOn) {
    qInv.copy(bubble.quaternion).invert();
    for (let h = 0; h < hands.length; h++) for (let f = 0; f < 5; f++){
      const tip = hands[h].tips[f]; hands[h].touch[f] = false;
      const ray = rayFrom(tip[0], tip[1]);
      if (!ray.intersectPlane(zPlane, tipP)) continue;
      const dx = tipP.x - center.x, dy = tipP.y - center.y, dist = Math.hypot(dx, dy);
      const pen = (R * 1.03 - dist) / R;          // how far the fingertip is inside the outline
      if (pen <= 0 || dist < 1e-4) continue;
      const key = h * 5 + f; seen.add(key); hands[h].touch[f] = true;
      let d = contacts.get(key);
      if (!d || !d.hand || !d.pressing){
        d = freeSlot(); if (!d) continue;
        Object.assign(d, {active:true, pressing:true, auto:false, hand:true, pointerId:null, rad:0.28 + Math.random()*0.06, born:t, base:0});
        if (Math.abs(d.depth) < 0.01){ d.depth = 0; d.vel = 0; }
        contacts.set(key, d);
        tipDir.set(dx / dist, dy / dist, 0.3).normalize().applyQuaternion(qInv); d.dir.copy(tipDir);
        if (t - lastSquish > 0.09){ squish(noteFor(d.dir), 0.26); lastSquish = t; }
        firstTouch(); lastUser = t;
      }
      // the dent sits on the outline under the finger, a little toward the viewer, in the bubble's own frame
      tipDir.set(dx / dist, dy / dist, 0.3).normalize().applyQuaternion(qInv);
      d.dir.lerp(tipDir, 0.5).normalize();
      d.target = Math.min(0.45, pen * 1.15);
      if (pen > 0.32){ px -= dx / dist * (pen - 0.32); py -= dy / dist * (pen - 0.32); }
      lastUser = t;
    }
  }
  for (const [key, d] of contacts){
    if (seen.has(key)) continue;
    contacts.delete(key);
    if (d.hand && d.pressing){
      const loud = t - lastBoing > 0.12 && Math.abs(d.depth) > 0.06; if (loud) lastBoing = t;
      release(d, loud);
    }
    d.hand = false;
  }
  // a hand pushing deep moves the bubble away from it
  if (px || py){
    const lim = (v, m) => Math.max(-m, Math.min(m, v)), k = Math.min(1, dt * 7) * R;
    centerTarget.x = lim(centerTarget.x + px * k, viewW / 2); centerTarget.y = lim(centerTarget.y + py * k, viewH / 2);
  }
}
// small marks on the fingertips, so you can see where the camera thinks they are (not in recordings)
const dotsCv = document.getElementById('dots'), dctx = dotsCv.getContext('2d');
function drawDots(){
  const w = window.innerWidth, h = window.innerHeight, dp = Math.min(window.devicePixelRatio || 1, 2);
  if (dotsCv.width !== Math.round(w * dp) || dotsCv.height !== Math.round(h * dp)){ dotsCv.width = Math.round(w * dp); dotsCv.height = Math.round(h * dp); }
  dctx.setTransform(dp, 0, 0, dp, 0, 0); dctx.clearRect(0, 0, w, h);
  if (!dotsOn || !handsOn) return;
  for (const hd of hands) for (let f = 0; f < 5; f++){
    const p = hd.tips[f], on = hd.touch[f];
    dctx.beginPath(); dctx.arc(p[0], p[1], on ? 7 : 5, 0, 7);
    dctx.fillStyle = on ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.35)'; dctx.fill();
    if (on){ dctx.lineWidth = 1.5; dctx.strokeStyle = 'rgba(143,245,212,.9)'; dctx.beginPath(); dctx.arc(p[0], p[1], 12, 0, 7); dctx.stroke(); }
  }
}

/* ---------- simulation ---------- */
const dentTmp = new THREE.Vector3();
let tPrev = now(), t0 = tPrev;
function step(dt, t){
  // bubble position follows its target like a light floating ball
  const ax = (centerTarget.x - center.x) * 55 - centerVel.x * 9;
  const ay = (centerTarget.y - center.y) * 55 - centerVel.y * 9;
  centerVel.x += ax * dt; centerVel.y += ay * dt;
  center.x += centerVel.x * dt; center.y += centerVel.y * dt;
  modeVel[0] += (Math.abs(ax) - Math.abs(ay)) * 0.0009 * dt * 60 * 0.05;
  modeVel[2] += ax * ay * 0.00002;
  modeVel[3] += -ax * 0.0006; modeVel[4] += -ay * 0.0006;

  // shape modes: damped oscillators with a faint random breeze
  for (let i = 0; i < NMODE; i++){
    modeVel[i] += (-modeK[i] * modeU[i] - 2.2 * modeVel[i]) * dt + (Math.random() - 0.5) * dt * 0.35;
    modeU[i] = Math.max(-0.16, Math.min(0.16, modeU[i] + modeVel[i] * dt));
  }

  let inflate = 0;
  for (let i = 0; i < NDENT; i++){
    const d = dents[i];
    if (d.active){
      if (d.pressing && t >= d.born){
        if (d.auto){ if (t >= d.releaseAt) release(d, false); }
        else if (!d.hand) d.target = Math.min(0.5, d.base + Math.min(t - d.born, 1.6) * 0.1);
      }
      const k = d.pressing ? (t >= d.born ? 95 : 0) : 150;
      const c = d.pressing ? 12 : 4.2;
      d.vel += (k * (d.target - d.depth) - c * d.vel) * dt;
      d.depth += d.vel * dt;
      if (!d.pressing && Math.abs(d.depth) < 0.002 && Math.abs(d.vel) < 0.03){ d.active = false; d.depth = 0; d.vel = 0; }
      inflate += Math.max(0, d.depth) * d.rad * d.rad * 0.4;
    }
    dentU[i].set(d.dir.x, d.dir.y, d.dir.z, d.active ? d.depth : 0);
    dentR[i] = d.rad;
  }
  shared.uInflate.value = inflate;
}

function frame(){
  const t = now();
  let dt = Math.min(0.05, t - tPrev); tPrev = t;
  const time = t - t0;

  // follow fingers that are pressing the bubble
  for (const d of dents){
    if (d.pressing && !d.auto && !d.hand){
      if (hitLocal(d.sx, d.sy, dentTmp)){ d.dir.lerp(dentTmp, 0.55).normalize(); }
      else release(d, true);
    }
  }
  detectHands();
  handContacts(t, dt);
  if (autoOn && drags.size === 0 && !dents.some(d => d.pressing && !d.auto) && time > nextGrip && t - lastUser > 1.6){
    grip(t); nextGrip = time + 0.9 + Math.random() * 1.6;
  }

  const sub = 3;
  for (let i = 0; i < sub; i++) step(dt / sub, t);

  bubble.position.copy(center);
  bubble.scale.setScalar(R);
  bubble.rotation.y = time * 0.12;
  bubble.rotation.x = Math.sin(time * 0.31) * 0.18;
  shared.uTime.value = time;
  shared.uRipple.value = reduceMotion ? 0.003 : 0.0065;

  // pass 1: background + back wall into the scene buffer
  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(bgScene, quadCam);
  bubble.material = backMat;
  renderer.render(bubbleScene, camera);
  // pass 2: scene buffer to screen, then the refracting front wall
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(copyScene, quadCam);
  bubble.material = frontMat;
  renderer.render(bubbleScene, camera);
  if (shotReq){ shotReq = false; saveShot(); }
  drawDots();

  requestAnimationFrame(frame);
}
