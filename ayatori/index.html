<meta name="description" content="指先に虹のレーザーの糸がかかる、本当に技がとれるあやとり。本物の手順どおりに指で糸をとり、指を曲げてはずすと、基本の形・やり・はしごができあがる。">
<meta name="theme-color" content="#000000">
<title>AYATORI ─ 指で本当に技をとる虹のあやとり</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  AYATORI ─ 指で本当に技をとる虹のあやとり   ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       暗いライブハウスでレーザーを指にかけて遊んでいる感じ。映像は沈み、
             指先から指先へ張った糸だけが虹色に発光して、はじくと震える。
  PALETTE    地は沈めたカメラ映像と #000。糸は色相が糸に沿って流れる虹
             （白金・ネオンにも切り替え）。とるべき糸は白く脈打つ。
  TYPE       Zen Maru Gothic（手順の日本語）＋ Space Grotesk（技の名前・計器）。
  MOTION     糸をとると、とられた糸が指先へ折れて、弦のように震えて鳴る。
             指をはずすと糸はゆっくり張り直る。技ができると光が一周して名前が出る。
  TECH       糸は「どの指からどの指へ順に渡っているか」の輪（指の並び）として持つ。
             糸をとる＝その糸の区間へ指を差し込む、はずす＝その指を輪から抜く。
             手順はすべて本物の技の順番のままで、指先の位置はカメラの手から毎フレーム取る。
             手が見えないときは画面の中の手で、ボタンひとつずつ進められる。
             手の検出は MediaPipe HandLandmarker（動的 import）。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>

<canvas id="c"></canvas>

<div id="done"><div class="a">COMPLETE</div><div class="b" id="doneName"></div></div>
<div id="hand"><i id="hL">L ✋</i><i id="hR">✋ R</i></div>

<button id="gear" class="btn" aria-label="調整">⚙</button>

<div id="card">
  <div class="row"><span class="n" id="cardN">STEP 1 / 3</span><span class="bar"><b id="cardBar"></b></span></div>
  <div class="txt" id="cardTxt"></div>
  <div class="sub" id="cardSub"></div>
  <div class="ctl"><button id="back">◀ もどる</button><button id="reset">はじめから</button><span class="sp"></span><button id="auto">おまかせ</button><button id="next" class="main">つぎ ▶</button></div>

</div>
<div id="start">
  <div class="t">REAL STRING FIGURES · LASER</div>
  <h1>AYATORI</h1>
  <svg viewBox="0 0 280 120" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset=".25" stop-color="#ffb84d"/><stop offset=".5" stop-color="#4dffb8"/><stop offset=".75" stop-color="#4dc3ff"/><stop offset="1" stop-color="#b36bff"/></linearGradient></defs>
    <g fill="none" stroke="url(#g)" stroke-width="2"><path d="M30 20H250M30 100H250"/><path d="M30 20L65 100L100 20L135 100L170 20L205 100L250 20"/><path d="M30 100L65 20L100 100L135 20L170 100L205 20L250 100"/></g>
    <g fill="#fff"><circle cx="30" cy="20" r="4"/><circle cx="30" cy="100" r="4"/><circle cx="250" cy="20" r="4"/><circle cx="250" cy="100" r="4"/></g></svg>
  <p>本物の手順で、本物の技を。<br>光っている糸に指先を近づけてとり、指を曲げてはずす。<br>手のひらをカメラに向けて、両手を画面に入れてね。</p>
  <button id="go">START</button>
  <div id="err"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const canvas = $('c'), ctx = canvas.getContext('2d'), video = $('v');
const S = { pal:0, w:.5, glow:.6, dim:.45, snd:true };
const STATE = { frames:0, picks:0, releases:0, completes:0, steps:0 };
const FNAME = { 1:'親指', 2:'人差し指', 3:'中指', 4:'薬指', 5:'小指' };
const SIDE = { L:'左', R:'右' };
const TIP = { 1:4, 2:8, 3:12, 4:16, 5:20 }, DIP = { 1:3, 2:7, 3:11, 4:15, 5:19 }, MCP = { 1:2, 2:5, 3:9, 4:13, 5:17 };

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
}
const COV = { s:1, ox:0, oy:0 };
function fitCover(W, H){ const s = Math.max(W / vidW, H / vidH); COV.s = s; COV.ox = (W - vidW * s) / 2; COV.oy = (H - vidH * s) / 2; }
function toScr(p){ const x = COV.ox + p.x * vidW * COV.s, y = COV.oy + p.y * vidH * COV.s; return [mirror ? canvas.width - x : x, y]; }

/* ---------- audio ---------- */
let actx = null, bus = null, recDest = null, verb = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .55; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  // a short shimmering room
  verb = actx.createConvolver(); const n = actx.sampleRate * 1.6, b = actx.createBuffer(2, n, actx.sampleRate);
  for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
  verb.buffer = b; const vg = actx.createGain(); vg.gain.value = .35; verb.connect(vg); vg.connect(bus);
  actx.resume().catch(()=>{});
}
const audioOk = () => actx && actx.state === 'running' && S.snd;
const PENTA = [0, 2, 4, 7, 9];
function pluck(len, pan){
  if (!audioOk()) return;
  const t = actx.currentTime;
  // longer string, lower note (pentatonic so it never clashes)
  const k = Math.max(0, Math.min(14, Math.round(14 - len / (Math.min(canvas.width, canvas.height) * .09))));
  const f = 220 * Math.pow(2, (PENTA[k % 5] + 12 * Math.floor(k / 5)) / 12);
  const g = actx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
  const pn = actx.createStereoPanner ? actx.createStereoPanner() : null;
  const out = pn || bus; if (pn){ pn.pan.value = Math.max(-1, Math.min(1, pan)); pn.connect(bus); pn.connect(verb); } else g.connect(verb);
  g.connect(out);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 9, t); lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + .8); lp.connect(g);
  for (const [m, a, ty] of [[1, .6, 'sawtooth'], [2.003, .25, 'triangle'], [.5, .2, 'sine']]){
    const o = actx.createOscillator(), og = actx.createGain(); o.type = ty; o.frequency.value = f * m; og.gain.value = a;
    o.connect(og); og.connect(lp); o.start(t); o.stop(t + 1.5);
  }
}
function slide(){
  if (!audioOk()) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(220, t + .35);
  g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.0001, t + .45); o.connect(g); g.connect(bus); g.connect(verb); o.start(t); o.stop(t + .5);
}
function fanfare(){
  if (!audioOk()) return;
  const t = actx.currentTime;
  [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => {
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = 330 * Math.pow(2, s / 12);
    g.gain.setValueAtTime(.0001, t + i * .07); g.gain.exponentialRampToValueAtTime(.08, t + i * .07 + .01); g.gain.exponentialRampToValueAtTime(.0001, t + i * .07 + 1.6);
    o.connect(g); g.connect(bus); g.connect(verb); o.start(t + i * .07); o.stop(t + i * .07 + 1.7);
  });
}

/* ---------- hands ---------- */
let hands = null, HANDS_EXTERNAL = false, lastTs = 0, lastVT = -1;
const HAND = { L:{ seen:0, P:null, fold:{}, foldT:{} }, R:{ seen:0, P:null, fold:{}, foldT:{} } };
async function initModels(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const ho = d => ({ baseOptions:{ modelAssetPath:HAND_MODEL, delegate:d }, runningMode:'VIDEO', numHands:2,
      minHandDetectionConfidence:.5, minHandPresenceConfidence:.5, minTrackingConfidence:.5 });
    try { hands = await vision.HandLandmarker.createFromOptions(fs, ho('GPU')); } catch(e){ hands = await vision.HandLandmarker.createFromOptions(fs, ho('CPU')); }
    setStatus('');
  }catch(e){
    if (HANDS_EXTERNAL) return;
    setStatus('手の検出モデルを読み込めませんでした（ネット接続を確認）。\n「つぎ ▶」で一手ずつ進められます。');
  }
}
function detect(now){
  if (!hands || HANDS_EXTERNAL || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastVT) return; lastVT = vt;
  const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
  try{ const r = hands.detectForVideo(video, ts); ingestHands(r && r.landmarks ? r.landmarks : [], now); }catch(e){}
}
function validHand(lm){
  if (!Array.isArray(lm) || lm.length < 21) return false;
  for (let i = 0; i < 21; i++){ const p = lm[i]; if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) return false; }
  return true;
}
// screen-left hand is "L" (with the front camera mirrored, that is the player's own left hand)
function ingestHands(list, now){
  now = now == null ? performance.now() : now;
  if (!Array.isArray(list)) return false;
  const v = list.filter(validHand).slice(0, 2).map(lm => lm.map(toScr));
  if (!v.length) return false;
  v.sort((a, b) => a[0][0] - b[0][0]);
  let assign;
  if (v.length === 2) assign = [['L', v[0]], ['R', v[1]]];
  else assign = [[v[0][0][0] < canvas.width / 2 ? 'L' : 'R', v[0]]];
  for (const [k, P] of assign){
    const H = HAND[k];
    // smooth a little so a laser line does not shiver with landmark noise
    if (H.P && now - H.seen < 300) for (let i = 0; i < 21; i++){ H.P[i][0] += (P[i][0] - H.P[i][0]) * .6; H.P[i][1] += (P[i][1] - H.P[i][1]) * .6; }
    else H.P = P.map(q => q.slice());

  for (const v of vib){ if (v.lab !== labA && v.lab !== labB) continue; const age = (now - v.t0) / 1000; if (age > 1.6) continue; amp += v.amp * Math.exp(-age * 3.2) * m * .018; ph = age; }
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const n = amp > .3 ? 18 : 1, pts = [];
  for (let i = 0; i <= n; i++){ const s = i / n, off = amp * Math.sin(Math.PI * s) * Math.sin(ph * 70 + s * 2); pts.push([a[0] + dx * s + nx * off, a[1] + dy * s + ny * off]); }
  const col = PALS[S.pal]((u0 + u1) / 2, t);
  strokeLine(pts, col, hi ? 1.5 : 1, 1);
  if (hi){ // the string to take: a white pulse running along it
    const pu = (t * .9) % 1, q = [a[0] + dx * pu, a[1] + dy * pu];
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], m * .04); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q[0], q[1], m * .04, 0, 7); ctx.fill();
    strokeLine(pts, `rgba(255,255,255,${.35 + .35 * Math.sin(t * 8)})`, 2.2, .8);
  }
}
function twistedStrands(R, A, B, n, now, u){
  // the two strands leaving R are wound round each other for the first stretch
  const m = Math.min(canvas.width, canvas.height), t = now / 1000;
  const mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
  const X = [R[0] + (mid[0] - R[0]) * .3, R[1] + (mid[1] - R[1]) * .3];
  const dx = X[0] - R[0], dy = X[1] - R[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, w = m * .012;
  for (const sg of [1, -1]){
    const pts = [];
    for (let i = 0; i <= 30; i++){ const s = i / 30, off = sg * w * Math.sin(s * Math.PI * n) * Math.sin(Math.PI * Math.min(1, s * 3)); pts.push([R[0] + dx * s + nx * off, R[1] + dy * s + ny * off]); }
    pts.push(sg > 0 ? A : B);
    strokeLine(pts, PALS[S.pal](u + (sg > 0 ? 0 : .1), t), 1, 1);
  }
}
function drawString(now){
  const n = cycle.length; if (!n) return;
  const P = []; for (let i = 0; i < n; i++) P.push(stopPos(i, now));
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hiSeg = new Set();
  if (T !== 'free') for (const a of pending) if (a.k === 'pick'){ const i = segBetween(a.seg[0], a.seg[1]); if (i >= 0) hiSeg.add(i); }
  const fa = figure ? Math.min(1, (now - figT) / 900) : 0;
  if (figure && fa > 0) drawFigure(figure, now, fa);
  const sa = figure ? 1 - fa : 1;
  if (sa > 0){
    ctx.globalAlpha = sa;
    const tw = {}; for (const f in twist) if (twist[f]) tw[f] = twist[f];
    for (let i = 0; i < n; i++){
      const j = (i + 1) % n;
      const ef = cycle[i].f, eg = cycle[j].f;
      // twisted loop: its two strands are drawn together
      if (tw[eg] && cycle[(j + 1) % n] && cycle[j].lab === eg){ const k = (j + 1) % n; twistedStrands(P[j], P[i], P[k], tw[eg], now, i / n); i++; continue; }
      strand(P[i], P[j], cycle[i].lab, cycle[j].lab, i / n, (i + 1) / n, now, hiSeg.has(i));
    }
    ctx.globalAlpha = 1;
  }
  // finger stops
  const m = Math.min(canvas.width, canvas.height);
  for (let i = 0; i < n; i++){
    const g = ctx.createRadialGradient(P[i][0], P[i][1], 0, P[i][0], P[i][1], m * .022);
    g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.3, PALS[S.pal](i / n, now / 1000)); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(P[i][0], P[i][1], m * .022, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
// figures held on the fingers whose strings catch on each other
function drawFigure(fig, now, a){
  const t = now / 1000, m = Math.min(canvas.width, canvas.height);
  ctx.globalAlpha = a;
  if (fig === 'spear'){
    const L1 = fingerPos('L1', now), L2 = fingerPos('L2', now), L5 = fingerPos('L5', now), R2 = fingerPos('R2', now);
    const C = [(L1[0] + L2[0] + L5[0]) / 3, (L1[1] + L2[1] + L5[1]) / 3];
    const K = [C[0] + (R2[0] - C[0]) * .3, C[1] + (R2[1] - C[1]) * .3];
    // the shaft: the twisted right-index loop, wound all the way to the spearhead
    const dx = K[0] - R2[0], dy = K[1] - R2[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, w = m * .009;
    for (const sg of [1, -1]){ const pts = []; for (let i = 0; i <= 60; i++){ const s = i / 60; pts.push([R2[0] + dx * s + nx * sg * w * Math.sin(s * Math.PI * 7), R2[1] + dy * s + ny * sg * w * Math.sin(s * Math.PI * 7)]); }
      strokeLine(pts, PALS[S.pal](sg > 0 ? .1 : .2, t), 1.1, 1); }
    // the head: the left-index loop caught round the end of the shaft, and the prongs to the left hand
    const off = m * .006;
    strokeLine([[K[0], K[1] - off], L2], PALS[S.pal](.4, t), 1, 1);
    strokeLine([[K[0], K[1] + off], L2], PALS[S.pal](.5, t), 1, 1);
    strokeLine([K, L1], PALS[S.pal](.65, t), 1, 1);
    strokeLine([K, L5], PALS[S.pal](.8, t), 1, 1);
    glowDot(K, m * .03, t);
  } else if (fig === 'ladder'){
    const L1 = fingerPos('L1', now), L2 = fingerPos('L2', now), R1 = fingerPos('R1', now), R2 = fingerPos('R2', now);
    const T_ = u => [L2[0] + (R2[0] - L2[0]) * u, L2[1] + (R2[1] - L2[1]) * u], B_ = u => [L1[0] + (R1[0] - L1[0]) * u, L1[1] + (R1[1] - L1[1]) * u];
    // grow outward from the middle as the hands turn
    const g = Math.min(1, (now - figT) / 1400), half = .5 * (g * g * (3 - 2 * g));
    const clip = u => .5 + Math.max(-half, Math.min(half, u - .5));
    const line = (f, u0, u1, h) => strokeLine([f(clip(u0)), f(clip(u1))], PALS[S.pal](h, t), 1, 1);
    line(T_, 0, 1, .05); line(B_, 0, 1, .95);
    // two zig-zags half a step apart: where they cross, the diamonds of the ladder
    const U = [0, .25, .5, .75, 1];
    for (let z = 0; z < 2; z++){
      for (let k = 0; k < 4; k++){
        const ua = clip(U[k]), ub = clip(U[k + 1]); if (ub - ua < 1e-3) continue;
        const up = (k + z) % 2 === 0;
        const A = up ? T_(ua) : B_(ua), B = up ? B_(ub) : T_(ub);
        strokeLine([A, B], PALS[S.pal]((k + .5) / 4 + z * .05, t), 1, 1);
      }
    }
    for (const u of [.25, .5, .75]){ if (Math.abs(u - .5) <= half + 1e-3){ glowDot(T_(u), m * .016, t); glowDot(B_(u), m * .016, t); } }
  }
  ctx.globalAlpha = 1;
}
function glowDot(p, r, t){
  const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], r); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.fill();
}
function drawTargets(now){
  if (T === 'free') return;
  const m = Math.min(canvas.width, canvas.height), t = now / 1000;
  ctx.globalCompositeOperation = 'lighter';
  for (const a of pending){
    if (a.k === 'pick' || a.k === 'dip' || a.k === 'twist' || a.k === 'rel'){
      const p = fingerPos(a.f, now);
      // the finger that should act: a ring around its tip
      ctx.strokeStyle = `rgba(255,255,255,${.5 + .4 * Math.sin(t * 6)})`; ctx.lineWidth = m * .004;
      ctx.beginPath(); ctx.arc(p[0], p[1], m * (.035 + .006 * Math.sin(t * 6)), 0, 7); ctx.stroke();
      if (a.k === 'rel'){ ctx.beginPath(); ctx.moveTo(p[0] - m * .02, p[1] - m * .02); ctx.lineTo(p[0] + m * .02, p[1] + m * .02); ctx.stroke(); }
      if (a.k === 'twist'){ ctx.beginPath(); ctx.arc(p[0], p[1], m * .06, t * 4, t * 4 + 4.5); ctx.stroke(); }
    }
    if (a.k === 'dip'){ const q = dipTarget(a, now); glowDot(q, m * (.03 + .008 * Math.sin(t * 7)), t); }
  }
}
function drawParts(dt){
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts){ p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vx *= .96; p.vy *= .96; p.life -= dt * 1.1;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = `hsl(${p.h},100%,70%)`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  ctx.globalAlpha = 1;
}
function drawHands(now){
  // faint outline of the hands the string is on, so the figure reads as "on the fingers"
  const m = Math.min(canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const side of ['L', 'R']){
    ctx.strokeStyle = 'rgba(180,200,255,.18)'; ctx.lineWidth = m * .004;
    if (handSeen(side, now)){
      const P = HAND[side].P;
      for (const ch of [[0,1,2,3,4],[0,5,6,7,8],[5,9,10,11,12],[9,13,14,15,16],[13,17,18,19,20],[0,17]]){ ctx.beginPath(); ctx.moveTo(P[ch[0]][0], P[ch[0]][1]); for (let i = 1; i < ch.length; i++) ctx.lineTo(P[ch[i]][0], P[ch[i]][1]); ctx.stroke(); }
    } else {
      const sd = side === 'L' ? -1 : 1, base = virtualPos(side + 3);
      const palm = [base[0] + sd * m * .14, base[1]];
      for (let k = 1; k <= 5; k++){ const p = fingerPos(side + k, now); ctx.beginPath(); ctx.moveTo(palm[0], palm[1] + (k - 3) * m * .03); ctx.lineTo(p[0], p[1]); ctx.stroke(); }
    }
  }
}

/* ---------- switching ---------- */
const MODE = { on:false, X:0 };
function setMode(on){
  if (on === MODE.on) return;
  MODE.on = on;
  $('mode').textContent = on ? '◂ カメラ' : '▸ あやとり';
  $('mode').classList.toggle('small', on);
  $('card').classList.toggle('show', on); $('tech').classList.toggle('show', on); $('hand').classList.toggle('show', on);
  if (on){ ensureAudio(); slide(); if (!cycle.length && T === 'free') setCycle(POS1); }
}

/* ---------- UI ---------- */
TECH_ORDER.forEach(k => { const b = document.createElement('button'); b.textContent = TECH[k].name; b.dataset.t = k; b.onclick = () => { setTech(k); }; $('tech').appendChild(b); });
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{ await startCam(); }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','rand','shoot','mode'].forEach(id => $(id).classList.add('show'));
  if (!started){ started = true; setTech(T); initModels(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => { const prev = facing; facing = facing === 'user' ? 'environment' : 'user'; try { await startCam(); } catch(e){ facing = prev; camError(e); } };
$('gear').onclick = () => $('panel').classList.toggle('hide');
$('sPal').onchange = e => { S.pal = +e.target.value; };
$('sW').oninput = e => { S.w = +e.target.value; };
$('sGlow').oninput = e => { S.glow = +e.target.value; };
$('sDim').oninput = e => { S.dim = +e.target.value; };
$('sSnd').onchange = e => { S.snd = e.target.checked; };
$('rand').onclick = () => { S.pal = (S.pal + 1 + (Math.random() * 3 | 0)) % PALS.length; $('sPal').value = S.pal; burstAll(performance.now()); };
$('mode').onclick = () => setMode(!MODE.on);
$('next').onclick = () => { ensureAudio(); autoOn = false; $('auto').textContent = 'おまかせ'; autoAct(performance.now()); };
$('auto').onclick = () => { ensureAudio(); autoOn = !autoOn; $('auto').textContent = autoOn ? '■ とめる' : 'おまかせ'; autoNext = 0; };
$('back').onclick = () => { if (!history.length) return; const s = history.pop(); restore(s); beginStep(); slide(); };
$('reset').onclick = () => setTech(T);
$('shoot').onclick = () => {
  try{ canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ayatori-' + Date.now() + '.png'; a.click(); }, 'image/png'); }
  catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' })); a.download = 'ayatori.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};
addEventListener('keydown', e => {
  if (!started || /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'Enter'){ e.preventDefault(); setMode(!MODE.on); }
  if ((e.key === ' ' || e.key === 'ArrowRight') && MODE.on){ e.preventDefault(); autoAct(performance.now()); }
  if (e.key === 'ArrowLeft' && MODE.on) $('back').onclick();
});

/* ---------- loop ---------- */
let lastT = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT) / 1000) : 1 / 60; lastT = now;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  const kk = Math.min(1, 1600 / Math.max(W, H)); W = Math.round(W * kk); H = Math.round(H * kk);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  fitCover(W, H);
  detect(now);
  $('hL').classList.toggle('on', handSeen('L', now)); $('hR').classList.toggle('on', handSeen('R', now));
  if (video.readyState < 2) return;
  STATE.frames++;
  MODE.X = MODE.on ? Math.min(1, MODE.X + dt / .7) : Math.max(0, MODE.X - dt / .5);

  // queued reaches (auto play) land when the finger arrives
  for (let i = reachQ.length - 1; i >= 0; i--) if (now >= reachQ[i].at){ const r = reachQ.splice(i, 1)[0]; if (pending.includes(r.a)) actDone(r.a, now); }
  for (const f in anim) if (now - anim[f].t0 > anim[f].dur) delete anim[f];
  if (MODE.on){
    checkGestures(now);
    if (autoOn && !reachQ.length && now > autoNext){
      if (step >= (TECH[T].steps.length || 0)){ autoOn = false; $('auto').textContent = 'おまかせ'; }
      else { autoAct(now); autoNext = now + 1250; }
    }
  }

  // camera
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.save(); if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, COV.ox, COV.oy, vidW * COV.s, vidH * COV.s); ctx.restore();
  if (MODE.X > 0){
    const edge = MODE.X * W;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, edge, H); ctx.clip();
    ctx.fillStyle = `rgba(4,2,10,${1 - S.dim * .9})`; ctx.fillRect(0, 0, W, H);
    const fl = Math.max(0, 1 - (now - flashT) / 900);
    if (fl > 0){ ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(140,160,255,${fl * .35})`; ctx.fillRect(0, 0, W, H); }
    drawHands(now);
    drawString(now);
    drawTargets(now);
    drawParts(dt);
    ctx.restore();
    if (MODE.X < 1){ // the switch: a vertical rainbow laser sweeps across
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(0, 0, 0, H); for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, `hsl(${i * 55 + now * .1},100%,60%)`);
      ctx.fillStyle = g; ctx.globalAlpha = .9; ctx.fillRect(edge - 3, 0, 6, H); ctx.globalAlpha = .25; ctx.fillRect(edge - 18, 0, 36, H); ctx.globalAlpha = 1;
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

window.__AYATORI = {
  ingestHands:(list, now) => { HANDS_EXTERNAL = true; return ingestHands(list, now); },
  mode:on => setMode(!!on), tech:setTech, next:() => autoAct(performance.now()),
  auto:on => { autoOn = !!on; autoNext = 0; },
  pos:f => fingerPos(f, performance.now()),
  seg:(a, b) => { const i = segBetween(a, b); if (i < 0) return null; const n = performance.now(); return [stopPos(i, n), stopPos((i + 1) % cycle.length, n)]; },
  state:() => ({ mode:MODE.on, X:MODE.X, tech:T, step, total:(TECH[T].steps || []).length, pending:pending.map(a => a.k + ':' + a.f), cycle:cycle.map(e => e.lab).join(' '),
    figure, hands:['L','R'].filter(k => handSeen(k)), fold:{ L:{ ...HAND.L.fold }, R:{ ...HAND.R.fold } }, ...STATE })
};
</script>
