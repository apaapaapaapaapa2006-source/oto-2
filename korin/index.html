<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="カメラに映った顔ごとに、タンバリンの光輪を戴いたバケットハットが天から落ちてきて頭に乗る。頭を傾ければ帽子も傾き、画面をタップすれば手動投下もできる。落ちるたびに本物のタンバリンのジングルが鳴り、録画すればその音ごと保存できる。">
<meta name="theme-color" content="#0a0a0a">
<title>KORIN ─ 天から降ってくるタンバリンの光輪</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  KORIN 降臨 ─ 天から降ってくるタンバリンの光輪         ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      90年代のステージにひとり佇むフロントマンの後ろ姿 ── バケット
            ハットのつばの上に、金属のジングルを鳴らすタンバリンがそのまま
            光輪（ニンバス）として浮いている。宗教画の聖人の頭上に輪が
            浮くのと同じ構図で、ロックスターの傲岸さを聖性の記号に変えて
            いる。画面に顔が映るたび、その光輪付きの帽子が天から一つ降っ
            てきて、バウンドしながら頭に収まる。

  PALETTE   地       #0a0a0a  ほぼ黒。開始画面とステージの暗がり。
             硝子     rgba(18,18,20,.78) 浮かぶ操作パネルと丸ボタン。
             線       rgba(255,255,255,.16) 罫線。
             生成り    #eee9df  文字。
             燻       #9a958a  補助文字。
             緋       #c96a4a  録画ボタンだけに使う、記録中の警告色。
             帽子とタンバリンは合成画像そのものが単色（黒のシルエット＋
             金属のジングル）で、パレットに新しい色を足さない ── 画面の
             中で唯一「本物の質感」を持つオブジェクトとして浮くように。
             MOOD LINE: 発光やブルームを足さない。降ってくるのはただの
             黒い塊で、光輪という形がすでにそれを特別なものにしている。

  BACKGROUND  背景そのものは無い。ライブ映像が画面いっぱい（object-fit:
              cover）に広がってそれ自体がキャンバスになり、検出された顔
              の上だけに帽子が乗る。UI は全部その上に浮いていて、⚙ か
              パネルの ✕ で引っ込められる ── 映像だけの画面にできること
              が、この作品では機能ではなく体裁の要件である。

  TYPE      Hiragino Sans / Yu Gothic / Helvetica Neue のみ。Google Fonts
            を読み込まない ── この作品は道具として使われる場面（録画して
            送る）が主目的なので、UI は道具然とした素の書体でよい。

  MOTION    降下は ease-out-bounce 一本 ── 天井から落ちて、頭の上で二度
            弾んでから収まる。頭の回転（roll）は降下中は着地の進み具合と
            同じ割合で追随し、着地後は頭に完全追従する。だから「かぶって
            いる」ことと「まだ降っている」ことが、同じ角度の式で自然に
            区別なく繋がる。

  SIGNATURE  着地の瞬間、本物のタンバリンのジングル音が鳴る（複数枚の
            金属円盤が重なって鳴る、短いバンドパスノイズの束）。この
            作品はタンバリンという名を持ちながら実は無音だった ── 音を
            足したことで名前と体験がようやく一致した。

  TECHNICAL SIGNATURE  MediaPipe Tasks Vision の FaceLandmarker（最大4
            顔）で毎フレーム顔の外接矩形と傾き（額→顎の "up" ベクトルの
            atan2）を求め、検出ごとに最も近い既存トラックへ指数移動平均
            で追従させる（未検出が15フレーム続いたら消す）。画面タップで
            の手動投下も同じ降下アニメーションを再生し、その座標は
            object-fit: cover の切り落としを逆算して求める。録画は canvas の映像
            トラックと、マイク音＋ジングル音を一本の MediaStreamAudio
            Destination に合成した音声トラックを束ねて MediaRecorder に
            渡すので、書き出した動画にもジングルの音が残る。
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --bg:#0a0a0a; --glass:rgba(18,18,20,.78); --line:rgba(255,255,255,.16);
    --ink:#eee9df; --dim:#9a958a; --rec:#c96a4a;
    --top:calc(env(safe-area-inset-top,0px) + 12px);
    --bot:calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;}

  /* the picture is the whole screen */
  canvas#out{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:#000;cursor:crosshair;touch-action:manipulation;}
  video#src{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;}

  button{appearance:none;background:transparent;border:1px solid var(--line);color:var(--ink);
    font-size:13px;padding:9px 16px;cursor:pointer;font-family:inherit;border-radius:10px;}
  button:hover{border-color:var(--dim);}
  button:disabled{opacity:.35;cursor:not-allowed;}
  button:active{transform:scale(.97);}
  button.rec{border-color:var(--rec);color:var(--rec);}
  button.rec.on{background:var(--rec);color:#0a0a0a;}

  /* start overlay */
  #start{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;}
  #start.hidden{display:none;}
  #start h1{margin:0;font-size:23px;font-weight:700;letter-spacing:.24em;}
  #start .sub{margin:0;max-width:22rem;font-size:13px;line-height:1.95;color:var(--dim);}
  #go{border-radius:999px;background:var(--ink);color:#0a0a0a;border:0;font-size:15px;font-weight:700;padding:14px 40px;letter-spacing:.12em;}
  #emptyMsg{font-size:12px;color:var(--dim);min-height:1em;}
  #err{color:#ff8fa3;font-size:12px;line-height:1.8;max-width:22rem;min-height:1em;white-space:pre-line;}

  /* floating chrome */
  .chip{position:fixed;right:12px;z-index:14;border:1px solid var(--line);background:var(--glass);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);
    border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;display:none;}
  .chip.show{display:block;}
  #flipBtn{top:var(--top);}
  #panelBtn{top:calc(var(--top) + 42px);}
  #panelBtn[aria-expanded="true"]{border-color:var(--ink);}
  #status{position:fixed;left:12px;top:var(--top);z-index:13;font-size:11px;line-height:1.6;
    color:rgba(255,255,255,.88);text-shadow:0 1px 3px #000;pointer-events:none;white-space:pre-line;max-width:58vw;}

  /* settings panel — hideable, floats over the picture */
  #panel{position:fixed;left:10px;right:10px;bottom:var(--bot);z-index:13;max-width:30rem;margin:0 auto;
    background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px;
    display:none;flex-direction:column;gap:11px;max-height:calc(100vh - var(--top) - var(--bot) - 60px);overflow-y:auto;}
  #panel.show{display:flex;}
  #panel .head{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:9px;border-bottom:1px solid var(--line);}
  #panel .head span{font-size:12px;font-weight:700;letter-spacing:.1em;}
  #panel .head button{width:28px;height:28px;padding:0;border-radius:999px;font-size:14px;line-height:1;}
  .field{display:flex;align-items:center;gap:12px;}
  .field label{width:6.2rem;flex-shrink:0;font-size:12px;color:var(--dim);}
  .field input[type=range]{flex:1;accent-color:var(--ink);height:26px;}
  .field .val{width:3rem;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .toggle{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);min-height:22px;}
  .toggle input{accent-color:var(--ink);width:18px;height:18px;}
  .row{display:flex;flex-wrap:wrap;gap:8px;}
  .row button{flex:1 1 8rem;}
  .hint{font-size:11px;line-height:1.6;color:var(--dim);}
</style>
</head>
<body>
<canvas id="out" width="1280" height="720"></canvas>
<video id="src" playsinline muted></video>

<div id="status"></div>
<button id="flipBtn" class="chip">⟲ カメラ</button>
<button id="panelBtn" class="chip" aria-expanded="false" aria-controls="panel">⚙ 調整</button>

<div id="panel">
  <div class="head"><span>調整</span><button id="panelClose" type="button" aria-label="閉じる">✕</button></div>
  <div class="toggle"><input type="checkbox" id="autoToggle" checked><label for="autoToggle">顔を自動検出して降らせる</label></div>
  <div class="toggle"><input type="checkbox" id="dbgToggle"><label for="dbgToggle">検出位置を表示(調整用)</label></div>
  <div class="field"><label>サイズ</label><input type="range" id="scaleSlider" min="1.0" max="2.6" step="0.05" value="1.65"><span class="val" id="scaleVal">1.65</span></div>
  <div class="field"><label>かぶる深さ</label><input type="range" id="depthSlider" min="-40" max="60" step="1" value="18"><span class="val" id="depthVal">18</span></div>
  <div class="field"><label>落下時間</label><input type="range" id="speedSlider" min="300" max="1500" step="50" value="700"><span class="val" id="speedVal">700</span></div>
  <div class="row">
    <button id="resetBtn">もう一度降らせる</button>
    <button id="playBtn">一時停止</button>
  </div>
  <div class="row">
    <button id="recBtn" class="rec">録画して保存</button>
    <button id="fsBtn">全画面</button>
  </div>
  <div class="hint">画面をタップすると、そこへ一つだけ降らせられます。</div>
</div>

<div id="start">
  <h1>KORIN</h1>
  <p class="sub">カメラに映った顔ごとに、タンバリンの光輪をかぶったバケットハットが上から落ちてきて頭に乗ります。頭を傾けると帽子も傾き、落ちるたびに本物のタンバリンのジングルが鳴ります。</p>
  <button id="go">はじめる</button>
  <div id="emptyMsg">顔検出モデルを読み込んでいます…</div>
  <div id="err"></div>
</div>

<script type="module">
// tasks-vision is imported dynamically inside initModel(), not as a static
// top-level import: a static import that fails to fetch (CDN outage,
// blocked network) would kill this whole module silently before any of
// its own event listeners — the start button, flipBtn, click-to-drop —
// ever get attached. initModel()'s own try/catch already has a graceful
// fallback (manual click-to-drop keeps working), so a dynamic import
// inside it is enough to make that fallback actually reachable.
const VISION_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $('src'), canvas = $('out'), ctx = canvas.getContext('2d');
const setStatus = m => $('status').textContent = m || '';
for (const [s,v] of [['scaleSlider','scaleVal'],['depthSlider','depthVal'],['speedSlider','speedVal']]) {
  $(s).addEventListener('input', () => $(v).textContent = $(s).value);
}

// hat image: anchor = bottom-center of the brim arc (measured from the cutout)
const hat = new Image(); let hatReady = false;
hat.onload = () => hatReady = true; hat.src = HAT_SRC;
const ANCHOR_X = 307/604, ANCHOR_Y = 510/634;

let landmarker = null, mirror = false, started = false;
let faces = [];   // {cx,cy,w,h,angle,animStart,missed,landed}
let manual = [];
let lastVideoTime = -1;
let facing = 'user', camStream = null;

/* ---------- audio: a real tambourine, not just a resumed context ----------
   The piece is named after a tambourine but shipped silent. House
   convention wants AudioContext created/resumed from the start action;
   here that start action also gets an actual sound — a cluster of short
   bandpass-filtered noise bursts (the metal jingles) fired the instant a
   hat finishes landing. The same signal is routed into a recording-only
   mix bus so saved videos carry the jingle even though it's synthesized,
   not part of the camera's own audio track. */
let actx = null, jingleGain = null, recordDest = null, micNode = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  jingleGain = actx.createGain(); jingleGain.gain.value = 0.5;
  jingleGain.connect(actx.destination);          // audible live
  recordDest = actx.createMediaStreamDestination();
  jingleGain.connect(recordDest);                 // baked into recordings too
}
function connectMicToRecording(stream){
  if (!actx || !recordDest) return;
  const tracks = stream && stream.getAudioTracks ? stream.getAudioTracks() : [];
  if (!tracks.length) return;
  try{
    if (micNode) micNode.disconnect();
    micNode = actx.createMediaStreamSource(new MediaStream([tracks[0]]));
    micNode.connect(recordDest);                  // recording only, never to speakers (no echo)
  }catch(e){ /* captureStream()/cross-origin limits: recording still gets the jingle */ }
}
function jingle(){
  if (!actx || actx.state !== 'running') return;
  const t0 = actx.currentTime;
  const disks = 6;
  for (let i = 0; i < disks; i++){
    const dt = t0 + i * 0.012 + Math.random()*0.01;
    const dur = 0.16 + Math.random()*0.12;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 3200 + Math.random()*4200; bp.Q.value = 6 + Math.random()*6;
    const buf = actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let s = 0; s < d.length; s++) d[s] = (Math.random()*2-1) * Math.pow(1 - s/d.length, 2.2);
    const src = actx.createBufferSource(); src.buffer = buf;
    const g = actx.createGain(); g.gain.setValueAtTime(0.9, dt); g.gain.exponentialRampToValueAtTime(0.001, dt+dur);
    src.connect(bp); bp.connect(g); g.connect(jingleGain);
    src.start(dt); src.stop(dt+dur);
  }
}

async function initModel(){
  try{
    const { FaceLandmarker, FilesetResolver } = await import(VISION_URL);
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = (delegate) => ({
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate },
      runningMode:"VIDEO", numFaces:4, minFaceDetectionConfidence:0.4, minTrackingConfidence:0.4
    });
    try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
    catch(e){ landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
    $('emptyMsg').textContent = '';
  }catch(e){
    console.error(e);
    $('emptyMsg').textContent = '顔検出モデルを読み込めませんでした（ネット接続を確認）。画面タップでの手動投下は使えます。';
    $('autoToggle').checked = false;
  }
}
initModel();

function begin(){
  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    $('start').classList.add('hidden');
    $('flipBtn').classList.add('show');
    $('panelBtn').classList.add('show');
    faces = []; manual = [];
    video.play().catch(()=>{});
    if (!started){ started = true; requestAnimationFrame(loop); }
  };
}

function showCamError(e){
  const msg = (e && e.message) ? e.message : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：'+msg+'\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;   // visible while the start overlay is up
  setStatus(text);               // visible if a camera flip fails mid-session
}
async function startCam(){
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720} }, audio:true });
  mirror = (facing === 'user');
  video.srcObject = camStream;
  connectMicToRecording(camStream);
  begin();
}
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{ await startCam(); }
  catch(e){ showCamError(e); }
};
$('flipBtn').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  try{ await startCam(); }
  catch(e){ facing = facing === 'user' ? 'environment' : 'user'; showCamError(e); }
};

$('playBtn').onclick = () => { if (video.paused){ video.play(); } else { video.pause(); } };
video.addEventListener('play', () => $('playBtn').textContent = '一時停止');
video.addEventListener('pause', () => $('playBtn').textContent = '再生');
$('resetBtn').onclick = () => { const n = performance.now(); faces.forEach(f => { f.animStart = n; f.landed = false; }); manual = []; };

// the settings panel hides so the picture can be the whole screen
function setPanel(on){
  $('panel').classList.toggle('show', on);
  $('panelBtn').setAttribute('aria-expanded', on ? 'true' : 'false');
}
$('panelBtn').onclick = () => setPanel(!$('panel').classList.contains('show'));
$('panelClose').onclick = () => setPanel(false);
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
};

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  // account for object-fit: cover cropping (the canvas fills the screen)
  const s = Math.max(r.width/canvas.width, r.height/canvas.height);
  const ox = (r.width - canvas.width*s)/2, oy = (r.height - canvas.height*s)/2;
  const x = (e.clientX - r.left - ox)/s, y = (e.clientY - r.top - oy)/s;
  const w = canvas.width*0.18;
  manual.push({ cx:x, cy:y, w, angle:0, animStart:performance.now(), landed:false });
});

// MediaPipe landmark indices
const TOP = 10, CHIN = 152, L = 234, R = 454;

function detect(now){
  if (!landmarker || !$('autoToggle').checked || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let res;
  try { res = landmarker.detectForVideo(video, now); } catch(e){ return; }
  const W = canvas.width, H = canvas.height;
  const dets = (res.faceLandmarks || []).map(lm => {
    const p = i => ({ x:(mirror ? 1-lm[i].x : lm[i].x)*W, y:lm[i].y*H });
    const top = p(TOP), chin = p(CHIN), l = p(L), r = p(R);
    const fw = Math.hypot(r.x-l.x, r.y-l.y);
    const fh = Math.hypot(chin.x-top.x, chin.y-top.y);
    // head roll from the "up" vector chin->top
    const angle = Math.atan2(top.x-chin.x, chin.y-top.y);
    return { cx:top.x, cy:top.y, w:fw, h:fh, angle, pts:[top,chin,l,r] };
  });
  const used = new Set();
  for (const d of dets){
    let best = null, bd = Infinity;
    for (const f of faces){ if (used.has(f)) continue;
      const dist = Math.hypot(f.cx-d.cx, f.cy-d.cy);
      if (dist < bd && dist < d.w*1.2){ bd = dist; best = f; } }
    if (best){
      const k = 0.55;
      best.cx += (d.cx-best.cx)*k; best.cy += (d.cy-best.cy)*k;
      best.w += (d.w-best.w)*k; best.h += (d.h-best.h)*k;
      best.angle += (d.angle-best.angle)*k; best.pts = d.pts;
      best.missed = 0; used.add(best);
    } else {
      const f = { ...d, animStart:performance.now(), missed:0, landed:false };
      faces.push(f); used.add(f);
    }
  }
  faces.forEach(f => { if (!used.has(f)) f.missed++; });
  faces = faces.filter(f => f.missed < 15);
}

function easeOutBounce(x){
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1/d1) return n1*x*x;
  if (x < 2/d1) return n1*(x-=1.5/d1)*x + 0.75;
  if (x < 2.5/d1) return n1*(x-=2.25/d1)*x + 0.9375;
  return n1*(x-=2.625/d1)*x + 0.984375;
}

function drawHat(f, now){
  if (!hatReady) return;
  const scale = +$('scaleSlider').value;
  const depth = +$('depthSlider').value / 100;
  const dur = +$('speedSlider').value;
  const dw = f.w * scale, dh = dw * hat.height / hat.width;
  // anchor point: from forehead top, move toward chin by depth * face height
  const fh = f.h || f.w;
  const ax = f.cx - Math.sin(f.angle) * fh * depth;
  const ay = f.cy + Math.cos(f.angle) * fh * depth;
  const t = Math.min(1, (now - f.animStart)/dur);
  const e = easeOutBounce(t);
  if (t >= 1 && !f.landed){ f.landed = true; jingle(); }
  const startY = -dh;              // start above the screen
  const y = startY + (ay - startY) * e;
  ctx.save();
  ctx.translate(ax, y);
  ctx.rotate(f.angle * (t < 1 ? e : 1));
  ctx.drawImage(hat, -dw*ANCHOR_X, -dh*ANCHOR_Y, dw, dh);
  ctx.restore();
}

function loop(){
  const now = performance.now();
  if (video.readyState >= 2){
    ctx.save();
    if (mirror){ ctx.translate(canvas.width,0); ctx.scale(-1,1); }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.restore();
    detect(now);
    if ($('dbgToggle').checked){
      ctx.fillStyle = '#0f0';
      faces.forEach(f => (f.pts||[]).forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill(); }));
    }
    faces.forEach(f => drawHat(f, now));
    manual.forEach(m => drawHat(m, now));
  }
  requestAnimationFrame(loop);
}

// recording
let rec = null, chunks = [];
$('recBtn').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    // audio comes from recordDest (mic + jingle mixed), not the raw source
    // stream, so saved videos carry the jingle even though it's synthesized.
    if (recordDest) tracks.push(...recordDest.stream.getAudioTracks());
    let mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      $('recBtn').classList.remove('on'); $('recBtn').textContent = '録画して保存';
      const ext = (rec.mimeType||'').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType }));
      a.download = 'korin.' + ext; a.click();
      setStatus('保存しました。');
    };
    rec.start(); $('recBtn').classList.add('on'); $('recBtn').textContent = '停止して保存'; setStatus('録画中…');
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};
</script>
