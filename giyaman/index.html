<title>GIYAMAN ─ 手で切り分ける硝子絵</title>
<meta name="description" content="カメラに映るものが、鉛でつないだ色硝子の窓になる。硝子の割りかたはボロノイで決まっていて、手で撫でたところだけ硝子が細かく切り直され、放っておくとゆっくり元の大きさへ戻っていく。色はカメラの色相を十二色の硝子に置き換えたもので、明るさだけが本物の光として透ける。乱・短冊・鱗の三つの割り。">
<meta name="theme-color" content="#0b0b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  ══════════════════════════════════════════════════════════════════════════
  GIYAMAN ─ 手で切り分ける硝子絵                     ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      聖堂の薄暗がり。A leaded window seen from inside a dark room:
            the glass is the only light source in the frame and everything
            else — frame, type, chrome — is a silhouette against it. Tonight's
            companion piece (TENBIN) is warm ivory daylight; this one is the
            one dark piece, and it commits: no light UI surfaces anywhere.

  PALETTE   Twelve glasses, six hues at two densities. The camera supplies
            only BRIGHTNESS; the hue is always replaced, which is what stops
            the picture looking like a mosaic of muddy camera colour.
            瑠璃  ruri      #1b3f8f / #3f68c4   cobalt
            紅    beni      #9e2233 / #cf4550   ruby
            琥珀  kohaku    #c8902f / #e8c069   amber
            翠    midori    #1c6b52 / #3fa07a   emerald
            菫    sumire    #553388 / #8560c0   violet
            乳白  nyuuhaku  #ddd6c2 / #f2eee0   opal — the neutral, so grey
                                                skin and grey walls become
                                                milk glass instead of mud.
            鉛    namari    #0d0d12              the came. Near-black, and
                                                it keeps 8% of the glass it
                                                borders so light wraps it.
            石    ishi      #07070a              the stone reveal at the edges.

  BACKGROUND  There is no background — the window is the whole frame. Depth
              comes from the stone reveal vignette and from two long glazing
              reflections that drift across the glass.

  TYPE      Cinzel 400/600 for latin, letter-spaced wide — Roman capitals
            are the lettering that actually appears on this kind of window.
            Hina Mincho for Japanese: a very light mincho, so the copy reads
            as an inscription rather than as an interface.

  MOTION    SLOW AND LITURGICAL, deliberately the opposite of TENBIN's
            mechanical snap. Cell colours ease over ~0.8s, the tessellation
            relaxes a tenth of the way per frame, the sunlight behind the
            window takes half a minute to cross it, and a cut anneals back
            over about twenty seconds. Nothing in this piece is instant.

  SIGNATURE 手で撫でたところだけ硝子が細かく切り直される。 The tessellation
            is not decoration laid over the image — it is a live Lloyd
            relaxation against a density field, and your hands ARE the
            density field. Stroke an area and the seeds crowd into it, so
            the glass there is genuinely cut into smaller pieces and holds
            more of the picture; lift your hands and over twenty seconds the
            seeds spread out again and the detail is lost back to the lead.
            An open palm cuts broad, a closed hand cuts a narrow line.
  ══════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  GIYAMAN ─ 手で切り分ける硝子絵
//
//  The window is a Voronoi tessellation that is ALIVE: every frame the
//  seeds take one Lloyd step toward the density-weighted centroid of their
//  own cell, and the density field is painted by your hands. Crowd the
//  seeds and the glass there is genuinely cut smaller; stop, and the field
//  decays and the seeds spread back out.
//
//  Real-time budget, in order of what it cost:
//    · everything runs on ONE reduced-resolution buffer whose size adapts
//      to measured frame time; nothing is allocated per frame except the
//      unavoidable getImageData read.
//    · the nearest-seed map is rebuilt a HORIZONTAL SLICE at a time, so
//      the cost is amortised flat instead of spiking every N frames.
//    · seed lookup is bucketed on a grid sized to one seed per bucket, and
//      rings are only widened when the best distance says a closer seed
//      could still exist.
//    · colour + centroid accumulation runs on a stride-2 sample; a cell
//      averages well over a hundred pixels, so half of them is plenty.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number' && isFinite(v); }

var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var leadEl=document.getElementById('leadR');
var densEl=document.getElementById('densR');
var rCells=document.getElementById('rCells');
var rCut=document.getElementById('rCut');
var rRes=document.getElementById('rRes');
var mBtn=[document.getElementById('m0'),document.getElementById('m1'),document.getElementById('m2')];

var W=0,H=0,DPR=1,MN=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR));
  view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null, camOK=false;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } },
    audio:false
  }).then(function(st){
    stream=st; video.srcObject=st; mirror=(facing==='user'); camOK=true;
    var p=video.play();
    return (p&&p.then)?p.catch(function(){}):null;
  });
}
flipBtn.addEventListener('click',function(){
  facing=(facing==='user')?'environment':'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  BUFFER ─ the glass is computed here and only here.
//
//  CH is derived from CW by the CAMERA's aspect, so one buffer pixel is
//  square. That is what makes every radius in this file honest: a hand span
//  measured in buffer pixels means the same physical thing whichever way
//  the phone is held, because the buffer is the camera frame and not the
//  screen. The buffer is then cover-fitted to the screen, which crops but
//  never stretches, so it stays square on the way out too.
// ═══════════════════════════════════════════════════════════════════════
var camAspect=4/3;
var CW=0, CH=0, NPX=0;
var camCv=null, camCtx=null, outCv=null, outCtx=null, outImg=null, outBuf=null;
var IDX=null, GLASS=null;
var DW=0, DH=0, DETAIL=null;
var srcData=null;
var bufTargetArea=58000, lastAlloc=-99;

function allocBuffers(cw){
  cw=clamp(Math.round(cw),120,420);
  var chh=Math.max(90,Math.round(cw/Math.max(0.35,camAspect)));
  if (cw===CW&&chh===CH) return;
  CW=cw; CH=chh; NPX=CW*CH;
  if (!camCv){ camCv=document.createElement('canvas'); }
  camCv.width=CW; camCv.height=CH;
  camCtx=camCv.getContext('2d',{willReadFrequently:true})||camCv.getContext('2d');
  if (!outCv){ outCv=document.createElement('canvas'); }
  outCv.width=CW; outCv.height=CH;
  outCtx=outCv.getContext('2d');
  outImg=outCtx.createImageData(CW,CH);
  outBuf=outImg.data;
  IDX=new Int32Array(NPX);
  // reamy streak texture: horizontal smears, the way rolled antique glass
  // actually looks. Built once per buffer size, never per frame.
  GLASS=new Uint8Array(NPX);
  var row=new Float32Array(CW);
  for (var y=0;y<CH;y++){
    var seed=Math.sin(y*12.9898)*43758.5453;
    var v=0.5, i;
    for (i=0;i<CW;i++){
      seed=Math.sin(seed*1.7+i*0.37)*43758.5453;
      var n=seed-Math.floor(seed);
      v=v*0.90+n*0.10;
      row[i]=v;
    }
    // one box blur along the row gives the long reamy smear
    var acc=0, R=5;
    for (i=0;i<CW;i++){
      acc=0;
      for (var k=-R;k<=R;k++) acc+=row[clamp(i+k,0,CW-1)];
      GLASS[y*CW+i]=clamp(Math.round((acc/(2*R+1))*255),0,255);
    }
  }
  DW=Math.max(2,Math.ceil(CW/4)); DH=Math.max(2,Math.ceil(CH/4));
  DETAIL=new Float32Array(DW*DH);
  rebuildRow=0;
  seedsDirty=true;
  placeSeeds(true);
}

// ═══════════════════════════════════════════════════════════════════════
//  SEEDS + the bucketed nearest-seed search
// ═══════════════════════════════════════════════════════════════════════
var NS=0, SX=null, SY=null;
var cR=null,cG=null,cB=null,cN=null,cCX=null,cCY=null,cW2=null;
var curR=null,curG=null,curB=null;
var GW=0,GH=0,GCELL=1,GSTART=null,GITEM=null,GCOUNT=null;
var mode=0, seedsDirty=true, rebuildRow=0;
var density=0.42, leadAmt=0.58;

function targetSeeds(){
  // one seed per ~this many buffer pixels, so density reads the same at
  // every adaptive resolution
  var per=lerp(340,92,clamp(density,0,1));
  return clamp(Math.round(NPX/per),90,1100);
}
function allocSeeds(n){
  NS=n;
  SX=new Float32Array(NS); SY=new Float32Array(NS);
  cR=new Float32Array(NS); cG=new Float32Array(NS); cB=new Float32Array(NS);
  cN=new Float32Array(NS); cCX=new Float32Array(NS); cCY=new Float32Array(NS);
  cW2=new Float32Array(NS);
  curR=new Float32Array(NS); curG=new Float32Array(NS); curB=new Float32Array(NS);
}
function placeSeeds(reset){
  var want=targetSeeds();
  if (!SX||want!==NS) allocSeeds(want);
  if (!reset&&!seedsDirty) return;
  // a jittered lattice, not pure random: pure random Voronoi has ugly
  // slivers, and a glazier does not cut slivers
  var cols=Math.max(1,Math.round(Math.sqrt(NS*CW/Math.max(1,CH))));
  var rows=Math.max(1,Math.ceil(NS/cols));
  var k=0;
  for (var j=0;j<rows&&k<NS;j++){
    for (var i=0;i<cols&&k<NS;i++){
      SX[k]=clamp((i+0.5+(Math.random()-0.5)*0.72)*(CW/cols),0.5,CW-0.5);
      SY[k]=clamp((j+0.5+(Math.random()-0.5)*0.72)*(CH/rows),0.5,CH-0.5);
      curR[k]=40; curG[k]=40; curB[k]=48;
      k++;
    }
  }
  buildGrid();
  seedsDirty=false;
}
function buildGrid(){
  if (!NS) return;
  GCELL=Math.max(3,Math.sqrt(NPX/Math.max(1,NS)));
  GW=Math.max(1,Math.ceil(CW/GCELL)); GH=Math.max(1,Math.ceil(CH/GCELL));
  var nb=GW*GH;
  if (!GCOUNT||GCOUNT.length!==nb){ GCOUNT=new Int32Array(nb); GSTART=new Int32Array(nb+1); }
  if (!GITEM||GITEM.length!==NS) GITEM=new Int32Array(NS);
  GCOUNT.fill(0);
  var i,b;
  for (i=0;i<NS;i++){
    b=bucketOf(SX[i],SY[i]);
    GCOUNT[b]++;
  }
  GSTART[0]=0;
  for (i=0;i<nb;i++) GSTART[i+1]=GSTART[i]+GCOUNT[i];
  GCOUNT.fill(0);
  for (i=0;i<NS;i++){
    b=bucketOf(SX[i],SY[i]);
    GITEM[GSTART[b]+GCOUNT[b]]=i;
    GCOUNT[b]++;
  }
}
function bucketOf(x,y){
  var gx=clamp(Math.floor(x/GCELL),0,GW-1);
  var gy=clamp(Math.floor(y/GCELL),0,GH-1);
  return gy*GW+gx;
}
// the three cuts differ only in how distance is measured
function metric(dx,dy){
  if (mode===1){ dy*=0.30; return dx*dx+dy*dy; }        // 短冊 — tall strips
  if (mode===2){ dx=dx<0?-dx:dx; dy=dy<0?-dy:dy;        // 鱗 — angular panes
                 var m=dx>dy?dx:dy; return m*m; }
  return dx*dx+dy*dy;                                    // 乱 — organic
}
function nearestSeed(x,y){
  if (!NS) return 0;
  var gx=clamp(Math.floor(x/GCELL),0,GW-1);
  var gy=clamp(Math.floor(y/GCELL),0,GH-1);
  var best=-1, bd=Infinity;
  for (var ring=0;ring<=3;ring++){
    var x0=gx-ring, x1=gx+ring, y0=gy-ring, y1=gy+ring;
    for (var byy=y0;byy<=y1;byy++){
      if (byy<0||byy>=GH) continue;
      var edgeRow=(byy===y0||byy===y1);
      for (var bxx=x0;bxx<=x1;bxx++){
        if (bxx<0||bxx>=GW) continue;
        if (!edgeRow && bxx!==x0 && bxx!==x1) continue;   // ring shell only
        var b=byy*GW+bxx;
        var s=GSTART[b], e=GSTART[b+1];
        for (var q=s;q<e;q++){
          var si=GITEM[q];
          var d=metric(x-SX[si],y-SY[si]);
          if (d<bd){ bd=d; best=si; }
        }
      }
    }
    // stop as soon as no seed outside the searched rings could be closer
    if (best>=0){
      var safe=ring*GCELL;
      if (bd<=safe*safe) break;
    }
  }
  return best>=0?best:0;
}

// ═══════════════════════════════════════════════════════════════════════
//  HANDS ─ the glazier. Positions are kept in BUFFER pixels, which are
//  square, so a palm span means the same physical thing in either
//  orientation. Nothing here is ever measured in screen pixels.
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false;
var LOST_S=0.42;
var HA=[ newHand(), newHand() ];
function newHand(){
  return { on:false, t:-9, x:0, y:0, px:0, py:0, span:1, open:0, speed:0, pts:null };
}
function lmOK(L,i){
  if (!L||typeof L.length!=='number'||L.length<=i) return false;
  var p=L[i];
  return !!p && fin(p.x) && fin(p.y);
}
function loseHands(){
  for (var k=0;k<2;k++){
    HA[k].on=false; HA[k].t=-9; HA[k].speed=0; HA[k].px=0; HA[k].py=0; HA[k].pts=null;
  }
  cutRate=0;
}
function onHands(res){
  var t=now();
  var vw=(video&&video.videoWidth)?video.videoWidth:0;
  var vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0){ var a=vw/vh; if (fin(a)&&a>0) camAspect=a; }
  var list=res?res.multiHandLandmarks:null;
  var used=0;
  if (list&&typeof list.length==='number'){
    for (var i=0;i<list.length&&used<2;i++){
      var L=list[i];
      if (!lmOK(L,0)||!lmOK(L,9)||!lmOK(L,12)) continue;
      var Hd=HA[used];
      // buffer pixels: x by CW, y by CH — and CH is CW/camAspect, so the
      // two axes are the same physical unit. This is the aspect correction.
      var bx=clamp(L[0].x*0.35+L[9].x*0.65,0,1)*CW;
      var by=clamp(L[0].y*0.35+L[9].y*0.65,0,1)*CH;
      if (!fin(bx)||!fin(by)) continue;
      var d09=Math.hypot((L[9].x-L[0].x)*CW,(L[9].y-L[0].y)*CH);
      var d012=Math.hypot((L[12].x-L[0].x)*CW,(L[12].y-L[0].y)*CH);
      if (!fin(d09)||d09<1e-3) continue;
      if (Hd.on&&(t-Hd.t)<LOST_S){
        var dd=Math.hypot(bx-Hd.x,by-Hd.y);
        var dt=Math.max(1e-3,t-Hd.t);
        Hd.speed=lerp(Hd.speed,clamp(dd/dt,0,4000),0.5);
      } else {
        // reacquired after a dropout: no phantom stroke from the jump
        Hd.speed=0;
      }
      Hd.px=Hd.on?Hd.x:bx; Hd.py=Hd.on?Hd.y:by;
      Hd.x=bx; Hd.y=by;
      Hd.span=clamp(d09,2,CW);
      Hd.open=clamp((d012/d09-1.18)/0.78,0,1);
      Hd.pts=L;
      Hd.on=true; Hd.t=t;
      used++;
    }
  }
  for (var k=used;k<2;k++){ if (HA[k].on){ HA[k].on=false; HA[k].speed=0; HA[k].pts=null; } }
}
function handLive(i){ return HA[i].on && (now()-HA[i].t)<LOST_S && !!HA[i].pts; }

function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0,
                       minDetectionConfidence:0.55, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{
      onFrame:function(){
        if (!hands) return Promise.resolve();
        try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); }
      },
      width:640, height:480
    });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE DENSITY FIELD ─ what your hands actually paint.
//  Kept at a quarter of the buffer resolution; that is more than enough,
//  because it only ever steers where seeds drift.
// ═══════════════════════════════════════════════════════════════════════
var ANNEAL=8.0;         // seconds for a cut to fade back to plain glass
var cutRate=0, cutMean=0;
function stampCut(dt){
  if (!DETAIL) return;
  var any=0;
  for (var k=0;k<2;k++){
    if (!handLive(k)) continue;
    var Hd=HA[k];
    // open palm cuts broad, closed hand cuts a narrow line
    var R=Hd.span*(0.55+1.55*Hd.open);
    var rd=Math.max(1.2,R/4);                 // detail-grid units
    var cx=Hd.x/4, cy=Hd.y/4;
    var x0=Math.max(0,Math.floor(cx-rd)), x1=Math.min(DW-1,Math.ceil(cx+rd));
    var y0=Math.max(0,Math.floor(cy-rd)), y1=Math.min(DH-1,Math.ceil(cy+rd));
    var str=clamp(1.9*dt,0,0.35);
    var r2=rd*rd;
    for (var y=y0;y<=y1;y++){
      var dy=y-cy, row=y*DW;
      for (var x=x0;x<=x1;x++){
        var dx=x-cx, d2=dx*dx+dy*dy;
        if (d2>r2) continue;
        var f=1-d2/r2;
        var v=DETAIL[row+x]+str*f*f;
        DETAIL[row+x]=v>1?1:v;
      }
    }
    any+=0.5+0.5*clamp(Hd.speed/(Hd.span*6+1),0,1);
  }
  cutRate=lerp(cutRate,clamp(any,0,2),1-Math.exp(-6*dt));
  // anneal
  var dec=Math.exp(-dt/ANNEAL);
  var sum=0, n=DETAIL.length;
  for (var i=0;i<n;i++){ var d=DETAIL[i]*dec; DETAIL[i]=d; sum+=d; }
  cutMean=n?sum/n:0;
}

// ═══════════════════════════════════════════════════════════════════════
//  THE TWELVE GLASSES.  The camera supplies brightness only; hue is always
//  replaced, which is the whole reason this reads as glass and not as a
//  mosaic of muddy camera colour.
// ═══════════════════════════════════════════════════════════════════════
var PAL=[
  [27,63,143],[63,104,196],      // 瑠璃
  [158,34,51],[207,69,80],       // 紅
  [200,144,47],[232,192,105],    // 琥珀
  [28,107,82],[63,160,122],      // 翠
  [85,51,136],[133,96,192],      // 菫
  [221,214,194],[242,238,224]    // 乳白
];
var PCR=new Float32Array(PAL.length), PCG=new Float32Array(PAL.length), PCB=new Float32Array(PAL.length);
(function(){
  for (var i=0;i<PAL.length;i++){
    var p=PAL[i];
    var l=0.299*p[0]+0.587*p[1]+0.114*p[2]+1;
    PCR[i]=p[0]/l; PCG[i]=p[1]/l; PCB[i]=p[2]/l;
  }
})();
var LEAD_R=13, LEAD_G=13, LEAD_B=18;

// ═══════════════════════════════════════════════════════════════════════
//  PER-FRAME PASSES
// ═══════════════════════════════════════════════════════════════════════
var SLICES=3;
function rebuildSlice(all){
  if (!IDX||!NS) return;
  var rows=all?CH:Math.max(1,Math.ceil(CH/SLICES));
  var y0=all?0:rebuildRow;
  for (var r=0;r<rows;r++){
    var y=all?r:((y0+r)%CH);
    var base=y*CW, yy=y+0.5;
    for (var x=0;x<CW;x++) IDX[base+x]=nearestSeed(x+0.5,yy);
  }
  if (!all) rebuildRow=(rebuildRow+rows)%CH;
}
function accumulate(){
  if (!srcData||!IDX) return;
  var d=srcData.data;
  cR.fill(0); cG.fill(0); cB.fill(0); cN.fill(0);
  cCX.fill(0); cCY.fill(0); cW2.fill(0);
  var dwm=DW-1, dhm=DH-1;
  for (var y=0;y<CH;y++){
    var base=y*CW;
    var dy=y>>2; if (dy>dhm) dy=dhm;
    var drow=dy*DW;
    for (var x=0;x<CW;x+=2){
      var i=base+x, c=IDX[i], p=i<<2;
      cR[c]+=d[p]; cG[c]+=d[p+1]; cB[c]+=d[p+2]; cN[c]++;
      var dx=x>>2; if (dx>dwm) dx=dwm;
      var w=1+16.0*DETAIL[drow+dx];
      cW2[c]+=w; cCX[c]+=(x+0.5)*w; cCY[c]+=(y+0.5)*w;
    }
  }
}
// ── 硝子を割る ─────────────────────────────────────────────────────────
//  Weighted Lloyd alone is not enough, and it took the harness to show it:
//  a seed whose own cell has uniform density sits exactly on its own
//  centroid and does not move at all, so the crowding can only creep one
//  cell per convergence and a six-second stroke bought a 16% finer cut —
//  invisible. What a glazier actually does is take a piece that is too big
//  and cut it in two, so that is what this does: each tick it finds the
//  cell carrying the most density-weighted area and the one carrying the
//  least, and moves the redundant seed into the overloaded cell. The new
//  seed inherits the colour of the piece it was cut from, so a split reads
//  as a split rather than as a flash. The budget is deliberately small —
//  the window re-cuts over seconds, not frames.
//  It runs in reverse for free: once a cut anneals, the crowded cells are
//  the ones with the least weighted area, so the seeds migrate back out.
var RELOC_RATE=8, relocBudget=0, relocCount=0, lastPingAt=-9;
function relocateSeeds(dt,t){
  if (!NS||NS<8) return 0;
  relocBudget=Math.min(relocBudget+dt*RELOC_RATE,6);
  var done=0;
  while (relocBudget>=1){
    var hi=-1, hv=-1, lo=-1, lv=Infinity, tot=0, i, w;
    for (i=0;i<NS;i++){
      w=cW2[i]; tot+=w;
      if (w>hv){ hv=w; hi=i; }
      if (w<lv){ lv=w; lo=i; }
    }
    if (hi<0||lo<0||hi===lo) break;
    var mean=tot/NS;
    if (!(mean>1e-6)) break;
    // The test has to be against the MEAN. Against the minimum it never
    // stops: there is almost always one sliver cell that the stride-2
    // sample misses entirely, its weighted area is 0, and "much bigger than
    // the smallest" is then true of every cell in the window — so an
    // untouched window re-cut itself forever and an annealing one never
    // settled back.
    if (hv<mean*1.35) break;                 // nothing is genuinely oversized
    if (lv>mean*0.66) break;                 // nothing is genuinely redundant
    var iw=Math.max(1e-6,cW2[hi]);
    var cx=cCX[hi]/iw, cy=cCY[hi]/iw;
    if (!fin(cx)||!fin(cy)) break;
    var jr=Math.sqrt(Math.max(1,hv))*0.22+1;
    SX[lo]=clamp(cx+(Math.random()-0.5)*jr,0.5,CW-0.5);
    SY[lo]=clamp(cy+(Math.random()-0.5)*jr,0.5,CH-0.5);
    curR[lo]=curR[hi]; curG[lo]=curG[hi]; curB[lo]=curB[hi];
    cW2[lo]=hv*0.5; cW2[hi]=hv*0.5;          // the pair is now settled
    cCX[lo]=cx*cW2[lo]; cCY[lo]=cy*cW2[lo];
    relocBudget-=1; done++; relocCount++;
    // every ping IS a piece of glass coming away — not a random sparkle
    if (cutRate>0.10 && (t-lastPingAt)>0.085 && Math.random()<0.4){
      lastPingAt=t;
      ping(clamp(0.18+0.5*clamp(hv/(lv*8+40),0,1),0,1));
    }
    if (done>=6) break;
  }
  return done;
}
function relaxSeeds(dt){
  if (!NS) return;
  var k=1-Math.exp(-6.0*dt);
  var moved=0;
  for (var i=0;i<NS;i++){
    var w=cW2[i];
    if (w<=1e-6) continue;
    var tx=cCX[i]/w, ty=cCY[i]/w;
    if (!fin(tx)||!fin(ty)) continue;
    var nx=clamp(SX[i]+(tx-SX[i])*k,0.5,CW-0.5);
    var ny=clamp(SY[i]+(ty-SY[i])*k,0.5,CH-0.5);
    moved+=Math.abs(nx-SX[i])+Math.abs(ny-SY[i]);
    SX[i]=nx; SY[i]=ny;
  }
  buildGrid();
  return moved;
}
function shadeCells(dt,t){
  if (!NS) return;
  var k=1-Math.exp(-1.6*dt);
  for (var c=0;c<NS;c++){
    var n=cN[c];
    var tr,tg,tb;
    if (n>0){
      var r=cR[c]/n, g=cG[c]/n, b=cB[c]/n;
      var lum=0.299*r+0.587*g+0.114*b;
      var L=lum+1;
      var ar=r/L, ag=g/L, ab=b/L;
      var best=0, bd=1e9;
      for (var q=0;q<PCR.length;q++){
        var d0=ar-PCR[q], d1=ag-PCG[q], d2=ab-PCB[q];
        var dd=d0*d0+d1*d1+d2*d2;
        if (dd<bd){ bd=dd; best=q; }
      }
      // sunlight crossing the window: half a minute end to end
      var sun=0.84+0.30*Math.sin(SX[c]*0.013+t*0.30)*Math.sin(SY[c]*0.010-t*0.19);
      var br=clamp((0.26+1.24*(lum/255))*sun,0.10,1.45);
      var P=PAL[best];
      tr=P[0]*br; tg=P[1]*br; tb=P[2]*br;
    } else { tr=curR[c]; tg=curG[c]; tb=curB[c]; }
    curR[c]+=(tr-curR[c])*k;
    curG[c]+=(tg-curG[c])*k;
    curB[c]+=(tb-curB[c])*k;
  }
}
function paint(){
  if (!outBuf||!IDX) return;
  var o=outBuf, n=NPX;
  var lw=leadAmt;
  var wide=(lw>0.34);
  var strong=clamp(0.55+0.45*lw,0,1);
  var soft=strong*0.55;
  var cwm=CW-1, chm=CH-1;
  for (var y=0;y<CH;y++){
    var base=y*CW;
    var yEdge=(y>=chm), yEdge2=(y>=chm-1);
    for (var x=0;x<CW;x++){
      var i=base+x, c=IDX[i];
      var g=GLASS[i]*0.0013+0.834;            // 0.834 .. 1.166
      var r=curR[c]*g, gg=curG[c]*g, b=curB[c]*g;
      var lead=0;
      if ((x<cwm&&IDX[i+1]!==c)||(!yEdge&&IDX[i+CW]!==c)) lead=strong;
      else if (wide&&((x<cwm-1&&IDX[i+2]!==c)||(!yEdge2&&IDX[i+CW+CW]!==c))) lead=soft;
      if (lead>0){
        var m=1-lead;
        r=r*m+LEAD_R*lead; gg=gg*m+LEAD_G*lead; b=b*m+LEAD_B*lead;
      }
      var p=i<<2;
      o[p]=r; o[p+1]=gg; o[p+2]=b; o[p+3]=255;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ near-silent by design. A cathedral is quiet; what you hear is
//  the room itself, the scribe of the cutting wheel while you are actually
//  cutting, and a small glass ping each time a piece comes away.
// ═══════════════════════════════════════════════════════════════════════
var ac=null, master=null, comp=null, bedG=null, scrG=null, scrSrc=null, pingBus=null;
var audioOK=false, noiseBuf=null;
var PING=[523.25,587.33,698.46,783.99,880.00,1046.50,1174.66,1396.91];
function initAudio(){
  if (audioOK) return true;
  var AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return false;
  try{
    ac=new AC();
    comp=ac.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=10; comp.ratio.value=4;
    comp.attack.value=0.006; comp.release.value=0.25;
    master=ac.createGain(); master.gain.value=0.8;
    comp.connect(master); master.connect(ac.destination);

    var sr=ac.sampleRate, len=Math.floor(sr*1.2);
    noiseBuf=ac.createBuffer(1,len,sr);
    var nd=noiseBuf.getChannelData(0);
    for (var i=0;i<len;i++) nd[i]=Math.random()*2-1;

    // the room
    var bedLP=ac.createBiquadFilter();
    bedLP.type='lowpass'; bedLP.frequency.value=380; bedLP.Q.value=0.6;
    bedG=ac.createGain(); bedG.gain.value=0.052;
    bedLP.connect(bedG); bedG.connect(comp);
    var f=[58.27,87.31,116.54];
    for (i=0;i<3;i++){
      var o=ac.createOscillator(); o.type='triangle';
      o.frequency.value=f[i];
      o.detune.value=(i-1)*5;
      var g=ac.createGain(); g.gain.value=(i===2)?0.22:0.5;
      o.connect(g); g.connect(bedLP);
      try{ o.start(); }catch(e){}
    }
    // the cutting wheel
    scrSrc=ac.createBufferSource(); scrSrc.buffer=noiseBuf; scrSrc.loop=true;
    var bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=3400; bp.Q.value=2.6;
    var hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
    scrG=ac.createGain(); scrG.gain.value=0.0001;
    scrSrc.connect(bp); bp.connect(hp); hp.connect(scrG); scrG.connect(comp);
    try{ scrSrc.start(); }catch(e){}

    pingBus=ac.createGain(); pingBus.gain.value=0.5;
    pingBus.connect(comp);
    audioOK=true; return true;
  }catch(e){ ac=null; audioOK=false; return false; }
}
function ping(amp){
  if (!audioOK||!ac) return;
  var t=ac.currentTime;
  amp=fin(amp)?clamp(amp,0,1):0.3;
  if (amp<0.02) return;
  var f=PING[Math.floor(Math.random()*PING.length)]*(Math.random()<0.25?2:1);
  if (!fin(f)||f>=ac.sampleRate*0.45) return;
  var o=ac.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(f,t);
  var o2=ac.createOscillator(); o2.type='sine';
  o2.frequency.setValueAtTime(f*2.41,t);
  var g=ac.createGain(), g2=ac.createGain();
  var a=amp*0.13;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0012,a),t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
  g2.gain.setValueAtTime(Math.max(0.0012,a*0.22),t);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
  o.connect(g); g.connect(pingBus);
  o2.connect(g2); g2.connect(pingBus);
  o.start(t); o.stop(t+1.6);
  o2.start(t); o2.stop(t+0.3);
}
function updateAudio(dt,t){
  if (!audioOK||!ac) return;
  var at=ac.currentTime;
  scrG.gain.setTargetAtTime(clamp(cutRate,0,2)*0.05,at,0.10);
  bedG.gain.setTargetAtTime(0.040+0.026*clamp(cutMean*3,0,1),at,0.8);
}

// ═══════════════════════════════════════════════════════════════════════
//  COMPOSITE
// ═══════════════════════════════════════════════════════════════════════
var fitS=1, fitX=0, fitY=0;
function updateFit(){
  var s=Math.max(W/Math.max(1,CW),H/Math.max(1,CH));
  if (!fin(s)||s<=0) s=1;
  fitS=s; fitX=(W-CW*s)/2; fitY=(H-CH*s)/2;
}
function bufX(bx){ return fitX+(mirror?(CW-bx):bx)*fitS; }
function bufY(by){ return fitY+by*fitS; }

var HB=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
        [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHands(t){
  for (var k=0;k<2;k++){
    if (!handLive(k)) continue;
    var Hd=HA[k], L=Hd.pts;
    if (!L||L.length<21) continue;
    var R=Hd.span*(0.55+1.55*Hd.open)*fitS;
    var cx=bufX(Hd.x), cy=bufY(Hd.y);
    if (!fin(cx)||!fin(cy)||!fin(R)) continue;
    // the reach of the cut, as light bleeding through
    var gr=ctx.createRadialGradient(cx,cy,R*0.12,cx,cy,Math.max(1,R));
    gr.addColorStop(0,'rgba(242,238,224,.17)');
    gr.addColorStop(0.55,'rgba(232,192,105,.07)');
    gr.addColorStop(1,'rgba(232,192,105,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(cx,cy,Math.max(1,R),0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,Math.max(1,R),0,TAU);
    ctx.strokeStyle='rgba(242,238,224,'+(0.10+0.14*Hd.open).toFixed(3)+')';
    ctx.lineWidth=Math.max(1,MN*0.0016); ctx.stroke();
    // the hand itself, drawn as came
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='rgba(242,238,224,.42)';
    ctx.lineWidth=Math.max(1.2,MN*0.0032);
    for (var b=0;b<HB.length;b++){
      var a=L[HB[b][0]], c=L[HB[b][1]];
      if (!a||!c||!fin(a.x)||!fin(c.x)||!fin(a.y)||!fin(c.y)) continue;
      var ax=bufX(a.x*CW), ay=bufY(a.y*CH);
      var bx2=bufX(c.x*CW), by2=bufY(c.y*CH);
      if (!fin(ax)||!fin(ay)||!fin(bx2)||!fin(by2)) continue;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx2,by2); ctx.stroke();
    }
    for (var q=0;q<21;q+=4){
      var p=L[q];
      if (!p||!fin(p.x)||!fin(p.y)) continue;
      var px=bufX(p.x*CW), py=bufY(p.y*CH);
      if (!fin(px)||!fin(py)) continue;
      ctx.beginPath(); ctx.arc(px,py,Math.max(1,MN*0.0038),0,TAU);
      ctx.fillStyle='rgba(232,192,105,.75)'; ctx.fill();
    }
  }
}
function drawReveal(t){
  // the stone the window is set into
  var g=ctx.createRadialGradient(W*0.5,H*0.48,MN*0.30,W*0.5,H*0.5,MN*0.92);
  g.addColorStop(0,'rgba(7,7,10,0)');
  g.addColorStop(0.62,'rgba(7,7,10,.30)');
  g.addColorStop(1,'rgba(7,7,10,.86)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // two glazing reflections, drifting
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for (var i=0;i<2;i++){
    var ph=(t*0.021+i*0.5)%1;
    var cx=lerp(-0.35,1.35,ph)*W;
    var wd=MN*(i?0.10:0.19);
    var lg=ctx.createLinearGradient(cx-wd,0,cx+wd,H);
    lg.addColorStop(0,'rgba(221,214,194,0)');
    lg.addColorStop(0.5,'rgba(221,214,194,'+(i?0.030:0.048).toFixed(3)+')');
    lg.addColorStop(1,'rgba(221,214,194,0)');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.moveTo(cx-wd,0); ctx.lineTo(cx+wd,0);
    ctx.lineTo(cx+wd+MN*0.34,H); ctx.lineTo(cx-wd+MN*0.34,H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawHint(){
  if (handLive(0)||handLive(1)) return;
  ctx.save();
  ctx.font='400 '+Math.round(Math.max(11,MN*0.020))+'px "Hina Mincho", serif';
  ctx.fillStyle='rgba(221,214,194,.5)';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('手をかざして、硝子を撫でてください',W*0.5,MN*0.055);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP + ADAPTIVE RESOLUTION
//  The buffer is resized against MEASURED frame time rather than a guess
//  about the device, and never more than once every 1.8s so it cannot
//  oscillate. Any change of buffer size or seed count forces a FULL index
//  rebuild in the same tick — a stale IDX would index past the seed arrays.
// ═══════════════════════════════════════════════════════════════════════
var last=now(), started=false, frameMs=16, lastResize=-99, fpsT=0;
function applyDensity(){
  var want=targetSeeds();
  if (want!==NS){ seedsDirty=true; placeSeeds(true); rebuildSlice(true); }
}
function frame(){
  requestAnimationFrame(frame);
  var t0=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  var t=now();
  var dt=t-last; last=t;
  if (!fin(dt)||dt<0) dt=0.016;
  dt=Math.min(dt,0.05);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#07070a'; ctx.fillRect(0,0,W,H);

  if (started&&CW>0){
    updateFit();
    // grab the frame
    if (camOK&&video&&video.videoWidth>0){
      try{
        camCtx.drawImage(video,0,0,CW,CH);
        srcData=camCtx.getImageData(0,0,CW,CH);
      }catch(e){ srcData=null; }
    }
    stampCut(dt);
    rebuildSlice(false);
    if (srcData) accumulate();
    relocateSeeds(dt,t);
    relaxSeeds(dt);
    shadeCells(dt,t);
    paint();
    outCtx.putImageData(outImg,0,0);
    ctx.save();
    if (mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
    ctx.imageSmoothingEnabled=true;
    var dx=mirror?(W-fitX-CW*fitS):fitX;
    ctx.drawImage(outCv,dx,fitY,CW*fitS,CH*fitS);
    ctx.restore();
    drawReveal(t);
    drawHands(t);
    drawHint();
    updateAudio(dt,t);
  }

  var t1=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  var ms=t1-t0;
  if (fin(ms)) frameMs=frameMs*0.92+ms*0.08;
  if (started&&(t-lastResize)>1.8&&CW>0){
    // the real camera aspect is not known until a frame has arrived, and a
    // 16:9 camera into a 4:3 buffer would make buffer pixels non-square —
    // which would quietly break every radius measured in this file
    if (Math.abs(CW/CH-camAspect)>0.06){
      lastResize=t; allocBuffers(Math.round(Math.sqrt(bufTargetArea*Math.max(0.35,camAspect))));
      rebuildSlice(true); updateFit();
    }
    else if (frameMs>27&&CW>128){ lastResize=t; allocBuffers(Math.round(CW*0.86)); rebuildSlice(true); }
    else if (frameMs<15&&CW<360){ lastResize=t; allocBuffers(Math.round(CW*1.10)); rebuildSlice(true); }
  }
  if (t-fpsT>0.33){
    fpsT=t;
    if (rCells) rCells.textContent=String(NS);
    if (rCut) rCut.textContent=String(Math.round(clamp(cutMean,0,1)*100));
    if (rRes) rRes.textContent=CW+'×'+CH;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  CONSOLE
// ═══════════════════════════════════════════════════════════════════════
function setMode(m){
  mode=clamp(Math.round(m),0,2);
  for (var i=0;i<3;i++) if (mBtn[i]) mBtn[i].className=(i===mode)?'on':'';
  if (CW>0) rebuildSlice(true);     // the metric changed: every cell moves
}
for (var mi=0;mi<3;mi++) (function(i){
  if (mBtn[i]) mBtn[i].addEventListener('click',function(){ setMode(i); });
})(mi);
if (leadEl) leadEl.addEventListener('input',function(){
  var v=parseInt(leadEl.value,10);
  leadAmt=clamp((fin(v)?v:58)/100,0,1);
});
if (densEl) densEl.addEventListener('input',function(){
  var v=parseInt(densEl.value,10);
  density=clamp((fin(v)?v:42)/100,0,1);
  if (CW>0) applyDensity();
});

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM ─ a small live window, with a hand passing over it
//  and the glass crowding finer under the hand, then spreading back.
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoLast=now(), demoT=0;
var dW=132, dH=42, dN=46;
var dSX=new Float32Array(dN), dSY=new Float32Array(dN);
var dIDX=new Int32Array(dW*dH), dImg=null, dDet=new Float32Array(dW*dH);
var dCol=new Float32Array(dN*3);
(function(){
  for (var i=0;i<dN;i++){
    dSX[i]=(0.5+(i%12))*(dW/12)+(Math.random()-0.5)*5;
    dSY[i]=(0.5+Math.floor(i/12))*(dH/4)+(Math.random()-0.5)*4;
    var p=PAL[i%PAL.length];
    dCol[i*3]=p[0]; dCol[i*3+1]=p[1]; dCol[i*3+2]=p[2];
  }
})();
function demoFrame(){
  if (!demoRun||!demoCtx) return;
  requestAnimationFrame(demoFrame);
  var t=now(), dt=Math.min(0.05,t-demoLast); demoLast=t;
  demoT+=dt;
  var ph=(demoT%7)/7;
  var hx=lerp(-0.2,1.2,ph)*dW, hy=dH*(0.5+0.22*Math.sin(ph*TAU*1.5));
  var hr=dW*0.13, hr2=hr*hr;
  var i,x,y;
  // paint + anneal the little density field
  var dec=Math.exp(-dt/4.5);
  for (y=0;y<dH;y++){
    var row=y*dW;
    for (x=0;x<dW;x++){
      var v=dDet[row+x]*dec;
      var ddx=x-hx, ddy=y-hy, d2=ddx*ddx+ddy*ddy;
      if (ph<0.92&&d2<hr2){ var f=1-d2/hr2; v=Math.min(1,v+2.6*dt*f*f); }
      dDet[row+x]=v;
    }
  }
  // one Lloyd step
  var sx=new Float32Array(dN), sy=new Float32Array(dN), sw=new Float32Array(dN);
  for (y=0;y<dH;y++){
    for (x=0;x<dW;x++){
      var bi=-1, bd=1e9;
      for (i=0;i<dN;i++){
        var ax=x-dSX[i], ay=y-dSY[i], d=ax*ax+ay*ay;
        if (d<bd){ bd=d; bi=i; }
      }
      dIDX[y*dW+x]=bi<0?0:bi;
      var w=1+8*dDet[y*dW+x];
      sw[bi]+=w; sx[bi]+=x*w; sy[bi]+=y*w;
    }
  }
  var k=1-Math.exp(-5*dt);
  for (i=0;i<dN;i++){
    if (sw[i]<=0) continue;
    dSX[i]=clamp(dSX[i]+(sx[i]/sw[i]-dSX[i])*k,0.5,dW-0.5);
    dSY[i]=clamp(dSY[i]+(sy[i]/sw[i]-dSY[i])*k,0.5,dH-0.5);
  }
  // draw
  if (!dImg) dImg=demoCtx.createImageData(dW,dH);
  var o=dImg.data;
  for (y=0;y<dH;y++){
    for (x=0;x<dW;x++){
      var ii=y*dW+x, c=dIDX[ii];
      var lead=((x<dW-1&&dIDX[ii+1]!==c)||(y<dH-1&&dIDX[ii+dW]!==c));
      var p=ii<<2;
      var br=0.55+0.5*Math.sin(x*0.05+y*0.09);
      o[p]  =lead?13:dCol[c*3]*br;
      o[p+1]=lead?13:dCol[c*3+1]*br;
      o[p+2]=lead?18:dCol[c*3+2]*br;
      o[p+3]=255;
    }
  }
  var tmp=demoCv;
  demoCtx.save();
  demoCtx.fillStyle='#07070a'; demoCtx.fillRect(0,0,tmp.width,tmp.height);
  if (!demoScratch){
    demoScratch=document.createElement('canvas');
    demoScratch.width=dW; demoScratch.height=dH;
    demoScratchCtx=demoScratch.getContext('2d');
  }
  demoScratchCtx.putImageData(dImg,0,0);
  demoCtx.imageSmoothingEnabled=true;
  demoCtx.drawImage(demoScratch,0,0,tmp.width,tmp.height);
  // the hand
  var sxp=(hx/dW)*tmp.width, syp=(hy/dH)*tmp.height, srp=(hr/dW)*tmp.width;
  if (ph<0.92){
    var gr=demoCtx.createRadialGradient(sxp,syp,srp*0.1,sxp,syp,srp);
    gr.addColorStop(0,'rgba(242,238,224,.22)');
    gr.addColorStop(1,'rgba(232,192,105,0)');
    demoCtx.fillStyle=gr;
    demoCtx.beginPath(); demoCtx.arc(sxp,syp,srp,0,TAU); demoCtx.fill();
    demoCtx.beginPath(); demoCtx.arc(sxp,syp,srp,0,TAU);
    demoCtx.strokeStyle='rgba(242,238,224,.5)'; demoCtx.lineWidth=2; demoCtx.stroke();
  }
  demoCtx.fillStyle='rgba(221,214,194,.55)';
  demoCtx.font='400 14px Cinzel, serif'; demoCtx.textAlign='left'; demoCtx.textBaseline='top';
  demoCtx.fillText(ph<0.92?'CUTTING':'ANNEALING',14,12);
  demoCtx.restore();
}
var demoScratch=null, demoScratchCtx=null;
if (demoCtx) demoFrame();

// ═══════════════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════════════
startBtn.addEventListener('click',function(){
  if (started) return;
  started=true;
  demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  allocBuffers(Math.round(Math.sqrt(bufTargetArea*Math.max(0.35,camAspect))));
  rebuildSlice(true);
  updateFit();
  initHands();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
setMode(0);
last=now();
frame();
</script>
</body>
