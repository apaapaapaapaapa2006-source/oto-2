<meta name="description" content="面と向かい合う五番勝負のにらめっこ。面はこちらの顔を写して大げさに真似し、べろを出し、頬をふくらませて笑わせにくる。こらえの目盛りが振り切れたら負け。動かしてはいけないのは、体ではなく表情。">

<!--
  ══════════════════════════════════════════════════════════════════════════
  NIRAMEKKO ─ 笑ったら負け                     ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   生成 kinari   #f4ecdc  washi ground — the whole piece is printed
                                   on it, lit from two paper lanterns
            胡粉 gofun    #fbf6ec  the mask's face, one step whiter than the
                                   paper so it lifts off the ground
            墨   sumi     #1f1a15  every line, every letter
            柿   kaki     #a8462a  定式幕 stripe, the mask's lips and blush
            萌葱 moegi    #2e5b45  定式幕 stripe, the calm readouts
            金茶 kin      #c99a3c  lantern light, and a round survived
            MOOD: a bright 縁日 booth at dusk. Warm paper, four flat inks,
            nothing glowing. Deliberately the opposite of a dark demo — a
            staring contest only works in a room where you can see a face.
  BACKGROUND  Flat kinari washi with a real grain tile, a 定式幕 valance of
            black / persimmon / moegi stripes hung across the very top, two
            paper lanterns burning in the upper corners, and one soft floor
            shadow under the mask. The background never animates. The only
            things that move in this piece are two faces.
  TYPE      Reggae One — a 寄席文字/勘亭流 display face, the lettering of a
            variety-hall bill, used enormous for the taunt names and the
            round numbers. Kiwi Maru, soft and round, for everything the
            player actually has to read. A bill face against a friendly one.
  MOTION    はずむ. Every value in the mask is a real spring (k=140, ζ≈0.5)
            so nothing arrives without overshooting and settling. Taunts do
            not fade in, they are kicked in with an impulse. The only thing
            that moves linearly in the whole piece is the round clock.
  SIGNATURE 面がこちらの顔を写す。The mask is not animated at you — its
            features are driven by YOUR OWN facial measurements, amplified
            about three times. Twitch and it convulses. During まねっこ it
            drops all pretence and becomes a caricature of you in real time,
            which is the single most reliable way to make a person laugh.
  AUDIO     寄席囃子: a 篠笛 (bandpassed noise + sine, portamento up into the
            note, breath tail), a 三味線 (true Karplus-Strong rendered into
            an AudioBuffer, with a cubic wavefolder standing in for さわり
            buzz) and a 締太鼓 (two detuned sines dropping a fifth in 90ms
            over a lowpassed noise slap). A 55Hz sub pulse runs under the
            round and speeds up as こらえ drains — the only part of the mix
            that tells you how close you are to losing. Everything through
            one compressor; five overlapping taunts do not clip.
  ══════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  NIRAMEKKO — 笑ったら負け
//  One camera, one face, and a mask that measures it. Nothing here is
//  choreographed: the mask's features are the player's own measurements
//  run through springs and multiplied.
// ═══════════════════════════════════════════════════════════════════════
var view = document.getElementById('view');
var ctx  = view.getContext('2d');
var video = document.getElementById('video');
var ov = document.getElementById('ov');
var startBtn = document.getElementById('startBtn');
var flipBtn = document.getElementById('flipBtn');
var errBox = document.getElementById('errBox');
var roundLbl = document.getElementById('roundLbl');
var stateLbl = document.getElementById('stateLbl');
var scoreLbl = document.getElementById('scoreLbl');
var demoCv = document.getElementById('demo');

var W = 0, H = 0, S = 1, DPR = 1, portrait = false;
function now(){ return performance.now(); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function lerp(a,b,t){ return a + (b-a)*t; }
function easeOut(t){ return 1 - Math.pow(1-t, 3); }

// ── colours ────────────────────────────────────────────────────────────
var C_PAPER = '#f4ecdc', C_GOFUN = '#fbf6ec', C_SUMI = '#1f1a15',
    C_KAKI  = '#a8462a', C_MOEGI = '#2e5b45', C_KIN = '#c99a3c';

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  view.width  = Math.max(2, Math.round(W * DPR));
  view.height = Math.max(2, Math.round(H * DPR));
  view.style.width = W + 'px'; view.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H) / 720;
  portrait = H > W;
  buildGrain();
}
window.addEventListener('resize', resize);

// ── paper grain, rendered once ─────────────────────────────────────────
var grain = null;
function buildGrain(){
  var g = document.createElement('canvas');
  g.width = 96; g.height = 96;
  var gc = g.getContext('2d');
  if (!gc) { grain = null; return; }
  var img = gc.createImageData(96, 96);
  var d = img.data;
  for (var i = 0; i < 96*96; i++){
    var n = 232 + Math.floor(Math.random()*24);
    d[i*4] = n; d[i*4+1] = n - 6; d[i*4+2] = n - 20; d[i*4+3] = 26;
  }
  gc.putImageData(img, 0, 0);
  grain = g;
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO — 寄席囃子
// ═══════════════════════════════════════════════════════════════════════
var ac = null, master = null, comp = null, noiseBuf = null, ksCache = {};

function initAudio(){
  if (ac) { if (ac.state === 'suspended' && ac.resume) ac.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { ac = new AC(); } catch(e){ ac = null; return; }
  comp = ac.createDynamicsCompressor();
  try {
    comp.threshold.value = -17; comp.knee.value = 26;
    comp.ratio.value = 7; comp.attack.value = 0.004; comp.release.value = 0.22;
  } catch(e){}
  master = ac.createGain(); master.gain.value = 0.85;
  comp.connect(master); master.connect(ac.destination);
  var n = Math.floor(ac.sampleRate * 1.4);
  noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  var nd = noiseBuf.getChannelData(0);
  for (var i = 0; i < n; i++) nd[i] = Math.random()*2 - 1;
  if (ac.state === 'suspended' && ac.resume) ac.resume();
}
function aOK(){ return !!(ac && comp); }
function noise(){
  var s = ac.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  s.playbackRate.value = 0.7 + Math.random()*0.6;
  return s;
}
// 篠笛 — bandpassed breath riding a sine, sliding up into the note
function fue(f, dur, vol){
  if (!aOK() || !isFinite(f) || f <= 0) return;
  var t = ac.currentTime, D = Math.max(0.12, dur || 0.5), V = clamp(vol || 0.3, 0, 1);
  var o = ac.createOscillator(); o.type = 'sine';
  var o2 = ac.createOscillator(); o2.type = 'triangle';
  var g = ac.createGain(), g2 = ac.createGain();
  o.frequency.setValueAtTime(f*0.90, t);
  o.frequency.exponentialRampToValueAtTime(f, t + 0.075);
  o2.frequency.setValueAtTime(f*1.80, t);
  o2.frequency.exponentialRampToValueAtTime(f*2, t + 0.075);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(V, t + 0.035);
  g.gain.exponentialRampToValueAtTime(V*0.55, t + D*0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + D);
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(V*0.22, t + 0.05);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + D*0.8);
  var nz = noise(), bp = ac.createBiquadFilter(), ng = ac.createGain();
  bp.type = 'bandpass'; bp.Q.value = 7;
  bp.frequency.setValueAtTime(f*0.9, t);
  bp.frequency.exponentialRampToValueAtTime(f*1.02, t + 0.075);
  ng.gain.setValueAtTime(0.0001, t);
  ng.gain.exponentialRampToValueAtTime(V*0.42, t + 0.028);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + D*0.75);
  o.connect(g); g.connect(comp); o2.connect(g2); g2.connect(comp);
  nz.connect(bp); bp.connect(ng); ng.connect(comp);
  o.start(t); o2.start(t); nz.start(t);
  o.stop(t + D + 0.05); o2.stop(t + D + 0.05); nz.stop(t + D + 0.05);
}
// 三味線 — Karplus-Strong rendered offline, wavefolded for さわり buzz
function ksBuffer(freq){
  var key = Math.round(freq);
  if (ksCache[key]) return ksCache[key];
  var sr = ac.sampleRate;
  var n = Math.floor(sr * 1.25);
  var N = Math.max(4, Math.round(sr / freq));
  var buf = ac.createBuffer(1, n, sr);
  var d = buf.getChannelData(0);
  var ring = new Float32Array(N), p = 0, i;
  for (i = 0; i < N; i++) ring[i] = Math.random()*2 - 1;
  for (i = 0; i < N; i++){ p += (ring[i] - p) * 0.62; ring[i] = p; }
  var idx = 0;
  for (i = 0; i < n; i++){
    var cur = ring[idx], nxt = ring[(idx+1) % N];
    d[i] = cur * 0.62;
    var v = (cur + nxt) * 0.5 * 0.9965;
    v = v - 0.16 * v * v * v;          // さわり
    if (!isFinite(v)) v = 0;
    ring[idx] = v;
    idx = (idx + 1) % N;
  }
  var f = Math.floor(sr * 0.03);
  for (i = 0; i < f; i++) d[n-1-i] *= i / f;
  ksCache[key] = buf;
  return buf;
}
function shamisen(f, vol){
  if (!aOK() || !isFinite(f) || f <= 20) return;
  var t = ac.currentTime, V = clamp(vol || 0.3, 0, 1);
  var s = ac.createBufferSource(); s.buffer = ksBuffer(f);
  var g = ac.createGain();
  g.gain.setValueAtTime(V, t);
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200;
  s.connect(lp); lp.connect(g); g.connect(comp);
  s.start(t); s.stop(t + 1.3);
}
// 締太鼓
function taiko(f, vol, dur){
  if (!aOK()) return;
  var t = ac.currentTime, D = dur || 0.3, V = clamp(vol || 0.4, 0, 1);
  var F = isFinite(f) && f > 20 ? f : 180;
  var i;
  for (i = 0; i < 2; i++){
    var o = ac.createOscillator(); o.type = 'sine';
    var g = ac.createGain();
    var ff = F * (i ? 1.48 : 1);
    o.frequency.setValueAtTime(ff, t);
    o.frequency.exponentialRampToValueAtTime(ff*0.6, t + 0.09);
    g.gain.setValueAtTime(V * (i ? 0.4 : 1), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + D);
    o.connect(g); g.connect(comp); o.start(t); o.stop(t + D + 0.03);
  }
  var nz = noise(), lp = ac.createBiquadFilter(), ng = ac.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 1600;
  ng.gain.setValueAtTime(V*0.7, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  nz.connect(lp); lp.connect(ng); ng.connect(comp);
  nz.start(t); nz.stop(t + 0.1);
}
// 鉦 — the bell that ends a bout
function kane(f, vol){
  if (!aOK()) return;
  var t = ac.currentTime, V = clamp(vol || 0.3, 0, 1);
  var F = isFinite(f) && f > 40 ? f : 660;
  var rat = [1, 2.76, 5.4], amp = [1, 0.5, 0.24], i;
  for (i = 0; i < 3; i++){
    var o = ac.createOscillator(); o.type = 'sine';
    var g = ac.createGain();
    o.frequency.value = F * rat[i];
    g.gain.setValueAtTime(V * amp[i], t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 - i*0.6);
    o.connect(g); g.connect(comp); o.start(t); o.stop(t + 2.7);
  }
}
// the sub pulse under a bout — speeds up as こらえ runs out
var pulseAt = 0;
function pulse(rate, vol){
  if (!aOK()) return;
  var t = ac.currentTime;
  if (t < pulseAt) return;
  pulseAt = t + Math.max(0.16, rate);
  var o = ac.createOscillator(); o.type = 'sine';
  var g = ac.createGain();
  o.frequency.setValueAtTime(58, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(clamp(vol, 0.01, 0.6), t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(comp); o.start(t); o.stop(t + 0.24);
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing = 'user', mirror = true, stream = null, started = false;

function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display = 'block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:960 }, height:{ ideal:720 } },
    audio:false
  }).then(function(st){
    stream = st; video.srcObject = st; mirror = (facing === 'user');
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing === 'user') ? 'environment' : 'user';
  loseFace();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  FACE — 468 landmarks, of which this piece reads twenty.
// ═══════════════════════════════════════════════════════════════════════
var NL = 468;
var fx = new Float32Array(NL * 2);           // mirrored, normalised
var KEY = [234,454,10,152,61,291,13,14,0,17,159,145,33,133,386,374,263,362,105,334,1];
var OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,
            152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
var LIPS = [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];
var EYE_L = [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
var EYE_R = [263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466];

var face = {
  live:false, t:-1e9, seen:0,
  cx:.5, cy:.45, fw:.3, fh:.4, roll:0,
  mw:.42, lift:0, open:.02, eye:.055, brow:.05
};
var base = { mw:.42, lift:0, open:.02, eye:.055, brow:.05 };
var calN = 0, calAcc = { mw:0, lift:0, open:0, eye:0, brow:0 };

var smileRaw = 0, smile = 0;                  // 0..1, smoothed
var FACE_LOST_MS = 420;

function gx(i){ return fx[i*2]; }
function gy(i){ return fx[i*2+1]; }
function gd(a,b){ return Math.hypot(gx(a)-gx(b), gy(a)-gy(b)); }

function validFace(c){
  if (!c || c.length < NL) return false;
  for (var i = 0; i < KEY.length; i++){
    var p = c[KEY[i]];
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' ||
        !isFinite(p.x) || !isFinite(p.y)) return false;
  }
  return true;
}
function onFace(res){
  var raw = (res && res.multiFaceLandmarks) ? res.multiFaceLandmarks : [];
  var c = raw.length ? raw[0] : null;
  if (!validFace(c)) return;
  var i;
  for (i = 0; i < NL; i++){
    var p = c[i];
    var X = (p && isFinite(p.x)) ? p.x : 0.5;
    var Y = (p && isFinite(p.y)) ? p.y : 0.5;
    fx[i*2]   = mirror ? (1 - X) : X;
    fx[i*2+1] = Y;
  }
  var fw = gd(234, 454), fh = gd(10, 152);
  if (!isFinite(fw) || !isFinite(fh) || fw < 0.04 || fh < 0.05) return;

  var mw   = gd(61, 291) / fw;
  var cyM  = (gy(61) + gy(291)) * 0.5;
  var lipC = (gy(13) + gy(14)) * 0.5;
  var lift = (lipC - cyM) / fh;
  var open = gd(13, 14) / fh;
  var eye  = (gd(159,145) + gd(386,374)) * 0.5 / fh;
  var brow = ((gy(159) - gy(105)) + (gy(386) - gy(334))) * 0.5 / fh;
  if (!isFinite(mw) || !isFinite(lift) || !isFinite(open) ||
      !isFinite(eye) || !isFinite(brow)) return;

  face.fw = fw; face.fh = fh;
  face.cx = (gx(234) + gx(454)) * 0.5;
  face.cy = (gy(10) + gy(152)) * 0.5;
  face.roll = Math.atan2(gy(454) - gy(234), gx(454) - gx(234));
  face.mw = mw; face.lift = lift; face.open = open; face.eye = eye; face.brow = brow;
  face.t = now();
  if (!face.live) face.seen = 0;
  face.live = true; face.seen++;
}
function loseFace(){
  face.live = false; face.t = -1e9; face.seen = 0;
  smileRaw = 0; smile = 0;                    // never carry a smile across a dropout
}
function calibReset(){
  calN = 0; calAcc.mw = 0; calAcc.lift = 0; calAcc.open = 0; calAcc.eye = 0; calAcc.brow = 0;
}
function calibFeed(){
  if (!face.live || face.seen < 3) return;
  calAcc.mw += face.mw; calAcc.lift += face.lift; calAcc.open += face.open;
  calAcc.eye += face.eye; calAcc.brow += face.brow; calN++;
  if (calN >= 6){
    base.mw = calAcc.mw/calN; base.lift = calAcc.lift/calN; base.open = calAcc.open/calN;
    base.eye = calAcc.eye/calN; base.brow = calAcc.brow/calN;
  }
}
// the measurement. Deadzone sits above landmark jitter — verified in the harness.
var DEAD = 0.145, SPAN = 0.80, STALE_MS = 150;
function measureSmile(dt){
  // stale landmarks are not evidence. If the model has not produced a fresh
  // face in STALE_MS the smile decays to nothing rather than being held —
  // otherwise a player who laughs and then walks out of frame keeps filling
  // the meter from a measurement that is no longer true.
  if (!face.live || face.seen < 4 || calN < 6 || now() - face.t > STALE_MS){
    smile += (0 - smile) * clamp(dt*8, 0, 1);
    if (smile < 1e-4) smile = 0;
    return;
  }
  var r = 4.0 * (face.mw   - base.mw)
        + 9.5 * (face.lift - base.lift)
        + 3.0 * (face.open - base.open)
        + 11.0 * (base.eye - face.eye);
  if (!isFinite(r)) r = 0;
  smileRaw = r;
  var s = clamp((r - DEAD) / SPAN, 0, 1);
  smile += (s - smile) * clamp(dt * 9, 0, 1);
  if (!isFinite(smile)) smile = 0;
  // very slow baseline creep, only while the face is unmistakably neutral
  if (r < 0.04 && r > -0.30){
    var k = clamp(dt * 0.05, 0, 0.05);
    base.mw   += (face.mw   - base.mw)   * k;
    base.lift += (face.lift - base.lift) * k;
    base.eye  += (face.eye  - base.eye)  * k;
  }
}

var faceMesh = null, mpCamera = null, mpReady = false;
function initFaceMesh(){
  if (typeof window.FaceMesh !== 'function') return false;
  try {
    faceMesh = new window.FaceMesh({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f;
    }});
    faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:false,
      minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    faceMesh.onResults(onFace);
    mpReady = true; return true;
  } catch(e){ return false; }
}
function startMpCamera(){
  if (!mpReady || typeof window.Camera !== 'function') return;
  try {
    if (mpCamera && mpCamera.stop) mpCamera.stop();
    mpCamera = new window.Camera(video, {
      onFrame:function(){
        if (!faceMesh || !started) return Promise.resolve();
        return faceMesh.send({ image:video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  } catch(e){ mpReady = false; }
}

// ═══════════════════════════════════════════════════════════════════════
//  SPRINGS — the motion language of the whole piece
// ═══════════════════════════════════════════════════════════════════════
function Spr(v, k, d){ this.x = v; this.t = v; this.v = 0; this.k = k || 140; this.d = d || 12; }
Spr.prototype.step = function(dt){
  var a = (this.t - this.x) * this.k - this.v * this.d;
  this.v += a * dt; this.x += this.v * dt;
  if (!isFinite(this.x) || !isFinite(this.v)){ this.x = this.t; this.v = 0; }
};
Spr.prototype.to = function(t){ if (isFinite(t)) this.t = t; };
Spr.prototype.kick = function(v){ if (isFinite(v)) this.v += v; };

var M = {
  fw:new Spr(1,130,11), fh:new Spr(1,130,11),
  eyeL:new Spr(1,180,10), eyeR:new Spr(1,180,10),
  browL:new Spr(0,150,11), browR:new Spr(0,150,11),
  mouthW:new Spr(.5,150,11), mouthH:new Spr(.16,150,10), curve:new Spr(-.2,140,11),
  tongue:new Spr(0,110,9), puff:new Spr(0,90,8),
  tilt:new Spr(0,90,9), bob:new Spr(0,70,7), lean:new Spr(0,80,9),
  pupX:new Spr(0,120,13), pupY:new Spr(0,120,13)
};
function stepSprings(dt){
  for (var k in M) if (M.hasOwnProperty(k)) M[k].step(dt);
}
function idleTargets(t){
  var s = t * 0.001;
  M.fw.to(1); M.fh.to(1);
  M.eyeL.to(1); M.eyeR.to(1);
  M.browL.to(Math.sin(s*1.1)*0.03); M.browR.to(Math.sin(s*1.1+1)*0.03);
  M.mouthW.to(0.46); M.mouthH.to(0.14); M.curve.to(-0.18);
  M.tongue.to(0); M.puff.to(0);
  M.tilt.to(Math.sin(s*0.7)*0.05);
  M.bob.to(Math.sin(s*1.3)*0.012);
  M.lean.to(0);
}

// ═══════════════════════════════════════════════════════════════════════
//  TAUNTS
// ═══════════════════════════════════════════════════════════════════════
var TAUNTS = [
  { id:'hyottoko', name:'ひょっとこ' },
  { id:'berodashi', name:'べろだし' },
  { id:'fukura',   name:'ふくらまし' },
  { id:'nirami',   name:'にらみ' },
  { id:'manekko',  name:'まねっこ' },
  { id:'oowarai',  name:'おおわらい' }
];
var taunt = { id:'', name:'', t0:-1e9, dur:0 };
var shake = 0, flash = 0, confetti = [];

function fireTaunt(id, name){
  taunt.id = id; taunt.name = name; taunt.t0 = now(); taunt.dur = 1500;
  popT = now(); shake = Math.max(shake, 6);
  M.bob.kick(-2.4); M.fw.kick(1.2); M.fh.kick(-1.0);
  switch(id){
    case 'hyottoko':
      M.mouthW.to(0.17); M.mouthH.to(0.34); M.curve.to(0);
      M.eyeL.to(0.22); M.eyeR.to(1.5); M.browL.to(-0.10); M.browR.to(0.13);
      M.tilt.to(0.20); taunt.dur = 1500;
      fue(880, 0.5, 0.28); taiko(190, 0.4, 0.28);
      break;
    case 'berodashi':
      M.mouthW.to(0.62); M.mouthH.to(0.30); M.curve.to(0.22); M.tongue.to(1);
      M.eyeL.to(0.35); M.eyeR.to(0.35); M.pupX.to(0.42); M.browL.to(0.16); M.browR.to(0.16);
      taunt.dur = 1600;
      shamisen(392, 0.34); fue(1174, 0.32, 0.22);
      break;
    case 'fukura':
      M.puff.to(1); M.fw.to(1.24); M.fh.to(1.06);
      M.mouthW.to(0.24); M.mouthH.to(0.10); M.curve.to(0);
      M.eyeL.to(0.30); M.eyeR.to(0.30); taunt.dur = 1700;
      fue(587, 0.9, 0.2); taiko(120, 0.34, 0.5);
      break;
    case 'nirami':
      M.eyeL.to(1.75); M.eyeR.to(1.75); M.browL.to(-0.16); M.browR.to(-0.16);
      M.mouthW.to(0.34); M.mouthH.to(0.06); M.curve.to(-0.5);
      M.lean.to(1); M.fw.to(1.12); M.fh.to(1.12); taunt.dur = 1900;
      taiko(90, 0.5, 0.7); shamisen(196, 0.3);
      break;
    case 'manekko':
      taunt.dur = 2600;
      shamisen(294, 0.3); fue(784, 0.22, 0.18);
      break;
    case 'oowarai':
      M.mouthW.to(0.72); M.mouthH.to(0.44); M.curve.to(0.6);
      M.eyeL.to(0.14); M.eyeR.to(0.14); M.browL.to(0.20); M.browR.to(0.20);
      taunt.dur = 2100;
      taiko(150, 0.45, 0.3); shamisen(523, 0.3); fue(1046, 0.6, 0.26);
      spray(14);
      break;
  }
}
function spray(n){
  for (var i = 0; i < n; i++){
    if (confetti.length > 120) break;
    confetti.push({
      x: mask.cx + (Math.random()-0.5) * mask.r * 1.4,
      y: mask.cy + (Math.random()-0.5) * mask.r * 0.8,
      vx: (Math.random()-0.5) * 260 * S, vy: -(120 + Math.random()*260) * S,
      a: Math.random()*Math.PI, va: (Math.random()-0.5)*10,
      life: 1, col: [C_KAKI, C_MOEGI, C_KIN, C_SUMI][(Math.random()*4)|0]
    });
  }
}
function stepConfetti(dt){
  for (var i = confetti.length - 1; i >= 0; i--){
    var p = confetti[i];
    p.vy += 900 * S * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.a += p.va * dt; p.life -= dt * 0.5;
    if (p.life <= 0 || p.y > H + 40) confetti.splice(i, 1);
  }
}
// while a taunt is live, it keeps steering the springs
function tauntDrive(t){
  var e = t - taunt.t0;
  if (e < 0 || e > taunt.dur) return false;
  var u = e / taunt.dur;
  switch(taunt.id){
    case 'hyottoko':
      M.tilt.to(0.20 * Math.cos(e*0.011));
      M.mouthH.to(0.30 + Math.sin(e*0.016)*0.09);
      break;
    case 'berodashi':
      M.pupX.to(0.42 * Math.cos(e*0.009));
      M.tongue.to(0.8 + Math.sin(e*0.013)*0.22);
      break;
    case 'fukura':
      if (u > 0.72){ M.puff.to(0); M.fw.to(1); M.fh.to(1);
        M.mouthW.to(0.6); M.mouthH.to(0.26); M.curve.to(0.3); }
      break;
    case 'nirami':
      M.lean.to(u < 0.8 ? 1 : 0.2);
      break;
    case 'manekko':
      mimic();
      break;
    case 'oowarai':
      M.bob.to(Math.sin(e*0.028)*0.05);
      M.tilt.to(Math.sin(e*0.021)*0.11);
      if (Math.random() < 0.14) spray(2);
      break;
  }
  return true;
}
// THE SIGNATURE — the mask stops acting and becomes an amplified you
function mimic(){
  if (!face.live){ M.mouthW.to(0.46); M.mouthH.to(0.16); return; }
  var dmw   = clamp((face.mw   - base.mw)   * 3.4, -0.3, 0.42);
  var dopen = clamp((face.open - base.open) * 3.0, -0.1, 0.42);
  var deye  = clamp((face.eye  - base.eye)  * 16,  -0.9, 1.1);
  var dbrow = clamp((face.brow - base.brow) * 9,   -0.3, 0.34);
  var dlift = clamp((base.lift - face.lift) * 9,   -0.5, 0.7);
  M.mouthW.to(clamp(0.46 + dmw, 0.14, 0.9));
  M.mouthH.to(clamp(0.14 + dopen, 0.04, 0.5));
  M.curve.to(clamp(-0.18 + dlift, -0.6, 0.7));
  M.eyeL.to(clamp(1 + deye, 0.08, 2.0));
  M.eyeR.to(clamp(1 + deye, 0.08, 2.0));
  M.browL.to(clamp(dbrow, -0.24, 0.34));
  M.browR.to(clamp(dbrow, -0.24, 0.34));
  M.tilt.to(clamp(-face.roll * 2.2, -0.5, 0.5));
  M.puff.to(clamp(dmw < -0.06 ? 0.7 : 0, 0, 1));
  M.tongue.to(0);
}

// ═══════════════════════════════════════════════════════════════════════
//  MATCH
// ═══════════════════════════════════════════════════════════════════════
var ROUNDS = [
  { name:'一番', dur: 7000,  fill:1.00, iv:1550, pool:['hyottoko','berodashi'] },
  { name:'二番', dur: 8500,  fill:1.20, iv:1400, pool:['hyottoko','berodashi','fukura'] },
  { name:'三番', dur:10000,  fill:1.42, iv:1250, pool:['berodashi','fukura','nirami','manekko'] },
  { name:'四番', dur:11500,  fill:1.66, iv:1100, pool:['fukura','nirami','manekko','oowarai'] },
  { name:'五番', dur:13500,  fill:1.95, iv: 950, pool:['nirami','manekko','oowarai','berodashi'] }
];
var state = 'idle';       // idle | kamae | seme | won | lose | clear
var ri = 0, stateT = 0, gauge = 0, score = 0, nextTaunt = 0, over = false;
var popT = -1e9, bannerT = -1e9, bannerTxt = '', bannerSub = '';
var stoneT = 0;           // how long the player has been stone-faced
var lastPool = -1;

function setState(s){ state = s; stateT = now(); }
function beginMatch(){
  ri = 0; score = 0; gauge = 0; over = false; confetti.length = 0;
  beginRound();
}
function beginRound(){
  gauge = 0; nextTaunt = 0; taunt.t0 = -1e9; taunt.id = ''; lastPool = -1;
  calibReset();
  setState('kamae');
  roundLbl.textContent = ROUNDS[ri].name;
  stateLbl.textContent = 'かまえ';
  banner(ROUNDS[ri].name, 'かまえ');
  taiko(140, 0.34, 0.34);
}
function banner(txt, sub){ bannerTxt = txt; bannerSub = sub || ''; bannerT = now(); }

function startSeme(){
  if (state !== 'kamae') return;
  setState('seme');
  stateLbl.textContent = 'しょうぶ';
  banner('はじめ', '');
  fue(784, 0.4, 0.3); taiko(160, 0.45, 0.3);
  nextTaunt = now() + 700;
}
function winRound(){
  if (state !== 'seme') return;                    // idempotent
  setState('won');
  var keep = Math.floor((1 - gauge) * 500);
  score += 1000 * (ri + 1) + keep;
  scoreLbl.textContent = String(score);
  stateLbl.textContent = 'かち';
  banner('こらえた', ROUNDS[ri].name + ' ' + (keep > 0 ? '+' + keep : ''));
  kane(880, 0.26); taiko(150, 0.4, 0.4);
  spray(18);
  idleTargets(now());
}
function loseMatch(){
  if (over || state !== 'seme') return;            // idempotent
  over = true;
  setState('lose');
  stateLbl.textContent = 'まけ';
  banner('わらった', ROUNDS[ri].name + 'で負け');
  kane(392, 0.3); taiko(90, 0.5, 0.8);
  shamisen(147, 0.3);
  M.mouthW.to(0.8); M.mouthH.to(0.5); M.curve.to(0.75);
  M.eyeL.to(0.1); M.eyeR.to(0.1); M.bob.kick(-3);
  spray(30); flash = 1;
}
function clearMatch(){
  setState('clear');
  stateLbl.textContent = 'かちぬけ';
  banner('五番勝ち抜き', String(score) + 'てん');
  kane(1046, 0.3); fue(1318, 0.7, 0.3); taiko(150, 0.45, 0.5);
  spray(50);
}

function stepMatch(dt){
  var t = now();
  if (state === 'kamae'){
    calibFeed();
    var ready = (calN >= 6);
    stateLbl.textContent = ready ? 'かまえ' : 'かおをうつす';
    if (ready && t - stateT > 1800) startSeme();
    if (!ready && t - stateT > 12000) { /* keep waiting; the HUD says why */ }
    idleTargets(t);
    return;
  }
  if (state === 'seme'){
    var R = ROUNDS[ri];
    var e = t - stateT;
    // こらえ
    var fresh = face.live && face.seen > 4 && (t - face.t) <= STALE_MS;
    if (fresh){
      var s = Math.pow(smile, 1.6);
      gauge += (s * 0.62 * R.fill - 0.34 * (1 - smile)) * dt;
      gauge = clamp(gauge, 0, 1.2);
      if (smile < 0.09) stoneT += dt; else stoneT = 0;
    } else {
      stoneT = 0;
    }
    if (gauge >= 1){ loseMatch(); return; }
    // sub pulse tightens as こらえ runs out
    pulse(0.92 - gauge * 0.6, 0.10 + gauge * 0.22);
    // taunts
    if (t >= nextTaunt && e < R.dur - 500){
      var pool = R.pool, k = (Math.random() * pool.length) | 0;
      if (pool.length > 1 && k === lastPool) k = (k + 1) % pool.length;
      lastPool = k;
      var id = pool[k], nm = 'まねっこ';
      for (var i = 0; i < TAUNTS.length; i++) if (TAUNTS[i].id === id) nm = TAUNTS[i].name;
      fireTaunt(id, nm);
      nextTaunt = t + R.iv * (0.8 + Math.random()*0.5);
    }
    if (!tauntDrive(t)) idleTargets(t);
    // the mask sweats if it is getting nowhere
    if (e >= R.dur) winRound();
    return;
  }
  if (state === 'won'){
    idleTargets(t);
    if (t - stateT > 1600){
      ri++;
      if (ri >= ROUNDS.length) clearMatch(); else beginRound();
    }
    return;
  }
  if (state === 'lose' || state === 'clear'){
    if (state === 'clear') idleTargets(t);
    return;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAWING
// ═══════════════════════════════════════════════════════════════════════
var mask = { cx:0, cy:0, r:0 };
function layout(){
  mask.cx = W * 0.5;
  mask.cy = portrait ? H * 0.37 : H * 0.45;
  mask.r  = portrait ? Math.min(W * 0.36, H * 0.22) : Math.min(W * 0.22, H * 0.30);
}

function drawBackground(){
  ctx.fillStyle = C_PAPER;
  ctx.fillRect(0, 0, W, H);
  // 提灯 light, two warm pools
  var lg = ctx.createRadialGradient(W*0.14, H*0.10, 0, W*0.14, H*0.10, Math.max(W,H)*0.55);
  lg.addColorStop(0, 'rgba(201,154,60,.22)');
  lg.addColorStop(1, 'rgba(201,154,60,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  var rg = ctx.createRadialGradient(W*0.86, H*0.10, 0, W*0.86, H*0.10, Math.max(W,H)*0.55);
  rg.addColorStop(0, 'rgba(201,154,60,.18)');
  rg.addColorStop(1, 'rgba(201,154,60,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  // 定式幕 valance
  var vh = Math.max(14, H * 0.055);
  var bands = [C_SUMI, C_KAKI, C_MOEGI];
  var bw = Math.max(26, W / 14);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, vh); ctx.clip();
  for (var i = 0; i * bw < W + bw; i++){
    ctx.fillStyle = bands[i % 3];
    ctx.fillRect(i * bw, 0, bw + 1, vh);
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(31,26,21,.18)';
  ctx.fillRect(0, vh, W, Math.max(2, 3*S));
  // grain
  if (grain){
    var p = ctx.createPattern(grain, 'repeat');
    if (p){ ctx.fillStyle = p; ctx.fillRect(0, 0, W, H); }
  }
  // floor shadow under the mask
  ctx.save();
  ctx.globalAlpha = 0.13;
  ctx.fillStyle = C_SUMI;
  ctx.beginPath();
  ctx.ellipse(mask.cx, mask.cy + mask.r * 1.32, mask.r * 0.86, mask.r * 0.14, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function strokeChain(idx, close, w, col, sx, sy, ox, oy){
  var n = idx.length, first = true, i;
  ctx.beginPath();
  for (i = 0; i < n; i++){
    var j = idx[i];
    var x = gx(j), y = gy(j);
    if (!isFinite(x) || !isFinite(y)) return;
    var px = ox + x * sx, py = oy + y * sy;
    if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
  }
  if (close) ctx.closePath();
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
}

// the mask itself
function drawMask(t){
  var r = mask.r;
  var lean = M.lean.x;
  var sc = 1 + lean * 0.16 + (state === 'lose' ? 0.06 : 0);
  ctx.save();
  ctx.translate(mask.cx, mask.cy + M.bob.x * r);
  ctx.rotate(M.tilt.x * 0.45);
  ctx.scale(sc, sc);

  var fw = r * 0.92 * clamp(M.fw.x, 0.5, 1.8);
  var fh = r * 1.10 * clamp(M.fh.x, 0.5, 1.8);
  var puff = clamp(M.puff.x, 0, 1.2);

  // 首
  ctx.fillStyle = '#e2d6bd';
  ctx.strokeStyle = C_SUMI; ctx.lineWidth = Math.max(1.6, 3*S);
  ctx.beginPath();
  ctx.moveTo(-fw*0.30, fh*0.72); ctx.lineTo(-fw*0.36, fh*1.22);
  ctx.lineTo( fw*0.36, fh*1.22); ctx.lineTo( fw*0.30, fh*0.72);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // face
  ctx.beginPath();
  ctx.ellipse(0, 0, fw, fh, 0, 0, Math.PI*2);
  ctx.fillStyle = C_GOFUN; ctx.fill();
  // puffed cheeks bulge the silhouette
  if (puff > 0.02){
    ctx.beginPath();
    ctx.ellipse(-fw*0.82, fh*0.18, fw*0.30*puff, fh*0.26*puff, 0, 0, Math.PI*2);
    ctx.ellipse( fw*0.82, fh*0.18, fw*0.30*puff, fh*0.26*puff, 0, 0, Math.PI*2);
    ctx.fillStyle = C_GOFUN; ctx.fill();
    ctx.lineWidth = Math.max(1.6, 3.2*S); ctx.strokeStyle = C_SUMI; ctx.stroke();
  }
  ctx.beginPath();
  ctx.ellipse(0, 0, fw, fh, 0, 0, Math.PI*2);
  ctx.lineWidth = Math.max(1.8, 4*S); ctx.strokeStyle = C_SUMI; ctx.stroke();

  // 鉢巻
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, fw, fh, 0, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = C_KAKI;
  ctx.fillRect(-fw*1.1, -fh*0.86, fw*2.2, fh*0.24);
  ctx.fillStyle = 'rgba(31,26,21,.22)';
  ctx.fillRect(-fw*1.1, -fh*0.64, fw*2.2, Math.max(1.4, 2.4*S));
  ctx.restore();
  ctx.strokeStyle = C_SUMI; ctx.lineWidth = Math.max(1.4, 2.6*S);
  ctx.beginPath(); ctx.moveTo(-fw*0.94, -fh*0.62); ctx.lineTo(fw*0.94, -fh*0.62); ctx.stroke();

  // blush
  var bl = 0.32 + puff * 0.5 + gauge * 0.3;
  ctx.save();
  ctx.globalAlpha = clamp(bl, 0, 0.85);
  ctx.fillStyle = C_KAKI;
  ctx.beginPath();
  ctx.ellipse(-fw*0.56, fh*0.20, fw*0.24, fh*0.13, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse( fw*0.56, fh*0.20, fw*0.24, fh*0.13, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // eyes
  var ey = -fh*0.16;
  drawEye(-fw*0.40, ey, fw*0.24, fh*0.17*clamp(M.eyeL.x,0.05,2.2), M.pupX.x, M.pupY.x);
  drawEye( fw*0.40, ey, fw*0.24, fh*0.17*clamp(M.eyeR.x,0.05,2.2), M.pupX.x, M.pupY.x);

  // brows
  drawBrow(-fw*0.42, ey - fh*0.28 - M.browL.x*fh*0.4, fw*0.30,  M.browL.x);
  drawBrow( fw*0.42, ey - fh*0.28 - M.browR.x*fh*0.4, fw*0.30, -M.browR.x);

  // nose
  ctx.strokeStyle = C_SUMI; ctx.lineWidth = Math.max(1.4, 3*S);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, ey + fh*0.10);
  ctx.quadraticCurveTo(fw*0.10, fh*0.20, -fw*0.04, fh*0.24);
  ctx.stroke();

  // mouth
  drawMouth(0, fh*0.50, fw*clamp(M.mouthW.x,0.05,1.0), fh*clamp(M.mouthH.x,0.01,0.6),
            clamp(M.curve.x,-0.9,0.9), clamp(M.tongue.x,0,1.2));

  // sweat, if the mask is losing the bout
  if (state === 'seme' && stoneT > 2.6){
    var a = clamp((stoneT - 2.6) / 1.2, 0, 1);
    ctx.save(); ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = '#7fa8c4'; ctx.strokeStyle = C_SUMI;
    ctx.lineWidth = Math.max(1, 1.8*S);
    for (var q = 0; q < 2; q++){
      var dy = ((t*0.16 + q*300) % 700) / 700;
      ctx.beginPath();
      ctx.ellipse(fw*(0.86 + q*0.10), -fh*0.40 + dy*fh*0.5, fw*0.055, fh*0.075, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}
function drawEye(x, y, rw, rh, px, py){
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath();
  ctx.ellipse(0, 0, rw, Math.max(rh, rw*0.05), 0, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.lineWidth = Math.max(1.4, 3*S); ctx.strokeStyle = C_SUMI; ctx.stroke();
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, rw, Math.max(rh, rw*0.05), 0, 0, Math.PI*2);
  ctx.clip();
  var pr = Math.min(rw*0.44, Math.max(rh*0.8, rw*0.2));
  ctx.beginPath();
  ctx.arc(px*rw*0.5, py*rh*0.5, pr, 0, Math.PI*2);
  ctx.fillStyle = C_SUMI; ctx.fill();
  ctx.beginPath();
  ctx.arc(px*rw*0.5 - pr*0.3, py*rh*0.5 - pr*0.34, pr*0.28, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawBrow(x, y, w, tilt){
  ctx.save(); ctx.translate(x, y); ctx.rotate(clamp(tilt, -0.5, 0.5) * 0.9);
  ctx.beginPath();
  ctx.moveTo(-w, w*0.16);
  ctx.quadraticCurveTo(0, -w*0.34, w, w*0.10);
  ctx.quadraticCurveTo(0, -w*0.06, -w, w*0.16);
  ctx.closePath();
  ctx.fillStyle = C_SUMI; ctx.fill();
  ctx.restore();
}
function drawMouth(x, y, w, h, curve, tongue){
  ctx.save(); ctx.translate(x, y);
  var cy = curve * h * 2.4;
  ctx.beginPath();
  ctx.moveTo(-w, 0);
  ctx.quadraticCurveTo(0, cy - h, w, 0);
  ctx.quadraticCurveTo(0, cy + h, -w, 0);
  ctx.closePath();
  ctx.fillStyle = '#5d1f16'; ctx.fill();
  ctx.lineWidth = Math.max(1.6, 3.4*S); ctx.strokeStyle = C_SUMI; ctx.stroke();
  if (tongue > 0.02){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-w*0.5, cy*0.2);
    ctx.quadraticCurveTo(0, cy*0.2 + h*2.4*tongue, w*0.5, cy*0.2);
    ctx.closePath();
    ctx.fillStyle = C_KAKI; ctx.fill();
    ctx.lineWidth = Math.max(1.2, 2.4*S); ctx.strokeStyle = C_SUMI; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// the player's own face, drawn as a line portrait in a paper window
function drawSelf(){
  var r = portrait ? Math.min(W*0.16, 74*S*1.4) : Math.min(W*0.10, 84*S*1.4);
  r = Math.max(44, r);
  var cx = W - r - 18, cy = H - r - (portrait ? 96 : 72);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = C_GOFUN; ctx.fill();
  ctx.lineWidth = Math.max(1.6, 3*S);
  ctx.strokeStyle = face.live ? C_SUMI : 'rgba(31,26,21,.3)';
  ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI*2); ctx.clip();
  if (face.live && face.fw > 0.02){
    var k = (r * 1.55) / Math.max(face.fw, 0.02);
    var ox = cx - face.cx * k, oy = cy - face.cy * k;
    var col = smile > 0.25 ? C_KAKI : C_SUMI;
    strokeChain(OVAL,  true,  Math.max(1.2, 2.2*S), col, k, k, ox, oy);
    strokeChain(LIPS,  true,  Math.max(1.2, 2.2*S), col, k, k, ox, oy);
    strokeChain(EYE_L, true,  Math.max(1, 1.7*S), col, k, k, ox, oy);
    strokeChain(EYE_R, true,  Math.max(1, 1.7*S), col, k, k, ox, oy);
  } else {
    ctx.fillStyle = 'rgba(31,26,21,.35)';
    ctx.font = Math.round(Math.max(10, 13*S*1.1)) + "px 'Kiwi Maru',serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('かおが', cx, cy - 9);
    ctx.fillText('みえません', cx, cy + 9);
  }
  ctx.restore();
  ctx.restore();
  ctx.fillStyle = C_MOEGI;
  ctx.font = Math.round(Math.max(9, 10.5*S*1.1)) + "px 'Kiwi Maru',serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('あなた', cx, cy + r + 5);
}

// こらえ meter
function drawGauge(){
  var gw = Math.min(W * 0.74, 520);
  var gh = Math.max(15, 22 * S);
  var gxp = (W - gw) / 2;
  var gyp = H - gh - (portrait ? 52 : 34);
  var sh = gauge > 0.7 ? (gauge - 0.7) * 10 * S * Math.sin(now()*0.05) : 0;
  ctx.save();
  ctx.translate(sh, 0);
  ctx.fillStyle = C_GOFUN;
  ctx.fillRect(gxp, gyp, gw, gh);
  var fillW = gw * clamp(gauge, 0, 1);
  if (fillW > 1){
    var g = ctx.createLinearGradient(gxp, 0, gxp + gw, 0);
    g.addColorStop(0, C_MOEGI); g.addColorStop(0.55, C_KIN); g.addColorStop(1, C_KAKI);
    ctx.fillStyle = g;
    ctx.fillRect(gxp, gyp, fillW, gh);
  }
  // bamboo nodes
  ctx.strokeStyle = 'rgba(31,26,21,.24)'; ctx.lineWidth = 1;
  for (var i = 1; i < 10; i++){
    ctx.beginPath();
    ctx.moveTo(gxp + gw*i/10, gyp); ctx.lineTo(gxp + gw*i/10, gyp + gh); ctx.stroke();
  }
  ctx.lineWidth = Math.max(1.6, 3*S); ctx.strokeStyle = C_SUMI;
  ctx.strokeRect(gxp, gyp, gw, gh);
  ctx.restore();
  ctx.fillStyle = C_SUMI;
  ctx.font = Math.round(Math.max(11, 13*S*1.1)) + "px 'Reggae One',cursive";
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('こらえ', gxp, gyp - 5);
  ctx.textAlign = 'right';
  ctx.fillStyle = gauge > 0.7 ? C_KAKI : C_MOEGI;
  ctx.fillText(String(Math.round((1 - clamp(gauge,0,1)) * 100)), gxp + gw, gyp - 5);
  // round clock
  if (state === 'seme'){
    var R = ROUNDS[ri];
    var left = Math.max(0, R.dur - (now() - stateT));
    var cw = gw * (1 - left / R.dur);
    ctx.fillStyle = 'rgba(46,91,69,.5)';
    ctx.fillRect(gxp, gyp + gh + 4, cw, Math.max(2, 3.4*S));
    ctx.strokeStyle = 'rgba(31,26,21,.25)'; ctx.lineWidth = 1;
    ctx.strokeRect(gxp, gyp + gh + 4, gw, Math.max(2, 3.4*S));
  }
}

function drawTauntName(t){
  var e = t - popT;
  if (e < 0 || e > 1200 || !taunt.name) return;
  var u = e / 1200;
  var pop = e < 260 ? easeOut(e/260) : 1;
  var a = u > 0.72 ? 1 - (u - 0.72)/0.28 : 1;
  var sz = Math.max(26, mask.r * 0.42) * (0.7 + pop*0.3);
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.translate(mask.cx, mask.cy - mask.r * 1.30);
  ctx.rotate((1 - pop) * 0.24);
  ctx.font = Math.round(sz) + "px 'Reggae One',cursive";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, sz*0.14); ctx.strokeStyle = C_GOFUN;
  ctx.strokeText(taunt.name, 0, 0);
  ctx.fillStyle = C_KAKI;
  ctx.fillText(taunt.name, 0, 0);
  ctx.restore();
}
function drawBanner(t){
  var e = t - bannerT;
  if (e < 0 || e > 1700 || !bannerTxt) return;
  var pop = e < 300 ? easeOut(e/300) : 1;
  var a = e > 1200 ? 1 - (e - 1200)/500 : 1;
  var sz = Math.max(34, Math.min(W, H) * 0.11) * (0.72 + pop*0.28);
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.translate(W*0.5, mask.cy);
  ctx.font = Math.round(sz) + "px 'Reggae One',cursive";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(4, sz*0.16); ctx.strokeStyle = C_GOFUN;
  ctx.strokeText(bannerTxt, 0, 0);
  ctx.fillStyle = C_SUMI; ctx.fillText(bannerTxt, 0, 0);
  if (bannerSub){
    ctx.font = Math.round(sz*0.26) + "px 'Kiwi Maru',serif";
    ctx.lineWidth = Math.max(3, sz*0.06); ctx.strokeStyle = C_GOFUN;
    ctx.strokeText(bannerSub, 0, sz*0.66);
    ctx.fillStyle = C_MOEGI; ctx.fillText(bannerSub, 0, sz*0.66);
  }
  ctx.restore();
}
function drawEndCard(){
  if (state !== 'lose' && state !== 'clear') return;
  var e = now() - stateT;
  if (e < 900) return;
  var a = clamp((e - 900)/400, 0, 1);
  var cw = Math.min(W*0.82, 400), ch = Math.min(H*0.44, 260);
  var cxp = (W - cw)/2, cyp = H*0.52 - ch*0.3 + (1-a)*22;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(31,26,21,.12)';
  ctx.fillRect(cxp+8, cyp+8, cw, ch);
  ctx.fillStyle = C_GOFUN; ctx.fillRect(cxp, cyp, cw, ch);
  ctx.lineWidth = Math.max(1.8, 3.4*S); ctx.strokeStyle = C_SUMI;
  ctx.strokeRect(cxp, cyp, cw, ch);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = state === 'clear' ? C_MOEGI : C_KAKI;
  ctx.font = Math.round(Math.max(24, cw*0.11)) + "px 'Reggae One',cursive";
  ctx.fillText(state === 'clear' ? '五番勝ち抜き' : 'わらった', W*0.5, cyp + ch*0.10);
  ctx.fillStyle = C_SUMI;
  ctx.font = Math.round(Math.max(30, cw*0.16)) + "px 'Reggae One',cursive";
  ctx.fillText(String(score), W*0.5, cyp + ch*0.34);
  ctx.fillStyle = C_MOEGI;
  ctx.font = Math.round(Math.max(11, cw*0.048)) + "px 'Kiwi Maru',serif";
  ctx.fillText('てん  ／  ' + ROUNDS[ri].name + 'まで', W*0.5, cyp + ch*0.60);
  // retry button (canvas-drawn, hit-tested below)
  var bw = cw*0.56, bh = Math.max(38, ch*0.20);
  retryRect = { x:(W-bw)/2, y:cyp + ch*0.72, w:bw, h:bh };
  ctx.fillStyle = C_SUMI;
  ctx.fillRect(retryRect.x+4, retryRect.y+4, bw, bh);
  ctx.fillStyle = C_KAKI;
  ctx.fillRect(retryRect.x, retryRect.y, bw, bh);
  ctx.lineWidth = Math.max(1.6, 3*S); ctx.strokeStyle = C_SUMI;
  ctx.strokeRect(retryRect.x, retryRect.y, bw, bh);
  ctx.fillStyle = C_GOFUN;
  ctx.font = Math.round(Math.max(15, bh*0.44)) + "px 'Reggae One',cursive";
  ctx.textBaseline = 'middle';
  ctx.fillText('もういちど', W*0.5, retryRect.y + bh*0.54);
  ctx.restore();
}
var retryRect = null;

function drawConfetti(){
  for (var i = 0; i < confetti.length; i++){
    var p = confetti[i];
    ctx.save();
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.a);
    ctx.fillStyle = p.col;
    var s = 7 * S + 4;
    ctx.fillRect(-s*0.5, -s*0.22, s, s*0.44);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var last = 0;
function frame(t){
  requestAnimationFrame(frame);
  if (!last) last = t;
  var dt = clamp((t - last) / 1000, 0, 0.05);
  last = t;
  if (!started){ return; }

  if (face.live && now() - face.t > FACE_LOST_MS) loseFace();
  measureSmile(dt);
  stepMatch(dt);
  stepSprings(dt);
  stepConfetti(dt);
  shake = Math.max(0, shake - dt * 26);
  flash = Math.max(0, flash - dt * 2.2);

  layout();
  ctx.save();
  if (shake > 0.2){
    ctx.translate((Math.random()-0.5)*shake*S*1.6, (Math.random()-0.5)*shake*S*1.6);
  }
  drawBackground();
  drawMask(t);
  drawTauntName(t);
  drawConfetti();
  drawGauge();
  drawSelf();
  drawBanner(t);
  drawEndCard();
  ctx.restore();
  if (flash > 0.01){
    ctx.save();
    ctx.globalAlpha = clamp(flash, 0, 1) * 0.5;
    ctx.fillStyle = C_KAKI; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════════════
function pointAt(ev){
  var r = view.getBoundingClientRect();
  var cx = (ev.clientX !== undefined) ? ev.clientX :
           (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
  var cy = (ev.clientY !== undefined) ? ev.clientY :
           (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0);
  return { x: cx - r.left, y: cy - r.top };
}
view.addEventListener('pointerdown', function(ev){
  if (!started) return;
  if ((state === 'lose' || state === 'clear') && retryRect){
    var p = pointAt(ev);
    if (p.x >= retryRect.x && p.x <= retryRect.x + retryRect.w &&
        p.y >= retryRect.y && p.y <= retryRect.y + retryRect.h){
      taiko(160, 0.4, 0.3);
      beginMatch();
    }
  }
});

// ═══════════════════════════════════════════════════════════════════════
//  OVERLAY DEMO — teaches the whole game in about three seconds
// ═══════════════════════════════════════════════════════════════════════
var dctx = demoCv.getContext('2d');
var demoRun = true, demoT0 = 0;
function demoFace(x, y, r, smiling, funny, ph){
  dctx.save(); dctx.translate(x, y);
  dctx.beginPath(); dctx.ellipse(0, 0, r*0.92, r, 0, 0, Math.PI*2);
  dctx.fillStyle = C_GOFUN; dctx.fill();
  dctx.lineWidth = 3; dctx.strokeStyle = C_SUMI; dctx.stroke();
  var eo = funny ? (0.4 + Math.sin(ph*4)*0.4) : (smiling ? 0.3 : 1);
  dctx.fillStyle = C_SUMI;
  var ex = r*0.38, ey = -r*0.16, ew = r*0.13, eh = r*0.13*eo + 1.5;
  dctx.beginPath(); dctx.ellipse(-ex, ey, ew, eh, 0, 0, Math.PI*2); dctx.fill();
  dctx.beginPath(); dctx.ellipse( ex, ey, ew, eh, 0, 0, Math.PI*2); dctx.fill();
  var mw = funny ? r*0.16 : (smiling ? r*0.52 : r*0.34);
  var mh = funny ? r*0.34 : (smiling ? r*0.26 : r*0.05);
  var cv = smiling ? 0.5 : (funny ? 0 : -0.2);
  dctx.beginPath();
  dctx.moveTo(-mw, r*0.42);
  dctx.quadraticCurveTo(0, r*0.42 + cv*mh*2.4 - mh, mw, r*0.42);
  dctx.quadraticCurveTo(0, r*0.42 + cv*mh*2.4 + mh, -mw, r*0.42);
  dctx.closePath();
  dctx.fillStyle = '#5d1f16'; dctx.fill();
  dctx.lineWidth = 2.4; dctx.strokeStyle = C_SUMI; dctx.stroke();
  if (funny && Math.sin(ph*4) > 0){
    dctx.beginPath();
    dctx.moveTo(-mw*0.7, r*0.46);
    dctx.quadraticCurveTo(0, r*0.46 + mh*2.2, mw*0.7, r*0.46);
    dctx.closePath();
    dctx.fillStyle = C_KAKI; dctx.fill(); dctx.stroke();
  }
  dctx.restore();
}
function demoFrame(t){
  if (!demoRun) return;
  requestAnimationFrame(demoFrame);
  if (!demoT0) demoT0 = t;
  var e = ((t - demoT0) % 3400) / 1000;
  var w = demoCv.width, h = demoCv.height;
  dctx.setTransform(1,0,0,1,0,0);
  dctx.fillStyle = C_PAPER; dctx.fillRect(0, 0, w, h);
  dctx.fillStyle = C_MOEGI;
  dctx.font = "15px 'Kiwi Maru',serif";
  dctx.textAlign = 'center'; dctx.textBaseline = 'top';
  dctx.fillText('面', w*0.26, 14);
  dctx.fillText('あなた', w*0.74, 14);
  demoFace(w*0.26, h*0.56, h*0.30, false, true, e*2.2);
  var laughing = e > 2.2 && e < 3.1;
  demoFace(w*0.74, h*0.56, h*0.30, laughing, false, 0);
  if (laughing){
    dctx.save();
    dctx.globalAlpha = clamp(1 - (e - 2.2)/0.9, 0, 1);
    dctx.strokeStyle = C_KAKI; dctx.lineWidth = 9; dctx.lineCap = 'round';
    var r2 = h*0.30;
    dctx.beginPath();
    dctx.moveTo(w*0.74 - r2, h*0.56 - r2); dctx.lineTo(w*0.74 + r2, h*0.56 + r2);
    dctx.moveTo(w*0.74 + r2, h*0.56 - r2); dctx.lineTo(w*0.74 - r2, h*0.56 + r2);
    dctx.stroke();
    dctx.restore();
    dctx.fillStyle = C_KAKI;
    dctx.font = "22px 'Reggae One',cursive";
    dctx.textBaseline = 'bottom';
    dctx.fillText('まけ', w*0.74, h - 8);
  } else {
    dctx.fillStyle = C_SUMI;
    dctx.font = "17px 'Reggae One',cursive";
    dctx.textBaseline = 'bottom';
    dctx.fillText('まじめな顔をたもつ', w*0.5, h - 8);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════
function begin(){
  if (started) return;
  initAudio();                       // inside the click, as required
  started = true;
  demoRun = false;
  ov.classList.add('hide');
  initFaceMesh();
  startStream().then(startMpCamera).catch(showError);
  beginMatch();
}
startBtn.addEventListener('click', begin);
startBtn.addEventListener('touchend', function(e){ e.preventDefault(); begin(); }, {passive:false});

resize();
layout();
requestAnimationFrame(frame);
requestAnimationFrame(demoFrame);
</script>
