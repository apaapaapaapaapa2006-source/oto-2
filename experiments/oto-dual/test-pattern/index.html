<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Oto Dual — 接続テスト</title><style>body{margin:0;background:#000;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}</style><canvas id="gl"></canvas><script src="../dual.js"></script><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');
function frame(t){const wide=window.OtoDual?.active?2:1;const w=Math.round(innerWidth*wide),h=innerHeight;if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;
g.fillStyle='#153743';g.fillRect(0,0,c.width/2,c.height);g.fillStyle='#604130';g.fillRect(c.width/2,0,c.width/2,c.height);
g.strokeStyle='#d5e9da';g.lineWidth=2;for(let y=0;y<c.height;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(c.width,y);g.stroke();}
g.fillStyle='white';g.font='bold 32px system-ui';g.fillText('左 LEFT',30,100);g.fillText('右 RIGHT',c.width/2+30,100);
g.fillStyle='#e8ed7a';g.beginPath();g.arc((t/8)%c.width,c.height/2,30,0,Math.PI*2);g.fill();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
