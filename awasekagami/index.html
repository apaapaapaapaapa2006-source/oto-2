<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AWASEKAGAMI ─ 合わせ鏡の奥</title>
<meta name="description" content="カメラ映像が一フレームごとに自分自身へ映り込みつづける合わせ鏡。今のあなたが入ってこられるのは画面のふちと、手のひらに開いた穴だけで、そのあいだにあるものは全部あなたの過去が何十回も回されたもの。筒・渦・咲の三態。">
<meta name="theme-color" content="#06070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;600&family=Shippori+Antique&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  AWASEKAGAMI ─ 合わせ鏡の奥                    ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  PALETTE   黒曜 kokuyou  #06070a  the bench the whole thing sits on
            白銀 shirogane #dde5ee  every hairline, every tick, every letter
            鈍銀 nibigin  #6b7683  the labels that are not the reading
            紅   kurenai  #d9214b  exactly one accent: the live mode, and the
                                   ring that marks where you enter the loop
            The IMAGE has no palette. Its colour is generated, not chosen:
            hue is rotated a fraction of a degree per pass, so after forty
            passes a single face has walked all the way round the wheel.
            The only colours specified in this file are the instrument's.
            MOOD: an optical bench in a dark room. This is the one piece
            tonight that is allowed to be dark, and it is dark because a
            mirror corridor is.
  BACKGROUND  Not a vignette. Flat #06070a with concentric alignment rings
            engraved faintly around the image, corner ticks, and a hairline
            frame — the furniture of a lens diagram. It never animates.
  TYPE      Azeret Mono for every number and every Latin word, at 300 for
            labels and 600 for readings; Shippori Antique, a gothic cut on
            mincho bones, for Japanese. Instrument lettering, not titling.
  MOTION    不可逆. Nothing in this piece eases back to anywhere. Every
            control is a one-pole filter drifting toward its target and the
            image only ever accumulates. The single exception is the mode
            change, which is a hard one-frame cut with a white flash written
            straight into the feedback buffer — so the change itself becomes
            part of the recursion and spirals away for the next few seconds
            instead of being a transition you sat through.
  SIGNATURE 手のひらから吸い込まれる。The live camera can only enter the loop
            in two places: a soft ring at the very edge of the frame, and a
            disc on your palm. Everything between those two is your own past,
            resampled and hue-rotated once per frame, receding. Drag your
            hand and you drag the mouth of the tunnel with it.
  AUDIO     Near-silent and designed. One low drone whose pitch is derived
            from the measured recursion depth — the more copies of you are
            on screen, the lower it sits — with a tremolo locked to the
            rotation per pass, and a very quiet inharmonic shimmer (2 sines
            at 1:2.41) whose level tracks the mean luminance the pixel pass
            already computed for free. A bandpassed whoosh on a mode change.
            音 turns the whole bed off.
  ENGINE    No canvas is used to hold the feedback field: the affine
            resample, the bilinear filter, the hue matrix and the injection
            all run over owned Uint8ClampedArrays, so the only per-frame
            allocation in the pipeline is the one unavoidable readback of the
            camera. One ImageData is created at each resolution and reused.
            The internal resolution auto-degrades on the measured cost of the
            pixel pass, so the loop stays real-time on a phone.
  ══════════════════════════════════════════════════════════════════════════
-->

<body>

    <p>カメラ映像が、一フレームごとに自分自身へ映り込みつづける。<br>
       いまのあなたが入ってこられるのは<b>画面のふち</b>と<b>手のひらに開いた穴</b>だけ。<br>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  AWASEKAGAMI — a video feedback loop done honestly.
//  The feedback field lives in Uint8ClampedArrays this file owns. Each
//  frame every output pixel is bilinearly resampled from the previous
//  field through an affine map, pushed through a hue-rotation matrix and
//  a tone LUT, and then the live camera is mixed in through a mask that
//  is open only at the frame edge and on the player's palm.
// ═══════════════════════════════════════════════════════════════════════
var view = document.getElementById('view');
var ctx = view.getContext('2d');
var video = document.getElementById('video');
var ov = document.getElementById('ov');
var startBtn = document.getElementById('startBtn');
var flipBtn = document.getElementById('flipBtn');
var sndBtn = document.getElementById('sndBtn');
var errBox = document.getElementById('errBox');
var depthLbl = document.getElementById('depthLbl');
var zoomLbl = document.getElementById('zoomLbl');
var resLbl = document.getElementById('resLbl');
var modeBtns = [document.getElementById('m0'),
                document.getElementById('m1'),
                document.getElementById('m2')];
var demoCv = document.getElementById('demo');

var W = 0, H = 0, S = 1, DPR = 1, portrait = false, started = false;
function now(){ return performance.now(); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

var C_BG='#06070a', C_LINE='#dde5ee', C_DIM='#6b7683', C_ACC='#d9214b', C_PANEL='#0c0e13';

// ═══════════════════════════════════════════════════════════════════════
//  MODES
// ═══════════════════════════════════════════════════════════════════════
var MODES = [
  { key:'tsutsu', name:'筒', inv:1.032, rot: 0.0055, sat:1.055, con:1.042, lift:-0.0045,
    hue:0.030, ring:0.30, hand:0.86 },
  { key:'uzu',    name:'渦', inv:1.019, rot: 0.0520, sat:1.100, con:1.050, lift:-0.0050,
    hue:0.055, ring:0.26, hand:0.80 },
  { key:'saki',   name:'咲', inv:0.976, rot:-0.0290, sat:1.075, con:1.046, lift:-0.0038,
    hue:0.042, ring:0.34, hand:0.74 }
];
var mode = 0;

// ═══════════════════════════════════════════════════════════════════════
//  BUFFERS — owned, ping-ponged, rebuilt only when the resolution changes
// ═══════════════════════════════════════════════════════════════════════
var IW = 0, IH = 0;
var prev = null;            // the feedback field
var outImg = null, out = null;
var fbCv = null, fbCtx = null;
var vidCv = null, vidCtx = null, vidData = null;
var lut = new Uint8ClampedArray(256);
var TARGET_PX = 74000, MIN_W = 176, MAX_W = 460;
var costEMA = 14, sinceTune = 0;

function allocBuffers(iw, ih){
  var oldBuf = prev, oW = IW, oH = IH;
  IW = Math.max(24, Math.round(iw));
  IH = Math.max(18, Math.round(ih));
  prev = new Uint8ClampedArray(IW * IH * 4);
  if (oldBuf && oW > 1 && oH > 1 && oldBuf.length === oW*oH*4){
    // carry the accumulated field across a resolution change — the loop has
    // history in it, and blanking it would throw the piece away
    for (var y = 0; y < IH; y++){
      var sy = (y * oH / IH) | 0;
      if (sy >= oH) sy = oH - 1;
      for (var x = 0; x < IW; x++){
        var sx = (x * oW / IW) | 0;
        if (sx >= oW) sx = oW - 1;
        var si = (sy*oW + sx) * 4, di = (y*IW + x) * 4;
        prev[di] = oldBuf[si]; prev[di+1] = oldBuf[si+1];
        prev[di+2] = oldBuf[si+2]; prev[di+3] = 255;
      }
    }
  } else {
    // seed the field with a dim grade so the very first frames are not black
    for (var i = 0; i < IW*IH; i++){
      var v = 14 + ((i % IW) / IW) * 10;
      prev[i*4] = v; prev[i*4+1] = v + 2; prev[i*4+2] = v + 7; prev[i*4+3] = 255;
    }
  }
  fbCv = document.createElement('canvas');
  fbCv.width = IW; fbCv.height = IH;
  fbCtx = fbCv.getContext('2d');
  vidCv = document.createElement('canvas');
  vidCv.width = IW; vidCv.height = IH;
  vidCtx = vidCv.getContext('2d');
  vidData = null;
  if (fbCtx){
    outImg = fbCtx.createImageData(IW, IH);
    out = outImg.data;
    for (var j = 0; j < IW*IH; j++) out[j*4+3] = 255;
  } else { outImg = null; out = null; }
  if (resLbl) resLbl.textContent = IW + '×' + IH;
}
function sizeFor(scale){
  var ar = (W > 0 && H > 0) ? (W / H) : 1.4;
  var px = TARGET_PX * scale * scale;
  var iw = Math.sqrt(px * ar);
  iw = clamp(iw, MIN_W, MAX_W);
  return { w: iw, h: Math.max(18, iw / ar) };
}
var resScale = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  view.width = Math.max(2, Math.round(W*DPR));
  view.height = Math.max(2, Math.round(H*DPR));
  view.style.width = W + 'px'; view.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H) / 720;
  portrait = H > W;
  var s = sizeFor(resScale);
  allocBuffers(s.w, s.h);
}
window.addEventListener('resize', resize);

function buildLut(con, lift){
  for (var i = 0; i < 256; i++){
    var v = i / 255;
    v = 0.5 + (v - 0.5) * con + lift;
    lut[i] = clamp(v * 255, 0, 255);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO — a designed bed, quiet by intent
// ═══════════════════════════════════════════════════════════════════════
var ac = null, comp = null, master = null, noiseBuf = null, audioOK = false;
var drone = null, droneG = null, droneLP = null, trem = null, tremG = null;
var shimA = null, shimB = null, shimG = null;
var soundOn = true;
function initAudio(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (ac){ if (ac.state === 'suspended' && ac.resume) ac.resume(); return; }
  try { ac = new AC(); } catch(e){ ac = null; return; }
  comp = ac.createDynamicsCompressor();
  try {
    comp.threshold.value = -20; comp.knee.value = 24; comp.ratio.value = 6;
    comp.attack.value = 0.01; comp.release.value = 0.4;
  } catch(e){}
  master = ac.createGain(); master.gain.value = 0.7;
  comp.connect(master); master.connect(ac.destination);
  var n = Math.floor(ac.sampleRate * 1.5);
  noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  var nd = noiseBuf.getChannelData(0);
  for (var i = 0; i < n; i++) nd[i] = Math.random()*2 - 1;

  droneLP = ac.createBiquadFilter(); droneLP.type = 'lowpass';
  droneLP.frequency.value = 320; droneLP.Q.value = 1.4;
  droneG = ac.createGain(); droneG.gain.value = 0;
  droneLP.connect(droneG); droneG.connect(comp);
  drone = ac.createOscillator(); drone.type = 'sawtooth'; drone.frequency.value = 58;
  drone.connect(droneLP); drone.start();
  // tremolo locked to the rotation per pass
  tremG = ac.createGain(); tremG.gain.value = 0;
  trem = ac.createOscillator(); trem.type = 'sine'; trem.frequency.value = 3;
  trem.connect(tremG); tremG.connect(droneG.gain); trem.start();

  shimG = ac.createGain(); shimG.gain.value = 0;
  var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
  shimG.connect(hp); hp.connect(comp);
  shimA = ac.createOscillator(); shimA.type = 'sine'; shimA.frequency.value = 1180;
  shimB = ac.createOscillator(); shimB.type = 'sine'; shimB.frequency.value = 1180*2.41;
  var sb = ac.createGain(); sb.gain.value = 0.34;
  shimA.connect(shimG); shimB.connect(sb); sb.connect(shimG);
  shimA.start(); shimB.start();

  if (ac.state === 'suspended' && ac.resume) ac.resume();
  audioOK = true;
}
function setP(p, v, tc){
  if (!p || !isFinite(v)) return;
  try { p.setTargetAtTime(v, ac.currentTime, tc || 0.08); } catch(e){}
}
function whoosh(){
  if (!audioOK || !soundOn) return;
  var t = ac.currentTime;
  var s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.2;
  bp.frequency.setValueAtTime(220, t);
  bp.frequency.exponentialRampToValueAtTime(3600, t + 0.5);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.10, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.72);
  s.connect(bp); bp.connect(g); g.connect(comp);
  s.start(t); s.stop(t + 0.8);
}

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing = 'user', mirror = true, stream = null;
function showError(e){
  var msg = (e && e.message) ? e.message : String(e || 'unknown');
  errBox.style.display = 'block';
  errBox.textContent = 'カメラを起動できませんでした：' + msg +
    '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream && stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({
    video:{ facingMode:{ ideal:facing }, width:{ ideal:960 }, height:{ ideal:720 } },
    audio:false
  }).then(function(st){
    stream = st; video.srcObject = st; mirror = (facing === 'user');
    var p = video.play();
    return (p && p.then) ? p.catch(function(){}) : null;
  });
}
flipBtn.addEventListener('click', function(){
  facing = (facing === 'user') ? 'environment' : 'user';
  loseHands();
  startStream().then(startMpCamera).catch(showError);
});

// ═══════════════════════════════════════════════════════════════════════
//  HANDS — one hand opens the mouth of the tunnel, a second twists it
// ═══════════════════════════════════════════════════════════════════════
var HAND_LOST_MS = 340;
function mkHand(){ return { live:false, t:-1e9, x:.5, y:.5, palm:.12, pinch:.5, open:.5 }; }
var h1 = mkHand(), h2 = mkHand(), tmpH = mkHand();
function loseHands(){
  h1.live = false; h1.t = -1e9; h2.live = false; h2.t = -1e9;
}
function validLm(c){
  if (!c || c.length < 21) return false;
  for (var i = 0; i < 21; i++){
    var p = c[i];
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' ||
        !isFinite(p.x) || !isFinite(p.y)) return false;
  }
  return true;
}
function readHand(h, c){
  var wx = mirror ? (1 - c[0].x) : c[0].x, wy = c[0].y;
  var kx = mirror ? (1 - c[9].x) : c[9].x, ky = c[9].y;
  var palm = Math.hypot(kx - wx, ky - wy);
  if (!isFinite(palm) || palm < 1e-4) return false;
  h.x = (wx + kx) * 0.5; h.y = (wy + ky) * 0.5;
  h.palm = palm;
  var tx = mirror ? (1 - c[4].x) : c[4].x, ty = c[4].y;
  var ix = mirror ? (1 - c[8].x) : c[8].x, iy = c[8].y;
  var pd = Math.hypot(ix - tx, iy - ty) / palm;
  h.pinch = isFinite(pd) ? clamp((pd - 0.22) / 1.15, 0, 1) : 0.5;
  var sum = 0, TIPS = [8, 12, 16, 20];
  for (var i = 0; i < 4; i++){
    var t = TIPS[i];
    var px = mirror ? (1 - c[t].x) : c[t].x;
    sum += Math.hypot(px - wx, c[t].y - wy);
  }
  var r = (sum / 4) / palm;
  h.open = isFinite(r) ? clamp((r - 1.15) / 0.95, 0, 1) : 0.5;
  h.t = now(); h.live = true;
  return true;
}
function onHands(res){
  var raw = (res && res.multiHandLandmarks) ? res.multiHandLandmarks : [];
  var good = [];
  for (var i = 0; i < raw.length && good.length < 2; i++){
    if (validLm(raw[i])) good.push(raw[i]);
  }
  if (!good.length) return;
  if (!readHand(tmpH, good[0])) return;
  h1.x = tmpH.x; h1.y = tmpH.y; h1.palm = tmpH.palm;
  h1.pinch = tmpH.pinch; h1.open = tmpH.open; h1.t = tmpH.t; h1.live = true;
  if (good.length > 1 && readHand(tmpH, good[1])){
    h2.x = tmpH.x; h2.y = tmpH.y; h2.palm = tmpH.palm;
    h2.pinch = tmpH.pinch; h2.open = tmpH.open; h2.t = tmpH.t; h2.live = true;
  } else {
    h2.live = false;
  }
}
var hands = null, mpCamera = null, mpReady = false;
function initHands(){
  if (typeof window.Hands !== 'function') return false;
  try {
    hands = new window.Hands({ locateFile:function(f){
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
    }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0,
                       minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands);
    mpReady = true; return true;
  } catch(e){ return false; }
}
function startMpCamera(){
  if (!mpReady || typeof window.Camera !== 'function') return;
  try {
    if (mpCamera && mpCamera.stop) mpCamera.stop();
    mpCamera = new window.Camera(video, {
      onFrame:function(){
        if (!hands || !started) return Promise.resolve();
        return hands.send({ image:video }).catch(function(){});
      },
      width:480, height:360
    });
    mpCamera.start();
  } catch(e){ mpReady = false; }
}

// ═══════════════════════════════════════════════════════════════════════
//  THE LOOP STATE — every control drifts, nothing eases back
// ═══════════════════════════════════════════════════════════════════════
var mx = 0.5, my = 0.5;         // the mouth of the tunnel, 0..1
var mr = 0.16;                  // its radius, in fractions of the short side
var invS = 1.03, rotS = 0.006;  // smoothed transform
var twist = 0;                  // second hand
var flash = 0;                  // written into the field, not drawn over it
var meanLum = 0.2, depth = 0;
var drift = 0;
var handSeen = false;

function stepControls(dt){
  var t = now();
  if (h1.live && t - h1.t > HAND_LOST_MS) h1.live = false;
  if (h2.live && t - h2.t > HAND_LOST_MS) h2.live = false;
  handSeen = h1.live;
  var M = MODES[mode];

  var tx, ty, tr;
  if (h1.live){
    tx = h1.x; ty = h1.y;
    tr = clamp(h1.palm * (0.85 + h1.open * 1.5), 0.05, 0.42);
  } else {
    // no hand: the mouth drifts on its own so the loop is never dead
    drift += dt * 0.19;
    tx = 0.5 + Math.cos(drift) * 0.13;
    ty = 0.5 + Math.sin(drift * 0.73) * 0.11;
    tr = 0.115 + Math.sin(drift * 0.41) * 0.02;
  }
  var k = clamp(dt * 6.5, 0, 1);
  mx += (tx - mx) * k; my += (ty - my) * k;
  mr += (tr - mr) * clamp(dt * 3.5, 0, 1);
  if (!isFinite(mx)) mx = 0.5;
  if (!isFinite(my)) my = 0.5;
  if (!isFinite(mr)) mr = 0.16;

  // pinching slows the fall; an open hand lets it run
  var pull = h1.live ? (0.42 + h1.pinch * 0.82) : 1;
  var invT = 1 + (M.inv - 1) * pull;
  var twT = h2.live ? clamp((0.72 - h2.y) * 2.6, -1.3, 1.3) : 0;
  twist += (twT - twist) * clamp(dt * 3, 0, 1);
  var rotT = M.rot * (1 + twist);
  invS += (invT - invS) * clamp(dt * 4, 0, 1);
  rotS += (rotT - rotS) * clamp(dt * 4, 0, 1);
  if (!isFinite(invS) || invS <= 0.5 || invS > 1.6) invS = M.inv;
  if (!isFinite(rotS)) rotS = M.rot;

  // how many copies of you are on screen right now
  var rEdge = 0.72, rMouth = Math.max(mr, 0.03);
  var li = Math.log(invS);
  depth = (Math.abs(li) > 1e-4) ? Math.abs(Math.log(rEdge / rMouth) / li) : 99;
  depth = clamp(depth, 0, 999);

  if (audioOK){
    var on = soundOn ? 1 : 0;
    setP(droneG.gain, on * 0.055, 0.25);
    setP(drone.frequency, 38 + clamp(depth, 0, 60) * 0.85, 0.3);
    setP(droneLP.frequency, 190 + meanLum * 900, 0.3);
    setP(tremG.gain, on * 0.020, 0.3);
    setP(trem.frequency, clamp(0.7 + Math.abs(rotS) * 55, 0.2, 14), 0.4);
    setP(shimG.gain, on * clamp(meanLum - 0.13, 0, 0.7) * 0.020, 0.35);
    setP(shimA.frequency, 900 + clamp(depth, 0, 60) * 14, 0.5);
    setP(shimB.frequency, (900 + clamp(depth, 0, 60) * 14) * 2.41, 0.5);
  }
  if (depthLbl) depthLbl.textContent = (depth > 90 ? '∞' : String(Math.round(depth)));
  if (zoomLbl) zoomLbl.textContent = invS.toFixed(3);
}

// ── grab the camera into the internal buffer, cover-fit and mirrored ────
function grabVideo(){
  if (!vidCtx) return false;
  var vw = video.videoWidth | 0, vh = video.videoHeight | 0;
  if (!vw || !vh || video.readyState < 2) return false;
  var ar = IW / IH, var_ = vw / vh;
  var sw, sh, sx, sy;
  if (var_ > ar){ sh = vh; sw = vh * ar; sx = (vw - sw)/2; sy = 0; }
  else          { sw = vw; sh = vw / ar; sx = 0; sy = (vh - sh)/2; }
  vidCtx.save();
  if (mirror){ vidCtx.translate(IW, 0); vidCtx.scale(-1, 1); }
  try { vidCtx.drawImage(video, sx, sy, sw, sh, 0, 0, IW, IH); }
  catch(e){ vidCtx.restore(); return false; }
  vidCtx.restore();
  try { vidData = vidCtx.getImageData(0, 0, IW, IH); }
  catch(e){ vidData = null; return false; }
  return !!(vidData && vidData.data && vidData.data.length === IW*IH*4);
}

// ═══════════════════════════════════════════════════════════════════════
//  THE PIXEL PASS
//  out[p] = tone(hue(bilinear(prev, A·p))) blended with the live camera
//  through a mask that is open only at the rim and on the palm.
// ═══════════════════════════════════════════════════════════════════════
function feedback(dt){
  if (!prev || !out || !outImg) return;
  var M = MODES[mode];
  buildLut(M.con, M.lift);

  var w = IW, h = IH;
  var cx = mx * w, cy = my * h;
  var c = Math.cos(rotS), s = Math.sin(rotS);
  var iv = invS;
  // source = C + R(rot)·iv·(dest - C)   — affine, so it is separable per row
  var a = c * iv, b = -s * iv, d = s * iv, e = c * iv;
  var tx0 = cx - (a * cx + b * cy);
  var ty0 = cy - (d * cx + e * cy);

  // hue matrix for this frame's rotation
  var phi = M.hue * 0.0175 * (60 * Math.min(dt, 0.05));
  var cp = Math.cos(phi), sp = Math.sin(phi);
  var m00 = 0.213 + cp*0.787 - sp*0.213, m01 = 0.715 - cp*0.715 - sp*0.715,
      m02 = 0.072 - cp*0.072 + sp*0.928,
      m10 = 0.213 - cp*0.213 + sp*0.143, m11 = 0.715 + cp*0.285 + sp*0.140,
      m12 = 0.072 - cp*0.072 - sp*0.283,
      m20 = 0.213 - cp*0.213 - sp*0.787, m21 = 0.715 - cp*0.715 + sp*0.715,
      m22 = 0.072 + cp*0.928 + sp*0.072;
  var sat = M.sat;

  // hoist every array the inner loop touches into a local. A global read in
  // the hot path is a scope lookup per pixel; there are fifteen of them per
  // pixel here, which is the difference between real-time and not.
  var P = prev, O = out, L = lut;
  var vd = vidData ? vidData.data : null;
  // the mask, in buffer units
  var short = Math.min(w, h);
  var hr = Math.max(3, mr * short);
  var hr2 = hr * hr;
  var handGain = M.hand;
  var ringGain = M.ring;
  var rx = w * 0.5, ry = h * 0.5;
  var rin = 0.70, rout = 1.02;         // rim falloff, in normalised radius²
  var rin2 = rin*rin, rspan = (rout*rout - rin2);
  var invRx = 1 / (w * 0.5), invRy = 1 / (h * 0.5);
  var fl = flash;

  var lumSum = 0, lumN = 0;
  var y, x;
  for (y = 0; y < h; y++){
    var syRow = e * y + ty0;
    var sxRow = b * y + tx0;
    var dyn = (y - ry) * invRy; var dyn2 = dyn * dyn;
    var dhy = y - my * h; var dhy2 = dhy * dhy;
    var o = y * w * 4;
    for (x = 0; x < w; x++, o += 4){
      var sx = a * x + sxRow;
      var sy = d * x + syRow;
      // clamp to the edge — the smear this makes is the wall of the tunnel
      if (sx < 0) sx = 0; else if (sx > w - 1.001) sx = w - 1.001;
      if (sy < 0) sy = 0; else if (sy > h - 1.001) sy = h - 1.001;
      var x0 = sx | 0, y0 = sy | 0;
      var fx = sx - x0, fy = sy - y0;
      var i00 = (y0 * w + x0) * 4;
      var i10 = i00 + 4;
      var i01 = i00 + w * 4;
      var i11 = i01 + 4;
      var w00 = (1-fx)*(1-fy), w10 = fx*(1-fy), w01 = (1-fx)*fy, w11 = fx*fy;
      var pr = P[i00]  *w00 + P[i10]  *w10 + P[i01]  *w01 + P[i11]  *w11;
      var pg = P[i00+1]*w00 + P[i10+1]*w10 + P[i01+1]*w01 + P[i11+1]*w11;
      var pb = P[i00+2]*w00 + P[i10+2]*w10 + P[i01+2]*w01 + P[i11+2]*w11;

      // hue rotation
      var nr = m00*pr + m01*pg + m02*pb;
      var ng = m10*pr + m11*pg + m12*pb;
      var nb = m20*pr + m21*pg + m22*pb;
      // saturation, luminance preserving
      var lu = 0.213*nr + 0.715*ng + 0.072*nb;
      nr = lu + (nr - lu) * sat;
      ng = lu + (ng - lu) * sat;
      nb = lu + (nb - lu) * sat;
      if (nr < 0) nr = 0; else if (nr > 255) nr = 255;
      if (ng < 0) ng = 0; else if (ng > 255) ng = 255;
      if (nb < 0) nb = 0; else if (nb > 255) nb = 255;
      nr = L[nr | 0]; ng = L[ng | 0]; nb = L[nb | 0];

      // where the present is allowed in
      var dxn = (x - rx) * invRx;
      var rr = dxn*dxn + dyn2;
      var am = 0;
      if (rr > rin2){
        am = (rr - rin2) / rspan;
        if (am > 1) am = 1;
        am *= am * ringGain;
      }
      var dhx = x - mx * w;
      var dd = (dhx*dhx + dhy2) / hr2;
      if (dd < 1){
        var q = 1 - dd; q *= q;
        am += q * handGain;
      }
      if (am > 1) am = 1;
      if (am > 0 && vd){
        var im = 1 - am;
        nr = nr * im + vd[o]   * am;
        ng = ng * im + vd[o+1] * am;
        nb = nb * im + vd[o+2] * am;
      }
      if (fl > 0){
        var fm = 1 - fl;
        nr = nr * fm + 255 * fl;
        ng = ng * fm + 246 * fl;
        nb = nb * fm + 238 * fl;
      }
      O[o] = nr; O[o+1] = ng; O[o+2] = nb; O[o+3] = 255;
      if ((o & 63) === 0){ lumSum += 0.213*nr + 0.715*ng + 0.072*nb; lumN++; }
    }
  }
  if (lumN > 0){
    var ml = (lumSum / lumN) / 255;
    if (isFinite(ml)) meanLum += (ml - meanLum) * 0.12;
  }
  P.set(O);
  flash = 0;
  if (fbCtx) fbCtx.putImageData(outImg, 0, 0);
}

// ═══════════════════════════════════════════════════════════════════════
//  THE INSTRUMENT AROUND THE IMAGE
// ═══════════════════════════════════════════════════════════════════════
var frameRect = { x:0, y:0, w:0, h:0 };
function layout(){
  var pad = portrait ? 14 : 20;
  var topPad = portrait ? 86 : 74;
  var botPad = portrait ? 88 : 78;
  var aw = Math.max(40, W - pad*2);
  var ah = Math.max(40, H - topPad - botPad);
  var ar = IH > 0 ? (IW / IH) : 1.4;
  var w = aw, h = w / ar;
  if (h > ah){ h = ah; w = h * ar; }
  frameRect.w = w; frameRect.h = h;
  frameRect.x = (W - w) / 2;
  frameRect.y = topPad + (ah - h) / 2;
}
function drawFurniture(){
  var f = frameRect;
  var cx = f.x + f.w/2, cy = f.y + f.h/2;
  ctx.save();
  // alignment rings, engraved faintly around the image
  ctx.strokeStyle = 'rgba(107,118,131,.20)';
  ctx.lineWidth = 1;
  var rmax = Math.hypot(W, H) * 0.55;
  for (var i = 1; i <= 5; i++){
    ctx.beginPath();
    ctx.arc(cx, cy, rmax * i / 5, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx - rmax, cy); ctx.lineTo(cx + rmax, cy);
  ctx.moveTo(cx, cy - rmax); ctx.lineTo(cx, cy + rmax);
  ctx.stroke();
  ctx.restore();
}
function drawFrameMarks(){
  var f = frameRect;
  ctx.save();
  ctx.strokeStyle = 'rgba(221,229,238,.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(f.x - 0.5, f.y - 0.5, f.w + 1, f.h + 1);
  var t = Math.max(8, 14*S);
  ctx.strokeStyle = C_LINE; ctx.lineWidth = Math.max(1.2, 1.8*S);
  var corners = [[f.x, f.y, 1, 1], [f.x + f.w, f.y, -1, 1],
                 [f.x, f.y + f.h, 1, -1], [f.x + f.w, f.y + f.h, -1, -1]];
  for (var i = 0; i < 4; i++){
    var c = corners[i];
    ctx.beginPath();
    ctx.moveTo(c[0] + c[2]*t, c[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(c[0], c[1] + c[3]*t);
    ctx.stroke();
  }
  ctx.restore();
}
// where the present enters the loop, marked in the one accent colour
function drawMouth(){
  var f = frameRect;
  var px = f.x + mx * f.w, py = f.y + my * f.h;
  var short = Math.min(f.w, f.h);
  var r = mr * short;
  if (!isFinite(px) || !isFinite(py) || !isFinite(r) || r <= 0) return;
  ctx.save();
  ctx.strokeStyle = handSeen ? C_ACC : 'rgba(217,33,75,.42)';
  ctx.lineWidth = Math.max(1, 1.5*S);
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([Math.max(2, 3*S), Math.max(3, 5*S)]);
  ctx.beginPath(); ctx.arc(px, py, r * 1.28, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  var tk = Math.max(4, 7*S);
  ctx.beginPath();
  ctx.moveTo(px - r - tk, py); ctx.lineTo(px - r - tk*0.35, py);
  ctx.moveTo(px + r + tk*0.35, py); ctx.lineTo(px + r + tk, py);
  ctx.moveTo(px, py - r - tk); ctx.lineTo(px, py - r - tk*0.35);
  ctx.moveTo(px, py + r + tk*0.35); ctx.lineTo(px, py + r + tk);
  ctx.stroke();
  if (h2.live){
    var qx = f.x + h2.x * f.w, qy = f.y + h2.y * f.h;
    if (isFinite(qx) && isFinite(qy)){
      ctx.strokeStyle = 'rgba(221,229,238,.5)';
      ctx.beginPath(); ctx.arc(qx, qy, Math.max(5, 9*S), 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke();
    }
  }
  ctx.restore();
  if (!handSeen){
    ctx.save();
    ctx.fillStyle = C_DIM;
    ctx.font = Math.round(Math.max(10, 12*S*1.05)) + "px 'Shippori Antique',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('手をかざすと入口が手のひらに移る', f.x + f.w/2, f.y + f.h + 8);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════════════
var last = 0;
function frame(t){
  requestAnimationFrame(frame);
  if (!last) last = t;
  var dt = clamp((t - last)/1000, 0, 0.05);
  last = t;
  if (!started) return;

  stepControls(dt);
  grabVideo();
  var t0 = now();
  feedback(dt);
  var cost = now() - t0;
  if (isFinite(cost)) costEMA += (cost - costEMA) * 0.10;

  // keep it real-time: the internal resolution follows the measured cost
  sinceTune += dt;
  if (sinceTune > 1.4){
    sinceTune = 0;
    var ns = resScale;
    if (costEMA > 21 && resScale > 0.42) ns = resScale * 0.86;
    else if (costEMA < 9 && resScale < 1.25) ns = resScale * 1.10;
    if (ns !== resScale){
      resScale = clamp(ns, 0.42, 1.25);
      var sz = sizeFor(resScale);
      if (Math.abs(Math.round(sz.w) - IW) >= 6){
        allocBuffers(sz.w, sz.h);
        costEMA = 14;
        layout();
      }
    }
  }

  layout();
  ctx.fillStyle = C_BG; ctx.fillRect(0, 0, W, H);
  drawFurniture();
  if (fbCv && frameRect.w > 0){
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    try { ctx.drawImage(fbCv, frameRect.x, frameRect.y, frameRect.w, frameRect.h); }
    catch(e){}
    ctx.restore();
  }
  drawFrameMarks();
  drawMouth();
}

// ═══════════════════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════════════════
function setMode(i){
  if (!(i >= 0 && i < MODES.length)) return;
  if (i === mode) return;
  mode = i;
  // the cut is written into the field, so it spirals away instead of fading
  flash = 0.55;
  invS = MODES[mode].inv; rotS = MODES[mode].rot;
  whoosh();
  for (var k = 0; k < modeBtns.length; k++){
    if (!modeBtns[k]) continue;
    modeBtns[k].className = (k === i) ? 'on' : '';
  }
}
(function(){
  for (var i = 0; i < modeBtns.length; i++){
    if (!modeBtns[i]) continue;
    (function(n){
      modeBtns[n].addEventListener('click', function(){ setMode(n); });
    })(i);
  }
})();
sndBtn.addEventListener('click', function(){
  soundOn = !soundOn;
  sndBtn.className = soundOn ? 'on' : '';
  sndBtn.textContent = soundOn ? '音' : '無音';
});

// ═══════════════════════════════════════════════════════════════════════
//  OVERLAY DEMO — one frame becoming forty
// ═══════════════════════════════════════════════════════════════════════
var dctx = demoCv.getContext('2d');
var demoRun = true, demoT0 = 0;
function demoFrame(t){
  if (!demoRun) return;
  requestAnimationFrame(demoFrame);
  if (!demoT0) demoT0 = t;
  var e = (t - demoT0) / 1000;
  var w = demoCv.width, h = demoCv.height;
  dctx.setTransform(1,0,0,1,0,0);
  dctx.fillStyle = C_BG; dctx.fillRect(0, 0, w, h);
  var cx = w*0.5 + Math.cos(e*0.8) * w*0.16;
  var cy = h*0.5 + Math.sin(e*0.62) * h*0.16;
  // draw the same silhouette N times, each one step further into the loop
  var N = 22;
  for (var i = N; i >= 0; i--){
    var k = Math.pow(0.86, i);
    var ang = e*0.5 + i * 0.10;
    dctx.save();
    dctx.translate(cx, cy);
    dctx.rotate(ang * 0.16);
    dctx.scale(k, k);
    var hue = (e*22 + i*14) % 360;
    dctx.strokeStyle = 'hsl(' + hue.toFixed(1) + ',72%,' + (26 + (N-i)*1.8).toFixed(1) + '%)';
    dctx.lineWidth = 3 / Math.max(k, 0.05);
    dctx.beginPath();
    dctx.ellipse(0, -h*0.10, w*0.10, h*0.15, 0, 0, Math.PI*2);      // head
    dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(-w*0.13, h*0.30); dctx.lineTo(0, h*0.04); dctx.lineTo(w*0.13, h*0.30);
    dctx.stroke();
    dctx.restore();
  }
  // the mouth
  dctx.strokeStyle = C_ACC; dctx.lineWidth = 1.5;
  dctx.beginPath(); dctx.arc(cx, cy, 26, 0, Math.PI*2); dctx.stroke();
  dctx.setLineDash([3,5]);
  dctx.beginPath(); dctx.arc(cx, cy, 33, 0, Math.PI*2); dctx.stroke();
  dctx.setLineDash([]);
  dctx.fillStyle = C_DIM;
  dctx.font = "300 12px 'Azeret Mono',monospace";
  dctx.textAlign = 'center'; dctx.textBaseline = 'bottom';
  dctx.fillText('THE PRESENT ENTERS HERE', cx, cy - 42);
}

// ═══════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════
function begin(){
  if (started) return;
  initAudio();
  started = true;
  demoRun = false;
  ov.classList.add('hide');
  sndBtn.className = 'on';
  initHands();
  startStream().then(startMpCamera).catch(showError);
}
startBtn.addEventListener('click', begin);
startBtn.addEventListener('touchend', function(e){ e.preventDefault(); begin(); }, {passive:false});

resize();
layout();
requestAnimationFrame(frame);
requestAnimationFrame(demoFrame);
</script>
