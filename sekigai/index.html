<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人が赤外線カメラの熱の像になる。顔と手が白く灼け、動いたところは赤く発熱して、体の形の残熱が壁に残ったままゆっくり冷えて立ちのぼる。">
<meta name="theme-color" content="#050506">
<title>SEKIGAI ─ 赤外線に写る、あなたの熱</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  SEKIGAI 赤外 ─ 赤外線に写る、あなたの熱              ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       軍用サーマルカメラで撮った現代美術の写真。粒子の荒いモノクロの
             熱画像の中で、顔と手だけが白く灼けている。動いたところは摩擦熱の
             ように赤く発熱し、いなくなった場所にはあなたの形の残熱が壁に残って、
             ゆっくり冷えながら上へ立ちのぼっていく。
  PALETTE    WHITE HOT  #050506 → #2a2b30 → #8d8c90 → #ebe8e2 → #ffffff ／差し色 #ff3b1f
             BLACK HOT  #eeece6 → #b9b7b1 → #6c6b69 → #252424 → #050505 ／差し色 #d8321c
             IRON       #06030f → #2b0b5a → #a3125b → #f06a12 → #fff3c4（差し色なし）
  TYPE       Red Hat Mono 300/400（計器・温度）＋ Hanken Grotesk 200（見出し）。
  MOTION     残熱は約 3 秒で冷え、毎秒数ピクセルずつ上へ昇って拡散する。
             動きの熱（赤）は 0.7 秒で引く。切り替えとタップの効果は一度ずつ。
  SIGNATURE  動けば動くほど、あなたの熱が赤く灼け、形のまま空間に置き去りになる。
  SWITCH     はじめは素のカメラ。「▸ SEKIGAI」でシャッターが閉じる音と灰色の
             校正画面（NUC）が一瞬入り、体温が冷えた像から温まって浮かび上がる。
             タップすると、その瞬間の体の形が熱い焼き跡として壁に押される。
  TECH       WebGL2 の一枚のシェーダ。人物はセルフィー分割のマスク、皮膚の
             色らしさで顔と手を熱く。残熱・動きの熱・背景は画面空間の小さな
             格子（短辺 120）を CPU で更新し、RGBA テクスチャ一枚で渡す。
             HUD は 2D キャンバスで重ねるので録画にも残る。
  ══════════════════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@300;400&family=Hanken+Grotesk:wght@200;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--fg:#ecebe6;--dim:rgba(236,235,230,.5);--line:rgba(236,235,230,.22);--acc:#ff3b1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
  font-family:"Hanken Grotesk","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:200}
#out{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl,#est{display:none}

  padding:28px;text-align:center;background:radial-gradient(ellipse at 50% 45%,#1b1b1e 0%,#050506 62%)}

  text-shadow:0 0 22px rgba(255,255,255,.35)}

  letter-spacing:.5em;padding:15px 30px 15px 36px;cursor:pointer;transition:border-color .3s}

  font:400 10px "Red Hat Mono",monospace;letter-spacing:.42em;padding:13px 22px 13px 28px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .3s}

<body>
<canvas id="out"></canvas>
<canvas id="gl"></canvas>
<canvas id="est"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ SEKIGAI</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="stamp" class="btn">STAMP</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="pals">
    <button data-p="0" class="on">WHITE HOT</button>
    <button data-p="1">BLACK HOT</button>
    <button data-p="2">IRON</button>
  </div>
  <label><span>残熱</span><input type="range" id="sKeep" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>立ちのぼり</span><input type="range" id="sRise" min="0" max="1" step="0.01" value="0.45"></label>
  <label><span>発熱</span><input type="range" id="sHeat" min="0" max="1" step="0.01" value="0.6"></label>
  <label><span>粒子</span><input type="range" id="sGrain" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>計器</span><input type="checkbox" id="sHud" checked></label>
  <div class="note">動いたところが赤く灼け、体の形の熱が壁に残る。<br>STAMP か画面タップで、いまの姿を熱で押す。</div>
</div>

<div id="start">
  <div class="t">THERMAL · 8–14 µm</div>
  <h1>SEKIGAI</h1>
  <div class="scale"></div>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、あなたは熱だけで写る。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   SEKIGAI — the person as a thermal image. A fragment shader turns the
   masked body into heat (skin hotter, clothes cooler), lays it over a
   cold blurred room and maps it through a thermal palette. A small
   screen-space grid on the CPU carries what a real sensor would also
   see: residual heat where the body was (cooling, rising, diffusing)
   and "kinetic" heat where it moved, which flares in the accent colour.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const out = $('out'), canvas = $('gl'), video = $('cam'), est = $('est');
const octx = out.getContext('2d');
const ectx = est.getContext('2d', { willReadFrequently:true });

const hex = h => [1,3,5].map(i => parseInt(h.substr(i, 2), 16) / 255);
const PALS = [
  { name:'WHITE HOT', stops:['#050506','#2a2b30','#8d8c90','#ebe8e2','#ffffff'], acc:'#ff3b1f', accK:1, ink:0 },
  { name:'BLACK HOT', stops:['#eeece6','#b9b7b1','#6c6b69','#252424','#050505'], acc:'#d8321c', accK:1, ink:1 },
  { name:'IRON',      stops:['#06030f','#2b0b5a','#a3125b','#f06a12','#fff3c4'], acc:'#ffffff', accK:0, ink:0 },
].map(p => ({ ...p, v:new Float32Array(p.stops.flatMap(hex)), a:hex(p.acc) }));
const S = { pal:0, keep:.5, rise:.45, heat:.6, grain:.5, hud:true };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uVid, uMask, uField;
uniform vec2 uRes, uScale;
uniform float uMirror, uE, uWarm, uNuc, uT, uHasMask, uGrain, uAccK;
uniform vec3 uPal[5];
uniform vec3 uAcc;
out vec4 o;
float h1(float n){ return fract(sin(n * 91.3458) * 47453.5453); }
float h2(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
vec2 cv(vec2 s){ vec2 v = (s - .5) * uScale + .5; if (uMirror > .5) v.x = 1. - v.x; return v; }
vec3 pal(float t){
  t = clamp(t, 0., 1.) * 4.;
  vec3 c = mix(uPal[0], uPal[1], clamp(t, 0., 1.));
  c = mix(c, uPal[2], clamp(t - 1., 0., 1.));
  c = mix(c, uPal[3], clamp(t - 2., 0., 1.));
  return mix(c, uPal[4], clamp(t - 3., 0., 1.));
}
// how much a colour looks like skin (YCbCr box, softened)
float skin(vec3 c){
  float y = dot(c, vec3(.299,.587,.114));
  float cb = .5 + (-.168736 * c.r - .331264 * c.g + .5 * c.b);
  float cr = .5 + (.5 * c.r - .418688 * c.g - .081312 * c.b);
  float k = smoothstep(.06, .0, abs(cb - .40) - .08) * smoothstep(.05, .0, abs(cr - .60) - .07);
  return k * smoothstep(.12, .3, y);
}
void main(){
  vec2 s = gl_FragCoord.xy / uRes; s.y = 1. - s.y;
  vec2 v = cv(s);
  vec3 cam = texture(uVid, v).rgb;
  float lum = dot(cam, vec3(.299,.587,.114));
  float sk = skin(cam);
  float m = uHasMask > .5 ? texture(uMask, v).r : (uHasMask < -.5 ? 0. : .2 + .8 * sk);
  float body = smoothstep(.3, .75, m);
  vec4 f = texture(uField, s);                        // r residual, g kinetic, b room, a halo
  // the body: skin (face, neck, hands) burns hottest, dark hair and clothes a little cooler
  float live = body * (.44 + .36 * sk + .12 * (1. - lum)) * (.7 + .3 * f.a) * uWarm;
  float room = .05 + .27 * f.b;
  float T = max(room, max(live, f.r * .9));
  T = max(T, f.a * .42 * uWarm);                      // the warm air hugging the body
  T += f.g * .22;
  // a sensor, not a lens: grain, fixed-pattern columns, a soft vignette
  T += (h2(gl_FragCoord.xy + fract(uT * 7.) * 131.) - .5) * .07 * uGrain;
  T += (h1(floor(gl_FragCoord.x / 2.)) - .5) * .016 * uGrain;
  vec3 col = pal(T);
  // the isotherm alarm: whatever runs hotter than the body is painted in one flat colour
  col = mix(col, uAcc * (.82 + .3 * clamp(f.g - .35, 0., 1.)), smoothstep(.3, .4, f.g) * .94 * uAccK);
  vec2 q = s - .5; q.x *= uRes.x / uRes.y;
  col = mix(col, uPal[0], smoothstep(.35, 1.05, length(q)) * .55);
  col = mix(col, vec3(.47, .47, .46) + (h2(gl_FragCoord.xy * .5) - .5) * .02, uNuc);
  o = vec4(mix(cam, col, uE), 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name.replace('[0]', '')] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function tex(){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
let P = null, vao, texVid, texMask, texField;
function initGL(){
  P = prog(VS, FS);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  texVid = tex(); texMask = tex(); texField = tex();
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.bindTexture(gl.TEXTURE_2D, texMask); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  gl.bindTexture(gl.TEXTURE_2D, texField); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,0]));
}

/* ---------- mask ---------- */
const M = { w:0, h:0, b:null, has:false, live:false, external:false, lastT:0, dirty:false };
function ingestMask(data, w, h){
  if (!data || !(w > 0) || !(h > 0) || !(w * h <= 4e6) || data.length < w * h) return false;
  if (M.w !== w || M.h !== h){ M.w = w; M.h = h; M.b = new Uint8Array(w * h); F.mapKey = ''; }
  for (let i = 0, n = w * h; i < n; i++){ let m = data[i]; if (!(m >= 0)) m = 0; else if (m > 1) m = 1; M.b[i] = m * 255; }
  M.has = true; M.live = true; M.lastT = performance.now(); M.dirty = true;
  return true;
}

/* ---------- the heat grid, in screen space (short edge 120 cells) ---------- */
const FSHORT = 120;
const F = { w:0, h:0, cur:null, prev:null, have:false, R:null, K:null, Rt:null, Kt:null, B:null, A:null, At:null, Mk:null, Sk:null,
  map:null, mapKey:'', bytes:null };
function ensureField(W, H){
  let w, h; if (W >= H){ h = FSHORT; w = Math.round(FSHORT * W / H); } else { w = FSHORT; h = Math.round(FSHORT * H / W); }
  if (w === F.w && h === F.h) return;
  F.w = w; F.h = h; est.width = w; est.height = h; const n = w * h;
  F.cur = new Uint8Array(n); F.prev = new Uint8Array(n); F.have = false;
  F.R = new Float32Array(n); F.K = new Float32Array(n); F.Rt = new Float32Array(n); F.Kt = new Float32Array(n);
  F.B = new Float32Array(n); F.A = new Float32Array(n); F.At = new Float32Array(n); F.Mk = new Float32Array(n); F.Sk = new Float32Array(n);
  F.map = new Int32Array(n); F.mapKey = ''; F.bytes = new Uint8Array(n * 4);
}
// which mask pixel sits under each grid cell (the same cover-crop + mirror as the shader)
function buildMap(sx, sy){
  const key = F.w + 'x' + F.h + ':' + M.w + 'x' + M.h + ':' + sx.toFixed(4) + ':' + sy.toFixed(4) + ':' + mirror;
  if (key === F.mapKey || !M.w) return; F.mapKey = key;
  for (let y = 0; y < F.h; y++) for (let x = 0; x < F.w; x++){
    let u = ((x + .5) / F.w - .5) * sx + .5, v = ((y + .5) / F.h - .5) * sy + .5;
    if (mirror) u = 1 - u;
    const mx = Math.min(M.w - 1, Math.max(0, Math.floor(u * M.w))), my = Math.min(M.h - 1, Math.max(0, Math.floor(v * M.h)));
    F.map[y * F.w + x] = my * M.w + mx;
  }
}
function grab(){
  const w = F.w, h = F.h, vw = video.videoWidth, vh = video.videoHeight;
  if (!(vw > 0 && vh > 0)) return false;
  const sa = w / h, va = vw / vh;
  let cw = vw, ch = vh; if (va > sa) cw = vh * sa; else ch = vw / sa;
  ectx.setTransform(mirror ? -1 : 1, 0, 0, 1, mirror ? w : 0, 0);
  try { ectx.drawImage(video, (vw - cw)/2, (vh - ch)/2, cw, ch, 0, 0, w, h); } catch(e){ return false; }
  const d = ectx.getImageData(0, 0, w, h).data;
  const t = F.prev; F.prev = F.cur; F.cur = t;
  for (let i = 0, j = 0, n = w*h; i < n; i++, j += 4){
    const r = d[j], g = d[j+1], b = d[j+2], y = (r*77 + g*150 + b*29) >> 8;
    F.cur[i] = y;
    F.B[i] += (y / 255 - F.B[i]) * .15;
    const cb = 128 - .168736*r - .331264*g + .5*b, cr = 128 + .5*r - .418688*g - .081312*b;
    F.Sk[i] = (cb > 77 && cb < 127 && cr > 133 && cr < 173 && y > 40) ? 1 : 0;
  }
  const ok = F.have; F.have = true; return ok;
}
let motionAll = 0, hasBody = false;
const HOT = { x:.5, y:.4, t:0, on:false, k:0 };
function updateField(dt, fresh, warm, stamp){
  const w = F.w, h = F.h, n = w * h;
  const maskLive = M.has && M.live, noModel = !M.has;
  let armed = fresh && F.have && performance.now() - camT0 > 700;
  if (armed){ let ch = 0; for (let i = 0; i < n; i += 5) if (Math.abs(F.cur[i] - F.prev[i]) > 36) ch++; if (ch * 5 > n * .45) armed = false; }
  const kDecay = Math.exp(-dt / .7), rDecay = Math.exp(-dt / (.8 + 5.2 * S.keep * S.keep + 1.4 * S.keep));
  const sens = .4 + 1.1 * S.heat;
  let sum = 0, cnt = 0;
  for (let i = 0; i < n; i++){
    const m = maskLive ? M.b[F.map[i]] / 255 : (noModel ? .2 + .8 * F.Sk[i] : 0);
    F.Mk[i] = m;
    if (m > .4) cnt++;
    let mot = 0;
    if (armed){
      const dv = Math.abs(F.cur[i] - F.prev[i]);
      mot = Math.min(1, Math.max(0, dv - 18) / 70 * sens);
      mot *= m > .15 ? 1 : (maskLive ? .18 : .6);          // the room moving (curtains, a screen) barely warms
    }
    sum += mot;
    let k = F.K[i] * kDecay; if (mot > k) k = mot; F.K[i] = k;
    let r = F.R[i] * rDecay;
    const src = stamp ? m * .95 : m * .5 * warm + k * .32;
    if (src > r) r = Math.min(1, src);
    F.R[i] = r;
  }
  motionAll = sum / n; hasBody = cnt > n * .01;
  // heat rises and spreads: pull a little from the cell below and from the sides
  const a = Math.min(.6, (2 + 16 * S.rise) * dt), ak = Math.min(.7, (4 + 26 * S.rise) * dt), b = Math.min(.3, 6 * dt);
  for (let y = 0; y < h; y++){
    const yb = Math.min(h - 1, y + 1), o = y * w, ob = yb * w;
    for (let x = 0; x < w; x++){
      const xl = x > 0 ? x - 1 : 0, xr = x < w - 1 ? x + 1 : w - 1, i = o + x;
      F.Rt[i] = F.R[i] * (1 - a - b) + F.R[ob + x] * a + (F.R[o + xl] + F.R[o + xr]) * b * .5;
      F.Kt[i] = F.K[i] * (1 - ak - b) + F.K[ob + x] * ak + (F.K[o + xl] + F.K[o + xr]) * b * .5;
    }
  }
  let t = F.R; F.R = F.Rt; F.Rt = t; t = F.K; F.K = F.Kt; F.Kt = t;
  // the halo: a blurred copy of the body (two box passes)
  const rad = 3, inv = 1 / (2 * rad + 1);
  for (let y = 0; y < h; y++){ const o = y * w; let acc = 0;
    for (let x = -rad; x <= rad; x++) acc += F.Mk[o + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++){ F.At[o + x] = acc * inv; acc += F.Mk[o + Math.min(w - 1, x + rad + 1)] - F.Mk[o + Math.max(0, x - rad)]; } }
  for (let x = 0; x < w; x++){ let acc = 0;
    for (let y = -rad; y <= rad; y++) acc += F.At[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++){ F.A[y * w + x] = acc * inv; acc += F.At[Math.min(h - 1, y + rad + 1) * w + x] - F.At[Math.max(0, y - rad) * w + x]; } }
  // pack, and find the hottest place for the reticle
  let best = 0, bi = -1;
  for (let i = 0, j = 0; i < n; i++, j += 4){
    F.bytes[j] = F.R[i] * 255; F.bytes[j+1] = Math.min(1, F.K[i]) * 255; F.bytes[j+2] = F.B[i] * 255; F.bytes[j+3] = F.A[i] * 255;
    const hv = F.Mk[i] * (.6 + .4 * F.Sk[i]) + F.K[i] * .5;
    if (hv > best){ best = hv; bi = i; }
  }
  if (bi >= 0 && best > .45 && (maskLive || noModel || F.K[bi] > .3)){
    const tx = ((bi % w) + .5) / w, ty = (Math.floor(bi / w) + .5) / h;
    const kk = HOT.on ? 1 - Math.exp(-dt / .25) : 1;
    HOT.x += (tx - HOT.x) * kk; HOT.y += (ty - HOT.y) * kk; HOT.k += (best - HOT.k) * kk; HOT.on = true; HOT.t = 0;
  } else { HOT.t += dt; if (HOT.t > .5) HOT.on = false; }
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texField);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, F.bytes);
}
function clearField(){ if (F.R){ F.R.fill(0); F.K.fill(0); } HOT.on = false; }

/* ---------- model ---------- */
let segmenter = null, lastTs = 0, lastSegVT = -1;
async function initModel(){
  try{
    const vision = await import(VISION_URL);
    const fs = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = d => ({ baseOptions:{ modelAssetPath:SEG_MODEL, delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch(e){ segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    setStatus('');
  }catch(e){
    if (M.external) return;
    setStatus('人物検出モデルを読み込めませんでした（ネット接続を確認）。\n肌の色を手がかりに熱を写して続けます。');
  }
}
function segment(now){
  if (!segmenter || M.external || video.readyState < 2) return;
  const vt = video.currentTime; if (vt === lastSegVT) return; lastSegVT = vt;
  try{
    const ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    segmenter.segmentForVideo(video, ts, res => {
      const ms = res && res.confidenceMasks; if (!ms || !ms.length) return;
      const mk = ms[ms.length - 1]; ingestMask(mk.getAsFloat32Array(), mk.width, mk.height);
    });
  }catch(e){}
}

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, started = false, vidW = 1280, vidH = 720, lastVT = -1, camT0 = 0;
function setStatus(t){ $('status').textContent = t || ''; }
function camError(e){
  const msg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  const text = 'カメラを起動できませんでした：' + msg + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
  $('err').textContent = text;
  if (started) setStatus(text);
}
async function startCam(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  const s = await md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; mirror = facing === 'user';
  video.srcObject = s;
  await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = () => r(); });
  await video.play().catch(()=>{});
  vidW = video.videoWidth || 1280; vidH = video.videoHeight || 720;
  F.have = false; F.mapKey = ''; camT0 = performance.now(); clearField();
}

/* ---------- audio: the sensor's cooler, and the shutter's clack ---------- */
let actx = null, bus = null, recDest = null, cooler = null, sizzle = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); bus = actx.createGain(); bus.gain.value = .5; bus.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); bus.connect(recDest);
  cooler = actx.createGain(); cooler.gain.value = 0; cooler.connect(bus);
  const lp = actx.createBiquadFilter(); lp.type = 'bandpass'; lp.frequency.value = 2400; lp.Q.value = 9; lp.connect(cooler);
  const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 60; o.connect(lp); o.start();
  const sr = actx.sampleRate, n = sr * 2, buf = actx.createBuffer(1, n, sr), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
  const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;
  sizzle = actx.createGain(); sizzle.gain.value = 0;
  src.connect(hp); hp.connect(sizzle); sizzle.connect(bus); src.start();
  actx.resume().catch(()=>{});
}
function clack(){
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  [0, .11].forEach((dt, k) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(k ? 1500 : 1900, t + dt); o.frequency.exponentialRampToValueAtTime(220, t + dt + .03);
    g.gain.setValueAtTime(.0001, t + dt); g.gain.exponentialRampToValueAtTime(.22, t + dt + .002); g.gain.exponentialRampToValueAtTime(.0001, t + dt + .05);
    o.connect(g); g.connect(bus); o.start(t + dt); o.stop(t + dt + .06);
  });
}

// the switch: plain camera ⇄ thermal, through a flat-field calibration (NUC)
const MODE = { on:false, X:0, nuc:-1 };
function setMode(on){
  if (on === MODE.on) return;
  MODE.on = on; MODE.nuc = 0;
  $('mode').textContent = on ? '◂ CAMERA' : '▸ SEKIGAI';
  $('stamp').style.visibility = on ? 'visible' : 'hidden';
  if (on) clearField();
  clack(); inkUI();
}
function inkUI(){ document.body.classList.toggle('ink', MODE.on && PALS[S.pal].ink === 1); document.body.classList.toggle('fx', MODE.on); }
$('mode').onclick = () => setMode(!MODE.on);
addEventListener('keydown', e => { if (started && (e.key === ' ' || e.key === 'Enter') && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); setMode(!MODE.on); } });
$('go').onclick = async () => {
  $('err').textContent = '';
  ensureAudio();
  try{
    if (!gl) throw new Error('WebGL2 に未対応のブラウザです');
    if (!P) initGL();
    await startCam();
  }catch(e){ camError(e); return; }
  $('start').style.display = 'none';
  ['gear','flip','bar','rec','shoot','stamp','mode'].forEach(id => $(id).classList.add('show'));
  MODE.on = true; setMode(false); MODE.nuc = -1;
  if (!started){ started = true; initModel(); requestAnimationFrame(loop); }
};
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); } catch(e){ facing = prev; camError(e); }
};
$('gear').onclick = () => $('panel').classList.toggle('hide');
// a stamp: the body, as it is right now, pressed into the wall as hot residue
let stampQ = false, stampFlash = 0;
function stamp(){ if (!MODE.on || MODE.X < 1) return; stampQ = true; stampFlash = 1;
  if (actx && sizzle) sizzle.gain.setTargetAtTime(.25, actx.currentTime, .01); }
$('stamp').onclick = stamp;
out.addEventListener('pointerdown', () => { if (started) stamp(); });
let scaleGrad = null;
function setPal(i){
  S.pal = i; scaleGrad = null;
  [...$('pals').children].forEach(x => x.classList.toggle('on', +x.dataset.p === i));
  document.documentElement.style.setProperty('--acc', PALS[i].acc);
  inkUI();
}
$('pals').onclick = e => { const b = e.target.closest('button'); if (b) setPal(+b.dataset.p); };
[['sKeep','keep'],['sRise','rise'],['sHeat','heat'],['sGrain','grain']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });
$('sHud').onchange = e => { S.hud = e.target.checked; };

$('shoot').onclick = () => {
  try{
    out.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = 'sekigai-' + Date.now() + '.png'; a.click(); }, 'image/png');
  }catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...out.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'sekigai.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- HUD, drawn into the picture so it records ---------- */
const degC = v => (18 + 22 * v).toFixed(1);
function drawHud(W, H, t, alpha){
  const p = PALS[S.pal], u = Math.min(W, H) / 390;
  const ink = p.ink ? 'rgba(10,10,10,' : 'rgba(240,238,232,';
  octx.save(); octx.globalAlpha = alpha;
  octx.font = `300 ${Math.round(9 * u)}px "Red Hat Mono", monospace`; octx.textBaseline = 'top';
  octx.fillStyle = ink + '.72)';
  const pad = 14 * u, lh = 15 * u, top = Math.max(pad, 18 * u);
  octx.fillText('SEKIGAI   ' + p.name, pad, top);
  octx.fillStyle = ink + '.5)';
  octx.fillText('8–14 µm   ε 0.98', pad, top + lh);
  octx.fillText('T.MAX ' + (HOT.on ? degC(Math.min(1, HOT.k * .9 + .02)) : '--.-') + ' °C', pad, top + lh * 2);
  // the scale bar on the right edge
  const bx = W - pad - 4 * u, by = H * .3, bh = H * .34, bw = 3 * u;
  if (!scaleGrad || scaleGrad.h !== bh || scaleGrad.y !== by){
    const g = octx.createLinearGradient(0, by + bh, 0, by);
    p.stops.forEach((c, i) => g.addColorStop(i / 4, c));
    scaleGrad = { g, h:bh, y:by };
  }
  octx.fillStyle = scaleGrad.g; octx.fillRect(bx, by, bw, bh);
  octx.fillStyle = ink + '.55)'; octx.textAlign = 'right';
  octx.fillText('40.0', bx - 5 * u, by - 4 * u); octx.fillText('18.0', bx - 5 * u, by + bh - 6 * u);
  octx.textAlign = 'left';
  // the reticle on the hottest point
  if (HOT.on){
    const x = HOT.x * W, y = HOT.y * H, r = 16 * u, l = 6 * u;
    octx.strokeStyle = ink + '.85)'; octx.lineWidth = Math.max(1, u);
    octx.beginPath();
    for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
      octx.moveTo(x + sx * r, y + sy * (r - l)); octx.lineTo(x + sx * r, y + sy * r); octx.lineTo(x + sx * (r - l), y + sy * r);
    }
    octx.moveTo(x - 3 * u, y); octx.lineTo(x + 3 * u, y); octx.moveTo(x, y - 3 * u); octx.lineTo(x, y + 3 * u);
    octx.stroke();
    octx.fillStyle = ink + '.85)';
    octx.fillText(degC(Math.min(1, HOT.k * .9 + .02)) + '°', x + r + 4 * u, y - r);
  }
  octx.restore();
}

/* ---------- render ---------- */
let lastT = 0, warm = 0;
const STATE = { nuc:0, warm:0, E:0 };
function loop(now){
  requestAnimationFrame(loop);
  const dt = lastT ? Math.min(.1, (now - lastT)/1000) : 1/60; lastT = now;
  const t = now / 1000;
  if (video.videoWidth && (video.videoWidth !== vidW || video.videoHeight !== vidH)){ vidW = video.videoWidth; vidH = video.videoHeight; F.mapKey = ''; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = Math.round(innerWidth*dpr), H = Math.round(innerHeight*dpr);
  const k = Math.min(1, 1600 / Math.max(W, H)); W = Math.round(W*k); H = Math.round(H*k);
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; out.width = W; out.height = H; scaleGrad = null; }
  ensureField(W, H);
  segment(now);
  if (M.live && now - M.lastT > 1200) M.live = false;
  if (video.readyState < 2) return;
  const sa = W/H, va = vidW/vidH, sx = sa < va ? sa/va : 1, sy = sa < va ? 1 : va/sa;
  buildMap(sx, sy);
  const vt = video.currentTime, fresh = vt !== lastVT; lastVT = vt;
  const grabbed = fresh && grab();

  // the switch: 0.22 s of flat grey calibration, then the body warms up out of the cold
  let nuc = 0;
  if (MODE.nuc >= 0){ MODE.nuc += dt; const q = MODE.nuc;
    nuc = q < .05 ? q / .05 : q < .26 ? 1 : q < .5 ? 1 - (q - .26) / .24 : 0;
    if (q > .5) MODE.nuc = -1; }
  const midNuc = MODE.nuc >= 0 && MODE.nuc > .05 && MODE.nuc < .26;
  if (!midNuc) MODE.X = MODE.on ? Math.min(3, MODE.X + dt) : 0;
  const E = MODE.on ? (MODE.X > 0 ? 1 : 0) : (MODE.nuc >= 0 && MODE.nuc < .15 ? 1 : 0);
  warm = MODE.on ? Math.min(1, Math.max(0, (MODE.X - .05) / 1.1)) : 0;
  const w2 = warm * warm * (3 - 2 * warm);
  updateField(dt, grabbed && MODE.on, w2, stampQ && MODE.on); stampQ = false;
  stampFlash = Math.max(0, stampFlash - dt * 3);
  STATE.nuc = nuc; STATE.warm = w2; STATE.E = E;

  if (fresh){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; } }
  if (M.dirty){ M.dirty = false; gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, M.w, M.h, 0, gl.RED, gl.UNSIGNED_BYTE, M.b); }

  const p = PALS[S.pal];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.p); gl.bindVertexArray(vao);
  const U = P.U;
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uField, 2);
  gl.uniform2f(U.uRes, W, H); gl.uniform2f(U.uScale, sx, sy);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0); gl.uniform1f(U.uE, E); gl.uniform1f(U.uWarm, .15 + .85 * w2);
  gl.uniform1f(U.uNuc, nuc); gl.uniform1f(U.uT, t);
  gl.uniform1f(U.uHasMask, M.has ? (M.live ? 1 : -1) : 0);   // no model → skin colour; stale mask → nobody
  gl.uniform1f(U.uGrain, .25 + 1.1 * S.grain); gl.uniform1f(U.uAccK, p.accK);
  gl.uniform3fv(U.uPal, p.v); gl.uniform3fv(U.uAcc, p.a);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  octx.drawImage(canvas, 0, 0);
  if (stampFlash > 0){ octx.fillStyle = p.ink ? `rgba(0,0,0,${stampFlash * .25})` : `rgba(255,255,255,${stampFlash * .18})`; octx.fillRect(0, 0, W, H); }
  if (S.hud && MODE.on && MODE.X > .6 && nuc < .5) drawHud(W, H, t, Math.min(1, (MODE.X - .6) / .5));

  if (actx && cooler){
    cooler.gain.setTargetAtTime(MODE.on ? .035 : 0, actx.currentTime, .3);
    if (stampFlash < .6) sizzle.gain.setTargetAtTime(MODE.on ? Math.min(.12, motionAll * 1.6) : 0, actx.currentTime, .08);
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__SEKIGAI = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; return ingestMask(d, w, h); },
  state: () => {
    let rMax = 0, kMax = 0, kx = 0, ky = 0, kw = 0;
    if (F.R) for (let i = 0; i < F.R.length; i++){ if (F.R[i] > rMax) rMax = F.R[i];
      const kv = F.K[i]; if (kv > kMax) kMax = kv; if (kv > .2){ kx += (i % F.w) * kv; ky += Math.floor(i / F.w) * kv; kw += kv; } }
    return { motion:motionAll, hasBody, maskLive:M.live, rMax, kMax, kCx: kw ? kx / kw / F.w : -1, kCy: kw ? ky / kw / F.h : -1,
      hot:{ ...HOT }, nuc:STATE.nuc, warm:STATE.warm, E:STATE.E };
  },
  palette(i){ setPal(i); },
  mode(c){ setMode(!!c); },
  tap(){ stamp(); },
  view: () => ({ on:MODE.on, X:MODE.X }),
};
</script>
</body>
</html>
