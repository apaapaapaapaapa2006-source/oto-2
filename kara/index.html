<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<meta name="description" content="映った人の体が 3D プリントの白い格子になる。動いたところから肌の殻が一枚ずつはがれて落ち、格子の向こうのスタジオが透けて見える。止まればゆっくり戻る。撮影と録画ができる。">
<meta name="theme-color" content="#c9c4bb">
<title>KARA ─ 体が透ける格子になる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  KARA 殻／空 ─ 体が透ける格子になる                       ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  REFERENCE  The Chemical Brothers「Wide Open」（2016, Dom & Nic）の MV。がらんとした
             灰色の倉庫で踊るダンサーの体が、腕から順に白い 3D プリントの
             ボロノイ格子に置き換わっていき、最後には格子の隙間から向こうの
             壁が透けて見える。ワンカットの、静かでいちばん冷たい変身。
             （映像そのものは借りない。白い有機的な格子の体という型を借りる）
  MOOD       ファッションフィルムの一場面。照明の行き届いたホリゾントの前で、
             あなたの肌は薄い殻にすぎない。動いたところから殻が一枚ずつ割れて
             落ち、中から真っ白な格子が出てくる。格子の穴の奥には体の裏側の
             格子、さらにその奥に壁。止まれば殻はゆっくり刷り直される。
  PALETTE    NYLON     ホリゾント #c9c4bb〜#d9d4cb ／ 格子 #eeeae2 ／ 影 #57534d
             CHROME    #1b1c1f グラファイトの部屋 ／ 鏡面の格子（天井と左右の
                       ソフトボックスを映す）
             OBSIDIAN  #efede8 の白い部屋 ／ 黒い光沢の格子 ／ 肌はほぼ白黒
             LUMEN     #0b0b0c 暗室 ／ 格子そのものが 2700K の電球色に光り、
                       壁にその光が回る
             差し色はひとつだけ：プリントヘッドのレーザー #ff5a1f（切り替えと「全身」）
  TYPE       Onest 200 / 500（細いグロテスク）＋ Noto Sans JP 300。UI は小さく。
  MOTION     ゆっくり。殻は割れたら重力で落ちて床で止まる。光は数十秒かけて
             わずかに回り、影の向きが変わる。派手な揺れは使わない。
  SIGNATURE  格子の穴からホリゾントが見え、壁の影にも穴のぶんの光が漏れる。
  LAYERS     ① 体の部位ごとに円筒・頭は球として貼りついた 3D のボロノイ格子
                （節は丸く太り、輪郭に近いほど詰まって見える。頭は首振りで回る）
             ② 部位ごとの速さで殻がはがれる（手先から肩へ・足先から腰へ進む）。
                止まると時間をかけて刷り直される
             ③ 前の格子の穴から、体の裏側の格子と、さらに向こうの壁が見える
             ④ はがれた殻は破片になって回りながら落ち、床に散って消える
             ⑤ 壁に落ちる影に、格子の穴を抜けた光が斑に漏れる。光源はゆっくり回る
             ⑥ 素材 4 種（NYLON・CHROME・OBSIDIAN・LUMEN）、背景はスタジオ／実際の部屋
             ⑦ 体をタップするとそこだけ一気に開く。「全身」（または手拍子）で
                レーザーが頭から足まで走り、全身が格子になる
             ⑧ 素のカメラ ⇄ 作品：橙のレーザーが上から体をなぞって格子を
                透かしながら下りていき、通ったところからスタジオになる
             ⑨ 殻の割れる乾いた音と、レーザーの走査音（録画に入る）
  TECH       WebGL2。MediaPipe PoseLandmarker（2 人まで、セグメンテーション付き）。
             1 パス目で人物層（色・透過・発光）を MRT に書き、2 パス目で
             背景・影（透過のミップを光の向きにずらして読む）・合成・粒子。
             格子は周期的なボロノイを 256² の表に前計算（最近・次点の境界距離と
             種の番号）。部位の座標は円筒の周長と軸の長さ、頭は耳を軸にした球面座標。
             殻の開閉は種ごとの乱数と部位の値 E の比較で、E は観測時刻で測った
             速さで増え、実時間で減る。
  ══════════════════════════════════════════════════════════════════════════
-->

<div id="start">
  <div class="t">LATTICE BODY</div>
  <h1>KARA</h1>
  <canvas id="emblem" width="400" height="400"></canvas>
  <div class="sub">体が、透ける格子になる。</div>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、動いたところから<br>肌の殻がはがれ、白い格子が透けて見える。<br>止まれば、ゆっくり戻る。</p>
  <button id="go">はじめる</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   KARA — the body as a 3D-printed Voronoi lattice under a thin skin.
   per frame:
     pose (+ mask) → body parts as cylinders (+ head sphere) in screen px →
     pass 1 (MRT): person layer — skin / front struts / back struts / see-through,
                   transmission + emission
     pass 2: studio (or the learned room) · shadow through the holes · person ·
             print-head laser · grain → falling shell chips on top.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';

const $ = id => document.getElementById(id);
const view = $('view'), video = $('cam');
const S = { mat:0, room:false, cell:.115, strut:.11, sens:1, heal:.06, shadow:.55, vol:.6, chips:true, clap:false };
const MATS = ['NYLON', 'CHROME', 'OBSIDIAN', 'LUMEN'];
const THEME = ['#c9c4bb', '#1b1c1f', '#efede8', '#0b0b0c'];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fin = v => typeof v === 'number' && isFinite(v);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TEST = { maxDt:.05 };

/* ---------- lattice: a periodic Voronoi tile, 7×7 jittered seeds ---------- */
const LN = 256, LG = 7;
const SEEDS = new Float32Array(LG * LG * 2);
let LAT = null;
function makeLattice(){
  let s = 20161;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let j = 0; j < LG; j++) for (let i = 0; i < LG; i++){
    const k = j * LG + i;
    SEEDS[k * 2] = (i + .5 + (rnd() - .5) * .78) / LG;
    SEEDS[k * 2 + 1] = (j + .5 + (rnd() - .5) * .78) / LG;
  }
  const out = new Uint8Array(LN * LN * 4);
  const cx = new Float32Array(25), cy = new Float32Array(25), ck = new Int32Array(25);
  for (let y = 0; y < LN; y++){
    const py = (y + .5) / LN, gj = Math.floor(py * LG);
    for (let x = 0; x < LN; x++){
      const px = (x + .5) / LN, gi = Math.floor(px * LG);
      let n = 0, b = 0, bd = 1e9;
      for (let dj = -2; dj <= 2; dj++) for (let di = -2; di <= 2; di++){
        const ii = gi + di, jj = gj + dj;
        const wi = ((ii % LG) + LG) % LG, wj = ((jj % LG) + LG) % LG, k = wj * LG + wi;
        const sx = SEEDS[k * 2] + Math.floor(ii / LG), sy = SEEDS[k * 2 + 1] + Math.floor(jj / LG);
        cx[n] = sx; cy[n] = sy; ck[n] = k;
        const d = (sx - px) * (sx - px) + (sy - py) * (sy - py);
        if (d < bd){ bd = d; b = n; }
        n++;
      }
      let e1 = 1e9, e2 = 1e9, k2 = ck[b];
      for (let c = 0; c < n; c++){
        if (c === b) continue;
        const dx = cx[c] - cx[b], dy = cy[c] - cy[b], L = Math.hypot(dx, dy);
        if (L < 1e-6) continue;
        const dc = (cx[c] - px) * (cx[c] - px) + (cy[c] - py) * (cy[c] - py);
        const be = (dc - bd) / (2 * L);
        if (be < e1){ e2 = e1; e1 = be; k2 = ck[c]; } else if (be < e2) e2 = be;
      }
      const o = (y * LN + x) * 4;
      out[o] = clamp(Math.round(e1 * LG / .6 * 255), 0, 255);
      out[o + 1] = clamp(Math.round(e2 * LG / .6 * 255), 0, 255);
      out[o + 2] = ck[b]; out[o + 3] = k2;
    }
  }
  LAT = out;
}
makeLattice();

/* ---------- start-screen emblem: a lattice sphere, drawn once on the CPU ---------- */
(function emblem(){
  const c = $('emblem'), x = c.getContext('2d'), N = c.width, img = x.createImageData(N, N), d = img.data;
  const L = [-.5, -.62, .6], ln = Math.hypot(...L); L[0] /= ln; L[1] /= ln; L[2] /= ln;
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * .25; };
  const edge = (u, v) => { u = ((u % LG) + LG) % LG / LG * LN; v = ((v % LG) + LG) % LG / LG * LN;
    const o = ((v | 0) * LN + (u | 0)) * 4; return smin(LAT[o] / 255 * .6, LAT[o + 1] / 255 * .6, .17); };
  const w = .115, rot = .5;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++){
    const qx = (i - N / 2) / (N * .46), qy = (j - N / 2) / (N * .46), r2 = qx * qx + qy * qy, o = (j * N + i) * 4;
    if (r2 >= 1) continue;
    let col = null;
    for (const side of [1, -1]){
      const z = Math.sqrt(1 - r2) * side;
      const ty = qy * Math.cos(.35) - z * Math.sin(.35), tz = qy * Math.sin(.35) + z * Math.cos(.35);
      const hx = qx * Math.cos(rot) - tz * Math.sin(rot), hz = qx * Math.sin(rot) + tz * Math.cos(rot);
      const th = Math.atan2(hx, hz), la = Math.asin(clamp(-ty, -1, 1));
      const e = edge(th / (2 * Math.PI) * 28, la * 4.4);
      if (e < w){
        const h = Math.sqrt(1 - (e / w) * (e / w));
        const nl = Math.max(0, (qx * L[0] + qy * L[1] + z * side * L[2]));
        const b = side > 0 ? (.42 + .62 * (nl * .7 + h * .3)) : (.30 + .2 * h);
        col = [238 * b, 234 * b, 226 * b];
        break;
      }
    }
    if (col){ d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; }
  }
  x.putImageData(img, 0, 0);
})();

/* ---------- WebGL2 ---------- */
const gl = view.getContext('webgl2', { alpha:false, antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:false });
const VS = `#version 300 es
in vec2 aP; void main(){ gl_Position = vec4(aP, 0., 1.); }`;
const COMMON = `#version 300 es
precision highp float; precision highp int;
const float PI = 3.14159265;
uniform vec2 uRes; uniform vec4 uCover; uniform float uMirror;
vec2 camUV(vec2 p){ vec2 u = (p - uCover.xy) / uCover.zw; if (uMirror > .5) u.x = 1. - u.x; return u; }
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h * h * k * .25; }
`;
/* pass 1: the person layer */
const FS_PERSON = COMMON + `
uniform sampler2D uCam, uMask, uLat;
uniform vec2 uSeeds[49];
uniform vec4 uSeg[22], uPar[22], uPar2[22];
uniform vec4 uHead[2], uHeadB[2], uHeadC[2];
uniform mat3 uHRot[2];
uniform float uStrut, uHasMask;
uniform int uMat;
uniform vec4 uScan;
uniform vec3 uLight;
layout(location=0) out vec4 oCol;
layout(location=1) out vec4 oT;
const float TILE = 7.;

float edgeAt(vec2 uv, float k){ vec4 t = texture(uLat, uv / TILE); return smin(t.r * .6, t.g * .6, k); }
vec2 cellC(vec2 uv, int k){
  vec2 base = floor(uv / TILE) * TILE + uSeeds[k];
  vec2 best = base; float bd = 1e9;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 c = base + TILE * vec2(float(i), float(j)); vec2 d = c - uv; float dd = dot(d, d);
    if (dd < bd){ bd = dd; best = c; }
  }
  return best;
}
struct Lay { float e; float e1; vec2 g; float op; float op2; float q; };
Lay lay(vec2 uv, float salt, float E, float gb, float w){
  Lay r;
  float k = w * 1.6;
  vec4 t = texture(uLat, uv / TILE);
  r.e1 = t.r * .6;
  r.e = smin(t.r * .6, t.g * .6, k);
  float ex = edgeAt(uv + vec2(.035, 0.), k), ey = edgeAt(uv + vec2(0., .035), k);
  vec2 g = vec2(ex - r.e, ey - r.e);
  r.g = dot(g, g) > 1e-10 ? normalize(g) : vec2(0.);
  ivec2 tc = ivec2(floor(fract(uv / TILE) * 256.)) & ivec2(255);
  vec4 tn = texelFetch(uLat, tc, 0);
  int k1 = clamp(int(tn.b * 255. + .5), 0, 48), k2 = clamp(int(tn.a * 255. + .5), 0, 48);
  vec2 c1 = cellC(uv, k1), c2 = cellC(uv, k2);
  float q1 = h12(c1 * 1.37 + salt), q2 = h12(c2 * 1.37 + salt);
  float E2 = E * 1.2;
  r.op = E2 - (q1 * .35 + gb * .85);
  r.op2 = E2 - (q2 * .35 + gb * .85);
  r.q = q1;
  return r;
}
float envF(vec3 R){
  float up = -R.y;
  float e = .05 + .1 * smoothstep(-.2, .6, up);
  e += 1.3 * smoothstep(.5, .75, up) * smoothstep(.98, .8, up);
  e += 1.1 * exp(-pow((R.x + .72) / .12, 2.)) * smoothstep(-.6, -.1, up);
  e += .6 * exp(-pow((R.x - .78) / .07, 2.)) * smoothstep(-.4, .1, up);
  e += .35 * exp(-pow(up / .035, 2.));
  return e;
}
vec3 strut(vec3 N, float hh, float back){
  vec3 I = vec3(0., 0., -1.);
  vec3 R = reflect(I, N);
  float nl = dot(N, uLight);
  if (uMat == 0){
    float wrap = max((nl + .4) / 1.4, 0.);
    vec3 c = vec3(.935, .918, .88) * (.26 + .78 * wrap);
    c *= mix(.72, 1., hh);
    return back > .5 ? c * vec3(.44, .43, .41) : c;
  } else if (uMat == 1){
    vec3 c = vec3(.86, .88, .92) * envF(R) + vec3(.05);
    c *= mix(.55, 1., hh);
    return back > .5 ? c * .45 : c;
  } else if (uMat == 2){
    vec3 H = normalize(uLight + vec3(0., 0., 1.));
    float sp = pow(max(dot(N, H), 0.), 70.) * 1.3;
    float fr = pow(1. - max(N.z, 0.), 3.);
    vec3 c = vec3(.018) + vec3(sp) + vec3(.55) * fr * envF(R) + vec3(.08) * envF(R);
    return back > .5 ? c * .55 : c;
  }
  vec3 c = vec3(1., .8, .56) * (.08 + 1.15 * pow(hh, 3.)) + vec3(.5, .2, .05) * hh * .25;
  return back > .5 ? c * .32 : c;
}
vec3 grade(vec3 c){
  float l = dot(c, vec3(.299, .587, .114));
  if (uMat == 0){ c = mix(vec3(l), c, .84); c = c * vec3(1.02, 1., .97); }
  else if (uMat == 1){ c = mix(vec3(l), c, .55) * vec3(.94, .98, 1.05); c = (c - .5) * 1.14 + .5; }
  else if (uMat == 2){ c = mix(vec3(l), c, .22); c = (c - .5) * 1.1 + .55; }
  else { c = mix(vec3(l), c, .7) * vec3(1., .82, .62) * .62; }
  return clamp(c, 0., 1.);
}
vec3 interior(float E, vec3 Nb){
  float k = .45 + .55 * E;
  float lit = .7 + .3 * max(dot(-Nb, uLight), 0.);
  if (uMat == 0) return vec3(.44, .42, .39) * k * lit;
  if (uMat == 1) return vec3(.07, .075, .085) * k * lit;
  if (uMat == 2) return vec3(.035) * lit;
  return vec3(.11, .065, .035) * k;
}
vec3 rimC(vec3 Nb){
  float nl = max((dot(Nb, uLight) + .3) / 1.3, 0.);
  if (uMat == 0) return vec3(.96, .945, .91) * (.55 + .5 * nl);
  if (uMat == 1) return vec3(.9, .92, .95) * (.4 + .9 * nl);
  if (uMat == 2) return vec3(.06) + vec3(.6) * pow(nl, 6.);
  return vec3(1., .78, .5) * 1.2;
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 vuv = camUV(p);
  float m = 0.;
  if (uHasMask > .5 && vuv.x >= 0. && vuv.x <= 1. && vuv.y >= 0. && vuv.y <= 1.) m = smoothstep(.3, .7, texture(uMask, vuv).r);
  if (m < .004){ oCol = vec4(0.); oT = vec4(1., 0., 0., 1.); return; }
  vec3 cam = texture(uCam, vuv).rgb;

  // ---- which part is this pixel on? head first, then limbs, then the torso
  int hb = -1; vec2 hq = vec2(0.); float hbd = 1.;
  for (int h = 0; h < 2; h++){
    if (uHeadC[h].z < .5) continue;
    vec2 d = p - uHead[h].xy;
    vec2 rr = vec2(uHeadB[h].x * d.x + uHeadB[h].y * d.y, -uHeadB[h].y * d.x + uHeadB[h].x * d.y);
    vec2 q = rr / (uHead[h].z * vec2(1., uHeadB[h].z));
    float dq = length(q);
    if (dq < hbd){ hbd = dq; hb = h; hq = q; }
  }
  int best = -1; float bd = 1e9;
  if (hb < 0){
    for (int i = 0; i < 22; i++){
      float kind = uPar[i].w;
      if (kind < .5) continue;
      vec2 a = uSeg[i].xy, b = uSeg[i].zw, ab = b - a;
      float L = max(length(ab), 1.);
      float t = clamp(dot(p - a, ab) / (L * L), 0., 1.);
      float r = mix(uPar[i].x, uPar[i].y, t);
      float dn = length(p - (a + ab * t)) / r;
      if (kind > 1.5) dn = dn * 1.3 + .12;
      if (dn < bd){ bd = dn; best = i; }
    }
  }
  vec3 col; float a = 1.; float emis = 0.;
  if (hb < 0 && best < 0){
    col = grade(cam);
  } else {
    // ---- surface coordinates (front / back) and tangent frames
    vec2 uvF, uvB; vec3 NbF, NbB, TuF, TuB, TvF, TvB; float E, gb, gbB, salt, cell;
    if (hb >= 0){
      int h = hb;
      float z = sqrt(max(0., 1. - dot(hq, hq)));
      mat3 Rt = transpose(uHRot[h]);
      vec3 HF = Rt * vec3(hq, z), HB = Rt * vec3(hq, -z);
      float R = uHead[h].z; cell = uHeadC[h].y; salt = uHeadC[h].x;
      float nA = uHeadB[h].w;
      // vertical axis: turning the head only slides the cells around it
      float thF = atan(HF.x, HF.z), laF = asin(clamp(-HF.y, -1., 1.));
      float thB = atan(HB.x, HB.z), laB = asin(clamp(-HB.y, -1., 1.));
      uvF = vec2(thF / (2. * PI) * nA, laF * R / cell) + salt * 9.1;
      uvB = vec2(thB / (2. * PI) * nA, laB * R / cell) + salt * 9.1;
      vec2 rc = uHeadB[h].xy;
      #define TOS(v) (vec3(rc.x * (v).x - rc.y * (v).y, rc.y * (v).x + rc.x * (v).y, (v).z))
      vec3 a0 = uHRot[h] * vec3(cos(thF), 0., -sin(thF));
      vec3 a1 = uHRot[h] * vec3(-sin(laF) * sin(thF), -cos(laF), -sin(laF) * cos(thF));
      vec3 a2 = uHRot[h] * HF;
      TuF = TOS(a0); TvF = TOS(a1); NbF = TOS(a2);
      vec3 b0 = uHRot[h] * vec3(cos(thB), 0., -sin(thB));
      vec3 b1 = uHRot[h] * vec3(-sin(laB) * sin(thB), -cos(laB), -sin(laB) * cos(thB));
      vec3 b2 = uHRot[h] * HB;
      TuB = TOS(b0); TvB = TOS(b1); NbB = -TOS(b2);
      // the face goes last: the sides and the back of the skull open first
      E = uHead[h].w; gb = .08 + .8 * smoothstep(-.3, .95, HF.z); gbB = .08 + .8 * smoothstep(-.3, .95, HB.z);
    } else {
      int i = best;
      vec2 a0 = uSeg[i].xy, b0 = uSeg[i].zw, ab = b0 - a0;
      float L = max(length(ab), 1.); vec2 ax = ab / L, pp = vec2(-ax.y, ax.x);
      float tu = dot(p - a0, ax) / L, tc = clamp(tu, 0., 1.);
      float r = mix(uPar[i].x, uPar[i].y, tc), sl = dot(p - a0, pp);
      r = max(r, abs(sl) * 1.06);             // the mask is wider than the model: keep the cells from smearing
      float sn = clamp(sl / r, -.97, .97), ph = asin(sn);
      cell = uPar2[i].w; salt = uPar2[i].x;
      vec2 off = vec2(salt * 13.1, salt * 7.7);
      uvF = vec2(ph * r / cell, tu * L / cell) + off;
      uvB = vec2((PI - ph) * r / cell, tu * L / cell) + off;
      vec3 P3 = vec3(pp, 0.), A3 = vec3(ax, 0.), Z = vec3(0., 0., 1.);
      NbF = P3 * sin(ph) + Z * cos(ph); TuF = P3 * cos(ph) - Z * sin(ph); TvF = A3;
      NbB = -(P3 * sin(ph) - Z * cos(ph)); TuB = -P3 * cos(ph) - Z * sin(ph); TvB = A3;
      E = uPar[i].z; gb = mix(uPar2[i].y, uPar2[i].z, tc);
      if (uPar[i].w > 1.5) gb = clamp(gb - .2 * abs(sn), 0., 1.);
      gbB = gb;
    }
    // print-head band: cells open while the laser passes
    if (uScan.z > 0.){ float d = (p.y - uScan.x) / uScan.y; E = max(E, uScan.z * (uScan.w > .5 ? smoothstep(.6, -.6, d) : exp(-d * d)) * 1.05); }
    float w = uStrut;
    Lay F = lay(uvF, salt, E, gb, w);
    if (F.op <= 0.){
      col = grade(cam);
      // the cut edge of the shell where a neighbour has fallen away
      if (F.op2 > 0. && F.e1 < .05){
        float k = smoothstep(.05, .012, F.e1);
        col = mix(col, rimC(NbF), k);
        col *= mix(1., .7, smoothstep(.012, .0, F.e1));
      }
    } else if (F.e < w){
      float ew = F.e / w, hh = sqrt(max(0., 1. - ew * ew));
      vec3 N = normalize(TuF * F.g.x * ew + TvF * F.g.y * ew + NbF * hh);
      col = strut(N, hh, 0.);
      if (F.op2 <= 0.) col *= mix(.62, 1., smoothstep(.0, .07, F.e1));
      emis = uMat == 3 ? .45 + .3 * hh : 0.;
    } else {
      // through the hole: the inside of the back wall, its struts, or the room behind
      float ao = smoothstep(w, w * 2.4, F.e);
      Lay B = lay(uvB, salt + 3.1, E, gbB, w);
      if (B.op <= 0.){ col = interior(E, NbB) * mix(.6, 1., ao); }
      else if (B.e < w){
        float ew = B.e / w, hh = sqrt(max(0., 1. - ew * ew));
        vec3 N = normalize(TuB * B.g.x * ew + TvB * B.g.y * ew + NbB * hh);
        col = strut(N, hh, 1.) * mix(.55, 1., ao);
        emis = uMat == 3 ? .15 : 0.;
      } else {
        a = 0.; col = vec3(0.);
        if (F.op2 <= 0. && F.e1 < w * 2.6) { a = .35 * (1. - F.e1 / (w * 2.6)); col = vec3(0.); }
      }
    }
  }
  float al = a * m;
  oCol = vec4(col * al, al);
  oT = vec4(1. - al, emis * m, 0., 1.);
}`;
/* pass 0: remember the room where nobody stands (premultiplied, alpha = confidence) */
const FS_BG = COMMON + `
uniform sampler2D uPrev, uCam, uMask; uniform float uHasMask;
out vec4 o;
void main(){
  vec2 sp = gl_FragCoord.xy / uRes;
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 vuv = camUV(p);
  vec3 c = texture(uCam, vuv).rgb;
  float m = uHasMask > .5 ? texture(uMask, vuv).r : 1.;
  vec4 pr = texture(uPrev, sp);
  float k = 1. - smoothstep(.06, .3, m);
  vec3 rgb = pr.a > .004 ? pr.rgb / pr.a : c;
  rgb = mix(rgb, c, pr.a < .02 ? k : .1 * k);
  float al = min(1., pr.a + k * .06);
  o = vec4(rgb * al, al);
}`;
/* pass 2: backdrop + shadow + person + laser + grain (+ the plain camera below/above the split) */
const FS_COMP = COMMON + `
uniform sampler2D uPer, uTr, uCam, uBg, uMask;
uniform int uMat, uRoom;
uniform float uShadow, uHorizon, uTime, uGrain, uHasMask;
uniform vec2 uShOff;
uniform vec4 uSplit;   // y (fx above), lineAlpha, steadyFx, 0
uniform vec4 uLine;    // y, alpha, 0, 0  (the full-body print head)
uniform vec3 uLight;
out vec4 o;
vec3 studio(vec2 p){
  vec2 q = p / uRes;
  float sh = min(uRes.x, uRes.y);
  float hz = uHorizon;
  float wallT = smoothstep(hz + .02 * uRes.y, hz - .05 * uRes.y, p.y);
  vec2 lc = vec2(.5 - uLight.x * .35, .32) * uRes;
  float pool = exp(-pow(length(p - lc) / (sh * 1.05), 2.));
  float flo = clamp((p.y - hz) / max(uRes.y - hz, 1.), 0., 1.);
  vec3 wall, floorC;
  if (uMat == 0){ wall = mix(vec3(.62, .6, .565), vec3(.86, .84, .8), pool); floorC = mix(vec3(.66, .64, .6), vec3(.5, .48, .45), flo); }

const horizonY = () => G.H * (G.W > G.H ? .8 : .86);

/* ---------- mask ---------- */
const MASK = { cpu:null, w:0, h:0, t:-1e9, dirty:false, empty:true };

  const W0 = m0.w | 0, H0 = m0.h | 0, st = W0 > 640 ? 2 : 1, w = (W0 / st) | 0, h = (H0 / st) | 0;
  if (!MASK.cpu || MASK.w !== w || MASK.h !== h){ MASK.cpu = new Uint8Array(w * h); MASK.w = w; MASK.h = h; }
  const out = MASK.cpu; out.fill(0);
  let any = false;
  for (const m of list){
    if (!m || (m.w | 0) !== W0 || (m.h | 0) !== H0 || !m.data || m.data.length < W0 * H0) continue;
    const d = m.data; any = true;
    for (let y = 0; y < h; y++){ const ro = y * st * W0, wo = y * w;
      for (let x = 0; x < w; x++){ const v = d[ro + x * st]; const b = fin(v) ? (v <= 0 ? 0 : v >= 1 ? 255 : v * 255 | 0) : 0; if (b > out[wo + x]) out[wo + x] = b; } }
  }
  if (!any) return false;

}
function uploadMask(now){
  if (!glOK) return;

  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, MASK.w, MASK.h, 0, gl.RED, gl.UNSIGNED_BYTE, MASK.cpu);

let landmarker = null, lastTs = 0, lastVT = -1, modelState = 'none';
const EXT = { on:false };

    const o = d => ({ baseOptions:{ modelAssetPath:POSE_MODEL, delegate:d }, runningMode:'VIDEO', numPoses:2, outputSegmentationMasks:true,
      minPoseDetectionConfidence:.5, minPosePresenceConfidence:.5, minTrackingConfidence:.5 });

function detect(now){

    const ms = res && res.segmentationMasks;
    if (ms && ms.length){
      const list = [];
      for (const m of ms){ try{ list.push({ data:m.getAsFloat32Array(), w:m.width, h:m.height }); }catch(e){} }
      ingestMasks(list, now);

let actx = null, master = null, recDest = null, noiseBuf = null, tickBudget = 0;

    actx = new AC(); master = actx.createGain(); master.gain.value = S.vol;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);

}

    const p = PEOPLE[pi];
    U.hrot[pi * 9] = U.hrot[pi * 9 + 4] = U.hrot[pi * 9 + 8] = 1;
    if (!p) continue;
    for (let i = 0; i < NPART; i++){
      const q = p.parts[i], o = (pi * NPART + i) * 4;
      if (!q.kind) continue;
      U.seg[o] = q.a[0]; U.seg[o + 1] = q.a[1]; U.seg[o + 2] = q.b[0]; U.seg[o + 3] = q.b[1];
      U.par[o] = Math.max(1, q.ra); U.par[o + 1] = Math.max(1, q.rb); U.par[o + 2] = q.E; U.par[o + 3] = q.kind;
      U.par2[o] = p.salt + i * 2.31; U.par2[o + 1] = q.ga; U.par2[o + 2] = q.gb; U.par2[o + 3] = Math.max(2, q.cell);

      U.head[pi * 4] = H.c[0]; U.head[pi * 4 + 1] = H.c[1]; U.head[pi * 4 + 2] = Math.max(2, H.R); U.head[pi * 4 + 3] = H.E;
      U.headB[pi * 4] = Math.cos(H.roll); U.headB[pi * 4 + 1] = Math.sin(H.roll); U.headB[pi * 4 + 2] = H.ys; U.headB[pi * 4 + 3] = H.n;
      U.headC[pi * 4] = p.salt + 31.7; U.headC[pi * 4 + 1] = Math.max(2, H.cell); U.headC[pi * 4 + 2] = 1;
      // head-local → roll frame: Ry(yaw) · Rx(pitch)   (column-major for the shader)
      const cy = Math.cos(H.yaw), sy = Math.sin(H.yaw), cp = Math.cos(H.pitch), sp = Math.sin(H.pitch);

      U.hrot[o + 3] = R[0][1]; U.hrot[o + 4] = R[1][1]; U.hrot[o + 5] = R[2][1];
      U.hrot[o + 6] = R[0][2]; U.hrot[o + 7] = R[1][2]; U.hrot[o + 8] = R[2][2];
    }
  }
}
function lightDir(){
  const a = -2.2 + Math.sin(clock * .045) * .35;

}
function tex(u, unit, t){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(u, unit); }
function common(pr){ gl.uniform2f(pr.u.uRes, G.W, G.H); gl.uniform4f(pr.u.uCover, G.ox, G.oy, G.dw, G.dh); gl.uniform1f(pr.u.uMirror, mirror ? 1 : 0); }
function render(now){
  const W = G.W, H = G.H;
  sizeFB(W, H);
  if (video.readyState >= 2){
    gl.bindTexture(gl.TEXTURE_2D, texCam);
    try{ gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); }catch(e){}
  }
  uploadMask(now);
  let hasMask = MASK.cpu && !MASK.empty ? 1 : 0;
  if (modelState === 'failed' && !EXT.on){
    // no person model: the whole frame stays as (graded) skin rather than an empty studio
    if (!MASK.fail){ MASK.fail = true; gl.bindTexture(gl.TEXTURE_2D, texMask); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 2, 2, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255, 255])); }

  gl.bindVertexArray(quadVao);
  gl.disable(gl.BLEND);

    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.bgF[dst]);
    gl.useProgram(P_BG.p); common(P_BG);
    tex(P_BG.u.uPrev, 0, src); tex(P_BG.u.uCam, 1, texCam); tex(P_BG.u.uMask, 2, texMask); gl.uniform1f(P_BG.u.uHasMask, hasMask);

  }

    fillUniforms();
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.fbo);
    gl.useProgram(P_PER.p); common(P_PER);
    tex(P_PER.u.uCam, 0, texCam); tex(P_PER.u.uMask, 1, texMask); tex(P_PER.u.uLat, 2, texLat);
    gl.uniform2fv(P_PER.u.uSeeds, U.seeds);
    gl.uniform4fv(P_PER.u.uSeg, U.seg); gl.uniform4fv(P_PER.u.uPar, U.par); gl.uniform4fv(P_PER.u.uPar2, U.par2);
    gl.uniform4fv(P_PER.u.uHead, U.head); gl.uniform4fv(P_PER.u.uHeadB, U.headB); gl.uniform4fv(P_PER.u.uHeadC, U.headC);
    gl.uniformMatrix3fv(P_PER.u.uHRot, false, U.hrot);
    gl.uniform1f(P_PER.u.uStrut, S.strut); gl.uniform1f(P_PER.u.uHasMask, hasMask); gl.uniform1i(P_PER.u.uMat, S.mat);

    else if (WIDE.on) scan = [wideY(), H * .012, 1, 1];
    gl.uniform4fv(P_PER.u.uScan, scan);

    gl.bindTexture(gl.TEXTURE_2D, FB.col); gl.generateMipmap(gl.TEXTURE_2D);
    gl.bindTexture(gl.TEXTURE_2D, FB.tr); gl.generateMipmap(gl.TEXTURE_2D);

  gl.useProgram(P_COMP.p); common(P_COMP);

  gl.uniform1i(P_COMP.u.uMat, S.mat); gl.uniform1i(P_COMP.u.uRoom, S.room ? 1 : 0);

function loop(now){
  requestAnimationFrame(loop);
  const dt = clamp((now - (lastT || now)) / 1000, 0, TEST.maxDt); lastT = now; frameN++;
  const rdt = clamp((now - (loop.lr || now)) / 1000, 0, 1); loop.lr = now;   // real time for the slow timers
  clock += rdt;
  resize();
  detect(now);
  MODE.t += rdt; micCool -= rdt;
  tickBudget = Math.min(tickBudget + rdt * 40, 14);
  // people: lost → gone (their timers and speeds go with them)
  for (let i = PEOPLE.length - 1; i >= 0; i--) if (now - PEOPLE[i].seen > 1100) PEOPLE.splice(i, 1);
  if (WIDE.on){
    WIDE.t += rdt;
    const y = wideY();
    for (const p of PEOPLE){
      for (const q of p.parts) if (q.kind && Math.max(q.a[1], q.b[1]) + q.rb < y && q.E < 1){ q.E = 1; q.acc = 0; q.hold = 3.2; }
      if (p.head.valid && p.head.c[1] + p.head.R * p.head.ys < y && p.head.E < 1){ p.head.E = 1; p.head.acc = 0; p.head.hold = 3.2; }
      // the shell bursts where the laser crosses the body
      WIDE.acc = (WIDE.acc || 0) + rdt * 70;
      while (WIDE.acc >= 1){ WIDE.acc -= 1; spawnAt(p, Math.random() * G.W, y - Math.random() * G.H * .02, now); }
    }
    if (WIDE.t >= WIDE.dur) WIDE.on = false;
  }
  // healing (real time) and chips
  for (const p of PEOPLE){
    for (let qi = 0; qi <= NPART; qi++){
      const q = qi < NPART ? p.parts[qi] : p.head;
      if (q.hold > 0) q.hold -= rdt;
      else { q.rest = q.v < .4 ? q.rest + rdt : 0; if (q.rest > 1.2) q.E = Math.max(0, q.E - S.heal * rdt); }
      if (!MODE.fx){ q.E = Math.max(0, q.E - rdt * .8); q.acc = 0; }
      let guard = 0;
      while (q.acc >= 1 && guard++ < 40){ q.acc -= 1; if ((q.kind || q.valid)) spawnChip(p, q, now); }
      if (q.acc > 1) q.acc = 0;
    }
  }
  // clap into the mic → full body
  if (S.clap && micAn && MODE.fx){
    micAn.getFloatTimeDomainData(micBuf);
    let e = 0; for (let i = 0; i < micBuf.length; i++) e += micBuf[i] * micBuf[i];
    e = Math.sqrt(e / micBuf.length);
    if (e > .08 && e > micPrev * 2.4 && micCool <= 0){ micCool = 1.2; wideOpen(); }
    micPrev = micPrev * .85 + e * .15;
  }
  stepChips(rdt);
  if (!glOK){ return; }
  render(now);
  if (wantShot){ wantShot = false; doShot(); }
}
