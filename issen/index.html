<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="映った人がオシロスコープの上で一本の光線に描き直される。線はそのまま音として鳴り、動くと残光が尾を引いて線がばねのように暴れる。タップで姿を焼き付け、撮影と録画ができる。">
<meta name="theme-color" content="#040506">
<title>ISSEN ─ 一本の光線で描かれる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  ISSEN 一線 ─ 一本の光線で描かれる                   ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  REFERENCE  オシロスコープ・ミュージック（XY モードのオシロに音を入れると
             絵が描かれる）と、テクトロニクスのベクター表示・蓄積管。
             アルヴァ・ノトや池田亮司のレコードジャケットの、黒い硝子に
             一本の燐光の線だけが走る画。
  MOOD       明かりの落ちた計測室。黒い硝子の奥で、たった一本の電子ビームが
             あなたの輪郭・顔の明暗の等高線・目・唇を一筆書きでなぞり続ける。
             ビームが飛び移るあいだの薄い糸まで見えている。その軌跡は
             左右のチャンネルの電圧としてそのまま鳴っている（L=X, R=Y）。
  PALETTE    硝子 #040506・目盛り 燐光色の 5%・文字 #dfe6ee
             P7   （既定）青白い閃光 #9cc2ff → 琥珀の残光 #ffc04a。蓄積は朱 #ff6b1a
             P31  緑 #4dff88（白く飽和する芯）。蓄積は青緑 #29b8ff
             P4   白 #e8eef7。蓄積は淡い青
             色はどれも二色まで。蓄積（STORE）は均一に光る一色で、生きた線と区別する。
  TYPE       Martian Mono 200/400（細い等幅の計器文字）＋ M PLUS 1 Code 300（和文）。
  MOTION     止まっていれば線は細く静か。動いたところは偏向アンプが追いつかず
             線がばねのように行き過ぎて輪とうねりになり、残光が数秒尾を引く。
             切り替えは、カメラの像が横一本の線へ潰れ、点になり、その点が
             ほどけてあなたを描きはじめる（ブラウン管の電源）。
  SEE-THROUGH（2026-10-11 オーナーの依頼）⚙「実写の透け」で線の後ろにカメラ映像を薄く透かせる。
             「背景だけ」なら人物マスクの外だけが透け、自分は暗い硝子と線のまま。既定は 0。
  SIGNATURE  見えている線と鳴っている音が同じもの。声を出すと（任意）
             その波形で輪郭が震える。
  LAYERS     ① 輪郭＋明暗の等高線＋目・虹彩・眉・唇・鼻・顎の線を一筆書きに
             ② 燐光：速い閃光と遅い残光の二層、P31 / P7 / P4
             ③ 偏向の行き過ぎ：速く動いた部分だけ線が輪を描いて暴れる
             ④ 音＝線：ステレオの XY 信号。高さ・音量。声で線を揺らす
             ⑤ 蓄積管：タップで今の姿を焼き付けて重ね、ERASE の閃光で消す
             ⑥ 電源の切り替え：像→線→点→ビームがほどけてあなたになる
  TECH       WebGL2。ビームの各区間を、太さσのガウス光点が線分上を等速で
             動いたときの露光（erf の差）として加算し、半精度のバッファに
             二つの時定数で減衰させる。人物マスクと明るさから marching squares
             で等値線を取り、貪欲法で一筆に並べ、時間等間隔に標本化して
             二次の偏向系に通す。同じ点列を AudioWorklet が一周ごとに鳴らす。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>
:root{--bg:#040506;--fg:#dfe6ee;--dim:rgba(223,230,238,.5);--line:rgba(223,230,238,.18);--acc:#ffc04a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
  font-family:"M PLUS 1 Code","Hiragino Sans","Noto Sans JP",monospace;font-weight:300}

  background:rgba(4,6,5,.84);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px;

.chips{display:flex;border:1px solid var(--line)}

  letter-spacing:.2em;cursor:pointer;opacity:.5}

  font:400 9.5px "Martian Mono",monospace;letter-spacing:.42em;padding:13px 20px 13px 26px;cursor:pointer;

<body>
<canvas id="gl"></canvas>

</div>

<div id="panel" class="hide">
  <div class="chips" id="phos">

  </div>
  <label><span>等高線</span><input type="range" id="sLevels" min="0" max="4" step="1" value="2"></label>

</div>

<div id="start">
  <div class="t">X–Y VECTOR PORTRAIT</div>
  <h1>ISSEN</h1>
  <div class="beam"></div>
  <p>まずは、いつものカメラ。<br>ボタンを押すと、あなたは一本の光の線になる。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   ISSEN — the person redrawn by one oscilloscope beam.
   CPU: mask + luminance → marching-squares chains → one greedy stroke →
   equal-time samples → 2nd-order deflection (rings where you move).
   GPU: every beam step is a Gaussian spot swept along a segment (erf),
   added into a half-float phosphor with a fast and a slow decay.
   Audio: the very same samples, looped as stereo X/Y.
   ===================================================================== */
const VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM_URL   = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const SEG_MODEL  = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), est = $('est');
const ectx = est.getContext('2d', { willReadFrequently:true });

const PHOS = [
  { name:'P7',  fast:[.62,.80,1.25], slow:[1.05,.70,.16], store:[1.0,.42,.10], grat:[.55,.70,1.0], tauF:.03,  tauS:[.35,3.2], css:'#ffc04a' },
  { name:'P31', fast:[.30,1.15,.50], slow:[.26,1.0,.44], store:[.16,.72,1.0], grat:[.30,1.0,.55], tauF:.035, tauS:[.12,1.4], css:'#4dff88' },
  { name:'P4',  fast:[.95,1.0,1.1],  slow:[.80,.86,.95],  store:[.55,.70,1.0], grat:[.85,.9,1.0],  tauF:.03,  tauS:[.06,.8],  css:'#e8eef7' },
];
const S = { see:0, seeBg:0, ph:0, levels:2, inten:.55, focus:.4, persist:.55, ring:.6, vol:.3, pitch:.35, face:true, grat:true, voice:false };

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS_Q = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
// one beam step: a Gaussian spot of width uSig moving at constant speed from a to b
const VS_SEG = `#version 300 es
in vec2 aC; in vec4 aS; in float aV;
uniform vec2 uRes; uniform float uSig;
out vec2 vP; out float vL; out float vV;
void main(){
  vec2 a = aS.xy, b = aS.zw, d = b - a; float L = length(d);
  vec2 t = L > 1e-4 ? d / L : vec2(1., 0.), n = vec2(-t.y, t.x);
  float R = uSig * 3.2;
  vec2 q = vec2(aC.x < 0. ? -R : L + R, aC.y * R);
  vec2 p = a + t * q.x + n * q.y;
  vP = q; vL = L; vV = aV;
  gl_Position = vec4(p.x / uRes.x * 2. - 1., 1. - p.y / uRes.y * 2., 0., 1.);
}`;
const FS_SEG = `#version 300 es
precision highp float;
in vec2 vP; in float vL; in float vV;
uniform float uSig; uniform vec4 uW; out vec4 o;
float erf_(float x){ float s = sign(x); x = abs(x); float t = 1. / (1. + .3275911 * x);
  float y = 1. - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * exp(-x * x);
  return s * y; }
void main(){
  float s = uSig, u = vP.x, v = vP.y, along;
  if (vL < .02 * s) along = vL / (s * 1.7724539) * exp(-u * u / (s * s));
  else along = .5 * (erf_(u / s) - erf_((u - vL) / s));
  float e = vV / (s * 1.7724539) * exp(-v * v / (s * s)) * along;
  o = uW * e;
}`;
const FS_MUL = `#version 300 es
precision mediump float; uniform vec4 uM; out vec4 o; void main(){ o = uM; }`;
const FS_BLUR = `#version 300 es
precision highp float;
uniform sampler2D uT; uniform vec2 uDir, uRes; out vec4 o;
void main(){
  vec2 s = gl_FragCoord.xy / uRes;
  vec4 c = texture(uT, s) * .1964825;
  c += (texture(uT, s + uDir * 1.411765) + texture(uT, s - uDir * 1.411765)) * .2969069;
  c += (texture(uT, s + uDir * 3.294118) + texture(uT, s - uDir * 3.294118)) * .0944703;
  c += (texture(uT, s + uDir * 5.176471) + texture(uT, s - uDir * 5.176471)) * .0103813;
  o = c;
}`;
const FS_COMP = `#version 300 es
precision highp float;
uniform sampler2D uP, uB, uB2, uV, uM;
uniform vec2 uRes, uVScale;
uniform vec3 uCF, uCS, uCT, uCG;
uniform float uCam, uQx, uQy, uGrat, uT, uFlash, uMirror, uScope, uBloom, uSee, uSeeBg;
out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
vec3 tone(vec3 x){ return 1. - exp(-max(x, 0.)); }
void main(){
  vec2 fc = gl_FragCoord.xy, s = fc / uRes;
  float sh = min(uRes.x, uRes.y);
  // ---- the scope: black glass, graticule, phosphor
  vec2 q = (fc - .5 * uRes) / sh;
  vec3 glass = vec3(.012, .017, .015) + vec3(.010, .013, .012) * smoothstep(.9, -.4, q.y + q.x * .4);
  glass *= 1. - .55 * smoothstep(.35, 1.05, length(q * vec2(.9, 1.)));
  vec4 P = texture(uP, s), B = texture(uB, s), B2 = texture(uB2, s);
  vec3 e = P.r * uCF + P.g * uCS;
  vec3 eb = B.r * uCF + B.g * uCS, eb2 = B2.r * uCF + B2.g * uCS;
  float st = smoothstep(.05, .3, P.b);
  vec3 col = glass;
  // the live camera seen faintly through the glass (optionally only the room, not you)
  if (uSee > 0.){
    vec2 vs = vec2(s.x, 1. - s.y);
    vec2 v = (vs - .5) * uVScale + .5; if (uMirror > .5) v.x = 1. - v.x;
    vec3 cv = texture(uV, v).rgb;
    float a = uSee * mix(1., 1. - smoothstep(.3, .7, texture(uM, vs).r), uSeeBg);
    col = mix(col, cv * .9 + glass, a);
  }
  // graticule: 1 cm squares anchored to the short edge, minor ticks on the axes
  if (uGrat > .0){
    float dv = sh / 8.;
    vec2 g = (fc - .5 * uRes) / dv;
    vec2 f = abs(fract(g + .5) - .5) * dv;
    float major = 1. - smoothstep(.35, 1.1, min(f.x, f.y));
    vec2 fm = abs(fract(g * 5. + .5) - .5) * dv / 5.;
    float tx = (1. - smoothstep(.35, 1.1, fm.x)) * (1. - smoothstep(dv * .06, dv * .06 + 1., abs(g.y * dv)));
    float ty = (1. - smoothstep(.35, 1.1, fm.y)) * (1. - smoothstep(dv * .06, dv * .06 + 1., abs(g.x * dv)));
    float edge = 1. - smoothstep(.62, .95, max(abs(q.x) / (uRes.x / sh * .5), abs(q.y) / (uRes.y / sh * .5)));
    col += uCG * (major * .045 + max(tx, ty) * .07) * uGrat * edge;
  }
  col += tone(e * 1.0 + eb * .55 * uBloom) + tone(eb2 * .32 * uBloom) * .8;
  col += tone(uCT * (st * 1.15 + B.b * .5 * uBloom + B2.b * .25 * uBloom));
  col += uCT * uFlash * (.75 + .25 * h21(floor(fc / 2.)));
  col += (h21(floor(fc / 1.5) + fract(uT * 7.13) * 91.7) - .5) * .02;
  col = mix(col * uScope, col, step(.999, uScope));
  // ---- the camera, squeezed into a line then a dot (CRT power)
  if (uCam > 0.){
    vec2 vs = vec2(s.x, 1. - s.y);
    vec2 c2 = (vs - .5) / vec2(max(uQx, 1e-4), max(uQy, 1e-4)) + .5;
    vec3 cc = vec3(0.);
    if (c2.x >= 0. && c2.x <= 1. && c2.y >= 0. && c2.y <= 1.){
      vec2 v = (c2 - .5) * uVScale + .5; if (uMirror > .5) v.x = 1. - v.x;
      cc = texture(uV, v).rgb;
      float k = 1. - uQy;
      cc = mix(cc, vec3(.9, .95, 1.), k * k) * (1. + 2.5 * k * k);
    }
    // the hot line / dot glows a little past its edges
    vec2 dd = (vs - .5) * uRes / sh;
    float hy = dd.y / max(uQy * uRes.y / sh * .5 + .004, .004);
    float halo = exp(-hy * hy) * step(abs(dd.x), uQx * uRes.x / sh * .5 + .01);
    cc += vec3(.75, .85, 1.) * halo * (1. - uQy) * .6;
    col = mix(col, cc, uCam);
  }

  const cc = camCurve(MODE.X);
  const reveal = Math.max(0, Math.min(1, (MODE.X - .56) / .9));
  const revE = reveal <= 0 ? 0 : 1 - Math.pow(1 - reveal, 3) * Math.cos(reveal * 7.5);   // unfolds with a little overshoot
  VIEW.cam = cc.cam; VIEW.qx = cc.qx; VIEW.qy = cc.qy; VIEW.reveal = reveal; VIEW.scope = MODE.X > .52 ? 1 : 0;
  if (fresh && (cc.cam > 0 || (S.see > 0 && MODE.X > .52))){
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){}
  }
  const scopeOn = MODE.X > .3, c0 = performance.now();
  if (scopeOn && fresh && grab()){ analyse(true); needStroke = true; }
  if (scopeOn && needStroke){
    needStroke = false;
    CH.n = 0; CH.np = 0;
    const live = (M.has && M.live) || segFailed;
    if (live && A.lumInit){
      if (!segFailed) march(A.mask, .5, null, 0);
      const nl = segFailed ? Math.max(2, S.levels) : S.levels, span = A.hi - A.lo;
      if (nl > 0 && A.cover > .004){
        for (let i = 0; i < A.w * A.h; i++) A.tmp[i] = (A.lum[i] - A.lo) / span;
        for (let l = 0; l < nl; l++) march(A.tmp, (l + 1) / (nl + 1), segFailed ? null : A.mask, 1);
      }
      smoothChains(0);
    }
    addFaceChains();
    buildStroke();
    if (!BEAM.n) idleDot(t);
  }
  if (scopeOn && !BEAM.n) idleDot(t);
  // voice
  let voice = null;
  if (MIC.on && MIC.an){
    MIC.an.getFloatTimeDomainData(MIC.buf);
    let rms = 0; for (let i = 0; i < MIC.buf.length; i += 4) rms += MIC.buf[i] * MIC.buf[i];
    rms = Math.sqrt(rms / (MIC.buf.length / 4));
    MIC.gain += (Math.min(1, rms * 9) - MIC.gain) * .3;
    voice = MIC.buf;
  }
  PERF.cpu = PERF.cpu * .8 + (performance.now() - c0) * .2;
  const n = scopeOn ? deflect(revE, voice && MIC.gain > .02 ? voice : null) : 0;
  if (scopeOn) sendAudio(n);
  if (beamGain) beamGain.gain.setTargetAtTime(scopeOn && reveal > 0 ? S.vol * .5 : 0, actx.currentTime, .08);
  const ph = PHOS[S.ph];
  if (MODE.X > .52){ phosphor(dt, ph, n, reveal); P_DIRTY = true; }
  else if (P_DIRTY){ for (const x of [FB.P, ...FB.B]){ gl.bindFramebuffer(gl.FRAMEBUFFER, x.f); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); } P_DIRTY = false; }
  composite(dt, t, ph, cc, W, H);
  $('hud').style.visibility = MODE.X > 1.2 ? 'visible' : 'hidden';
  hudT += dt;
  if (hudT > .3){ hudT = 0;
    $('hud').textContent = 'ISSEN  ' + ph.name + '  X–Y' +
      '\nBEAM ' + BEAM.n.toLocaleString('en-US') + ' PTS' +
      '\nLOOP ' + (SND.loopHz ? SND.loopHz.toFixed(1) : '—') + ' Hz' +
      '\nSTORE ' + String(STORE.count).padStart(2, '0'); }
}
let P_DIRTY = false;
function phosphor(dt, ph, n, reveal){
  const W = FB.w, H = FB.h;
  const dF = Math.exp(-dt / ph.tauF), tauS = ph.tauS[0] + (ph.tauS[1] - ph.tauS[0]) * S.persist * S.persist, dS = Math.exp(-dt / tauS);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.P.f); gl.viewport(0, 0, W, H);
  gl.bindVertexArray(vaoQuad);
  gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
  gl.useProgram(PMUL.p);
  const eraseNow = STORE.erasePending; STORE.erasePending = false;
  gl.uniform4f(PMUL.U.uM, dF, dS, eraseNow ? 0 : 1, 1); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (!HALF){ gl.blendEquation(gl.FUNC_REVERSE_SUBTRACT); gl.blendFunc(gl.ONE, gl.ONE); gl.uniform4f(PMUL.U.uM, 1.5 / 255, 1.5 / 255, 0, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.blendEquation(gl.FUNC_ADD); }
  let nseg = 0;
  if (n > 1 && reveal > 0){
    nseg = fillSegs(n, .35 + 1.3 * S.inten);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufSeg); gl.bufferSubData(gl.ARRAY_BUFFER, 0, SEGD, 0, nseg * 5);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(PSEG.p); gl.bindVertexArray(vaoSeg);
    gl.uniform2f(PSEG.U.uRes, W, H); gl.uniform1f(PSEG.U.uSig, scr.sig);
    // a steady picture lands at the same brightness whatever the persistence; the slow layer is what trails
    gl.uniform4f(PSEG.U.uW, (1 - dF) * 1.0, (1 - dS) * .9, 0, 0);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nseg);
    if (STORE.pending && MODE.X >= 1.5){
      STORE.pending = false; STORE.count++;
      gl.uniform4f(PSEG.U.uW, 0, 0, .8, 0);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nseg);
    }
  }
  gl.disable(gl.BLEND);
  // ---- bloom: 1/4 and 1/16 blurs
  gl.useProgram(PBLUR.p); gl.bindVertexArray(vaoQuad); gl.activeTexture(gl.TEXTURE0); gl.uniform1i(PBLUR.U.uT, 0);
  const blur = (src, dst, dx, dy) => {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.viewport(0, 0, dst.w, dst.h);
    gl.bindTexture(gl.TEXTURE_2D, src.t); gl.uniform2f(PBLUR.U.uRes, dst.w, dst.h); gl.uniform2f(PBLUR.U.uDir, dx / src.w, dy / src.h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
  const [b1, b2, b3, b4] = FB.B;
  blur(FB.P, b1, 2, 0); blur(b1, b2, 0, 1); blur(b2, b3, 1.5, 0); blur(b3, b4, 0, 1.5);
}
function composite(dt, t, ph, cc, W, H){
  const [, b2, , b4] = FB.B;
  STORE.flash = Math.max(0, STORE.flash - dt * 1.6);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(PCOMP.p); gl.bindVertexArray(vaoQuad);
  const U = PCOMP.U;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.P.t); gl.uniform1i(U.uP, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, b2.t); gl.uniform1i(U.uB, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, b4.t); gl.uniform1i(U.uB2, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texVid); gl.uniform1i(U.uV, 3);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, texMask); gl.uniform1i(U.uM, 4);
  gl.uniform1f(U.uSee, MODE.X > .52 ? S.see * Math.min(1, (MODE.X - .52) / .6) : 0); gl.uniform1f(U.uSeeBg, S.seeBg);
  const sa = W / H, va = vidW / vidH;
  gl.uniform2f(U.uRes, W, H); gl.uniform2f(U.uVScale, sa < va ? sa / va : 1, sa < va ? 1 : va / sa);
  gl.uniform3fv(U.uCF, ph.fast); gl.uniform3fv(U.uCS, ph.slow); gl.uniform3fv(U.uCT, ph.store); gl.uniform3fv(U.uCG, ph.grat);
  gl.uniform1f(U.uCam, cc.cam); gl.uniform1f(U.uQx, cc.qx); gl.uniform1f(U.uQy, cc.qy);
  gl.uniform1f(U.uGrat, S.grat ? Math.min(1, Math.max(0, (MODE.X - .6) / .6)) : 0);
  gl.uniform1f(U.uT, t); gl.uniform1f(U.uFlash, STORE.flash * STORE.flash * .9); gl.uniform1f(U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(U.uScope, MODE.X > .52 ? 1 : 0); gl.uniform1f(U.uBloom, 1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindVertexArray(null);
}
/* ---------- test hook (local verification harness) ---------- */
window.__ISSEN = {
  ingestMask(d, w, h){ if (!M.external) setStatus(''); M.external = true; return ingestMask(d, w, h); },
  ingestFaces(list){ FACE.external = true; return ingestFaces(list); },
  mode(c){ setMode(!!c); },
  hold(x){ HOLD.x = x == null ? null : +x; },
  store: () => doStore(), erase: () => doErase(),
  phosphor(i){ setPhos(i); },
  set(k, v){ S[k] = v; },
  view: () => ({ scope:MODE.scope, X:MODE.X, ...VIEW }),
  state: () => ({ hasMask:M.has, live:M.live, chains:CH.n, faceLines:FACE.n, beam:BEAM.n, ds:BEAM.ds, motion:A.motion, cover:A.cover,
    ringMax:RING.max, cpu:PERF.cpu, stored:STORE.count, half:HALF, bbox:bbox() }),
};
function bbox(){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let k = 0; k < BEAM.n; k++){ if (TX[k] < x0) x0 = TX[k]; if (TX[k] > x1) x1 = TX[k]; if (TY[k] < y0) y0 = TY[k]; if (TY[k] > y1) y1 = TY[k]; }
  return BEAM.n ? { x0:x0 / scr.W, y0:y0 / scr.H, x1:x1 / scr.W, y1:y1 / scr.H } : null;
}
