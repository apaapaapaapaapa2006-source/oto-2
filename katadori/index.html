<!--
  ══════════════════════════════════════════════════════════════════════════
  KATADORI 型取り ─ 顔が、生きている彫刻になる          ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       夜の美術館の一室。スポットの下に、自分の顔から型を取った白い面が
             浮かび、ゆっくり回って横顔を見せる。瞬きも口の動きもそのまま石膏
             に乗る。首を動かせば、その軌跡に型が一枚ずつ置かれていき、空間に
             マレーの連続写真やボッチョーニの彫刻のような「動きの彫刻」が立つ。
             速く振った軌跡の型は、置かれた瞬間に砕けて床へ崩れる。
  PALETTE    PLASTER 壁 #0b0b0c → 床 #1c1b1a ／ 石膏 #e9e4da ／ 内側 #4a4540
             CHROME  同じ部屋 ／ 鏡面に映るのは二灯のソフトボックスだけ
             BRONZE  同じ部屋 ／ 青銅 #6b4526 ／ 窪みに緑青 #3f6a58
             色を持つのは素材だけ。部屋は無彩色。
  TYPE       Tenor Sans（題字・ラベル）・Victor Mono 300（計器）。
  MOTION     カメラは 18 秒周期で左右に振れ、23 秒周期でわずかに俯く。
             型は動いた距離で置かれ、速さで寿命が決まる（遅い＝残る、速い＝砕ける）。
             崩れは三角形ごとの遅れ・回転・重力で、床で止まる。
  SIGNATURE  一人の人間の数秒間が、空間に並んだ白い面の列として見えること。
  TECH       FaceLandmarker の 478 点（3D）を MediaPipe の正準顔メッシュの
             898 三角形（Apache-2.0、canonical_face_model.obj）で張り、毎フレーム
             法線と窪み（ラプラシアン）を計算する。型は頂点を写し取った固定プール
             （32 枠）で、崩れは頂点シェーダの中だけで起こる。半透明は使わず
             スクリーンドア（ハッシュ discard）で消すので並べ替えが要らない。
             床の映り込みは鏡像を二度描き、背景は逆 VP 行列から床と壁を光線で
             解く。素のカメラ ⇄ 彫刻の切り替えは、走査線の上だけ顔が画面上の
             位置のまま石膏になり、そのあと視点がギャラリーへ回り込む。

$('mats').onclick = e => { const b = e.target.closest('button'); if (b) setMat(+b.dataset.m); };
[['sLife','life'],['sGap','gap'],['sOrbit','orbit'],['sGrain','grain']].forEach(([id,k]) => { $(id).oninput = e => { S[k] = +e.target.value; }; });

// drag = turn the view; a short tap = keep a cast
const DRAG = { on:false, x:0, y:0, t:0, moved:0, yaw:0, pitch:0 };
canvas.addEventListener('pointerdown', e => { DRAG.on = true; DRAG.x = e.clientX; DRAG.y = e.clientY; DRAG.t = performance.now(); DRAG.moved = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!DRAG.on) return;
  const dx = e.clientX - DRAG.x, dy = e.clientY - DRAG.y; DRAG.x = e.clientX; DRAG.y = e.clientY; DRAG.moved += Math.abs(dx) + Math.abs(dy);
  const k = 3 / Math.min(innerWidth, innerHeight);
  DRAG.yaw = Math.max(-1.3, Math.min(1.3, DRAG.yaw - dx*k)); DRAG.pitch = Math.max(-.35, Math.min(.6, DRAG.pitch + dy*k*.6)); });
canvas.addEventListener('pointerup', () => { if (!DRAG.on) return; DRAG.on = false;
  if (DRAG.moved < 10 && performance.now() - DRAG.t < 450){ ensureAudio(); wantPin = true; } });

$('shoot').onclick = () => {
  click();
  try{ canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'katadori-' + Date.now() + '.png'; a.click(); }, 'image/png'); }
  catch(e){ setStatus('保存できませんでした。'); }
};
let rec = null, chunks = [];
$('rec').onclick = () => {
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try{
    ensureAudio();
    const tracks = [...canvas.captureStream(30).getVideoTracks()];
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    const mime = ['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType:mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      $('rec').classList.remove('on'); $('rec').textContent = '● REC';
      const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type:rec.mimeType || 'video/webm' }));
      a.download = 'katadori.' + ext; a.click();
    };
    rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ STOP';
  }catch(e){ setStatus('録画を開始できませんでした。'); }
};

/* ---------- render ---------- */
const VIEW = new Float32Array(16), PROJ = new Float32Array(16), VP = new Float32Array(16), IVP = new Float32Array(16);
const EYE = [0, 0, 5], TGT = [0, 0, 0], UP = [0, 1, 0];
let lastT = 0, hudT = 0;
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
function drawMesh(slot, alpha, crumble, dust, reflect, k){
  const U = PM.U;
  gl.uniform1f(U.uAlpha, alpha); gl.uniform1f(U.uCrumble, crumble); gl.uniform1f(U.uDust, dust);
  gl.uniform1f(U.uReflect, reflect); gl.uniform1f(U.uK, k);
  gl.bindVertexArray(SLOT[slot].vao); gl.drawArrays(gl.TRIANGLES, 0, NC);
}
function loop(now){
  requestAnimationFrame(loop);
  const dtw = lastT ? Math.min(.5, (now - lastT)/1000) : 1/60, dt = Math.min(.1, dtw); lastT = now;
  const t = now/1000;
  if (video.videoWidth){ vidW = video.videoWidth; vidH = video.videoHeight; }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let Wd = Math.round(innerWidth*dpr), Hd = Math.round(innerHeight*dpr);
  const kk = Math.min(1, 1600 / Math.max(Wd, Hd)); Wd = Math.round(Wd*kk); Hd = Math.round(Hd*kk);
  if (canvas.width !== Wd || canvas.height !== Hd){ canvas.width = Wd; canvas.height = Hd; }
  asp = Wd/Hd; const va = vidW/vidH; scX = asp < va ? asp/va : 1; scY = asp < va ? 1 : va/asp;
  ensureScene(Wd, Hd);
  if (!EXT) track(now);
  if (video.readyState < 2) return;

  // mode: entering = scan down (1.1 s) then the view swings out to the gallery (1.6 s); leaving = scan up
  const el = (now - MODE.t0) / 1000;
  if (MODE.on){
    MODE.fx = true;
    MODE.scan = el < 1.1 ? ease(Math.min(1, el/1.1)) : 1;
    MODE.k = el < 1.1 ? 0 : ease(Math.min(1, (el - 1.1)/1.6));
  } else {
    if (el < .9){ MODE.scan = 1 - ease(el/.9); MODE.fx = MODE.scan > 0; MODE.k = 1; }
    else { MODE.scan = 0; MODE.fx = false; MODE.k = 0; }
  }

  // camera: an orbit around the slowly-following pivot
  const dist = 5.3 * Math.max(1, .78/asp);
  if (!DRAG.on){ DRAG.yaw *= Math.exp(-dt*.35); DRAG.pitch *= Math.exp(-dt*.35); }
  const yaw = S.orbit * .62 * Math.sin(t * 2*Math.PI / 18) + DRAG.yaw;
  const pitch = .1 + .07 * Math.sin(t * 2*Math.PI / 23) * S.orbit + DRAG.pitch;
  TGT[0] = W.px; TGT[1] = W.py - (asp > 1 ? .32 : .5); TGT[2] = 0;
  EYE[0] = TGT[0] + Math.sin(yaw)*Math.cos(pitch)*dist; EYE[1] = TGT[1] + Math.sin(pitch)*dist; EYE[2] = Math.cos(yaw)*Math.cos(pitch)*dist;
  M4.persp(PROJ, 30*Math.PI/180, asp, .05, 60); M4.look(VIEW, EYE, TGT, UP); M4.mul(VP, PROJ, VIEW); M4.inv(IVP, VP);

  // casts age; expired ones crumble; crumbled ones free their slot
  let live = 0;
  for (const c of CASTS){
    if (!c.on) continue;
    const age = (now - c.born)/1000;
    if (c.crumble === 0 && !c.pinned && age > c.life){ c.crumble = 1e-4; if (c.life > 1.2) crack(.35); }
    if (c.crumble > 0){ c.crumble += dtw; if (c.crumble > 2.6){ c.on = false; crumbled++; continue; } }   // wall time: shards fall at the same speed on a slow device
    c.dust = c.pinned ? 0 : Math.min(1, age / Math.max(.5, c.life));
    live++;
  }
  for (const F of FACES){ const show = F.ok; F.alpha += ((show ? 1 : 0) - F.alpha) * (1 - Math.exp(-dt*(show ? 6 : 3))); }

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){ return; }

  if (MODE.fx){
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFB); gl.viewport(0, 0, Wd, Hd);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(PB.p); gl.bindVertexArray(quadVAO);
    gl.uniformMatrix4fv(PB.U.uInvVP, false, IVP); gl.uniform3fv(PB.U.uEye, EYE); gl.uniform1f(PB.U.uFloor, W.floor);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
    gl.useProgram(PM.p); const U = PM.U;
    gl.uniformMatrix4fv(U.uVP, false, VP); gl.uniform3fv(U.uEye, EYE); gl.uniform1i(U.uMat, S.mat);
    gl.uniform1f(U.uFloor, W.floor); gl.uniform1f(U.uT, t); gl.uniform1f(U.uScanY, (1 - MODE.scan) * Hd);
    for (let pass = 0; pass < 2; pass++){                  // 0: the reflection in the floor, 1: the pieces
      gl.clear(gl.DEPTH_BUFFER_BIT);
      const refl = pass === 0 ? 1 : 0;
      if (refl && MODE.k < .5) continue;
      if (refl){ gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); } else gl.disable(gl.BLEND);
      for (const c of CASTS) if (c.on) drawMesh(c.slot, 1, c.crumble, c.dust, refl, 1);
      for (const F of FACES) if (F.alpha > .01) drawMesh(F.slot, F.alpha, 0, 0, refl, refl ? 1 : MODE.k);
    }
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, Wd, Hd);
  gl.useProgram(PP.p); gl.bindVertexArray(quadVAO);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(PP.U.uVid, 0); gl.uniform1i(PP.U.uScene, 1);
  gl.uniform2f(PP.U.uScale, scX, scY); gl.uniform2f(PP.U.uRes, Wd, Hd); gl.uniform1f(PP.U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(PP.U.uScan, MODE.fx ? MODE.scan : 0); gl.uniform1f(PP.U.uGrain, S.grain); gl.uniform1f(PP.U.uT, t); gl.uniform1f(PP.U.uFx, MODE.fx ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  hudT += dt;
  if (hudT > .25){ hudT = 0;
    $('hud').textContent = 'KATADORI\n' + (MODE.fx ? MATS[S.mat] + '  ·  ' + live + ' CASTS' + (pinnedCount ? '  ·  ' + pinnedCount + ' KEPT' : '') : 'CAMERA');
    let st = '';
    if (modelState === 'fail' && !EXT) st = '顔の検出モデルを読み込めませんでした（ネット接続を確認）。';
    else if (MODE.fx && !FACES[0].ok && (modelState === 'ok' || EXT)) st = '顔をカメラに向けてください。';
    if ($('status').textContent !== st && !$('status').textContent.startsWith('カメラを起動')) setStatus(st);
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__KATADORI = {
  external(){ EXT = true; },
  face(list, tMs){ EXT = true; onFaces(list, tMs); },
  mode(on){ setMode(!!on); },
  material(i){ setMat(i); },
  palette(i){ setMat(i); },
  tap(){ wantPin = true; },
  clear(){ crumbleAll(); },
  view(yaw, pitch){ DRAG.yaw = yaw; DRAG.pitch = pitch || 0; },
  state: () => ({ faces:FACES.map(F => ({ ok:F.ok, speed:F.speed, alpha:F.alpha })), world:{ ...W },
                  casts:CASTS.filter(c => c.on).length, crumbling:CASTS.filter(c => c.on && c.crumble > 0).length,
                  pinned:pinnedCount, made:castsMade, fx:MODE.fx, k:MODE.k }),
};
</script>
</body>
</html>
