<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="動くと、その場に真っ赤な残像が置いていかれる。残像は少しのあいだ留まり、点の格子に崩れて、赤い球になって落ちて消える。タップで色が変わる。">
<meta name="theme-color" content="#000000">
<title>TAMAYURA ─ 赤い残像が球になる</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  TAMAYURA 玉響 ─ 赤い残像が球になる                   ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD       暗い舞台。いまの自分だけが白く照らされ、動いたぶんだけ、
             ついさっきの自分が真紅の影としてその場に置いていかれる。
             影は少しのあいだ留まり、網点の格子に崩れ、点がふくらんで
             球になり、こぼれて床に転がり、消える。玉響（たまゆら）は
             玉が触れあうほどのかすかな間 ── 残像が残っている時間のこと。
  PALETTE    闇 #000 ／ 舞台の床 ほぼ黒の灰 ／ いまの自分 漆喰の白 #ecebe6
             残像 深紅 #4a0006 → 真紅 #ff1a12 → 桃 #ff6f7c → 灰 #b8b0b0
             はじめは赤一系統。画面をタップすると一系統ずつ色が替わる
             （赤→橙→金→翠→青→紫→桃→白→赤）。いつも白と黒と一色だけ。
  TYPE       Cormorant Garamond（題字・数字）と Zen Kaku Gothic New。
  MOTION     残像は置かれた場所から一歩も動かない。動くのは崩れて
             球になってから。球は一部が落ちて床で跳ね、一部は宙に漂う。
             フラッシュも揺れも使わない。
  SIGNATURE  自分の輪郭をした赤い影が、網点を経て、球の群れにほどけること。
  TECH       人物マスクは MediaPipe ImageSegmenter（読めなければ背景差分）。
             残像は RG8 の 2D テクスチャ配列（R=マスク・G=その瞬間の明るさ）
             に最大 14 枚積み、全画面一回のパスで古い順に重ねる。
             残像を置くかどうかは時間ではなく「前の残像からどれだけ
             形が変わったか」で決めるので、止まっていれば増えない。
             球は CPU の固定プール（6000）で動かし、点スプライト一回で
             描く。陰影は点の中で球の法線を復元して計算する。
  ══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#ecebe6;--dim:rgba(236,235,230,.52);--line:rgba(236,235,230,.2);--acc:#ff1a12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--fg);
  font-family:"Zen Kaku Gothic New",ui-sans-serif,"Hiragino Sans",system-ui,sans-serif;font-weight:400}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#work{display:none}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:28px;text-align:center;background:#000}
#start .t{font-size:10px;letter-spacing:.55em;margin-right:-.55em;color:var(--dim)}
#start h1{margin:0;font-family:"Cormorant Garamond",serif;font-weight:300;font-size:min(15vw,96px);line-height:1;letter-spacing:.14em;margin-right:-.14em}

  font:500 11px "Cormorant Garamond",serif;letter-spacing:.5em;padding:14px 30px 14px 36px;cursor:pointer;transition:border-color .3s}

  color:var(--dim);pointer-events:none;max-width:78vw;line-height:1.7;white-space:pre-line}

#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 78px);z-index:12;width:min(272px,calc(100vw - 20px));
  background:rgba(0,0,0,.84);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:13px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .25s}

  font:500 10px "Zen Kaku Gothic New",sans-serif;letter-spacing:.2em;cursor:pointer;opacity:.5}

  appearance:none;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--fg);
  font:500 11px "Cormorant Garamond",serif;letter-spacing:.42em;padding:12px 22px 12px 28px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .3s}

body.cam #mode{border-color:rgba(255,255,255,.6);color:#fff;background:rgba(0,0,0,.3)}

body.cam #bar #shoot{border-color:#fff}
body.cam #hud, body.cam #burst{visibility:hidden}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="work"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="status"></div>
<button id="gear" class="btn" aria-label="調整">⚙</button>
<button id="flip" class="btn">⟲ カメラ</button>
<button id="mode">▸ TAMAYURA</button>
<div id="bar">
  <button id="rec" class="btn">● REC</button>
  <button id="shoot" class="btn" aria-label="撮る"></button>
  <button id="burst" class="btn">散らす</button>
</div>

<div id="panel" class="hide">
  <div class="chips" id="stage">
    <button data-s="0" class="on">舞台</button>
    <button data-s="1">闇</button>
  </div>
  <label><span>残る長さ</span><input type="range" id="sLife" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>残像の多さ</span><input type="range" id="sRate" min="0" max="1" step="0.01" value="0.55"></label>
  <label><span>球の量</span><input type="range" id="sBalls" min="0" max="1" step="0.01" value="0.42"></label>
  <label><span>球の大きさ</span><input type="range" id="sSize" min="0" max="1" step="0.01" value="0.5"></label>
  <label><span>落ちる</span><input type="range" id="sFall" min="0" max="1" step="0.01" value="0.6"></label>
  <div class="note">動いたぶんだけ残像が置かれ、止まっていれば増えない。<br>画面をタップ：色が替わる。<br>散らす：いまある残像を一度に球にする。</div>
</div>

<div id="start">
  <div class="t">AFTERIMAGE / RED SPHERES</div>
  <h1>TAMA<i>Y</i>URA</h1>
  <p>まずは、いつものカメラ。<br>ボタンを押すと舞台が暗くなり、あなただけが白く残ります。<br>動くと、その場に赤い残像が置いていかれ、<br>少し留まってから、球になって消えていきます。<br>画面をタップすると色が替わります。</p>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script>
'use strict';
/* =====================================================================
   TAMAYURA — each afterimage is a snapshot of the person mask plus the
   brightness under it, stacked in a texture array and never moved. It
   ages through three states in one shader: solid red, a wavy dot lattice
   that thins and cools toward ash, and — handed to the CPU at a fixed
   age — a burst of shaded spheres that fall or hang and then fade.
   ===================================================================== */
const MP_VER   = '0.10.21';
const MP_BASE  = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL_URL= 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('cam'), work = $('work');
const wctx = work.getContext('2d', { willReadFrequently:true });
const S = { stage:0, life:.55, rate:.55, balls:.42, size:.5, fall:.6 };

const NG = 14;                 // afterimages alive at once
const SOLID = .55;             // fraction of a life spent as a solid red shape
const BALL_AT = .62;           // age at which the lattice starts turning into balls
const MAXB = 6000;             // sphere pool

/* ---------- GL ---------- */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

const MAP = `
uniform vec2 uScale; uniform float uMirror;
vec2 toVid(vec2 s){
  vec2 v = (vec2(s.x, 1.-s.y) - .5) * uScale + .5;
  if (uMirror > .5) v.x = 1.-v.x;
  return v;
}`;

// pass A: the dark stage and every afterimage, oldest first
const FS_STAGE = `#version 300 es
precision highp float; precision highp sampler2DArray;
in vec2 uv; out vec4 o;
uniform sampler2D uVid;
uniform sampler2DArray uG;
uniform vec2 uRes;
uniform float uStage, uRev, uCell, uT, uPass;
uniform int uN;
uniform float uLay[${NG}], uAge[${NG}];
uniform vec3 uRed, uPink;          // the current colour: main, and the paler tone the lattice cools through
const vec3 LW = vec3(.2126,.7152,.0722);
const vec3 ASH = vec3(.72,.69,.69);
${MAP}
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
void main(){
  vec2 v = toVid(uv);
  float l = dot(texture(uVid, v).rgb, LW);
  // the room is still there, only just: a stage with the house lights down
  // Two passes over the same afterimages. Pass 0 is the stage and the
  // copies that have already broken into dots; pass 1 is the copies that
  // are still solid, drawn after the spheres. Spheres come out of OLD
  // copies, so the young solid ones belong in front of them — drawn in one
  // pass, the ball cloud buried the very afterimage the piece is about.
  vec3 c = uPass < .5 ? vec3(l * l) * .30 * (1. - uStage) : vec3(0.);
  float alpha = uPass < .5 ? 1. : 0.;
  vec2 fc = gl_FragCoord.xy;
  for (int k = 0; k < ${NG}; k++){
    if (k >= uN) break;
    float lay = uLay[k], a = uAge[k];
    if (uPass > .5 && a < ${SOLID.toFixed(2)} + .03){
      vec2 g = texture(uG, vec3(v, lay)).rg;
      float m = smoothstep(.38, .62, g.r) * smoothstep(0., .035, a);
      // Shaded by the light that was on you at that instant, so the copy
      // keeps its folds — but only within a band of red. Mapping all of the
      // brightness sank dark clothes to near-black maroon; the copy has to
      // read as red whatever you were wearing.
      float sh = smoothstep(.02, .7, g.g);
      vec3 red = uRed * (.62 + .38 * sh) + (uPink - uRed * .5) * .22 * sh * sh;
      float w = 1. - smoothstep(${SOLID.toFixed(2)} - .05, ${SOLID.toFixed(2)} + .03, a);
      c = mix(c, red, m * w);
      alpha = max(alpha, m * w);
    }
    if (uPass < .5 && a > ${SOLID.toFixed(2)} - .05){
      float t = clamp((a - ${SOLID.toFixed(2)}) / (1. - ${SOLID.toFixed(2)}), 0., 1.);
      // a lattice that is not quite square: rows ripple, which is what
      // makes the moire in the reference instead of a clean halftone
      vec2 q = fc + vec2(sin(fc.y * .052 + lay * 1.7 + a * 5.) * uCell * .32,
                         sin(fc.x * .041 + lay) * uCell * .18);
      vec2 id = floor(q / uCell);
      vec2 cen = fc + ((id + .5) * uCell - q);
      vec2 g = texture(uG, vec3(toVid(cen / uRes), lay)).rg;
      float keep = step(h21(id + lay * 17.3), 1. - t * t * .93);
      float rad = mix(.47, .15, t) * (.6 + .4 * g.g);
      float d = length(fract(q / uCell) - .5);
      float dotA = smoothstep(rad, rad - .13, d) * step(.5, g.r) * keep;
      vec3 dc = t < .45 ? mix(uRed, uPink, t / .45) : mix(uPink, ASH, (t - .45) / .55);
      float w = smoothstep(${SOLID.toFixed(2)} - .05, ${SOLID.toFixed(2)} + .03, a) * (1. - smoothstep(.62, 1., t));
      c = mix(c, dc * (.72 + .28 * g.g), dotA * w);
    }
  }
  float rv = smoothstep(0., .4, uRev);
  o = uPass < .5 ? vec4(c * rv, 1.) : vec4(c * alpha * rv, alpha * rv);
}`;

// pass B: spheres as point sprites, shaded by reconstructing the normal
const VS_BALL = `#version 300 es
in vec2 aPos; in vec2 aSz; in float aTone;
uniform vec2 uRes;
out float vA; out float vTone;
void main(){
  gl_Position = vec4(aPos / uRes * 2. - 1., 0., 1.);
  gl_PointSize = aSz.x * 2.;
  vA = aSz.y; vTone = aTone;
}`;
const FS_BALL = `#version 300 es
precision mediump float;
uniform vec3 uCol;
in float vA; in float vTone; out vec4 o;
void main(){
  vec2 p = gl_PointCoord * 2. - 1.; p.y = -p.y;
  float d2 = dot(p, p);
  if (d2 > 1.) discard;
  vec3 n = vec3(p, sqrt(1. - d2));
  vec3 L = normalize(vec3(-.45, .62, .64));
  float diff = max(dot(n, L), 0.);
  float spec = pow(max(dot(reflect(-L, n), vec3(0., 0., 1.)), 0.), 26.);
  vec3 base = mix(uCol * .42, uCol, vTone);
  vec3 c = base * (.16 + .95 * diff) + mix(vec3(1.), uCol, .2) * spec * .55;
  c *= .78 + .22 * smoothstep(0., .5, n.z);          // a darker limb, so it is a ball and not a disc
  float a = vA * smoothstep(1., .86, d2);
  o = vec4(c * a, a);
}`;

// pass C: the person, white as plaster, in front of everything
const FS_ME = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uVid, uMask;
uniform float uRev;
${MAP}
const vec3 LW = vec3(.2126,.7152,.0722);
void main(){
  vec2 v = toVid(uv);
  float l = dot(texture(uVid, v).rgb, LW);
  float m = smoothstep(.40, .66, texture(uMask, v).r) * uRev;
  vec3 c = vec3(.93, .92, .89) * (.44 + .64 * pow(l, .6));
  o = vec4(c * m, m);
}`;

const FS_CAM = `#version 300 es
precision mediump float;
in vec2 uv; out vec4 o;
uniform sampler2D uVid; uniform float uA;
${MAP}
void main(){ o = vec4(texture(uVid, toVid(uv)).rgb * uA, 1.); }`;

function sh(t, src){ const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs, attrs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  (attrs || ['p']).forEach((a, i) => gl.bindAttribLocation(p, i, a)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const u = gl.getActiveUniform(p, i); U[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, U }; }
function tex(filter){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }

let PA, PB, PC, PK, quad, vaoQ, vaoB, ballBuf, texVid, texMask, texG = null, pointMax = 64;
function initGL(){
  PA = prog(VS, FS_STAGE); PC = prog(VS, FS_ME); PK = prog(VS, FS_CAM);
  PB = prog(VS_BALL, FS_BALL, ['aPos', 'aSz', 'aTone']);
  vaoQ = gl.createVertexArray(); gl.bindVertexArray(vaoQ);
  quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  vaoB = gl.createVertexArray(); gl.bindVertexArray(vaoB);
  ballBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ballBuf);
  gl.bufferData(gl.ARRAY_BUFFER, MAXB * 5 * 4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 20, 16);
  gl.bindVertexArray(null);
  texVid = tex(gl.LINEAR); texMask = tex(gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  const r = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE); if (r && r[1]) pointMax = r[1];
}

/* ---------- masks and afterimages ---------- */
let MW = 0, MH = 0, u8 = null, luma = null, rg = null;
const G = [];                               // afterimage slots
for (let i = 0; i < NG; i++) G.push({ on:false, born:0, spawned:false, mask:null, lum:null });
let lastGhost = null, lastGhostT = 0, ghostCount = 0;
function allocMasks(w, h){
  if (w === MW && h === MH) return;
  MW = w; MH = h; work.width = w; work.height = h;
  u8 = new Uint8Array(w*h); luma = new Uint8Array(w*h); rg = new Uint8Array(w*h*2);
  for (const g of G){ g.on = false; g.mask = new Uint8Array(w*h); g.lum = new Uint8Array(w*h); }
  lastGhost = new Uint8Array(w*h);
  if (texG) gl.deleteTexture(texG);
  texG = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texG);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG8, w, h, NG);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, u8);
}
function dimsFor(w, h){ const s = 256; return w < h ? [s, Math.round(s*h/w)] : [Math.round(s*w/h), s]; }
function lifeSec(){ return 1.4 + S.life * 3.4; }

// how different the current shape is from the last afterimage we left
function changeSinceLast(){
  let area = 0, diff = 0;
  for (let i = 0, n = MW*MH; i < n; i += 3){
    const a = u8[i] > 127, b = lastGhost[i] > 127;
    if (a) area++;
    if (a !== b) diff++;
  }

/* ---------- segmentation (with a background-difference fallback) ---------- */

function setStatus(t){ $('status').textContent = t || ''; }

    const mod = await import(`${MP_BASE}/vision_bundle.mjs`);
    const fileset = await mod.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const make = delegate => mod.ImageSegmenter.createFromOptions(fileset, {

    gl.useProgram(PB.p); gl.uniform2f(PB.U.uRes, W, H); gl.uniform3fv(PB.U.uCol, CUR.c);
    gl.bindVertexArray(vaoB); gl.bindBuffer(gl.ARRAY_BUFFER, ballBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, B.out, 0, B.n * 5);
    gl.drawArrays(gl.POINTS, 0, B.n);
  }

  // A': the copies that are still solid, in front of the spheres
  if (lay.length){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PA.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texG);
    gl.uniform1f(PA.U.uPass, 1);
    quadDraw();
  }

  // C: you, in front of all of it
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(PC.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.uniform1i(PC.U.uVid, 0); gl.uniform1i(PC.U.uMask, 1);
  gl.uniform2f(PC.U.uScale, scaleX, scaleY); gl.uniform1f(PC.U.uMirror, mirror ? 1 : 0);
  gl.uniform1f(PC.U.uRev, MODE.reveal);
  quadDraw();
  gl.disable(gl.BLEND);

  if (++hudT > 12){
    hudT = 0;
    $('hud').innerHTML = 'TAMAYURA  ' + STAT.mode + '  ' + COLS[colI].en + '\n残像 ' + String(lay.length).padStart(2, '0') +
      '\n球   ' + String(B.n).padStart(4, '0');
  }
}

/* ---------- test hook (used by the local verification harness) ---------- */
window.__TAMAYURA = {
  state: () => ({ mw:MW, mh:MH, ghosts:G.filter(g => g.on).length, laid:ghostCount, balls:B.n, spawned:spawnedTotal,
                  area:STAT.area, change:STAT.change, mode:STAT.mode, reveal:MODE.reveal, on:MODE.on, pointMax }),
  mode(m){ setMode(!!m); }, burst: burstAll, colour(i){ setColour(i); }, colourIndex: () => colI,
  set(k, v){ if (k in S) S[k] = v; },
  ballsY: () => Array.from(B.y.subarray(0, B.n)),
};
</script>
