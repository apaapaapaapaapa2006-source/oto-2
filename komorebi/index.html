<title>KOMOREBI ─ 葉のすきまが太陽を映す</title>
<meta name="description" content="カメラに映るものが木の下の地面になり、千四百の木漏れ日が揺れながら落ちる。木漏れ日の丸は葉の形ではなく太陽の形で、葉のすきま一つ一つがピンホールになっている。だから両腕を高く掲げて日食を起こすと、地面の光がすべて三日月になる。手を速く振れば風、葉むらを払えば葉が落ちて明るい穴が残り、ゆっくりと葉が戻る。">
<meta name="theme-color" content="#5b7a52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<!--
  ══════════════════════════════════════════════════════════════════════════
  KOMOREBI 木漏れ日 ─ 葉のすきまが太陽を映す        ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  MOOD      Lying on the ground under a big tree in early summer. The
            camera is the ground; everything on it is lit by a canopy
            you never see. Green shade, gold spots, and the spots move
            with a wind you can make. It is a sunny piece — the second
            bright one tonight, after CHIDORI's dawn, and deliberately
            warmer and greener than that cold sky.

  PALETTE   木漏れ日 komorebi #f4d78a  the light. Every dapple is this,
                                       and only the dapples are this.
            若草   wakakusa #5b7a52  the shade the whole frame is
                                       multiplied into. Green, not grey —
                                       the shadow of leaves is green.
            深緑   fukamidori #274430 type and rules.
            生成   kinari   #f5efdf  panels.
            藍鼠   ainezu   #46506b  RESERVED for the eclipse: the shade
                                       goes cold and blue when the sun
                                       is covered, exactly as it does.

  BACKGROUND  The camera itself, always, multiplied by a light map that
              is never flat: ambient shade plus ~1400 sun images.

  TYPE      Kaisei Tokumin for the title and labels — a warm, slightly
            old-fashioned mincho that suits a summer afternoon. Fraunces
            (optical size axis, italic 300 for the mode names) for the
            Latin and numerals: soft, a little sun-bleached.

  MOTION    SWAY. Nothing here moves on a straight line. Every dapple
            rides its leaf cluster, every cluster sways on two summed
            sines whose speed follows the wind, and the wind itself is a
            gust that decays over seconds. The eclipse is the exception:
            two seconds of steady darkening, a 90 ms flash at totality,
            and six slow seconds back.

  SIGNATURE 丸いのは葉ではなく、太陽。 Each gap in a canopy is a pinhole,
            so every dapple on the ground is an image of the sun — round
            at noon, elongated at dawn — and during an eclipse every one
            of them becomes a crescent. The piece renders that literally:
            one sun sprite is computed per frame as disc ∩ ¬moon, and
            stamped 1400 times. Raise both arms and the whole floor turns
            to crescents.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>

    background:rgba(91,122,82,.96);transition:opacity .6s ease-out,visibility .6s}
  .sheet.gone{opacity:0;visibility:hidden;pointer-events:none}
  .card{width:min(96vw,560px);max-height:94vh;overflow:auto;background:#f5efdf;border:1px solid rgba(39,68,48,.25);

  .cap b{font-weight:600;color:#b5452f}

<body>
<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<button id="flip">⟲ カメラ</button>
<div id="err"></div>
<div id="ttl"><div class="k">木漏れ日</div><div class="s" id="modeS">noon</div></div>
<div id="read">光 <b id="rL">0</b>　風 <b id="rW">0</b>　欠 <b id="rE">—</b></div>
<div id="panel">

</div>
<div class="sheet" id="startSheet"><div class="card">
  <div class="cap"><span>OTO-II / KOMOREBI</span><span>木漏れ <b>日</b></span></div>
  <div class="bodyw">
    <div class="ttl2">葉のすきまが、太陽を映す</div>
    <p class="lead">カメラに映るものが、木の下の地面になります。<br>千四百の木漏れ日が揺れながら落ちますが、その丸は葉の形ではなく<em>太陽の形</em>。葉のすきま一つ一つがピンホールだからです。<br>両腕を高く掲げれば<em>日食</em>。地面の光がすべて三日月になります。</p>
    <canvas id="demo" width="660" height="250"></canvas>
    <div class="spec">
      <span>手を振る</span>風になります。速いほど葉むらが大きく揺れます<br>
      <span>葉を払う</span>速く払った葉むらは落ちて、明るい穴が残ります。ゆっくり戻ります<br>
      <span>朝・昼・夕</span>太陽の高さ。低いほど木漏れ日は長い楕円に伸びます<br>
      <span>両腕を掲げる</span><em>日食</em>。二秒かけて欠け、千四百の三日月になります
    </div>
    <button class="go" id="startBtn">木の下へ</button>
  </div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  KOMOREBI 木漏れ日 ─ 葉のすきまが太陽を映す
//
//  The camera is the ground. A light map — ambient green shade plus
//  ~1400 images of the sun — is multiplied over it. Each dapple rides a
//  leaf cluster that sways on the wind; the wind is a gust your hand
//  makes. Sweep a cluster fast and its leaves fall: the dapples merge
//  into one bright gap that stays for most of a minute and closes as the
//  leaves grow back. Raise both hands high: 日食. The one sun sprite is
//  recomputed per frame as disc ∩ ¬moon, so every dapple on the floor
//  becomes a crescent — which is exactly what happens under a real tree.
// ═══════════════════════════════════════════════════════════════════════
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000; }
function fin(v){ return typeof v==='number' && isFinite(v); }
function chase(cur,tgt,rate,dt){ var k=1-Math.exp(-rate*clamp(dt,0,0.2)); return cur+(tgt-cur)*k; }
function rgba(r,g,b,a){
  r=fin(r)?clamp(r|0,0,255):0; g=fin(g)?clamp(g|0,0,255):0; b=fin(b)?clamp(b|0,0,255):0;
  a=fin(a)?clamp(a,0,1):0; return 'rgba('+r+','+g+','+b+','+a.toFixed(3)+')';
}
var view=document.getElementById('view');
var ctx=view.getContext('2d');
var video=document.getElementById('video');
var flipBtn=document.getElementById('flip');
var errBox=document.getElementById('err');
var startSheet=document.getElementById('startSheet');
var startBtn=document.getElementById('startBtn');
var demoCv=document.getElementById('demo');
var demoCtx=demoCv?demoCv.getContext('2d'):null;
var windEl=document.getElementById('windEl');
var sndBtn=document.getElementById('snd');
var modeS=document.getElementById('modeS');
var rL=document.getElementById('rL'), rW=document.getElementById('rW'), rE=document.getElementById('rE');
var mBtn=[document.getElementById('m0'),document.getElementById('m1'),document.getElementById('m2')];

var W=0,H=0,DPR=1,MN=1;
function mkCanvas(w,h){ var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); return c; }

// ═══════════════════════════════════════════════════════════════════════
//  SUN SPRITE ─ real pinhole optics, computed per pixel
//  A gap in a canopy is a pinhole, so the dapple is an image of the SUN.
//  The sprite is disc ∩ ¬moon with a soft edge; the disc is stretched
//  along y by the mode (a low sun projects a long ellipse). Recomputed
//  only when the eclipse phase or the mode changes.
// ═══════════════════════════════════════════════════════════════════════
var SS=40, sunCv=null, sunCtx=null, sunImg=null, sunData=null;
var sunPhase=-1, sunMode=-1, sunArea=0;
var MODES=[{k:'朝',s:'morning',ax:0.62,col:[255,214,150]},{k:'昼',s:'noon',ax:1.0,col:[244,215,138]},{k:'夕',s:'dusk',ax:0.5,col:[255,176,96]}];
var mode=1;
function buildSun(phase){
  if (!sunData) return;
  var M=MODES[mode], ax=M.ax, col=M.col;
  var c=SS*0.5, R=SS*0.34, soft=1.6;
  // the moon slides across from the right; phase 1 = 94% covered
  var mx=c+R*2*(1-phase)*1.02, my=c, mr=R*1.0;
  var d=sunData, area=0;
  for (var y=0;y<SS;y++){
    for (var x=0;x<SS;x++){
      var o=(y*SS+x)*4;
      var dx=(x+0.5-c), dy=(y+0.5-c)/ax;
      var rs=Math.sqrt(dx*dx+dy*dy);
      var a=clamp((R-rs)/soft+0.5,0,1);
      var ex=(x+0.5-mx), ey=(y+0.5-my)/ax;
      var rm=Math.sqrt(ex*ex+ey*ey);
      var cov=clamp((mr-rm)/soft+0.5,0,1);
      a*=(1-cov);
      area+=a;
      d[o]=col[0]; d[o+1]=col[1]; d[o+2]=col[2]; d[o+3]=(a*255)|0;
    }
  }
  sunArea=area;
  try{ sunCtx.putImageData(sunImg,0,0); }catch(e){}
  sunPhase=phase; sunMode=mode;
}

// ═══════════════════════════════════════════════════════════════════════
//  CANOPY ─ clusters of leaves, each carrying its dapples
// ═══════════════════════════════════════════════════════════════════════
var CN=120, DN=1400;
var cx0=new Float32Array(CN), cy0=new Float32Array(CN), cr=new Float32Array(CN), cdep=new Float32Array(CN);
var cph=new Float32Array(CN), cph2=new Float32Array(CN), cfall=new Float32Array(CN), cgap=new Float32Array(CN);
var cx=new Float32Array(CN), cy=new Float32Array(CN);
var dCl=new Int32Array(DN), dox=new Float32Array(DN), doy=new Float32Array(DN), dsz=new Float32Array(DN), dph=new Float32Array(DN);
var lightCv=null, lctx=null, LS=1/3, LW=0, LH=0;
var glowCv=null, gctx=null;
var wind=0, gust=0, swayT=0, lightFrac=0, fallen=0;

function buildCanopy(){
  var i;
  for (i=0;i<CN;i++){
    cx0[i]=Math.random()*1.1-0.05; cy0[i]=Math.random()*1.1-0.05;
    cr[i]=0.05+Math.random()*0.07;           // fraction of MN
    cdep[i]=Math.random();
    cph[i]=Math.random()*TAU; cph2[i]=Math.random()*TAU;
    cfall[i]=0; cgap[i]=0;
  }
  for (i=0;i<DN;i++){
    var k=(Math.random()*CN)|0;
    dCl[i]=k;
    var a=Math.random()*TAU, r=Math.sqrt(Math.random())*cr[k];
    dox[i]=Math.cos(a)*r; doy[i]=Math.sin(a)*r;
    dsz[i]=0.55+Math.random()*0.9;
    dph[i]=Math.random()*TAU;
  }
}
function allocLight(){
  LW=Math.max(32,Math.round(W*LS)); LH=Math.max(32,Math.round(H*LS));
  lightCv=mkCanvas(LW,LH); lctx=lightCv.getContext('2d');
  glowCv=mkCanvas(Math.max(8,LW/4),Math.max(8,LH/4)); gctx=glowCv.getContext('2d');
  sunCv=mkCanvas(SS,SS); sunCtx=sunCv.getContext('2d');
  sunImg=sunCtx?sunCtx.createImageData(SS,SS):null;
  sunData=sunImg?sunImg.data:null;
  sunPhase=-1;
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  view.width=Math.max(1,Math.round(W*DPR)); view.height=Math.max(1,Math.round(H*DPR));
  view.style.width=W+'px'; view.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  MN=Math.max(1,Math.min(W,H));
  allocLight();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,180); });

// ═══════════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════════
var facing='user', mirror=true, stream=null;
function showError(e){
  var msg=(e&&e.message)?e.message:String(e||'unknown');
  errBox.style.display='block';
  errBox.textContent='カメラを起動できませんでした：'+msg+'\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
function startStream(){
  var md=navigator.mediaDevices;
  if (!md||!md.getUserMedia) return Promise.reject(new Error('getUserMedia is unavailable'));
  if (stream&&stream.getTracks) stream.getTracks().forEach(function(t){ t.stop(); });
  return md.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } }, audio:false })
  .then(function(st){ stream=st; video.srcObject=st; mirror=(facing==='user'); var p=video.play(); return (p&&p.then)?p.catch(function(){}):null; });
}
flipBtn.addEventListener('click',function(){ facing=(facing==='user')?'environment':'user'; loseHands(); startStream().then(startMpCamera).catch(showError); });

var camAspect=4/3, covS=1, covOX=0, covOY=0;
function updateCover(){
  var vw=(video&&video.videoWidth)?video.videoWidth:0, vh=(video&&video.videoHeight)?video.videoHeight:0;
  if (vw>0&&vh>0) camAspect=vw/vh;
  if (!fin(camAspect)||camAspect<=0) camAspect=4/3;
  var rw=W, rh=W/camAspect; if (rh<H){ rh=H; rw=H*camAspect; }
  covS=rw; covOX=(W-rw)/2; covOY=(H-rh)/2;
}
function sx(nx){ return covOX + (mirror?(1-nx):nx)*covS; }
function sy(ny){ return covOY + ny*(covS/camAspect); }

// ═══════════════════════════════════════════════════════════════════════
//  HANDS ─ wind, sweeping, and the two-hands-high gate
// ═══════════════════════════════════════════════════════════════════════
var hands=null, mpCamera=null, mpReady=false, LOST_S=0.5;
var HAND=[{on:false,t:-9,px:0,py:0,vx:0,vy:0,hi:false,L:null},{on:false,t:-9,px:0,py:0,vx:0,vy:0,hi:false,L:null}];
var seenN=0, seenT=-9, raiseT=0, raiseArmed=true;
function lmOK(L,i){ if (!L||typeof L.length!=='number'||L.length<=i) return false; var p=L[i]; return !!p&&fin(p.x)&&fin(p.y); }
function handLive(k){ return HAND[k].on&&(now()-HAND[k].t)<LOST_S; }
function loseHands(){ for (var k=0;k<2;k++){ HAND[k].on=false; HAND[k].L=null; HAND[k].t=-9; HAND[k].vx=0; HAND[k].vy=0; } seenN=0; seenT=-9; raiseT=0; raiseArmed=true; }
function onHands(res){
  var t=now();
  var lists=(res&&res.multiHandLandmarks)?res.multiHandLandmarks:null;
  var n=(lists&&typeof lists.length==='number')?Math.min(2,lists.length):0;
  seenN=0; seenT=t;
  for (var k=0;k<2;k++){
    var h=HAND[k];
    if (k<n){
      var L=lists[k];
      if (!lmOK(L,9)||!lmOK(L,0)) continue;
      var px=sx(L[9].x), py=sy(L[9].y);
      if (!fin(px)||!fin(py)) continue;
      if (h.on&&(t-h.t)<0.25){
        var dt=Math.max(0.016,t-h.t);
        // velocity in SHORT-EDGE units per second, so a sweep is the same sweep in any orientation
        h.vx=chase(h.vx,(px-h.px)/dt/MN,14,dt); h.vy=chase(h.vy,(py-h.py)/dt/MN,14,dt);
      } else { h.vx=0; h.vy=0; }
      h.px=px; h.py=py; h.on=true; h.t=t; h.L=L;
      h.hi=(L[9].y<0.28);                    // palm in the top quarter of the FRAME: unambiguous in any orientation
      seenN++;
    } else if (h.on&&(t-h.t)>LOST_S){ h.on=false; h.L=null; h.vx=0; h.vy=0; h.hi=false; }
  }
}
function initHands(){
  if (typeof window.Hands!=='function') return false;
  try{
    hands=new window.Hands({ locateFile:function(f){ return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f; }});
    hands.setOptions({ maxNumHands:2, modelComplexity:0, selfieMode:false, minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHands); mpReady=true; return true;
  }catch(e){ hands=null; return false; }
}
function startMpCamera(){
  if (!mpReady||!hands||mpCamera) return;
  if (typeof window.Camera!=='function') return;
  try{
    mpCamera=new window.Camera(video,{ onFrame:function(){ if (!hands) return Promise.resolve(); try{ return hands.send({image:video}); }catch(e){ return Promise.resolve(); } }, width:640, height:480 });
    mpCamera.start();
  }catch(e){ mpCamera=null; }
}

// ═══════════════════════════════════════════════════════════════════════
//  AUDIO ─ leaves in wind, a leaf fall, and the hush of an eclipse
// ═══════════════════════════════════════════════════════════════════════
var ac=null, master=null, rustG=null, rustF=null, droneG=null, noiseBuf=null, sndOn=true;
function initAudio(){
  if (ac) return;
  var AC=window.AudioContext||window.webkitAudioContext; if (!AC) return;
  try{ ac=new AC(); }catch(e){ ac=null; return; }
  var comp=ac.createDynamicsCompressor();
  try{ comp.threshold.value=-18; comp.ratio.value=4; comp.attack.value=0.005; comp.release.value=0.3; }catch(e){}
  master=ac.createGain(); master.gain.value=0.9; master.connect(comp); comp.connect(ac.destination);
  var n=Math.floor(ac.sampleRate*1.5); noiseBuf=ac.createBuffer(1,n,ac.sampleRate);
  var d=noiseBuf.getChannelData(0), lp=0;
  for (var i=0;i<n;i++){ var w=Math.random()*2-1; lp+=(w-lp)*0.4; d[i]=lp*1.6; }
  var src=ac.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  rustF=ac.createBiquadFilter(); rustF.type='bandpass'; rustF.frequency.value=1800; rustF.Q.value=0.9;
  rustG=ac.createGain(); rustG.gain.value=0;
  src.connect(rustF); rustF.connect(rustG); rustG.connect(master);
  try{ src.start(); }catch(e){}
  var o=ac.createOscillator(); o.type='sine'; o.frequency.value=55;
  var o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=82.4;
  droneG=ac.createGain(); droneG.gain.value=0;
  o.connect(droneG); o2.connect(droneG); droneG.connect(master);
  try{ o.start(); o2.start(); }catch(e){}
}
function setSound(on){ sndOn=!!on; if (sndBtn){ sndBtn.className=sndOn?'on':''; sndBtn.textContent=sndOn?'音 ON':'音 OFF'; } }
if (sndBtn) sndBtn.addEventListener('click',function(){ setSound(!sndOn); });
var PENTA=[0,3,5,7,10];
function leafFallSound(xFrac){
  if (!sndOn||!ac||!master||!noiseBuf) return;
  try{
    var t=ac.currentTime;
    var s=ac.createBufferSource(); s.buffer=noiseBuf;
    var b=ac.createBiquadFilter(); b.type='bandpass'; b.frequency.value=2600; b.Q.value=1.2;
    var g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
    s.connect(b); b.connect(g); g.connect(master); s.start(t,Math.random()*0.7); s.stop(t+0.5);
    var f=329.6*Math.pow(2,(PENTA[(Math.random()*5)|0]+12*((Math.random()*2)|0))/12);
    var o=ac.createOscillator(); o.type='sine'; o.frequency.value=f;
    var og=ac.createGain(); og.gain.setValueAtTime(0.0001,t+0.05); og.gain.exponentialRampToValueAtTime(0.06,t+0.08); og.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    o.connect(og); og.connect(master); o.start(t); o.stop(t+1.5);
  }catch(e){}
}
function eclipseFlashSound(){
  if (!sndOn||!ac||!master) return;
  try{
    var t=ac.currentTime;
    var o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(1760,t); o.frequency.exponentialRampToValueAtTime(880,t+1.2);
    var g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+1.7);
  }catch(e){}
}
function stepAudio(dt){
  if (!ac||!rustG) return;
  var t=ac.currentTime;
  var w=clamp(wind+gust,0,1);
  rustG.gain.setTargetAtTime(sndOn?(0.008+w*0.05)*(1-ecl*0.85):0,t,0.2);
  rustF.frequency.setTargetAtTime(clamp(1200+w*2200,200,12000),t,0.3);
  droneG.gain.setTargetAtTime(sndOn?ecl*0.05:0,t,0.4);
}

// ═══════════════════════════════════════════════════════════════════════
//  日食 ECLIPSE ─ the one big event
// ═══════════════════════════════════════════════════════════════════════
var eclT=-99, ecl=0, eclFlash=0, eclFlashed=false, ECL_COOL=25;
function fireEclipse(t){ if (t-eclT<ECL_COOL) return; eclT=t; eclFlashed=false; }
function eclipsePhase(t){
  var a=t-eclT;
  if (a<0||a>10.5) return 0;
  if (a<2.2) return smooth01(a/2.2);
  if (a<4.2) return 1;
  return 1-smooth01((a-4.2)/6.3);
}

// ═══════════════════════════════════════════════════════════════════════
//  SIMULATION
// ═══════════════════════════════════════════════════════════════════════
var started=false, last=0, qual=1, costS=8, fpsS=1/60, hudT=0;
function windSet(){ return windEl?clamp((+windEl.value||0)/100,0,1):0.35; }
function setMode(m){
  mode=clamp(m|0,0,2);
  for (var i=0;i<3;i++){ if (mBtn[i]) mBtn[i].className=(i===mode)?'on':''; }
  if (modeS) modeS.textContent=MODES[mode].s;
  sunMode=-1;
}
for (var _m=0;_m<3;_m++){ (function(k){ if (mBtn[k]) mBtn[k].addEventListener('click',function(){ setMode(k); }); })(_m); }

function step(dt,t){
  updateCover();
  wind=chase(wind,windSet(),1.5,dt);
  // hands: fastest hand speed feeds a gust that decays over ~3 s
  var hs=0, k;
  for (k=0;k<2;k++){ if (handLive(k)){ var s=Math.sqrt(HAND[k].vx*HAND[k].vx+HAND[k].vy*HAND[k].vy); if (s>hs) hs=s; } }
  gust=Math.max(gust*Math.exp(-dt*0.35), clamp(hs*0.6,0,1));
  swayT+=dt*(0.6+ (wind+gust)*2.6);
  // clusters sway; a fast sweep through a cluster knocks its leaves down
  var i, ampl=MN*(0.008+(wind+gust)*0.05);
  for (i=0;i<CN;i++){
    var dep=0.5+cdep[i]*0.8;
    cx[i]=cx0[i]*W+Math.sin(swayT*dep+cph[i])*ampl+Math.sin(swayT*0.37*dep+cph2[i])*ampl*0.6;
    cy[i]=cy0[i]*H+Math.cos(swayT*0.8*dep+cph2[i])*ampl*0.5;
    if (cfall[i]>0){
      cfall[i]+=dt;
      // gap opens over 0.6 s, holds ~45 s, closes over 15 s as leaves regrow
      cgap[i]=cfall[i]<0.6?smooth01(cfall[i]/0.6):(cfall[i]<45?1:1-smooth01((cfall[i]-45)/15));
      if (cfall[i]>60){ cfall[i]=0; cgap[i]=0; fallen--; }
    }
  }
  for (k=0;k<2;k++){
    var h=HAND[k]; if (!handLive(k)) continue;
    var sp=Math.sqrt(h.vx*h.vx+h.vy*h.vy);
    if (sp<0.9) continue;                                   // MN per second
    for (i=0;i<CN;i++){
      if (cfall[i]>0) continue;
      var dx=cx[i]-h.px, dy=cy[i]-h.py, rr=cr[i]*MN;
      if (dx*dx+dy*dy<rr*rr){ cfall[i]=0.0001; fallen++; leafFallSound(h.px/Math.max(1,W)); }
    }
  }
  // 日食 gate: both hands high on FRESH results only; bleeds off fast
  var fresh=(seenN>=2)&&((t-seenT)<0.2);
  var up=fresh&&HAND[0].hi&&HAND[1].hi;
  if (up) raiseT+=dt; else { raiseT=Math.max(0,raiseT-dt*2.5); if (raiseT<=0) raiseArmed=true; }
  if (raiseArmed&&raiseT>0.4){ fireEclipse(t); raiseT=0; raiseArmed=false; }
  ecl=eclipsePhase(t);
  if (ecl>0.98&&!eclFlashed){ eclFlashed=true; eclFlash=1; eclipseFlashSound(); }
  eclFlash*=Math.exp(-dt*7);
  if (Math.abs(ecl-sunPhase)>0.004||sunMode!==mode) buildSun(ecl);
  stepAudio(dt);
  if (t-hudT>0.2){ hudT=t; updateHud(); }
}
function updateHud(){
  if (rL) rL.textContent=String(Math.round(lightFrac*100))+'%';
  if (rW) rW.textContent=String(Math.round(clamp(wind+gust,0,1)*10));
  if (rE) rE.textContent=ecl>0.01?String(Math.round(ecl*94))+'%':'—';
}

// ═══════════════════════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════════════════════
var dappleDrawn=0;
function drawLight(){
  if (!lctx||!sunCv) return;
  var g=lctx;
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-over';
  g.globalAlpha=1;
  // ambient shade: green in sun, cold blue-grey in eclipse
  var amb=lerp(0.34,0.10,ecl);
  var r=lerp(91,70,ecl)*amb*1.3, gg=lerp(122,80,ecl)*amb*1.3, b=lerp(82,107,ecl)*amb*1.3;
  g.fillStyle=rgba(r,gg,b,1);
  g.fillRect(0,0,LW,LH);
  g.globalCompositeOperation='lighter';
  var n=Math.max(300,Math.round(DN*qual));
  var base=MN*LS*0.052, ax=MODES[mode].ax;
  var elong=1/ax;
  dappleDrawn=0;
  for (var i=0;i<n;i++){
    var k=dCl[i];
    var gap=cgap[k];
    if (gap>0.999) continue;                                 // fallen: drawn as a gap below
    var s=base*dsz[i]*(1-gap);
    var px=(cx[k]+dox[i]*MN)*LS, py=(cy[k]+doy[i]*MN)*LS;
    if (px<-s||py<-s||px>LW+s||py>LH+s) continue;
    g.globalAlpha=0.5+0.2*Math.sin(dph[i]+swayT*0.7);
    g.drawImage(sunCv,px-s,py-s*elong,s*2,s*2*elong);
    dappleDrawn++;
  }
  // gaps where leaves fell: one big soft disc of sunlight
  for (var c=0;c<CN;c++){
    if (cgap[c]<=0.001) continue;
    var rr=cr[c]*MN*LS*1.15*cgap[c];
    var gx=cx[c]*LS, gy=cy[c]*LS;
    var grd=null;
    try{ grd=g.createRadialGradient(gx,gy,0,gx,gy,Math.max(1,rr)); }catch(e){ grd=null; }
    var col=MODES[mode].col;
    var a=(1-ecl*0.9)*cgap[c];
    if (grd){ grd.addColorStop(0,rgba(col[0],col[1],col[2],a*0.95)); grd.addColorStop(0.7,rgba(col[0],col[1],col[2],a*0.7)); grd.addColorStop(1,rgba(col[0],col[1],col[2],0)); g.fillStyle=grd; }
    else g.fillStyle=rgba(col[0],col[1],col[2],a*0.8);
    g.globalAlpha=1;
    g.beginPath(); g.arc(gx,gy,Math.max(1,rr),0,TAU); g.fill();
  }
  g.globalAlpha=1;
  g.globalCompositeOperation='source-over';
  lightFrac=clamp(dappleDrawn/Math.max(1,n)*(0.55+0.45*(1-ecl))*(1-ecl*0.9),0,1);
}
function drawVideo(){
  ctx.save();
  if (mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
  try{ ctx.drawImage(video,mirror?(W-covOX-covS):covOX,covOY,covS,covS/camAspect); }
  catch(e){ ctx.fillStyle='#6d8a63'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}
function draw(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawVideo();
  drawLight();
  if (lightCv){
    ctx.save();
    ctx.imageSmoothingEnabled=true;
    ctx.globalCompositeOperation='multiply';
    ctx.drawImage(lightCv,0,0,W,H);
    // a little bloom from a quarter-size copy
    if (gctx&&glowCv){
      gctx.clearRect(0,0,glowCv.width,glowCv.height);
      gctx.drawImage(lightCv,0,0,glowCv.width,glowCv.height);
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=0.16*(1-ecl*0.8);
      ctx.drawImage(glowCv,0,0,W,H);
    }
    ctx.restore();
  }
  if (eclFlash>0.01){ ctx.fillStyle=rgba(255,250,235,eclFlash*0.85); ctx.fillRect(0,0,W,H); }
  drawHands(t);
  if (started) drawHint(t);
}
function drawHands(t){
  for (var k=0;k<2;k++){
    var h=HAND[k]; if (!handLive(k)||!fin(h.px)||!fin(h.py)) continue;
    var sp=Math.sqrt(h.vx*h.vx+h.vy*h.vy);
    var r=MN*0.03;
    ctx.strokeStyle=rgba(244,215,138,0.7);
    ctx.lineWidth=Math.max(1,MN*0.0025);
    ctx.beginPath(); ctx.arc(h.px,h.py,r,0,TAU); ctx.stroke();
    if (sp>0.2){
      ctx.strokeStyle=rgba(244,215,138,clamp(sp*0.5,0,0.8));
      ctx.beginPath(); ctx.moveTo(h.px,h.py); ctx.lineTo(h.px-h.vx*MN*0.12,h.py-h.vy*MN*0.12); ctx.stroke();
    }
  }
}
function drawHint(t){
  if (handLive(0)||handLive(1)) return;
  var a=0.5+0.2*Math.sin(t*1.8);
  ctx.fillStyle=rgba(245,239,223,a);
  ctx.font='700 '+Math.round(clamp(MN*0.036,13,21))+'px "Kaisei Tokumin", serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(39,68,48,0.8)'; ctx.shadowBlur=8;
  ctx.fillText('手を振ると、風になります',W/2,H*0.84);
  ctx.shadowBlur=0;
}
function frame(){
  var t=now(); var dt=clamp(t-last,0,0.1); last=t;
  var t0=now();
  if (started) step(dt,t);
  draw(t);
  if (started){
    var cost=(now()-t0)*1000; costS+=(cost-costS)*0.07;
    if (dt>0.002) fpsS+=(dt-fpsS)*0.06;
    var slow=(fpsS>1/26)||(costS>26), fast=(fpsS<1/50)&&(costS<14);
    if (slow&&qual>0.3) qual=Math.max(0.3,qual-0.035); else if (fast&&qual<1) qual=Math.min(1,qual+0.015);
  }
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════════
//  START-SHEET DIAGRAM
// ═══════════════════════════════════════════════════════════════════════
var demoRun=true, demoT=0, dd=[];
function demoFrame(){
  if (!demoCtx) return;
  var g=demoCtx, DW=demoCv.width, DH=demoCv.height;
  demoT+=1/60; var cyc=demoT%8;
  if (dd.length===0){ for (var i=0;i<160;i++) dd.push([Math.random()*DW,Math.random()*DH,4+Math.random()*7,Math.random()*TAU]); }
  var ph=cyc<4.5?0:(cyc<6.5?smooth01((cyc-4.5)/2):1-smooth01((cyc-6.5)/1.5));
  g.fillStyle=ph>0?'rgba('+Math.round(lerp(91,50,ph))+','+Math.round(lerp(122,60,ph))+','+Math.round(lerp(82,90,ph))+',1)':'#5b7a52';
  g.fillRect(0,0,DW,DH);
  var wind=cyc<2.2?0.3:(cyc<4.5?1:0.3);
  for (i=0;i<dd.length;i++){
    var d=dd[i];
    var x=d[0]+Math.sin(demoT*1.3*wind+d[3])*10*wind, y=d[1]+Math.cos(demoT*wind+d[3])*4;
    g.fillStyle='rgba(244,215,138,0.85)';
    g.beginPath(); g.arc(x,y,d[2],0,TAU);
    if (ph>0){ g.fill(); g.fillStyle=g.fillStyle; g.globalCompositeOperation='destination-out'; g.beginPath(); g.arc(x+d[2]*2*(1-ph)*1.02,y,d[2],0,TAU); g.fill(); g.globalCompositeOperation='source-over'; g.fillStyle='rgba(91,122,82,1)'; }
    else g.fill();
  }
  var label=cyc<2.2?'葉のすきま一つ一つが、太陽を映している':(cyc<4.5?'手を振れば、風':'両腕を掲げれば ── 日食。丸が全部、三日月に');
  g.fillStyle='rgba(245,239,223,.92)'; g.font='700 15px "Kaisei Tokumin", serif'; g.textAlign='center';
  g.fillText(label,DW/2,24);
  if (demoRun && typeof requestAnimationFrame==='function') requestAnimationFrame(demoFrame);
}
if (demoCtx) demoFrame();

startBtn.addEventListener('click',function(){
  if (started) return;
  started=true; demoRun=false;
  initAudio();
  if (ac&&ac.state==='suspended'){ var r=ac.resume(); if (r&&r.then) r.catch(function(){}); }
  startSheet.classList.add('gone');
  initHands();
  startStream().then(startMpCamera).catch(showError);
  last=now();
});

resize();
updateCover();
buildCanopy();
setMode(1);
buildSun(0);
setSound(true);
last=now();
frame();
</script>
</body>
