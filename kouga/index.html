<script>/* REC-FIX (2026-10-12) — iPhone Safari で録画が途中で止まる・壊れる対策。どの作品でも同じ内容。
   ・mp4 は映像と音声の両方のコーデックを宣言する（avc1 だけだと音声付きで止まることがある）
   ・1 秒ごとにデータを受け取る（最後に一括で書き出さない）／ビットレートに上限
   ・保存が終わる前に次の録画を始めない（前のファイルが消えるのを防ぐ）
   ・録画中は AudioContext を止めない（音声トラックが止まると mp4 ごと止まる） */
(()=>{const MR=window.MediaRecorder;if(!MR||MR.__recfix)return;let busy=0,active=0;
class R extends MR{
  constructor(s,o){if(busy)throw new Error('前の録画を保存しています');o=Object.assign({},o||{});
    const au=s&&s.getAudioTracks&&s.getAudioTracks().length>0;
    if(!o.mimeType||/^video\/mp4/.test(o.mimeType)){
      const c=[au?'video/mp4;codecs="avc1.42E01E,mp4a.40.2"':'video/mp4;codecs="avc1.42E01E"','video/mp4'].find(m=>MR.isTypeSupported(m));
      if(c)o.mimeType=c;else if(o.mimeType&&!MR.isTypeSupported(o.mimeType))delete o.mimeType;}
    if(!o.videoBitsPerSecond&&!o.bitsPerSecond)o.videoBitsPerSecond=6e6;
    super(s,o);this.addEventListener('stop',()=>{active=Math.max(0,active-1);setTimeout(()=>{busy=0;},0);});}
  start(t){const r=super.start(t==null?1000:t);active++;return r;}
  stop(){if(this.state!=='inactive'){busy=1;setTimeout(()=>{busy=0;},15000);}return super.stop();}}
R.__recfix=1;window.MediaRecorder=R;
const AC=window.AudioContext||window.webkitAudioContext;
if(AC&&AC.prototype.suspend){const sus=AC.prototype.suspend;AC.prototype.suspend=function(){return active?Promise.resolve():sus.call(this);};}
/* 録音用の出口には常に無音を流しておく（何も鳴っていないと音声トラックにデータが来ず、録画全体が止まる） */
if(AC&&AC.prototype.createMediaStreamDestination){const cmd=AC.prototype.createMediaStreamDestination;AC.prototype.createMediaStreamDestination=function(){const d=cmd.apply(this,arguments);
  try{const c=this.createConstantSource();c.offset.value=0;c.connect(d);c.start();}catch(e){}return d;};}})();</script>
<script>/* RESUME-FIX (2026-10-17) — iPhone で写真や動画を保存しに行ったり、別のアプリへ行ったりして戻ると、
   カメラが消える・映像が固まる・画面が壊れる対策。どの作品でも同じ内容。
   ・ページが裏に回ると、iPhone はカメラを止め、動画を一時停止し、音を止め、ときに WebGL の描画を捨てる
   ・戻ったら：止められたカメラを同じ条件で取り直して同じ MediaStream に差し込み、止まった動画を再生し、音を再開する
   ・WebGL の描画が捨てられ、作品が自分で立て直せないときは「タップして再開」を出して読み込み直す */
(()=>{if(window.__resumefix)return;window.__resumefix=1;
const md=navigator.mediaDevices,streams=new Map(),vids=new Set(),ctxs=new Set(),lost=new WeakSet(),mutedAt=new Map();
const watch=t=>{try{t.addEventListener('ended',()=>lost.add(t));t.addEventListener('mute',()=>mutedAt.set(t,performance.now()));
  t.addEventListener('unmute',()=>mutedAt.delete(t));if(t.muted)mutedAt.set(t,performance.now());}catch(e){}};
let gum=null;
if(md&&md.getUserMedia){gum=md.getUserMedia.bind(md);
  md.getUserMedia=async function(c){const s=await gum(c);try{streams.set(s,c);s.getTracks().forEach(watch);}catch(e){}return s;};}
/* every <video> that is given a camera stream, also ones never put in the page */
const MP=HTMLMediaElement.prototype,play=MP.play,so=Object.getOwnPropertyDescriptor(MP,'srcObject');
MP.play=function(){try{if(this.srcObject)vids.add(this);}catch(e){}return play.apply(this,arguments);};
if(so&&so.set)Object.defineProperty(MP,'srcObject',{configurable:true,enumerable:so.enumerable,
  get(){return so.get.call(this);},set(v){if(v)vids.add(this);so.set.call(this,v);}});
for(const k of['AudioContext','webkitAudioContext']){const C=window[k];if(!C||C.__resumefix)continue;
  const W=function(...a){const c=new C(...a);ctxs.add(c);return c;};W.prototype=C.prototype;W.__resumefix=1;
  try{Object.setPrototypeOf(W,C);}catch(e){}window[k]=W;}
const shown=s=>{for(const v of vids){try{if(so.get.call(v)===s)return true;}catch(e){}}return false;};
let busy=0;
async function revive(){
  if(busy||document.hidden)return;busy=1;
  try{
    for(const[s,c]of[...streams]){
      const tr=s.getTracks();
      if(!shown(s)){if(tr.every(t=>t.readyState==='ended'))streams.delete(s);continue;}
      const now=performance.now();
      const dead=tr.filter(t=>(t.readyState==='ended'&&lost.has(t))||(t.kind==='video'&&mutedAt.has(t)&&now-mutedAt.get(t)>1500));
      if(!dead.length||!gum)continue;
      let ns=null;try{ns=await gum(c);}catch(e){continue;}
      const kinds=new Set(dead.map(t=>t.kind));
      for(const t of dead){try{t.stop();}catch(e){}s.removeTrack(t);mutedAt.delete(t);}
      for(const t of ns.getTracks()){if(kinds.has(t.kind)){s.addTrack(t);watch(t);}else t.stop();}
      for(const v of vids){try{if(so.get.call(v)===s){so.set.call(v,null);so.set.call(v,s);}}catch(e){}}
    }
  }finally{busy=0;}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}
  for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
}
const soon=()=>{if(document.hidden)return;const n=performance.now();for(const t of mutedAt.keys())mutedAt.set(t,n);
  setTimeout(revive,250);setTimeout(revive,1900);};
document.addEventListener('visibilitychange',soon);
addEventListener('pageshow',soon);addEventListener('focus',soon);
/* iPhone sometimes only lets sound and video restart from a tap */
const tap=()=>{for(const c of ctxs){try{if(c.state!=='running'&&c.state!=='closed')c.resume().catch(()=>{});}catch(e){}}
  for(const v of vids){try{if(so.get.call(v)&&v.paused)play.call(v).catch(()=>{});}catch(e){}}};
addEventListener('pointerdown',tap,true);addEventListener('touchend',tap,true);
/* WebGL: if the drawing is thrown away and the piece does not rebuild it, offer a clean restart */
const ET=EventTarget.prototype,ael=ET.addEventListener,rebuilds=new WeakSet(),gls=new WeakMap();
ET.addEventListener=function(t){if(t==='webglcontextrestored'&&this instanceof HTMLCanvasElement)rebuilds.add(this);return ael.apply(this,arguments);};
let box=null;
function offer(){
  if(box)return;box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;'+
    'background:rgba(0,0,0,.82);color:#fff;font:14px/1.8 system-ui,sans-serif;text-align:center;padding:24px';
  box.innerHTML='<div>画面の表示が止まりました。<br>（別のアプリから戻ったとき、iPhone が描画を止めることがあります）</div>'+
    '<button style="font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;border:0;background:#fff;color:#000">タップして再開</button>';
  box.querySelector('button').onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(box);
}
const GC=HTMLCanvasElement.prototype,getCtx=GC.getContext;
GC.getContext=function(type){
  const g=getCtx.apply(this,arguments);
  if(g&&/webgl/i.test(String(type))&&!gls.has(this)){gls.set(this,g);const cv=this;
    ael.call(cv,'webglcontextlost',e=>{e.preventDefault();let vis=0;
      const iv=setInterval(()=>{vis=document.hidden?0:vis+500;let still=false;try{still=g.isContextLost();}catch(_){}
        if(!still){clearInterval(iv);return;}                     /* came back: the 'restored' handler below decides */
        if(vis>=4000){clearInterval(iv);if(cv.isConnected)offer();}},500);},false);
    ael.call(cv,'webglcontextrestored',()=>{const f=()=>{if(document.hidden){setTimeout(f,500);return;}
      if(cv.isConnected&&!rebuilds.has(cv))offer();};f();},false);}
  return g;
};
})();</script>

<title>KOUGA ─ 光で描く肖像</title>
<meta name="description" content="灯りを消した部屋で、指先が空中に光の線を描く。止まってポーズを決めるとストロボが焚かれ、銀塩写真のあなたが光の線の中に焼き付く。">
<meta name="theme-color" content="#050505">
<!--
  ══════════════════════════════════════════════════════════════════════════
  KOUGA ─ 光で描く肖像                              ART DIRECTION SHEET
  ══════════════════════════════════════════════════════════════════════════
  元ネタ    ジョン・ミリ（Gjon Mili）が 1949 年に LIFE 誌のために撮った
            「光で描くピカソ」。暗い部屋でピカソが小さな電灯を振り、開けたままの
            シャッターに線だけが残る。最後に一発ストロボが焚かれ、描き手の姿が
            白黒で止まる。線は遅いところほど太く明るく、速いところは細く、
            止めたところは光の玉に焼ける。線の向こうにいる体は、線に隠れる。

  最終の一枚  真っ黒な闇に、ストロボで止まった銀色のモノクロのあなた。そのまわりを
            指先が空中に描いた白熱の光の線が一筆書きで取り巻き、縁がにじむ。

  主役      指先が光のペンになり、描いた線は空中に残る。体は止まったときだけ
            ストロボで写り、動いているあいだは闇の中で自分のペンの灯りにだけ
            照らされて流れる。

  層        ① 露光の線：遅い筆は太く明るく、速い筆は細く淡い。止めると光の玉。
              手持ちの電灯らしい明るさのゆらぎ、線の両端は細る、白く飛んだ芯と色のにじみ
            ② 体：動くあいだは闇。指先の灯りが近くの顔や手だけを暖かく照らし、跡が流れる。
              止まってポーズを決めるとストロボ。銀塩の肖像が焼き付き、ゆっくり沈む。
              動いてまた止まれば、前の姿の上にもう一枚 ── 多重露光
            ③ 線は立体：手の大きさから奥行きを読む。描くのをやめると線がゆっくり回り、
              体の向こう側へ回った線は体に隠れる
            ④ 四つの版：1949（銀塩）・EKTA（タングステンの琥珀と青い閃光）・
              CYANO（青写真）・SAFELIGHT（暗室の赤い灯）
            ⑤ 切り替え：部屋の白熱灯が赤く落ちて暗転、一拍おいてストロボ一発で現れる。
              戻るときは灯りが赤からゆっくり白へ点く
            ⑥ 音：ストロボの「ポン」と充電の高い唸り、灯りのスイッチ、部屋の静けさ
            ⑦ フィルムの仕上げ：粒子、ハレーション、周辺の落ち、露光時間の小さな記載

  PALETTE   1949     黒 #050505 ／ 銀 #efe9dd（二色）
            EKTA     黒青 #03060b ／ 琥珀 #ffa040 ／ 閃光の青白 #cfe4ff
            CYANO    プルシアンブルー #0b2350 ／ 紙 #f1ede2
            SAFELIGHT 黒 #070101 ／ 暗室灯の赤 #c92a17 ／ 白く飛んだ光 #fff0e2

  TYPE      Bodoni Moda（イタリック、題）・Martian Mono（記載）・Zen Old Mincho（本文）

  MOTION    線は描いたぶんだけ一気に、消えるのはゆっくり。回転は一往復 20 秒。
            ストロボだけが一瞬。

  TECH      WebGL2。線は CPU で投影した三角形の帯を加算で RGBA16F へ、
            縮小ぼかし二段でハレーション。体は MediaPipe ImageSegmenter（selfie）の
            切り抜き、ペンは HandLandmarker の人差し指（「五本の指」で五本）。
            体の露光は半解像度の往復バッファ（減衰＋ストロボ＋ペンの灯り）。
  ══════════════════════════════════════════════════════════════════════════
-->

<style>
:root{
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#050505;color:#efe9dd;font-family:var(--jp);overflow:hidden;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}

button.go:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:1px solid currentColor;outline-offset:3px}

<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="start">
  <div class="wrap">
    <svg class="work" viewBox="0 0 400 500" aria-hidden="true">
      <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <radialGradient id="sit" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#9c968c"/><stop offset=".6" stop-color="#3b3833"/><stop offset="1" stop-color="#050505"/></radialGradient>
      </defs>
      <rect width="400" height="500" fill="#050505"/>
      <path d="M150 500 C150 400 168 352 200 340 C232 352 250 400 250 500Z" fill="url(#sit)" opacity=".55"/>
      <ellipse cx="200" cy="300" rx="34" ry="42" fill="url(#sit)" opacity=".7"/>
      <g fill="none" stroke="#fff3df" stroke-linecap="round" filter="url(#glow)">
        <path d="M70 230 C 90 120, 210 70, 290 120 S 360 260, 300 300 S 160 330, 120 260 S 170 150, 240 170" stroke-width="3.2"/>
        <path d="M240 170 C 300 190, 330 120, 352 92" stroke-width="1.2" opacity=".8"/>
        <path d="M110 380 C 140 330, 170 420, 210 380 S 280 340, 300 400" stroke-width="2.2"/>
        <circle cx="352" cy="92" r="3.6" fill="#fff"/>
      </g>
    </svg>
    <h1>Kouga.</h1>
    <div class="sub">光画 ── 光で描く肖像</div>
    <div class="how">
      部屋の灯りを消して、指先に光を。<br>
      <b>人差し指を立てると、空中に光の線が引ける。</b><br>
      止まってポーズを決めると、ストロボが焚かれる。<br>
      描くのをやめると、線はゆっくり回りだす。
    </div>
    <div class="meta">AFTER GJON MILI, LIFE, 1949 — OPEN SHUTTER · ONE FLASH</div>
    <button class="go" id="go" type="button">はじめる</button>
    <div id="err"></div>
    <div class="note">映像はこの端末の中だけで処理されます。</div>
  </div>
</div>

<div id="status" class="off"></div>
<div id="cap"><div class="t" id="capT">Kouga, 1949</div><div class="m" id="capM"></div></div>
<div id="toast"></div>
<div id="ui">
  <button class="btn" id="flip" type="button" aria-label="カメラを切り替える">⟲<span class="t"> カメラ</span></button>
  <button class="btn" id="mode" type="button">◐ 消灯</button>
  <button class="btn" id="pal" type="button">1949</button>
  <button class="btn" id="clear" type="button">✕<span class="t"> 消す</span></button>

<script type="module">

const SEG_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const VS_FULL = `#version 300 es
out vec2 vUv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
const COMMON = `
float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}

uniform vec2 uVA, uVB;          /* screen uv (y down) -> video uv */
uniform sampler2D uVid, uMask;
uniform float uMaskOK;
uniform vec2 uWH;               /* screen size in short-side units */
uniform vec4 uPen[5];           /* live pens: x, y (short-side units), brightness, - */
float mask(vec2 s){

    /* the cut-out is coarse: soften it over a few of its own texels so the edge is a clean curve */
    vec2 u=s*uVA+uVB, t=vec2(1.)/vec2(textureSize(uMask,0));

  return smoothstep(.62,.3,length(q));

/* how a camera frame reads on the plate: a hard, clean silver curve */
float plate(vec2 s){
  vec3 c=texture(uVid,s*uVA+uVB).rgb;
  float l=luma(c);
  l=clamp((l-.07)/.8,0.,1.);

/* one strobe, held high and to the side: it falls off across the frame, so one side of the sitter goes to shadow */
float keyLight(vec2 q){
  vec2 k=vec2(uWH.x*.18,-.3);
  float d=length((q-k)*vec2(1.,.8));
  return 1.9/(1.+d*d*1.6);
}
/* the light a hand-held torch throws on the sitter: falls off with distance */
float penLight(vec2 q){
  float a=0.;
  for(int i=0;i<5;i++){ if(uPen[i].z<=0.) continue; vec2 d=q-uPen[i].xy; a+=uPen[i].z*.010/(dot(d,d)+.010); }

/* ---- the sitter's exposure: what the open shutter has gathered so far ---- */
const FS_FILM = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
${COMMON}
uniform sampler2D uPrev;
uniform float uDecay, uFlash, uPenK;
uniform vec3 uPenCol, uFlashCol;
void main(){
  vec2 s=vec2(vUv.x,1.-vUv.y), q=s*uWH;
  vec3 prev=texture(uPrev,vUv).rgb;

/* ---- the lines of light, as ribbons ---- */
const VS_LINE = `#version 300 es
in vec2 aPos; in vec4 aD; in float aB;   /* across, along (-1..1; along is 0 on a ribbon), brightness, core fraction; behind the body (0..1) */
uniform vec2 uRes;

const FS_LINE = `#version 300 es
precision highp float;
in vec4 vD; in float vB; out vec4 o;
void main(){
  float d=length(vD.xy), cf=max(vD.w,.02);
  float core=exp(-d*d/(cf*cf)*2.6);

/* ---- blur for the halation ---- */
const FS_DOWN = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uTx;
void main(){
  vec4 a=texture(uSrc,vUv+uTx*vec2(-1,-1))+texture(uSrc,vUv+uTx*vec2(1,-1))+texture(uSrc,vUv+uTx*vec2(-1,1))+texture(uSrc,vUv+uTx*vec2(1,1));

const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uDir;
void main(){
  vec4 a=texture(uSrc,vUv)*.2270270;
  a+=(texture(uSrc,vUv+uDir*1.3846154)+texture(uSrc,vUv-uDir*1.3846154))*.3162162;
  a+=(texture(uSrc,vUv+uDir*3.2307692)+texture(uSrc,vUv-uDir*3.2307692))*.0702703;
  o=a;

/* ---- the print ---- */
const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
${COMMON}
uniform sampler2D uFilm, uLine, uB1, uB2;
uniform vec2 uRes;
uniform float uT, uAmb, uFlashGlow, uDuo, uGrain, uShow, uCam, uCamWarm, uSeed, uFade;
uniform vec3 uC0, uC1, uC2, uPenCol, uFlashCol, uHal;

vec3 film(vec3 x){ vec3 y=1.-exp(-x*1.35); return y*y*(1.6-.6*y); }
void main(){
  vec2 s=vec2(vUv.x,1.-vUv.y), q=s*uWH, px=s*uRes;
  float S=min(uRes.x,uRes.y);

  vec3 cam=texture(uVid,s*uVA+uVB).rgb;
  vec3 room=cam*uCam*mix(vec3(1.),vec3(1.,.62,.34),uCamWarm);

  float m=mask(s), p=plate(s);
  vec3 rad=texture(uFilm,vUv).rgb;

  float pl=penLight(q);

  rad+=uPenCol*m*(p*.9+.1)*pl*.55;

  vec2 ln=texture(uLine,vUv).rg;
  float occ=clamp(m*1.2,0.,1.)*.92;
  float L=max(ln.r-ln.g*occ,0.);
  vec3 b1=texture(uB1,vUv).rgb, b2=texture(uB2,vUv).rgb;
  float bl=b1.r*.55+b2.r*.7;

  vec3 lineC=uPenCol*L*2.+vec3(1.)*max(L-.6,0.)*1.2;
  rad+=lineC;
  /* halation: light spreading back through the film base, warm */
  rad+=uHal*bl*.9+uPenCol*b1.r*.5;
  /* the flash itself, a breath of white over everything */
  rad+=uFlashCol*uFlashGlow*(.25+.75*m);
  vec3 c=film(rad);
  /* grain, strongest in the middle greys */
  float g=h12(px*.73+fract(uT*13.7)*vec2(91.7,47.3)+uSeed)-.5;
  g+=h12(floor(px*.5)+fract(uT*7.1)*vec2(31.,17.))-.5;
  float lv=luma(c);
  float gk=uGrain*(.35+2.4*lv*(1.-lv));
  vec2 vq=(s-.5)*vec2(uRes.x/S,uRes.y/S);
  float vig=1.-.32*smoothstep(.35,1.05,length(vq));
  vec3 outc;
  if(uDuo>.5){
    float v=clamp((lv+g*gk)*vig,0.,1.);
    v=pow(v,.92);
    /* two inks: the dark into the print colour, and the brightest light past it to near white */
    outc=v<.7?mix(uC0,uC1,v/.7):mix(uC1,uC2,smoothstep(.7,.97,v));
  } else {
    outc=clamp((c+g*gk)*vig,0.,1.);
    outc=mix(uC0,vec3(1.),outc);
  }
  o=vec4(mix(room,outc*uFade,uShow),1.);
}`;

function mkProg(vsSrc, fsSrc) {
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);

const f2 = (P, n, a, b) => { const l = P.u[n]; if (l) gl.uniform2f(l, a, b); };
const f3 = (P, n, a) => { const l = P.u[n]; if (l) gl.uniform3f(l, a[0], a[1], a[2]); };

let PR = null, VAO = null, lineVAO = null, lineBuf = null, texVid = null, texMask = null;
let filmA = null, filmB = null, filmFlip = false, lineT = null, bA = null, bB = null, cA = null, cB = null;

/* ---------- state ---------- */
let W = 0, H = 0, DPR = 1, S = 1;
let vw = 0, vh = 0, VA_ = [1, 1], VB_ = [0, 0];
let running = false, facing = 'user', mirror = true, stream = null;
let palIdx = 0, soundOn = true, autoFlash = true, turnOn = true, fiveOn = false;
let lifeSet = 0.45, thick = 1, dark = 0.75, ghost = 0.5;
let T = 0, lastT = performance.now() / 1000, shotReq = false, seed = Math.random() * 10;
const TEST = { dt: 0, frames: 0, hands: null, mask: null, budget: null };
/* the room: 'cam' (lights on) or 'fx' (dark room); tr counts seconds into the change */
let mode = 'cam', tr = 99, flashGlow = 0, flashCount = 0, exposeT0 = 0, lastFlashT = -99, pendingFlash = 0;
const lifeSec = () => lifeSet >= 0.99 ? Infinity : 5 + Math.pow(lifeSet, 1.6) * 75;

/* ---------- layout ---------- */
function resize() {
  W = innerWidth; H = innerHeight; S = Math.min(W, H);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  if (W * H * DPR * DPR > 2.6e6) DPR = Math.sqrt(2.6e6 / (W * H));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (!PR) return;
  const fw = Math.round(cv.width / 2), fh = Math.round(cv.height / 2);
  if (!filmA || filmA.w !== fw || filmA.h !== fh) { freeT(filmA); freeT(filmB); filmA = mkTex(fw, fh, true); filmB = mkTex(fw, fh, true); }
  if (!lineT || lineT.w !== cv.width || lineT.h !== cv.height) {
    freeT(lineT); lineT = mkTex(cv.width, cv.height, true);
    freeT(bA); freeT(bB); freeT(cA); freeT(cB);
    const w4 = Math.max(2, Math.round(cv.width / 4)), h4 = Math.max(2, Math.round(cv.height / 4));
    const w16 = Math.max(2, Math.round(cv.width / 16)), h16 = Math.max(2, Math.round(cv.height / 16));
    bA = mkTex(w4, h4, true); bB = mkTex(w4, h4, true); cA = mkTex(w16, h16, true); cB = mkTex(w16, h16, true);
  }

/* screen uv (top-left origin) → video uv is s*VA_ + VB_ (the camera covers the screen, mirrored for the front camera) */
function updateVideoMap() {

  if (va > sa) fx = sa / va; else fy = va / sa;
  VA_ = [mirror ? -fx : fx, fy]; VB_ = [mirror ? 0.5 + fx / 2 : 0.5 - fx / 2, 0.5 - fy / 2];
}
const v2s = (x, y) => [(x - VB_[0]) / VA_[0] * W, (y - VB_[1]) / VA_[1] * H];   // video uv → screen css px

/* ---------- the sitter and the hands ---------- */

const segC = document.createElement('canvas'), segX = segC.getContext('2d', { willReadFrequently: false });

let motion = 0, motionRaw = 0;          // how much the sitter is moving (mask change per second)
async function initMP() {

    let V; try { V = await import(`${MP_BASE}/vision_bundle.mjs`); } catch (e) { V = await import(MP_BASE); }
    const fs = await V.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const segOpts = d => ({ baseOptions: { modelAssetPath: SEG_MODEL, delegate: d }, runningMode: 'VIDEO', outputCategoryMask: false, outputConfidenceMasks: true });
    const handOpts = d => ({ baseOptions: { modelAssetPath: HAND_MODEL, delegate: d }, runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
    try { segmenter = await V.ImageSegmenter.createFromOptions(fs, segOpts(DELEGATE)); }
    catch (e) { try { segmenter = await V.ImageSegmenter.createFromOptions(fs, segOpts('CPU')); } catch (e2) { console.warn('segmenter', e2); } }
    try { handLm = await V.HandLandmarker.createFromOptions(fs, handOpts(DELEGATE)); }
    catch (e) { handLm = await V.HandLandmarker.createFromOptions(fs, handOpts('CPU')); }

function nextTs(nowMs) { mpTs = Math.max(nowMs, mpTs + 1); return mpTs; }

  /* the strobe: a hard pop, then the capacitor whining back up */
  flash() {
    if (!this.ok()) return; const ac = this.ac, t = ac.currentTime;
    this.click(t, 2600, 0.6, 0.32, 0.06); this.click(t, 7000, 1.2, 0.12, 0.03); this.tone(t, 140, 55, 0.22, 0.16);
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(700, t + 0.15); o.frequency.exponentialRampToValueAtTime(6800, t + 2.3);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t + 0.15); g.gain.exponentialRampToValueAtTime(0.012, t + 0.6);
    g.gain.setValueAtTime(0.012, t + 2.1); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.35);
    o.connect(g); g.connect(this.bus); o.start(t + 0.15); o.stop(t + 2.4);
    this.click(t + 2.36, 5200, 4, 0.04, 0.02);   // ready
  },
  /* the light switch, and the filament ticking as it cools or warms */
  sw(off) {
    if (!this.ok()) return; const t = this.ac.currentTime;
    this.click(t, 1900, 3, 0.3, 0.025); this.click(t + 0.03, 900, 2, 0.18, 0.04); this.tone(t, 90, 70, 0.05, 0.1);
    if (off) { this.click(t + 0.35, 6000, 8, 0.02, 0.02); this.click(t + 0.62, 5400, 8, 0.015, 0.02); }
  },
  shutter() { if (!this.ok()) return; const t = this.ac.currentTime; this.click(t, 3200, 2, 0.2, 0.03); this.click(t + 0.07, 2400, 2, 0.16, 0.04); },
  swishLevel(v) { if (!this.ready) return; const t = this.ac.currentTime; this.swish.g.gain.setTargetAtTime(soundOn ? clamp(v * 0.05, 0, 0.07) : 0, t, 0.05); this.swish.bp.frequency.setTargetAtTime(500 + 900 * clamp(v, 0, 2), t, 0.06); },
};

/* ---------- the strobe ---------- */
let stillFor = 0, busyFor = 0;
function fireFlash() {
  if (!running || mode !== 'fx') return;
  pendingFlash = 1; flashGlow = 1; flashCount++; lastFlashT = T; busyFor = 0;
  AE.flash();
}

/* ---------- the room lights ---------- */
let flashOnArrive = false, filmClear = 0;
function setMode(m, instant) {
  if (m === mode && !instant) return;
  mode = m; tr = instant ? 9 : 0;
  if (m === 'fx') {
    clearAll(false); filmClear = 1; flashOnArrive = !instant; exposeT0 = T + 1; flashCount = 0;
    $('mode').textContent = '◑ 点灯'; $('mode').classList.add('dark'); $('cap').classList.add('on');
    if (!instant) { AE.sw(true); showStatus('人差し指を立てて、空中に描く', 7000); }
  } else {
    for (const h of HANDS) for (const p of h.pens) liftPen(p);
    $('mode').textContent = '◐ 消灯'; $('mode').classList.remove('dark'); $('cap').classList.remove('on');
    if (!instant) setTimeout(() => AE.sw(false), 420);
    showStatus('', 0);
  }
}
/* the change itself: the tungsten bulbs dim through orange to black, a beat of dark, then one flash.
   Back: the picture sinks to black, and the room light comes up from orange to white. */
function lights() {
  if (mode === 'fx') {
    if (tr < 0.75) { const k = tr / 0.75; return { show: 0, cam: Math.pow(1 - k, 2.2), warm: Math.min(1, k * 1.4), fade: 1 }; }
    if (tr < 1.0) return { show: 0, cam: 0, warm: 1, fade: 1 };
    return { show: 1, cam: 0, warm: 0, fade: 1 };
  }
  if (tr < 0.45) return { show: 1, cam: 0, warm: 1, fade: Math.pow(1 - tr / 0.45, 1.5) };
  const k = clamp((tr - 0.45) / 1.15, 0, 1);
  return { show: 0, cam: Math.pow(k, 1.6), warm: 1 - k, fade: 0 };
}

/* ---------- render ---------- */
const penU = new Float32Array(20);
function bindCommon(P) {
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texVid); i1(P, 'uVid', 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texMask); i1(P, 'uMask', 2);
  f1(P, 'uMaskOK', maskOK ? 1 : 0);
  f2(P, 'uVA', VA_[0], VA_[1]); f2(P, 'uVB', VB_[0], VB_[1]); f2(P, 'uWH', W / S, H / S);
  if (P.u.uPen) gl.uniform4fv(P.u.uPen, penU);
}
function fillPens() {
  penU.fill(0);
  const L = livePens();
  for (let i = 0; i < Math.min(5, L.length); i++) { penU[i * 4] = L[i].x; penU[i * 4 + 1] = L[i].y; penU[i * 4 + 2] = 1; }
}
function stepFilm(dt) {
  const P = PR.film, p = PALS[palIdx];
  const src = filmFlip ? filmB : filmA, dst = filmFlip ? filmA : filmB; filmFlip = !filmFlip;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.p); gl.bindVertexArray(VAO);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t); i1(P, 'uPrev', 0);
  bindCommon(P);
  const tau = 0.8 + Math.pow(ghost, 1.3) * 9;
  let decay = Math.exp(-dt / tau);
  if (filmClear > 0) { decay *= Math.exp(-dt * 9); filmClear = Math.max(0, filmClear - dt / 0.6); }
  f1(P, 'uDecay', decay); f1(P, 'uFlash', pendingFlash); f1(P, 'uPenK', dt * 0.8);
  f3(P, 'uPenCol', p.penF); f3(P, 'uFlashCol', p.flashF);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  pendingFlash = 0;
}
function drawLines() {
  const nv = buildLines();
  gl.bindFramebuffer(gl.FRAMEBUFFER, lineT.f); gl.viewport(0, 0, lineT.w, lineT.h);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (nv > 0) {
    const P = PR.line; gl.useProgram(P.p); f2(P, 'uRes', lineT.w, lineT.h);
    gl.bindVertexArray(lineVAO); gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, vbuf, 0, nv * VF);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.drawArrays(gl.TRIANGLES, 0, nv);
    gl.disable(gl.BLEND); gl.bindVertexArray(null);
  }
}
function pass(P, src, dst, setU) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(P.p); gl.bindVertexArray(VAO);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t); i1(P, 'uSrc', 0);
  setU(P); gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function bloom() {
  pass(PR.down, lineT, bA, P => f2(P, 'uTx', 1 / lineT.w, 1 / lineT.h));
  pass(PR.blur, bA, bB, P => f2(P, 'uDir', 1 / bA.w, 0));
  pass(PR.blur, bB, bA, P => f2(P, 'uDir', 0, 1 / bA.h));
  pass(PR.down, bA, cA, P => f2(P, 'uTx', 1.5 / bA.w, 1.5 / bA.h));
  pass(PR.blur, cA, cB, P => f2(P, 'uDir', 1.4 / cA.w, 0));
  pass(PR.blur, cB, cA, P => f2(P, 'uDir', 0, 1.4 / cA.h));
}
function composite(L) {
  const P = PR.comp, p = PALS[palIdx];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cv.width, cv.height); gl.useProgram(P.p); gl.bindVertexArray(VAO);
  bindCommon(P);
  const film = filmFlip ? filmA : filmB;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, film.t); i1(P, 'uFilm', 0);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, lineT.t); i1(P, 'uLine', 3);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, bA.t); i1(P, 'uB1', 4);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, cA.t); i1(P, 'uB2', 5);
  f2(P, 'uRes', cv.width, cv.height); f1(P, 'uT', T); f1(P, 'uSeed', seed);
  f1(P, 'uAmb', 0.03 + (1 - dark) * 0.5); f1(P, 'uFlashGlow', flashGlow);
  f1(P, 'uDuo', p.duo); f1(P, 'uGrain', p.grain);
  f3(P, 'uC0', p.c0F); f3(P, 'uC1', p.c1F); f3(P, 'uC2', p.c2F); f3(P, 'uPenCol', p.penF); f3(P, 'uFlashCol', p.flashF); f3(P, 'uHal', p.halF);
  f1(P, 'uShow', L.show); f1(P, 'uCam', L.cam); f1(P, 'uCamWarm', L.warm); f1(P, 'uFade', L.fade);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- what happens each frame ---------- */
let rotPh = 0, idle = false, capAt = 0;
function logic(dt) {
  if (dt <= 0) return;
  tr += dt;
  if (mode === 'fx' && flashOnArrive && tr >= 1.0) { flashOnArrive = false; exposeT0 = T; fireFlash(); }
  flashGlow *= Math.exp(-dt / 0.07);
  /* moving or still? the cut-out's change, and whether a pen is moving */
  motion += (motionRaw - motion) * clamp(dt * 6, 0, 1);
  const drawing = T - lastDrawT < 0.35;
  const moving = motion > 0.045 || drawing;
  if (moving) { stillFor = 0; busyFor += dt; } else stillFor += dt;
  if (mode === 'fx' && tr > 1.2 && autoFlash) {
    /* you drew or moved, then held a pose: that is when Mili fired */
    if (stillFor > 0.7 && busyFor > 0.5 && T - lastFlashT > 1.6) fireFlash();
    else if (stillFor > 1.2 && T - lastFlashT > 14) fireFlash();
  }
  /* the swish of the torch */
  let sp = 0; for (const pen of livePens()) sp = Math.max(sp, pen.speed || 0);
  AE.swishLevel(mode === 'fx' ? sp : 0);
  /* when nobody draws for a while, the drawing turns slowly so you see it is in the air */
  const wasIdle = idle;
  idle = turnOn && mode === 'fx' && strokes.length > 0 && T - penActive > 2.5;
  if (idle && !wasIdle && Math.abs(rot) < 0.02) {
    let sx = 0, sw = 0; for (const s of strokes) for (let i = 0; i < s.n; i++) { sx += s.p[i * PSTR]; sw++; }
    if (sw) pivX = sx / sw;
  }
  if (idle) rotPh += dt; else if (Math.abs(rot) < 0.02) rotPh = 0;
  const target = idle ? 0.62 * Math.sin(rotPh * Math.PI * 2 / 20) : 0;
  rotV += ((target - rot) * 14 - rotV * 7.5) * dt; rot += rotV * dt;
}
function caption() {
  const p = PALS[palIdx];
  $('capT').textContent = 'Kouga, ' + p.name;
  const e = Math.max(0, T - exposeT0), mm = Math.floor(e / 60), ss = Math.floor(e % 60);
  $('capM').textContent = `${p.jp}　EXP ${String(mm).padStart(2, '0')}′${String(ss).padStart(2, '0')}″　STROBE ×${flashCount}`;
}
let lastUpVT = -1;
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000; let dt = now - lastT; lastT = now; dt = clamp(dt, 0, 0.1);
  if (!running || !PR) return;
  if (TEST.dt) dt = TEST.dt;
  if (TEST.budget != null) { if (TEST.budget <= 0) return; TEST.budget--; }   // test: advance exactly N frames
  T += dt; TEST.frames++;
  updateVideoMap();
  if (vw && video.readyState >= 2 && video.currentTime !== lastUpVT) {
    lastUpVT = video.currentTime;
    gl.bindTexture(gl.TEXTURE_2D, texVid);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch (e) {}
  }
  const clock = TEST.dt ? T * 1000 : nowMs;
  runSeg(clock); runHands(clock);
  logic(dt);
  fillPens();
  if (dt > 0) stepFilm(dt);
  drawLines(); bloom();
  composite(lights());
  if (T - capAt > 0.25) { capAt = T; caption(); }
  if (shotReq) { shotReq = false; saveShot(); }
}

/* ---------- UI ---------- */
let toastTimer = 0, statusTimer = 0;
function toast(s) { toastEl.textContent = s; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1300); }
function showStatus(s, ms) { clearTimeout(statusTimer); if (s) statusEl.textContent = s; statusEl.classList.toggle('off', !s); if (s && ms) statusTimer = setTimeout(() => statusEl.classList.add('off'), ms); }
function applyPal() {
  const p = PALS[palIdx];
  document.body.style.background = p.bg;
  $('pal').textContent = p.name;
  caption();
}
$('pal').onclick = () => { palIdx = (palIdx + 1) % PALS.length; applyPal(); toast(PALS[palIdx].name); };
$('mode').onclick = () => setMode(mode === 'fx' ? 'cam' : 'fx');
$('clear').onclick = () => { if (mode !== 'fx') return; AE.shutter(); clearAll(true); filmClear = 1; };
const panel = $('panel');
$('gear').onclick = () => { panel.hidden = !panel.hidden; $('gear').setAttribute('aria-expanded', String(!panel.hidden)); };
$('panelX').onclick = () => { panel.hidden = true; $('gear').setAttribute('aria-expanded', 'false'); };
const lifeText = () => { const l = lifeSec(); $('oLife').textContent = l === Infinity ? '∞' : Math.round(l) + ' 秒'; };
$('sLife').oninput = e => { lifeSet = +e.target.value; lifeText(); };
$('sThick').oninput = e => { thick = +e.target.value; };
$('sDark').oninput = e => { dark = +e.target.value; };
$('sGhost').oninput = e => { ghost = +e.target.value; };
const tog = (id, on, a, b) => { const el = $(id); el.classList.toggle('on', on); el.textContent = on ? a : b; };
$('bAuto').onclick = () => { autoFlash = !autoFlash; tog('bAuto', autoFlash, '自動ストロボ：入', '自動ストロボ：切'); };
$('bTurn').onclick = () => { turnOn = !turnOn; tog('bTurn', turnOn, '回転：入', '回転：切'); };
$('bFive').onclick = () => { fiveOn = !fiveOn; tog('bFive', fiveOn, '五本の指：入', '五本の指：切'); };
$('bSound').onclick = () => { soundOn = !soundOn; tog('bSound', soundOn, '音：入', '音：切'); if (soundOn) AE.init(); AE.level(); };
const fsBtn = $('bFs');
if (!document.documentElement.requestFullscreen) fsBtn.style.display = 'none';
else fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$('shot').onclick = () => { shotReq = true; };
function saveShot() {
  try {
    cv.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'kouga_' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }, 'image/png');
    toast('saved');
  } catch (e) { toast('保存できませんでした'); }
}
let mr = null, chunks = [];
$('rec').onclick = () => {
  const b = $('rec');
  if (mr && mr.state === 'recording') { mr.stop(); return; }
  AE.init();
  const tracks = [...cv.captureStream(30).getVideoTracks()];
  if (AE.recDest) tracks.push(...AE.recDest.stream.getAudioTracks());
  const ms = new MediaStream(tracks);
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const mt = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  try { mr = new MediaRecorder(ms, mt ? { mimeType: mt, videoBitsPerSecond: 6e6 } : {}); }
  catch (err) { toast('録画を開始できませんでした'); return; }
  chunks = []; mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  mr.onstop = () => {
    b.classList.remove('act'); b.innerHTML = '●<span class="t"> REC</span>';
    const blob = new Blob(chunks, { type: mr.mimeType || 'video/mp4' }); const ext = (mr.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kouga_' + Date.now() + '.' + ext;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  };
  try { mr.start(1000); } catch (err) { toast('録画を開始できませんでした'); return; }
  b.classList.add('act'); b.innerHTML = '■<span class="t"> STOP</span>';
};
addEventListener('keydown', e => {
  if (!running) return; const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); fireFlash(); }
  else if (k === 'c') $('pal').click(); else if (k === 'x') $('clear').click(); else if (k === 's') shotReq = true; else if (k === 'm') $('mode').click();
});
addEventListener('resize', resize);

function camErrText(e) {
  const m = (e && (e.message || e.name)) ? (e.message || e.name) : String(e || 'unknown');
  return 'カメラを起動できませんでした：' + m + '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
}
async function startCam() {
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) throw new Error('getUserMedia is unavailable');
  /* get the new stream first, so a failed flip keeps the old camera running */
  const s2 = await md.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s2; video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  await new Promise(r => { if (video.videoWidth) r(); else { video.onloadedmetadata = () => r(); setTimeout(r, 3000); } });
  mirror = facing === 'user'; lastUpVT = -1; maskOK = false; if (maskF.length) { maskF.fill(0); maskP.fill(0); }
  for (const h of HANDS) loseHand(h);
  updateVideoMap();
}
$('flip').onclick = async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); toast(facing === 'user' ? '前のカメラ' : '後ろのカメラ'); }
  catch (e) { facing = prev; toast('切り替えられませんでした'); console.warn(camErrText(e)); }
};
$('go').onclick = async () => {
  const btn = $('go'); btn.disabled = true; $('err').textContent = 'カメラを起動しています…';
  AE.init();
  try { if (!PR) initGL(); resize(); }
  catch (e) { $('err').textContent = '描画の準備に失敗しました：' + (e && e.message ? e.message.split('\n')[0] : e); console.error(e); btn.disabled = false; return; }
  try { await startCam(); }
  catch (e) { $('err').textContent = camErrText(e); btn.disabled = false; btn.textContent = 'もう一度'; return; }
  $('start').classList.add('hide'); $('ui').classList.add('on'); $('err').textContent = '';
  running = true; T = 0; lastT = performance.now() / 1000; applyPal(); lifeText();
  showStatus('◐ 消灯 を押すと、部屋が暗室になる', 6500);
  if (!handLm && !mpErr) initMP();
};

requestAnimationFrame(frame);
/* test hook (local checks only) */
window.__kouga = {
  TEST,
  state: () => ({ running, mode, tr, maskOK, hands: !!handLm, seg: !!segmenter, mpErr, float: useFloat, T, motion, stillFor, busyFor,
    flashCount, lastFlashT, strokes: strokes.length, pts: ptsTotal, rot, pivX, pal: palIdx,
    handOn: HANDS.map(h => h.on), pens: livePens().map(p => [+p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3)]),
    tips: strokes.map(s => s.n ? [s.p[(s.n - 1) * PSTR], s.p[(s.n - 1) * PSTR + 1]] : null) }),
  setMode: (m, instant) => setMode(m, instant), flash: () => fireFlash(), clear: () => clearAll(false),
  set: o => { if (o.pal != null) { palIdx = o.pal; applyPal(); } if (o.rot != null) { rot = o.rot; rotV = 0; } if (o.turn != null) turnOn = o.turn;
    if (o.auto != null) autoFlash = o.auto; if (o.five != null) fiveOn = o.five; if (o.life != null) lifeSet = o.life; if (o.seed != null) seed = o.seed;
    if (o.pivX != null) pivX = o.pivX; if (o.ghost != null) ghost = o.ghost; if (o.dark != null) dark = o.dark; },
  /* draw a line directly: points [[x, y, z, exposure], ...] in short-side units, as if drawn over `dur` seconds ending now */
  draw: (pts, dur = 1) => { const s = newStroke(); pts.forEach((q, i) => { const keep = T; T = keep - dur + dur * i / Math.max(1, pts.length - 1); pushPt(s, q[0], q[1], q[2] || 0, q[3] != null ? q[3] : 0.6); T = keep; }); lastDrawT = T; penActive = T; return s.n; },
  W: () => [W, H, S],
  s2v: (x, y) => [x / W * VA_[0] + VB_[0], y / H * VA_[1] + VB_[1]],
};
</script>
